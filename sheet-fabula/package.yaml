          think u(%!/FUN`CHECK`READ,%q<cmd_left_side>); @assert cand(gte(words(%q<check_words>),1),lte(words(%q<check_words>),2))=@include %!/INC`CHECK`USAGE; @assert strlen(%q<check_pair>)=@pemit %#=notice(SHEET,'[first(%q<check_bad>)]' is not an attribute. Give [itemize(lcstr(v(DATA`ATTRS)),,or)].,warn); think setq(check_dl,u(%!/API`TARGET,%q<cmd_right_side>)); @assert cor(not(%q<cmd_has_equals>),strlen(%q<check_dl>))=@pemit %#=notice(SHEET,'%q<cmd_right_side>' is not a difficulty. Give trivial%, easy%, standard or normal%, hard%, extreme or very hard%, or a number from 1 to 40.,warn)
        flags: [cmdsyntax]
      # %<json> a check, %<push> what a bond invoke added, %<at> when it was first rolled: keeps it as FABULA`LAST, with
      # check_private and check_support (whose group check it supports), for +check/invoke, +check/bond and
