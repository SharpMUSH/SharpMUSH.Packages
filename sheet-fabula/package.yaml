      # skills, raises and bonuses (FABULA`ATTR`, CLASS`, SKILL`, RAISES and BONUS`) add up from the build, and are rebuilt from
      # them after every change: a die sets an attribute's base, a raise adds a size, and the rest add up, but
      # for martial armour, where the largest counts. Before approval a chargen edit rewrites that kind and key's
      # chargen entry; after it, and for a keeper, each change is an entry of its own.
      # %0 a character, %1 LEDGER (the default), EXPERIENCE or MONEY: their entry numbers there, in order.
      FUN`LEDGER`KEYS:
        value: |-
          sort(iter(lattr(%0/FABULA`[firstof(%1,LEDGER)]`*),if(cand(isint(setr(ledger_key,last(%i0,`))),hasflag(%0/%i0,wizard)),%q<ledger_key>)),n)
        flags: [funsyntax]
      # %0 a character, %1 LEDGER (the default), EXPERIENCE or MONEY: how many entries are there, counted without
      # reading them.
      FUN`LEDGER`COUNT:
        value: |-
          if(strlen(%1),words(lattr(%0/FABULA`%1`*)),sub(words(lattr(%0/FABULA`LEDGER`*)),hasattr(%0,FABULA`LEDGER`NEXT)))
        flags: [funsyntax]
      # %0 a character, %1 an entry's number: where it is, FABULA`LEDGER`, EXPERIENCE` or MONEY`<n>, or nothing.
      FUN`LEDGER`AT:
        value: |-
          cond(not(isint(%1)),,hasflag(%0/FABULA`LEDGER`%1,wizard),FABULA`LEDGER`%1,hasflag(%0/FABULA`EXPERIENCE`%1,wizard),FABULA`EXPERIENCE`%1,hasflag(%0/FABULA`MONEY`%1,wizard),FABULA`MONEY`%1)
        flags: [funsyntax]
      # %0 a character, %1 an entry, %2 a field.
      FUN`LEDGER`GET:
        value: |-
          json_query(get(%0/[u(%!/FUN`LEDGER`AT,%0,%1)]),extract,$.%2)
        flags: [funsyntax]
      # %0 a character, %1 a kind, %2 a key: the chargen entry for them, or nothing.
      FUN`LEDGER`FIND:
        value: |-
          first(iter(u(%!/FUN`LEDGER`KEYS,%0),if(cand(not(comp(u(%!/FUN`LEDGER`GET,%0,%i0,phase),chargen)),not(comp(u(%!/FUN`LEDGER`GET,%0,%i0,kind),%1)),not(comp(u(%!/FUN`LEDGER`GET,%0,%i0,key),%2))),%i0)))
        flags: [funsyntax]
      # %0 kind, %1 key, %2 n, %3 phase, %4 source, %5 by, %6 class, %7 name: one entry.
      FUN`LEDGER`JSON:
        value: |-
          json(object,kind,json(string,%0),key,json(string,%1),n,%2,phase,json(string,%3),source,json(string,%4),by,json(string,%5),at,secs(),class,json(string,%6),name,json(string,%7))
        flags: [funsyntax]
      # %0 a character, %1 an entry's number (nothing for a new one), %2 its JSON, %3 LEDGER (the default),
      # EXPERIENCE or MONEY: writes it and returns the number. All three share the numbers in FABULA`LEDGER`NEXT.
      FUN`LEDGER`WRITE:
        value: |-
          setqm(ledger_at,firstof(%1,default(%0/FABULA`LEDGER`NEXT,1)),ledger_tree,firstof(%3,LEDGER))[u(%!/FUN`DO`ROOT,%0)][if(not(strlen(%1)),attrib_set(%0/FABULA`LEDGER`NEXT,inc(%q<ledger_at>)))][attrib_set(%0/FABULA`%q<ledger_tree>`%q<ledger_at>,%2)][set(%0/FABULA`%q<ledger_tree>`%q<ledger_at>,wizard)]%q<ledger_at>
        flags: [funsyntax]
      # Puts lp_kind and lp_key on lp_who's ledger: lp_to the total wanted (a die's size), lp_now the total now,
      # lp_class and lp_name for a skill, lp_source where it comes from (nothing for the phase's own). Sets lp_entry.
