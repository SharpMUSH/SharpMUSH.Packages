        flags: [funsyntax]

      # ---- writes -----------------------------------------------------------------
      # %<who> an objid, %<leaf> what under FABULA` to write, %<value> what to store; empty clears it. The root is
      # wizard-flagged and no_command the first time, and its leaves take that from it.
      INC`DO`SET:
        value: |-
          @if not(hasattr(%<who>,FABULA))={&FABULA %<who>=This character's JRPG sheet. +sheet shows it.; @set %<who>/FABULA=wizard; @set %<who>/FABULA=no_command}; @if strlen(%<value>)={&FABULA`%<leaf> %<who>=%<value>},{&FABULA`%<leaf> %<who>}
        flags: [cmdsyntax]
      FUN`DO`ROOT:
        value: |-
          if(hasattr(%0,FABULA),,attrib_set(%0/FABULA,This character's JRPG sheet. +sheet shows it.)[set(%0/FABULA,wizard)][set(%0/FABULA,no_command)])
        flags: [funsyntax]

      # ---- the ledger -----------------------------------------------------------------
      # FABULA`LEDGER`<n> is the sheet's build, one JSON entry each: kind (die, raise, class, skill or bonus), key,
      # n, phase (chargen, play or staff), source, by, at, and for a skill class and name. FABULA`EXPERIENCE`<n>
      # and FABULA`MONEY`<n> are the experience and zenit ledgers (kind xp or zenit), kept the same way and
