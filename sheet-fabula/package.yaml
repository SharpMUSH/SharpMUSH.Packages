        flags: [cmdsyntax]
      # The last check, for an invoke: check_last (its JSON), check_push, check_at, check_private, or why not.
      INC`CHECK`LAST:
        value: |-
          think setqm(check_kept,get(%q<viewer_objid>/FABULA`LAST),check_last,json_query(%q<check_kept>,get,check),check_push,firstof(json_query(%q<check_kept>,get,push),0),check_at,json_query(%q<check_kept>,get,at),check_private,strmatch(json_query(%q<check_kept>,get,private),true),check_poss,if(strmatch(json_query(%q<check_kept>,get,private),true),your,poss(%#)),check_support,json_query(%q<check_kept>,extract,$.support)); @assert cand(strlen(%q<check_kept>),lte(sub(secs(),%q<check_at>),get(%!/DATA`CONFIG`WINDOW)))=@pemit %#=notice(SHEET,You have made no check in the last [div(get(%!/DATA`CONFIG`WINDOW),60)] minutes to change.,warn); @assert not(strmatch(json_query(%q<check_last>,extract,$.fumble),true))=@pemit %#=notice(SHEET,A fumble stands: no invoke changes it.,warn)
        flags: [cmdsyntax]
      INC`CHECK`PAY:
        value: |-
          @assert gte(u(%!/API`METER,%q<viewer_objid>,FP),1)=@pemit %#=notice(SHEET,An invoke costs a Fabula Point%, and you have none.,warn); think u(%!/API`ADJUST,%q<viewer_objid>,FP,-1)
        flags: [cmdsyntax]
      # +check/invoke <identity|theme|origin>[=first|second|both]: a Fabula Point to reroll one or both dice of your
      # last check, keeping the new results.
      INC`CHECK`INVOKE:
        value: |-
          @assert member(v(DATA`TRAITS),setr(invoke_trait,ucstr(before(%q<cmd_argument>,=))))=@pemit %#=notice(SHEET,+check/invoke <identity|theme|origin> spends a Fabula Point to reroll your last check. =first or =second rerolls one die.,warn); @assert strlen(setr(invoke_text,get(%q<viewer_objid>/FABULA`TRAIT`%q<invoke_trait>)))=@pemit %#=notice(SHEET,You have no [lcstr(%q<invoke_trait>)] to invoke. +sheet/[lcstr(%q<invoke_trait>)] <text> sets one.,warn); think setq(invoke_which,firstof(lcstr(%q<cmd_right_side>),both)); @assert member(first second both,%q<invoke_which>)=@pemit %#=notice(SHEET,Reroll first%, second or both.,warn); @include %!/INC`CHECK`LAST; @include %!/INC`CHECK`PAY; think setq(check_result,u(%!/API`REROLL,%q<check_last>,%q<invoke_which>,%q<check_push>)); @include/args %!/INC`CHECK`KEEP=json,%q<check_result>,push,%q<check_push>,at,%q<check_at>; @include/args %!/INC`CHECK`TELL=line,%q<check_poss> [lcstr(%q<invoke_trait>)] %(%q<invoke_text>%) to reroll [switch(%q<invoke_which>,both,both dice,the %q<invoke_which> die)]: [u(%!/FUN`DISPLAY`CHECK,%q<check_result>,%q<check_push>)][u(%!/FUN`CHECK`FUMBLE,%q<check_result>)],verb,invoke
        flags: [cmdsyntax]
