  # The +help topics, on an object of their own. sheet-fabula-help registers it with +help; without that bridge nothing
  # reads it. HELP`<TOPIC> is a topic, its subtopics the leaves beneath, LOCK`<TOPIC> who may read it.
  - ref: sheet_help
    type: thing
    name: JRPG Sheet Help
    location: "{{sheet}}"
    attributes:
      HELP: |-
        Your character's JRPG sheet and checks: +sheet and +check.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`SHEET: |-
        check
      SEE`CHECK: |-
        sheet
      HELP`SHEET: |-
        `+sheet` shows your character's sheet: four attributes, Dexterity, Insight, Might and Willpower, each a die from d6 to d12, your classes and skills, HP, MP, IP, Fabula Points, experience, zenit and bonds.

        - `+sheet` shows your own; `+sheet <name>` another character's, when the game lets you read it.
        - `+sheet/set <attribute>=<die>` sets an attribute: `+sheet/set dex=d10`.
        - `+sheet/identity`, `/theme` and `/origin <text>` set your traits.
        - `+sheet/traits` lists the attributes, classes, difficulties, status effects and bond emotions.

        A new character's attributes are d8 d8 d8 d8, d10 d8 d8 d6 or d10 d10 d6 d6, in any order. You set attributes and classes until your character is approved; then staff change them.

        For example:

        `+sheet/set mig=d10`

        Output: `\[SHEET\] Done: Might is d10 on Alice's sheet.`

        See `+help sheet classes`, `+help sheet play`, `+help sheet rewards`, `+help sheet bonds` and `+help check`.
      HELP`SHEET`CLASSES: |-
        Your level is your class levels added up. A new character shares 5 levels among their classes, up to 10 in one, and at most 3 classes may be below level 10 at once.

        - `+sheet/class <class>=<levels>` sets a class's level while you fill in your sheet; 0 takes it off.
        - `+sheet/benefit <class>=hp` or `=mp` picks what a class adds 5 to, for the classes that let you choose: Dancer, Floralist, Invoker, Ace of Cards and Necromancer. You pick once; after approval staff change it.
        - `+sheet/skill <class>:<skill>=<level>` writes down a skill. Each level in a class is one skill level to spend on its skills. 0 takes a skill off.
        - `+sheet/skill heroic:<skill>=1` writes down a heroic skill, one for each class at level 10.
        - `+sheet/levelup <class>` spends 10 experience on one more level in a class, once you are approved.
        - `+sheet/raise <attribute>` makes an attribute one die larger, once at level 20 and once at 40.
        - `+sheet/bonus hp=<n>`, and `mp` and `ip`, adds what your skills give to your maximum HP, MP or IP.

        The classes are those of the Core Rulebook, the High, Techno and Natural Fantasy Atlases and the two bonus classes. The skills' rules are in those books; the sheet keeps their names and levels.

        For example:

        `+sheet/skill guardian:Fortress=2`

        Output: `\[SHEET\] Done: Fortress is skill level 2 in Guardian on Alice's sheet.`
      HELP`SHEET`PLAY: |-
        In play you keep your own resources:

        - `+sheet/hp`, `/mp` and `/ip` run from 0 to your most and start full. At half your HP or less you are in crisis.
        - `+sheet/fp` is your Fabula Points; a character starts with 3.
        - Experience and zenit come from staff and from duties: see `+help sheet rewards`.
        - `+sheet/status <effect>` puts a status effect on you or takes it off: dazed, enraged, poisoned, shaken, slow or weak. Each makes one or two attributes a die smaller, down to d6. `+sheet/status clear` takes them all off.
        - `+sheet/rest` fills your HP and MP and takes off every status effect.

        The resources take `+<n>`, `-<n>`, `<n>`, or `reset`: `+sheet/hp -12`, `+sheet/fp +1`.

        Maximum HP is five times your Might die plus your level, maximum MP five times your Willpower die plus your level, and maximum IP 6. Each class that gives HP or MP adds 5, IP 2.

        Defense is your Dexterity die now, Magic Defense your Insight die now, and Initiative 0. `+sheet/bonus <bonus>=<n> <source>` adds what a skill or a piece of equipment gives, as a ledger entry of its own:

        - `def`, `mdef` and `init` add what your armour, shield and accessory give: `+sheet/bonus init=-1 Heavy boots`.
        - `martial` is martial armour's Defense, which takes the place of your Dexterity die. With more than one, the largest counts.
        - `hp`, `mp` and `ip` add what a skill gives to your maximum HP, MP or IP.

        `+sheet/revoke <entry>` takes equipment off again. See `+help sheet ledger`.

        In an encounter, HP, MP, IP and status effects are the encounter's copy: see `+help encounter`.

        For example:

        `+sheet/status slow`

        Output: `\[SHEET\] Done: Alice is now slow: Dexterity d8.`
      HELP`SHEET`LEDGER: |-
        Your sheet keeps three ledgers. The build ledger holds each attribute die, class level, skill, raise and bonus; the experience ledger and the zenit ledger hold each award and each spending. Every entry says where it came from, and what `+sheet` shows adds up from them.

        - `+sheet/ledger` lists your entries; `+sheet/ledger <name>` another character's, when you may read their sheet. It shows the newest 50 experience and zenit entries; `+sheet/ledger <name>=2` the 50 before them.
        - Until you are approved, changing an attribute, class or skill rewrites its character creation entry, so the ledger stays short.
        - After approval each level-up, raise, new skill level and bonus is an entry of its own.
        - `+sheet/revoke <entry>` takes an entry off. You take off your own equipment bonuses at any time, and any entry until you are approved, as long as the rest still adds up. Staff take off the rest.

        The build ledger holds at most 200 entries, and the experience and zenit ledgers 1000 each.

        For example:

        `+sheet/bonus def=1 Bronze shield`

        Output: `\[SHEET\] Done: Alice gains Defense +1 from Bronze shield, so Defense is 7. Ledger entry 6.`
      HELP`SHEET`REWARDS: |-
        Experience and zenit are on your sheet's ledger. Each award and each spending is an entry with its reason, so anyone who may read your sheet sees where they came from.

        - Staff give experience and zenit with `+sheet/award`, and a duty may give them as its reward. You do not set them yourself.
        - `+sheet/levelup <class>` spends 10 experience on one more level in a class: see `+help sheet classes`.
        - `+sheet/buy <item>=<cost>` spends zenit on something you buy.
        - When what you bought adds to Defense, Magic Defense or Initiative, `+sheet/bonus` puts that on the sheet too: `+sheet/bonus def=1 Bronze shield`.
        - `+sheet/ledger` lists every award and purchase.

        A character starts with no experience and no zenit; staff give a new character's starting zenit.

        For example:

        `+sheet/buy Bronze shield=150`

        Output: `\[SHEET\] Done: Alice buys Bronze shield for 150 zenit and has 350 left. Ledger entry 9. When it adds to Defense, Magic Defense or Initiative, +sheet/bonus <key>=<n> Bronze shield puts that on the sheet.`
      HELP`SHEET`BONDS: |-
        A bond is what your character feels about someone or something, up to six of them.

        - `+sheet/bond <who>=<emotions>` sets one: admiration or inferiority, loyalty or mistrust, affection or hatred, one to three in all, one of each pair at most.
        - `+sheet/bond <who>=` takes it off.

        A bond's strength is how many emotions it holds. `+check/bond` adds it to a check, and in Duties a helper's bond with the roller adds to theirs.

        For example:

        `+sheet/bond Bob=admiration loyalty`

        Output: `\[SHEET\] Done: Alice's bond with Bob: admiration and loyalty (strength 2).`
      HELP`CHECK: |-
        `+check <attribute>+<attribute>` rolls the dice of two attributes, as they are now, where the room sees it. The two can be the same: `+check mig+mig`.

        - `=<difficulty>` adds a Difficulty Level: trivial 5, easy 7, standard or normal 10, hard 13, extreme or very hard 16, or a number.
        - `+<n>` or `-<n>` at the end adds or takes from the total: `+check dex+ins+2=13`.
        - `/private` rolls where only you see it.
        - `+check init` rolls Dexterity + Insight with your Initiative bonus added.

        The total reaching the Difficulty Level is a success. Both dice the same and 6 or more is a critical success; both 1 is a fumble, which fails and gives you a Fabula Point. The high roll is the larger die.

        For example:

        `+check dex+ins=normal`

        Output: `\[SHEET\] Alice rolls Dexterity + Insight: d10\[7\] + d8\[4\] = 11 vs 10: a success, high roll 7 (roll 42)`

        See `+help check invoke` for rerolls and bonds, and `+help check group` for group checks.
      HELP`CHECK`INVOKE: |-
        After a check you may spend Fabula Points on it, for 10 minutes and not on a fumble:

        - `+check/invoke <identity|theme|origin>` rerolls both dice and keeps the new ones. `=first` or `=second` rerolls one. You may invoke again for another point.
        - `+check/bond <bond>` adds that bond's strength to the total, once a check.

        For example:

        `+check/invoke theme`

        Output: `\[SHEET\] Alice invokes her theme (Duty) to reroll both dice: Dexterity + Insight: d10\[6\] + d8\[6\] = 12 vs 13: a critical success, high roll 6 (roll 42 43 44)`
      HELP`CHECK`GROUP: |-
        In a group check one character leads and the others support:

        - `+check/support <leader>=<attribute>+<attribute>` rolls against 10 to help the leader. You may invoke on it like any check.
        - `+check/group <attribute>+<attribute>[=<difficulty>]` is the leader's check. Each supporter who succeeded in the last 10 minutes adds 1, and the strongest bond any of them has with the leader adds its strength.

        A supporter's help counts once: the leader's check uses it up.

        For example:

        `+check/support Alice=ins+wlp`, then Alice types `+check/group dex+ins=hard`

        Output: `\[SHEET\] Alice leads a group check with Bob (+1, +2 for a bond): Dexterity + Insight: d10\[5\] + d8\[4\] + 3 = 12 vs 13: a failure, high roll 5 (roll 44)`
      HELP`SHEET`CREDITS: |-
        This sheet is an independent production by SharpMUSH and is not affiliated with Need Games or Rooster Games. It is published under the Fabula Ultima Third-Party Tabletop License 1.0 \(https://need.games/wp-content/uploads/2024/06/Fabula-Ultima-Third-Party-Tabletop-License-1.0.pdf\). Fabula Ultima is a roleplaying game created by Emanuele Galletto and published by Need Games. Fabula Ultima is © Need Games and Rooster Games.

        This sheet requires the Fabula Ultima Core Rulebook.

        This sheet contains AI-generated content: its softcode, help and messages were written with an AI model.
      LOCK`SHEET`STAFF: |-
        perm^softcode.fabula.admin
      HELP`SHEET`STAFF: |-
        Sheet keepers \(`softcode.fabula.admin`, or the JRPG Sheet Keeper role\) read every sheet and change any character's at any time:

        - `+sheet <name>` shows a character's sheet.
        - `/set`, `/class`, `/skill`, `/levelup`, `/raise`, `/bonus`, `/buy` and `/bond` take `<name>/` first: `+sheet/class Alice/guardian=4`. A keeper's classes may go to the highest level.
        - `+sheet/hp <name>=<n>`, and the other resources, traits and `/status` the same way; `+sheet/rest <name>`.
        - `+sheet/ledger <name>` lists their ledger, and `+sheet/revoke <name>/<entry>` takes any entry off, saying what no longer adds up.
        - `+sheet/award <name>=xp <n> <reason>` gives experience and `=zenit <n> <reason>` zenit; `-<n>` takes some back. The reason is the ledger entry's source, and the character is told.
        - `+sheet/buy <name>/<item>=<cost>` spends their zenit.
        - `+sheet/clear <name>=confirm` takes the build's entries off, so their attributes, classes, skills and bonuses start over and the experience spent on levels comes back, and takes them out of every encounter. Awards and zenit stay.
        - A keeper runs any encounter as its GM: see `+help encounter gm`.

        `@role/assign <player>=fabula-sheet-keeper` makes someone a keeper.
      HELP`ENCOUNTER: |-
        `+encounter` keeps an encounter's own copy of each character's HP, MP, IP and status effects. A fight, a chase or any scene can be one. While you are in the room where it runs, your damage, healing, spent IP and status effects go to the copy, so an encounter that runs for days never changes your sheet, another scene or another encounter.

        - `+encounter` shows the encounter you are in, or the one here.
        - `+encounter/start <title>` starts one in this room, with you as its GM.
        - `+encounter/join \[<n>\]` takes a copy of your HP, MP, IP and status effects into it. A room can hold several encounters: give the number when it does.
        - `+encounter/leave \[<n>\]` drops your copy.
        - `+encounter/use \[<n>\]` picks which of your encounters in this room your commands use; with nothing, the last one you joined.

        You can be in several encounters at once, each with its own copy. Anywhere else your sheet is used. When an encounter ends, your sheet has only what its GM kept. Fabula Points, experience and zenit are always your sheet's. Automated Duties roll on your sheet, never on a copy.

        For example:

        `+encounter/join`

        Output: `\[SHEET\] Alice joins Goblin ambush (#3) with HP 56 of 56, MP 51 of 51, IP 6 of 6 and no status effects.`

        See `+help encounter conflict` and `+help encounter attack` for fights, `+help encounter gm`, `+help encounter foes` and `+help encounter villains` for running one.
      HELP`ENCOUNTER`CONFLICT: |-
        A conflict is an encounter run in turns. The two sides, the characters and the foes, take turns one creature at a time: a character acts, then a foe, then a character, until one side has no turns left and the other takes the rest. A round ends when everyone has acted. An elite foe takes two turns a round, a champion as many as its number.

        - `+encounter/initiative`, before the GM begins, rolls Dexterity + Insight with your Initiative modifier against the foes' best Initiative. On a success the characters act first.
        - `+encounter` shows the battle screen: the round, whose turn it is, the foes, the party and, on your turn, your commands. See `+help encounter screen`.
        - `+encounter/turn` ends your turn after an action other than an attack. `+encounter/guard` guards: resistant to every damage type and +2 to opposed checks until your next turn.

        See `+help encounter attack` for attacks and damage, `+help encounter foes` and `+help encounter villains` for the GM.

        For example:

        `+encounter/initiative`

        Output: `\[SHEET\] Dana rolls Initiative against the foes' best: Dexterity + Insight: d10\[4\] + d8\[3\] - 3 = 4 vs 9: a failure, high roll 4 \(roll 2778\). The foes act first when the GM begins the conflict.`

        `+encounter/guard`

        Output: `\[SHEET\] Finn guards: resistant to every damage type and +2 to opposed checks until their next turn. Round 1: the foes' turn. Bramble Imp A and Bramble Imp B have turns left.`
      HELP`ENCOUNTER`SCREEN: |-
        `+encounter` draws the battle screen:

        - The top window has the GM, whose turn it is, and the battlefield: foes above, the party below on the right.
        - The Foes window has each foe's level, rank and whether it is in crisis. Its GM sees HP and MP bars and Ultima Points instead.
        - The Party window has each member's HP and MP bars, IP, status effects and turn. `>` marks whoever can act now.
        - On your turn a window lists your commands. On the foes' turn the GM gets theirs.

        On the battlefield a character is drawn as their `IMAGE` picture and a foe as its picture. A client that cannot show pictures gets the foe's text art, else the name. Anyone with no picture and no art is their name in brackets. Foes out of the fight leave the battlefield.

        - `+foe/picture <foe>=<address>` gives a foe in the encounter a picture, an https:// address or a site path. Nothing after `=` takes it off.
        - `+foe/art <foe>=<text>` gives it text art, with `%%r` between lines.
        - Staff set both for a bestiary entry with `+config fabula/foes/<key>/picture=<address>` and `/art=<text>`.

        For example:

        `+foe/picture imp b=/assets/foes/imp.png`

        Output: `\[SHEET\] Done: Bramble Imp B has that picture on the battle screen. A client that cannot show pictures draws its name: +foe/art <foe>=<text> gives it art.`
      HELP`ENCOUNTER`ATTACK: |-
        - `+attack <target>=<attribute>+<attribute>\[+<n>\]` rolls against the target's Defense, and `+attack/magic` against its Magic Defense. It is your last check, so `+check/invoke` and `+check/bond` change it. On your side's turn it takes your turn.
        - `+attack/damage <n> \[<type>\]` deals a hit's high roll plus `<n>`: physical, air, bolt, dark, earth, fire, ice, light or poison.
        - At 0 HP you are down. `+encounter/surrender` takes you out of the conflict and gives you Fabula Points.
        - `+sheet/affinity <type>=<vu|rs|im|ab> \[<source>\]` records what makes you vulnerable, resistant or immune to a type, or able to absorb it. `+sheet/revoke` takes it off.

        Vulnerable doubles the damage, resistant halves it, rounded down, immune stops it and absorbent heals it instead. Resistance and vulnerability cancel.

        For example:

        `+attack imp a=dex+mig`

        Output: `\[SHEET\] Dana attacks Bramble Imp A's Defense: Dexterity + Might: d10\[2\] + d10\[8\] = 10 vs 8: a success, high roll 8 \(roll 2581\). A hit: +attack/damage <n> \[<type>\] deals the high roll plus <n>. Round 1: the foes' turn. Bramble Imp A, Bramble Imp B, and Rust Hound have turns left.`

        `+attack/damage 5 fire`

        Output: `\[SHEET\] Dana hits for 13: Bramble Imp A takes 26 fire damage \(vulnerable\) and is in crisis.`

        `+encounter/surrender`

        Output: `\[SHEET\] Finn surrenders and is out of the conflict, gaining 2 Fabula Points \(11 now\). The GM says what it costs them.`
      HELP`ENCOUNTER`FOES: |-
        The GM brings foes in and runs them. Each foe is a copy of a bestiary entry, so what happens to it stays in this encounter.

        - `+foe` lists the bestiary, and `+foe <foe>` shows one with its numbers worked out; in an encounter you run, with that foe's HP, MP, defences and status effects.
        - `+encounter/foe \[<count>\] <foe>` brings foes in. Several of one foe are A, B, C.
        - `+encounter/begin` starts round 1 with the side `+encounter/initiative` chose, or the characters. `+encounter/begin characters` or `foes` names the side.
        - `+foe/attack <foe>=<target>\[/<attack>\]` rolls one of its attacks, the first unless you name or number one, and deals the damage on a hit.
        - `+foe/hp <foe>=-<n>`, `/mp` and `/status <foe>=<effect>` change a foe's copy; `/status` with an effect it has takes it off, `=clear` all of them. `+foe/remove <foe>` takes it out.
        - `+encounter/damage <who>=<n> \[<type>\]` deals damage by hand, after affinities.
        - `+encounter/turn <who>` and `/guard <who>` act for anyone, `+encounter/undo <who>` gives a turn back and `+encounter/round` starts the next round.
        - `+foe/picture` and `+foe/art` set what the battle screen draws for a foe: see `+help encounter screen`.

        For example:

        `+encounter/foe 2 bramble-imp`

        Output: `\[SHEET\] Eli brings Bramble Imp A and Bramble Imp B into Hedge fight \(#10\).`

        `+foe/attack hound=finn`

        Output: `\[SHEET\] Rust Hound uses Bite on Finn's Defense: Dexterity + Might: d10\[10\] + d8\[7\] + 1 = 18 vs 8: a success, high roll 10 \(roll 2582\). Finn takes 15 physical damage \(HP 25 of 40\). Round 1: the characters' turn. Finn has a turn left.`
      HELP`ENCOUNTER`VILLAINS: |-
        - A villain has Ultima Points: 5 for a minor one, 10 major, 15 supreme. `+foe/ultima <foe>=escape` leaves the scene, `=recover` \(an action\) takes every status effect off and gives 50 MP back, and `=invoke` pays for an invoke. `+encounter/end` tells the GM how many were spent.
        - `+encounter/entrance <foe>` gives each character still in a Fabula Point when a villain makes an entrance, once.
        - A sheet keeper gives every member experience or zenit with `+encounter/reward <xp|zenit> <n> <reason>`.
        - Staff add foes with `+config/add fabula/foes/<key>=<name>` and set their fields with `+config fabula/foes/<key>/<field>=<value>`; `+config fabula/foes/<key>` lists the fields.

        For example:

        `+encounter/entrance witch`

        Output: `\[SHEET\] Thorn Witch makes an entrance! Dana gains a Fabula Point.`

        `+foe/ultima witch=escape`

        Output: `\[SHEET\] Thorn Witch spends an Ultima Point and escapes the scene, and has 2 left.`

        `+encounter/reward xp 10 Hedge cleared`

        Output: `\[SHEET\] Dana and Finn each gain 10 experience for Hedge cleared.`
      HELP`ENCOUNTER`GM: |-
        The GM of an encounter, its starter or a sheet keeper, runs it:

        - A sheet keeper brings a character in with `+encounter/add <name>\[=<n>\]`, with a copy of their HP, MP, IP and status effects. Everyone else joins with `+encounter/join`.
        - `+encounter/remove <name>\[=<n>\]` takes them out; their copy goes.
        - `+sheet/hp <name>=-<n>`, and `/mp`, `/ip`, `/status` and `/rest`, change a member's copy while that encounter is the one they use.
        - `+encounter/keep <name>\[=<n>\]` writes a member's copy onto their sheet. They stay in.
        - `+encounter/end \[<n>\]` ends it. Every copy goes, and the sheets keep only what was kept.

        For example:

        `+encounter/keep Alice`

        Output: `\[SHEET\] Alice's sheet keeps what Goblin ambush (#3) left: HP 41 of 56, MP 51 of 51, IP 6 of 6 and slow.`
      LOCK`SHEET`SETTINGS: |-
        perm^config.admin
      HELP`SHEET`SETTINGS: |-
        `+config fabula` lists the settings and `+config fabula/<setting>=<value>` changes one \(`config.admin`\):

        - `start`: the levels a new character shares among classes \(5\).
        - `maxlevel`: the highest level \(50\).
        - `spreads`: the starting attribute dice, sets of four separated by `|`.
        - `dls`: the Difficulty Levels of trivial, easy, standard, hard and extreme \(`5 7 10 13 16`\).
        - `window`: seconds after a check that invokes may change it \(600\).
        - `public`: whether anyone may read anyone's sheet \(no\).
        - `classes`: the class list, with what each class's first level gives. `+config/add fabula/classes/floralist=Floralist` adds one.
        - `surrender`: the Fabula Points a character gains for surrendering \(2\).
        - `foes`: the bestiary. `+config/add fabula/foes/<key>=<name>` adds a foe.
