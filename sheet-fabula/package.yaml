  - ref: encounters
    type: thing
    name: JRPG Encounters
    location: "{{sheet}}"
    flags: [no_command]
    attributes:
      ENC: |-
        The encounters: ENC`<n> a title, with ROOM, GM, AT, MEMBERS and each member's COPY`<number> beneath, and the conflict: its FOE`<k> copies, FOES, ROUND, FIRST, SIDE, TAKEN, GUARD, OUT and UPSPENT.
      ROOM: |-
