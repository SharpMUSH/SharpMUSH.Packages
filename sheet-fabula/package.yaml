        value: |-
          @assert cand(%q<cmd_has_equals>,strlen(%q<cmd_left_side>),strlen(%q<cmd_right_side>))=@pemit %#=notice(SHEET,+check/support <leader>=<attribute>+<attribute> rolls against [v(DATA`SUPPORT`DL)] to help the leader's next +check/group.,warn); @include %!/INC`CHECK`SUPPORT`READ; think setq(check_result,uargs(%!/API`CHECK,roller,%q<viewer_objid>,trait,%q<check_pair>,modifier,%q<check_modifier>,target,v(DATA`SUPPORT`DL))); @assert not(strmatch(%q<check_result>,#-*))=@pemit %#=notice(SHEET,%q<check_result>,error); think setqm(check_private,0,check_support,%q<support_leader>); @include/args %!/INC`CHECK`KEEP=json,%q<check_result>,push,0,at,secs(); @include/args %!/INC`DO`SET=who,%q<support_leader>,leaf,SUPPORTS,value,setunion(get(%q<support_leader>/FABULA`SUPPORTS),%q<viewer_objid>); @include/args %!/INC`CHECK`TELL=line,to support [name(%q<support_leader>)]: [u(%!/FUN`DISPLAY`CHECK,%q<check_result>)][u(%!/FUN`CHECK`FUMBLE,%q<check_result>)],verb,roll
        flags: [cmdsyntax]
      # Finds the leader, support_leader, and reads the attribute pair, refusing yourself, no such player, or what
      # cannot be rolled.
