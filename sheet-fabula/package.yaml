      INC`CHECK`BOND:
        value: |-
          @assert strlen(%q<cmd_argument>)=@pemit %#=notice(SHEET,+check/bond <bond> spends a Fabula Point to add that bond's strength to your last check.,warn); @assert strlen(setr(bond_key,u(%!/FUN`BOND`FIND,%q<viewer_objid>,%q<cmd_argument>)))=@pemit %#=notice(SHEET,You have no bond with '%q<cmd_argument>'.,warn); @include %!/INC`CHECK`LAST; @assert not(%q<check_push>)=@pemit %#=notice(SHEET,You have invoked a bond on that check already.,warn); think setq(bond_strength,u(%!/FUN`BOND`STRENGTH,%q<viewer_objid>,%q<bond_key>)); @include %!/INC`CHECK`PAY; think setq(check_result,u(%!/API`PUSH,%q<check_last>,%q<bond_strength>)); @include/args %!/INC`CHECK`KEEP=json,%q<check_result>,push,%q<bond_strength>,at,%q<check_at>; @include/args %!/INC`CHECK`TELL=line,%q<check_poss> bond with [get(%q<viewer_objid>/FABULA`BOND`%q<bond_key>)] for +%q<bond_strength>: [u(%!/FUN`DISPLAY`CHECK,%q<check_result>,%q<bond_strength>)],verb,invoke
        flags: [cmdsyntax]
