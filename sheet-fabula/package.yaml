        value: |-
          think setq(support_leader,u(%!/FUN`PLAYER`MATCH,%q<cmd_left_side>)); @assert strlen(%q<support_leader>)=@pemit %#=notice(SHEET,There is no player called '%q<cmd_left_side>'.,warn); @assert comp(%q<support_leader>,%q<viewer_objid>)=@pemit %#=notice(SHEET,You lead your own group check with +check/group.,warn); think u(%!/FUN`CHECK`READ,%q<cmd_right_side>); @assert cand(gte(words(%q<check_words>),1),lte(words(%q<check_words>),2))=@pemit %#=notice(SHEET,+check/support <leader>=<attribute>+<attribute>%, such as +check/support Alice=dex+ins.,warn); @assert strlen(%q<check_pair>)=@pemit %#=notice(SHEET,'[first(%q<check_bad>)]' is not an attribute. Give [itemize(lcstr(v(DATA`ATTRS)),,or)].,warn)
        flags: [cmdsyntax]
      # +check/group <attribute>+<attribute>[+<n>][=<difficulty>]: your check as a group's leader. Each supporter
      # whose support check succeeded in the last few minutes adds 1, and the strongest bond any of them has with
      # you adds its strength. The supports are used up.
      INC`CHECK`GROUP:
        value: |-
          @assert strlen(%q<cmd_argument>)=@pemit %#=notice(SHEET,+check/group <attribute>+<attribute>%[=<difficulty>%] rolls as the leader of a group check: each supporter who succeeded adds 1%, and the strongest bond of theirs with you adds its strength.,warn); @include %!/INC`CHECK`GROUP`READ; think setqm(group_leader,%q<viewer_objid>,group_helpers,u(%!/FUN`GROUP`HELPERS,%q<viewer_objid>),group_bond,u(%!/FUN`GROUP`BOND,%q<group_helpers>,%q<viewer_objid>),check_result,uargs(%!/API`CHECK,roller,%q<viewer_objid>,trait,%q<check_pair>,modifier,add(%q<check_modifier>,words(%q<group_helpers>),%q<group_bond>),target,%q<check_dl>)); @assert not(strmatch(%q<check_result>,#-*))=@pemit %#=notice(SHEET,%q<check_result>,error); @include/args %!/INC`DO`SET=who,%q<viewer_objid>,leaf,SUPPORTS,value,; think setqm(check_private,0,check_support,); @include/args %!/INC`CHECK`KEEP=json,%q<check_result>,push,0,at,secs(); @include/args %!/INC`CHECK`TELL=line,a group check [if(words(%q<group_helpers>),with [itemize(iter(%q<group_helpers>,name(%i0),%b,|),|)] %(+[words(%q<group_helpers>)][if(%q<group_bond>,%, +%q<group_bond> for a bond)]%),with no support)]: [u(%!/FUN`DISPLAY`CHECK,%q<check_result>)][u(%!/FUN`CHECK`FUMBLE,%q<check_result>)],verb,lead
        flags: [cmdsyntax]
      # Reads the attribute pair, modifier and difficulty, and refuses what cannot be rolled.
      INC`CHECK`GROUP`READ:
        value: |-
          think u(%!/FUN`CHECK`READ,%q<cmd_left_side>); @assert cand(gte(words(%q<check_words>),1),lte(words(%q<check_words>),2))=@include %!/INC`CHECK`USAGE; @assert strlen(%q<check_pair>)=@pemit %#=notice(SHEET,'[first(%q<check_bad>)]' is not an attribute. Give [itemize(lcstr(v(DATA`ATTRS)),,or)].,warn); think setq(check_dl,u(%!/API`TARGET,%q<cmd_right_side>)); @assert cor(not(%q<cmd_has_equals>),strlen(%q<check_dl>))=@pemit %#=notice(SHEET,'%q<cmd_right_side>' is not a difficulty. Give trivial%, easy%, standard or normal%, hard%, extreme or very hard%, or a number from 1 to 40.,warn)
        flags: [cmdsyntax]
      # %0 the leader: the supporters whose support check for them succeeded within the window, and is still their
      # last check.
      FUN`GROUP`HELPERS:
        value: |-
          setq(group_leader,%0)[filter(%!/FUN`GROUP`HELPED,get(%0/FABULA`SUPPORTS))]
        flags: [funsyntax]
      FUN`GROUP`HELPED:
        value: |-
          setq(helped_last,get(%0/FABULA`LAST))[cand(strlen(%q<helped_last>),not(comp(json_query(%q<helped_last>,extract,$.support),%q<group_leader>)),lte(sub(secs(),json_query(%q<helped_last>,extract,$.at)),get(%!/DATA`CONFIG`WINDOW)),t(match(success crit-success,json_query(%q<helped_last>,extract,$.check.tier))))]
        flags: [funsyntax]
      # %0 the supporters, %1 the leader: the strength of the strongest bond any supporter has with the leader.
      FUN`GROUP`BOND:
        value: |-
          setq(group_for,%1)[lmax(0 [iter(%0,u(%!/API`BOND,%i0,%q<group_for>))])]
        flags: [funsyntax]
      # %0 the check as typed, before any =: check_words (the attributes typed), check_modifier (the numbers added,
      # 0 when none), check_pair (the attributes as DEX+INS, or nothing) and check_bad (words that are not one).
      # init or initiative stands for Dexterity + Insight with the Initiative bonus added.
      FUN`CHECK`READ:
        value: |-
          setqm(check_typed,edit(%0,-,+-),
          check_init,t(match(init initiative,lcstr(trim(first(%q<check_typed>,+))))),
          check_parts,if(%q<check_init>,DEX+INS+[u(%!/API`DEFENSE,%q<viewer_objid>,INIT)][if(strmatch(%q<check_typed>,*+*),+[rest(%q<check_typed>,+)])],%q<check_typed>),
          check_words,squish(iter(%q<check_parts>,if(not(isint(trim(%i0))),trim(%i0)),+,%b)),
          check_modifier,add(0,ladd(iter(%q<check_parts>,if(isint(trim(%i0)),trim(%i0)),+,%b))),
          check_keys,iter(%q<check_words>,u(%!/FUN`ATTR`FIND,%i0)),
