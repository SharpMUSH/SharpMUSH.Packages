          @assert %q<cmd_has_equals>=@pemit %#=notice(SHEET,+sheet/affinity <type>=<vu|rs|im|ab> %[<source>%] records what makes you vulnerable%, resistant or immune to a damage type%, or able to absorb it. +sheet/revoke <entry> takes one off.,warn); @include/args %!/INC`NEED`WHO=text,%q<cmd_left_side>; @include %!/INC`SHEET`AFFINITY`READ; think setqm(lp_who,%q<sheet_who>,lp_kind,affinity,lp_key,[ucstr(%q<aff_type>)]`[ucstr(%q<aff_code>)],lp_to,1,lp_now,0,lp_class,,lp_name,,lp_source,firstof(%q<aff_source>,equipment)); @include %!/INC`LEDGER`PUT; @pemit %#=notice(SHEET,[name(%q<sheet_who>)] is [v(DATA`AFFINITY`[ucstr(%q<aff_code>)])] to %q<aff_type> from %q<lp_source>. Ledger entry %q<lp_entry>.[if(comp(u(%!/FUN`AFF`OF,%q<sheet_who>,%q<aff_type>),%q<aff_code>),%bWith the rest of the ledger [subj(%q<sheet_who>)] [if(strlen(setr(aff_now,u(%!/FUN`AFF`OF,%q<sheet_who>,%q<aff_type>))),is [v(DATA`AFFINITY`%q<aff_now>)] to it,takes it as it comes)].)],ok)
        flags: [cmdsyntax]
      # Reads the damage type, affinity and source, and refuses an unknown type or affinity or a bad source.
      INC`SHEET`AFFINITY`READ:
        value: |-
          think setqm(aff_type,lcstr(%q<sheet_what>),aff_code,lcstr(first(%q<cmd_right_side>)),aff_source,trim(rest(%q<cmd_right_side>))); @assert member(v(DATA`DAMAGE),%q<aff_type>)=@pemit %#=notice(SHEET,There is no damage type '%q<sheet_what>'. Give [itemize(v(DATA`DAMAGE),,or)].,warn); @assert member(v(DATA`AFFINITIES),%q<aff_code>)=@pemit %#=notice(SHEET,An affinity is vu %(vulnerable%)%, rs %(resistant%)%, im %(immune%) or ab %(absorbent%).,warn); @assert cand(lte(strlen(%q<aff_source>),40),not(strmatch(%q<aff_source>,*|*)),not(strmatch(%q<aff_source>,*^*)))=@pemit %#=notice(SHEET,Name where it comes from in 40 characters or fewer.,warn)
        flags: [cmdsyntax]

      # ---- conflict screens ----
      FUN`SCREEN`BESTIARY:
        value: |-
          setq(list_foes,u(%!/FUN`FOE`ALL))[box([if(words(%q<list_foes>),ldatatable(lit({"rule":""}),Key|Foe|>Level|Rank|Species,iter(%q<list_foes>,[lcstr(%i0)]|[get({{store}}/FOE`%i0)]|[u(%!/FUN`FOE`LEVEL,%i0)]|[u(%!/FUN`FOE`RANKWORD,%i0)]|[lcstr(default({{store}}/FOE`%i0`SPECIES,monster))],%b,%*<^>),%*<^>),tone(muted,The bestiary is empty.))]%r[rule()]%r[tone(muted,+foe <foe> shows one. A GM brings them into an encounter with +encounter/foe %[<count>%] <foe>. Staff add foes with +config/add fabula/foes/<key>=<name>.)],JRPG bestiary)]
        flags: [funsyntax]
      # %0 a bestiary key: the foe with its numbers worked out for its level and rank.
      FUN`SCREEN`FOE:
        value: |-
          [u(%!/FUN`FOE`STATS,%0)][box([lfields(lit({"cols":3}),Level%*<|>Rank%*<|>Species%*<|>HP%*<|>MP%*<|>Initiative%*<|>Defense%*<|>Magic Defense%*<|>Ultima Points,%q<foe_level>%*<|>[u(%!/FUN`FOE`RANKWORD,%0)]%*<|>[lcstr(default({{store}}/FOE`%0`SPECIES,monster))]%*<|>%q<foe_hp>%*<|>%q<foe_mp>%*<|>%q<foe_init>%*<|>[add(%q<foe_dex>,%q<foe_def>)]%*<|>[add(%q<foe_ins>,%q<foe_mdef>)]%*<|>[if(%q<foe_up>,%q<foe_up>,-)],%*<|>)]%r[rule(Attributes)]%r[ldatatable(lit({"rule":""}),Dexterity|Insight|Might|Willpower,d%q<foe_dex>|d%q<foe_ins>|d%q<foe_mig>|d%q<foe_wlp>,^)]%r[rule(Affinities)]%r[firstof(itemize(iter(lcstr(get({{store}}/FOE`%0`AFFINITIES)),[v(DATA`AFFINITY`[after(%i0,:)])] to [before(%i0,:)],%b,|),|),tone(muted,None.))][if(words(get({{store}}/FOE`%0`IMMUNE)),%rNever [itemize(lcstr(get({{store}}/FOE`%0`IMMUNE)),,or)].)]%r[rule(Attacks)]%r[u(%!/FUN`SCREEN`ATTACKS,get({{store}}/FOE`%0`ATTACKS),%q<foe_level>)][if(strlen(get({{store}}/FOE`%0`NOTES)),%r[rule()]%r[get({{store}}/FOE`%0`NOTES)])],[get({{store}}/FOE`%0)])]
        flags: [funsyntax]
      # %0 attacks, %1 the level: each with its check and damage, the level's bonuses added.
      FUN`SCREEN`ATTACKS:
        value: |-
          if(strlen(trim(%0)),[setq(attacks_level,%1)][ldatatable(lit({"rule":""}),Attack|Check|Damage|Against,iter(%0,[u(%!/FUN`ATTACK`READ,%i0)]%q<atk_name>|[lcstr(%q<atk_pair>)] [u(%!/FUN`SIGNED,add(%q<atk_acc>,div(%q<attacks_level>,10)))]|HR + [add(%q<atk_dmg>,mul(5,div(%q<attacks_level>,20)))] %q<atk_type>|[if(%q<atk_magic>,Magic Defense,Defense)],;,%*<^>),%*<^>)],tone(muted,No attacks.))
        flags: [funsyntax]
      # %0 n, %1 a foe's number: one line on where it stands in that encounter, for its GM.
      FUN`FOE`LIVE:
        value: |-
          setq(live_at,ENC`%0`FOE`%1)[notice(SHEET,In [u(%!/FUN`ENC`TITLE,%0)]%, [get({{encounters}}/%q<live_at>)] has HP [default({{encounters}}/%q<live_at>`HP,0)] of [get({{encounters}}/%q<live_at>`HPMAX)]%, MP [default({{encounters}}/%q<live_at>`MP,0)] of [get({{encounters}}/%q<live_at>`MPMAX)]%, Defense [u(%!/FUN`FIGHT`DEFENSE,%0,F%1,DEF)]%, Magic Defense [u(%!/FUN`FIGHT`DEFENSE,%0,F%1,MDEF)][if(member(v(DATA`VILLAINS),get({{encounters}}/%q<live_at>`VILLAIN)),%, [default({{encounters}}/%q<live_at>`UP,0)] Ultima Points)] and [firstof(itemize(get({{encounters}}/%q<live_at>`STATUS)),no status effects)]. Its turn: [u(%!/FUN`FIGHT`TURNTEXT,%0,F%1)].)]
        flags: [funsyntax]

      # ---- lists ------------------------------------------------------------------
      # %0 a list on the store (CLASS): its keys, in order then by key.
      FUN`LIST`ALL:
        value: |-
          setq(list_path,%0)[sortkey(%!/FUN`LIST`SORTKEY,iter(lattr({{store}}/%0`*),after(%i0,`)))]
        flags: [funsyntax]
      FUN`LIST`SORTKEY:
        value: |-
          rjust(default({{store}}/%q<list_path>`%0`ORDER,50),3,0)%0
        flags: [funsyntax]
      FUN`LIST`LABEL:
        value: |-
          firstof(get({{store}}/%0`%1),lcstr(%1))
        flags: [funsyntax]
      # %0 a list, %1 typed text: the key it names, by key, by label, or by the start of one, or nothing.
      FUN`LIST`FIND:
        value: |-
          setqm(find_typed,trim(%1),
          find_all,u(%!/FUN`LIST`ALL,%0),
          find_exact,iter(%q<find_all>,if(cor(not(comp(%i0,ucstr(%q<find_typed>))),not(comp(lcstr(get({{store}}/%0`%i0)),lcstr(%q<find_typed>)))),%i0)),
          find_start,iter(%q<find_all>,if(cor(not(comp(left(%i0,strlen(%q<find_typed>)),ucstr(%q<find_typed>))),not(comp(lcstr(left(get({{store}}/%0`%i0),strlen(%q<find_typed>))),lcstr(%q<find_typed>)))),%i0)))[if(strlen(%q<find_typed>),first(firstof(%q<find_exact>,if(eq(words(%q<find_start>),1),%q<find_start>))))]
        flags: [funsyntax]
      # %0 a name as typed: its key, the letters, digits and hyphens of it.
      FUN`KEY:
        value: |-
          left(ucstr(edit(squish(regeditall(%0,\[^A-Za-z0-9 -\],)),%b,-)),20)
        flags: [funsyntax]

      # ---- attributes ---------------------------------------------------------------
      # %0 typed text: DEX, INS, MIG or WLP, by key or by the start of its name, or nothing.
      FUN`ATTR`FIND:
        value: |-
          if(regmatch(%0,^\[A-Za-z\]+$),first(iter(v(DATA`ATTRS),if(cor(not(comp(%i0,ucstr(%0))),not(comp(left(ucstr(v(DATA`ATTR`%i0)),strlen(%0)),ucstr(%0)))),%i0))))
        flags: [funsyntax]
      # %0 one or two attribute keys: the pair as DEX+INS, in sheet order; one key is rolled twice.
      FUN`PAIR`KEY:
        value: |-
          setq(pair_keys,if(eq(words(%0),1),%0 %0,%0))[edit(sortkey(%!/FUN`PAIR`ORDER,%q<pair_keys>,n),%b,+)]
        flags: [funsyntax]
      FUN`PAIR`ORDER:
        value: |-
          member(v(DATA`ATTRS),%0)
        flags: [funsyntax]
      # %0 a character, %1 an attribute: its base die size, 8 when not set.
      FUN`ATTR`BASE:
        value: |-
          default(%0/FABULA`ATTR`%1,8)
        flags: [funsyntax]
      # %0 a character, %1 an attribute: its die size now, one smaller for each status effect on it, d6 at least.
      FUN`ATTR`NOW:
        value: |-
          setq(attr_for,%1)[max(6,sub(u(%!/FUN`ATTR`BASE,%0,%1),mul(2,words(filter(%!/FUN`STATUS`HITS,get([u(%!/FUN`STATE`AT,%0)]`STATUS))))))]
        flags: [funsyntax]
      FUN`STATUS`HITS:
        value: |-
          t(member(v(DATA`STATUS`[ucstr(%0)]),%q<attr_for>))
        flags: [funsyntax]
      # %0 a die size as typed, d10 or 10: the number.
      FUN`SIZE`READ:
        value: |-
          if(strmatch(%0,d*),after(lcstr(%0),d),%0)
        flags: [funsyntax]
      # %0 a character: 1 when their four base dice are one of the starting spreads.
      FUN`SPREAD`OK:
        value: |-
          setq(spread_have,revwords(sort(iter(v(DATA`ATTRS),u(%!/FUN`ATTR`BASE,%0,%i0)),n)))[t(words(iter(get(%!/DATA`CONFIG`SPREADS),if(not(comp(revwords(sort(%i0,n)),%q<spread_have>)),x),|,%b)))]
        flags: [funsyntax]
      FUN`SPREAD`WARN:
        value: |-
          tone(muted,A new character's attributes are [itemize(iter(get(%!/DATA`CONFIG`SPREADS),iter(revwords(sort(%i0,n)),d%i0),|,|),|,or)]%, in any order.)
        flags: [funsyntax]
      # %0 a character: raises left, one at each of levels 20 and 40 reached, less those taken.
      FUN`RAISES`LEFT:
        value: |-
          sub(words(filter(%!/FUN`RAISES`REACHED,v(DATA`RAISE`LEVELS),,,u(%!/API`LEVEL,%0))),default(%0/FABULA`RAISES,0))
        flags: [funsyntax]
      FUN`RAISES`REACHED:
        value: |-
          gte(%1,%0)
        flags: [funsyntax]

      # ---- classes and skills --------------------------------------------------------
      # %0 a character: the classes they have levels in, in list order.
      FUN`CLASS`MINE:
        value: |-
          setq(class_of,%0)[trim([filter(%!/FUN`CLASS`HAS,u(%!/FUN`LIST`ALL,CLASS))] [iter(lattr(%0/FABULA`CLASS`*),if(not(hasattr({{store}},CLASS`[after(%i0,FABULA`CLASS`)])),after(%i0,FABULA`CLASS`)))])]
        flags: [funsyntax]
      FUN`CLASS`HAS:
        value: |-
          t(get(%q<class_of>/FABULA`CLASS`%0))
        flags: [funsyntax]
      FUN`CLASS`LEVEL:
        value: |-
          default(%0/FABULA`CLASS`%1,0)
        flags: [funsyntax]
      FUN`CLASS`LABEL:
        value: |-
          if(strmatch(%0,HEROIC),heroic skills,u(%!/FUN`LIST`LABEL,CLASS,%0))
        flags: [funsyntax]
      # %0 a character: how many of their classes are at level 10.
      FUN`CLASS`MASTERED:
        value: |-
          words(iter(lattr(%0/FABULA`CLASS`*),if(gte(get(%0/%i0),10),x)))
        flags: [funsyntax]
      # %0 a character, %1 a class key: how many of their other classes are below level 10.
      FUN`CLASS`UNMASTERED:
        value: |-
          setq(open_except,%1)[words(iter(lattr(%0/FABULA`CLASS`*),if(cand(comp(after(%i0,FABULA`CLASS`),%q<open_except>),u(%!/FUN`CLASS`OPEN,get(%0/%i0))),x)))]
        flags: [funsyntax]
      # %0 a class level: 1 when it is 1 to 9, a class not yet mastered.
      FUN`CLASS`OPEN:
        value: |-
          cand(gt(%0,0),lt(%0,10))
        flags: [funsyntax]
      # The keys of the classes whose first level gives +5 HP or MP, the player's pick.
      FUN`CLASS`EITHER:
        value: |-
          iter(u(%!/FUN`LIST`ALL,CLASS),if(strmatch(get({{store}}/CLASS`%i0`BENEFIT),either),%i0))
        flags: [funsyntax]
      # %0 a character, %1 hp, mp or ip: how many of their classes give that resource.
      FUN`CLASS`BENEFITS:
        value: |-
          words(iter(lattr(%0/FABULA`CLASS`*),if(cor(strmatch(setr(benefits_of,get({{store}}/CLASS`[after(%i0,FABULA`CLASS`)]`BENEFIT)),%1),cand(match(hp mp,%1),strmatch(%q<benefits_of>,either),eq(default(%0/FABULA`BENEFIT`[after(%i0,FABULA`CLASS`)],0),extract(1 3,match(hp mp,%1),1)))),x)))
        flags: [funsyntax]
      # %0 a class key, %1 a character or nothing: what its first level gives, "+5 HP, armour, shields". For a
      # class that gives +5 HP or MP, the character's pick when there is one.
      FUN`CLASS`GIVES:
        value: |-
          setqm(gives_benefit,get({{store}}/CLASS`%0`BENEFIT),gives_martial,get({{store}}/CLASS`%0`MARTIAL),gives_pick,if(strlen(%1),default(%1/FABULA`BENEFIT`%0,0),0))[itemize(trim(squish([switch(%q<gives_benefit>,hp,+5 HP,mp,+5 MP,ip,+2 IP,either,switch(%q<gives_pick>,1,+5 HP,3,+5 MP,+5 HP or MP))]|[iter(%q<gives_martial>,switch(%i0,melee,martial melee weapons,ranged,martial ranged weapons,armour,martial armour,shields,martial shields,%i0),%b,|)]|[if(get({{store}}/CLASS`%0`RITUALS),rituals)],|),|),|)]
        flags: [funsyntax]
      # %0 a character: their skills' keys, by name.
      FUN`SKILL`ALL:
        value: |-
          setq(skill_of,%0)[sortkey(%!/FUN`SKILL`SORTKEY,iter(lattr(%0/FABULA`SKILL`*),last(%i0,`)))]
        flags: [funsyntax]
      FUN`SKILL`SORTKEY:
        value: |-
          get(%q<skill_of>/FABULA`SKILL`%0)
        flags: [funsyntax]
      # %0 a character, %1 a class key (or HEROIC): the skill levels spent in it.
      FUN`SKILL`USED:
        value: |-
          add(0,ladd(iter(lattr(%0/FABULA`SKILL`*),if(not(comp(get(%0/%i0`CLASS),%1)),get(%0/%i0`LEVEL)))))
        flags: [funsyntax]
      # %0 a character, %1 a class key: "Fortress 2, Defensive Mastery 1".
      FUN`SKILL`LINE:
        value: |-
          setq(line_class,%1)[itemize(iter(filter(%!/FUN`SKILL`IN,u(%!/FUN`SKILL`ALL,%0)),[get(%0/FABULA`SKILL`%i0)][if(strmatch(%q<line_class>,HEROIC),,%b[get(%0/FABULA`SKILL`%i0`LEVEL)])],%b,|),|)]
        flags: [funsyntax]
      FUN`SKILL`IN:
        value: |-
          not(comp(get(%q<skill_of>/FABULA`SKILL`%0`CLASS),%q<line_class>))
        flags: [funsyntax]

      # ---- bonds and status -------------------------------------------------------------
      FUN`BOND`ALL:
        value: |-
          sort(iter(lattr(%0/FABULA`BOND`*),last(%i0,`)))
        flags: [funsyntax]
      # %0 a character, %1 typed text: the bond it names, by key, by name, or by the start of one, or nothing.
      FUN`BOND`FIND:
        value: |-
          setqm(find_typed,trim(%1),
          find_all,u(%!/FUN`BOND`ALL,%0),
          find_exact,iter(%q<find_all>,if(cor(not(comp(%i0,u(%!/FUN`KEY,%q<find_typed>))),not(comp(lcstr(get(%0/FABULA`BOND`%i0)),lcstr(%q<find_typed>)))),%i0)),
          find_start,iter(%q<find_all>,if(not(comp(lcstr(left(get(%0/FABULA`BOND`%i0),strlen(%q<find_typed>))),lcstr(%q<find_typed>))),%i0)))[if(strlen(%q<find_typed>),first(firstof(%q<find_exact>,if(eq(words(%q<find_start>),1),%q<find_start>))))]
        flags: [funsyntax]
      FUN`BOND`STRENGTH:
        value: |-
          words(get(%0/FABULA`BOND`%1`EMOTIONS))
        flags: [funsyntax]
      # %0 emotions: 1 when they are one to three known emotions, no two of the same pair.
      FUN`BOND`VALID:
        value: |-
          setq(valid_pairs,iter(%0,ceil(fdiv(member(v(DATA`EMOTIONS),%i0),2))))[cand(gte(words(%0),1),lte(words(%0),3),not(member(%q<valid_pairs>,0)),eq(words(%q<valid_pairs>),words(setunion(%q<valid_pairs>,))))]
        flags: [funsyntax]
      # %0 a character, %1 HP now (or nothing to read it): 1 when HP is at half its most or less.
      FUN`CRISIS:
        value: |-
          lte(firstof(%1,u(%!/API`METER,%0,HP)),div(u(%!/API`MAX,%0,HP),2))
        flags: [funsyntax]

      # ---- who may do what ----------------------------------------------------------
      FUN`PERM`KEEPER:
        value: |-
          permission(%0,softcode.fabula.admin)
        flags: [funsyntax]
      # %0 who asks, %1 whose sheet: 1 when they may read it. ALLOW`VIEW`<name>, which a bridge adds, may let more
      # people read it.
      FUN`PERM`VIEW:
        value: |-
          cor(not(comp(objid(%0),%1)),u(%!/FUN`PERM`KEEPER,%0),get(%!/DATA`CONFIG`PUBLIC),words(filterbool(%!/FUN`PERM`ALLOWS,lattr(%!/ALLOW`VIEW`*),,,%0,%1)))
        flags: [funsyntax]
      FUN`PERM`ALLOWS:
        value: |-
          u(%!/%0,%1,%2)
        flags: [funsyntax]
      FUN`GATE`EDIT:
        value: |-
          if(hasattr(%!,GATE`EDIT),u(%!/GATE`EDIT,%0))
        flags: [funsyntax]
      FUN`PLAYER`MATCH:
        value: |-
          if(isdbref(setr(found_player,pmatch(%0))),objid(%q<found_player>))
        flags: [funsyntax]

      # ---- screens ------------------------------------------------------------------
      # %0 a check's JSON, %1 a bond's strength added: "Dexterity + Insight: d8[4] + d10[7] + 2 = 13 vs 10: a
      # success, high roll 7 (roll 42)".
      FUN`DISPLAY`CHECK:
        value: |-
          setqm(display_tier,json_query(%0,extract,$.tier),
          display_target,json_query(%0,extract,$.target))[json_query(%0,extract,$.label)]: [json_query(%0,extract,$.text)][if(%1,%b+ %1 bond = [json_query(%0,extract,$.total)])][if(strlen(%q<display_target>),%bvs %q<display_target>)][if(strlen(%q<display_tier>),: [tone(u(%!/FUN`DISPLAY`TIERTONE,%q<display_tier>),u(%!/FUN`DISPLAY`TIER,%q<display_tier>))])]%, high roll [json_query(%0,extract,$.hr)] [tone(muted,%(roll [json_query(%0,extract,$.roll)]%))]
        flags: [funsyntax]
      FUN`DISPLAY`TIER:
        value: |-
          switch(%0,crit-success,a critical success,success,a success,crit-fail,a fumble,a failure)
        flags: [funsyntax]
      FUN`DISPLAY`TIERTONE:
        value: |-
          switch(%0,crit-success,success,success,success,error)
        flags: [funsyntax]
      # %0 a character, %1 a meter, %2 its value: "Alice's HP is 30 of 45."
      FUN`DISPLAY`METER:
        value: |-
          [name(%0)]'s [switch(%1,XP,experience,ZENIT,zenit,v(DATA`METER`%1))] [if(strmatch(%1,FP),are,is)] %2[if(member(HP MP IP,%1),%bof [u(%!/API`MAX,%0,%1)])]
        flags: [funsyntax]
      # %0 the character, %1 who reads it.
      FUN`SCREEN`SHEET:
        value: |-
          setq(screen_classes,u(%!/FUN`CLASS`MINE,%0))[box(lfields(lit({"cols":2}),Level%*<|>Identity%*<|>Theme%*<|>Origin,[u(%!/API`LEVEL,%0)]%*<|>[firstof(get(%0/FABULA`TRAIT`IDENTITY),-)]%*<|>[firstof(get(%0/FABULA`TRAIT`THEME),-)]%*<|>[firstof(get(%0/FABULA`TRAIT`ORIGIN),-)],%*<|>)%r[rule(Attributes)]%r[ldatatable(lit({"rule":""}),iter(v(DATA`ATTRS),v(DATA`ATTR`%i0),%b,|),iter(v(DATA`ATTRS),u(%!/FUN`DISPLAY`ATTR,%0,%i0),%b,|),^)]%r[ldatatable(lit({"rule":""}),iter(v(DATA`DEFENSES),v(DATA`DEFENSE`%i0),%b,|),[u(%!/API`DEFENSE,%0,DEF)]|[u(%!/API`DEFENSE,%0,MDEF)]|[u(%!/FUN`SIGNED,u(%!/API`DEFENSE,%0,INIT))],^)][if(words(setr(screen_status,get([u(%!/FUN`STATE`AT,%0)]`STATUS))),%r[tone(warning,Status: [itemize(%q<screen_status>)])])][if(strlen(setr(screen_aff,u(%!/FUN`AFF`LINE,%0))),%r[tone(muted,Affinities: %q<screen_aff>.)])][if(strlen(setr(screen_enc,u(%!/FUN`ENC`OF,%0))),%r[tone(muted,In the encounter [get({{encounters}}/ENC`%q<screen_enc>)]: HP%, MP%, IP and status effects here are its copies.)])]%r[rule(Resources)]%r[ldatatable(lit({"rule":""}),iter(v(DATA`METERS),v(DATA`METER`%i0),%b,|),iter(v(DATA`METERS),u(%!/FUN`DISPLAY`METERVALUE,%0,%i0),%b,|),^)]%r[rule(Classes)]%r[u(%!/FUN`SCREEN`CLASSES,%0)]%r[rule(Bonds)]%r[u(%!/FUN`SCREEN`BONDS,%0)]%r[rule()]%r[tone(muted,u(%!/FUN`DISPLAY`FOOTER,%0,%1))],name(%0))]
        flags: [funsyntax]
      # %0 a whole number: with its sign, +2 or -1, and 0 as +0.
      FUN`SIGNED:
        value: |-
          if(gte(%0,0),+%0,%0)
        flags: [funsyntax]
      # %0 a character, %1 an attribute: "d10", or "d8 (d10)" when status effects make it smaller.
      FUN`DISPLAY`ATTR:
        value: |-
          setqm(display_base,u(%!/FUN`ATTR`BASE,%0,%1),display_now,u(%!/FUN`ATTR`NOW,%0,%1))d%q<display_now>[if(neq(%q<display_base>,%q<display_now>),%b%(d%q<display_base>%))]
        flags: [funsyntax]
      FUN`DISPLAY`METERVALUE:
        value: |-
          setq(meter_value,u(%!/API`METER,%0,%1))[if(member(HP MP IP,%1),%q<meter_value>/[u(%!/API`MAX,%0,%1)],%q<meter_value>)][if(cand(strmatch(%1,HP),u(%!/FUN`CRISIS,%0,%q<meter_value>)),%b[tone(warning,if(%q<meter_value>,crisis,down))])]
        flags: [funsyntax]
      # %0 the character: their classes as a table, or a line saying there are none.
      FUN`SCREEN`CLASSES:
        value: |-
          if(words(%q<screen_classes>),ldatatable(lit({"nowrap":"1|2","rule":""}),Class|>Level|Gives|Skills,iter(%q<screen_classes>,[u(%!/FUN`LIST`LABEL,CLASS,%i0)]|[u(%!/FUN`CLASS`LEVEL,%0,%i0)]|[firstof(u(%!/FUN`CLASS`GIVES,%i0,%0),-)]|[firstof(u(%!/FUN`SKILL`LINE,%0,%i0),-)],,%*<^>)[if(u(%!/FUN`SKILL`USED,%0,HEROIC),%*<^>Heroic||-|[u(%!/FUN`SKILL`LINE,%0,HEROIC)])],%*<^>),tone(muted,No classes yet.))
        flags: [funsyntax]
      FUN`SCREEN`BONDS:
        value: |-
          setq(screen_bonds,u(%!/FUN`BOND`ALL,%0))[if(words(%q<screen_bonds>),ldatatable(lit({"nowrap":"3","rule":""}),Bond|Emotions|>Strength,iter(%q<screen_bonds>,[get(%0/FABULA`BOND`%i0)]|[itemize(get(%0/FABULA`BOND`%i0`EMOTIONS))]|[u(%!/FUN`BOND`STRENGTH,%0,%i0)],,%*<^>),%*<^>),tone(muted,No bonds.))]
        flags: [funsyntax]
      FUN`DISPLAY`FOOTER:
        value: |-
          cond(cand(not(comp(objid(%1),%0)),not(isapproved(%1)),not(u(%!/FUN`PERM`KEEPER,%1))),[if(u(%!/FUN`SPREAD`OK,%0),,[u(%!/FUN`SPREAD`WARN,%0)]%b)]+sheet/set%, /class and /skill fill it in. +check <attribute>+<attribute> rolls.[u(%!/FUN`HINT,FOOTER)],not(comp(objid(%1),%0)),+check <attribute>+<attribute> rolls. +sheet/hp -<n> takes damage%, +sheet/levelup <class> spends experience.,+check <attribute>+<attribute> rolls the two dice against a Difficulty Level.)
        flags: [funsyntax]
      FUN`SCREEN`TRAITS:
        value: |-
          box(ldatatable(lit({"nowrap":"1|2"}),Key|Attribute,iter(v(DATA`ATTRS),lcstr(%i0)|[v(DATA`ATTR`%i0)],,%*<^>),%*<^>)%r[rule(Classes)]%r[ldatatable(lit({"nowrap":"1|2"}),Key|Class|Gives,iter(u(%!/FUN`LIST`ALL,CLASS),lcstr(%i0)|[u(%!/FUN`LIST`LABEL,CLASS,%i0)]|[firstof(u(%!/FUN`CLASS`GIVES,%i0),-)],,%*<^>),%*<^>)]%r[rule()]%r[tone(muted,Difficulties: [itemize(iter(v(DATA`DIFFICULTIES),%i0 [extract(get(%!/DATA`CONFIG`DLS),inum(0),1)],%b,|),|)]. Status effects: [itemize(v(DATA`STATUSES))]. Bond emotions: [itemize(v(DATA`EMOTIONS))].)],JRPG sheet)
        flags: [funsyntax]

      # ---- dice -------------------------------------------------------------------
      # %0 the pair as DEX+INS, %1 the two die sizes, %2 what is added. Rolls 1d<a>+1d<b>+<n> and keeps the roll;
      # returns the dice and the roll's id: "<a> <b> <id>".
      FUN`ROLL`PAIR:
        value: |-
          setq(rolled,roll(1d[first(%1)]+1d[last(%1)][if(%2,if(gt(%2,0),+%2,%2))],,record))[json_query(%q<rolled>,extract,$.dice%[0%].total)] [json_query(%q<rolled>,extract,$.dice%[1%].total)] [json_query(%q<rolled>,extract,$.id)]
        flags: [funsyntax]
      # %0 a die size: rolls it and keeps the roll, "<result> <id>".
      FUN`ROLL`ONE:
        value: |-
          setq(rolled,roll(1d%0,,record))[json_query(%q<rolled>,extract,$.total)] [json_query(%q<rolled>,extract,$.id)]
        flags: [funsyntax]
      # Builds a check's JSON from check_pair, check_sizes, check_dice, check_mod, check_dl, check_roll and
      # check_extra (a bond's strength added).
      FUN`CHECK`JSON:
        value: |-
          setqm(json_d1,first(%q<check_dice>),
          json_d2,last(%q<check_dice>),
          json_total,add(%q<json_d1>,%q<json_d2>,%q<check_mod>,firstof(%q<check_extra>,0)),
          json_crit,cand(eq(%q<json_d1>,%q<json_d2>),gte(%q<json_d1>,6)),
          json_fumble,cand(eq(%q<json_d1>,1),eq(%q<json_d2>,1)))[json(object,tier,json(string,u(%!/API`TIER,%q<json_total>,%q<json_d1>,%q<json_d2>,%q<check_dl>)),total,%q<json_total>,hr,max(%q<json_d1>,%q<json_d2>),dice,json(array,%q<json_d1>,%q<json_d2>),sizes,json(array,first(%q<check_sizes>),last(%q<check_sizes>)),pair,json(string,lcstr(%q<check_pair>)),modifier,%q<check_mod>,target,json(string,%q<check_dl>),crit,json(boolean,%q<json_crit>),fumble,json(boolean,%q<json_fumble>),label,json(string,u(%!/API`LABEL,%q<check_pair>)),text,json(string,d[first(%q<check_sizes>)]%[%q<json_d1>%] + d[last(%q<check_sizes>)]%[%q<json_d2>%][if(%q<check_mod>,%b[if(gt(%q<check_mod>,0),+,-)] [abs(%q<check_mod>)])] = [sub(%q<json_total>,firstof(%q<check_extra>,0))]),roll,json(string,%q<check_roll>))]
        flags: [funsyntax]

      # ---- the sheet API ------------------------------------------------------------
      # What other packages call: u({{sheet-fabula/sheet}}/API`<NAME>,...). Every sheet package has these names. They
      # read and roll; API`ADJUST is the one that writes.
      API:
        value: |-
          The JRPG sheet's functions for other packages. See the package README.
        flags: [VISUAL]
      # JSON list of the checks: [{"key","label","group","always"}], one for each pair of attributes, group check.
      API`TRAITS:
        value: |-
          json_array(iter(v(DATA`PAIRS),json(object,key,json(string,lcstr(%i0)),label,json(string,u(%!/API`LABEL,%i0)),group,json(string,check),always,json(boolean,1)),%b,|),|)
        flags: [VISUAL]
      API`ALWAYS:
        value: |-
          lcstr(v(DATA`PAIRS))
        flags: [VISUAL]
      # %0 typed text, "dex+ins", "dex ins" or "mig": the pair, "dex+ins", or nothing.
      API`FIND:
        value: |-
          setqm(find_words,squish(edit(%0,+,%b)),find_keys,iter(%q<find_words>,u(%!/FUN`ATTR`FIND,%i0)))[if(cand(gte(words(%q<find_words>),1),lte(words(%q<find_words>),2),eq(words(%q<find_keys>),words(%q<find_words>))),lcstr(u(%!/FUN`PAIR`KEY,%q<find_keys>)))]
        flags: [VISUAL]
      # %0 a pair: "Dexterity + Insight".
      API`LABEL:
        value: |-
          [v(DATA`ATTR`[ucstr(first(%0,+))])] + [v(DATA`ATTR`[ucstr(last(%0,+))])]
        flags: [VISUAL]
      # %0 a character, %1 a pair or an attribute: the dice now, "d8 + d10", or "d8" for one attribute.
      API`RATING:
        value: |-
          itemize(iter(ucstr(%1),d[u(%!/FUN`ATTR`NOW,%0,%i0)],+,|),|,+,+)
        flags: [VISUAL]
      API`HAS:
        value: |-
          hasattr(%0,FABULA)
        flags: [VISUAL]
      # %0 a character: their level, the sum of their class levels.
      API`LEVEL:
        value: |-
          add(0,ladd(iter(lattr(%0/FABULA`CLASS`*),get(%0/%i0))))
        flags: [VISUAL]
      # %0 a difficulty word (also normal and very hard) or a number from 1 to 40: the Difficulty Level, or nothing.
      API`TARGET:
        value: |-
          setq(target_word,switch(setr(target_typed,lcstr(edit(squish(%0),%b,-))),normal,standard,very-hard,extreme,veryhard,extreme,%q<target_typed>))[cond(member(v(DATA`DIFFICULTIES),%q<target_word>),extract(get(%!/DATA`CONFIG`DLS),member(v(DATA`DIFFICULTIES),%q<target_word>),1),u(%!/FUN`IS`DL,%0),%0)]
        flags: [VISUAL]
      # %0 the total, %1 and %2 the dice, %3 the Difficulty Level or nothing. Both dice the same and 6 or more is
      # crit-success; both 1 is crit-fail; otherwise success when the total reaches the Difficulty Level, else
      # fail. With no Difficulty Level only a critical or a fumble has a tier.
      API`TIER:
        value: |-
          cond(not(cand(isint(%0),isint(%1),isint(%2))),,cand(eq(%1,%2),gte(%1,6)),crit-success,cand(eq(%1,1),eq(%2,1)),crit-fail,not(strlen(%3)),,gte(%0,%3),success,fail)
        flags: [VISUAL]
      # %0 a character, %1 a meter (HP MP IP FP XP ZENIT): its value, the start when not set, within its range.
      # Experience and zenit are what the ledger adds up to: FABULA`WALLET`<KEY>, read only with the wizard flag.
      API`METER:
        value: |-
          if(member(v(DATA`WALLET),ucstr(%1)),if(hasflag(%0/FABULA`WALLET`[ucstr(%1)],wizard),get(%0/FABULA`WALLET`[ucstr(%1)]),0),min(default([if(member(HP MP IP,ucstr(%1)),u(%!/FUN`STATE`AT,%0),%0/FABULA)]`METER`[ucstr(%1)],u(%!/API`START,%0,%1)),u(%!/API`MAX,%0,%1)))
        flags: [VISUAL]
      # %0 a character, %1 a meter: where it starts, HP, MP and IP full, FP 3, experience and zenit 0.
      API`START:
        value: |-
          switch(ucstr(%1),FP,3,XP,0,ZENIT,0,u(%!/API`MAX,%0,%1))
        flags: [VISUAL]
      # %0 a character, %1 a meter: its most. HP five times the base Might die plus the level, MP the same with
      # Willpower, IP 6; each class that gives one adds 5 HP, 5 MP or 2 IP, and +sheet/bonus adds the rest.
      API`MAX:
        value: |-
          setq(max_bonus,default(%0/FABULA`BONUS`[ucstr(%1)],0))[switch(ucstr(%1),HP,add(mul(5,u(%!/FUN`ATTR`BASE,%0,MIG)),u(%!/API`LEVEL,%0),mul(5,u(%!/FUN`CLASS`BENEFITS,%0,hp)),%q<max_bonus>),MP,add(mul(5,u(%!/FUN`ATTR`BASE,%0,WLP)),u(%!/API`LEVEL,%0),mul(5,u(%!/FUN`CLASS`BENEFITS,%0,mp)),%q<max_bonus>),IP,add(6,mul(2,u(%!/FUN`CLASS`BENEFITS,%0,ip)),%q<max_bonus>),FP,999,XP,v(DATA`WALLET`MOST),ZENIT,v(DATA`WALLET`MOST),)]
        flags: [VISUAL]
      # %0 a character, %1 a meter, %2 how much to add (or take, below 0), %3 why (experience and zenit only):
      # writes it within 0 and its most and returns the new value. Back at its start the leaf is cleared
      # (attrib_set with no value), not set empty. Experience and zenit go on the ledger as an entry with %3 as
      # its source ("Play" when not given); #-1 LEDGER FULL when there is no room for it.
      API`ADJUST:
        value: |-
          setqm(adjust_key,ucstr(%1),
          adjust_most,u(%!/API`MAX,%0,%1),
          adjust_new,if(isint(%q<adjust_most>),bound(add(u(%!/API`METER,%0,%1),%2),0,%q<adjust_most>)))[cond(member(v(DATA`WALLET),%q<adjust_key>),if(strmatch(u(%!/FUN`WALLET`PUT,%0,%q<adjust_key>,sub(%q<adjust_new>,u(%!/API`METER,%0,%q<adjust_key>)),firstof(%3,Play),play,objid(%#),),#-*),#-1 LEDGER FULL,u(%!/API`METER,%0,%q<adjust_key>)),member(v(DATA`METERS),%q<adjust_key>),[u(%!/FUN`DO`ROOT,%0)][setq(adjust_at,if(member(HP MP IP,%q<adjust_key>),u(%!/FUN`STATE`AT,%0),%0/FABULA))][if(neq(%q<adjust_new>,u(%!/API`START,%0,%1)),attrib_set(%q<adjust_at>`METER`%q<adjust_key>,%q<adjust_new>),attrib_set(%q<adjust_at>`METER`%q<adjust_key>))]%q<adjust_new>,#-1 NO SUCH METER)]
        flags: [VISUAL]
      # %0 a character, %1 DEF, MDEF or INIT: Defense (the Dexterity die now, or martial armour's Defense, plus its
      # bonus), Magic Defense (the Insight die now plus its bonus) or the Initiative bonus.
      API`DEFENSE:
        value: |-
          setqm(defense_key,ucstr(%1),defense_bonus,default(%0/FABULA`BONUS`[ucstr(%1)],0),defense_martial,default(%0/FABULA`BONUS`MARTIAL,0))[switch(%q<defense_key>,DEF,add(if(%q<defense_martial>,%q<defense_martial>,u(%!/FUN`ATTR`NOW,%0,DEX)),%q<defense_bonus>),MDEF,add(u(%!/FUN`ATTR`NOW,%0,INS),%q<defense_bonus>),INIT,%q<defense_bonus>,#-1 NO SUCH DEFENSE)]
        flags: [VISUAL]
      # %0 a character, %1 someone: the strength of %0's strongest bond named for %1, 0 when none.
      API`BOND:
        value: |-
          setqm(bond_holder,%0,bond_named,lcstr(name(%1)))[lmax(0 [iter(u(%!/FUN`BOND`ALL,%0),if(not(comp(lcstr(get(%q<bond_holder>/FABULA`BOND`%i0)),%q<bond_named>)),u(%!/FUN`BOND`STRENGTH,%q<bond_holder>,%i0)))])]
        flags: [VISUAL]
      # Named: %<roller> an objid, %<trait> a pair or an attribute, %<modifier> what is added, %<target> the Difficulty
      # Level or nothing. Rolls the two dice as they are now and keeps the roll (roll() record), and returns
      # {"tier","total","hr","dice","sizes","pair","modifier","target","crit","fumble","label","text","roll"}. #-1
      # and why when the trait or roller is wrong. It gives no Fabula Point for a fumble; the caller does.
      API`CHECK:
        value: |-
          setq(check_pair,ucstr(u(%!/API`FIND,%<trait>)))[cond(not(hastype(%<roller>,player)),#-1 There is no character to roll for.,not(strlen(%q<check_pair>)),#-1 There is no check '%<trait>'.,u(%!/FUN`CHECK`ROLLED,%<roller>,firstof(%<modifier>,0),%<target>))]
        flags: [VISUAL]
      FUN`CHECK`ROLLED:
        value: |-
          setqm(check_sizes,iter(%q<check_pair>,u(%!/FUN`ATTR`NOW,%0,%i0),+,%b),
          check_mod,%1,
          check_dl,%2,
          check_extra,0,
          check_rolled,u(%!/FUN`ROLL`PAIR,%q<check_pair>,%q<check_sizes>,%q<check_mod>),
          check_dice,extract(%q<check_rolled>,1,2),
          check_roll,last(%q<check_rolled>))[u(%!/FUN`CHECK`JSON)]
        flags: [funsyntax]
      # %0 a check's JSON, %1 first, second or both, %2 a bond's strength added already: the check with those
      # dice rolled again and kept, the rest as it was.
      API`REROLL:
        value: |-
          setqm(check_pair,ucstr(json_query(%0,extract,$.pair)),
          check_sizes,json_query(%0,extract,$.sizes%[0%]) [json_query(%0,extract,$.sizes%[1%])],
          check_mod,json_query(%0,extract,$.modifier),
          check_dl,json_query(%0,extract,$.target),
          check_extra,firstof(%2,0),
          check_one,if(member(first both,%1),u(%!/FUN`ROLL`ONE,first(%q<check_sizes>))),
          check_two,if(member(second both,%1),u(%!/FUN`ROLL`ONE,last(%q<check_sizes>))),
          check_dice,[firstof(first(%q<check_one>),json_query(%0,extract,$.dice%[0%]))] [firstof(first(%q<check_two>),json_query(%0,extract,$.dice%[1%]))],
          check_roll,squish(json_query(%0,extract,$.roll) [rest(%q<check_one>)] [rest(%q<check_two>)]))[u(%!/FUN`CHECK`JSON)]
        flags: [VISUAL]
      # %0 a check's JSON, %1 a bond's strength: the check with that added. A critical or a fumble stays one.
      API`PUSH:
        value: |-
          setqm(check_pair,ucstr(json_query(%0,extract,$.pair)),
          check_sizes,json_query(%0,extract,$.sizes%[0%]) [json_query(%0,extract,$.sizes%[1%])],
          check_mod,json_query(%0,extract,$.modifier),
          check_dl,json_query(%0,extract,$.target),
          check_extra,%1,
          check_dice,json_query(%0,extract,$.dice%[0%]) [json_query(%0,extract,$.dice%[1%])],
          check_roll,json_query(%0,extract,$.roll))[u(%!/FUN`CHECK`JSON)]
        flags: [VISUAL]

      # ---- lifecycle ----------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP:
        value: |-
          @command/add/noparse/rsnoparse +sheet; @hook/override/inline +sheet=%!,CMD`SHEET; @command/add/noparse/rsnoparse +check; @hook/override/inline +check=%!,CMD`CHECK; @command/add/noparse/rsnoparse +encounter; @hook/override/inline +encounter=%!,CMD`ENCOUNTER; @command/add/noparse/rsnoparse +attack; @hook/override/inline +attack=%!,CMD`ATTACK; @command/add/noparse/rsnoparse +foe; @hook/override/inline +foe=%!,CMD`FOE
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

