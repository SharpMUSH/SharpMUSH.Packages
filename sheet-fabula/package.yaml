format: "1.20"
package: sheet-fabula
title: "JRPG sheet"
version: 1.2.3
authors: [SharpMUSH]
description: "A JRPG character sheet compatible with Fabula Ultima: four attributes as die sizes, classes and their skill levels, HP, MP, IP, Fabula Points, status effects and bonds. +check rolls two attribute dice against a Difficulty Level, with rerolls and bond invokes paid in Fabula Points. Requires the Fabula Ultima Core Rulebook; see NOTICE.md."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, fabula, classes, bonds, dice]
category: Game System
subcategory: JRPG
requires_server: ">=1.0"
verified_server: "1.0"

# One permission, for the people who keep sheets: change any character's sheet at any time and read every sheet.
# A player fills in their own sheet until they are approved, and keeps their own resources, status effects,
# bonds, level-ups and new skill levels in play. Changing the class list and the settings is config.admin, as
# +config is.
categories:
  roles:
    - name: JRPG sheet
      description: Roles for the people who keep JRPG character sheets.
  permissions:
    - name: JRPG sheet
      description: Keeping JRPG character sheets.
permissions:
  - name: softcode.fabula.admin
    category: JRPG sheet
    description: Read every JRPG sheet, and change any character's sheet at any time.
roles:
  - slug: fabula-sheet-keeper
    name: JRPG Sheet Keeper
    category: JRPG sheet
    priority: 11
    permissions:
      softcode.fabula.admin: allow

# Every character's JRPG tree is their sheet: only wizards write it, so a player can't make the root before the
# sheet does, and it is never a command.
attributes:
  FABULA:
    flags: [wizard, no_command]

objects:
  # The command object, in the master room. WIZARD because it adds the commands (@command/add, @hook), writes the
  # sheet attributes on characters, and reads them for other packages.
  #
  # A character's sheet is their own attributes under FABULA`:
  #   FABULA`LEDGER`<n>       the build, one JSON entry each (see "the ledger"); ATTR, RAISES, CLASS, SKILL and
  #                           BONUS below are rebuilt from it after every change
  #   FABULA`ATTR`<KEY>       an attribute's base die size, 6 8 10 or 12 (unset is 8)
  #   FABULA`RAISES           how many times an attribute rose at level 20 and 40
  #   FABULA`CLASS`<KEY>      a class's level, 1 to 10
  #   FABULA`SKILL`<KEY>      a skill's name, with CLASS (a class key or HEROIC) and LEVEL beneath
  #   FABULA`TRAIT`<KEY>      IDENTITY, THEME or ORIGIN
  #   FABULA`METER`<KEY>      HP, MP, IP, FP or XP now (unset is its start)
  #   FABULA`BONUS`<KEY>      what skills add to the maximum HP, MP or IP; equipment's DEF, MDEF, INIT and MARTIAL
  #   FABULA`SUPPORTS         the supporters of their next group check
  #   FABULA`STATUS           the status effects on them
  #   FABULA`BOND`<KEY>       a bond's name, with EMOTIONS beneath
  #   FABULA`LAST             their last check, for +check/invoke and +check/bond
  #   FABULA`ENCOUNTERS       the encounters they are in, last joined last; FABULA`USING the one +encounter/use picked
  #   FABULA`AFFINITY`<TYPE>`<VU|RS|IM|AB>  an affinity to a damage type, rebuilt from the ledger's affinity entries
  #   FABULA`ATTACK           their last +attack, for +attack/damage
  # The JRPG root is wizard-flagged, so only this object writes them.
  #
  # +sheet, +check and +encounter are added with /noparse/rsnoparse and hooked to CMD`<word>, so what a player types reaches
  # the code exactly as typed and nothing a player wrote is ever evaluated.
  #
  # Trees: CMD` the hooked commands, INC`COMMAND` the parse and dispatch, INC`SHEET` and INC`CHECK` one routine
  # per switch, INC`NEED` the guards they share, INC`DO` the writes. FUN`ATTR` the attributes, FUN`CLASS` the
  # classes, FUN`SKILL`, FUN`BOND` and FUN`STATUS` those parts of a sheet, FUN`ROLL` the dice, FUN`PERM` who may do
  # what, FUN`SCREEN` and FUN`DISPLAY` the screens. API` the functions other packages call (VISUAL), the same
  # names in every sheet package. Bridges add HINT`<message> lines, GATE`EDIT (a reason a player may not change
  # their own sheet now) and ALLOW`VIEW`<name> (who else may read a sheet).
  - ref: sheet
    type: thing
    name: JRPG Sheet
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      # ---- settings ---------------------------------------------------------------
      # +config fabula shows and changes them (sheet-fabula-config); the code reads each with
      # get(%!/DATA`CONFIG`<NAME>).
      DATA`CONFIG: |-
        Settings for the JRPG sheet. One leaf per setting.
      DATA`CONFIG`LABEL: |-
        JRPG sheet
      DATA`CONFIG`START: |-
        5
      DATA`CONFIG`START`TYPE: |-
        integer
      DATA`CONFIG`START`DEFAULT: |-
        5
      DATA`CONFIG`START`MIN: |-
        1
      DATA`CONFIG`START`MAX: |-
        50
      DATA`CONFIG`START`LABEL: |-
        Starting level
      DATA`CONFIG`START`DESCRIPTION: |-
        How many class levels a new character shares out among their classes.
      DATA`CONFIG`START`EXAMPLE: |-
        5
      DATA`CONFIG`MAXLEVEL: |-
        50
      DATA`CONFIG`MAXLEVEL`TYPE: |-
        integer
      DATA`CONFIG`MAXLEVEL`DEFAULT: |-
        50
      DATA`CONFIG`MAXLEVEL`MIN: |-
        1
      DATA`CONFIG`MAXLEVEL`MAX: |-
        100
      DATA`CONFIG`MAXLEVEL`LABEL: |-
        Highest level
      DATA`CONFIG`MAXLEVEL`DESCRIPTION: |-
        The level +sheet/levelup stops at.
      DATA`CONFIG`MAXLEVEL`EXAMPLE: |-
        50
      DATA`CONFIG`SPREADS: |-
        8 8 8 8|10 8 8 6|10 10 6 6
      DATA`CONFIG`SPREADS`TYPE: |-
        text
      DATA`CONFIG`SPREADS`DEFAULT: |-
        8 8 8 8|10 8 8 6|10 10 6 6
      DATA`CONFIG`SPREADS`MAX: |-
        200
      DATA`CONFIG`SPREADS`CHECK: |-
        CHECK`SPREADS
      DATA`CONFIG`SPREADS`LABEL: |-
        Starting attribute dice
      DATA`CONFIG`SPREADS`DESCRIPTION: |-
        The sets of four die sizes a new character may give their attributes, separated by |. The sheet warns a player whose attributes match none.
      DATA`CONFIG`SPREADS`EXAMPLE: |-
        8 8 8 8|10 8 8 6
      DATA`CONFIG`DLS: |-
        5 7 10 13 16
      DATA`CONFIG`DLS`TYPE: |-
        list
      DATA`CONFIG`DLS`DEFAULT: |-
        5 7 10 13 16
      DATA`CONFIG`DLS`MIN: |-
        5
      DATA`CONFIG`DLS`MAX: |-
        5
      DATA`CONFIG`DLS`CHECK: |-
        CHECK`DLS
      DATA`CONFIG`DLS`LABEL: |-
        Difficulty Level for each difficulty
      DATA`CONFIG`DLS`DESCRIPTION: |-
        The Difficulty Level of trivial, easy, standard (normal), hard and extreme (very hard), in that order.
      DATA`CONFIG`DLS`EXAMPLE: |-
        6 7 10 13 16
      DATA`CONFIG`WINDOW: |-
        600
      DATA`CONFIG`WINDOW`TYPE: |-
        integer
      DATA`CONFIG`WINDOW`DEFAULT: |-
        600
      DATA`CONFIG`WINDOW`MIN: |-
        30
      DATA`CONFIG`WINDOW`MAX: |-
        86400
      DATA`CONFIG`WINDOW`LABEL: |-
        Seconds to invoke after a check
      DATA`CONFIG`WINDOW`DESCRIPTION: |-
        How long after a check +check/invoke and +check/bond may still change it.
      DATA`CONFIG`WINDOW`EXAMPLE: |-
        300
      DATA`CONFIG`PUBLIC: |-
        0
      DATA`CONFIG`PUBLIC`TYPE: |-
        boolean
      DATA`CONFIG`PUBLIC`DEFAULT: |-
        0
      DATA`CONFIG`PUBLIC`LABEL: |-
        Sheets anyone can read
      DATA`CONFIG`PUBLIC`DESCRIPTION: |-
        Whether +sheet <name> shows anyone's sheet to everyone. Otherwise only the character and sheet keepers see it.
      DATA`CONFIG`PUBLIC`EXAMPLE: |-
        yes
      DATA`CONFIG`CLASSES`TYPE: |-
        table
      DATA`CONFIG`CLASSES`LABEL: |-
        Classes
      DATA`CONFIG`CLASSES`DESCRIPTION: |-
        The classes a character takes levels in, with what their first level gives.
      DATA`CONFIG`CLASSES`STORE: |-
        {{store}}
      DATA`CONFIG`CLASSES`PATH: |-
        CLASS
      DATA`CONFIG`CLASSES`ENTRY: |-
        label
      DATA`CONFIG`CLASSES`FIELDS: |-
        label benefit martial rituals order
      DATA`CONFIG`CLASSES`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`CLASSES`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`CLASSES`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`CLASSES`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`CLASSES`FIELD`LABEL`LABEL: |-
        Label
      DATA`CONFIG`CLASSES`FIELD`LABEL`DESCRIPTION: |-
        The name the sheet shows.
      DATA`CONFIG`CLASSES`FIELD`BENEFIT`TYPE: |-
        choice
      DATA`CONFIG`CLASSES`FIELD`BENEFIT`CHOICES: |-
        hp mp either ip none
      DATA`CONFIG`CLASSES`FIELD`BENEFIT`DEFAULT: |-
        none
      DATA`CONFIG`CLASSES`FIELD`BENEFIT`LABEL: |-
        Resource
      DATA`CONFIG`CLASSES`FIELD`BENEFIT`DESCRIPTION: |-
        hp or mp adds 5 to the maximum HP or MP, either adds 5 to the one the player picks with +sheet/benefit, ip adds 2 to the maximum IP.
      DATA`CONFIG`CLASSES`FIELD`MARTIAL`TYPE: |-
        list
      DATA`CONFIG`CLASSES`FIELD`MARTIAL`CHOICES: |-
        melee ranged armour shields
      DATA`CONFIG`CLASSES`FIELD`MARTIAL`MIN: |-
        0
      DATA`CONFIG`CLASSES`FIELD`MARTIAL`LABEL: |-
        Martial items
      DATA`CONFIG`CLASSES`FIELD`MARTIAL`DESCRIPTION: |-
        The martial weapons and armour the class lets a character use.
      DATA`CONFIG`CLASSES`FIELD`RITUALS`TYPE: |-
        boolean
      DATA`CONFIG`CLASSES`FIELD`RITUALS`DEFAULT: |-
        0
      DATA`CONFIG`CLASSES`FIELD`RITUALS`LABEL: |-
        Rituals
      DATA`CONFIG`CLASSES`FIELD`RITUALS`DESCRIPTION: |-
        Whether the class lets a character perform rituals of its own discipline.
      DATA`CONFIG`CLASSES`FIELD`ORDER`TYPE: |-
        integer
      DATA`CONFIG`CLASSES`FIELD`ORDER`DEFAULT: |-
        50
      DATA`CONFIG`CLASSES`FIELD`ORDER`MIN: |-
        0
      DATA`CONFIG`CLASSES`FIELD`ORDER`MAX: |-
        999
      DATA`CONFIG`CLASSES`FIELD`ORDER`LABEL: |-
        Order
      DATA`CONFIG`CLASSES`FIELD`ORDER`DESCRIPTION: |-
        Where it comes in the list: lower first, then by name.
      CHECK`SPREADS: |-
        if(every(%!/FUN`IS`SPREAD,%0,|),,Give sets of four die sizes from 6 8 10 12%, separated by |.)
      FUN`IS`SPREAD: |-
        cand(eq(words(%0),4),every(%!/FUN`IS`SIZE,%0))
      FUN`IS`SIZE: |-
        member(6 8 10 12,%0)
      CHECK`DLS: |-
        if(cand(eq(words(%0),5),every(%!/FUN`IS`DL,%0)),,Give five whole numbers from 1 to 40%, trivial to extreme.)
      FUN`IS`DL: |-
        cand(isint(%0),gte(%0,1),lte(%0,40))

      DATA`CONFIG`SURRENDER: |-
        2
      DATA`CONFIG`SURRENDER`TYPE: |-
        integer
      DATA`CONFIG`SURRENDER`DEFAULT: |-
        2
      DATA`CONFIG`SURRENDER`MIN: |-
        0
      DATA`CONFIG`SURRENDER`MAX: |-
        10
      DATA`CONFIG`SURRENDER`LABEL: |-
        Fabula Points for surrendering
      DATA`CONFIG`SURRENDER`DESCRIPTION: |-
        The Fabula Points a character gains when they surrender at 0 HP with +encounter/surrender.
      DATA`CONFIG`SURRENDER`EXAMPLE: |-
        2
      DATA`CONFIG`FOES`TYPE: |-
        table
      DATA`CONFIG`FOES`LABEL: |-
        Foes
      DATA`CONFIG`FOES`DESCRIPTION: |-
        The bestiary: the foes a GM brings into an encounter with +encounter/foe. Each encounter keeps its own copy.
      DATA`CONFIG`FOES`STORE: |-
        {{store}}
      DATA`CONFIG`FOES`PATH: |-
        FOE
      DATA`CONFIG`FOES`ENTRY: |-
        label
      DATA`CONFIG`FOES`FIELDS: |-
        label level rank champion villain species role dex ins mig wlp hp mp def mdef init affinities immune attacks notes picture art
      DATA`CONFIG`FOES`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`FOES`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`FOES`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`FOES`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`FOES`FIELD`LABEL`LABEL: |-
        Name
      DATA`CONFIG`FOES`FIELD`LABEL`DESCRIPTION: |-
        The foe's name in an encounter. Several of one foe get A, B, C after it.
      DATA`CONFIG`FOES`FIELD`LEVEL`TYPE: |-
        integer
      DATA`CONFIG`FOES`FIELD`LEVEL`DEFAULT: |-
        5
      DATA`CONFIG`FOES`FIELD`LEVEL`MIN: |-
        5
      DATA`CONFIG`FOES`FIELD`LEVEL`MAX: |-
        60
      DATA`CONFIG`FOES`FIELD`LEVEL`LABEL: |-
        Level
      DATA`CONFIG`FOES`FIELD`LEVEL`DESCRIPTION: |-
        Its level: it adds twice itself to HP and once to MP, 1 to its checks every 10 levels and 5 to its damage every 20.
      DATA`CONFIG`FOES`FIELD`RANK`TYPE: |-
        choice
      DATA`CONFIG`FOES`FIELD`RANK`CHOICES: |-
        soldier elite champion
      DATA`CONFIG`FOES`FIELD`RANK`DEFAULT: |-
        soldier
      DATA`CONFIG`FOES`FIELD`RANK`LABEL: |-
        Rank
      DATA`CONFIG`FOES`FIELD`RANK`DESCRIPTION: |-
        A soldier counts as one, an elite as two and a champion as its champion number: its HP is that many times a soldier's and it takes that many turns a round. A champion has twice the MP.
      DATA`CONFIG`FOES`FIELD`CHAMPION`TYPE: |-
        integer
      DATA`CONFIG`FOES`FIELD`CHAMPION`DEFAULT: |-
        1
      DATA`CONFIG`FOES`FIELD`CHAMPION`MIN: |-
        1
      DATA`CONFIG`FOES`FIELD`CHAMPION`MAX: |-
        6
      DATA`CONFIG`FOES`FIELD`CHAMPION`LABEL: |-
        Champion number
      DATA`CONFIG`FOES`FIELD`CHAMPION`DESCRIPTION: |-
        For a champion, how many soldiers it counts as, usually the number of characters it faces.
      DATA`CONFIG`FOES`FIELD`VILLAIN`TYPE: |-
        choice
      DATA`CONFIG`FOES`FIELD`VILLAIN`CHOICES: |-
        none minor major supreme
      DATA`CONFIG`FOES`FIELD`VILLAIN`DEFAULT: |-
        none
      DATA`CONFIG`FOES`FIELD`VILLAIN`LABEL: |-
        Villain
      DATA`CONFIG`FOES`FIELD`VILLAIN`DESCRIPTION: |-
        A villain starts each encounter with Ultima Points: 5 minor, 10 major, 15 supreme.
      DATA`CONFIG`FOES`FIELD`SPECIES`TYPE: |-
        choice
      DATA`CONFIG`FOES`FIELD`SPECIES`CHOICES: |-
        beast construct demon elemental humanoid monster plant undead
      DATA`CONFIG`FOES`FIELD`SPECIES`DEFAULT: |-
        monster
      DATA`CONFIG`FOES`FIELD`SPECIES`LABEL: |-
        Species
      DATA`CONFIG`FOES`FIELD`SPECIES`DESCRIPTION: |-
        What kind of creature it is. Give the affinities and immunities its species brings in their own fields.
      DATA`CONFIG`FOES`FIELD`ROLE`TYPE: |-
        choice
      DATA`CONFIG`FOES`FIELD`ROLE`CHOICES: |-
        custom brute hunter mage saboteur sentinel support
      DATA`CONFIG`FOES`FIELD`ROLE`DEFAULT: |-
        custom
      DATA`CONFIG`FOES`FIELD`ROLE`LABEL: |-
        Role
      DATA`CONFIG`FOES`FIELD`ROLE`DESCRIPTION: |-
        A role sets the four attribute dice for the foe's level, and they grow at 20, 40 and 60. custom uses dex, ins, mig and wlp.
      DATA`CONFIG`FOES`FIELD`DEX`TYPE: |-
        choice
      DATA`CONFIG`FOES`FIELD`DEX`CHOICES: |-
        6 8 10 12
      DATA`CONFIG`FOES`FIELD`DEX`DEFAULT: |-
        8
      DATA`CONFIG`FOES`FIELD`DEX`LABEL: |-
        Dexterity
      DATA`CONFIG`FOES`FIELD`DEX`DESCRIPTION: |-
        Its Dexterity die, for the custom role.
      DATA`CONFIG`FOES`FIELD`INS`TYPE: |-
        choice
      DATA`CONFIG`FOES`FIELD`INS`CHOICES: |-
        6 8 10 12
      DATA`CONFIG`FOES`FIELD`INS`DEFAULT: |-
        8
      DATA`CONFIG`FOES`FIELD`INS`LABEL: |-
        Insight
      DATA`CONFIG`FOES`FIELD`INS`DESCRIPTION: |-
        Its Insight die, for the custom role.
      DATA`CONFIG`FOES`FIELD`MIG`TYPE: |-
        choice
      DATA`CONFIG`FOES`FIELD`MIG`CHOICES: |-
        6 8 10 12
      DATA`CONFIG`FOES`FIELD`MIG`DEFAULT: |-
        8
      DATA`CONFIG`FOES`FIELD`MIG`LABEL: |-
        Might
      DATA`CONFIG`FOES`FIELD`MIG`DESCRIPTION: |-
        Its Might die, for the custom role.
      DATA`CONFIG`FOES`FIELD`WLP`TYPE: |-
        choice
      DATA`CONFIG`FOES`FIELD`WLP`CHOICES: |-
        6 8 10 12
      DATA`CONFIG`FOES`FIELD`WLP`DEFAULT: |-
        8
      DATA`CONFIG`FOES`FIELD`WLP`LABEL: |-
        Willpower
      DATA`CONFIG`FOES`FIELD`WLP`DESCRIPTION: |-
        Its Willpower die, for the custom role.
      DATA`CONFIG`FOES`FIELD`HP`TYPE: |-
        integer
      DATA`CONFIG`FOES`FIELD`HP`DEFAULT: |-
        0
      DATA`CONFIG`FOES`FIELD`HP`MIN: |-
        -99
      DATA`CONFIG`FOES`FIELD`HP`MAX: |-
        999
      DATA`CONFIG`FOES`FIELD`HP`LABEL: |-
        HP bonus
      DATA`CONFIG`FOES`FIELD`HP`DESCRIPTION: |-
        Added to five times the Might die plus twice the level, before the rank multiplies it.
      DATA`CONFIG`FOES`FIELD`MP`TYPE: |-
        integer
      DATA`CONFIG`FOES`FIELD`MP`DEFAULT: |-
        0
      DATA`CONFIG`FOES`FIELD`MP`MIN: |-
        -99
      DATA`CONFIG`FOES`FIELD`MP`MAX: |-
        999
      DATA`CONFIG`FOES`FIELD`MP`LABEL: |-
        MP bonus
      DATA`CONFIG`FOES`FIELD`MP`DESCRIPTION: |-
        Added to five times the Willpower die plus the level, before a champion doubles it.
      DATA`CONFIG`FOES`FIELD`DEF`TYPE: |-
        integer
      DATA`CONFIG`FOES`FIELD`DEF`DEFAULT: |-
        0
      DATA`CONFIG`FOES`FIELD`DEF`MIN: |-
        -10
      DATA`CONFIG`FOES`FIELD`DEF`MAX: |-
        20
      DATA`CONFIG`FOES`FIELD`DEF`LABEL: |-
        Defense bonus
      DATA`CONFIG`FOES`FIELD`DEF`DESCRIPTION: |-
        Added to its Dexterity die for its Defense.
      DATA`CONFIG`FOES`FIELD`MDEF`TYPE: |-
        integer
      DATA`CONFIG`FOES`FIELD`MDEF`DEFAULT: |-
        0
      DATA`CONFIG`FOES`FIELD`MDEF`MIN: |-
        -10
      DATA`CONFIG`FOES`FIELD`MDEF`MAX: |-
        20
      DATA`CONFIG`FOES`FIELD`MDEF`LABEL: |-
        Magic Defense bonus
      DATA`CONFIG`FOES`FIELD`MDEF`DESCRIPTION: |-
        Added to its Insight die for its Magic Defense.
      DATA`CONFIG`FOES`FIELD`INIT`TYPE: |-
        integer
      DATA`CONFIG`FOES`FIELD`INIT`DEFAULT: |-
        0
      DATA`CONFIG`FOES`FIELD`INIT`MIN: |-
        -10
      DATA`CONFIG`FOES`FIELD`INIT`MAX: |-
        20
      DATA`CONFIG`FOES`FIELD`INIT`LABEL: |-
        Initiative bonus
      DATA`CONFIG`FOES`FIELD`INIT`DESCRIPTION: |-
        Added to half its Dexterity and Insight dice, and an elite's or champion's rank, for its Initiative.
      DATA`CONFIG`FOES`FIELD`AFFINITIES`TYPE: |-
        list
      DATA`CONFIG`FOES`FIELD`AFFINITIES`MIN: |-
        0
      DATA`CONFIG`FOES`FIELD`AFFINITIES`PATTERN: |-
        ^(physical|air|bolt|dark|earth|fire|ice|light|poison):(vu|rs|im|ab)$
      DATA`CONFIG`FOES`FIELD`AFFINITIES`LABEL: |-
        Affinities
      DATA`CONFIG`FOES`FIELD`AFFINITIES`DESCRIPTION: |-
        <type>:<affinity> for each damage type it is vulnerable (vu), resistant (rs) or immune (im) to, or absorbs (ab), such as fire:vu ice:rs.
      DATA`CONFIG`FOES`FIELD`IMMUNE`TYPE: |-
        list
      DATA`CONFIG`FOES`FIELD`IMMUNE`MIN: |-
        0
      DATA`CONFIG`FOES`FIELD`IMMUNE`CHOICES: |-
        dazed enraged poisoned shaken slow weak
      DATA`CONFIG`FOES`FIELD`IMMUNE`LABEL: |-
        Status immunities
      DATA`CONFIG`FOES`FIELD`IMMUNE`DESCRIPTION: |-
        The status effects that never take hold on it.
      DATA`CONFIG`FOES`FIELD`ATTACKS`TYPE: |-
        text
      DATA`CONFIG`FOES`FIELD`ATTACKS`MAX: |-
        1000
      DATA`CONFIG`FOES`FIELD`ATTACKS`CHECK: |-
        CHECK`ATTACKS
      DATA`CONFIG`FOES`FIELD`ATTACKS`LABEL: |-
        Attacks
      DATA`CONFIG`FOES`FIELD`ATTACKS`DESCRIPTION: |-
        Its attacks, separated by semicolons, each <name>: <attribute>+<attribute> <accuracy> <damage> <type>, with magic at the end for one against Magic Defense. Such as Claw: dex+mig 0 5 physical.
      DATA`CONFIG`FOES`FIELD`NOTES`TYPE: |-
        text
      DATA`CONFIG`FOES`FIELD`NOTES`MAX: |-
        400
      DATA`CONFIG`FOES`FIELD`NOTES`LABEL: |-
        Notes
      DATA`CONFIG`FOES`FIELD`NOTES`DESCRIPTION: |-
        What the GM should know: how it fights, what it wants, what its skills do.
      DATA`CONFIG`FOES`FIELD`PICTURE`TYPE: |-
        text
      DATA`CONFIG`FOES`FIELD`PICTURE`MAX: |-
        400
      DATA`CONFIG`FOES`FIELD`PICTURE`CHECK: |-
        CHECK`PICTURE
      DATA`CONFIG`FOES`FIELD`PICTURE`LABEL: |-
        Picture
      DATA`CONFIG`FOES`FIELD`PICTURE`DESCRIPTION: |-
        The address of its picture on the battle screen, https:// or a site path such as /assets/foes/imp.png. A client that cannot show it gets the art, or the foe's name.
      DATA`CONFIG`FOES`FIELD`ART`TYPE: |-
        text
      DATA`CONFIG`FOES`FIELD`ART`MAX: |-
        400
      DATA`CONFIG`FOES`FIELD`ART`LABEL: |-
        Text art
      DATA`CONFIG`FOES`FIELD`ART`DESCRIPTION: |-
        What a client that cannot show pictures draws for it on the battle screen, lines separated by %r. Without it, that client gets the foe's name.
      CHECK`PICTURE: |-
        if(u(%!/FUN`IS`PICTURE,%0),,Give an address that starts with https:// or /%, with no spaces.)
      FUN`IS`PICTURE: |-
        cor(not(strlen(%0)),cand(not(strmatch(%0,* *)),cor(strmatch(%0,https://?*),cand(strmatch(%0,/?*),not(strmatch(%0,//*))))))
      CHECK`ATTACKS: |-
        if(cor(not(strlen(trim(%0))),every(%!/FUN`ATTACK`OK,%0,;)),,Write each attack as <name>: <attribute>+<attribute> <accuracy> <damage> <type>%, with magic at the end for one against Magic Defense%, and a semicolon between attacks. Such as Claw: dex+mig 0 5 physical.)

      # Which INC` routine each switch runs: DATA`ROUTE`<table>`<switch>. BARE is the command alone, ARG the
      # command with something after it and no switch.
      DATA`ROUTE: |-
        Which routine each switch runs. One leaf per switch.
      DATA`ROUTE`SHEET`BARE: |-
        SHEET`SHOW
      DATA`ROUTE`SHEET`ARG: |-
        SHEET`SHOW
      DATA`ROUTE`SHEET`SET: |-
        SHEET`SET
      DATA`ROUTE`SHEET`CLASS: |-
        SHEET`CLASS
      DATA`ROUTE`SHEET`SKILL: |-
        SHEET`SKILL
      DATA`ROUTE`SHEET`LEVELUP: |-
        SHEET`LEVELUP
      DATA`ROUTE`SHEET`RAISE: |-
        SHEET`RAISE
      DATA`ROUTE`SHEET`BONUS: |-
        SHEET`BONUS
      DATA`ROUTE`SHEET`BENEFIT: |-
        SHEET`BENEFIT
      DATA`ROUTE`SHEET`IDENTITY: |-
        SHEET`TRAIT
      DATA`ROUTE`SHEET`THEME: |-
        SHEET`TRAIT
      DATA`ROUTE`SHEET`ORIGIN: |-
        SHEET`TRAIT
      DATA`ROUTE`SHEET`HP: |-
        SHEET`METER
      DATA`ROUTE`SHEET`MP: |-
        SHEET`METER
      DATA`ROUTE`SHEET`IP: |-
        SHEET`METER
      DATA`ROUTE`SHEET`FP: |-
        SHEET`METER
      DATA`ROUTE`SHEET`AWARD: |-
        SHEET`AWARD
      DATA`ROUTE`SHEET`BUY: |-
        SHEET`BUY
      DATA`ROUTE`SHEET`STATUS: |-
        SHEET`STATUS
      DATA`ROUTE`SHEET`REST: |-
        SHEET`REST
      DATA`ROUTE`SHEET`BOND: |-
        SHEET`BOND
      DATA`ROUTE`SHEET`TRAITS: |-
        SHEET`TRAITS
      DATA`ROUTE`SHEET`LEDGER: |-
        SHEET`LEDGER
      DATA`ROUTE`SHEET`REVOKE: |-
        SHEET`REVOKE
      DATA`ROUTE`SHEET`CLEAR: |-
        SHEET`CLEAR
      DATA`ROUTE`SHEET`AFFINITY: |-
        SHEET`AFFINITY
      DATA`ROUTE`ENCOUNTER`BARE: |-
        ENC`SHOW
      DATA`ROUTE`ENCOUNTER`ARG: |-
        ENC`SHOW
      DATA`ROUTE`ENCOUNTER`START: |-
        ENC`START
      DATA`ROUTE`ENCOUNTER`JOIN: |-
        ENC`JOIN
      DATA`ROUTE`ENCOUNTER`ADD: |-
        ENC`ADD
      DATA`ROUTE`ENCOUNTER`REMOVE: |-
        ENC`REMOVE
      DATA`ROUTE`ENCOUNTER`USE: |-
        ENC`USE
      DATA`ROUTE`ENCOUNTER`LEAVE: |-
        ENC`LEAVE
      DATA`ROUTE`ENCOUNTER`KEEP: |-
        ENC`KEEP
      DATA`ROUTE`ENCOUNTER`END: |-
        ENC`END
      DATA`ROUTE`ENCOUNTER`FOE: |-
        ENC`FOE
      DATA`ROUTE`ENCOUNTER`BEGIN: |-
        ENC`BEGIN
      DATA`ROUTE`ENCOUNTER`TURN: |-
        ENC`TURN
      DATA`ROUTE`ENCOUNTER`GUARD: |-
        ENC`TURN
      DATA`ROUTE`ENCOUNTER`UNDO: |-
        ENC`UNDO
      DATA`ROUTE`ENCOUNTER`ROUND: |-
        ENC`ROUND
      DATA`ROUTE`ENCOUNTER`DAMAGE: |-
        ENC`DAMAGE
      DATA`ROUTE`ENCOUNTER`SURRENDER: |-
        ENC`SURRENDER
      DATA`ROUTE`ENCOUNTER`ENTRANCE: |-
        ENC`ENTRANCE
      DATA`ROUTE`ENCOUNTER`INITIATIVE: |-
        ENC`INITIATIVE
      DATA`ROUTE`ENCOUNTER`REWARD: |-
        ENC`REWARD
      DATA`ROUTE`ATTACK`BARE: |-
        ATTACK`USAGE
      DATA`ROUTE`ATTACK`ARG: |-
        ATTACK`ROLL
      DATA`ROUTE`ATTACK`MAGIC: |-
        ATTACK`ROLL
      DATA`ROUTE`ATTACK`DAMAGE: |-
        ATTACK`DAMAGE
      DATA`ROUTE`FOE`BARE: |-
        FOE`LIST
      DATA`ROUTE`FOE`ARG: |-
        FOE`SHOW
      DATA`ROUTE`FOE`ATTACK: |-
        FOE`ATTACK
      DATA`ROUTE`FOE`HP: |-
        FOE`METER
      DATA`ROUTE`FOE`MP: |-
        FOE`METER
      DATA`ROUTE`FOE`STATUS: |-
        FOE`STATUS
      DATA`ROUTE`FOE`ULTIMA: |-
        FOE`ULTIMA
      DATA`ROUTE`FOE`REMOVE: |-
        FOE`REMOVE
      DATA`ROUTE`FOE`PICTURE: |-
        FOE`PICTURE
      DATA`ROUTE`FOE`ART: |-
        FOE`ART
      DATA`ROUTE`CHECK`BARE: |-
        CHECK`USAGE
      DATA`ROUTE`CHECK`ARG: |-
        CHECK`ROLL
      DATA`ROUTE`CHECK`PRIVATE: |-
        CHECK`ROLL
      DATA`ROUTE`CHECK`INVOKE: |-
        CHECK`INVOKE
      DATA`ROUTE`CHECK`BOND: |-
        CHECK`BOND
      DATA`ROUTE`CHECK`SUPPORT: |-
        CHECK`SUPPORT
      DATA`ROUTE`CHECK`GROUP: |-
        CHECK`GROUP
      # The four attributes, in sheet order, and their names.
      DATA`ATTRS: |-
        DEX INS MIG WLP
      DATA`ATTR`DEX: |-
        Dexterity
      DATA`ATTR`INS: |-
        Insight
      DATA`ATTR`MIG: |-
        Might
      DATA`ATTR`WLP: |-
        Willpower
      DATA`SIZES: |-
        6 8 10 12
      # Every pair of attributes a check may roll, in sheet order.
      DATA`PAIRS: |-
        DEX+DEX DEX+INS DEX+MIG DEX+WLP INS+INS INS+MIG INS+WLP MIG+MIG MIG+WLP WLP+WLP
      DATA`DIFFICULTIES: |-
        trivial easy standard hard extreme
      # Status effects and the attributes each makes one die size smaller. They add up, down to d6.
      DATA`STATUSES: |-
        dazed enraged poisoned shaken slow weak
      DATA`STATUS`DAZED: |-
        INS
      DATA`STATUS`ENRAGED: |-
        DEX INS
      DATA`STATUS`POISONED: |-
        MIG WLP
      DATA`STATUS`SHAKEN: |-
        WLP
      DATA`STATUS`SLOW: |-
        DEX
      DATA`STATUS`WEAK: |-
        MIG
      # Bond emotions in their three opposed pairs: a bond holds at most one of each pair.
      DATA`EMOTIONS: |-
        admiration inferiority loyalty mistrust affection hatred
      DATA`BONDS`MOST: |-
        6
      DATA`TRAITS: |-
        IDENTITY THEME ORIGIN
      # The resources and their labels. HP, MP and IP run from 0 to a most worked out from the sheet and start
      # full, and FP starts at 3: each has a switch that changes it. Experience and zenit start at 0 and are the
      # sum of the ledger's xp and zenit entries (DATA`WALLET).
      DATA`METERS: |-
        HP MP IP FP XP ZENIT
      DATA`METER`HP: |-
        HP
      DATA`METER`MP: |-
        MP
      DATA`METER`IP: |-
        IP
      DATA`METER`FP: |-
        Fabula Points
      DATA`METER`XP: |-
        Experience
      DATA`METER`ZENIT: |-
        Zenit
      DATA`WALLET: |-
        XP ZENIT
      # The most one award, purchase or character holds.
      DATA`WALLET`MOST: |-
        999999
      DATA`LEVELUP`COST: |-
        10
      DATA`RAISE`LEVELS: |-
        20 40
      # Classes below level 10 a character may have at once.
      DATA`UNMASTERED`MOST: |-
        3
      # The defences and their labels. Defense is the Dexterity die now, or martial armour's Defense, plus its bonus;
      # Magic Defense the Insight die now plus its bonus; Initiative its bonus alone.
      DATA`DEFENSES: |-
        DEF MDEF INIT
      DATA`DEFENSE`DEF: |-
        Defense
      DATA`DEFENSE`MDEF: |-
        Magic Defense
      DATA`DEFENSE`INIT: |-
        Initiative
      # What +sheet/bonus takes. HP, MP and IP add to the most, from skills; DEF, MDEF and INIT add to a defence and
      # MARTIAL is martial armour's Defense, from equipment.
      DATA`BONUSES: |-
        HP MP IP DEF MDEF INIT MARTIAL
      DATA`BONUSES`SKILL: |-
        HP MP IP
      # The Difficulty Level of a check that supports someone's group check.
      DATA`SUPPORT`DL: |-
        10
      # The ledger: at most this many entries on one sheet, and the kinds a chargen edit rewrites in place.
      DATA`LEDGER`MOST: |-
        200
      # Experience and zenit each have a ledger of their own, apart from the build's: the tree under FABULA`, how
      # many entries one sheet holds, and how many of each +sheet/ledger shows at once.
      DATA`TREE`XP: |-
        EXPERIENCE
      DATA`TREE`ZENIT: |-
        MONEY
      DATA`PURSE`MOST: |-
        1000
      DATA`PURSE`PAGE: |-
        50
      DATA`LEDGER`KINDS: |-
        die class skill benefit
      DATA`BONUSES`EQUIPMENT: |-
        DEF MDEF INIT MARTIAL
      # What an encounter copies, under FABULA`: the rest of the sheet stays live.
      DATA`COPY: |-
        METER`HP METER`MP METER`IP STATUS

      # ---- conflicts: data ----------------------------------------------------------
      # Damage types, and the affinities a creature may have to one: vulnerable (twice the damage), resistant (half,
      # rounded down), immune (none) and absorbs (heals it instead).
      DATA`DAMAGE: |-
        physical air bolt dark earth fire ice light poison
      DATA`AFFINITIES: |-
        vu rs im ab
      DATA`AFFINITY`VU: |-
        vulnerable
      DATA`AFFINITY`RS: |-
        resistant
      DATA`AFFINITY`IM: |-
        immune
      DATA`AFFINITY`AB: |-
        absorbent
      # A foe's role sets its four attribute dice, DEX INS MIG WLP, for its level: one set from level 5, then at levels
      # 20, 40 and 60.
      DATA`ROLES: |-
        brute hunter mage saboteur sentinel support
      DATA`ROLE`BRUTE: |-
        8 6 10 8|8 8 10 8|8 8 12 8|8 8 12 10
      DATA`ROLE`HUNTER: |-
        10 8 8 6|10 8 8 8|12 8 8 8|12 10 8 8
      DATA`ROLE`MAGE: |-
        8 8 6 10|8 10 6 10|8 10 6 12|8 10 8 12
      DATA`ROLE`SABOTEUR: |-
        8 8 8 8|8 8 8 10|8 10 8 10|10 10 8 10
      DATA`ROLE`SENTINEL: |-
        8 8 8 8|8 8 10 8|8 8 10 10|10 8 10 10
      DATA`ROLE`SUPPORT: |-
        8 8 6 10|8 10 6 10|8 10 8 10|8 12 8 10
      # The Ultima Points each kind of villain starts an encounter with.
      DATA`VILLAIN`MINOR: |-
        5
      DATA`VILLAIN`MAJOR: |-
        10
      DATA`VILLAIN`SUPREME: |-
        15
      DATA`VILLAINS: |-
        minor major supreme
      # The most foes one encounter holds, and the MP an Ultima Point's recovery gives back.
      DATA`FOES`MOST: |-
        30
      DATA`ULTIMA`MP: |-
        50

      # ---- commands ---------------------------------------------------------------
      # %1 the switches and %2 what follows, exactly as typed.
      CMD`SHEET:
        value: |-
          $(?is)^\+sheet(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,sheet,table,SHEET,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`CHECK:
        value: |-
          $(?is)^\+check(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,check,table,CHECK,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`ENCOUNTER:
        value: |-
          $(?is)^\+encounter(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,encounter,table,ENCOUNTER,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`ATTACK:
        value: |-
          $(?is)^\+attack(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,attack,table,ATTACK,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`FOE:
        value: |-
          $(?is)^\+foe(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,foe,table,FOE,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      # A line a bridge adds to one of this object's messages: HINT`<message>, set here by a bridge such as
      # sheet-fabula-help. %1 on are passed to it. Nothing when no bridge set one, so the message stands without it.
      FUN`HINT:
        value: |-
          if(hasattr(%!,HINT`%0),%b[u(%!/HINT`%0,%1,%2)])
        flags: [funsyntax]
      INC`COMMAND`RUN:
        value: |-
          @assert hastype(%#,player)=@pemit %#=notice(SHEET,Only players have a sheet.,warn); think u(%!/FUN`COMMAND`PARSE,%<word>,%<table>,%<switches>,%<argument>); @assert lte(words(%q<cmd_switch_list>),1)=@pemit %#=notice(SHEET,Use one switch at a time.,warn); @assert strlen(%q<cmd_route>)=@pemit %#=notice(SHEET,+%q<cmd_word> has no /%q<cmd_switch> switch.[u(%!/FUN`HINT,SWITCHES,%q<cmd_word>)],warn); @include %!/INC`%q<cmd_route>
        flags: [cmdsyntax]
      # %0 the word, %1 its route table, %2 the switches and %3 the argument, as typed. Sets cmd_word,
      # cmd_switch_list, cmd_switch, cmd_argument, cmd_has_equals, cmd_left_side and cmd_right_side around the
      # first =, cmd_route (the INC` routine to run), viewer_objid, viewer_keeper, and state_copy: the commands read
      # and write a character's encounter copy (FUN`STATE`AT), where the API, which Duties calls, uses the live sheet.
      FUN`COMMAND`PARSE:
        value: |-
          setqm(cmd_word,lcstr(%0),
          cmd_switch_list,lcstr(trim(edit(%2,/,%b))),
          cmd_switch,first(%q<cmd_switch_list>),
          cmd_argument,trim(%3),
          cmd_has_equals,strmatch(%3,*=*),
          cmd_left_side,trim(before(%3,=)),
          cmd_right_side,trim(after(%3,=)),
          cmd_route,get(%!/DATA`ROUTE`%1`[if(strlen(%q<cmd_switch>),ucstr(%q<cmd_switch>),if(strlen(%q<cmd_argument>),ARG,BARE))]),
          viewer_objid,objid(%#),
          viewer_keeper,u(%!/FUN`PERM`KEEPER,%#),
          state_copy,1)
        flags: [funsyntax]

      # ---- guards -----------------------------------------------------------------
      # %0 a player's name, or nothing for the one typing; %1 what follows it. Sets sheet_named, sheet_who (an objid,
      # or nothing when no player has that name) and sheet_what. The guards below then refuse what may not go on.
      FUN`WHO`READ:
        value: |-
          setqm(sheet_named,trim(%0),sheet_who,if(strlen(trim(%0)),u(%!/FUN`PLAYER`MATCH,trim(%0)),%q<viewer_objid>),sheet_what,trim(%1))
        flags: [funsyntax]
      # %<text>: <name>/<what> for a sheet keeper, else <what> on your own sheet.
      INC`NEED`WHO:
        value: |-
          think u(%!/FUN`WHO`READ,if(strmatch(%<text>,*/*),before(%<text>,/)),if(strmatch(%<text>,*/*),after(%<text>,/),%<text>)); @include %!/INC`NEED`WHOOK
        flags: [cmdsyntax]
      # The resources' form: <name>=<what> for a sheet keeper, else <what> on your own sheet.
      INC`NEED`WHOEQ:
        value: |-
          think u(%!/FUN`WHO`READ,if(%q<cmd_has_equals>,%q<cmd_left_side>),if(%q<cmd_has_equals>,%q<cmd_right_side>,%q<cmd_argument>)); @include %!/INC`NEED`WHOOK
        flags: [cmdsyntax]
      INC`NEED`FOUND:
        value: |-
          @assert strlen(%q<sheet_who>)=@pemit %#=notice(SHEET,There is no player called '%q<sheet_named>'.,warn)
        flags: [cmdsyntax]
      # state_gm 1 lets the GM of the character's encounter through as well, for the copied HP, MP, IP and status.
      INC`NEED`WHOOK:
        value: |-
          @include %!/INC`NEED`FOUND; @assert cor(%q<viewer_keeper>,not(comp(%q<sheet_who>,%q<viewer_objid>)),cand(%q<state_gm>,strlen(setr(gm_enc,u(%!/FUN`ENC`OF,%q<sheet_who>))),u(%!/FUN`ENC`GM,%#,%q<gm_enc>)))=@pemit %#=notice(SHEET,Only sheet keepers change another character's sheet[if(%q<state_gm>,%, and an encounter's GM its characters' copies)].,error)
        flags: [cmdsyntax]
      # Changes only a keeper makes once a character is approved: attributes and classes.
      INC`NEED`EDITABLE:
        value: |-
          @assert cor(%q<viewer_keeper>,not(isapproved(%#)))=@pemit %#=notice(SHEET,Your character is approved%, so staff change that part of your sheet now.,error); @include %!/INC`NEED`UNGATED
        flags: [cmdsyntax]
      # A bridge's reason a player may not change their own sheet now, such as an application with staff.
      INC`NEED`UNGATED:
        value: |-
          @assert cor(%q<viewer_keeper>,not(strlen(setr(set_gate,u(%!/FUN`GATE`EDIT,%#)))))=@pemit %#=notice(SHEET,%q<set_gate>,warn)
        flags: [cmdsyntax]
      # %<key> typed text: attr_key, the attribute it names.
      INC`NEED`ATTR:
        value: |-
          @assert strlen(setr(attr_key,u(%!/FUN`ATTR`FIND,%<key>)))=@pemit %#=notice(SHEET,There is no attribute '%<key>'. Give [itemize(lcstr(v(DATA`ATTRS)),,or)].,warn)
        flags: [cmdsyntax]
      # %<key> typed text: class_key, the class it names.
      INC`NEED`CLASS:
        value: |-
          @assert strlen(setr(class_key,u(%!/FUN`LIST`FIND,CLASS,%<key>)))=@pemit %#=notice(SHEET,There is no class '%<key>'. +sheet/traits lists them.,warn)
        flags: [cmdsyntax]

      # ---- +sheet -----------------------------------------------------------------
      INC`SHEET`SHOW:
        value: |-
          think u(%!/FUN`WHO`READ,%q<cmd_argument>,); @include %!/INC`NEED`FOUND; @assert u(%!/FUN`PERM`VIEW,%#,%q<sheet_who>)=@pemit %#=notice(SHEET,Only [name(%q<sheet_who>)] and staff can read [poss(%q<sheet_who>)] sheet.,error); @pemit %#=u(%!/FUN`SCREEN`SHEET,%q<sheet_who>,%#)
        flags: [cmdsyntax]
      # +sheet/set [<name>/]<attribute>=<die>: 6 8 10 or 12, with or without the d. Empty puts it back to d8.
      INC`SHEET`SET:
        value: |-
          @assert %q<cmd_has_equals>=@pemit %#=notice(SHEET,+sheet/set <attribute>=<die>%, such as +sheet/set dex=d10.,warn); @include/args %!/INC`NEED`WHO=text,%q<cmd_left_side>; @include %!/INC`NEED`EDITABLE; @include/args %!/INC`NEED`ATTR=key,%q<sheet_what>; think setq(set_size,u(%!/FUN`SIZE`READ,firstof(%q<cmd_right_side>,8))); @assert u(%!/FUN`IS`SIZE,%q<set_size>)=@pemit %#=notice(SHEET,An attribute is d6%, d8%, d10 or d12.,warn); think setqm(lp_who,%q<sheet_who>,lp_kind,die,lp_key,%q<attr_key>,lp_to,%q<set_size>,lp_now,u(%!/FUN`ATTR`BASE,%q<sheet_who>,%q<attr_key>),lp_class,,lp_name,,lp_source,); @include %!/INC`LEDGER`PUT; @pemit %#=notice(SHEET,[v(DATA`ATTR`%q<attr_key>)] is d[u(%!/FUN`ATTR`BASE,%q<sheet_who>,%q<attr_key>)] on [name(%q<sheet_who>)]'s sheet.[if(not(u(%!/FUN`SPREAD`OK,%q<sheet_who>)),%b[u(%!/FUN`SPREAD`WARN,%q<sheet_who>)])][if(not(comp(%q<sheet_who>,%q<viewer_objid>)),u(%!/FUN`HINT,SET))],ok)
        flags: [cmdsyntax]
      # +sheet/benefit [<name>/]<class>=<hp|mp>: for a class whose first level gives +5 HP or MP, which one. A player
      # picks once; after approval only staff change a pick. A ledger
      # entry, 1 for HP and 3 for MP, so a change after approval (2 or -2) reads apart from
      # either; FABULA`BENEFIT`<KEY> holds the sum.
      INC`SHEET`BENEFIT:
        value: |-
          @assert %q<cmd_has_equals>=@pemit %#=notice(SHEET,+sheet/benefit <class>=hp or =mp picks what a class's first level adds 5 to%, for the classes that let you choose: [itemize(iter(u(%!/FUN`CLASS`EITHER),u(%!/FUN`LIST`LABEL,CLASS,%i0),%b,|),|)].,warn); @include/args %!/INC`NEED`WHO=text,%q<cmd_left_side>; @include/args %!/INC`NEED`CLASS=key,%q<sheet_what>; @include %!/INC`SHEET`BENEFIT`CHECK; think setqm(lp_who,%q<sheet_who>,lp_kind,benefit,lp_key,%q<class_key>,lp_to,%q<benefit_to>,lp_now,default(%q<sheet_who>/FABULA`BENEFIT`%q<class_key>,0),lp_class,,lp_name,,lp_source,); @include %!/INC`LEDGER`PUT; @pemit %#=notice(SHEET,[u(%!/FUN`LIST`LABEL,CLASS,%q<class_key>)] adds 5 to [name(%q<sheet_who>)]'s maximum [if(eq(%q<benefit_to>,1),HP,MP)][if(not(u(%!/FUN`CLASS`LEVEL,%q<sheet_who>,%q<class_key>)),%bwhen [name(%q<sheet_who>)] has a level in it)].[if(not(comp(%q<sheet_who>,%q<viewer_objid>)),u(%!/FUN`HINT,SET))],ok)
        flags: [cmdsyntax]
      # Refuses changing a benefit already chosen after approval, or on a class that has no choice, and reads hp or mp
      # into benefit_to.
      INC`SHEET`BENEFIT`CHECK:
        value: |-
          @assert cor(%q<viewer_keeper>,not(isapproved(%#)),not(match(1 3,default(%q<sheet_who>/FABULA`BENEFIT`%q<class_key>,0))))=@pemit %#=notice(SHEET,Your character is approved and has picked for [u(%!/FUN`LIST`LABEL,CLASS,%q<class_key>)]%, so staff change it now.,error); @include %!/INC`NEED`UNGATED; @assert strmatch(get({{store}}/CLASS`%q<class_key>`BENEFIT),either)=@pemit %#=notice(SHEET,[u(%!/FUN`LIST`LABEL,CLASS,%q<class_key>)] gives [firstof(u(%!/FUN`CLASS`GIVES,%q<class_key>),nothing)] with no choice to make.,warn); think setq(benefit_to,extract(1 3,match(hp mp,trim(%q<cmd_right_side>)),1)); @assert strlen(%q<benefit_to>)=@pemit %#=notice(SHEET,Give hp or mp.,warn)
        flags: [cmdsyntax]
      # +sheet/class [<name>/]<class>=<levels>: a class's level while the sheet is being filled in, 0 taking it off.
      # A player's classes add up to the starting level at most; a keeper's to the highest level.
      INC`SHEET`CLASS:
        value: |-
          @assert %q<cmd_has_equals>=@pemit %#=notice(SHEET,+sheet/class <class>=<levels>%, such as +sheet/class guardian=3. Your classes share [get(%!/DATA`CONFIG`START)] levels.,warn); @include/args %!/INC`NEED`WHO=text,%q<cmd_left_side>; @include %!/INC`NEED`EDITABLE; @include/args %!/INC`NEED`CLASS=key,%q<sheet_what>; @include %!/INC`SHEET`CLASS`CHECK; think setqm(lp_who,%q<sheet_who>,lp_kind,class,lp_key,%q<class_key>,lp_to,%q<class_levels>,lp_now,%q<class_old>,lp_class,,lp_name,,lp_source,); @include %!/INC`LEDGER`PUT; @pemit %#=notice(SHEET,[if(%q<class_levels>,[u(%!/FUN`LIST`LABEL,CLASS,%q<class_key>)] is level %q<class_levels> on [name(%q<sheet_who>)]'s sheet,[name(%q<sheet_who>)] no longer has [u(%!/FUN`LIST`LABEL,CLASS,%q<class_key>)])]: level %q<class_total> in all.[if(cand(%q<class_levels>,strmatch(get({{store}}/CLASS`%q<class_key>`BENEFIT),either),not(match(1 3,default(%q<sheet_who>/FABULA`BENEFIT`%q<class_key>,0)))),%b[u(%!/FUN`LIST`LABEL,CLASS,%q<class_key>)] adds 5 to HP or MP: pick one with +sheet/benefit [lcstr(%q<class_key>)]=hp or =mp.)][if(not(comp(%q<sheet_who>,%q<viewer_objid>)),u(%!/FUN`HINT,SET))],ok)
        flags: [cmdsyntax]
      # Reads the levels into class_levels and class_old, and refuses a count out of range, too many unmastered
      # classes, fewer levels than the skills spent, losing a heroic skill's mastery, or a total over the highest
      # level.
