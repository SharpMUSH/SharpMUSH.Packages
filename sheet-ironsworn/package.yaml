  # The encounters running now. Inside the Ironsworn Sheet and no_command, like the store. ENC`<n> is one
  # encounter, with ROOM, GM, STARTED and COPY`<dbref number> (one member's copy: STATS, ASSETS, METER`<KEY> and
  # COMPANION`<ASSET> beneath) under it.
  - ref: encounters
    type: thing
    name: Ironsworn Encounters
    location: "{{sheet}}"
    flags: [no_command]
    attributes:
      ENC: |-
        The encounters running now, one branch each.

  # The +help topics, on an object of their own. sheet-ironsworn-help registers it with +help; without that
  # bridge nothing reads it. HELP`<TOPIC> is a topic, its subtopics the leaves beneath, LOCK`<TOPIC> who may read it.
  - ref: sheet_help
    type: thing
    name: Ironsworn Sheet Help
    location: "{{sheet}}"
    attributes:
      HELP: |-
        Your character's Ironsworn sheet, action rolls, iron vows and encounters: +sheet, +check, +vow and +encounter.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`SHEET: |-
        check vow encounter
      SEE`CHECK: |-
        sheet vow encounter
      SEE`VOW: |-
        sheet check
      SEE`ENCOUNTER: |-
        sheet check foe
      SEE`FOE: |-
        encounter vow
      HELP`SHEET: |-
        `+sheet` shows your character's sheet: five stats, Edge, Heart, Iron, Shadow and Wits, the meters, experience, assets and vows.

        - `+sheet` shows your own; `+sheet <name>` another character's, when the game lets you read it.
        - `+sheet/chargen` shows the steps of making your character and what to do next.
        - `+sheet/traits` lists the stats; `+sheet/assets` lists the assets.
        - `+sheet/ledger` lists every entry your stats and assets are built from, oldest first.
        - `+sheet/log` shows your experience ledger, every change with who made it and why.

        Your stats and assets are built from the ledger: each value you give and each asset you take is an entry. Once you are approved, `+sheet/asset` and `+sheet/upgrade` spend experience and staff make other changes.

        For example:

        `+sheet/chargen`

        Output: `1. Stats to do: 2 of 5 given: Iron 3 and Heart 2. Left to give: 2, 1 and 1.`

        See `+help sheet chargen` for making a character, `+help sheet assets` for assets and experience, `+help sheet play` for the meters and `+help check` for rolling.
      HELP`SHEET`CHARGEN: |-
        Making a character takes three steps. `+sheet/chargen` shows how far you are.

        1. Stats: give your stats 3, 2, 2, 1 and 1, one value each, unless your game changed that. `+sheet/set <stat>=<value>`: `+sheet/set iron=3`. `+sheet/set <stat>=` frees the value.
        2. Assets: take three, unless your game changed that, each with its first ability marked. `+sheet/asset <asset>`: `+sheet/asset hound`. `+sheet/asset <asset>=remove` gives one back.
        3. A background vow: an extreme or epic vow that drives your character. `+vow/swear <vow>=epic`.

        `+sheet/assets` lists the assets and `+sheet/assets <asset>` shows one's abilities.

        For example:

        `+sheet/set heart=2`

        Output: `\[SHEET\] Done: Heart is 2 on Alice's sheet. Next: +sheet/set <stat>=<value>. Left to give: 2, 1 and 1.`

        When every step is done, your sheet is complete. Once you are approved, staff change your stats.
      HELP`SHEET`ASSETS: |-
        An asset is a companion, a path, a combat talent or a ritual, with three abilities. Taking it marks the first; upgrades mark the second and third.

        - `+sheet/assets` lists them; `+sheet/assets <asset>` shows one's abilities and which you have marked.
        - `+sheet/asset <asset>` takes a new asset. Once you are approved it costs 3 experience, unless your game changed that.
        - `+sheet/upgrade <asset>` marks its next ability for 2 experience.
        - `+sheet/log` shows your experience ledger.

        You mark experience when you fulfil a vow, and staff give it. A companion has health of its own: see `+help sheet play`.

        For example:

        `+sheet/upgrade hound`

        Output: `\[SHEET\] Done: Alice marks the second ability of Hound (2 experience spent): Fierce: when you fight beside your hound and score a hit, inflict +1 harm.`
      HELP`SHEET`PLAY: |-
        In play you keep your own meters:

        - `+sheet/health`, `/spirit` and `/supply` run from 0 to 5 and start at 5.
        - `+sheet/momentum` runs from -6 to +10 and starts at +2.

        Each takes `+<n>`, `-<n>`, `<n>`, or `reset` to go back to where it starts: `+sheet/health -2`, `+sheet/momentum reset`.

        A companion asset has health of its own, up to the most its asset gives: `+sheet/companion <asset>=-1` hurts it, `+<n>` heals it, `reset` puts it back to its most. At 0 it is out of action.

        In an encounter, the meters and companions change your copy there. See `+help encounter`.

        For example:

        `+sheet/momentum +2`

        Output: `\[SHEET\] Done: Alice's momentum is +4.`
      HELP`CHECK: |-
        `+check <stat>` makes an action roll where the room sees it: a six-sided die plus the stat is the action score, no more than 10, against two ten-sided challenge dice.

        - `+check <stat>+<n>` or `-<n>` adds or takes from the action score, such as +1 from an asset: `+check iron+1`.
        - `+check <stat>=<difficulty>`: trivial adds 2, easy 1, standard nothing, hard takes 1 and extreme 2.
        - `/private` rolls where only you see it.

        Beating both challenge dice is a strong hit, one a weak hit, neither a miss; a tie goes to the die. Both challenge dice the same is a match. In an encounter, your copy's stats roll. Every check is kept under a number that `rollinfo()` reads back.

        For example:

        `+check iron+1`

        Output: `\[SHEET\] Alice rolls Iron: 1d6\[4\] + 4 = 8 vs 5 and 9: a weak hit (roll 42)`
      HELP`VOW: |-
        An iron vow is a promise your character swears, with a progress track of ten boxes. Vows stay on your sheet, whatever encounter you are in.

        - `+vow` lists your vows; `+vow <name>` another character's, when the game lets you read it.
        - `+vow/swear <vow>=<rank>` swears one: troublesome, dangerous, formidable, extreme or epic.
        - `+vow/mark <vow>` marks progress by its rank: three boxes for troublesome, two for dangerous, one for formidable, two ticks for extreme and one for epic. `=<n>` marks n times; below 0 takes it off.
        - `+vow/fulfil <vow>` makes the progress roll: the full boxes against two ten-sided dice. A strong hit fulfils it and marks experience, 1 for troublesome up to 5 for epic; a weak hit fulfils it for one less. A miss leaves it sworn.
        - `+vow/forsake <vow>` takes it off.

        For example:

        `+vow/swear Find my brother=dangerous`

        Output: `\[VOW\] Alice swears an iron vow: Find my brother (dangerous).`
      HELP`ENCOUNTER: |-
        An encounter is a scene played from copies of the sheets, so health, spirit, supply, momentum and companions' health in it stay there. It lasts until its GM ends it, over as many days as it takes.

        - `+encounter` lists the encounters here and yours; `+encounter <n>` shows one.
        - `+encounter/start [<title>]` starts one in your room. You run it.
        - `+encounter/join [<n>]` takes part with a copy of your sheet as it is now.
        - `+encounter/leave [<n>]` comes out; your copy there is gone.
        - `+encounter/use <n>` picks which copy you roll from, when you are in more than one here.

        While you are in an encounter's room, `+check`, the meters and `+sheet/companion` use your copy in it. Anywhere else, your sheet.

        For example:

        `+encounter/join 1`

        Output: `\[ENCOUNTER\] Alice joins 1 (Ambush at the ford).`

        See `+help encounter gm` for running one and `+help foe` for foes.
      HELP`ENCOUNTER`GM: |-
        Whoever starts an encounter runs it; sheet keepers run any. Give the number after `=` when the room has more than one.

        - `+encounter/add <name>[=<n>]` brings someone in the room into it, with a copy of their sheet.
        - `+encounter/remove <name>[=<n>]` takes them out; their copy goes.
        - `+encounter/keep <name>[=<n>]` writes their meters and companions' health from the copy to their sheet.
        - `+encounter/end [<n>]` ends it. Every copy goes, and nothing is written back unless you kept it first.

        While a member plays from your encounter's copy, you change it: `+sheet/health <name>=-<n>`, the other meters the same way, and `+sheet/companion <name>/<asset>=-<n>`.

        For example:

        `+encounter/keep Alice=1`

        Output: `\[ENCOUNTER\] Done: Alice's sheet keeps the meters and companions from 1 (Ambush at the ford).`
      HELP`FOE: |-
        Foes are the GM's side of an encounter, added from the game's bestiary. Each is numbered, so two wolves are Wolf 1 and Wolf 2, and each has a rank and a progress track of ten boxes, as a vow does.

        - `+foe` lists the foes in the encounter here; `+foe <foe>` shows one, with its features, drives and tactics. Name it by its number or its name.
        - `+foe/bestiary` lists what the GM can add; `+foe/bestiary <kind>` shows one.
        - `+foe/mark <foe>` marks progress when you strike or gain ground: three boxes for troublesome, two for dangerous, one for formidable, two ticks for extreme and one for epic. `=<n>` marks n times; below 0 takes it off.
        - `+foe/end <foe>` makes the progress roll to end the fight: a strong hit beats it, a weak hit beats it at a cost the GM names, a miss turns the fight against you.
        - `+encounter/initiative [=yes|no]` says whether you have the initiative.

        The members of an encounter and its GM mark progress and end fights. Foes go when the encounter ends.

        For example:

        `+foe/mark wolf 2`

        Output: `\[ENCOUNTER\] Alice marks progress against Wolf 2: \[##........\] 2/10.`

        See `+help foe gm` for running them.
      HELP`FOE`GM: |-
        The GM of an encounter, or a sheet keeper, runs its foes:

        - `+foe/add <kind>[=<count>]` adds foes from the bestiary: `+foe/add wolf=2`. `+foe/remove <foe>` takes one out.
        - `+foe/harm <foe>=<name>[/<harm>]` deals harm off that member's copy: by the foe's rank, 1 for troublesome up to 5 for epic, or the harm given. The member endures it with `+check`.
        - `+encounter/initiative <name>=yes|no` gives a member the initiative or puts them in a bad spot.
        - `+foe/run <n>` picks which encounter your `+foe` commands use, when the room has several.

        A beaten foe deals no harm and takes no more progress.

        For example:

        `+foe/harm wolf 2=Alice`

        Output: `\[ENCOUNTER\] Wolf 2 deals Alice 2 harm: Alice's health is 3 of 5. Endure harm with +check.`
      HELP`SHEET`CREDITS: |-
        This sheet is based on Ironsworn, created by Shawn Tomkin, and licensed for our use under the Creative Commons Attribution 4.0 International License \(https://creativecommons.org/licenses/by/4.0/\). It is not an official Ironsworn product.

        The starting assets are written in this package's own words.
      LOCK`SHEET`STAFF: |-
        perm^softcode.ironsworn.admin
      HELP`SHEET`STAFF: |-
        Sheet keepers \(`softcode.ironsworn.admin`, or the Ironsworn Sheet Keeper role\) read every sheet and change any character's at any time:

        - `/set`, `/asset`, `/upgrade` and `/companion` take `<name>/` first: `+sheet/set Alice/iron=4`. A keeper sets a stat from 1 to 5, and gives assets and abilities without experience. `+sheet/asset <name>/<asset>=remove` takes one away.
        - The meters take `<name>=` first: `+sheet/health Alice=-2`.
        - `+sheet/xp <name>=+<n> [<reason>]` gives experience, `-<n>` takes, `<n>` sets: `+sheet/xp Alice=+2 Saved the village`.
        - `+sheet/log <name>` shows their experience ledger; `+sheet/rebuild <name>` works their experience out again from it.
        - The `+vow` switches take `<name>/` first: `+vow/mark Alice/Find my brother`.
        - `+sheet/revoke <name>/<n>` takes back one ledger entry; `+sheet/clear <name>` revokes them all, and character creation starts again.
        - Keepers run any encounter.

        `@role/assign <player>=ironsworn-sheet-keeper` makes someone a keeper.
      LOCK`SHEET`SETTINGS: |-
        perm^config.admin
      HELP`SHEET`SETTINGS: |-
        `+config ironsworn` lists the settings and `+config ironsworn/<setting>=<value>` changes one \(`config.admin`\):

        - `array`: the values a new character gives their stats \(`3 2 2 1 1`\).
        - `starting`: how many assets a new character takes \(3\).
        - `newasset`: the experience a new asset costs \(3\). `upgrade`: the experience each ability after the first costs \(2\).
        - `adds`: what trivial, easy, standard, hard and extreme add to the action score \(`2 1 0 -1 -2`\).
        - `public`: whether anyone may read anyone's sheet and vows \(no\).
        - `stats`: the stat list. `+config/add ironsworn/stats/luck=Luck` adds one.
        - `foes`: the bestiary. `+config/add ironsworn/foes/boar=Boar` adds a foe; set its `rank`, `nature`, `features`, `drives` and `tactics`.
        - `assets`: the asset list, each with `type` \(companion, path, talent or ritual\), `health` for a companion, and `first`, `second` and `third` abilities. `+config/add ironsworn/assets/raven=Raven` adds one.

        Removing a stat or an asset leaves what characters had stored, but the sheet stops showing it.
