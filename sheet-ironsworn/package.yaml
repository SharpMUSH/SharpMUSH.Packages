      FUN`CHARGEN`NEXT:
        value: |-
          switch(u(%!/FUN`CHARGEN`STEP,%0),stats,Next: +sheet/set <stat>=<value>. [u(%!/FUN`DISPLAY`ARRAYLEFT,iter(%q<chargen_stats>,after(%i0,=)))],assets,Next: +sheet/asset <asset>%, [sub(get(%!/DATA`CONFIG`STARTING),words(%q<chargen_assets>))] more. +sheet/assets lists them.,vow,Next: swear a background vow%, +vow/swear <vow>=epic.,Your sheet is complete.[u(%!/FUN`HINT,CHARGEN)])
        flags: [funsyntax]

      # ---- who may do what ----------------------------------------------------------
      FUN`PERM`KEEPER:
        value: |-
          permission(%0,softcode.ironsworn.admin)
        flags: [funsyntax]
      # %0 who asks, %1 whose sheet: 1 when they may read it. ALLOW`VIEW`<name>, which a bridge adds, may let
      # more people read it.
      FUN`PERM`VIEW:
        value: |-
          cor(not(comp(objid(%0),%1)),u(%!/FUN`PERM`KEEPER,%0),get(%!/DATA`CONFIG`PUBLIC),words(filterbool(%!/FUN`PERM`ALLOWS,lattr(%!/ALLOW`VIEW`*),,,%0,%1)))
        flags: [funsyntax]
      FUN`PERM`ALLOWS:
        value: |-
          u(%!/%0,%1,%2)
        flags: [funsyntax]
      # %0 who asks, %1 a character: 1 when %0 runs the encounter whose copy %1 plays from, and is not %1.
      FUN`PERM`RUNS:
        value: |-
          setq(runs_n,u(%!/FUN`ENC`ACTIVE,%1))[cand(comp(objid(%0),%1),strlen(%q<runs_n>),u(%!/FUN`ENC`GM,%0,%q<runs_n>))]
        flags: [funsyntax]
      FUN`GATE`EDIT:
        value: |-
          if(hasattr(%!,GATE`EDIT),u(%!/GATE`EDIT,%0))
        flags: [funsyntax]
      FUN`PLAYER`MATCH:
        value: |-
          if(isdbref(setr(found_player,pmatch(%0))),objid(%q<found_player>))
        flags: [funsyntax]

      # ---- experience ----------------------------------------------------------------
      # %0 a character, %1 experience to give (or take, below 0), %2 why: an experience ledger entry, never below
      # 0; returns what they have now.
      FUN`XP`ADD:
        value: |-
          setqm(xpadd_old,default(%0/IRONSWORN`XP,0),
          xpadd_new,max(0,add(%q<xpadd_old>,%1)))[u(%!/FUN`BOOK`ADD,%0,XP,sub(%q<xpadd_new>,%q<xpadd_old>),%2)]%q<xpadd_new>
        flags: [funsyntax]
      # ---- foes ---------------------------------------------------------------------------
      # %0 someone: the encounter here their +foe commands use, or #-1 and why.
      FUN`FOE`ENC:
        value: |-
          setqm(fe_here,u(%!/FUN`ENC`HERE,%0),fe_run,get({{encounters}}/RUN`[after(num(%0),#)]))[setq(fe_gm,squish(iter(%q<fe_here>,if(not(comp(get({{encounters}}/ENC`%i0`GM),objid(%0))),%i0))))][setq(fe_active,u(%!/FUN`ENC`ACTIVE,%0))][cond(not(words(%q<fe_here>)),#-1 There is no encounter here. +encounter/start begins one.,eq(words(%q<fe_here>),1),%q<fe_here>,member(%q<fe_here>,%q<fe_run>),%q<fe_run>,eq(words(%q<fe_gm>),1),%q<fe_gm>,strlen(%q<fe_active>),%q<fe_active>,#-1 There are several encounters here. +foe/run <n> picks the one your +foe commands use.)]
        flags: [funsyntax]
      # %0 an encounter: its foes' numbers.
      FUN`FOE`NUMS:
        value: |-
          sort(iter(lattr({{encounters}}/ENC`%0`FOE`*),last(%i0,`)),n)
        flags: [funsyntax]
      # %0 an encounter, %1 a foe, %2 a field.
      FUN`FOE`GET:
        value: |-
          json_query(get({{encounters}}/ENC`%0`FOE`%1),extract,$.%2)
        flags: [funsyntax]
      # %0 an encounter, %1 a foe, %2 a field, %3 its value as JSON.
      FUN`FOE`SET:
        value: |-
          attrib_set({{encounters}}/ENC`%0`FOE`%1,json_mod(get({{encounters}}/ENC`%0`FOE`%1),patch,json(object,%2,%3)))
        flags: [funsyntax]
      FUN`FOE`LABEL:
        value: |-
          u(%!/FUN`FOE`GET,%0,%1,label)
        flags: [funsyntax]
      # %0 an encounter, %1 what was typed: the foe with that number, else the ones with that name, else the ones
      # whose name ends in it as words (guard 2 for Watch guard 2), else starts with it, else has it anywhere.
      FUN`FOE`FIND:
        value: |-
          cond(cand(isint(%1),hasattr({{encounters}},ENC`%0`FOE`%1)),%1,words(setr(ff_m,u(%!/FUN`FOE`MATCH,%0,%1,0))),%q<ff_m>,words(setr(ff_m,u(%!/FUN`FOE`MATCH,%0,%1,1))),%q<ff_m>,words(setr(ff_m,u(%!/FUN`FOE`MATCH,%0,%1,2))),%q<ff_m>,u(%!/FUN`FOE`MATCH,%0,%1,3))
        flags: [funsyntax]
      FUN`FOE`MATCH:
        value: |-
          squish(iter(u(%!/FUN`FOE`NUMS,%0),if(switch(%2,0,not(comp(lcstr(u(%!/FUN`FOE`LABEL,%0,%i0)),lcstr(trim(%1)))),1,strmatch(u(%!/FUN`FOE`LABEL,%0,%i0),* [trim(%1)]),2,strmatch(u(%!/FUN`FOE`LABEL,%0,%i0),trim(%1)*),strmatch(u(%!/FUN`FOE`LABEL,%0,%i0),*[trim(%1)]*)),%i0)))
        flags: [funsyntax]
      # %0 what was typed: the bestiary key it names, by key or by name.
      FUN`FOE`KIND:
        value: |-
          setq(fk_key,ucstr(edit(trim(%0),%b,-)))[cond(cand(regmatch(%q<fk_key>,^%[A-Z0-9-%]+$),hasattr({{store}},FOE`%q<fk_key>)),%q<fk_key>,first(iter(lattr({{store}}/FOE`*),if(not(comp(lcstr(get({{store}}/%i0)),lcstr(trim(%0)))),last(%i0,`)))))]
        flags: [funsyntax]
      # %0 an encounter, %1 a bestiary key: a new foe copied from it. Returns its number.
      FUN`FOE`MAKE:
        value: |-
          setq(fm_k,inc(lmax(0 [u(%!/FUN`FOE`NUMS,%0)])))[attrib_set({{encounters}}/ENC`%0`FOE`%q<fm_k>,json(object,key,json(string,%1),label,json(string,[get({{store}}/FOE`%1)] %q<fm_k>),rank,json(string,lcstr(u(%!/FUN`FOE`STORE,%1,RANK,dangerous))),ticks,0,beaten,0,nature,json(string,get({{store}}/FOE`%1`NATURE)),features,json(string,get({{store}}/FOE`%1`FEATURES)),drives,json(string,get({{store}}/FOE`%1`DRIVES)),tactics,json(string,get({{store}}/FOE`%1`TACTICS))))]%q<fm_k>
        flags: [funsyntax]
      # %0 a kind, %1 a field, %2 its default.
      FUN`FOE`STORE:
        value: |-
          default({{store}}/FOE`%0`%1,%2)
        flags: [funsyntax]
      FUN`KIND`SORTKEY:
        value: |-
          member(v(DATA`RANKS),lcstr(u(%!/FUN`FOE`STORE,%0,RANK,dangerous)))
        flags: [funsyntax]
      # %0 an encounter, %1 a foe: its progress track, and whether it is beaten.
      FUN`FOE`STATE:
        value: |-
          setq(fs_ticks,u(%!/FUN`FOE`GET,%0,%1,ticks))[u(%!/FUN`DISPLAY`PROGRESS,%q<fs_ticks>)] [floor(fdiv(%q<fs_ticks>,4))]/10[if(u(%!/FUN`FOE`GET,%0,%1,beaten),%bbeaten)]
        flags: [funsyntax]
      # %0 a rank: the harm a foe of that rank deals, 1 for troublesome up to 5 for epic.
      FUN`FOE`HARMOF:
        value: |-
          member(v(DATA`RANKS),lcstr(%0))
        flags: [funsyntax]

      # ---- the XP and money ledgers --------------------------------------------------------
      # Each book is its own ledger, apart from the sheet's: IRONSWORN`<BOOK>LEDGER`<n>, a JSON object with n, delta,
      # total (the running total after it), item and label (what it counts, when the book counts more than one
      # thing), reason, by (an objid) and at (secs), with the wizard attribute flag. The totals on the sheet are a
      # cache of the latest entry's total: FUN`BOOK`ADD is the only thing that writes either, and +sheet/rebuild
      # works every cache out again from the ledgers.
      # %0 a book, %1 an item: the attribute holding its cached total.
      FUN`BOOK`CACHE:
        value: |-
          IRONSWORN`XP
        flags: [funsyntax]
      # %0 a book: 1 when its cache keeps the item's label with the total, as <total>|<label>.
      FUN`BOOK`LABELLED:
        value: |-
          0
        flags: [funsyntax]
      # %0 a character, %1 a book: the numbers of its entries, oldest first.
      FUN`BOOK`NUMS:
        value: |-
          sort(iter(lattr(%0/IRONSWORN`%1LEDGER`*),if(hasflag(%0/%i0,wizard),last(%i0,`))),n)
        flags: [funsyntax]
      # %0 a character, %1 a book, %2 the change, %3 why, %4 the item, %5 its label: a new entry, then the cached
      # total. Nothing for no change.
      FUN`BOOK`ADD:
        value: |-
          if(%2,[setqm(book_cache,u(%!/FUN`BOOK`CACHE,%1,%4),book_n,inc(lmax(0 [iter(lattr(%0/IRONSWORN`%1LEDGER`*),last(%i0,`))])))][setq(book_had,get(%0/%q<book_cache>))][setqm(book_total,add(firstof(before(%q<book_had>,|),0),%2),book_label,firstof(%5,after(%q<book_had>,|)))][u(%!/FUN`API`ROOT,%0)][attrib_set(%0/IRONSWORN`%1LEDGER`%q<book_n>,json(object,n,%q<book_n>,delta,%2,total,%q<book_total>,item,json(string,%4),label,json(string,%q<book_label>),reason,json(string,left(%3,200)),by,json(string,objid(%#)),at,secs()))][set(%0/IRONSWORN`%1LEDGER`%q<book_n>,wizard)][u(%!/FUN`BOOK`SET,%0,%q<book_cache>,%q<book_total>,if(u(%!/FUN`BOOK`LABELLED,%1),%q<book_label>))][u(%!/FUN`BOOK`TRIM,%0,%1)])
        flags: [funsyntax]
      # %0 a character, %1 a cache attribute, %2 the total, %3 a label: writes the cache; 0 removes it.
      FUN`BOOK`SET:
        value: |-
          if(%2,[attrib_set(%0/%1,if(strlen(%3),%2|%3,%2))][set(%0/%1,wizard)],if(hasattr(%0/%1),attrib_set(%0/%1)))
        flags: [funsyntax]
      # %0 a character, %1 a book: past DATA`LOG`MAX entries, the oldest one a later entry for the same item
      # replaces goes, so the latest entry for each item, and with it every total, always stays.
      FUN`BOOK`TRIM:
        value: |-
          setqm(bt_drop,,bt_nums,sort(iter(lattr(%0/IRONSWORN`%1LEDGER`*),last(%i0,`)),n))[if(gt(words(%q<bt_nums>),get(%!/DATA`LOG`MAX)),setq(bt_drop,first(iter(extract(%q<bt_nums>,1,50),if(gt(words(grep(%0,IRONSWORN`%1LEDGER`*,"item":"[json_query(get(%0/IRONSWORN`%1LEDGER`%i0),extract,$.item)]")),1),%i0)))))][if(strlen(%q<bt_drop>),attrib_set(%0/IRONSWORN`%1LEDGER`%q<bt_drop>))]
        flags: [funsyntax]
      # %0 a character, %1 a book, %2 an item: its latest entry.
      FUN`BOOK`LAST:
        value: |-
          setq(bl_n,last(iter(u(%!/FUN`BOOK`NUMS,%0,%1),if(not(comp(json_query(get(%0/IRONSWORN`%1LEDGER`%i0),extract,$.item),%2)),%i0))))[if(strlen(%q<bl_n>),get(%0/IRONSWORN`%1LEDGER`%q<bl_n>))]
        flags: [funsyntax]
      # %0 a character, %1 a book, %2 an item: writes its cache from its latest entry.
      FUN`BOOK`REBUILDITEM:
        value: |-
          setq(br_last,u(%!/FUN`BOOK`LAST,%0,%1,%2))[u(%!/FUN`BOOK`SET,%0,u(%!/FUN`BOOK`CACHE,%1,%2),if(strlen(%q<br_last>),json_query(%q<br_last>,extract,$.total),0),if(cand(strlen(%q<br_last>),u(%!/FUN`BOOK`LABELLED,%1)),json_query(%q<br_last>,extract,$.label)))]
        flags: [funsyntax]
      # %0 a character, %1 a book: the items it has entries for.
      FUN`BOOK`ITEMS:
        value: |-
          setunion(iter(u(%!/FUN`BOOK`NUMS,%0,%1),json_query(get(%0/IRONSWORN`%1LEDGER`%i0),extract,$.item)),)
        flags: [funsyntax]
      # %0 a character, %1 a book, %2 its title, %3 its unit (after the item's label), %4 how many: the
      # latest entries, oldest first.
      FUN`SCREEN`BOOK:
        value: |-
          setq(sb_nums,u(%!/FUN`BOOK`NUMS,%0,%1))[setq(sb_nums,extract(%q<sb_nums>,max(1,sub(words(%q<sb_nums>),dec(%4))),%4))][tone(strong,%2)]%r[if(words(%q<sb_nums>),ldatatable(lit({"nowrap":"1|2|3|4|6","grow":"||||1"}),#|When|Change|>Total|Why|By,iter(%q<sb_nums>,u(%!/FUN`DISPLAY`BOOKROW,get(%0/IRONSWORN`%1LEDGER`%i0),%3),%b,%*<^>),%*<^>),tone(muted,Nothing yet.))]
        flags: [funsyntax]
      FUN`DISPLAY`BOOKROW:
        value: |-
          [json_query(%0,extract,$.n)]|[timefmt($Y-$m-$d,json_query(%0,extract,$.at))]|[u(%!/FUN`DISPLAY`SIGNED,json_query(%0,extract,$.delta))] [trim([json_query(%0,extract,$.label)] %1)]|[json_query(%0,extract,$.total)]|[firstof(json_query(%0,extract,$.reason),-)]|[name(json_query(%0,extract,$.by))]
        flags: [funsyntax]
      # %0 a character: the sheet's ledger merged, the rows in force. Kept as a cache in IRONSWORN`MERGED once worked
      # out; every ledger write drops it.
      FUN`LEDGER`MERGED:
        value: |-
          if(cand(hasattr(%0/IRONSWORN`MERGED),hasflag(%0/IRONSWORN`MERGED,wizard)),get(%0/IRONSWORN`MERGED),[setq(lm_rows,u(%!/FUN`LEDGER`LIVE,u(%!/FUN`LEDGER`ROWS,%0)))][if(cand(words(%q<lm_rows>),hasattr(%0,IRONSWORN)),null([attrib_set(%0/IRONSWORN`MERGED,%q<lm_rows>)][set(%0/IRONSWORN`MERGED,wizard)]))]%q<lm_rows>)
        flags: [funsyntax]
      # %0 a character: every cache worked out again from the ledgers.
      FUN`BOOK`REBUILD:
        value: |-
          [if(hasattr(%0/IRONSWORN`MERGED),attrib_set(%0/IRONSWORN`MERGED))][u(%!/FUN`BOOK`REBUILDITEM,%0,XP,)]
        flags: [funsyntax]
      # %0 the character: the latest 30 XP ledger entries, oldest first.
      FUN`SCREEN`LOG:
        value: |-
          box([u(%!/FUN`SCREEN`BOOK,%0,XP,Experience,XP,30)]%r[rule()]%r[tone(muted,Every change to experience%, with who made it.)],Ledger: [name(%0)])
        flags: [funsyntax]
      FUN`API`ROOT:
        value: |-
          if(hasattr(%0,IRONSWORN),,attrib_set(%0/IRONSWORN,This character's Ironsworn sheet. +sheet shows it.)[set(%0/IRONSWORN,wizard)][set(%0/IRONSWORN,no_command)])
        flags: [funsyntax]

      # ---- lists ------------------------------------------------------------------
      # %0 a list on the store (STAT, ASSET): its keys, in order then by key.
      FUN`LIST`ALL:
        value: |-
          setq(list_path,%0)[sortkey(%!/FUN`LIST`SORTKEY,iter(lattr({{store}}/%0`*),after(%i0,`)))]
        flags: [funsyntax]
      FUN`LIST`SORTKEY:
        value: |-
          rjust(default({{store}}/%q<list_path>`%0`ORDER,50),3,0)%0
        flags: [funsyntax]
      FUN`LIST`LABEL:
        value: |-
          firstof(get({{store}}/%0`%1),lcstr(%1))
        flags: [funsyntax]
      # %0 a list, %1 typed text: the key it names, by key, by label, or by the start of one, or nothing.
      FUN`LIST`FIND:
        value: |-
          setqm(find_typed,trim(%1),
          find_all,u(%!/FUN`LIST`ALL,%0),
          find_exact,iter(%q<find_all>,if(cor(not(comp(%i0,ucstr(%q<find_typed>))),not(comp(lcstr(get({{store}}/%0`%i0)),lcstr(%q<find_typed>)))),%i0)),
          find_start,iter(%q<find_all>,if(cor(not(comp(left(%i0,strlen(%q<find_typed>)),ucstr(%q<find_typed>))),not(comp(lcstr(left(get({{store}}/%0`%i0),strlen(%q<find_typed>))),lcstr(%q<find_typed>)))),%i0)))[if(strlen(%q<find_typed>),first(firstof(%q<find_exact>,if(eq(words(%q<find_start>),1),%q<find_start>))))]
        flags: [funsyntax]

      # ---- vows -------------------------------------------------------------------
      # %0 a vow's name as typed: its key, the letters, digits and hyphens of it.
      FUN`VOW`KEY:
        value: |-
          left(ucstr(edit(squish(regeditall(%0,\[^A-Za-z0-9 -\],)),%b,-)),20)
        flags: [funsyntax]
      # %0 a character: their vows' keys, in the order they were sworn by name.
      FUN`VOW`ALL:
        value: |-
          sort(iter(lattr(%0/IRONSWORN`VOW`*),last(%i0,`)))
        flags: [funsyntax]
      # %0 a character, %1 typed text: the vow it names, by key, by name, or by the start of one, or nothing.
      FUN`VOW`FIND:
        value: |-
          setqm(find_typed,trim(%1),
          find_all,u(%!/FUN`VOW`ALL,%0),
          find_exact,iter(%q<find_all>,if(cor(not(comp(%i0,u(%!/FUN`VOW`KEY,%q<find_typed>))),not(comp(lcstr(get(%0/IRONSWORN`VOW`%i0)),lcstr(%q<find_typed>)))),%i0)),
          find_start,iter(%q<find_all>,if(not(comp(lcstr(left(get(%0/IRONSWORN`VOW`%i0),strlen(%q<find_typed>))),lcstr(%q<find_typed>))),%i0)))[if(strlen(%q<find_typed>),first(firstof(%q<find_exact>,if(eq(words(%q<find_start>),1),%q<find_start>))))]
        flags: [funsyntax]
      FUN`VOW`TICKS:
        value: |-
          default(%0/IRONSWORN`VOW`%1`TICKS,0)
        flags: [funsyntax]

      # ---- dice -------------------------------------------------------------------
      # %0 what is added to the action die (stat and adds). Rolls {1d6+<n>,1d10,1d10} and keeps the roll; returns
      # {"tier","action","challenge","match","text","roll","formula"}, the action score no more than 10.
      FUN`ROLL`ACTION:
        value: |-
          setqm(rolled,roll([chr(123)]1d6[if(gte(%0,0),+%0,%0)]%,1d10%,1d10[chr(125)],,record),
          rolled_die,json_query(%q<rolled>,extract,$.dice%[0%].total),
          rolled_action,min(10,add(%q<rolled_die>,%0)),
          rolled_c1,json_query(%q<rolled>,extract,$.dice%[1%].total),
          rolled_c2,json_query(%q<rolled>,extract,$.dice%[2%].total))[u(%!/FUN`ROLL`RESULT,%q<rolled_action>,1d6%[%q<rolled_die>%][if(%0,%b[if(gt(%0,0),+,-)]%b[abs(%0)])] = %q<rolled_action>[if(gt(add(%q<rolled_die>,%0),10),%b%(at most 10%))])]
        flags: [funsyntax]
      # %0 a progress score: rolls 2d10 against it and keeps the roll. Returns what FUN`ROLL`ACTION does.
      FUN`ROLL`PROGRESS:
        value: |-
          setqm(rolled,roll(2d10,,record),
          rolled_c1,json_query(%q<rolled>,extract,$.dice%[0%].results%[0%].result),
          rolled_c2,json_query(%q<rolled>,extract,$.dice%[0%].results%[1%].result))[u(%!/FUN`ROLL`RESULT,%0,progress %0)]
        flags: [funsyntax]
      # %0 the score, %1 how the score reads; rolled, rolled_c1 and rolled_c2 set.
      FUN`ROLL`RESULT:
        value: |-
          json(object,tier,json(string,u(%!/API`TIER,%0,%q<rolled_c1>,%q<rolled_c2>)),action,%0,challenge,json(array,%q<rolled_c1>,%q<rolled_c2>),match,eq(%q<rolled_c1>,%q<rolled_c2>),text,json(string,%1 vs %q<rolled_c1> and %q<rolled_c2>),roll,json_query(%q<rolled>,extract,$.id),formula,json(string,json_query(%q<rolled>,extract,$.formula)))
        flags: [funsyntax]
      # %0 the key, %1 the stat, %2 all the adds, %3 the target as given.
      FUN`CHECK`ROLLED:
        value: |-
          setq(rolled_check,u(%!/FUN`ROLL`ACTION,add(%1,%2)))[json(object,tier,json(string,json_query(%q<rolled_check>,extract,$.tier)),action,json_query(%q<rolled_check>,extract,$.action),challenge,json_query(%q<rolled_check>,extract,$.challenge),match,json_query(%q<rolled_check>,extract,$.match),stat,%1,target,json(string,%3),label,json(string,u(%!/FUN`LIST`LABEL,STAT,%0)),text,json(string,json_query(%q<rolled_check>,extract,$.text)),roll,json_query(%q<rolled_check>,extract,$.roll),formula,json(string,json_query(%q<rolled_check>,extract,$.formula)))]
        flags: [funsyntax]

      # ---- screens ------------------------------------------------------------------
      # %0 a check's JSON: "Iron (+1): 1d6[4] + 3 = 7 vs 5 and 9: a weak hit (roll 42)".
      FUN`DISPLAY`CHECK:
        value: |-
          setqm(display_tier,json_query(%0,extract,$.tier),
          display_target,json_query(%0,extract,$.target))[json_query(%0,extract,$.label)][if(strlen(%q<display_target>),%b%([if(gte(%q<display_target>,0),+)]%q<display_target>%))]: [json_query(%0,extract,$.text)]: [tone(u(%!/FUN`DISPLAY`TIERTONE,%q<display_tier>),u(%!/FUN`DISPLAY`TIER,%q<display_tier>))] [tone(muted,%(roll [json_query(%0,extract,$.roll)]%))]
        flags: [funsyntax]
      FUN`DISPLAY`TIER:
        value: |-
          switch(%0,crit-success,a strong hit with a match,success,a strong hit,partial,a weak hit,crit-fail,a miss with a match,a miss)
        flags: [funsyntax]
      FUN`DISPLAY`TIERTONE:
        value: |-
          switch(%0,crit-success,success,success,success,partial,warning,error)
        flags: [funsyntax]
      # %0 a character, %1 a meter, %2 its value: "Alice's health is 3 of 5".
      FUN`DISPLAY`METER:
        value: |-
          [name(%0)]'s [lcstr(v(DATA`METER`%1))] is [if(cand(strmatch(%1,MOMENTUM),gt(%2,0)),+)]%2[if(member(HEALTH SPIRIT SUPPLY,%1),%bof [extract(v(DATA`METER`%1`RANGE),2,1)])]
        flags: [funsyntax]
      # %0 a meter, %1 its value: "3/5" or "+2".
      FUN`DISPLAY`METERVALUE:
        value: |-
          cond(strmatch(%0,MOMENTUM),[if(gt(%1,0),+)]%1,%1/[extract(v(DATA`METER`%0`RANGE),2,1)])
        flags: [funsyntax]
      # %0 a character: " in encounter <n> (<title>)" when a change went to an encounter's copy.
      FUN`DISPLAY`WHERE:
        value: |-
          setq(where_n,u(%!/FUN`ENC`ACTIVE,%0))[if(strlen(%q<where_n>),%bin encounter [u(%!/FUN`ENC`NAME,%q<where_n>)])]
        flags: [funsyntax]
      # %0 the values given: "Left to give: 2 1 1." or that none are.
      FUN`DISPLAY`ARRAYLEFT:
        value: |-
          setq(array_all,get(%!/DATA`CONFIG`ARRAY))[setq(array_left,squish(iter(setunion(%q<array_all>,%q<array_all>),repeat(%i0%b,max(0,sub(words(graball(%q<array_all>,%i0)),words(graball(%0,%i0))))))))][if(words(%q<array_left>),Left to give: [itemize(revwords(sort(%q<array_left>,n)))].,Every value is given.)]
        flags: [funsyntax]
      # %0 a number filled, %1 out of: [##.].
      FUN`DISPLAY`TRACK:
