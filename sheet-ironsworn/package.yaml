format: "1.16"
package: sheet-ironsworn
title: "Ironsworn sheet"
version: 2.2.1
authors: [SharpMUSH]
description: "An Ironsworn character sheet: five stats and assets built from a ledger, health, spirit, supply and momentum, experience spent on new assets and their abilities, with its own audited ledger, companion health, iron vows with progress tracks, and encounters that play from copies of the sheets. +check makes an action roll, a six-sided die plus a stat against two ten-sided challenge dice, for the room; +vow swears, marks and fulfils vows. Based on the Ironsworn SRD under CC BY 4.0."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, ironsworn, vows, assets, dice]
category: Characters
requires_server: ">=0.1"

# One permission, for the people who keep sheets: change any character's sheet and vows at any time, read every
# sheet, give experience, revoke and clear ledger entries, and run any encounter. A player builds their own sheet
# until they are approved, then spends experience on assets, and keeps their own meters and vows at any time.
# Changing the lists and the settings is config.admin, as +config is.
categories:
  roles:
    - name: Ironsworn sheet
      description: Roles for the people who keep Ironsworn character sheets.
  permissions:
    - name: Ironsworn sheet
      description: Keeping Ironsworn character sheets.
permissions:
  - name: softcode.ironsworn.admin
    category: Ironsworn sheet
    description: Read every Ironsworn sheet, change any character's sheet and vows at any time, give experience, and run any encounter.
roles:
  - slug: ironsworn-sheet-keeper
    name: Ironsworn Sheet Keeper
    category: Ironsworn sheet
    priority: 11
    permissions:
      softcode.ironsworn.admin: allow

# Every character's IRONSWORN tree is their Ironsworn sheet: only wizards write it, so a player can't make the
# root before the sheet does, and it is never a command.
attributes:
  IRONSWORN:
    flags: [wizard, no_command]

objects:
  # The command object, in the master room. WIZARD because it adds the commands (@command/add, @hook),
  # writes the sheet attributes on characters, and reads them for other packages.
  #
  # A character's sheet is their own attributes under IRONSWORN`: IRONSWORN`LEDGER`<n> the entries their stats and
  # assets are built from and IRONSWORN`MERGED a cache of the ones in force, IRONSWORN`METER`<KEY> a meter (unset
  # is its start), IRONSWORN`COMPANION`<ASSET> a companion's health (unset is its most), IRONSWORN`XPLEDGER`<n>
  # the experience ledger and IRONSWORN`XP a cache of its running total, the experience not yet spent,
  # IRONSWORN`VOW`<KEY> a vow's name with RANK and TICKS beneath, and IRONSWORN`ENCOUNTERS and
  # IRONSWORN`USING the encounters they are in. The IRONSWORN root is wizard-flagged, so only this object writes
  # them.
  #
  # +sheet, +check, +vow and +encounter are added with /noparse/rsnoparse and hooked to CMD`<word>, so what a
  # player types reaches the code exactly as typed and nothing a player wrote is ever evaluated.
  #
  # Trees: CMD` the hooked commands, INC`COMMAND` the parse and dispatch, INC`SHEET`, INC`CHECK`, INC`VOW` and
  # INC`ENCOUNTER` one routine per switch, INC`NEED` the guards they share, INC`DO` the writes. FUN`LEDGER` and
  # FUN`BUILD` the ledger, FUN`STATS`, FUN`ASSETS` and FUN`R the build, FUN`P and FUN`PSET where play happens,
  # FUN`METER` and FUN`COMPANION` the meters, FUN`XP` and FUN`BOOK` experience, FUN`ENC` the encounters, FUN`LIST`
  # the stats and assets, FUN`VOW` the vows, FUN`ROLL` the dice, FUN`PERM` who may do what, FUN`SCREEN` and
  # FUN`DISPLAY` the screens. API` the functions other packages call (VISUAL), the same names in every sheet
  # package. Bridges add HINT`<message> lines, GATE`EDIT (a reason a player may not change their own sheet now)
  # and ALLOW`VIEW`<name> (who else may read a sheet).
  - ref: sheet
    type: thing
    name: Ironsworn Sheet
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      # ---- settings ---------------------------------------------------------------
      # +config ironsworn shows and changes them (sheet-ironsworn-config); the code reads each with
      # get(%!/DATA`CONFIG`<NAME>).
      DATA`CONFIG: |-
        Settings for the Ironsworn sheet. One leaf per setting.
      DATA`CONFIG`LABEL: |-
        Ironsworn sheet
      DATA`CONFIG`ARRAY: |-
        3 2 2 1 1
      DATA`CONFIG`ARRAY`TYPE: |-
        text
      DATA`CONFIG`ARRAY`DEFAULT: |-
        3 2 2 1 1
      DATA`CONFIG`ARRAY`MAX: |-
        40
      DATA`CONFIG`ARRAY`CHECK: |-
        CHECK`ARRAY
      DATA`CONFIG`ARRAY`LABEL: |-
        Starting stats
      DATA`CONFIG`ARRAY`DESCRIPTION: |-
        The values a new character gives their stats, one each. Sheet keepers set any stat from 1 to 5.
      DATA`CONFIG`ARRAY`EXAMPLE: |-
        3 3 2 1 1
      DATA`CONFIG`STARTING: |-
        3
      DATA`CONFIG`STARTING`TYPE: |-
        integer
      DATA`CONFIG`STARTING`DEFAULT: |-
        3
      DATA`CONFIG`STARTING`MIN: |-
        0
      DATA`CONFIG`STARTING`MAX: |-
        10
      DATA`CONFIG`STARTING`LABEL: |-
        Starting assets
      DATA`CONFIG`STARTING`DESCRIPTION: |-
        How many assets a new character takes, each with its first ability marked.
      DATA`CONFIG`STARTING`EXAMPLE: |-
        4
      DATA`CONFIG`NEWASSET: |-
        3
      DATA`CONFIG`NEWASSET`TYPE: |-
        integer
      DATA`CONFIG`NEWASSET`DEFAULT: |-
        3
      DATA`CONFIG`NEWASSET`MIN: |-
        0
      DATA`CONFIG`NEWASSET`MAX: |-
        99
      DATA`CONFIG`NEWASSET`LABEL: |-
        Experience for a new asset
      DATA`CONFIG`NEWASSET`DESCRIPTION: |-
        What an approved character spends on a new asset, which comes with its first ability marked.
      DATA`CONFIG`NEWASSET`EXAMPLE: |-
        4
      DATA`CONFIG`UPGRADE: |-
        2
      DATA`CONFIG`UPGRADE`TYPE: |-
        integer
      DATA`CONFIG`UPGRADE`DEFAULT: |-
        2
      DATA`CONFIG`UPGRADE`MIN: |-
        0
      DATA`CONFIG`UPGRADE`MAX: |-
        99
      DATA`CONFIG`UPGRADE`LABEL: |-
        Experience for an ability
      DATA`CONFIG`UPGRADE`DESCRIPTION: |-
        What marking the next ability of an asset costs.
      DATA`CONFIG`UPGRADE`EXAMPLE: |-
        3
      DATA`CONFIG`ADDS: |-
        2 1 0 -1 -2
      DATA`CONFIG`ADDS`TYPE: |-
        text
      DATA`CONFIG`ADDS`DEFAULT: |-
        2 1 0 -1 -2
      DATA`CONFIG`ADDS`MAX: |-
        30
      DATA`CONFIG`ADDS`CHECK: |-
        CHECK`ADDS
      DATA`CONFIG`ADDS`LABEL: |-
        Adds for each difficulty
      DATA`CONFIG`ADDS`DESCRIPTION: |-
        What is added to the action die at trivial, easy, standard, hard and extreme, in that order.
      DATA`CONFIG`ADDS`EXAMPLE: |-
        1 1 0 0 -1
      DATA`CONFIG`PUBLIC: |-
        0
      DATA`CONFIG`PUBLIC`TYPE: |-
        boolean
      DATA`CONFIG`PUBLIC`DEFAULT: |-
        0
      DATA`CONFIG`PUBLIC`LABEL: |-
        Sheets anyone can read
      DATA`CONFIG`PUBLIC`DESCRIPTION: |-
        Whether +sheet <name> and +vow <name> show anyone's sheet to everyone. Otherwise only the character and sheet keepers see it.
      DATA`CONFIG`PUBLIC`EXAMPLE: |-
        yes
      DATA`CONFIG`STATS`TYPE: |-
        table
      DATA`CONFIG`STATS`LABEL: |-
        Stats
      DATA`CONFIG`STATS`DESCRIPTION: |-
        The stats a sheet rates and +check rolls.
      DATA`CONFIG`STATS`STORE: |-
        {{store}}
      DATA`CONFIG`STATS`PATH: |-
        STAT
      DATA`CONFIG`STATS`ENTRY: |-
        label
      DATA`CONFIG`STATS`FIELDS: |-
        label order
      DATA`CONFIG`STATS`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`STATS`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`STATS`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`STATS`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`STATS`FIELD`LABEL`LABEL: |-
        Label
      DATA`CONFIG`STATS`FIELD`LABEL`DESCRIPTION: |-
        The name the sheet shows.
      DATA`CONFIG`STATS`FIELD`ORDER`TYPE: |-
        integer
      DATA`CONFIG`STATS`FIELD`ORDER`DEFAULT: |-
        50
      DATA`CONFIG`STATS`FIELD`ORDER`MIN: |-
        0
      DATA`CONFIG`STATS`FIELD`ORDER`MAX: |-
        999
      DATA`CONFIG`STATS`FIELD`ORDER`LABEL: |-
        Order
      DATA`CONFIG`STATS`FIELD`ORDER`DESCRIPTION: |-
        Where it comes in the list: lower first, then by name.
      DATA`CONFIG`ASSETS`TYPE: |-
        table
      DATA`CONFIG`ASSETS`LABEL: |-
        Assets
      DATA`CONFIG`ASSETS`DESCRIPTION: |-
        The assets a character may take: companions, paths, combat talents and rituals, each with three abilities.
      DATA`CONFIG`ASSETS`STORE: |-
        {{store}}
      DATA`CONFIG`ASSETS`PATH: |-
        ASSET
      DATA`CONFIG`ASSETS`ENTRY: |-
        label
      DATA`CONFIG`ASSETS`FIELDS: |-
        label type health first second third order
      DATA`CONFIG`ASSETS`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`ASSETS`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`ASSETS`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`ASSETS`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`ASSETS`FIELD`LABEL`LABEL: |-
        Label
      DATA`CONFIG`ASSETS`FIELD`LABEL`DESCRIPTION: |-
        The name the sheet shows.
      DATA`CONFIG`ASSETS`FIELD`TYPE`TYPE: |-
        text
      DATA`CONFIG`ASSETS`FIELD`TYPE`MIN: |-
        1
      DATA`CONFIG`ASSETS`FIELD`TYPE`MAX: |-
        20
      DATA`CONFIG`ASSETS`FIELD`TYPE`CHECK: |-
        CHECK`ASSETTYPE
      DATA`CONFIG`ASSETS`FIELD`TYPE`LABEL: |-
        Type
      DATA`CONFIG`ASSETS`FIELD`TYPE`DESCRIPTION: |-
        companion, path, talent or ritual.
      DATA`CONFIG`ASSETS`FIELD`HEALTH`TYPE: |-
        integer
      DATA`CONFIG`ASSETS`FIELD`HEALTH`DEFAULT: |-
        0
      DATA`CONFIG`ASSETS`FIELD`HEALTH`MIN: |-
        0
      DATA`CONFIG`ASSETS`FIELD`HEALTH`MAX: |-
        10
      DATA`CONFIG`ASSETS`FIELD`HEALTH`LABEL: |-
        Health
      DATA`CONFIG`ASSETS`FIELD`HEALTH`DESCRIPTION: |-
        A companion's most health. 0 for an asset with no health of its own.
      DATA`CONFIG`ASSETS`FIELD`FIRST`TYPE: |-
        text
      DATA`CONFIG`ASSETS`FIELD`FIRST`MAX: |-
        300
      DATA`CONFIG`ASSETS`FIELD`FIRST`LABEL: |-
        First ability
      DATA`CONFIG`ASSETS`FIELD`FIRST`DESCRIPTION: |-
        The ability that comes with the asset.
      DATA`CONFIG`ASSETS`FIELD`SECOND`TYPE: |-
        text
      DATA`CONFIG`ASSETS`FIELD`SECOND`MAX: |-
        300
      DATA`CONFIG`ASSETS`FIELD`SECOND`LABEL: |-
        Second ability
      DATA`CONFIG`ASSETS`FIELD`SECOND`DESCRIPTION: |-
        The ability the first upgrade marks.
      DATA`CONFIG`ASSETS`FIELD`THIRD`TYPE: |-
        text
      DATA`CONFIG`ASSETS`FIELD`THIRD`MAX: |-
        300
      DATA`CONFIG`ASSETS`FIELD`THIRD`LABEL: |-
        Third ability
      DATA`CONFIG`ASSETS`FIELD`THIRD`DESCRIPTION: |-
        The ability the second upgrade marks.
      DATA`CONFIG`ASSETS`FIELD`ORDER`TYPE: |-
        integer
      DATA`CONFIG`ASSETS`FIELD`ORDER`DEFAULT: |-
        50
      DATA`CONFIG`ASSETS`FIELD`ORDER`MIN: |-
        0
      DATA`CONFIG`ASSETS`FIELD`ORDER`MAX: |-
        999
      DATA`CONFIG`ASSETS`FIELD`ORDER`LABEL: |-
        Order
      DATA`CONFIG`ASSETS`FIELD`ORDER`DESCRIPTION: |-
        Where it comes in the list: lower first, then by name.
      CHECK`ADDS: |-
        if(cand(eq(words(%0),5),every(%!/FUN`IS`ADD,%0)),,Give five numbers from -5 to 5%, trivial to extreme.)
      CHECK`ARRAY: |-
        if(cand(words(%0),every(%!/FUN`IS`STAT,%0)),,Give whole numbers from 1 to 5%, one for each stat.)
      CHECK`ASSETTYPE: |-
        if(member(companion path talent ritual,lcstr(%0)),,An asset is a companion%, path%, talent or ritual.)
      FUN`IS`ADD: |-
        cand(isint(%0),gte(%0,-5),lte(%0,5))
      FUN`IS`STAT: |-
        cand(isint(%0),gte(%0,1),lte(%0,5))

      # Which INC` routine each switch runs: DATA`ROUTE`<table>`<switch>. BARE is the command alone, ARG the
      # command with something after it and no switch.
      DATA`ROUTE: |-
        Which routine each switch runs. One leaf per switch.
      DATA`ROUTE`SHEET`BARE: |-
        SHEET`SHOW
      DATA`ROUTE`SHEET`ARG: |-
        SHEET`SHOW
      DATA`ROUTE`SHEET`SET: |-
        SHEET`SET
      DATA`ROUTE`SHEET`CHARGEN: |-
        SHEET`CHARGEN
      DATA`ROUTE`SHEET`ASSET: |-
        SHEET`ASSET
      DATA`ROUTE`SHEET`UPGRADE: |-
        SHEET`UPGRADE
      DATA`ROUTE`SHEET`ASSETS: |-
        SHEET`ASSETS
      DATA`ROUTE`SHEET`COMPANION: |-
        SHEET`COMPANION
      DATA`ROUTE`SHEET`XP: |-
        SHEET`XP
      DATA`ROUTE`SHEET`LEDGER: |-
        SHEET`LEDGER
      DATA`ROUTE`SHEET`LOG: |-
        SHEET`LOG
      DATA`ROUTE`SHEET`REBUILD: |-
        SHEET`REBUILD
      DATA`ROUTE`SHEET`REVOKE: |-
        SHEET`REVOKE
      DATA`ROUTE`SHEET`CLEAR: |-
        SHEET`CLEAR
      DATA`ROUTE`SHEET`HEALTH: |-
        SHEET`METER
      DATA`ROUTE`SHEET`SPIRIT: |-
        SHEET`METER
      DATA`ROUTE`SHEET`SUPPLY: |-
        SHEET`METER
      DATA`ROUTE`SHEET`MOMENTUM: |-
        SHEET`METER
      DATA`ROUTE`SHEET`TRAITS: |-
        SHEET`TRAITS
      DATA`ROUTE`CHECK`BARE: |-
        CHECK`USAGE
      DATA`ROUTE`CHECK`ARG: |-
        CHECK`ROLL
      DATA`ROUTE`CHECK`PRIVATE: |-
        CHECK`ROLL
      DATA`ROUTE`VOW`BARE: |-
        VOW`LIST
      DATA`ROUTE`VOW`ARG: |-
        VOW`LIST
      DATA`ROUTE`VOW`SWEAR: |-
        VOW`SWEAR
      DATA`ROUTE`VOW`MARK: |-
        VOW`MARK
      DATA`ROUTE`VOW`FULFIL: |-
        VOW`FULFIL
      DATA`ROUTE`VOW`FORSAKE: |-
        VOW`FORSAKE
      DATA`ROUTE`ENCOUNTER`BARE: |-
        ENCOUNTER`SHOW
      DATA`ROUTE`ENCOUNTER`ARG: |-
        ENCOUNTER`SHOW
      DATA`ROUTE`ENCOUNTER`START: |-
        ENCOUNTER`START
      DATA`ROUTE`ENCOUNTER`JOIN: |-
        ENCOUNTER`JOIN
      DATA`ROUTE`ENCOUNTER`USE: |-
        ENCOUNTER`USE
      DATA`ROUTE`ENCOUNTER`ADD: |-
        ENCOUNTER`ADD
      DATA`ROUTE`ENCOUNTER`REMOVE: |-
        ENCOUNTER`REMOVE
      DATA`ROUTE`ENCOUNTER`LEAVE: |-
        ENCOUNTER`LEAVE
      DATA`ROUTE`ENCOUNTER`KEEP: |-
        ENCOUNTER`KEEP
      DATA`ROUTE`ENCOUNTER`END: |-
        ENCOUNTER`END
      DATA`ROUTE`FOE`BARE: |-
        FOE`LIST
      DATA`ROUTE`FOE`ARG: |-
        FOE`SHOW
      DATA`ROUTE`FOE`BESTIARY: |-
        FOE`BESTIARY
      DATA`ROUTE`FOE`RUN: |-
        FOE`RUN
      DATA`ROUTE`FOE`ADD: |-
        FOE`ADD
      DATA`ROUTE`FOE`REMOVE: |-
        FOE`REMOVE
      DATA`ROUTE`FOE`MARK: |-
        FOE`MARK
      DATA`ROUTE`FOE`END: |-
        FOE`END
      DATA`ROUTE`FOE`HARM: |-
        FOE`HARM
      DATA`ROUTE`ENCOUNTER`INITIATIVE: |-
        ENCOUNTER`INITIATIVE
      DATA`DIFFICULTIES: |-
        trivial easy standard hard extreme
      # The meters: the switch that changes each, its label, and its range and start (unset counts as the start).
      DATA`METERS: |-
        HEALTH SPIRIT SUPPLY MOMENTUM
      DATA`METER`HEALTH: |-
        Health
      DATA`METER`HEALTH`RANGE: |-
        0 5 5
      DATA`METER`SPIRIT: |-
        Spirit
      DATA`METER`SPIRIT`RANGE: |-
        0 5 5
      DATA`METER`SUPPLY: |-
        Supply
      DATA`METER`SUPPLY`RANGE: |-
        0 5 5
      DATA`METER`MOMENTUM: |-
        Momentum
      DATA`METER`MOMENTUM`RANGE: |-
        -6 10 2
      # Vow ranks, easiest first: the ticks one mark of progress fills. Ten boxes of four ticks each.
      DATA`RANKS: |-
        troublesome dangerous formidable extreme epic
      DATA`RANK`TROUBLESOME: |-
        12
      DATA`RANK`DANGEROUS: |-
        8
      DATA`RANK`FORMIDABLE: |-
        4
      DATA`RANK`EXTREME: |-
        2
      DATA`RANK`EPIC: |-
        1
      # An asset's abilities, in the order they are marked.
      DATA`ABILITIES: |-
        FIRST SECOND THIRD
      # The most entries a character's ledger holds; a sheet keeper's +sheet/clear starts it again.
      DATA`LEDGER`MAX: |-
        200
      # The most entries a character's experience ledger keeps; past it the oldest goes.
      DATA`LOG`MAX: |-
        500

      DATA`CONFIG`FOES`TYPE: |-
        table
      DATA`CONFIG`FOES`LABEL: |-
        Foes
      DATA`CONFIG`FOES`DESCRIPTION: |-
        The foes a GM adds to an encounter with +foe/add, each fought with a progress track by its rank.
      DATA`CONFIG`FOES`STORE: |-
        {{store}}
      DATA`CONFIG`FOES`PATH: |-
        FOE
      DATA`CONFIG`FOES`ENTRY: |-
        label
      DATA`CONFIG`FOES`FIELDS: |-
        label rank nature features drives tactics
      DATA`CONFIG`FOES`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`FOES`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`FOES`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`FOES`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`FOES`FIELD`LABEL`LABEL: |-
        Label
      DATA`CONFIG`FOES`FIELD`LABEL`DESCRIPTION: |-
        The name it goes by; each one added gets a number after it.
      DATA`CONFIG`FOES`FIELD`RANK`TYPE: |-
        text
      DATA`CONFIG`FOES`FIELD`RANK`DEFAULT: |-
        dangerous
      DATA`CONFIG`FOES`FIELD`RANK`MIN: |-
        1
      DATA`CONFIG`FOES`FIELD`RANK`MAX: |-
        12
      DATA`CONFIG`FOES`FIELD`RANK`CHECK: |-
        CHECK`RANK
      DATA`CONFIG`FOES`FIELD`RANK`LABEL: |-
        Rank
      DATA`CONFIG`FOES`FIELD`RANK`DESCRIPTION: |-
        troublesome, dangerous, formidable, extreme or epic: how fast progress against it is marked, and the harm it deals.
      DATA`CONFIG`FOES`FIELD`NATURE`TYPE: |-
        text
      DATA`CONFIG`FOES`FIELD`NATURE`MIN: |-
        0
      DATA`CONFIG`FOES`FIELD`NATURE`MAX: |-
        40
      DATA`CONFIG`FOES`FIELD`NATURE`LABEL: |-
        Nature
      DATA`CONFIG`FOES`FIELD`NATURE`DESCRIPTION: |-
        What kind of thing it is: Ironlander, animal, horror, firstborn.
      DATA`CONFIG`FOES`FIELD`FEATURES`TYPE: |-
        text
      DATA`CONFIG`FOES`FIELD`FEATURES`MIN: |-
        0
      DATA`CONFIG`FOES`FIELD`FEATURES`MAX: |-
        200
      DATA`CONFIG`FOES`FIELD`FEATURES`LABEL: |-
        Features
      DATA`CONFIG`FOES`FIELD`FEATURES`DESCRIPTION: |-
        What it looks like, for the GM.
      DATA`CONFIG`FOES`FIELD`DRIVES`TYPE: |-
        text
      DATA`CONFIG`FOES`FIELD`DRIVES`MIN: |-
        0
      DATA`CONFIG`FOES`FIELD`DRIVES`MAX: |-
        200
      DATA`CONFIG`FOES`FIELD`DRIVES`LABEL: |-
        Drives
      DATA`CONFIG`FOES`FIELD`DRIVES`DESCRIPTION: |-
        What it wants.
      DATA`CONFIG`FOES`FIELD`TACTICS`TYPE: |-
        text
      DATA`CONFIG`FOES`FIELD`TACTICS`MIN: |-
        0
      DATA`CONFIG`FOES`FIELD`TACTICS`MAX: |-
        200
      DATA`CONFIG`FOES`FIELD`TACTICS`LABEL: |-
        Tactics
      DATA`CONFIG`FOES`FIELD`TACTICS`DESCRIPTION: |-
        How it fights.
      # +config's CHECK for a foe's rank (%0).
      CHECK`RANK: |-
        if(member(v(DATA`RANKS),lcstr(%0)),,A rank is [itemize(v(DATA`RANKS),,or)].)
      # The most foes one encounter holds.
      DATA`FOE`MAX: |-
        30
      # ---- commands ---------------------------------------------------------------
      # %1 the switches and %2 what follows, exactly as typed.
      CMD`SHEET:
        value: |-
          $(?is)^\+sheet(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,sheet,table,SHEET,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`CHECK:
        value: |-
          $(?is)^\+check(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,check,table,CHECK,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`VOW:
        value: |-
          $(?is)^\+vow(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,vow,table,VOW,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`ENCOUNTER:
        value: |-
          $(?is)^\+encounter(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,encounter,table,ENCOUNTER,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`FOE:
        value: |-
          $(?is)^\+foe(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,foe,table,FOE,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      # A line a bridge adds to one of this object's messages: HINT`<message>, set here by a bridge such as
      # sheet-ironsworn-help. %1 on are passed to it. Nothing when no bridge set one, so the message stands without it.
      FUN`HINT:
        value: |-
          if(hasattr(%!,HINT`%0),%b[u(%!/HINT`%0,%1,%2)])
        flags: [funsyntax]
      INC`COMMAND`RUN:
        value: |-
          @assert hastype(%#,player)=@pemit %#=notice(SHEET,Only players have a sheet.,warn); think u(%!/FUN`COMMAND`PARSE,%<word>,%<table>,%<switches>,%<argument>); @assert lte(words(%q<cmd_switch_list>),1)=@pemit %#=notice(SHEET,Use one switch at a time.,warn); @assert strlen(%q<cmd_route>)=@pemit %#=notice(SHEET,+%q<cmd_word> has no /%q<cmd_switch> switch.[u(%!/FUN`HINT,SWITCHES,%q<cmd_word>)],warn); @include %!/INC`%q<cmd_route>
        flags: [cmdsyntax]
      # %0 the word, %1 its route table, %2 the switches and %3 the argument, as typed. Sets cmd_word,
      # cmd_switch_list, cmd_switch, cmd_argument, cmd_has_equals, cmd_left_side and cmd_right_side around the
      # first =, cmd_route (the INC` routine to run), viewer_objid and viewer_keeper.
      FUN`COMMAND`PARSE:
        value: |-
          setqm(cmd_word,lcstr(%0),
          cmd_switch_list,lcstr(trim(edit(%2,/,%b))),
          cmd_switch,first(%q<cmd_switch_list>),
          cmd_argument,trim(%3),
          cmd_has_equals,strmatch(%3,*=*),
          cmd_left_side,trim(before(%3,=)),
          cmd_right_side,trim(after(%3,=)),
          cmd_route,get(%!/DATA`ROUTE`%1`[if(strlen(%q<cmd_switch>),ucstr(%q<cmd_switch>),if(strlen(%q<cmd_argument>),ARG,BARE))]),
          viewer_objid,objid(%#),
          viewer_keeper,u(%!/FUN`PERM`KEEPER,%#))
        flags: [funsyntax]

      # ---- guards -----------------------------------------------------------------
