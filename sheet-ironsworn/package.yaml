        flags: [funsyntax]

      # ---- the sheet API ------------------------------------------------------------
      # What other packages call: u({{sheet-ironsworn/sheet}}/API`<NAME>,...). Every sheet package has these
      # names. They read the character's sheet itself, never an encounter's copy. They read and roll; API`ADJUST and
      # API`AWARD are the ones that write, and API`AWARD's experience is an experience ledger entry.
      API:
        value: |-
          The Ironsworn sheet's functions for other packages. See the package README.
        flags: [VISUAL]
      # JSON list of the stats: [{"key","label","group","always"}], group stat. always is true for every one.
      API`TRAITS:
        value: |-
          json_array(iter(u(%!/FUN`LIST`ALL,STAT),json(object,key,json(string,lcstr(%i0)),label,json(string,u(%!/FUN`LIST`LABEL,STAT,%i0)),group,json(string,stat),always,json(boolean,1)),%b,|),|)
        flags: [VISUAL]
      API`ALWAYS:
        value: |-
          lcstr(u(%!/FUN`LIST`ALL,STAT))
        flags: [VISUAL]
      API`FIND:
        value: |-
          lcstr(u(%!/FUN`LIST`FIND,STAT,%0))
        flags: [VISUAL]
      API`LABEL:
        value: |-
          u(%!/FUN`LIST`LABEL,STAT,ucstr(%0))
        flags: [VISUAL]
      # %0 a character, %1 a stat: its value on the sheet, 1 when unassigned.
      API`RATING:
        value: |-
          u(%!/FUN`R,u(%!/FUN`STATS`LIVE,%0),ucstr(%1))
        flags: [VISUAL]
      # %0 a character, %1 an asset: the abilities marked, 0 when they do not have it.
      API`ASSET:
        value: |-
          u(%!/FUN`R`ASSET,u(%!/FUN`ASSETS`LIVE,%0),ucstr(%1))
        flags: [VISUAL]
      API`HAS:
        value: |-
          hasattr(%0,IRONSWORN)
        flags: [VISUAL]
      # %0 a difficulty word or a number from -5 to 5: what it adds to the action die, or nothing.
      API`TARGET:
        value: |-
          cond(member(v(DATA`DIFFICULTIES),lcstr(%0)),extract(get(%!/DATA`CONFIG`ADDS),member(v(DATA`DIFFICULTIES),lcstr(%0)),1),u(%!/FUN`IS`ADD,%0),%0)
        flags: [VISUAL]
      # %0 the action (or progress) score, %1 and %2 the challenge dice. A hit beats a die; ties go to the die.
      # Two hits a strong hit (success), one a weak hit (partial), none a miss (fail); a match on the challenge
      # dice makes a strong hit crit-success and a miss crit-fail.
      API`TIER:
        value: |-
          setq(tier_hits,add(gt(%0,%1),gt(%0,%2)))[cond(not(cand(isint(%0),isint(%1),isint(%2))),,eq(%q<tier_hits>,2),if(eq(%1,%2),crit-success,success),eq(%q<tier_hits>,1),partial,if(eq(%1,%2),crit-fail,fail))]
        flags: [VISUAL]
      # %0 a character, %1 a meter (HEALTH SPIRIT SUPPLY MOMENTUM): its value on the sheet, the start when not set.
      API`METER:
        value: |-
          if(member(v(DATA`METERS),ucstr(%1)),u(%!/FUN`METER`NOW,%0,%1,1),#-1 NO SUCH METER)
        flags: [VISUAL]
      # %0 a character, %1 a meter, %2 how much to add (or take, below 0): writes it to the sheet within the meter's
      # range and returns the new value. XP as the meter gives experience, as API`AWARD does.
      API`ADJUST:
        value: |-
          cond(strmatch(%1,XP),u(%!/API`AWARD,%0,%2,),member(v(DATA`METERS),ucstr(%1)),u(%!/FUN`METER`SET,%0,%1,add(u(%!/FUN`METER`NOW,%0,%1,1),%2),1),#-1 NO SUCH METER)
        flags: [VISUAL]
      # %0 a character: the experience they have to spend.
      API`XP:
        value: |-
          default(%0/IRONSWORN`XP,0)
        flags: [VISUAL]
      # %0 a character, %1 experience to give (or take, below 0), %2 why (Reward when empty): never below 0,
      # an experience ledger entry; returns what they have now.
      API`AWARD:
        value: |-
          u(%!/FUN`XP`ADD,%0,%1,firstof(%2,Reward))
        flags: [VISUAL]
      # Named: %<roller> an objid, %<trait> a stat key, %<modifier> adds, %<target> adds from the difficulty or
      # nothing. Makes the action roll and keeps it (roll() record), and returns {"tier","action","challenge",
      # "match","stat","target","label","text","roll","formula"}. #-1 and why when the stat or roller is wrong.
      API`CHECK:
        value: |-
          setq(check_api_key,u(%!/FUN`LIST`FIND,STAT,%<trait>))[cond(not(hastype(%<roller>,player)),#-1 There is no character to roll for.,not(strlen(%q<check_api_key>)),#-1 There is no stat '%<trait>'.,u(%!/FUN`CHECK`ROLLED,%q<check_api_key>,u(%!/API`RATING,%<roller>,%q<check_api_key>),add(firstof(%<modifier>,0),firstof(%<target>,0)),%<target>))]
        flags: [VISUAL]

      # ---- lifecycle ----------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP:
        value: |-
          @command/add/noparse/rsnoparse +sheet; @hook/override/inline +sheet=%!,CMD`SHEET; @command/add/noparse/rsnoparse +check; @hook/override/inline +check=%!,CMD`CHECK; @command/add/noparse/rsnoparse +vow; @hook/override/inline +vow=%!,CMD`VOW; @command/add/noparse/rsnoparse +encounter; @hook/override/inline +encounter=%!,CMD`ENCOUNTER; @command/add/noparse/rsnoparse +foe; @hook/override/inline +foe=%!,CMD`FOE
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

  # The lists. Inside the Ironsworn Sheet, so no player can reach it, and no_command, so nothing kept on it is ever
  # matched as a command. STAT`<KEY> a stat's label, with ORDER beneath; ASSET`<KEY> an asset's label, with TYPE,
  # HEALTH, FIRST, SECOND, THIRD and ORDER beneath. Staff change them with +config ironsworn/stats and /assets.
  # The assets here are a starting set in this package's own words.
  - ref: store
    type: thing
    name: Ironsworn Sheet Store
    location: "{{sheet}}"
    flags: [no_command]
    attributes:
      # The foes, +config ironsworn/foes: the package's own, in its own words.
      FOE`RAT-SWARM: |-
        Rat swarm
      FOE`RAT-SWARM`RANK: |-
        troublesome
      FOE`RAT-SWARM`NATURE: |-
        Animal
      FOE`RAT-SWARM`FEATURES: |-
        A tide of fur, teeth and red eyes.
      FOE`RAT-SWARM`DRIVES: |-
        To feed.
      FOE`RAT-SWARM`TACTICS: |-
        Swarm over one foe; flee from fire.
