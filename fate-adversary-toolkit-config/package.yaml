format: "1.20"
package: fate-adversary-toolkit-config
title: "Fate Adversary Toolkit: +config settings"
version: 1.0.2
authors: [SharpMUSH]
description: "Puts the Fate Adversary Toolkit settings and its adversary and obstacle libraries into +config: registers them with the +config registry, so staff see and change them with +config adversary."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, fate, config, bridge]
category: Game System
subcategory: Fate
bridge: true
requires_server: ">=1.0"
verified_server: "1.0"

# A bridge: it joins two packages that do not know about each other. fate-adversary-toolkit declares its settings
# as DATA`CONFIG`<NAME>, with their types and limits, and reads them with get() whether or not +config is
# installed. This package is the one leaf that tells the +config registry where they are.
depends:
  - package: fate-adversary-toolkit
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH.Packages
      path: fate-adversary-toolkit/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`ADVERSARY: |-
        {{fate-adversary-toolkit/adversary}}
