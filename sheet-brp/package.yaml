          setqm(so_order,get({{encounters}}/ENC`%0`ORDER),so_turn,get({{encounters}}/ENC`%0`TURN))[box(if(words(%q<so_order>),Round [get({{encounters}}/ENC`%0`ROUND)].%r[rule()]%r[ldatatable(lit({"nowrap":"1|2|3|4","grow":"||||1"}),|Name|>[if(get(%!/DATA`CONFIG`STRIKERANKS),SR,DEX)]|>HP|Conditions,iter(%q<so_order>,[if(eq(inum(0),%q<so_turn>),>)]|[if(u(%!/FUN`TOKEN`LIVE,%0,first(%i0,~)),u(%!/FUN`TOKEN`NAME,%0,first(%i0,~)),tone(muted,u(%!/FUN`TOKEN`NAME,%0,first(%i0,~))))]|[last(%i0,~)]|[u(%!/FUN`TOKEN`HP,%0,first(%i0,~))]|[firstof(u(%!/FUN`COND`TEXT,%0,first(%i0,~)),-)],%b,%*<^>),%*<^>)],No order yet. The GM sets it with +encounter/initiative.)%r[rule()]%r[tone(muted,+encounter/next passes the turn on. Muted names are down or out.)],Order: [u(%!/FUN`ENC`NAME,%0)])]
        flags: [funsyntax]

      # ---- the sheet API ----------------------------------------------------------
      # What other packages call: u({{sheet-brp/sheet}}/API`<NAME>,...). Every sheet package has these names.
      # They read the character's sheet itself, never an encounter's copy. They read and roll; API`RAISE,
      # API`HEAL and API`AWARD are the ones that write, API`RAISE is a sheet ledger entry and API`AWARD a coin ledger entry.
      API:
        value: |-
          The percentile sheet's functions for other packages. See the package README.
        flags: [VISUAL]
      # JSON list of the characteristic rolls and skills: [{"key","label","group","always"}], group
      # characteristic or the skill's category. always is true for a characteristic roll and a skill with a base
      # chance above 0 for an average character.
      API`TRAITS:
        value: |-
          json_array(iter(u(%!/FUN`TRAIT`ROLLS),json(object,key,json(string,lcstr(%i0)),label,json(string,u(%!/FUN`TRAIT`LABEL,%i0)),group,json(string,characteristic),always,json(boolean,1)),%b,|)|[iter(u(%!/FUN`LIST`ALL,SKILL),json(object,key,json(string,lcstr(%i0)),label,json(string,get({{store}}/SKILL`%i0)),group,json(string,default({{store}}/SKILL`%i0`CATEGORY,mental)),always,json(boolean,gt(u(%!/FUN`SKILL`BASE,,%i0),0))),%b,|)],|)
        flags: [VISUAL]
      # The keys an average character can roll, lower case.
      API`ALWAYS:
        value: |-
          lcstr(u(%!/FUN`TRAIT`ROLLS) [filterbool(%!/FUN`SKILL`HASBASE,u(%!/FUN`LIST`ALL,SKILL))])
        flags: [VISUAL]
      FUN`SKILL`HASBASE:
        value: |-
          gt(u(%!/FUN`SKILL`BASE,,%0),0)
        flags: [funsyntax]
      API`FIND:
        value: |-
          lcstr(u(%!/FUN`TRAIT`FIND,%0))
        flags: [VISUAL]
      API`LABEL:
        value: |-
          u(%!/FUN`TRAIT`LABEL,ucstr(%0))
        flags: [VISUAL]
      # %0 a character, %1 a key: the percentage, a characteristic times 5 or a skill's.
      API`RATING:
        value: |-
          null(u(%!/FUN`BUILD`OF,%0))[u(%!/FUN`RATE,%q<build_rows>,%q<build_chars>,ucstr(%1))]
        flags: [VISUAL]
      # %0 a character, %1 a key: 1 when a skill stands above its base chance; a characteristic roll always.
      API`TRAINED:
        value: |-
          setq(trained_key,ucstr(%1))[if(strmatch(u(%!/FUN`TRAIT`KIND,%q<trained_key>),CHAR),1,gt(u(%!/API`RATING,%0,%q<trained_key>),u(%!/FUN`SKILL`BASE,%q<build_chars>,%q<trained_key>)))]
        flags: [VISUAL]
      API`HAS:
        value: |-
          hasattr(%0,BRP)
        flags: [VISUAL]
      # %0 a difficulty word or a level: the level (automatic easy average difficult impossible), or nothing.
      API`TARGET:
        value: |-
          cond(member(v(DATA`DIFFICULTIES),lcstr(%0)),lcstr(extract(get(%!/DATA`CONFIG`DIFFICULTY),member(v(DATA`DIFFICULTIES),lcstr(%0)),1)),member(v(DATA`LEVELS),lcstr(%0)),lcstr(%0),strmatch(%0,normal),average)
        flags: [VISUAL]
      # %0 fumble, critical, special, success, failure or automatic: the tier.
      API`TIER:
        value: |-
          switch(%0,fumble,crit-fail,critical,crit-success,special,success,success,success,automatic,success,failure,fail)
        flags: [VISUAL]
      # %0 a character, %1 a skill, %2 percent to add, %3 why (Reward when empty): a ledger entry that raises it,
      # never past 999. Returns the new percentage.
      API`RAISE:
        value: |-
          setqm(raise_key,ucstr(u(%!/FUN`TRAIT`FIND,%1)),raise_old,u(%!/API`RATING,%0,%1))[setq(raise_new,min(999,max(0,add(%q<raise_old>,%2))))][if(cand(strmatch(u(%!/FUN`TRAIT`KIND,%q<raise_key>),SKILL),hasattr({{store}},SKILL`%q<raise_key>),neq(%q<raise_new>,%q<raise_old>)),null(u(%!/FUN`ENTRY`ADD,%0,improve,%q<raise_key>,sub(%q<raise_new>,%q<raise_old>),play)))]%q<raise_new>
        flags: [VISUAL]
      # %0 a character, %1 HP or PP: the most they hold.
      API`MOST:
        value: |-
          null(u(%!/FUN`BUILD`OF,%0))[u(%!/FUN`MOST,%q<build_chars>,%1)]
        flags: [VISUAL]
      # %0 a character, %1 HP or PP: what they have left on their sheet.
      API`LEFT:
        value: |-
          u(%!/FUN`LEFT,%0,%1,1)
        flags: [VISUAL]
      # %0 a character, %1 HP or PP, %2 how many to give back on their sheet: never past the most. Returns what
      # they have.
      API`HEAL:
        value: |-
          setqm(heal_most,u(%!/API`MOST,%0,%1),heal_new,min(%q<heal_most>,add(u(%!/API`LEFT,%0,%1),%2)))[u(%!/FUN`PSET,%0,%1,if(neq(%q<heal_new>,%q<heal_most>),%q<heal_new>),1)]%q<heal_new>
        flags: [VISUAL]
      # %0 a character: the coin on their sheet.
      API`COIN:
        value: |-
          default(%0/BRP`COIN,0)
        flags: [VISUAL]
      # %0 a character, %1 coin to give (or take, below 0), %2 why (Reward when empty): a coin ledger entry on
      # their sheet, never below 0; returns the new count.
      API`AWARD:
        value: |-
          u(%!/FUN`COIN`ADD,%0,%1,1,firstof(%2,Reward))
        flags: [VISUAL]
      # Named: %<roller> an objid, %<trait> a key, %<modifier> percent to add, %<target> a level or nothing
      # (average). Rolls 1d100 and keeps the roll (roll() record); automatic and impossible roll nothing. Returns
      # {"tier","level","total","rating","chance","target","label","text","roll","formula"}. #-1 and why when the
      # trait or roller is wrong.
      API`CHECK:
        value: |-
          setq(check_api_key,ucstr(u(%!/FUN`TRAIT`FIND,%<trait>)))[cond(not(hastype(%<roller>,player)),#-1 There is no character to roll for.,not(strlen(%q<check_api_key>)),#-1 There is no characteristic or skill '%<trait>'.,strmatch(%q<check_api_key>,SIZ),#-1 SIZ has no roll of its own.,u(%!/FUN`CHECK`ROLLED,%<roller>,%q<check_api_key>,firstof(%<target>,average),firstof(%<modifier>,0)))]
        flags: [VISUAL]
      # %0 the roller, %1 the key, %2 the level, %3 percent to add.
      FUN`CHECK`ROLLED:
        value: |-
          setqm(rolled_rating,u(%!/API`RATING,%0,%1),
          rolled_chance,add(u(%!/FUN`CHANCE`AT,%q<rolled_rating>,%2),%3),
          rolled,if(member(automatic impossible,%2),,roll(1d100,,record)),
          rolled_total,if(strlen(%q<rolled>),json_query(%q<rolled>,extract,$.total)),
          rolled_level,switch(%2,automatic,automatic,impossible,failure,u(%!/FUN`CHANCE`LEVEL,%q<rolled_total>,%q<rolled_chance>,cor(strmatch(u(%!/FUN`TRAIT`KIND,%1),CHAR),gte(u(%!/FUN`SKILL`BASE,%q<build_chars>,%1),5)))))[json(object,tier,json(string,u(%!/API`TIER,%q<rolled_level>)),level,json(string,%q<rolled_level>),total,json(string,%q<rolled_total>),rating,%q<rolled_rating>,chance,%q<rolled_chance>,target,json(string,%2),label,json(string,u(%!/FUN`TRAIT`LABEL,%1)),text,json(string,if(strlen(%q<rolled>),json_query(%q<rolled>,extract,$.text))),roll,json(string,if(strlen(%q<rolled>),json_query(%q<rolled>,extract,$.id))),formula,json(string,if(strlen(%q<rolled>),1d100)))]
        flags: [funsyntax]

      # ---- lifecycle --------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP:
        value: |-
          @command/add/noparse/rsnoparse +sheet; @hook/override/inline +sheet=%!,CMD`SHEET; @command/add/noparse/rsnoparse +check; @hook/override/inline +check=%!,CMD`CHECK; @command/add/noparse/rsnoparse +encounter; @hook/override/inline +encounter=%!,CMD`ENCOUNTER; @command/add/noparse/rsnoparse +foe; @hook/override/inline +foe=%!,CMD`FOE
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

