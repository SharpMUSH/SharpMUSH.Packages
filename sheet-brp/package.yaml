        flags: [cmdsyntax]
      # A ledger entry: %<who>, %<kind>, %<key>, %<value>, %<phase> (chargen, play or staff). entry_n is its number.
      INC`DO`ENTRY:
        value: |-
          think setq(entry_n,u(%!/FUN`ENTRY`ADD,%<who>,%<kind>,%<key>,%<value>,%<phase>))
        flags: [cmdsyntax]
      # A ledger entry written from a function: %0 who, %1 kind, %2 key, %3 value, %4 phase. Returns its number.
      # A chargen entry rewrites the chargen entry in force of the same kind and key.
      FUN`ENTRY`ADD:
        value: |-
          setq(ea_n,if(strmatch(%4,chargen),u(%!/FUN`LEDGER`CHARGENOF,%0,%1,%2)))[setq(ea_n,firstof(%q<ea_n>,inc(lmax(0 [iter(lattr(%0/BRP`LEDGER`*),last(%i0,`))]))))][u(%!/FUN`API`ROOT,%0)][attrib_set(%0/BRP`LEDGER`%q<ea_n>,json(object,n,%q<ea_n>,kind,json(string,%1),key,json(string,%2),value,json(string,%3),phase,json(string,%4),by,json(string,objid(%#)),at,secs()))][set(%0/BRP`LEDGER`%q<ea_n>,wizard)]%q<ea_n>
        flags: [funsyntax]
      # %<who> joins encounter %<n> with a copy of their sheet: hit points, power points and coin. Its experience
      # checks start empty. It goes last in their BRP`ENCOUNTERS.
      INC`DO`ENCJOIN:
        value: |-
          think setq(join_path,u(%!/FUN`ENC`PATH,%<n>,%<who>)); think [attrib_set(left(%q<join_path>,dec(strlen(%q<join_path>))),copy)][iter(u(%!/FUN`PLAY`LEAVES),if(strlen(get(%<who>/BRP`%i0)),attrib_set(%q<join_path>%i0,get(%<who>/BRP`%i0))))]; @include/args %!/INC`DO`SET=who,%<who>,leaf,ENCOUNTERS,value,squish([setdiff(get(%<who>/BRP`ENCOUNTERS),%<n>)] %<n>)
        flags: [cmdsyntax]
