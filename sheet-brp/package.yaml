        flags: [cmdsyntax]
      INC`NEED`MEMBER:
        value: |-
          @assert u(%!/FUN`ENC`MEMBER,%q<sheet_who>,%q<enc_n>)=@pemit %#=notice(ENCOUNTER,[name(%q<sheet_who>)] is not in [u(%!/FUN`ENC`NAME,%q<enc_n>)].,warn)
        flags: [cmdsyntax]

      # ---- writes -----------------------------------------------------------------
      # %<who> an objid. The BRP root is wizard-flagged and no_command, and its leaves take that from it.
      INC`DO`ROOT:
        value: |-
          think u(%!/FUN`API`ROOT,%<who>)
        flags: [cmdsyntax]
