        flags: [funsyntax]

      # ---- the ledger -------------------------------------------------------------
      # A character's build is the entries under BRP`LEDGER`<n>, each a JSON object: n, kind, key, value, phase
      # (chargen, play or staff), by (an objid) and at (secs). Kinds: char {key a characteristic, value; empty is
      # unassigned}, skill {key a skill, value the points put in above its base}, improve {key a skill, value the
      # percent an experience check or a reward added}, revoke {value: the entry it takes back}, clear (every entry
      # before it). Rows are n~kind~key~value~phase~by.
