      FUN`BUILD`OF:
        value: |-
          u(%!/FUN`BUILD`ROWS,u(%!/FUN`LEDGER`LIVE,u(%!/FUN`LEDGER`ROWS,%0)))
        flags: [funsyntax]
      # %0 rows in force: build_rows and build_chars.
      FUN`BUILD`ROWS:
        value: |-
          setq(build_rows,%0)[setq(build_chars,u(%!/FUN`BUILD`CHARS,%0))]
        flags: [funsyntax]
      FUN`BUILD`CHARS:
        value: |-
          squish(iter(u(%!/FUN`LIST`ALL,CHAR),if(strlen(setr(bc_value,elements(last(graball(%0,*~char~%i0~*)),4,~))),%i0=%q<bc_value>)))
        flags: [funsyntax]
      # %0 rows, %1 a skill: the points put into it (the last skill entry), and the experience it gained.
      FUN`BUILD`POINTS:
        value: |-
          firstof(elements(last(graball(%0,*~skill~%1~*)),4,~),0)
        flags: [funsyntax]
      FUN`BUILD`IMPROVED:
        value: |-
          ladd(0 [iter(graball(%0,*~improve~%1~*),elements(%i0,4,~))])
        flags: [funsyntax]
      # %0 rows: the skill points spent.
      FUN`BUILD`SPENT:
        value: |-
