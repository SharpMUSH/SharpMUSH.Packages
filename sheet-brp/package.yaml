        value: |-
          think u(%!/FUN`WIPE,{{encounters}},ENC`%<n>`COPY`[after(num(%<who>),#)]); @include/args %!/INC`DO`SET=who,%<who>,leaf,ENCOUNTERS,value,squish(iter(get(%<who>/BRP`ENCOUNTERS),if(comp(%i0,%<n>),%i0))); @if not(comp(get(%<who>/BRP`USING),%<n>))={&BRP`USING %<who>}
        flags: [cmdsyntax]
      # %0 an object, %1 an attribute: clears it and every attribute beneath it, deepest first.
      FUN`WIPE:
        value: |-
          iter(revwords(lattr(%0/%1`**)) %1,attrib_set(%0/%i0))
        flags: [funsyntax]
      # %0 obj/attr, %1 a value: writes it, or clears it when empty. Nothing a player wrote is evaluated.
      FUN`SETLEAF:
        value: |-
          if(strlen(%1),attrib_set(%0,%1),if(strlen(get(%0)),attrib_set(%0)))
        flags: [funsyntax]
      # The leaves an encounter's copy takes from the sheet and /keep writes back. MARKS is added to, apart.
      FUN`PLAY`LEAVES:
        value: |-
          HP PP COIN
        flags: [funsyntax]

      # ---- where play happens -----------------------------------------------------
      # %0 a character, %1 1 for their sheet whatever encounter they are in: where their hit points, power points,
      # coin and experience checks are now, as obj/prefix to put a leaf after: the copy in use, else the sheet.
      FUN`PATH:
        value: |-
          if(cor(%1,not(strlen(setr(path_n,u(%!/FUN`ENC`ACTIVE,%0))))),%0/BRP`,u(%!/FUN`ENC`PATH,%q<path_n>,%0))
        flags: [funsyntax]
