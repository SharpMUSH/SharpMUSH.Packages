        flags: [funsyntax]
      # %0 KEY=value pairs, %1 a key: its value, 0 when not there.
      FUN`R:
        value: |-
          firstof(after(grab(%0,%1=*),=),0)
        flags: [funsyntax]
      FUN`R`SUM:
        value: |-
          ladd(0 [iter(%0,after(%i0,=))])
        flags: [funsyntax]
