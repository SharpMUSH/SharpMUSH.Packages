format: "1.16"
package: sheet-brp
title: "Percentile sheet (BRP)"
version: 2.0.0
authors: [SharpMUSH]
description: "A percentile character sheet on the Basic Roleplaying rules: seven characteristics and a skill list with base chances the game edits, built from a ledger, with point-buy character creation, experience checks that raise skills, hit points, power points and coin, an audited log of coin and skill gains, and encounters that play from copies of the sheets. +check rolls 1d100 under a skill or a characteristic roll, doubled or halved for difficulty, and reads critical, special, success, failure or fumble. The skill list is ORC Licensed Material from Basic Roleplaying: Universal Game Engine."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, brp, percentile, d100, skills]
category: Characters
requires_server: ">=0.1"

# One permission, for the people who keep sheets: change any character's sheet at any time, read every sheet,
# give coin, mark experience checks, revoke and clear ledger entries, and run any encounter. A player shares out
# their own characteristic and skill points until they are approved, then raises skills with experience checks,
# and keeps their own hit points, power points and coin at any time. Changing the lists and settings is config.admin, as +config is.
categories:
  roles:
    - name: Percentile sheet
      description: Roles for the people who keep percentile character sheets.
  permissions:
    - name: Percentile sheet
      description: Keeping percentile character sheets.
permissions:
  - name: softcode.brp.admin
    category: Percentile sheet
    description: Read every percentile sheet and change any character's at any time.
roles:
  - slug: brp-sheet-keeper
    name: BRP Sheet Keeper
    category: Percentile sheet
    priority: 11
    permissions:
      softcode.brp.admin: allow

# Every character's BRP tree is their percentile sheet: only wizards write it, so a player can't make the root
# before the sheet does, and it is never a command.
attributes:
  BRP:
    flags: [wizard, no_command]

objects:
  # The command object, in the master room. WIZARD because it adds the commands (@command/add, @hook),
  # writes the sheet attributes on characters, and reads them for other packages.
  #
  # A character's sheet is their own attributes under BRP`: BRP`LEDGER`<n> the entries their characteristics
  # and skills are built from, BRP`HP and BRP`PP the hit points and power points left (unset is the most),
  # BRP`COIN the coin, BRP`MARKS the skills marked for an experience check, BRP`LOG`<n> the log of coin and skill
  # gains, and BRP`ENCOUNTERS and BRP`USING the encounters they are in. The BRP root is wizard-flagged, so only
  # this object writes them.
  #
  # +sheet, +check and +encounter are added with /noparse/rsnoparse and hooked to CMD`<word>, so what a player
  # types reaches the code exactly as typed and nothing a player wrote is ever evaluated.
  #
  # Trees: CMD` the hooked commands, INC`COMMAND` the parse and dispatch, INC`SHEET`, INC`CHECK` and INC`ENCOUNTER`
  # one routine per switch, INC`NEED` the guards they share, INC`DO` the writes. FUN`LEDGER` and FUN`BUILD` the
  # ledger, FUN`P and FUN`PSET where play happens, FUN`ENC` the encounters, FUN`LOG` the log, FUN`TRAIT` characteristics and skills together,
  # FUN`LIST` the store's lists, FUN`BASE` base chances, FUN`CHANCE` the numbers, FUN`PERM` who may do what,
  # FUN`SCREEN` and FUN`DISPLAY` the screens. API` the functions other packages call (VISUAL), the same names in
  # every sheet package. Bridges add HINT`<message> lines, GATE`EDIT (a reason a player may not change their own
  # sheet now) and ALLOW`VIEW`<name> (who else may read a sheet).
  - ref: sheet
    type: thing
    name: BRP Sheet
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      # ---- settings ---------------------------------------------------------------
      # +config brp shows and changes them (sheet-brp-config); the code reads each with get(%!/DATA`CONFIG`<NAME>).
      DATA`CONFIG: |-
        Settings for the percentile sheet. One leaf per setting.
      DATA`CONFIG`LABEL: |-
        Percentile sheet
      DATA`CONFIG`CHARCAP: |-
        18
      DATA`CONFIG`CHARCAP`TYPE: |-
        integer
      DATA`CONFIG`CHARCAP`DEFAULT: |-
        18
      DATA`CONFIG`CHARCAP`MIN: |-
        3
      DATA`CONFIG`CHARCAP`MAX: |-
        99
      DATA`CONFIG`CHARCAP`LABEL: |-
        Highest characteristic
      DATA`CONFIG`CHARCAP`DESCRIPTION: |-
        The highest characteristic a player gives themselves while making a character. Sheet keepers may go to 99.
      DATA`CONFIG`CHARCAP`EXAMPLE: |-
        21
      DATA`CONFIG`SKILLCAP: |-
        75
      DATA`CONFIG`SKILLCAP`TYPE: |-
        integer
      DATA`CONFIG`SKILLCAP`DEFAULT: |-
        75
      DATA`CONFIG`SKILLCAP`MIN: |-
        1
      DATA`CONFIG`SKILLCAP`MAX: |-
        999
      DATA`CONFIG`SKILLCAP`LABEL: |-
        Highest skill
      DATA`CONFIG`SKILLCAP`DESCRIPTION: |-
        The highest percentage a player gives a skill while making a character. Experience checks and sheet keepers go past it.
      DATA`CONFIG`SKILLCAP`EXAMPLE: |-
        90
      DATA`CONFIG`CHARPOINTS: |-
        75
      DATA`CONFIG`CHARPOINTS`TYPE: |-
        integer
      DATA`CONFIG`CHARPOINTS`DEFAULT: |-
        75
      DATA`CONFIG`CHARPOINTS`MIN: |-
        7
      DATA`CONFIG`CHARPOINTS`MAX: |-
        693
      DATA`CONFIG`CHARPOINTS`LABEL: |-
        Characteristic points
      DATA`CONFIG`CHARPOINTS`DESCRIPTION: |-
        The points a new character shares out among their characteristics, each from 3 to the highest characteristic.
      DATA`CONFIG`CHARPOINTS`EXAMPLE: |-
        84
      DATA`CONFIG`SKILLPOINTS: |-
        300
      DATA`CONFIG`SKILLPOINTS`TYPE: |-
        integer
      DATA`CONFIG`SKILLPOINTS`DEFAULT: |-
        300
      DATA`CONFIG`SKILLPOINTS`MIN: |-
        0
      DATA`CONFIG`SKILLPOINTS`MAX: |-
        9999
      DATA`CONFIG`SKILLPOINTS`LABEL: |-
        Skill points
      DATA`CONFIG`SKILLPOINTS`DESCRIPTION: |-
        The percent a new character adds to their skills above the base chances.
      DATA`CONFIG`SKILLPOINTS`EXAMPLE: |-
        250
      DATA`CONFIG`IMPROVE: |-
        6
      DATA`CONFIG`IMPROVE`TYPE: |-
        integer
      DATA`CONFIG`IMPROVE`DEFAULT: |-
        6
      DATA`CONFIG`IMPROVE`MIN: |-
        1
      DATA`CONFIG`IMPROVE`MAX: |-
        20
      DATA`CONFIG`IMPROVE`LABEL: |-
        Experience die
      DATA`CONFIG`IMPROVE`DESCRIPTION: |-
        The sides of the die an experience check adds to a skill when the roll is over its percentage.
      DATA`CONFIG`IMPROVE`EXAMPLE: |-
        10
      DATA`CONFIG`HITPOINTS: |-
        average
      DATA`CONFIG`HITPOINTS`TYPE: |-
        choice
      DATA`CONFIG`HITPOINTS`DEFAULT: |-
        average
      DATA`CONFIG`HITPOINTS`CHOICES: |-
        average total
      DATA`CONFIG`HITPOINTS`LABEL: |-
        Hit points
      DATA`CONFIG`HITPOINTS`DESCRIPTION: |-
        average: hit points are CON and SIZ added and halved, rounded up. total: CON and SIZ added, for hardier characters.
      DATA`CONFIG`HITPOINTS`EXAMPLE: |-
        total
      DATA`CONFIG`DIFFICULTY: |-
        automatic easy average difficult difficult
      DATA`CONFIG`DIFFICULTY`TYPE: |-
        text
      DATA`CONFIG`DIFFICULTY`DEFAULT: |-
        automatic easy average difficult difficult
      DATA`CONFIG`DIFFICULTY`MAX: |-
        60
      DATA`CONFIG`DIFFICULTY`CHECK: |-
        CHECK`DIFFICULTY
      DATA`CONFIG`DIFFICULTY`LABEL: |-
        Each difficulty
      DATA`CONFIG`DIFFICULTY`DESCRIPTION: |-
        What trivial, easy, standard, hard and extreme mean, in that order: automatic (no roll), easy (doubled), average, difficult (halved) or impossible (fails).
      DATA`CONFIG`DIFFICULTY`EXAMPLE: |-
        automatic easy average difficult impossible
      DATA`CONFIG`PUBLIC: |-
        0
      DATA`CONFIG`PUBLIC`TYPE: |-
        boolean
      DATA`CONFIG`PUBLIC`DEFAULT: |-
        0
      DATA`CONFIG`PUBLIC`LABEL: |-
        Sheets anyone can read
      DATA`CONFIG`PUBLIC`DESCRIPTION: |-
        Whether +sheet <name> shows anyone's sheet to everyone. Otherwise only the character and sheet keepers see it.
      DATA`CONFIG`PUBLIC`EXAMPLE: |-
        yes
      DATA`CONFIG`SKILLS`TYPE: |-
        table
      DATA`CONFIG`SKILLS`LABEL: |-
        Skills
      DATA`CONFIG`SKILLS`DESCRIPTION: |-
        The skills on every sheet, with their base chances.
      DATA`CONFIG`SKILLS`STORE: |-
        {{store}}
      DATA`CONFIG`SKILLS`PATH: |-
        SKILL
      DATA`CONFIG`SKILLS`ENTRY: |-
        label
      DATA`CONFIG`SKILLS`FIELDS: |-
        label base category
      DATA`CONFIG`SKILLS`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`SKILLS`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`SKILLS`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`SKILLS`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`SKILLS`FIELD`LABEL`LABEL: |-
        Label
      DATA`CONFIG`SKILLS`FIELD`LABEL`DESCRIPTION: |-
        The name the sheet shows.
      DATA`CONFIG`SKILLS`FIELD`BASE`TYPE: |-
        text
      DATA`CONFIG`SKILLS`FIELD`BASE`DEFAULT: |-
        0
      DATA`CONFIG`SKILLS`FIELD`BASE`MAX: |-
        30
      DATA`CONFIG`SKILLS`FIELD`BASE`CHECK: |-
        CHECK`BASE
      DATA`CONFIG`SKILLS`FIELD`BASE`LABEL: |-
        Base chance
      DATA`CONFIG`SKILLS`FIELD`BASE`DESCRIPTION: |-
        The chance everyone has: a number, a characteristic times a number (DEX*2), or terms added (INT+POW).
      DATA`CONFIG`SKILLS`FIELD`CATEGORY`TYPE: |-
        choice
      DATA`CONFIG`SKILLS`FIELD`CATEGORY`DEFAULT: |-
        mental
      DATA`CONFIG`SKILLS`FIELD`CATEGORY`CHOICES: |-
        combat communication manipulation mental perception physical
      DATA`CONFIG`SKILLS`FIELD`CATEGORY`LABEL: |-
        Category
      DATA`CONFIG`SKILLS`FIELD`CATEGORY`DESCRIPTION: |-
        Which group the sheet lists it under.
      CHECK`DIFFICULTY: |-
        if(cand(eq(words(%0),5),not(words(setdiff(lcstr(%0),automatic easy average difficult impossible)))),,Give five words%, trivial to extreme%, each automatic%, easy%, average%, difficult or impossible.)
      CHECK`BASE: |-
        if(isint(u(%!/FUN`BASE`EVAL,,%0)),,Write a number%, a characteristic times a number such as DEX*2%, or terms added such as INT+POW.)

      # Which INC` routine each switch runs: DATA`ROUTE`<table>`<switch>. BARE is the command alone, ARG the
      # command with something after it and no switch.
      DATA`ROUTE: |-
        Which routine each switch runs. One leaf per switch.
      DATA`ROUTE`SHEET`BARE: |-
        SHEET`SHOW
      DATA`ROUTE`SHEET`ARG: |-
        SHEET`SHOW
      DATA`ROUTE`SHEET`SET: |-
        SHEET`SET
      DATA`ROUTE`SHEET`CHARGEN: |-
        SHEET`CHARGEN
      DATA`ROUTE`SHEET`IMPROVE: |-
        SHEET`IMPROVE
      DATA`ROUTE`SHEET`MARK: |-
        SHEET`MARK
      DATA`ROUTE`SHEET`COIN: |-
        SHEET`COIN
      DATA`ROUTE`SHEET`LEDGER: |-
        SHEET`LEDGER
      DATA`ROUTE`SHEET`LOG: |-
        SHEET`LOG
      DATA`ROUTE`SHEET`REVOKE: |-
        SHEET`REVOKE
      DATA`ROUTE`SHEET`CLEAR: |-
        SHEET`CLEAR
      DATA`ROUTE`SHEET`HP: |-
        SHEET`HP
      DATA`ROUTE`SHEET`PP: |-
        SHEET`PP
      DATA`ROUTE`SHEET`TRAITS: |-
        SHEET`TRAITS
      DATA`ROUTE`CHECK`BARE: |-
        CHECK`USAGE
      DATA`ROUTE`CHECK`ARG: |-
        CHECK`ROLL
      DATA`ROUTE`CHECK`PRIVATE: |-
        CHECK`ROLL
      DATA`ROUTE`ENCOUNTER`BARE: |-
        ENCOUNTER`SHOW
      DATA`ROUTE`ENCOUNTER`ARG: |-
        ENCOUNTER`SHOW
      DATA`ROUTE`ENCOUNTER`START: |-
        ENCOUNTER`START
      DATA`ROUTE`ENCOUNTER`JOIN: |-
        ENCOUNTER`JOIN
      DATA`ROUTE`ENCOUNTER`USE: |-
        ENCOUNTER`USE
      DATA`ROUTE`ENCOUNTER`ADD: |-
        ENCOUNTER`ADD
      DATA`ROUTE`ENCOUNTER`REMOVE: |-
        ENCOUNTER`REMOVE
      DATA`ROUTE`ENCOUNTER`LEAVE: |-
        ENCOUNTER`LEAVE
      DATA`ROUTE`ENCOUNTER`KEEP: |-
        ENCOUNTER`KEEP
      DATA`ROUTE`ENCOUNTER`END: |-
        ENCOUNTER`END
      DATA`DIFFICULTIES: |-
        trivial easy standard hard extreme
      # What +check also takes after =, and what each comes to.
      DATA`LEVELS: |-
        automatic easy average difficult impossible
      DATA`LEVEL`AUTOMATIC: |-
        automatic, no roll
      DATA`LEVEL`EASY: |-
        easy, doubled
      DATA`LEVEL`AVERAGE: |-
        average
      DATA`LEVEL`DIFFICULT: |-
        difficult, halved
      DATA`LEVEL`IMPOSSIBLE: |-
        impossible
      DATA`CATEGORIES: |-
        combat communication manipulation mental perception physical
      # The most entries a character's ledger holds; a sheet keeper's +sheet/clear starts it again.
      DATA`LEDGER`MAX: |-
        200
      # The most entries a character's log keeps; past it the oldest goes.
      DATA`LOG`MAX: |-
        500

      # ---- commands ---------------------------------------------------------------
      # %1 the switches and %2 what follows, exactly as typed.
      CMD`SHEET:
        value: |-
          $(?is)^\+sheet(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,sheet,table,SHEET,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`CHECK:
        value: |-
          $(?is)^\+check(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,check,table,CHECK,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`ENCOUNTER:
        value: |-
          $(?is)^\+encounter(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,encounter,table,ENCOUNTER,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      # A line a bridge adds to one of this object's messages: HINT`<message>, set here by a bridge such as
      # sheet-brp-help. %1 on are passed to it. Nothing when no bridge set one, so the message stands without it.
      FUN`HINT:
        value: |-
          if(hasattr(%!,HINT`%0),%b[u(%!/HINT`%0,%1,%2)])
        flags: [funsyntax]
      INC`COMMAND`RUN:
        value: |-
          @assert hastype(%#,player)=@pemit %#=notice(SHEET,Only players have a sheet.,warn); think u(%!/FUN`COMMAND`PARSE,%<word>,%<table>,%<switches>,%<argument>); @assert lte(words(%q<cmd_switch_list>),1)=@pemit %#=notice(SHEET,Use one switch at a time.,warn); @assert strlen(%q<cmd_route>)=@pemit %#=notice(SHEET,+%q<cmd_word> has no /%q<cmd_switch> switch.[u(%!/FUN`HINT,SWITCHES,%q<cmd_word>)],warn); @include %!/INC`%q<cmd_route>
        flags: [cmdsyntax]
      # %0 the word, %1 its route table, %2 the switches and %3 the argument, as typed. Sets cmd_word,
      # cmd_switch_list, cmd_switch, cmd_argument, cmd_has_equals, cmd_left_side and cmd_right_side around the
      # first =, cmd_route (the INC` routine to run), viewer_objid and viewer_keeper.
      FUN`COMMAND`PARSE:
        value: |-
          setqm(cmd_word,lcstr(%0),
          cmd_switch_list,lcstr(trim(edit(%2,/,%b))),
          cmd_switch,first(%q<cmd_switch_list>),
          cmd_argument,trim(%3),
          cmd_has_equals,strmatch(%3,*=*),
          cmd_left_side,trim(before(%3,=)),
          cmd_right_side,trim(after(%3,=)),
          cmd_route,get(%!/DATA`ROUTE`%1`[if(strlen(%q<cmd_switch>),ucstr(%q<cmd_switch>),if(strlen(%q<cmd_argument>),ARG,BARE))]),
          viewer_objid,objid(%#),
          viewer_keeper,u(%!/FUN`PERM`KEEPER,%#))
        flags: [funsyntax]

      # ---- guards -----------------------------------------------------------------
      # %<name> a player's name: sheet_who, their objid.
      INC`NEED`TARGET:
        value: |-
          @assert strlen(setr(sheet_who,u(%!/FUN`PLAYER`MATCH,%<name>)))=@pemit %#=notice(SHEET,There is no player called '%<name>'.,warn)
        flags: [cmdsyntax]
      # The left of =, or the whole argument when there is no =: <name>/<what> names someone else, else <what>
      # is on your own sheet. sheet_who and sheet_what. The routine then says who may change it.
      INC`NEED`WHO:
        value: |-
          think setq(who_typed,if(%q<cmd_has_equals>,%q<cmd_left_side>,%q<cmd_argument>)); think setq(who_named,if(strmatch(%q<who_typed>,*/*),trim(before(%q<who_typed>,/)))); @include/args %!/INC`NEED`TARGET=name,firstof(%q<who_named>,%#); think setq(sheet_what,trim(if(strlen(%q<who_named>),after(%q<who_typed>,/),%q<who_typed>)))
        flags: [cmdsyntax]
      # <name>=<value> names someone else, else <value> is for your own sheet: sheet_who and sheet_value.
      INC`NEED`WHOVALUE:
        value: |-
          @include/args %!/INC`NEED`TARGET=name,if(%q<cmd_has_equals>,%q<cmd_left_side>,%#); think setq(sheet_value,if(%q<cmd_has_equals>,%q<cmd_right_side>,%q<cmd_argument>))
        flags: [cmdsyntax]
      # Changes to the build: only a sheet keeper names someone else.
      INC`NEED`OWNSHEET:
        value: |-
          @assert cor(%q<viewer_keeper>,not(comp(%q<sheet_who>,%q<viewer_objid>)))=@pemit %#=notice(SHEET,Only sheet keepers change another character's sheet.,error)
        flags: [cmdsyntax]
      # Changes in play (hit points, power points, coin, experience checks): yourself, a sheet keeper, or the GM of the encounter whose
      # copy the character plays from.
      INC`NEED`PLAY:
        value: |-
          think setq(play_runs,u(%!/FUN`PERM`RUNS,%#,%q<sheet_who>)); @assert cor(%q<viewer_keeper>,not(comp(%q<sheet_who>,%q<viewer_objid>)),%q<play_runs>)=@pemit %#=notice(SHEET,Only sheet keepers%, and the GM of an encounter [name(%q<sheet_who>)] plays in%, change [poss(%q<sheet_who>)] sheet.,error)
        flags: [cmdsyntax]
      # Building the sheet: a keeper at any time (phase staff), a player on their own sheet until they are
      # approved (phase chargen). sheet_phase, and sheet_rows, the ledger's entries in force.
      INC`NEED`BUILD:
        value: |-
          @include %!/INC`NEED`OWNSHEET; @assert cor(%q<viewer_keeper>,not(isapproved(%#)))=@pemit %#=notice(SHEET,Your character is approved%, so staff change your sheet now. +sheet/improve rolls your experience checks.,error); @assert cor(%q<viewer_keeper>,not(strlen(setr(set_gate,u(%!/FUN`GATE`EDIT,%#)))))=@pemit %#=notice(SHEET,%q<set_gate>,warn); @include %!/INC`NEED`ROOM; think setqm(sheet_phase,if(%q<viewer_keeper>,staff,chargen),sheet_rows,u(%!/FUN`LEDGER`LIVE,u(%!/FUN`LEDGER`ROWS,%q<sheet_who>)))
        flags: [cmdsyntax]
      INC`NEED`ROOM:
        value: |-
          @assert lt(words(lattr(%q<sheet_who>/BRP`LEDGER`*)),get(%!/DATA`LEDGER`MAX))=@pemit %#=notice(SHEET,[name(%q<sheet_who>)]'s ledger is full. A sheet keeper's +sheet/clear starts it again.,warn)
        flags: [cmdsyntax]
      INC`NEED`KEEPER:
        value: |-
          @assert %q<viewer_keeper>=@pemit %#=notice(SHEET,Only sheet keepers do that.,error)
        flags: [cmdsyntax]
      # %<key> typed text: trait_key, the characteristic or skill it names, and trait_kind, CHAR or SKILL.
      INC`NEED`TRAIT:
        value: |-
          @assert strlen(setr(trait_key,u(%!/FUN`TRAIT`FIND,%<key>)))=@pemit %#=notice(SHEET,There is no characteristic or skill '%<key>'. +sheet/traits lists them.,warn); think setq(trait_kind,u(%!/FUN`TRAIT`KIND,%q<trait_key>))
        flags: [cmdsyntax]

      # ---- +sheet: the build ------------------------------------------------------
      INC`SHEET`SHOW:
        value: |-
          @include/args %!/INC`NEED`TARGET=name,firstof(%q<cmd_argument>,%#); @assert u(%!/FUN`PERM`VIEW,%#,%q<sheet_who>)=@pemit %#=notice(SHEET,Only [name(%q<sheet_who>)] and staff can read [poss(%q<sheet_who>)] sheet.,error); @pemit %#=u(%!/FUN`SCREEN`SHEET,%q<sheet_who>,%#)
        flags: [cmdsyntax]
      # +sheet/set [<name>/]<characteristic or skill>=<value>. A player shares out the characteristic points and
      # the skill points; a keeper sets anything. Empty unassigns a characteristic, or puts a skill back to its
      # base chance.
      INC`SHEET`SET:
        value: |-
          @assert %q<cmd_has_equals>=@pemit %#=notice(SHEET,+sheet/set <characteristic or skill>=<value>%, such as +sheet/set dex=14 or +sheet/set climb=55.,warn); @include %!/INC`NEED`WHO; @include %!/INC`NEED`BUILD; @include/args %!/INC`NEED`TRAIT=key,%q<sheet_what>; think setq(set_typed,edit(%q<cmd_right_side>,%%,)); think u(%!/FUN`BUILD`ROWS,%q<sheet_rows>); @include %!/INC`SHEET`SET`%q<trait_kind>
        flags: [cmdsyntax]
      INC`SHEET`SET`CHAR:
        value: |-
          think setqm(set_low,if(%q<viewer_keeper>,1,3),set_high,if(%q<viewer_keeper>,99,get(%!/DATA`CONFIG`CHARCAP)),set_left,sub(get(%!/DATA`CONFIG`CHARPOINTS),sub(u(%!/FUN`R`SUM,%q<build_chars>),u(%!/FUN`R,%q<build_chars>,%q<trait_key>)))); @assert cor(not(strlen(%q<set_typed>)),cand(isint(%q<set_typed>),gte(%q<set_typed>,%q<set_low>),lte(%q<set_typed>,%q<set_high>)))=@pemit %#=notice(SHEET,A characteristic is a whole number from %q<set_low> to %q<set_high>.,warn); @assert cor(%q<viewer_keeper>,not(strlen(%q<set_typed>)),lte(%q<set_typed>,%q<set_left>))=@pemit %#=notice(SHEET,That takes more points than are left: [max(0,%q<set_left>)] for [u(%!/FUN`TRAIT`NAME,%q<trait_key>)]. Lower another characteristic to free some.,warn); @include/args %!/INC`DO`ENTRY=who,%q<sheet_who>,kind,char,key,%q<trait_key>,value,%q<set_typed>,phase,%q<sheet_phase>; @pemit %#=notice(SHEET,[u(%!/FUN`TRAIT`NAME,%q<trait_key>)] is [firstof(%q<set_typed>,unassigned)] on [name(%q<sheet_who>)]'s sheet.[u(%!/FUN`CHARGEN`AFTER,%q<sheet_who>)],ok)
        flags: [cmdsyntax]
      # A skill's entry holds the points put into it above its base chance and its experience gains.
      INC`SHEET`SET`SKILL:
        value: |-
