      # %0 typed text: a characteristic's key (or its roll's name) first, then a skill's.
      FUN`TRAIT`FIND:
        value: |-
          firstof(u(%!/FUN`LIST`FIND,CHAR,%0),u(%!/FUN`LIST`FIND,SKILL,%0))
        flags: [funsyntax]
      # %0 a key: CHAR or SKILL.
      FUN`TRAIT`KIND:
        value: |-
          if(hasattr({{store}},CHAR`%0),CHAR,SKILL)
        flags: [funsyntax]
      # What +sheet/set calls a trait: Dexterity (DEX) for a characteristic, the skill's name for a skill.
      FUN`TRAIT`NAME:
        value: |-
          if(strmatch(u(%!/FUN`TRAIT`KIND,%0),CHAR),[get({{store}}/CHAR`%0)] %(%0%),firstof(get({{store}}/SKILL`%0),lcstr(%0)))
        flags: [funsyntax]
      # %0 a key: a skill's label, or a characteristic's roll ("Agility").
      FUN`TRAIT`LABEL:
        value: |-
          if(strmatch(u(%!/FUN`TRAIT`KIND,%0),CHAR),firstof(get({{store}}/CHAR`%0`ROLL),get({{store}}/CHAR`%0)),firstof(get({{store}}/SKILL`%0),lcstr(%0)))
        flags: [funsyntax]
      # The characteristics with a roll (all but SIZ).
      FUN`TRAIT`ROLLS:
        value: |-
          filterbool(%!/FUN`TRAIT`HASROLL,u(%!/FUN`LIST`ALL,CHAR))
        flags: [funsyntax]
      FUN`TRAIT`HASROLL:
        value: |-
          hasattr({{store}},CHAR`%0`ROLL)
        flags: [funsyntax]

      # ---- base chances -----------------------------------------------------------
      # %0 characteristics (KEY=value; nothing for 10s), %1 a base: terms added with +, each a number, a
      # characteristic, or a characteristic*number. The chance, or #-1 when a term is neither.
      FUN`BASE`EVAL:
        value: |-
          setq(base_chars,%0)[setq(base_terms,iter(%1,u(%!/FUN`BASE`TERM,trim(%i0)),+,%b))][if(words(filterbool(%!/FUN`BASE`BAD,%q<base_terms>)),#-1,ladd(%q<base_terms>))]
        flags: [funsyntax]
      FUN`BASE`TERM:
        value: |-
          cond(isint(%0),%0,cand(strmatch(%0,*%*),hasattr({{store}},CHAR`[ucstr(trim(before(%0,*)))]),isint(trim(after(%0,*)))),mul(u(%!/FUN`CHAR`VALUE,%q<base_chars>,ucstr(trim(before(%0,*)))),trim(after(%0,*))),hasattr({{store}},CHAR`[ucstr(%0)]),u(%!/FUN`CHAR`VALUE,%q<base_chars>,ucstr(%0)),x)
        flags: [funsyntax]
      FUN`BASE`BAD:
        value: |-
          not(isint(%0))
        flags: [funsyntax]
      # %0 characteristics, %1 a characteristic: its value, 10 when not assigned.
      FUN`CHAR`VALUE:
        value: |-
          firstof(after(grab(%0,%1=*),=),10)
        flags: [funsyntax]
      # %0 characteristics, %1 a skill: its base chance.
      FUN`SKILL`BASE:
        value: |-
          max(0,u(%!/FUN`BASE`EVAL,%0,default({{store}}/SKILL`%1`BASE,0)))
        flags: [funsyntax]

      # ---- the numbers ------------------------------------------------------------
      # %0 a chance, %1 a level (automatic easy average difficult impossible): the chance at that level, rounded up.
      FUN`CHANCE`AT:
        value: |-
          switch(%1,easy,mul(%0,2),difficult,ceil(fdiv(%0,2)),impossible,0,%0)
        flags: [funsyntax]
      # %0 the roll (1 to 100), %1 the chance, %2 1 when the trait's base is 5 or more (01-05 then always succeed).
      # fumble, critical, special, success or failure.
      FUN`CHANCE`LEVEL:
        value: |-
          cond(gte(%0,min(100,add(95,ceil(fdiv(max(%1,0),20))))),fumble,lte(%0,ceil(fdiv(max(%1,0),20))),critical,lte(%0,ceil(fdiv(max(%1,0),5))),special,lte(%0,%1),success,cand(%2,lte(%0,5)),success,failure)
        flags: [funsyntax]

      # ---- encounters -------------------------------------------------------------
      # On the encounter store: ENC`<n> the title, with ROOM, GM (objids), STARTED (secs) and COPY`<dbref number>
      # one member's copy, its leaves beneath. A member's BRP`ENCOUNTERS lists theirs in the order they joined;
      # BRP`USING is the one /use picked.
      FUN`ENC`NAME:
        value: |-
          %0 %([get({{encounters}}/ENC`%0)]%)
        flags: [funsyntax]
      # %0 an encounter, %1 a member: obj/prefix of their copy, to put a leaf after.
      FUN`ENC`PATH:
        value: |-
          {{encounters}}/ENC`%0`COPY`[after(num(%1),#)]`
        flags: [funsyntax]
      # %0 someone: the encounters in their room, oldest first.
      FUN`ENC`HERE:
        value: |-
          setq(here_room,objid(loc(%0)))[squish(iter(sort(iter(lattr({{encounters}}/ENC`*),last(%i0,`)),n),if(not(comp(get({{encounters}}/ENC`%i0`ROOM),%q<here_room>)),%i0)))]
        flags: [funsyntax]
      FUN`ENC`MEMBER:
        value: |-
          hasattr({{encounters}},ENC`%1`COPY`[after(num(%0),#)])
        flags: [funsyntax]
      # %0 a character: the encounters they are in, in the order they joined.
      FUN`ENC`JOINED:
        value: |-
          squish(iter(get(%0/BRP`ENCOUNTERS),if(u(%!/FUN`ENC`MEMBER,%0,%i0),%i0)))
        flags: [funsyntax]
      # %0 a character: the encounter whose copy they play from now: one they joined in the room they are in,
      # the one /use picked when it is one of those, else the last joined. Nothing when none.
      FUN`ENC`ACTIVE:
        value: |-
          setq(active_here,u(%!/FUN`ENC`HERE,%0))[setq(active_set,squish(iter(u(%!/FUN`ENC`JOINED,%0),if(member(%q<active_here>,%i0),%i0))))][if(member(%q<active_set>,get(%0/BRP`USING)),get(%0/BRP`USING),last(%q<active_set>))]
        flags: [funsyntax]
      # %0 an encounter: its members' objids.
      FUN`ENC`MEMBERS:
        value: |-
          iter(lattr({{encounters}}/ENC`%0`COPY`*),objid(#[last(%i0,`)]))
        flags: [funsyntax]
      FUN`ENC`GM:
        value: |-
          cor(u(%!/FUN`PERM`KEEPER,%0),not(comp(objid(%0),get({{encounters}}/ENC`%1`GM))))
        flags: [funsyntax]
      # %0 a character: what to do next, after a step, for a player making their own character. Nothing otherwise.
      FUN`CHARGEN`AFTER:
        value: |-
          if(cand(not(comp(%0,%q<viewer_objid>)),not(isapproved(%#))),%b[u(%!/FUN`CHARGEN`NEXT,%0)])
        flags: [funsyntax]

      # ---- who may do what --------------------------------------------------------
      FUN`PERM`KEEPER:
        value: |-
          permission(%0,softcode.brp.admin)
        flags: [funsyntax]
      # %0 who asks, %1 whose sheet: 1 when they may read it. ALLOW`VIEW`<name>, which a bridge adds, may let
      # more people read it.
      FUN`PERM`VIEW:
        value: |-
          cor(not(comp(objid(%0),%1)),u(%!/FUN`PERM`KEEPER,%0),get(%!/DATA`CONFIG`PUBLIC),words(filterbool(%!/FUN`PERM`ALLOWS,lattr(%!/ALLOW`VIEW`*),,,%0,%1)))
        flags: [funsyntax]
      FUN`PERM`ALLOWS:
        value: |-
          u(%!/%0,%1,%2)
        flags: [funsyntax]
      # %0 who asks, %1 a character: 1 when %0 runs the encounter whose copy %1 plays from, and is not %1.
      FUN`PERM`RUNS:
        value: |-
          setq(runs_n,u(%!/FUN`ENC`ACTIVE,%1))[cand(comp(objid(%0),%1),strlen(%q<runs_n>),u(%!/FUN`ENC`GM,%0,%q<runs_n>))]
        flags: [funsyntax]
      FUN`GATE`EDIT:
        value: |-
          if(hasattr(%!,GATE`EDIT),u(%!/GATE`EDIT,%0))
        flags: [funsyntax]
      FUN`PLAYER`MATCH:
        value: |-
          if(isdbref(setr(found_player,pmatch(%0))),objid(%q<found_player>))
        flags: [funsyntax]

      # ---- foes ---------------------------------------------------------------------------
      # %0 someone: the encounter here their +foe commands use, or #-1 and why.
      FUN`FOE`ENC:
        value: |-
          setqm(fe_here,u(%!/FUN`ENC`HERE,%0),fe_run,get({{encounters}}/RUN`[after(num(%0),#)]))[setq(fe_gm,squish(iter(%q<fe_here>,if(not(comp(get({{encounters}}/ENC`%i0`GM),objid(%0))),%i0))))][setq(fe_active,u(%!/FUN`ENC`ACTIVE,%0))][cond(not(words(%q<fe_here>)),#-1 There is no encounter here. +encounter/start begins one.,eq(words(%q<fe_here>),1),%q<fe_here>,member(%q<fe_here>,%q<fe_run>),%q<fe_run>,eq(words(%q<fe_gm>),1),%q<fe_gm>,strlen(%q<fe_active>),%q<fe_active>,#-1 There are several encounters here. +foe/run <n> picks the one your +foe commands use.)]
        flags: [funsyntax]
      # %0 an encounter: its foes' numbers.
      FUN`FOE`NUMS:
        value: |-
          sort(iter(lattr({{encounters}}/ENC`%0`FOE`*),last(%i0,`)),n)
        flags: [funsyntax]
      # %0 an encounter, %1 a foe, %2 a field.
      FUN`FOE`GET:
        value: |-
          json_query(get({{encounters}}/ENC`%0`FOE`%1),extract,$.%2)
        flags: [funsyntax]
      # %0 an encounter, %1 a foe, %2 a field, %3 its value as JSON.
      FUN`FOE`SET:
        value: |-
          attrib_set({{encounters}}/ENC`%0`FOE`%1,json_mod(get({{encounters}}/ENC`%0`FOE`%1),patch,json(object,%2,%3)))
        flags: [funsyntax]
      FUN`FOE`LABEL:
        value: |-
          u(%!/FUN`FOE`GET,%0,%1,label)
        flags: [funsyntax]
      # %0 an encounter, %1 what was typed: the foe with that number, else the ones with that name, else the ones
      # whose name ends in it as words (guard 2 for Watch guard 2), else starts with it, else has it anywhere.
      FUN`FOE`FIND:
        value: |-
          cond(cand(isint(%1),hasattr({{encounters}},ENC`%0`FOE`%1)),%1,words(setr(ff_m,u(%!/FUN`FOE`MATCH,%0,%1,0))),%q<ff_m>,words(setr(ff_m,u(%!/FUN`FOE`MATCH,%0,%1,1))),%q<ff_m>,words(setr(ff_m,u(%!/FUN`FOE`MATCH,%0,%1,2))),%q<ff_m>,u(%!/FUN`FOE`MATCH,%0,%1,3))
        flags: [funsyntax]
      FUN`FOE`MATCH:
        value: |-
          squish(iter(u(%!/FUN`FOE`NUMS,%0),if(switch(%2,0,not(comp(lcstr(u(%!/FUN`FOE`LABEL,%0,%i0)),lcstr(trim(%1)))),1,strmatch(u(%!/FUN`FOE`LABEL,%0,%i0),* [trim(%1)]),2,strmatch(u(%!/FUN`FOE`LABEL,%0,%i0),trim(%1)*),strmatch(u(%!/FUN`FOE`LABEL,%0,%i0),*[trim(%1)]*)),%i0)))
        flags: [funsyntax]
      # %0 what was typed: the bestiary key it names, by key or by name.
      FUN`FOE`KIND:
        value: |-
          setq(fk_key,ucstr(edit(trim(%0),%b,-)))[cond(cand(regmatch(%q<fk_key>,^%[A-Z0-9-%]+$),hasattr({{store}},FOE`%q<fk_key>)),%q<fk_key>,first(iter(lattr({{store}}/FOE`*),if(not(comp(lcstr(get({{store}}/%i0)),lcstr(trim(%0)))),last(%i0,`)))))]
        flags: [funsyntax]
      # %0 an encounter, %1 a bestiary key: a new foe copied from it. Returns its number.
      FUN`FOE`MAKE:
        value: |-
          setq(fm_k,inc(lmax(0 [u(%!/FUN`FOE`NUMS,%0)])))[attrib_set({{encounters}}/ENC`%0`FOE`%q<fm_k>,json(object,key,json(string,%1),label,json(string,[get({{store}}/FOE`%1)] %q<fm_k>),str,u(%!/FUN`FOE`STORE,%1,STR,10),con,u(%!/FUN`FOE`STORE,%1,CON,10),siz,u(%!/FUN`FOE`STORE,%1,SIZ,10),dex,u(%!/FUN`FOE`STORE,%1,DEX,10),pow,u(%!/FUN`FOE`STORE,%1,POW,10),hp,u(%!/FUN`KIND`HP,%1),hpmax,u(%!/FUN`KIND`HP,%1),armor,u(%!/FUN`FOE`STORE,%1,ARMOR,0),attack,u(%!/FUN`FOE`STORE,%1,ATTACK,40),weapon,json(string,u(%!/FUN`FOE`STORE,%1,WEAPON,Strike)),damage,json(string,u(%!/FUN`FOE`STORE,%1,DAMAGE,1d6)),db,json(string,u(%!/FUN`KIND`DB,%1)),notes,json(string,get({{store}}/FOE`%1`NOTES))))]%q<fm_k>
        flags: [funsyntax]
      # %0 a kind, %1 a field, %2 its default.
      FUN`FOE`STORE:
        value: |-
          default({{store}}/FOE`%0`%1,%2)
        flags: [funsyntax]
      FUN`KIND`SORTKEY:
        value: |-
          u(%!/FUN`KIND`HP,%0)
        flags: [funsyntax]
      # %0 a kind: its hit points, from CON and SIZ as a character's are.
      FUN`KIND`HP:
        value: |-
          setq(kh_sum,add(u(%!/FUN`FOE`STORE,%0,CON,10),u(%!/FUN`FOE`STORE,%0,SIZ,10)))[if(strmatch(get(%!/DATA`CONFIG`HITPOINTS),total),%q<kh_sum>,ceil(fdiv(%q<kh_sum>,2)))]
        flags: [funsyntax]
      # %0 a kind: its damage bonus.
      FUN`KIND`DB:
        value: |-
          u(%!/FUN`DB,add(u(%!/FUN`FOE`STORE,%0,STR,10),u(%!/FUN`FOE`STORE,%0,SIZ,10)))
        flags: [funsyntax]
      # %0 STR plus SIZ: the damage bonus, -1d6 at 12 or less up to +1d6 at 33 to 40, and 1d6 more for each 16 past that.
      FUN`DB:
        value: |-
          cond(lte(%0,12),-1d6,lte(%0,16),-1d4,lte(%0,24),,lte(%0,32),+1d4,lte(%0,40),+1d6,+[add(2,div(sub(%0,41),16))]d6)
        flags: [funsyntax]
      FUN`KIND`ATTACKTEXT:
        value: |-
          [u(%!/FUN`FOE`STORE,%0,WEAPON,Strike)] [u(%!/FUN`FOE`STORE,%0,ATTACK,40)]%%, [u(%!/FUN`FOE`STORE,%0,DAMAGE,1d6)][u(%!/FUN`KIND`DB,%0)]
        flags: [funsyntax]
      FUN`FOE`ATTACKTEXT:
        value: |-
          [u(%!/FUN`FOE`GET,%0,%1,weapon)] [u(%!/FUN`FOE`GET,%0,%1,attack)]%%, [u(%!/FUN`FOE`GET,%0,%1,damage)][u(%!/FUN`FOE`GET,%0,%1,db)]
        flags: [funsyntax]
      FUN`FOE`HPSHORT:
        value: |-
          setq(fh_hp,u(%!/FUN`FOE`GET,%0,%1,hp))[if(gt(%q<fh_hp>,0),%q<fh_hp>/[u(%!/FUN`FOE`GET,%0,%1,hpmax)],down)]
        flags: [funsyntax]
      FUN`FOE`HPTEXT:
        value: |-
          setq(fh_hp,u(%!/FUN`FOE`GET,%0,%1,hp))[if(gt(%q<fh_hp>,0),%q<fh_hp>/[u(%!/FUN`FOE`GET,%0,%1,hpmax)] hit points,down)]
        flags: [funsyntax]
      # %0 an encounter, %1 a creature: rolls 1d100 against its attack and, on a hit, its damage and damage bonus.
      # A special or critical hit rolls the weapon's dice twice (impaling); a critical also ignores armour, which the caller
      # leaves off. Returns {"hit","level","damage","text","roll"}.
      FUN`FOE`ATTACK:
        value: |-
          setqm(fa_chance,u(%!/FUN`FOE`GET,%0,%1,attack),fa_dice,[u(%!/FUN`FOE`GET,%0,%1,damage)],fa_db,u(%!/FUN`FOE`GET,%0,%1,db))[setq(fa_att,roll(1d100,,record))][setq(fa_level,u(%!/FUN`CHANCE`LEVEL,json_query(%q<fa_att>,extract,$.total),%q<fa_chance>,1))][setq(fa_hit,member(critical special success,%q<fa_level>))][setq(fa_dmg,if(%q<fa_hit>,roll([if(member(critical special,%q<fa_level>),u(%!/FUN`DICE`DOUBLE,%q<fa_dice>),%q<fa_dice>)]%q<fa_db>,,record)))][json(object,hit,t(%q<fa_hit>),level,json(string,%q<fa_level>),damage,if(%q<fa_hit>,max(0,json_query(%q<fa_dmg>,extract,$.total)),0),text,json(string,[json_query(%q<fa_att>,extract,$.text)] vs %q<fa_chance>%%: [switch(%q<fa_level>,critical,a critical hit,special,a special hit,success,a hit,fumble,a fumble,a miss)][if(%q<fa_hit>,%, [json_query(%q<fa_dmg>,extract,$.text)] damage)]),roll,json_query(%q<fa_att>,extract,$.id))]
        flags: [funsyntax]
      # %0 dice such as 1d8+1: twice the dice.
      FUN`DICE`DOUBLE:
        value: |-
          [mul(before(%0,d),2)]d[after(%0,d)]
        flags: [funsyntax]
      # A hit location, rolled on 1d20.
      FUN`LOCATION`ROLL:
        value: |-
          setq(lr_d,die(1,20))[after(first(squish(iter(v(DATA`LOCATIONS),if(lte(%q<lr_d>,before(%i0,:)),%i0),|,|),|),|),:)]
        flags: [funsyntax]
      # %0 a member, %1 the damage, %2 their hit points after, %3 their most, %4 where it landed, %5 armour taken off.
      FUN`DISPLAY`BLOW:
        value: |-
          %b[name(%0)] takes %1[if(%5,%b%(less %5 armour%))][if(strlen(%4),%bto the %4)]: %2/%3 hit points[cond(lte(%2,0),%, [tone(strong,dying)],gte(%1,ceil(fdiv(%3,2))),%, [tone(strong,a major wound)])].
        flags: [funsyntax]
      # %0 an encounter, %1 a token (P<dbref number> or F<foe>): who it is.
      FUN`TOKEN`NAME:
        value: |-
          if(strmatch(%1,F*),u(%!/FUN`FOE`LABEL,%0,after(%1,F)),name(#[after(%1,P)]))
        flags: [funsyntax]
      # Whether the token can take a turn: a member still in, a foe still standing.
      FUN`TOKEN`LIVE:
        value: |-
          if(strmatch(%1,F*),cand(hasattr({{encounters}},ENC`%0`FOE`[after(%1,F)]),gt(u(%!/FUN`FOE`GET,%0,after(%1,F),hp),0)),hasattr({{encounters}},ENC`%0`COPY`[after(%1,P)]))
        flags: [funsyntax]
      # %0 an encounter, %1 a token: its hit points now.
      FUN`TOKEN`HP:
        value: |-
          if(strmatch(%1,F*),u(%!/FUN`FOE`HPSHORT,%0,after(%1,F)),[setq(th_path,u(%!/FUN`ENC`PATH,%0,#[after(%1,P)]))][setq(th_hp,get(%q<th_path>HP))][if(hasattr({{encounters}},ENC`%0`COPY`[after(%1,P)]),[if(strlen(%q<th_hp>),%q<th_hp>,u(%!/API`MOST,#[after(%1,P)],HP))]/[u(%!/API`MOST,#[after(%1,P)],HP)],-)])
        flags: [funsyntax]
      # %0 an encounter, %1 a token: <token>~<DEX>, or with strike ranks on, <token>~<strike rank>.
      FUN`INIT`ROLL:
        value: |-
          %1~[if(strmatch(%1,F*),setqm(ir_dex,u(%!/FUN`FOE`GET,%0,after(%1,F),dex),ir_siz,u(%!/FUN`FOE`GET,%0,after(%1,F),siz)),[null(u(%!/FUN`BUILD`OF,#[after(%1,P)]))][setqm(ir_dex,u(%!/FUN`CHAR`VALUE,%q<build_chars>,DEX),ir_siz,u(%!/FUN`CHAR`VALUE,%q<build_chars>,SIZ))])][if(get(%!/DATA`CONFIG`STRIKERANKS),u(%!/FUN`STRIKE`RANK,%q<ir_dex>,%q<ir_siz>),%q<ir_dex>)]
        flags: [funsyntax]
      FUN`INIT`SORT:
        value: |-
          if(get(%!/DATA`CONFIG`STRIKERANKS),sortkey(%!/FUN`INIT`KEY,squish(%0),n),revwords(sortkey(%!/FUN`INIT`KEY,squish(%0),n)))
        flags: [funsyntax]
      FUN`INIT`KEY:
        value: |-
          last(%0,~)
        flags: [funsyntax]
      # %0 an encounter, %1 its order, %2 the turn now: the next place whose token can act, or 0.
      FUN`INIT`NEXT:
        value: |-
          firstof(first(squish(iter(lnum(1,words(%1)),[setq(in_idx,inc(mod(add(dec(%2),%i0),words(%1))))][if(u(%!/FUN`TOKEN`LIVE,%0,first(extract(%1,%q<in_idx>,1),~)),%q<in_idx>)]))),0)
        flags: [funsyntax]
      # %0 an encounter, %1 a token: counts its conditions down by one, takes off those that run out, and returns
      # their names.
      FUN`COND`TICK:
        value: |-
          setqm(ct_new,,ct_end,)[iter(get({{encounters}}/ENC`%0`COND`%1),if(isint(last(%i0,:)),if(gt(last(%i0,:),1),setq(ct_new,%q<ct_new> [first(%i0,:)]:[dec(last(%i0,:))]),setq(ct_end,%q<ct_end> [first(%i0,:)])),setq(ct_new,%q<ct_new> %i0)))][if(hasattr({{encounters}},ENC`%0`COND`%1),attrib_set({{encounters}}/ENC`%0`COND`%1,squish(%q<ct_new>)))][squish(%q<ct_end>)]
        flags: [funsyntax]
      FUN`COND`TEXT:
        value: |-
          iter(get({{encounters}}/ENC`%0`COND`%1),[first(%i0,:)][if(isint(last(%i0,:)),%b%([last(%i0,:)]%))],%b,%,%b)
        flags: [funsyntax]
      # %0 DEX, %1 SIZ: the strike rank, DEX's (4 at 9 or less down to 1 at 19 or more) and SIZ's (3 down to 0).
      FUN`STRIKE`RANK:
        value: |-
          add(cond(lte(%0,9),4,lte(%0,15),3,lte(%0,18),2,1),cond(lte(%1,9),3,lte(%1,15),2,lte(%1,18),1,0))
        flags: [funsyntax]
      FUN`INIT`SHOW:
        value: |-
          if(get(%!/DATA`CONFIG`STRIKERANKS),SR %0,DEX %0)
        flags: [funsyntax]

      # ---- the XP and money ledgers --------------------------------------------------------
      # Each book is its own ledger, apart from the sheet's: BRP`<BOOK>LEDGER`<n>, a JSON object with n, delta,
      # total (the running total after it), item and label (what it counts, when the book counts more than one
      # thing), reason, by (an objid) and at (secs), with the wizard attribute flag. The totals on the sheet are a
      # cache of the latest entry's total: FUN`BOOK`ADD is the only thing that writes either, and +sheet/rebuild
      # works every cache out again from the ledgers.
      # %0 a book, %1 an item: the attribute holding its cached total.
      FUN`BOOK`CACHE:
        value: |-
          BRP`COIN
        flags: [funsyntax]
      # %0 a book: 1 when its cache keeps the item's label with the total, as <total>|<label>.
      FUN`BOOK`LABELLED:
        value: |-
          0
        flags: [funsyntax]
      # %0 a character, %1 a book: the numbers of its entries, oldest first.
      FUN`BOOK`NUMS:
        value: |-
          sort(iter(lattr(%0/BRP`%1LEDGER`*),if(hasflag(%0/%i0,wizard),last(%i0,`))),n)
        flags: [funsyntax]
      # %0 a character, %1 a book, %2 the change, %3 why, %4 the item, %5 its label: a new entry, then the cached
      # total. Nothing for no change.
