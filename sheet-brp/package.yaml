        flags: [funsyntax]
      # %0 a character, %1 coin to give (or take, below 0), %2 1 for the sheet itself, %3 why. Never below 0. A
      # change to the sheet itself goes in the log; a copy's waits for /keep. Returns the new count.
      FUN`COIN`ADD:
        value: |-
          setqm(coinadd_old,firstof(u(%!/FUN`P,%0,COIN,%2),0),
          coinadd_live,cor(%2,not(strlen(u(%!/FUN`ENC`ACTIVE,%0)))))[setq(coinadd_new,max(0,add(%q<coinadd_old>,%1)))][u(%!/FUN`PSET,%0,COIN,if(%q<coinadd_new>,%q<coinadd_new>),%2)][if(%q<coinadd_live>,u(%!/FUN`LOG`ADD,%0,coin,sub(%q<coinadd_new>,%q<coinadd_old>),%q<coinadd_new>,%3,))]%q<coinadd_new>
