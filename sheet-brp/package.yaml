  # The +help topics, on an object of their own. sheet-brp-help registers it with +help; without that bridge
  # nothing reads it. HELP`<TOPIC> is a topic, its subtopics the leaves beneath, LOCK`<TOPIC> who may read it.
  - ref: sheet_help
    type: thing
    name: BRP Sheet Help
    location: "{{sheet}}"
    attributes:
      HELP: |-
        Your character's percentile sheet, rolling against it, and encounters: +sheet, +check and +encounter.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`SHEET: |-
        check encounter
      SEE`CHECK: |-
        sheet encounter
      SEE`ENCOUNTER: |-
        sheet check
      HELP`SHEET: |-
        `+sheet` shows your character's sheet: seven characteristics, hit points, power points, coin, the skills marked for an experience check, the characteristic rolls, and every skill as a percentage.

        - `+sheet` shows your own; `+sheet <name>` another character's, when the game lets you read it.
        - `+sheet/chargen` shows the steps of making your character and what to do next.
        - `+sheet/traits` lists the characteristics and the skills with their base chances.
        - `+sheet/ledger` lists every entry your sheet is built from, oldest first.

        A skill's percentage is its base chance, from your characteristics, plus the points you put in and what experience added. A skill above its base shows in strong. An unassigned characteristic counts as 10.

        For example:

        `+sheet/chargen`

        Output: `1. Characteristics done: STR 12, CON 14, SIZ 13, ...`

        See `+help sheet chargen` for making a character, `+help sheet play` for hit points, coin and experience, and `+help check` for rolling.
      HELP`SHEET`CHARGEN: |-
        Making a character takes two steps. `+sheet/chargen` shows each and what comes next.

        1. `+sheet/set <characteristic>=<value>` shares out 75 points among the seven characteristics, each from 3 to 18, unless your game changed those numbers. `+sheet/set dex=` takes its points back.
        2. `+sheet/set <skill>=<percent>` raises a skill above its base chance, from 300 skill points, at most 75% in one skill. `+sheet/set <skill>=` puts it back to its base.

        Base chances follow your characteristics, so set those first.

        For example:

        `+sheet/set climb=55`

        Output: `\[SHEET\] Done: Climb is 55% on Alice's sheet. Next: +sheet/set <skill>=<percent>. 285 of 300 skill points left.`

        When every skill point is spent, your sheet is complete. Once you are approved, staff change it.
      HELP`SHEET`PLAY: |-
        In play you keep your own hit points, power points and coin:

        - `+sheet/hp -<n>` loses hit points, `+<n>` gets some back, `<n>` sets them, `full` fills them. `+sheet/pp` does the same for power points.
        - `+sheet/coin -<n> [<reason>]` spends coin: `+sheet/coin -20 Train ticket`. Staff give it.

        A successful `+check` on a skill marks it for an experience check. Once you are approved, `+sheet/improve` rolls 1d100 for each marked skill: over its percentage, it rises by 1d6, unless your game changed the die. The marks clear. `+sheet/log` lists every change to your coin and every skill gain, who made it and why.

        In an encounter, hit points, power points, coin and marks change your copy there. See `+help encounter`.

        For example:

        `+sheet/improve`

        Output: `\[SHEET\] Done: Alice's experience checks: Climb rolled 72 over 55%: +4, now 59%.`
      HELP`CHECK: |-
        `+check <skill>` rolls 1d100 against the skill's percentage, where the room sees it. Equal or under succeeds.

        - `+check <characteristic>` makes a characteristic roll, five times the characteristic: `+check dex` or `+check agility`.
        - `+check <skill>=<difficulty>`: easy doubles the chance, difficult halves it, automatic needs no roll and impossible fails. The words trivial, easy, standard, hard and extreme work too.
        - `+check <skill>+<n>` or `-<n>` adds or takes percent: `+check spot-20=easy`.
        - `/private` rolls where only you see it.

        A roll of a twentieth of the chance or less is a critical success, a fifth or less a special success. 96 to 00 can fumble: the higher the chance, the narrower that range, down to 00 alone at 81% and above. A skill with a base of 5% or more always succeeds on 01 to 05. Every check is kept under a number that `rollinfo()` reads back.

        For example:

        `+check climb=difficult`

        Output: `\[SHEET\] Alice rolls Climb (55%, difficult, halved: 28%): 1d100\[23\] = 23: a success (roll 9)`
      HELP`ENCOUNTER: |-
        An encounter is a scene played from copies of the sheets, so hit points lost, power points and coin spent, and experience checks marked in it stay there. It lasts until its GM ends it, over as many days as it takes.

        - `+encounter` lists the encounters here and yours; `+encounter <n>` shows one.
        - `+encounter/start [<title>]` starts one in your room. You run it.
        - `+encounter/join [<n>]` takes part with a copy of your sheet as it is now.
        - `+encounter/leave [<n>]` comes out; your copy there is gone.
        - `+encounter/use <n>` picks which copy you play from, when you are in more than one here.

        While you are in an encounter's room, hit points, power points, coin and the checks your rolls mark use your copy in it. Anywhere else, your sheet.

        For example:

        `+encounter/join 1`

        Output: `\[ENCOUNTER\] Alice joins 1 (Cave).`

        See `+help encounter gm` for running one.
      HELP`ENCOUNTER`GM: |-
        Whoever starts an encounter runs it; sheet keepers run any. Give the number after `=` when the room has more than one.

        - `+encounter/add <name>[=<n>]` brings someone in the room into it, with a copy of their sheet.
        - `+encounter/remove <name>[=<n>]` takes them out; their copy goes.
        - `+encounter/keep <name>[=<n>]` writes their hit points, power points and coin from the copy to their sheet, and adds its experience checks.
        - `+encounter/end [<n>]` ends it. Every copy goes, and nothing is written back unless you kept it first.

        While a member plays from your encounter's copy, you change it: `+sheet/hp <name>=-<n>`, `/pp`, `/coin <name>=<n>` and `/mark <name>/<skill>`.

        For example:

        `+encounter/keep Alice=1`

        Output: `\[ENCOUNTER\] Done: Alice's sheet keeps the hit points, power points, coin and experience checks from 1 (Cave).`
      HELP`SHEET`CREDITS: |-
        This sheet's characteristics, characteristic rolls and skill list, with each skill's base chance and category, come from Basic Roleplaying: Universal Game Engine, copyright 2023 Chaosium Inc., by Jason Durall and Steve Perrin, and are used under the ORC License \(www.chaosium.com/orclicense\). Basic Roleplaying is the trademark of Chaosium Inc.; Chaosium Inc. and the Chaosium logo are its registered trademarks.

        That material, and this game's changes to it, are offered under the ORC License too. The package's NOTICE.md has the full notice.
      LOCK`SHEET`STAFF: |-
        perm^softcode.brp.admin
      HELP`SHEET`STAFF: |-
        Sheet keepers \(`softcode.brp.admin`, or the BRP Sheet Keeper role\) read every sheet and change any character's at any time:

        - `/set` takes `<name>/` first: `+sheet/set Alice/dodge=80`. A keeper sets a characteristic up to 99 and a skill up to 999%, without points.
        - `/hp`, `/pp` and `/coin` take `<name>=` first: `+sheet/coin Alice=+50 Inheritance`.
        - `+sheet/mark <name>/<skill>` marks an experience check; `=remove` takes it off. `+sheet/improve <name>` rolls their checks.
        - `+sheet/log <name>` lists every change to their coin and every skill gain, with who made it and why.
        - `+sheet/revoke <name>/<n>` takes back one ledger entry; `+sheet/clear <name>` revokes them all, and character creation starts again.
        - Keepers run any encounter.

        `@role/assign <player>=brp-sheet-keeper` makes someone a keeper.
      LOCK`SHEET`SETTINGS: |-
        perm^config.admin
      HELP`SHEET`SETTINGS: |-
        `+config brp` lists the settings and `+config brp/<setting>=<value>` changes one \(`config.admin`\):

        - `charpoints`: points shared among characteristics \(75\). `charcap`: the highest one while making a character \(18\).
        - `skillpoints`: percent added to skills \(300\). `skillcap`: the highest skill while making a character \(75%\).
        - `improve`: the sides of the experience die \(6\).
        - `hitpoints`: `average` \(CON and SIZ halved\) or `total` \(CON and SIZ added\).
        - `difficulty`: what trivial, easy, standard, hard and extreme mean \(`automatic easy average difficult difficult`\).
        - `public`: whether anyone may read anyone's sheet \(no\).
        - `skills`: the skill list. `+config/add brp/skills/sail=Sail` adds one; set its `base`, a number, `DEX*2` or `INT+POW`, and its `category`.

        Removing a skill leaves what characters had stored, but the sheet stops showing it.
