format: "1.16"
package: fate-action-science-config
title: "Fate action science: +config settings"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the action science settings and its modes and scales tables into +config: registers them with the +config registry, so staff see and change them with +config fate-science."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, fate, config, bridge]
category: Characters
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. fate-action-science declares its settings
# as DATA`CONFIG`<NAME>, with their types and limits, and reads them with get() whether or not +config is
# installed. This package is the one leaf that tells the +config registry where they are.
depends:
  - package: fate-action-science
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH.Packages
      path: fate-action-science/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`FATE-SCIENCE: |-
        {{fate-action-science/science}}
