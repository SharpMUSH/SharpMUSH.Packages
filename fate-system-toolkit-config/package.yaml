format: "1.20"
package: fate-system-toolkit-config
title: "Fate System Toolkit: +config settings"
version: 1.1.1
authors: [SharpMUSH]
description: "Puts the Fate System Toolkit settings and its conditions, storms and augs into +config: registers them with the +config registry, so staff see and change them with +config toolkit."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, fate, config, bridge]
category: Game System
subcategory: Fate
bridge: true
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. fate-system-toolkit declares its settings
# as DATA`CONFIG`<NAME>, with their types and limits, and reads them with get() whether or not +config is
# installed. This package is the one leaf that tells the +config registry where they are.
depends:
  - package: fate-system-toolkit
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH.Packages
      path: fate-system-toolkit/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`TOOLKIT: |-
        {{fate-system-toolkit/toolkit}}
