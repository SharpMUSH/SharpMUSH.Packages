name: SharpMUSH Packages
description: Official softcode packages for SharpMUSH.
packages:
  - path: hello-world/
    package: hello-world
    version: 1.0.0
    description: Minimal example — one object, one command
  - path: who-where/
    name: Who/Where
    package: who-where
    version: 1.2.0
    description: +who and +where commands
  - path: bbs-lite/
    name: BBS Lite
    package: bbs-lite
    version: 0.9.0-beta
    description: Tiny bulletin board — dependencies, configure, cross-package refs
  - path: starter-area/
    package: starter-area
    version: 1.0.0
    description: Two rooms and linked exits
  - path: http-handler/
    package: http-handler
    version: 1.0.0
    description: Inbound HTTP verb routers (attach mode)
  - path: profile-handler/
    package: profile-handler
    version: 1.0.0
    description: Read-only character directory + profile API (requires http-handler)
  - path: roll-tables/
    name: Roll Tables
    package: roll-tables
    version: 1.0.0
    description: Random tables as softcode data, rolled in the room with +table/roll and publishable to the wiki
  - path: pf2e-remaster/
    name: Pathfinder 2e
    package: pf2e-remaster
    version: 1.4.0
    description: Pathfinder Second Edition (Remaster) core rules as wiki pages (classes, ancestries, feats, spells, equipment, skills, conditions, DC tables; ORC License)
  - path: sheet-d20/
    name: D20 Sheet
    package: sheet-d20
    version: 2.0.0
    description: d20 character sheet built from a ledger (abilities, skills, training, level, hit points, coin, gear), guided character creation, +check against a DC, and encounters with their own sheet copies
  - path: sheet-d20-help/
    package: sheet-d20-help
    version: 1.0.1
    description: Puts the D20 sheet topics into +help
  - path: sheet-d20-config/
    package: sheet-d20-config
    version: 1.0.1
    description: Puts the D20 sheet settings and trait table into +config
  - path: sheet-d20-chargen/
    package: sheet-d20-chargen
    version: 1.1.0
    description: Joins the D20 sheet to +app character applications
  - path: sheet-fate/
    name: Fate Sheet
    package: sheet-fate
    version: 1.2.0
    description: Fate character sheet (skills or approaches, aspects, stunts, stress, consequences, fate points) with +check on four Fate dice, a grant ledger, guided +chargen, encounters with their own sheet copies, and audited milestones and breakthroughs that players spend with +sheet/advance; Fate SRD text under CC BY 3.0
  - path: sheet-fate-help/
    package: sheet-fate-help
    version: 1.0.0
    description: Puts the Fate sheet topics into +help
  - path: sheet-fate-config/
    package: sheet-fate-config
    version: 1.0.0
    description: Puts the Fate sheet settings and its skill, approach, stress and consequence tables into +config
  - path: sheet-fate-chargen/
    package: sheet-fate-chargen
    version: 1.1.0
    description: Joins the Fate sheet to +app character applications
  - path: sheet-fate-wiki/
    package: sheet-fate-wiki
    version: 1.0.0
    description: Fate rules reference as wiki pages; Fate SRD text under CC BY 3.0
  - path: atomic-robo/
    name: Atomic Robo
    package: atomic-robo
    version: 1.0.0
    description: Unofficial Atomic Robo pack, pulp action science and giant robots on the Fate sheet (modes, mega-stunts, invention, brainstorms, machines at scale); Atomic Robo RPG SRD and Fate System Toolkit text under CC BY 3.0
  - path: atomic-robo-help/
    package: atomic-robo-help
    version: 1.0.0
    description: Puts the Atomic Robo topics into +help
  - path: atomic-robo-config/
    package: atomic-robo-config
    version: 1.0.0
    description: Puts the Atomic Robo settings and its modes and scales tables into +config
  - path: atomic-robo-wiki/
    package: atomic-robo-wiki
    version: 1.0.0
    description: Unofficial Atomic Robo rules reference as wiki pages; Atomic Robo RPG SRD and Fate System Toolkit text under CC BY 3.0
  - path: duties-d20/
    package: duties-d20
    version: 1.0.1
    description: Duties roll provider "d20" on the D20 sheet
  - path: duties-fate/
    package: duties-fate
    version: 1.0.0
    description: Duties roll provider "fate" on the Fate sheet
  - path: sheet-pbta/
    name: PbtA Sheet
    package: sheet-pbta
    version: 2.1.0
    description: Powered by the Apocalypse character sheet built from a ledger (playbooks, stats, moves, guided character creation, advances, forward, ongoing, hold, XP), +check on 2d6 and encounters on sheet copies; Dungeon World moves under CC BY 3.0
  - path: sheet-pbta-help/
    package: sheet-pbta-help
    version: 1.0.1
    description: Puts the PbtA sheet topics into +help
  - path: sheet-pbta-config/
    package: sheet-pbta-config
    version: 1.0.1
    description: Puts the PbtA sheet settings and its stats, moves and playbooks tables into +config
  - path: sheet-pbta-chargen/
    package: sheet-pbta-chargen
    version: 1.1.0
    description: Joins the PbtA sheet to +app character applications
  - path: duties-pbta/
    package: duties-pbta
    version: 1.0.1
    description: Duties roll provider "pbta" on the PbtA sheet
  - path: pbta-wiki/
    name: PbtA rules
    package: pbta-wiki
    version: 1.0.1
    description: Wiki pages for the PbtA sheet (how to play, making a character, playbooks, moves, advancement, encounters); Dungeon World moves under CC BY 3.0
  - path: d20-wiki/
    name: D20 rules
    package: d20-wiki
    version: 1.0.0
    description: Wiki pages for the d20 sheet (checks and DCs, making a character, abilities and skills, hit points, gear and advancement, encounters)
  - path: fitd-wiki/
    name: Forged in the Dark rules
    package: fitd-wiki
    version: 1.0.0
    description: Wiki pages for the FitD sheet (how to play, making a character, actions and attributes, stress, harm and advancement, encounters, clocks); based on the Blades in the Dark SRD under CC BY 3.0
  - path: brp-wiki/
    name: Percentile rules (BRP)
    package: brp-wiki
    version: 1.0.0
    description: Wiki pages for the BRP sheet (how to play, making a character, characteristics and skills, hit points, coin and experience, encounters); ORC Licensed Material
  - path: ironsworn-wiki/
    name: Ironsworn rules
    package: ironsworn-wiki
    version: 1.0.0
    description: Wiki pages for the Ironsworn sheet (how to play, making a character, assets and experience, meters and momentum, vows, encounters); based on the Ironsworn SRD under CC BY 4.0
  - path: pf2e/
    name: Pathfinder 2e rules
    package: pf2e
    version: 0.1.0
    description: Pathfinder Second Edition rules read the way Foundry VTT's pf2e system reads them, with ledger character sheets, +sheet and +check (ORC License)
  - path: sheet-fitd/
    name: FitD Sheet
    package: sheet-fitd
    version: 2.0.0
    description: Forged in the Dark character sheet (ledger-built actions, XP advances, stress, trauma, harm, coin, audited log, encounters, clocks) with +check on a d6 pool; Blades in the Dark SRD under CC BY 3.0
  - path: sheet-fitd-help/
    package: sheet-fitd-help
    version: 1.0.1
    description: Puts the FitD sheet topics into +help
  - path: sheet-fitd-config/
    package: sheet-fitd-config
    version: 1.0.1
    description: Puts the FitD sheet settings and action and attribute tables into +config
  - path: sheet-fitd-chargen/
    package: sheet-fitd-chargen
    version: 1.1.0
    description: Joins the FitD sheet to +app character applications
  - path: sheet-brp/
    name: BRP Sheet
    package: sheet-brp
    version: 2.0.0
    description: Percentile character sheet on Basic Roleplaying (ledger-built characteristics and skills, point-buy chargen, experience checks, hit points, power points, coin, audited log, encounters) with +check on 1d100; ORC Licensed Material
  - path: sheet-brp-help/
    package: sheet-brp-help
    version: 1.0.1
    description: Puts the BRP sheet topics into +help
  - path: sheet-brp-config/
    package: sheet-brp-config
    version: 1.0.1
