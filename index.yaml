name: SharpMUSH Packages
description: Official softcode packages for SharpMUSH.
packages:
  - path: hello-world/
    package: hello-world
    version: 1.0.0
    description: Minimal example — one object, one command
  - path: who-where/
    name: Who/Where
    package: who-where
    version: 1.2.0
    description: +who and +where commands
  - path: bbs-lite/
    name: BBS Lite
    package: bbs-lite
    version: 0.9.0-beta
    description: Tiny bulletin board — dependencies, configure, cross-package refs
  - path: starter-area/
    package: starter-area
    version: 1.0.0
    description: Two rooms and linked exits
  - path: http-handler/
    package: http-handler
    version: 1.0.0
    description: Inbound HTTP verb routers (attach mode)
  - path: profile-handler/
    package: profile-handler
    version: 1.0.0
    description: Read-only character directory + profile API (requires http-handler)
  - path: roll-tables/
    name: Roll Tables
    package: roll-tables
    version: 1.0.0
    description: Random tables as softcode data, rolled in the room with +table/roll and publishable to the wiki
  - path: pf2e-remaster/
    name: Pathfinder 2e
    package: pf2e-remaster
    version: 1.6.2
    description: Pathfinder Second Edition (Remaster) core rules as wiki pages (classes, ancestries, feats, spells, equipment, skills, conditions, DC tables; ORC License)
  - path: sheet-d20/
    name: D20 Sheet
    package: sheet-d20
    version: 2.2.1
    description: d20 character sheet built from a ledger (abilities, skills, training, level, hit points, coin, gear), guided character creation, +check against a DC or a foe, and encounters with their own sheet copies, foes from a bestiary, initiative and conditions
  - path: sheet-d20-help/
    package: sheet-d20-help
    version: 1.0.1
    description: Puts the D20 sheet topics into +help
  - path: sheet-d20-config/
    package: sheet-d20-config
    version: 1.0.2
    description: Puts the D20 sheet settings, trait table and bestiary into +config
  - path: sheet-d20-chargen/
    package: sheet-d20-chargen
    version: 1.1.0
    description: Joins the D20 sheet to +app character applications
  - path: sheet-fate/
    name: Fate Sheet
    package: sheet-fate
    version: 1.6.0
    description: Fate character sheet (skills or approaches, aspects, stunts, stress, consequences, fate points) with +check on four Fate dice, a grant ledger, guided +chargen, encounters with their own sheet copies, NPC opposition from +npc and the commands to run a conflict, and audited milestones and breakthroughs that players spend with +sheet/advance; Fate SRD text under CC BY 3.0
  - path: sheet-fate-help/
    package: sheet-fate-help
    version: 1.0.0
    description: Puts the Fate sheet topics into +help
  - path: sheet-fate-config/
    package: sheet-fate-config
    version: 1.0.0
    description: Puts the Fate sheet settings and its skill, approach, stress and consequence tables into +config
  - path: sheet-fate-chargen/
    package: sheet-fate-chargen
    version: 1.1.0
    description: Joins the Fate sheet to +app character applications
  - path: sheet-fate-wiki/
    package: sheet-fate-wiki
    version: 1.1.0
    description: Fate rules reference as wiki pages; Fate SRD text under CC BY 3.0
  - path: atomic-robo/
    name: Atomic Robo
    package: atomic-robo
    version: 1.1.0
    description: Unofficial Atomic Robo pack, pulp action science and giant robots on the Fate sheet (modes, mega-stunts, invention, brainstorms, machines and enemy robots at scale); Atomic Robo RPG SRD and Fate System Toolkit text under CC BY 3.0
  - path: atomic-robo-help/
    package: atomic-robo-help
    version: 1.0.0
    description: Puts the Atomic Robo topics into +help
  - path: atomic-robo-config/
    package: atomic-robo-config
    version: 1.0.0
    description: Puts the Atomic Robo settings and its modes and scales tables into +config
  - path: atomic-robo-wiki/
    package: atomic-robo-wiki
    version: 1.1.0
    description: Unofficial Atomic Robo rules reference as wiki pages; Atomic Robo RPG SRD and Fate System Toolkit text under CC BY 3.0
  - path: fate-adversary-toolkit/
    name: Fate Adversary Toolkit
    package: fate-adversary-toolkit
    version: 1.0.0
    description: Unofficial Fate Adversary Toolkit pack, opposition for the Fate sheet (ready adversaries scaled to your game, adversaries built by type, filler mobs, hazards, blocks, distractions, countdowns, limitations and resistances); Fate Adversary Toolkit SRD text under CC BY 3.0
  - path: fate-adversary-toolkit-help/
    package: fate-adversary-toolkit-help
    version: 1.0.0
    description: Puts the Fate Adversary Toolkit topics into +help
  - path: fate-adversary-toolkit-config/
    package: fate-adversary-toolkit-config
    version: 1.0.0
    description: Puts the Fate Adversary Toolkit settings and its adversary and obstacle libraries into +config
  - path: fate-adversary-toolkit-wiki/
    package: fate-adversary-toolkit-wiki
    version: 1.0.0
    description: Unofficial Fate Adversary Toolkit rules reference as wiki pages; Fate Adversary Toolkit SRD text under CC BY 3.0
  - path: fate-system-toolkit/
    name: Fate System Toolkit
    package: fate-system-toolkit
    version: 1.1.0
    description: Unofficial Fate System Toolkit pack for the Fate sheet (conditions that soak stress, a Wealth track for money on an audited ledger, Stormcallers' storm magic with barriers, super skills with fate-point bids between powers, gadgets and magic items, and cyberware with surgery); Fate System Toolkit SRD text under CC BY 3.0
  - path: fate-system-toolkit-help/
    package: fate-system-toolkit-help
    version: 1.1.0
    description: Puts the Fate System Toolkit topics into +help
  - path: fate-system-toolkit-config/
    package: fate-system-toolkit-config
    version: 1.1.0
    description: Puts the Fate System Toolkit settings, conditions, storms and augs into +config
  - path: fate-system-toolkit-wiki/
    package: fate-system-toolkit-wiki
    version: 1.1.0
    description: Unofficial Fate System Toolkit rules reference as wiki pages; Fate System Toolkit SRD text under CC BY 3.0
  - path: duties-d20/
    package: duties-d20
    version: 1.0.1
    description: Duties roll provider "d20" on the D20 sheet
  - path: duties-pf2e/
    package: duties-pf2e
    version: 1.0.0
    description: Duties roll provider "pf2e" on the Pathfinder 2e sheet
  - path: duties-fate/
    package: duties-fate
    version: 1.0.0
    description: Duties roll provider "fate" on the Fate sheet
  - path: sheet-pbta/
    name: PbtA Sheet
    package: sheet-pbta
    version: 2.3.1
    description: Powered by the Apocalypse character sheet built from a ledger (playbooks, stats, moves, guided character creation, advances, forward, ongoing, hold, harm, XP), +check on 2d6 and encounters on sheet copies with foes and GM moves; Dungeon World moves under CC BY 3.0
  - path: sheet-pbta-help/
    package: sheet-pbta-help
    version: 1.0.1
    description: Puts the PbtA sheet topics into +help
  - path: sheet-pbta-config/
    package: sheet-pbta-config
    version: 1.0.2
    description: Puts the PbtA sheet settings and its stats, moves, playbooks, foes and GM moves tables into +config
  - path: sheet-pbta-chargen/
    package: sheet-pbta-chargen
    version: 1.1.0
    description: Joins the PbtA sheet to +app character applications
  - path: duties-pbta/
    package: duties-pbta
    version: 1.0.2
    description: Duties roll provider "pbta" on the PbtA sheet
  - path: pbta-wiki/
    name: PbtA rules
    package: pbta-wiki
    version: 1.1.0
    description: Wiki pages for the PbtA sheet (how to play, making a character, playbooks, moves, advancement, encounters, foes); Dungeon World moves under CC BY 3.0
  - path: d20-wiki/
    name: D20 rules
    package: d20-wiki
    version: 1.1.0
    description: Wiki pages for the d20 sheet (checks and DCs, making a character, abilities and skills, hit points, gear and advancement, encounters)
  - path: fitd-wiki/
    name: Forged in the Dark rules
    package: fitd-wiki
    version: 1.1.0
    description: Wiki pages for the FitD sheet (how to play, making a character, actions and attributes, stress, harm and advancement, encounters, threats, clocks); based on the Blades in the Dark SRD under CC BY 3.0
  - path: brp-wiki/
    name: Percentile rules (BRP)
    package: brp-wiki
    version: 1.1.0
    description: Wiki pages for the BRP sheet (how to play, making a character, characteristics and skills, hit points, coin and experience, encounters, creatures); ORC Licensed Material
  - path: ironsworn-wiki/
    name: Ironsworn rules
    package: ironsworn-wiki
    version: 1.1.0
    description: Wiki pages for the Ironsworn sheet (how to play, making a character, assets and experience, meters and momentum, vows, encounters, foes); based on the Ironsworn SRD under CC BY 4.0
  - path: pf2e/
    name: Pathfinder 2e rules
    package: pf2e
    version: 0.10.4
    description: Pathfinder Second Edition rules read the way Foundry VTT's pf2e system reads them, with ledger character sheets, a character builder, spellcasting, a deity table the game fills, alchemy, encounters with a bestiary, hazards, effects and GM tools, exploration, skill challenges, audited awards and levels (ORC License)
