    package: pf2e-config
    version: 1.0.0
    description: Puts the Pathfinder 2e settings into +config
  - path: sheet-fitd/
    name: FitD Sheet
    package: sheet-fitd
    version: 2.2.1
    description: Forged in the Dark character sheet (ledger-built actions, XP advances, stress, trauma, harm, coin, audited log, encounters with threats and positions, clocks) with +check on a d6 pool; Blades in the Dark SRD under CC BY 3.0
  - path: sheet-fitd-help/
