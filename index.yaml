    description: Joins the BRP sheet to +app character applications
  - path: sheet-ironsworn/
    name: Ironsworn Sheet
    package: sheet-ironsworn
    version: 2.0.0
    description: Ironsworn character sheet (stats and assets built from a ledger, meters, experience spent on assets with an audited log, companion health, iron vows, encounters with their own copies) with +check action rolls and +vow; Ironsworn SRD under CC BY 4.0
  - path: sheet-ironsworn-help/
    package: sheet-ironsworn-help
    version: 1.0.1
