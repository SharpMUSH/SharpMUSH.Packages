  - path: duties-ironsworn/
    package: duties-ironsworn
    version: 1.1.0
    description: Duties roll provider "ironsworn" on the Ironsworn sheet
  - path: sheet-salvage-union/
    name: Salvage Union Sheet
    package: sheet-salvage-union
    version: 1.1.0
    description: Salvage Union pilots, mechs and the Union Crawler (class ability trees, chassis, systems, modules, scrap, heat) with d20 +check on the Core Mechanic table; Salvage Union Open Game Licence 1.0b, unofficial
  - path: sheet-salvage-union-help/
