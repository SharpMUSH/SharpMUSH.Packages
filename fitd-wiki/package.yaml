format: "1.20"
package: fitd-wiki
title: "Forged in the Dark rules"
version: 1.1.1
wiki_landing_page: category:fitd_start_here
wiki_collection_name: Forged in the Dark
authors: [SharpMUSH]
description: "Wiki pages for playing with the Forged in the Dark sheet: actions and positions, making a character, the actions and attributes, stress, harm and advancement, encounters with threats, and clocks. Based on the Blades in the Dark SRD under CC BY 3.0; an unofficial offering."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [fitd, forged in the dark, wiki, rules]
category: Game System
subcategory: Forged in the Dark
requires_server: ">=0.1"
locale: en

# A content package: wiki pages only. The action page lists the actions sheet-fitd ships; a game that edits them
# in +config changes the sheet, not these pages. help:fitd_license_notice carries the Blades in the Dark
# attribution the CC BY 3.0 licence asks for.
