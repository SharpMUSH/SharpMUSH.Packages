format: "1.20"
package: sheet-d20-config
title: "D20 sheet: +config settings"
version: 1.0.4
authors: [SharpMUSH]
description: "Puts the D20 sheet settings and its trait and bestiary tables into +config: registers them with the +config registry, so staff see and change them with +config d20."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, d20, config, bridge]
category: Game System
subcategory: D20
bridge: true
requires_server: ">=1.0"
verified_server: "1.0"

# A bridge: it joins two packages that do not know about each other. sheet-d20 declares its settings as
# DATA`CONFIG`<NAME>, with their types and limits, and reads them with get() whether or not +config is
# installed. This package is the one leaf that tells the +config registry where they are.
depends:
  - package: sheet-d20
    version: ">=2.0 <3.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH.Packages
      path: sheet-d20/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`D20: |-
        {{sheet-d20/sheet}}
