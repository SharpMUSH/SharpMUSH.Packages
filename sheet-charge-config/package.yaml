format: "1.20"
package: sheet-charge-config
title: "Charge sheet: +config settings"
version: 1.0.2
authors: [SharpMUSH]
description: "Puts the Charge sheet settings and its action and detail tables into +config: registers them with the +config registry, so staff see and change them with +config charge."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, charge, config, bridge]
category: Game System
subcategory: Charge
bridge: true
requires_server: ">=1.0"
verified_server: "1.0"

# A bridge: it joins two packages that do not know about each other. sheet-charge declares its settings as
# DATA`CONFIG`<NAME>, with their types and limits, and reads them with get() whether or not +config is
# installed. This package is the one leaf that tells the +config registry where they are.
depends:
  - package: sheet-charge
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH.Packages
      path: sheet-charge/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`CHARGE: |-
        {{sheet-charge/sheet}}
