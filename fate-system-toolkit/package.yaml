format: "1.20"
package: fate-system-toolkit
title: "Fate System Toolkit (unofficial)"
version: 1.1.3
authors: [SharpMUSH]
description: "Rules from the Fate System Toolkit for the Fate sheet: conditions that soak stress in place of consequences (fleeting, sticky and lasting, treated before they heal), a Wealth track for money that a player checks for a bonus on a roll and staff refill with audited parcels of loot, Stormcallers, magic drawn from five great storms at a cost in refresh, with barriers and each storm's own attacks; super skills that double for a fate point and step back after, with fate-point bids between powers; gadgets and magic items with a function, flaws and stunts; and cyberware on a cyber-heart, with surgery paid for in play. Based on the Fate System Toolkit SRD under CC BY 3.0. An unofficial fan package, not affiliated with or endorsed by Evil Hat Productions."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, fate, magic, supers, cyberware]
category: Game System
subcategory: Fate
requires_server: ">=1.0"
verified_server: "1.0"

# It keeps conditions in the Fate sheet's play (encounter copies hold them through PLAY`CONDITION), counts them
# against a hit through the sheet's SOAK` hooks, steps super skills back through its RATE` hooks (sheet-fate 1.6),
# adds a Wealth option to +sheet/advance, and charges storms, super skills, gadgets and cyberware as refresh
# grants on the sheet's ledger. Sheet keepers (softcode.fate.admin) keep this too;
# there is no permission of its own.
depends:
  - package: sheet-fate
    version: ">=1.6 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH.Packages
      path: sheet-fate/
      branch: main

objects:
  # The command object, in the master room. WIZARD because it adds the commands (@command/add, @hook), writes
  # under each character's FATE` tree (wizard-flagged) through the Fate sheet's FUN`DO`WRITE and API`PLAYSET, and
  # calls the sheet's functions.
  #
  # What it keeps on a character, beside the sheet's own leaves: FATE`CONDITION`<KEY> the boxes checked on a
  # condition (play: an encounter holds its own copy), FATE`WEALTH`ASPECTS the aspect slots about wealth (build),
  # FATE`WEALTH`LEDGER`<n> the Wealth ledger ("spend <box>" or "gain <parcel>", with BY, AT, WHY, CLEARED and VOID
  # beneath), FATE`WEALTH`MARKED the boxes checked, worked out from the ledger, and FATE`STORM`<KEY> a storm the
  # character is attuned to (build), charged as a refresh grant from source STORM_<KEY>. FATE`SUPER`<KEY> a super
  # skill (build, grant SUPER_<KEY>), with STEP beneath (play) and OUT (exhausted). FATE`GADGET`<n> a gadget (build,
  # grant GADGET_<n>), with FUNCTION, FLAW`<m> and STUNT`<m> beneath. FATE`AUG`<KEY> installed cyberware (build), with
  # OPTIONS (choices taken) or SLOT (the heart's aspect) beneath, charged together as the grant CYBER. Open power bids
  # live on the store, BID`<room number>.
  #
  # +condition, +wealth, +storm, +super, +gadget and +aug are added with /noparse/rsnoparse and hooked to CMD`<word>,
  # so what a player types reaches the code exactly as typed and nothing a player wrote is ever evaluated.
  #
  # Trees: CMD` the hooked commands, INC`COMMAND` the parse and dispatch, INC`COND`, INC`WEALTH`, INC`STORM`,
  # INC`SUPER`, INC`GADGET` and INC`AUG` one routine per switch, INC`NEED` the guards. FUN`LIST` the store's lists,
  # FUN`COND`, FUN`WEALTH`, FUN`STORM`, FUN`SUPER`, FUN`BID`, FUN`GADGET` and FUN`AUG` the rules, FUN`SCREEN` the
  # screens.
  - ref: toolkit
    type: thing
    name: Fate System Toolkit
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      # ---- settings ---------------------------------------------------------------
      # +config toolkit shows and changes them (fate-system-toolkit-config).
