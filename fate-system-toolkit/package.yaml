  # The help topics. fate-system-toolkit-help registers this object with +help.
  - ref: toolkit_help
    type: thing
    name: Fate System Toolkit Help
    location: "{{toolkit}}"
    attributes:
      HELP: |-
        Rules from the Fate System Toolkit for the Fate sheet: +condition, +wealth and +storm.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`CONDITION: |-
        wealth storm encounter sheet
      SEE`WEALTH: |-
        condition storm sheet
      SEE`STORM: |-
        condition wealth sheet
      SEE`TOOLKIT: |-
        condition wealth storm
      HELP`CONDITION: |-
        Conditions are set hurts, such as Angry or Wounded, that soak stress the way consequences do. Each is an aspect while you suffer it, and someone else may invoke it once for free.

        - **fleeting** conditions soak 1 shift and clear once you catch your breath.
        - **sticky** ones soak 2 and clear after something happens: Exhausted until you sleep.
        - **lasting** ones soak 4, have two boxes, and heal only after treatment: `+help condition treat`.

        - `+condition` shows yours; `+condition <name>` someone else's, where you may read their sheet.
        - `+condition/list` lists this game's conditions.
        - `+condition/take <condition> \[<condition>...\]` checks them off to soak a hit.
        - `+condition/recover <condition>` clears one you are over.

        In an encounter, conditions change its copy of your sheet, as stress does: they stay only if the GM keeps it. `+encounter/harm` counts your clear conditions in what you can take.

        For example:

        `+condition/take angry hungry`

        Output: `\[CONDITION\] Pat takes Angry and Hungry, soaking 3 shifts. Each is an aspect on their sheet now, and someone else may invoke each once for free.`

        `+help condition gm` is for GMs and staff.
      HELP`CONDITION`TREAT: |-
        A lasting condition has two boxes, and you take it only while both are clear. It heals in two steps:

        1. Someone treats it, overcoming the treatment difficulty \(Great \(+4\) unless the game sets another\): `+condition/treat <name>/<condition>=<skill>`. A tie or better clears one box.
        2. After one more full session, `+condition/recover <condition>` clears the other.

        Leave out `<name>/` to treat your own.

        For example:

        `+condition/treat Pat/wounded=lore+1`
      HELP`CONDITION`GM: |-
        The GM says when someone suffers a condition. The GM of the encounter a player's play goes to, and sheet keepers anywhere, use:

        - `+condition/give <name>=<condition> \[<condition>...\]` to check conditions off for them.
        - `+condition/clear <name>=<condition>` to clear one, or `=all` for every one, as a session's end does for a lasting condition.

        Staff change the list with `+config toolkit/conditions`: each has a name, a kind \(fleeting, sticky or lasting\), when it clears and an order. The toolkit keeps the total at 14 shifts, and a game that uses conditions in place of consequences takes the consequence slots away with `+config/remove fate/consequences/<slot>`.
      HELP`WEALTH: |-
        Wealth is money as a stress track. When cash would help, check a box for a bonus on your roll: box 1 adds +1, box 2 adds +2. A checked box stays checked until a parcel of Wealth comes in.

        - `+wealth` shows your boxes; `+wealth <name>` someone else's, where you may read their sheet.
        - `+wealth/spend <box>\[=<what for>\]` checks a box for a roll you made or are making.
        - `+wealth/roll <box>=<skill>\[+<n>\]\[=<opposition>\]` checks a box and rolls with it.
        - `+wealth/log \[<name>\]` shows every entry on the ledger.
        - `+wealth/aspect <slot>` says one of your aspects is about how well off you are, for one more box. Before approval only; after it, `+sheet/advance wealth <slot>=<aspect>` spends a milestone to rewrite an aspect as one about wealth.

        You start with 2 boxes, and each aspect about wealth adds one, up to 3 more \(`+help toolkit settings`\).

        For example:

        `+wealth/roll 2=rapport=fair`

        Output: `\[WEALTH\] Pat checks Wealth box 2 and rolls (+2) Rapport: 4dF\[-1, 1, 1, -1\] + 2 = 2 (Fair) against Fair (+2): a tie, no shifts (roll 11)`

        `+help wealth staff` covers parcels.
      HELP`WEALTH`STAFF: |-
        Sheet keepers give Wealth and take entries back. Every change is an entry on the character's ledger, with who made it, when and why; nothing is taken off it.

        - `+wealth/gain <name>=<parcel> <why>` gives a parcel worth 1 to 10. It clears the checked boxes worth the most it covers: a parcel of 3 clears box 3, or boxes 1 and 2, but never box 4.
        - `+wealth/void <name>/<entry>=<reason>` takes an entry back. The boxes are worked out again without it.

        For example:

        `+wealth/gain Pat=3 The dragon's hoard`

        Output: `\[WEALTH\] Done: Pat gets a parcel of 3 Wealth, entry 3: it clears boxes 1 and 2. 1\[ \] 2\[ \] 3\[ \]`
      LOCK`WEALTH`STAFF: |-
        perm^softcode.fate.admin
      HELP`STORM: |-
        A Stormcaller draws magic from one of five great storms: Earthquake, Flood, Glacier, Inferno and Thunder. The power works outside you: you hit something hard with a rock, not with the strength of the earth.

        - `+storm/list` lists the storms, and `+storm <storm>` shows one: its aspect's passive effect, invoke and compel, and how it attacks, defends and raises barriers.
        - `+storm/attune <storm>` attunes you, before approval, for 2 refresh \(`+help toolkit settings`\). Write an aspect that names the storm, such as Earthcaller.
        - `+storm/unattune <storm>` gives it up and its refresh back.
        - `+storm` shows the storms you are attuned to.

        Stormcalling rolls the Stormcaller skill, or on a game of approaches the approach you name: `+help storm rolls`.
      HELP`STORM`ROLLS: |-
        `+storm/<roll> \[<storm>\] \[<words>\]\[=<opposition>\]` calls your storm. Name the storm when you have more than one.

        - `/attack`: `far <n>` takes -1 for each zone away; `zone` hits everyone in a zone \(Earthquake -1, Flood -2, Inferno -1\); `spread <n>` reaches more zones \(Earthquake, -2 each\); `chain <n>` hits more targets \(Thunder, -1 each\); `freeze` holds the target in place for half the damage \(Glacier\).
        - `/barrier`: rolled against 0, the result is the barrier's rating. `surround` and `seal` close a zone \(Earthquake\); `length <n>` runs it further, 1 off for each length past the first \(Glacier\).
        - `/defend`, `/overcome` \(`barrier` against a physical barrier\) and `/advantage`.

        Every roll takes `held` \(-1 while you hold a barrier\), `with <approach>` on a game of approaches, and `+<n>` or `-<n>` for invokes.

        For example:

        `+storm/barrier length 3 +4`

        Output: `\[STORM\] Kim calls the Glacier to raise a barrier (+1 for the Glacier and +4 more): Stormcaller: 4dF\[0, 0, 1, 1\] + 5 = 7 (Epic) (roll 23) A Superb (+5) barrier stands 3 lengths long, 1 off for each past the first: getting past it takes 5, and a defender behind it may take 5 in place of a defence roll. It stays.`
      HELP`TOOLKIT: |-
        The Fate System Toolkit package adds three of the toolkit's rules to the Fate sheet: conditions \(`+help condition`\), Wealth \(`+help wealth`\) and Stormcallers \(`+help storm`\). `+help toolkit settings` covers what staff change, and `+help toolkit credits` names the source.
      HELP`TOOLKIT`SETTINGS: |-
        `+config toolkit` lists the settings and `+config toolkit/<setting>=<value>` changes one \(`config.admin`\):

        - `treat`: the difficulty to start a lasting condition's recovery \(4\).
        - `wealth_boxes`: the Wealth boxes everyone starts with \(2\).
        - `wealth_extra`: how many aspects about wealth add a box each \(3\).
        - `parcel_max`: the most a parcel of Wealth is worth \(10\).
        - `storm_cost`: the refresh each storm costs \(2; 1 on a game that uses Weapon and Armor ratings\).
        - `storm_skill`: the skill Stormcallers roll \(stormcaller\).
        - `conditions` and `storms`: the lists. `+config toolkit/storms/<storm>` shows a storm's fields.
      LOCK`TOOLKIT`SETTINGS: |-
        perm^config.admin
      HELP`TOOLKIT`CREDITS: |-
        Conditions, Wealth and Stormcallers are from the Fate System Toolkit SRD.

        This work is based on the Fate System Toolkit \(found at http://www.faterpg.com/\), a product of Evil Hat Productions, LLC, developed, authored, and edited by Robert Donoghue, Brian Engard, Brennan Taylor, Mike Olson, Mark Diaz Truman, Fred Hicks, and Matthew Gandy, and licensed for our use under the Creative Commons Attribution 3.0 Unported license \(http://creativecommons.org/licenses/by/3.0/\).

        Fate is a trademark of Evil Hat Productions, LLC. This is an unofficial package: this game is not affiliated with or endorsed by Evil Hat Productions.

  # The Stormcaller skill, on a game of skills.
  - ref: skills
    target: "{{sheet-fate/store}}"
    attributes:
      SKILL`STORMCALLER: |-
        Stormcaller
      SKILL`STORMCALLER`ORDER: |-
        60

  # The Fate sheet's hooks: an encounter copies conditions, a hit counts the clear ones, +sheet shows conditions,
  # Wealth and storms, +chargen offers Wealth and a storm, +sheet/clear takes the build's parts away, and
  # +sheet/advance spends a milestone on an aspect about wealth. Each runs as the Fate Sheet, which is WIZARD and so
  # may call this object.
  - ref: sheet_hooks
    target: "{{sheet-fate/sheet}}"
    attributes:
      PLAY`CONDITION: |-
        CONDITION`*
      BUILD`TOOLKIT: |-
        WEALTH`ASPECTS STORM
      # %0 the player, %1 their encounter copy: the shifts their clear conditions soak, and how to take them.
      SOAK`CONDITION:
        value: |-
          ladd(iter(u({{toolkit}}/FUN`LIST`ALL,COND),if(strlen(get(%1`CONDITION`%i0)),0,u({{toolkit}}/FUN`COND`SOAK,%i0))))
        flags: [funsyntax]
      SOAK`CONDITION`TEXT:
        value: |-
          setq(soak_open,squish(iter(u({{toolkit}}/FUN`LIST`ALL,COND),if(strlen(get(%1`CONDITION`%i0)),,%i0))))[if(words(%q<soak_open>),+condition/take <condition> %(clear: [itemize(iter(%q<soak_open>,[lcstr(get({{store}}/COND`%i0))] [u({{toolkit}}/FUN`COND`SOAK,%i0)],%b,|),|)]%))]
        flags: [funsyntax]
      SECTION`CONDITIONS:
        value: |-
          if(words(setr(section_taken,u({{toolkit}}/FUN`COND`TAKEN,%0))),lfields(,iter(%q<section_taken>,get({{store}}/COND`%i0),%b,%*<|>),iter(%q<section_taken>,[u({{toolkit}}/FUN`COND`BOXES,%i0,u({{toolkit}}/FUN`COND`MARKED,%0,%i0))] [u({{toolkit}}/FUN`COND`KIND,%i0)]: [firstof(get({{store}}/COND`%i0`CLEARS),-)],%b,%*<|>),%*<|>))
        flags: [funsyntax]
      SECTION`CONDITIONS`TITLE: |-
        Conditions
      SECTION`CONDITIONS`ORDER: |-
        60
      SECTION`WEALTH:
        value: |-
          if(hasattr(%0,FATE),lfields(,Boxes%*<|>About wealth,[u({{toolkit}}/FUN`WEALTH`TRACK,%0)]%*<|>[firstof(itemize(iter(u({{toolkit}}/FUN`WEALTH`HELD,%0),get(%0/FATE`ASPECT`%i0),%b,|),|),none)],%*<|>))
        flags: [funsyntax]
      SECTION`WEALTH`TITLE: |-
        Wealth
      SECTION`WEALTH`ORDER: |-
        61
      SECTION`STORMS:
        value: |-
          if(words(setr(section_storms,u({{toolkit}}/FUN`STORM`HELD,%0))),lfields(,iter(%q<section_storms>,get({{store}}/STORM`%i0),%b,%*<|>),iter(%q<section_storms>,get({{store}}/STORM`%i0`PASSIVE),%b,%*<|>),%*<|>))
        flags: [funsyntax]
      SECTION`STORMS`TITLE: |-
        Storms
      SECTION`STORMS`ORDER: |-
        62
      CHARGEN`WEALTH: |-
        Wealth
      CHARGEN`WEALTH`ORDER: |-
        12
      CHARGEN`WEALTH`OPTIONAL: |-
        1
      CHARGEN`WEALTH`DONE:
        value: |-
          words(u({{toolkit}}/FUN`WEALTH`HELD,%0))
        flags: [funsyntax]
      CHARGEN`WEALTH`TEXT:
        value: |-
          Wealth is a stress track you check for a bonus on a roll: box 2 adds +2. You start with [get({{toolkit}}/DATA`CONFIG`WEALTH_BOXES)] boxes%, and each aspect about how well off you are adds one%, up to [get({{toolkit}}/DATA`CONFIG`WEALTH_EXTRA)] more: +wealth/aspect <slot> says which.%r%rYour boxes: [u({{toolkit}}/FUN`WEALTH`TRACK,%0)].
        flags: [funsyntax]
      CHARGEN`STORM: |-
        Storm
      CHARGEN`STORM`ORDER: |-
        36
      CHARGEN`STORM`OPTIONAL: |-
        1
      CHARGEN`STORM`DONE:
        value: |-
          words(u({{toolkit}}/FUN`STORM`HELD,%0))
        flags: [funsyntax]
      CHARGEN`STORM`TEXT:
        value: |-
          A Stormcaller draws magic from one of five great storms: [u({{toolkit}}/FUN`LIST`NAMES,STORM,u({{toolkit}}/FUN`LIST`ALL,STORM))]. Each costs [get({{toolkit}}/DATA`CONFIG`STORM_COST)] refresh and needs an aspect that names it. +storm/list shows them%, +storm <storm> shows one%, and +storm/attune <storm> attunes you.%r%r[if(words(setr(chargen_storms,u({{toolkit}}/FUN`STORM`HELD,%0))),You are attuned to [u({{toolkit}}/FUN`LIST`NAMES,STORM,%q<chargen_storms>)].,You are attuned to no storm.)]
        flags: [funsyntax]
      ADVANCE`WEALTH: |-
        Rewrite an aspect as one about your wealth, for one more Wealth box
      ADVANCE`WEALTH`TOKEN: |-
        M
      ADVANCE`WEALTH`USAGE: |-
        wealth <slot>=<aspect>
      ADVANCE`WEALTH`SKIP:
        value: |-
          gte(words(u({{toolkit}}/FUN`WEALTH`HELD,%0)),get({{toolkit}}/DATA`CONFIG`WEALTH_EXTRA))
        flags: [funsyntax]
      ADVANCE`WEALTH`RUN:
        value: |-
          setq(r_slot,u(%!/FUN`ASPECT`SLOT,%1))[cond(not(strlen(%q<r_slot>)),#-1 There is no aspect '%1'. Use trouble%, or 1 to [sub(get(%!/DATA`CONFIG`ASPECTS),2)].,strmatch(%q<r_slot>,CONCEPT),#-1 A new high concept takes a breakthrough: +sheet/advance aspect concept=<aspect>%, then +wealth/aspect concept asks staff.,member(get(%0/FATE`WEALTH`ASPECTS),%q<r_slot>),#-1 [u(%!/FUN`ASPECT`LABEL,%q<r_slot>)] is about wealth already.,not(strlen(%2)),#-1 Write the new aspect after =: one about how well off you are.,gt(strlen(%2),200),#-1 Keep an aspect to 200 characters.,1,[u(%!/FUN`DO`WRITE,%0,ASPECT`%q<r_slot>,%2)][u(%!/FUN`DO`WRITE,%0,WEALTH`ASPECTS,squish(get(%0/FATE`WEALTH`ASPECTS) %q<r_slot>))][u(%!/FUN`ASPECT`LABEL,%q<r_slot>)] is now: %2. [name(%0)] has [u({{toolkit}}/FUN`WEALTH`BOXES,%0)] Wealth boxes.)]
        flags: [funsyntax]
