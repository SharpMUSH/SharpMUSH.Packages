format: "1.16"
package: fate-system-toolkit
title: "Fate System Toolkit (unofficial)"
version: 1.0.0
authors: [SharpMUSH]
description: "Rules from the Fate System Toolkit for the Fate sheet: conditions that soak stress in place of consequences (fleeting, sticky and lasting, treated before they heal), a Wealth track for money that a player checks for a bonus on a roll and staff refill with audited parcels of loot, and Stormcallers, magic drawn from five great storms at a cost in refresh, with barriers and each storm's own attacks. Based on the Fate System Toolkit SRD under CC BY 3.0. An unofficial fan package, not affiliated with or endorsed by Evil Hat Productions."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, fate, conditions, wealth, magic]
category: Characters
requires_server: ">=0.1"

# It keeps conditions in the Fate sheet's play (encounter copies hold them through PLAY`CONDITION), counts them
# against a hit through the sheet's SOAK` hooks (sheet-fate 1.5), adds a Wealth option to +sheet/advance, and
# charges a storm's refresh through the sheet's grant ledger. Sheet keepers (softcode.fate.admin) keep this too;
# there is no permission of its own.
depends:
  - package: sheet-fate
    version: ">=1.5 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH.Packages
      path: sheet-fate/
      branch: main

objects:
  # The command object, in the master room. WIZARD because it adds the commands (@command/add, @hook), writes
  # under each character's FATE` tree (wizard-flagged) through the Fate sheet's FUN`DO`WRITE and API`PLAYSET, and
  # calls the sheet's functions.
  #
  # What it keeps on a character, beside the sheet's own leaves: FATE`CONDITION`<KEY> the boxes checked on a
  # condition (play: an encounter holds its own copy), FATE`WEALTH`ASPECTS the aspect slots about wealth (build),
  # FATE`WEALTH`LEDGER`<n> the Wealth ledger ("spend <box>" or "gain <parcel>", with BY, AT, WHY, CLEARED and VOID
  # beneath), FATE`WEALTH`MARKED the boxes checked, worked out from the ledger, and FATE`STORM`<KEY> a storm the
  # character is attuned to (build), charged as a refresh grant from source STORM_<KEY>.
  #
  # +condition, +wealth and +storm are added with /noparse/rsnoparse and hooked to CMD`<word>, so what a player
  # types reaches the code exactly as typed and nothing a player wrote is ever evaluated.
  #
  # Trees: CMD` the hooked commands, INC`COMMAND` the parse and dispatch, INC`COND`, INC`WEALTH` and INC`STORM` one
  # routine per switch, INC`NEED` the guards. FUN`LIST` the store's lists, FUN`COND`, FUN`WEALTH` and FUN`STORM` the
  # rules, FUN`SCREEN` the screens.
  - ref: toolkit
    type: thing
    name: Fate System Toolkit
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      # ---- settings ---------------------------------------------------------------
      # +config toolkit shows and changes them (fate-system-toolkit-config).
      DATA`CONFIG: |-
        Settings for conditions, Wealth and Stormcallers on the Fate sheet. One leaf per setting.
      DATA`CONFIG`LABEL: |-
        Fate System Toolkit
      DATA`CONFIG`TREAT: |-
        4
      DATA`CONFIG`TREAT`TYPE: |-
        integer
      DATA`CONFIG`TREAT`DEFAULT: |-
        4
      DATA`CONFIG`TREAT`MIN: |-
        0
      DATA`CONFIG`TREAT`MAX: |-
        8
      DATA`CONFIG`TREAT`LABEL: |-
        Treatment
      DATA`CONFIG`TREAT`DESCRIPTION: |-
        The passive opposition someone overcomes to start a lasting condition's recovery.
      DATA`CONFIG`TREAT`EXAMPLE: |-
        4
      DATA`CONFIG`WEALTH_BOXES: |-
        2
      DATA`CONFIG`WEALTH_BOXES`TYPE: |-
        integer
      DATA`CONFIG`WEALTH_BOXES`DEFAULT: |-
        2
      DATA`CONFIG`WEALTH_BOXES`MIN: |-
        0
      DATA`CONFIG`WEALTH_BOXES`MAX: |-
        10
      DATA`CONFIG`WEALTH_BOXES`LABEL: |-
        Starting Wealth
      DATA`CONFIG`WEALTH_BOXES`DESCRIPTION: |-
        The Wealth boxes every character has before aspects about wealth add more.
      DATA`CONFIG`WEALTH_BOXES`EXAMPLE: |-
        2
      DATA`CONFIG`WEALTH_EXTRA: |-
        3
      DATA`CONFIG`WEALTH_EXTRA`TYPE: |-
        integer
      DATA`CONFIG`WEALTH_EXTRA`DEFAULT: |-
        3
      DATA`CONFIG`WEALTH_EXTRA`MIN: |-
        0
      DATA`CONFIG`WEALTH_EXTRA`MAX: |-
        5
      DATA`CONFIG`WEALTH_EXTRA`LABEL: |-
        Wealth from aspects
      DATA`CONFIG`WEALTH_EXTRA`DESCRIPTION: |-
        How many aspects about how well off a character is add a Wealth box each.
      DATA`CONFIG`WEALTH_EXTRA`EXAMPLE: |-
        3
      DATA`CONFIG`PARCEL_MAX: |-
        10
      DATA`CONFIG`PARCEL_MAX`TYPE: |-
        integer
      DATA`CONFIG`PARCEL_MAX`DEFAULT: |-
        10
      DATA`CONFIG`PARCEL_MAX`MIN: |-
        1
      DATA`CONFIG`PARCEL_MAX`MAX: |-
        50
      DATA`CONFIG`PARCEL_MAX`LABEL: |-
        Largest parcel
      DATA`CONFIG`PARCEL_MAX`DESCRIPTION: |-
        The most a parcel of Wealth from +wealth/gain is worth.
      DATA`CONFIG`PARCEL_MAX`EXAMPLE: |-
        10
      DATA`CONFIG`STORM_COST: |-
        2
      DATA`CONFIG`STORM_COST`TYPE: |-
        integer
      DATA`CONFIG`STORM_COST`DEFAULT: |-
        2
      DATA`CONFIG`STORM_COST`MIN: |-
        1
      DATA`CONFIG`STORM_COST`MAX: |-
        3
      DATA`CONFIG`STORM_COST`LABEL: |-
        Refresh per storm
      DATA`CONFIG`STORM_COST`DESCRIPTION: |-
        The refresh each storm costs: 2 when the game has no Weapon and Armor ratings, 1 when it does.
      DATA`CONFIG`STORM_COST`EXAMPLE: |-
        1
      DATA`CONFIG`STORM_SKILL: |-
        stormcaller
      DATA`CONFIG`STORM_SKILL`TYPE: |-
        text
      DATA`CONFIG`STORM_SKILL`DEFAULT: |-
        stormcaller
      DATA`CONFIG`STORM_SKILL`PATTERN: |-
        ^[A-Za-z0-9_-]+$
      DATA`CONFIG`STORM_SKILL`LABEL: |-
        Storm skill
      DATA`CONFIG`STORM_SKILL`DESCRIPTION: |-
        The skill a Stormcaller rolls on a game of skills. On a game of approaches they name one.
      DATA`CONFIG`STORM_SKILL`EXAMPLE: |-
        stormcaller
      DATA`CONFIG`CONDITIONS`TYPE: |-
        table
      DATA`CONFIG`CONDITIONS`LABEL: |-
        Conditions
      DATA`CONFIG`CONDITIONS`DESCRIPTION: |-
        The conditions every character has: fleeting ones soak 1 shift, sticky ones 2, lasting ones 4. The toolkit keeps their total at 14.
      DATA`CONFIG`CONDITIONS`STORE: |-
        {{store}}
      DATA`CONFIG`CONDITIONS`PATH: |-
        COND
      DATA`CONFIG`CONDITIONS`ENTRY: |-
        label
      DATA`CONFIG`CONDITIONS`FIELDS: |-
        label kind clears order
      DATA`CONFIG`CONDITIONS`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,30}$
      DATA`CONFIG`CONDITIONS`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`CONDITIONS`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`CONDITIONS`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`CONDITIONS`FIELD`LABEL`PATTERN: |-
        ^[A-Za-z][A-Za-z0-9 '-]*$
      DATA`CONFIG`CONDITIONS`FIELD`LABEL`LABEL: |-
        Name
      DATA`CONFIG`CONDITIONS`FIELD`LABEL`DESCRIPTION: |-
        Its name, which is also the aspect a character has while they suffer it.
      DATA`CONFIG`CONDITIONS`FIELD`KIND`TYPE: |-
        choice
      DATA`CONFIG`CONDITIONS`FIELD`KIND`CHOICES: |-
        fleeting sticky lasting
      DATA`CONFIG`CONDITIONS`FIELD`KIND`DEFAULT: |-
        fleeting
      DATA`CONFIG`CONDITIONS`FIELD`KIND`LABEL: |-
        Kind
      DATA`CONFIG`CONDITIONS`FIELD`KIND`DESCRIPTION: |-
        Fleeting (soaks 1, gone once you catch your breath), sticky (soaks 2, gone after an event) or lasting (soaks 4, two boxes, treated before it heals).
      DATA`CONFIG`CONDITIONS`FIELD`CLEARS`TYPE: |-
        text
      DATA`CONFIG`CONDITIONS`FIELD`CLEARS`MAX: |-
        120
      DATA`CONFIG`CONDITIONS`FIELD`CLEARS`LABEL: |-
        Clears when
      DATA`CONFIG`CONDITIONS`FIELD`CLEARS`DESCRIPTION: |-
        What ends it, as +condition shows it.
      DATA`CONFIG`CONDITIONS`FIELD`ORDER`TYPE: |-
        integer
      DATA`CONFIG`CONDITIONS`FIELD`ORDER`DEFAULT: |-
        50
      DATA`CONFIG`CONDITIONS`FIELD`ORDER`MIN: |-
        0
      DATA`CONFIG`CONDITIONS`FIELD`ORDER`MAX: |-
        999
      DATA`CONFIG`CONDITIONS`FIELD`ORDER`LABEL: |-
        Order
      DATA`CONFIG`CONDITIONS`FIELD`ORDER`DESCRIPTION: |-
        Where it comes in the list: lower first, then by key.
      DATA`CONFIG`STORMS`TYPE: |-
        table
      DATA`CONFIG`STORMS`LABEL: |-
        Storms
      DATA`CONFIG`STORMS`DESCRIPTION: |-
        The storms a Stormcaller attunes to, with what each does.
      DATA`CONFIG`STORMS`STORE: |-
        {{store}}
      DATA`CONFIG`STORMS`PATH: |-
        STORM
      DATA`CONFIG`STORMS`ENTRY: |-
        label
      DATA`CONFIG`STORMS`FIELDS: |-
        label aspect passive invoke compel create attack defend overcome fade barriermod defendmod overcomemod zone spread chain surround seal lengths freeze order
      DATA`CONFIG`STORMS`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,30}$
      DATA`CONFIG`STORMS`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`STORMS`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`STORMS`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`STORMS`FIELD`LABEL`PATTERN: |-
        ^[A-Za-z][A-Za-z0-9 '-]*$
      DATA`CONFIG`STORMS`FIELD`LABEL`LABEL: |-
        Name
      DATA`CONFIG`STORMS`FIELD`LABEL`DESCRIPTION: |-
        The storm's name.
      DATA`CONFIG`STORMS`FIELD`ASPECT`TYPE: |-
        text
      DATA`CONFIG`STORMS`FIELD`ASPECT`MAX: |-
        60
      DATA`CONFIG`STORMS`FIELD`ASPECT`LABEL: |-
        Aspect
      DATA`CONFIG`STORMS`FIELD`ASPECT`DESCRIPTION: |-
        An aspect that names the storm, offered to a character who attunes to it.
      DATA`CONFIG`STORMS`FIELD`PASSIVE`TYPE: |-
        text
      DATA`CONFIG`STORMS`FIELD`PASSIVE`MAX: |-
        300
      DATA`CONFIG`STORMS`FIELD`PASSIVE`LABEL: |-
        Passive effect
      DATA`CONFIG`STORMS`FIELD`PASSIVE`DESCRIPTION: |-
        What the storm's aspect always does.
      DATA`CONFIG`STORMS`FIELD`INVOKE`TYPE: |-
        text
      DATA`CONFIG`STORMS`FIELD`INVOKE`MAX: |-
        300
      DATA`CONFIG`STORMS`FIELD`INVOKE`LABEL: |-
        Invoke
      DATA`CONFIG`STORMS`FIELD`INVOKE`DESCRIPTION: |-
        What its aspect is invoked for.
      DATA`CONFIG`STORMS`FIELD`COMPEL`TYPE: |-
        text
      DATA`CONFIG`STORMS`FIELD`COMPEL`MAX: |-
        300
      DATA`CONFIG`STORMS`FIELD`COMPEL`LABEL: |-
        Compel
      DATA`CONFIG`STORMS`FIELD`COMPEL`DESCRIPTION: |-
        What its aspect is compelled for.
      DATA`CONFIG`STORMS`FIELD`CREATE`TYPE: |-
        text
      DATA`CONFIG`STORMS`FIELD`CREATE`MAX: |-
        300
      DATA`CONFIG`STORMS`FIELD`CREATE`LABEL: |-
        Create
      DATA`CONFIG`STORMS`FIELD`CREATE`DESCRIPTION: |-
        How its barriers and other advantages work, in words.
      DATA`CONFIG`STORMS`FIELD`ATTACK`TYPE: |-
        text
      DATA`CONFIG`STORMS`FIELD`ATTACK`MAX: |-
        300
      DATA`CONFIG`STORMS`FIELD`ATTACK`LABEL: |-
        Attack
      DATA`CONFIG`STORMS`FIELD`ATTACK`DESCRIPTION: |-
        How it attacks, in words; shown after an attack.
      DATA`CONFIG`STORMS`FIELD`DEFEND`TYPE: |-
        text
      DATA`CONFIG`STORMS`FIELD`DEFEND`MAX: |-
        300
      DATA`CONFIG`STORMS`FIELD`DEFEND`LABEL: |-
        Defend
      DATA`CONFIG`STORMS`FIELD`DEFEND`DESCRIPTION: |-
        How it defends, in words; shown after a defence.
      DATA`CONFIG`STORMS`FIELD`OVERCOME`TYPE: |-
        text
      DATA`CONFIG`STORMS`FIELD`OVERCOME`MAX: |-
        300
      DATA`CONFIG`STORMS`FIELD`OVERCOME`LABEL: |-
        Overcome
      DATA`CONFIG`STORMS`FIELD`OVERCOME`DESCRIPTION: |-
        How it overcomes a physical barrier, in words; shown after +storm/overcome barrier.
      DATA`CONFIG`STORMS`FIELD`FADE`TYPE: |-
        text
      DATA`CONFIG`STORMS`FIELD`FADE`MAX: |-
        300
      DATA`CONFIG`STORMS`FIELD`FADE`LABEL: |-
        Barrier lasts
      DATA`CONFIG`STORMS`FIELD`FADE`DESCRIPTION: |-
        How long its barrier lasts; shown after +storm/barrier.
      DATA`CONFIG`STORMS`FIELD`BARRIERMOD`TYPE: |-
        text
      DATA`CONFIG`STORMS`FIELD`BARRIERMOD`PATTERN: |-
        ^(-?[0-9])?$
      DATA`CONFIG`STORMS`FIELD`BARRIERMOD`LABEL: |-
        Barrier bonus
      DATA`CONFIG`STORMS`FIELD`BARRIERMOD`DESCRIPTION: |-
        Added to a roll to raise a barrier: 1 for Earthquake and Glacier.
      DATA`CONFIG`STORMS`FIELD`DEFENDMOD`TYPE: |-
        text
      DATA`CONFIG`STORMS`FIELD`DEFENDMOD`PATTERN: |-
        ^(-?[0-9])?$
      DATA`CONFIG`STORMS`FIELD`DEFENDMOD`LABEL: |-
        Defence bonus
      DATA`CONFIG`STORMS`FIELD`DEFENDMOD`DESCRIPTION: |-
        Added to a defence: -1 for Earthquake.
      DATA`CONFIG`STORMS`FIELD`OVERCOMEMOD`TYPE: |-
        text
      DATA`CONFIG`STORMS`FIELD`OVERCOMEMOD`PATTERN: |-
        ^(-?[0-9])?$
      DATA`CONFIG`STORMS`FIELD`OVERCOMEMOD`LABEL: |-
        Barrier overcome bonus
      DATA`CONFIG`STORMS`FIELD`OVERCOMEMOD`DESCRIPTION: |-
        Added to overcoming a physical barrier: 1 for Flood.
      DATA`CONFIG`STORMS`FIELD`ZONE`TYPE: |-
        text
      DATA`CONFIG`STORMS`FIELD`ZONE`PATTERN: |-
        ^(-?[0-9])?$
      DATA`CONFIG`STORMS`FIELD`ZONE`LABEL: |-
        Whole zone
      DATA`CONFIG`STORMS`FIELD`ZONE`DESCRIPTION: |-
        Added to an attack on everyone in a zone; empty when the storm cannot.
      DATA`CONFIG`STORMS`FIELD`SPREAD`TYPE: |-
        text
      DATA`CONFIG`STORMS`FIELD`SPREAD`PATTERN: |-
        ^(-?[0-9])?$
      DATA`CONFIG`STORMS`FIELD`SPREAD`LABEL: |-
        Each zone more
      DATA`CONFIG`STORMS`FIELD`SPREAD`DESCRIPTION: |-
        Added for each zone past the first that an attack on a zone reaches; empty when it cannot.
      DATA`CONFIG`STORMS`FIELD`CHAIN`TYPE: |-
        text
      DATA`CONFIG`STORMS`FIELD`CHAIN`PATTERN: |-
        ^(-?[0-9])?$
      DATA`CONFIG`STORMS`FIELD`CHAIN`LABEL: |-
        Each target more
      DATA`CONFIG`STORMS`FIELD`CHAIN`DESCRIPTION: |-
        Added for each target past the first a chained attack hits; empty when it cannot.
      DATA`CONFIG`STORMS`FIELD`SURROUND`TYPE: |-
        text
      DATA`CONFIG`STORMS`FIELD`SURROUND`PATTERN: |-
        ^(-?[0-9])?$
      DATA`CONFIG`STORMS`FIELD`SURROUND`LABEL: |-
        Surround
      DATA`CONFIG`STORMS`FIELD`SURROUND`DESCRIPTION: |-
        Added to raise a barrier around a whole zone; empty when the storm cannot.
      DATA`CONFIG`STORMS`FIELD`SEAL`TYPE: |-
        text
      DATA`CONFIG`STORMS`FIELD`SEAL`PATTERN: |-
        ^(-?[0-9])?$
      DATA`CONFIG`STORMS`FIELD`SEAL`LABEL: |-
        Seal the top
      DATA`CONFIG`STORMS`FIELD`SEAL`DESCRIPTION: |-
        Added again to close a surrounding barrier over the top; empty when the storm cannot.
      DATA`CONFIG`STORMS`FIELD`LENGTHS`TYPE: |-
        boolean
      DATA`CONFIG`STORMS`FIELD`LENGTHS`DEFAULT: |-
        0
      DATA`CONFIG`STORMS`FIELD`LENGTHS`LABEL: |-
        Long barriers
      DATA`CONFIG`STORMS`FIELD`LENGTHS`DESCRIPTION: |-
        Whether its barrier runs several lengths, each past the first taking 1 off its rating.
      DATA`CONFIG`STORMS`FIELD`FREEZE`TYPE: |-
        boolean
      DATA`CONFIG`STORMS`FIELD`FREEZE`DEFAULT: |-
        0
      DATA`CONFIG`STORMS`FIELD`FREEZE`LABEL: |-
        Freezes
      DATA`CONFIG`STORMS`FIELD`FREEZE`DESCRIPTION: |-
        Whether an attack may freeze its target in place for half the damage.
      DATA`CONFIG`STORMS`FIELD`ORDER`TYPE: |-
        integer
      DATA`CONFIG`STORMS`FIELD`ORDER`DEFAULT: |-
        50
      DATA`CONFIG`STORMS`FIELD`ORDER`MIN: |-
        0
      DATA`CONFIG`STORMS`FIELD`ORDER`MAX: |-
        999
      DATA`CONFIG`STORMS`FIELD`ORDER`LABEL: |-
        Order
      DATA`CONFIG`STORMS`FIELD`ORDER`DESCRIPTION: |-
        Where it comes in the list: lower first, then by key.
      # Which INC` routine each switch runs: DATA`ROUTE`<table>`<switch>. BARE is the command alone, ARG the
      # command with something after it and no switch.
      DATA`ROUTE: |-
        Which routine each switch runs. One leaf per switch.
      DATA`ROUTE`CONDITION`BARE: |-
        COND`SHOW
      DATA`ROUTE`CONDITION`ARG: |-
        COND`SHOW
      DATA`ROUTE`CONDITION`LIST: |-
        COND`LIST
      DATA`ROUTE`CONDITION`TAKE: |-
        COND`TAKE
      DATA`ROUTE`CONDITION`RECOVER: |-
        COND`RECOVER
      DATA`ROUTE`CONDITION`TREAT: |-
        COND`TREAT
      DATA`ROUTE`CONDITION`GIVE: |-
        COND`GIVE
      DATA`ROUTE`CONDITION`CLEAR: |-
        COND`CLEAR
      DATA`ROUTE`WEALTH`BARE: |-
        WEALTH`SHOW
      DATA`ROUTE`WEALTH`ARG: |-
        WEALTH`SHOW
      DATA`ROUTE`WEALTH`LOG: |-
        WEALTH`LOG
      DATA`ROUTE`WEALTH`SPEND: |-
        WEALTH`SPEND
      DATA`ROUTE`WEALTH`ROLL: |-
        WEALTH`ROLL
      DATA`ROUTE`WEALTH`GAIN: |-
        WEALTH`GAIN
      DATA`ROUTE`WEALTH`VOID: |-
        WEALTH`VOID
      DATA`ROUTE`WEALTH`ASPECT: |-
        WEALTH`ASPECT
      DATA`ROUTE`STORM`BARE: |-
        STORM`MINE
      DATA`ROUTE`STORM`ARG: |-
        STORM`SHOW
      DATA`ROUTE`STORM`LIST: |-
        STORM`LIST
      DATA`ROUTE`STORM`ATTUNE: |-
        STORM`ATTUNE
      DATA`ROUTE`STORM`UNATTUNE: |-
        STORM`UNATTUNE
      DATA`ROUTE`STORM`ATTACK: |-
        STORM`ROLL
      DATA`ROUTE`STORM`DEFEND: |-
        STORM`ROLL
      DATA`ROUTE`STORM`BARRIER: |-
        STORM`ROLL
      DATA`ROUTE`STORM`OVERCOME: |-
        STORM`ROLL
      DATA`ROUTE`STORM`ADVANTAGE: |-
        STORM`ROLL

      # ---- commands ---------------------------------------------------------------
      # %1 the switches and %2 what follows, exactly as typed.
      CMD`CONDITION:
        value: |-
          $(?is)^\+condition(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,condition,table,CONDITION,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`WEALTH:
        value: |-
          $(?is)^\+wealth(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,wealth,table,WEALTH,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      # A storm roll may go straight on to its opposition: +storm/attack=fair.
      CMD`STORM:
        value: |-
          $(?is)^\+storm(/[^\s=]*)?(?\:\s+(.*)|(=.*))?$:@include/args %!/INC`COMMAND`RUN=word,storm,table,STORM,switches,%1,argument,%2%3
        flags: [regexp, cmdsyntax]
      # A line a bridge adds to one of this object's messages: HINT`<message>, set by a bridge such as
      # fate-system-toolkit-help. Nothing when no bridge set one.
      FUN`HINT:
        value: |-
          if(hasattr(%!,HINT`%0),%b[u(%!/HINT`%0,%1,%2)])
        flags: [funsyntax]
      INC`COMMAND`RUN:
        value: |-
          @assert hastype(%#,player)=@pemit %#=notice(ucstr(%<word>),Only players use +%<word>.,warn); think u(%!/FUN`COMMAND`PARSE,%<word>,%<table>,%<switches>,%<argument>); @assert lte(words(%q<cmd_switch_list>),1)=@pemit %#=notice(%q<cmd_tag>,Use one switch at a time.,warn); @assert strlen(%q<cmd_route>)=@pemit %#=notice(%q<cmd_tag>,+%q<cmd_word> has no /%q<cmd_switch> switch.[u(%!/FUN`HINT,SWITCHES,%q<cmd_word>)],warn); @include %!/INC`%q<cmd_route>
        flags: [cmdsyntax]
      # %0 the word, %1 its route table, %2 the switches and %3 the argument, as typed. Sets cmd_word, cmd_tag,
      # cmd_switch_list, cmd_switch, cmd_argument, cmd_has_equals, cmd_left_side and cmd_right_side around the
      # first =, cmd_route (the INC` routine to run), viewer_objid and viewer_keeper.
      FUN`COMMAND`PARSE:
        value: |-
          setqm(cmd_word,lcstr(%0),
          cmd_tag,ucstr(%0),
          cmd_switch_list,lcstr(trim(edit(%2,/,%b))),
          cmd_switch,first(%q<cmd_switch_list>),
          cmd_argument,trim(%3),
          cmd_has_equals,strmatch(%3,*=*),
          cmd_left_side,trim(before(%3,=)),
          cmd_right_side,trim(after(%3,=)),
          cmd_route,get(%!/DATA`ROUTE`%1`[if(strlen(%q<cmd_switch>),ucstr(%q<cmd_switch>),if(strlen(%q<cmd_argument>),ARG,BARE))]),
          viewer_objid,objid(%#),
          viewer_keeper,u({{sheet-fate/sheet}}/FUN`PERM`KEEPER,%#))
        flags: [funsyntax]

      # ---- guards -----------------------------------------------------------------
      # The left of =: <name>/<what> for a sheet keeper, else <what> on your own sheet. sheet_who and sheet_what.
      INC`NEED`WHO:
        value: |-
          think if(strmatch(%q<cmd_left_side>,*/*),setqm(sheet_who,u({{sheet-fate/sheet}}/FUN`PLAYER`MATCH,setr(sheet_name,trim(before(%q<cmd_left_side>,/)))),sheet_what,trim(after(%q<cmd_left_side>,/))),setqm(sheet_name,,sheet_who,%q<viewer_objid>,sheet_what,%q<cmd_left_side>)); @assert strlen(%q<sheet_who>)=@pemit %#=notice(%q<cmd_tag>,There is no player called '%q<sheet_name>'.,warn); @assert cor(%q<viewer_keeper>,not(comp(%q<sheet_who>,%q<viewer_objid>)))=@pemit %#=notice(%q<cmd_tag>,Only sheet keepers change another character's sheet.,error)
        flags: [cmdsyntax]
      # %<name> a player's name, or nothing for yourself: sheet_who.
      INC`NEED`TARGET:
        value: |-
          think setq(sheet_who,if(strlen(%<name>),u({{sheet-fate/sheet}}/FUN`PLAYER`MATCH,%<name>),%q<viewer_objid>)); @assert strlen(%q<sheet_who>)=@pemit %#=notice(%q<cmd_tag>,There is no player called '%<name>'.,warn)
        flags: [cmdsyntax]
      # Choices a player makes before approval, as the Fate sheet's own ratings and aspects are.
      INC`NEED`EDITABLE:
        value: |-
          @assert cor(%q<viewer_keeper>,not(isapproved(%#)))=@pemit %#=notice(%q<cmd_tag>,Your character is approved%, so staff change your sheet now.[if(strmatch(%q<cmd_tag>,WEALTH),%b+sheet/advance wealth <slot>=<aspect> spends a milestone on one more aspect about wealth.)],error); @assert cor(%q<viewer_keeper>,not(strlen(setr(edit_gate,u({{sheet-fate/sheet}}/FUN`GATE`EDIT,%#)))))=@pemit %#=notice(%q<cmd_tag>,%q<edit_gate>,warn)
        flags: [cmdsyntax]
      INC`NEED`KEEPER:
        value: |-
          @assert %q<viewer_keeper>=@pemit %#=notice(%q<cmd_tag>,Only sheet keepers do that.,error)
        flags: [cmdsyntax]
      INC`NEED`VIEW:
        value: |-
