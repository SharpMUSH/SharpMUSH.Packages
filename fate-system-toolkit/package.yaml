        flags: [funsyntax]
      FUN`SCREEN`AUGS:
        value: |-
          setq(sa_held,u(%!/FUN`AUG`HELD,%0))[box(if(words(%q<sa_held>),ldatatable(lit({"nowrap":"2","grow":"||1"}),Aug|Kind|What it does,iter(%q<sa_held>,[u(%!/FUN`AUG`LABEL,%0,%i0)]|[u(%!/FUN`AUG`SIZE,%i0)]|[firstof(get({{store}}/AUG`%i0`TEXT),-)],%b,%*<^>),%*<^>),tone(muted,No cyberware.))%r[rule()]%r[tone(muted,Cyberware costs [u(%!/FUN`AUG`COST,%0,0,0,0)] refresh: 1 for the heart%, 1 each major aug and 1 for every [get(%!/DATA`CONFIG`AUG_PER_REFRESH)] minor ones. +aug/list shows what there is. Every aug has a downside%, and the GM compels the aspect tied to being a cyborg for it.)],Cyberware: [name(%0)])]
        flags: [funsyntax]
      FUN`SCREEN`AUGLIST:
        value: |-
          setq(sa_all,u(%!/FUN`LIST`ALL,AUG))[box(ldatatable(lit({"nowrap":"1|2","grow":"|||1"}),Aug|Kind|What it does|Choices,iter(%q<sa_all>,[get({{store}}/AUG`%i0)]|[u(%!/FUN`AUG`SIZE,%i0)]|[firstof(get({{store}}/AUG`%i0`TEXT),-)]|[if(words(get({{store}}/AUG`%i0`OPTIONS),|),[if(default({{store}}/AUG`%i0`INCLUDED,0),[get({{store}}/AUG`%i0`INCLUDED)] of:%b)][itemize(get({{store}}/AUG`%i0`OPTIONS),|,or)],-)],%b,%*<^>),%*<^>)%r[rule()]%r[tone(muted,A cyber-heart comes first and costs 1 refresh. A major aug costs 1%, and every [get(%!/DATA`CONFIG`AUG_PER_REFRESH)] minor augs cost 1 between them. +aug/install <aug>%[=<choice>%] before approval%, +aug/surgery after.)],Cyberware)]
        flags: [funsyntax]
      FUN`SCREEN`STORMS:
        value: |-
          setq(ss_all,u(%!/FUN`LIST`ALL,STORM))[box(ldatatable(lit({"nowrap":"1|2","grow":"||1"}),Storm|Aspect|Passive,iter(%q<ss_all>,[get({{store}}/STORM`%i0)]|[firstof(get({{store}}/STORM`%i0`ASPECT),-)]|[firstof(get({{store}}/STORM`%i0`PASSIVE),-)],%b,%*<^>),%*<^>)%r[rule()]%r[tone(muted,+storm <storm> shows one. +storm/attune <storm> attunes you for [get(%!/DATA`CONFIG`STORM_COST)] refresh before approval.)],Storms)]
        flags: [funsyntax]

      # ---- lifecycle ----------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP:
        value: |-
          @command/add/noparse/rsnoparse +condition; @hook/override/inline +condition=%!,CMD`CONDITION; @command/add/noparse/rsnoparse +wealth; @hook/override/inline +wealth=%!,CMD`WEALTH; @command/add/noparse/rsnoparse +storm; @hook/override/inline +storm=%!,CMD`STORM; @command/add/noparse/rsnoparse +super; @hook/override/inline +super=%!,CMD`SUPER; @command/add/noparse/rsnoparse +gadget; @hook/override/inline +gadget=%!,CMD`GADGET; @command/add/noparse/rsnoparse +aug; @hook/override/inline +aug=%!,CMD`AUG
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

