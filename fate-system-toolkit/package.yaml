          setq(sc_all,u(%!/FUN`LIST`ALL,COND))[box(ldatatable(lit({"nowrap":"1|2|3","grow":"|||1"}),Condition|Kind|Soaks|Clears when,iter(%q<sc_all>,[get({{store}}/COND`%i0)]|[u(%!/FUN`COND`KIND,%i0)]|[u(%!/FUN`COND`SOAK,%i0)]|[firstof(get({{store}}/COND`%i0`CLEARS),-)],%b,%*<^>),%*<^>)%r[rule()]%r[tone(muted,A condition soaks stress when you take it%, and it is an aspect until you recover. A lasting one has two boxes and needs treatment against [u({{sheet-fate/sheet}}/FUN`LADDER`SHOW,get(%!/DATA`CONFIG`TREAT))] before it heals.)],Conditions)]
        flags: [funsyntax]
      FUN`SCREEN`WEALTH:
        value: |-
          setq(sw_held,u(%!/FUN`WEALTH`HELD,%0))[box(lfields(,Boxes%*<|>Aspects about wealth%*<|>Last entries,[u(%!/FUN`WEALTH`TRACK,%0)]%*<|>[firstof(itemize(iter(%q<sw_held>,get(%0/FATE`ASPECT`%i0),%b,|),|),none)]%*<|>[firstof(iter(revwords(extract(revwords(u(%!/FUN`WEALTH`ENTRIES,%0)),1,3)),%i0. [u(%!/FUN`WEALTH`WHAT,%0,%i0)],%b,;%b),none)],%*<|>)%r[rule()]%r[tone(muted,+wealth/spend <box> checks a box for its value on a roll%, and +wealth/roll <box>=<skill> rolls with it. Only a parcel of Wealth from staff clears a box. +wealth/log shows every entry.)],Wealth: [name(%0)])]
        flags: [funsyntax]
      FUN`SCREEN`WEALTHLOG:
        value: |-
          setq(sl_all,u(%!/FUN`WEALTH`ENTRIES,%0))[box(if(words(%q<sl_all>),ldatatable(,#|Entry|By|Why,iter(%q<sl_all>,%i0|[u(%!/FUN`WEALTH`WHAT,%0,%i0)]|[name(get(%0/FATE`WEALTH`LEDGER`%i0`BY))]%, [timefmt($Y-$m-$d,get(%0/FATE`WEALTH`LEDGER`%i0`AT))]|[firstof(get(%0/FATE`WEALTH`LEDGER`%i0`WHY),-)][if(hasattr(%0,FATE`WEALTH`LEDGER`%i0`VOID),%b%(void by [name(first(get(%0/FATE`WEALTH`LEDGER`%i0`VOID)))]: [rest(rest(get(%0/FATE`WEALTH`LEDGER`%i0`VOID)))]%))],%b,%*<^>),%*<^>),tone(muted,No entries yet.))%r[rule()]%r[tone(muted,Boxes: [u(%!/FUN`WEALTH`TRACK,%0)]. Staff give parcels with +wealth/gain and void an entry with +wealth/void. Nothing is taken off this log.)],Wealth ledger: [name(%0)])]
        flags: [funsyntax]
      FUN`SCREEN`STORM:
        value: |-
          setq(ss_at,{{store}}/STORM`%0)[box(lfields(,Aspect%*<|>Passive%*<|>Invoke%*<|>Compel%*<|>Create%*<|>Attack%*<|>Defend%*<|>Overcome,[firstof(get(%q<ss_at>`ASPECT),-)]%*<|>[firstof(get(%q<ss_at>`PASSIVE),-)]%*<|>[firstof(get(%q<ss_at>`INVOKE),-)]%*<|>[firstof(get(%q<ss_at>`COMPEL),-)]%*<|>[firstof(get(%q<ss_at>`CREATE),-)] [get(%q<ss_at>`FADE)]%*<|>[firstof(get(%q<ss_at>`ATTACK),-)]%*<|>[firstof(get(%q<ss_at>`DEFEND),No special rules.)]%*<|>[firstof(get(%q<ss_at>`OVERCOME),No special rules.)],%*<|>)%r[rule()]%r[tone(muted,+storm/attack%, /defend%, /barrier%, /overcome and /advantage roll it: +storm/attack far 1=fair. Attuning costs [get(%!/DATA`CONFIG`STORM_COST)] refresh.)],The [get(%q<ss_at>)])]
        flags: [funsyntax]
      FUN`SCREEN`STORMS:
        value: |-
          setq(ss_all,u(%!/FUN`LIST`ALL,STORM))[box(ldatatable(lit({"nowrap":"1|2","grow":"||1"}),Storm|Aspect|Passive,iter(%q<ss_all>,[get({{store}}/STORM`%i0)]|[firstof(get({{store}}/STORM`%i0`ASPECT),-)]|[firstof(get({{store}}/STORM`%i0`PASSIVE),-)],%b,%*<^>),%*<^>)%r[rule()]%r[tone(muted,+storm <storm> shows one. +storm/attune <storm> attunes you for [get(%!/DATA`CONFIG`STORM_COST)] refresh before approval.)],Storms)]
        flags: [funsyntax]

      # ---- lifecycle ----------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP:
        value: |-
          @command/add/noparse/rsnoparse +condition; @hook/override/inline +condition=%!,CMD`CONDITION; @command/add/noparse/rsnoparse +wealth; @hook/override/inline +wealth=%!,CMD`WEALTH; @command/add/noparse/rsnoparse +storm; @hook/override/inline +storm=%!,CMD`STORM
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

