# Three-action Heal heals the living and harms a dhampir with one roll: the damage is the healing roll, not a
# second roll.
install: [pf2e]
feed: [ancestries/Human, heritages/Dhampir, heritages/Skilled Human, classes/Cleric, class-features/Cloistered Cleric, classes/Fighter, spells/Heal, feats/Domain Initiate]
players:
  cleric: { room: chapel }
  dhamp: { room: chapel }
  livia: { room: chapel }
steps:
  - god: "@tel me=${cleric}"
  - god: +deity/samples
  - as: cleric
    run: +build/ancestry Human
  - as: cleric
    run: +build/heritage Skilled Human
  - as: cleric
    run: +build/class Cleric
  - as: cleric
    run: +build/choose Deity=Solenne
  - as: cleric
    run: +build/choose Divine Font=Heal
  - as: cleric
    run: +build/choose Doctrine=Cloistered Cleric
  - as: dhamp
    run: +build/ancestry Human
  - as: dhamp
    run: +build/heritage Dhampir
  - as: dhamp
    run: +build/class Fighter
  - as: livia
    run: +build/ancestry Human
  - as: livia
    run: +build/heritage Skilled Human
  - as: livia
    run: +build/class Fighter
  - god: +enc/start
  - god: +enc/add ${cleric.name}
  - god: +enc/init
  - god: +enc/next
  - god: +enc/add ${dhamp.name}
  - god: +enc/add ${livia.name}
  - god: +enc/damage ${livia.name}=5 slashing
  - as: cleric
    run: +cast Heal with 3 actions=${livia.name},${dhamp.name}
    sees: ["Healing 1d8[", "${livia.name} regains", "${dhamp.name}: 1d20["]
    not_sees: "Damage 1d8["
    because: the healing roll is the damage too, so the damage is not rolled apart
