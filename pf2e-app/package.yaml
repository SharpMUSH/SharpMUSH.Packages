format: "1.20"
package: pf2e-app
title: "Pathfinder 2e sheets in the portal"
version: 1.0.0
kind: application
authors: [SharpMUSH]
description: "Registers the Pathfinder 2e sheet as a portal page at /apps/pf2e: your character's sheet as +sheet shows it, and for staff anyone's at /apps/pf2e/<name>."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [pf2e, pathfinder, portal, application, sheet]
category: Game System
subcategory: Pathfinder 2e
requires_server: ">=1.0"

# An application package owns no objects. pf2e-portal serves the routes it points at: GET /http/pf2e/schema and
# /http/pf2e/data. {path} is what follows /apps/pf2e/: nothing for the viewer's own sheet, or a character's name.
depends:
  - package: pf2e-portal
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH.Packages
      path: pf2e-portal/
      branch: main

application:
  slug: pf2e
  display_name: Pathfinder Sheet
  icon: shield
  type: page
  schema_url: http/pf2e/schema?at={path}
  data_url: http/pf2e/data?at={path}
  minimum_role: player
  nav_placement: Play
  order: 60
