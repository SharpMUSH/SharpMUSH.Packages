# The Forged in the Dark sheet: a new character shares out action dots, rolls actions in a position, and keeps
# stress, harm, trauma and coin; only its player and staff read it; +config and +help reach it through the
# bridges; and the chargen bridge locks the sheet while the application is with staff.
install: [chargen, sheet-fitd, sheet-fitd-help, sheet-fitd-config, sheet-fitd-chargen]
players:
  keeper: { room: hall, roles: [fitd-sheet-keeper] }
  ann: { room: hall }
  bo: { room: hall }
steps:
  - as: ann
    run: +sheet
    sees: "Next: +sheet/set <action>=<rating>. 7 of 7 dots left to give."
  - as: ann
    run: +sheet/set hunt=2
    sees: "Hunt is 2 on ${ann.name}'s sheet. Next: +sheet/set <action>=<rating>. 5 of 7 dots left to give."
  - as: ann
    run: +sheet/set study=3
    sees: An action's rating is a whole number from 0 to 2.
  - as: ann
    run: +sheet/set study=1
  - as: ann
    run: +sheet/set skirmish=2
  - as: ann
    run: +sheet/set sway=2
    sees: Your sheet is complete. +app/submit sends your application to staff.
  - as: ann
    run: +sheet/chargen
    sees: "1. Action dots done: 7 of 7 given: Hunt 2, Study 1, Skirmish 2, and Sway"

  # Skirmish 2 rolls two dice and keeps the highest.
  - as: ann
    run: +check skirmish=risky
    sees: "${ann.name} rolls Skirmish (risky): 2d6kh1["
  - heard: bo
    containing: ${ann.name} rolls Skirmish
    count: 1
    because: the room sees a roll

  - as: ann
    run: +sheet/stress +3
    sees: ${ann.name} has 3 of 9 stress.
  - as: ann
    run: +sheet/harm 1=Bruised
    sees: "${ann.name} takes level 1 harm: Bruised."
  - as: ann
    run: +sheet/harm 1=
    sees: ${ann.name}'s level 1 harm is cleared.
  - as: ann
    run: +sheet/coin -1 bribe
    sees: ${ann.name} has 0 coin.
  - as: ann
    run: +sheet/trauma cold
    sees: ${ann.name} takes the cold trauma. 1 of 4.
  - as: ann
    run: +sheet
    sees: ["Stress: [###......] 3/9", "Trauma: cold"]
  - as: ann
    run: +sheet/ledger
    sees: [Hunt 2, Sway 2]
  - as: bo
    run: +sheet ${ann.name}
    sees: Only ${ann.name} and staff can read their sheet.

  - as: keeper
    run: +config fitd
    sees: "Settings: Forged in the Dark sheet"
  - as: ann
    run: +help sheet
    sees: "+sheet shows your character's sheet: stress, coin, trauma, XP, harm, and"

  # sheet-fitd-chargen: a reviewer reads the sheet of anyone with an application, and the sheet waits while the
  # application is with staff.
  - as: ann
    run: +app/set concept=A courier with a past
  - as: ann
    run: +app/set archetype=rogue
  - as: ann
    run: +app/set background=Grew up on the docks.
  - as: ann
    run: +app/set personality=Wry, and wants to be left alone.
  - as: ann
    run: +app/set hooks=Owes a favour to the harbourmaster.
  - god: "@permission/allow ${bo}=softcode.chargen.review"
  - as: bo
    run: +sheet ${ann.name}
    sees: "Trauma: cold"
  - as: ann
    run: +app/submit
    sees: Submitted.
  - as: ann
    run: +sheet/set hunt=1
    sees: Your application is with staff. +app/withdraw takes it back to change your sheet.
  - as: ann
    run: +app/withdraw
  - as: ann
    run: +sheet/set hunt=1
    sees: "Hunt is 1 on ${ann.name}"
