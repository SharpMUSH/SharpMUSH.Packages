# The PbtA sheet: a new character picks a playbook and its stats, rolls moves with forward and ongoing, and
# marks harm; only its player and staff read it; staff give XP; +config and +help reach it through the bridges;
# and the chargen bridge locks the sheet while the application is with staff.
install: [chargen, sheet-pbta, sheet-pbta-help, sheet-pbta-config, sheet-pbta-chargen]
players:
  keeper: { room: hall, roles: [pbta-sheet-keeper] }
  ann: { room: hall }
  bo: { room: hall }
steps:
  - as: ann
    run: +sheet
    sees: "Next: +sheet/playbook lists the playbooks."
  - as: ann
    run: +sheet/playbook
    sees: PbtA playbooks
  - as: ann
    run: +sheet/playbook warden
    sees: "${ann.name} is a Warden, with its suggested stats. Next: +sheet/take <move>, one of Stand Fast or Watchful Eye."
  - as: ann
    run: +sheet/chargen
    sees: ["1. Playbook done: Warden", "2. Stats done: Str +1, Dex +0, Con +2, Int -1, Wis +1, and Cha +0."]
  - as: ann
    run: +sheet/set str=3
    sees: "Str takes one of the starting numbers left: +1."
  - as: ann
    run: +sheet/forward 1
    sees: ${ann.name} has +1 forward.
  - as: ann
    run: +sheet/ongoing 1
    sees: ${ann.name} has +1 ongoing.
  - as: ann
    run: +sheet/harm 2
    sees: ${ann.name} has 2/6 harm.
  - as: ann
    run: +sheet/heal all
    sees: ${ann.name} has 0/6 harm.

  # Defend rolls with Con +2, and forward and ongoing add 1 each.
  - as: ann
    run: +check defend
    sees: ["${ann.name} rolls Defend (+Con): 2d6[", "] + 4 = ", "(with +1 forward)"]
  - heard: bo
    containing: ${ann.name} rolls Defend
    count: 1
    because: the room sees a roll
  - as: ann
    run: +check defy-danger
    sees: "Defy Danger rolls with Str, Dex, Con, Int, Wis, or Cha: say which, such as +check defy-danger/str."
  - as: ann
    run: +sheet
    sees: ["Playbook: Warden", "Forward: +0", "Ongoing: +1"]
    because: forward is spent on the next roll; ongoing stays
  - as: ann
    run: +sheet/ledger
    sees: Warden

  - as: keeper
    run: +sheet/xp ${ann.name}=+5 for the test
    sees: ${ann.name} has 5 XP.
  - as: bo
    run: +sheet ${ann.name}
    sees: Only ${ann.name} and staff can read their sheet.

  - as: keeper
    run: +config pbta
    sees: "Settings: PbtA sheet"
  - as: ann
    run: +help sheet
    sees: "+sheet shows your character's sheet: playbook, XP, forward and ongoing, stats,"

  # sheet-pbta-chargen: a reviewer reads the sheet of anyone with an application, and the sheet waits while the
  # application is with staff.
  - as: ann
    run: +app/set concept=A courier with a past
  - as: ann
    run: +app/set archetype=rogue
  - as: ann
    run: +app/set background=Grew up on the docks.
  - as: ann
    run: +app/set personality=Wry, and wants to be left alone.
  - as: ann
    run: +app/set hooks=Owes a favour to the harbourmaster.
  - god: "@permission/allow ${bo}=softcode.chargen.review"
  - as: bo
    run: +sheet ${ann.name}
    sees: "Playbook: Warden"
  - as: ann
    run: +app/submit
    sees: Submitted.
  - as: ann
    run: +sheet/playbook wayfarer
    sees: Your application is with staff. +app/withdraw takes it back to change your sheet.
  - as: ann
    run: +app/withdraw
  - as: ann
    run: +sheet/playbook wayfarer
    sees: "is a Wayfarer"
