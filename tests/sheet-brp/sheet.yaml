# The percentile sheet: a new character shares out characteristic and skill points, rolls skills against
# their percentage, and keeps hit and power points; only its player and staff read it; +config and +help reach it
# through the bridges; and the chargen bridge locks the sheet while the application is with staff.
install: [chargen, sheet-brp, sheet-brp-help, sheet-brp-config, sheet-brp-chargen]
players:
  keeper: { room: hall, roles: [brp-sheet-keeper] }
  ann: { room: hall }
  bo: { room: hall }
steps:
  - as: ann
    run: +sheet/set str=15
    sees: "Strength (STR) is 15 on ${ann.name}'s sheet. Next: +sheet/set <characteristic>=<value>. 60 of 75 points left to give."
  - as: ann
    run: +sheet/set con=12
  - as: ann
    run: +sheet/set siz=12
  - as: ann
    run: +sheet/set int=12
  - as: ann
    run: +sheet/set pow=12
  - as: ann
    run: +sheet/set dex=12
    sees: 0 of 75 points left to give.
  - as: ann
    run: +sheet/set cha=19
    sees: A characteristic is a whole number from 3 to 18.
  - as: ann
    run: +sheet/set climb=75
    sees: Climb is 75% on ${ann.name}'s sheet.
  - as: ann
    run: +sheet/set climb=90
    sees: A skill is a whole number up to 75%.

  - as: ann
    run: +check climb
    sees: "${ann.name} rolls Climb (75%): 1d100["
  - heard: bo
    containing: ${ann.name} rolls Climb
    count: 1
    because: the room sees a roll
  - as: ann
    run: +check/private climb=difficult
    sees: "You privately roll Climb (75%, difficult, halved: 38%): 1d100["
  - as: ann
    run: +sheet/hp -2
    sees: ${ann.name} has 10 of 12 hit points.
  - as: ann
    run: +sheet/hp full
    sees: ${ann.name} has 12 of 12 hit points.
  - as: ann
    run: +sheet/pp -1
    sees: ${ann.name} has 11 of 12 power points.
  - as: ann
    run: +sheet
    sees: ["STR: 15", "SIZ: 12", "POW: 12"]
  - as: ann
    run: +sheet/ledger
    sees: Climb
  - as: bo
    run: +sheet ${ann.name}
    sees: Only ${ann.name} and staff can read their sheet.

  - as: keeper
    run: +config brp
    sees: "Settings: Percentile sheet"
  - as: ann
    run: +help sheet
    sees: "+sheet shows your character's sheet: seven characteristics, hit points, power"

  # sheet-brp-chargen: a reviewer reads the sheet of anyone with an application, and the sheet waits while the
  # application is with staff.
  - as: ann
    run: +app/set concept=A courier with a past
  - as: ann
    run: +app/set archetype=rogue
  - as: ann
    run: +app/set background=Grew up on the docks.
  - as: ann
    run: +app/set personality=Wry, and wants to be left alone.
  - as: ann
    run: +app/set hooks=Owes a favour to the harbourmaster.
  - god: "@permission/allow ${bo}=softcode.chargen.review"
  - as: bo
    run: +sheet ${ann.name}
    sees: "STR: 15"
  - as: ann
    run: +app/submit
    sees: Submitted.
  - as: ann
    run: +sheet/set str=10
    sees: Your application is with staff. +app/withdraw takes it back to change your sheet.
  - as: ann
    run: +app/withdraw
  - as: ann
    run: +sheet/set str=10
    sees: "Strength (STR) is 10"
