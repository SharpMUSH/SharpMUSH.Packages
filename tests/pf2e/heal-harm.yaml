  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/class-features-4.txt|class-features|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=hmShTfPOcTaKgbf4 7986d8582c9dd47a ITEM {\"_id\":\"hmShTfPOcTaKgbf4\",\"name\":\"Reactive Strike\",\"system\":{\"actionType\":{\"value\":\"passive\"},\"actions\":{\"value\":null},\"category\":\"classfeature\",\"level\":{\"value\":1},\"prerequisites\":{\"value\":[]},\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"rules\":[{\"key\":\"GrantItem\",\"uuid\":\"Compendium.pf2e.actionspf2e.Item.Reactive Strike\"}],\"traits\":{\"rarity\":\"common\",\"value\":[\"fighter\"]}},\"type\":\"feat\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=hmShTfPOcTaKgbf4 7986d8582c9dd47a TEXT \"<p>Ever watchful for weaknesses, you can quickly attack foes that leave an opening in their defenses. You gain the @UUID[Compendium.pf2e.actionspf2e.Item.Reactive Strike] reaction.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/class-features-3.txt|class-features|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=eZNCckLzbH3GyncH 176e0ffc787e1c2b ITEM {\"_id\":\"eZNCckLzbH3GyncH\",\"name\":\"Shield Block\",\"system\":{\"actionType\":{\"value\":\"passive\"},\"actions\":{\"value\":null},\"category\":\"classfeature\",\"level\":{\"value\":1},\"prerequisites\":{\"value\":[]},\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"rules\":[{\"key\":\"GrantItem\",\"uuid\":\"Compendium.pf2e.feats-srd.Item.Shield Block\"}],\"traits\":{\"rarity\":\"common\",\"value\":[\"champion\",\"commander\",\"druid\",\"exemplar\",\"fighter\",\"guardian\",\"inventor\",\"runesmith\"]}},\"type\":\"feat\"}"
