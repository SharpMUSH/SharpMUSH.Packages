  - god: "&FEED`BODY ${object:pf2e/updater}=vxOf4LXZcqUG3P7a 1c69ace8db35230f TEXT \"<p>You gain expert proficiency with your deity's favored weapon, simple weapons, and unarmed attacks. When you critically succeed at an attack roll using your deity's favored weapon, you apply the weapon's critical specialization effect; you can use your spell DC in place of your class DC.</p>\""
