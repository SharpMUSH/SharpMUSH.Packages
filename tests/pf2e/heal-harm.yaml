  - god: "&FEED`BODY ${object:pf2e/updater}=vxOf4LXZcqUG3P7a 1c69ace8db35230f ITEM {\"_id\":\"vxOf4LXZcqUG3P7a\",\"name\":\"Fourth Doctrine (Cloistered Cleric)\",\"system\":{\"actionType\":{\"value\":\"passive\"},\"actions\":{\"value\":null},\"category\":\"classfeature\",\"level\":{\"value\":11},\"prerequisites\":{\"value\":[]},\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"rules\":[{\"key\":\"ActiveEffectLike\",\"mode\":\"upgrade\",\"path\":\"flags.system.favoredWeaponRank\",\"value\":2},{\"key\":\"CriticalSpecialization\",\"predicate\":[\"item:deity-favored\"]}],\"subfeatures\":{\"proficiencies\":{\"simple\":{\"rank\":2},\"unarmed\":{\"rank\":2}}},\"traits\":{\"rarity\":\"common\",\"value\":[\"cleric\"]}},\"type\":\"feat\"}"
