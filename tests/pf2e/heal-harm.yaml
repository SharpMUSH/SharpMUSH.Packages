  - god: "&FEED`BODY ${object:pf2e/updater}=8zn3cD6GSmoo1LW4 c2c4b8fb8d7d985c TEXT \"<p><em>Fighting for honor, greed, loyalty, or simply the thrill of battle, you are an undisputed master of weaponry and combat techniques. You combine your actions through clever combinations of opening moves, finishing strikes, and counterattacks whenever your foes are unwise enough to drop their guard. Whether you are a knight, mercenary, sharpshooter, or blade master, you have honed your martial skills into an art form and perform devastating critical attacks on your enemies.</em></p>\\n<p><em>@UUID[Compendium.pf2e.journals.JournalEntry.kzxu2dI7tFxv6Ix6.JournalEntryPage.HZbrRRVzW7w17L2W]{Fighter}</em></p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/spells-11.txt|spells|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=rfZpqmj0AIIdkVIs c529ddf4601e4cf0 ITEM {\"_id\":\"rfZpqmj0AIIdkVIs\",\"name\":\"Heal\",\"system\":{\"area\":null,\"cost\":{\"value\":\"\"},\"counteraction\":false,\"damage\":{\"0\":{\"applyMod\":false,\"category\":null,\"formula\":\"1d8\",\"kinds\":[\"damage\",\"healing\"],\"materials\":[],\"type\":\"vitality\"}},\"defense\":{\"save\":{\"basic\":true,\"statistic\":\"fortitude\"}},\"duration\":{\"sustained\":false,\"value\":\"\"},\"heightening\":{\"damage\":{\"0\":\"1d8\"},\"interval\":1,\"type\":\"interval\"},\"level\":{\"value\":1},\"overlays\":{\"37gy7l19tik74o4s\":{\"_id\":\"37gy7l19tik74o4s\",\"name\":\"Heal (vs. Living)\",\"overlayType\":\"override\",\"system\":{\"damage\":{\"0\":{\"formula\":\"1d8+8\",\"kinds\":[\"healing\"]}},\"defense\":null,\"heightening\":{\"damage\":{\"0\":\"1d8+8\"}},\"range\":{\"value\":\"30 feet\"},\"time\":{\"value\":\"2\"},\"traits\":{\"value\":[\"concentrate\",\"healing\",\"manipulate\",\"vitality\"]}}},\"7qdtetowq348s9oc\":{\"_id\":\"7qdtetowq348s9oc\",\"overlayType\":\"override\",\"system\":{\"range\":{\"value\":\"touch\"},\"time\":{\"value\":\"1\"}}},\"7vbvdrv2cl87sqta\":{\"_id\":\"7vbvdrv2cl87sqta\",\"overlayType\":\"override\",\"system\":{\"area\":{\"type\":\"emanation\",\"value\":30},\"range\":{\"value\":\"\"},\"target\":{\"value\":\"all living and undead creatures\"},\"time\":{\"value\":\"3\"},\"traits\":{\"value\":[\"concentrate\",\"healing\",\"manipulate\",\"vitality\"]}}},\"lfxcoz2d3f8j2zq1\":{\"_id\":\"lfxcoz2d3f8j2zq1\",\"name\":\"Heal (vs. Undead)\",\"overlayType\":\"override\",\"system\":{\"damage\":{\"0\":{\"kinds\":[\"damage\"]}},\"range\":{\"value\":\"30 feet\"},\"target\":{\"value\":\"1 undead\"},\"time\":{\"value\":\"2\"},\"traits\":{\"value\":[\"concentrate\",\"healing\",\"manipulate\",\"vitality\"]}}}},\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"range\":{\"value\":\"varies\"},\"requirements\":\"\",\"rules\":[],\"target\":{\"value\":\"1 willing living creature or 1 undead\"},\"time\":{\"value\":\"1 to 3\"},\"traits\":{\"rarity\":\"common\",\"traditions\":[\"divine\",\"primal\"],\"value\":[\"healing\",\"manipulate\",\"vitality\"]}},\"type\":\"spell\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=rfZpqmj0AIIdkVIs c529ddf4601e4cf0 TEXT \"<p>You channel vital energy to heal the living or damage the undead. If the target is a willing living creature, you restore 1d8 Hit Points. If the target is undead, you deal that amount of vitality damage to it, and it gets a basic Fortitude save. The number of actions you spend when Casting this Spell determines its targets, range, area, and other parameters.</p>\\n<p><span class=\\\"action-glyph\\\">1</span> The spell has a range of touch.</p>\\n<p><span class=\\\"action-glyph\\\">2</span> (concentrate) The spell has a range of 30 feet. If you're healing a living creature, increase the Hit Points restored by 8.</p>\\n<p><span class=\\\"action-glyph\\\">3</span> (concentrate) You disperse vital energy in a @Template[emanation|distance:30]. This targets all living and undead creatures in the burst.</p>\\n<hr />\\n<p><strong>Heightened (+1)</strong> The amount of healing or damage increases by 1d8, and the extra healing for the 2-action version increases by 8.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/spells-12.txt|spells|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=wdA52JJnsuQWeyqz 6a86d06b2f08a0bb ITEM {\"_id\":\"wdA52JJnsuQWeyqz\",\"name\":\"Harm\",\"system\":{\"area\":null,\"cost\":{\"value\":\"\"},\"counteraction\":false,\"damage\":{\"0\":{\"applyMod\":false,\"category\":null,\"formula\":\"1d8\",\"kinds\":[\"damage\",\"healing\"],\"materials\":[],\"type\":\"void\"}},\"defense\":{\"save\":{\"basic\":true,\"statistic\":\"fortitude\"}},\"duration\":{\"sustained\":false,\"value\":\"\"},\"heightening\":{\"damage\":{\"0\":\"1d8\"},\"interval\":1,\"type\":\"interval\"},\"level\":{\"value\":1},\"overlays\":{\"4gyp3qlsv5ywdyjq\":{\"_id\":\"4gyp3qlsv5ywdyjq\",\"name\":\"Harm (vs. Undead)\",\"overlayType\":\"override\",\"system\":{\"damage\":{\"0\":{\"formula\":\"1d8+8\",\"kinds\":[\"healing\"]}},\"defense\":null,\"heightening\":{\"damage\":{\"0\":\"1d8+8\"}},\"range\":{\"value\":\"30 feet\"},\"target\":{\"value\":\"1 willing undead creature\"},\"time\":{\"value\":\"2\"},\"traits\":{\"value\":[\"concentrate\",\"manipulate\",\"void\"]}}},\"pq7cxntbz4s8g5ik\":{\"_id\":\"pq7cxntbz4s8g5ik\",\"overlayType\":\"override\",\"system\":{\"range\":{\"value\":\"touch\"},\"time\":{\"value\":\"1\"}}},\"rvhoa43rqqqp8izn\":{\"_id\":\"rvhoa43rqqqp8izn\",\"overlayType\":\"override\",\"system\":{\"area\":{\"type\":\"emanation\",\"value\":30},\"range\":{\"value\":\"\"},\"target\":{\"value\":\"all living and undead creatures\"},\"time\":{\"value\":\"3\"},\"traits\":{\"value\":[\"concentrate\",\"manipulate\",\"void\"]}}},\"z04svm1cvfcxtplb\":{\"_id\":\"z04svm1cvfcxtplb\",\"name\":\"Harm (vs. Living)\",\"overlayType\":\"override\",\"system\":{\"damage\":{\"0\":{\"kinds\":[\"damage\"]}},\"range\":{\"value\":\"30 feet\"},\"target\":{\"value\":\"1 living creature\"},\"time\":{\"value\":\"2\"},\"traits\":{\"value\":[\"concentrate\",\"manipulate\",\"void\"]}}}},\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"range\":{\"value\":\"varies\"},\"requirements\":\"\",\"rules\":[],\"target\":{\"value\":\"1 living creature or 1 willing undead creature\"},\"time\":{\"value\":\"1 to 3\"},\"traits\":{\"rarity\":\"common\",\"traditions\":[\"divine\"],\"value\":[\"manipulate\",\"void\"]}},\"type\":\"spell\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=wdA52JJnsuQWeyqz 6a86d06b2f08a0bb TEXT \"<p>You channel void energy to harm the living or heal the undead. If the target is a living creature, you deal 1d8 void damage to it, and it gets a basic Fortitude save. If the target is a willing undead creature, you restore that amount of Hit Points. The number of actions you spend when Casting this Spell determines its targets, range, area, and other parameters.</p>\\n<p><span class=\\\"action-glyph\\\">1</span> The spell has a range of touch.</p>\\n<p><span class=\\\"action-glyph\\\">2</span> (concentrate) The spell has a range of 30 feet. If you're healing an undead creature, increase the Hit Points restored by 8.</p>\\n<p><span class=\\\"action-glyph\\\">3</span> (concentrate) You disperse void energy in a @Template[emanation|distance:30]. This targets all living and undead creatures in the area.</p>\\n<hr />\\n<p><strong>Heightened (+1)</strong> The amount of healing or damage increases by 1d8, and the extra healing for the 2-action version increases by 8.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/feats-11.txt|feats|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=hT4INKGtly4QY8KN 2578ec1e1c58d60b ITEM {\"_id\":\"hT4INKGtly4QY8KN\",\"name\":\"Domain Initiate\",\"system\":{\"actionType\":{\"value\":\"passive\"},\"actions\":{\"value\":null},\"category\":\"class\",\"level\":{\"value\":1},\"maxTakable\":null,\"prerequisites\":{\"value\":[]},\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"rules\":[{\"choices\":\"system.details.deities.domains\",\"flag\":\"domainInitiate\",\"key\":\"ChoiceSet\",\"prompt\":\"PF2E.SpecificRule.Prompt.DeitysDomain\"},{\"key\":\"ActiveEffectLike\",\"mode\":\"add\",\"path\":\"flags.system.soulWarden.featCount\",\"value\":1}],\"traits\":{\"rarity\":\"common\",\"value\":[\"cleric\"]}},\"type\":\"feat\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=hT4INKGtly4QY8KN 2578ec1e1c58d60b TEXT \"<p>Your deity bestows a special spell related to their powers. Select one domain—a subject of particular interest to you within your religion—from your deity's list. You gain an initial domain spell for that domain, a spell unique to the domain and not available to other clerics.</p>\\n<p>Domain spells are a type of focus spell. It costs 1 Focus Point to cast a focus spell, and you start with a focus pool of 1 Focus Point. You refill your focus pool during your daily preparations, and you can regain 1 Focus Point by spending 10 minutes using the Refocus activity to pray to your deity or do service toward their causes.</p>\\n<p>Focus spells are automatically heightened to half your level rounded up, much like cantrips. Focus spells don't require spell slots, and can't be cast using spell slots. Your focus pool can hold one Focus Point for each focus spell you have, up to 3 points.</p>\\n<hr />\\n<p><strong>Special</strong> You can select this feat multiple times, selecting a different domain each time and gaining its domain spell.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/class-features-1.txt|class-features|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=DutW12WMFPHBoLTH 75bc6423dbff1374 ITEM {\"_id\":\"DutW12WMFPHBoLTH\",\"name\":\"Deity (Cleric)\",\"system\":{\"actionType\":{\"value\":\"passive\"},\"actions\":{\"value\":null},\"category\":\"classfeature\",\"level\":{\"value\":1},\"prerequisites\":{\"value\":[]},\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"rules\":[{\"choices\":{\"filter\":[{\"or\":[\"item:category:deity\",\"item:category:pantheon\",\"item:category:covenant\"]}],\"itemType\":\"deity\"},\"flag\":\"deity\",\"key\":\"ChoiceSet\",\"predicate\":[{\"not\":\"deity\"}],\"prompt\":\"PF2E.SpecificRule.Prompt.Deity\"},{\"allowDuplicate\":false,\"key\":\"GrantItem\",\"predicate\":[{\"not\":\"deity\"}],\"uuid\":\"{item|flags.system.rulesSelections.deity}\"},{\"adjustName\":false,\"choices\":[{\"label\":\"PF2E.TraitHoly\",\"predicate\":[{\"or\":[\"deity:primary:sanctification:can:holy\",\"deity:primary:sanctification:must:holy\"]}],\"value\":\"holy\"},{\"label\":\"PF2E.TraitUnholy\",\"predicate\":[{\"or\":[\"deity:primary:sanctification:can:unholy\",\"deity:primary:sanctification:must:unholy\"]}],\"value\":\"unholy\"},{\"label\":\"PF2E.NoneOption\",\"predicate\":[{\"nor\":[\"deity:primary:sanctification:must:holy\",\"deity:primary:sanctification:must:unholy\"]}],\"value\":\"none\"}],\"key\":\"ChoiceSet\",\"predicate\":[{\"nor\":[\"sanctification:none\",\"sanctification:holy\",\"sanctification:unholy\"]}],\"prompt\":\"PF2E.SpecificRule.Prompt.Sanctification\",\"rollOption\":\"sanctification\",\"slug\":\"sanctification\"},{\"add\":[\"holy\"],\"key\":\"ActorTraits\",\"predicate\":[\"sanctification:holy\"]},{\"add\":[\"unholy\"],\"key\":\"ActorTraits\",\"predicate\":[\"sanctification:unholy\"]},{\"fist\":true,\"key\":\"Strike\",\"predicate\":[\"deity:primary:favored-weapon:fist\"]},{\"key\":\"ActiveEffectLike\",\"mode\":\"upgrade\",\"path\":\"flags.system.favoredWeaponRank\",\"predicate\":[\"class:cleric\"],\"value\":1}],\"subfeatures\":{\"proficiencies\":{},\"senses\":{},\"suppressedFeatures\":[]},\"traits\":{\"rarity\":\"common\",\"value\":[\"cleric\"]}},\"type\":\"feat\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=DutW12WMFPHBoLTH 75bc6423dbff1374 TEXT \"<p>As a cleric, you are a mortal servitor of a deity you revere above all others. Your deity grants you the trained proficiency rank in one skill and with the deity's favored weapon. If the favored weapon is uncommon, you also get access to that weapon.</p>\\n<p>Your deity also adds spells to your spell list. You can prepare these just like you can any spell on the divine spell list once you can prepare spells of their rank as a cleric. Any of these spells that aren't normally on the divine list are still divine spells if you prepare them this way.</p>\\n<h2>Sanctification</h2>\\n<p>Depending on your deity, their sanctification can make you holy or unholy. This gives you the holy or unholy trait, which commits you to one side of a struggle over the souls of the planes and may be referenced in other abilities. If you \\\"can be\\\" holy or unholy according to your deity, you make that choice, and if you \\\"must be\\\" holy or unholy you gain the trait automatically. If you gain the opposing trait in some way, you lose the previous trait until you complete an atone ritual.</p>\\n<h2>Anathema</h2>\\n<p>Acts fundamentally opposed to your deity's ideals are anathema to your faith. Learning or casting spells, committing acts, and using items that are anathema to your deity remove you from your deity's good graces.</p>\\n<p>Casting spells with the unholy trait is almost always anathema to deities who don't allow unholy sanctification, and casting holy spells is likewise anathema to those who don't allow holy sanctification. Similarly, casting spells that are anathema to the tenets or goals of your faith could interfere with your connection to your deity. For example, casting a spell to create undead would be anathema to a goddess of death. Many actions that are anathema don't appear in any deity's formal list. For borderline cases, you and your GM determine which acts are anathema.</p>\\n<p>If you perform enough acts that are anathema to your deity, you lose the magical abilities that come from your connection to your deity. The class features that you lose are determined by the GM, but they likely include your divine font and all cleric spellcasting. These abilities can be regained only if you repent by conducting an atone ritual.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/class-features-1.txt|class-features|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=AvNbdGSOTWNRgcxs 3dce59bd5a504267 ITEM {\"_id\":\"AvNbdGSOTWNRgcxs\",\"name\":\"Cleric Spellcasting\",\"system\":{\"actionType\":{\"value\":\"passive\"},\"actions\":{\"value\":null},\"category\":\"classfeature\",\"level\":{\"value\":1},\"prerequisites\":{\"value\":[]},\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"rules\":[],\"traits\":{\"rarity\":\"common\",\"value\":[\"cleric\"]}},\"type\":\"feat\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=AvNbdGSOTWNRgcxs 3dce59bd5a504267 TEXT \"<p>Your deity bestows on you the power to cast divine spells. You are a spellcaster, and you can cast spells of the divine tradition using the Cast a Spell activity. As a cleric, your chants generally invoke your deity and their powerful servants by name or title, while your gestures are followed by sacred symbols or other representations of your deity.</p>\\n<p>At 1st level, you can prepare two 1st-rank spells and five cantrips each morning from the common spells on the divine spell list or from other divine spells to which you gain access and learn via Learn a Spell. Prepared spells remain available to you until you cast them or until you prepare your spells again. The number of spells you can prepare each day is called your spell slots.</p>\\n<p>As you increase in level as a cleric, the number of spells you can prepare each day increases, as does the highest rank of spell you can cast, as shown in Cleric Spells per Day table above.</p>\\n<p>Some of your spells require you to attempt a spell attack to see how effective they are or for your enemies to roll against your spell DC (typically by attempting a saving throw). Since your key attribute is Wisdom, your spell attack modifier and spell DC use your Wisdom modifier.</p>\\n<h2>Heightening Spells</h2>\\n<p>When you get spell slots of 2nd rank and higher, you can fill those slots with stronger versions of lower-rank spells. This increases the spell's rank, heightening it to match the spell slot. Many spells have specific improvements when they are heightened to certain ranks.</p>\\n<h2>Cantrips</h2>\\n<p>Some of your spells are cantrips. A cantrip is a special type of spell that doesn't use spell slots. You can cast a cantrip at will, any number of times per day. A cantrip is always automatically heightened to half your level rounded up—this is usually equal to the highest rank of cleric spell slot you have. For example, as a 1st-level cleric, your cantrips are 1st-rank spells, and as a 5th-level cleric, your cantrips are 3rd-rank spells.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/class-features-4.txt|class-features|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=tyrBwBTzo5t9Zho7 6b9570c9437d1225 ITEM {\"_id\":\"tyrBwBTzo5t9Zho7\",\"name\":\"Doctrine\",\"system\":{\"actionType\":{\"value\":\"passive\"},\"actions\":{\"value\":null},\"category\":\"classfeature\",\"level\":{\"value\":1},\"prerequisites\":{\"value\":[]},\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"rules\":[{\"adjustName\":false,\"choices\":{\"filter\":[\"item:tag:cleric-doctrine\"]},\"flag\":\"doctrine\",\"key\":\"ChoiceSet\",\"prompt\":\"PF2E.SpecificRule.Cleric.Doctrine.Prompt\"},{\"key\":\"GrantItem\",\"uuid\":\"{item|flags.system.rulesSelections.doctrine}\"}],\"traits\":{\"rarity\":\"common\",\"value\":[\"cleric\"]}},\"type\":\"feat\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=tyrBwBTzo5t9Zho7 6b9570c9437d1225 TEXT \"<p>Even among followers of the same deity, approaches vary. At 1st level, you select cloistered cleric or warpriest and gain the benefits of its first doctrine. At 3rd level and every four levels thereafter, you gain another benefit from your doctrine.</p>\\n<ul>\\n<li>@UUID[Compendium.pf2e.classfeatures.Item.Cloistered Cleric]</li>\\n<li>@UUID[Compendium.pf2e.classfeatures.Item.Warpriest]</li>\\n</ul>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/class-features-2.txt|class-features|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=Qejo7FUWQtPTpgWH 40bbcd419226fa9b ITEM {\"_id\":\"Qejo7FUWQtPTpgWH\",\"name\":\"First Doctrine\",\"system\":{\"actionType\":{\"value\":\"passive\"},\"actions\":{\"value\":null},\"category\":\"classfeature\",\"level\":{\"value\":1},\"prerequisites\":{\"value\":[]},\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"rules\":[{\"key\":\"GrantItem\",\"uuid\":\"{actor|flags.system.cleric.firstDoctrine}\"}],\"traits\":{\"rarity\":\"common\",\"value\":[\"cleric\"]}},\"type\":\"feat\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=Qejo7FUWQtPTpgWH 40bbcd419226fa9b TEXT \"<p>You gain the first benefit of your doctrine:</p>\\n<ul>\\n<li>@UUID[Compendium.pf2e.classfeatures.Item.First Doctrine (Cloistered Cleric)]{Cloistered Cleric}</li>\\n<li>@UUID[Compendium.pf2e.classfeatures.Item.First Doctrine (Warpriest)]{Warpriest}</li>\\n</ul>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/class-features-3.txt|class-features|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=gblTFUOgolqFS9v4 9b5c92f8717f40d7 ITEM {\"_id\":\"gblTFUOgolqFS9v4\",\"name\":\"Divine Font\",\"system\":{\"actionType\":{\"value\":\"passive\"},\"actions\":{\"value\":null},\"category\":\"classfeature\",\"level\":{\"value\":1},\"prerequisites\":{\"value\":[]},\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"rules\":[{\"choices\":[{\"label\":\"PF2E.SpecificRule.Cleric.DivineFont.Healing\",\"predicate\":[\"deity:primary:font:heal\"],\"value\":\"heal\"},{\"label\":\"PF2E.SpecificRule.Cleric.DivineFont.Harmful\",\"predicate\":[\"deity:primary:font:harm\"],\"value\":\"harm\"}],\"flag\":\"divineFont\",\"key\":\"ChoiceSet\",\"prompt\":\"PF2E.SpecificRule.Cleric.DivineFont.Prompt\",\"rollOption\":\"divine-font\"}],\"traits\":{\"rarity\":\"common\",\"value\":[\"cleric\"]}},\"type\":\"feat\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=gblTFUOgolqFS9v4 9b5c92f8717f40d7 TEXT \"<p>Through your deity's blessing, you gain additional spells that channel either the life force called vitality or its counterforce, the void. When you prepare your spells each day, you can prepare additional @UUID[Compendium.pf2e.spells-srd.Item.Heal] or @UUID[Compendium.pf2e.spells-srd.Item.Harm] spells, depending on your deity. The divine font spell your deity provides is listed in the Divine Font entry for your deity; if both are listed, you can choose between <em>heal</em> or <em>harm</em>. Once you choose, you can't change your choice short of divine intervention.</p>\\n<p><strong>Healing Font:</strong> You gain 4 additional spell slots each day at your highest rank of cleric spell slots. You can prepare only <em>heal</em> spells in these slots. At 5th level, the number of additional slots increases to 5, and at 15th level, the total number of additional slots increases to 6.</p>\\n<p><strong>Harmful Font:</strong> You gain 4 additional spell slots each day at your highest rank of cleric spell slots. You can prepare only <em>harm</em> spells in these slots. At 5th level, the number of additional slots increases to 5, and at 15th level, the total number of additional slots increases to 6.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/class-features-4.txt|class-features|pc1|test"
