  - god: "&FEED`BODY ${object:pf2e/updater}=eZNCckLzbH3GyncH 176e0ffc787e1c2b TEXT \"<p>You gain the @UUID[Compendium.pf2e.feats-srd.Item.Shield Block] general feat, a reaction that lets you reduce damage with your shield.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/actions-1.txt|actions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=KAVf7AmRnbCAHrkT ab4348157d58c544 ITEM {\"_id\":\"KAVf7AmRnbCAHrkT\",\"name\":\"Reactive Strike\",\"system\":{\"actionType\":{\"value\":\"reaction\"},\"actions\":{\"value\":null},\"category\":\"defensive\",\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"rules\":[],\"traits\":{\"rarity\":\"common\",\"value\":[]}},\"type\":\"action\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=KAVf7AmRnbCAHrkT ab4348157d58c544 TEXT \"<p><strong>Trigger</strong> A creature within your reach uses a manipulate action or a move action, makes a ranged attack, or leaves a square during a move action it's using.</p>\\n<hr />\\n<p>You lash out at a foe that leaves an opening. Make a melee Strike against the triggering creature. If your attack is a critical hit and the trigger was a manipulate action, you disrupt that action. This Strike doesn't count toward your multiple attack penalty, and your multiple attack penalty doesn't apply to this Strike.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/feats-11.txt|feats|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=jM72TjJ965jocBV8 a969636c5a552133 ITEM {\"_id\":\"jM72TjJ965jocBV8\",\"name\":\"Shield Block\",\"system\":{\"actionType\":{\"value\":\"reaction\"},\"actions\":{\"value\":null},\"category\":\"general\",\"level\":{\"value\":1},\"prerequisites\":{\"value\":[]},\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"rules\":[],\"traits\":{\"rarity\":\"common\",\"value\":[\"general\"]}},\"type\":\"feat\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=jM72TjJ965jocBV8 a969636c5a552133 TEXT \"<p><strong>Trigger</strong> While you have your shield raised, you would take physical damage (bludgeoning, piercing, or slashing) from an attack.</p>\\n<hr />\\n<p>You snap your shield in place to ward off a blow. Your shield prevents you from taking an amount of damage up to the shield's Hardness. You and the shield each take any remaining damage, possibly breaking or destroying the shield.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  # The scenario.
  - god: "@tel me=${cleric}"
  - god: +deity/samples
  - as: cleric
    run: +build/ancestry Human
  - as: cleric
    run: +build/heritage Skilled Human
  - as: cleric
    run: +build/class Cleric
    sees: "Class: Cleric."
  - as: cleric
    run: +build/choose Deity=Solenne
    sees: "Deity (Cleric): Solenne."
  - as: cleric
    run: +build/choose Divine Font=Heal
    sees: "Divine Font: Heal."
  - as: cleric
    run: +build/choose Doctrine=Cloistered Cleric
    sees: "Doctrine: Cloistered Cleric."
  - as: dhamp
    run: +build/ancestry Human
  - as: dhamp
    run: +build/heritage Dhampir
  - as: dhamp
    run: +build/class Fighter
  - as: livia
    run: +build/ancestry Human
  - as: livia
    run: +build/heritage Skilled Human
  - as: livia
    run: +build/class Fighter
  - as: cleric
    run: +cast Heal=${dhamp.name}
    sees: "${dhamp.name} is not healed by it."
    because: outside an encounter Heal does nothing to a dhampir
  # Only the cleric has initiative, so the first turn is theirs; the others join during it.
  - god: +enc/start
  - god: +enc/add ${cleric.name}
  - god: +enc/init
  - god: +enc/next
  - heard: dhamp
    containing: "${cleric.name}'s turn."
    count: 1
  - god: +enc/add ${dhamp.name}
  - god: +enc/add ${livia.name}
  - god: +enc/damage ${livia.name}=5 slashing
  - as: cleric
    run: +cast Heal=${dhamp.name}
    sees: ["basic Fortitude", "vitality.", "${dhamp.name}: 1d20["]
    not_sees: "${dhamp.name} regains"
    because: vitality damage hurts a dhampir, who saves against it
  - as: cleric
    run: +cast Heal=${livia.name}
    sees: ["Healing 1d8[", "${livia.name} regains"]
    not_sees: basic Fortitude
