  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=1wQY3JYyhMYeeV2G 8eacf2bfd2b7e30e ITEM {\"_id\":\"1wQY3JYyhMYeeV2G\",\"name\":\"Observed\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":\"detection\",\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=1wQY3JYyhMYeeV2G 8eacf2bfd2b7e30e TEXT \"<p>Anything in plain view is observed by you. If a creature takes measures to avoid detection, such as by using Stealth to @UUID[Compendium.pf2e.actionspf2e.Item.Hide], it can become @UUID[Compendium.pf2e.conditionitems.Item.Hidden] or @UUID[Compendium.pf2e.conditionitems.Item.Undetected] instead of observed. If you have another precise sense besides sight, you might be able to observe a creature or object using that sense instead. You can observe a creature with only your precise senses. When @UUID[Compendium.pf2e.actionspf2e.Item.Seek]{Seeking} a creature using only imprecise senses, it remains hidden, rather than observed.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=3uh1r86TzbQvosxv 92f737f9fccd5d0f ITEM {\"_id\":\"3uh1r86TzbQvosxv\",\"name\":\"Doomed\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":\"death\",\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"isValued\":true,\"value\":1}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=3uh1r86TzbQvosxv 92f737f9fccd5d0f TEXT \"<p>Your soul has been gripped by a powerful force that calls you closer to death. Doomed always includes a value. The @UUID[Compendium.pf2e.conditionitems.Item.Dying] value at which you die is reduced by your doomed value. If your maximum dying value is reduced to 0, you instantly die. When you die, you're no longer doomed.</p>\\n<p>Your doomed value decreases by 1 each time you get a full night's rest.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=4D2KBtexWXa6oUMR 685b0c1c0f47c3c6 ITEM {\"_id\":\"4D2KBtexWXa6oUMR\",\"name\":\"Drained\",\"system\":{\"active\":false,\"duration\":{\"expiry\":null,\"perpetual\":false,\"text\":\"\",\"unit\":\"unlimited\",\"value\":-1},\"group\":\"abilities\",\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"removable\":false,\"rules\":[{\"key\":\"FlatModifier\",\"selector\":\"con-based\",\"slug\":\"drained\",\"type\":\"status\",\"value\":\"-1 * @item.badge.value\"},{\"key\":\"FlatModifier\",\"selector\":\"hp\",\"slug\":\"drained\",\"type\":\"status\",\"value\":\"min(-1 * @actor.level,-1) * @item.badge.value\"},{\"key\":\"LoseHitPoints\",\"reevaluateOnUpdate\":true,\"value\":\"max(1,@actor.level) * @item.badge.value\"}],\"traits\":{\"value\":[]},\"value\":{\"immutable\":false,\"isValued\":true,\"value\":1}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=4D2KBtexWXa6oUMR 685b0c1c0f47c3c6 TEXT \"<p>Your health and vitality have been depleted as you've lost blood, life force, or some other essence. Drained always includes a value. You take a status penalty equal to your drained value on Constitution-based rolls and DCs, such as Fortitude saves. You also lose a number of Hit Points equal to your level (minimum 1) times the drained value, and your maximum Hit Points are reduced by the same amount. For example, if you become drained 3 and you're a 3rd-level character, you lose 9 Hit Points and reduce your maximum Hit Points by 9. Losing these Hit Points doesn't count as taking damage.</p>\\n<p>Each time you get a full night's rest, your drained value decreases by 1. This increases your maximum Hit Points, but you don't immediately recover the lost Hit Points.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=6dNUvdb1dhToNDj3 aa2f029841eb5737 ITEM {\"_id\":\"6dNUvdb1dhToNDj3\",\"name\":\"Broken\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":null,\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=6dNUvdb1dhToNDj3 aa2f029841eb5737 TEXT \"<p>Broken is a condition that affects only objects. An object is broken when damage has reduced its Hit Points to equal or less than its Broken Threshold. A broken object can't be used for its normal function, nor does it grant bonuses—with the exception of armor. Broken armor still grants its item bonus to AC, but it also imparts a status penalty to AC depending on its category: –1 for broken light armor, –2 for broken medium armor, or –3 for broken heavy armor.</p>\\n<p>A broken item still imposes penalties and limitations normally incurred by carrying, holding, or wearing it. For example, broken armor would still impose its Dexterity modifier cap, check penalty, and so forth. If an effect makes an item broken automatically and the item has more HP than its Broken Threshold, that effect also reduces the item's current HP to the Broken Threshold.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=6uEgoh53GbXuHpTF 02fd766b0aa8fbb1 ITEM {\"_id\":\"6uEgoh53GbXuHpTF\",\"name\":\"Paralyzed\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":null,\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[{\"key\":\"ActiveEffectLike\",\"mode\":\"override\",\"path\":\"system.attributes.flanking.canFlank\",\"value\":false},{\"inMemoryOnly\":true,\"key\":\"GrantItem\",\"uuid\":\"Compendium.pf2e.conditionitems.Item.Off-Guard\"}],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=6uEgoh53GbXuHpTF 02fd766b0aa8fbb1 TEXT \"<p>You're frozen in place. You have the @UUID[Compendium.pf2e.conditionitems.Item.Off-Guard] condition and can't act except to @UUID[Compendium.pf2e.actionspf2e.Item.Recall Knowledge] and use actions that require only your mind (as determined by the GM). Your senses still function, but only in the areas you can perceive without moving, so you can't @UUID[Compendium.pf2e.actionspf2e.Item.Seek].</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=9PR9y0bi4JPKnHPR 312c62c3fcfbc63e ITEM {\"_id\":\"9PR9y0bi4JPKnHPR\",\"name\":\"Deafened\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":\"senses\",\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[{\"key\":\"FlatModifier\",\"predicate\":[{\"or\":[{\"and\":[\"check:type:skill\",\"item:trait:auditory\"]},{\"and\":[\"check:statistic:base:perception\",\"check:statistic:initiative\"]}]}],\"selector\":[\"perception\",\"skill-check\"],\"slug\":\"deafened\",\"type\":\"status\",\"value\":-2},{\"key\":\"Immunity\",\"type\":\"auditory\"},{\"itemType\":\"action\",\"key\":\"ItemAlteration\",\"mode\":\"add\",\"predicate\":[\"item:trait:auditory\"],\"property\":\"description\",\"value\":[{\"text\":\"PF2E.condition.deafened.note\"}]},{\"itemType\":\"feat\",\"key\":\"ItemAlteration\",\"mode\":\"add\",\"predicate\":[\"item:trait:auditory\"],\"property\":\"description\",\"value\":[{\"text\":\"PF2E.condition.deafened.note\"}]},{\"itemType\":\"spell\",\"key\":\"ItemAlteration\",\"mode\":\"add\",\"predicate\":[{\"not\":\"item:trait:subtle\"}],\"property\":\"description\",\"value\":[{\"text\":\"PF2E.condition.deafened.note\"}]},{\"adjustment\":{\"all\":\"to-critical-failure\"},\"key\":\"AdjustDegreeOfSuccess\",\"predicate\":[\"item:trait:auditory\"],\"selector\":\"perception\"}],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=9PR9y0bi4JPKnHPR 312c62c3fcfbc63e TEXT \"<p>You can't hear. You automatically critically fail Perception checks that require you to be able to hear. You take a –2 status penalty to Perception checks for initiative and checks that involve sound but also rely on other senses. If you perform an action that has the auditory trait, you must succeed at a @Check[flat|showDC:all|dc:5] or the action is lost; attempt the check after spending the action but before any effects are applied. You are immune to auditory effects while deafened.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=9evPzg9E6muFcoSk 9249689440fb821a ITEM {\"_id\":\"9evPzg9E6muFcoSk\",\"name\":\"Unnoticed\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":\"detection\",\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=9evPzg9E6muFcoSk 9249689440fb821a TEXT \"<p>If you're unnoticed by a creature, that creature has no idea you're present. When you're unnoticed, you're also @UUID[Compendium.pf2e.conditionitems.Item.Undetected]. This matters for abilities that can be used only against targets totally unaware of your presence.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=9qGBRpbX9NEwtAAr b251a17ec52a2906 ITEM {\"_id\":\"9qGBRpbX9NEwtAAr\",\"name\":\"Controlled\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":null,\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=9qGBRpbX9NEwtAAr b251a17ec52a2906 TEXT \"<p>You have been commanded, magically dominated, or otherwise had your will subverted. The controller dictates how you act and can make you use any of your actions, including attacks, reactions, or even @UUID[Compendium.pf2e.actionspf2e.Item.Delay]. The controller usually doesn't have to spend their own actions when controlling you.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=AJh5ex99aV6VTggg db6f5aa4988756d6 ITEM {\"_id\":\"AJh5ex99aV6VTggg\",\"name\":\"Off-Guard\",\"system\":{\"active\":false,\"duration\":{\"expiry\":null,\"perpetual\":false,\"text\":\"\",\"unit\":\"unlimited\",\"value\":-1},\"group\":null,\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"removable\":false,\"rules\":[{\"key\":\"FlatModifier\",\"selector\":\"ac\",\"slug\":\"off-guard\",\"type\":\"circumstance\",\"value\":-2}],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=AJh5ex99aV6VTggg db6f5aa4988756d6 TEXT \"<p>You're distracted or otherwise unable to focus your full attention on defense. You take a –2 circumstance penalty to AC. Some effects give you the off-guard condition only to certain creatures or against certain attacks. Others—especially conditions—can make you off-guard against everything. If a rule doesn't specify that the condition applies only to certain circumstances, it applies to all of them, such as \\\"The target is off-guard.\\\"</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=AdPVz7rbaVSRxHFg 8608879c90b42f21 ITEM {\"_id\":\"AdPVz7rbaVSRxHFg\",\"name\":\"Fascinated\",\"system\":{\"active\":false,\"duration\":{\"expiry\":null,\"perpetual\":false,\"text\":\"\",\"unit\":\"unlimited\",\"value\":-1},\"group\":null,\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"removable\":false,\"rules\":[{\"key\":\"FlatModifier\",\"selector\":[\"perception\",\"skill-check\"],\"slug\":\"fascinated\",\"type\":\"status\",\"value\":-2}],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=AdPVz7rbaVSRxHFg 8608879c90b42f21 TEXT \"<p>You're compelled to focus your attention on something, distracting you from whatever else is going on around you. You take a –2 status penalty to Perception and skill checks, and you can't use concentrate actions unless they (or their intended consequences) are related to the subject of your fascination, as determined by the GM. For instance, you might be able to @UUID[Compendium.pf2e.actionspf2e.Item.Seek] and @UUID[Compendium.pf2e.actionspf2e.Item.Recall Knowledge] about the subject, but you likely couldn't cast a spell targeting a different creature. This condition ends if a creature uses hostile actions against you or any of your allies.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=D5mg6Tc7Jzrj6ro7 f5bcbc3b5795565d ITEM {\"_id\":\"D5mg6Tc7Jzrj6ro7\",\"name\":\"Encumbered\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":null,\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[{\"key\":\"FlatModifier\",\"selector\":\"all-speeds\",\"slug\":\"encumbered\",\"value\":-10},{\"inMemoryOnly\":true,\"key\":\"GrantItem\",\"uuid\":\"Compendium.pf2e.conditionitems.Item.Clumsy\"}],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=D5mg6Tc7Jzrj6ro7 f5bcbc3b5795565d TEXT \"<p>You are carrying more weight than you can manage. While you're encumbered, you're @UUID[Compendium.pf2e.conditionitems.Item.Clumsy]{Clumsy 1} and take a 10-foot penalty to all your Speeds. As with all penalties to your Speed, this can't reduce your Speed below 5 feet.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=DmAIPqOBomZ7H95W eca98ffbaba0e89f ITEM {\"_id\":\"DmAIPqOBomZ7H95W\",\"name\":\"Concealed\",\"system\":{\"active\":false,\"duration\":{\"expiry\":null,\"perpetual\":false,\"text\":\"\",\"unit\":\"unlimited\",\"value\":-1},\"group\":\"senses\",\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"removable\":false,\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=DmAIPqOBomZ7H95W eca98ffbaba0e89f TEXT \"<p>You are difficult for one or more creatures to see due to thick fog or some other obscuring feature. You can be concealed to some creatures but not others. While concealed, you can still be @UUID[Compendium.pf2e.conditionitems.Item.Observed], but you're tougher to target. A creature that you're concealed from must succeed at a @Check[flat|showDC:all|dc:5] when targeting you with an attack, spell, or other effect. If the check fails, you aren't affected. Area effects aren't subject to this flat check.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=HL2l2VRSaQHu9lUw d41c9541a053aa7e ITEM {\"_id\":\"HL2l2VRSaQHu9lUw\",\"name\":\"Fatigued\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":null,\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[{\"key\":\"FlatModifier\",\"selector\":[\"ac\",\"saving-throw\"],\"slug\":\"fatigued\",\"type\":\"status\",\"value\":-1}],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=HL2l2VRSaQHu9lUw d41c9541a053aa7e TEXT \"<p>You're tired and can't summon much energy. You take a –1 status penalty to AC and saving throws. You can't use exploration activities performed while traveling.</p>\\n<p>You recover from fatigue after a full night's rest.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=I1ffBVISxLr2gC4u 4a45484a3e63a8c5 ITEM {\"_id\":\"I1ffBVISxLr2gC4u\",\"name\":\"Unfriendly\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":\"attitudes\",\"overrides\":[\"helpful\",\"friendly\",\"indifferent\",\"hostile\"],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=I1ffBVISxLr2gC4u 4a45484a3e63a8c5 TEXT \"<p>This condition reflects a creature's disposition toward a particular character, and only supernatural effects (like a spell) can impose this condition on a PC. A creature that is unfriendly to a character dislikes and distrusts that character. The unfriendly creature won't accept @UUID[Compendium.pf2e.actionspf2e.Item.Request]{Requests} from the character.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=MIRkyAjyBeXivMa7 2ac8529caca8c9ce ITEM {\"_id\":\"MIRkyAjyBeXivMa7\",\"name\":\"Enfeebled\",\"system\":{\"active\":false,\"duration\":{\"expiry\":null,\"perpetual\":false,\"text\":\"\",\"unit\":\"unlimited\",\"value\":-1},\"group\":\"abilities\",\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"removable\":false,\"rules\":[{\"key\":\"FlatModifier\",\"selector\":[\"str-based\",\"str-damage\"],\"slug\":\"enfeebled\",\"type\":\"status\",\"value\":\"-@item.badge.value\"}],\"traits\":{\"value\":[]},\"value\":{\"immutable\":false,\"isValued\":true,\"value\":1}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=MIRkyAjyBeXivMa7 2ac8529caca8c9ce TEXT \"<p>You're physically weakened. Enfeebled always includes a value. When you are enfeebled, you take a status penalty equal to the condition value to Strength-based rolls and DCs, including Strength-based melee attack rolls, Strength-based damage rolls, and Athletics checks.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=TBSHQspnbcqxsmjL 406b22b352ab8547 ITEM {\"_id\":\"TBSHQspnbcqxsmjL\",\"name\":\"Frightened\",\"system\":{\"active\":false,\"duration\":{\"expiry\":null,\"perpetual\":false,\"text\":\"\",\"unit\":\"unlimited\",\"value\":-1},\"group\":null,\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"removable\":false,\"rules\":[{\"key\":\"FlatModifier\",\"selector\":\"all\",\"slug\":\"frightened\",\"type\":\"status\",\"value\":\"-@item.badge.value\"}],\"traits\":{\"value\":[]},\"value\":{\"immutable\":false,\"isValued\":true,\"value\":1}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=TBSHQspnbcqxsmjL 406b22b352ab8547 TEXT \"<p>You're gripped by fear and struggle to control your nerves. The frightened condition always includes a value. You take a status penalty equal to this value to all your checks and DCs. Unless specified otherwise, at the end of each of your turns, the value of your frightened condition decreases by 1.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=TkIyaNPgTZFBCCuh 996c43a38d85508b ITEM {\"_id\":\"TkIyaNPgTZFBCCuh\",\"name\":\"Dazzled\",\"system\":{\"active\":false,\"duration\":{\"expiry\":null,\"perpetual\":false,\"text\":\"\",\"unit\":\"unlimited\",\"value\":-1},\"group\":\"senses\",\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"removable\":false,\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=TkIyaNPgTZFBCCuh 996c43a38d85508b TEXT \"<p>Your eyes are overstimulated or your vision is swimming. If vision is your only precise sense, all creatures and objects are @UUID[Compendium.pf2e.conditionitems.Item.Concealed] from you.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=VRSef5y1LmL2Hkjf dd01879222198b13 ITEM {\"_id\":\"VRSef5y1LmL2Hkjf\",\"name\":\"Undetected\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":\"detection\",\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=VRSef5y1LmL2Hkjf dd01879222198b13 TEXT \"<p>When you are undetected by a creature, that creature can't see you at all, has no idea what space you occupy, and can't target you, though you still can be affected by abilities that target an area. When you're undetected by a creature, that creature is @UUID[Compendium.pf2e.conditionitems.Item.Off-Guard] to you.</p>\\n<p>A creature you're undetected by can guess which square you're in to try targeting you. It must pick a square and attempt an attack. This works like targeting a @UUID[Compendium.pf2e.conditionitems.Item.Hidden] creature (requiring a @Check[flat|showDC:all|dc:11|traits:secret]), but the flat check and attack roll are rolled in secret by the GM, who doesn't reveal whether the attack missed due to failing the flat check, failing the attack roll, or choosing the wrong square. They can @UUID[Compendium.pf2e.actionspf2e.Item.Seek] to try to find you.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=VcDeM8A5oI6VqhbM cbd6b12b5c84eadd ITEM {\"_id\":\"VcDeM8A5oI6VqhbM\",\"name\":\"Restrained\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":null,\"overrides\":[\"grabbed\"],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[{\"key\":\"ActiveEffectLike\",\"mode\":\"override\",\"path\":\"system.attributes.flanking.canFlank\",\"value\":false},{\"inMemoryOnly\":true,\"key\":\"GrantItem\",\"uuid\":\"Compendium.pf2e.conditionitems.Item.Off-Guard\"},{\"inMemoryOnly\":true,\"key\":\"GrantItem\",\"uuid\":\"Compendium.pf2e.conditionitems.Item.Immobilized\"},{\"itemType\":\"action\",\"key\":\"ItemAlteration\",\"mode\":\"add\",\"predicate\":[\"item:trait:manipulate\"],\"property\":\"description\",\"value\":[{\"text\":\"PF2E.condition.restrained.note\"}]},{\"itemType\":\"feat\",\"key\":\"ItemAlteration\",\"mode\":\"add\",\"predicate\":[\"item:trait:manipulate\"],\"property\":\"description\",\"value\":[{\"text\":\"PF2E.condition.restrained.note\"}]},{\"itemType\":\"spell\",\"key\":\"ItemAlteration\",\"mode\":\"add\",\"predicate\":[\"item:trait:manipulate\"],\"property\":\"description\",\"value\":[{\"text\":\"PF2E.condition.restrained.note\"}]},{\"key\":\"Note\",\"predicate\":[{\"nor\":[\"action:escape\",\"action:force-open\"]}],\"selector\":[\"attack\",\"skill-check\"],\"text\":\"PF2E.condition.restrained.note\",\"title\":\"{item|name}\"}],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=VcDeM8A5oI6VqhbM cbd6b12b5c84eadd TEXT \"<p>You're tied up and can barely move, or a creature has you pinned. You have the @UUID[Compendium.pf2e.conditionitems.Item.Off-Guard] and @UUID[Compendium.pf2e.conditionitems.Item.Immobilized] conditions, and you can't use any attack or manipulate actions except to attempt to @UUID[Compendium.pf2e.actionspf2e.Item.Escape] or @UUID[Compendium.pf2e.actionspf2e.Item.Force Open] your bonds. Restrained overrides @UUID[Compendium.pf2e.conditionitems.Item.Grabbed].</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=XgEqL1kFApUbl5Z2 3765a1d3fe92cab8 ITEM {\"_id\":\"XgEqL1kFApUbl5Z2\",\"name\":\"Blinded\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":\"senses\",\"overrides\":[\"dazzled\"],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[{\"key\":\"FlatModifier\",\"selector\":\"perception\",\"slug\":\"blinded\",\"type\":\"status\",\"value\":-4},{\"key\":\"Immunity\",\"type\":\"visual\"}],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=XgEqL1kFApUbl5Z2 3765a1d3fe92cab8 TEXT \"<p>You can't see. All normal terrain is difficult terrain to you. You can't detect anything using vision. You automatically critically fail Perception checks that require you to be able to see, and if vision is your only precise sense, you take a –4 status penalty to Perception checks. You are immune to visual effects. Blinded overrides @UUID[Compendium.pf2e.conditionitems.Item.Dazzled].</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=Yl48xTdMh3aeQYL2 1941d28a0e0b7f35 ITEM {\"_id\":\"Yl48xTdMh3aeQYL2\",\"name\":\"Wounded\",\"system\":{\"active\":false,\"duration\":{\"expiry\":null,\"perpetual\":false,\"text\":\"\",\"unit\":\"unlimited\",\"value\":-1},\"group\":\"death\",\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"removable\":false,\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"immutable\":false,\"isValued\":true,\"value\":1}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=Yl48xTdMh3aeQYL2 1941d28a0e0b7f35 TEXT \"<p>You have been seriously injured. If you lose the @UUID[Compendium.pf2e.conditionitems.Item.Dying] condition and do not already have the wounded condition, you become wounded 1. If you already have the wounded condition when you lose the dying condition, your wounded condition value increases by 1. If you gain the dying condition while wounded, increase your dying condition value by your wounded value.</p>\\n<p>The wounded condition ends if someone successfully restores Hit Points to you using @UUID[Compendium.pf2e.actionspf2e.Item.Treat Wounds], or if you are restored to full Hit Points by any means and rest for 10 minutes.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=dTwPJuKgBQCMxixg 04337eba62251384 ITEM {\"_id\":\"dTwPJuKgBQCMxixg\",\"name\":\"Petrified\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":null,\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=dTwPJuKgBQCMxixg 04337eba62251384 TEXT \"<p>You have been turned to stone. You can't act, nor can you sense anything. You become an object with a Bulk double your normal Bulk (typically 12 for a petrified Medium creature or 6 for a petrified Small creature), AC 9, Hardness 8, and the same current Hit Points you had when alive. You don't have a Broken Threshold. When the petrified condition ends, you have the same number of Hit Points you had as a statue. If the statue is destroyed, you immediately die. While petrified, your mind and body are in stasis, so you don't age or notice the passing of time.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=dfCMdR4wnpbYNTix bf1662be38936ebf ITEM {\"_id\":\"dfCMdR4wnpbYNTix\",\"name\":\"Stunned\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":null,\"overrides\":[\"slowed\"],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"isValued\":true,\"value\":1}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=dfCMdR4wnpbYNTix bf1662be38936ebf TEXT \"<p>You've become senseless. You can't act. Stunned usually includes a value, which indicates how many total actions you lose, possibly over multiple turns, from being stunned. Each time you regain actions, reduce the number you regain by your stunned value, then reduce your stunned value by the number of actions you lost. For example, if you were stunned 4, you would lose all 3 of your actions on your turn, reducing you to stunned 1; on your next turn, you would lose 1 more action, and then be able to use your remaining 2 actions normally. Stunned might also have a duration instead, such as \\\"stunned for 1 minute,\\\" causing you to lose all your actions for the duration.</p>\\n<p>Stunned overrides @UUID[Compendium.pf2e.conditionitems.Item.Slowed]. If the duration of your stunned condition ends while you are slowed, you count the actions lost to the stunned condition toward those lost to being slowed. So, if you were stunned 1 and slowed 2 at the beginning of your turn, you would lose 1 action from stunned, and then lose only 1 additional action by being slowed, so you would still have 1 action remaining to use that turn.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=e1XGnhKNSQIm5IXg f466fe8aec5de620 ITEM {\"_id\":\"e1XGnhKNSQIm5IXg\",\"name\":\"Stupefied\",\"system\":{\"active\":false,\"duration\":{\"expiry\":null,\"perpetual\":false,\"text\":\"\",\"unit\":\"unlimited\",\"value\":-1},\"group\":\"abilities\",\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"removable\":false,\"rules\":[{\"key\":\"FlatModifier\",\"selector\":[\"cha-based\",\"int-based\",\"wis-based\"],\"slug\":\"stupefied\",\"type\":\"status\",\"value\":\"-@item.badge.value\"},{\"itemType\":\"spell\",\"key\":\"ItemAlteration\",\"mode\":\"add\",\"property\":\"description\",\"value\":[{\"text\":\"PF2E.condition.stupefied.note\"}]}],\"traits\":{\"value\":[]},\"value\":{\"immutable\":false,\"isValued\":true,\"value\":1}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=e1XGnhKNSQIm5IXg f466fe8aec5de620 TEXT \"<p>Your thoughts and instincts are clouded. Stupefied always includes a value. You take a status penalty equal to this value on Intelligence-, Wisdom-, and Charisma-based rolls and DCs, including Will saving throws, spell attack modifiers, spell DCs, and skill checks that use these attribute modifiers. Any time you attempt to @UUID[Compendium.pf2e.actionspf2e.Item.Cast a Spell] while stupefied, the spell is disrupted unless you succeed at a @Check[flat|showDC:all|dc:resolve(5+@item.badge.value)] with a DC equal to 5 + your stupefied value.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=eIcWbB5o3pP6OIMe adeac98b32ac7912 ITEM {\"_id\":\"eIcWbB5o3pP6OIMe\",\"name\":\"Immobilized\",\"system\":{\"active\":false,\"duration\":{\"expiry\":null,\"perpetual\":false,\"text\":\"\",\"unit\":\"unlimited\",\"value\":-1},\"group\":null,\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"removable\":false,\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=eIcWbB5o3pP6OIMe adeac98b32ac7912 TEXT \"<p>You are incapable of movement. You can't use any actions that have the move trait. If you're immobilized by something holding you in place and an external force would move you out of your space, the force must succeed at a check against either the DC of the effect holding you in place or the relevant defense (usually Fortitude DC) of the monster holding you in place.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=fBnFDH2MTzgFijKf 295d8fcc6ea1dcbe ITEM {\"_id\":\"fBnFDH2MTzgFijKf\",\"name\":\"Unconscious\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":\"death\",\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[{\"key\":\"FlatModifier\",\"selector\":[\"ac\",\"perception\",\"reflex\"],\"slug\":\"unconscious\",\"type\":\"status\",\"value\":-4},{\"key\":\"GrantItem\",\"onDeleteActions\":{\"grantee\":\"restrict\"},\"uuid\":\"Compendium.pf2e.conditionitems.Item.Blinded\"},{\"inMemoryOnly\":true,\"key\":\"GrantItem\",\"uuid\":\"Compendium.pf2e.conditionitems.Item.Off-Guard\"},{\"allowDuplicate\":false,\"key\":\"GrantItem\",\"onDeleteActions\":{\"grantee\":\"restrict\",\"granter\":\"detach\"},\"uuid\":\"Compendium.pf2e.conditionitems.Item.Prone\"}],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=fBnFDH2MTzgFijKf 295d8fcc6ea1dcbe TEXT \"<p>You're sleeping or have been knocked out. You can't act. You take a –4 status penalty to AC, Perception, and Reflex saves, and you have the @UUID[Compendium.pf2e.conditionitems.Item.Blinded] and @UUID[Compendium.pf2e.conditionitems.Item.Off-Guard] conditions. When you gain this condition, you fall @UUID[Compendium.pf2e.conditionitems.Item.Prone] and drop items you're holding unless the effect states otherwise or the GM determines you're positioned so you wouldn't.</p>\\n<p>If you're unconscious because you're @UUID[Compendium.pf2e.conditionitems.Item.Dying], you can't wake up while you have 0 Hit Points. If you are restored to 1 Hit Point or more, you lose the dying and unconscious conditions and can act normally on your next turn.</p>\\n<p>If you are unconscious and at 0 Hit Points, but not dying, you return to 1 Hit Point and awaken after sufficient time passes. The GM determines how long you remain unconscious, from a minimum of 10 minutes to several hours. If you are healed, you lose the unconscious condition and can act normally on your next turn.</p>\\n<p>If you're unconscious and have more than 1 Hit Point (typically because you are asleep or unconscious due to an effect), you wake up in one of the following ways.</p>\\n<ul>\\n<li>You take damage, though if the damage reduces you to 0 Hit Points, you remain unconscious and gain the dying condition as normal.</li>\\n<li>You receive healing, other than the natural healing you get from resting.</li>\\n<li>Someone shakes you awake with an @UUID[Compendium.pf2e.actionspf2e.Item.Interact] action.</li>\\n<li>Loud noise around you might wake you. At the start of your turn, you automatically attempt a Perception check against the noise's DC (or the lowest DC if there is more than one noise), waking up if you succeed. If creatures are attempting to stay quiet around you, this Perception check uses their Stealth DCs. Some effects make you sleep so deeply that they don't allow you this Perception check.</li>\\n<li>If you are simply asleep, the GM decides you wake up either because you have had a restful night's sleep or something disrupted that rest.</li>\\n</ul>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=fesd1n5eVhpCSS18 d74e63d2d3de1738 ITEM {\"_id\":\"fesd1n5eVhpCSS18\",\"name\":\"Sickened\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":null,\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[{\"key\":\"FlatModifier\",\"selector\":\"all\",\"slug\":\"sickened\",\"type\":\"status\",\"value\":\"-@item.badge.value\"},{\"itemType\":\"consumable\",\"key\":\"ItemAlteration\",\"label\":\"PF2E.condition.sickened.name\",\"mode\":\"add\",\"predicate\":[{\"or\":[\"item:tag:alchemical-food\",\"item:trait:elixir\",\"item:trait:ingested\",\"item:trait:potion\",\"item:trait:serum\"]}],\"property\":\"description\",\"value\":[{\"text\":\"PF2E.condition.sickened.note\"}]}],\"traits\":{\"value\":[]},\"value\":{\"isValued\":true,\"value\":1}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=fesd1n5eVhpCSS18 d74e63d2d3de1738 TEXT \"<p>@Localize[PF2E.condition.sickened.rules]</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=fuG8dgthlDWfWjIA bede09e7195aa195 ITEM {\"_id\":\"fuG8dgthlDWfWjIA\",\"name\":\"Indifferent\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":\"attitudes\",\"overrides\":[\"helpful\",\"friendly\",\"unfriendly\",\"hostile\"],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=fuG8dgthlDWfWjIA bede09e7195aa195 TEXT \"<p>This condition reflects a creature's disposition toward a particular character, and only supernatural effects (like a spell) can impose this condition on a PC. A creature that is indifferent to a character doesn't really care one way or the other about that character. Assume a creature's attitude to a given character is indifferent unless specified otherwise.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=i3OJZU2nk64Df3xm cf5ff77267a82f52 ITEM {\"_id\":\"i3OJZU2nk64Df3xm\",\"name\":\"Clumsy\",\"system\":{\"active\":false,\"duration\":{\"expiry\":null,\"perpetual\":false,\"text\":\"\",\"unit\":\"unlimited\",\"value\":-1},\"group\":\"abilities\",\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"removable\":false,\"rules\":[{\"key\":\"FlatModifier\",\"selector\":\"dex-based\",\"slug\":\"clumsy\",\"type\":\"status\",\"value\":\"-@item.badge.value\"}],\"traits\":{\"value\":[]},\"value\":{\"immutable\":false,\"isValued\":true,\"value\":1}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=i3OJZU2nk64Df3xm cf5ff77267a82f52 TEXT \"<p>Your movements become clumsy and inexact. Clumsy always includes a value. You take a status penalty equal to the condition value to Dexterity-based rolls and DCs, including AC, Reflex saves, ranged attack rolls, and skill checks using Acrobatics, Stealth, and Thievery.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=iU0fEDdBp3rXpTMC a706ce65c562529a ITEM {\"_id\":\"iU0fEDdBp3rXpTMC\",\"name\":\"Hidden\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":\"detection\",\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=iU0fEDdBp3rXpTMC a706ce65c562529a TEXT \"<p>While you're hidden from a creature, that creature knows the space you're in but can't tell precisely where you are. You typically become hidden by using Stealth to @UUID[Compendium.pf2e.actionspf2e.Item.Hide]. When @UUID[Compendium.pf2e.actionspf2e.Item.Seek]{Seeking} a creature using only imprecise senses, it remains hidden, rather than @UUID[Compendium.pf2e.conditionitems.Item.Observed]. A creature you're hidden from is @UUID[Compendium.pf2e.conditionitems.Item.Off-Guard] to you, and it must succeed at a @Check[flat|showDC:all|dc:11] when targeting you with an attack, spell, or other effect or it fails to affect you. Area effects aren't subject to this flat check.</p>\\n<p>A creature might be able to use the seek action to try to observe you.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=j91X7x0XSomq8d60 c9df84c74fba58ed ITEM {\"_id\":\"j91X7x0XSomq8d60\",\"name\":\"Prone\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":null,\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[{\"key\":\"FlatModifier\",\"selector\":\"attack-roll\",\"slug\":\"prone\",\"type\":\"circumstance\",\"value\":-2},{\"inMemoryOnly\":true,\"key\":\"GrantItem\",\"uuid\":\"Compendium.pf2e.conditionitems.Item.Off-Guard\"}],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=j91X7x0XSomq8d60 c9df84c74fba58ed TEXT \"<p>You're lying on the ground. You are @UUID[Compendium.pf2e.conditionitems.Item.Off-Guard] and take a –2 circumstance penalty to attack rolls. The only move actions you can use while you're prone are @UUID[Compendium.pf2e.actionspf2e.Item.Crawl] and @UUID[Compendium.pf2e.actionspf2e.Item.Stand]. Standing up ends the prone condition. You can @UUID[Compendium.pf2e.actionspf2e.Item.Take Cover] while prone to hunker down and gain greater cover against ranged attacks, even if you don't have an object to get behind, which grants you a +4 circumstance bonus to AC against ranged attacks (but you remain off-guard).</p>\\n<p>If you would be knocked prone while you're @UUID[Compendium.pf2e.actionspf2e.Item.Climb]{Climbing} or @UUID[Compendium.pf2e.actionspf2e.Item.Fly]{Flying}, you fall. You can't be knocked prone when @UUID[Compendium.pf2e.actionspf2e.Item.Swim]{Swimming}.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=kWc1fhmv9LBiTuei 7fda465f6c6523a5 ITEM {\"_id\":\"kWc1fhmv9LBiTuei\",\"name\":\"Grabbed\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":null,\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[{\"inMemoryOnly\":true,\"key\":\"GrantItem\",\"uuid\":\"Compendium.pf2e.conditionitems.Item.Off-Guard\"},{\"inMemoryOnly\":true,\"key\":\"GrantItem\",\"uuid\":\"Compendium.pf2e.conditionitems.Item.Immobilized\"},{\"itemType\":\"action\",\"key\":\"ItemAlteration\",\"mode\":\"add\",\"predicate\":[\"item:trait:manipulate\"],\"property\":\"description\",\"value\":[{\"text\":\"PF2E.condition.grabbed.note\"}]},{\"itemType\":\"feat\",\"key\":\"ItemAlteration\",\"mode\":\"add\",\"predicate\":[\"item:trait:manipulate\"],\"property\":\"description\",\"value\":[{\"text\":\"PF2E.condition.grabbed.note\"}]},{\"itemType\":\"spell\",\"key\":\"ItemAlteration\",\"mode\":\"add\",\"predicate\":[\"item:trait:manipulate\"],\"property\":\"description\",\"value\":[{\"text\":\"PF2E.condition.grabbed.note\"}]}],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=kWc1fhmv9LBiTuei 7fda465f6c6523a5 TEXT \"<p>You're held in place by another creature, giving you the @UUID[Compendium.pf2e.conditionitems.Item.Off-Guard] and @UUID[Compendium.pf2e.conditionitems.Item.Immobilized] conditions. If you attempt a manipulate action while grabbed, you must succeed at a @Check[flat|showDC:all|dc:5] or it is lost; roll the check after spending the action, but before any effects are applied.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=lDVqvLKA6eF3Df60 8ead3e44f26c7bb5 ITEM {\"_id\":\"lDVqvLKA6eF3Df60\",\"name\":\"Persistent Damage\",\"system\":{\"active\":false,\"duration\":{\"expiry\":null,\"perpetual\":false,\"text\":\"\",\"unit\":\"unlimited\",\"value\":-1},\"group\":null,\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"removable\":false,\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=lDVqvLKA6eF3Df60 8ead3e44f26c7bb5 TEXT \"<p>You are taking damage from an ongoing effect, such as from being lit on fire. This appears as \\\"X persistent [type] damage,\\\" where \\\"X\\\" is the amount of damage dealt and \\\"[type]\\\" is the damage type. Like normal damage, it can be doubled or halved based on the results of an attack roll or saving throw. Instead of taking persistent damage immediately, you take it at the end of each of your turns as long as you have the condition, rolling any damage dice anew each time. After you take persistent damage, roll a @Check[flat|showDC:all|dc:15] to see if you recover from the persistent damage. If you succeed, the condition ends.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=nlCjDvLMf2EkV2dl 04b867afd882743a ITEM {\"_id\":\"nlCjDvLMf2EkV2dl\",\"name\":\"Quickened\",\"system\":{\"active\":false,\"duration\":{\"expiry\":null,\"perpetual\":false,\"text\":\"\",\"unit\":\"unlimited\",\"value\":-1},\"group\":null,\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"removable\":false,\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=nlCjDvLMf2EkV2dl 04b867afd882743a TEXT \"<p>You're able to act more quickly. You gain 1 additional action at the start of your turn each round. Many effects that make you quickened require you use this extra action only in certain ways. If you become quickened from multiple sources, you can use the extra action you've been granted for any single action allowed by any of the effects that made you quickened. Because quickened has its effect at the start of your turn, you don't immediately gain actions if you become quickened during your turn.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=sDPxOjQ9kx2RZE8D bcc784f86952aec3 ITEM {\"_id\":\"sDPxOjQ9kx2RZE8D\",\"name\":\"Fleeing\",\"system\":{\"active\":false,\"duration\":{\"expiry\":null,\"perpetual\":false,\"text\":\"\",\"unit\":\"unlimited\",\"value\":-1},\"group\":null,\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"removable\":false,\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=sDPxOjQ9kx2RZE8D bcc784f86952aec3 TEXT \"<p>You're forced to run away due to fear or some other compulsion. On your turn, you must spend each of your actions trying to escape the source of the fleeing condition as expediently as possible (such as by using move actions to flee, or opening doors barring your escape). The source is usually the effect or creature that gave you the condition, though some effects might define something else as the source. You can't @UUID[Compendium.pf2e.actionspf2e.Item.Delay] or @UUID[Compendium.pf2e.actionspf2e.Item.Ready] while fleeing.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=ud7gTLwPeklzYSXG f5acc03e0348d053 ITEM {\"_id\":\"ud7gTLwPeklzYSXG\",\"name\":\"Hostile\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":\"attitudes\",\"overrides\":[\"helpful\",\"friendly\",\"indifferent\",\"unfriendly\"],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=ud7gTLwPeklzYSXG f5acc03e0348d053 TEXT \"<p>This condition reflects a creature's disposition toward a particular character, and only supernatural effects (like a spell) can impose on a PC. A creature hostile to a character actively seeks to harm that character. It doesn't necessarily attack, but it won't accept @UUID[Compendium.pf2e.actionspf2e.Item.Request]{Requests} from the character.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=v44P3WUcU1j0115l 74000d8b347e33e8 ITEM {\"_id\":\"v44P3WUcU1j0115l\",\"name\":\"Helpful\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":\"attitudes\",\"overrides\":[\"friendly\",\"indifferent\",\"unfriendly\",\"hostile\"],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=v44P3WUcU1j0115l 74000d8b347e33e8 TEXT \"<p>This condition reflects a creature's disposition toward a particular character, and only supernatural effects (like a spell) can impose this condition on a PC. A creature that is helpful to a character wishes to actively aid that character. It will accept reasonable @UUID[Compendium.pf2e.actionspf2e.Item.Request]{Requests} from that character, as long as such requests aren't at the expense of the helpful creature's goals or quality of life. If the character (or one of their allies) uses a hostile action against the creature, the creature gains a worse attitude condition depending on the severity of the hostile action, as determined by the GM.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=v66R7FdOf11l94im b8616aab5718d0ac ITEM {\"_id\":\"v66R7FdOf11l94im\",\"name\":\"Friendly\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":\"attitudes\",\"overrides\":[\"helpful\",\"indifferent\",\"unfriendly\",\"hostile\"],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=v66R7FdOf11l94im b8616aab5718d0ac TEXT \"<p>This condition reflects a creature's disposition toward a particular character, and only supernatural effects (like a spell) can impose this condition on a PC. A creature that is friendly to a character likes that character. It is likely to agree to @UUID[Compendium.pf2e.actionspf2e.Item.Request]{Requests} from that character as long as they are simple, safe, and don't cost too much to fulfill. If the character (or one of their allies) uses hostile actions against the creature, the creature gains a worse attitude condition depending on the severity of the hostile action, as determined by the GM.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=xYTAsEpcJE1Ccni3 5c0d302f5f71645b ITEM {\"_id\":\"xYTAsEpcJE1Ccni3\",\"name\":\"Slowed\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":null,\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"isValued\":true,\"value\":1}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=xYTAsEpcJE1Ccni3 5c0d302f5f71645b TEXT \"<p>You have fewer actions. Slowed always includes a value. When you regain your actions, reduce the number of actions regained by your slowed value. Because you regain actions at the start of your turn, you don't immediately lose actions if you become slowed during your turn.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=yZRUzMqrMmfLu0V1 bb1af6ca58cfd755 ITEM {\"_id\":\"yZRUzMqrMmfLu0V1\",\"name\":\"Dying\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":\"death\",\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[{\"key\":\"GrantItem\",\"onDeleteActions\":{\"grantee\":\"restrict\"},\"uuid\":\"Compendium.pf2e.conditionitems.Item.Unconscious\"}],\"traits\":{\"value\":[]},\"value\":{\"isValued\":true,\"value\":1}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=yZRUzMqrMmfLu0V1 bb1af6ca58cfd755 TEXT \"<p>You are bleeding out or otherwise at death's door. While you have this condition, you are @UUID[Compendium.pf2e.conditionitems.Item.Unconscious]. Dying always includes a value, and if it ever reaches dying 4, you die. When you're dying, you must attempt a recovery check at the start of your turn each round to determine whether you get better or worse. Your dying condition increases by 1 if you take damage while dying, or by 2 if you take damage from an enemy's critical hit or a critical failure on your save.</p>\\n<p>If you lose the dying condition by succeeding at a recovery check and are still at 0 Hit Points, you remain unconscious, but you can wake up as described in that condition. You lose the dying condition automatically and wake up if you ever have 1 Hit Point or more. Any time you lose the dying condition, you gain the @UUID[Compendium.pf2e.conditionitems.Item.Wounded]{Wounded 1} condition, or increase your wounded condition value by 1 if you already have that condition.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=yblD8fOR1J8rDwEQ 0109570570f611a5 ITEM {\"_id\":\"yblD8fOR1J8rDwEQ\",\"name\":\"Confused\",\"system\":{\"duration\":{\"expiry\":null,\"unit\":\"unlimited\",\"value\":0},\"group\":null,\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"rules\":[{\"key\":\"ActiveEffectLike\",\"mode\":\"override\",\"path\":\"system.attributes.flanking.canFlank\",\"value\":false},{\"key\":\"RollOption\",\"option\":\"target:ally\",\"value\":false},{\"key\":\"RollOption\",\"option\":\"origin:ally\",\"value\":false},{\"inMemoryOnly\":true,\"key\":\"GrantItem\",\"uuid\":\"Compendium.pf2e.conditionitems.Item.Off-Guard\"},{\"key\":\"Note\",\"predicate\":[{\"or\":[\"item:type:spell\",\"origin:action:trait:attack\"]}],\"selector\":\"damage-received\",\"text\":\"PF2E.condition.confused.note\",\"title\":\"{item|name}\"}],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=yblD8fOR1J8rDwEQ 0109570570f611a5 TEXT \"<p>You don't have your wits about you, and you attack wildly. You are @UUID[Compendium.pf2e.conditionitems.Item.Off-Guard], you don't treat anyone as your ally (though they might still treat you as theirs), and you can't Delay, Ready, or use reactions.</p>\\n<p>You use all your actions to Strike or cast offensive cantrips, though the GM can have you use other actions to facilitate attack, such as draw a weapon, move so target is in reach, and so forth. Your targets are determined randomly by the GM. If you have no other viable targets, you target yourself, automatically hitting but not scoring a critical hit. If it's impossible for you to attack or cast spells, you babble incoherently, wasting your actions.</p>\\n<p>Each time you take damage from an attack or spell, you can attempt a @Check[flat|showDC:all|dc:11] to recover from your confusion and end the condition.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/conditions-1.txt|conditions|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=zJxUflt9np0q4yML 55773d4d56f2635d ITEM {\"_id\":\"zJxUflt9np0q4yML\",\"name\":\"Invisible\",\"system\":{\"active\":false,\"duration\":{\"expiry\":null,\"perpetual\":false,\"text\":\"\",\"unit\":\"unlimited\",\"value\":-1},\"group\":\"senses\",\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"removable\":false,\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"isValued\":false,\"value\":null}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=zJxUflt9np0q4yML 55773d4d56f2635d TEXT \"<p>You can't be seen. You're @UUID[Compendium.pf2e.conditionitems.Item.Undetected] to everyone. Creatures can @UUID[Compendium.pf2e.actionspf2e.Item.Seek] to detect you; if a creature succeeds at its Perception check against your Stealth DC, you become @UUID[Compendium.pf2e.conditionitems.Item.Hidden] to that creature until you @UUID[Compendium.pf2e.actionspf2e.Item.Sneak] to become undetected again. If you become invisible while someone can already see you, you start out hidden to them (instead of undetected) until you successfully Sneak. You can't become @UUID[Compendium.pf2e.conditionitems.Item.Observed] while invisible except via special abilities or magic.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc2/conditions-1.txt|conditions|pc2|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=zXZjC8HLaRoLR17U 974ab2ab4cdcfb20 ITEM {\"_id\":\"zXZjC8HLaRoLR17U\",\"name\":\"Cursebound\",\"system\":{\"active\":false,\"duration\":{\"expiry\":null,\"perpetual\":true,\"text\":\"\",\"unit\":\"unlimited\",\"value\":-1},\"group\":\"abilities\",\"overrides\":[],\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core 2\"},\"references\":{\"children\":[],\"immunityFrom\":[],\"overriddenBy\":[],\"overrides\":[]},\"removable\":false,\"rules\":[],\"traits\":{\"value\":[]},\"value\":{\"immutable\":false,\"isValued\":true,\"value\":1}},\"type\":\"condition\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=zXZjC8HLaRoLR17U 974ab2ab4cdcfb20 TEXT \"<p>Your oracular curse is constricting around you as you receive divine punishment after drawing too deeply on your mystery's powers. Cursebound is a condition that affects only creatures with an oracular curse, and cursebound always includes a value. Your specific oracular curse imposes unique negative effects depending on your cursebound value. You can remove the cursebound condition only by Refocusing.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/ancestries-1.txt|ancestries|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=IiG7DgeLWYrSNXuX baed4ada23455d82 ITEM {\"_id\":\"IiG7DgeLWYrSNXuX\",\"name\":\"Human\",\"system\":{\"additionalLanguages\":{\"count\":1,\"custom\":\"\",\"value\":[]},\"boosts\":{\"0\":{\"value\":[\"cha\",\"con\",\"dex\",\"int\",\"str\",\"wis\"]},\"1\":{\"value\":[\"str\",\"dex\",\"con\",\"int\",\"wis\",\"cha\"]},\"2\":{\"value\":[]}},\"flaws\":{\"0\":{\"value\":[]}},\"hands\":2,\"hp\":8,\"items\":{},\"languages\":{\"custom\":\"\",\"value\":[\"common\"]},\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"reach\":5,\"rules\":[],\"size\":\"med\",\"speed\":25,\"traits\":{\"rarity\":\"common\",\"value\":[\"human\",\"humanoid\"]},\"vision\":\"normal\"},\"type\":\"ancestry\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=IiG7DgeLWYrSNXuX baed4ada23455d82 TEXT \"<p><em>As unpredictable and varied as any people, humans have exceptional drive and the capacity to endure and expand. Though many civilizations thrived before humanity rose to prominence, humans have built some of the greatest and the most terrible societies throughout the course of history, and today they are the most populous people in the world.</em></p>\\n<p><em>@UUID[Compendium.pf2e.journals.JournalEntry.45SK8rdbbxvEHfMn.JournalEntryPage.7pU8yM7yPMw92SY3]{Human}</em></p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc2/heritages-1.txt|heritages|pc2|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=UaD5VDoFlILEmbyz 68684ac1f43bdcbb ITEM {\"_id\":\"UaD5VDoFlILEmbyz\",\"name\":\"Dhampir\",\"system\":{\"ancestry\":null,\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core 2\"},\"rules\":[{\"key\":\"ActiveEffectLike\",\"mode\":\"override\",\"path\":\"system.attributes.hp.negativeHealing\",\"value\":true},{\"key\":\"Sense\",\"selector\":\"low-light-vision\"},{\"key\":\"Sense\",\"predicate\":[\"self:low-light-vision:from-ancestry\"],\"selector\":\"darkvision\"}],\"traits\":{\"rarity\":\"uncommon\",\"value\":[\"dhampir\"]}},\"type\":\"heritage\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=UaD5VDoFlILEmbyz 68684ac1f43bdcbb TEXT \"<p>You are the scion of a vampire, half living and half undead, gifted with uncanny charm and grace, a bloodless pallor, and elongated incisors. You gain the dhampir trait, in addition to the traits from your ancestry. You have the void healing ability, which means you are harmed by vitality damage and healed by void effects as if you were undead. You also gain low-light vision, or you gain darkvision if your ancestry already has low-light vision. You can select from dhampir feats and feats from your ancestry whenever you gain an ancestry feat.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/heritages-1.txt|heritages|pc1|test"
  - god: "&FEED`BODY ${object:pf2e/updater}=zVf0Hlp5xG0Q7kmc d2d80e6ec4c53530 ITEM {\"_id\":\"zVf0Hlp5xG0Q7kmc\",\"name\":\"Skilled Human\",\"system\":{\"ancestry\":{\"name\":\"Human\",\"slug\":\"human\",\"uuid\":\"Compendium.pf2e.ancestries.Item.IiG7DgeLWYrSNXuX\"},\"publication\":{\"license\":\"ORC\",\"remaster\":true,\"title\":\"Pathfinder Player Core\"},\"rules\":[{\"choices\":{\"config\":\"skills\"},\"flag\":\"skill\",\"key\":\"ChoiceSet\",\"prompt\":\"PF2E.SpecificRule.Prompt.Skill\"},{\"key\":\"ActiveEffectLike\",\"mode\":\"upgrade\",\"path\":\"system.skills.{item|flags.system.rulesSelections.skill}.rank\",\"value\":\"ternary(gte(@actor.level,5),2,1)\"}],\"traits\":{\"rarity\":\"common\",\"value\":[]}},\"type\":\"heritage\"}"
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`BODY ${object:pf2e/updater}=zVf0Hlp5xG0Q7kmc d2d80e6ec4c53530 TEXT \"<p>Your ingenuity allows you to train in a wide variety of skills. You become trained in one skill of your choice. At 5th level, you become an expert in the chosen skill.</p>\""
  - god: "@trigger ${object:pf2e/updater}/INC`IMPORT`LINE=1"
  - god: "&FEED`CURRENT ${object:pf2e/updater}=items/pc1/classes-1.txt|classes|pc1|test"
