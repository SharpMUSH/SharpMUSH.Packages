  - god: "&FEED`BODY ${object:pf2e/updater}=PF2E.condition.stupefied.note 238fa245d94b4dfb LANG \"Any time you attempt to @UUID[Compendium.pf2e.actionspf2e.Item.aBQ8ajvEBByv45yz]{Cast a Spell} while stupefied, the spell is disrupted unless you succeed at a @Check[flat|dc:resolve(5+@actor.conditions.stupefied.value)|name:Stupefied|showDC:all].\""
