          think setqm(check_move,u(%!/FUN`TRAIT`MOVE,%q<trait_key>),check_stat,,check_allowed,u(%!/FUN`MOVE`STATS,u(%!/FUN`TRAIT`MOVE,%q<trait_key>))); @assert cor(strlen(%q<check_move>),not(strlen(%q<check_chosen>)))=@pemit %#=notice(SHEET,A stat rolls alone: +check [lcstr(%q<trait_key>)].,warn); @assert cor(not(strlen(%q<check_chosen>)),strlen(setr(check_stat,u(%!/FUN`LIST`FIND,STAT,%q<check_chosen>))))=@pemit %#=notice(SHEET,There is no stat '%q<check_chosen>'.,warn); @assert cor(not(strlen(%q<check_chosen>)),member(%q<check_allowed>,%q<check_stat>))=@pemit %#=notice(SHEET,u(%!/FUN`MOVE`LABEL,%q<check_move>) [u(%!/FUN`DISPLAY`ROLLSWITH,%q<check_move>)].,warn); @assert cor(not(strlen(%q<check_move>)),strlen(%q<check_chosen>),lte(words(%q<check_allowed>),1))=@pemit %#=notice(SHEET,u(%!/FUN`MOVE`LABEL,%q<check_move>) [u(%!/FUN`DISPLAY`ROLLSWITH,%q<check_move>)]: say which%, such as +check [lcstr(%q<check_move>)]/[lcstr(first(%q<check_allowed>))].,warn)
        flags: [cmdsyntax]
      # %0 what was typed left of =: check_typed (the move or stat), check_chosen (a stat after /) and
      # check_modifier (a number at the end, 0 when none). A - inside a move's key is not a modifier.
      FUN`CHECK`READ:
        value: |-
          setqm(check_plus,if(pos(+,%0),trim(last(%0,+))),
          check_minus,if(pos(-,%0),trim(last(%0,-))),
          check_modifier,cond(strlen(%q<check_plus>),%q<check_plus>,isint(%q<check_minus>),-%q<check_minus>,0),
          check_rest,trim(cond(strlen(%q<check_plus>),left(%0,sub(strlen(%0),inc(strlen(last(%0,+))))),isint(%q<check_minus>),left(%0,sub(strlen(%0),inc(strlen(last(%0,-))))),%0)),
          check_typed,trim(before(%q<check_rest>,/)),
          check_chosen,trim(after(%q<check_rest>,/)))
        flags: [funsyntax]

      # ---- +encounter ---------------------------------------------------------------
      # A room holds any number of encounters, and a character may be in several. Whoever starts one runs it
      # (its GM); sheet keepers run any. A member plays from a copy of their sheet taken when they joined. The
      # copy in use is that of a joined encounter in the room the character is in: the one /use picked, else
      # the last joined. Anywhere else the sheet itself applies. An encounter lasts until /end, over any number
      # of days. /keep writes one character's forward, ongoing and hold from their copy back to their sheet.
      # +encounter [<n>]: one encounter, or the ones here and yours.
      INC`ENCOUNTER`SHOW:
        value: |-
          think setqm(enc_here,u(%!/FUN`ENC`HERE,%#),enc_joined,u(%!/FUN`ENC`JOINED,%#)); @assert cor(strlen(%q<cmd_argument>),words(setunion(%q<enc_here>,%q<enc_joined>)))=@pemit %#=notice(ENCOUNTER,There is no encounter here%, and you are in none. +encounter/start begins one.,warn); @assert cor(strlen(%q<cmd_argument>),gt(words(setunion(%q<enc_here>,%q<enc_joined>)),1))=@pemit %#=u(%!/FUN`SCREEN`ENCOUNTER,setunion(%q<enc_here>,%q<enc_joined>),%#); @assert strlen(%q<cmd_argument>)=@pemit %#=u(%!/FUN`SCREEN`ENCOUNTERS,%q<enc_here>,%q<enc_joined>,%#); @include/args %!/INC`NEED`ENCOUNTER=typed,%q<cmd_argument>,from,,verb,; @pemit %#=u(%!/FUN`SCREEN`ENCOUNTER,%q<enc_n>,%#)
        flags: [cmdsyntax]
      # +encounter/start [<title>]: a new encounter in the room you are in.
      INC`ENCOUNTER`START:
        value: |-
          think setqm(enc_n,inc(lmax(0 [iter(lattr({{encounters}}/ENC`*),last(%i0,`))])),enc_title,firstof(left(%q<cmd_argument>,60),Encounter in [name(loc(%#))])); &ENC`%q<enc_n> {{encounters}}=%q<enc_title>; &ENC`%q<enc_n>`ROOM {{encounters}}=objid(loc(%#)); &ENC`%q<enc_n>`GM {{encounters}}=%q<viewer_objid>; &ENC`%q<enc_n>`STARTED {{encounters}}=secs(); @remit %l=notice(ENCOUNTER,tone(strong,name(%#)) starts encounter %q<enc_n>: %q<enc_title>. +encounter/join %q<enc_n> takes part with a copy of your sheet.)
        flags: [cmdsyntax]
      # +encounter/join [<n>]: takes part in an encounter here, with a copy of your sheet as it stands.
      INC`ENCOUNTER`JOIN:
        value: |-
          @include/args %!/INC`NEED`ENCOUNTER=typed,%q<cmd_argument>,from,u(%!/FUN`ENC`HERE,%#),verb,join; @assert member(u(%!/FUN`ENC`HERE,%#),%q<enc_n>)=@pemit %#=notice(ENCOUNTER,Encounter %q<enc_n> is not in this room.,warn); @assert not(u(%!/FUN`ENC`MEMBER,%q<viewer_objid>,%q<enc_n>))=@pemit %#=notice(ENCOUNTER,You are in [u(%!/FUN`ENC`NAME,%q<enc_n>)] already.,warn); @include/args %!/INC`DO`ENCJOIN=who,%q<viewer_objid>,n,%q<enc_n>; @remit %l=notice(ENCOUNTER,tone(strong,name(%#)) joins [u(%!/FUN`ENC`NAME,%q<enc_n>)].)
        flags: [cmdsyntax]
      # +encounter/use [<n>]: which of your encounters here your rolls use; nothing goes back to the last joined.
      INC`ENCOUNTER`USE:
        value: |-
          @break not(strlen(%q<cmd_argument>))={@include/args %!/INC`DO`PLAY`SHEET=who,%q<viewer_objid>,field,USING,value,; @pemit %#=notice(ENCOUNTER,Your rolls use [firstof(u(%!/FUN`ENC`NAME,u(%!/FUN`ENC`ACTIVE,%q<viewer_objid>)),your sheet)].,ok)}; @include/args %!/INC`NEED`ENCOUNTER=typed,%q<cmd_argument>,from,,verb,; @assert u(%!/FUN`ENC`MEMBER,%q<viewer_objid>,%q<enc_n>)=@pemit %#=notice(ENCOUNTER,You are not in [u(%!/FUN`ENC`NAME,%q<enc_n>)]. +encounter/join %q<enc_n> takes part.,warn); @include/args %!/INC`DO`PLAY`SHEET=who,%q<viewer_objid>,field,USING,value,%q<enc_n>; @pemit %#=notice(ENCOUNTER,Your rolls use your copy in [u(%!/FUN`ENC`NAME,%q<enc_n>)][if(member(u(%!/FUN`ENC`HERE,%#),%q<enc_n>),,%b when you are in its room)].,ok)
        flags: [cmdsyntax]
      # +encounter/add <name>[=<n>]: the GM brings someone in the encounter's room into it.
      INC`ENCOUNTER`ADD:
        value: |-
          @include/args %!/INC`NEED`ENCOUNTER=typed,%q<cmd_right_side>,from,u(%!/FUN`ENC`HERE,%#),verb,add <name>=; @include %!/INC`NEED`GM; @include/args %!/INC`NEED`TARGET=name,%q<cmd_left_side>; @assert not(comp(objid(loc(%q<sheet_who>)),get({{encounters}}/ENC`%q<enc_n>`ROOM)))=@pemit %#=notice(ENCOUNTER,[name(%q<sheet_who>)] is not in the encounter's room.,warn); @assert not(u(%!/FUN`ENC`MEMBER,%q<sheet_who>,%q<enc_n>))=@pemit %#=notice(ENCOUNTER,[name(%q<sheet_who>)] is in [u(%!/FUN`ENC`NAME,%q<enc_n>)] already.,warn); @include/args %!/INC`DO`ENCJOIN=who,%q<sheet_who>,n,%q<enc_n>; @remit get({{encounters}}/ENC`%q<enc_n>`ROOM)=notice(ENCOUNTER,tone(strong,name(%#)) brings [name(%q<sheet_who>)] into [u(%!/FUN`ENC`NAME,%q<enc_n>)].)
        flags: [cmdsyntax]
      # +encounter/remove <name>[=<n>]: the GM takes someone out; their copy goes.
      INC`ENCOUNTER`REMOVE:
        value: |-
          @include/args %!/INC`NEED`TARGET=name,%q<cmd_left_side>; @include/args %!/INC`NEED`ENCOUNTER=typed,%q<cmd_right_side>,from,u(%!/FUN`ENC`JOINED,%q<sheet_who>),verb,remove <name>=; @include %!/INC`NEED`GM; @include %!/INC`NEED`MEMBER; @include/args %!/INC`DO`ENCDROP=who,%q<sheet_who>,n,%q<enc_n>; @pemit %#=notice(ENCOUNTER,[name(%q<sheet_who>)] is out of [u(%!/FUN`ENC`NAME,%q<enc_n>)].,ok); @pemit %q<sheet_who>=notice(ENCOUNTER,[name(%#)] takes you out of [u(%!/FUN`ENC`NAME,%q<enc_n>)]. Its copy of your sheet is gone.)
        flags: [cmdsyntax]
      # +encounter/leave [<n>]: out of an encounter you are in; your copy goes.
      INC`ENCOUNTER`LEAVE:
        value: |-
          @include/args %!/INC`NEED`ENCOUNTER=typed,%q<cmd_argument>,from,firstof(u(%!/FUN`ENC`ACTIVE,%#),u(%!/FUN`ENC`JOINED,%#)),verb,leave; @assert u(%!/FUN`ENC`MEMBER,%q<viewer_objid>,%q<enc_n>)=@pemit %#=notice(ENCOUNTER,You are not in [u(%!/FUN`ENC`NAME,%q<enc_n>)].,warn); @include/args %!/INC`DO`ENCDROP=who,%q<viewer_objid>,n,%q<enc_n>; @pemit %#=notice(ENCOUNTER,You leave [u(%!/FUN`ENC`NAME,%q<enc_n>)]. Its copy of your sheet is gone.,ok)
        flags: [cmdsyntax]
      # +encounter/keep <name>[=<n>]: the GM writes a character's forward, ongoing and hold from the copy to their sheet.
      INC`ENCOUNTER`KEEP:
        value: |-
          @include/args %!/INC`NEED`TARGET=name,%q<cmd_left_side>; @include/args %!/INC`NEED`ENCOUNTER=typed,%q<cmd_right_side>,from,u(%!/FUN`ENC`JOINED,%q<sheet_who>),verb,keep <name>=; @include %!/INC`NEED`GM; @include %!/INC`NEED`MEMBER; think setq(keep_copy,get({{encounters}}/ENC`%q<enc_n>`COPY`[after(num(%q<sheet_who>),#)])); @dolist/inline FORWARD ONGOING HOLD={@include/args %!/INC`DO`PLAY`SHEET=who,%q<sheet_who>,field,##,value,if(comp(u(%!/FUN`V,%q<keep_copy>,lcstr(##)),0),u(%!/FUN`V,%q<keep_copy>,lcstr(##)))}; @pemit %#=notice(ENCOUNTER,[name(%q<sheet_who>)]'s sheet keeps the forward%, ongoing and hold from [u(%!/FUN`ENC`NAME,%q<enc_n>)].,ok); @pemit %q<sheet_who>=notice(ENCOUNTER,[name(%#)] writes your forward%, ongoing and hold from [u(%!/FUN`ENC`NAME,%q<enc_n>)] to your sheet.)
        flags: [cmdsyntax]
      # +encounter/end [<n>]: the GM ends it; every copy goes.
      INC`ENCOUNTER`END:
        value: |-
          @include/args %!/INC`NEED`ENCOUNTER=typed,%q<cmd_argument>,from,u(%!/FUN`ENC`HERE,%#),verb,end; @include %!/INC`NEED`GM; think setqm(end_title,u(%!/FUN`ENC`NAME,%q<enc_n>),end_room,get({{encounters}}/ENC`%q<enc_n>`ROOM)); @dolist/inline u(%!/FUN`ENC`MEMBERS,%q<enc_n>)={@include/args %!/INC`DO`ENCDROP=who,##,n,%q<enc_n>}; @dolist/inline COPY ROOM GM STARTED={&ENC`%q<enc_n>`## {{encounters}}}; &ENC`%q<enc_n> {{encounters}}; @remit %q<end_room>=notice(ENCOUNTER,tone(strong,name(%#)) ends %q<end_title>. Its copies are gone.); @if comp(objid(loc(%#)),%q<end_room>)={@pemit %#=notice(ENCOUNTER,%q<end_title> is ended.,ok)}
        flags: [cmdsyntax]
      # Which encounter a command means: enc_n. %<typed> a number, or nothing for the one in %<from>; several there,
      # and the player is asked which, as +encounter/%<verb> <n>.
      INC`NEED`ENCOUNTER:
        value: |-
          think setq(enc_n,if(strlen(%<typed>),%<typed>,if(eq(words(%<from>),1),%<from>))); @assert cor(strlen(%<typed>),words(%<from>))=@pemit %#=notice(ENCOUNTER,There is no encounter here[if(strlen(%<verb>),%b for that)]. +encounter lists them.,warn); @assert strlen(%q<enc_n>)=@pemit %#=notice(ENCOUNTER,Say which: [itemize(iter(%<from>,+encounter/[edit(%<verb> %i0,=%b,=)] for [get({{encounters}}/ENC`%i0)],%b,|),|,or)].,warn); @assert cand(isint(%q<enc_n>),hasattr({{encounters}},ENC`%q<enc_n>))=@pemit %#=notice(ENCOUNTER,There is no encounter %q<enc_n>.,warn)
        flags: [cmdsyntax]
      INC`NEED`GM:
        value: |-
          @assert u(%!/FUN`ENC`GM,%#,%q<enc_n>)=@pemit %#=notice(ENCOUNTER,Only [name(get({{encounters}}/ENC`%q<enc_n>`GM))]%, who runs [u(%!/FUN`ENC`NAME,%q<enc_n>)]%, and sheet keepers do that.,error)
        flags: [cmdsyntax]
      INC`NEED`MEMBER:
        value: |-
          @assert u(%!/FUN`ENC`MEMBER,%q<sheet_who>,%q<enc_n>)=@pemit %#=notice(ENCOUNTER,[name(%q<sheet_who>)] is not in [u(%!/FUN`ENC`NAME,%q<enc_n>)].,warn)
        flags: [cmdsyntax]

      # ---- writes -----------------------------------------------------------------
      # %<who> an objid. The PBTA root is wizard-flagged and no_command, and its leaves take that from it.
      INC`DO`ROOT:
        value: |-
          @if not(hasattr(%<who>,PBTA))={&PBTA %<who>=This character's PbtA sheet. +sheet shows it.; @set %<who>/PBTA=wizard; @set %<who>/PBTA=no_command}
        flags: [cmdsyntax]
      # A ledger entry: %<who>, %<kind>, %<key>, %<value>, %<phase> (chargen, play or staff). A chargen entry
      # rewrites the chargen entry in force of the same kind and key (any playbook for a playbook); every other
      # entry is numbered after the last. entry_n is its number. Each has the wizard attribute flag, and an
      # entry without it is never read.
      INC`DO`ENTRY:
        value: |-
          @include/args %!/INC`DO`ROOT=who,%<who>; think setq(entry_n,if(strmatch(%<phase>,chargen),u(%!/FUN`LEDGER`CHARGENOF,%<who>,%<kind>,if(strmatch(%<kind>,playbook),*,%<key>)))); think setq(entry_n,firstof(%q<entry_n>,inc(lmax(0 [iter(lattr(%<who>/PBTA`LEDGER`*),last(%i0,`))])))); &PBTA`LEDGER`%q<entry_n> %<who>=[json(object,n,%q<entry_n>,kind,json(string,%<kind>),key,json(string,%<key>),value,json(string,%<value>),phase,json(string,%<phase>),by,json(string,objid(%#)),at,secs())]; @set %<who>/PBTA`LEDGER`%q<entry_n>=wizard; &PBTA`MERGED %<who>
        flags: [cmdsyntax]
      # Removes a chargen entry outright: %<who>, %<n>.
      INC`DO`UNENTRY:
        value: |-
          &PBTA`LEDGER`%<n> %<who>
        flags: [cmdsyntax]
      # A revoke entry taking back entry %<n> on %<who>.
      INC`DO`REVOKE:
        value: |-
          @include/args %!/INC`DO`ENTRY=who,%<who>,kind,revoke,key,,value,%<n>,phase,staff
        flags: [cmdsyntax]
      # Forward, ongoing or hold (%<field>) for %<who>: the copy in use when they are in an encounter here, else
      # their sheet.
      INC`DO`PLAY:
        value: |-
          think setq(play_n,u(%!/FUN`ENC`ACTIVE,%<who>)); @include/args %!/INC`DO`PLAY`[if(strlen(%q<play_n>),COPY,SHEET)]=who,%<who>,field,%<field>,value,%<value>,n,%q<play_n>
        flags: [cmdsyntax]
      INC`DO`PLAY`SHEET:
        value: |-
          @include/args %!/INC`DO`ROOT=who,%<who>; @if strlen(%<value>)={&PBTA`%<field> %<who>=%<value>},{&PBTA`%<field> %<who>}
        flags: [cmdsyntax]
      INC`DO`PLAY`COPY:
        value: |-
          think setq(play_attr,ENC`%<n>`COPY`[after(num(%<who>),#)]); &%q<play_attr> {{encounters}}=[json_mod(get({{encounters}}/%q<play_attr>),patch,json(object,lcstr(%<field>),if(strmatch(%<field>,HOLD),json(string,%<value>),firstof(%<value>,0))))]
        flags: [cmdsyntax]
      # %<who> joins encounter %<n> with a copy of their sheet; it goes last in their PBTA`ENCOUNTERS.
      INC`DO`ENCJOIN:
        value: |-
          &ENC`%<n>`COPY`[after(num(%<who>),#)] {{encounters}}=[json_mod(u(%!/FUN`VIEW`LIVE,%<who>),patch,json(object,encounter,json(string,%<n>)))]; @include/args %!/INC`DO`PLAY`SHEET=who,%<who>,field,ENCOUNTERS,value,squish([setdiff(get(%<who>/PBTA`ENCOUNTERS),%<n>)] %<n>)
        flags: [cmdsyntax]
      # %<who> leaves encounter %<n>; the copy goes.
      INC`DO`ENCDROP:
        value: |-
          &ENC`%<n>`COPY`[after(num(%<who>),#)] {{encounters}}; @include/args %!/INC`DO`PLAY`SHEET=who,%<who>,field,ENCOUNTERS,value,squish(iter(get(%<who>/PBTA`ENCOUNTERS),if(comp(%i0,%<n>),%i0))); @if not(comp(get(%<who>/PBTA`USING),%<n>))={&PBTA`USING %<who>}
        flags: [cmdsyntax]

      # ---- the ledger -------------------------------------------------------------------
      # A character's build is the entries under PBTA`LEDGER`<n>, each a JSON object: n, kind, key, value, phase
      # (chargen, play or staff), by (an objid) and at (secs). Kinds: playbook {key}, stat {key, value: the base,
      # empty for unassigned}, boost {key, value: added to the base}, move {key}, revoke {value: the entry it takes
      # back}, clear (every entry before it). Rows are n~kind~key~value~phase~by.
      FUN`LEDGER`NUMS:
        value: |-
          sort(iter(lattr(%0/PBTA`LEDGER`*),if(hasflag(%0/%i0,wizard),last(%i0,`))),n)
        flags: [funsyntax]
      FUN`LEDGER`ROWS:
        value: |-
          iter(u(%!/FUN`LEDGER`NUMS,%0),u(%!/FUN`LEDGER`ROW,get(%0/PBTA`LEDGER`%i0),%i0))
        flags: [funsyntax]
      FUN`LEDGER`ROW:
        value: |-
          %1~[json_query(%0,extract,$.kind)]~[json_query(%0,extract,$.key)]~[json_query(%0,extract,$.value)]~[json_query(%0,extract,$.phase)]~[json_query(%0,extract,$.by)]
        flags: [funsyntax]
      # %0 rows: the ones in force, after the last clear and not revoked; clears and revokes left out.
      FUN`LEDGER`LIVE:
        value: |-
          setqm(live_clear,last(0 [iter(graball(%0,*~clear~*),first(%i0,~))]),live_revoked,iter(graball(%0,*~revoke~*),elements(%i0,4,~)))[squish(iter(%0,if(cor(lte(first(%i0,~),%q<live_clear>),member(%q<live_revoked>,first(%i0,~)),match(clear revoke,elements(%i0,2,~))),,%i0)))]
        flags: [funsyntax]
      # %0 a character, %1 a kind, %2 a key (or *): the number of the chargen entry in force that matches.
      FUN`LEDGER`CHARGENOF:
        value: |-
          first(iter(revwords(graball(u(%!/FUN`LEDGER`MERGED,%0),*~%1~%2~*~chargen~*)),first(%i0,~)))
        flags: [funsyntax]
      # %0 rows in force: the playbook, a stat's base (empty when unassigned), a stat with its boosts, the moves taken.
      FUN`BUILD`PLAYBOOK:
        value: |-
          elements(last(graball(%0,*~playbook~*)),3,~)
        flags: [funsyntax]
      FUN`BUILD`BASE:
        value: |-
          elements(last(graball(%0,*~stat~%1~*)),4,~)
        flags: [funsyntax]
      FUN`BUILD`STAT:
        value: |-
          add(firstof(u(%!/FUN`BUILD`BASE,%0,%1),0),ladd(0 [iter(graball(%0,*~boost~%1~*),elements(%i0,4,~))]))
        flags: [funsyntax]
      FUN`BUILD`TAKEN:
        value: |-
          setunion(iter(graball(%0,*~move~*),elements(%i0,3,~)),)
        flags: [funsyntax]
      # %0 rows, %1 a stat to leave out: the starting numbers not yet given to another stat.
      FUN`ARRAY`LEFT:
        value: |-
          fold(%!/FUN`ARRAY`TAKE,squish(iter(setdiff(u(%!/FUN`LIST`ALL,STAT),%1),u(%!/FUN`BUILD`BASE,%0,%i0))),get(%!/DATA`CONFIG`ARRAY))
        flags: [funsyntax]
      FUN`ARRAY`TAKE:
        value: |-
          if(match(%0,%1),ldelete(%0,match(%0,%1)),%0)
        flags: [funsyntax]

      # ---- views --------------------------------------------------------------------
      # A view is what a roll or a screen reads: a JSON object with playbook, stats (STR=1 DEX=0 ...), moves
      # (every move the character has), forward, ongoing, hold (MOVE=n pairs) and encounter (its number, or
      # empty for the sheet itself). FUN`VIEW`LIVE builds it from the ledger; an encounter's copy is one.
      FUN`VIEW`LIVE:
        value: |-
          setq(view_rows,u(%!/FUN`LEDGER`MERGED,%0))[setq(view_playbook,u(%!/FUN`BUILD`PLAYBOOK,%q<view_rows>))][json(object,playbook,json(string,%q<view_playbook>),stats,json(string,iter(u(%!/FUN`LIST`ALL,STAT),%i0=[u(%!/FUN`BUILD`STAT,%q<view_rows>,%i0)])),moves,json(string,filterbool(%!/FUN`VIEW`HASMOVE,u(%!/FUN`LIST`ALL,MOVE),,,%q<view_playbook>,u(%!/FUN`BUILD`TAKEN,%q<view_rows>))),forward,default(%0/PBTA`FORWARD,0),ongoing,default(%0/PBTA`ONGOING,0),hold,json(string,get(%0/PBTA`HOLD)),encounter,json(string,))]
        flags: [funsyntax]
      # %0 a move, %1 a playbook, %2 the moves taken: 1 when a basic move, one of the playbook's starting moves, or taken.
      FUN`VIEW`HASMOVE:
        value: |-
