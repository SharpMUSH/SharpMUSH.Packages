          itemize(iter(%0,[u(%!/FUN`STAT`LABEL,ucstr(before(%i0,=)))] [u(%!/FUN`DISPLAY`SIGNED,after(%i0,=))],%b,|),|)
        flags: [funsyntax]

      # ---- the sheet API ------------------------------------------------------------
      # What other packages call: u({{sheet-pbta/sheet}}/API`<NAME>,...). Every sheet package has these names.
      # They read the character's sheet itself, never an encounter's copy; API`SPEND and API`AWARD are the ones
      # that write.
      API:
        value: |-
          The PbtA sheet's functions for other packages. See the package README.
        flags: [VISUAL]
      # JSON list of the stats and moves: [{"key","label","group","always"}], group stat or move. A move's key is
      # move-<key>. Every stat is always; a move is always when it is basic, since everyone has it.
      API`TRAITS:
        value: |-
          json_array(iter(u(%!/FUN`LIST`ALL,STAT),json(object,key,json(string,lcstr(%i0)),label,json(string,u(%!/FUN`STAT`LABEL,%i0)),group,json(string,stat),always,json(boolean,1)),%b,|)|[iter(u(%!/FUN`LIST`ALL,MOVE),json(object,key,json(string,move-[lcstr(%i0)]),label,json(string,u(%!/FUN`MOVE`LABEL,%i0)),group,json(string,move),always,json(boolean,not(strlen(get({{store}}/MOVE`%i0`PLAYBOOK))))),%b,|)],|)
        flags: [VISUAL]
