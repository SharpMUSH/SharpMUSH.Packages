      API`ALWAYS:
        value: |-
          lcstr(squish(u(%!/FUN`LIST`ALL,STAT) [iter(u(%!/FUN`LIST`ALL,MOVE),if(strlen(get({{store}}/MOVE`%i0`PLAYBOOK)),,move-%i0))]))
        flags: [VISUAL]
