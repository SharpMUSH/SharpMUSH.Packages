        flags: [funsyntax]
      # %0 a character: their encounter's copy when they are in one, else their sheet.
      FUN`VIEW`OF:
        value: |-
          setq(view_copy,u(%!/FUN`ENC`COPY,%0))[if(strlen(%q<view_copy>),%q<view_copy>,u(%!/FUN`VIEW`LIVE,%0))]
        flags: [funsyntax]
      FUN`V:
        value: |-
          json_query(%0,extract,$.%1)
        flags: [funsyntax]
      FUN`V`STAT:
        value: |-
          firstof(after(grab(u(%!/FUN`V,%0,stats),%1=*),=),0)
        flags: [funsyntax]
      FUN`V`HAS:
        value: |-
          t(member(u(%!/FUN`V,%0,moves),%1))
        flags: [funsyntax]
      # %0 a view, %1 stat keys: the highest of them, the first of equals.
      FUN`V`BEST:
        value: |-
          setq(best_view,%0)[last(sortkey(%!/FUN`V`BESTKEY,revwords(%1),n))]
        flags: [funsyntax]
      FUN`V`BESTKEY:
        value: |-
          u(%!/FUN`V`STAT,%q<best_view>,%0)
        flags: [funsyntax]
      # %0 KEY=n pairs, %1 a key, %2 its value: the pairs with it set, or gone when 0.
      FUN`PAIRS`SET:
        value: |-
          squish(iter(%0,if(strmatch(%i0,%1=*),,%i0)) [if(%2,%1=%2)])
        flags: [funsyntax]

      # ---- encounters ---------------------------------------------------------------
      # On the encounter store: ENC`<n> the title, with ROOM, GM (objids), STARTED (secs) and COPY`<dbref number>
      # one copy a member. A member's PBTA`ENCOUNTERS lists theirs in the order they joined; PBTA`USING is the one
      # /use picked.
      FUN`ENC`NAME:
        value: |-
          %0 %([get({{encounters}}/ENC`%0)]%)
        flags: [funsyntax]
      # %0 someone: the encounters in their room, oldest first.
      FUN`ENC`HERE:
        value: |-
          setq(here_room,objid(loc(%0)))[squish(iter(sort(iter(lattr({{encounters}}/ENC`*),last(%i0,`)),n),if(not(comp(get({{encounters}}/ENC`%i0`ROOM),%q<here_room>)),%i0)))]
        flags: [funsyntax]
      FUN`ENC`MEMBER:
        value: |-
          hasattr({{encounters}},ENC`%1`COPY`[after(num(%0),#)])
        flags: [funsyntax]
      # %0 a character: the encounters they are in, in the order they joined.
