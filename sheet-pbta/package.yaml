  # The encounters. Inside the PbtA Sheet, so no player can reach it, and no_command. ENC`<n> an encounter's
  # title, with ROOM and GM (objids), STARTED (secs) and COPY`<dbref number> each member's copy of their sheet,
  # a JSON view. A copy lasts until its member leaves or the encounter ends, however many days that is, and
  # nothing but that encounter reads or writes it.
  - ref: encounters
    type: thing
    name: PbtA Encounters
    location: "{{sheet}}"
    flags: [no_command]
    attributes:
      ENC: |-
        The encounters running now, one branch each.

  # The +help topics, on an object of their own. sheet-pbta-help registers it with +help; without that bridge
  # nothing reads it. HELP`<TOPIC> is a topic, its subtopics the leaves beneath, LOCK`<TOPIC> who may read it.
  - ref: sheet_help
    type: thing
    name: PbtA Sheet Help
    location: "{{sheet}}"
    attributes:
      HELP: |-
        Your character's PbtA sheet, rolling moves against it, and encounters: +sheet, +check and +encounter.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`SHEET: |-
        check encounter
      SEE`CHECK: |-
        sheet encounter
      SEE`ENCOUNTER: |-
        sheet check
      HELP`SHEET: |-
        `+sheet` shows your character's sheet: playbook, XP, forward and ongoing, stats, the moves you have, and hold.

        - `+sheet` shows your own; `+sheet <name>` another character's, when the game lets you read it.
        - `+sheet/chargen` shows the steps of making your character and what to do next.
        - `+sheet/traits` lists every move and stat; `+sheet/move <move>` shows one move's whole text.
        - `+sheet/ledger` lists every entry your sheet is built from, oldest first.

        Your sheet is built from its ledger: each playbook, stat, move and advance is an entry. Until your character is approved you change your own entries freely; after that, `+sheet/advance` spends XP and staff make the other changes.

        For example:

        `+sheet/chargen`

        Output: `1. Playbook done: Warden`

        See `+help sheet chargen` for making a character, `+help sheet play` for forward, ongoing, hold and advances, and `+help check` for rolling.
      HELP`SHEET`CHARGEN: |-
        Making a character takes three steps. `+sheet/chargen` shows each and what comes next.

        1. `+sheet/playbook` lists the playbooks; `+sheet/playbook <playbook>` picks one. If no stat is set yet, you get its suggested stats.
        2. `+sheet/set <stat>=<number>` gives a stat one of the starting numbers, +2, +1, +1, 0, 0 and -1 unless your game changed them. `+sheet/set <stat>=` frees its number again.
        3. `+sheet/take <move>` picks one of your playbook's other moves, as many as it says; `+sheet/drop <move>` gives one back.

        Changing your playbook gives back the moves you picked from the old one.

        For example:

        `+sheet/set str=2`

        Output: `\[SHEET\] Done: Str is +2 on Alice's sheet. Next: +sheet/take <move>, one of Stand Fast or Watchful Eye.`

        When every step is done, your sheet is complete. Once you are approved, staff change it.
      HELP`SHEET`PLAY: |-
        In play you keep your own forward, ongoing and hold:

        - `+sheet/forward <number>` gives you forward: it is added to your next roll, then spent. `+sheet/forward 0` clears it.
        - `+sheet/ongoing <number>` gives you ongoing: it is added to every roll until you clear it with `+sheet/ongoing 0`.
        - `+sheet/hold <move>=<number>` records hold a move gave you, such as `+sheet/hold defend=3`. Set it lower as you spend it; 0 clears it.

        In an encounter these change your copy there, not your sheet. See `+help encounter`.

        Staff give XP; `+sheet/log` shows your XP ledger, every change with who made it and why. Once you are approved, `+sheet/advance <stat>` spends 5 XP on +1 to a stat, up to +3, and `+sheet/advance <move>` on a move from your playbook, unless your game changed the numbers.

        For example:

        `+sheet/advance wis`

        Output: `\[SHEET\] Done: Alice advances: Wis is +2 now (5 XP spent).`
      HELP`CHECK: |-
        `+check <move>` makes a move: it rolls two six-sided dice and adds the stat the move names, where the room sees it.

        - 10 or more is a full hit, 7 to 9 a partial hit, 6 or less a miss. Under the roll you see what the move says for that result.
        - A move that lets you choose the stat takes it after a `/`: `+check defy danger/dex`.
        - `+check <stat>` rolls a stat alone, for anything no move covers.
        - `+check <move>+<n>` or `-<n>` adds or takes away a number for this roll, such as your bond when you aid someone: `+check aid+1`.
        - `+check <move>=<difficulty>` adds the difficulty's modifier: easy +1, standard +0, hard -1, extreme -2 unless your game changed them. A trivial task needs no roll.
        - `/private` rolls where only you see it.

        Your forward and ongoing are added, and the forward is spent. In an encounter you roll from your copy there. Every roll is kept under a number that `rollinfo()` reads back.

        For example:

        `+check hack and slash`

        Output: `\[SHEET\] Alice rolls Hack and Slash (+Str): 2d6\[4, 5\] + 2 = 11: a full hit (roll 42)`
      HELP`ENCOUNTER: |-
        An encounter is a scene played from copies of the sheets, so what happens in it stays there. It lasts until its GM ends it, over as many days as it takes.

        - `+encounter` lists the encounters here and yours; `+encounter <n>` shows one.
        - `+encounter/start [<title>]` starts one in your room. You run it.
        - `+encounter/join [<n>]` takes part with a copy of your sheet as it is now.
        - `+encounter/leave [<n>]` comes out; your copy there is gone.
        - `+encounter/use <n>` picks which copy you roll from, when you are in more than one here.

        While you are in an encounter's room, `+check`, forward, ongoing and hold use your copy in it. Anywhere else, your sheet.

        For example:

        `+encounter/join 1`

        Output: `\[ENCOUNTER\] Alice joins 1 (Goblin ambush).`

        See `+help encounter gm` for running one.
      HELP`ENCOUNTER`GM: |-
        Whoever starts an encounter runs it; sheet keepers run any. Give the number after `=` when the room has more than one.

        - `+encounter/add <name>[=<n>]` brings someone in the room into it, with a copy of their sheet.
        - `+encounter/remove <name>[=<n>]` takes them out; their copy goes.
        - `+encounter/keep <name>[=<n>]` writes their forward, ongoing and hold from the copy to their sheet.
        - `+encounter/end [<n>]` ends it. Every copy goes, and nothing is written back unless you kept it first.

        For example:

        `+encounter/keep Alice=1`

        Output: `\[ENCOUNTER\] Done: Alice's sheet keeps the forward, ongoing and hold from 1 (Goblin ambush).`
      HELP`SHEET`CREDITS: |-
        The stats and the Dungeon World moves on this sheet \(the eight basic moves, and Last Breath, Take Watch, Undertake a Perilous Journey, Carouse, Supply, Recruit and Outstanding Warrants\) are from Dungeon World by Sage LaTorra and Adam Koebel, licensed under the Creative Commons Attribution 3.0 Unported License \(https://creativecommons.org/licenses/by/3.0/\). Each move's text is as the authors wrote it, split into the whole move and the part for each result.

        The Warden and Wayfarer playbooks and their moves, the help and the messages are this sheet's own.
      LOCK`SHEET`STAFF: |-
        perm^softcode.pbta.admin
      HELP`SHEET`STAFF: |-
        Sheet keepers \(`softcode.pbta.admin`, or the PbtA Sheet Keeper role\) read every sheet and change any character's at any time:

        - `/set`, `/take`, `/drop` and `/advance` take `<name>/` first: `+sheet/set Alice/str=3`. A keeper may set a stat up to the highest, give a move from any playbook, and give an advance without XP.
        - `/playbook`, `/forward` and `/ongoing` take `<name>=` first: `+sheet/playbook Alice=wayfarer`.
        - `+sheet/xp <name>=+<n> [<reason>]` gives XP, `-<n>` takes, `<n>` sets: `+sheet/xp Alice=+1 Ended the siege`. `+sheet/log <name>` shows their XP ledger; `+sheet/rebuild <name>` works their XP out again from it.
        - `+sheet/ledger <name>` lists their entries. `+sheet/revoke <name>/<n>` takes one back.
        - `+sheet/clear <name>` revokes their whole build, so character creation starts again. XP, forward, ongoing and hold stay.

        Every keeper change is a new ledger entry, so nothing is lost: a revoke or clear is an entry too.

        `@role/assign <player>=pbta-sheet-keeper` makes someone a keeper.
      LOCK`SHEET`SETTINGS: |-
        perm^config.admin
      HELP`SHEET`SETTINGS: |-
        `+config pbta` lists the settings and `+config pbta/<setting>=<value>` changes one \(`config.admin`\):

        - `array`: the starting numbers a new character gives their stats \(`2 1 1 0 0 -1`\).
        - `max`: the highest a stat goes \(+3\).
        - `advance`: the XP an advance costs \(5\).
        - `critical`: whether 12 or more is a critical hit \(no\).
        - `modifiers`: what easy, standard, hard and extreme add \(`1 0 -1 -2`\).
        - `public`: whether anyone may read anyone's sheet \(no\).
        - `stats`, `moves` and `playbooks`: the lists. A move names its stat \(several to choose from, or none\), its playbook \(none for a basic move\), its text and what each result says. A playbook has suggested stats, starting moves, and how many other moves a new character picks.

        For example, `+config/add pbta/moves/sneak=Sneak` adds a move; `+config pbta/moves/sneak/stat=dex` makes it roll with Dex.

        Removing a stat or a move leaves the ledger as it is, but the sheet stops showing it.
