      # matched exactly comes first, then a move, then the start of a stat's name.
      API`FIND:
        value: |-
          setqm(api_stat,u(%!/FUN`LIST`FIND,STAT,%0),api_move,u(%!/FUN`LIST`FIND,MOVE,%0))[lcstr(cond(cand(strlen(%q<api_stat>),cor(not(comp(%q<api_stat>,ucstr(trim(%0)))),not(comp(lcstr(u(%!/FUN`STAT`LABEL,%q<api_stat>)),lcstr(trim(%0)))))),%q<api_stat>,strlen(%q<api_move>),move-%q<api_move>,%q<api_stat>))]
        flags: [VISUAL]
      API`LABEL:
        value: |-
          if(strlen(u(%!/FUN`TRAIT`MOVE,%0)),u(%!/FUN`MOVE`LABEL,u(%!/FUN`TRAIT`MOVE,%0)),u(%!/FUN`STAT`LABEL,ucstr(%0)))
        flags: [VISUAL]
      # %0 a character, %1 a key: what it adds to a roll. A move adds its stat, the best for them of several,
      # 0 when it names none.
      API`RATING:
        value: |-
          setqm(rating_view,u(%!/FUN`VIEW`LIVE,%0),rating_move,u(%!/FUN`TRAIT`MOVE,%1))[if(cand(strlen(%q<rating_move>),not(words(u(%!/FUN`MOVE`STATS,%q<rating_move>)))),0,u(%!/FUN`V`STAT,%q<rating_view>,if(strlen(%q<rating_move>),u(%!/FUN`V`BEST,%q<rating_view>,u(%!/FUN`MOVE`STATS,%q<rating_move>)),ucstr(%1))))]
        flags: [VISUAL]
      # %0 a character, %1 a key: 1 when they may roll it (every stat; a move they have). Without a key, 1 when
      # they have a sheet.
      API`HAS:
        value: |-
          if(strlen(%1),if(strlen(u(%!/FUN`TRAIT`MOVE,%1)),u(%!/FUN`V`HAS,u(%!/FUN`VIEW`LIVE,%0),u(%!/FUN`TRAIT`MOVE,%1)),1),hasattr(%0,PBTA))
        flags: [VISUAL]
      # %0 a difficulty word (easy to extreme) or a number: what it adds, or nothing. Trivial is nothing: it is
      # not rolled.
      API`TARGET:
        value: |-
          cond(member(easy standard hard extreme,lcstr(%0)),extract(get(%!/DATA`CONFIG`MODIFIERS),member(easy standard hard extreme,lcstr(%0)),1),isint(edit(%0,+,)),edit(%0,+,))
        flags: [VISUAL]
      # %0 the total: fail on 6 or less, partial on 7-9, success on 10 or more, crit-success on 12 or more when
      # the game uses criticals.
      API`TIER:
        value: |-
          cond(not(isint(%0)),,lte(%0,6),fail,lte(%0,9),partial,cand(get(%!/DATA`CONFIG`CRITICAL),gte(%0,12)),crit-success,success)
        flags: [VISUAL]
      # %0 a character: their forward and ongoing together, what the next roll adds.
      API`MODIFIERS:
        value: |-
          add(default(%0/PBTA`FORWARD,0),default(%0/PBTA`ONGOING,0))
        flags: [VISUAL]
      # %0 a character: spends their forward, which lasts one roll. Returns what it was.
      API`SPEND:
        value: |-
          setq(spend_forward,default(%0/PBTA`FORWARD,0))[if(%q<spend_forward>,attrib_set(%0/PBTA`FORWARD))]%q<spend_forward>
        flags: [VISUAL]
      # %0 a character, %1 XP to give (or take, below 0), %2 why (Reward when empty): an XP ledger entry, never
      # below 0; returns the new total.
      API`AWARD:
        value: |-
          setqm(award_old,default(%0/PBTA`XP,0),award_new,max(0,add(default(%0/PBTA`XP,0),%1)))[u(%!/FUN`BOOK`ADD,%0,XP,sub(%q<award_new>,%q<award_old>),firstof(%2,Reward))]%q<award_new>
        flags: [VISUAL]
      FUN`API`ROOT:
        value: |-
          if(hasattr(%0,PBTA),,attrib_set(%0/PBTA,This character's PbtA sheet. +sheet shows it.)[set(%0/PBTA,wizard)][set(%0/PBTA,no_command)])
        flags: [funsyntax]
      # ---- the XP and money ledgers --------------------------------------------------------
      # Each book is its own ledger, apart from the sheet's: PBTA`<BOOK>LEDGER`<n>, a JSON object with n, delta,
      # total (the running total after it), item and label (what it counts, when the book counts more than one
      # thing), reason, by (an objid) and at (secs), with the wizard attribute flag. The totals on the sheet are a
      # cache of the latest entry's total: FUN`BOOK`ADD is the only thing that writes either, and +sheet/rebuild
      # works every cache out again from the ledgers.
      # %0 a book, %1 an item: the attribute holding its cached total.
      FUN`BOOK`CACHE:
        value: |-
          PBTA`XP
        flags: [funsyntax]
      # %0 a book: 1 when its cache keeps the item's label with the total, as <total>|<label>.
      FUN`BOOK`LABELLED:
        value: |-
          0
        flags: [funsyntax]
      # %0 a character, %1 a book: the numbers of its entries, oldest first.
      FUN`BOOK`NUMS:
        value: |-
          sort(iter(lattr(%0/PBTA`%1LEDGER`*),if(hasflag(%0/%i0,wizard),last(%i0,`))),n)
        flags: [funsyntax]
      # %0 a character, %1 a book, %2 the change, %3 why, %4 the item, %5 its label: a new entry, then the cached
      # total. Nothing for no change.
      FUN`BOOK`ADD:
        value: |-
          if(%2,[setqm(book_cache,u(%!/FUN`BOOK`CACHE,%1,%4),book_n,inc(lmax(0 [iter(lattr(%0/PBTA`%1LEDGER`*),last(%i0,`))])))][setq(book_had,get(%0/%q<book_cache>))][setqm(book_total,add(firstof(before(%q<book_had>,|),0),%2),book_label,firstof(%5,after(%q<book_had>,|)))][u(%!/FUN`API`ROOT,%0)][attrib_set(%0/PBTA`%1LEDGER`%q<book_n>,json(object,n,%q<book_n>,delta,%2,total,%q<book_total>,item,json(string,%4),label,json(string,%q<book_label>),reason,json(string,left(%3,200)),by,json(string,objid(%#)),at,secs()))][set(%0/PBTA`%1LEDGER`%q<book_n>,wizard)][u(%!/FUN`BOOK`SET,%0,%q<book_cache>,%q<book_total>,if(u(%!/FUN`BOOK`LABELLED,%1),%q<book_label>))][u(%!/FUN`BOOK`TRIM,%0,%1)])
        flags: [funsyntax]
      # %0 a character, %1 a cache attribute, %2 the total, %3 a label: writes the cache; 0 removes it.
      FUN`BOOK`SET:
        value: |-
          if(%2,[attrib_set(%0/%1,if(strlen(%3),%2|%3,%2))][set(%0/%1,wizard)],if(hasattr(%0/%1),attrib_set(%0/%1)))
        flags: [funsyntax]
      # %0 a character, %1 a book: past DATA`LOG`MAX entries, the oldest one a later entry for the same item
      # replaces goes, so the latest entry for each item, and with it every total, always stays.
      FUN`BOOK`TRIM:
        value: |-
          setqm(bt_drop,,bt_nums,sort(iter(lattr(%0/PBTA`%1LEDGER`*),last(%i0,`)),n))[if(gt(words(%q<bt_nums>),get(%!/DATA`LOG`MAX)),setq(bt_drop,first(iter(extract(%q<bt_nums>,1,50),if(gt(words(grep(%0,PBTA`%1LEDGER`*,"item":"[json_query(get(%0/PBTA`%1LEDGER`%i0),extract,$.item)]")),1),%i0)))))][if(strlen(%q<bt_drop>),attrib_set(%0/PBTA`%1LEDGER`%q<bt_drop>))]
        flags: [funsyntax]
      # %0 a character, %1 a book, %2 an item: its latest entry.
      FUN`BOOK`LAST:
        value: |-
          setq(bl_n,last(iter(u(%!/FUN`BOOK`NUMS,%0,%1),if(not(comp(json_query(get(%0/PBTA`%1LEDGER`%i0),extract,$.item),%2)),%i0))))[if(strlen(%q<bl_n>),get(%0/PBTA`%1LEDGER`%q<bl_n>))]
        flags: [funsyntax]
      # %0 a character, %1 a book, %2 an item: writes its cache from its latest entry.
      FUN`BOOK`REBUILDITEM:
        value: |-
          setq(br_last,u(%!/FUN`BOOK`LAST,%0,%1,%2))[u(%!/FUN`BOOK`SET,%0,u(%!/FUN`BOOK`CACHE,%1,%2),if(strlen(%q<br_last>),json_query(%q<br_last>,extract,$.total),0),if(cand(strlen(%q<br_last>),u(%!/FUN`BOOK`LABELLED,%1)),json_query(%q<br_last>,extract,$.label)))]
        flags: [funsyntax]
      # %0 a character, %1 a book: the items it has entries for.
      FUN`BOOK`ITEMS:
        value: |-
          setunion(iter(u(%!/FUN`BOOK`NUMS,%0,%1),json_query(get(%0/PBTA`%1LEDGER`%i0),extract,$.item)),)
        flags: [funsyntax]
      # %0 a character, %1 a book, %2 its title, %3 its unit (after the item's label), %4 how many: the
      # latest entries, oldest first.
      FUN`SCREEN`BOOK:
        value: |-
          setq(sb_nums,u(%!/FUN`BOOK`NUMS,%0,%1))[setq(sb_nums,extract(%q<sb_nums>,max(1,sub(words(%q<sb_nums>),dec(%4))),%4))][tone(strong,%2)]%r[if(words(%q<sb_nums>),ldatatable(lit({"nowrap":"1|2|3|4|6","grow":"||||1"}),#|When|Change|>Total|Why|By,iter(%q<sb_nums>,u(%!/FUN`DISPLAY`BOOKROW,get(%0/PBTA`%1LEDGER`%i0),%3),%b,%*<^>),%*<^>),tone(muted,Nothing yet.))]
        flags: [funsyntax]
      FUN`DISPLAY`BOOKROW:
        value: |-
          [json_query(%0,extract,$.n)]|[timefmt($Y-$m-$d,json_query(%0,extract,$.at))]|[u(%!/FUN`DISPLAY`SIGNED,json_query(%0,extract,$.delta))] [trim([json_query(%0,extract,$.label)] %1)]|[json_query(%0,extract,$.total)]|[firstof(json_query(%0,extract,$.reason),-)]|[name(json_query(%0,extract,$.by))]
        flags: [funsyntax]
      # %0 a character: the sheet's ledger merged, the rows in force. Kept as a cache in PBTA`MERGED once worked
      # out; every ledger write drops it.
      FUN`LEDGER`MERGED:
        value: |-
          if(cand(hasattr(%0/PBTA`MERGED),hasflag(%0/PBTA`MERGED,wizard)),get(%0/PBTA`MERGED),[setq(lm_rows,u(%!/FUN`LEDGER`LIVE,u(%!/FUN`LEDGER`ROWS,%0)))][if(cand(words(%q<lm_rows>),hasattr(%0,PBTA)),null([attrib_set(%0/PBTA`MERGED,%q<lm_rows>)][set(%0/PBTA`MERGED,wizard)]))]%q<lm_rows>)
        flags: [funsyntax]
      # %0 a character: every cache worked out again from the ledgers.
      FUN`BOOK`REBUILD:
        value: |-
          [if(hasattr(%0/PBTA`MERGED),attrib_set(%0/PBTA`MERGED))][u(%!/FUN`BOOK`REBUILDITEM,%0,XP,)]
        flags: [funsyntax]
      # %0 the character: the latest 30 XP ledger entries, oldest first.
      FUN`SCREEN`LOG:
        value: |-
          box([u(%!/FUN`SCREEN`BOOK,%0,XP,XP,XP,30)]%r[rule()]%r[tone(muted,Every change to XP%, with who made it.)],Ledger: [name(%0)])
        flags: [funsyntax]
      # Named: %<roller> an objid, %<trait> a key, %<stat> a stat key for a move that offers several (the best
      # when empty), %<modifier> a number to add, %<target> the difficulty's modifier or nothing. Rolls 2d6 plus the
      # stat and keeps the roll (roll() record), and returns {"tier","total","target","margin","label","text",
      # "roll","formula","move","stat","outcome"}: margin is always empty, outcome the move's text for the tier.
      # #-1 and why when the trait, stat or roller is wrong, or the roller lacks the move.
      API`CHECK:
        value: |-
          if(hastype(%<roller>,player),u(%!/FUN`CHECK`VIEW,u(%!/FUN`VIEW`LIVE,%<roller>),%<trait>,%<stat>,%<modifier>,%<target>),#-1 There is no character to roll for.)
        flags: [VISUAL]
      # %0 a view, %1 a trait key, %2 a stat key or nothing, %3 a number to add, %4 the difficulty's modifier.
      FUN`CHECK`VIEW:
        value: |-
          setqm(check_api_move,u(%!/FUN`TRAIT`MOVE,%1),
          check_api_stat,cond(strlen(u(%!/FUN`TRAIT`MOVE,%1)),if(strlen(%2),ucstr(%2),u(%!/FUN`V`BEST,%0,u(%!/FUN`MOVE`STATS,u(%!/FUN`TRAIT`MOVE,%1)))),1,ucstr(%1)))[cond(cand(strlen(%q<check_api_move>),not(hasattr({{store}},MOVE`%q<check_api_move>))),#-1 There is no move '%1'.,cand(not(strlen(%q<check_api_move>)),not(u(%!/FUN`IS`STAT,%q<check_api_stat>))),#-1 There is no stat '%1'.,cand(strlen(%q<check_api_move>),not(u(%!/FUN`V`HAS,%0,%q<check_api_move>))),#-1 You don't have [u(%!/FUN`MOVE`LABEL,%q<check_api_move>)].,cand(strlen(%q<check_api_move>),strlen(%2),not(member(u(%!/FUN`MOVE`STATS,%q<check_api_move>),%q<check_api_stat>))),#-1 [u(%!/FUN`MOVE`LABEL,%q<check_api_move>)] [u(%!/FUN`DISPLAY`ROLLSWITH,%q<check_api_move>)].,1,u(%!/FUN`CHECK`ROLLED,%q<check_api_move>,%q<check_api_stat>,add(if(strlen(%q<check_api_stat>),u(%!/FUN`V`STAT,%0,%q<check_api_stat>),0),firstof(%3,0),firstof(%4,0)),%4))]
        flags: [funsyntax]
      # %0 the move key or nothing, %1 the stat key or nothing, %2 what is added, %3 the difficulty's modifier.
      FUN`CHECK`ROLLED:
        value: |-
          setqm(rolled_formula,2d6[if(gte(%2,0),+%2,%2)],
          rolled,roll(%q<rolled_formula>,,record),
          rolled_total,json_query(%q<rolled>,extract,$.total),
          rolled_tier,u(%!/API`TIER,%q<rolled_total>))[json(object,tier,json(string,%q<rolled_tier>),total,%q<rolled_total>,target,json(string,%3),margin,json(string,),label,json(string,u(%!/FUN`CHECK`LABEL,%0,%1)),text,json(string,json_query(%q<rolled>,extract,$.text)),roll,json_query(%q<rolled>,extract,$.id),formula,json(string,%q<rolled_formula>),move,json(string,lcstr(%0)),stat,json(string,lcstr(%1)),outcome,json(string,if(strlen(%0),get({{store}}/MOVE`%0`[switch(%q<rolled_tier>,crit-success,HIT,success,HIT,partial,PARTIAL,MISS)]))))]
        flags: [funsyntax]
      # "Defy Danger (+Dex)", "Last Breath", or a stat's label.
      FUN`CHECK`LABEL:
        value: |-
          if(strlen(%0),u(%!/FUN`MOVE`LABEL,%0)[if(strlen(%1),%b%(+[u(%!/FUN`STAT`LABEL,%1)]%))],u(%!/FUN`STAT`LABEL,%1))
        flags: [funsyntax]

      # ---- lifecycle ----------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP:
        value: |-
          @command/add/noparse/rsnoparse +sheet; @hook/override/inline +sheet=%!,CMD`SHEET; @command/add/noparse/rsnoparse +check; @hook/override/inline +check=%!,CMD`CHECK; @command/add/noparse/rsnoparse +encounter; @hook/override/inline +encounter=%!,CMD`ENCOUNTER
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

  # The lists. Inside the PbtA Sheet, so no player can reach it, and no_command, so nothing kept on it is ever
  # matched as a command. STAT`<KEY> a stat's label with ORDER; MOVE`<KEY> a move's label with STAT, PLAYBOOK,
  # TEXT, HIT, PARTIAL, MISS, SOURCE and ORDER; PLAYBOOK`<KEY> a playbook's label with STATS, MOVES and ORDER.
  # Staff change them with +config pbta/stats, /moves and /playbooks. The values are read with get(), never
  # evaluated.
  #
  # The stats and the moves whose SOURCE is Dungeon World are from Dungeon World by Sage LaTorra and Adam Koebel,
  # under CC BY 3.0 (see NOTICE.md). The two playbooks and their moves are this package's own.
  - ref: store
    type: thing
    name: PbtA Sheet Store
    location: "{{sheet}}"
    flags: [no_command]
    attributes:
      STAT: |-
        The stats every sheet has, one branch each, keyed as a player types it.
      STAT`STR: |-
        Str
      STAT`STR`ORDER: |-
        1
      STAT`DEX: |-
        Dex
      STAT`DEX`ORDER: |-
        2
      STAT`CON: |-
        Con
      STAT`CON`ORDER: |-
        3
      STAT`INT: |-
        Int
      STAT`INT`ORDER: |-
        4
      STAT`WIS: |-
        Wis
      STAT`WIS`ORDER: |-
        5
      STAT`CHA: |-
        Cha
      STAT`CHA`ORDER: |-
        6
      PLAYBOOK: |-
        The playbooks, one branch each, with STATS (suggested), MOVES (starting moves) and PICK (how many of its other moves a new character picks) beneath.
      PLAYBOOK`WARDEN: |-
        Warden
      PLAYBOOK`WARDEN`STATS: |-
        con=2 str=1 wis=1 dex=0 cha=0 int=-1
      PLAYBOOK`WARDEN`MOVES: |-
        hold-the-line
      PLAYBOOK`WARDEN`PICK: |-
        1
      PLAYBOOK`WARDEN`ORDER: |-
        1
      PLAYBOOK`WAYFARER: |-
        Wayfarer
      PLAYBOOK`WAYFARER`STATS: |-
        wis=2 dex=1 int=1 cha=0 con=0 str=-1
      PLAYBOOK`WAYFARER`MOVES: |-
        know-the-way
      PLAYBOOK`WAYFARER`PICK: |-
        1
      PLAYBOOK`WAYFARER`ORDER: |-
        2
      MOVE: |-
        The moves, one branch each. A move with no PLAYBOOK is a basic move.
      MOVE`HOLD-THE-LINE: |-
        Hold the Line
      MOVE`HOLD-THE-LINE`STAT: |-
        con
      MOVE`HOLD-THE-LINE`PLAYBOOK: |-
        warden
      MOVE`HOLD-THE-LINE`TEXT: |-
        When you stand your ground so that others can get away, roll+Con. On a 10+, everyone you cover gets clear and nothing gets past you. On a 7–9, they get clear, but you take a blow or are driven back; the GM says which.
      MOVE`HOLD-THE-LINE`HIT: |-
        On a 10+, everyone you cover gets clear and nothing gets past you.
      MOVE`HOLD-THE-LINE`PARTIAL: |-
        On a 7–9, they get clear, but you take a blow or are driven back; the GM says which.
      MOVE`HOLD-THE-LINE`ORDER: |-
        40
      MOVE`KNOW-THE-WAY: |-
        Know the Way
      MOVE`KNOW-THE-WAY`STAT: |-
        wis
      MOVE`KNOW-THE-WAY`PLAYBOOK: |-
        wayfarer
      MOVE`KNOW-THE-WAY`TEXT: |-
        When you lead the party through country you have travelled before, roll+Wis. On a 10+, you arrive where and when you meant to. On a 7–9, you arrive, but late, tired or somewhere a little off; the GM says which.
      MOVE`KNOW-THE-WAY`HIT: |-
        On a 10+, you arrive where and when you meant to.
      MOVE`KNOW-THE-WAY`PARTIAL: |-
        On a 7–9, you arrive, but late, tired or somewhere a little off; the GM says which.
      MOVE`KNOW-THE-WAY`ORDER: |-
        41
      MOVE`READ-THE-SKY: |-
        Read the Sky
      MOVE`READ-THE-SKY`STAT: |-
        wis
      MOVE`READ-THE-SKY`PLAYBOOK: |-
        wayfarer
      MOVE`READ-THE-SKY`TEXT: |-
        When you study the sky before setting out, roll+Wis. On a 10+, you know the coming day's weather, and the party takes +1 forward on the road. On a 7–9, you know the weather, but not when it will turn.
      MOVE`READ-THE-SKY`HIT: |-
        On a 10+, you know the coming day's weather, and the party takes +1 forward on the road.
      MOVE`READ-THE-SKY`PARTIAL: |-
        On a 7–9, you know the weather, but not when it will turn.
      MOVE`READ-THE-SKY`ORDER: |-
        42
      MOVE`STAND-FAST: |-
        Stand Fast
      MOVE`STAND-FAST`STAT: |-
        con
      MOVE`STAND-FAST`PLAYBOOK: |-
        warden
      MOVE`STAND-FAST`TEXT: |-
        When something tries to move you from where you stand, roll+Con. On a 10+, you do not budge, and you take +1 forward against it. On a 7–9, you hold your place, but it costs you; the GM says what.
      MOVE`STAND-FAST`HIT: |-
        On a 10+, you do not budge, and you take +1 forward against it.
      MOVE`STAND-FAST`PARTIAL: |-
        On a 7–9, you hold your place, but it costs you; the GM says what.
      MOVE`STAND-FAST`ORDER: |-
        43
      MOVE`WATCHFUL-EYE: |-
        Watchful Eye
      MOVE`WATCHFUL-EYE`STAT: |-
        wis
      MOVE`WATCHFUL-EYE`PLAYBOOK: |-
        warden
      MOVE`WATCHFUL-EYE`TEXT: |-
        When you keep watch over a place you guard, roll+Wis. On a 10+, nothing comes near without your knowing, and you hold 1 to act first when it does. On a 7–9, you see it coming, but only just.
      MOVE`WATCHFUL-EYE`HIT: |-
        On a 10+, nothing comes near without your knowing, and you hold 1 to act first when it does.
      MOVE`WATCHFUL-EYE`PARTIAL: |-
        On a 7–9, you see it coming, but only just.
      MOVE`WATCHFUL-EYE`ORDER: |-
        44
      MOVE`FORAGE: |-
        Forage
      MOVE`FORAGE`STAT: |-
        wis
      MOVE`FORAGE`PLAYBOOK: |-
        wayfarer
      MOVE`FORAGE`TEXT: |-
        When you spend a few hours living off the land, roll+Wis. On a 10+, you find food and water for the whole party for a day. On a 7–9, you find enough for yourself and one other.
      MOVE`FORAGE`HIT: |-
        On a 10+, you find food and water for the whole party for a day.
      MOVE`FORAGE`PARTIAL: |-
        On a 7–9, you find enough for yourself and one other.
      MOVE`FORAGE`ORDER: |-
        45
      MOVE`HACK-AND-SLASH: |-
        Hack and Slash
      MOVE`HACK-AND-SLASH`STAT: |-
        str
      MOVE`HACK-AND-SLASH`TEXT: |-
