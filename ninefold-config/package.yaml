format: "1.20"
package: ninefold-config
title: "Ninefold: +config settings"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the Ninefold settings into +config: registers them with the +config registry, so staff see and change them with +config ninefold."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [ninefold, config, bridge]
category: Games
bridge: true
requires_server: ">=1.0"
verified_server: "1.0"

# A bridge: it joins two packages that do not know about each other. ninefold declares its settings as
# DATA`CONFIG`<NAME>, with their types and limits, and reads them with v() whether or not +config is installed.
# This package is the one leaf that tells the +config registry where they are.
depends:
  - package: ninefold
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH.Packages
      path: ninefold/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`NINEFOLD: |-
        {{ninefold/ninefold}}
