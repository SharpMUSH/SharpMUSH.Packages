        flags: [funsyntax]

      # ---- the sheet API ------------------------------------------------------------
      # What other packages call: u({{sheet-fate/sheet}}/API`<NAME>,...). Every sheet package has these names.
      # They read and roll; API`AWARD is the one that writes.
