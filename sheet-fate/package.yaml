        flags: [funsyntax]
      # %0 typed text: a rating from a number (+3, 3) or a ladder word, or nothing.
      FUN`LADDER`READ:
        value: |-
          cond(isint(setr(ladder_number,edit(trim(%0),+,))),%q<ladder_number>,1,first(iter(lnum(-2,8),if(not(comp(lcstr(u(%!/FUN`LADDER`WORD,%i0)),lcstr(trim(%0)))),%i0))))
        flags: [funsyntax]

      # %0 the character, %1 a track: its boxes, their own when a keeper or another package gave them some.
      FUN`TRACK`BOXES:
        value: |-
          default(%0/FATE`BOXES`%1,default({{store}}/TRACK`%1`BOXES,3))
        flags: [funsyntax]

      # ---- fate points ----------------------------------------------------------------
      FUN`POINTS`REFRESH:
        value: |-
          default(%0/FATE`REFRESH,get(%!/DATA`CONFIG`REFRESH))
        flags: [funsyntax]

      # ---- who may do what ----------------------------------------------------------
      FUN`PERM`KEEPER:
        value: |-
