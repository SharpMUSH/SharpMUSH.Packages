  # The +help topics, on an object of their own. sheet-fate-help registers it with +help; without that bridge
  # nothing reads it. HELP`<TOPIC> is a topic, its subtopics the leaves beneath, LOCK`<TOPIC> who may read it.
  - ref: sheet_help
    type: thing
    name: Fate Sheet Help
    location: "{{sheet}}"
    attributes:
      HELP: |-
        Your character's Fate sheet, making it, advancing it, rolling against it, encounters and the opposition in them: +sheet, +chargen, +check, +encounter and +npc.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`SHEET: |-
        chargen check encounter
      SEE`CHECK: |-
        sheet
      SEE`CHARGEN: |-
        sheet
      SEE`ENCOUNTER: |-
        sheet check npc
      SEE`NPC: |-
        encounter
      HELP`SHEET: |-
        `+sheet` shows your character's sheet: fate points, aspects, skills on the ladder, stress and consequences.

        - `+sheet` shows your own; `+sheet <name>` another character's, when the game lets you read it.
        - `+sheet/set <skill>=<rating>` rates a skill, as a number or a ladder word: `+sheet/set fight=3`, `+sheet/set notice=fair`. Leave the rating out to put it back to Mediocre.
        - `+sheet/aspect <slot>=<aspect>` writes an aspect: `concept`, `trouble`, or a number for the others.
        - `+sheet/stunt <slot>=<stunt>` writes a stunt in a numbered slot: `+sheet/stunt 1=Backstab: use Stealth to attack when they don't see you.`
        - `+sheet/traits` lists the skills and the ladder.

        You rate skills and write aspects and stunts until your character is approved; then staff change them. The ladder runs from Terrible \(-2\) through Mediocre \(+0\), Average, Fair, Good and Great \(+4\) to Legendary \(+8\). Your game may rate the six approaches instead of skills.

        For example:

        `+sheet/aspect trouble=Owes the Duke a favour`

        Output: `\[SHEET\] Done: Trouble on Alice's sheet: Owes the Duke a favour`

        See `+help chargen` for making a character step by step, `+help sheet play` for stress and fate points, `+help sheet ledger` for where each rating comes from, `+help sheet advance` for improving your character, and `+help check` for rolling.
      HELP`SHEET`PLAY: |-
        In play you keep your own stress, consequences and fate points:

        - `+sheet/stress <track>=<box>` marks a stress box: `+sheet/stress physical=2`. `+sheet/stress <track>=clear` empties the track.
        - `+sheet/recover` clears every stress box, once a scene is over.
        - `+sheet/consequence <slot>=<aspect>` takes a consequence: `+sheet/consequence mild=Bruised ribs`. Leave the aspect out to clear it.
        - `+sheet/spend \[<what for>\]` spends a fate point where the room sees it: `+sheet/spend Invoking Owes the Duke`.

        For example:

        `+sheet/spend Invoking Never leaves a friend`

        Output: `\[SHEET\] Alice spends a fate point: Invoking Never leaves a friend. 2 left.`

        Staff give fate points back at the start of a session, up to your refresh. While you are in an encounter in the room you are in, these commands change the encounter's copy instead of your sheet: see `+help encounter`.
      HELP`SHEET`LEDGER: |-
        Your ratings, stress boxes and refresh are built from a ledger of grants. Each grant comes from somewhere: your own `+sheet/set`, a staff member, or a package such as a mode. A grant either sets a value or adds to it.

        - `+sheet/ledger` lists your grants, numbered. `+sheet/ledger <name>` lists another character's, when you may read their sheet.

        A value is the highest grant that sets it, or the game's own when none does, with every grant that adds on top. Taking one grant away leaves the rest, so a staff bonus outlasts a change you make yourself.

        For example:

        `+sheet/ledger`

        Output: a table with the columns `#`, `From`, `For` and `Grant`, such as `1  sheet  Fight  set to Good \(+3\)`.
      HELP`SHEET`ADVANCE: |-
        Staff give awards for play: a milestone at the end of a session, a breakthrough at the end of an arc, sometimes a power-up after one. You spend them to change your character.

        - A milestone buys one change: switch two skills' ratings, rewrite an aspect other than your high concept, or rewrite a stunt or buy a new one for a point of refresh.
        - A breakthrough gives a milestone, a skill step \(one skill up a step, even from Mediocre\) and a new high concept.
        - A power-up gives a point of refresh or a second skill step.
        - `+sheet/advance` shows what you have to spend and every option. Packages add options, such as switching modes.
        - `+sheet/advance <option> <what>\[=<value>\]` spends one: `+sheet/advance swap fight=shoot`, `+sheet/advance skill notice`, `+sheet/advance aspect 2=Never again`.
        - `+sheet/advances \[<name>\]` lists every award: who gave it, when, why, what is left and what it bought.

        Your refresh never goes below 1. Each award stays on the list; staff void a mistaken one, and the list says so.

        For example:

        `+sheet/advance skill fight`

        Output: `\[SHEET\] Done: Alice spends a skill step from award 5: Fight is now Average \(+1\).`
      HELP`CHARGEN: |-
        `+chargen` walks you through making your character. It lists the steps, ticks the ones you have done, and explains the next one.

        - `+chargen` shows your own steps. Staff and anyone who may read a sheet use `+chargen <name>`.
        - A step marked optional can stay undone. Your character is complete when every other step is ticked.
        - The steps are done with the usual commands, such as `+sheet/aspect` and `+sheet/set`. Run `+chargen` again to see what is left.

        Packages add steps of their own, such as picking modes. Once your character is approved, staff change your sheet.

        For example:

        `+chargen`

        Output:
        ```
        \[x\] Aspects
        \[ \] Ratings
        \[ \] Stunts \(optional\)
        Next: Ratings
        ```
      HELP`ENCOUNTER: |-
        An encounter keeps its own copy of each player's fate points, stress and consequences, so a fight or a chase does not change your sheet unless the GM says so. A room can hold several encounters, and one can run for days.

        - `+encounter` lists the encounters in the room, or shows the one there is: who is in it, their stress and consequences, the opposition, the aspects on the scene and whose turn it is. `+encounter <number>` shows one.
        - `+encounter/start \[<title>\]` begins one. You run it as its GM.
        - `+encounter/join \[<number>\]` takes part. The copy is taken from your sheet now.
        - `+encounter/use <number>` picks which of your encounters your play goes to when you are in several in one room. Without it, the last one you joined is used.
        - `+encounter/leave \[<number>\]` takes you out. Your copy is dropped and your sheet is as it was.

        While you are in the room of an encounter you joined, `+sheet/stress`, `/consequence`, `/spend` and `/recover` change its copy, and `+sheet` shows it. Anywhere else you play on your sheet itself.

        For example:

        `+encounter/start Warehouse brawl`

        Output: `\[SHEET\] Alice starts Warehouse brawl \(encounter 1\). +encounter/join 1 takes part with a copy of your fate points, stress and consequences.`

        See `+help encounter conflict` for taking turns, aspects and conceding, and `+help encounter gm` for running one.
      HELP`ENCOUNTER`CONFLICT: |-
        A conflict goes in exchanges. In each, everyone not out of it acts once: one roll to overcome, create an advantage or attack. Defending takes no turn.

        - `+encounter/act` takes your turn. When you are done, `+encounter/act <name>` hands the turn to someone who has not acted yet, a player or an NPC.
        - `+encounter/aspect <aspect>\[=<free invokes>\]` puts an aspect on the scene, such as one you created an advantage for. `+encounter/boost <aspect>` puts a boost there: one free invoke, and it is gone once used.
        - `+encounter/invoke <number>\[=<what for>\]` invokes one for +2 or a reroll. A free invoke is used first; otherwise it costs a fate point from your copy.
        - `+encounter/unaspect <number>` takes off an aspect you put there.
        - `+encounter/concede` gives in before a roll goes against you. You get a fate point, and one more for each consequence you took in this encounter, and you say how you get out of it.

        When the GM hits you, you are told how many shifts to take: one shift for each stress box you mark with `+sheet/stress`, and a consequence takes 2, 4 or 6 with `+sheet/consequence`. What you cannot take takes you out.

        For example:

        `+encounter/invoke 1=jumping the crates`

        Output: `\[SHEET\] Bob uses a free invoke of Crates Everywhere: jumping the crates: +2 or a reroll.`
      HELP`ENCOUNTER`GM: |-
        Whoever starts an encounter runs it, and sheet keepers run every encounter. Without a number, these act on the one you picked with `+encounter/use`, else the one you run here:

        - `+encounter/add <name>\[=<number>\]` brings in someone in the room. `+encounter/remove <name>\[=<number>\]` takes a player or an NPC out.
        - `+encounter/npc <opposition>\[=<how many>\]` brings in NPCs you made with `+npc`, numbered when there are several. `+encounter/stats <npc>` shows one in full.
        - `+encounter/exchange` starts the next exchange. The first gives you a fate point for each player.
        - `+encounter/pool \[<n>|+<n>|-<n>\]\[=<why>\]` shows or changes your fate points. Your invokes come from it.
        - `+encounter/point <name>\[=<why>\]` gives a player a fate point, such as for a compel.
        - `+encounter/keep <name>\[=<number>\]` writes a player's copy back onto their sheet.
        - `+encounter/end \[<number>\]` ends it. Every copy not kept is dropped.

        For example:

        `+encounter/npc thug=3`

        Output: `\[SHEET\] Alice brings Thug 1, Thug 2, and Thug 3 into Dockside brawl \(encounter 7\).`

        See `+help encounter opposition` for playing the NPCs.
      HELP`ENCOUNTER`OPPOSITION: |-
        The GM plays the NPCs in an encounter:

        - `+encounter/roll <npc>/<skill>\[+<n>\]\[=<opposition>\]` rolls for one where the room sees it.
        - `+encounter/harm <name>\[/<track>\]=<shifts>` lands a hit. An NPC marks its stress boxes, one shift each, and is taken out when what is left is more than its consequences take. A player is told what to mark.
        - `+encounter/stress <npc>/<track>=<box>` marks a box, or clears a marked one. `=clear` clears the track.
        - `+encounter/consequence <npc>/<slot>=<aspect>` gives an NPC a consequence. Empty clears it.
        - `+encounter/out <name>\[=<what happens>\]` takes someone out, or says what happened to them. With nothing after it, one who is out comes back in.
        - `+encounter/concede <npc>` concedes for an NPC. A major NPC banks a fate point, and one for each consequence it took. They go to your pool the next time you bring it in.
        - `+encounter/victory <name>\[=<n>\]` gives a victory in a contest, 2 for success with style. Three wins it.

        For example:

        `+encounter/harm thug 3=4`

        Output: `\[SHEET\] Thug 3 takes a hit of 4 shifts. Physical stress box 1 takes 1, and the 3 shifts left are more than it can take: taken out.`
      HELP`NPC: |-
        `+npc` keeps the opposition you bring into encounters: thugs, monsters, rivals, giant robots. Each player keeps their own, and sheet keepers change any.

        - `+npc` lists the NPCs you may use. `+npc <name>` shows one.
        - `+npc/create <name>\[=minor|major\]` makes one. A minor NPC has one stress box and no consequences, so a good hit takes it out. A major one has every stress track and consequence a player has.
        - `+npc/skill <npc>/<skill>=<rating>` rates a skill: `+npc/skill thug/fight=fair`. Every other skill is Mediocre \(+0\).
        - `+npc/aspect <npc>/<1 to 5>=<aspect>` and `+npc/stunt <npc>/<1 to 5>=<stunt>` write its aspects and stunts. Empty clears one.
        - `+npc/stress <npc>/<track>=<boxes>` sets how many stress boxes it has, 0 to 10. `+npc/consequences <npc>=<slots>`, `all` or `none` sets its consequence slots.
        - `+npc/set <npc>/<field>=<value>` sets a field a package adds, such as a scale.
        - `+npc/share <npc>` lets every GM use it, or only you again. `+npc/destroy <npc>` removes it.

        An encounter takes a copy, so a change here never reaches a fight already going.

        For example:

        `+npc/create Baron Vex=major`

        Output: `\[SHEET\] Done: You make Baron Vex, a major NPC. +npc/skill, /aspect, /stunt and /stress fill it in, and +npc Baron Vex shows it.`
      HELP`CHECK: |-
        `+check <skill>` rolls four Fate dice, each -1, 0 or +1, and adds the skill's rating, where the room sees it.

        - `+check <skill>=<opposition>` rolls against an opposition: a number, a ladder word such as `fair`, or a difficulty: trivial, easy, standard, hard or extreme \(+0 to +4 unless your game changed them\).
        - `+check <skill>+<n>` or `-<n>` adds or takes away a number for this roll, such as +2 for an invoked aspect: `+check fight+2=good`.
        - `/private` rolls where only you see it.

        Each step above the opposition is a shift. Below it you fail; level with it is a tie; one or two shifts are a success; three or more succeed with style. Every check is kept under a number that `rollinfo()` reads back.

        For example:

        `+check fight=fair`

        Output: `\[SHEET\] Alice rolls Fight: 4dF\[1, 0, -1, 1\] + 3 = 4 (Great) against Fair (+2): success, 2 shifts (roll 42)`
      HELP`SHEET`CREDITS: |-
