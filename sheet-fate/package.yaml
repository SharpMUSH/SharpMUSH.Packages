          hasattr(%0,FATE)
        flags: [VISUAL]
      # %0 a number, a ladder word or a difficulty word: the opposition, or nothing.
      API`TARGET:
        value: |-
          cond(member(v(DATA`DIFFICULTIES),lcstr(%0)),extract(get(%!/DATA`CONFIG`OPPOSITION),member(v(DATA`DIFFICULTIES),lcstr(%0)),1),strlen(%0),u(%!/FUN`LADDER`READ,%0))
        flags: [VISUAL]
      # %0 the shifts (total less opposition): fail below 0, partial on a tie, success at 1 or 2, crit-success
      # (success with style) at 3 or more.
      API`TIER:
        value: |-
          cond(not(isint(%0)),,lt(%0,0),fail,eq(%0,0),partial,lt(%0,3),success,crit-success)
        flags: [VISUAL]
      # %0 a rating: its ladder word.
      API`LADDER:
        value: |-
          u(%!/FUN`LADDER`WORD,%0)
        flags: [VISUAL]
      # %0 a character: their fate points.
      API`POINTS:
        value: |-
          default(%0/FATE`POINTS,u(%!/FUN`POINTS`REFRESH,%0))
        flags: [VISUAL]
      # %0 a character, %1 a number of fate points to give (or take, below 0): writes them, never below 0, and
      # returns the new count.
      API`AWARD:
        value: |-
          setq(award_new,max(0,add(u(%!/API`POINTS,%0),%1)))[if(hasattr(%0,FATE),,attrib_set(%0/FATE,This character's Fate sheet. +sheet shows it.)[set(%0/FATE,wizard)][set(%0/FATE,no_command)])][attrib_set(%0/FATE`POINTS,%q<award_new>)]%q<award_new>
        flags: [VISUAL]
      # Named: %<who> an objid, %<source> who grants it (letters, digits, _ and -), %<target> RATING, BOXES or REFRESH,
      # %<key> the skill, approach or track (ALL for REFRESH), %<kind> base or add, %<value> a whole number; no value
      # takes the grant away. Writes only the ledger: call API`REBUILD once the grants are written. #-1 and why when
      # something is wrong.
      API`GRANT:
        value: |-
          setqm(grant_source,ucstr(%<source>),grant_target,ucstr(%<target>),grant_key,ucstr(%<key>))[cond(not(hastype(%<who>,player)),#-1 There is no character to grant to.,not(regmatch(%q<grant_source>,^\[A-Z0-9_-\]+$)),#-1 A source is letters%, digits%, _ and -.,not(member(RATING BOXES REFRESH,%q<grant_target>)),#-1 A grant is for RATING%, BOXES or REFRESH.,not(regmatch(%q<grant_key>,^\[A-Z0-9_-\]+$)),#-1 There is no key '%<key>'.,not(strlen(%<value>)),u(%!/FUN`DO`WRITE,%<who>,GRANT`%q<grant_source>`%q<grant_target>`%q<grant_key>,),cor(not(member(base add,lcstr(%<kind>))),not(isint(%<value>))),#-1 A grant is base or add and a whole number.,u(%!/FUN`DO`WRITE,%<who>,GRANT`%q<grant_source>`%q<grant_target>`%q<grant_key>,lcstr(%<kind>) %<value>))]
        flags: [VISUAL]
      # Named: %<who>, %<source> a source or a pattern such as ROBO_*: takes away every grant from it, branches too.
      API`REVOKE:
        value: |-
          null(iter(revwords(filterbool(%!/FUN`LEDGER`FROM,lattr(%<who>/FATE`GRANT`**),,,ucstr(%<source>))),attrib_set(%<who>/%i0)))
        flags: [VISUAL]
      # %0 a character, %1 a leaf under FATE`: what play reads, the encounter copy while they are in one. API`PLAYSET
      # (%0, %1, %2 the value; empty clears it) writes there. For a package's own PLAY` leaves, such as machine stress.
      API`PLAY:
        value: |-
          u(%!/FUN`PLAY`GET,%0,%1)
        flags: [VISUAL]
      API`PLAYSET:
        value: |-
          u(%!/FUN`PLAY`SET,%0,%1,%2)
        flags: [VISUAL]
      # %0 a character: works FATE`RATING, FATE`BOXES and FATE`REFRESH out from the ledger again.
      API`REBUILD:
        value: |-
          null(iter(setunion(u(%!/FUN`TRAIT`ALL),u(%!/FUN`LEDGER`KEYS,%0,RATING)),u(%!/FUN`DO`WRITE,%0,RATING`%i0,if(setr(rebuild_value,u(%!/FUN`LEDGER`VALUE,%0,RATING,%i0,0)),%q<rebuild_value>))))[null(iter(u(%!/FUN`LIST`ALL,TRACK),u(%!/FUN`DO`WRITE,%0,BOXES`%i0,if(words(lattr(%0/FATE`GRANT`*`BOXES`%i0)),u(%!/FUN`LEDGER`VALUE,%0,BOXES,%i0,default({{store}}/TRACK`%i0`BOXES,3))))))][u(%!/FUN`DO`WRITE,%0,REFRESH,if(words(lattr(%0/FATE`GRANT`*`REFRESH`ALL)),u(%!/FUN`LEDGER`VALUE,%0,REFRESH,ALL,get(%!/DATA`CONFIG`REFRESH))))]
        flags: [VISUAL]
      # Named: %<roller> an objid, %<trait> a key, %<modifier> a number to add, %<target> the opposition or
      # nothing. Rolls 4dF plus the rating and keeps the roll (roll() record), and returns
      # {"tier","total","shifts","target","margin","label","text","roll","formula"}; tier, shifts and margin are
      # empty without an opposition. #-1 and why when the trait or roller is wrong.
      API`CHECK:
        value: |-
          cond(not(hastype(%<roller>,player)),#-1 There is no character to roll for.,not(strlen(u(%!/FUN`TRAIT`FIND,%<trait>))),#-1 There is no [u(%!/FUN`TRAIT`NOUN)] '%<trait>'.,u(%!/FUN`CHECK`ROLLED,ucstr(u(%!/FUN`TRAIT`FIND,%<trait>)),add(u(%!/API`RATING,%<roller>,u(%!/FUN`TRAIT`FIND,%<trait>)),firstof(%<modifier>,0)),%<target>))
        flags: [VISUAL]
      # %0 the key, %1 what is added, %2 the opposition or nothing.
      FUN`CHECK`ROLLED:
        value: |-
          setqm(rolled_formula,4dF[if(gte(%1,0),+%1,%1)],
          rolled,roll(%q<rolled_formula>,,record),
          rolled_total,json_query(%q<rolled>,extract,$.total),
          rolled_shifts,if(strlen(%2),sub(%q<rolled_total>,%2)))[json(object,tier,json(string,u(%!/API`TIER,%q<rolled_shifts>)),total,%q<rolled_total>,shifts,json(string,%q<rolled_shifts>),target,json(string,%2),margin,json(string,%q<rolled_shifts>),label,json(string,u(%!/FUN`TRAIT`LABEL,%0)),text,json(string,json_query(%q<rolled>,extract,$.text)),roll,json_query(%q<rolled>,extract,$.id),formula,json(string,%q<rolled_formula>))]
        flags: [funsyntax]

      # ---- lifecycle ----------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP:
        value: |-
          @command/add/noparse/rsnoparse +sheet; @hook/override/inline +sheet=%!,CMD`SHEET; @command/add/noparse/rsnoparse +check; @hook/override/inline +check=%!,CMD`CHECK; @command/add/noparse/rsnoparse +encounter; @hook/override/inline +encounter=%!,CMD`ENCOUNTER; @command/add/noparse/rsnoparse +chargen; @hook/override/inline +chargen=%!,CMD`CHARGEN
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

