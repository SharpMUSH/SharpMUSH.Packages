        if(cand(every(%!/FUN`IS`RATING,%0),eq(words(%0),5),not(comp(%0,sort(%0,n)))),,Give five ratings from -2 to 8%, trivial to extreme%, none lower than the one before.)
      FUN`IS`RATING: |-
        cand(isint(%0),gte(%0,-2),lte(%0,8))

      # Which INC` routine each switch runs: DATA`ROUTE`<table>`<switch>. BARE is the command alone, ARG the
      # command with something after it and no switch.
      DATA`ROUTE: |-
