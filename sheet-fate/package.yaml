        flags: [funsyntax]
      # %0 the character: the stunt slots, a line each, after a rule. Nothing when the game has none.
      FUN`SCREEN`STUNTS:
        value: |-
          if(gt(setr(stunt_slots,get(%!/DATA`CONFIG`STUNTS)),0),%r[rule(Stunts)]%r[lfields(,iter(lnum(1,%q<stunt_slots>),Stunt %i0,%b,%*<|>),iter(lnum(1,%q<stunt_slots>),firstof(get(%0/FATE`STUNT`%i0),tone(muted,-)),%b,%*<|>),%*<|>)])
        flags: [funsyntax]
      # %0 the character, %1 who reads it: each SECTION`<name> a bridge added, by its ORDER, with a rule titled
      # by its TITLE. A section that gives nothing is left out.
      FUN`SCREEN`SECTIONS:
        value: |-
          setq(section_out,)[null(iter(sortkey(%!/FUN`SECTION`SORTKEY,lattr(%!/SECTION`*)),if(strlen(setr(section_body,u(%!/%i0,%0,%1))),setq(section_out,%q<section_out>%r[rule(get(%!/%i0`TITLE))]%r%q<section_body>))))]%q<section_out>
        flags: [funsyntax]
      FUN`SECTION`SORTKEY:
        value: |-
          rjust(default(%!/%0`ORDER,50),3,0)%0
        flags: [funsyntax]
      # %0 the character, %1 the keys. Skills rated other than Mediocre, highest first, one line per rating; approaches
      # all, each with its rating.
      FUN`SCREEN`RATINGS:
        value: |-
          if(strmatch(u(%!/FUN`TRAIT`PATH),APPROACH),lfields(lit({"cols":2}),iter(%1,u(%!/FUN`TRAIT`LABEL,%i0),%b,%*<|>),iter(%1,u(%!/FUN`LADDER`SHOW,default(%0/FATE`RATING`%i0,0)),%b,%*<|>),%*<|>),setq(ratings_used,revwords(setdiff(setunion(iter(%1,default(%0/FATE`RATING`%i0,0)),,,n),0,,n)))[if(words(%q<ratings_used>),lfields(,iter(%q<ratings_used>,u(%!/FUN`LADDER`SHOW,%i0),%b,%*<|>),iter(%q<ratings_used>,itemize(iter(filterbool(%!/FUN`RATING`IS,%1,,,%0,%i0),u(%!/FUN`TRAIT`LABEL,%i0),%b,|),|),%b,%*<|>),%*<|>),tone(muted,Every skill is Mediocre %(+0%).))])
