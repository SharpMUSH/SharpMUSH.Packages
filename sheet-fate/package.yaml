      # What a character's encounter copy holds: PLAY`<NAME>, a leaf under FATE`, * for every one beneath it.
      # Packages add their own, such as a machine's stress.
      PLAY`STRESS: |-
        STRESS`*
      PLAY`CONSEQUENCE: |-
        CONSEQUENCE`*
      PLAY`POINTS: |-
        POINTS
      # Advancement, as Fate Condensed has it. A keeper's award gives what DATA`ADV`KIND`<kind> lists, one letter each:
      # M a milestone, S a skill step, H a new high concept, R a point of refresh. +sheet/advance spends one on an
      # ADVANCE`<KEY> option: its name, with TOKEN (what it costs; %0 the character, %1 and %2 what was typed),
      # USAGE, SKIP (%0: 1 when it does not apply) and RUN (%0, %1, %2: makes the change and says what changed, or
      # #-1 and why, having changed nothing) beneath. Packages add their own options.
      DATA`ADV`KIND`MILESTONE: |-
        M
      DATA`ADV`KIND`BREAKTHROUGH: |-
        M S H
      DATA`ADV`KIND`REFRESH: |-
        R
      DATA`ADV`KIND`SKILL: |-
        S
      DATA`ADV`TOKEN`M: |-
        milestone
      DATA`ADV`TOKEN`S: |-
        skill step
      DATA`ADV`TOKEN`H: |-
        new high concept
      DATA`ADV`TOKEN`R: |-
        point of refresh
      ADVANCE`SWAP: |-
        Switch the ratings of two skills, or put one at Average (+1) in place of one that is not on your sheet
      ADVANCE`SWAP`TOKEN: |-
        M
      ADVANCE`SWAP`USAGE: |-
        swap <skill>=<skill>
      ADVANCE`SWAP`SKIP:
        value: |-
          hasattr(%!,GATE`SET)
        flags: [funsyntax]
      ADVANCE`SWAP`RUN:
        value: |-
          setqm(r_one,u(%!/FUN`TRAIT`FIND,%1),r_two,u(%!/FUN`TRAIT`FIND,%2))[cond(not(strlen(%q<r_one>)),#-1 There is no [u(%!/FUN`TRAIT`NOUN)] '%1'.,not(strlen(%q<r_two>)),#-1 There is no [u(%!/FUN`TRAIT`NOUN)] '%2'.,not(comp(%q<r_one>,%q<r_two>)),#-1 Name two different [u(%!/FUN`TRAIT`NOUNS)].,not(comp(setr(r_one_was,u(%!/API`RATING,%0,%q<r_one>)),u(%!/API`RATING,%0,%q<r_two>))),#-1 [u(%!/FUN`TRAIT`LABEL,%q<r_one>)] and [u(%!/FUN`TRAIT`LABEL,%q<r_two>)] are both [u(%!/FUN`LADDER`SHOW,%q<r_one_was>)]: switching them changes nothing.,1,[null(iter(lattr(%0/FATE`GRANT`*),[setqm(swap_one,get(%0/%i0`RATING`[ucstr(%q<r_one>)]),swap_two,get(%0/%i0`RATING`[ucstr(%q<r_two>)]))][u(%!/FUN`DO`WRITE,%0,after(%i0,FATE`)`RATING`[ucstr(%q<r_one>)],%q<swap_two>)][u(%!/FUN`DO`WRITE,%0,after(%i0,FATE`)`RATING`[ucstr(%q<r_two>)],%q<swap_one>)]))][u(%!/API`REBUILD,%0)][u(%!/FUN`TRAIT`LABEL,%q<r_one>)] is [u(%!/FUN`LADDER`SHOW,u(%!/API`RATING,%0,%q<r_one>))] and [u(%!/FUN`TRAIT`LABEL,%q<r_two>)] [u(%!/FUN`LADDER`SHOW,u(%!/API`RATING,%0,%q<r_two>))].)]
        flags: [funsyntax]
