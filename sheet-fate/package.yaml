          u(%!/FUN`DISPLAY`MARKED,%0,%1,u(%!/FUN`PLAY`GET,%0,STRESS`%1))
        flags: [funsyntax]
      # %0 the character, %1 a track, %2 the boxes marked.
      FUN`DISPLAY`MARKED:
        value: |-
          iter(lnum(1,u(%!/FUN`TRACK`BOXES,%0,%1)),if(member(%2,%i0),%[X%],%[%b%]))
        flags: [funsyntax]
      # %0 the character: what a skills sheet breaks, or nothing. More skills at a rating than at the one below,
      # unless a GATE`SET says another package works the ratings out.
      FUN`SHEET`PROBLEMS:
        value: |-
          if(cand(strmatch(u(%!/FUN`TRAIT`PATH),SKILL),get(%!/DATA`CONFIG`PYRAMID),not(hasattr(%!,GATE`SET))),setq(problem_counts,iter(lnum(0,8),words(iter(u(%!/FUN`TRAIT`ALL),if(eq(default(%0/FATE`RATING`%i0,0),%i1),%i0)))))[trim(iter(lnum(2,8),if(gt(extract(%q<problem_counts>,inc(%i0),1),extract(%q<problem_counts>,%i0,1)),More skills at [u(%!/FUN`LADDER`SHOW,%i0)] than at [u(%!/FUN`LADDER`SHOW,dec(%i0))].)))])
        flags: [funsyntax]
      FUN`DISPLAY`FOOTER:
        value: |-
          cond(cand(not(comp(objid(%1),%0)),not(isapproved(%1)),not(u(%!/FUN`PERM`KEEPER,%1))),[if(strlen(setr(footer_gate,u(%!/FUN`GATE`SET,%1))),%q<footer_gate> +sheet/aspect <slot>=<text> fills in an aspect.,+sheet/set <[u(%!/FUN`TRAIT`NOUN)]>=<rating> and +sheet/aspect <slot>=<text> fill it in.)] +chargen shows what is left to do. +check <[u(%!/FUN`TRAIT`NOUN)]> rolls.[u(%!/FUN`HINT,FOOTER)],not(comp(objid(%1),%0)),+check <[u(%!/FUN`TRAIT`NOUN)]> rolls. +sheet/spend spends a fate point%, +sheet/stress <track>=<box> marks stress.,+check <[u(%!/FUN`TRAIT`NOUN)]> rolls four Fate dice plus a rating.)
        flags: [funsyntax]
      FUN`SCREEN`TRAITS:
        value: |-
