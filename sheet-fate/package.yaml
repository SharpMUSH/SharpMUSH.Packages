format: "1.20"
package: sheet-fate
title: "Fate sheet"
version: 1.6.2
authors: [SharpMUSH]
description: "A Fate character sheet: skills or the six approaches on the ladder, aspects, stunts, stress tracks, consequences and fate points. +sheet shows and fills it in, +chargen walks a player through it, and +check rolls four Fate dice plus a rating against an opposition for the room. The build is a ledger of grants; staff give milestones and breakthroughs that stay on a log, and players spend them with +sheet/advance. +encounter gives each encounter its own copy of fate points, stress and consequences, and runs a conflict: NPCs a GM builds with +npc, exchanges, harm, concessions, aspects on the scene and the GM's fate points. Fate Core and Fate Accelerated SRD material under CC BY 3.0."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, fate, dice, checks, aspects]
category: Game System
subcategory: Fate
requires_server: ">=1.0"
verified_server: "1.0"

# One permission, for the people who keep sheets: change any character's sheet at any time, read every sheet,
# and hand out fate points. A player fills in their own skills and aspects until they are approved, and marks
# their own stress, consequences and spent fate points at any time. Changing the lists and settings is
# config.admin, as +config is.
categories:
  roles:
    - name: Fate sheet
      description: Roles for the people who keep Fate character sheets.
  permissions:
    - name: Fate sheet
      description: Keeping Fate character sheets.
permissions:
  - name: softcode.fate.admin
    category: Fate sheet
    description: Read every Fate sheet, change any character's at any time, and award and refresh fate points.
roles:
  - slug: fate-sheet-keeper
    name: Fate Sheet Keeper
    category: Fate sheet
    priority: 11
    permissions:
      softcode.fate.admin: allow

# Every character's FATE tree is their Fate sheet: only wizards write it, so a player can't make the root
# before the sheet does, and it is never a command.
attributes:
  FATE:
    flags: [wizard, no_command]

objects:
  # The command object, in the master room. WIZARD because it adds the commands (@command/add, @hook),
  # writes the sheet attributes on characters, and reads them for other packages.
  #
  # A character's sheet is their own attributes under FATE`. The build is a ledger, FATE`GRANT`<SOURCE>`<TARGET>`<KEY>
  # (see FUN`LEDGER`), and FATE`RATING`<KEY> a skill's or approach's rating, FATE`BOXES`<TRACK> a track's length
  # and FATE`REFRESH the refresh are rebuilt from it. FATE`ASPECT`<SLOT> an aspect (CONCEPT, TROUBLE, then 1, 2,
  # ...), FATE`STUNT`<n> a stunt. In play: FATE`STRESS`<TRACK> the marked boxes, FATE`CONSEQUENCE`<SLOT> a
  # consequence, FATE`POINTS the fate points. FATE`ENCOUNTERS the encounters they take part in, in the order
  # they joined, and FATE`USING the one they picked with +encounter/use.
  # The FATE root is wizard-flagged, so only this object writes them.
  #
  # +sheet and +check are added with /noparse/rsnoparse and hooked to CMD`<word>, so what a player types
  # reaches the code exactly as typed and nothing a player wrote is ever evaluated.
  #
  # Trees: CMD` the hooked commands, INC`COMMAND` the parse and dispatch, INC`SHEET` and INC`CHECK` one
  # routine per switch, INC`NEED` the guards they share, INC`DO` the writes. FUN`TRAIT` the skills or
  # approaches, FUN`LADDER` the ladder, FUN`PERM` who may do what, FUN`SCREEN` and FUN`DISPLAY` the screens.
  # API` the functions other packages call (VISUAL), the same names in every sheet package.
  # Bridges add HINT`<message> lines, GATE`EDIT (a reason a player may not change their own sheet now),
  # GATE`SET (a reason nobody sets ratings by hand, when another package works them out), ALLOW`VIEW`<name>
  # (who else may read a sheet) and SECTION`<name> (a part of the +sheet screen, with TITLE and ORDER beneath).
  - ref: sheet
    type: thing
    name: Fate Sheet
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      # ---- settings ---------------------------------------------------------------
      # +config fate shows and changes them (sheet-fate-config); the code reads each with get(%!/DATA`CONFIG`<NAME>).
      DATA`CONFIG: |-
        Settings for the Fate sheet. One leaf per setting.
      DATA`CONFIG`LABEL: |-
        Fate sheet
      DATA`CONFIG`MODE: |-
        skills
      DATA`CONFIG`MODE`TYPE: |-
        choice
      DATA`CONFIG`MODE`DEFAULT: |-
        skills
      DATA`CONFIG`MODE`CHOICES: |-
        skills approaches
      DATA`CONFIG`MODE`LABEL: |-
        Skills or approaches
      DATA`CONFIG`MODE`DESCRIPTION: |-
        skills: the skill list, each rated from Mediocre up. approaches: the six approaches instead.
      DATA`CONFIG`MODE`EXAMPLE: |-
        approaches
      DATA`CONFIG`CAP: |-
        4
      DATA`CONFIG`CAP`TYPE: |-
        integer
      DATA`CONFIG`CAP`DEFAULT: |-
        4
      DATA`CONFIG`CAP`MIN: |-
        0
      DATA`CONFIG`CAP`MAX: |-
        8
      DATA`CONFIG`CAP`LABEL: |-
        Highest rating
      DATA`CONFIG`CAP`DESCRIPTION: |-
        The highest rating a player gives a skill or approach. Sheet keepers may go to +8.
      DATA`CONFIG`CAP`EXAMPLE: |-
        3
      DATA`CONFIG`PYRAMID: |-
        1
      DATA`CONFIG`PYRAMID`TYPE: |-
        boolean
      DATA`CONFIG`PYRAMID`DEFAULT: |-
        1
      DATA`CONFIG`PYRAMID`LABEL: |-
        Skill columns
      DATA`CONFIG`PYRAMID`DESCRIPTION: |-
        Whether the sheet warns when a skills sheet has more skills at a rating than at the one below it.
      DATA`CONFIG`PYRAMID`EXAMPLE: |-
        no
      DATA`CONFIG`REFRESH: |-
        3
      DATA`CONFIG`REFRESH`TYPE: |-
        integer
      DATA`CONFIG`REFRESH`DEFAULT: |-
        3
      DATA`CONFIG`REFRESH`MIN: |-
        0
      DATA`CONFIG`REFRESH`MAX: |-
        20
      DATA`CONFIG`REFRESH`LABEL: |-
        Refresh
      DATA`CONFIG`REFRESH`DESCRIPTION: |-
        How many fate points a character starts each session with, unless a keeper sets their own.
      DATA`CONFIG`REFRESH`EXAMPLE: |-
        2
      DATA`CONFIG`ASPECTS: |-
        5
      DATA`CONFIG`ASPECTS`TYPE: |-
        integer
      DATA`CONFIG`ASPECTS`DEFAULT: |-
        5
      DATA`CONFIG`ASPECTS`MIN: |-
        2
      DATA`CONFIG`ASPECTS`MAX: |-
        10
      DATA`CONFIG`ASPECTS`LABEL: |-
        Aspects
      DATA`CONFIG`ASPECTS`DESCRIPTION: |-
        How many aspects a sheet has: a high concept, a trouble, and the rest free.
      DATA`CONFIG`ASPECTS`EXAMPLE: |-
        3
      DATA`CONFIG`STUNTS: |-
        3
      DATA`CONFIG`STUNTS`TYPE: |-
        integer
      DATA`CONFIG`STUNTS`DEFAULT: |-
