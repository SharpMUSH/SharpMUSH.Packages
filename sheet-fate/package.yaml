format: "1.16"
package: sheet-fate
title: "Fate sheet"
version: 1.0.0
authors: [SharpMUSH]
description: "A Fate character sheet: skills or the six approaches on the ladder, aspects, stress tracks, consequences and fate points. +sheet shows and fills it in, and +check rolls four Fate dice plus a rating against an opposition for the room. Fate Core and Fate Accelerated SRD material under CC BY 3.0."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, fate, dice, checks, aspects]
category: Characters
requires_server: ">=0.1"

# One permission, for the people who keep sheets: change any character's sheet at any time, read every sheet,
# and hand out fate points. A player fills in their own skills and aspects until they are approved, and marks
# their own stress, consequences and spent fate points at any time. Changing the lists and settings is
# config.admin, as +config is.
categories:
  roles:
    - name: Fate sheet
      description: Roles for the people who keep Fate character sheets.
  permissions:
    - name: Fate sheet
      description: Keeping Fate character sheets.
permissions:
  - name: softcode.fate.admin
    category: Fate sheet
    description: Read every Fate sheet, change any character's at any time, and award and refresh fate points.
roles:
  - slug: fate-sheet-keeper
    name: Fate Sheet Keeper
    category: Fate sheet
    priority: 11
    permissions:
      softcode.fate.admin: allow

objects:
  # The command object, in the master room. WIZARD because it adds the commands (@command/add, @hook),
  # writes the sheet attributes on characters, and reads them for other packages.
  #
  # A character's sheet is their own attributes under FATE`: FATE`RATING`<KEY> a skill's or approach's rating,
  # FATE`ASPECT`<SLOT> an aspect (CONCEPT, TROUBLE, then 1, 2, ...), FATE`STRESS`<TRACK> the marked boxes,
  # FATE`CONSEQUENCE`<SLOT> a consequence, FATE`POINTS the fate points and FATE`REFRESH a refresh of their own.
  # The FATE root is wizard-flagged, so only this object writes them.
  #
  # +sheet and +check are added with /noparse/rsnoparse and hooked to CMD`<word>, so what a player types
  # reaches the code exactly as typed and nothing a player wrote is ever evaluated.
  #
  # Trees: CMD` the hooked commands, INC`COMMAND` the parse and dispatch, INC`SHEET` and INC`CHECK` one
  # routine per switch, INC`NEED` the guards they share, INC`DO` the writes. FUN`TRAIT` the skills or
  # approaches, FUN`LADDER` the ladder, FUN`PERM` who may do what, FUN`SCREEN` and FUN`DISPLAY` the screens.
  # API` the functions other packages call (VISUAL), the same names in every sheet package.
  # Bridges add HINT`<message> lines, GATE`EDIT (a reason a player may not change their own sheet now)
  # and ALLOW`VIEW`<name> (who else may read a sheet).
  - ref: sheet
    type: thing
    name: Fate Sheet
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      # ---- settings ---------------------------------------------------------------
      # +config fate shows and changes them (sheet-fate-config); the code reads each with get(%!/DATA`CONFIG`<NAME>).
      DATA`CONFIG: |-
        Settings for the Fate sheet. One leaf per setting.
      DATA`CONFIG`LABEL: |-
        Fate sheet
      DATA`CONFIG`MODE: |-
        skills
      DATA`CONFIG`MODE`TYPE: |-
        choice
      DATA`CONFIG`MODE`DEFAULT: |-
        skills
      DATA`CONFIG`MODE`CHOICES: |-
        skills approaches
      DATA`CONFIG`MODE`LABEL: |-
        Skills or approaches
      DATA`CONFIG`MODE`DESCRIPTION: |-
        skills: the skill list, each rated from Mediocre up. approaches: the six approaches instead.
      DATA`CONFIG`MODE`EXAMPLE: |-
        approaches
      DATA`CONFIG`CAP: |-
        4
      DATA`CONFIG`CAP`TYPE: |-
        integer
      DATA`CONFIG`CAP`DEFAULT: |-
        4
      DATA`CONFIG`CAP`MIN: |-
        0
      DATA`CONFIG`CAP`MAX: |-
        8
      DATA`CONFIG`CAP`LABEL: |-
        Highest rating
      DATA`CONFIG`CAP`DESCRIPTION: |-
        The highest rating a player gives a skill or approach. Sheet keepers may go to +8.
      DATA`CONFIG`CAP`EXAMPLE: |-
        3
      DATA`CONFIG`PYRAMID: |-
        1
      DATA`CONFIG`PYRAMID`TYPE: |-
        boolean
      DATA`CONFIG`PYRAMID`DEFAULT: |-
        1
      DATA`CONFIG`PYRAMID`LABEL: |-
        Skill columns
      DATA`CONFIG`PYRAMID`DESCRIPTION: |-
        Whether the sheet warns when a skills sheet has more skills at a rating than at the one below it.
      DATA`CONFIG`PYRAMID`EXAMPLE: |-
        no
      DATA`CONFIG`REFRESH: |-
        3
      DATA`CONFIG`REFRESH`TYPE: |-
        integer
      DATA`CONFIG`REFRESH`DEFAULT: |-
        3
      DATA`CONFIG`REFRESH`MIN: |-
        0
      DATA`CONFIG`REFRESH`MAX: |-
        20
      DATA`CONFIG`REFRESH`LABEL: |-
        Refresh
      DATA`CONFIG`REFRESH`DESCRIPTION: |-
        How many fate points a character starts each session with, unless a keeper sets their own.
      DATA`CONFIG`REFRESH`EXAMPLE: |-
        2
      DATA`CONFIG`ASPECTS: |-
        5
      DATA`CONFIG`ASPECTS`TYPE: |-
        integer
      DATA`CONFIG`ASPECTS`DEFAULT: |-
        5
      DATA`CONFIG`ASPECTS`MIN: |-
        2
      DATA`CONFIG`ASPECTS`MAX: |-
        10
      DATA`CONFIG`ASPECTS`LABEL: |-
        Aspects
      DATA`CONFIG`ASPECTS`DESCRIPTION: |-
        How many aspects a sheet has: a high concept, a trouble, and the rest free.
      DATA`CONFIG`ASPECTS`EXAMPLE: |-
        3
      DATA`CONFIG`OPPOSITION: |-
        0 1 2 3 4
      DATA`CONFIG`OPPOSITION`TYPE: |-
        list
      DATA`CONFIG`OPPOSITION`DEFAULT: |-
        0 1 2 3 4
      DATA`CONFIG`OPPOSITION`MIN: |-
        5
      DATA`CONFIG`OPPOSITION`MAX: |-
        5
      DATA`CONFIG`OPPOSITION`CHECK: |-
        CHECK`OPPOSITION
      DATA`CONFIG`OPPOSITION`LABEL: |-
        Opposition for each difficulty
      DATA`CONFIG`OPPOSITION`DESCRIPTION: |-
        The opposition of trivial, easy, standard, hard and extreme, on the ladder, in that order.
      DATA`CONFIG`OPPOSITION`EXAMPLE: |-
        0 2 3 4 6
      DATA`CONFIG`PUBLIC: |-
        0
      DATA`CONFIG`PUBLIC`TYPE: |-
        boolean
      DATA`CONFIG`PUBLIC`DEFAULT: |-
        0
      DATA`CONFIG`PUBLIC`LABEL: |-
        Sheets anyone can read
      DATA`CONFIG`PUBLIC`DESCRIPTION: |-
        Whether +sheet <name> shows anyone's sheet to everyone. Otherwise only the character and sheet keepers see it.
      DATA`CONFIG`PUBLIC`EXAMPLE: |-
        yes
      DATA`CONFIG`SKILLS`TYPE: |-
        table
      DATA`CONFIG`SKILLS`LABEL: |-
        Skills
      DATA`CONFIG`SKILLS`DESCRIPTION: |-
        The skills a skills sheet rates.
      DATA`CONFIG`SKILLS`STORE: |-
        {{store}}
      DATA`CONFIG`SKILLS`PATH: |-
        SKILL
      DATA`CONFIG`SKILLS`ENTRY: |-
        label
      DATA`CONFIG`SKILLS`FIELDS: |-
        label order
      DATA`CONFIG`SKILLS`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`SKILLS`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`SKILLS`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`SKILLS`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`SKILLS`FIELD`LABEL`LABEL: |-
        Label
      DATA`CONFIG`SKILLS`FIELD`LABEL`DESCRIPTION: |-
        The name the sheet shows.
      DATA`CONFIG`SKILLS`FIELD`ORDER`TYPE: |-
        integer
      DATA`CONFIG`SKILLS`FIELD`ORDER`DEFAULT: |-
        50
      DATA`CONFIG`SKILLS`FIELD`ORDER`MIN: |-
        0
      DATA`CONFIG`SKILLS`FIELD`ORDER`MAX: |-
        999
      DATA`CONFIG`SKILLS`FIELD`ORDER`LABEL: |-
        Order
      DATA`CONFIG`SKILLS`FIELD`ORDER`DESCRIPTION: |-
        Where it comes in its list: lower first, then by name.
      DATA`CONFIG`APPROACHES`TYPE: |-
        table
      DATA`CONFIG`APPROACHES`LABEL: |-
        Approaches
      DATA`CONFIG`APPROACHES`DESCRIPTION: |-
        The approaches an approaches sheet rates.
      DATA`CONFIG`APPROACHES`STORE: |-
        {{store}}
      DATA`CONFIG`APPROACHES`PATH: |-
        APPROACH
      DATA`CONFIG`APPROACHES`ENTRY: |-
        label
      DATA`CONFIG`APPROACHES`FIELDS: |-
        label order
      DATA`CONFIG`APPROACHES`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`APPROACHES`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`APPROACHES`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`APPROACHES`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`APPROACHES`FIELD`LABEL`LABEL: |-
        Label
      DATA`CONFIG`APPROACHES`FIELD`LABEL`DESCRIPTION: |-
        The name the sheet shows.
      DATA`CONFIG`APPROACHES`FIELD`ORDER`TYPE: |-
        integer
      DATA`CONFIG`APPROACHES`FIELD`ORDER`DEFAULT: |-
        50
      DATA`CONFIG`APPROACHES`FIELD`ORDER`MIN: |-
        0
      DATA`CONFIG`APPROACHES`FIELD`ORDER`MAX: |-
        999
      DATA`CONFIG`APPROACHES`FIELD`ORDER`LABEL: |-
        Order
      DATA`CONFIG`APPROACHES`FIELD`ORDER`DESCRIPTION: |-
        Where it comes in its list: lower first, then by name.
      DATA`CONFIG`TRACKS`TYPE: |-
        table
      DATA`CONFIG`TRACKS`LABEL: |-
        Stress tracks
      DATA`CONFIG`TRACKS`DESCRIPTION: |-
        The stress tracks on every sheet, and how many boxes each has.
      DATA`CONFIG`TRACKS`STORE: |-
        {{store}}
      DATA`CONFIG`TRACKS`PATH: |-
        TRACK
      DATA`CONFIG`TRACKS`ENTRY: |-
        label
      DATA`CONFIG`TRACKS`FIELDS: |-
        label boxes order
      DATA`CONFIG`TRACKS`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`TRACKS`FIELD`ORDER`TYPE: |-
        integer
      DATA`CONFIG`TRACKS`FIELD`ORDER`DEFAULT: |-
        50
      DATA`CONFIG`TRACKS`FIELD`ORDER`MIN: |-
        0
      DATA`CONFIG`TRACKS`FIELD`ORDER`MAX: |-
        999
      DATA`CONFIG`TRACKS`FIELD`ORDER`LABEL: |-
        Order
      DATA`CONFIG`TRACKS`FIELD`ORDER`DESCRIPTION: |-
        Where it comes in its list: lower first, then by name.
      DATA`CONFIG`TRACKS`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`TRACKS`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`TRACKS`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`TRACKS`FIELD`LABEL`LABEL: |-
        Label
      DATA`CONFIG`TRACKS`FIELD`LABEL`DESCRIPTION: |-
        The name the sheet shows.
      DATA`CONFIG`TRACKS`FIELD`BOXES`TYPE: |-
        integer
      DATA`CONFIG`TRACKS`FIELD`BOXES`DEFAULT: |-
        3
      DATA`CONFIG`TRACKS`FIELD`BOXES`MIN: |-
        1
      DATA`CONFIG`TRACKS`FIELD`BOXES`MAX: |-
        10
      DATA`CONFIG`TRACKS`FIELD`BOXES`LABEL: |-
        Boxes
      DATA`CONFIG`TRACKS`FIELD`BOXES`DESCRIPTION: |-
        How many boxes the track has. Each box takes one shift.
      DATA`CONFIG`CONSEQUENCES`TYPE: |-
        table
      DATA`CONFIG`CONSEQUENCES`LABEL: |-
        Consequences
      DATA`CONFIG`CONSEQUENCES`DESCRIPTION: |-
        The consequence slots on every sheet, and how many shifts each takes.
      DATA`CONFIG`CONSEQUENCES`STORE: |-
        {{store}}
      DATA`CONFIG`CONSEQUENCES`PATH: |-
        CONSEQUENCE
      DATA`CONFIG`CONSEQUENCES`ENTRY: |-
        label
      DATA`CONFIG`CONSEQUENCES`FIELDS: |-
        label shifts order
      DATA`CONFIG`CONSEQUENCES`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`CONSEQUENCES`FIELD`ORDER`TYPE: |-
        integer
      DATA`CONFIG`CONSEQUENCES`FIELD`ORDER`DEFAULT: |-
        50
      DATA`CONFIG`CONSEQUENCES`FIELD`ORDER`MIN: |-
        0
      DATA`CONFIG`CONSEQUENCES`FIELD`ORDER`MAX: |-
        999
      DATA`CONFIG`CONSEQUENCES`FIELD`ORDER`LABEL: |-
        Order
      DATA`CONFIG`CONSEQUENCES`FIELD`ORDER`DESCRIPTION: |-
        Where it comes in its list: lower first, then by name.
      DATA`CONFIG`CONSEQUENCES`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`CONSEQUENCES`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`CONSEQUENCES`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`CONSEQUENCES`FIELD`LABEL`LABEL: |-
        Label
      DATA`CONFIG`CONSEQUENCES`FIELD`LABEL`DESCRIPTION: |-
        The name the sheet shows.
      DATA`CONFIG`CONSEQUENCES`FIELD`SHIFTS`TYPE: |-
        integer
      DATA`CONFIG`CONSEQUENCES`FIELD`SHIFTS`DEFAULT: |-
        2
      DATA`CONFIG`CONSEQUENCES`FIELD`SHIFTS`MIN: |-
        1
      DATA`CONFIG`CONSEQUENCES`FIELD`SHIFTS`MAX: |-
        20
      DATA`CONFIG`CONSEQUENCES`FIELD`SHIFTS`LABEL: |-
        Shifts
      DATA`CONFIG`CONSEQUENCES`FIELD`SHIFTS`DESCRIPTION: |-
        How many shifts of a hit the consequence takes.
      CHECK`OPPOSITION: |-
        if(cand(every(%!/FUN`IS`RATING,%0),eq(words(%0),5),not(comp(%0,sort(%0,n)))),,Give five ratings from -2 to 8%, trivial to extreme%, none lower than the one before.)
      FUN`IS`RATING: |-
        cand(isint(%0),gte(%0,-2),lte(%0,8))

      # Which INC` routine each switch runs: DATA`ROUTE`<table>`<switch>. BARE is the command alone, ARG the
      # command with something after it and no switch.
      DATA`ROUTE: |-
        Which routine each switch runs. One leaf per switch.
      DATA`ROUTE`SHEET`BARE: |-
        SHEET`SHOW
      DATA`ROUTE`SHEET`ARG: |-
        SHEET`SHOW
      DATA`ROUTE`SHEET`SET: |-
        SHEET`SET
      DATA`ROUTE`SHEET`ASPECT: |-
        SHEET`ASPECT
      DATA`ROUTE`SHEET`STRESS: |-
        SHEET`STRESS
      DATA`ROUTE`SHEET`RECOVER: |-
        SHEET`RECOVER
      DATA`ROUTE`SHEET`CONSEQUENCE: |-
        SHEET`CONSEQUENCE
      DATA`ROUTE`SHEET`SPEND: |-
        SHEET`SPEND
      DATA`ROUTE`SHEET`AWARD: |-
        SHEET`AWARD
      DATA`ROUTE`SHEET`REFRESH: |-
        SHEET`REFRESH
      DATA`ROUTE`SHEET`TRAITS: |-
        SHEET`TRAITS
      DATA`ROUTE`CHECK`BARE: |-
        CHECK`USAGE
      DATA`ROUTE`CHECK`ARG: |-
        CHECK`ROLL
      DATA`ROUTE`CHECK`PRIVATE: |-
        CHECK`ROLL
      # The ladder: DATA`LADDER`<n>, N1 and N2 for -1 and -2.
      DATA`LADDER`8: |-
        Legendary
      DATA`LADDER`7: |-
        Epic
      DATA`LADDER`6: |-
        Fantastic
      DATA`LADDER`5: |-
        Superb
      DATA`LADDER`4: |-
        Great
      DATA`LADDER`3: |-
        Good
      DATA`LADDER`2: |-
        Fair
      DATA`LADDER`1: |-
        Average
      DATA`LADDER`0: |-
        Mediocre
      DATA`LADDER`N1: |-
        Poor
      DATA`LADDER`N2: |-
        Terrible
      DATA`DIFFICULTIES: |-
        trivial easy standard hard extreme

      # ---- commands ---------------------------------------------------------------
      # %1 the switches and %2 what follows, exactly as typed.
      CMD`SHEET:
        value: |-
          $(?is)^\+sheet(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,sheet,table,SHEET,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`CHECK:
        value: |-
          $(?is)^\+check(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,check,table,CHECK,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      # A line a bridge adds to one of this object's messages: HINT`<message>, set here by a bridge such as
      # sheet-fate-help. %1 on are passed to it. Nothing when no bridge set one, so the message stands without it.
      FUN`HINT:
        value: |-
          if(hasattr(%!,HINT`%0),%b[u(%!/HINT`%0,%1,%2)])
        flags: [funsyntax]
      INC`COMMAND`RUN:
        value: |-
          @assert hastype(%#,player)=@pemit %#=notice(SHEET,Only players have a sheet.,warn); think u(%!/FUN`COMMAND`PARSE,%<word>,%<table>,%<switches>,%<argument>); @assert lte(words(%q<cmd_switch_list>),1)=@pemit %#=notice(SHEET,Use one switch at a time.,warn); @assert strlen(%q<cmd_route>)=@pemit %#=notice(SHEET,+%q<cmd_word> has no /%q<cmd_switch> switch.[u(%!/FUN`HINT,SWITCHES,%q<cmd_word>)],warn); @include %!/INC`%q<cmd_route>
        flags: [cmdsyntax]
      # %0 the word, %1 its route table, %2 the switches and %3 the argument, as typed. Sets cmd_word,
      # cmd_switch_list, cmd_switch, cmd_argument, cmd_has_equals, cmd_left_side and cmd_right_side around the
      # first =, cmd_route (the INC` routine to run), viewer_objid and viewer_keeper.
      FUN`COMMAND`PARSE:
        value: |-
          setqm(cmd_word,lcstr(%0),
          cmd_switch_list,lcstr(trim(edit(%2,/,%b))),
          cmd_switch,first(%q<cmd_switch_list>),
          cmd_argument,trim(%3),
          cmd_has_equals,strmatch(%3,*=*),
          cmd_left_side,trim(before(%3,=)),
          cmd_right_side,trim(after(%3,=)),
          cmd_route,get(%!/DATA`ROUTE`%1`[if(strlen(%q<cmd_switch>),ucstr(%q<cmd_switch>),if(strlen(%q<cmd_argument>),ARG,BARE))]),
          viewer_objid,objid(%#),
          viewer_keeper,u(%!/FUN`PERM`KEEPER,%#))
        flags: [funsyntax]

      # ---- guards -----------------------------------------------------------------
      # %<name> a player's name: sheet_who, their objid.
      INC`NEED`TARGET:
        value: |-
          @assert strlen(setr(sheet_who,u(%!/FUN`PLAYER`MATCH,%<name>)))=@pemit %#=notice(SHEET,There is no player called '%<name>'.,warn)
        flags: [cmdsyntax]
      # The left of =: <name>/<what> for a sheet keeper, else <what> on your own sheet. sheet_who and sheet_what.
      INC`NEED`WHO:
        value: |-
          @if strmatch(%q<cmd_left_side>,*/*)={@include/args %!/INC`NEED`TARGET=name,before(%q<cmd_left_side>,/); think setq(sheet_what,trim(after(%q<cmd_left_side>,/)))},{think setqm(sheet_who,%q<viewer_objid>,sheet_what,%q<cmd_left_side>)}; @assert cor(%q<viewer_keeper>,not(comp(%q<sheet_who>,%q<viewer_objid>)))=@pemit %#=notice(SHEET,Only sheet keepers change another character's sheet.,error)
        flags: [cmdsyntax]
      # Changes only a keeper makes once a character is approved: ratings, aspects.
      INC`NEED`EDITABLE:
        value: |-
          @assert cor(%q<viewer_keeper>,not(isapproved(%#)))=@pemit %#=notice(SHEET,Your character is approved%, so staff change your sheet now.,error); @assert cor(%q<viewer_keeper>,not(strlen(setr(set_gate,u(%!/FUN`GATE`EDIT,%#)))))=@pemit %#=notice(SHEET,%q<set_gate>,warn)
        flags: [cmdsyntax]
      INC`NEED`KEEPER:
        value: |-
          @assert %q<viewer_keeper>=@pemit %#=notice(SHEET,Only sheet keepers do that.,error)
        flags: [cmdsyntax]

      # ---- +sheet -----------------------------------------------------------------
      INC`SHEET`SHOW:
        value: |-
          @if strlen(%q<cmd_argument>)={@include/args %!/INC`NEED`TARGET=name,%q<cmd_argument>},{think setq(sheet_who,%q<viewer_objid>)}; @assert u(%!/FUN`PERM`VIEW,%#,%q<sheet_who>)=@pemit %#=notice(SHEET,Only [name(%q<sheet_who>)] and staff can read [poss(%q<sheet_who>)] sheet.,error); @pemit %#=u(%!/FUN`SCREEN`SHEET,%q<sheet_who>,%#)
        flags: [cmdsyntax]
      # +sheet/set [<name>/]<skill>=<rating>: a number or a ladder word. Empty clears it back to Mediocre.
      INC`SHEET`SET:
        value: |-
          @assert %q<cmd_has_equals>=@pemit %#=notice(SHEET,+sheet/set <[u(%!/FUN`TRAIT`NOUN)]>=<rating>%, such as +sheet/set [lcstr(first(u(%!/FUN`TRAIT`ALL)))]=3 or =good.,warn); @include %!/INC`NEED`WHO; @include %!/INC`NEED`EDITABLE; @assert strlen(setr(trait_key,u(%!/FUN`TRAIT`FIND,%q<sheet_what>)))=@pemit %#=notice(SHEET,There is no [u(%!/FUN`TRAIT`NOUN)] '%q<sheet_what>'. +sheet/traits lists them.,warn); @break not(strlen(%q<cmd_right_side>))={@include/args %!/INC`DO`SET=who,%q<sheet_who>,leaf,RATING`%q<trait_key>,value,; @pemit %#=notice(SHEET,u(%!/FUN`TRAIT`LABEL,%q<trait_key>) is cleared on [name(%q<sheet_who>)]'s sheet.,ok)}; think setq(set_value,u(%!/FUN`LADDER`READ,%q<cmd_right_side>)); @assert isint(%q<set_value>)=@pemit %#=notice(SHEET,'%q<cmd_right_side>' is not a rating. Give a number from -2 to 8 or a ladder word such as Good.,warn); @assert cand(gte(%q<set_value>,-2),lte(%q<set_value>,if(%q<viewer_keeper>,8,get(%!/DATA`CONFIG`CAP))))=@pemit %#=notice(SHEET,A rating goes from -2 to [u(%!/FUN`LADDER`SHOW,if(%q<viewer_keeper>,8,get(%!/DATA`CONFIG`CAP)))].,warn); @include/args %!/INC`DO`SET=who,%q<sheet_who>,leaf,RATING`%q<trait_key>,value,%q<set_value>; @pemit %#=notice(SHEET,u(%!/FUN`TRAIT`LABEL,%q<trait_key>) is [u(%!/FUN`LADDER`SHOW,%q<set_value>)] on [name(%q<sheet_who>)]'s sheet.[if(not(comp(%q<sheet_who>,%q<viewer_objid>)),u(%!/FUN`HINT,SET))],ok)
        flags: [cmdsyntax]
      # +sheet/aspect [<name>/]<slot>=<text>: concept, trouble, or a number. Empty clears it.
      INC`SHEET`ASPECT:
        value: |-
          @assert %q<cmd_has_equals>=@pemit %#=notice(SHEET,+sheet/aspect <slot>=<aspect>: concept%, trouble%, or 1 to [sub(get(%!/DATA`CONFIG`ASPECTS),2)].,warn); @include %!/INC`NEED`WHO; @include %!/INC`NEED`EDITABLE; @assert strlen(setr(aspect_slot,u(%!/FUN`ASPECT`SLOT,%q<sheet_what>)))=@pemit %#=notice(SHEET,There is no aspect '%q<sheet_what>'. Use concept%, trouble%, or 1 to [sub(get(%!/DATA`CONFIG`ASPECTS),2)].,warn); @assert lte(strlen(%q<cmd_right_side>),200)=@pemit %#=notice(SHEET,Keep an aspect to 200 characters.,warn); @include/args %!/INC`DO`SET=who,%q<sheet_who>,leaf,ASPECT`%q<aspect_slot>,value,%q<cmd_right_side>; @pemit %#=notice(SHEET,if(strlen(%q<cmd_right_side>),[u(%!/FUN`ASPECT`LABEL,%q<aspect_slot>)] on [name(%q<sheet_who>)]'s sheet: %q<cmd_right_side>,[u(%!/FUN`ASPECT`LABEL,%q<aspect_slot>)] is cleared on [name(%q<sheet_who>)]'s sheet.),ok)
        flags: [cmdsyntax]
      # +sheet/stress [<name>/]<track>=<box> marks a box; =clear empties the track. Any time, on your own sheet.
      INC`SHEET`STRESS:
        value: |-
          @assert %q<cmd_has_equals>=@pemit %#=notice(SHEET,+sheet/stress <track>=<box> marks a box%, =clear empties the track.,warn); @include %!/INC`NEED`WHO; @assert strlen(setr(track_key,u(%!/FUN`LIST`FIND,TRACK,%q<sheet_what>)))=@pemit %#=notice(SHEET,There is no stress track '%q<sheet_what>'. The tracks are [itemize(lcstr(u(%!/FUN`LIST`ALL,TRACK)))].,warn); think setq(track_boxes,default({{store}}/TRACK`%q<track_key>`BOXES,3)); @break strmatch(%q<cmd_right_side>,clear)={@include/args %!/INC`DO`SET=who,%q<sheet_who>,leaf,STRESS`%q<track_key>,value,; @pemit %#=notice(SHEET,[name(%q<sheet_who>)]'s [lcstr(get({{store}}/TRACK`%q<track_key>))] stress is clear.,ok)}; @assert cand(isint(%q<cmd_right_side>),gte(%q<cmd_right_side>,1),lte(%q<cmd_right_side>,%q<track_boxes>))=@pemit %#=notice(SHEET,The [lcstr(get({{store}}/TRACK`%q<track_key>))] track has boxes 1 to %q<track_boxes>.,warn); think setq(track_marked,get(%q<sheet_who>/FATE`STRESS`%q<track_key>)); @assert not(member(%q<track_marked>,%q<cmd_right_side>))=@pemit %#=notice(SHEET,Box %q<cmd_right_side> is marked already.,warn); @include/args %!/INC`DO`SET=who,%q<sheet_who>,leaf,STRESS`%q<track_key>,value,sort(%q<track_marked> %q<cmd_right_side>,n); @pemit %#=notice(SHEET,[name(%q<sheet_who>)] marks [lcstr(get({{store}}/TRACK`%q<track_key>))] stress box %q<cmd_right_side>.,ok)
