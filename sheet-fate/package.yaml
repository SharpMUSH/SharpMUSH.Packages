          setunion(iter(u(%!/FUN`LEDGER`ALL,%0),if(strmatch(extract(%i0,4,1,`),%1),extract(%i0,5,1,`))),)
        flags: [funsyntax]
      # %0 a target, %1 a key: what it is, "Fight", "physical stress track", "refresh".
      FUN`LEDGER`WHAT:
        value: |-
          switch(%0,RATING,u(%!/FUN`TRAIT`LABEL,%1),BOXES,[lcstr(get({{store}}/TRACK`%1))] stress track,refresh)
        flags: [funsyntax]
      # %0 a target, %1 a grant's value: "Good (+3)", "+1", "4".
      FUN`LEDGER`GRANTSHOW:
        value: |-
          if(strmatch(first(%1),add),u(%!/FUN`DISPLAY`SIGNED,last(%1)),if(strmatch(%0,RATING),u(%!/FUN`LADDER`SHOW,last(%1)),last(%1)))
        flags: [funsyntax]
      # %0 a character, %1 a target, %2 a key: its value on the sheet now.
      FUN`LEDGER`NOW:
        value: |-
