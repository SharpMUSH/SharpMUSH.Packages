          setq(ledger_grants,iter(lattr(%0/FATE`GRANT`*`%1`%2),get(%0/%i0),%b,|))[setqm(ledger_bases,squish(iter(%q<ledger_grants>,if(strmatch(%i0,base *),last(%i0)),|,%b)),ledger_adds,squish(iter(%q<ledger_grants>,if(strmatch(%i0,add *),last(%i0)),|,%b)))][add(if(words(%q<ledger_bases>),lmath(max,%q<ledger_bases>),%3),ladd(%q<ledger_adds>))]
        flags: [funsyntax]
      # %0 a character, %1 a target: the keys something is granted for.
      FUN`LEDGER`KEYS:
