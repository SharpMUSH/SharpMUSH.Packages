      # TARGET is RATING (KEY a skill or approach), BOXES (KEY a stress track) or REFRESH (KEY ALL). A value is the
      # highest base, or the game's default when no grant sets one, plus every add. SHEET is +sheet/set's source and
      # STAFF a keeper's; other packages name their own. FATE`RATING, FATE`BOXES and FATE`REFRESH are rebuilt from it.
      # %0 a character: the grants, as attribute names.
      FUN`LEDGER`ALL:
        value: |-
          filterbool(%!/FUN`LEDGER`ISGRANT,lattr(%0/FATE`GRANT`**))
        flags: [funsyntax]
      FUN`LEDGER`ISGRANT:
        value: |-
          eq(words(%0,`),5)
        flags: [funsyntax]
      # %0 a grant's attribute name, %1 a source pattern: 1 when it comes from a matching source.
      FUN`LEDGER`FROM:
        value: |-
          strmatch(extract(%0,3,1,`),%1)
        flags: [funsyntax]
      # %0 a character, %1 a target, %2 a key, %3 the game's value: what the grants make it.
      FUN`LEDGER`VALUE:
