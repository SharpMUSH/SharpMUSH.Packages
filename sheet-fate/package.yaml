format: "1.16"
package: sheet-fate
title: "Fate sheet"
version: 1.1.0
authors: [SharpMUSH]
description: "A Fate character sheet: skills or the six approaches on the ladder, aspects, stunts, stress tracks, consequences and fate points. +sheet shows and fills it in, +chargen walks a player through it, and +check rolls four Fate dice plus a rating against an opposition for the room. The build is a ledger of grants; staff give milestones and breakthroughs that stay on a log, and players spend them with +sheet/advance. +encounter gives each encounter its own copy of fate points, stress and consequences. Fate Core and Fate Accelerated SRD material under CC BY 3.0."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, fate, dice, checks, aspects]
category: Characters
requires_server: ">=0.1"

# One permission, for the people who keep sheets: change any character's sheet at any time, read every sheet,
# and hand out fate points. A player fills in their own skills and aspects until they are approved, and marks
# their own stress, consequences and spent fate points at any time. Changing the lists and settings is
# config.admin, as +config is.
categories:
  roles:
    - name: Fate sheet
      description: Roles for the people who keep Fate character sheets.
  permissions:
    - name: Fate sheet
      description: Keeping Fate character sheets.
permissions:
  - name: softcode.fate.admin
    category: Fate sheet
    description: Read every Fate sheet, change any character's at any time, and award and refresh fate points.
roles:
  - slug: fate-sheet-keeper
    name: Fate Sheet Keeper
    category: Fate sheet
    priority: 11
    permissions:
      softcode.fate.admin: allow

# Every character's FATE tree is their Fate sheet: only wizards write it, so a player can't make the root
# before the sheet does, and it is never a command.
attributes:
  FATE:
    flags: [wizard, no_command]

objects:
  # The command object, in the master room. WIZARD because it adds the commands (@command/add, @hook),
  # writes the sheet attributes on characters, and reads them for other packages.
  #
  # A character's sheet is their own attributes under FATE`. The build is a ledger, FATE`GRANT`<SOURCE>`<TARGET>`<KEY>
  # (see FUN`LEDGER`), and FATE`RATING`<KEY> a skill's or approach's rating, FATE`BOXES`<TRACK> a track's length
  # and FATE`REFRESH the refresh are rebuilt from it. FATE`ASPECT`<SLOT> an aspect (CONCEPT, TROUBLE, then 1, 2,
  # ...), FATE`STUNT`<n> a stunt. In play: FATE`STRESS`<TRACK> the marked boxes, FATE`CONSEQUENCE`<SLOT> a
  # consequence, FATE`POINTS the fate points. FATE`ENCOUNTERS the encounters they take part in, in the order
  # they joined, and FATE`USING the one they picked with +encounter/use.
  # The FATE root is wizard-flagged, so only this object writes them.
  #
  # +sheet and +check are added with /noparse/rsnoparse and hooked to CMD`<word>, so what a player types
  # reaches the code exactly as typed and nothing a player wrote is ever evaluated.
  #
  # Trees: CMD` the hooked commands, INC`COMMAND` the parse and dispatch, INC`SHEET` and INC`CHECK` one
  # routine per switch, INC`NEED` the guards they share, INC`DO` the writes. FUN`TRAIT` the skills or
  # approaches, FUN`LADDER` the ladder, FUN`PERM` who may do what, FUN`SCREEN` and FUN`DISPLAY` the screens.
  # API` the functions other packages call (VISUAL), the same names in every sheet package.
  # Bridges add HINT`<message> lines, GATE`EDIT (a reason a player may not change their own sheet now),
  # GATE`SET (a reason nobody sets ratings by hand, when another package works them out), ALLOW`VIEW`<name>
  # (who else may read a sheet) and SECTION`<name> (a part of the +sheet screen, with TITLE and ORDER beneath).
  - ref: sheet
    type: thing
    name: Fate Sheet
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      # ---- settings ---------------------------------------------------------------
      # +config fate shows and changes them (sheet-fate-config); the code reads each with get(%!/DATA`CONFIG`<NAME>).
      DATA`CONFIG: |-
        Settings for the Fate sheet. One leaf per setting.
      DATA`CONFIG`LABEL: |-
        Fate sheet
      DATA`CONFIG`MODE: |-
        skills
      DATA`CONFIG`MODE`TYPE: |-
        choice
      DATA`CONFIG`MODE`DEFAULT: |-
        skills
      DATA`CONFIG`MODE`CHOICES: |-
        skills approaches
      DATA`CONFIG`MODE`LABEL: |-
        Skills or approaches
      DATA`CONFIG`MODE`DESCRIPTION: |-
        skills: the skill list, each rated from Mediocre up. approaches: the six approaches instead.
      DATA`CONFIG`MODE`EXAMPLE: |-
        approaches
      DATA`CONFIG`CAP: |-
        4
      DATA`CONFIG`CAP`TYPE: |-
        integer
      DATA`CONFIG`CAP`DEFAULT: |-
        4
      DATA`CONFIG`CAP`MIN: |-
        0
      DATA`CONFIG`CAP`MAX: |-
        8
      DATA`CONFIG`CAP`LABEL: |-
        Highest rating
      DATA`CONFIG`CAP`DESCRIPTION: |-
        The highest rating a player gives a skill or approach. Sheet keepers may go to +8.
      DATA`CONFIG`CAP`EXAMPLE: |-
        3
      DATA`CONFIG`PYRAMID: |-
        1
      DATA`CONFIG`PYRAMID`TYPE: |-
        boolean
      DATA`CONFIG`PYRAMID`DEFAULT: |-
        1
      DATA`CONFIG`PYRAMID`LABEL: |-
        Skill columns
      DATA`CONFIG`PYRAMID`DESCRIPTION: |-
        Whether the sheet warns when a skills sheet has more skills at a rating than at the one below it.
      DATA`CONFIG`PYRAMID`EXAMPLE: |-
        no
      DATA`CONFIG`REFRESH: |-
        3
      DATA`CONFIG`REFRESH`TYPE: |-
        integer
      DATA`CONFIG`REFRESH`DEFAULT: |-
        3
      DATA`CONFIG`REFRESH`MIN: |-
        0
      DATA`CONFIG`REFRESH`MAX: |-
        20
      DATA`CONFIG`REFRESH`LABEL: |-
        Refresh
      DATA`CONFIG`REFRESH`DESCRIPTION: |-
        How many fate points a character starts each session with, unless a keeper sets their own.
      DATA`CONFIG`REFRESH`EXAMPLE: |-
        2
      DATA`CONFIG`ASPECTS: |-
        5
      DATA`CONFIG`ASPECTS`TYPE: |-
        integer
      DATA`CONFIG`ASPECTS`DEFAULT: |-
        5
      DATA`CONFIG`ASPECTS`MIN: |-
        2
      DATA`CONFIG`ASPECTS`MAX: |-
        10
      DATA`CONFIG`ASPECTS`LABEL: |-
        Aspects
      DATA`CONFIG`ASPECTS`DESCRIPTION: |-
        How many aspects a sheet has: a high concept, a trouble, and the rest free.
      DATA`CONFIG`ASPECTS`EXAMPLE: |-
        3
      DATA`CONFIG`STUNTS: |-
        3
      DATA`CONFIG`STUNTS`TYPE: |-
        integer
      DATA`CONFIG`STUNTS`DEFAULT: |-
        3
      DATA`CONFIG`STUNTS`MIN: |-
        0
      DATA`CONFIG`STUNTS`MAX: |-
        10
      DATA`CONFIG`STUNTS`LABEL: |-
        Stunts
      DATA`CONFIG`STUNTS`DESCRIPTION: |-
        How many stunt slots a sheet has. 0 leaves stunts off the sheet.
      DATA`CONFIG`STUNTS`EXAMPLE: |-
        5
      DATA`CONFIG`OPPOSITION: |-
        0 1 2 3 4
      DATA`CONFIG`OPPOSITION`TYPE: |-
        list
      DATA`CONFIG`OPPOSITION`DEFAULT: |-
        0 1 2 3 4
      DATA`CONFIG`OPPOSITION`MIN: |-
        5
      DATA`CONFIG`OPPOSITION`MAX: |-
        5
      DATA`CONFIG`OPPOSITION`CHECK: |-
        CHECK`OPPOSITION
      DATA`CONFIG`OPPOSITION`LABEL: |-
        Opposition for each difficulty
      DATA`CONFIG`OPPOSITION`DESCRIPTION: |-
        The opposition of trivial, easy, standard, hard and extreme, on the ladder, in that order.
      DATA`CONFIG`OPPOSITION`EXAMPLE: |-
        0 2 3 4 6
      DATA`CONFIG`PUBLIC: |-
        0
      DATA`CONFIG`PUBLIC`TYPE: |-
        boolean
      DATA`CONFIG`PUBLIC`DEFAULT: |-
        0
      DATA`CONFIG`PUBLIC`LABEL: |-
        Sheets anyone can read
      DATA`CONFIG`PUBLIC`DESCRIPTION: |-
        Whether +sheet <name> shows anyone's sheet to everyone. Otherwise only the character and sheet keepers see it.
      DATA`CONFIG`PUBLIC`EXAMPLE: |-
        yes
      DATA`CONFIG`SKILLS`TYPE: |-
        table
      DATA`CONFIG`SKILLS`LABEL: |-
        Skills
      DATA`CONFIG`SKILLS`DESCRIPTION: |-
        The skills a skills sheet rates.
      DATA`CONFIG`SKILLS`STORE: |-
        {{store}}
      DATA`CONFIG`SKILLS`PATH: |-
        SKILL
      DATA`CONFIG`SKILLS`ENTRY: |-
        label
      DATA`CONFIG`SKILLS`FIELDS: |-
        label order
      DATA`CONFIG`SKILLS`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`SKILLS`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`SKILLS`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`SKILLS`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`SKILLS`FIELD`LABEL`LABEL: |-
        Label
      DATA`CONFIG`SKILLS`FIELD`LABEL`DESCRIPTION: |-
        The name the sheet shows.
      DATA`CONFIG`SKILLS`FIELD`ORDER`TYPE: |-
        integer
      DATA`CONFIG`SKILLS`FIELD`ORDER`DEFAULT: |-
        50
      DATA`CONFIG`SKILLS`FIELD`ORDER`MIN: |-
        0
      DATA`CONFIG`SKILLS`FIELD`ORDER`MAX: |-
        999
      DATA`CONFIG`SKILLS`FIELD`ORDER`LABEL: |-
        Order
      DATA`CONFIG`SKILLS`FIELD`ORDER`DESCRIPTION: |-
        Where it comes in its list: lower first, then by name.
      DATA`CONFIG`APPROACHES`TYPE: |-
        table
      DATA`CONFIG`APPROACHES`LABEL: |-
        Approaches
      DATA`CONFIG`APPROACHES`DESCRIPTION: |-
        The approaches an approaches sheet rates.
      DATA`CONFIG`APPROACHES`STORE: |-
        {{store}}
      DATA`CONFIG`APPROACHES`PATH: |-
        APPROACH
      DATA`CONFIG`APPROACHES`ENTRY: |-
        label
      DATA`CONFIG`APPROACHES`FIELDS: |-
        label order
      DATA`CONFIG`APPROACHES`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`APPROACHES`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`APPROACHES`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`APPROACHES`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`APPROACHES`FIELD`LABEL`LABEL: |-
        Label
      DATA`CONFIG`APPROACHES`FIELD`LABEL`DESCRIPTION: |-
        The name the sheet shows.
      DATA`CONFIG`APPROACHES`FIELD`ORDER`TYPE: |-
        integer
      DATA`CONFIG`APPROACHES`FIELD`ORDER`DEFAULT: |-
        50
      DATA`CONFIG`APPROACHES`FIELD`ORDER`MIN: |-
        0
      DATA`CONFIG`APPROACHES`FIELD`ORDER`MAX: |-
        999
      DATA`CONFIG`APPROACHES`FIELD`ORDER`LABEL: |-
        Order
      DATA`CONFIG`APPROACHES`FIELD`ORDER`DESCRIPTION: |-
        Where it comes in its list: lower first, then by name.
      DATA`CONFIG`TRACKS`TYPE: |-
        table
      DATA`CONFIG`TRACKS`LABEL: |-
        Stress tracks
      DATA`CONFIG`TRACKS`DESCRIPTION: |-
        The stress tracks on every sheet, and how many boxes each has.
      DATA`CONFIG`TRACKS`STORE: |-
        {{store}}
      DATA`CONFIG`TRACKS`PATH: |-
        TRACK
      DATA`CONFIG`TRACKS`ENTRY: |-
        label
      DATA`CONFIG`TRACKS`FIELDS: |-
        label boxes order
      DATA`CONFIG`TRACKS`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`TRACKS`FIELD`ORDER`TYPE: |-
        integer
      DATA`CONFIG`TRACKS`FIELD`ORDER`DEFAULT: |-
        50
      DATA`CONFIG`TRACKS`FIELD`ORDER`MIN: |-
        0
      DATA`CONFIG`TRACKS`FIELD`ORDER`MAX: |-
        999
      DATA`CONFIG`TRACKS`FIELD`ORDER`LABEL: |-
        Order
      DATA`CONFIG`TRACKS`FIELD`ORDER`DESCRIPTION: |-
        Where it comes in its list: lower first, then by name.
      DATA`CONFIG`TRACKS`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`TRACKS`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`TRACKS`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`TRACKS`FIELD`LABEL`LABEL: |-
        Label
      DATA`CONFIG`TRACKS`FIELD`LABEL`DESCRIPTION: |-
        The name the sheet shows.
      DATA`CONFIG`TRACKS`FIELD`BOXES`TYPE: |-
        integer
      DATA`CONFIG`TRACKS`FIELD`BOXES`DEFAULT: |-
        3
      DATA`CONFIG`TRACKS`FIELD`BOXES`MIN: |-
        1
      DATA`CONFIG`TRACKS`FIELD`BOXES`MAX: |-
        10
      DATA`CONFIG`TRACKS`FIELD`BOXES`LABEL: |-
        Boxes
      DATA`CONFIG`TRACKS`FIELD`BOXES`DESCRIPTION: |-
        How many boxes the track has. Each box takes one shift.
      DATA`CONFIG`CONSEQUENCES`TYPE: |-
        table
      DATA`CONFIG`CONSEQUENCES`LABEL: |-
        Consequences
      DATA`CONFIG`CONSEQUENCES`DESCRIPTION: |-
        The consequence slots on every sheet, and how many shifts each takes.
      DATA`CONFIG`CONSEQUENCES`STORE: |-
        {{store}}
      DATA`CONFIG`CONSEQUENCES`PATH: |-
        CONSEQUENCE
      DATA`CONFIG`CONSEQUENCES`ENTRY: |-
        label
      DATA`CONFIG`CONSEQUENCES`FIELDS: |-
        label shifts order
      DATA`CONFIG`CONSEQUENCES`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`CONSEQUENCES`FIELD`ORDER`TYPE: |-
        integer
      DATA`CONFIG`CONSEQUENCES`FIELD`ORDER`DEFAULT: |-
        50
      DATA`CONFIG`CONSEQUENCES`FIELD`ORDER`MIN: |-
        0
      DATA`CONFIG`CONSEQUENCES`FIELD`ORDER`MAX: |-
        999
      DATA`CONFIG`CONSEQUENCES`FIELD`ORDER`LABEL: |-
        Order
      DATA`CONFIG`CONSEQUENCES`FIELD`ORDER`DESCRIPTION: |-
        Where it comes in its list: lower first, then by name.
      DATA`CONFIG`CONSEQUENCES`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`CONSEQUENCES`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`CONSEQUENCES`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`CONSEQUENCES`FIELD`LABEL`LABEL: |-
        Label
      DATA`CONFIG`CONSEQUENCES`FIELD`LABEL`DESCRIPTION: |-
        The name the sheet shows.
      DATA`CONFIG`CONSEQUENCES`FIELD`SHIFTS`TYPE: |-
        integer
      DATA`CONFIG`CONSEQUENCES`FIELD`SHIFTS`DEFAULT: |-
        2
      DATA`CONFIG`CONSEQUENCES`FIELD`SHIFTS`MIN: |-
        1
      DATA`CONFIG`CONSEQUENCES`FIELD`SHIFTS`MAX: |-
        20
      DATA`CONFIG`CONSEQUENCES`FIELD`SHIFTS`LABEL: |-
        Shifts
      DATA`CONFIG`CONSEQUENCES`FIELD`SHIFTS`DESCRIPTION: |-
        How many shifts of a hit the consequence takes.
      CHECK`OPPOSITION: |-
        if(cand(every(%!/FUN`IS`RATING,%0),eq(words(%0),5),not(comp(%0,sort(%0,n)))),,Give five ratings from -2 to 8%, trivial to extreme%, none lower than the one before.)
      FUN`IS`RATING: |-
        cand(isint(%0),gte(%0,-2),lte(%0,8))

      # Which INC` routine each switch runs: DATA`ROUTE`<table>`<switch>. BARE is the command alone, ARG the
      # command with something after it and no switch.
      DATA`ROUTE: |-
        Which routine each switch runs. One leaf per switch.
      DATA`ROUTE`SHEET`BARE: |-
        SHEET`SHOW
      DATA`ROUTE`SHEET`ARG: |-
        SHEET`SHOW
      DATA`ROUTE`SHEET`SET: |-
        SHEET`SET
      DATA`ROUTE`SHEET`ASPECT: |-
        SHEET`ASPECT
      DATA`ROUTE`SHEET`STUNT: |-
        SHEET`STUNT
      DATA`ROUTE`SHEET`STRESS: |-
        SHEET`STRESS
      DATA`ROUTE`SHEET`BOXES: |-
        SHEET`BOXES
      DATA`ROUTE`SHEET`RECOVER: |-
        SHEET`RECOVER
      DATA`ROUTE`SHEET`CONSEQUENCE: |-
        SHEET`CONSEQUENCE
      DATA`ROUTE`SHEET`SPEND: |-
        SHEET`SPEND
      DATA`ROUTE`SHEET`AWARD: |-
        SHEET`AWARD
      DATA`ROUTE`SHEET`REFRESH: |-
        SHEET`REFRESH
      DATA`ROUTE`SHEET`TRAITS: |-
        SHEET`TRAITS
      DATA`ROUTE`SHEET`GRANT: |-
        SHEET`GRANT
      DATA`ROUTE`SHEET`LEDGER: |-
        SHEET`LEDGER
      DATA`ROUTE`SHEET`REVOKE: |-
        SHEET`REVOKE
      DATA`ROUTE`SHEET`CLEAR: |-
        SHEET`CLEAR
      DATA`ROUTE`SHEET`MILESTONE: |-
        SHEET`MILESTONE
      DATA`ROUTE`SHEET`BREAKTHROUGH: |-
        SHEET`BREAKTHROUGH
      DATA`ROUTE`SHEET`POWERUP: |-
        SHEET`POWERUP
      DATA`ROUTE`SHEET`VOID: |-
        SHEET`VOID
      DATA`ROUTE`SHEET`ADVANCE: |-
        SHEET`ADVANCE
      DATA`ROUTE`SHEET`ADVANCES: |-
        SHEET`ADVANCES
      DATA`ROUTE`CHECK`BARE: |-
        CHECK`USAGE
      DATA`ROUTE`CHECK`ARG: |-
        CHECK`ROLL
      DATA`ROUTE`CHECK`PRIVATE: |-
        CHECK`ROLL
      DATA`ROUTE`ENCOUNTER`BARE: |-
        ENCOUNTER`SHOW
      DATA`ROUTE`ENCOUNTER`ARG: |-
        ENCOUNTER`SHOW
      DATA`ROUTE`ENCOUNTER`START: |-
        ENCOUNTER`START
      DATA`ROUTE`ENCOUNTER`JOIN: |-
        ENCOUNTER`JOIN
      DATA`ROUTE`ENCOUNTER`ADD: |-
        ENCOUNTER`ADD
      DATA`ROUTE`ENCOUNTER`REMOVE: |-
        ENCOUNTER`REMOVE
      DATA`ROUTE`ENCOUNTER`LEAVE: |-
        ENCOUNTER`LEAVE
      DATA`ROUTE`ENCOUNTER`KEEP: |-
        ENCOUNTER`KEEP
      DATA`ROUTE`ENCOUNTER`END: |-
        ENCOUNTER`END
      DATA`ROUTE`ENCOUNTER`USE: |-
        ENCOUNTER`USE
      DATA`ROUTE`CHARGEN`BARE: |-
        CHARGEN`SHOW
      DATA`ROUTE`CHARGEN`ARG: |-
        CHARGEN`SHOW
      # What a character's encounter copy holds: PLAY`<NAME>, a leaf under FATE`, * for every one beneath it.
      # Packages add their own, such as a machine's stress.
      PLAY`STRESS: |-
        STRESS`*
      PLAY`CONSEQUENCE: |-
        CONSEQUENCE`*
      PLAY`POINTS: |-
        POINTS
      # Advancement, as Fate Condensed has it. A keeper's award gives what DATA`ADV`KIND`<kind> lists, one letter each:
      # M a milestone, S a skill step, H a new high concept, R a point of refresh. +sheet/advance spends one on an
      # ADVANCE`<KEY> option: its name, with TOKEN (what it costs; %0 the character, %1 and %2 what was typed),
      # USAGE, SKIP (%0: 1 when it does not apply) and RUN (%0, %1, %2: makes the change and says what changed, or
      # #-1 and why, having changed nothing) beneath. Packages add their own options.
      DATA`ADV`KIND`MILESTONE: |-
        M
      DATA`ADV`KIND`BREAKTHROUGH: |-
        M S H
      DATA`ADV`KIND`REFRESH: |-
        R
      DATA`ADV`KIND`SKILL: |-
        S
      DATA`ADV`TOKEN`M: |-
        milestone
      DATA`ADV`TOKEN`S: |-
        skill step
      DATA`ADV`TOKEN`H: |-
        new high concept
      DATA`ADV`TOKEN`R: |-
        point of refresh
      ADVANCE`SWAP: |-
        Switch the ratings of two skills, or put one at Average (+1) in place of one that is not on your sheet
      ADVANCE`SWAP`TOKEN: |-
        M
      ADVANCE`SWAP`USAGE: |-
        swap <skill>=<skill>
      ADVANCE`SWAP`SKIP:
        value: |-
          hasattr(%!,GATE`SET)
        flags: [funsyntax]
      ADVANCE`SWAP`RUN:
        value: |-
          setqm(r_one,u(%!/FUN`TRAIT`FIND,%1),r_two,u(%!/FUN`TRAIT`FIND,%2))[cond(not(strlen(%q<r_one>)),#-1 There is no [u(%!/FUN`TRAIT`NOUN)] '%1'.,not(strlen(%q<r_two>)),#-1 There is no [u(%!/FUN`TRAIT`NOUN)] '%2'.,not(comp(%q<r_one>,%q<r_two>)),#-1 Name two different [u(%!/FUN`TRAIT`NOUN)]s.,not(comp(setr(r_one_was,u(%!/API`RATING,%0,%q<r_one>)),u(%!/API`RATING,%0,%q<r_two>))),#-1 [u(%!/FUN`TRAIT`LABEL,%q<r_one>)] and [u(%!/FUN`TRAIT`LABEL,%q<r_two>)] are both [u(%!/FUN`LADDER`SHOW,%q<r_one_was>)]: switching them changes nothing.,1,[null(iter(lattr(%0/FATE`GRANT`*),[setqm(swap_one,get(%0/%i0`RATING`[ucstr(%q<r_one>)]),swap_two,get(%0/%i0`RATING`[ucstr(%q<r_two>)]))][u(%!/FUN`DO`WRITE,%0,after(%i0,FATE`)`RATING`[ucstr(%q<r_one>)],%q<swap_two>)][u(%!/FUN`DO`WRITE,%0,after(%i0,FATE`)`RATING`[ucstr(%q<r_two>)],%q<swap_one>)]))][u(%!/API`REBUILD,%0)][u(%!/FUN`TRAIT`LABEL,%q<r_one>)] is [u(%!/FUN`LADDER`SHOW,u(%!/API`RATING,%0,%q<r_one>))] and [u(%!/FUN`TRAIT`LABEL,%q<r_two>)] [u(%!/FUN`LADDER`SHOW,u(%!/API`RATING,%0,%q<r_two>))].)]
        flags: [funsyntax]
      ADVANCE`ASPECT: |-
        Rewrite one aspect; the high concept takes a new high concept from a breakthrough
      ADVANCE`ASPECT`TOKEN:
        value: |-
          if(strmatch(u(%!/FUN`ASPECT`SLOT,%1),CONCEPT),H,M)
        flags: [funsyntax]
      ADVANCE`ASPECT`USAGE: |-
        aspect <slot>=<aspect>
      ADVANCE`ASPECT`RUN:
        value: |-
          setq(r_slot,u(%!/FUN`ASPECT`SLOT,%1))[cond(not(strlen(%q<r_slot>)),#-1 There is no aspect '%1'. Use concept%, trouble%, or 1 to [sub(get(%!/DATA`CONFIG`ASPECTS),2)].,not(strlen(%2)),#-1 Write the new aspect after =.,gt(strlen(%2),200),#-1 Keep an aspect to 200 characters.,1,[u(%!/FUN`DO`WRITE,%0,ASPECT`%q<r_slot>,%2)][u(%!/FUN`ASPECT`LABEL,%q<r_slot>)] is now: %2)]
        flags: [funsyntax]
      ADVANCE`STUNT: |-
        Rewrite one stunt, or buy a new one in an empty slot for a point of refresh
      ADVANCE`STUNT`TOKEN: |-
        M
      ADVANCE`STUNT`USAGE: |-
        stunt <slot>=<stunt>
      ADVANCE`STUNT`SKIP:
        value: |-
          not(gt(get(%!/DATA`CONFIG`STUNTS),0))
        flags: [funsyntax]
      ADVANCE`STUNT`RUN:
        value: |-
          setq(r_new,not(strlen(get(%0/FATE`STUNT`%1))))[cond(not(cand(isint(%1),gte(%1,1),lte(%1,get(%!/DATA`CONFIG`STUNTS)))),#-1 There is no stunt slot '%1'. Use 1 to [get(%!/DATA`CONFIG`STUNTS)].,not(strlen(%2)),#-1 Write the stunt after =.,gt(strlen(%2),300),#-1 Keep a stunt to 300 characters.,cand(%q<r_new>,lte(u(%!/FUN`POINTS`REFRESH,%0),1)),#-1 A new stunt costs a point of refresh%, and refresh never goes below 1.,1,[if(%q<r_new>,u(%!/FUN`ADV`ADD,%0,REFRESH,ALL,-1))][u(%!/FUN`DO`WRITE,%0,STUNT`%1,%2)]Stunt %1 is now: %2[if(%q<r_new>,%b%(Refresh [u(%!/FUN`POINTS`REFRESH,%0)] now.%))])]
        flags: [funsyntax]
      ADVANCE`SKILL: |-
        Raise one skill a step, even from Mediocre (+0) to Average (+1)
      ADVANCE`SKILL`TOKEN: |-
        S
      ADVANCE`SKILL`USAGE: |-
        skill <skill>
      ADVANCE`SKILL`SKIP:
        value: |-
          hasattr(%!,GATE`SET)
        flags: [funsyntax]
      ADVANCE`SKILL`RUN:
        value: |-
