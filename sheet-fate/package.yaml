        flags: [funsyntax]
      FUN`PERM`ALLOWS:
        value: |-
          u(%!/%0,%1,%2)
        flags: [funsyntax]
      FUN`GATE`EDIT:
        value: |-
          if(hasattr(%!,GATE`EDIT),u(%!/GATE`EDIT,%0))
        flags: [funsyntax]
      FUN`GATE`SET:
        value: |-
          if(hasattr(%!,GATE`SET),u(%!/GATE`SET,%0))
        flags: [funsyntax]
      FUN`PLAYER`MATCH:
        value: |-
