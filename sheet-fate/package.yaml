        flags: [funsyntax]
      # %0 the character, %1 the keys. Skills rated other than Mediocre, highest first, one line per rating; approaches
      # all, each with its rating.
      FUN`SCREEN`RATINGS:
        value: |-
          if(strmatch(u(%!/FUN`TRAIT`PATH),APPROACH),lfields(lit({"cols":2}),iter(%1,u(%!/FUN`TRAIT`LABEL,%i0),%b,%*<|>),iter(%1,u(%!/FUN`LADDER`SHOW,default(%0/FATE`RATING`%i0,0)),%b,%*<|>),%*<|>),setq(ratings_used,revwords(setdiff(setunion(iter(%1,default(%0/FATE`RATING`%i0,0)),,,n),0,,n)))[if(words(%q<ratings_used>),lfields(,iter(%q<ratings_used>,u(%!/FUN`LADDER`SHOW,%i0),%b,%*<|>),iter(%q<ratings_used>,itemize(iter(filterbool(%!/FUN`RATING`IS,%1,,,%0,%i0),u(%!/FUN`TRAIT`LABEL,%i0),%b,|),|),%b,%*<|>),%*<|>),tone(muted,Every skill is Mediocre %(+0%).))])
        flags: [funsyntax]
      # %0 a key, %1 a character, %2 a rating: 1 when the key has that rating.
      FUN`RATING`IS:
        value: |-
          eq(default(%1/FATE`RATING`%0,0),%2)
        flags: [funsyntax]
      # %0 the character, %1 a track: [X] [ ] [ ].
      FUN`DISPLAY`BOXES:
        value: |-
          setq(boxes_marked,get(%0/FATE`STRESS`%1))[iter(lnum(1,default({{store}}/TRACK`%1`BOXES,3)),if(member(%q<boxes_marked>,%i0),%[X%],%[%b%]))]
        flags: [funsyntax]
      # %0 the character: what a skills sheet breaks, or nothing. More skills at a rating than at the one below.
      FUN`SHEET`PROBLEMS:
        value: |-
          if(cand(strmatch(u(%!/FUN`TRAIT`PATH),SKILL),get(%!/DATA`CONFIG`PYRAMID)),setq(problem_counts,iter(lnum(0,8),words(iter(u(%!/FUN`TRAIT`ALL),if(eq(default(%0/FATE`RATING`%i0,0),%i1),%i0)))))[trim(iter(lnum(2,8),if(gt(extract(%q<problem_counts>,inc(%i0),1),extract(%q<problem_counts>,%i0,1)),More skills at [u(%!/FUN`LADDER`SHOW,%i0)] than at [u(%!/FUN`LADDER`SHOW,dec(%i0))].)))])
        flags: [funsyntax]
      FUN`DISPLAY`FOOTER:
        value: |-
          cond(cand(not(comp(objid(%1),%0)),not(isapproved(%1)),not(u(%!/FUN`PERM`KEEPER,%1))),+sheet/set <[u(%!/FUN`TRAIT`NOUN)]>=<rating> and +sheet/aspect <slot>=<text> fill it in. +check <[u(%!/FUN`TRAIT`NOUN)]> rolls.[u(%!/FUN`HINT,FOOTER)],not(comp(objid(%1),%0)),+check <[u(%!/FUN`TRAIT`NOUN)]> rolls. +sheet/spend spends a fate point%, +sheet/stress <track>=<box> marks stress.,+check <[u(%!/FUN`TRAIT`NOUN)]> rolls four Fate dice plus a rating.)
        flags: [funsyntax]
      FUN`SCREEN`TRAITS:
        value: |-
          setq(screen_all,u(%!/FUN`TRAIT`ALL))[box(ldatatable(lit({"nowrap":"1"}),Key|[capstr(u(%!/FUN`TRAIT`NOUN))],iter(%q<screen_all>,lcstr(%i0)|[u(%!/FUN`TRAIT`LABEL,%i0)],,%*<^>),%*<^>)%r[rule()]%r[tone(muted,The ladder: [iter(revwords(lnum(-2,8)),u(%!/FUN`LADDER`SHOW,%i0),%b,%,%b)].)],Fate [u(%!/FUN`TRAIT`NOUN)]s)]
        flags: [funsyntax]

      # ---- the sheet API ------------------------------------------------------------
      # What other packages call: u({{sheet-fate/sheet}}/API`<NAME>,...). Every sheet package has these names.
      # They read and roll; API`AWARD is the one that writes.
      API:
        value: |-
          The Fate sheet's functions for other packages. See the package README.
        flags: [VISUAL]
      # JSON list of the skills or approaches: [{"key","label","group","always"}], group skill or approach.
      # always is true for every one: an unrated skill rolls at Mediocre (+0).
      API`TRAITS:
        value: |-
          json_array(iter(u(%!/FUN`TRAIT`ALL),json(object,key,json(string,lcstr(%i0)),label,json(string,u(%!/FUN`TRAIT`LABEL,%i0)),group,json(string,u(%!/FUN`TRAIT`NOUN)),always,json(boolean,1)),%b,|),|)
        flags: [VISUAL]
      # The keys every character can roll, lower case: all of them.
      API`ALWAYS:
        value: |-
          lcstr(u(%!/FUN`TRAIT`ALL))
        flags: [VISUAL]
      API`FIND:
        value: |-
          lcstr(u(%!/FUN`TRAIT`FIND,%0))
        flags: [VISUAL]
      API`LABEL:
        value: |-
          u(%!/FUN`TRAIT`LABEL,ucstr(%0))
        flags: [VISUAL]
      # %0 a character, %1 a key: the rating, 0 (Mediocre) when it is not set.
      API`RATING:
        value: |-
          default(%0/FATE`RATING`[ucstr(%1)],0)
        flags: [VISUAL]
      API`HAS:
        value: |-
          hasattr(%0,FATE)
        flags: [VISUAL]
      # %0 a number, a ladder word or a difficulty word: the opposition, or nothing.
      API`TARGET:
        value: |-
          cond(member(v(DATA`DIFFICULTIES),lcstr(%0)),extract(get(%!/DATA`CONFIG`OPPOSITION),member(v(DATA`DIFFICULTIES),lcstr(%0)),1),strlen(%0),u(%!/FUN`LADDER`READ,%0))
        flags: [VISUAL]
      # %0 the shifts (total less opposition): fail below 0, partial on a tie, success at 1 or 2, crit-success
      # (success with style) at 3 or more.
      API`TIER:
        value: |-
          cond(not(isint(%0)),,lt(%0,0),fail,eq(%0,0),partial,lt(%0,3),success,crit-success)
        flags: [VISUAL]
      # %0 a rating: its ladder word.
      API`LADDER:
        value: |-
          u(%!/FUN`LADDER`WORD,%0)
        flags: [VISUAL]
      # %0 a character: their fate points.
      API`POINTS:
        value: |-
          default(%0/FATE`POINTS,u(%!/FUN`POINTS`REFRESH,%0))
        flags: [VISUAL]
      # %0 a character, %1 a number of fate points to give (or take, below 0): writes them, never below 0, and
      # returns the new count.
      API`AWARD:
        value: |-
          setq(award_new,max(0,add(u(%!/API`POINTS,%0),%1)))[if(hasattr(%0,FATE),,attrib_set(%0/FATE,This character's Fate sheet. +sheet shows it.)[set(%0/FATE,wizard)][set(%0/FATE,no_command)])][attrib_set(%0/FATE`POINTS,%q<award_new>)]%q<award_new>
        flags: [VISUAL]
      # Named: %<roller> an objid, %<trait> a key, %<modifier> a number to add, %<target> the opposition or
      # nothing. Rolls 4dF plus the rating and keeps the roll (roll() record), and returns
      # {"tier","total","shifts","target","margin","label","text","roll","formula"}; tier, shifts and margin are
      # empty without an opposition. #-1 and why when the trait or roller is wrong.
      API`CHECK:
        value: |-
          cond(not(hastype(%<roller>,player)),#-1 There is no character to roll for.,not(strlen(u(%!/FUN`TRAIT`FIND,%<trait>))),#-1 There is no [u(%!/FUN`TRAIT`NOUN)] '%<trait>'.,u(%!/FUN`CHECK`ROLLED,ucstr(u(%!/FUN`TRAIT`FIND,%<trait>)),add(u(%!/API`RATING,%<roller>,u(%!/FUN`TRAIT`FIND,%<trait>)),firstof(%<modifier>,0)),%<target>))
        flags: [VISUAL]
      # %0 the key, %1 what is added, %2 the opposition or nothing.
      FUN`CHECK`ROLLED:
        value: |-
          setqm(rolled_formula,4dF[if(gte(%1,0),+%1,%1)],
          rolled,roll(%q<rolled_formula>,,record),
          rolled_total,json_query(%q<rolled>,extract,$.total),
          rolled_shifts,if(strlen(%2),sub(%q<rolled_total>,%2)))[json(object,tier,json(string,u(%!/API`TIER,%q<rolled_shifts>)),total,%q<rolled_total>,shifts,json(string,%q<rolled_shifts>),target,json(string,%2),margin,json(string,%q<rolled_shifts>),label,json(string,u(%!/FUN`TRAIT`LABEL,%0)),text,json(string,json_query(%q<rolled>,extract,$.text)),roll,json_query(%q<rolled>,extract,$.id),formula,json(string,%q<rolled_formula>))]
        flags: [funsyntax]

      # ---- lifecycle ----------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP:
        value: |-
          @command/add/noparse/rsnoparse +sheet; @hook/override/inline +sheet=%!,CMD`SHEET; @command/add/noparse/rsnoparse +check; @hook/override/inline +check=%!,CMD`CHECK
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

  # The lists on every sheet. Inside the Fate Sheet, so no player can reach it, and no_command, so nothing kept
  # on it is ever matched as a command. SKILL`<KEY> and APPROACH`<KEY> each hold a label, with ORDER beneath;
  # TRACK`<KEY> a stress track with BOXES; CONSEQUENCE`<KEY> a consequence slot with SHIFTS. Staff change them
  # with +config fate/skills, /approaches, /tracks and /consequences.
  - ref: store
    type: thing
    name: Fate Sheet Store
    location: "{{sheet}}"
    flags: [no_command]
    attributes:
      SKILL: |-
        The skills a skills sheet rates, one branch each, keyed as a player types it.
      SKILL`ATHLETICS: |-
        Athletics
      SKILL`BURGLARY: |-
        Burglary
      SKILL`CONTACTS: |-
        Contacts
      SKILL`CRAFTS: |-
        Crafts
      SKILL`DECEIVE: |-
        Deceive
      SKILL`DRIVE: |-
        Drive
      SKILL`EMPATHY: |-
        Empathy
      SKILL`FIGHT: |-
        Fight
      SKILL`INVESTIGATE: |-
        Investigate
      SKILL`LORE: |-
        Lore
      SKILL`NOTICE: |-
        Notice
      SKILL`PHYSIQUE: |-
        Physique
      SKILL`PROVOKE: |-
        Provoke
      SKILL`RAPPORT: |-
        Rapport
      SKILL`RESOURCES: |-
        Resources
      SKILL`SHOOT: |-
        Shoot
      SKILL`STEALTH: |-
        Stealth
      SKILL`WILL: |-
        Will
      APPROACH: |-
        The approaches an approaches sheet rates, one branch each.
      APPROACH`CAREFUL: |-
        Careful
      APPROACH`CLEVER: |-
        Clever
      APPROACH`FLASHY: |-
        Flashy
      APPROACH`FORCEFUL: |-
        Forceful
      APPROACH`QUICK: |-
        Quick
      APPROACH`SNEAKY: |-
        Sneaky
      TRACK: |-
        The stress tracks, one branch each, with BOXES beneath.
      TRACK`PHYSICAL: |-
        Physical
      TRACK`PHYSICAL`BOXES: |-
        3
      TRACK`PHYSICAL`ORDER: |-
        1
      TRACK`MENTAL: |-
        Mental
      TRACK`MENTAL`BOXES: |-
        3
      TRACK`MENTAL`ORDER: |-
        2
      CONSEQUENCE: |-
        The consequence slots, one branch each, with SHIFTS beneath.
      CONSEQUENCE`MILD: |-
        Mild
      CONSEQUENCE`MILD`SHIFTS: |-
        2
      CONSEQUENCE`MILD`ORDER: |-
        1
      CONSEQUENCE`MODERATE: |-
        Moderate
      CONSEQUENCE`MODERATE`SHIFTS: |-
        4
      CONSEQUENCE`MODERATE`ORDER: |-
        2
      CONSEQUENCE`SEVERE: |-
        Severe
      CONSEQUENCE`SEVERE`SHIFTS: |-
        6
      CONSEQUENCE`SEVERE`ORDER: |-
        3
  # The +help topics, on an object of their own. sheet-fate-help registers it with +help; without that bridge
  # nothing reads it. HELP`<TOPIC> is a topic, its subtopics the leaves beneath, LOCK`<TOPIC> who may read it.
  - ref: sheet_help
    type: thing
    name: Fate Sheet Help
    location: "{{sheet}}"
    attributes:
      HELP: |-
        Your character's Fate sheet, and rolling against it: +sheet and +check.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`SHEET: |-
        check
      SEE`CHECK: |-
        sheet
      HELP`SHEET: |-
        `+sheet` shows your character's sheet: fate points, aspects, skills on the ladder, stress and consequences.

        - `+sheet` shows your own; `+sheet <name>` another character's, when the game lets you read it.
        - `+sheet/set <skill>=<rating>` rates a skill, as a number or a ladder word: `+sheet/set fight=3`, `+sheet/set notice=fair`. Leave the rating out to put it back to Mediocre.
        - `+sheet/aspect <slot>=<aspect>` writes an aspect: `concept`, `trouble`, or a number for the others.
        - `+sheet/traits` lists the skills and the ladder.

        You rate skills and write aspects until your character is approved; then staff change them. The ladder runs from Terrible \(-2\) through Mediocre \(+0\), Average, Fair, Good and Great \(+4\) to Legendary \(+8\). Your game may rate the six approaches instead of skills.

        For example:

        `+sheet/aspect trouble=Owes the Duke a favour`

        Output: `\[SHEET\] Done: Trouble on Alice's sheet: Owes the Duke a favour`

        See `+help sheet play` for stress and fate points, and `+help check` for rolling.
      HELP`SHEET`PLAY: |-
        In play you keep your own stress, consequences and fate points:

        - `+sheet/stress <track>=<box>` marks a stress box: `+sheet/stress physical=2`. `+sheet/stress <track>=clear` empties the track.
        - `+sheet/recover` clears every stress box, once a scene is over.
        - `+sheet/consequence <slot>=<aspect>` takes a consequence: `+sheet/consequence mild=Bruised ribs`. Leave the aspect out to clear it.
        - `+sheet/spend \[<what for>\]` spends a fate point where the room sees it: `+sheet/spend Invoking Owes the Duke`.

        For example:

        `+sheet/spend Invoking Never leaves a friend`

        Output: `\[SHEET\] Alice spends a fate point: Invoking Never leaves a friend. 2 left.`

        Staff give fate points back at the start of a session, up to your refresh.
      HELP`CHECK: |-
        `+check <skill>` rolls four Fate dice, each -1, 0 or +1, and adds the skill's rating, where the room sees it.

        - `+check <skill>=<opposition>` rolls against an opposition: a number, a ladder word such as `fair`, or a difficulty: trivial, easy, standard, hard or extreme \(+0 to +4 unless your game changed them\).
        - `+check <skill>+<n>` or `-<n>` adds or takes away a number for this roll, such as +2 for an invoked aspect: `+check fight+2=good`.
        - `/private` rolls where only you see it.

        Each step above the opposition is a shift. Below it you fail; level with it is a tie; one or two shifts are a success; three or more succeed with style. Every check is kept under a number that `rollinfo()` reads back.

        For example:

        `+check fight=fair`

        Output: `\[SHEET\] Alice rolls Fight: 4dF\[1, 0, -1, 1\] + 3 = 4 (Great) against Fair (+2): success, 2 shifts (roll 42)`
      HELP`SHEET`CREDITS: |-
        The Fate sheet is based on Fate Core System and Fate Accelerated Edition \(found at https://www.faterpg.com/\), products of Evil Hat Productions, LLC, developed, authored, and edited by Leonard Balsera, Brian Engard, Jeremy Keller, Ryan Macklin, Mike Olson, Clark Valentine, Amanda Valentine, Fred Hicks, and Rob Donoghue, and licensed for our use under the Creative Commons Attribution 3.0 Unported license \(https://creativecommons.org/licenses/by/3.0/\).

        It is based on Fate Condensed \(found at https://www.faterpg.com/\), a product of Evil Hat Productions, LLC, developed, authored, and edited by PK Sullivan, Lara Turner, Fred Hicks, Richard Bellingham, Robert Hanz, and Sophie Lagacé, and licensed for our use under the Creative Commons Attribution 3.0 Unported license.

        Fate is a trademark of Evil Hat Productions, LLC. This game's sheet is not affiliated with or endorsed by Evil Hat Productions.
      LOCK`SHEET`STAFF: |-
        perm^softcode.fate.admin
      HELP`SHEET`STAFF: |-
        Sheet keepers \(`softcode.fate.admin`, or the Fate Sheet Keeper role\) read every sheet and change any character's at any time:

        - `+sheet <name>` shows a character's sheet.
        - `/set`, `/aspect`, `/stress` and `/consequence` take `<name>/` first: `+sheet/set Alice/fight=5`. A keeper may rate a skill up to +8. `+sheet/recover <name>` clears their stress.
        - `+sheet/award <name>[=<points>]` gives fate points, 1 unless you say, or takes them with a number below 0.
        - `+sheet/refresh <name>` brings their fate points up to their refresh. `+sheet/refresh <name>=<n>` gives them a refresh of their own, `=default` the game's again.

        `@role/assign <player>=fate-sheet-keeper` makes someone a keeper.
      LOCK`SHEET`SETTINGS: |-
        perm^config.admin
      HELP`SHEET`SETTINGS: |-
        `+config fate` lists the settings and `+config fate/<setting>=<value>` changes one \(`config.admin`\):

        - `mode`: `skills` \(the skill list\) or `approaches` \(Careful, Clever, Flashy, Forceful, Quick and Sneaky\).
        - `cap`: the highest rating a player gives themselves \(4, Great\).
        - `pyramid`: whether the sheet warns when it has more skills at a rating than at the one below \(yes\).
        - `refresh`: fate points each session \(3\). `aspects`: how many aspects a sheet has \(5\).
        - `opposition`: the opposition of trivial, easy, standard, hard and extreme \(`0 1 2 3 4`\).
        - `public`: whether anyone may read anyone's sheet \(no\).
        - `skills`, `approaches`: the two lists. `+config/add fate/skills/sail=Sail` adds a skill.
        - `tracks`: the stress tracks and their boxes. `consequences`: the consequence slots and their shifts.

        Removing a skill or a track leaves what characters had stored, but the sheet stops showing it.
