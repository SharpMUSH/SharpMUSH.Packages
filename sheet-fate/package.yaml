        value: |-
          @assert %q<cmd_has_equals>=@pemit %#=notice(SHEET,+sheet/consequence <slot>=<aspect> takes one%, an empty one clears it. The slots are [itemize(lcstr(u(%!/FUN`LIST`ALL,CONSEQUENCE)))].,warn); @include %!/INC`NEED`WHO; @assert strlen(setr(consequence_key,u(%!/FUN`LIST`FIND,CONSEQUENCE,%q<sheet_what>)))=@pemit %#=notice(SHEET,There is no consequence '%q<sheet_what>'. The slots are [itemize(lcstr(u(%!/FUN`LIST`ALL,CONSEQUENCE)))].,warn); @assert lte(strlen(%q<cmd_right_side>),200)=@pemit %#=notice(SHEET,Keep a consequence to 200 characters.,warn); @include/args %!/INC`DO`SET=who,%q<sheet_who>,leaf,CONSEQUENCE`%q<consequence_key>,value,%q<cmd_right_side>; @pemit %#=notice(SHEET,if(strlen(%q<cmd_right_side>),[name(%q<sheet_who>)] takes a [lcstr(get({{store}}/CONSEQUENCE`%q<consequence_key>))] consequence: %q<cmd_right_side>,[name(%q<sheet_who>)]'s [lcstr(get({{store}}/CONSEQUENCE`%q<consequence_key>))] consequence is cleared.),ok)
        flags: [cmdsyntax]
      # +sheet/spend[ <what for>]: spends a fate point where the room sees it.
      INC`SHEET`SPEND:
        value: |-
          think setq(spend_points,u(%!/API`POINTS,%q<viewer_objid>)); @assert gt(%q<spend_points>,0)=@pemit %#=notice(SHEET,You have no fate points to spend.,warn); @assert lte(strlen(%q<cmd_argument>),200)=@pemit %#=notice(SHEET,Keep what it is for to 200 characters.,warn); @include/args %!/INC`DO`SET=who,%q<viewer_objid>,leaf,POINTS,value,dec(%q<spend_points>); @remit %l=notice(SHEET,tone(strong,name(%#)) spends a fate point[if(strlen(%q<cmd_argument>),: %q<cmd_argument>)]. [dec(%q<spend_points>)] left.)
        flags: [cmdsyntax]
      # +sheet/award <name>[=<n>]: gives fate points, 1 unless a number from -10 to 10 is given.
      INC`SHEET`AWARD:
        value: |-
          @include %!/INC`NEED`KEEPER; @assert strlen(%q<cmd_left_side>)=@pemit %#=notice(SHEET,+sheet/award <name>[=<points>],warn); @include/args %!/INC`NEED`TARGET=name,%q<cmd_left_side>; think setq(award_count,firstof(%q<cmd_right_side>,1)); @assert cand(isint(%q<award_count>),gte(%q<award_count>,-10),lte(%q<award_count>,10),neq(%q<award_count>,0))=@pemit %#=notice(SHEET,Award from -10 to 10 fate points%, not 0.,warn); think setq(award_total,u(%!/API`AWARD,%q<sheet_who>,%q<award_count>)); @pemit %#=notice(SHEET,[name(%q<sheet_who>)] has %q<award_total> fate point[if(neq(%q<award_total>,1),s)] now.,ok); @pemit %q<sheet_who>=notice(SHEET,if(gt(%q<award_count>,0),[name(%#)] gives you %q<award_count> fate point[if(neq(%q<award_count>,1),s)],[name(%#)] takes [abs(%q<award_count>)] fate point[if(neq(%q<award_count>,-1),s)] from you). You have %q<award_total>.)
        flags: [cmdsyntax]
      # +sheet/refresh <name> brings their fate points up to their refresh; <name>=<n> sets their own refresh,
      # =default the game's again.
      INC`SHEET`REFRESH:
        value: |-
          @include %!/INC`NEED`KEEPER; @assert strlen(%q<cmd_left_side>)=@pemit %#=notice(SHEET,+sheet/refresh <name> brings their fate points up to their refresh. +sheet/refresh <name>=<n> sets their refresh.,warn); @include/args %!/INC`NEED`TARGET=name,%q<cmd_left_side>; @break %q<cmd_has_equals>={@include %!/INC`SHEET`REFRESH`SET}; think setq(refresh_to,u(%!/FUN`POINTS`REFRESH,%q<sheet_who>)); @assert lt(u(%!/API`POINTS,%q<sheet_who>),%q<refresh_to>)=@pemit %#=notice(SHEET,[name(%q<sheet_who>)] has [u(%!/API`POINTS,%q<sheet_who>)] fate points%, no fewer than their refresh of %q<refresh_to>.,warn); @include/args %!/INC`DO`SET=who,%q<sheet_who>,leaf,POINTS,value,%q<refresh_to>; @pemit %#=notice(SHEET,[name(%q<sheet_who>)] has %q<refresh_to> fate points again.,ok); @pemit %q<sheet_who>=notice(SHEET,Your fate points are back up to %q<refresh_to>.)
        flags: [cmdsyntax]
