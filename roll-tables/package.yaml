  # ---- help storage -------------------------------------------------------------------------
  # A plain thing, not the WIZARD command object: the librarian cannot u() a privileged object's
  # attributes. Bodies are evaluated, so brackets, parentheses and percent signs are escaped.
  - ref: table_help
    type: thing
    name: Roll Tables Help
    location: "{{roll_tables}}"
    attributes:
      HELP: |-
        Roll tables: weather, encounters, names and anything else rolled at random.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree.
      SEE`TABLES`PUBLISH: |-
        wiki
      HELP`TABLES: |-
        A roll table turns a die roll into something that happens: the weather on the road, who is at the inn, what the storm brings. Rolling one tells everyone in the room what came up.

        ## Reading

        - `+table/list`: the tables you can read. A long list comes in pages: `+table/list/2`.
        - `+table <name>`: one table, its rows and the die it rolls. `+table/2 <name>` is its second page of fifty rows.

        ## Rolling

        - `+table/roll <name>`: roll once and tell the room.
        - `+table/roll <name>=<times>`: roll up to 20 times at once.
        - `+table/roll/private <name>`: only you see the result. `+table/private <name>` is the same.
        - `+table/lookup <name>=<number or key>`: the row a number falls in, or the row with that key, without rolling.

        Example:

        ```
        +table/roll weather
        ```

        Output: everyone in the room sees a line such as Ash rolls 14 on Weather on the coast road: Overcast%, with a fine drizzle blowing in from the headland.

        ## How a table rolls

        - A **die** table rolls its formula, such as `d20`, `2d6` or `d100`, and each row holds a number or a range such as `11-16`. A number no row holds gives no result.
        - A **weight** table picks one row, each as likely as its weight: a row of weight 3 comes up three times as often as a row of weight 1.
        - A table with **none** for its die makes every row equally likely. Rolling it several times deals different rows, like cards from a deck, and its keys are names you can look up.

        A row can roll another table as part of its result, as the weather's storm row does.

        Staff keep the tables: see \[tables staff\]. For code, see \[tables code\].
      HELP`TABLES`STAFF: |-
        Table keepers, who hold the `softcode.tables.admin` permission %(the Table Keeper role gives it%), make and change tables with these commands. They can read every table.

        ## Making a table

        - `+table/create <name>=<die>`: a new, empty table. The name is one word; the die is a formula such as `d20` or `2d6`, `weight`, or `none`.
        - `+table/title <name>=<title>`: what it is called on screen.
        - `+table/die <name>=<die>`: roll it another way. Every row must fit the new die.

        ## Rows

        - `+table/row <name>=<key>|<result>`: add a row. The key is a number or range such as `11-16` on a die table, a whole number on a weight table, and a name on a none table, where it may be left out: `+table/row <name>=<result>`.
        - `+table/row <name>/<number>=<key>|<result>`: replace a row. `+table <name>` shows the numbers.
        - `+table/delrow <name>/<number>`: remove a row. The other rows keep their numbers.

        On a die table the ranges may not overlap, and they must fit inside what the die can roll.

        Example:

        ```
        +table/create omens=d6
        +table/row omens=1-3|Gulls circle the harbour
        +table/row omens=4-6|The bell buoy is silent
        ```

        Output: each command confirms the change, and +table omens then shows two rows rolled on d6.

        ## Who may read a table

        - `+table/lock <name>=<lock key>`: only someone who passes the key may read, roll or look up the table, for example `role^gm` or `perm^softcode.tables.admin`.
        - `+table/lock <name>=`: everyone may read it again.

        ## Removing a table

        - `+table/delete <name>` says what would go, and `+table/delete <name>=yes` removes the table and all its rows.

        To put a table on the wiki, see \[tables publish\]. To edit tables by hand, see \[tables format\].
      HELP`TABLES`FORMAT: |-
        Every table is an attribute tree on the Roll Tables Data object, so a table keeper with access to it can also edit tables by hand with `&`, `examine` and `@edit`.

        ```
        &TABLE`OMENS`DIE <data>=d6
        &TABLE`OMENS`TITLE <data>=Omens at the harbour
        &TABLE`OMENS`ROW`1 <data>=Gulls circle the harbour
        &TABLE`OMENS`ROW`1`KEY <data>=1-3
        ```

        Output: none; the table omens then rolls d6 and has one row.

        ## The tree

        - ``TABLE`<NAME>`DIE``: a roll formula, `weight`, or `none`.
        - ``TABLE`<NAME>`TITLE``: the title.
        - ``TABLE`<NAME>`LOCK``: a lock key; who may read the table. Left out, everyone may.
        - ``TABLE`<NAME>`ROW`<n>``: the result of row `<n>`, evaluated when it is rolled.
        - ``TABLE`<NAME>`ROW`<n>`KEY``: its key: a number or range, a weight, or a name.
        - ``TABLE`<NAME>`PAGE``: the wiki page the table was published to.

        ## Why one attribute per row

        Each row is a leaf of its own, so a row is edited, examined or removed without touching the others, an upgrade of this package merges row by row, and a table of several hundred rows still reads and rolls in well under a second. Row numbers are names rather than places: a table keeps them when a row is removed, and a new row takes the next number.
      HELP`TABLES`CODE: |-
        Two functions on the Roll Tables Functions object answer any object's code. Each checks that the enactor may read the table.

        - ``u%(<functions>/FN`TABLE`ROLL,<name>%)``: one roll's result, or nothing when a die lands on a number no row holds.
        - ``u%(<functions>/FN`TABLE`LOOKUP,<name>,<key>%)``: the row a number falls in, such as row `11-16` for 14, or the row whose key is `<key>`.

        Both give `#-1 NO SUCH TABLE` for a table that does not exist or that the enactor may not read, and the lookup gives `#-1 NO SUCH ROW` when nothing matches.

        ```
        think u%(<functions>/FN`TABLE`LOOKUP,tide,low%)
        ```

        Output: Low water: the causeway is dry and the sands are open

        ## Rows that roll other tables

        A row's result is evaluated when it is rolled, as the Roll Tables Data object, so a row can roll another table with ``%[u%(FN`TABLE`ROLL,<name>%)%]``. Typed into `+table/row`, the call is stored as it is and runs at each roll. Rolls nest at most five deep; a sixth shows as too deep to roll.

        ```
        +table/row weather/7=20|Storm: %[u%(FN`TABLE`ROLL,squall%)%]
        ```

        Output: a confirmation; rolling a 20 on weather then rolls on squall as well.
      HELP`TABLES`PUBLISH: |-
        `+table/publish <name>=<namespace:page>` writes a table to a wiki page, so players can read it in the portal. Only a table keeper who also holds `wiki.create` and `wiki.edit` can publish.

        ```
        +table/publish weather=main:coast_weather
        ```

        Output: a confirmation naming the page, which then shows the table and the die it rolls.

        - The table stays the source. Publishing again rewrites the page; an edit made on the wiki page is overwritten.
        - The package never reads a page back, and only rewrites a page it created: a name that is already another page is refused.
        - Publishing needs a server whose MarkupString has the Markdown format, which MarkupString 2.20 adds. On an older server the command says so and writes nothing.

  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`ROLL-TABLES: |-
        {{table_help}}
