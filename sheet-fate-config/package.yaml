format: "1.20"
package: sheet-fate-config
title: "Fate sheet: +config settings"
version: 1.0.1
authors: [SharpMUSH]
description: "Puts the Fate sheet settings and its trait table into +config: registers them with the +config registry, so staff see and change them with +config fate."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, fate, config, bridge]
category: Game System
subcategory: Fate
bridge: true
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. sheet-fate declares its settings as
# DATA`CONFIG`<NAME>, with their types and limits, and reads them with get() whether or not +config is
# installed. This package is the one leaf that tells the +config registry where they are.
depends:
  - package: sheet-fate
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH.Packages
      path: sheet-fate/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`FATE: |-
        {{sheet-fate/sheet}}
