format: "1.16"
package: sheet-pbta-help
title: "PbtA sheet: +help topics"
version: 1.0.1
authors: [SharpMUSH]
description: "Puts the PbtA sheet topics into +help: registers the sheet-pbta package's help with the +help librarian, and points its messages at +help."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, pbta, help, bridge]
category: Characters
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. sheet-pbta keeps its topics on its own
# help object, and plus-help reads any object registered with its librarian. This package is that
# registration, and the lines that point its messages at +help; uninstalling it takes the topics out of
# +help, and neither package changes.
depends:
  - package: sheet-pbta
    version: ">=2.0 <3.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH.Packages
      path: sheet-pbta/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`SHEET-PBTA: |-
        {{sheet-pbta/sheet_help}}

  # Lines the sheet's messages end with when +help is here, through its FUN`HINT: HINT`<message>.
  - ref: message_hints
    target: "{{sheet-pbta/sheet}}"
    attributes:
      HINT`SWITCHES: |-
        +help %0 lists them.
