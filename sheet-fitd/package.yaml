      ATTRIBUTE`RESOLVE: |-
        Resolve
      ATTRIBUTE`RESOLVE`ORDER: |-
        3
      ACTION: |-
        The actions, one branch each, with the attribute each counts towards.
      ACTION`HUNT: |-
        Hunt
      ACTION`HUNT`ATTRIBUTE: |-
        insight
      ACTION`HUNT`ORDER: |-
        1
      ACTION`STUDY: |-
        Study
      ACTION`STUDY`ATTRIBUTE: |-
        insight
      ACTION`STUDY`ORDER: |-
        2
      ACTION`SURVEY: |-
        Survey
      ACTION`SURVEY`ATTRIBUTE: |-
        insight
      ACTION`SURVEY`ORDER: |-
        3
      ACTION`TINKER: |-
        Tinker
      ACTION`TINKER`ATTRIBUTE: |-
