      ACTION`TINKER`ORDER: |-
        4
      ACTION`FINESSE: |-
        Finesse
      ACTION`FINESSE`ATTRIBUTE: |-
        prowess
      ACTION`FINESSE`ORDER: |-
        5
      ACTION`PROWL: |-
        Prowl
      ACTION`PROWL`ATTRIBUTE: |-
