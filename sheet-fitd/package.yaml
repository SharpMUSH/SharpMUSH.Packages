          setqm(encs_all,setunion(%0,%1,,n),encs_active,u(%!/FUN`ENC`ACTIVE,%2))[box(ldatatable(lit({"nowrap":"1|3|4|5","grow":"|1"}),#|Title|Where|Members|You,iter(%q<encs_all>,%i0|[get({{encounters}}/ENC`%i0)]|[if(member(%0,%i0),here,name(get({{encounters}}/ENC`%i0`ROOM)))]|[words(lattr({{encounters}}/ENC`%i0`COPY`*))]|[cond(member(%q<encs_active>,%i0),rolling here,member(%1,%i0),joined,-)],%b,%*<^>),%*<^>)%r[rule()]%r[tone(muted,+encounter <n> shows one. /join <n> takes part and /use <n> picks which copy you roll from here.)],Encounters)]
        flags: [funsyntax]
      # %0 a member, %1 the encounter: their copy in it, one table row.
      FUN`DISPLAY`ENCROW:
        value: |-
          setq(encrow_path,u(%!/FUN`ENC`PATH,%1,%0))[name(%0)]|[default(%q<encrow_path>STRESS,0)]/[get(%!/DATA`CONFIG`STRESS)]|[firstof(itemize(squish(iter(v(DATA`HARM`SLOTS),get(%q<encrow_path>HARM`%i0),%b,|),|),|),-)]|[default(%q<encrow_path>COIN,0)]|[firstof(itemize(get(%q<encrow_path>TRAUMA),|),-)]|[firstof(edit(get({{encounters}}/ENC`%1`POS`[after(num(%0),#)]),%b,%,%b),-)]
        flags: [funsyntax]
      FUN`SCREEN`TRAITS:
        value: |-
          box(ldatatable(lit({"nowrap":"1|2"}),Key|Action|Attribute,iter(u(%!/FUN`LIST`ALL,ACTION),lcstr(%i0)|[u(%!/FUN`LIST`LABEL,ACTION,%i0)]|[u(%!/FUN`LIST`LABEL,ATTRIBUTE,get({{store}}/ACTION`%i0`ATTRIBUTE))],,%*<^>),%*<^>)%r[rule()]%r[tone(muted,Positions: controlled%, risky%, desperate. Difficulties: [itemize(v(DATA`DIFFICULTIES))].)],Forged in the Dark actions)
        flags: [funsyntax]

      # %0 an encounter, %1 who reads it.
      FUN`SCREEN`FOES:
        value: |-
          setq(sf_nums,u(%!/FUN`FOE`NUMS,%0))[box(if(words(%q<sf_nums>),ldatatable(lit({"nowrap":"1|3|4|5","grow":"|1"}),#|Threat|>Tier|Clock|Harm,iter(%q<sf_nums>,%i0|[u(%!/FUN`FOE`LABEL,%0,%i0)]|[u(%!/FUN`FOE`GET,%0,%i0,tier)]|[u(%!/FUN`FOE`STATE,%0,%i0)]|[u(%!/FUN`FOE`HARMTEXT,%0,%i0)],%b,%*<^>),%*<^>),No foes yet.)%r[rule()]%r[tone(muted,if(u(%!/FUN`ENC`GM,%1,%0),+foe/add <kind>%[=<count>%] adds more. +foe/tick fills a threat's clock%, +foe/harm hurts a member.,+foe <threat> shows one. Your effect fills its clock.))],Foes: [u(%!/FUN`ENC`NAME,%0)])]
        flags: [funsyntax]
      # %0 an encounter, %1 a foe, %2 who reads it.
      FUN`SCREEN`FOE:
        value: |-
          box(lfields(lit({"cols":2}),Tier%*<|>Clock%*<|>Harm,[u(%!/FUN`FOE`GET,%0,%1,tier)]%*<|>[u(%!/FUN`FOE`STATE,%0,%1)]%*<|>[u(%!/FUN`FOE`HARMTEXT,%0,%1)],%*<|>)[if(cand(u(%!/FUN`ENC`GM,%2,%0),strlen(u(%!/FUN`FOE`GET,%0,%1,notes))),%r[rule()]%r[u(%!/FUN`FOE`GET,%0,%1,notes)])],[u(%!/FUN`FOE`LABEL,%0,%1)] in [u(%!/FUN`ENC`NAME,%0)])
        flags: [funsyntax]
      FUN`SCREEN`BESTIARY:
        value: |-
          setq(sb_keys,sortkey(%!/FUN`KIND`SORTKEY,iter(lattr({{store}}/FOE`*),last(%i0,`)),n))[box(if(words(%q<sb_keys>),ldatatable(lit({"nowrap":"1|3|4","grow":"|1"}),Key|Name|>Tier|>Clock|Harm,iter(%q<sb_keys>,[lcstr(%i0)]|[get({{store}}/FOE`%i0)]|[u(%!/FUN`FOE`STORE,%i0,TIER,1)]|[u(%!/FUN`FOE`STORE,%i0,CLOCK,4)]|[u(%!/FUN`FOE`STORE,%i0,HARMTEXT,Hurt)] %(level [u(%!/FUN`FOE`STORE,%i0,HARM,2)]%),%b,%*<^>),%*<^>),The bestiary is empty.)%r[rule()]%r[tone(muted,+foe/bestiary <kind> shows one. The GM adds them with +foe/add <kind>%[=<count>%]. Staff change the list with +config fitd/foes.)],Bestiary)]
        flags: [funsyntax]
      FUN`SCREEN`KIND:
        value: |-
          box(lfields(lit({"cols":2}),Tier%*<|>Clock%*<|>Harm,[u(%!/FUN`FOE`STORE,%0,TIER,1)]%*<|>[u(%!/FUN`FOE`STORE,%0,CLOCK,4) segments]%*<|>[u(%!/FUN`FOE`STORE,%0,HARMTEXT,Hurt) %(level [u(%!/FUN`FOE`STORE,%0,HARM,2)]%)],%*<|>)[if(strlen(get({{store}}/FOE`%0`NOTES)),%r[rule()]%r[get({{store}}/FOE`%0`NOTES)])],[get({{store}}/FOE`%0)] %([lcstr(%0)]%))
        flags: [funsyntax]

      # ---- the sheet API ------------------------------------------------------------
      # What other packages call: u({{sheet-fitd/sheet}}/API`<NAME>,...). Every sheet package has these names.
      # They read the character's sheet itself, never an encounter's copy. They read and roll; API`STRESS and
      # API`AWARD are the ones that write, and API`AWARD's coin is a coin ledger entry.
      API:
        value: |-
          The Forged in the Dark sheet's functions for other packages. See the package README.
        flags: [VISUAL]
      # JSON list of the actions: [{"key","label","group","always"}], group the attribute's key. always is true for
      # every one: an action rated 0 rolls two dice and keeps the lower.
      API`TRAITS:
        value: |-
          json_array(iter(u(%!/FUN`LIST`ALL,ACTION),json(object,key,json(string,lcstr(%i0)),label,json(string,u(%!/FUN`LIST`LABEL,ACTION,%i0)),group,json(string,lcstr(get({{store}}/ACTION`%i0`ATTRIBUTE))),always,json(boolean,1)),%b,|),|)
        flags: [VISUAL]
      API`ALWAYS:
        value: |-
          lcstr(u(%!/FUN`LIST`ALL,ACTION))
        flags: [VISUAL]
      API`FIND:
        value: |-
          lcstr(u(%!/FUN`LIST`FIND,ACTION,%0))
        flags: [VISUAL]
      API`LABEL:
        value: |-
          u(%!/FUN`LIST`LABEL,ACTION,ucstr(%0))
        flags: [VISUAL]
      # %0 a character, %1 an action: its rating on the sheet, 0 when not rated.
      API`RATING:
        value: |-
          u(%!/FUN`R,u(%!/FUN`RATINGS`LIVE,%0),ucstr(%1))
        flags: [VISUAL]
      # %0 a character, %1 an attribute: how many of its actions are rated 1 or more, the dice it resists with.
      API`ATTRIBUTE:
        value: |-
          u(%!/FUN`R`ATTR,u(%!/FUN`RATINGS`LIVE,%0),ucstr(%1))
        flags: [VISUAL]
      API`HAS:
        value: |-
          hasattr(%0,FITD)
        flags: [VISUAL]
      # %0 a position or a difficulty word: the position (controlled, risky, desperate, or none), or nothing.
      API`TARGET:
        value: |-
          cond(member(v(DATA`DIFFICULTIES),lcstr(%0)),lcstr(extract(get(%!/DATA`CONFIG`POSITIONS),member(v(DATA`DIFFICULTIES),lcstr(%0)),1)),member(v(DATA`POSITIONS),lcstr(%0)),lcstr(%0))
        flags: [VISUAL]
      # %0 the highest die, %1 how many dice showed 6 (only counted from a pool of one die or more): crit-success
      # on two 6s or more, success on a 6, partial on 4 or 5, fail on 1 to 3.
      API`TIER:
        value: |-
          cond(not(isint(%0)),,gte(%1,2),crit-success,eq(%0,6),success,gte(%0,4),partial,fail)
        flags: [VISUAL]
      # %0 a character: the stress marked on their sheet.
      API`STRESSED:
        value: |-
          default(%0/FITD`STRESS,0)
        flags: [VISUAL]
      # %0 a character, %1 stress to mark (or clear, below 0) on their sheet. Past the most stress it clears and a
      # trauma is due. Returns {"stress","trauma"}, trauma 1 when one is due.
      API`STRESS:
        value: |-
          u(%!/FUN`STRESS`ADD,%0,%1,1)
        flags: [VISUAL]
      # %0 a character: the coin on their sheet.
      API`COIN:
        value: |-
          default(%0/FITD`COIN,0)
        flags: [VISUAL]
      # %0 a character, %1 coin to give (or take, below 0), %2 why (Reward when empty): a coin ledger entry on
      # their sheet, never below 0; returns the new count.
      API`AWARD:
        value: |-
          u(%!/FUN`COIN`ADD,%0,%1,1,firstof(%2,Reward))
        flags: [VISUAL]

      # ---- lists ------------------------------------------------------------------
      # %0 a list on the store (ACTION, ATTRIBUTE, CLOCK): its keys, in order then by key.
      FUN`LIST`ALL:
        value: |-
          setq(list_path,%0)[sortkey(%!/FUN`LIST`SORTKEY,iter(lattr({{store}}/%0`*),after(%i0,`)))]
        flags: [funsyntax]
      FUN`LIST`SORTKEY:
        value: |-
          rjust(default({{store}}/%q<list_path>`%0`ORDER,50),3,0)%0
        flags: [funsyntax]
      FUN`LIST`LABEL:
        value: |-
          firstof(get({{store}}/%0`%1),lcstr(%1))
        flags: [funsyntax]
      # %0 a list, %1 typed text: the key it names, by key, by label, or by the start of one, or nothing.
      FUN`LIST`FIND:
        value: |-
          setqm(find_typed,trim(%1),
          find_all,u(%!/FUN`LIST`ALL,%0),
          find_exact,iter(%q<find_all>,if(cor(not(comp(%i0,ucstr(%q<find_typed>))),not(comp(lcstr(get({{store}}/%0`%i0)),lcstr(%q<find_typed>)))),%i0)),
          find_start,iter(%q<find_all>,if(cor(not(comp(left(%i0,strlen(%q<find_typed>)),ucstr(%q<find_typed>))),not(comp(lcstr(left(get({{store}}/%0`%i0),strlen(%q<find_typed>))),lcstr(%q<find_typed>)))),%i0)))[if(strlen(%q<find_typed>),first(firstof(%q<find_exact>,if(eq(words(%q<find_start>),1),%q<find_start>))))]
        flags: [funsyntax]
      # %0 an attribute key: the actions under it, in order.
      FUN`ATTRIBUTE`ACTIONS:
        value: |-
          setq(attribute_of,%0)[filterbool(%!/FUN`ATTRIBUTE`HAS,u(%!/FUN`LIST`ALL,ACTION))]
        flags: [funsyntax]
      FUN`ATTRIBUTE`HAS:
        value: |-
          not(comp(ucstr(get({{store}}/ACTION`%0`ATTRIBUTE)),%q<attribute_of>))
        flags: [funsyntax]

      # ---- harm -------------------------------------------------------------------
      FUN`HARM`SLOTS:
        value: |-
          filterbool(%!/FUN`HARM`OFLEVEL,v(DATA`HARM`SLOTS),,,%0)
        flags: [funsyntax]
      FUN`HARM`OFLEVEL:
        value: |-
          eq(left(%0,1),%1)
        flags: [funsyntax]
      # %0 a character, %1 a level: the first free slot at that level or above, where they play now, or nothing
      # when level 3 is full.
      FUN`HARM`FREE:
        value: |-
          first(iter(v(DATA`HARM`SLOTS),if(cand(gte(left(%i0,1),%1),not(strlen(u(%!/FUN`P,%0,HARM`%i0)))),%i0)))
        flags: [funsyntax]

      # ---- dice -------------------------------------------------------------------
      # %0 a pool: rolls it and keeps the roll. One die or more keeps the highest; none rolls two and keeps the lower.
      FUN`POOL`ROLL:
        value: |-
          roll(if(gt(%0,0),%0d6kh1,2d6kl1),,record)
        flags: [funsyntax]
      # %0 a recorded roll, %1 the pool: 1 when two dice or more show 6, which a pool of none never counts.
      FUN`POOL`CRIT:
        value: |-
          cand(gt(%1,0),gte(words(iter(lnum(0,dec(json_query(json_query(%0,extract,$.dice%[0%].results),size))),if(eq(json_query(%0,extract,$.dice%[0%].results%[%i0%].result),6),x))),2))
        flags: [funsyntax]

      # Named: %<roller> an objid, %<trait> an action key, %<modifier> dice to add (or take), %<target> the position
      # or nothing. Rolls the pool and keeps the roll (roll() record), and returns
      # {"tier","total","sixes","dice","target","label","text","roll","formula"}. #-1 and why when the action or
      # roller is wrong.
      API`CHECK:
        value: |-
          cond(not(hastype(%<roller>,player)),#-1 There is no character to roll for.,not(strlen(u(%!/FUN`LIST`FIND,ACTION,%<trait>))),#-1 There is no action '%<trait>'.,u(%!/FUN`CHECK`ROLLED,u(%!/FUN`LIST`FIND,ACTION,%<trait>),max(0,add(u(%!/API`RATING,%<roller>,u(%!/FUN`LIST`FIND,ACTION,%<trait>)),firstof(%<modifier>,0))),%<target>))
        flags: [VISUAL]
      # %0 the key, %1 the pool, %2 the position or nothing.
      FUN`CHECK`ROLLED:
        value: |-
          setqm(rolled,u(%!/FUN`POOL`ROLL,%1),
          rolled_total,json_query(%q<rolled>,extract,$.total),
          rolled_sixes,if(u(%!/FUN`POOL`CRIT,%q<rolled>,%1),2,eq(%q<rolled_total>,6)))[json(object,tier,json(string,u(%!/API`TIER,%q<rolled_total>,%q<rolled_sixes>)),total,%q<rolled_total>,sixes,%q<rolled_sixes>,dice,%1,target,json(string,%2),label,json(string,u(%!/FUN`LIST`LABEL,ACTION,%0)),text,json(string,json_query(%q<rolled>,extract,$.text)),roll,json_query(%q<rolled>,extract,$.id),formula,json(string,json_query(%q<rolled>,extract,$.formula)))]
        flags: [funsyntax]

      # ---- lifecycle ----------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP:
        value: |-
          @command/add/noparse/rsnoparse +sheet; @hook/override/inline +sheet=%!,CMD`SHEET; @command/add/noparse/rsnoparse +check; @hook/override/inline +check=%!,CMD`CHECK; @command/add/noparse/rsnoparse +clock; @hook/override/inline +clock=%!,CMD`CLOCK; @command/add/noparse/rsnoparse +encounter; @hook/override/inline +encounter=%!,CMD`ENCOUNTER; @command/add/noparse/rsnoparse +foe; @hook/override/inline +foe=%!,CMD`FOE
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

  # The lists, and the game's clocks. Inside the FitD Sheet, so no player can reach it, and no_command, so nothing
