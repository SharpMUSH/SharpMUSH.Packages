format: "1.20"
package: sheet-fitd
title: "Forged in the Dark sheet"
version: 2.2.4
authors: [SharpMUSH]
description: "A Forged in the Dark character sheet: twelve action ratings under three attributes, built from a ledger, with XP for each attribute spent on advances, stress, trauma, harm and coin, separate audited ledgers for XP and coin, encounters that play from copies of the sheets, with threats from a list the game edits and positions and effect, and progress clocks. +check rolls a pool of six-sided dice and reads the highest against a position for the room; +check/resist rolls an attribute to resist a consequence. Based on the Blades in the Dark SRD under CC BY 3.0."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, fitd, forged in the dark, dice, clocks]
category: Game System
subcategory: Forged in the Dark
requires_server: ">=1.0"
verified_server: "1.0"

# One permission, for the people who keep sheets: change any character's sheet at any time, read every sheet,
# give XP and coin, take traumas off, revoke and clear ledger entries, run any encounter, and change anyone's
# clocks. A player rates their own actions until they are approved, then spends XP on advances, and keeps their
# own stress, trauma and harm at any time. Changing the lists and settings is config.admin, as
# +config is.
categories:
  roles:
    - name: Forged in the Dark sheet
      description: Roles for the people who keep Forged in the Dark character sheets.
  permissions:
    - name: Forged in the Dark sheet
      description: Keeping Forged in the Dark character sheets.
permissions:
  - name: softcode.fitd.admin
    category: Forged in the Dark sheet
    description: Read every Forged in the Dark sheet, change any character's at any time, and change anyone's clocks.
roles:
  - slug: fitd-sheet-keeper
    name: FitD Sheet Keeper
    category: Forged in the Dark sheet
    priority: 11
    permissions:
      softcode.fitd.admin: allow

# Every character's FITD tree is their FitD sheet: only wizards write it, so a player can't make the root
# before the sheet does, and it is never a command.
attributes:
  FITD:
    flags: [wizard, no_command]

objects:
  # The command object, in the master room. WIZARD because it adds the commands (@command/add, @hook),
  # writes the sheet attributes on characters, and reads them for other packages.
  #
  # A character's sheet is their own attributes under FITD`: FITD`LEDGER`<n> the entries their action ratings
  # are built from and FITD`MERGED a cache of the ones in force, FITD`XPLEDGER`<n> and FITD`MONEYLEDGER`<n> the
  # XP and coin ledgers, FITD`XP`<ATTRIBUTE> and FITD`COIN caches of their running totals, FITD`STRESS the
  # stress marked, FITD`TRAUMA the traumas (a |-list), FITD`HARM`<SLOT> a harm (slots 1A 1B 2A 2B 3A), and
  # FITD`ENCOUNTERS and FITD`USING the encounters they are in. The FITD root is wizard-flagged, so only this
  # object writes them.
  #
  # +sheet, +check, +encounter and +clock are added with /noparse/rsnoparse and hooked to CMD`<word>, so what a
  # player types reaches the code exactly as typed and nothing a player wrote is ever evaluated.
  #
  # Trees: CMD` the hooked commands, INC`COMMAND` the parse and dispatch, INC`SHEET`, INC`CHECK`, INC`ENCOUNTER`
  # and INC`CLOCK` one routine per switch, INC`NEED` the guards they share, INC`DO` the writes. FUN`LEDGER` and FUN`BUILD` the ledger,
  # FUN`RATINGS` and FUN`R` the ratings, FUN`P and FUN`PSET where play happens, FUN`ENC` the encounters, FUN`BOOK`
  # the XP and coin ledgers, FUN`LIST` the actions,
  # FUN`ATTRIBUTE` the attributes, FUN`HARM` the harm slots, FUN`POOL` the dice, FUN`PERM` who may do what,
  # FUN`SCREEN` and FUN`DISPLAY` the screens. API` the functions other packages call (VISUAL), the same names in
  # every sheet package. Bridges add HINT`<message> lines, GATE`EDIT (a reason a player may not change their own
  # sheet now) and ALLOW`VIEW`<name> (who else may read a sheet).
  - ref: sheet
    type: thing
    name: FitD Sheet
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      # ---- settings ---------------------------------------------------------------
      # +config fitd shows and changes them (sheet-fitd-config); the code reads each with get(%!/DATA`CONFIG`<NAME>).
      DATA`CONFIG: |-
        Settings for the Forged in the Dark sheet. One leaf per setting.
      DATA`CONFIG`LABEL: |-
        Forged in the Dark sheet
      DATA`CONFIG`CAP: |-
        2
      DATA`CONFIG`CAP`TYPE: |-
        integer
      DATA`CONFIG`CAP`DEFAULT: |-
        2
      DATA`CONFIG`CAP`MIN: |-
        0
      DATA`CONFIG`CAP`MAX: |-
        4
      DATA`CONFIG`CAP`LABEL: |-
        Highest rating
      DATA`CONFIG`CAP`DESCRIPTION: |-
        The highest rating a player gives an action while making a character. Advances and sheet keepers go up to 4.
      DATA`CONFIG`CAP`EXAMPLE: |-
        3
      DATA`CONFIG`DOTS: |-
        7
      DATA`CONFIG`DOTS`TYPE: |-
        integer
      DATA`CONFIG`DOTS`DEFAULT: |-
        7
      DATA`CONFIG`DOTS`MIN: |-
        0
      DATA`CONFIG`DOTS`MAX: |-
        48
      DATA`CONFIG`DOTS`LABEL: |-
        Starting dots
      DATA`CONFIG`DOTS`DESCRIPTION: |-
        The action dots a new character shares out among their actions.
      DATA`CONFIG`DOTS`EXAMPLE: |-
        6
      DATA`CONFIG`ADVANCE: |-
        6
      DATA`CONFIG`ADVANCE`TYPE: |-
        integer
      DATA`CONFIG`ADVANCE`DEFAULT: |-
        6
      DATA`CONFIG`ADVANCE`MIN: |-
        1
      DATA`CONFIG`ADVANCE`MAX: |-
        99
      DATA`CONFIG`ADVANCE`LABEL: |-
        XP for an advance
      DATA`CONFIG`ADVANCE`DESCRIPTION: |-
        The XP of one attribute an approved player spends to add a dot to one of its actions.
      DATA`CONFIG`ADVANCE`EXAMPLE: |-
        8
      DATA`CONFIG`STRESS: |-
        9
      DATA`CONFIG`STRESS`TYPE: |-
        integer
      DATA`CONFIG`STRESS`DEFAULT: |-
        9
      DATA`CONFIG`STRESS`MIN: |-
        1
      DATA`CONFIG`STRESS`MAX: |-
        20
      DATA`CONFIG`STRESS`LABEL: |-
        Stress boxes
      DATA`CONFIG`STRESS`DESCRIPTION: |-
        How much stress a character takes before the next point brings a trauma and clears it.
      DATA`CONFIG`STRESS`EXAMPLE: |-
        8
      DATA`CONFIG`TRAUMA: |-
        4
      DATA`CONFIG`TRAUMA`TYPE: |-
        integer
      DATA`CONFIG`TRAUMA`DEFAULT: |-
        4
      DATA`CONFIG`TRAUMA`MIN: |-
        1
      DATA`CONFIG`TRAUMA`MAX: |-
        10
      DATA`CONFIG`TRAUMA`LABEL: |-
        Traumas
      DATA`CONFIG`TRAUMA`DESCRIPTION: |-
        How many traumas a character takes before they must retire.
      DATA`CONFIG`TRAUMA`EXAMPLE: |-
        3
      DATA`CONFIG`POSITIONS: |-
        none controlled risky desperate desperate
      DATA`CONFIG`POSITIONS`TYPE: |-
        text
      DATA`CONFIG`POSITIONS`DEFAULT: |-
        none controlled risky desperate desperate
      DATA`CONFIG`POSITIONS`MAX: |-
        60
      DATA`CONFIG`POSITIONS`CHECK: |-
        CHECK`POSITIONS
      DATA`CONFIG`POSITIONS`LABEL: |-
        Position for each difficulty
      DATA`CONFIG`POSITIONS`DESCRIPTION: |-
        The position of trivial, easy, standard, hard and extreme, in that order: controlled, risky, desperate, or none for no roll at all.
      DATA`CONFIG`POSITIONS`EXAMPLE: |-
        none controlled controlled risky desperate
      DATA`CONFIG`DICE: |-
        0 0 0 0 -1
      DATA`CONFIG`DICE`TYPE: |-
        text
      DATA`CONFIG`DICE`DEFAULT: |-
        0 0 0 0 -1
      DATA`CONFIG`DICE`MAX: |-
        30
      DATA`CONFIG`DICE`CHECK: |-
        CHECK`DICE
      DATA`CONFIG`DICE`LABEL: |-
        Dice for each difficulty
      DATA`CONFIG`DICE`DESCRIPTION: |-
        Dice added to or taken from the pool at trivial, easy, standard, hard and extreme, in that order.
      DATA`CONFIG`DICE`EXAMPLE: |-
        1 0 0 -1 -1
      DATA`CONFIG`PUBLIC: |-
        0
      DATA`CONFIG`PUBLIC`TYPE: |-
        boolean
      DATA`CONFIG`PUBLIC`DEFAULT: |-
        0
      DATA`CONFIG`PUBLIC`LABEL: |-
        Sheets anyone can read
      DATA`CONFIG`PUBLIC`DESCRIPTION: |-
        Whether +sheet <name> shows anyone's sheet to everyone. Otherwise only the character and sheet keepers see it.
      DATA`CONFIG`PUBLIC`EXAMPLE: |-
        yes
      DATA`CONFIG`ACTIONS`TYPE: |-
        table
      DATA`CONFIG`ACTIONS`LABEL: |-
        Actions
      DATA`CONFIG`ACTIONS`DESCRIPTION: |-
        The actions a sheet rates, and the attribute each one counts towards.
      DATA`CONFIG`ACTIONS`STORE: |-
        {{store}}
      DATA`CONFIG`ACTIONS`PATH: |-
        ACTION
      DATA`CONFIG`ACTIONS`ENTRY: |-
        label
      DATA`CONFIG`ACTIONS`FIELDS: |-
        label attribute order
      DATA`CONFIG`ACTIONS`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`ACTIONS`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`ACTIONS`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`ACTIONS`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`ACTIONS`FIELD`LABEL`LABEL: |-
        Label
      DATA`CONFIG`ACTIONS`FIELD`LABEL`DESCRIPTION: |-
        The name the sheet shows.
      DATA`CONFIG`ACTIONS`FIELD`ATTRIBUTE`TYPE: |-
        text
      DATA`CONFIG`ACTIONS`FIELD`ATTRIBUTE`MIN: |-
        1
      DATA`CONFIG`ACTIONS`FIELD`ATTRIBUTE`MAX: |-
        20
      DATA`CONFIG`ACTIONS`FIELD`ATTRIBUTE`CHECK: |-
        CHECK`ATTRIBUTE
      DATA`CONFIG`ACTIONS`FIELD`ATTRIBUTE`LABEL: |-
        Attribute
      DATA`CONFIG`ACTIONS`FIELD`ATTRIBUTE`DESCRIPTION: |-
        The key of the attribute the action counts towards, such as insight.
      DATA`CONFIG`ACTIONS`FIELD`ORDER`TYPE: |-
        integer
      DATA`CONFIG`ACTIONS`FIELD`ORDER`DEFAULT: |-
        50
      DATA`CONFIG`ACTIONS`FIELD`ORDER`MIN: |-
        0
      DATA`CONFIG`ACTIONS`FIELD`ORDER`MAX: |-
        999
      DATA`CONFIG`ACTIONS`FIELD`ORDER`LABEL: |-
        Order
      DATA`CONFIG`ACTIONS`FIELD`ORDER`DESCRIPTION: |-
        Where it comes under its attribute: lower first, then by name.
      DATA`CONFIG`ATTRIBUTES`TYPE: |-
        table
      DATA`CONFIG`ATTRIBUTES`LABEL: |-
        Attributes
      DATA`CONFIG`ATTRIBUTES`DESCRIPTION: |-
        The attributes the actions are grouped under, which a character rolls to resist.
      DATA`CONFIG`ATTRIBUTES`STORE: |-
        {{store}}
      DATA`CONFIG`ATTRIBUTES`PATH: |-
        ATTRIBUTE
      DATA`CONFIG`ATTRIBUTES`ENTRY: |-
        label
      DATA`CONFIG`ATTRIBUTES`FIELDS: |-
        label order
      DATA`CONFIG`ATTRIBUTES`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`ATTRIBUTES`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`ATTRIBUTES`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`ATTRIBUTES`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`ATTRIBUTES`FIELD`LABEL`LABEL: |-
        Label
      DATA`CONFIG`ATTRIBUTES`FIELD`LABEL`DESCRIPTION: |-
        The name the sheet shows.
      DATA`CONFIG`ATTRIBUTES`FIELD`ORDER`TYPE: |-
        integer
      DATA`CONFIG`ATTRIBUTES`FIELD`ORDER`DEFAULT: |-
        50
      DATA`CONFIG`ATTRIBUTES`FIELD`ORDER`MIN: |-
        0
      DATA`CONFIG`ATTRIBUTES`FIELD`ORDER`MAX: |-
        999
      DATA`CONFIG`ATTRIBUTES`FIELD`ORDER`LABEL: |-
        Order
      DATA`CONFIG`ATTRIBUTES`FIELD`ORDER`DESCRIPTION: |-
        Where it comes in the list: lower first, then by name.
      CHECK`POSITIONS: |-
        if(cand(eq(words(%0),5),not(words(setdiff(lcstr(%0),none controlled risky desperate)))),,Give five positions%, trivial to extreme%, each controlled%, risky%, desperate or none.)
      CHECK`DICE: |-
        if(cand(eq(words(%0),5),every(%!/FUN`IS`DICE,%0)),,Give five numbers from -3 to 3%, trivial to extreme.)
      CHECK`ATTRIBUTE: |-
        if(hasattr({{store}},ATTRIBUTE`%0),,There is no attribute '%0'. +config fitd/attributes lists them.)
      FUN`IS`DICE: |-
        cand(isint(%0),gte(%0,-3),lte(%0,3))

      # Which INC` routine each switch runs: DATA`ROUTE`<table>`<switch>. BARE is the command alone, ARG the
      # command with something after it and no switch.
      DATA`ROUTE: |-
        Which routine each switch runs. One leaf per switch.
      DATA`ROUTE`SHEET`BARE: |-
        SHEET`SHOW
      DATA`ROUTE`SHEET`ARG: |-
        SHEET`SHOW
      DATA`ROUTE`SHEET`SET: |-
        SHEET`SET
      DATA`ROUTE`SHEET`CHARGEN: |-
        SHEET`CHARGEN
      DATA`ROUTE`SHEET`ADVANCE: |-
        SHEET`ADVANCE
      DATA`ROUTE`SHEET`XP: |-
        SHEET`XP
      DATA`ROUTE`SHEET`LEDGER: |-
        SHEET`LEDGER
      DATA`ROUTE`SHEET`LOG: |-
        SHEET`LOG
      DATA`ROUTE`SHEET`REBUILD: |-
        SHEET`REBUILD
      DATA`ROUTE`SHEET`REVOKE: |-
        SHEET`REVOKE
      DATA`ROUTE`SHEET`CLEAR: |-
        SHEET`CLEAR
      DATA`ROUTE`SHEET`STRESS: |-
        SHEET`STRESS
      DATA`ROUTE`SHEET`TRAUMA: |-
        SHEET`TRAUMA
      DATA`ROUTE`SHEET`HARM: |-
        SHEET`HARM
      DATA`ROUTE`SHEET`COIN: |-
        SHEET`COIN
      DATA`ROUTE`SHEET`TRAITS: |-
        SHEET`TRAITS
      DATA`ROUTE`CHECK`BARE: |-
        CHECK`USAGE
      DATA`ROUTE`CHECK`ARG: |-
        CHECK`ROLL
      DATA`ROUTE`CHECK`PRIVATE: |-
        CHECK`ROLL
      DATA`ROUTE`CHECK`RESIST: |-
        CHECK`RESIST
      DATA`ROUTE`CLOCK`BARE: |-
        CLOCK`LIST
      DATA`ROUTE`CLOCK`ARG: |-
        CLOCK`SHOW
      DATA`ROUTE`CLOCK`NEW: |-
        CLOCK`NEW
      DATA`ROUTE`CLOCK`TICK: |-
        CLOCK`TICK
      DATA`ROUTE`CLOCK`REMOVE: |-
        CLOCK`REMOVE
      DATA`ROUTE`ENCOUNTER`BARE: |-
        ENCOUNTER`SHOW
      DATA`ROUTE`ENCOUNTER`ARG: |-
        ENCOUNTER`SHOW
      DATA`ROUTE`ENCOUNTER`START: |-
        ENCOUNTER`START
      DATA`ROUTE`ENCOUNTER`JOIN: |-
        ENCOUNTER`JOIN
      DATA`ROUTE`ENCOUNTER`USE: |-
        ENCOUNTER`USE
      DATA`ROUTE`ENCOUNTER`ADD: |-
        ENCOUNTER`ADD
      DATA`ROUTE`ENCOUNTER`REMOVE: |-
        ENCOUNTER`REMOVE
      DATA`ROUTE`ENCOUNTER`LEAVE: |-
        ENCOUNTER`LEAVE
      DATA`ROUTE`ENCOUNTER`KEEP: |-
        ENCOUNTER`KEEP
      DATA`ROUTE`ENCOUNTER`END: |-
        ENCOUNTER`END
      DATA`ROUTE`FOE`BARE: |-
        FOE`LIST
      DATA`ROUTE`FOE`ARG: |-
        FOE`SHOW
      DATA`ROUTE`FOE`BESTIARY: |-
        FOE`BESTIARY
      DATA`ROUTE`FOE`RUN: |-
        FOE`RUN
      DATA`ROUTE`FOE`ADD: |-
        FOE`ADD
      DATA`ROUTE`FOE`REMOVE: |-
        FOE`REMOVE
      DATA`ROUTE`FOE`TICK: |-
        FOE`TICK
      DATA`ROUTE`FOE`HARM: |-
        FOE`HARM
      DATA`ROUTE`ENCOUNTER`POSITION: |-
        ENCOUNTER`POSITION
      DATA`DIFFICULTIES: |-
        trivial easy standard hard extreme
      # A threat's clock fills by the effect: limited 1, standard 2, great 3.
      DATA`EFFECTS: |-
        limited standard great
      DATA`POSITIONS: |-
        controlled risky desperate
      # Harm: the slots of each level, and what each level is called.
      DATA`HARM`SLOTS: |-
        1A 1B 2A 2B 3A
      DATA`HARM`1: |-
        Lesser
      DATA`HARM`2: |-
        Moderate
      DATA`HARM`3: |-
        Severe
      DATA`CLOCK`SIZES: |-
        4 6 8 12
      # The most entries a character's ledger holds; a sheet keeper's +sheet/clear starts it again.
      DATA`LEDGER`MAX: |-
        200
      # The most entries each of a character's XP and coin ledgers keeps; past it the oldest entry that a later
      # one replaces goes.
      DATA`LOG`MAX: |-
        500

      DATA`CONFIG`FOES`TYPE: |-
        table
      DATA`CONFIG`FOES`LABEL: |-
        Foes
      DATA`CONFIG`FOES`DESCRIPTION: |-
        The threats: what a GM adds to an encounter with +foe/add, each with a clock to overcome it.
      DATA`CONFIG`FOES`STORE: |-
        {{store}}
      DATA`CONFIG`FOES`PATH: |-
        FOE
      DATA`CONFIG`FOES`ENTRY: |-
        label
      DATA`CONFIG`FOES`FIELDS: |-
        label tier clock harm harmtext notes
      DATA`CONFIG`FOES`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`FOES`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`FOES`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`FOES`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`FOES`FIELD`LABEL`LABEL: |-
        Label
      DATA`CONFIG`FOES`FIELD`LABEL`DESCRIPTION: |-
        The name it goes by; each one added gets a number after it.
      DATA`CONFIG`FOES`FIELD`TIER`TYPE: |-
        integer
      DATA`CONFIG`FOES`FIELD`TIER`DEFAULT: |-
        1
      DATA`CONFIG`FOES`FIELD`TIER`MIN: |-
        0
      DATA`CONFIG`FOES`FIELD`TIER`MAX: |-
        5
      DATA`CONFIG`FOES`FIELD`TIER`LABEL: |-
        Tier
      DATA`CONFIG`FOES`FIELD`TIER`DESCRIPTION: |-
        How strong it is, from 0 for the weakest to 4 or 5 for the most dangerous.
      DATA`CONFIG`FOES`FIELD`CLOCK`TYPE: |-
        integer
      DATA`CONFIG`FOES`FIELD`CLOCK`DEFAULT: |-
        4
      DATA`CONFIG`FOES`FIELD`CLOCK`MIN: |-
        4
      DATA`CONFIG`FOES`FIELD`CLOCK`MAX: |-
        12
      DATA`CONFIG`FOES`FIELD`CLOCK`CHECK: |-
        CHECK`CLOCK
      DATA`CONFIG`FOES`FIELD`CLOCK`LABEL: |-
        Clock
      DATA`CONFIG`FOES`FIELD`CLOCK`DESCRIPTION: |-
        The segments of the clock that overcomes it: 4, 6, 8 or 12.
      DATA`CONFIG`FOES`FIELD`HARM`TYPE: |-
        integer
      DATA`CONFIG`FOES`FIELD`HARM`DEFAULT: |-
        2
      DATA`CONFIG`FOES`FIELD`HARM`MIN: |-
        1
      DATA`CONFIG`FOES`FIELD`HARM`MAX: |-
        3
      DATA`CONFIG`FOES`FIELD`HARM`LABEL: |-
        Harm level
      DATA`CONFIG`FOES`FIELD`HARM`DESCRIPTION: |-
        The level of harm it deals, 1 to 3.
      DATA`CONFIG`FOES`FIELD`HARMTEXT`TYPE: |-
        text
      DATA`CONFIG`FOES`FIELD`HARMTEXT`DEFAULT: |-
        Hurt
      DATA`CONFIG`FOES`FIELD`HARMTEXT`MIN: |-
        1
      DATA`CONFIG`FOES`FIELD`HARMTEXT`MAX: |-
        40
      DATA`CONFIG`FOES`FIELD`HARMTEXT`LABEL: |-
        Harm
      DATA`CONFIG`FOES`FIELD`HARMTEXT`DESCRIPTION: |-
        What its harm is called, such as Cut or Shot.
      DATA`CONFIG`FOES`FIELD`NOTES`TYPE: |-
        text
      DATA`CONFIG`FOES`FIELD`NOTES`MIN: |-
        0
      DATA`CONFIG`FOES`FIELD`NOTES`MAX: |-
        300
      DATA`CONFIG`FOES`FIELD`NOTES`LABEL: |-
        Notes
      DATA`CONFIG`FOES`FIELD`NOTES`DESCRIPTION: |-
        How it acts, for the GM.
      # +config's CHECK for a threat's clock (%0): a clock size.
      CHECK`CLOCK: |-
        if(member(v(DATA`CLOCK`SIZES),%0),,A clock has [itemize(v(DATA`CLOCK`SIZES),,or)] segments.)
      # The most foes one encounter holds.
      DATA`FOE`MAX: |-
        30
      # ---- commands ---------------------------------------------------------------
      # %1 the switches and %2 what follows, exactly as typed.
      CMD`SHEET:
        value: |-
          $(?is)^\+sheet(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,sheet,table,SHEET,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`CHECK:
        value: |-
          $(?is)^\+check(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,check,table,CHECK,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`CLOCK:
        value: |-
          $(?is)^\+clock(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,clock,table,CLOCK,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`ENCOUNTER:
        value: |-
          $(?is)^\+encounter(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,encounter,table,ENCOUNTER,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`FOE:
        value: |-
          $(?is)^\+foe(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,foe,table,FOE,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      # A line a bridge adds to one of this object's messages: HINT`<message>, set here by a bridge such as
      # sheet-fitd-help. %1 on are passed to it. Nothing when no bridge set one, so the message stands without it.
      FUN`HINT:
        value: |-
          if(hasattr(%!,HINT`%0),%b[u(%!/HINT`%0,%1,%2)])
        flags: [funsyntax]
      INC`COMMAND`RUN:
        value: |-
          @assert hastype(%#,player)=@pemit %#=notice(SHEET,Only players have a sheet.,warn); think u(%!/FUN`COMMAND`PARSE,%<word>,%<table>,%<switches>,%<argument>); @assert lte(words(%q<cmd_switch_list>),1)=@pemit %#=notice(SHEET,Use one switch at a time.,warn); @assert strlen(%q<cmd_route>)=@pemit %#=notice(SHEET,+%q<cmd_word> has no /%q<cmd_switch> switch.[u(%!/FUN`HINT,SWITCHES,%q<cmd_word>)],warn); @include %!/INC`%q<cmd_route>
        flags: [cmdsyntax]
      # %0 the word, %1 its route table, %2 the switches and %3 the argument, as typed. Sets cmd_word,
      # cmd_switch_list, cmd_switch, cmd_argument, cmd_has_equals, cmd_left_side and cmd_right_side around the
      # first =, cmd_route (the INC` routine to run), viewer_objid and viewer_keeper.
      FUN`COMMAND`PARSE:
        value: |-
          setqm(cmd_word,lcstr(%0),
          cmd_switch_list,lcstr(trim(edit(%2,/,%b))),
          cmd_switch,first(%q<cmd_switch_list>),
          cmd_argument,trim(%3),
          cmd_has_equals,strmatch(%3,*=*),
          cmd_left_side,trim(before(%3,=)),
          cmd_right_side,trim(after(%3,=)),
          cmd_route,get(%!/DATA`ROUTE`%1`[if(strlen(%q<cmd_switch>),ucstr(%q<cmd_switch>),if(strlen(%q<cmd_argument>),ARG,BARE))]),
          viewer_objid,objid(%#),
          viewer_keeper,u(%!/FUN`PERM`KEEPER,%#))
        flags: [funsyntax]

      # ---- guards -----------------------------------------------------------------
      # %<name> a player's name: sheet_who, their objid.
      INC`NEED`TARGET:
        value: |-
          @assert strlen(setr(sheet_who,u(%!/FUN`PLAYER`MATCH,%<name>)))=@pemit %#=notice(SHEET,There is no player called '%<name>'.,warn)
        flags: [cmdsyntax]
      # The left of =, or the whole argument when there is no =: <name>/<what> names someone else, else <what>
      # is on your own sheet. sheet_who and sheet_what. The routine then says who may change it.
      INC`NEED`WHO:
        value: |-
          think setq(who_typed,if(%q<cmd_has_equals>,%q<cmd_left_side>,%q<cmd_argument>)); think setq(who_named,if(strmatch(%q<who_typed>,*/*),trim(before(%q<who_typed>,/)))); @include/args %!/INC`NEED`TARGET=name,firstof(%q<who_named>,%#); think setq(sheet_what,trim(if(strlen(%q<who_named>),after(%q<who_typed>,/),%q<who_typed>)))
        flags: [cmdsyntax]
      # <name>=<value> names someone else, else <value> is for your own sheet: sheet_who and sheet_value.
      INC`NEED`WHOVALUE:
