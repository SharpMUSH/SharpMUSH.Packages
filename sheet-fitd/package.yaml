  # ATTRIBUTE`<KEY> an attribute's label; CLOCK`<KEY> a clock. Staff change the lists with +config fitd/actions and
  # /attributes; +clock changes the clocks.
  - ref: store
    type: thing
    name: FitD Sheet Store
    location: "{{sheet}}"
    flags: [no_command]
    attributes:
      ATTRIBUTE: |-
