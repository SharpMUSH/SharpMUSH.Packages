  # The encounters running now. Inside the FitD Sheet and no_command, like the store. ENC`<n> is one encounter,
  # with ROOM, GM, STARTED and COPY`<dbref number> (one member's copy: STRESS, TRAUMA, COIN, HARM`<slot> and
  # RATINGS beneath) under it.
  - ref: encounters
    type: thing
    name: FitD Encounters
    location: "{{sheet}}"
    flags: [no_command]
    attributes:
      ENC: |-
        The encounters running now, one branch each.

  # The +help topics, on an object of their own. sheet-fitd-help registers it with +help; without that bridge
  # nothing reads it. HELP`<TOPIC> is a topic, its subtopics the leaves beneath, LOCK`<TOPIC> who may read it.
  - ref: sheet_help
    type: thing
    name: FitD Sheet Help
    location: "{{sheet}}"
    attributes:
      HELP: |-
        Your character's Forged in the Dark sheet, rolling against it, encounters and their threats, and progress clocks: +sheet, +check, +encounter, +foe and +clock.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`SHEET: |-
        check encounter clock
      SEE`CHECK: |-
        sheet encounter clock
      SEE`ENCOUNTER: |-
        sheet check foe
      SEE`FOE: |-
        encounter clock
      SEE`CLOCK: |-
        sheet check
      HELP`SHEET: |-
        `+sheet` shows your character's sheet: stress, coin, trauma, XP, harm, and twelve actions rated 0 to 4 under three attributes, Insight, Prowess and Resolve.

        - `+sheet` shows your own; `+sheet <name>` another character's, when the game lets you read it.
        - `+sheet/chargen` shows the steps of making your character and what to do next.
        - `+sheet/traits` lists the actions and their attributes.
        - `+sheet/ledger` lists every entry your ratings are built from, oldest first.

        An attribute's rating is how many of its actions are rated 1 or more. Your ratings are built from the ledger: each rating you set and each advance is an entry. Once you are approved, `+sheet/advance` spends XP and staff make other changes.

        For example:

        `+sheet/chargen`

        Output: `1. Action dots to do: 4 of 7 given: Hunt 2 and Prowl 2.`

        See `+help sheet chargen` for making a character, `+help sheet play` for stress, harm, coin and advances, and `+help check` for rolling.
      HELP`SHEET`CHARGEN: |-
        Making a character is one step: share out the starting action dots, 7 unless your game changed that, at most 2 in one action. `+sheet/chargen` shows how far you are.

        - `+sheet/set <action>=<rating>` rates an action: `+sheet/set skirmish=2`.
        - `+sheet/set <action>=` puts it back to 0 and frees its dots.

        Higher ratings come from advances after approval.

        For example:

        `+sheet/set prowl=2`

        Output: `\[SHEET\] Done: Prowl is 2 on Alice's sheet. Next: +sheet/set <action>=<rating>. 3 of 7 dots left to give.`

        When every dot is given, your sheet is complete. Once you are approved, staff change it.
      HELP`SHEET`PLAY: |-
        In play you keep your own stress, trauma, harm and coin:

        - `+sheet/stress +<n>` marks stress, `-<n>` clears some, `<n>` sets it, `clear` empties it. Past 9 it clears and a trauma is due: `+sheet/trauma <trauma>`, such as cold, haunted, reckless or vicious. At four the character retires.
        - `+sheet/harm <level>=<harm>` takes harm at level 1, 2 or 3: `+sheet/harm 2=Cracked ribs`. A full level pushes it up one. `+sheet/harm <level>=` clears a level.
        - `+sheet/coin -<n> [<reason>]` spends coin: `+sheet/coin -2 Bribe`.

        Staff give coin and XP. Each attribute has its own XP. `+sheet/advance <action>` spends 6 XP of the action's attribute, unless your game changed that, on +1 to its rating, up to 4. XP and coin each keep a ledger: `+sheet/log` shows the latest entries, who made them and why.

        In an encounter, stress, trauma, harm and coin change your copy there. See `+help encounter`.

        For example:

        `+sheet/advance skirmish`

        Output: `\[SHEET\] Done: Alice advances: Skirmish 3 (6 Prowess XP spent).`
      HELP`CHECK: |-
        `+check <action>` rolls one six-sided die per point of the action's rating and reads the highest, where the room sees it. An action rated 0 rolls two dice and reads the lower.

        - `+check <action>=<position>` names the position: controlled, risky or desperate, or a difficulty: trivial, easy, standard, hard or extreme.
        - `+check <action>+<n>` or `-<n>` adds or takes dice, such as +1 for help or for pushing yourself: `+check wreck+1=risky`.
        - `/private` rolls where only you see it. `+check/resist <attribute>` resists a consequence: see `+help check resist`.

        A 6 is a full success, 4 or 5 a partial success \(you do it, with a cost\), 1 to 3 a bad outcome. Two 6s or more are a critical. Every check is kept under a number that `rollinfo()` reads back.

        For example:

        `+check skirmish=risky`

        Output: `\[SHEET\] Alice rolls Skirmish (risky): 2d6kh1\[(3), 6\] = 6: a full success (roll 42)`
      HELP`CHECK`RESIST: |-
        `+check/resist <attribute>` rolls one die per point of the attribute: Insight, Prowess or Resolve. The stress it costs is 6 less the highest die, and the sheet marks it. Two 6s clear 1 stress instead.

        For example:

        `+check/resist prowess`

        Output: `\[SHEET\] Alice resists with Prowess: 3d6kh1\[(2), 5, (1)\] = 5: takes 1 stress. Alice has 3 of 9 stress. (roll 43)`
      HELP`ENCOUNTER: |-
        An encounter is a scene played from copies of the sheets, so stress, trauma, harm and coin in it stay there. It lasts until its GM ends it, over as many days as it takes.

        - `+encounter` lists the encounters here and yours; `+encounter <n>` shows one.
        - `+encounter/start [<title>]` starts one in your room. You run it.
        - `+encounter/join [<n>]` takes part with a copy of your sheet as it is now.
        - `+encounter/leave [<n>]` comes out; your copy there is gone.
        - `+encounter/use <n>` picks which copy you roll from, when you are in more than one here.

        While you are in an encounter's room, `+check`, `+check/resist`, stress, trauma, harm and coin use your copy in it. Anywhere else, your sheet. When the GM has set your position there, `+check` with no position uses it, and says your effect.

        For example:

        `+encounter/join 1`

        Output: `\[ENCOUNTER\] Alice joins 1 (Rooftop chase).`

        See `+help encounter gm` for running one, and `+help foe` for threats.
      HELP`ENCOUNTER`GM: |-
        Whoever starts an encounter runs it; sheet keepers run any. Give the number after `=` when the room has more than one.

        - `+encounter/add <name>[=<n>]` brings someone in the room into it, with a copy of their sheet.
        - `+encounter/remove <name>[=<n>]` takes them out; their copy goes.
        - `+encounter/keep <name>[=<n>]` writes their stress, trauma, harm and coin from the copy to their sheet.
        - `+encounter/end [<n>]` ends it. Every copy goes, and nothing is written back unless you kept it first.
        - `+encounter/position <name>=<position> [<effect>]` sets a member's position, and their effect: limited, standard or great. Nothing after `=` clears it.

        While a member plays from your encounter's copy, you change it: `+sheet/stress <name>=+<n>`, `/trauma <name>/<trauma>`, `/harm <name>/<level>=<harm>` and `/coin <name>=<n>`.

        For example:

        `+encounter/keep Alice=1`

        Output: `\[ENCOUNTER\] Done: Alice's sheet keeps the stress, trauma, harm and coin from 1 (Rooftop chase).`
      HELP`FOE: |-
        Threats are the GM's side of an encounter, added from the game's list of them. Each is numbered, so two guards are Watch guard 1 and Watch guard 2, and each has a clock: fill it and the threat is overcome.

        - `+foe` lists the threats in the encounter here, with their tier, clock and the harm they deal; `+foe <threat>` shows one. Name a threat by its number or its name.
        - `+foe/bestiary` lists what the GM can add; `+foe/bestiary <kind>` shows one.

        When you act against a threat, your effect fills its clock: limited 1 segment, standard 2, great 3. Nothing a threat takes reaches the list, and the threats go when the encounter ends.

        For example:

        `+foe guard 2`

        Output: a box with Watch guard 2's tier, clock and harm.

        See `+help foe gm` for running them.
      HELP`FOE`GM: |-
        The GM of an encounter, or a sheet keeper, runs its threats:

        - `+foe/add <kind>[=<count>]` adds threats from the list: `+foe/add guard=3`. `+foe/remove <threat>` takes one out.
        - `+foe/tick <threat>[=<effect>]` fills its clock by an effect, limited, standard (the default) or great, or by a number of segments; below 0 empties some. Full, it is overcome.
        - `+foe/harm <threat>=<name>[/<level>]` marks the threat's harm on that member's copy, at its level or the one given. A full level pushes it up one, as `+sheet/harm` does.
        - `+foe/run <n>` picks which encounter your `+foe` commands use, when the room has several.

        For example:

        `+foe/harm guard 1=Alice`

        Output: `\[ENCOUNTER\] Watch guard 1 deals Alice level 2 harm: Cut.`

        Staff change the list with `+config fitd/foes`.
      HELP`CLOCK: |-
        A clock tracks progress against something: a guard growing suspicious, a ritual nearly done. Clocks belong to the game, so anyone may read them.

        - `+clock` lists the clocks; `+clock <name>` shows one.
        - `+clock/new <name>=<segments>` starts one with 4, 6, 8 or 12 segments.
        - `+clock/tick <name>` fills a segment; `+clock/tick <name>=<n>` fills n, or empties some with a number below 0.
        - `+clock/remove <name>` takes it away.

        Only whoever started a clock, and sheet keepers, change it.

        For example:

        `+clock/tick alarm=2`

        Output: `\[CLOCK\] Alice ticks a clock: Alarm \[##..\] 2/4`
      HELP`SHEET`CREDITS: |-
        This sheet is based on Blades in the Dark \(found at http://www.bladesinthedark.com/\), product of One Seven Design, developed and authored by John Harper, and licensed for our use under the Creative Commons Attribution 3.0 Unported license \(http://creativecommons.org/licenses/by/3.0/\).

        It is not endorsed or sponsored by One Seven Design.
      LOCK`SHEET`STAFF: |-
        perm^softcode.fitd.admin
      HELP`SHEET`STAFF: |-
        Sheet keepers \(`softcode.fitd.admin`, or the FitD Sheet Keeper role\) read every sheet and change any character's at any time:

        - `/set`, `/advance`, `/trauma` and `/harm` take `<name>/` first: `+sheet/set Alice/hunt=4`. A keeper rates an action up to 4 and gives an advance without XP.
        - `/stress` and `/coin` take `<name>=` first: `+sheet/coin Alice=+4 Score payout`.
        - `+sheet/xp <name>/<attribute>=+<n> [<reason>]` gives XP, `-<n>` takes, `<n>` sets: `+sheet/xp Alice/prowess=+2 Won the duel`.
        - `+sheet/log <name>` shows their XP and coin ledgers; `+sheet/log <name>=xp` more of one. `+sheet/rebuild <name>` works their totals out again from those ledgers.
        - `+sheet/trauma <name>/<trauma>=remove` takes a trauma off.
        - `+sheet/revoke <name>/<n>` takes back one ledger entry; `+sheet/clear <name>` revokes them all, and character creation starts again.
        - Keepers run any encounter, and tick and remove anyone's clocks.

        `@role/assign <player>=fitd-sheet-keeper` makes someone a keeper.
      LOCK`SHEET`SETTINGS: |-
        perm^config.admin
      HELP`SHEET`SETTINGS: |-
        `+config fitd` lists the settings and `+config fitd/<setting>=<value>` changes one \(`config.admin`\):

        - `dots`: the action dots a new character shares out \(7\). `cap`: the most in one action while making a character \(2\).
        - `advance`: the XP of one attribute an advance costs \(6\).
        - `stress`: how much stress a character holds \(9\). `trauma`: traumas before retiring \(4\).
        - `positions`: the position of trivial, easy, standard, hard and extreme \(`none controlled risky desperate desperate`\). `none` means no roll: it simply succeeds.
        - `dice`: dice added or taken at each difficulty \(`0 0 0 0 -1`\).
        - `public`: whether anyone may read anyone's sheet \(no\).
        - `actions`, `attributes`: the two lists. `+config/add fitd/actions/ride=Ride` adds an action; set its `attribute` field.

        Removing an action leaves what characters had stored, but the sheet stops showing it.
