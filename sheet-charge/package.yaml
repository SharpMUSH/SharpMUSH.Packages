      FUN`STATE`WRITE:
        value: |-
          setq(state_at,u(%!/FUN`STATE`AT,%0,%3))[u(%!/FUN`DO`ROOT,%0)][null(if(strlen(%2),attrib_set(%q<state_at>%1,%2),attrib_set(%q<state_at>%1)))]
        flags: [funsyntax]
      # The same root, from a function: %0 a character.
      FUN`DO`ROOT:
        value: |-
          if(hasattr(%0,CHARGE),,attrib_set(%0/CHARGE,This character's Charge sheet. +sheet shows it.)[set(%0/CHARGE,wizard)][set(%0/CHARGE,no_command)])
        flags: [funsyntax]

      # # ---- +encounter --------------------------------------------------------------
      # +encounter [<n>]: the encounter you are in here, or one by number; with neither, every open encounter.
      INC`ENCOUNTER`SHOW:
        value: |-
          @if isint(%q<cmd_argument>)={think setq(enc_n,%q<cmd_argument>)},{think setq(enc_n,u(%!/FUN`ENCOUNTER`MINE,%#))}; @break cand(strlen(%q<enc_n>),hasattr({{store}},ENC`%q<enc_n>))=@pemit %#=u(%!/FUN`SCREEN`ENCOUNTER,%q<enc_n>,%#); @assert not(strlen(%q<cmd_argument>))=@pemit %#=notice(ENCOUNTER,There is no encounter '%q<cmd_argument>'. +encounter lists them.,warn); @pemit %#=u(%!/FUN`SCREEN`ENCOUNTERS)
        flags: [cmdsyntax]
      # +encounter/start [<title>]: starts an encounter here, run by whoever starts it. A room may hold several.
      INC`ENCOUNTER`START:
        value: |-
          @assert lte(strlen(%q<cmd_argument>),60)=@pemit %#=notice(ENCOUNTER,Name an encounter in 60 characters or fewer.,warn); think setq(enc_n,inc(default({{store}}/ENCOUNTER`NEXT,0))); think setq(enc_title,firstof(%q<cmd_argument>,Encounter %q<enc_n>)); &ENCOUNTER`NEXT {{store}}=%q<enc_n>; &ENC`%q<enc_n> {{store}}=%q<enc_title>; &ENC`%q<enc_n>`ROOM {{store}}=[objid(%l)]; &ENC`%q<enc_n>`GM {{store}}=%q<viewer_objid>; &ENC`%q<enc_n>`COPY {{store}}=Each member's copy of their sheet.; &ENCOUNTER`OPEN {{store}}=[setunion(get({{store}}/ENCOUNTER`OPEN),%q<enc_n>)]; @remit %l=notice(ENCOUNTER,tone(strong,name(%#)) starts encounter %q<enc_n>: %q<enc_title>. [name(%#)] runs it as GM. +encounter/join %q<enc_n> takes part with a copy of your sheet.)
        flags: [cmdsyntax]
      # +encounter/join [<n>]: joins an encounter with a copy of your sheet: the one here, or by number when there are several.
      # A character may be in several encounters, each with its own copy.
      INC`ENCOUNTER`JOIN:
        value: |-
          @if isint(%q<cmd_argument>)={think setq(enc_n,%q<cmd_argument>)},{think setq(enc_n,if(eq(words(setr(enc_here,u(%!/FUN`ENCOUNTER`HERE,%l))),1),%q<enc_here>))}; @assert cor(strlen(%q<enc_n>),strlen(%q<cmd_argument>),not(words(%q<enc_here>)))=@pemit %#=notice(ENCOUNTER,Encounters [itemize(%q<enc_here>)] are running here. +encounter/join <n> joins one.,warn); @assert cand(strlen(%q<enc_n>),hasattr({{store}},ENC`%q<enc_n>))=@pemit %#=notice(ENCOUNTER,[if(strlen(%q<cmd_argument>),There is no encounter '%q<cmd_argument>'.,There is no encounter here. +encounter/start starts one.)],warn); @assert not(member(u(%!/FUN`ENCOUNTER`JOINED,%#),%q<enc_n>))=@pemit %#=notice(ENCOUNTER,You are in encounter %q<enc_n> already.,warn); @include/args %!/INC`ENCOUNTER`COPYIN=who,%q<viewer_objid>; @remit get({{store}}/ENC`%q<enc_n>`ROOM)=notice(ENCOUNTER,tone(strong,name(%#)) joins encounter %q<enc_n>: [get({{store}}/ENC`%q<enc_n>)]. [tone(muted,Rolls and changes there use a copy of [poss(%#)] sheet.)]); @if comp(%l,get({{store}}/ENC`%q<enc_n>`ROOM))={@pemit %#=notice(ENCOUNTER,You join encounter %q<enc_n>. Your copy is used where it runs%, in [name(get({{store}}/ENC`%q<enc_n>`ROOM))].,ok)}
        flags: [cmdsyntax]
      # +encounter/use <n>: when a room holds several of your encounters, picks the one your rolls and changes go to.
      INC`ENCOUNTER`USE:
        value: |-
          @assert isint(%q<cmd_argument>)=@pemit %#=notice(ENCOUNTER,+encounter/use <n> picks which of your encounters here your rolls and changes go to.,warn); @assert member(u(%!/FUN`ENCOUNTER`JOINED,%#),%q<cmd_argument>)=@pemit %#=notice(ENCOUNTER,You are not in encounter %q<cmd_argument>.,warn); @include/args %!/INC`DO`SET=who,%q<viewer_objid>,leaf,USING,value,%q<cmd_argument>; @pemit %#=notice(ENCOUNTER,Your rolls and changes go to your copy in encounter %q<cmd_argument> while you are in [name(get({{store}}/ENC`%q<cmd_argument>`ROOM))].,ok)
        flags: [cmdsyntax]
      # +encounter/add <name>[=<n>]: the GM or a keeper brings a character in.
      INC`ENCOUNTER`ADD:
        value: |-
          @assert strlen(%q<cmd_left_side>)=@pemit %#=notice(ENCOUNTER,+encounter/add <name>[=<n>] brings a character into your encounter.,warn); @include/args %!/INC`NEED`ENCOUNTER=number,%q<cmd_right_side>; @include %!/INC`NEED`RUNS; @include/args %!/INC`NEED`TARGET=name,%q<cmd_left_side>; @assert not(member(u(%!/FUN`ENCOUNTER`JOINED,%q<sheet_who>),%q<enc_n>))=@pemit %#=notice(ENCOUNTER,[name(%q<sheet_who>)] is in encounter %q<enc_n> already.,warn); @include/args %!/INC`ENCOUNTER`COPYIN=who,%q<sheet_who>; @remit get({{store}}/ENC`%q<enc_n>`ROOM)=notice(ENCOUNTER,tone(strong,name(%#)) brings [name(%q<sheet_who>)] into encounter %q<enc_n>: [get({{store}}/ENC`%q<enc_n>)]. [tone(muted,Rolls and changes there use a copy of [poss(%q<sheet_who>)] sheet.)]); @if comp(loc(%q<sheet_who>),get({{store}}/ENC`%q<enc_n>`ROOM))={@pemit %q<sheet_who>=notice(ENCOUNTER,[name(%#)] brings you into encounter %q<enc_n>: [get({{store}}/ENC`%q<enc_n>)].)}; @if comp(%l,get({{store}}/ENC`%q<enc_n>`ROOM))={@pemit %#=notice(ENCOUNTER,[name(%q<sheet_who>)] is in encounter %q<enc_n>.,ok)}
        flags: [cmdsyntax]
      # +encounter/leave [<n>]: drops your copy. Nothing goes back to your sheet.
      INC`ENCOUNTER`LEAVE:
        value: |-
          think setq(enc_n,if(isint(%q<cmd_argument>),%q<cmd_argument>,u(%!/FUN`ENCOUNTER`OF,%#))); @assert member(u(%!/FUN`ENCOUNTER`JOINED,%#),%q<enc_n>)=@pemit %#=notice(ENCOUNTER,[if(strlen(%q<cmd_argument>),You are not in encounter '%q<cmd_argument>'.,You are not in an encounter here. +encounter/leave <n> leaves one elsewhere.)],warn); @include/args %!/INC`ENCOUNTER`DROP=who,%q<viewer_objid>,number,%q<enc_n>; @remit get({{store}}/ENC`%q<enc_n>`ROOM)=notice(ENCOUNTER,tone(strong,name(%#)) leaves encounter %q<enc_n>. [tone(muted,Nothing from the encounter's copy goes back to [poss(%#)] sheet.)]); @if comp(%l,get({{store}}/ENC`%q<enc_n>`ROOM))={@pemit %#=notice(ENCOUNTER,You leave encounter %q<enc_n>.,ok)}
        flags: [cmdsyntax]
      # +encounter/remove <name>[=<n>]: the GM or a keeper drops a member's copy.
      INC`ENCOUNTER`REMOVE:
        value: |-
          @assert strlen(%q<cmd_left_side>)=@pemit %#=notice(ENCOUNTER,+encounter/remove <name>[=<n>] takes a character out of your encounter.,warn); @include/args %!/INC`NEED`ENCOUNTER=number,%q<cmd_right_side>; @include %!/INC`NEED`RUNS; @include/args %!/INC`NEED`MEMBER=name,%q<cmd_left_side>; @include/args %!/INC`ENCOUNTER`DROP=who,%q<sheet_who>,number,%q<enc_n>; @pemit %#=notice(ENCOUNTER,[name(%q<sheet_who>)] is out of encounter %q<enc_n>. Nothing from [poss(%q<sheet_who>)] copy goes back to [poss(%q<sheet_who>)] sheet.,ok); @if comp(%q<sheet_who>,%q<viewer_objid>)={@pemit %q<sheet_who>=notice(ENCOUNTER,[name(%#)] takes you out of encounter %q<enc_n>.)}
        flags: [cmdsyntax]
