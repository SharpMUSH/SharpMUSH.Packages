        flags: [funsyntax]

      # ---- writes -----------------------------------------------------------------
      # %<who> an objid, %<leaf> what under CHARGE` to write, %<value> what to store; empty clears it. The CHARGE
      # root is wizard-flagged and no_command the first time, and its leaves take that from it.
      INC`DO`SET:
        value: |-
          @if not(hasattr(%<who>,CHARGE))={&CHARGE %<who>=This character's Charge sheet. +sheet shows it.; @set %<who>/CHARGE=wizard; @set %<who>/CHARGE=no_command}; @if strlen(%<value>)={&CHARGE`%<leaf> %<who>=%<value>},{&CHARGE`%<leaf> %<who>}
        flags: [cmdsyntax]
      # %0 a character, %1 an entry's JSON ({"kind",...}): writes it on their ledger, numbered after the last, stamped with who
      # made it and the phase (chargen before approval, staff for a keeper, else play), and returns its number. A chargen dots
