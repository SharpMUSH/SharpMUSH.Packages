          record_phase,cond(not(isapproved(%0)),chargen,u(%!/FUN`PERM`KEEPER,%#),staff,play),
          record_reuse,if(cand(strmatch(%q<record_phase>,chargen),strmatch(%q<record_kind>,dots)),first(iter(u(%!/FUN`LEDGER`LIVE,u(%!/FUN`LEDGER`ENTRIES,%0)),if(cand(strmatch(elements(%i0,2,~),dots),strmatch(elements(%i0,3,~),%q<record_key>),strmatch(elements(%i0,5,~),chargen)),first(%i0,~)),|,%b))),
