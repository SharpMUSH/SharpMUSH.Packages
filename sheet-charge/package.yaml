        value: |-
          sort(iter(lattr(%0/CHARGE`[firstof(%1,LEDGER)]`*),if(hasflag(%0/%i0,wizard),last(%i0,`))),n)
        flags: [funsyntax]
      # %0 a character, %1 XP for the milestones ledger: every entry in one pass, a |-list of n~kind~key~value~phase~by~reason.
      FUN`LEDGER`ENTRIES:
        value: |-
          iter(u(%!/FUN`LEDGER`NUMBERS,%0,%1),u(%!/FUN`LEDGER`ROW,%i0,get(%0/CHARGE`[firstof(%1,LEDGER)]`%i0)),%b,|)
        flags: [funsyntax]
      FUN`LEDGER`ROW:
        value: |-
          %0~[json_query(%1,extract,$.kind)]~[ucstr(firstof(json_query(%1,extract,$.action),json_query(%1,extract,$.entry)))]~[firstof(json_query(%1,extract,$.dots),json_query(%1,extract,$.count),json_query(%1,extract,$.text))]~[json_query(%1,extract,$.phase)]~[json_query(%1,extract,$.by)]~[json_query(%1,extract,$.reason)]
        flags: [funsyntax]
      # %0 rows: the numbers of the entries revoked.
      FUN`LEDGER`REVOKED:
        value: |-
          squish(iter(%0,if(strmatch(elements(%i0,2,~),revoke),elements(%i0,3,~)),|,%b))
        flags: [funsyntax]
      # %0 rows: the ones that build the sheet, without revokes, what they revoked, and anything before the last clear.
      FUN`LEDGER`LIVE:
        value: |-
          setqm(ledger_revoked,u(%!/FUN`LEDGER`REVOKED,%0),
          ledger_cleared,firstof(last(iter(%0,if(strmatch(elements(%i0,2,~),clear),first(%i0,~)),|,%b)),0))[trim(squish(iter(%0,if(cor(match(revoke clear,elements(%i0,2,~)),member(%q<ledger_revoked>,first(%i0,~)),lte(first(%i0,~),%q<ledger_cleared>)),,%i0),|,|),|),|)]
        flags: [funsyntax]
      # %0 a character, %1 1 for their sheet even in an encounter. Sets build_totals (the cached totals), build_copy (their
      # encounter copy, or nothing), build_ratings (KEY:dots for every action), build_talents (a |-list) and build_milestones
      # (unspent). The ratings and talents come from the encounter's copy while they are in one.
      FUN`BUILD`PREPARE:
        value: |-
          setqm(build_who,%0,
          build_totals,u(%!/FUN`TOTALS`GET,%0),
          build_copy,if(%1,,u(%!/FUN`ENCOUNTER`COPY,%0)),
          build_ratings,if(strlen(%q<build_copy>),get(%q<build_copy>`DOTS),json_query(%q<build_totals>,extract,$.ratings)),
          build_talents,if(strlen(%q<build_copy>),get(%q<build_copy>`TALENTS),json_query(%q<build_totals>,extract,$.talents)),
          build_milestones,json_query(%q<build_totals>,extract,$.milestones))
        flags: [funsyntax]
      # %0 a character: CHARGE`TOTALS when this object wrote it, else the totals worked out from the ledgers now.
      FUN`TOTALS`GET:
        value: |-
          if(cand(hasattr(%0,CHARGE`TOTALS),hasflag(%0/CHARGE`TOTALS,wizard)),get(%0/CHARGE`TOTALS),u(%!/FUN`TOTALS`BUILD,%0))
        flags: [funsyntax]
      # %0 a character: works the totals out from both ledgers and caches them in CHARGE`TOTALS.
      FUN`TOTALS`WRITE:
        value: |-
          setq(totals_json,u(%!/FUN`TOTALS`BUILD,%0))[u(%!/FUN`DO`ROOT,%0)][null(attrib_set(%0/CHARGE`TOTALS,%q<totals_json>))][null(set(%0/CHARGE`TOTALS,wizard))]
        flags: [funsyntax]
      # %0 a character: {"ratings","advanced","talents","given","earned","spent","milestones"} from the build ledger's live
      # entries and the milestones ledger. ratings and advanced are KEY:n lists, talents a |-list, given the starting dots
      # handed out, earned the milestones given less those taken, spent one for each advance and talent.
      FUN`TOTALS`BUILD:
        value: |-
          setqm(build_rows,u(%!/FUN`LEDGER`LIVE,u(%!/FUN`LEDGER`ENTRIES,%0)),
          totals_ratings,u(%!/FUN`BUILD`RATINGS),
          totals_advanced,iter(u(%!/FUN`LIST`ALL,ACTION),%i0:[u(%!/FUN`BUILD`ROWADVANCES,%i0)]),
          totals_spent,words(iter(%q<build_rows>,if(match(advance talent,elements(%i0,2,~)),x),|,%b)),
          totals_earned,ladd(0 [iter(u(%!/FUN`LEDGER`ENTRIES,%0,XP),elements(%i0,4,~),|,%b)]))[json(object,ratings,json(string,%q<totals_ratings>),advanced,json(string,%q<totals_advanced>),talents,json(string,u(%!/FUN`BUILD`TALENTS)),given,sub(ladd(0 [iter(%q<totals_ratings>,after(%i0,:))]),ladd(0 [iter(%q<totals_advanced>,after(%i0,:))])),earned,%q<totals_earned>,spent,%q<totals_spent>,milestones,sub(%q<totals_earned>,%q<totals_spent>))]
        flags: [funsyntax]
      FUN`BUILD`RATINGS:
        value: |-
          iter(u(%!/FUN`LIST`ALL,ACTION),%i0:[u(%!/FUN`BUILD`LEDGERRATING,%i0)])
        flags: [funsyntax]
      # %0 an action key: its starting dots (the last dots entry) and one for each advance.
      FUN`BUILD`LEDGERRATING:
        value: |-
          add(firstof(last(iter(%q<build_rows>,if(cand(strmatch(elements(%i0,2,~),dots),strmatch(elements(%i0,3,~),%0)),firstof(elements(%i0,4,~),0)),|,%b)),0),u(%!/FUN`BUILD`ROWADVANCES,%0))
        flags: [funsyntax]
      FUN`BUILD`ROWADVANCES:
        value: |-
          words(iter(%q<build_rows>,if(cand(strmatch(elements(%i0,2,~),advance),strmatch(elements(%i0,3,~),%0)),x),|,%b))
        flags: [funsyntax]
      # %0 an action key: the dots bought for it with milestones, from the totals.
      FUN`BUILD`ADVANCES:
        value: |-
          firstof(after(grab(json_query(%q<build_totals>,extract,$.advanced),ucstr(%0):*),:),0)
        flags: [funsyntax]
      FUN`BUILD`RATING:
        value: |-
          firstof(after(grab(%q<build_ratings>,ucstr(%0):*),:),0)
        flags: [funsyntax]
      FUN`BUILD`DOTS:
        value: |-
          ladd(0 [iter(%q<build_ratings>,after(%i0,:))])
        flags: [funsyntax]
      # The starting dots given out: every dot but those bought with milestones, which the chargen budget leaves out.
      FUN`BUILD`GIVEN:
        value: |-
          json_query(%q<build_totals>,extract,$.given)
        flags: [funsyntax]
      FUN`BUILD`TALENTS:
        value: |-
          trim(squish(iter(%q<build_rows>,if(strmatch(elements(%i0,2,~),talent),elements(%i0,4,~)),|,|),|),|)
        flags: [funsyntax]
      # %0 a talent's text: the live build entry that gave it, or nothing.
      FUN`BUILD`TALENTENTRY:
        value: |-
          first(iter(u(%!/FUN`LEDGER`LIVE,u(%!/FUN`LEDGER`ENTRIES,%q<build_who>)),if(cand(strmatch(elements(%i0,2,~),talent),not(comp(lcstr(elements(%i0,4,~)),lcstr(%0)))),first(%i0,~)),|,%b))
        flags: [funsyntax]
      # %0 a character, %1 1 for their sheet even in an encounter: where their momentum, stress and condition are kept now,
      # as obj/path` to put a leaf after. Their encounter's copy while they are in one, else their sheet.
      FUN`STATE`AT:
        value: |-
          setq(state_copy,if(%1,,u(%!/FUN`ENCOUNTER`COPY,%0)))[if(strlen(%q<state_copy>),%q<state_copy>`,%0/CHARGE`)]
        flags: [funsyntax]
