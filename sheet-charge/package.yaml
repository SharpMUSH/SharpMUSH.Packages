      FUN`POOL`ROLL:
        value: |-
          roll(if(gt(%0,0),%0d6kh1,2d6kl1),,record)
        flags: [funsyntax]
      # %0 a recorded roll, %1 the pool: how many dice show 6, which a pool of none never counts.
      FUN`POOL`SIXES:
        value: |-
          if(gt(%1,0),words(iter(lnum(0,dec(json_query(json_query(%0,extract,$.dice%[0%].results),size))),if(eq(json_query(%0,extract,$.dice%[0%].results%[%i0%].result),6),x))),0)
        flags: [funsyntax]

      # ---- who may do what ----------------------------------------------------------
      FUN`PERM`KEEPER:
        value: |-
          permission(%0,softcode.charge.admin)
        flags: [funsyntax]
      # %0 who asks, %1 whose sheet: 1 when they may read it. ALLOW`VIEW`<name>, which a bridge adds, may let
      # more people read it.
      FUN`PERM`VIEW:
        value: |-
          cor(not(comp(objid(%0),%1)),u(%!/FUN`PERM`KEEPER,%0),get(%!/DATA`CONFIG`PUBLIC),words(filterbool(%!/FUN`PERM`ALLOWS,lattr(%!/ALLOW`VIEW`*),,,%0,%1)))
        flags: [funsyntax]
      FUN`PERM`ALLOWS:
        value: |-
          u(%!/%0,%1,%2)
        flags: [funsyntax]
      FUN`GATE`EDIT:
        value: |-
          if(hasattr(%!,GATE`EDIT),u(%!/GATE`EDIT,%0))
        flags: [funsyntax]
      FUN`PLAYER`MATCH:
        value: |-
          if(isdbref(setr(found_player,pmatch(%0))),objid(%q<found_player>))
        flags: [funsyntax]

      # ---- screens ------------------------------------------------------------------
      # %0 a check's JSON, %1 the boosts, %2 the momentum line: "Muscle (high risk, great effect): 3d6kh1[(3), 6,
      # (1)] = 6: a full success. +2 momentum (4). (roll 42)". A partial success or a bad outcome names the
      # consequence rating.
      FUN`DISPLAY`CHECK:
        value: |-
          setqm(display_tier,json_query(%0,extract,$.tier),
          display_risk,json_query(%0,extract,$.target))[json_query(%0,extract,$.label)] %(%q<display_risk> risk%, [json_query(%0,extract,$.effect)] effect%): [json_query(%0,extract,$.text)]%1: [tone(u(%!/FUN`DISPLAY`TIERTONE,%q<display_tier>),u(%!/FUN`DISPLAY`TIER,%q<display_tier>))][if(member(partial fail,%q<display_tier>),%, consequence [u(%!/FUN`RISK`RATING,%q<display_risk>)])].%2 [tone(muted,%(roll [json_query(%0,extract,$.roll)]%))]
        flags: [funsyntax]
      # %0 the helper or nothing, %1 1 for a push, %2 1 for tension: " (+1 die from Bob's help, +1 die pushing)".
      FUN`DISPLAY`BOOSTS:
        value: |-
          setq(boosts,trim([if(strlen(%0),+1 die from [name(%0)]'s help|)][if(%1,+1 die pushing|)][if(%2,+1 die for tension|)],|))[if(strlen(%q<boosts>),%b%([itemize(%q<boosts>,|,and,%,)]%))]
        flags: [funsyntax]
      # %0 the roller, %1 momentum gained, %2 1 when momentum was spent on the roll.
      FUN`DISPLAY`GAIN:
        value: |-
          cond(%1,%b+%1 momentum %([u(%!/API`CHARGES,%0)]%).,%2,%b[tone(muted,No momentum gained: some was spent on this roll.)])
        flags: [funsyntax]
      FUN`DISPLAY`TIER:
        value: |-
          switch(%0,crit-success,a critical success,success,a full success,partial,a partial success,a bad outcome)
        flags: [funsyntax]
      FUN`DISPLAY`RESISTED:
        value: |-
          switch(%0,crit-success,the consequence is avoided%, and the risk of the next roll is lowered,success,the consequence is avoided,partial,the consequence is reduced,the consequence still happens)
        flags: [funsyntax]
      FUN`DISPLAY`TIERTONE:
        value: |-
          switch(%0,crit-success,success,success,success,fail,error,warning)
        flags: [funsyntax]
      # %0 a risk: its consequence rating, 1 to 3.
      FUN`RISK`RATING:
        value: |-
          max(1,member(v(DATA`RISKS),%0))
        flags: [funsyntax]
      # %0 a character, %1 API`STRESS's JSON: "Alice has 2 of 4 stress." or that they are taken out.
      FUN`DISPLAY`STRESSED:
        value: |-
          if(json_query(%1,extract,$.out),[name(%0)]'s stress clock fills: [subj(%0)] [if(strmatch(subj(%0),they),are,is)] taken out for the scene%, and it clears. +sheet/condition <condition> says how [subj(%0)] [if(strmatch(subj(%0),they),are,is)] now.,[name(%0)] has [json_query(%1,extract,$.stress)] of [get(%!/DATA`CONFIG`STRESS)] stress.)
        flags: [funsyntax]
      # %0 a number filled, %1 out of: [##..].
      FUN`DISPLAY`TRACK:
        value: |-
          %[[repeat(#,%0)][repeat(.,sub(%1,%0))]%]
        flags: [funsyntax]
      FUN`DISPLAY`CLOCK:
        value: |-
          setqm(clock_size,get({{store}}/CLOCK`%0`SIZE),
          clock_filled,get({{store}}/CLOCK`%0`FILLED))[get({{store}}/CLOCK`%0)] [u(%!/FUN`DISPLAY`TRACK,%q<clock_filled>,%q<clock_size>)] %q<clock_filled>/%q<clock_size>
        flags: [funsyntax]
      FUN`SCREEN`CLOCKS:
        value: |-
          setq(screen_clocks,u(%!/FUN`LIST`ALL,CLOCK))[box(if(words(%q<screen_clocks>),ldatatable(lit({"nowrap":"2|3|4","rule":""}),Clock|Filled|>Segments|Started by,iter(%q<screen_clocks>,get({{store}}/CLOCK`%i0)|[u(%!/FUN`DISPLAY`TRACK,get({{store}}/CLOCK`%i0`FILLED),get({{store}}/CLOCK`%i0`SIZE))]|[get({{store}}/CLOCK`%i0`FILLED)]/[get({{store}}/CLOCK`%i0`SIZE)]|[name(get({{store}}/CLOCK`%i0`OWNER))],,%*<^>),%*<^>),tone(muted,There are no clocks.))%r[rule()]%r[tone(muted,+clock/new <name>=<segments> starts one%, +clock/tick <name> fills a segment.)],Clocks)]
        flags: [funsyntax]
      # %0 the character, %1 who reads it.
      FUN`SCREEN`SHEET:
        value: |-
          setqm(screen_stress,u(%!/API`STRESSED,%0),
          screen_talents,get(%0/CHARGE`TALENT))[box(lfields(lit({"cols":2}),Momentum%*<|>Stress%*<|>Milestones%*<|>Condition,[u(%!/API`CHARGES,%0)]%*<|>[u(%!/FUN`DISPLAY`TRACK,%q<screen_stress>,get(%!/DATA`CONFIG`STRESS))] %q<screen_stress>/[get(%!/DATA`CONFIG`STRESS)]%*<|>[u(%!/API`MILESTONES,%0)]%*<|>[firstof(get(%0/CHARGE`CONDITION),tone(muted,none))],%*<|>)%r[rule(Details)]%r[u(%!/FUN`SCREEN`DETAILS,%0)]%r[rule(Actions)]%r[u(%!/FUN`SCREEN`ACTIONS,%0)][if(strlen(%q<screen_talents>),%r[rule(Talents)]%r[iter(%q<screen_talents>,- %i0,|,%r)])]%r[rule()]%r[tone(muted,u(%!/FUN`DISPLAY`FOOTER,%0,%1))],name(%0))]
        flags: [funsyntax]
      FUN`SCREEN`DETAILS:
        value: |-
          setq(screen_details,u(%!/FUN`LIST`ALL,DETAIL))[lfields(,iter(%q<screen_details>,u(%!/FUN`LIST`LABEL,DETAIL,%i0),%b,%*<|>),iter(%q<screen_details>,firstof(get(%0/CHARGE`DETAIL`%i0),tone(muted,-)),%b,%*<|>),%*<|>)]
        flags: [funsyntax]
      # %0 the character: the actions in two columns, each with its dots.
      FUN`SCREEN`ACTIONS:
        value: |-
          setqm(screen_actions,u(%!/FUN`LIST`ALL,ACTION),
          screen_half,ceil(fdiv(words(%q<screen_actions>),2)))[ldatatable(lit({"nowrap":"1|2|3|4","rule":""}),Action|Dots|Action|Dots,iter(lnum(1,%q<screen_half>),[u(%!/FUN`SCREEN`ACTION,%0,extract(%q<screen_actions>,%i0,1))]|[u(%!/FUN`SCREEN`ACTION,%0,extract(%q<screen_actions>,add(%i0,%q<screen_half>),1))],%b,%*<^>),%*<^>)]
        flags: [funsyntax]
      # %0 the character, %1 an action key or nothing: "Muscle|[##..]".
      FUN`SCREEN`ACTION:
        value: |-
          if(strlen(%1),[u(%!/FUN`LIST`LABEL,ACTION,%1)]|[u(%!/FUN`DISPLAY`TRACK,u(%!/API`RATING,%0,%1),4)],|)
        flags: [funsyntax]
      FUN`DISPLAY`FOOTER:
        value: |-
          cond(cand(not(comp(objid(%1),%0)),not(isapproved(%1)),not(u(%!/FUN`PERM`KEEPER,%1))),[u(%!/API`DOTS,%0)] of [get(%!/DATA`CONFIG`DOTS)] dots given. +sheet/set <action>=<dots> gives them%, +sheet/detail <detail>=<text> writes a detail.[u(%!/FUN`HINT,FOOTER)],not(comp(objid(%1),%0)),+check <action>=<risk> rolls. +sheet/momentum and +sheet/stress keep count%, +sheet/advance and +sheet/talent spend milestones.,+check <action> rolls a die for each dot.)
        flags: [funsyntax]
      FUN`SCREEN`TRAITS:
        value: |-
          box(ldatatable(lit({"nowrap":"1|2"}),Key|Action|What it is for,iter(u(%!/FUN`LIST`ALL,ACTION),lcstr(%i0)|[u(%!/FUN`LIST`LABEL,ACTION,%i0)]|[get({{store}}/ACTION`%i0`SUMMARY)],,%*<^>),%*<^>)%r[rule()]%r[tone(muted,Risks: low%, moderate%, high. Effects: limited%, standard%, great. Difficulties: [itemize(v(DATA`DIFFICULTIES))].)],Charge actions)
        flags: [funsyntax]

      # ---- the sheet API ------------------------------------------------------------
      # What other packages call: u({{sheet-charge/sheet}}/API`<NAME>,...). Every sheet package has these names.
      # They read and roll; API`MOMENTUM, API`STRESS and API`MILESTONE are the ones that write.
      API:
        value: |-
          The Charge sheet's functions for other packages. See the package README.
        flags: [VISUAL]
      # JSON list of the actions: [{"key","label","always"}]. always is true for every one: an action with no dots
      # rolls two dice and keeps the lower.
      API`TRAITS:
        value: |-
          json_array(iter(u(%!/FUN`LIST`ALL,ACTION),json(object,key,json(string,lcstr(%i0)),label,json(string,u(%!/FUN`LIST`LABEL,ACTION,%i0)),always,json(boolean,1)),%b,|),|)
        flags: [VISUAL]
      API`ALWAYS:
        value: |-
          lcstr(u(%!/FUN`LIST`ALL,ACTION))
        flags: [VISUAL]
      API`FIND:
        value: |-
          lcstr(u(%!/FUN`LIST`FIND,ACTION,%0))
        flags: [VISUAL]
      API`LABEL:
        value: |-
          u(%!/FUN`LIST`LABEL,ACTION,ucstr(%0))
        flags: [VISUAL]
      # %0 a character, %1 an action: its dots, 0 when not set.
      API`RATING:
        value: |-
          default(%0/CHARGE`ACTION`[ucstr(%1)],0)
        flags: [VISUAL]
      # %0 a character: their dots in every action together.
      API`DOTS:
        value: |-
          setq(dots_who,%0)[ladd(0 [iter(u(%!/FUN`LIST`ALL,ACTION),u(%!/API`RATING,%q<dots_who>,%i0))])]
        flags: [VISUAL]
      API`HAS:
        value: |-
          hasattr(%0,CHARGE)
        flags: [VISUAL]
      # %0 a risk or a difficulty word: the risk (low, moderate, high, or none), or nothing.
      API`TARGET:
        value: |-
          cond(member(v(DATA`DIFFICULTIES),lcstr(%0)),lcstr(extract(get(%!/DATA`CONFIG`RISKS),member(v(DATA`DIFFICULTIES),lcstr(%0)),1)),member(v(DATA`RISKS),lcstr(%0)),lcstr(%0))
        flags: [VISUAL]
      # %0 the highest die, %1 how many dice showed 6 (only counted from a pool of one die or more): crit-success
      # on two 6s or more, success on a 6, partial on 4 or 5, fail on 1 to 3.
      API`TIER:
        value: |-
          cond(not(isint(%0)),,gte(%1,2),crit-success,eq(%0,6),success,gte(%0,4),partial,fail)
        flags: [VISUAL]
      # %0 a tier: the momentum an action roll that spent none gains on it (the momentum dial).
      API`GAIN:
        value: |-
          firstof(switch(%0,partial,extract(get(%!/DATA`CONFIG`GAIN),1,1),success,extract(get(%!/DATA`CONFIG`GAIN),2,1),crit-success,extract(get(%!/DATA`CONFIG`GAIN),3,1),0),0)
        flags: [VISUAL]
      # %0 a character: the momentum they hold. A character who never had any holds the session's start.
      API`CHARGES:
        value: |-
          default(%0/CHARGE`MOMENTUM,get(%!/DATA`CONFIG`MOMENTUM))
        flags: [VISUAL]
      # %0 a character, %1 momentum to gain (or spend, below 0): writes it, never below 0, and returns the new count.
      API`MOMENTUM:
        value: |-
          setq(momentum_new,max(0,add(u(%!/API`CHARGES,%0),%1)))[u(%!/FUN`DO`ROOT,%0)][attrib_set(%0/CHARGE`MOMENTUM,%q<momentum_new>)]%q<momentum_new>
        flags: [VISUAL]
      # %0 a character: the segments of their stress clock filled.
      API`STRESSED:
        value: |-
          default(%0/CHARGE`STRESS,0)
        flags: [VISUAL]
      # %0 a character, %1 stress to take (or recover, below 0). When the clock fills, the character is taken out
      # and it clears. Writes it and returns {"stress","out"}, out 1 when they are taken out.
      API`STRESS:
        value: |-
          setqm(stress_new,max(0,add(u(%!/API`STRESSED,%0),%1)),
          stress_out,gte(%q<stress_new>,get(%!/DATA`CONFIG`STRESS)))[u(%!/FUN`DO`ROOT,%0)][if(cand(not(%q<stress_out>),%q<stress_new>),attrib_set(%0/CHARGE`STRESS,%q<stress_new>),if(hasattr(%0,CHARGE`STRESS),attrib_set(%0/CHARGE`STRESS)))][json(object,stress,if(%q<stress_out>,0,%q<stress_new>),out,%q<stress_out>)]
        flags: [VISUAL]
      # %0 a character: the milestones they have not spent.
      API`MILESTONES:
        value: |-
          default(%0/CHARGE`MILESTONES,0)
        flags: [VISUAL]
      # %0 a character, %1 milestones to give (or take, below 0): writes it, never below 0, and returns the new count.
      API`MILESTONE:
        value: |-
          setq(milestone_new,max(0,add(u(%!/API`MILESTONES,%0),%1)))[u(%!/FUN`DO`ROOT,%0)][if(%q<milestone_new>,attrib_set(%0/CHARGE`MILESTONES,%q<milestone_new>),if(hasattr(%0,CHARGE`MILESTONES),attrib_set(%0/CHARGE`MILESTONES)))]%q<milestone_new>
        flags: [VISUAL]
      # Named: %<roller> an objid, %<trait> an action key, %<modifier> dice to add (or take), %<target> the risk,
      # %<effect> the effect (standard when empty). Rolls the pool and keeps the roll (roll() record), and returns
      # {"tier","total","sixes","dice","target","effect","label","text","roll","formula"}. #-1 and why when the
      # action or roller is wrong. It never touches momentum: the caller decides what the roll gains.
      API`CHECK:
        value: |-
          cond(not(hastype(%<roller>,player)),#-1 There is no character to roll for.,not(strlen(u(%!/FUN`LIST`FIND,ACTION,%<trait>))),#-1 There is no action '%<trait>'.,u(%!/FUN`CHECK`ROLLED,u(%!/FUN`LIST`FIND,ACTION,%<trait>),max(0,add(u(%!/API`RATING,%<roller>,u(%!/FUN`LIST`FIND,ACTION,%<trait>)),firstof(%<modifier>,0))),firstof(%<target>,moderate),firstof(%<effect>,standard)))
        flags: [VISUAL]
      # %0 the key, %1 the pool, %2 the risk, %3 the effect.
      FUN`CHECK`ROLLED:
        value: |-
          setqm(rolled,u(%!/FUN`POOL`ROLL,%1),
          rolled_total,json_query(%q<rolled>,extract,$.total),
          rolled_sixes,u(%!/FUN`POOL`SIXES,%q<rolled>,%1))[json(object,tier,json(string,u(%!/API`TIER,%q<rolled_total>,%q<rolled_sixes>)),total,%q<rolled_total>,sixes,%q<rolled_sixes>,dice,%1,target,json(string,%2),effect,json(string,%3),label,json(string,u(%!/FUN`LIST`LABEL,ACTION,%0)),text,json(string,json_query(%q<rolled>,extract,$.text)),roll,json_query(%q<rolled>,extract,$.id),formula,json(string,json_query(%q<rolled>,extract,$.formula)))]
        flags: [funsyntax]

      # ---- lifecycle ----------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP:
        value: |-
          @command/add/noparse/rsnoparse +sheet; @hook/override/inline +sheet=%!,CMD`SHEET; @command/add/noparse/rsnoparse +check; @hook/override/inline +check=%!,CMD`CHECK; @command/add/noparse/rsnoparse +clock; @hook/override/inline +clock=%!,CMD`CLOCK
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

  # The lists, and the game's clocks. Inside the Charge Sheet, so no player can reach it, and no_command, so
  # nothing kept on it is ever matched as a command. ACTION`<KEY> an action's label, with SUMMARY and ORDER
  # beneath; DETAIL`<KEY> a detail's label, with ORDER; CLOCK`<KEY> a clock. Staff change the lists with
  # +config charge/actions and /details; +clock changes the clocks. The action summaries are the Charge SRD's.
  - ref: store
    type: thing
    name: Charge Sheet Store
    location: "{{sheet}}"
    flags: [no_command]
    attributes:
      DETAIL: |-
        The details a character writes, one branch each, keyed as a player types it.
      DETAIL`CONCEPT: |-
        Concept
      DETAIL`CONCEPT`ORDER: |-
        1
      DETAIL`APPEARANCE: |-
        Appearance
      DETAIL`APPEARANCE`ORDER: |-
        2
      DETAIL`TIES: |-
        Ties
      DETAIL`TIES`ORDER: |-
        3
      ACTION: |-
        The actions, one branch each, with what each one is for.
      ACTION`MUSCLE: |-
        Muscle
      ACTION`MUSCLE`SUMMARY: |-
        You use your force to move, overcome or wreck the obstacle in front of you.
      ACTION`MUSCLE`ORDER: |-
        1
      ACTION`MOVE: |-
        Move
      ACTION`MOVE`SUMMARY: |-
        You quickly shift to a new position or get out of danger.
      ACTION`MOVE`ORDER: |-
        2
      ACTION`FINESSE: |-
        Finesse
      ACTION`FINESSE`SUMMARY: |-
        You employ dexterous manipulation or subtle misdirection.
      ACTION`FINESSE`ORDER: |-
        3
      ACTION`SNEAK: |-
        Sneak
      ACTION`SNEAK`SUMMARY: |-
        You traverse skillfully and quietly.
      ACTION`SNEAK`ORDER: |-
        4
      ACTION`SHOOT: |-
        Shoot
      ACTION`SHOOT`SUMMARY: |-
        You carefully track and shoot at a target.
      ACTION`SHOOT`ORDER: |-
        5
      ACTION`TINKER: |-
        Tinker
      ACTION`TINKER`SUMMARY: |-
        You understand, create, or repair complex mechanisms or organisms.
      ACTION`TINKER`ORDER: |-
        6
      ACTION`STUDY: |-
        Study
      ACTION`STUDY`SUMMARY: |-
        You gather, scrutinize and analyze information.
      ACTION`STUDY`ORDER: |-
        7
      ACTION`NOTICE: |-
        Notice
      ACTION`NOTICE`SUMMARY: |-
        You observe the situation and anticipate outcomes.
      ACTION`NOTICE`ORDER: |-
        8
      ACTION`BOND: |-
        Bond
      ACTION`BOND`SUMMARY: |-
        You reassure and socialize with friends and contacts.
      ACTION`BOND`ORDER: |-
        9
      ACTION`COMMAND: |-
        Command
      ACTION`COMMAND`SUMMARY: |-
        You compel swift obedience with skills and respect.
      ACTION`COMMAND`ORDER: |-
        10
      ACTION`FOCUS: |-
        Focus
      ACTION`FOCUS`SUMMARY: |-
        You concentrate to accomplish a task that requires great strength of mind.
      ACTION`FOCUS`ORDER: |-
        11
      ACTION`SWAY: |-
        Sway
      ACTION`SWAY`SUMMARY: |-
        You influence with guile, charm, or argument.
      ACTION`SWAY`ORDER: |-
        12
      CLOCK: |-
        The game's progress and danger clocks, one branch each, with SIZE, FILLED and OWNER beneath.

  # The +help topics, on an object of their own. sheet-charge-help registers it with +help; without that bridge
  # nothing reads it. HELP`<TOPIC> is a topic, its subtopics the leaves beneath, LOCK`<TOPIC> who may read it.
  - ref: sheet_help
    type: thing
    name: Charge Sheet Help
    location: "{{sheet}}"
    attributes:
      HELP: |-
        Your character's Charge sheet, rolling against it, and clocks: +sheet, +check and +clock.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`SHEET: |-
        check clock
      SEE`CHECK: |-
        sheet clock
      SEE`CLOCK: |-
        sheet check
      HELP`SHEET: |-
        `+sheet` shows your character's sheet: details, momentum, stress, condition, milestones, talents, and twelve actions with 0 to 4 dots each.

        - `+sheet` shows your own; `+sheet <name>` another character's, when the game lets you read it.
        - `+sheet/set <action>=<dots>` puts dots in an action: `+sheet/set muscle=2`. Leave the dots out to put it back to 0.
        - `+sheet/detail <detail>=<text>` writes a detail: your concept, appearance and ties. Change them whenever your character grows.
        - `+sheet/traits` lists the actions and what each is for.

        A new character gives out 7 dots, at most 2 in one action. You set them until your character is approved; after that, actions grow with milestones: see `+help sheet growth`.

        For example:

        `+sheet/detail concept=A retired courier who still knows every back road`

        Output: `\[SHEET\] Done: Alice's concept: A retired courier who still knows every back road`

        See `+help sheet play` for momentum, stress and condition, and `+help check` for rolling.
      HELP`SHEET`PLAY: |-
        In play you keep your own momentum, stress and condition:

        - `+sheet/momentum +<n>` gains momentum, `-<n>` spends it, `<n>` sets it, and `session` sets it to 2 for a new session: `+sheet/momentum session`. Action rolls gain momentum by themselves.
        - `+sheet/stress +<n>` takes stress on your stress clock, `-<n>` recovers some, `<n>` sets it and `clear` empties it. When the 4 segments fill, you are taken out for the scene, and the clock clears.
        - `+sheet/condition <condition>` says what the stress has done to you: `+sheet/condition Limping, one arm in a sling`. Leave it empty to clear it.

        You recover stress in the story, by resting, laying low or getting care; the GM says how much.

        For example:

        `+sheet/stress +2`

        Output: `\[SHEET\] Done: Alice has 2 of 4 stress.`
      HELP`SHEET`GROWTH: |-
        When a big event in the story ends, the GM may give a milestone. Spend each one on a talent:

        - `+sheet/advance <action>` puts one more dot in an action, up to 4: `+sheet/advance shoot`.
        - `+sheet/talent <talent>` takes a situational talent, a boost in a situation you choose: `+sheet/talent +1d6 when I fight to protect my crew`.

        A talent might give a die, lower the risk, raise the effect, or let you use one action in place of another, when its situation comes up. Pick a situation the story has already shown.

        For example:

        `+sheet/advance shoot`

        Output: `\[SHEET\] Done: Alice spends a milestone: Shoot has 3 dots. 0 left to spend.`
      HELP`CHECK: |-
        `+check <action>` is an action roll: one six-sided die per dot, reading the highest, where the room sees it. An action with no dots rolls two dice and reads the lower, and can't be a critical.

        - `+check <action>=<risk> <effect>` names the risk, low, moderate or high, and the effect, limited, standard or great: `+check shoot=high great`. Leave them out for moderate and standard. A difficulty word, trivial, easy, standard, hard or extreme, picks a risk too.
        - Two 6s are a critical success, a 6 a full success, 4 or 5 a partial success \(you do it, with a consequence\), 1 to 3 a bad outcome with a consequence. The consequence rating is 1 at low risk, 2 at moderate, 3 at high.
        - A roll gains momentum: 1 on a partial success, 2 on a full success, 3 on a critical. A roll that spent momentum gains none.

        See `+help check boost` to add dice, and `+help check other` for determination and fortune rolls.

        For example:

        `+check muscle=high`

        Output: `\[SHEET\] Alice rolls Muscle (high risk, standard effect): 2d6kh1\[(3), 6\] = 6: a full success. +2 momentum (4). (roll 42)`
      HELP`CHECK`BOOST: |-
        You can usually add two dice to an action roll: one from a friend's help, and one from either pushing yourself or adding tension.

        - `+check/assist <name>` spends 1 of your momentum to help someone here: their next action roll gets a die.
        - `+check/push <action>` spends 2 momentum on a die. To push for a better effect instead, spend it with `+sheet/momentum -2` and name the higher effect.
        - `+check/tension <action>` adds a die once you take the complication the GM offers.
        - `+check <action>+<n>` or `-<n>` adds or takes dice for anything else, such as a talent.
        - `/private` rolls where only you see it, alone or with `/push` or `/tension`: `+check/push/private sneak`.

        For example:

        `+check/assist Bob`

        Output: `\[SHEET\] Alice spends 1 momentum to help Bob: +1 die on their next action roll. (Alice has 1 momentum.)`
      HELP`CHECK`OTHER: |-
        Two rolls stand apart from action rolls:

        - `+check/determination <momentum>` resists a consequence you don't like. Spend momentum for one die each. 1 to 3: it still happens; 4 or 5: it is reduced; 6: it is avoided; two 6s: it is avoided and the risk of your next roll is lowered. `/resist` is the same switch.
        - `+check/fortune <dice>` leaves something to luck, one die per level of likelihood, or `+check/fortune <action>` rolls an action's dots. It gains no momentum and brings no consequence.

        For example:

        `+check/determination 2`

        Output: `\[SHEET\] Alice makes a determination roll with 2 momentum: 2d6kh1\[(1), 5\] = 5: the consequence is reduced. Alice has 0 momentum. (roll 43)`
      HELP`CLOCK: |-
        A clock tracks progress towards a goal, or danger that grows. Clocks belong to the game, so anyone may read them.

        - `+clock` lists the clocks; `+clock <name>` shows one.
        - `+clock/new <name>=<segments>` starts one with 4, 6 or 8 segments.
        - `+clock/tick <name>` fills a segment; `+clock/tick <name>=<n>` fills n, or empties some with a number below 0.
        - `+clock/remove <name>` takes it away.

        A success ticks a progress clock 1, 2 or 3 for a limited, standard or great effect. A consequence ticks a danger clock 1, 2 or 3 for a low, moderate or high risk. Only whoever started a clock, and sheet keepers, change it.

        For example:

        `+clock/tick alarm=2`

        Output: `\[CLOCK\] Alice ticks a clock: Alarm \[##..\] 2/4`
