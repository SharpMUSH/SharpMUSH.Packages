          setq(line_n,first(%0,~))%q<line_n>|[u(%!/FUN`DISPLAY`ENTRY,%0)][cond(member(%q<ledger_revoked>,%q<line_n>),%b[tone(muted,%(revoked%))],lt(%q<line_n>,%q<ledger_cleared>),%b[tone(muted,%(cleared%))])]|[elements(%0,5,~)]|[name(elements(%0,6,~))]
        flags: [funsyntax]
      # %0 a ledger row: what the entry does, "Muscle at 2 dots".
      FUN`DISPLAY`ENTRY:
        value: |-
          setqm(entry_kind,elements(%0,2,~),
          entry_key,elements(%0,3,~),
          entry_value,elements(%0,4,~))[switch(%q<entry_kind>,dots,[u(%!/FUN`LIST`LABEL,ACTION,%q<entry_key>)] at [firstof(%q<entry_value>,0)] [if(eq(firstof(%q<entry_value>,0),1),dot,dots)],advance,[u(%!/FUN`LIST`LABEL,ACTION,%q<entry_key>)] +1 dot for a milestone,milestone,[if(gt(%q<entry_value>,0),+)]%q<entry_value> [if(eq(abs(%q<entry_value>),1),milestone,milestones)][if(strlen(elements(%0,7,~)),: [elements(%0,7,~)])],talent,Talent for a milestone: %q<entry_value>,revoke,Revokes entry %q<entry_key>,clear,Clears the sheet,%q<entry_kind>)]
        flags: [funsyntax]
      FUN`SCREEN`TRAITS:
        value: |-
          box(ldatatable(lit({"nowrap":"1|2"}),Key|Action|What it is for,iter(u(%!/FUN`LIST`ALL,ACTION),lcstr(%i0)|[u(%!/FUN`LIST`LABEL,ACTION,%i0)]|[get({{store}}/ACTION`%i0`SUMMARY)],,%*<^>),%*<^>)%r[rule()]%r[tone(muted,Risks: low%, moderate%, high. Effects: limited%, standard%, great. Difficulties: [itemize(v(DATA`DIFFICULTIES))].)],Charge actions)
        flags: [funsyntax]

      # ---- the sheet API ------------------------------------------------------------
      # What other packages call: u({{sheet-charge/sheet}}/API`<NAME>,...). Every sheet package has these names.
      # They read and roll; API`RECORD, API`MOMENTUM, API`STRESS and API`MILESTONE are the ones that write. In an
      # encounter the ratings, talents, momentum and stress are the member's copy unless the call asks for their sheet.
      API:
        value: |-
          The Charge sheet's functions for other packages. See the package README.
        flags: [VISUAL]
      # JSON list of the actions: [{"key","label","always"}]. always is true for every one: an action with no dots
      # rolls two dice and keeps the lower.
      API`TRAITS:
        value: |-
          json_array(iter(u(%!/FUN`LIST`ALL,ACTION),json(object,key,json(string,lcstr(%i0)),label,json(string,u(%!/FUN`LIST`LABEL,ACTION,%i0)),always,json(boolean,1)),%b,|),|)
        flags: [VISUAL]
      API`ALWAYS:
        value: |-
          lcstr(u(%!/FUN`LIST`ALL,ACTION))
        flags: [VISUAL]
      API`FIND:
        value: |-
          lcstr(u(%!/FUN`LIST`FIND,ACTION,%0))
        flags: [VISUAL]
      API`LABEL:
        value: |-
          u(%!/FUN`LIST`LABEL,ACTION,ucstr(%0))
        flags: [VISUAL]
      # %0 a character, %1 an action, %2 1 for their sheet even in an encounter: its dots.
      API`RATING:
        value: |-
          [u(%!/FUN`BUILD`PREPARE,%0,%2)][u(%!/FUN`BUILD`RATING,%1)]
        flags: [VISUAL]
      # %0 a character, %1 1 for their sheet even in an encounter: their dots in every action together.
      API`DOTS:
        value: |-
          [u(%!/FUN`BUILD`PREPARE,%0,%1)][u(%!/FUN`BUILD`DOTS)]
        flags: [VISUAL]
      API`HAS:
        value: |-
          hasattr(%0,CHARGE)
        flags: [VISUAL]
      # %0 a risk or a difficulty word: the risk (low, moderate, high, or none), or nothing.
      API`TARGET:
        value: |-
          cond(member(v(DATA`DIFFICULTIES),lcstr(%0)),lcstr(extract(get(%!/DATA`CONFIG`RISKS),member(v(DATA`DIFFICULTIES),lcstr(%0)),1)),member(v(DATA`RISKS),lcstr(%0)),lcstr(%0))
        flags: [VISUAL]
      # %0 the highest die, %1 how many dice showed 6 (only counted from a pool of one die or more): crit-success
      # on two 6s or more, success on a 6, partial on 4 or 5, fail on 1 to 3.
      API`TIER:
        value: |-
          cond(not(isint(%0)),,gte(%1,2),crit-success,eq(%0,6),success,gte(%0,4),partial,fail)
        flags: [VISUAL]
      # %0 a tier: the momentum an action roll that spent none gains on it (the momentum dial).
      API`GAIN:
        value: |-
          firstof(switch(%0,partial,extract(get(%!/DATA`CONFIG`GAIN),1,1),success,extract(get(%!/DATA`CONFIG`GAIN),2,1),crit-success,extract(get(%!/DATA`CONFIG`GAIN),3,1),0),0)
        flags: [VISUAL]
      # %0 a character, %1 1 for their sheet even in an encounter: the momentum they hold. A character who never had
      # any holds the session's start.
      API`CHARGES:
        value: |-
          default([u(%!/FUN`STATE`AT,%0,%1)]MOMENTUM,get(%!/DATA`CONFIG`MOMENTUM))
        flags: [VISUAL]
      # %0 a character, %1 momentum to gain (or spend, below 0), %2 1 for their sheet even in an encounter: writes it,
      # never below 0, and returns the new count.
      API`MOMENTUM:
        value: |-
          setq(momentum_new,max(0,add(u(%!/API`CHARGES,%0,%2),%1)))[u(%!/FUN`STATE`WRITE,%0,MOMENTUM,%q<momentum_new>,%2)]%q<momentum_new>
        flags: [VISUAL]
      # %0 a character, %1 1 for their sheet even in an encounter: the segments of their stress clock filled.
      API`STRESSED:
        value: |-
          default([u(%!/FUN`STATE`AT,%0,%1)]STRESS,0)
        flags: [VISUAL]
      # %0 a character, %1 stress to take (or recover, below 0), %2 1 for their sheet even in an encounter. When the
      # clock fills, the character is taken out and it clears. Writes it and returns {"stress","out"}, out 1 when they
      # are taken out.
      API`STRESS:
        value: |-
          setqm(stress_new,max(0,add(u(%!/API`STRESSED,%0,%2),%1)),
          stress_out,gte(%q<stress_new>,get(%!/DATA`CONFIG`STRESS)))[u(%!/FUN`STATE`WRITE,%0,STRESS,if(cand(not(%q<stress_out>),%q<stress_new>),%q<stress_new>),%2)][json(object,stress,if(%q<stress_out>,0,%q<stress_new>),out,%q<stress_out>)]
        flags: [VISUAL]
      # %0 a character: the milestones they have not spent. Milestones are always the sheet's.
      API`MILESTONES:
        value: |-
          [u(%!/FUN`BUILD`PREPARE,%0,1)]%q<build_milestones>
        flags: [VISUAL]
      # %0 a character, %1 milestones to give (or take, below 0), %2 why (80 characters, no | or ~): records it on
      # the milestones ledger (CHARGE`XP`<n>, stamped like a build entry), rewrites the totals and returns the new count.
      API`MILESTONE:
        value: |-
          setqm(xp_phase,cond(not(isapproved(%0)),chargen,u(%!/FUN`PERM`KEEPER,%#),staff,play),
          xp_n,inc(lmax(0 [iter(lattr(%0/CHARGE`XP`*),last(%i0,`))])))[u(%!/FUN`DO`ROOT,%0)][null(attrib_set(%0/CHARGE`XP`%q<xp_n>,json(object,n,%q<xp_n>,kind,"milestone",count,%1,reason,json(string,left(edit(%2,|,,~,),80)),by,json(string,objid(%#)),phase,json(string,%q<xp_phase>))))][null(set(%0/CHARGE`XP`%q<xp_n>,wizard))][u(%!/FUN`TOTALS`WRITE,%0)][u(%!/API`MILESTONES,%0)]
        flags: [VISUAL]
      # Named: %<roller> an objid, %<trait> an action key, %<modifier> dice to add (or take), %<target> the risk,
      # %<effect> the effect (standard when empty), %<live> 1 to roll the sheet even in an encounter. Rolls the pool and keeps the roll (roll() record), and returns
      # {"tier","total","sixes","dice","target","effect","label","text","roll","formula"}. #-1 and why when the
      # action or roller is wrong. It never touches momentum: the caller decides what the roll gains.
      API`CHECK:
        value: |-
          cond(not(hastype(%<roller>,player)),#-1 There is no character to roll for.,not(strlen(setr(check_found,u(%!/FUN`LIST`FIND,ACTION,%<trait>)))),#-1 There is no action '%<trait>'.,u(%!/FUN`CHECK`ROLLED,%q<check_found>,max(0,add(u(%!/API`RATING,%<roller>,%q<check_found>,%<live>),firstof(%<modifier>,0))),firstof(%<target>,moderate),firstof(%<effect>,standard)))
        flags: [VISUAL]
      # %0 the key, %1 the pool, %2 the risk, %3 the effect.
      FUN`CHECK`ROLLED:
        value: |-
          setqm(rolled,u(%!/FUN`POOL`ROLL,%1),
          rolled_total,json_query(%q<rolled>,extract,$.total),
          rolled_sixes,u(%!/FUN`POOL`SIXES,%q<rolled>,%1))[json(object,tier,json(string,u(%!/API`TIER,%q<rolled_total>,%q<rolled_sixes>)),total,%q<rolled_total>,sixes,%q<rolled_sixes>,dice,%1,target,json(string,%2),effect,json(string,%3),label,json(string,u(%!/FUN`LIST`LABEL,ACTION,%0)),text,json(string,json_query(%q<rolled>,extract,$.text)),roll,json_query(%q<rolled>,extract,$.id),formula,json(string,json_query(%q<rolled>,extract,$.formula)))]
        flags: [funsyntax]

      # ---- lifecycle ----------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP:
        value: |-
          @command/add/noparse/rsnoparse +sheet; @hook/override/inline +sheet=%!,CMD`SHEET; @command/add/noparse/rsnoparse +check; @hook/override/inline +check=%!,CMD`CHECK; @command/add/noparse/rsnoparse +clock; @hook/override/inline +clock=%!,CMD`CLOCK; @command/add/noparse/rsnoparse +encounter; @hook/override/inline +encounter=%!,CMD`ENCOUNTER
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

  # The lists, and the game's clocks. Inside the Charge Sheet, so no player can reach it, and no_command, so
  # nothing kept on it is ever matched as a command. ACTION`<KEY> an action's label, with SUMMARY and ORDER
  # beneath; DETAIL`<KEY> a detail's label, with ORDER; CLOCK`<KEY> a clock. Staff change the lists with
  # +config charge/actions and /details; +clock changes the clocks. The action summaries are the Charge SRD's.
  - ref: store
    type: thing
    name: Charge Sheet Store
    location: "{{sheet}}"
    flags: [no_command]
    attributes:
      DETAIL: |-
        The details a character writes, one branch each, keyed as a player types it.
      DETAIL`CONCEPT: |-
        Concept
      DETAIL`CONCEPT`ORDER: |-
        1
      DETAIL`APPEARANCE: |-
        Appearance
      DETAIL`APPEARANCE`ORDER: |-
        2
      DETAIL`TIES: |-
        Ties
      DETAIL`TIES`ORDER: |-
        3
      ACTION: |-
        The actions, one branch each, with what each one is for.
      ACTION`MUSCLE: |-
        Muscle
      ACTION`MUSCLE`SUMMARY: |-
        You use your force to move, overcome or wreck the obstacle in front of you.
      ACTION`MUSCLE`ORDER: |-
        1
      ACTION`MOVE: |-
        Move
      ACTION`MOVE`SUMMARY: |-
        You quickly shift to a new position or get out of danger.
      ACTION`MOVE`ORDER: |-
        2
      ACTION`FINESSE: |-
        Finesse
      ACTION`FINESSE`SUMMARY: |-
        You employ dexterous manipulation or subtle misdirection.
      ACTION`FINESSE`ORDER: |-
        3
      ACTION`SNEAK: |-
        Sneak
      ACTION`SNEAK`SUMMARY: |-
        You traverse skillfully and quietly.
      ACTION`SNEAK`ORDER: |-
        4
      ACTION`SHOOT: |-
        Shoot
      ACTION`SHOOT`SUMMARY: |-
        You carefully track and shoot at a target.
      ACTION`SHOOT`ORDER: |-
        5
      ACTION`TINKER: |-
        Tinker
      ACTION`TINKER`SUMMARY: |-
        You understand, create, or repair complex mechanisms or organisms.
      ACTION`TINKER`ORDER: |-
        6
      ACTION`STUDY: |-
        Study
      ACTION`STUDY`SUMMARY: |-
        You gather, scrutinize and analyze information.
      ACTION`STUDY`ORDER: |-
        7
      ACTION`NOTICE: |-
        Notice
      ACTION`NOTICE`SUMMARY: |-
        You observe the situation and anticipate outcomes.
      ACTION`NOTICE`ORDER: |-
        8
      ACTION`BOND: |-
        Bond
      ACTION`BOND`SUMMARY: |-
        You reassure and socialize with friends and contacts.
      ACTION`BOND`ORDER: |-
        9
      ACTION`COMMAND: |-
        Command
      ACTION`COMMAND`SUMMARY: |-
        You compel swift obedience with skills and respect.
      ACTION`COMMAND`ORDER: |-
        10
      ACTION`FOCUS: |-
        Focus
      ACTION`FOCUS`SUMMARY: |-
        You concentrate to accomplish a task that requires great strength of mind.
      ACTION`FOCUS`ORDER: |-
        11
      ACTION`SWAY: |-
        Sway
      ACTION`SWAY`SUMMARY: |-
        You influence with guile, charm, or argument.
      ACTION`SWAY`ORDER: |-
        12
      CLOCK: |-
        The game's progress and danger clocks, one branch each, with SIZE, FILLED and OWNER beneath.
      ENCOUNTER: |-
        OPEN lists the encounters running, NEXT counts them.
      ENC: |-
        The encounters, one branch each: the title, with ROOM, GM and COPY, each member's copy of their sheet.

  # The +help topics, on an object of their own. sheet-charge-help registers it with +help; without that bridge
  # nothing reads it. HELP`<TOPIC> is a topic, its subtopics the leaves beneath, LOCK`<TOPIC> who may read it.
  - ref: sheet_help
    type: thing
    name: Charge Sheet Help
    location: "{{sheet}}"
    attributes:
      HELP: |-
        Your character's Charge sheet, rolling against it, encounters and clocks: +sheet, +check, +encounter and +clock.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`SHEET: |-
        check encounter clock
      SEE`CHECK: |-
        sheet encounter clock
      SEE`CLOCK: |-
        sheet check
      SEE`ENCOUNTER: |-
        sheet check
      HELP`SHEET: |-
        `+sheet` shows your character's sheet: details, momentum, stress, condition, milestones, talents, and twelve actions with 0 to 4 dots each.

        - `+sheet` shows your own; `+sheet <name>` another character's, when the game lets you read it.
        - `+sheet/set <action>=<dots>` puts dots in an action: `+sheet/set muscle=2`. Leave the dots out to put it back to 0.
        - `+sheet/detail <detail>=<text>` writes a detail: your concept, appearance and ties. Change them whenever your character grows.
        - `+sheet/traits` lists the actions and what each is for.

        A new character gives out 7 dots, at most 2 in one action. You set them until your character is approved; after that, actions grow with milestones: see `+help sheet growth`.

        For example:

        `+sheet/detail concept=A retired courier who still knows every back road`

        Output: `\[SHEET\] Done: Alice's concept: A retired courier who still knows every back road`

        See `+help sheet play` for momentum, stress and condition, `+help sheet ledger` for how the sheet is built, and `+help check` for rolling.
      HELP`SHEET`PLAY: |-
        In play you keep your own momentum, stress and condition:

        - `+sheet/momentum +<n>` gains momentum, `-<n>` spends it, `<n>` sets it, and `session` sets it to 2 for a new session: `+sheet/momentum session`. Action rolls gain momentum by themselves.
        - `+sheet/stress +<n>` takes stress on your stress clock, `-<n>` recovers some, `<n>` sets it and `clear` empties it. When the 4 segments fill, you are taken out for the scene, and the clock clears.
        - `+sheet/condition <condition>` says what the stress has done to you: `+sheet/condition Limping, one arm in a sling`. Leave it empty to clear it.

        You recover stress in the story, by resting, laying low or getting care; the GM says how much.

        For example:

        `+sheet/stress +2`

        Output: `\[SHEET\] Done: Alice has 2 of 4 stress.`
      HELP`SHEET`GROWTH: |-
        When a big event in the story ends, the GM may give a milestone, with the reason on your milestones ledger \(`+sheet/milestones`\). Spend each one:

        - `+sheet/advance <action>` puts one more dot in an action, up to 4: `+sheet/advance shoot`.
        - `+sheet/talent <talent>` takes a situational talent, a boost in a situation you choose: `+sheet/talent +1d6 when I fight to protect my crew`.

        A talent might give a die, lower the risk, raise the effect, or let you use one action in place of another, when its situation comes up. Pick a situation the story has already shown.

        For example:

        `+sheet/advance shoot`

        Output: `\[SHEET\] Done: Alice spends a milestone: Shoot has 3 dots. 0 left to spend.`
      HELP`SHEET`LEDGER: |-
        Your sheet keeps two ledgers. The build ledger holds the dots you gave out and each advance and talent you bought. The milestones ledger holds each milestone given or taken, and why. The sheet adds the two up and keeps the totals ready.

        - `+sheet/ledger` lists the build entries, oldest first, with the phase each was made in \(chargen, play or staff\) and who made it.
        - `+sheet/milestones` lists the milestones ledger, with what you earned, spent and have left.
        - Both take a name, `+sheet/ledger <name>`, when you may read that character's sheet.
        - Changing an action's dots during chargen rewrites that action's chargen entry, so the ledger keeps one per action.
        - Only a sheet keeper undoes an entry, by adding one that revokes it. A revoked entry stays on the list, marked.

        For example:

        `+sheet/ledger`

        Output: the ledger in a box, one line per entry, such as `6 Shoot +1 dot for a milestone play Alice`.
      HELP`ENCOUNTER: |-
        An encounter is a fight, chase or other scene that keeps its own copy of each member's sheet. Rolls and changes made in it touch only that copy, so a fight that runs for days never changes your sheet or another scene.

        - `+encounter` shows the encounter you are in here, or lists every open one. `+encounter <n>` shows one.
        - `+encounter/start \[<title>\]` starts one in this room. You run it as its GM.
        - `+encounter/join \[<n>\]` joins with a copy of your dots, talents, momentum, stress and condition, taken now. Give the number when the room holds more than one.
        - `+encounter/leave \[<n>\]` drops your copy. Nothing from it goes back to your sheet.
        - `+encounter/use <n>` picks which of your encounters here your rolls and changes go to.

        A room may hold several encounters, and you may be in several. Your copy is used while you are in the room where its encounter runs: the one you picked with `/use`, else the one you joined last. Anywhere else, your sheet is used. Milestones, the ledger and Duties always use your sheet.

        For example:

        `+encounter/join`

        Output: `\[ENCOUNTER\] Alice joins encounter 4: Docks fight. Rolls and changes there use a copy of their sheet.`

        See `+help encounter gm` for running one.
      HELP`ENCOUNTER`GM: |-
        Whoever starts an encounter is its GM. The GM and sheet keepers run it:

        - `+encounter/add <name>\[=<n>\]` brings a character in with a copy of their sheet.
        - `+encounter/remove <name>\[=<n>\]` drops a member's copy.
        - `+encounter/keep <name>\[=<n>\]` writes a member's stress and condition from the encounter back to their sheet. The copy stays, so play goes on.
        - `+encounter/end \[<n>\]` ends it and drops every copy.

        When an encounter ends, nothing carries back to a sheet unless the GM kept it. Momentum and the build never carry back. Leave out the number to act on the encounter you are in here, the only one here, or the last one you started.

        For example:

        `+encounter/keep Alice`

        Output: `\[ENCOUNTER\] Done: Alice's sheet keeps the stress and condition from encounter 1: 3 of 4 stress, Bruised ribs.`
      HELP`CHECK: |-
        `+check <action>` is an action roll: one six-sided die per dot, reading the highest, where the room sees it. An action with no dots rolls two dice and reads the lower, and can't be a critical.

        - `+check <action>=<risk> <effect>` names the risk, low, moderate or high, and the effect, limited, standard or great: `+check shoot=high great`. Leave them out for moderate and standard. A difficulty word, trivial, easy, standard, hard or extreme, picks a risk too, and adds or takes the dice the game sets for it (extreme takes 1 by default).
        - Two 6s are a critical success, a 6 a full success, 4 or 5 a partial success \(you do it, with a consequence\), 1 to 3 a bad outcome with a consequence. The consequence rating is 1 at low risk, 2 at moderate, 3 at high.
        - A roll gains momentum: 1 on a partial success, 2 on a full success, 3 on a critical. A roll that spent momentum gains none.

        See `+help check boost` to add dice, and `+help check other` for determination and fortune rolls.

        For example:

        `+check muscle=high`

        Output: `\[SHEET\] Alice rolls Muscle (high risk, standard effect): 2d6kh1\[(3), 6\] = 6: a full success. +2 momentum (4). (roll 42)`
      HELP`CHECK`BOOST: |-
        You can usually add two dice to an action roll: one from a friend's help, and one from either pushing yourself or adding tension.

        - `+check/assist <name>` spends 1 of your momentum to help someone here: their next action roll gets a die.
        - `+check/push <action>` spends 2 momentum on a die. To push for a better effect instead, spend it with `+sheet/momentum -2` and name the higher effect.
        - `+check/tension <action>` adds a die once you take the complication the GM offers.
        - `+check <action>+<n>` or `-<n>` adds or takes dice for anything else, such as a talent.
        - `/private` rolls where only you see it, alone or with `/push` or `/tension`: `+check/push/private sneak`.

        For example:

        `+check/assist Bob`

        Output: `\[SHEET\] Alice spends 1 momentum to help Bob: +1 die on their next action roll. (Alice has 1 momentum.)`
      HELP`CHECK`OTHER: |-
        Two rolls stand apart from action rolls:

        - `+check/determination <momentum>` resists a consequence you don't like. Spend momentum for one die each. 1 to 3: it still happens; 4 or 5: it is reduced; 6: it is avoided; two 6s: it is avoided and the risk of your next roll is lowered. `/resist` is the same switch.
        - `+check/fortune <dice>` leaves something to luck, one die per level of likelihood, or `+check/fortune <action>` rolls an action's dots. It gains no momentum and brings no consequence.

        For example:

        `+check/determination 2`

        Output: `\[SHEET\] Alice makes a determination roll with 2 momentum: 2d6kh1\[(1), 5\] = 5: the consequence is reduced. Alice has 0 momentum. (roll 43)`
      HELP`CLOCK: |-
        A clock tracks progress towards a goal, or danger that grows. Clocks belong to the game, so anyone may read them.

        - `+clock` lists the clocks; `+clock <name>` shows one.
        - `+clock/new <name>=<segments>` starts one with 4, 6 or 8 segments.
        - `+clock/tick <name>` fills a segment; `+clock/tick <name>=<n>` fills n, or empties some with a number below 0.
        - `+clock/remove <name>` takes it away.

        A success ticks a progress clock 1, 2 or 3 for a limited, standard or great effect. A consequence ticks a danger clock 1, 2 or 3 for a low, moderate or high risk. Only whoever started a clock, and sheet keepers, change it.

        For example:

        `+clock/tick alarm=2`

        Output: `\[CLOCK\] Alice ticks a clock: Alarm \[##..\] 2/4`
      HELP`SHEET`CREDITS: |-
        This sheet is based on Charge, product of Fari RPGs \(https://farirpgs.com/\), developed and authored by René-Pier Deshaies-Gélinas, and licensed for our use under the Creative Commons Attribution 4.0 License \(https://creativecommons.org/licenses/by/4.0/\).

        This work is also based on Blades in the Dark \(found at http://www.bladesinthedark.com/\), product of One Seven Design, developed and authored by John Harper, and licensed for our use under the Creative Commons Attribution 3.0 Unported license \(http://creativecommons.org/licenses/by/3.0/\).

        It is not endorsed or sponsored by Fari RPGs or One Seven Design.
      LOCK`SHEET`STAFF: |-
        perm^softcode.charge.admin
      HELP`SHEET`STAFF: |-
        Sheet keepers \(`softcode.charge.admin`, or the Charge Sheet Keeper role\) read every sheet and change any character's at any time:

        - `+sheet <name>` shows a character's sheet.
        - `/set`, `/detail`, `/advance` and `/talent` take `<name>/` first: `+sheet/set Alice/muscle=3`. A keeper may put up to 4 dots in an action, past the starting dots.
        - `+sheet/momentum <name>=<n>`, `+sheet/stress <name>=<n>` and `+sheet/condition <name>=<condition>` change those.
        - `+sheet/milestone <name>=<n>/<reason>` gives milestones, or takes them with a number below 0. The reason goes on the milestones ledger: `+sheet/milestone Alice=1/Finished the docks job`. A wrong grant is corrected with a negative one.
        - `+sheet/talent <name>/<talent>=remove` takes a talent off and gives the milestone back.
        - `+sheet/revoke <name>/<entry>` undoes an entry on a character's ledger: `+sheet/revoke Alice/3`. `+sheet/ledger <name>` numbers them. A clear is not undone.
        - `+sheet/clear <name>=confirm` starts a sheet over: one ledger entry clears the build, and the details, momentum, stress and condition are wiped. It takes the character out of every encounter. The milestones ledger stays, so every milestone earned is there to spend again.
        - Keepers run any encounter as its GM, and tick and remove anyone's clocks.

        `@role/assign <player>=charge-sheet-keeper` makes someone a keeper.
      LOCK`SHEET`SETTINGS: |-
        perm^config.admin
      HELP`SHEET`SETTINGS: |-
        `+config charge` lists the settings and `+config charge/<setting>=<value>` changes one \(`config.admin`\):

        - `dots`: action dots a new character gives out \(7\). `cap`: the most in one action at the start \(2\).
        - `momentum`: momentum at the start of a session \(2\). `gain`: what a partial success, a full success and a critical gain \(`1 2 3`\); lower it for a grimmer game.
        - `stress`: segments on the stress clock \(4\).
        - `risks`: the risk of trivial, easy, standard, hard and extreme \(`none low moderate high high`\). `none` means no roll: it simply succeeds.
        - `dice`: dice added or taken at each difficulty \(`0 0 0 0 -1`\).
        - `public`: whether anyone may read anyone's sheet \(no\).
        - `actions`, `details`: the two lists. `+config/add charge/actions/ride=Ride` adds an action; set its `summary` field.

        Removing an action leaves what characters had stored, but the sheet stops showing it.
