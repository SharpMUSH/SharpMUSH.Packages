      LOCK`SHEET`STAFF: |-
        perm^softcode.charge.admin
      HELP`SHEET`STAFF: |-
        Sheet keepers \(`softcode.charge.admin`, or the Charge Sheet Keeper role\) read every sheet and change any character's at any time:

        - `+sheet <name>` shows a character's sheet.
        - `/set`, `/detail`, `/advance` and `/talent` take `<name>/` first: `+sheet/set Alice/muscle=3`. A keeper may put up to 4 dots in an action, past the starting dots.
        - `+sheet/momentum <name>=<n>`, `+sheet/stress <name>=<n>` and `+sheet/condition <name>=<condition>` change those.
        - `+sheet/milestone <name>=<n>` gives milestones, or takes them with a number below 0.
        - `+sheet/talent <name>/<talent>=remove` takes a talent off.
        - Keepers tick and remove anyone's clocks.

        `@role/assign <player>=charge-sheet-keeper` makes someone a keeper.
      LOCK`SHEET`SETTINGS: |-
        perm^config.admin
      HELP`SHEET`SETTINGS: |-
        `+config charge` lists the settings and `+config charge/<setting>=<value>` changes one \(`config.admin`\):

        - `dots`: action dots a new character gives out \(7\). `cap`: the most in one action at the start \(2\).
        - `momentum`: momentum at the start of a session \(2\). `gain`: what a partial success, a full success and a critical gain \(`1 2 3`\); lower it for a grimmer game.
        - `stress`: segments on the stress clock \(4\).
        - `risks`: the risk of trivial, easy, standard, hard and extreme \(`none low moderate high high`\). `none` means no roll: it simply succeeds.
        - `dice`: dice added or taken at each difficulty \(`0 0 0 0 -1`\).
        - `public`: whether anyone may read anyone's sheet \(no\).
        - `actions`, `details`: the two lists. `+config/add charge/actions/ride=Ride` adds an action; set its `summary` field.

        Removing an action leaves what characters had stored, but the sheet stops showing it.
