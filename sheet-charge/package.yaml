      INC`ENCOUNTER`KEEP:
        value: |-
          @assert strlen(%q<cmd_left_side>)=@pemit %#=notice(ENCOUNTER,+encounter/keep <name>[=<n>] writes a member's stress and condition back to their sheet.,warn); @include/args %!/INC`NEED`ENCOUNTER=number,%q<cmd_right_side>; @include %!/INC`NEED`RUNS; @include/args %!/INC`NEED`MEMBER=name,%q<cmd_left_side>; think setq(keep_copy,{{store}}/ENC`%q<enc_n>`COPY`[u(%!/FUN`ENCOUNTER`KEY,%q<sheet_who>)]); think u(%!/FUN`STATE`WRITE,%q<sheet_who>,STRESS,if(get(%q<keep_copy>`STRESS),get(%q<keep_copy>`STRESS)),1); think u(%!/FUN`STATE`WRITE,%q<sheet_who>,CONDITION,get(%q<keep_copy>`CONDITION),1); @pemit %#=notice(ENCOUNTER,[name(%q<sheet_who>)]'s sheet keeps the stress and condition from encounter %q<enc_n>: [u(%!/API`STRESSED,%q<sheet_who>,1)] of [get(%!/DATA`CONFIG`STRESS)] stress%, [firstof(get(%q<sheet_who>/CHARGE`CONDITION),no condition)].,ok); @if comp(%q<sheet_who>,%q<viewer_objid>)={@pemit %q<sheet_who>=notice(ENCOUNTER,[name(%#)] writes your stress and condition from encounter %q<enc_n> back to your sheet.)}
        flags: [cmdsyntax]
      # +encounter/end [<n>]: the GM or a keeper ends an encounter and drops every copy.
