format: "1.16"
package: sheet-charge
title: "Charge sheet"
version: 1.1.0
authors: [SharpMUSH]
description: "A Charge character sheet: details, twelve actions rated in dots, momentum, a stress clock with a condition, milestones and talents built up on a ledger, encounters that keep their own copy of each sheet, plus progress clocks. +check rolls an action's dice against a risk for the room and gains momentum; push yourself, add tension, assist a friend, and make determination and fortune rolls. Based on the Charge SRD under CC BY 4.0 and Blades in the Dark under CC BY 3.0."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, charge, forged in the dark, dice, momentum]
category: Characters
requires_server: ">=0.1"

# One permission, for the people who keep sheets: change any character's sheet at any time, read every sheet,
# give milestones, take talents off, and change anyone's clocks. A player rates their own actions until they are
# approved, and keeps their own details, momentum, stress and condition at any time. Changing the lists and
# settings is config.admin, as +config is.
categories:
  roles:
    - name: Charge sheet
      description: Roles for the people who keep Charge character sheets.
  permissions:
    - name: Charge sheet
      description: Keeping Charge character sheets.
permissions:
  - name: softcode.charge.admin
    category: Charge sheet
    description: Read every Charge sheet, change any character's at any time, give milestones, and change anyone's clocks.
roles:
  - slug: charge-sheet-keeper
    name: Charge Sheet Keeper
    category: Charge sheet
    priority: 11
    permissions:
      softcode.charge.admin: allow

# Every character's CHARGE tree is their Charge sheet: only wizards write it, so a player can't make the root
# before the sheet does, and it is never a command.
attributes:
  CHARGE:
    flags: [wizard, no_command]

objects:
  # The command object, in the master room. WIZARD because it adds the commands (@command/add, @hook),
  # writes the sheet attributes on characters, and reads them for other packages.
  #
  # A character's sheet is their own attributes under CHARGE`: CHARGE`ACTION`<KEY> an action's dots (0 to 4),
  # CHARGE`DETAIL`<KEY> a detail, CHARGE`MOMENTUM the momentum they hold (unset is the session's start),
  # CHARGE`STRESS the stress clock's filled segments, CHARGE`CONDITION the condition and CHARGE`ASSIST who has
  # spent momentum to help their next roll. Two ledgers hold the rest: CHARGE`LEDGER`<n> builds the sheet (dots,
  # advances, talents) and CHARGE`XP`<n> holds the milestones given and taken. CHARGE`TOTALS caches what the two
  # add up to, rewritten after every entry. The CHARGE root is wizard-flagged, so only this object writes them.
  #
  # +sheet, +check and +clock are added with /noparse/rsnoparse and hooked to CMD`<word>, so what a player types
  # reaches the code exactly as typed and nothing a player wrote is ever evaluated.
  #
  # Trees: CMD` the hooked commands, INC`COMMAND` the parse and dispatch, INC`SHEET`, INC`CHECK` and INC`CLOCK`
  # one routine per switch, INC`NEED` the guards they share, INC`DO` the writes. FUN`LIST` the actions and
  # details, FUN`POOL` the dice, FUN`PERM` who may do what, FUN`SCREEN` and FUN`DISPLAY` the screens. API` the
  # functions other packages call (VISUAL), the same names in every sheet package. Bridges add HINT`<message>
  # lines, GATE`EDIT (a reason a player may not change their own sheet now) and ALLOW`VIEW`<name> (who else may
  # read a sheet).
  - ref: sheet
    type: thing
    name: Charge Sheet
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      # ---- settings ---------------------------------------------------------------
      # +config charge shows and changes them (sheet-charge-config); the code reads each with get(%!/DATA`CONFIG`<NAME>).
      DATA`CONFIG: |-
        Settings for the Charge sheet. One leaf per setting.
      DATA`CONFIG`LABEL: |-
        Charge sheet
      DATA`CONFIG`DOTS: |-
        7
      DATA`CONFIG`DOTS`TYPE: |-
        integer
      DATA`CONFIG`DOTS`DEFAULT: |-
        7
      DATA`CONFIG`DOTS`MIN: |-
        1
      DATA`CONFIG`DOTS`MAX: |-
        48
      DATA`CONFIG`DOTS`LABEL: |-
        Starting action dots
      DATA`CONFIG`DOTS`DESCRIPTION: |-
        How many action dots a player gives out before their character is approved. With fewer actions, the SRD suggests the number of actions halved, plus one.
      DATA`CONFIG`DOTS`EXAMPLE: |-
        4
      DATA`CONFIG`CAP: |-
        2
      DATA`CONFIG`CAP`TYPE: |-
        integer
      DATA`CONFIG`CAP`DEFAULT: |-
        2
      DATA`CONFIG`CAP`MIN: |-
        1
      DATA`CONFIG`CAP`MAX: |-
        4
      DATA`CONFIG`CAP`LABEL: |-
        Most dots in one action at the start
      DATA`CONFIG`CAP`DESCRIPTION: |-
        The most dots a player puts in one action before approval. Milestones and sheet keepers go up to 4.
      DATA`CONFIG`CAP`EXAMPLE: |-
        3
      DATA`CONFIG`MOMENTUM: |-
        2
      DATA`CONFIG`MOMENTUM`TYPE: |-
        integer
      DATA`CONFIG`MOMENTUM`DEFAULT: |-
        2
      DATA`CONFIG`MOMENTUM`MIN: |-
        0
      DATA`CONFIG`MOMENTUM`MAX: |-
        10
      DATA`CONFIG`MOMENTUM`LABEL: |-
        Momentum at the start of a session
      DATA`CONFIG`MOMENTUM`DESCRIPTION: |-
        The momentum a new character holds, and what +sheet/momentum session sets it back to.
      DATA`CONFIG`MOMENTUM`EXAMPLE: |-
        3
      DATA`CONFIG`GAIN: |-
        1 2 3
      DATA`CONFIG`GAIN`TYPE: |-
        text
      DATA`CONFIG`GAIN`DEFAULT: |-
        1 2 3
      DATA`CONFIG`GAIN`MAX: |-
        20
      DATA`CONFIG`GAIN`CHECK: |-
        CHECK`GAIN
      DATA`CONFIG`GAIN`LABEL: |-
        Momentum gained
      DATA`CONFIG`GAIN`DESCRIPTION: |-
        The momentum dial: what an action roll that spent no momentum gains on a partial success, a full success and a critical, in that order.
      DATA`CONFIG`GAIN`EXAMPLE: |-
        0 1 2
      DATA`CONFIG`STRESS: |-
        4
      DATA`CONFIG`STRESS`TYPE: |-
        integer
      DATA`CONFIG`STRESS`DEFAULT: |-
        4
      DATA`CONFIG`STRESS`MIN: |-
        1
      DATA`CONFIG`STRESS`MAX: |-
        12
      DATA`CONFIG`STRESS`LABEL: |-
        Stress clock segments
      DATA`CONFIG`STRESS`DESCRIPTION: |-
        How many segments a character's stress clock has. When it fills, they are taken out for the scene and it clears.
      DATA`CONFIG`STRESS`EXAMPLE: |-
        6
      DATA`CONFIG`RISKS: |-
        none low moderate high high
      DATA`CONFIG`RISKS`TYPE: |-
        text
      DATA`CONFIG`RISKS`DEFAULT: |-
        none low moderate high high
      DATA`CONFIG`RISKS`MAX: |-
        60
      DATA`CONFIG`RISKS`CHECK: |-
        CHECK`RISKS
      DATA`CONFIG`RISKS`LABEL: |-
        Risk for each difficulty
      DATA`CONFIG`RISKS`DESCRIPTION: |-
        The risk of trivial, easy, standard, hard and extreme, in that order: low, moderate, high, or none for no roll at all.
      DATA`CONFIG`RISKS`EXAMPLE: |-
        none low low moderate high
      DATA`CONFIG`DICE: |-
        0 0 0 0 -1
      DATA`CONFIG`DICE`TYPE: |-
        text
      DATA`CONFIG`DICE`DEFAULT: |-
        0 0 0 0 -1
      DATA`CONFIG`DICE`MAX: |-
        30
      DATA`CONFIG`DICE`CHECK: |-
        CHECK`DICE
      DATA`CONFIG`DICE`LABEL: |-
        Dice for each difficulty
      DATA`CONFIG`DICE`DESCRIPTION: |-
        Dice added to or taken from the pool at trivial, easy, standard, hard and extreme, in that order.
      DATA`CONFIG`DICE`EXAMPLE: |-
        1 0 0 -1 -1
      DATA`CONFIG`PUBLIC: |-
        0
      DATA`CONFIG`PUBLIC`TYPE: |-
        boolean
      DATA`CONFIG`PUBLIC`DEFAULT: |-
        0
      DATA`CONFIG`PUBLIC`LABEL: |-
        Sheets anyone can read
      DATA`CONFIG`PUBLIC`DESCRIPTION: |-
        Whether +sheet <name> shows anyone's sheet to everyone. Otherwise only the character and sheet keepers see it.
      DATA`CONFIG`PUBLIC`EXAMPLE: |-
        yes
      DATA`CONFIG`ACTIONS`TYPE: |-
        table
      DATA`CONFIG`ACTIONS`LABEL: |-
        Actions
      DATA`CONFIG`ACTIONS`DESCRIPTION: |-
        The actions a sheet rates in dots, and what each one is for.
      DATA`CONFIG`ACTIONS`STORE: |-
        {{store}}
      DATA`CONFIG`ACTIONS`PATH: |-
        ACTION
      DATA`CONFIG`ACTIONS`ENTRY: |-
        label
      DATA`CONFIG`ACTIONS`FIELDS: |-
        label summary order
      DATA`CONFIG`ACTIONS`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`ACTIONS`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`ACTIONS`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`ACTIONS`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`ACTIONS`FIELD`LABEL`LABEL: |-
        Label
      DATA`CONFIG`ACTIONS`FIELD`LABEL`DESCRIPTION: |-
        The name the sheet shows.
      DATA`CONFIG`ACTIONS`FIELD`SUMMARY`TYPE: |-
        text
      DATA`CONFIG`ACTIONS`FIELD`SUMMARY`MAX: |-
        120
      DATA`CONFIG`ACTIONS`FIELD`SUMMARY`LABEL: |-
        What it is for
      DATA`CONFIG`ACTIONS`FIELD`SUMMARY`DESCRIPTION: |-
        One line that +sheet/traits shows beside the action.
      DATA`CONFIG`ACTIONS`FIELD`ORDER`TYPE: |-
        integer
      DATA`CONFIG`ACTIONS`FIELD`ORDER`DEFAULT: |-
        50
      DATA`CONFIG`ACTIONS`FIELD`ORDER`MIN: |-
        0
      DATA`CONFIG`ACTIONS`FIELD`ORDER`MAX: |-
        999
      DATA`CONFIG`ACTIONS`FIELD`ORDER`LABEL: |-
        Order
      DATA`CONFIG`ACTIONS`FIELD`ORDER`DESCRIPTION: |-
        Where it comes on the sheet: lower first, then by name.
      DATA`CONFIG`DETAILS`TYPE: |-
        table
      DATA`CONFIG`DETAILS`LABEL: |-
        Details
      DATA`CONFIG`DETAILS`DESCRIPTION: |-
        The details a character writes about themselves, such as their concept and ties.
      DATA`CONFIG`DETAILS`STORE: |-
        {{store}}
      DATA`CONFIG`DETAILS`PATH: |-
        DETAIL
      DATA`CONFIG`DETAILS`ENTRY: |-
        label
      DATA`CONFIG`DETAILS`FIELDS: |-
        label order
      DATA`CONFIG`DETAILS`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`DETAILS`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`DETAILS`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`DETAILS`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`DETAILS`FIELD`LABEL`LABEL: |-
        Label
      DATA`CONFIG`DETAILS`FIELD`LABEL`DESCRIPTION: |-
        The name the sheet shows.
      DATA`CONFIG`DETAILS`FIELD`ORDER`TYPE: |-
        integer
      DATA`CONFIG`DETAILS`FIELD`ORDER`DEFAULT: |-
        50
      DATA`CONFIG`DETAILS`FIELD`ORDER`MIN: |-
        0
      DATA`CONFIG`DETAILS`FIELD`ORDER`MAX: |-
        999
      DATA`CONFIG`DETAILS`FIELD`ORDER`LABEL: |-
        Order
      DATA`CONFIG`DETAILS`FIELD`ORDER`DESCRIPTION: |-
        Where it comes on the sheet: lower first, then by name.
      CHECK`RISKS: |-
        if(cand(eq(words(%0),5),not(words(setdiff(lcstr(%0),none low moderate high)))),,Give five risks%, trivial to extreme%, each low%, moderate%, high or none.)
      CHECK`DICE: |-
        if(cand(eq(words(%0),5),every(%!/FUN`IS`DICE,%0)),,Give five numbers from -3 to 3%, trivial to extreme.)
      CHECK`GAIN: |-
        if(cand(eq(words(%0),3),every(%!/FUN`IS`GAIN,%0)),,Give three numbers from 0 to 5: the momentum a partial success%, a full success and a critical gain.)
      FUN`IS`DICE: |-
        cand(isint(%0),gte(%0,-3),lte(%0,3))
      FUN`IS`GAIN: |-
        cand(isint(%0),gte(%0,0),lte(%0,5))

      # Which INC` routine each switch runs: DATA`ROUTE`<table>`<switch>. BARE is the command alone, ARG the
      # command with something after it and no switch.
      DATA`ROUTE: |-
        Which routine each switch runs. One leaf per switch.
      DATA`ROUTE`SHEET`BARE: |-
        SHEET`SHOW
      DATA`ROUTE`SHEET`ARG: |-
        SHEET`SHOW
      DATA`ROUTE`SHEET`SET: |-
        SHEET`SET
      DATA`ROUTE`SHEET`DETAIL: |-
        SHEET`DETAIL
      DATA`ROUTE`SHEET`MOMENTUM: |-
        SHEET`MOMENTUM
      DATA`ROUTE`SHEET`STRESS: |-
        SHEET`STRESS
      DATA`ROUTE`SHEET`CONDITION: |-
        SHEET`CONDITION
      DATA`ROUTE`SHEET`MILESTONE: |-
        SHEET`MILESTONE
      DATA`ROUTE`SHEET`ADVANCE: |-
        SHEET`ADVANCE
      DATA`ROUTE`SHEET`TALENT: |-
        SHEET`TALENT
      DATA`ROUTE`SHEET`TRAITS: |-
        SHEET`TRAITS
      DATA`ROUTE`SHEET`LEDGER: |-
        SHEET`LEDGER
      DATA`ROUTE`SHEET`MILESTONES: |-
        SHEET`MILESTONES
      DATA`ROUTE`SHEET`REVOKE: |-
        SHEET`REVOKE
      DATA`ROUTE`SHEET`CLEAR: |-
        SHEET`CLEAR
      DATA`ROUTE`CHECK`BARE: |-
        CHECK`USAGE
      DATA`ROUTE`CHECK`ARG: |-
        CHECK`ROLL
      DATA`ROUTE`CHECK`PRIVATE: |-
        CHECK`ROLL
      DATA`ROUTE`CHECK`PUSH: |-
        CHECK`ROLL
      DATA`ROUTE`CHECK`TENSION: |-
        CHECK`ROLL
      DATA`ROUTE`CHECK`ASSIST: |-
        CHECK`ASSIST
      DATA`ROUTE`CHECK`DETERMINATION: |-
        CHECK`DETERMINATION
      DATA`ROUTE`CHECK`RESIST: |-
        CHECK`DETERMINATION
      DATA`ROUTE`CHECK`FORTUNE: |-
        CHECK`FORTUNE
      DATA`ROUTE`CLOCK`BARE: |-
        CLOCK`LIST
      DATA`ROUTE`CLOCK`ARG: |-
        CLOCK`SHOW
      DATA`ROUTE`CLOCK`NEW: |-
        CLOCK`NEW
      DATA`ROUTE`CLOCK`TICK: |-
        CLOCK`TICK
      DATA`ROUTE`CLOCK`REMOVE: |-
        CLOCK`REMOVE
      DATA`ROUTE`ENCOUNTER`BARE: |-
        ENCOUNTER`SHOW
      DATA`ROUTE`ENCOUNTER`ARG: |-
        ENCOUNTER`SHOW
      DATA`ROUTE`ENCOUNTER`START: |-
        ENCOUNTER`START
      DATA`ROUTE`ENCOUNTER`JOIN: |-
        ENCOUNTER`JOIN
      DATA`ROUTE`ENCOUNTER`ADD: |-
        ENCOUNTER`ADD
      DATA`ROUTE`ENCOUNTER`USE: |-
        ENCOUNTER`USE
      DATA`ROUTE`ENCOUNTER`LEAVE: |-
        ENCOUNTER`LEAVE
      DATA`ROUTE`ENCOUNTER`REMOVE: |-
        ENCOUNTER`REMOVE
      DATA`ROUTE`ENCOUNTER`KEEP: |-
        ENCOUNTER`KEEP
      DATA`ROUTE`ENCOUNTER`END: |-
        ENCOUNTER`END
      DATA`DIFFICULTIES: |-
        trivial easy standard hard extreme
      DATA`RISKS: |-
        low moderate high
      DATA`EFFECTS: |-
        limited standard great
      DATA`CLOCK`SIZES: |-
        4 6 8

      # ---- commands ---------------------------------------------------------------
      # %1 the switches and %2 what follows, exactly as typed.
      CMD`SHEET:
        value: |-
          $(?is)^\+sheet(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,sheet,table,SHEET,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`CHECK:
        value: |-
          $(?is)^\+check(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,check,table,CHECK,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`CLOCK:
        value: |-
          $(?is)^\+clock(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,clock,table,CLOCK,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`ENCOUNTER:
        value: |-
          $(?is)^\+encounter(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,encounter,table,ENCOUNTER,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      # A line a bridge adds to one of this object's messages: HINT`<message>, set here by a bridge such as
      # sheet-charge-help. %1 on are passed to it. Nothing when no bridge set one, so the message stands without it.
      FUN`HINT:
        value: |-
          if(hasattr(%!,HINT`%0),%b[u(%!/HINT`%0,%1,%2)])
        flags: [funsyntax]
      INC`COMMAND`RUN:
        value: |-
          @assert hastype(%#,player)=@pemit %#=notice(SHEET,Only players have a sheet.,warn); think u(%!/FUN`COMMAND`PARSE,%<word>,%<table>,%<switches>,%<argument>); @assert lte(words(%q<cmd_main_switches>),1)=@pemit %#=notice(SHEET,Use one switch at a time%, besides /private.,warn); @assert strlen(%q<cmd_route>)=@pemit %#=notice(SHEET,+%q<cmd_word> has no /%q<cmd_switch> switch.[u(%!/FUN`HINT,SWITCHES,%q<cmd_word>)],warn); @include %!/INC`%q<cmd_route>
        flags: [cmdsyntax]
      # %0 the word, %1 its route table, %2 the switches and %3 the argument, as typed. Sets cmd_word,
      # cmd_switch_list, cmd_private (1 with /private), cmd_main_switches (the others), cmd_switch, cmd_argument,
      # cmd_has_equals, cmd_left_side and cmd_right_side around the first =, cmd_route (the INC` routine to run),
      # viewer_objid and viewer_keeper.
      FUN`COMMAND`PARSE:
        value: |-
          setqm(cmd_word,lcstr(%0),
          cmd_switch_list,lcstr(trim(edit(%2,/,%b))),
          cmd_private,t(member(%q<cmd_switch_list>,private)),
          cmd_main_switches,squish(remove(%q<cmd_switch_list>,private)),
          cmd_switch,firstof(first(%q<cmd_main_switches>),if(%q<cmd_private>,private)),
          cmd_argument,trim(%3),
          cmd_has_equals,strmatch(%3,*=*),
          cmd_left_side,trim(before(%3,=)),
          cmd_right_side,trim(after(%3,=)),
          cmd_route,get(%!/DATA`ROUTE`%1`[if(strlen(%q<cmd_switch>),ucstr(%q<cmd_switch>),if(strlen(%q<cmd_argument>),ARG,BARE))]),
          viewer_objid,objid(%#),
          viewer_keeper,u(%!/FUN`PERM`KEEPER,%#))
        flags: [funsyntax]

      # ---- guards -----------------------------------------------------------------
      # %<name> a player's name: sheet_who, their objid.
      INC`NEED`TARGET:
        value: |-
          @assert strlen(setr(sheet_who,u(%!/FUN`PLAYER`MATCH,%<name>)))=@pemit %#=notice(SHEET,There is no player called '%<name>'.,warn)
        flags: [cmdsyntax]
      # The left of =: <name>/<what> for a sheet keeper, else <what> on your own sheet. sheet_who and sheet_what.
      INC`NEED`WHO:
        value: |-
          @if strmatch(%<text>,*/*)={@include/args %!/INC`NEED`TARGET=name,before(%<text>,/); think setq(sheet_what,trim(after(%<text>,/)))},{think setqm(sheet_who,%q<viewer_objid>,sheet_what,%<text>)}; @assert strlen(%q<sheet_who>); @assert cor(%q<viewer_keeper>,not(comp(%q<sheet_who>,%q<viewer_objid>)))=@pemit %#=notice(SHEET,Only sheet keepers change another character's sheet.,error)
        flags: [cmdsyntax]
      # Changes only a keeper makes once a character is approved: action dots.
      INC`NEED`EDITABLE:
        value: |-
          @assert cor(%q<viewer_keeper>,not(isapproved(%#)))=@pemit %#=notice(SHEET,Your character is approved%, so your actions grow with milestones now: +sheet/advance <action>.,error); @assert cor(%q<viewer_keeper>,not(strlen(setr(set_gate,u(%!/FUN`GATE`EDIT,%#)))))=@pemit %#=notice(SHEET,%q<set_gate>,warn)
        flags: [cmdsyntax]
      # %<key> typed text: trait_key, the action it names.
      INC`NEED`ACTION:
        value: |-
          @assert strlen(setr(trait_key,u(%!/FUN`LIST`FIND,ACTION,%<key>)))=@pemit %#=notice(SHEET,There is no action '%<key>'. +sheet/traits lists them.,warn)
        flags: [cmdsyntax]
      INC`NEED`KEEPER:
        value: |-
          @assert %q<viewer_keeper>=@pemit %#=notice(SHEET,Only sheet keepers do that.,error)
        flags: [cmdsyntax]
      # For a count a player changes on their own sheet or a keeper on anyone's: [<name>=]<change>. sheet_who and
      # count_typed.
      INC`NEED`COUNTWHO:
        value: |-
          @if %q<cmd_has_equals>={@include/args %!/INC`NEED`WHO=text,%q<cmd_left_side>/; think setq(count_typed,%q<cmd_right_side>)},{think setqm(sheet_who,%q<viewer_objid>,count_typed,%q<cmd_argument>)}; @assert cand(strlen(%q<sheet_who>),cor(%q<viewer_keeper>,not(comp(%q<sheet_who>,%q<viewer_objid>))))
        flags: [cmdsyntax]

      # ---- +sheet -----------------------------------------------------------------
      INC`SHEET`SHOW:
        value: |-
          @if strlen(%q<cmd_argument>)={@include/args %!/INC`NEED`TARGET=name,%q<cmd_argument>},{think setq(sheet_who,%q<viewer_objid>)}; @assert strlen(%q<sheet_who>); @assert u(%!/FUN`PERM`VIEW,%#,%q<sheet_who>)=@pemit %#=notice(SHEET,Only [name(%q<sheet_who>)] and staff can read [poss(%q<sheet_who>)] sheet.,error); @pemit %#=u(%!/FUN`SCREEN`SHEET,%q<sheet_who>,%#)
        flags: [cmdsyntax]
      # +sheet/set [<name>/]<action>=<dots>: a player gives out the starting dots, at most cap in one action; a
      # keeper sets any action to 0 to 4. Empty clears it back to 0.
      INC`SHEET`SET:
        value: |-
          @assert %q<cmd_has_equals>=@pemit %#=notice(SHEET,+sheet/set <action>=<dots>%, such as +sheet/set [lcstr(first(u(%!/FUN`LIST`ALL,ACTION)))]=2.,warn); @include/args %!/INC`NEED`WHO=text,%q<cmd_left_side>; @include %!/INC`NEED`EDITABLE; @include/args %!/INC`NEED`ACTION=key,%q<sheet_what>; think u(%!/FUN`BUILD`PREPARE,%q<sheet_who>,1); think setqm(set_value,firstof(%q<cmd_right_side>,0),set_most,if(%q<viewer_keeper>,4,get(%!/DATA`CONFIG`CAP)),set_now,u(%!/FUN`BUILD`RATING,%q<trait_key>),set_advanced,u(%!/FUN`BUILD`ADVANCES,%q<trait_key>),set_total,add(sub(u(%!/FUN`BUILD`GIVEN),u(%!/FUN`BUILD`RATING,%q<trait_key>)),firstof(%q<cmd_right_side>,0))); @assert cand(isint(%q<set_value>),gte(%q<set_value>,0),lte(%q<set_value>,%q<set_most>))=@pemit %#=notice(SHEET,An action has a whole number of dots from 0 to %q<set_most>.,warn); @assert gte(%q<set_value>,%q<set_advanced>)=@pemit %#=notice(SHEET,[name(%q<sheet_who>)] spent %q<set_advanced> [if(eq(%q<set_advanced>,1),milestone,milestones)] on [u(%!/FUN`LIST`LABEL,ACTION,%q<trait_key>)]. Revoke those advances first: +sheet/ledger [name(%q<sheet_who>)] lists them.,warn); @assert cor(%q<viewer_keeper>,lte(%q<set_total>,get(%!/DATA`CONFIG`DOTS)))=@pemit %#=notice(SHEET,That makes %q<set_total> dots%, and you have [get(%!/DATA`CONFIG`DOTS)] to give. Take some from another action first.,warn); @assert neq(%q<set_value>,%q<set_now>)=@pemit %#=notice(SHEET,[u(%!/FUN`LIST`LABEL,ACTION,%q<trait_key>)] has %q<set_value> [if(eq(%q<set_value>,1),dot,dots)] already.,warn); think u(%!/API`RECORD,%q<sheet_who>,json(object,kind,"dots",action,json(string,%q<trait_key>),dots,sub(%q<set_value>,%q<set_advanced>))); @pemit %#=notice(SHEET,[u(%!/FUN`LIST`LABEL,ACTION,%q<trait_key>)] has %q<set_value> [if(eq(%q<set_value>,1),dot,dots)] on [name(%q<sheet_who>)]'s sheet.[if(not(%q<viewer_keeper>),%b%q<set_total> of [get(%!/DATA`CONFIG`DOTS)] dots given.)][if(not(comp(%q<sheet_who>,%q<viewer_objid>)),u(%!/FUN`HINT,SET))],ok)
        flags: [cmdsyntax]
      # +sheet/detail [<name>/]<detail>=<text>: details change at any time, as a character grows. Empty clears it.
      INC`SHEET`DETAIL:
        value: |-
