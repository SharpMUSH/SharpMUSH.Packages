format: "1.16"
package: pf2e-config
title: "Pathfinder 2e: +config settings"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the Pathfinder 2e settings (source books, variant rules, the feed's repository and branch) into +config: registers them with the +config registry, so staff see and change them with +config pf2e."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [pathfinder, pf2e, config, bridge]
category: Characters
requires_server: ">=0.1"

# A bridge: pf2e declares its settings as DATA`CONFIG`<NAME> on its rules core, with their types and
# limits, and reads them with get() whether or not +config is installed. This package is the one leaf
# that tells the +config registry where they are.
depends:
  - package: pf2e
    version: ">=0.9.12 <1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH.Packages
      path: pf2e/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`PF2E: |-
        {{pf2e/core}}
