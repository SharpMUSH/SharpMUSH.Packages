format: "1.16"
package: sheet-fabula-config
title: "JRPG sheet: +config settings"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the JRPG sheet settings and its class table into +config: registers them with the +config registry, so staff see and change them with +config fabula."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, fabula, config, bridge]
category: Characters
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. sheet-fabula declares its settings as
# DATA`CONFIG`<NAME>, with their types and limits, and reads them with get() whether or not +config is
# installed. This package is the one leaf that tells the +config registry where they are.
depends:
  - package: sheet-fabula
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH.Packages
      path: sheet-fabula/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`FABULA: |-
        {{sheet-fabula/sheet}}
