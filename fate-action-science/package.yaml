  # Live brainstorms, one per room: BS`<room key>. Inside the command object; no_command.
  - ref: brainstorms
    type: thing
    name: Fate Brainstorms
    location: "{{science}}"
    flags: [no_command]
    attributes:
      BS: |-
        The brainstorms going on now, one branch per room. +brainstorm/stop ends one.

  # The +help topics, on an object of their own. fate-action-science-help registers it with +help; without that
  # bridge nothing reads it. HELP`<TOPIC> is a topic, its subtopics the leaves beneath, LOCK`<TOPIC> who may read it.
  - ref: science_help
    type: thing
    name: Fate Action Science Help
    location: "{{science}}"
    attributes:
      HELP: |-
        Modes, mega-stunts, machines, inventions and brainstorms on the Fate sheet: +mode, +machine, +invent and +brainstorm.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`MODE: |-
        sheet machine invent brainstorm
      SEE`MACHINE: |-
        mode check
      SEE`INVENT: |-
        mode brainstorm
      SEE`BRAINSTORM: |-
        invent
      HELP`MODE: |-
        On this game your skills come from three modes, rated Good \(+3\), Fair \(+2\) and Average \(+1\). Each mode holds a set of skills; a skill takes the rating of your best mode that holds it.

        - `+mode` shows your modes, skill points and stress boxes; `+mode <name>` someone else's, when you may read their sheet.
        - `+mode/list` lists the modes and their skills. Weird modes, such as Robot or Pilot, allow mega-stunts.
        - `+mode/set <mode>=<rating>` chooses a mode: `+mode/set science=good`. Leave the rating out to drop it.
        - `+mode/focus <skill>` spends skill points on a skill in one of your modes: 1 point focuses it \(+1\), 2 more specialize it \(+2\). `+mode/unfocus <skill>` takes a step back.
        - `+mode/stress <mode>=physical`, `mental` or `split` says where a mode's extra stress boxes go, when its skills give both kinds.

        A skill in two of your modes is focused for free, and in all three specialized. Fair and Good modes with Athletics or Physique add physical stress boxes, with Provoke or Will mental ones.

        You choose modes until your character is approved; then staff change them. `+sheet/set` does not rate skills here.

        For example:

        `+mode/set science=fair`

        Output: `\[SCIENCE\] Done: Bob's Science mode is Fair (+2): Will, Chemistry, Engineering, Exobiology, Mechanics, Physics, Robotics, and Other sciences.`

        See `+help mode mega` for mega-stunts.
      HELP`MODE`MEGA: |-
        A character with a weird mode may make any stunt a mega-stunt, with more than one benefit.

        - `+sheet/stunt <slot>=<text>` writes the stunt first.
        - `+mode/mega <slot>=<benefits>` gives it that many benefits, 1 to 10: `+mode/mega 2=3`. Leave the number out to make it a plain stunt again.
        - `+mode/weakness <slot>=<number>` counts the weaknesses and costs you chose for it; each takes one benefit off the bill.
        - `+mode/reserve` adds up what everyone in the room puts into the GM's fate point reserve.

        Your stunt slots cover one benefit each. Every benefit beyond them, less your chosen weaknesses, adds a fate point to the GM's reserve while you are in the scene.

        For example:

        `+mode/mega 1=2`

        Output: `\[SCIENCE\] Done: Stunt 1 on Bob's sheet is a mega-stunt with 2 benefits. Their stunts add nothing to the GM's fate point reserve.`
      LOCK`MODE`STAFF: |-
        perm^softcode.fate.admin
      HELP`MODE`STAFF: |-
        Sheet keepers \(`softcode.fate.admin`, or the Fate Sheet Keeper role\) change anyone's modes at any time:

        - `/set`, `/focus`, `/unfocus`, `/stress`, `/mega` and `/weakness` take `<name>/` first: `+mode/set Alice/robot=good`.
        - `+mode/points <name>=<points>` gives one character a skill point total of their own, `=default` the game's again.
        - `+machine/set <name>/<field>=<value>`, `+machine/scrap <name>` and the `/catch`, `/flaw` and `/drop` switches of `+invent` work on anyone's.
        - `+brainstorm/next` and `+brainstorm/stop` work on anyone's brainstorm.

        The modes write each skill's rating and the stress boxes onto the Fate sheet, so `+check`, `+sheet` and Duties read the same numbers.
      LOCK`MODE`SETTINGS: |-
        perm^config.admin
      HELP`MODE`SETTINGS: |-
        `+config fate-science` lists the settings and `+config fate-science/<setting>=<value>` changes one \(`config.admin`\):

        - `ratings`: the modes' ratings, one per mode \(`3 2 1`\). `points`: skill points each \(3\).
        - `stress`: physical and mental boxes before the modes add theirs \(2\). `physical`, `mental`: the skills that add them.
        - `scale_effect`: what each step of scale does: `roll` \(+1 to the larger\), `harm` \(2 shifts\) or `both`.
        - `machine_scale`: the scale a new machine starts at \(giant\). `machine_boxes`: a machine's stress boxes \(3\).
        - `brainstorm_difficulty`: the first fact's difficulty \(3\). `brainstorm_point`: whether joining a brainstorm pays a fate point \(yes\).
        - `modes`: the modes, each with its skills and whether it is weird. `+config/add fate-science/modes/spy=Spy` adds one.
        - `scales`: the scales and their steps.

        A new science is a skill: `+config/add fate/skills/<key>=<label>`, then add its key to the Science mode's skills.
      HELP`MODE`CREDITS: |-
        Modes, mega-stunts, invention and brainstorms are based on the Atomic Robo RPG SRD. This work is based on the Atomic Robo RPG SRD \(found at http://www.faterpg.com/\), a product of Evil Hat Productions, LLC, developed, authored, and edited by Mike Olson, Jeremy Keller, Adam Jury, Brian Clevinger, Brian Engard, Morgan Ellis, and Fred Hicks, and licensed for our use under the Creative Commons Attribution 3.0 Unported license \(http://creativecommons.org/licenses/by/3.0/\).

        Scale is based on the Fate System Toolkit. This work is based on the Fate System Toolkit \(found at http://www.faterpg.com/\), a product of Evil Hat Productions, LLC, developed, authored, and edited by Robert Donoghue, Brian Engard, Brennan Taylor, Mike Olson, Mark Diaz Truman, Fred Hicks, and Matthew Gandy, and licensed for our use under the Creative Commons Attribution 3.0 Unported license \(http://creativecommons.org/licenses/by/3.0/\).

        Fate is a trademark of Evil Hat Productions, LLC. This game is not affiliated with or endorsed by Evil Hat Productions.
      HELP`MACHINE: |-
        `+machine` shows your machine: a giant robot, a tank, a starship. Machines are built at a scale, and scale counts when they meet something bigger or smaller.

        - `+machine/set name=<name>` builds one; `/set scale=`, `concept=`, `flaw=`, `weapon=` and `armor=` fill it in: `+machine/set scale=titan`.
        - `+machine/check <skill>=<opposition> vs <scale>` pilots it against something of that scale: `+machine/check combat=good vs person`. Leave out `vs` for a foe of its own size.
        - `+machine/stress <box>` marks one of its stress boxes; `+machine/stress clear` empties them.
        - `+machine/scrap` takes it off your sheet.

        Each step of scale between the machine and its foe gives the larger one +1 on the roll, or 2 shifts of harm, or both, as the game sets. A hit adds the machine's Weapon rating; its Armor takes shifts off a hit it takes.

        For example:

        `+machine/check vehicles=fair vs person`

        Output: `\[SCIENCE\] Bob pilots Little Tin: Vehicles: 4dF\[-1, 1, 1, 1\] + 5 = 7 (Epic) against Fair (+2): success with style, 5 shifts (roll 25) Giant against person: +2 to the roll. As an attack it hits for 5 shifts.`
      HELP`INVENT: |-
        `+invent <skill>=<benefits> <what it does>` builds a gadget: a science roll against twice its benefits, where the room sees it. What it does becomes its function aspect.

        - `+invent` lists your inventions; `+invent/list <name>` someone else's.
        - `+invent/catch <invention>=<catch>` writes a catch down: an invention has one per benefit.
        - `+invent/flaw <invention>=<flaw>` names its flaw, an aspect the GM may compel.
        - `+invent/drop <invention>` lets one go.

        The roll decides who chooses the catches: the GM on a fail; the GM first and then you in turn on a tie; one by the GM and the rest by you on a success; all of them by you with style. Every invention adds its benefits to the GM's fate point reserve, one fewer for each Bug among its catches, and the GM names its flaw.

        For example:

        `+invent mechanics=1 Spring Heels`

        Output: `\[SCIENCE\] Bob invents Spring Heels: Mechanics: 4dF\[0, -1, 0, 1\] + 2 = 2 (Fair) against Fair (+2): a tie, no shifts (roll 26). The GM chooses its catch. It adds 1 to the GM's fate point reserve, and the GM names its flaw.`
      HELP`BRAINSTORM: |-
        A brainstorm is the group working out what is going on, three facts and then a hypothesis.

        - `+brainstorm/start <question>` begins one in the room: `+brainstorm/start Why are the ants giant?`
        - `+brainstorm/join <aspect>` takes part, compelling one of your aspects for a fate point.
        - `+brainstorm <skill>` rolls once a round. The first fact is against Good \(+3\), each after it against the last winning total.
        - `+brainstorm/next` closes the round \(whoever started it\). `+brainstorm/fact <fact>` is how the winner states what they found.
        - `+brainstorm` shows where it stands; `+brainstorm/stop` ends it.

        A win is 1 victory, 2 with three shifts or more; a tie between winners is 1 between them, and a lone tie 1 at a cost. With 3 victories or more after the third fact, everyone rolls once more and the highest names the hypothesis with `+brainstorm/hypothesis <aspect>`: it is true, with a free invocation at 4 victories and two at 6. Fewer than 3 and it stays a mystery.

        For example:

        `+brainstorm/start Why are the ants giant?`

        Output: `\[SCIENCE\] Alice starts a brainstorm: Why are the ants giant? Everyone taking part compels one of their aspects to join: +brainstorm/join <aspect>.`

  # The skills the modes rate that the Fate sheet's list lacks: Combat and Vehicles, and the sciences. Staff add a
  # science with +config/add fate/skills/<key>=<label> and add its key to the Science mode's skills.
  - ref: skills
    target: "{{sheet-fate/store}}"
    attributes:
      SKILL`COMBAT: |-
        Combat
      SKILL`VEHICLES: |-
        Vehicles
      SKILL`CHEMISTRY: |-
        Chemistry
      SKILL`CHEMISTRY`ORDER: |-
        60
      SKILL`ENGINEERING: |-
        Engineering
      SKILL`ENGINEERING`ORDER: |-
        60
      SKILL`EXOBIOLOGY: |-
        Exobiology
      SKILL`EXOBIOLOGY`ORDER: |-
        60
      SKILL`MECHANICS: |-
        Mechanics
      SKILL`MECHANICS`ORDER: |-
        60
      SKILL`PHYSICS: |-
        Physics
      SKILL`PHYSICS`ORDER: |-
        60
      SKILL`ROBOTICS: |-
        Robotics
      SKILL`ROBOTICS`ORDER: |-
        60
      SKILL`SCIENCE: |-
        Other sciences
      SKILL`SCIENCE`ORDER: |-
        61

  # The Fate sheet's hooks: ratings come from the modes, and +sheet shows the modes, mega-stunts, machine and
  # inventions. Each runs as the Fate Sheet, which is WIZARD and so may call this object.
  - ref: sheet_hooks
    target: "{{sheet-fate/sheet}}"
    attributes:
      GATE`SET: |-
        Your skills come from your modes on this game: +mode/set and +mode/focus change them.
      SECTION`MODES:
        value: |-
          u({{science}}/FUN`SECTION`MODES,%0,%1)
        flags: [funsyntax]
      SECTION`MODES`TITLE: |-
        Modes
      SECTION`MODES`ORDER: |-
        10
      SECTION`MEGA:
        value: |-
          u({{science}}/FUN`SECTION`MEGA,%0,%1)
        flags: [funsyntax]
      SECTION`MEGA`TITLE: |-
        Mega-stunts
      SECTION`MEGA`ORDER: |-
        20
      SECTION`MACHINE:
        value: |-
          u({{science}}/FUN`SECTION`MACHINE,%0,%1)
        flags: [funsyntax]
      SECTION`MACHINE`TITLE: |-
        Machine
      SECTION`MACHINE`ORDER: |-
        30
      SECTION`INVENTIONS:
        value: |-
          u({{science}}/FUN`SECTION`INVENTIONS,%0,%1)
        flags: [funsyntax]
      SECTION`INVENTIONS`TITLE: |-
        Inventions
      SECTION`INVENTIONS`ORDER: |-
        40
