      INC`DO`SET:
        value: |-
          @if not(hasattr(%<who>,FATE))={&FATE %<who>=This character's Fate sheet. +sheet shows it.; @set %<who>/FATE=wizard; @set %<who>/FATE=no_command}; @if strlen(%<value>)={&FATE`%<leaf> %<who>=%<value>},{&FATE`%<leaf> %<who>}
        flags: [cmdsyntax]
      # %<who>, %<leaf>: clears FATE`<leaf> and everything beneath it.
      INC`DO`WIPE:
        value: |-
          @dolist/inline revwords(lattr(%<who>/FATE`%<leaf>`**))={&## %<who>}; &FATE`%<leaf> %<who>
        flags: [cmdsyntax]
      # %<who>: writes every skill's rating and the stress tracks' lengths from their modes.
      INC`DO`RATE:
        value: |-
          @dolist/inline ucstr(u({{sheet-fate/sheet}}/API`ALWAYS))={@include/args %!/INC`DO`SET=who,%<who>,leaf,RATING`##,value,if(setr(rate_value,u(%!/FUN`SKILL`RATING,%<who>,##)),%q<rate_value>)}; @include/args %!/INC`DO`SET=who,%<who>,leaf,BOXES`PHYSICAL,value,u(%!/FUN`STRESS`BOXES,%<who>,PHYSICAL); @include/args %!/INC`DO`SET=who,%<who>,leaf,BOXES`MENTAL,value,u(%!/FUN`STRESS`BOXES,%<who>,MENTAL)
        flags: [cmdsyntax]

      # ---- modes and skills ---------------------------------------------------------
      FUN`MODE`LABEL:
        value: |-
          firstof(get({{store}}/MODE`%0),lcstr(%0))
        flags: [funsyntax]
      # %0 a character: the modes they hold, highest rated first, then in the list's order.
      FUN`MODE`HELD:
        value: |-
          setq(held_who,%0)[sortkey(%!/FUN`MODE`RANKKEY,squish(iter(u(%!/FUN`LIST`ALL,MODE),if(hasattr(%0,FATE`MODE`%i0),%i0))))]
        flags: [funsyntax]
      FUN`MODE`RANKKEY:
        value: |-
          sub(9,get(%q<held_who>/FATE`MODE`%0))[rjust(default({{store}}/MODE`%0`ORDER,50),3,0)]%0
        flags: [funsyntax]
      # %0 a character, %1 a skill key in upper case: the modes they hold that rate it, highest first.
      FUN`MODE`HOLDERS:
        value: |-
          squish(iter(u(%!/FUN`MODE`HELD,%0),if(member(ucstr(get({{store}}/MODE`%i0`SKILLS)),%1),%i0)))
        flags: [funsyntax]
      # %0 a mode: physical and mental, the tracks its skills add boxes to.
      FUN`MODE`SCOPES:
        value: |-
          setq(scopes_skills,lcstr(get({{store}}/MODE`%0`SKILLS)))[squish(if(words(setinter(%q<scopes_skills>,lcstr(get(%!/DATA`CONFIG`PHYSICAL)))),physical) [if(words(setinter(%q<scopes_skills>,lcstr(get(%!/DATA`CONFIG`MENTAL)))),mental)])]
        flags: [funsyntax]
      # %0 a character: 1 when they hold a weird mode.
      FUN`MODE`WEIRD:
        value: |-
          words(filterbool(%!/FUN`MODE`ISWEIRD,u(%!/FUN`MODE`HELD,%0)))
        flags: [funsyntax]
      # %0 a mode, %1 a character, %2 a rating: 1 when their mode has that rating.
      FUN`MODE`RATEDAT:
        value: |-
          eq(get(%1/FATE`MODE`%0),%2)
        flags: [funsyntax]
      FUN`MODE`ISWEIRD:
        value: |-
          get({{store}}/MODE`%0`WEIRD)
        flags: [funsyntax]
      # %0 a character, %1 a skill: the rating their modes give it. Its highest mode's rating, one step more for
      # each other mode that has it and each step bought, two steps at most. Mediocre (0) in none.
      FUN`SKILL`RATING:
        value: |-
          setq(rating_holders,u(%!/FUN`MODE`HOLDERS,%0,%1))[if(words(%q<rating_holders>),add(get(%0/FATE`MODE`[first(%q<rating_holders>)]),u(%!/FUN`SKILL`STEPS,%0,%1,words(%q<rating_holders>))),0)]
        flags: [funsyntax]
      # %0 a character, %1 a skill, %2 how many of their modes have it: 0 trained, 1 focused, 2 specialized.
      FUN`SKILL`STEPS:
        value: |-
          min(2,add(dec(%2),default(%0/FATE`FOCUS`%1,0)))
        flags: [funsyntax]
      FUN`SKILL`WORD:
        value: |-
          switch(%0,0,trained,1,focused,specialized)
        flags: [funsyntax]
      # %0 a character, %1 a skill: what its bought steps cost. 1 for trained to focused, 2 for focused to
      # specialized; a step a second mode gives is free.
      FUN`FOCUS`COST:
        value: |-
          setqm(cost_count,words(u(%!/FUN`MODE`HOLDERS,%0,%1)),cost_from,dec(%q<cost_count>),cost_to,min(2,add(%q<cost_from>,default(%0/FATE`FOCUS`%1,0))))[if(%q<cost_count>,sub(mul(2,max(0,sub(%q<cost_to>,%q<cost_from>))),if(cand(eq(%q<cost_from>,0),gt(%q<cost_to>,0)),1,0)),0)]
        flags: [funsyntax]
      FUN`POINTS`TOTAL:
        value: |-
          default(%0/FATE`SKILLPOINTS,get(%!/DATA`CONFIG`POINTS))
        flags: [funsyntax]
      FUN`POINTS`LEFT:
        value: |-
          sub(u(%!/FUN`POINTS`TOTAL,%0),ladd(iter(lattr(%0/FATE`FOCUS`*),u(%!/FUN`FOCUS`COST,%0,after(%i0,FATE`FOCUS`)))))
        flags: [funsyntax]
      # %0 a character, %1 PHYSICAL or MENTAL: the track's length from their modes, or nothing without modes (the
      # sheet's own length).
      FUN`STRESS`BOXES:
        value: |-
          if(words(setr(boxes_held,u(%!/FUN`MODE`HELD,%0))),add(get(%!/DATA`CONFIG`STRESS),ladd(iter(%q<boxes_held>,u(%!/FUN`STRESS`FROM,%0,%i0,%1)))))
        flags: [funsyntax]
      # %0 a character, %1 a mode, %2 PHYSICAL or MENTAL: the boxes it adds there. Fair adds one, Good two, on the
      # track its skills fit, or the one the character chose when they fit both.
      FUN`STRESS`FROM:
        value: |-
          setqm(from_bonus,max(0,dec(get(%0/FATE`MODE`%1))),from_choice,u(%!/FUN`STRESS`CHOICE,%0,%1))[switch(%q<from_choice>,split,if(strmatch(%2,PHYSICAL),ceil(fdiv(%q<from_bonus>,2)),floor(fdiv(%q<from_bonus>,2))),lcstr(%2),%q<from_bonus>,0)]
        flags: [funsyntax]
      FUN`STRESS`CHOICE:
        value: |-
          setq(choice_scopes,u(%!/FUN`MODE`SCOPES,%1))[cond(eq(words(%q<choice_scopes>),2),firstof(get(%0/FATE`MODESTRESS`%1),physical),words(%q<choice_scopes>),%q<choice_scopes>,none)]
        flags: [funsyntax]

      # ---- mega-stunts and the GM's reserve ------------------------------------------
      # %0 a character: what they add to the GM's fate point reserve. Each benefit past the stunt slots adds one,
      # each voluntary weakness or cost takes one off.
      FUN`RESERVE:
        value: |-
          setq(reserve_slots,get({{sheet-fate/sheet}}/DATA`CONFIG`STUNTS))[if(%q<reserve_slots>,max(0,sub(max(0,sub(ladd(iter(lnum(1,%q<reserve_slots>),if(hasattr(%0,FATE`STUNT`%i0),default(%0/FATE`MEGA`%i0,1),0))),%q<reserve_slots>)),ladd(iter(lnum(1,%q<reserve_slots>),default(%0/FATE`MEGA`%i0`WEAK,0))))),0)]
        flags: [funsyntax]
      FUN`RESERVE`ANY:
        value: |-
          cand(hastype(%0,player),gt(u(%!/FUN`RESERVE,%0),0))
        flags: [funsyntax]

      # ---- scale --------------------------------------------------------------------
      FUN`SCALE`FIND:
        value: |-
          u(%!/FUN`LIST`FIND,SCALE,%0)
        flags: [funsyntax]
      FUN`SCALE`STEP:
        value: |-
          default({{store}}/SCALE`%0`STEP,1)
        flags: [funsyntax]
      FUN`SCALE`LABEL:
        value: |-
          firstof(get({{store}}/SCALE`%0),lcstr(%0))
        flags: [funsyntax]
      FUN`SCALE`ALL:
        value: |-
          sortkey(%!/FUN`SCALE`STEPKEY,u(%!/FUN`LIST`ALL,SCALE))
        flags: [funsyntax]
      FUN`SCALE`STEPKEY:
        value: |-
          rjust(u(%!/FUN`SCALE`STEP,%0),2,0)%0
        flags: [funsyntax]

      # ---- lists on the store -------------------------------------------------------
      # %0 a list on the store (MODE, SCALE): its keys, in order then by key. FUN`LIST`SORTKEY reads list_path.
      FUN`LIST`ALL:
        value: |-
          setq(list_path,%0)[sortkey(%!/FUN`LIST`SORTKEY,iter(lattr({{store}}/%0`*),after(%i0,`)))]
        flags: [funsyntax]
      FUN`LIST`SORTKEY:
        value: |-
          rjust(default({{store}}/%q<list_path>`%0`ORDER,50),3,0)%0
        flags: [funsyntax]
      # %0 a list, %1 typed text: the key it names, by key, by label, or by the start of one, or nothing.
      FUN`LIST`FIND:
        value: |-
          setqm(find_typed,trim(%1),
          find_all,u(%!/FUN`LIST`ALL,%0),
          find_exact,iter(%q<find_all>,if(cor(not(comp(%i0,ucstr(edit(%q<find_typed>,%b,-)))),not(comp(lcstr(get({{store}}/%0`%i0)),lcstr(%q<find_typed>)))),%i0)),
          find_start,iter(%q<find_all>,if(cor(not(comp(left(%i0,strlen(%q<find_typed>)),ucstr(%q<find_typed>))),not(comp(lcstr(left(get({{store}}/%0`%i0),strlen(%q<find_typed>))),lcstr(%q<find_typed>)))),%i0)))[if(strlen(%q<find_typed>),first(firstof(%q<find_exact>,if(eq(words(%q<find_start>),1),%q<find_start>))))]
        flags: [funsyntax]
      FUN`PLAYER`MATCH:
        value: |-
          if(isdbref(setr(found_player,pmatch(%0))),objid(%q<found_player>))
        flags: [funsyntax]

      # ---- display ------------------------------------------------------------------
      # %0 typed text: itself, with a full stop when it ends in none.
      FUN`DISPLAY`SENTENCE:
        value: |-
          %0[if(member(. ! ?,right(%0,1)),,.)]
        flags: [funsyntax]
      FUN`DISPLAY`RATINGS:
        value: |-
          itemize(iter(get(%!/DATA`CONFIG`RATINGS),u({{sheet-fate/sheet}}/FUN`LADDER`SHOW,%i0),%b,|),|)
        flags: [funsyntax]
      # %0 a character, %1 modes: Action (Good) and Banter (Fair).
      FUN`DISPLAY`MODES:
        value: |-
          itemize(iter(%1,[u(%!/FUN`MODE`LABEL,%i0)] %([u({{sheet-fate/sheet}}/API`LADDER,get(%0/FATE`MODE`%i0))]%),%b,|),|)
        flags: [funsyntax]
      # %0 a character, %1 a mode: the skills written under it (each under its highest mode only), with the
      # focused and specialized ones marked.
      FUN`DISPLAY`HOMESKILLS:
        value: |-
          firstof(itemize(iter(filterbool(%!/FUN`SKILL`ISHOME,ucstr(get({{store}}/MODE`%1`SKILLS)),,,%0,%1),[u({{sheet-fate/sheet}}/API`LABEL,%i0)][setq(home_steps,u(%!/FUN`SKILL`STEPS,%0,%i0,words(u(%!/FUN`MODE`HOLDERS,%0,%i0))))][if(%q<home_steps>,%b%([u(%!/FUN`SKILL`WORD,%q<home_steps>)]%, [u({{sheet-fate/sheet}}/API`LADDER,u(%!/FUN`SKILL`RATING,%0,%i0))]%))],%b,|),|),each of its skills is written under a higher mode)
        flags: [funsyntax]
      # %0 a skill, %1 a character, %2 a mode: 1 when the skill is written under that mode, its highest.
      FUN`SKILL`ISHOME:
        value: |-
          cand(strlen(u({{sheet-fate/sheet}}/API`FIND,%0)),not(comp(first(u(%!/FUN`MODE`HOLDERS,%1,%0)),%2)))
        flags: [funsyntax]
      FUN`DISPLAY`POINTSLEFT:
        value: |-
          setr(points_left,u(%!/FUN`POINTS`LEFT,%0)) of [u(%!/FUN`POINTS`TOTAL,%0)] skill point[if(neq(u(%!/FUN`POINTS`TOTAL,%0),1),s)] left.
        flags: [funsyntax]
      FUN`DISPLAY`BOXES:
        value: |-
          Stress boxes: [firstof(u(%!/FUN`STRESS`BOXES,%0,PHYSICAL),u({{sheet-fate/sheet}}/FUN`TRACK`BOXES,%0,PHYSICAL))] physical%, [firstof(u(%!/FUN`STRESS`BOXES,%0,MENTAL),u({{sheet-fate/sheet}}/FUN`TRACK`BOXES,%0,MENTAL))] mental.
        flags: [funsyntax]
      FUN`DISPLAY`RESERVE:
        value: |-
          if(setr(reserve_adds,u(%!/FUN`RESERVE,%0)),Together [poss(%0)] stunts add %q<reserve_adds> to the GM's fate point reserve.,[capstr(poss(%0))] stunts add nothing to the GM's fate point reserve.)
        flags: [funsyntax]
      FUN`DISPLAY`WEIRDMODES:
        value: |-
          itemize(iter(filterbool(%!/FUN`MODE`ISWEIRD,u(%!/FUN`LIST`ALL,MODE)),u(%!/FUN`MODE`LABEL,%i0),%b,|),|,or)
        flags: [funsyntax]
      FUN`DISPLAY`SCALES:
        value: |-
          itemize(iter(u(%!/FUN`SCALE`ALL),lcstr(u(%!/FUN`SCALE`LABEL,%i0)),%b,|),|)
        flags: [funsyntax]
      # %0 the machine's scale, %1 the foe's, %2 what it added to the roll: " Giant against Titan: -1 to the roll."
      FUN`DISPLAY`SCALE:
        value: |-
          if(comp(%0,%1),%b[u(%!/FUN`SCALE`LABEL,%0)] against [lcstr(u(%!/FUN`SCALE`LABEL,%1))][if(%2,: [if(gt(%2,0),+%2,%2)] to the roll)].)
        flags: [funsyntax]
      # %0 the check, %1 the Weapon rating, %2 the shifts scale adds to harm: " A hit for 4 shifts."
      FUN`DISPLAY`HIT:
        value: |-
          setq(hit_shifts,json_query(%0,extract,$.shifts))[if(cand(isint(%q<hit_shifts>),gt(%q<hit_shifts>,0)),%bAs an attack it hits for [setr(hit_harm,max(0,add(%q<hit_shifts>,%1,%2)))] shift[if(neq(%q<hit_harm>,1),s)][if(cor(%1,%2),%b%([trim(%q<hit_shifts> [if(%1,+ Weapon:%1)] [if(%2,[if(gt(%2,0),+,-)] [abs(%2)] for scale)])]%))].)]
        flags: [funsyntax]
      # %0 the outcome, %1 the benefits, %2 the inventor's name: who chooses the catches.
      FUN`INVENT`CATCHES:
        value: |-
          switch(%0,fail,The GM chooses [if(eq(%1,1),its catch,all %1 catches)].,partial,if(eq(%1,1),The GM chooses its catch.,The GM and %2 take turns choosing the %1 catches%, the GM first.),success,if(eq(%1,1),The GM chooses its catch.,The GM chooses one catch and %2 the other [dec(%1)].),%2 chooses [if(eq(%1,1),its catch,every catch)].)
        flags: [funsyntax]

      # ---- the parts of +sheet --------------------------------------------------------
      # %0 the character, %1 the reader. Each mode with its rating and the skills written under it; then the
      # skill points and stress boxes. Nothing for a character without modes, but a hint for one still choosing.
      FUN`SECTION`MODES:
        value: |-
          if(words(setr(section_held,u(%!/FUN`MODE`HELD,%0))),[lfields(,iter(%q<section_held>,u(%!/FUN`MODE`LABEL,%i0),%b,%*<|>),iter(%q<section_held>,[u({{sheet-fate/sheet}}/FUN`LADDER`SHOW,get(%0/FATE`MODE`%i0))]: [u(%!/FUN`DISPLAY`HOMESKILLS,%0,%i0)],%b,%*<|>),%*<|>)]%r[tone(muted,[u(%!/FUN`DISPLAY`POINTSLEFT,%0)] [u(%!/FUN`DISPLAY`BOXES,%0)])],if(cand(not(comp(objid(%1),%0)),not(isapproved(%1))),tone(muted,No modes yet. +mode/list shows them%, and +mode/set <mode>=good chooses one.)))
        flags: [funsyntax]
      # %0 the character: each mega-stunt with its benefits, and what they add to the GM's reserve.
      FUN`SECTION`MEGA:
        value: |-
          if(words(setr(section_megas,iter(lattr(%0/FATE`MEGA`*),after(%i0,FATE`MEGA`)))),[lfields(,iter(%q<section_megas>,Stunt %i0,%b,%*<|>),iter(%q<section_megas>,[get(%0/FATE`MEGA`%i0)] benefit[if(neq(get(%0/FATE`MEGA`%i0),1),s)][if(get(%0/FATE`MEGA`%i0`WEAK),%, [get(%0/FATE`MEGA`%i0`WEAK)] chosen weakness[if(neq(get(%0/FATE`MEGA`%i0`WEAK),1),es)] or cost[if(neq(get(%0/FATE`MEGA`%i0`WEAK),1),s)])],%b,%*<|>),%*<|>)]%r[tone(muted,u(%!/FUN`DISPLAY`RESERVE,%0))])
        flags: [funsyntax]
      FUN`SECTION`MACHINE:
        value: |-
          if(hasattr(%0,FATE`MACHINE),lfields(lit({"cols":2}),Machine|Scale|Concept|Flaw|Weapon|Armor|Stress,[get(%0/FATE`MACHINE)]|[u(%!/FUN`SCALE`LABEL,get(%0/FATE`MACHINE`SCALE))]|[firstof(get(%0/FATE`MACHINE`CONCEPT),tone(muted,-))]|[firstof(get(%0/FATE`MACHINE`FLAW),tone(muted,-))]|[default(%0/FATE`MACHINE`WEAPON,0)]|[default(%0/FATE`MACHINE`ARMOR,0)]|[setq(machine_marked,get(%0/FATE`MACHINE`STRESS))][iter(lnum(1,get(%!/DATA`CONFIG`MACHINE_BOXES)),if(member(%q<machine_marked>,%i0),%[X%],%[%b%]))],|))
        flags: [funsyntax]
      FUN`SECTION`INVENTIONS:
        value: |-
          if(words(setr(section_inventions,sort(iter(lattr(%0/FATE`INVENTION`*),after(%i0,FATE`INVENTION`)),n))),lfields(,iter(%q<section_inventions>,Invention %i0,%b,%*<|>),iter(%q<section_inventions>,u(%!/FUN`DISPLAY`INVENTION,%0,%i0),%b,%*<|>),%*<|>))
        flags: [funsyntax]
      # %0 a character, %1 an invention: "Rocket Boots: 2 benefits, success. Flaw: Weighs a Ton. Catches: Time."
      FUN`DISPLAY`INVENTION:
        value: |-
          get(%0/FATE`INVENTION`%1): [get(%0/FATE`INVENTION`%1`BENEFITS)] benefit[if(neq(get(%0/FATE`INVENTION`%1`BENEFITS),1),s)]%, built with [u({{sheet-fate/sheet}}/API`LABEL,get(%0/FATE`INVENTION`%1`SKILL))]: [u({{sheet-fate/sheet}}/FUN`DISPLAY`TIER,get(%0/FATE`INVENTION`%1`OUTCOME))]. Flaw: [firstof(get(%0/FATE`INVENTION`%1`FLAW),not named yet)]. Catches: [firstof(itemize(iter(sort(iter(lattr(%0/FATE`INVENTION`%1`CATCH`*),last(%i0,`)),n),get(%0/FATE`INVENTION`%1`CATCH`%i0),%b,|),|),none yet)].
        flags: [funsyntax]

      # ---- screens ------------------------------------------------------------------
      FUN`SCREEN`MODES:
        value: |-
          box(firstof(u(%!/FUN`SECTION`MODES,%0,%1),tone(muted,[name(%0)] has no modes.))[if(strlen(setr(screen_mega,u(%!/FUN`SECTION`MEGA,%0,%1))),%r[rule(Mega-stunts)]%r%q<screen_mega>)]%r[rule()]%r[tone(muted,+mode/set <mode>=<rating> chooses a mode. +mode/focus <skill> improves a skill. +mode/list shows the modes.)],Modes: [name(%0)])
        flags: [funsyntax]
      FUN`SCREEN`LIST:
        value: |-
          setq(screen_all,u(%!/FUN`LIST`ALL,MODE))[box(ldatatable(lit({"nowrap":"1|2","grow":"||1"}),Mode|Kind|Skills,iter(%q<screen_all>,[u(%!/FUN`MODE`LABEL,%i0)]|[if(get({{store}}/MODE`%i0`WEIRD),weird,standard)]|[itemize(iter(get({{store}}/MODE`%i0`SKILLS),u({{sheet-fate/sheet}}/API`LABEL,%i0),%b,%,),%,)],,%*<^>),%*<^>)%r[rule()]%r[tone(muted,Rate [words(get(%!/DATA`CONFIG`RATINGS))] of them [u(%!/FUN`DISPLAY`RATINGS)]: +mode/set <mode>=<rating>. A weird mode allows mega-stunts.)],Modes)]
        flags: [funsyntax]

      # ---- lifecycle ----------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP:
        value: |-
          @command/add/noparse/rsnoparse +mode; @hook/override/inline +mode=%!,CMD`MODE; @command/add/noparse/rsnoparse +machine; @hook/override/inline +machine=%!,CMD`MACHINE; @command/add/noparse/rsnoparse +invent; @hook/override/inline +invent=%!,CMD`INVENT; @command/add/noparse/rsnoparse +brainstorm; @hook/override/inline +brainstorm=%!,CMD`BRAINSTORM
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

