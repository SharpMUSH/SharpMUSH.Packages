    name: Fate Action Science Store
    location: "{{science}}"
    flags: [no_command]
    attributes:
      MODE: |-
        The modes characters choose from, one branch each, with SKILLS, WEIRD and ORDER beneath.
      MODE`ACTION: |-
        Action
      MODE`ACTION`SKILLS: |-
        athletics combat notice physique provoke vehicles
      MODE`ACTION`ORDER: |-
        1
      MODE`BANTER: |-
        Banter
      MODE`BANTER`SKILLS: |-
        contacts deceive empathy provoke rapport will
      MODE`BANTER`ORDER: |-
        2
      MODE`INTRIGUE: |-
        Intrigue
      MODE`INTRIGUE`SKILLS: |-
        athletics burglary contacts deceive notice stealth
      MODE`INTRIGUE`ORDER: |-
        3
      MODE`SCIENCE: |-
        Science
      MODE`SCIENCE`SKILLS: |-
        notice will chemistry engineering exobiology mechanics physics robotics science
      MODE`SCIENCE`ORDER: |-
        4
      MODE`MARTIAL-ARTIST: |-
        Martial Artist
      MODE`MARTIAL-ARTIST`SKILLS: |-
