      MODE`MARTIAL-ARTIST`WEIRD: |-
        1
      MODE`PILOT: |-
        Pilot
      MODE`PILOT`SKILLS: |-
        contacts notice vehicles
      MODE`PILOT`WEIRD: |-
        1
      MODE`REPORTER: |-
        Reporter
      MODE`REPORTER`SKILLS: |-
        contacts empathy notice rapport stealth will
      MODE`REPORTER`WEIRD: |-
        1
      MODE`ROBOT: |-
        Robot
      MODE`ROBOT`SKILLS: |-
        athletics notice physique
      MODE`ROBOT`WEIRD: |-
        1
      MODE`SECRET-AGENT: |-
        Secret Agent
      MODE`SECRET-AGENT`SKILLS: |-
        burglary contacts deceive notice stealth vehicles
      MODE`SECRET-AGENT`WEIRD: |-
        1
      MODE`SOLDIER: |-
        Soldier
      MODE`SOLDIER`SKILLS: |-
        athletics combat contacts notice physique vehicles will
      MODE`SOLDIER`WEIRD: |-
        1
      SCALE: |-
        The scales, one branch each, with STEP beneath: people on step 1.
      SCALE`PERSON: |-
        Person
