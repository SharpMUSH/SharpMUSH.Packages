format: "1.16"
package: fate-action-science
title: "Fate: action science and giant robots"
version: 1.0.0
authors: [SharpMUSH]
description: "Pulp action science and super robots on the Fate sheet: characters pick three modes (Action, Banter, Intrigue, Science, or weird ones such as Robot and Pilot) that rate their skills, take mega-stunts, invent gadgets with catches and flaws, brainstorm a hypothesis together, and pilot giant machines whose scale counts in a fight. Based on the Atomic Robo RPG SRD and the Fate System Toolkit, both under CC BY 3.0."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, fate, invention, robots, mecha]
category: Characters
requires_server: ">=0.1"

# It works the Fate sheet's skill ratings out from modes, so it needs the sheet's stunts, per-character stress
# boxes and its GATE`SET and SECTION` hooks (sheet-fate 1.1). Sheet keepers (softcode.fate.admin) keep this
# too; there is no permission of its own.
depends:
  - package: sheet-fate
    version: ">=1.1 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH.Packages
      path: sheet-fate/
      branch: main

objects:
  # The command object, in the master room. WIZARD because it adds the commands (@command/add, @hook), writes
  # under each character's FATE` tree (wizard-flagged), and calls the Fate sheet's API.
  #
  # What it keeps on a character, beside the sheet's own leaves: FATE`MODE`<KEY> a mode's rating,
  # FATE`FOCUS`<SKILL> the steps bought for a skill, FATE`SKILLPOINTS a keeper's skill point total,
  # FATE`MODESTRESS`<KEY> which track a mode's extra boxes go on, FATE`MEGA`<n> a mega-stunt's benefits (WEAK
  # beneath: voluntary weaknesses and costs), FATE`MACHINE the machine's name (SCALE, CONCEPT, FLAW, WEAPON,
  # ARMOR, STRESS beneath) and FATE`INVENTION`<n> an invention's function (BENEFITS, SKILL, OUTCOME, ROLL, FLAW,
  # CATCH`<n> beneath). It writes FATE`RATING`<SKILL> and FATE`BOXES`<TRACK> from the modes, so the sheet,
  # +check and Duties read the right numbers.
  #
  # +mode, +machine, +invent and +brainstorm are added with /noparse/rsnoparse and hooked to CMD`<word>, so
  # what a player types reaches the code exactly as typed and nothing a player wrote is ever evaluated.
  #
  # Trees: CMD` the hooked commands, INC`COMMAND` the parse and dispatch, INC`MODE`, INC`MACHINE`, INC`INVENT`
  # and INC`BRAINSTORM` one routine per switch, INC`NEED` the guards, INC`DO` the writes. FUN`MODE`, FUN`SKILL`,
  # FUN`STRESS` and FUN`POINTS` work the ratings out, FUN`SECTION` the parts of +sheet, FUN`SCREEN` the screens.
  - ref: science
    type: thing
    name: Fate Action Science
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      # ---- settings ---------------------------------------------------------------
      # +config fate-science shows and changes them (fate-action-science-config).
      DATA`CONFIG: |-
        Settings for modes, mega-stunts, machines and brainstorms on the Fate sheet. One leaf per setting.
      DATA`CONFIG`LABEL: |-
        Fate action science
      DATA`CONFIG`RATINGS: |-
        3 2 1
      DATA`CONFIG`RATINGS`TYPE: |-
        list
      DATA`CONFIG`RATINGS`DEFAULT: |-
        3 2 1
      DATA`CONFIG`RATINGS`MIN: |-
        1
      DATA`CONFIG`RATINGS`MAX: |-
        6
      DATA`CONFIG`RATINGS`CHECK: |-
        CHECK`RATINGS
      DATA`CONFIG`RATINGS`LABEL: |-
        Mode ratings
      DATA`CONFIG`RATINGS`DESCRIPTION: |-
        The ratings a character's modes take, one each: as many modes as ratings.
      DATA`CONFIG`RATINGS`EXAMPLE: |-
        3 2 2 1
      DATA`CONFIG`POINTS: |-
        3
      DATA`CONFIG`POINTS`TYPE: |-
        integer
      DATA`CONFIG`POINTS`DEFAULT: |-
        3
      DATA`CONFIG`POINTS`MIN: |-
        0
      DATA`CONFIG`POINTS`MAX: |-
        30
      DATA`CONFIG`POINTS`LABEL: |-
        Skill points
      DATA`CONFIG`POINTS`DESCRIPTION: |-
        Points each character has to improve skills within their modes: 1 to focus a trained skill, 2 to specialize a focused one.
      DATA`CONFIG`POINTS`EXAMPLE: |-
        5
      DATA`CONFIG`STRESS: |-
        2
      DATA`CONFIG`STRESS`TYPE: |-
        integer
      DATA`CONFIG`STRESS`DEFAULT: |-
        2
      DATA`CONFIG`STRESS`MIN: |-
        1
      DATA`CONFIG`STRESS`MAX: |-
        10
      DATA`CONFIG`STRESS`LABEL: |-
        Starting stress boxes
      DATA`CONFIG`STRESS`DESCRIPTION: |-
        The physical and mental boxes a character with modes starts with, before their Fair and Good modes add more.
      DATA`CONFIG`STRESS`EXAMPLE: |-
        3
      DATA`CONFIG`PHYSICAL: |-
        athletics physique
      DATA`CONFIG`PHYSICAL`TYPE: |-
        list
      DATA`CONFIG`PHYSICAL`DEFAULT: |-
        athletics physique
      DATA`CONFIG`PHYSICAL`LABEL: |-
        Physical stress skills
      DATA`CONFIG`PHYSICAL`DESCRIPTION: |-
        A Fair or Good mode with one of these skills adds physical stress boxes.
      DATA`CONFIG`PHYSICAL`EXAMPLE: |-
        athletics physique combat
      DATA`CONFIG`MENTAL: |-
        provoke will
      DATA`CONFIG`MENTAL`TYPE: |-
        list
      DATA`CONFIG`MENTAL`DEFAULT: |-
        provoke will
      DATA`CONFIG`MENTAL`LABEL: |-
        Mental stress skills
      DATA`CONFIG`MENTAL`DESCRIPTION: |-
        A Fair or Good mode with one of these skills adds mental stress boxes.
      DATA`CONFIG`MENTAL`EXAMPLE: |-
        provoke will empathy
      DATA`CONFIG`SCALE_EFFECT: |-
        roll
      DATA`CONFIG`SCALE_EFFECT`TYPE: |-
        choice
      DATA`CONFIG`SCALE_EFFECT`DEFAULT: |-
        roll
      DATA`CONFIG`SCALE_EFFECT`CHOICES: |-
        roll harm both
      DATA`CONFIG`SCALE_EFFECT`LABEL: |-
        What scale does
      DATA`CONFIG`SCALE_EFFECT`DESCRIPTION: |-
        For each step of scale between a machine and its foe: roll gives the larger +1 on the roll, harm 2 shifts more harm (or 2 less taken), both does both.
      DATA`CONFIG`SCALE_EFFECT`EXAMPLE: |-
        both
      DATA`CONFIG`MACHINE_SCALE: |-
        giant
      DATA`CONFIG`MACHINE_SCALE`TYPE: |-
        text
      DATA`CONFIG`MACHINE_SCALE`DEFAULT: |-
        giant
      DATA`CONFIG`MACHINE_SCALE`CHECK: |-
        CHECK`SCALE
      DATA`CONFIG`MACHINE_SCALE`LABEL: |-
        A new machine's scale
      DATA`CONFIG`MACHINE_SCALE`DESCRIPTION: |-
        The scale a machine starts at, one of the scales table.
      DATA`CONFIG`MACHINE_SCALE`EXAMPLE: |-
        vehicle
      DATA`CONFIG`MACHINE_BOXES: |-
        3
      DATA`CONFIG`MACHINE_BOXES`TYPE: |-
        integer
      DATA`CONFIG`MACHINE_BOXES`DEFAULT: |-
        3
      DATA`CONFIG`MACHINE_BOXES`MIN: |-
        1
      DATA`CONFIG`MACHINE_BOXES`MAX: |-
        10
      DATA`CONFIG`MACHINE_BOXES`LABEL: |-
        Machine stress boxes
      DATA`CONFIG`MACHINE_BOXES`DESCRIPTION: |-
        How many stress boxes every machine has.
      DATA`CONFIG`MACHINE_BOXES`EXAMPLE: |-
        4
      DATA`CONFIG`BRAINSTORM_DIFFICULTY: |-
        3
      DATA`CONFIG`BRAINSTORM_DIFFICULTY`TYPE: |-
        integer
      DATA`CONFIG`BRAINSTORM_DIFFICULTY`DEFAULT: |-
        3
      DATA`CONFIG`BRAINSTORM_DIFFICULTY`MIN: |-
        0
      DATA`CONFIG`BRAINSTORM_DIFFICULTY`MAX: |-
        8
      DATA`CONFIG`BRAINSTORM_DIFFICULTY`LABEL: |-
        Brainstorm difficulty
      DATA`CONFIG`BRAINSTORM_DIFFICULTY`DESCRIPTION: |-
        The difficulty of a brainstorm's first fact, and of the next one after a round nobody wins.
      DATA`CONFIG`BRAINSTORM_DIFFICULTY`EXAMPLE: |-
        2
      DATA`CONFIG`BRAINSTORM_POINT: |-
        1
      DATA`CONFIG`BRAINSTORM_POINT`TYPE: |-
        boolean
      DATA`CONFIG`BRAINSTORM_POINT`DEFAULT: |-
        1
      DATA`CONFIG`BRAINSTORM_POINT`LABEL: |-
        A fate point for joining a brainstorm
      DATA`CONFIG`BRAINSTORM_POINT`DESCRIPTION: |-
        Whether a character who joins a brainstorm, compelling one of their aspects, gains a fate point.
      DATA`CONFIG`BRAINSTORM_POINT`EXAMPLE: |-
        no
      DATA`CONFIG`MODES`TYPE: |-
        table
      DATA`CONFIG`MODES`LABEL: |-
        Modes
      DATA`CONFIG`MODES`DESCRIPTION: |-
        The modes characters choose from, each with its skills. A weird mode lets a character take mega-stunts.
      DATA`CONFIG`MODES`STORE: |-
        {{store}}
      DATA`CONFIG`MODES`PATH: |-
        MODE
      DATA`CONFIG`MODES`ENTRY: |-
        label
      DATA`CONFIG`MODES`FIELDS: |-
        label skills weird order
      DATA`CONFIG`MODES`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`MODES`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`MODES`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`MODES`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`MODES`FIELD`LABEL`LABEL: |-
        Label
      DATA`CONFIG`MODES`FIELD`LABEL`DESCRIPTION: |-
        The name the sheet shows.
      DATA`CONFIG`MODES`FIELD`SKILLS`TYPE: |-
        list
      DATA`CONFIG`MODES`FIELD`SKILLS`MIN: |-
        1
      DATA`CONFIG`MODES`FIELD`SKILLS`MAX: |-
        30
      DATA`CONFIG`MODES`FIELD`SKILLS`LABEL: |-
        Skills
      DATA`CONFIG`MODES`FIELD`SKILLS`DESCRIPTION: |-
        The keys of the Fate sheet's skills this mode rates, as +sheet/traits lists them.
      DATA`CONFIG`MODES`FIELD`WEIRD`TYPE: |-
        boolean
      DATA`CONFIG`MODES`FIELD`WEIRD`DEFAULT: |-
        0
      DATA`CONFIG`MODES`FIELD`WEIRD`LABEL: |-
        Weird
      DATA`CONFIG`MODES`FIELD`WEIRD`DESCRIPTION: |-
        Whether this is a weird mode, which lets a character take mega-stunts.
      DATA`CONFIG`MODES`FIELD`ORDER`TYPE: |-
        integer
      DATA`CONFIG`MODES`FIELD`ORDER`DEFAULT: |-
        50
      DATA`CONFIG`MODES`FIELD`ORDER`MIN: |-
        0
      DATA`CONFIG`MODES`FIELD`ORDER`MAX: |-
        999
      DATA`CONFIG`MODES`FIELD`ORDER`LABEL: |-
        Order
      DATA`CONFIG`MODES`FIELD`ORDER`DESCRIPTION: |-
        Where it comes in the list: lower first, then by name.
      DATA`CONFIG`SCALES`TYPE: |-
        table
      DATA`CONFIG`SCALES`LABEL: |-
        Scales
      DATA`CONFIG`SCALES`DESCRIPTION: |-
        The steps of size and might, smallest first by step. People are on the first.
      DATA`CONFIG`SCALES`STORE: |-
        {{store}}
      DATA`CONFIG`SCALES`PATH: |-
        SCALE
      DATA`CONFIG`SCALES`ENTRY: |-
        label
      DATA`CONFIG`SCALES`FIELDS: |-
        label step
      DATA`CONFIG`SCALES`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`SCALES`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`SCALES`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`SCALES`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`SCALES`FIELD`LABEL`LABEL: |-
        Label
      DATA`CONFIG`SCALES`FIELD`LABEL`DESCRIPTION: |-
        The name the sheet shows.
      DATA`CONFIG`SCALES`FIELD`STEP`TYPE: |-
        integer
      DATA`CONFIG`SCALES`FIELD`STEP`DEFAULT: |-
        1
      DATA`CONFIG`SCALES`FIELD`STEP`MIN: |-
        1
      DATA`CONFIG`SCALES`FIELD`STEP`MAX: |-
        10
      DATA`CONFIG`SCALES`FIELD`STEP`LABEL: |-
        Step
      DATA`CONFIG`SCALES`FIELD`STEP`DESCRIPTION: |-
        How big it is: each step between two scales is +1 or 2 shifts to the larger.
      CHECK`RATINGS: |-
        if(every(%!/FUN`IS`RATING,%0),,Give each rating as a number from 1 to 5.)
      CHECK`SCALE: |-
        if(strlen(u(%!/FUN`SCALE`FIND,%0)),,There is no scale '%0'. +config fate-science/scales lists them.)
      FUN`IS`RATING: |-
        cand(isint(%0),gte(%0,1),lte(%0,5))

      # Which INC` routine each switch runs: DATA`ROUTE`<table>`<switch>. BARE is the command alone, ARG the
      # command with something after it and no switch.
      DATA`ROUTE: |-
        Which routine each switch runs. One leaf per switch.
      DATA`ROUTE`MODE`BARE: |-
        MODE`SHOW
      DATA`ROUTE`MODE`ARG: |-
        MODE`SHOW
      DATA`ROUTE`MODE`LIST: |-
        MODE`LIST
      DATA`ROUTE`MODE`SET: |-
        MODE`SET
      DATA`ROUTE`MODE`FOCUS: |-
        MODE`FOCUS
      DATA`ROUTE`MODE`UNFOCUS: |-
        MODE`UNFOCUS
      DATA`ROUTE`MODE`STRESS: |-
        MODE`STRESS
      DATA`ROUTE`MODE`POINTS: |-
        MODE`POINTS
      DATA`ROUTE`MODE`MEGA: |-
        MODE`MEGA
      DATA`ROUTE`MODE`WEAKNESS: |-
        MODE`WEAKNESS
      DATA`ROUTE`MODE`RESERVE: |-
        MODE`RESERVE
      DATA`ROUTE`MACHINE`BARE: |-
        MACHINE`SHOW
      DATA`ROUTE`MACHINE`ARG: |-
        MACHINE`SHOW
      DATA`ROUTE`MACHINE`SET: |-
        MACHINE`SET
      DATA`ROUTE`MACHINE`STRESS: |-
        MACHINE`STRESS
      DATA`ROUTE`MACHINE`CHECK: |-
        MACHINE`CHECK
      DATA`ROUTE`MACHINE`SCRAP: |-
        MACHINE`SCRAP
      DATA`ROUTE`INVENT`BARE: |-
        INVENT`LIST
      DATA`ROUTE`INVENT`ARG: |-
        INVENT`ROLL
      DATA`ROUTE`INVENT`LIST: |-
        INVENT`LIST
      DATA`ROUTE`INVENT`CATCH: |-
        INVENT`CATCH
      DATA`ROUTE`INVENT`FLAW: |-
        INVENT`FLAW
      DATA`ROUTE`INVENT`DROP: |-
        INVENT`DROP
      DATA`ROUTE`BRAINSTORM`BARE: |-
        BRAINSTORM`SHOW
      DATA`ROUTE`BRAINSTORM`ARG: |-
        BRAINSTORM`ROLL
      DATA`ROUTE`BRAINSTORM`START: |-
        BRAINSTORM`START
      DATA`ROUTE`BRAINSTORM`JOIN: |-
        BRAINSTORM`JOIN
      DATA`ROUTE`BRAINSTORM`NEXT: |-
        BRAINSTORM`NEXT
      DATA`ROUTE`BRAINSTORM`FACT: |-
        BRAINSTORM`FACT
      DATA`ROUTE`BRAINSTORM`HYPOTHESIS: |-
        BRAINSTORM`HYPOTHESIS
      DATA`ROUTE`BRAINSTORM`STOP: |-
        BRAINSTORM`STOP

      # ---- commands ---------------------------------------------------------------
      # %1 the switches and %2 what follows, exactly as typed.
      CMD`MODE:
        value: |-
          $(?is)^\+mode(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,mode,table,MODE,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`MACHINE:
        value: |-
          $(?is)^\+machine(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,machine,table,MACHINE,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`INVENT:
        value: |-
          $(?is)^\+invent(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,invent,table,INVENT,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`BRAINSTORM:
        value: |-
          $(?is)^\+brainstorm(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,brainstorm,table,BRAINSTORM,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      # A line a bridge adds to one of this object's messages: HINT`<message>. Nothing when no bridge set one.
      FUN`HINT:
        value: |-
          if(hasattr(%!,HINT`%0),%b[u(%!/HINT`%0,%1,%2)])
        flags: [funsyntax]
      INC`COMMAND`RUN:
        value: |-
          @assert hastype(%#,player)=@pemit %#=notice(SCIENCE,Only players have a sheet.,warn); think u(%!/FUN`COMMAND`PARSE,%<word>,%<table>,%<switches>,%<argument>); @assert lte(words(%q<cmd_switch_list>),1)=@pemit %#=notice(SCIENCE,Use one switch at a time.,warn); @assert strlen(%q<cmd_route>)=@pemit %#=notice(SCIENCE,+%q<cmd_word> has no /%q<cmd_switch> switch.[u(%!/FUN`HINT,SWITCHES,%q<cmd_word>)],warn); @include %!/INC`%q<cmd_route>
        flags: [cmdsyntax]
      # %0 the word, %1 its route table, %2 the switches and %3 the argument, as typed. Sets cmd_word,
      # cmd_switch_list, cmd_switch, cmd_argument, cmd_has_equals, cmd_left_side and cmd_right_side around the
      # first =, cmd_route (the INC` routine to run), viewer_objid and viewer_keeper.
      FUN`COMMAND`PARSE:
        value: |-
          setqm(cmd_word,lcstr(%0),
          cmd_switch_list,lcstr(trim(edit(%2,/,%b))),
          cmd_switch,first(%q<cmd_switch_list>),
          cmd_argument,trim(%3),
          cmd_has_equals,strmatch(%3,*=*),
          cmd_left_side,trim(before(%3,=)),
          cmd_right_side,trim(after(%3,=)),
          cmd_route,get(%!/DATA`ROUTE`%1`[if(strlen(%q<cmd_switch>),ucstr(%q<cmd_switch>),if(strlen(%q<cmd_argument>),ARG,BARE))]),
          viewer_objid,objid(%#),
          viewer_keeper,permission(%#,softcode.fate.admin))
        flags: [funsyntax]

      # ---- guards -----------------------------------------------------------------
      # The left of =: <name>/<what> for a sheet keeper, else <what> on your own sheet. sheet_who and sheet_what.
      INC`NEED`WHO:
        value: |-
          think if(strmatch(%q<cmd_left_side>,*/*),setqm(sheet_who,u(%!/FUN`PLAYER`MATCH,setr(sheet_name,trim(before(%q<cmd_left_side>,/)))),sheet_what,trim(after(%q<cmd_left_side>,/))),setqm(sheet_name,,sheet_who,%q<viewer_objid>,sheet_what,%q<cmd_left_side>)); @assert strlen(%q<sheet_who>)=@pemit %#=notice(SCIENCE,There is no player called '%q<sheet_name>'.,warn); @assert cor(%q<viewer_keeper>,not(comp(%q<sheet_who>,%q<viewer_objid>)))=@pemit %#=notice(SCIENCE,Only sheet keepers change another character's sheet.,error)
        flags: [cmdsyntax]
      # The whole argument as a player's name, or yourself when there is none: sheet_who.
      INC`NEED`TARGET:
        value: |-
          think setq(sheet_who,if(strlen(%q<cmd_argument>),u(%!/FUN`PLAYER`MATCH,%q<cmd_argument>),%q<viewer_objid>)); @assert strlen(%q<sheet_who>)=@pemit %#=notice(SCIENCE,There is no player called '%q<cmd_argument>'.,warn)
        flags: [cmdsyntax]
      # Choices a player makes before approval, as the Fate sheet's own ratings and aspects are.
      INC`NEED`EDITABLE:
        value: |-
          @assert cor(%q<viewer_keeper>,not(isapproved(%#)))=@pemit %#=notice(SCIENCE,Your character is approved%, so staff change your sheet now.,error); @assert cor(%q<viewer_keeper>,not(strlen(setr(edit_gate,u({{sheet-fate/sheet}}/FUN`GATE`EDIT,%#)))))=@pemit %#=notice(SCIENCE,%q<edit_gate>,warn)
        flags: [cmdsyntax]
      INC`NEED`KEEPER:
        value: |-
          @assert %q<viewer_keeper>=@pemit %#=notice(SCIENCE,Only sheet keepers do that.,error)
        flags: [cmdsyntax]
      INC`NEED`VIEW:
        value: |-
          @assert u({{sheet-fate/sheet}}/FUN`PERM`VIEW,%#,%q<sheet_who>)=@pemit %#=notice(SCIENCE,Only [name(%q<sheet_who>)] and staff can read [poss(%q<sheet_who>)] sheet.,error)
        flags: [cmdsyntax]

      # ---- +mode --------------------------------------------------------------------
      INC`MODE`SHOW:
        value: |-
          @include %!/INC`NEED`TARGET; @include %!/INC`NEED`VIEW; @pemit %#=u(%!/FUN`SCREEN`MODES,%q<sheet_who>,%#)
        flags: [cmdsyntax]
      INC`MODE`LIST:
        value: |-
          @pemit %#=u(%!/FUN`SCREEN`LIST)
        flags: [cmdsyntax]
      # +mode/set [<name>/]<mode>=<rating>: a rating the game's modes take and no other mode has. Empty drops it.
      INC`MODE`SET:
        value: |-
          @assert %q<cmd_has_equals>=@pemit %#=notice(SCIENCE,+mode/set <mode>=<rating>%, such as +mode/set action=good. +mode/list shows the modes.,warn); @include %!/INC`NEED`WHO; @include %!/INC`NEED`EDITABLE; @assert strlen(setr(mode_key,u(%!/FUN`LIST`FIND,MODE,%q<sheet_what>)))=@pemit %#=notice(SCIENCE,There is no mode '%q<sheet_what>'. +mode/list shows them.,warn); @break not(strlen(%q<cmd_right_side>))={@assert hasattr(%q<sheet_who>,FATE`MODE`%q<mode_key>)=@pemit %#=notice(SCIENCE,[name(%q<sheet_who>)] has no [u(%!/FUN`MODE`LABEL,%q<mode_key>)] mode.,warn); @include/args %!/INC`DO`SET=who,%q<sheet_who>,leaf,MODE`%q<mode_key>,value,; @include/args %!/INC`DO`SET=who,%q<sheet_who>,leaf,MODESTRESS`%q<mode_key>,value,; @include/args %!/INC`DO`RATE=who,%q<sheet_who>; @pemit %#=notice(SCIENCE,[name(%q<sheet_who>)] drops the [u(%!/FUN`MODE`LABEL,%q<mode_key>)] mode.,ok)}; think setqm(mode_value,u({{sheet-fate/sheet}}/FUN`LADDER`READ,%q<cmd_right_side>),mode_ratings,get(%!/DATA`CONFIG`RATINGS),mode_others,setdiff(u(%!/FUN`MODE`HELD,%q<sheet_who>),%q<mode_key>),mode_taken,iter(%q<mode_others>,get(%q<sheet_who>/FATE`MODE`%i0))); @assert member(%q<mode_ratings>,%q<mode_value>)=@pemit %#=notice(SCIENCE,A mode is rated [u(%!/FUN`DISPLAY`RATINGS)].,warn); @assert lt(words(%q<mode_others>),words(%q<mode_ratings>))=@pemit %#=notice(SCIENCE,[name(%q<sheet_who>)] has [words(%q<mode_ratings>)] modes already: [u(%!/FUN`DISPLAY`MODES,%q<sheet_who>,%q<mode_others>)]. Drop one first with +mode/set <mode>=.,warn); @assert gt(words(matchall(%q<mode_ratings>,%q<mode_value>)),words(matchall(%q<mode_taken>,%q<mode_value>)))=@pemit %#=notice(SCIENCE,The modes are rated [u(%!/FUN`DISPLAY`RATINGS)]%, one each%, and [u(%!/FUN`DISPLAY`MODES,%q<sheet_who>,setr(mode_clash,filterbool(%!/FUN`MODE`RATEDAT,%q<mode_others>,,,%q<sheet_who>,%q<mode_value>)))] [if(gt(words(%q<mode_clash>),1),have,has)] [u({{sheet-fate/sheet}}/FUN`LADDER`SHOW,%q<mode_value>)] already.,warn); @include/args %!/INC`DO`SET=who,%q<sheet_who>,leaf,MODE`%q<mode_key>,value,%q<mode_value>; @include/args %!/INC`DO`RATE=who,%q<sheet_who>; @pemit %#=notice(SCIENCE,[name(%q<sheet_who>)]'s [u(%!/FUN`MODE`LABEL,%q<mode_key>)] mode is [u({{sheet-fate/sheet}}/FUN`LADDER`SHOW,%q<mode_value>)]: [u(%!/FUN`DISPLAY`HOMESKILLS,%q<sheet_who>,%q<mode_key>)].,ok)
        flags: [cmdsyntax]
      # +mode/focus [<name>/]<skill>: one step up within its mode, for skill points.
      INC`MODE`FOCUS:
        value: |-
