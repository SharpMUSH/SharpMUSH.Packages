format: "1.20"
package: ninefold
title: Ninefold
version: 1.0.0
authors: [SharpMUSH]
description: "Ninefold, a card game for two on a three-by-three board, in the spirit of the card games tucked inside classic JRPGs: every player starts with a set of cards, builds a hand of five and takes the board edge by edge. Rule sets change by room, by zone or for a game-wide event, staff hand out and take back cards, and a winner can take cards from the loser."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [game, cards, minigame, collection]
category: Games
requires_server: ">=1.0"
verified_server: "1.0"

# http-handler owns the GET/POST verb routers the portal routes hang off; the ninefold-app package shows them
# at /apps/ninefold.
depends:
  - package: http-handler
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/http-handler/
      branch: main

# One permission: keeping the cards. Card keepers make and change cards and rule sets, say where a rule set
# applies, run events, and hand cards out or take them back.
categories:
  roles:
    - name: Games
      description: Roles for the people who run the game's minigames.
  permissions:
    - name: Games
      description: Running the game's minigames.
permissions:
  - name: softcode.ninefold.admin
    category: Games
    description: Make and change Ninefold cards and rule sets, say where rule sets apply, run events, and give or take back players' cards.
roles:
  - slug: card-keeper
    name: Card Keeper
    category: Games
    priority: 11
    permissions:
      softcode.ninefold.admin: allow

objects:
  # The command object. WIZARD so @pemit reaches both players wherever they are, lzone() can read any room's
  # zones, and STARTUP can add the commands. +ninefold and its short form +nf are added with @command/add and
  # hooked to CMD`NINEFOLD, so what a player types is evaluated as that player, as a built-in command's
  # argument is. The hook runs with /localize/clearregs, so a register the argument sets never reaches the code.
  # The object also sits in the master room, so the commands answer as a $-command before STARTUP has run.
  #
  # Trees: CMD` the $-command, INC`NF` one routine per switch, INC`NEED` the guards they share, INC`GAME` the
  # steps of a game, INC`OWN` changing what a player owns, FN` the functions, WEB` the portal pages, DATA`
  # fixed text and JSON templates. Registers are led by their subject: cmd_ (the parsed command), card_ (a
  # card), who_ (another player), game_ (the game in hand), rs_ (the rules that apply), set_ (a rule set).
  - ref: ninefold
    type: thing
    name: Ninefold
    location: "{{$master_room}}"
    flags: [WIZARD]
    parent: "{{ninefold_functions}}"
    attributes:
      STARTUP: |-
        @command/add +ninefold; @command/add +nf; @hook/override/inline/localize/clearregs +ninefold={{ninefold}},CMD`NINEFOLD; @hook/override/inline/localize/clearregs +nf={{ninefold}},CMD`NINEFOLD
      AINSTALL: |-
        @trigger {{ninefold}}/STARTUP
      AUPDATE: |-
        @trigger {{ninefold}}/STARTUP
      CMD`NINEFOLD:
        value: |-
          $(?is)^\+(?\:ninefold|nf)(/\S*)?(?\: +(.*))?$:think u(FN`COMMAND`PARSE,%1,%2); @assert strlen(%q<cmd_route>)=@pemit %#=notice(NINEFOLD,There is no +nf/%q<cmd_action>.[u(FN`HINT,SWITCHES)],warn); @include me/INC`NF`%q<cmd_route>
        flags: [REGEXP]
      # A line a bridge adds to one of this object's messages: HINT`<message>, set by a bridge such as
      # ninefold-help. Empty when no bridge set one.
      FN`HINT: |-
        if(hasattr(%!,HINT`%0),%b[u(%!/HINT`%0)])
      DATA`ROUTES: |-
        cards card deck rules challenge accept decline withdraw play board forfeit claim grant revoke collection new set delete ruleset rulesets zone room default event log games end
      # %0 the switches as typed (/play), %1 everything after the first space.
      FN`COMMAND`PARSE: |-
        setqm(
          cmd_words, lcstr(trim(edit(%0,/,%b))),
          cmd_action, first(%q<cmd_words>),
          cmd_arg, trim(%1),
          cmd_lhs, trim(before(%1,=)),
          cmd_rhs, trim(after(%1,=)),
          cmd_equals, pos(=,%1),
          cmd_route, cond(gt(words(%q<cmd_words>),1),,not(strlen(%q<cmd_action>)),HOME,member(v(DATA`ROUTES),%q<cmd_action>),ucstr(%q<cmd_action>)))

      # ---- settings ------------------------------------------------------------------------------
      # Each DATA`CONFIG`<NAME> is the value; the leaves under it tell +config what it accepts. The code reads
      # the value with v() whether or not +config is installed.
      DATA`CONFIG: |-
        Ninefold settings.
      DATA`CONFIG`LABEL: |-
        Ninefold
      DATA`CONFIG`CHALLENGE: |-
        600
      DATA`CONFIG`CHALLENGE`TYPE: |-
        duration
      DATA`CONFIG`CHALLENGE`DEFAULT: |-
        600
      DATA`CONFIG`CHALLENGE`MIN: |-
        60
      DATA`CONFIG`CHALLENGE`LABEL: |-
        Challenge lasts
      DATA`CONFIG`CHALLENGE`DESCRIPTION: |-
        How long a challenge waits to be accepted before it lapses.
      DATA`CONFIG`CHALLENGE`EXAMPLE: |-
        10m
      DATA`CONFIG`OVERTIME: |-
        3
      DATA`CONFIG`OVERTIME`TYPE: |-
        integer
      DATA`CONFIG`OVERTIME`DEFAULT: |-
        3
      DATA`CONFIG`OVERTIME`MIN: |-
        2
      DATA`CONFIG`OVERTIME`MAX: |-
        9
      DATA`CONFIG`OVERTIME`LABEL: |-
        Overtime rounds
      DATA`CONFIG`OVERTIME`DESCRIPTION: |-
        Under the Overtime rule, how many rounds a drawn game is played, the first included, before it stays a draw.
      DATA`CONFIG`OVERTIME`EXAMPLE: |-
        3
      DATA`CONFIG`LOGKEEP: |-
        500
      DATA`CONFIG`LOGKEEP`TYPE: |-
        integer
      DATA`CONFIG`LOGKEEP`DEFAULT: |-
        500
      DATA`CONFIG`LOGKEEP`MIN: |-
        10
      DATA`CONFIG`LOGKEEP`MAX: |-
        5000
      DATA`CONFIG`LOGKEEP`LABEL: |-
        Card log length
      DATA`CONFIG`LOGKEEP`DESCRIPTION: |-
        How many changes to players' cards +nf/log keeps: grants, takebacks and cards won.
      DATA`CONFIG`LOGKEEP`EXAMPLE: |-
        500
      DATA`CONFIG`ARTWIDTH: |-
        32
      DATA`CONFIG`ARTWIDTH`TYPE: |-
        integer
      DATA`CONFIG`ARTWIDTH`DEFAULT: |-
        32
      DATA`CONFIG`ARTWIDTH`MIN: |-
        12
      DATA`CONFIG`ARTWIDTH`MAX: |-
        48
      DATA`CONFIG`ARTWIDTH`LABEL: |-
        Card art width
      DATA`CONFIG`ARTWIDTH`DESCRIPTION: |-
        How many characters wide a card's art box is. Every card's art is centred in a box this size, and its picture fills it.
      DATA`CONFIG`ARTWIDTH`EXAMPLE: |-
        32
      DATA`CONFIG`ARTHEIGHT: |-
        16
      DATA`CONFIG`ARTHEIGHT`TYPE: |-
        integer
      DATA`CONFIG`ARTHEIGHT`DEFAULT: |-
        16
      DATA`CONFIG`ARTHEIGHT`MIN: |-
        4
      DATA`CONFIG`ARTHEIGHT`MAX: |-
        24
      DATA`CONFIG`ARTHEIGHT`LABEL: |-
        Card art height
      DATA`CONFIG`ARTHEIGHT`DESCRIPTION: |-
        How many lines tall a card's art box is.
      DATA`CONFIG`ARTHEIGHT`EXAMPLE: |-
        16

      # ---- the rules ----------------------------------------------------------------------------
      # The rule words, in the order they are listed. Each DATA`RULE`<WORD> is its name, with ABOUT under it.
      DATA`RULES: |-
        faceup blind twin balance cascade walls terrain overtime
      DATA`RULE`FACEUP: |-
        Face Up
      DATA`RULE`FACEUP`ABOUT: |-
        Both hands are shown to both players.
      DATA`RULE`BLIND: |-
        Blind Draw
      DATA`RULE`BLIND`ABOUT: |-
        Each hand is five cards dealt at random from the player's cards, not their chosen hand.
      DATA`RULE`TWIN: |-
        Twin
      DATA`RULE`TWIN`ABOUT: |-
        A card whose edges equal the edges they touch on two or more cards takes those cards.
      DATA`RULE`BALANCE: |-
        Balance
      DATA`RULE`BALANCE`ABOUT: |-
        A card whose edge sums with two or more touching cards are the same takes those cards.
      DATA`RULE`CASCADE: |-
        Cascade
      DATA`RULE`CASCADE`ABOUT: |-
        Cards taken by Twin or Balance go on to take the cards they beat.
      DATA`RULE`WALLS: |-
        Hard Edges
      DATA`RULE`WALLS`ABOUT: |-
        For Twin, the edge of the board counts as an A.
      DATA`RULE`TERRAIN: |-
        Terrain
      DATA`RULE`TERRAIN`ABOUT: |-
        A few squares carry an affinity. A card of that affinity gains 1 on every edge there; any other loses 1.
      DATA`RULE`OVERTIME: |-
        Overtime
      DATA`RULE`OVERTIME`ABOUT: |-
        A drawn game is played again, each player holding the cards of their colour.
      DATA`STAKES: |-
        friendly pick spoils
      DATA`STAKE`FRIENDLY: |-
        Friendly
      DATA`STAKE`FRIENDLY`ABOUT: |-
        Nobody loses a card.
      DATA`STAKE`PICK: |-
        Winner Picks
      DATA`STAKE`PICK`ABOUT: |-
        The winner takes one card of their choice from the loser's hand.
      DATA`STAKE`SPOILS: |-
        Spoils
      DATA`STAKE`SPOILS`ABOUT: |-
        When the game ends, every card belongs to the player whose colour it shows.
      DATA`AFFINITIES: |-
        ember tide gale stone bloom shade

      # ---- guards --------------------------------------------------------------------------------
      INC`NEED`STAFF: |-
        @assert permission(%#,softcode.ninefold.admin)=@pemit %#=notice(NINEFOLD,Permission denied. Only a card keeper can do that.,error)
      # The card named by %q<card_text> (a number or a name): card_id.
      INC`NEED`CARD: |-
        @assert strlen(%q<card_text>)=@pemit %#=notice(NINEFOLD,Which card? Give its number or its name.,warn); @assert strlen(setr(card_id,u(FN`CARD`FIND,%q<card_text>)))=@pemit %#=notice(NINEFOLD,u(FN`CARD`MISSING,%q<card_text>),warn)
      # The player named by %q<who_text>: who_obj and who_key.
      INC`NEED`PLAYER: |-
        @assert strlen(%q<who_text>)=@pemit %#=notice(NINEFOLD,Whose cards? Give a player's name.,warn); @assert cand(isdbref(setr(who_obj,pmatch(%q<who_text>))),hastype(%q<who_obj>,player))=@pemit %#=notice(NINEFOLD,There is no player called %q<who_text>.,warn); think setq(who_key,u(FN`KEY,%q<who_obj>))
      # The game the player is in, loaded into the game_ registers.
      INC`NEED`GAME: |-
        @assert strlen(setr(game_id,u(FN`GAME`OF,u(FN`KEY,%#))))=@pemit %#=notice(NINEFOLD,You are not in a game. +nf/challenge <player> starts one.,warn); think u(FN`GAME`LOAD,%q<game_id>,%#)
      INC`NEED`PLAYING: |-
        @include me/INC`NEED`GAME; @assert strmatch(%q<game_state>,playing)=@pemit %#=notice(NINEFOLD,The game has not started. It waits for [name(%q<game_b>)] to accept.,warn)
      # A rule set named by %q<set_text>: set_key.
      INC`NEED`SET: |-
        @assert strlen(%q<set_text>)=@pemit %#=notice(NINEFOLD,Which rule set? +nf/rulesets lists them.,warn); @assert u(FN`SET`EXISTS,setr(set_key,ucstr(%q<set_text>)))=@pemit %#=notice(NINEFOLD,There is no rule set called [lcstr(%q<set_text>)]. +nf/rulesets lists them.,warn)

      # ---- playing: reading ---------------------------------------------------------------------
      # +nf alone: the game when there is one, otherwise the player's cards.
      INC`NF`HOME: |-
        @break strlen(u(FN`GAME`OF,u(FN`KEY,%#)))={@include me/INC`NF`BOARD}; @include me/INC`NF`CARDS
      INC`NF`BOARD: |-
        @include me/INC`NEED`GAME; @pemit %#=u(FN`SCREEN`GAME,%#)
      INC`NF`CARDS: |-
        @pemit %#=u(FN`SCREEN`COLLECTION,%#,Your cards)
      INC`NF`COLLECTION: |-
        @include me/INC`NEED`STAFF; think setq(who_text,%q<cmd_arg>); @include me/INC`NEED`PLAYER; @pemit %#=u(FN`SCREEN`COLLECTION,%q<who_obj>,name(%q<who_obj>)'s cards)
      INC`NF`CARD: |-
        think setq(card_text,%q<cmd_arg>); @include me/INC`NEED`CARD; @pemit %#=u(FN`SCREEN`CARD,%q<card_id>,%#)
      INC`NF`RULES: |-
        think u(FN`RULES`RESOLVE,%l); @pemit %#=u(FN`SCREEN`RULES)
      # /deck shows the hand of five; /deck <card>, <card>, ... chooses it.
      INC`NF`DECK: |-
        @break not(strlen(%q<cmd_arg>))={@pemit %#=u(FN`SCREEN`DECK,%#)}; think setqm(card_pk,u(FN`KEY,%#),card_ids,u(FN`DECK`PARSE,%q<cmd_arg>)); @assert not(strlen(%q<card_bad>))=@pemit %#=notice(NINEFOLD,u(FN`CARD`MISSING,%q<card_bad>),warn); @assert lte(words(%q<card_ids>),5)=@pemit %#=notice(NINEFOLD,A hand is five cards. You named [words(%q<card_ids>)].,warn); @assert strlen(%q<card_ids>)=@pemit %#=notice(NINEFOLD,+nf/deck <card>%, <card>%, ... with up to five cards.,warn); @assert u(FN`DECK`AFFORD,%q<card_pk>,%q<card_ids>)=@pemit %#=notice(NINEFOLD,You do not have enough copies of [u(FN`CARD`NAME,%q<card_short>)].,warn); &DECK`%q<card_pk> {{store}}=%q<card_ids>; @pemit %#=notice(NINEFOLD,Your hand is [itemize(iter(u(FN`DECK`HAND,%q<card_pk>),u(FN`CARD`NAME,%i0),%b,|),|)].,ok)

      # ---- playing: a game ----------------------------------------------------------------------
      INC`NF`CHALLENGE: |-
        @assert strlen(%q<cmd_arg>)=@pemit %#=notice(NINEFOLD,Challenge whom? +nf/challenge <player>,warn); @assert cand(isdbref(setr(who_obj,locate(%#,%q<cmd_arg>,PFny))),hastype(%q<who_obj>,player))=@pemit %#=notice(NINEFOLD,There is nobody called %q<cmd_arg> here.,warn); @assert comp(objid(%q<who_obj>),%:)=@pemit %#=notice(NINEFOLD,You cannot challenge yourself.,warn); @assert hasflag(%q<who_obj>,connected)=@pemit %#=notice(NINEFOLD,name(%q<who_obj>) is not connected.,warn); think setqm(who_key,u(FN`KEY,%q<who_obj>),game_mine,u(FN`KEY,%#)); @include me/INC`GAME`SWEEP; @assert not(strlen(u(FN`GAME`OF,%q<game_mine>)))=@pemit %#=notice(NINEFOLD,You are in a game already. +nf shows it.,warn); @assert not(strlen(u(FN`GAME`OF,%q<who_key>)))=@pemit %#=notice(NINEFOLD,name(%q<who_obj>) is in a game already.,warn); @assert not(strlen(get({{store}}/CLAIM`%q<game_mine>)))=@pemit %#=notice(NINEFOLD,You have a card to claim first. +nf/claim shows the choices.,warn); @assert not(strlen(get({{store}}/CLAIM`%q<who_key>)))=@pemit %#=notice(NINEFOLD,name(%q<who_obj>) has a card to claim first.,warn); @assert gte(words(u(FN`OWN`COPIES,%q<game_mine>)),5)=@pemit %#=notice(NINEFOLD,You need at least five cards to play.,warn); @assert gte(words(u(FN`OWN`COPIES,%q<who_key>)),5)=@pemit %#=notice(NINEFOLD,name(%q<who_obj>) has fewer than five cards.,warn); think u(FN`RULES`RESOLVE,%l); @include me/INC`GAME`CREATE; @pemit %#=notice(NINEFOLD,You challenge [name(%q<who_obj>)] to Ninefold. [u(FN`RULES`LINE)] They have [u(FN`DURATION,v(DATA`CONFIG`CHALLENGE))] to accept.,info); @pemit %q<who_obj>=notice(NINEFOLD,[name(%#)] challenges you to Ninefold. [u(FN`RULES`LINE)] [cmdlink(+nf/accept,+nf/accept,Accept the challenge)] or [cmdlink(+nf/decline,+nf/decline,Decline it)].,info)
      INC`NF`ACCEPT: |-
        @include me/INC`NEED`GAME; @assert strmatch(%q<game_state>,invited)=@pemit %#=notice(NINEFOLD,Your game has started already. +nf shows it.,warn); @assert strmatch(%q<game_side>,b)=@pemit %#=notice(NINEFOLD,You challenged [name(%q<game_b>)]. They accept%, not you.,warn); @assert gte(words(u(FN`OWN`COPIES,u(FN`KEY,%q<game_a>))),5)=@pemit %#=notice(NINEFOLD,name(%q<game_a>) has fewer than five cards now.,warn); @assert gte(words(u(FN`OWN`COPIES,u(FN`KEY,%#))),5)=@pemit %#=notice(NINEFOLD,You need at least five cards to play.,warn); @assert not(strlen(get({{store}}/CLAIM`[u(FN`KEY,%#)])))=@pemit %#=notice(NINEFOLD,You have a card to claim first. +nf/claim shows the choices.,warn); @include me/INC`GAME`DEAL; think u(FN`GAME`LOAD,%q<game_id>,%#); @pemit/list %q<game_a> %q<game_b>=notice(NINEFOLD,[name(%q<game_b>)] accepts [name(%q<game_a>)]'s challenge. [name(%q<game_b>)] goes first.,info); @include me/INC`GAME`SHOW
      INC`NF`DECLINE: |-
        @include me/INC`NEED`GAME; @assert strmatch(%q<game_state>,invited)=@pemit %#=notice(NINEFOLD,Your game has started. +nf/forfeit gives it up.,warn); @assert strmatch(%q<game_side>,b)=@pemit %#=notice(NINEFOLD,That is your own challenge. +nf/withdraw takes it back.,warn); @pemit/list %q<game_a> %q<game_b>=notice(NINEFOLD,[name(%q<game_b>)] declines [name(%q<game_a>)]'s challenge.,info); @include me/INC`GAME`WIPE
      INC`NF`WITHDRAW: |-
        @include me/INC`NEED`GAME; @assert strmatch(%q<game_state>,invited)=@pemit %#=notice(NINEFOLD,Your game has started. +nf/forfeit gives it up.,warn); @assert strmatch(%q<game_side>,a)=@pemit %#=notice(NINEFOLD,That challenge is to you. +nf/decline turns it down.,warn); @pemit/list %q<game_a> %q<game_b>=notice(NINEFOLD,[name(%q<game_a>)] takes back the challenge to [name(%q<game_b>)].,info); @include me/INC`GAME`WIPE
      INC`NF`FORFEIT: |-
        @include me/INC`NEED`GAME; @break strmatch(%q<game_state>,invited)={@include me/INC`NF`[if(strmatch(%q<game_side>,a),WITHDRAW,DECLINE)]}; @pemit/list %q<game_a> %q<game_b>=notice(NINEFOLD,[name(%#)] gives up the game.,info); think setqm(game_winner,u(FN`GAME`OTHER,%q<game_side>),game_forfeit,1); @include me/INC`GAME`FINISH
      # /play <card>=<square>: the card by its place in the hand or its name, the square 1 to 9.
      INC`NF`PLAY: |-
        @include me/INC`NEED`PLAYING; @assert strmatch(%q<game_turn>,%q<game_side>)=@pemit %#=notice(NINEFOLD,It is [name(u(FN`GAME`PLAYER,%q<game_turn>))]'s turn.,warn); @assert cand(%q<cmd_equals>,strlen(%q<cmd_lhs>))=@pemit %#=notice(NINEFOLD,+nf/play <card>=<square>: the card by its number in your hand or its name%, the square from 1 to 9.,warn); @assert member(1 2 3 4 5 6 7 8 9,%q<cmd_rhs>)=@pemit %#=notice(NINEFOLD,Squares are numbered 1 to 9%, left to right from the top.,warn); @assert strmatch(extract(%q<game_cards>,%q<cmd_rhs>,1),-)=@pemit %#=notice(NINEFOLD,Square %q<cmd_rhs> is taken.,warn); @assert strlen(setr(game_at,u(FN`HAND`FIND,%q<game_hand>,%q<cmd_lhs>)))=@pemit %#=notice(NINEFOLD,There is no %q<cmd_lhs> in your hand. +nf shows it.,warn); @include me/INC`GAME`PLACE; @include me/INC`GAME`AFTER
      INC`NF`CLAIM: |-
        @assert strlen(setr(game_id,get({{store}}/CLAIM`[u(FN`KEY,%#)])))=@pemit %#=notice(NINEFOLD,You have no card to claim.,warn); think setqm(game_loser,get({{store}}/MATCH`%q<game_id>`LOSER),game_pool,squish(iter(get({{store}}/MATCH`%q<game_id>`POOL),if(gt(u(FN`OWN`COUNT,u(FN`KEY,get({{store}}/MATCH`%q<game_id>`LOSER)),before(%i0,:)),0),%i0))))); @break not(words(%q<game_pool>))={@pemit %#=notice(NINEFOLD,[name(%q<game_loser>)] no longer has any of the cards you could take%, so there is nothing to claim.,info); &CLAIM`[u(FN`KEY,%#)] {{store}}; @wipe {{store}}/MATCH`%q<game_id>`**; &MATCH`%q<game_id> {{store}}}; @break not(strlen(%q<cmd_arg>))={@pemit %#=notice(NINEFOLD,You may take one of [name(%q<game_loser>)]'s cards: [itemize(iter(%q<game_pool>,u(FN`CARD`NAME,before(%i0,:)),%b,|),|)]. +nf/claim <card> takes it.,info)}; @assert strlen(setr(game_at,u(FN`HAND`FIND,%q<game_pool>,%q<cmd_arg>)))=@pemit %#=notice(NINEFOLD,%q<cmd_arg> is not one of the cards you may take.,warn); think setq(card_id,before(extract(%q<game_pool>,%q<game_at>,1),:)); @assert gt(u(FN`OWN`COUNT,u(FN`KEY,%q<game_loser>),%q<card_id>),0)=@pemit %#=notice(NINEFOLD,name(%q<game_loser>) no longer has [u(FN`CARD`NAME,%q<card_id>)]. Pick another.,warn); @include/args me/INC`OWN`MOVE=from,%q<game_loser>,to,%#,card,%q<card_id>,why,game %q<game_id>; @pemit %#=notice(NINEFOLD,You take [u(FN`CARD`NAME,%q<card_id>)] from [name(%q<game_loser>)].,ok); @pemit %q<game_loser>=notice(NINEFOLD,[name(%#)] takes your [u(FN`CARD`NAME,%q<card_id>)].,info); &CLAIM`[u(FN`KEY,%#)] {{store}}; @wipe {{store}}/MATCH`%q<game_id>`**; &MATCH`%q<game_id> {{store}}

      # ---- a game's steps -----------------------------------------------------------------------
      # MATCH`<n> holds the state (invited, playing or claim), with A and B the players' objids (A challenged,
      # B accepted), ROOM, RULES, STAKES, TITLE, WHEN, ROUND, TURN (a or b), HAND`A and HAND`B (the cards still
      # in hand, each <card>:<side it came from>), START`A and START`B (the hands dealt), SQ`<1-9> (the card on
      # that square, <card>:<side it came from>) with OWNER under it, and TERRAIN`<1-9>. IN`<player> is the game
      # a player is in.
      INC`GAME`CREATE: |-
        think setq(game_id,inc(get({{store}}/NEXTMATCH))); &NEXTMATCH {{store}}=%q<game_id>; &MATCH`%q<game_id> {{store}}=invited; &MATCH`%q<game_id>`A {{store}}=%:; &MATCH`%q<game_id>`B {{store}}=objid(%q<who_obj>); &MATCH`%q<game_id>`ROOM {{store}}=objid(%l); &MATCH`%q<game_id>`RULES {{store}}=%q<rs_rules>; &MATCH`%q<game_id>`STAKES {{store}}=%q<rs_stakes>; &MATCH`%q<game_id>`TITLE {{store}}=%q<rs_title>; &MATCH`%q<game_id>`WHEN {{store}}=secs(); &MATCH`%q<game_id>`LIFE {{store}}=v(DATA`CONFIG`CHALLENGE); &MATCH`%q<game_id>`ROUND {{store}}=1; &IN`%q<game_mine> {{store}}=%q<game_id>; &IN`%q<who_key> {{store}}=%q<game_id>
      # A challenge that lapsed, or a game whose record is gone, no longer holds either player.
      INC`GAME`SWEEP: |-
        think setq(game_stale,squish(iter(%q<game_mine> %q<who_key>,if(cand(strlen(get({{store}}/IN`%i0)),not(strlen(u(FN`GAME`OF,%i0)))),%i0)))); @dolist/inline setunion(iter(%q<game_stale>,get({{store}}/IN`%i0)),)={@wipe {{store}}/MATCH`##`**; &MATCH`## {{store}}}; @dolist/inline %q<game_stale>={&IN`## {{store}}}
      # The hands, the terrain and the first turn: the player who accepted goes first.
      INC`GAME`DEAL: |-
        think setqm(game_rules,get({{store}}/MATCH`%q<game_id>`RULES),game_hand_a,u(FN`DEAL`HAND,u(FN`KEY,%q<game_a>),a,%q<game_rules>),game_hand_b,u(FN`DEAL`HAND,u(FN`KEY,%q<game_b>),b,%q<game_rules>)); &MATCH`%q<game_id>`HAND`A {{store}}=%q<game_hand_a>; &MATCH`%q<game_id>`HAND`B {{store}}=%q<game_hand_b>; &MATCH`%q<game_id>`START`A {{store}}=%q<game_hand_a>; &MATCH`%q<game_id>`START`B {{store}}=%q<game_hand_b>; @include me/INC`GAME`TERRAIN; &MATCH`%q<game_id>`TURN {{store}}=b; &MATCH`%q<game_id>`WHEN {{store}}=secs(); &MATCH`%q<game_id> {{store}}=playing
      INC`GAME`TERRAIN: |-
        @wipe {{store}}/MATCH`%q<game_id>`TERRAIN; @dolist/inline if(member(%q<game_rules>,terrain),extract(shuffle(lnum(1,9)),1,rand(2,4)))={&MATCH`%q<game_id>`TERRAIN`## {{store}}=extract(v(DATA`AFFINITIES),rand(1,words(v(DATA`AFFINITIES))),1)}
      # Puts hand card game_at on square cmd_rhs, works out what it takes and writes the board.
      INC`GAME`PLACE: |-
        think setqm(game_item,extract(%q<game_hand>,%q<game_at>,1),game_sq,%q<cmd_rhs>,game_before,%q<game_owners>); think setqm(game_cards,lreplace(%q<game_cards>,%q<game_sq>,%q<game_item>),game_owners,lreplace(%q<game_owners>,%q<game_sq>,%q<game_side>)); think u(FN`PLACE`RESULT,%q<game_sq>,%q<game_side>); &MATCH`%q<game_id>`SQ`%q<game_sq> {{store}}=%q<game_item>; @dolist/inline u(FN`BOARD`FILLED)={&MATCH`%q<game_id>`SQ`##`OWNER {{store}}=extract(%q<game_owners>,##,1)}; &MATCH`%q<game_id>`HAND`[ucstr(%q<game_side>)] {{store}}=ldelete(%q<game_hand>,%q<game_at>); &MATCH`%q<game_id>`TURN {{store}}=u(FN`GAME`OTHER,%q<game_side>); @pemit/list %q<game_a> %q<game_b>=notice(NINEFOLD,u(FN`PLACE`SENTENCE),info)
      # After a card goes down: the board to both players, or the end of the game when the board is full.
      INC`GAME`AFTER: |-
        think u(FN`GAME`LOAD,%q<game_id>,%#); @break member(%q<game_cards>,-)={@include me/INC`GAME`SHOW}; think setqm(game_score_a,u(FN`GAME`SCORE,a),game_score_b,u(FN`GAME`SCORE,b),game_winner,cond(gt(%q<game_score_a>,%q<game_score_b>),a,lt(%q<game_score_a>,%q<game_score_b>),b,1,draw)); @include me/INC`GAME`SHOW; @break cand(strmatch(%q<game_winner>,draw),member(%q<game_rules>,overtime),lt(get({{store}}/MATCH`%q<game_id>`ROUND),v(DATA`CONFIG`OVERTIME)))={@include me/INC`GAME`OVERTIME}; @include me/INC`GAME`FINISH
      INC`GAME`SHOW: |-
        @pemit %q<game_a>=u(FN`SCREEN`GAME,%q<game_a>); @pemit %q<game_b>=u(FN`SCREEN`GAME,%q<game_b>)
      # A draw under Overtime: each player takes up the cards of their colour, and the other player goes first.
      INC`GAME`OVERTIME: |-
        think setqm(game_round,inc(get({{store}}/MATCH`%q<game_id>`ROUND)),game_hand_a,u(FN`OVERTIME`HAND,a),game_hand_b,u(FN`OVERTIME`HAND,b)); &MATCH`%q<game_id>`ROUND {{store}}=%q<game_round>; &MATCH`%q<game_id>`HAND`A {{store}}=%q<game_hand_a>; &MATCH`%q<game_id>`HAND`B {{store}}=%q<game_hand_b>; @wipe {{store}}/MATCH`%q<game_id>`SQ; @include me/INC`GAME`TERRAIN; &MATCH`%q<game_id>`TURN {{store}}=if(mod(%q<game_round>,2),b,a); think u(FN`GAME`LOAD,%q<game_id>,%#); @pemit/list %q<game_a> %q<game_b>=notice(NINEFOLD,It is a draw%, so the game goes to overtime: round %q<game_round>. Each of you holds the cards of your colour.,info); @include me/INC`GAME`SHOW
      # The end: game_winner is a, b or draw. The stakes are paid, then the game is cleared, unless the winner
      # has a card to pick.
      INC`GAME`FINISH: |-
        think setqm(game_winner_obj,if(strmatch(%q<game_winner>,draw),,u(FN`GAME`PLAYER,%q<game_winner>)),game_loser_obj,if(strmatch(%q<game_winner>,draw),,u(FN`GAME`PLAYER,u(FN`GAME`OTHER,%q<game_winner>)))); @pemit/list %q<game_a> %q<game_b>=notice(NINEFOLD,if(strlen(%q<game_winner_obj>),[name(%q<game_winner_obj>)] wins[if(%q<game_forfeit>,: [name(%q<game_loser_obj>)] gave up.,%, [u(FN`GAME`SCORE,%q<game_winner>)] to [u(FN`GAME`SCORE,u(FN`GAME`OTHER,%q<game_winner>))].)],The game is a draw.),ok); @include me/INC`STAKES`[ucstr(if(strlen(%q<game_winner_obj>),%q<game_stakes>,friendly))]
      INC`STAKES`FRIENDLY: |-
        @include me/INC`GAME`WIPE
      INC`STAKES`SPOILS: |-
        think setq(game_done,); @dolist/inline u(FN`BOARD`TURNED)={think setq(game_spoil,extract(%q<game_cards>,##,1)); @include/args me/INC`OWN`MOVE=from,u(FN`GAME`PLAYER,after(%q<game_spoil>,:)),to,u(FN`GAME`PLAYER,extract(%q<game_owners>,##,1)),card,before(%q<game_spoil>,:),why,game %q<game_id>; think setq(game_done,%q<game_done> ##)}; @pemit/list %q<game_a> %q<game_b>=notice(NINEFOLD,Spoils: [u(FN`SPOILS`SENTENCE,squish(%q<game_done>),u(FN`BOARD`TURNED))],info); @include me/INC`GAME`WIPE
      INC`STAKES`PICK: |-
        &MATCH`%q<game_id> {{store}}=claim; &MATCH`%q<game_id>`LOSER {{store}}=objid(%q<game_loser_obj>); &MATCH`%q<game_id>`POOL {{store}}=get({{store}}/MATCH`%q<game_id>`START`[ucstr(u(FN`GAME`OTHER,%q<game_winner>))]); &CLAIM`[u(FN`KEY,%q<game_winner_obj>)] {{store}}=%q<game_id>; @dolist/inline %q<game_a> %q<game_b>={@break comp(get({{store}}/IN`[u(FN`KEY,##)]),%q<game_id>); &IN`[u(FN`KEY,##)] {{store}}}; @pemit %q<game_winner_obj>=notice(NINEFOLD,You may take one card from [name(%q<game_loser_obj>)]'s hand: [itemize(iter(get({{store}}/MATCH`%q<game_id>`POOL),u(FN`CARD`NAME,before(%i0,:)),%b,|),|)]. +nf/claim <card> takes it.,info)
      INC`GAME`WIPE: |-
        @dolist/inline %q<game_a> %q<game_b>={@break comp(get({{store}}/IN`[u(FN`KEY,##)]),%q<game_id>); &IN`[u(FN`KEY,##)] {{store}}}; @wipe {{store}}/MATCH`%q<game_id>`**; &MATCH`%q<game_id> {{store}}

      # ---- changing what a player owns ----------------------------------------------------------
      # A player who has never had a card changed owns the starter set, read from the cards themselves. The
      # first change writes it down (STARTED`<player>), so a later change to the starter set leaves them be.
      # %<player> a player's key.
      INC`OWN`MATERIALIZE: |-
        @dolist/inline if(hasattr({{store}},STARTED`%<player>),,u(FN`CARD`STARTERS))={&OWN`%<player>`## {{store}}=get({{store}}/CARD`##`STARTER)}; &STARTED`%<player> {{store}}=firstof(get({{store}}/STARTED`%<player>),secs())
      # %<who> a player, %<card> a card, %<by> how many more (a negative number takes away), %<why> what for.
      INC`OWN`CHANGE: |-
        think setq(own_pk,u(FN`KEY,%<who>)); @include/args me/INC`OWN`MATERIALIZE=player,%q<own_pk>; think setq(own_now,max(0,add(u(FN`OWN`COUNT,%q<own_pk>,%<card>),%<by>))); &OWN`%q<own_pk>`%<card> {{store}}=if(%q<own_now>,%q<own_now>); @include/args me/INC`OWN`LOG=who,%<who>,card,%<card>,by,%<by>,why,%<why>
      INC`OWN`MOVE: |-
        think setq(move_pk,u(FN`KEY,%<from>)); @include/args me/INC`OWN`MATERIALIZE=player,%q<move_pk>; @break lt(u(FN`OWN`COUNT,%q<move_pk>,%<card>),1); @include/args me/INC`OWN`CHANGE=who,%<from>,card,%<card>,by,-1,why,lost in %<why>; @include/args me/INC`OWN`CHANGE=who,%<to>,card,%<card>,by,1,why,won in %<why>
      # LOG`<n>: WHEN, WHO (the player's objid), BY (who did it), CARD, CHANGE and WHY. Old entries are dropped
      # past DATA`CONFIG`LOGKEEP.
      INC`OWN`LOG: |-
        think setq(own_log,inc(get({{store}}/NEXTLOG))); &NEXTLOG {{store}}=%q<own_log>; &LOG`%q<own_log> {{store}}=%<card>; &LOG`%q<own_log>`WHEN {{store}}=secs(); &LOG`%q<own_log>`WHO {{store}}=objid(%<who>); &LOG`%q<own_log>`BY {{store}}=%:; &LOG`%q<own_log>`CHANGE {{store}}=%<by>; &LOG`%q<own_log>`WHY {{store}}=%<why>; think setq(own_cut,sub(%q<own_log>,v(DATA`CONFIG`LOGKEEP))); @dolist/inline squish(iter(lattr({{store}}/LOG`*),if(cand(isint(after(%i0,`)),lte(after(%i0,`),%q<own_cut>)),after(%i0,`))))={@wipe {{store}}/LOG`##`**; &LOG`## {{store}}}

      # ---- staff: cards -------------------------------------------------------------------------
      # /grant <player>=<card>[,<count>] and /revoke <player>=<card>[,<count>].
      INC`NF`GRANT: |-
        @include me/INC`NEED`STAFF; @include me/INC`NEED`HANDOUT; @include/args me/INC`OWN`CHANGE=who,%q<who_obj>,card,%q<card_id>,by,%q<card_count>,why,given by [name(%#)]; @pemit %#=notice(NINEFOLD,You give [name(%q<who_obj>)] [u(FN`COPIES`SENTENCE,%q<card_count>,%q<card_id>)]. They have [u(FN`OWN`COUNT,%q<who_key>,%q<card_id>)] now.,ok); @pemit %q<who_obj>=notice(NINEFOLD,[name(%#)] gives you [u(FN`COPIES`SENTENCE,%q<card_count>,%q<card_id>)].,info)
      INC`NF`REVOKE: |-
        @include me/INC`NEED`STAFF; @include me/INC`NEED`HANDOUT; @assert gte(setr(card_had,u(FN`OWN`COUNT,%q<who_key>,%q<card_id>)),%q<card_count>)=@pemit %#=notice(NINEFOLD,name(%q<who_obj>) has [u(FN`COPIES`SENTENCE,%q<card_had>,%q<card_id>)].,warn); @include/args me/INC`OWN`CHANGE=who,%q<who_obj>,card,%q<card_id>,by,-%q<card_count>,why,taken back by [name(%#)]; @pemit %#=notice(NINEFOLD,You take [u(FN`COPIES`SENTENCE,%q<card_count>,%q<card_id>)] back from [name(%q<who_obj>)]. They have [u(FN`OWN`COUNT,%q<who_key>,%q<card_id>)] now.,ok); @pemit %q<who_obj>=notice(NINEFOLD,[name(%#)] takes back [u(FN`COPIES`SENTENCE,%q<card_count>,%q<card_id>)].,info)
      INC`NEED`HANDOUT: |-
        think setqm(who_text,%q<cmd_lhs>,card_text,trim(before(%q<cmd_rhs>,%,)),card_count,if(strlen(trim(after(%q<cmd_rhs>,%,))),trim(after(%q<cmd_rhs>,%,)),1)); @assert %q<cmd_equals>=@pemit %#=notice(NINEFOLD,+nf/%q<cmd_action> <player>=<card>%[%,<count>%],warn); @include me/INC`NEED`PLAYER; @include me/INC`NEED`CARD; @assert cand(isint(%q<card_count>),gte(%q<card_count>,1),lte(%q<card_count>,99))=@pemit %#=notice(NINEFOLD,The count is a number from 1 to 99.,warn)
      # /new <name>=<top> <right> <bottom> <left>
      INC`NF`NEW: |-
        @include me/INC`NEED`STAFF; @assert %q<cmd_equals>=@pemit %#=notice(NINEFOLD,+nf/new <name>=<top> <right> <bottom> <left>%, each 1 to 9 or A.,warn); think setq(card_name,%q<cmd_lhs>); @include me/INC`NEED`NAME; @assert strlen(setr(card_values,u(FN`VALUES`PARSE,%q<cmd_rhs>)))=@pemit %#=notice(NINEFOLD,Give four edges%, top right bottom left%, each 1 to 9 or A: +nf/new %q<card_name>=5 3 7 2,warn); think setq(card_id,inc(get({{store}}/NEXTCARD))); &NEXTCARD {{store}}=%q<card_id>; &CARD`%q<card_id> {{store}}=%q<card_name>; @include me/INC`CARD`VALUES; &CARD`%q<card_id>`TIER {{store}}=u(FN`TIER`OF,%q<card_values>); @pemit %#=notice(NINEFOLD,Card %q<card_id> is [u(FN`CARD`NAME,%q<card_id>)]%, [u(FN`CARD`EDGES,%q<card_id>)]. +nf/set %q<card_id>/<field>=<value> changes it.,ok)
      # A card name from card_name: a few words, no | or `, not a number, and not another card's.
      INC`NEED`NAME: |-
        @assert cand(strlen(%q<card_name>),lte(strlen(%q<card_name>),30),not(isint(%q<card_name>)),not(pos(|,%q<card_name>)),not(pos(`,%q<card_name>)),not(pos(%,,%q<card_name>)))=@pemit %#=notice(NINEFOLD,A card name is up to 30 characters%, not a number%, without | or a comma.,warn); think setq(card_twin,u(FN`CARD`EXACT,%q<card_name>)); @assert cor(not(strlen(%q<card_twin>)),strmatch(%q<card_twin>,%q<card_id>))=@pemit %#=notice(NINEFOLD,Card %q<card_twin> is called %q<card_name> already.,warn)
      INC`CARD`VALUES: |-
        @dolist/inline TOP RIGHT BOTTOM LEFT={&CARD`%q<card_id>`## {{store}}=extract(%q<card_values>,#@,1)}
      # /set <card>/<field>=<value>
      INC`NF`SET: |-
        @include me/INC`NEED`STAFF; think setqm(card_text,before(%q<cmd_lhs>,/),card_field,lcstr(after(%q<cmd_lhs>,/))); @assert cand(pos(/,%q<cmd_lhs>),%q<cmd_equals>)=@pemit %#=notice(NINEFOLD,+nf/set <card>/<field>=<value>. The fields are [itemize(v(DATA`FIELDS))].,warn); @include me/INC`NEED`CARD; @assert member(v(DATA`FIELDS),%q<card_field>)=@pemit %#=notice(NINEFOLD,A card has no field %q<card_field>. The fields are [itemize(v(DATA`FIELDS))].,warn); @include me/INC`SET`[ucstr(%q<card_field>)]
      DATA`FIELDS: |-
        name short edges tier affinity starter image art ascii
      INC`SET`NAME: |-
        think setq(card_name,%q<cmd_rhs>); @include me/INC`NEED`NAME; think setq(card_old,u(FN`CARD`NAME,%q<card_id>)); &CARD`%q<card_id> {{store}}=%q<card_name>; @pemit %#=notice(NINEFOLD,Card %q<card_id>%, %q<card_old>%, is called %q<card_name> now.,ok)
      INC`SET`SHORT: |-
        @assert cand(lte(strlen(%q<cmd_rhs>),5),not(pos(|,%q<cmd_rhs>)))=@pemit %#=notice(NINEFOLD,The short name on the board is up to 5 characters. Leave it empty to use the first five letters of the name.,warn); &CARD`%q<card_id>`SHORT {{store}}=%q<cmd_rhs>; @pemit %#=notice(NINEFOLD,[u(FN`CARD`NAME,%q<card_id>)] shows as [u(FN`CARD`SHORT,%q<card_id>)] on the board.,ok)
      INC`SET`EDGES: |-
        @assert strlen(setr(card_values,u(FN`VALUES`PARSE,%q<cmd_rhs>)))=@pemit %#=notice(NINEFOLD,Give four edges%, top right bottom left%, each 1 to 9 or A: +nf/set %q<card_id>/edges=5 3 7 2,warn); @include me/INC`CARD`VALUES; @pemit %#=notice(NINEFOLD,[u(FN`CARD`NAME,%q<card_id>)] is [u(FN`CARD`EDGES,%q<card_id>)] now.,ok)
      INC`SET`TIER: |-
        @assert cand(isint(%q<cmd_rhs>),gte(%q<cmd_rhs>,1),lte(%q<cmd_rhs>,5))=@pemit %#=notice(NINEFOLD,A tier is 1 to 5.,warn); &CARD`%q<card_id>`TIER {{store}}=%q<cmd_rhs>; @pemit %#=notice(NINEFOLD,[u(FN`CARD`NAME,%q<card_id>)] is tier %q<cmd_rhs> now.,ok)
      INC`SET`AFFINITY: |-
        think setq(card_aff,lcstr(%q<cmd_rhs>)); @assert cor(not(strlen(%q<card_aff>)),strmatch(%q<card_aff>,none),member(v(DATA`AFFINITIES),%q<card_aff>))=@pemit %#=notice(NINEFOLD,An affinity is one of [itemize(v(DATA`AFFINITIES))]%, or none.,warn); &CARD`%q<card_id>`AFFINITY {{store}}=if(strmatch(%q<card_aff>,none),,%q<card_aff>); @pemit %#=notice(NINEFOLD,[u(FN`CARD`NAME,%q<card_id>)] has [if(strlen(u(FN`CARD`AFFINITY,%q<card_id>)),the affinity [u(FN`CARD`AFFINITY,%q<card_id>)],no affinity)] now.,ok)
      INC`SET`STARTER: |-
        @assert cor(not(strlen(%q<cmd_rhs>)),cand(isint(%q<cmd_rhs>),gte(%q<cmd_rhs>,0),lte(%q<cmd_rhs>,9)))=@pemit %#=notice(NINEFOLD,How many copies a new player starts with: 0 to 9.,warn); &CARD`%q<card_id>`STARTER {{store}}=if(%q<cmd_rhs>,%q<cmd_rhs>); @pemit %#=notice(NINEFOLD,if(%q<cmd_rhs>,New players start with [u(FN`COPIES`SENTENCE,%q<cmd_rhs>,%q<card_id>)].,[u(FN`CARD`NAME,%q<card_id>)] is not in the starter set now.),ok)
      INC`SET`IMAGE: |-
        @assert cor(not(strlen(%q<cmd_rhs>)),u(FN`IMAGE`VALID,%q<cmd_rhs>))=@pemit %#=notice(NINEFOLD,A picture is an https:// address or a path on this game such as /api/wiki-assets/...,warn); &CARD`%q<card_id>`IMAGE {{store}}=%q<cmd_rhs>; @pemit %#=notice(NINEFOLD,if(strlen(%q<cmd_rhs>),[u(FN`CARD`NAME,%q<card_id>)]'s picture is %q<cmd_rhs> now.,[u(FN`CARD`NAME,%q<card_id>)] has no picture now.),ok)
      # The art as typed, %r between lines, kept as written: no more lines or characters than the art box holds.
      INC`SET`ART: |-
        @assert u(FN`ART`VALID,%q<cmd_rhs>)=@pemit %#=notice(NINEFOLD,u(FN`ART`LIMIT),warn); &CARD`%q<card_id>`ART {{store}}=%q<cmd_rhs>; @pemit %#=notice(NINEFOLD,[u(FN`CARD`NAME,%q<card_id>)] has new art:,ok); @pemit %#=u(FN`SCREEN`CARD,%q<card_id>,%#)
      # The art a client without UTF-8 is sent instead, line for line: printable ASCII only. Empty sends the art
      # itself, its characters folded to ASCII.
      INC`SET`ASCII: |-
        @assert u(FN`ART`VALID,%q<cmd_rhs>)=@pemit %#=notice(NINEFOLD,u(FN`ART`LIMIT),warn); @assert u(FN`ART`ASCII,%q<cmd_rhs>)=@pemit %#=notice(NINEFOLD,The ASCII art uses only the characters on a US keyboard.,warn); &CARD`%q<card_id>`ART`ASCII {{store}}=%q<cmd_rhs>; @pemit %#=notice(NINEFOLD,if(strlen(%q<cmd_rhs>),[u(FN`CARD`NAME,%q<card_id>)] has new ASCII art.,[u(FN`CARD`NAME,%q<card_id>)]'s art is folded to ASCII for clients without UTF-8 now.),ok)
      # /delete <card> says what would go; /delete <card>=yes removes it and every copy players hold.
      INC`NF`DELETE: |-
        @include me/INC`NEED`STAFF; think setq(card_text,%q<cmd_lhs>); @include me/INC`NEED`CARD; @assert not(u(FN`CARD`INPLAY,%q<card_id>))=@pemit %#=notice(NINEFOLD,[u(FN`CARD`NAME,%q<card_id>)] is in a game now. Delete it when the game is over.,warn); think setq(card_holders,u(FN`CARD`HOLDERS,%q<card_id>)); @assert strmatch(%q<cmd_rhs>,yes)=@pemit %#=notice(NINEFOLD,This removes [u(FN`CARD`NAME,%q<card_id>)][case(words(%q<card_holders>),0,%, which nobody holds,1,%band the copies 1 player holds,%band the copies [words(%q<card_holders>)] players hold)]. +nf/delete %q<card_id>=yes to go ahead.,warn); @dolist/inline %q<card_holders>={&OWN`##`%q<card_id> {{store}}}; think setq(card_old,u(FN`CARD`NAME,%q<card_id>)); @wipe {{store}}/CARD`%q<card_id>`**; &CARD`%q<card_id> {{store}}; @pemit %#=notice(NINEFOLD,Card %q<card_id>%, %q<card_old>%, is gone.,ok)
      INC`NF`LOG: |-
        @include me/INC`NEED`STAFF; @break not(strlen(%q<cmd_arg>))={@pemit %#=u(FN`SCREEN`LOG,)}; think setq(who_text,%q<cmd_arg>); @include me/INC`NEED`PLAYER; @pemit %#=u(FN`SCREEN`LOG,objid(%q<who_obj>))
      INC`NF`GAMES: |-
        @include me/INC`NEED`STAFF; @pemit %#=u(FN`SCREEN`GAMES)
      # /end <game> stops a game without paying its stakes.
      INC`NF`END: |-
        @include me/INC`NEED`STAFF; @assert cand(isint(%q<cmd_arg>),hasattr({{store}},MATCH`%q<cmd_arg>))=@pemit %#=notice(NINEFOLD,There is no game %q<cmd_arg>. +nf/games lists them.,warn); think u(FN`GAME`LOAD,setr(game_id,%q<cmd_arg>),%#); @pemit/list %q<game_a> %q<game_b>=notice(NINEFOLD,[name(%#)] ends the game. Nobody wins or loses a card.,info); @include me/INC`GAME`WIPE; @dolist/inline u(FN`GAME`CLAIMS,%q<game_id>)={&## {{store}}}; @pemit %#=notice(NINEFOLD,Game %q<game_id> is ended.,ok)

      # ---- staff: rule sets and where they apply ------------------------------------------------
      # RULESET`<KEY> is a rule set's title, with RULES (rule words), STAKES and MODE (replace or add, for an
      # event) under it. DEFAULT is the rule set played where nothing else applies. WHERE`ROOM`<room> and
      # WHERE`ZONE`<zone> name the rule set for a room and for the rooms in a zone. EVENT is the rule set of a
      # game-wide event, until EVENT`UNTIL (0 for until it is ended).
      INC`NF`RULESETS: |-
        @include me/INC`NEED`STAFF; @pemit %#=u(FN`SCREEN`RULESETS)
      # /ruleset <key> shows one; /ruleset <key>=<title> makes or renames it; /ruleset <key>/<field>=<value>
      # changes rules, stakes or mode; /ruleset <key>/delete=yes removes it.
      INC`NF`RULESET: |-
        @include me/INC`NEED`STAFF; think setqm(set_text,before(%q<cmd_lhs>,/),set_field,lcstr(after(%q<cmd_lhs>,/))); @break cand(not(pos(/,%q<cmd_lhs>)),%q<cmd_equals>)={@include me/INC`RULESET`TITLE}; @include me/INC`NEED`SET; @break not(pos(/,%q<cmd_lhs>))={@pemit %#=u(FN`SCREEN`RULESET,%q<set_key>)}; @assert member(rules stakes mode delete,%q<set_field>)=@pemit %#=notice(NINEFOLD,A rule set has rules%, stakes and mode. +nf/ruleset %q<set_text>/rules=twin balance,warn); @include me/INC`RULESET`%q<set_field>
      INC`RULESET`TITLE: |-
        @assert u(FN`SET`KEYOK,%q<set_text>)=@pemit %#=notice(NINEFOLD,A rule set's key is one word of letters%, digits%, - and _%, up to 20.,warn); @assert cand(strlen(%q<cmd_rhs>),lte(strlen(%q<cmd_rhs>),40),not(pos(|,%q<cmd_rhs>)))=@pemit %#=notice(NINEFOLD,Give it a title of up to 40 characters%, without |.,warn); think setqm(set_key,ucstr(%q<set_text>),set_new,not(u(FN`SET`EXISTS,ucstr(%q<set_text>)))); &RULESET`%q<set_key> {{store}}=%q<cmd_rhs>; @break %q<set_new>={&RULESET`%q<set_key>`STAKES {{store}}=friendly; &RULESET`%q<set_key>`MODE {{store}}=replace; @pemit %#=notice(NINEFOLD,Rule set [lcstr(%q<set_key>)]%, %q<cmd_rhs>%, is made: no rules%, friendly. +nf/ruleset [lcstr(%q<set_key>)]/rules=<rules> gives it rules.,ok)}; @pemit %#=notice(NINEFOLD,Rule set [lcstr(%q<set_key>)] is called %q<cmd_rhs> now.,ok)
      INC`RULESET`RULES: |-
        think setq(set_rules,lcstr(squish(edit(%q<cmd_rhs>,%,,%b)))); @assert every(FN`RULE`KNOWN,%q<set_rules>,%b,set_bad)=@pemit %#=notice(NINEFOLD,There is no rule %q<set_bad>. The rules are [itemize(v(DATA`RULES))].,warn); &RULESET`%q<set_key>`RULES {{store}}=u(FN`RULES`ORDER,%q<set_rules>); @pemit %#=notice(NINEFOLD,[u(FN`SET`TITLE,%q<set_key>)] plays [u(FN`RULES`NAMES,get({{store}}/RULESET`%q<set_key>`RULES))] now.,ok)
      INC`RULESET`STAKES: |-
        @assert member(v(DATA`STAKES),lcstr(%q<cmd_rhs>))=@pemit %#=notice(NINEFOLD,Stakes are [itemize(v(DATA`STAKES),%b,or)].,warn); &RULESET`%q<set_key>`STAKES {{store}}=lcstr(%q<cmd_rhs>); @pemit %#=notice(NINEFOLD,[u(FN`SET`TITLE,%q<set_key>)] is played for [u(FN`STAKES`NAME,lcstr(%q<cmd_rhs>))] stakes now.,ok)
      INC`RULESET`MODE: |-
        @assert member(replace add,lcstr(%q<cmd_rhs>))=@pemit %#=notice(NINEFOLD,The mode says what the rule set does as an event: replace the local rules%, or add its rules to them.,warn); &RULESET`%q<set_key>`MODE {{store}}=lcstr(%q<cmd_rhs>); @pemit %#=notice(NINEFOLD,As an event%, [u(FN`SET`TITLE,%q<set_key>)] [if(strmatch(lcstr(%q<cmd_rhs>),add),adds its rules to the local ones,replaces the local rules)] now.,ok)
      INC`RULESET`DELETE: |-
        @assert comp(get({{store}}/DEFAULT),%q<set_key>)=@pemit %#=notice(NINEFOLD,[u(FN`SET`TITLE,%q<set_key>)] is the default rule set. +nf/default <rule set> picks another first.,warn); @assert comp(u(FN`EVENT`LIVE),%q<set_key>)=@pemit %#=notice(NINEFOLD,[u(FN`SET`TITLE,%q<set_key>)] is the running event. +nf/event none ends it first.,warn); think setq(set_places,u(FN`SET`PLACES,%q<set_key>)); @assert strmatch(%q<cmd_rhs>,yes)=@pemit %#=notice(NINEFOLD,This removes [u(FN`SET`TITLE,%q<set_key>)][if(words(%q<set_places>),%band the [u(FN`PLURAL,words(%q<set_places>),room or zone,rooms and zones)] it applies to)]. +nf/ruleset [lcstr(%q<set_key>)]/delete=yes to go ahead.,warn); @dolist/inline %q<set_places>={&## {{store}}}; think setq(set_old,u(FN`SET`TITLE,%q<set_key>)); @wipe {{store}}/RULESET`%q<set_key>`**; &RULESET`%q<set_key> {{store}}; @pemit %#=notice(NINEFOLD,Rule set %q<set_old> is gone.,ok)
      # /zone <zone>=<rule set> and /room <room>=<rule set>; an empty rule set clears it.
      INC`NF`ZONE: |-
        @include/args me/INC`WHERE`SET=kind,ZONE
      INC`NF`ROOM: |-
        @include/args me/INC`WHERE`SET=kind,ROOM
      INC`WHERE`SET: |-
        @include me/INC`NEED`STAFF; @assert %q<cmd_equals>=@pemit %#=notice(NINEFOLD,+nf/[lcstr(%<kind>)] <[lcstr(%<kind>)]>=<rule set>%, or nothing after = to clear it.,warn); @assert isdbref(setr(set_obj,locate(%#,%q<cmd_lhs>,*)))=@pemit %#=notice(NINEFOLD,There is nothing called %q<cmd_lhs> here. A dbref such as #123 finds it anywhere.,warn); @assert cor(strmatch(%<kind>,ZONE),hastype(%q<set_obj>,room))=@pemit %#=notice(NINEFOLD,name(%q<set_obj>) is not a room.,warn); @break not(strlen(%q<cmd_rhs>))={&WHERE`%<kind>`[u(FN`KEY,%q<set_obj>)] {{store}}; @pemit %#=notice(NINEFOLD,[name(%q<set_obj>)] has no rule set of its own now.,ok)}; think setq(set_text,%q<cmd_rhs>); @include me/INC`NEED`SET; &WHERE`%<kind>`[u(FN`KEY,%q<set_obj>)] {{store}}=%q<set_key>; @pemit %#=notice(NINEFOLD,Games [if(strmatch(%<kind>,ZONE),in rooms of the zone,in)] [name(%q<set_obj>)] play [u(FN`SET`TITLE,%q<set_key>)] now.,ok)
      INC`NF`DEFAULT: |-
        @include me/INC`NEED`STAFF; think setq(set_text,%q<cmd_arg>); @include me/INC`NEED`SET; &DEFAULT {{store}}=%q<set_key>; @pemit %#=notice(NINEFOLD,Where nothing else applies%, games play [u(FN`SET`TITLE,%q<set_key>)] now.,ok)
      # /event shows the event; /event <rule set>[=<how long>] starts one; /event none ends it.
      INC`NF`EVENT: |-
        @include me/INC`NEED`STAFF; @break not(strlen(%q<cmd_lhs>))={@pemit %#=notice(NINEFOLD,u(FN`EVENT`SENTENCE),info)}; @break strmatch(%q<cmd_lhs>,none)={&EVENT {{store}}; &EVENT`UNTIL {{store}}; @pemit %#=notice(NINEFOLD,There is no event now.,ok)}; think setq(set_text,%q<cmd_lhs>); @include me/INC`NEED`SET; @assert cor(not(strlen(%q<cmd_rhs>)),strlen(setr(set_for,u(FN`DURATION`PARSE,%q<cmd_rhs>))))=@pemit %#=notice(NINEFOLD,How long: a number with m%, h or d%, such as 3h or 2d. Leave it out to run until +nf/event none.,warn); &EVENT {{store}}=%q<set_key>; &EVENT`UNTIL {{store}}=if(strlen(%q<cmd_rhs>),add(secs(),%q<set_for>),0); @pemit %#=notice(NINEFOLD,u(FN`EVENT`SENTENCE),ok)

  # The functions. They read the store and the game_ registers a command loads; FN`SCREEN` draws what a
  # command shows.
  #
  # FN`CARD` one card, FN`OWN` what a player owns, FN`DECK` and FN`DEAL` hands, FN`GAME` a game, FN`BOARD`
  # and FN`PLACE` the board and what a card takes, FN`RULES` and FN`SET` rule sets, FN`SCREEN` screens.
  - ref: ninefold_functions
    type: thing
    name: Ninefold Functions
    location: "{{ninefold}}"
    flags: [NO_COMMAND]
    attributes:
      # ---- small things -------------------------------------------------------------------------
      # A player or object as the key its records use: #12:1795 is 12`1795.
      FN`KEY: |-
        edit(after(objid(%0),#),:,`)
      # An edge as it is shown: 10 is A.
      FN`SHOW: |-
        if(eq(%0,10),A,%0)
      FN`PLURAL: |-
        %0 [if(eq(%0,1),%1,%2)]
      # A number of seconds in words.
      FN`DURATION: |-
        cond(gte(%0,86400),u(FN`PLURAL,round(fdiv(%0,86400),0),day,days),gte(%0,3600),u(FN`PLURAL,round(fdiv(%0,3600),0),hour,hours),1,u(FN`PLURAL,max(1,round(fdiv(%0,60),0)),minute,minutes))
      # A length of time as typed (90m, 3h, 2d, or a number of hours): seconds, or nothing.
      FN`DURATION`PARSE: |-
        setqm(dp_unit,if(isint(%0),h,lcstr(right(%0,1))),dp_n,if(isint(%0),%0,left(%0,dec(strlen(%0)))))[if(cand(isint(%q<dp_n>),gt(%q<dp_n>,0),member(m h d,%q<dp_unit>)),mul(%q<dp_n>,switch(%q<dp_unit>,m,60,h,3600,86400)))]
      FN`COPIES`SENTENCE: |-
        u(FN`PLURAL,%0,copy,copies) of [u(FN`CARD`NAME,%1)]

      # ---- one card -----------------------------------------------------------------------------
      # CARD`<n> is a card's name, with SHORT (the name on the board, 5 letters), TOP RIGHT BOTTOM LEFT (its
      # edges, 1 to 10), TIER (1 to 5), AFFINITY, STARTER (copies a new player starts with), IMAGE (a picture's
      # address) and ART (lines of text art) under it. The number never changes, so a rename breaks nothing.
      FN`CARD`IDS: |-
        sort(iter(lattr({{store}}/CARD`*),after(%i0,`)),n)
      FN`CARD`EXISTS: |-
        cand(isint(%0),hasattr({{store}},CARD`%0))
      FN`CARD`NAME: |-
        get({{store}}/CARD`%0)
      FN`CARD`SHORT: |-
        firstof(get({{store}}/CARD`%0`SHORT),left(get({{store}}/CARD`%0),5))
      # %0 a card, %1 an edge: 1 top, 2 right, 3 bottom, 4 left.
      FN`CARD`SIDE: |-
        firstof(get({{store}}/CARD`%0`[extract(TOP RIGHT BOTTOM LEFT,%1,1)]),1)
      FN`CARD`AFFINITY: |-
        get({{store}}/CARD`%0`AFFINITY)
      FN`CARD`TIER: |-
        firstof(get({{store}}/CARD`%0`TIER),1)
      FN`CARD`TOTAL: |-
        add(u(FN`CARD`SIDE,%0,1),u(FN`CARD`SIDE,%0,2),u(FN`CARD`SIDE,%0,3),u(FN`CARD`SIDE,%0,4))
      # The edges in a sentence, and in the short form tables use: T7 R3 B2 L5.
      FN`CARD`EDGES: |-
        top [u(FN`SHOW,u(FN`CARD`SIDE,%0,1))], right [u(FN`SHOW,u(FN`CARD`SIDE,%0,2))], bottom [u(FN`SHOW,u(FN`CARD`SIDE,%0,3))], left [u(FN`SHOW,u(FN`CARD`SIDE,%0,4))]
      FN`CARD`CROSS: |-
        T[u(FN`SHOW,u(FN`CARD`SIDE,%0,1))] R[u(FN`SHOW,u(FN`CARD`SIDE,%0,2))] B[u(FN`SHOW,u(FN`CARD`SIDE,%0,3))] L[u(FN`SHOW,u(FN`CARD`SIDE,%0,4))]
      # A card by its number, its whole name, or the start of one name only.
      FN`CARD`FIND: |-
        cond(u(FN`CARD`EXISTS,%0),%0,strlen(setr(cf_id,u(FN`CARD`EXACT,%0))),%q<cf_id>,1,u(FN`CARD`PREFIX,%0))
      FN`CARD`EXACT: |-
        first(squish(iter(u(FN`CARD`IDS),if(not(comp(lcstr(get({{store}}/CARD`%i0)),lcstr(%0))),%i0))))
      FN`CARD`PREFIX: |-
        setq(cp_ids,squish(iter(u(FN`CARD`IDS),if(u(FN`NAME`STARTS,lcstr(get({{store}}/CARD`%i0)),lcstr(%0)),%i0))))[if(eq(words(%q<cp_ids>),1),%q<cp_ids>)]
      # 1 when name %0 starts with %1, or has a word that does: "beetle" finds Brass Beetle.
      FN`NAME`STARTS: |-
        cor(eq(pos(%1,%0),1),gt(pos(%b%1,%0),0))
      # Why FN`CARD`FIND found nothing for %0: no such card, or a name that fits several.
      FN`CARD`MISSING: |-
        setq(cm_ids,squish(iter(u(FN`CARD`IDS),if(u(FN`NAME`STARTS,lcstr(get({{store}}/CARD`%i0)),lcstr(%0)),%i0))))[if(gt(words(%q<cm_ids>),1),%0 could be [itemize(iter(%q<cm_ids>,u(FN`CARD`NAME,%i0),%b,|),|,or)]. Give more of its name or its number.,There is no card called %0.)]
      FN`CARD`STARTERS: |-
        squish(iter(u(FN`CARD`IDS),if(gt(firstof(get({{store}}/CARD`%i0`STARTER),0),0),%i0)))
      # The keys of the players who have written-down copies of card %0.
      FN`CARD`HOLDERS: |-
        squish(iter(lattr({{store}}/OWN`*`*`%0),extract(%i0,2,2,`)))
      # 1 when card %0 is in a hand or on the board of a game.
      FN`CARD`INPLAY: |-
        words(squish(iter(lattr({{store}}/MATCH`**),if(cor(member(get({{store}}/%i0),%0:a),member(get({{store}}/%i0),%0:b)),%i0))))
      # Four edges as typed (1 to 9 or A, top right bottom left): the numbers, or nothing.
      FN`VALUES`PARSE: |-
        setq(vp_values,iter(%0,switch(lcstr(%i0),a,10,%i0)))[if(cand(eq(words(%q<vp_values>),4),every(FN`VALUE`OK,%q<vp_values>)),%q<vp_values>)]
      FN`VALUE`OK: |-
        cand(isint(%0),gte(%0,1),lte(%0,10))
      FN`TIER`OF: |-
        setq(to_total,ladd(%0))[cond(lte(%q<to_total>,13),1,lte(%q<to_total>,17),2,lte(%q<to_total>,21),3,lte(%q<to_total>,25),4,1,5)]
      FN`ART`VALID: |-
        cand(lte(words(%0,%r),v(DATA`CONFIG`ARTHEIGHT)),not(words(squish(iter(%0,if(gt(strlen(%i0),v(DATA`CONFIG`ARTWIDTH)),x),%r)))))
      FN`ART`ASCII: |-
        not(words(squish(iter(%0,if(regmatch(%i0,^\[ -~\]*$),,x),%r))))
      FN`ART`LIMIT: |-
        Card art is at most [v(DATA`CONFIG`ARTHEIGHT)] lines of [v(DATA`CONFIG`ARTWIDTH)] characters%, %%r between lines.
      FN`IMAGE`VALID: |-
        cand(eq(words(%0),1),cor(strmatch(%0,https://*),strmatch(%0,http://*),strmatch(%0,/*)))

      # ---- what a player owns -------------------------------------------------------------------
      # OWN`<player>`<card> is how many copies a player has. A player with no STARTED`<player> has never had a
      # card changed and owns the starter set as the cards say now.
      FN`OWN`COUNT: |-
        if(hasattr({{store}},STARTED`%0),firstof(get({{store}}/OWN`%0`%1),0),firstof(get({{store}}/CARD`%1`STARTER),0))
      FN`OWN`CARDS: |-
        squish(iter(u(FN`CARD`IDS),if(gt(u(FN`OWN`COUNT,%0,%i0),0),%i0)))
      # Every copy: a card owned twice is in the list twice.
      FN`OWN`COPIES: |-
        squish(iter(u(FN`OWN`CARDS,%0),repeat(%i0%b,u(FN`OWN`COUNT,%0,%i0))))

      # ---- hands --------------------------------------------------------------------------------
      # A hand as typed, cards between commas: their numbers. card_bad is the first that names no card.
      FN`DECK`PARSE: |-
        setq(card_bad,)[squish(iter(%0,u(FN`DECK`ONE,trim(%i0)),%,,%b))]
      FN`DECK`ONE: |-
        setq(dk_id,u(FN`CARD`FIND,%0))[if(strlen(%q<dk_id>),%q<dk_id>,setq(card_bad,firstof(%q<card_bad>,%0)))]
      # 1 when player %0 has a copy for every card in %1; card_short is a card they have too few of.
      FN`DECK`AFFORD: |-
        setq(card_short,first(squish(iter(setunion(%1,),if(gt(words(graball(%1,%i0)),u(FN`OWN`COUNT,%0,%i0)),%i0)))))[not(strlen(%q<card_short>))]
      # The five cards a player plays: the hand they chose, as far as they still own it, then their strongest.
      FN`DECK`HAND: |-
        setqm(dh_copies,u(FN`OWN`COPIES,%0),dh_hand,)[null(iter(get({{store}}/DECK`%0),u(FN`DECK`TAKE,%i0)))][extract(squish(%q<dh_hand> [revwords(sortkey(FN`CARD`TOTAL,%q<dh_copies>,n))]),1,5)]
      FN`DECK`TAKE: |-
        if(member(%q<dh_copies>,%0),setq(dh_hand,%q<dh_hand> %0)[setq(dh_copies,ldelete(%q<dh_copies>,member(%q<dh_copies>,%0)))])
      # %0 a player's key, %1 their side, %2 the rules: their hand for a game, each card <card>:<side>.
      FN`DEAL`HAND: |-
        iter(if(member(%2,blind),extract(shuffle(u(FN`OWN`COPIES,%0)),1,5),u(FN`DECK`HAND,%0)),%i0:%1)
      # Under Overtime: the cards of side %0's colour on the board, and what is left in their hand.
      FN`OVERTIME`HAND: |-
        squish(iter(lnum(1,9),if(strmatch(extract(%q<game_owners>,%i0,1),%0),extract(%q<game_cards>,%i0,1))) [get({{store}}/MATCH`%q<game_id>`HAND`[ucstr(%0)])])
      # %0 a hand, %1 what was typed: the place in the hand of the card it names, or nothing.
      FN`HAND`FIND: |-
        cond(cand(isint(%1),gte(%1,1),lte(%1,words(%0))),%1,strlen(setr(hf_at,u(FN`HAND`EXACT,%0,lcstr(%1)))),%q<hf_at>,1,u(FN`HAND`PREFIX,%0,lcstr(%1)))
      FN`HAND`EXACT: |-
        first(squish(iter(%0,if(not(comp(lcstr(u(FN`CARD`NAME,before(%i0,:))),%1)),inum(0)))))
      FN`HAND`PREFIX: |-
        setq(hp_at,squish(iter(%0,if(u(FN`NAME`STARTS,lcstr(u(FN`CARD`NAME,before(%i0,:))),%1),inum(0)))))[if(eq(words(setunion(iter(%q<hp_at>,before(extract(%0,%i0,1),:)),)),1),first(%q<hp_at>))]

      # ---- a game -------------------------------------------------------------------------------
      # %0 a game: 1 while it is being played, or while its challenge has not lapsed.
      FN`GAME`LIVE: |-
        switch(get({{store}}/MATCH`%0),playing,1,invited,lt(sub(secs(),get({{store}}/MATCH`%0`WHEN)),firstof(get({{store}}/MATCH`%0`LIFE),v(DATA`CONFIG`CHALLENGE))),0)
      # %0 a player's key: the game they are in, or nothing.
      FN`GAME`OF: |-
        setq(go_id,get({{store}}/IN`%0))[if(cand(strlen(%q<go_id>),u(FN`GAME`LIVE,%q<go_id>)),%q<go_id>)]
      FN`GAME`OTHER: |-
        if(strmatch(%0,a),b,a)
      FN`GAME`PLAYER: |-
        get({{store}}/MATCH`%q<game_id>`[ucstr(%0)])
      # Loads game %0 into the game_ registers, as player %1 sees it.
      FN`GAME`LOAD: |-
        setqm(game_id,%0,
          game_state,get({{store}}/MATCH`%0),
          game_a,get({{store}}/MATCH`%0`A),
          game_b,get({{store}}/MATCH`%0`B),
          game_side,if(strmatch(objid(%1),%q<game_a>),a,b),
          game_turn,get({{store}}/MATCH`%0`TURN),
          game_rules,get({{store}}/MATCH`%0`RULES),
          game_stakes,firstof(get({{store}}/MATCH`%0`STAKES),friendly),
          game_title,get({{store}}/MATCH`%0`TITLE),
          game_hand_a,get({{store}}/MATCH`%0`HAND`A),
          game_hand_b,get({{store}}/MATCH`%0`HAND`B),
          game_hand,if(strmatch(%q<game_side>,a),%q<game_hand_a>,%q<game_hand_b>),
          game_cards,iter(lnum(1,9),firstof(get({{store}}/MATCH`%0`SQ`%i0),-)),
          game_owners,iter(lnum(1,9),firstof(get({{store}}/MATCH`%0`SQ`%i0`OWNER),-)),
          game_terrain,iter(lnum(1,9),firstof(get({{store}}/MATCH`%0`TERRAIN`%i0),-)))
      # A side's score: the cards of its colour on the board and the cards left in its hand.
      FN`GAME`SCORE: |-
        add(words(graball(%q<game_owners>,%0)),words(if(strmatch(%0,a),%q<game_hand_a>,%q<game_hand_b>)))
      FN`GAME`CLAIMS: |-
        squish(iter(lattr({{store}}/CLAIM`**),if(not(comp(get({{store}}/%i0),%0)),%i0)))

      # ---- the board ----------------------------------------------------------------------------
      # Squares are 1 to 9, left to right from the top. Edges are 1 top, 2 right, 3 bottom, 4 left.
      FN`BOARD`FILLED: |-
        squish(iter(lnum(1,9),if(strmatch(extract(%q<game_cards>,%i0,1),-),,%i0)))
      # The squares whose card shows the other player's colour from the one it came from.
      FN`BOARD`TURNED: |-
        squish(iter(u(FN`BOARD`FILLED),if(strmatch(after(extract(%q<game_cards>,%i0,1),:),extract(%q<game_owners>,%i0,1)),,%i0)))
      # %0 a square, %1 an edge: the square beyond it, or 0 at the board's edge.
      FN`BOARD`NEXT: |-
        switch(%1,1,if(gt(%0,3),sub(%0,3),0),2,if(mod(%0,3),inc(%0),0),3,if(lt(%0,7),add(%0,3),0),if(eq(mod(%0,3),1),0,dec(%0)))
      FN`BOARD`OPPOSITE: |-
        inc(mod(inc(%0),4))
      # %0 a square, %1 an edge: the card's edge there, with the square's terrain, or 0 for no card.
      FN`BOARD`VALUE: |-
        setq(bv_item,extract(%q<game_cards>,%0,1))[if(strmatch(%q<bv_item>,-),0,max(1,min(10,add(u(FN`CARD`SIDE,before(%q<bv_item>,:),%1),u(FN`TERRAIN`SHIFT,%0,before(%q<bv_item>,:))))))]
      # %0 a square, %1 a card: 1 when the square's affinity is the card's, -1 when it is another, 0 for none.
      FN`TERRAIN`SHIFT: |-
        setq(ts_aff,extract(%q<game_terrain>,%0,1))[if(strmatch(%q<ts_aff>,-),0,if(strmatch(u(FN`CARD`AFFINITY,%1),%q<ts_aff>),1,-1))]

      # ---- what a card takes --------------------------------------------------------------------
      # %0 the square just played, %1 its side. Changes game_owners and leaves what it took in pl_special
      # (by Twin or Balance, named in ps_kind), pl_basic (by a higher edge) and pl_cascade.
      FN`PLACE`RESULT: |-
        setq(pl_special,u(FN`PLACE`SPECIAL,%0,%1))[u(FN`OWNERS`SET,%q<pl_special>,%1)][setq(pl_basic,u(FN`PLACE`BASIC,%0,%1))][u(FN`OWNERS`SET,%q<pl_basic>,%1)][setq(pl_cascade,if(member(%q<game_rules>,cascade),u(FN`PLACE`CASCADE,%q<pl_special>,%1)))]
      # The other side's cards that square %0 beats edge to edge.
      FN`PLACE`BASIC: |-
        squish(iter(1 2 3 4,u(FN`PLACE`BEATS,%0,%i0,%1)))
      FN`PLACE`BEATS: |-
        setq(pb_next,u(FN`BOARD`NEXT,%0,%1))[if(cand(%q<pb_next>,strmatch(extract(%q<game_owners>,%q<pb_next>,1),u(FN`GAME`OTHER,%2)),gt(u(FN`BOARD`VALUE,%0,%1),u(FN`BOARD`VALUE,%q<pb_next>,u(FN`BOARD`OPPOSITE,%1)))),%q<pb_next>)]
      FN`PLACE`SPECIAL: |-
