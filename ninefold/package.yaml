  # Routes on the HTTP handler, as children of http-handler's GET and POST verbs. The ninefold-app package reads
  # /http/ninefold/schema and /http/ninefold/data with ?at= set to the address after /apps/ninefold/, and posts
  # to /http/ninefold/act. %<viewer> is the character the portal signed in as. The handler must be WIZARD (the
  # seeded one is) to @force the Ninefold object, which does the work so its "Set." lines never reach the
  # response. Each POST puts %<body> in %q<body>: a forced command's arguments lose a value's outer braces.
  - ref: routes
    target: "{{$http_handler}}"
    attributes:
      GET`NINEFOLD`SCHEMA: |-
        @respond/type application/json; think uargs({{ninefold}}/WEB`SCHEMA,viewer,%<viewer>,at,%q<form.at>)
      GET`NINEFOLD`DATA: |-
        @respond/type application/json; think uargs({{ninefold}}/WEB`DATA,viewer,%<viewer>,at,%q<form.at>)
      POST`NINEFOLD`ACT: |-
        think setq(body,%<body>,act_at,%q<form.at>); @force {{ninefold}}=@include/args/nobreak {{ninefold}}/WEB`ACT=viewer,%<viewer>; @respond/type application/json; think %q<web_response>

  # The +help topics, on a plain thing: the librarian cannot u() a privileged object's attributes. Bodies are
  # evaluated, so brackets and percent signs are escaped.
  - ref: ninefold_help
    type: thing
    name: Ninefold Help
    location: "{{ninefold}}"
    attributes:
      HELP: |-
        Ninefold: a card game for two on a board of nine squares.
      HELP`NINEFOLD: |-
        **Ninefold** is a card game for two, in the spirit of the card games tucked inside classic JRPGs. Each
        player brings a hand of five cards. A card has four edges, top, right, bottom and left, each 1 to 10
        (10 is shown as A).

        Players take turns putting a card on an empty square of a three-by-three board. A card takes every
        touching card of the other player's colour whose facing edge is lower: it turns to the player's colour.
        When the board is full, each player scores the cards of their colour on the board and the one left in
        their hand. The higher score wins.

        - `+nf/challenge <player>` challenges someone in the room. They answer `+nf/accept` or `+nf/decline`,
          and you can take it back with `+nf/withdraw`. The player who accepts goes first.
        - `+nf` or `+nf/board` shows the game: the board, the score, the rules and your hand.
        - `+nf/play <card>=<square>` puts a card down. Give the card by its number in your hand or its name.
          Squares are 1 to 9, left to right from the top.
        - `+nf/forfeit` gives the game up. The other player wins.

        `+ninefold` is the same command as `+nf`.

        Example:

        `+nf/play 2=5`

        Output: `\[NINEFOLD\] Ann plays Kiln Hound on square 5. It takes Hollow Crow.`
      HELP`NINEFOLD`BOARD: |-
        On the board each card shows the player whose colour it has (A, who challenged, or B, who accepted),
        its four edges as they count there, and the first letters of its name:

        ```
        +---------+---------+
        |A%b%b%b7%b%b%b%b|%b%b%b%b%b%b%b%b%b|
        |3 Hound 5|%b%b%b(2)%b%b%b|
        |%b%b%b%b2%b%b+ |%b%bember%b%b|
        +---------+---------+
        ```

        An empty square shows its number, and under the Terrain rule its affinity. A `+` or `-` by a card's
        bottom edge says the square's terrain raises or lowers its edges.
      HELP`NINEFOLD`CARDS: |-
        Every player starts with the game's starter set of cards. Staff can give out more, and some games let
        the winner take cards from the loser.

        - `+nf/cards` lists your cards: their edges, tier and affinity, how many you have and which are in your
          hand of five.
        - `+nf/card <card>` shows one card: its picture, or its text art where pictures are not shown, and its numbers.
        - `+nf/deck` shows your hand of five. `+nf/deck <card>, <card>, ...` chooses it; name a card twice to
          take two copies. Places you leave empty, or cards you no longer have, are filled in with your
          strongest cards.

        The portal page **Ninefold** shows your cards and lets you choose your hand there too.

        Example:

        `+nf/deck Kiln Hound, Reed Dancer, Brass Beetle`

        Output: `\[NINEFOLD\] Done: Your hand is Kiln Hound, Reed Dancer, Brass Beetle, Pebble Golem and Cinder Newt.`
      HELP`NINEFOLD`RULES: |-
        The rules of a game depend on where it is played. `+nf/rules` shows the rule set that applies where you
        stand and why. A game keeps the rules it was challenged under.

        - **Face Up**: both hands are shown to both players.
        - **Blind Draw**: each hand is five cards dealt at random from the player's cards.
        - **Twin**: a card whose edges equal the edges they touch on two or more cards takes those cards.
        - **Balance**: a card whose edge sums with two or more touching cards are the same takes those cards.
        - **Cascade**: cards taken by Twin or Balance go on to take the cards they beat.
        - **Hard Edges**: for Twin, the edge of the board counts as an A.
        - **Terrain**: a few squares carry an affinity. A card of that affinity gains 1 on every edge there,
          any other card loses 1.
        - **Overtime**: a draw is played again, each player holding the cards of their colour.

        The **stakes** say what the winner gets: **Friendly**, nothing; **Winner Picks**, one card of their
        choice from the loser's hand, taken with `+nf/claim <card>`; **Spoils**, every card on the board goes
        to the player whose colour it shows.
      HELP`NINEFOLD`RULES`WHERE: |-
        A game uses the first of these that applies:

        1. A game-wide event that replaces the rules.
        2. The room's own rule set.
        3. The rule set of the room's zone. A room in several zones uses its first zone that has one.
        4. The game's default rule set.

        An event can instead add its rules to whichever of 2 to 4 applies; the stakes stay that rule set's.

        Example:

        `+nf/rules`

        Output: a box titled `Rules here` with `Rule set: Tavern Rules`,
        `Why: It is the rule set of the zone Harbor District.` and a line for each rule.
      HELP`NINEFOLD`KEEPER: |-
        A card keeper (the `softcode.ninefold.admin` permission, held by the Card Keeper role) keeps the cards.
        The portal's Ninefold page edits cards, pictures and rule sets; giving out cards, the log and ending
        games are commands.

        - `+nf/grant <player>=<card>\[,<count>\]` gives a player cards; `+nf/revoke <player>=<card>\[,<count>\]`
          takes them back. Both are recorded: `+nf/log \[<player>\]` shows the last 20 changes.
        - `+nf/collection <player>` shows a player's cards.
        - `+nf/new <name>=<top> <right> <bottom> <left>` makes a card. Edges are 1 to 9 or A.
        - `+nf/set <card>/<field>=<value>` changes one: `name`, `short` (the name on the board, 5 letters),
          `edges`, `tier` (1 to 5), `affinity`, `starter` (copies every new player starts with), `image` (a
          picture's address), `art` (text art, `\%r` between lines) or `ascii` (the same art in ASCII, for clients
          without UTF-8; empty folds `art` to ASCII). In art, type `\\\\` for a backslash and `\%b` for a space at
          the start of a line; the portal's editor takes art as typed.
        - Art fits the art box, 32 characters by 16 lines unless the Ninefold settings change it, and is centred
          in it. A client that shows pictures shows the card's picture in the box instead.
        - `+nf/delete <card>=yes` removes a card and every copy players hold.
        - `+nf/games` lists the games being played; `+nf/end <game>` stops one without paying its stakes.

        A card keeps its number when it is renamed, so what players hold never breaks.

        Example:

        `+nf/grant Ann=Night Queen`

        Output: `\[NINEFOLD\] Done: You give Ann 1 copy of Night Queen. They have 1 now.`
      HELP`NINEFOLD`RULESETS: |-
        Card keepers choose the rules played where.

        - `+nf/rulesets` lists the rule sets and where each applies.
        - `+nf/ruleset <key>=<title>` makes a rule set or renames it. `+nf/ruleset <key>` shows one.
        - `+nf/ruleset <key>/rules=<rules>` sets its rules: `faceup blind twin balance cascade walls terrain
          overtime`. `/stakes=` sets `friendly`, `pick` or `spoils`. `/mode=` says what it does as an event:
          `replace` the local rules or `add` its rules to them. `/delete=yes` removes it.
        - `+nf/default <rule set>` is played where nothing else applies.
        - `+nf/room <room>=<rule set>` and `+nf/zone <zone>=<rule set>` give a room or every room of a zone a
          rule set. Nothing after `=` clears it.
        - `+nf/event <rule set>=<how long>` runs an event game-wide, such as `=3h` or `=2d`; leave the time out
          to run it until `+nf/event none`. `+nf/event` shows it.

        Example:

        `+nf/zone #45=tavern`

        Output: `\[NINEFOLD\] Done: Games in rooms of the zone Harbor District play Tavern Rules now.`
