        {"ok":false,"errors":{"_global":""}}
      WEB`ERROR: |-
        json_fill(v(DATA`TEMPLATE`WEB`ERROR),/errors/_global,%0)
      DATA`TEMPLATE`WEB`DONE: |-
        {"ok":true,"message":"","schema":null,"data":{"fields":null}}
      # The answer after a change: message %0, the page drawn again with its data.
      # The page an action was sent from, when the request does not say: the portal posts without ?at=.
      WEB`ACT`PAGE: |-
        switch(%0,save,card/[trim(u(WEB`BODY`GET,card))],saveset,rules/[lcstr(trim(u(WEB`BODY`GET,set)))],default,rules,event,rules,endevent,rules,place,rules,)
      WEB`DONE: |-
        json_fill(v(DATA`TEMPLATE`WEB`DONE),/message,%0,/schema,u(WEB`SCHEMA`PAGE,%q<web_viewer>,%q<web_at>),/data/fields,u(WEB`DATA`PAGE,%q<web_viewer>,%q<web_at>))
      DATA`TEMPLATE`WEB`GO: |-
        {"ok":true,"message":"","redirect":""}
      WEB`GO: |-
        json_fill(v(DATA`TEMPLATE`WEB`GO),/message,%0,/redirect,%1)
      DATA`WEB`ACT: |-
        {"transport":"http","method":"POST","route":"/http/ninefold/act","payload":"fields","on_error":{"bind_field_errors":true}}
