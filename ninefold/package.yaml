      # One card: a view of it, or for a card keeper its editor.
      WEB`SCHEMA`CARD: |-
        cond(not(u(FN`CARD`EXISTS,%1)),u(WEB`SCHEMA`SAY,There is no card %1.),u(WEB`STAFF,%0),u(WEB`FORM,u(FN`CARD`NAME,%1),v(DATA`WEB`CARD`ABOUT)%r[v(DATA`WEB`CARD`EDGES)]%r[v(DATA`WEB`CARD`PICTURE)]%r[json_fill(v(DATA`WEB`CARD`ART),/elements/2/value,u(WEB`ART`BLOCK,%1))]%r[v(DATA`WEB`CARD`BUTTONS)]),1,json_fill(v(DATA`WEB`CARD`VIEW),/title,u(FN`CARD`NAME,%1),/pages/0/sections/0/elements/1/value,u(WEB`ART`BLOCK,%1)))
      WEB`ART`BLOCK: |-
        ```%r[u(FN`ART`TEXT,%0)]%r```
      DATA`WEB`CARD`VIEW: |-
        {"kind":"view","schema_version":1,"title":"","pages":[{"key":"main","title":"Card","order":1,"sections":[{"name":"","order":1,"columns":2,"elements":[{"kind":"image","src_field":"image","alt":"The card's picture"},{"kind":"markdown","value":""},{"kind":"keyvalue","fields":["Edges","Tier","Affinity","You own"],"span":2},{"kind":"markdown","value":"[Back to your cards](/apps/ninefold)","span":2}]}]}],"actions":{}}
      DATA`WEB`CARD`ABOUT: |-
        {"name":"The card","order":1,"columns":2,"elements":[{"kind":"field","key":"card","type":"hidden"},{"kind":"field","key":"name","label":"Name","type":"text","placeholder":"Lantern Moth","validation":{"required":true,"max_length":30}},{"kind":"field","key":"short","label":"Name on the board","type":"text","placeholder":"Moth","help":"Up to 5 letters. Empty uses the first five letters of the name.","validation":{"max_length":5}},{"kind":"field","key":"tier","label":"Tier","type":"select","options":[{"value":"1","label":"1"},{"value":"2","label":"2"},{"value":"3","label":"3"},{"value":"4","label":"4"},{"value":"5","label":"5"}]},{"kind":"field","key":"affinity","label":"Affinity","type":"select","help":"Under the Terrain rule, a square of the card's affinity raises its edges by 1.","options":[{"value":"","label":"None"},{"value":"ember","label":"Ember"},{"value":"tide","label":"Tide"},{"value":"gale","label":"Gale"},{"value":"stone","label":"Stone"},{"value":"bloom","label":"Bloom"},{"value":"shade","label":"Shade"}]},{"kind":"field","key":"starter","label":"Copies in the starter set","type":"number","help":"How many copies every new player starts with. 0 leaves it out.","validation":{"min":0,"max":9}}]}
      DATA`WEB`CARD`EDGES: |-
        {"name":"Edges","order":2,"columns":4,"elements":[{"kind":"field","key":"top","label":"Top","type":"number","validation":{"required":true,"min":1,"max":10}},{"kind":"field","key":"right","label":"Right","type":"number","validation":{"required":true,"min":1,"max":10}},{"kind":"field","key":"bottom","label":"Bottom","type":"number","validation":{"required":true,"min":1,"max":10}},{"kind":"field","key":"left","label":"Left","type":"number","validation":{"required":true,"min":1,"max":10}},{"kind":"markdown","value":"Each edge is 1 to 10. The game shows 10 as A.","span":4}]}
