      DATA`WEB`RULES`LIST: |-
        {"name":"Rule sets","order":1,"elements":[{"kind":"table","rows_field":"sets","empty":"There are no rule sets.","columns":[{"key":"key","label":"Key","link":"/apps/ninefold/rules/{key}"},{"key":"title","label":"Title"},{"key":"rules","label":"Rules"},{"key":"stakes","label":"Stakes"},{"key":"mode","label":"As an event"}]},{"kind":"markdown","value":"A game uses the first of these that applies: a running event that replaces the rules, the room's own rule set, the rule set of the room's zone (its first zone first), then the default. An event that adds its rules adds them to that. [Back to Ninefold](/apps/ninefold) · [Cards](/apps/ninefold/cards)"}]}
      DATA`TEMPLATE`WEB`RULES`WHERE: |-
        {"name":"Where they apply","order":2,"columns":2,"elements":[{"kind":"table","rows_field":"places","empty":"No room or zone has a rule set of its own.","span":2,"columns":[{"key":"place","label":"Room or zone"},{"key":"kind","label":"Kind"},{"key":"set","label":"Rule set"}]},{"kind":"field","key":"default_set","label":"Default rule set","type":"select","options":null},{"kind":"button","label":"Set the default","action":"act","values":{"op":"default"}}]}
      WEB`RULES`WHERE: |-
