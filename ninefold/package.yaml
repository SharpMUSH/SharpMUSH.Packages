      # schemas: GET /http/ninefold/schema?at=<path>
      WEB`SCHEMA: |-
        u(WEB`SCHEMA`PAGE,%<viewer>,u(WEB`AT,%<at>))
      WEB`SCHEMA`PAGE: |-
        switch(1,not(cand(strlen(%0),hastype(%0,player))),u(WEB`SCHEMA`SAY,Sign in with a character to see your cards.),not(strlen(%1)),u(WEB`SCHEMA`HOME,%0),strmatch(%1,card/*),u(WEB`SCHEMA`CARD,%0,after(%1,/)),not(u(WEB`STAFF,%0)),u(WEB`SCHEMA`SAY,Only a card keeper can open this page.),strmatch(%1,cards),u(WEB`SCHEMA`CARDS),strmatch(%1,rules),u(WEB`SCHEMA`RULES),strmatch(%1,rules/*),u(WEB`SCHEMA`RULESET,ucstr(after(%1,/))),u(WEB`SCHEMA`SAY,There is no such page.))
      DATA`WEB`SAY: |-
        {"kind":"view","schema_version":1,"title":"Ninefold","pages":[{"key":"main","title":"Ninefold","order":1,"sections":[{"name":"","order":1,"elements":[{"kind":"markdown","value":""}]}]}],"actions":{}}
      WEB`SCHEMA`SAY: |-
        json_fill(v(DATA`WEB`SAY),/pages/0/sections/0/elements/0/value,%0)
      DATA`TEMPLATE`WEB`FORM: |-
        {"kind":"form","schema_version":1,"title":"","pages":[{"key":"main","title":"Ninefold","order":1,"sections":null}],"actions":{"act":{}}}
      # A form titled %0 with the sections in %1, one a line.
      WEB`FORM: |-
        json_fill(v(DATA`TEMPLATE`WEB`FORM),/title,%0,/pages/0/sections,u(WEB`JSON`ARRAY,%1),/actions/act,v(DATA`WEB`ACT))

      # The home page: the viewer's game, their cards, their hand of five, the rules where they stand, and for a
      # card keeper the way to the editors.
      WEB`SCHEMA`HOME: |-
        u(WEB`FORM,,if(strlen(u(FN`GAME`OF,u(FN`KEY,%0))),u(WEB`SECTION`GAME,%0)%r)[v(DATA`WEB`SECTION`CARDS)]%r[u(WEB`SECTION`HAND,%0)]%r[v(DATA`WEB`SECTION`RULES)][if(u(WEB`STAFF,%0),%r[v(DATA`WEB`SECTION`STAFF)])])
      DATA`TEMPLATE`WEB`SECTION`GAME: |-
        {"name":"Your game","order":1,"elements":[{"kind":"keyvalue","fields":["Players","Score","Game rules","Turn"]},{"kind":"markdown","value":""},{"kind":"markdown","value":"Play in the game with `+nf/play <card>=<square>`."}]}
      WEB`SECTION`GAME: |-
        null(u(FN`GAME`LOAD,u(FN`GAME`OF,u(FN`KEY,%0)),%0))[json_fill(v(DATA`TEMPLATE`WEB`SECTION`GAME),/elements/1/value,```%r[u(FN`BOARD`DRAW)]%r```)]
      DATA`WEB`SECTION`CARDS: |-
        {"name":"Your cards","order":2,"elements":[{"kind":"table","rows_field":"cards","empty":"You have no cards.","columns":[{"key":"name","label":"Card","link":"/apps/ninefold/card/{id}"},{"key":"edges","label":"Edges"},{"key":"tier","label":"Tier"},{"key":"affinity","label":"Affinity"},{"key":"owned","label":"Owned"},{"key":"hand","label":"In hand"}]}]}
      DATA`TEMPLATE`WEB`SECTION`HAND: |-
        {"name":"Your hand of five","order":3,"elements":[{"kind":"field","key":"deck","label":"Cards in your hand","type":"multiselect","help":"Choose up to five. Places you leave empty are filled with your strongest cards. +nf/deck in the game can name a card twice.","options":null},{"kind":"button","label":"Save hand","action":"act","values":{"op":"deck"},"color":"primary","variant":"filled"}]}
      WEB`SECTION`HAND: |-
        json_fill(v(DATA`TEMPLATE`WEB`SECTION`HAND),/elements/0/options,u(WEB`OPTIONS`CARDS,u(FN`OWN`CARDS,u(FN`KEY,%0))))
      DATA`TEMPLATE`WEB`OPTION: |-
        {"value":"","label":""}
      WEB`OPTIONS`CARDS: |-
        u(WEB`JSON`ARRAY,iter(%0,json_fill(v(DATA`TEMPLATE`WEB`OPTION),/value,%i0,/label,[u(FN`CARD`NAME,%i0)] %([u(FN`CARD`CROSS,%i0)]%)),%b,%r))
      DATA`WEB`SECTION`RULES: |-
