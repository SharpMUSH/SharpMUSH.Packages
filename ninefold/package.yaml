      DATA`TEMPLATE`WEB`RULES`PLACE: |-
        {"name":"Give a room or zone a rule set","order":4,"columns":3,"elements":[{"kind":"field","key":"place","label":"Room or zone","type":"text","placeholder":"#123","help":"Its dbref, such as #123."},{"kind":"field","key":"place_kind","label":"It is","type":"select","options":[{"value":"room","label":"A room"},{"value":"zone","label":"A zone"}]},{"kind":"field","key":"place_set","label":"Rule set","type":"select","options":null},{"kind":"button","label":"Apply","action":"act","values":{"op":"place"},"span":3}]}
      WEB`RULES`PLACE: |-
        json_fill(v(DATA`TEMPLATE`WEB`RULES`PLACE),/elements/2/options,u(WEB`OPTIONS`SETS,1))
      DATA`WEB`RULES`NEW: |-
        {"name":"A new rule set","order":5,"columns":2,"elements":[{"kind":"field","key":"new_key","label":"Key","type":"text","placeholder":"tavern","help":"One word: letters, digits, - and _.","validation":{"max_length":20}},{"kind":"field","key":"new_title","label":"Title","type":"text","placeholder":"Tavern Rules","validation":{"max_length":40}},{"kind":"button","label":"Make the rule set","action":"act","values":{"op":"newset"},"color":"primary","variant":"filled"}]}
