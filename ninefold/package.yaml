      WEB`DATA`CARD: |-
        if(u(FN`CARD`EXISTS,%1),u(WEB`JSON`OBJECT,u(WEB`STRING,card,%1)%r[u(WEB`STRING,name,u(FN`CARD`NAME,%1))]%r[u(WEB`STRING,short,get({{store}}/CARD`%1`SHORT))]%r[u(WEB`STRING,tier,u(FN`CARD`TIER,%1))]%r[u(WEB`STRING,affinity,u(FN`CARD`AFFINITY,%1))]%r[u(WEB`JSON`MEMBER,starter,json(number,firstof(get({{store}}/CARD`%1`STARTER),0)))]%r[u(WEB`JSON`MEMBER,top,json(number,u(FN`CARD`SIDE,%1,1)))]%r[u(WEB`JSON`MEMBER,right,json(number,u(FN`CARD`SIDE,%1,2)))]%r[u(WEB`JSON`MEMBER,bottom,json(number,u(FN`CARD`SIDE,%1,3)))]%r[u(WEB`JSON`MEMBER,left,json(number,u(FN`CARD`SIDE,%1,4)))]%r[u(WEB`STRING,image,get({{store}}/CARD`%1`IMAGE))]%r[u(WEB`STRING,art,get({{store}}/CARD`%1`ART))]%r[u(WEB`STRING,art_ascii,get({{store}}/CARD`%1`ART`ASCII))]%r[u(WEB`STRING,Edges,u(FN`CARD`EDGES,%1))]%r[u(WEB`STRING,Tier,u(FN`CARD`TIER,%1))]%r[u(WEB`STRING,Affinity,firstof(u(FN`CARD`AFFINITY,%1),none))]%r[u(WEB`STRING,You own,u(FN`OWN`COUNT,u(FN`KEY,%0),%1))]),json(object))
      DATA`TEMPLATE`WEB`ROW`ALL: |-
        {"id":"","name":"","edges":"","tier":"","affinity":"","starter":"","holders":""}
      WEB`DATA`CARDS: |-
        u(WEB`JSON`OBJECT,u(WEB`JSON`MEMBER,all,u(WEB`JSON`ARRAY,iter(u(FN`CARD`IDS),json_fill(v(DATA`TEMPLATE`WEB`ROW`ALL),/id,%i0,/name,u(FN`CARD`NAME,%i0),/edges,u(FN`CARD`CROSS,%i0),/tier,u(FN`CARD`TIER,%i0),/affinity,firstof(u(FN`CARD`AFFINITY,%i0),-),/starter,firstof(get({{store}}/CARD`%i0`STARTER),-),/holders,words(u(FN`CARD`HOLDERS,%i0))),%b,%r)))%r[u(WEB`STRING,new_name,)]%r[u(WEB`STRING,new_edges,)])
      DATA`TEMPLATE`WEB`ROW`SET: |-
        {"key":"","title":"","rules":"","stakes":"","mode":""}
      DATA`TEMPLATE`WEB`ROW`PLACE: |-
