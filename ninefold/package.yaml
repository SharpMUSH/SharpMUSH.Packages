      DATA`TEMPLATE`WEB`RULES`EVENT: |-
        {"name":"Event","order":3,"columns":2,"elements":[{"kind":"keyvalue","fields":["Event"],"span":2},{"kind":"field","key":"event_set","label":"Rule set","type":"select","options":null},{"kind":"field","key":"event_hours","label":"Hours","type":"number","help":"0 runs it until you end it.","validation":{"min":0,"max":2160}},{"kind":"button","label":"Start the event","action":"act","values":{"op":"event"},"color":"primary","variant":"filled"},{"kind":"button","label":"End the event","action":"act","values":{"op":"endevent"},"confirm":"End the event now?","color":"error"}]}
      WEB`RULES`EVENT: |-
