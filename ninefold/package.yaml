      WEB`OPTIONS`SETS: |-
        u(WEB`JSON`ARRAY,if(%0,json_fill(v(DATA`TEMPLATE`WEB`OPTION),/value,,/label,No rule set of its own)%r)[iter(sort(iter(lattr({{store}}/RULESET`*),after(%i0,`))),json_fill(v(DATA`TEMPLATE`WEB`OPTION),/value,lcstr(%i0),/label,get({{store}}/RULESET`%i0)),%b,%r)])

      # One rule set.
      WEB`SCHEMA`RULESET: |-
        if(u(FN`SET`EXISTS,%0),u(WEB`FORM,get({{store}}/RULESET`%0),u(WEB`RULESET`FORM)),u(WEB`SCHEMA`SAY,There is no rule set [lcstr(%0)].))
      DATA`TEMPLATE`WEB`RULESET`FORM: |-
        {"name":"","order":1,"columns":2,"elements":[{"kind":"field","key":"set","type":"hidden"},{"kind":"field","key":"title","label":"Title","type":"text","validation":{"required":true,"max_length":40}},{"kind":"field","key":"stakes","label":"Stakes","type":"select","options":[{"value":"friendly","label":"Friendly: nobody loses a card"},{"value":"pick","label":"Winner Picks: one card from the loser's hand"},{"value":"spoils","label":"Spoils: every card goes to the colour it shows"}]},{"kind":"field","key":"rules","label":"Rules","type":"multiselect","span":2,"options":null},{"kind":"field","key":"mode","label":"As an event","type":"select","span":2,"options":[{"value":"replace","label":"Replaces the rules wherever games are played"},{"value":"add","label":"Adds its rules to the rules wherever games are played"}]},{"kind":"markdown","value":"","span":2},{"kind":"button","label":"Save rule set","action":"act","values":{"op":"saveset"},"color":"primary","variant":"filled"},{"kind":"button","label":"Delete rule set","action":"act","values":{"op":"deleteset"},"confirm":"Delete this rule set? Rooms and zones that use it lose it.","color":"error"}]}
      WEB`RULESET`FORM: |-
        json_fill(v(DATA`TEMPLATE`WEB`RULESET`FORM),/elements/3/options,u(WEB`JSON`ARRAY,iter(v(DATA`RULES),json_fill(v(DATA`TEMPLATE`WEB`OPTION),/value,%i0,/label,v(DATA`RULE`%i0)),%b,%r)),/elements/5/value,[iter(v(DATA`RULES),**[v(DATA`RULE`%i0)]**: [v(DATA`RULE`%i0`ABOUT)],%b,%r%r)]%r%r%[Back to the rule sets%]%(/apps/ninefold/rules%))

      # data: GET /http/ninefold/data?at=<path>
      WEB`DATA: |-
