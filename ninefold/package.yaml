      WEB`DATA`PAGE: |-
        switch(1,not(cand(strlen(%0),hastype(%0,player))),json(object),not(strlen(%1)),u(WEB`DATA`HOME,%0),strmatch(%1,card/*),u(WEB`DATA`CARD,%0,after(%1,/)),not(u(WEB`STAFF,%0)),json(object),strmatch(%1,cards),u(WEB`DATA`CARDS),strmatch(%1,rules),u(WEB`DATA`RULES),strmatch(%1,rules/*),u(WEB`DATA`RULESET,ucstr(after(%1,/))),json(object))
      WEB`DATA`HOME: |-
        setqm(wd_pk,u(FN`KEY,%0),wd_game,u(FN`GAME`OF,u(FN`KEY,%0)))[u(FN`RULES`RESOLVE,loc(%0))][if(strlen(%q<wd_game>),u(FN`GAME`LOAD,%q<wd_game>,%0)[setq(sg_side,%q<game_side>)])][u(WEB`JSON`OBJECT,u(WEB`JSON`MEMBER,cards,u(WEB`ROWS`MINE,%q<wd_pk>))%r[u(WEB`JSON`MEMBER,deck,u(WEB`JSON`ARRAY,iter(setunion(u(FN`DECK`HAND,%q<wd_pk>),),json(string,%i0),%b,%r)))]%r[u(WEB`STRING,Rule set,%q<rs_title>)]%r[u(WEB`STRING,Why,capstr(%q<rs_from>).)]%r[u(WEB`STRING,Rules,capstr(u(FN`RULES`NAMES,%q<rs_rules>)))]%r[u(WEB`STRING,Stakes,u(FN`STAKES`NAME,%q<rs_stakes>))][if(strlen(%q<wd_game>),%r[u(WEB`DATA`GAME,%0)])])]
      WEB`DATA`GAME: |-
        u(WEB`STRING,Players,A is [name(%q<game_a>)]%, B is [name(%q<game_b>)])%r[u(WEB`STRING,Score,stripansi(u(FN`SCREEN`SCORE)))]%r[u(WEB`STRING,Game rules,%q<game_title> %([u(FN`RULES`NAMES,%q<game_rules>)]%))]%r[u(WEB`STRING,Turn,u(FN`SCREEN`TURN,%0))]
      DATA`TEMPLATE`WEB`ROW`MINE: |-
        {"id":"","name":"","edges":"","tier":"","affinity":"","owned":"","hand":""}
