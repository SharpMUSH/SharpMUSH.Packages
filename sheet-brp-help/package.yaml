format: "1.20"
package: sheet-brp-help
title: "Percentile sheet (BRP): +help topics"
version: 1.0.3
authors: [SharpMUSH]
description: "Puts the percentile sheet topics into +help: registers the sheet-brp package's help with the +help librarian, and points its messages at +help."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, brp, help, bridge]
category: Game System
subcategory: Percentile (BRP)
bridge: true
requires_server: ">=1.0"
verified_server: "1.0"

# A bridge: it joins two packages that do not know about each other. sheet-brp keeps its topics on its own
# help object, and plus-help reads any object registered with its librarian. This package is that
# registration, and the lines that point its messages at +help; uninstalling it takes the topics out of
# +help, and neither package changes.
depends:
  - package: sheet-brp
    version: ">=2.0 <3.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH.Packages
      path: sheet-brp/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`SHEET-BRP: |-
        {{sheet-brp/sheet_help}}

  # Lines the sheet's messages end with when +help is here, through its FUN`HINT: HINT`<message>.
  - ref: message_hints
    target: "{{sheet-brp/sheet}}"
    attributes:
      HINT`SWITCHES: |-
        +help %0 lists them.
