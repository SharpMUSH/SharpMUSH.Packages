        flags: [funsyntax]
      FUN`BUILD`ROOM:
        value: |-
          words(u(%!/FUN`BUILD`RATINGS,%0,%1,%2,%3))
        flags: [funsyntax]
      # %0 the NPC's number, %1 its name, %2 who makes it, %3 the peak; build_ registers from FUN`BUILD`READ.
      FUN`BUILD`MAKE:
        value: |-
          setqm(bm_at,{{sheet-fate/npcs}}/NPC`%0,bm_ratings,u(%!/FUN`BUILD`RATINGS,%q<build_type>,%q<build_quality>,%q<build_tough>,%3),bm_tracks,u({{sheet-fate/sheet}}/FUN`LIST`ALL,TRACK),bm_slots,u({{sheet-fate/sheet}}/FUN`LIST`ALL,CONSEQUENCE),bm_apex,first(%q<build_keys>))[attrib_set(%q<bm_at>,%1)][attrib_set(%q<bm_at>`KIND,if(member(threat boss,%q<build_type>),major,minor))][attrib_set(%q<bm_at>`OWNER,%2)][attrib_set(%q<bm_at>`FIELD`TYPE,%q<build_type>)][if(strmatch(%q<build_type>,boss),null(iter(u({{sheet-fate/sheet}}/FUN`TRAIT`ALL),attrib_set(%q<bm_at>`SKILL`%i0,1))))][null(iter(%q<build_keys>,attrib_set(%q<bm_at>`SKILL`%i0,u(%!/FUN`CLAMP,extract(%q<bm_ratings>,#@,1)))))][switch(%q<build_type>,filler,[attrib_set(%q<bm_at>`ASPECT`1,%1)][attrib_set(%q<bm_at>`BOXES`[first(%q<bm_tracks>)],first(u(%!/FUN`BUILD`RATINGS,filler,%q<build_quality>)))][attrib_set(%q<bm_at>`SLOTS,)],hitter,[null(iter(%q<bm_tracks>,attrib_set(%q<bm_at>`BOXES`%i0,u(%!/FUN`BUILD`BOXES,%q<bm_at>,%i0,0))))][attrib_set(%q<bm_at>`SLOTS,if(%q<build_tough>,first(%q<bm_slots>)))][attrib_set(%q<bm_at>`STUNT`1,Weapon:2 when you attack with [u({{sheet-fate/sheet}}/FUN`TRAIT`LABEL,%q<bm_apex>)].)],threat,[null(iter(%q<bm_tracks>,attrib_set(%q<bm_at>`BOXES`%i0,u(%!/FUN`BUILD`BOXES,%q<bm_at>,%i0,1))))][attrib_set(%q<bm_at>`SLOTS,extract(%q<bm_slots>,1,if(%q<build_tough>,2,1)))][attrib_set(%q<bm_at>`STUNT`1,When you defend with [u({{sheet-fate/sheet}}/FUN`TRAIT`LABEL,%q<bm_apex>)]%, you get Armor:2.)],boss,[null(iter(%q<bm_tracks>,attrib_set(%q<bm_at>`BOXES`%i0,u(%!/FUN`BUILD`BOXES,%q<bm_at>,%i0,1))))][attrib_set(%q<bm_at>`SLOTS,extract(%q<bm_slots>,1,if(%q<build_tough>,3,2)))][attrib_set(%q<bm_at>`STUNT`1,Twice per session%, you can use [u({{sheet-fate/sheet}}/FUN`TRAIT`LABEL,%q<bm_apex>)] in place of any other skill.)])]
        flags: [funsyntax]
      # %0 the NPC, %1 a track, %2 1 when the skill that goes with the track lengthens it: the track's starting
      # boxes, one more for an Average or Fair rating in that skill and two for Good or better.
      FUN`BUILD`BOXES:
        value: |-
          setqm(bb_base,default({{sheet-fate/store}}/TRACK`%1`BOXES,3),bb_skill,u(%!/FUN`SKILL`KEY,after(first(graball(get(%!/DATA`CONFIG`TRACK_SKILLS),[lcstr(%1)]:*)),:)))[if(cand(%2,strlen(%q<bb_skill>)),add(%q<bb_base>,switch(1,gte(setr(bb_rating,default(%0`SKILL`%q<bb_skill>,0)),3),2,gte(%q<bb_rating>,1),1,0)),%q<bb_base>)]
        flags: [funsyntax]
      # %0 an NPC (object/attribute): "Fight Great (+4), Athletics Good (+3); physical [ ] [ ], mild".
      FUN`BUILD`SUMMARY:
        value: |-
          setq(bs_skills,u({{sheet-fate/sheet}}/FUN`NPC`SKILLORDER,%0))[if(strmatch(%q<build_type>,boss),setq(bs_skills,squish(iter(%q<bs_skills>,if(gt(get(%0`SKILL`%i0),1),%i0)))))][itemize(iter(%q<bs_skills>,[u({{sheet-fate/sheet}}/FUN`TRAIT`LABEL,%i0)] [u({{sheet-fate/sheet}}/FUN`LADDER`SHOW,get(%0`SKILL`%i0))],%b,|),|)][if(strmatch(%q<build_type>,boss),%, every other skill Average %(+1%))]; stress [u({{sheet-fate/sheet}}/FUN`NPC`STRESS,%0)]; consequences [u({{sheet-fate/sheet}}/FUN`NPC`SLOTS,%0)]
        flags: [funsyntax]

      # ---- filler mobs -----------------------------------------------------------------
