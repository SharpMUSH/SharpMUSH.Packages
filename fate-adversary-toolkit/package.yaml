format: "1.16"
package: fate-adversary-toolkit
title: "Fate Adversary Toolkit (unofficial)"
version: 1.0.0
authors: [SharpMUSH]
description: "Opposition for the Fate sheet, after the Fate Adversary Toolkit: a library of ready adversaries (threats, hitters, bosses and fillers) that +adversary/make copies into +npc at your game's power level, +adversary/build to make one by type from its skills, filler mobs that thin as they take stress, hazards, blocks and distractions in an encounter with +obstacle, countdowns with +countdown, and resistances and limitations on any NPC. Based on the Fate Adversary Toolkit SRD under CC BY 3.0. An unofficial fan package, not affiliated with or endorsed by Evil Hat Productions."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, fate, npc, encounters, adversaries]
category: Characters
requires_server: ">=0.1"

# It builds opposition in the Fate sheet's +npc store, runs obstacles inside the sheet's encounters, and thins a
# filler mob through the sheet's AFTER`NPC` hooks (sheet-fate 1.4). Sheet keepers (softcode.fate.admin) keep
# this too; there is no permission of its own.
depends:
  - package: sheet-fate
    version: ">=1.4 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH.Packages
      path: sheet-fate/
      branch: main

objects:
  # The command object, in the master room. WIZARD because it adds the commands (@command/add, @hook), writes the
  # Fate sheet's opposition (NPC`<n> on Fate Opposition) and encounters (ENC`<n>`OBS`<k> on Fate Encounters), and
  # calls the sheet's functions.
  #
  # +adversary, +obstacle and +countdown are added with /noparse/rsnoparse and hooked to CMD`<word>, so what a
  # player types reaches the code exactly as typed and nothing a player wrote is ever evaluated.
  #
  # Trees: CMD` the hooked commands, INC`COMMAND` the parse and dispatch, INC`ADV`, INC`OBS` and INC`CD` one
  # routine per switch, INC`NEED` the guards. FUN`TPL` the library, FUN`BUILD` the recipes, FUN`MOB` filler
  # mobs, FUN`OBS` obstacles, FUN`CD` countdowns, FUN`SCREEN` the screens.
  - ref: adversary
    type: thing
    name: Fate Adversary Toolkit
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      # ---- settings ---------------------------------------------------------------
      # +config adversary shows and changes them (fate-adversary-toolkit-config).
      DATA`CONFIG: |-
        Settings for adversaries, obstacles and countdowns on the Fate sheet. One leaf per setting.
      DATA`CONFIG`LABEL: |-
        Fate adversaries
      DATA`CONFIG`PEAK: |-
        0
      DATA`CONFIG`PEAK`TYPE: |-
        integer
      DATA`CONFIG`PEAK`DEFAULT: |-
        0
      DATA`CONFIG`PEAK`MIN: |-
        0
      DATA`CONFIG`PEAK`MAX: |-
        8
      DATA`CONFIG`PEAK`LABEL: |-
        PCs' best skill
      DATA`CONFIG`PEAK`DESCRIPTION: |-
        The rating of the PCs' highest skill, which adversaries are built against. 0 takes the Fate sheet's skill cap.
      DATA`CONFIG`PEAK`EXAMPLE: |-
        4
      DATA`CONFIG`MOB_CAP: |-
        4
      DATA`CONFIG`MOB_CAP`TYPE: |-
        integer
      DATA`CONFIG`MOB_CAP`DEFAULT: |-
        4
      DATA`CONFIG`MOB_CAP`MIN: |-
        1
      DATA`CONFIG`MOB_CAP`MAX: |-
        8
      DATA`CONFIG`MOB_CAP`LABEL: |-
        Mob skill cap
      DATA`CONFIG`MOB_CAP`DESCRIPTION: |-
        The highest a filler mob's skills go with its numbers.
      DATA`CONFIG`MOB_CAP`EXAMPLE: |-
        4
      DATA`CONFIG`TRACK_SKILLS: |-
        physical:physique mental:will
      DATA`CONFIG`TRACK_SKILLS`TYPE: |-
        list
      DATA`CONFIG`TRACK_SKILLS`DEFAULT: |-
        physical:physique mental:will
      DATA`CONFIG`TRACK_SKILLS`PATTERN: |-
        ^[A-Za-z0-9_-]+:[A-Za-z0-9_-]+$
      DATA`CONFIG`TRACK_SKILLS`LABEL: |-
        Track skills
      DATA`CONFIG`TRACK_SKILLS`DESCRIPTION: |-
        Which skill lengthens which stress track for a built threat or boss: track:skill, one pair each.
      DATA`CONFIG`TRACK_SKILLS`EXAMPLE: |-
        physical:physique mental:will
      DATA`CONFIG`APPROACHES: |-
        athletics:quick burglary:sneaky contacts:clever crafts:clever deceive:sneaky drive:quick empathy:careful fight:forceful investigate:careful lore:clever notice:careful physique:forceful provoke:flashy rapport:flashy resources:clever shoot:careful stealth:sneaky will:careful
      DATA`CONFIG`APPROACHES`TYPE: |-
        list
      DATA`CONFIG`APPROACHES`DEFAULT: |-
        athletics:quick burglary:sneaky contacts:clever crafts:clever deceive:sneaky drive:quick empathy:careful fight:forceful investigate:careful lore:clever notice:careful physique:forceful provoke:flashy rapport:flashy resources:clever shoot:careful stealth:sneaky will:careful
      DATA`CONFIG`APPROACHES`PATTERN: |-
        ^[A-Za-z0-9_-]+:[A-Za-z0-9_-]+$
      DATA`CONFIG`APPROACHES`LABEL: |-
        Skills as approaches
      DATA`CONFIG`APPROACHES`DESCRIPTION: |-
        On a game of approaches, which approach takes each skill an adversary was written with: skill:approach.
      DATA`CONFIG`APPROACHES`EXAMPLE: |-
        fight:forceful shoot:careful
      DATA`CONFIG`ADVERSARIES`TYPE: |-
        table
      DATA`CONFIG`ADVERSARIES`LABEL: |-
        Adversaries
      DATA`CONFIG`ADVERSARIES`DESCRIPTION: |-
        The library +adversary/make copies from: threats, hitters, bosses and fillers, written for PCs whose best skill is their peak.
      DATA`CONFIG`ADVERSARIES`STORE: |-
        {{store}}
      DATA`CONFIG`ADVERSARIES`PATH: |-
        TPL
      DATA`CONFIG`ADVERSARIES`ENTRY: |-
        label
      DATA`CONFIG`ADVERSARIES`FIELDS: |-
        label type peak aspects skills rest stunts boxes slots lock key limit countdown triggers outcome order
      DATA`CONFIG`ADVERSARIES`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,30}$
      DATA`CONFIG`ADVERSARIES`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`ADVERSARIES`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`ADVERSARIES`FIELD`LABEL`MAX: |-
        40
      DATA`CONFIG`ADVERSARIES`FIELD`LABEL`PATTERN: |-
        ^[A-Za-z][A-Za-z0-9 '.-]*$
      DATA`CONFIG`ADVERSARIES`FIELD`LABEL`LABEL: |-
        Name
      DATA`CONFIG`ADVERSARIES`FIELD`LABEL`DESCRIPTION: |-
        The name an NPC made from it takes unless you give another.
      DATA`CONFIG`ADVERSARIES`FIELD`TYPE`TYPE: |-
        choice
      DATA`CONFIG`ADVERSARIES`FIELD`TYPE`CHOICES: |-
        threat hitter boss filler
      DATA`CONFIG`ADVERSARIES`FIELD`TYPE`DEFAULT: |-
        threat
      DATA`CONFIG`ADVERSARIES`FIELD`TYPE`LABEL: |-
        Type
      DATA`CONFIG`ADVERSARIES`FIELD`TYPE`DESCRIPTION: |-
        Threat, hitter, boss or filler.
      DATA`CONFIG`ADVERSARIES`FIELD`PEAK`TYPE: |-
        integer
      DATA`CONFIG`ADVERSARIES`FIELD`PEAK`DEFAULT: |-
        4
      DATA`CONFIG`ADVERSARIES`FIELD`PEAK`MIN: |-
        0
      DATA`CONFIG`ADVERSARIES`FIELD`PEAK`MAX: |-
        8
      DATA`CONFIG`ADVERSARIES`FIELD`PEAK`LABEL: |-
        Written for
      DATA`CONFIG`ADVERSARIES`FIELD`PEAK`DESCRIPTION: |-
        The PCs' best skill its ratings were written against; a game with a higher peak raises them to match.
      DATA`CONFIG`ADVERSARIES`FIELD`ASPECTS`TYPE: |-
        list
      DATA`CONFIG`ADVERSARIES`FIELD`ASPECTS`DELIMITER: |-
        |
      DATA`CONFIG`ADVERSARIES`FIELD`ASPECTS`MAX: |-
        5
      DATA`CONFIG`ADVERSARIES`FIELD`ASPECTS`LABEL: |-
        Aspects
      DATA`CONFIG`ADVERSARIES`FIELD`ASPECTS`DESCRIPTION: |-
        Its aspects, | between them, high concept first.
      DATA`CONFIG`ADVERSARIES`FIELD`SKILLS`TYPE: |-
        list
      DATA`CONFIG`ADVERSARIES`FIELD`SKILLS`PATTERN: |-
        ^[A-Za-z0-9_-]+:-?[0-9]+$
      DATA`CONFIG`ADVERSARIES`FIELD`SKILLS`LABEL: |-
        Skills
      DATA`CONFIG`ADVERSARIES`FIELD`SKILLS`DESCRIPTION: |-
        Its rated skills as skill:rating, such as fight:4.
      DATA`CONFIG`ADVERSARIES`FIELD`REST`TYPE: |-
        text
      DATA`CONFIG`ADVERSARIES`FIELD`REST`PATTERN: |-
        ^(-?[0-9])?$
      DATA`CONFIG`ADVERSARIES`FIELD`REST`LABEL: |-
        Every other skill
      DATA`CONFIG`ADVERSARIES`FIELD`REST`DESCRIPTION: |-
        A rating for every skill it does not list, such as 1 for a boss's Average (+1). Empty leaves them Mediocre.
      DATA`CONFIG`ADVERSARIES`FIELD`STUNTS`TYPE: |-
        list
      DATA`CONFIG`ADVERSARIES`FIELD`STUNTS`DELIMITER: |-
        |
      DATA`CONFIG`ADVERSARIES`FIELD`STUNTS`MAX: |-
        5
      DATA`CONFIG`ADVERSARIES`FIELD`STUNTS`LABEL: |-
        Stunts
      DATA`CONFIG`ADVERSARIES`FIELD`STUNTS`DESCRIPTION: |-
        Its stunts, | between them.
      DATA`CONFIG`ADVERSARIES`FIELD`BOXES`TYPE: |-
        list
      DATA`CONFIG`ADVERSARIES`FIELD`BOXES`PATTERN: |-
        ^[A-Za-z0-9_-]+:[0-9]+$
      DATA`CONFIG`ADVERSARIES`FIELD`BOXES`LABEL: |-
        Stress boxes
      DATA`CONFIG`ADVERSARIES`FIELD`BOXES`DESCRIPTION: |-
        Its stress boxes as track:boxes, such as physical:3 mental:2.
      DATA`CONFIG`ADVERSARIES`FIELD`SLOTS`TYPE: |-
        list
      DATA`CONFIG`ADVERSARIES`FIELD`SLOTS`LABEL: |-
        Consequences
      DATA`CONFIG`ADVERSARIES`FIELD`SLOTS`DESCRIPTION: |-
        The consequence slots it has, such as mild moderate.
      DATA`CONFIG`ADVERSARIES`FIELD`LOCK`TYPE: |-
        text
      DATA`CONFIG`ADVERSARIES`FIELD`LOCK`MAX: |-
        200
      DATA`CONFIG`ADVERSARIES`FIELD`LOCK`LABEL: |-
        Resistance
      DATA`CONFIG`ADVERSARIES`FIELD`LOCK`DESCRIPTION: |-
        A resistance's lock: the aspect saying what it is immune to.
      DATA`CONFIG`ADVERSARIES`FIELD`KEY`TYPE: |-
        text
      DATA`CONFIG`ADVERSARIES`FIELD`KEY`MAX: |-
        300
      DATA`CONFIG`ADVERSARIES`FIELD`KEY`LABEL: |-
        Key
      DATA`CONFIG`ADVERSARIES`FIELD`KEY`DESCRIPTION: |-
        The one thing that gets past its resistance.
      DATA`CONFIG`ADVERSARIES`FIELD`LIMIT`TYPE: |-
        text
      DATA`CONFIG`ADVERSARIES`FIELD`LIMIT`MAX: |-
        300
      DATA`CONFIG`ADVERSARIES`FIELD`LIMIT`LABEL: |-
        Limitation
      DATA`CONFIG`ADVERSARIES`FIELD`LIMIT`DESCRIPTION: |-
        A limitation: a fact or aspect that changes how the PCs must deal with it.
      DATA`CONFIG`ADVERSARIES`FIELD`COUNTDOWN`TYPE: |-
        integer
      DATA`CONFIG`ADVERSARIES`FIELD`COUNTDOWN`DEFAULT: |-
        0
      DATA`CONFIG`ADVERSARIES`FIELD`COUNTDOWN`MIN: |-
        0
      DATA`CONFIG`ADVERSARIES`FIELD`COUNTDOWN`MAX: |-
        20
      DATA`CONFIG`ADVERSARIES`FIELD`COUNTDOWN`LABEL: |-
        Countdown
      DATA`CONFIG`ADVERSARIES`FIELD`COUNTDOWN`DESCRIPTION: |-
        The boxes of the countdown it brings, 0 for none.
      DATA`CONFIG`ADVERSARIES`FIELD`TRIGGERS`TYPE: |-
        list
      DATA`CONFIG`ADVERSARIES`FIELD`TRIGGERS`DELIMITER: |-
        |
      DATA`CONFIG`ADVERSARIES`FIELD`TRIGGERS`MAX: |-
        10
      DATA`CONFIG`ADVERSARIES`FIELD`TRIGGERS`LABEL: |-
        Triggers
      DATA`CONFIG`ADVERSARIES`FIELD`TRIGGERS`DESCRIPTION: |-
        What marks a box of its countdown, | between them.
      DATA`CONFIG`ADVERSARIES`FIELD`OUTCOME`TYPE: |-
        text
      DATA`CONFIG`ADVERSARIES`FIELD`OUTCOME`MAX: |-
        300
      DATA`CONFIG`ADVERSARIES`FIELD`OUTCOME`LABEL: |-
        Outcome
      DATA`CONFIG`ADVERSARIES`FIELD`OUTCOME`DESCRIPTION: |-
        What happens when its countdown's last box is marked.
      DATA`CONFIG`ADVERSARIES`FIELD`ORDER`TYPE: |-
        integer
      DATA`CONFIG`ADVERSARIES`FIELD`ORDER`DEFAULT: |-
        50
      DATA`CONFIG`ADVERSARIES`FIELD`ORDER`MIN: |-
        0
      DATA`CONFIG`ADVERSARIES`FIELD`ORDER`MAX: |-
        999
      DATA`CONFIG`ADVERSARIES`FIELD`ORDER`LABEL: |-
        Order
      DATA`CONFIG`ADVERSARIES`FIELD`ORDER`DESCRIPTION: |-
        Where it comes in its type's list: lower first, then by name.
      DATA`CONFIG`OBSTACLES`TYPE: |-
        table
      DATA`CONFIG`OBSTACLES`LABEL: |-
        Obstacles
      DATA`CONFIG`OBSTACLES`DESCRIPTION: |-
        The library +obstacle/add copies from: hazards, blocks and distractions.
      DATA`CONFIG`OBSTACLES`STORE: |-
        {{store}}
      DATA`CONFIG`OBSTACLES`PATH: |-
        OBS
      DATA`CONFIG`OBSTACLES`ENTRY: |-
        label
      DATA`CONFIG`OBSTACLES`FIELDS: |-
        label type rating weapon choice repercussions lock key countdown triggers outcome order
      DATA`CONFIG`OBSTACLES`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,30}$
      DATA`CONFIG`OBSTACLES`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`OBSTACLES`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`OBSTACLES`FIELD`LABEL`MAX: |-
        40
      DATA`CONFIG`OBSTACLES`FIELD`LABEL`PATTERN: |-
        ^[A-Za-z][A-Za-z0-9 '.-]*$
      DATA`CONFIG`OBSTACLES`FIELD`LABEL`LABEL: |-
        Name
      DATA`CONFIG`OBSTACLES`FIELD`LABEL`DESCRIPTION: |-
        Its name, which is also an aspect.
      DATA`CONFIG`OBSTACLES`FIELD`TYPE`TYPE: |-
        choice
      DATA`CONFIG`OBSTACLES`FIELD`TYPE`CHOICES: |-
        hazard block distraction
      DATA`CONFIG`OBSTACLES`FIELD`TYPE`DEFAULT: |-
        hazard
      DATA`CONFIG`OBSTACLES`FIELD`TYPE`LABEL: |-
        Type
      DATA`CONFIG`OBSTACLES`FIELD`TYPE`DESCRIPTION: |-
        Hazard, block or distraction.
      DATA`CONFIG`OBSTACLES`FIELD`RATING`TYPE: |-
        integer
      DATA`CONFIG`OBSTACLES`FIELD`RATING`DEFAULT: |-
        0
      DATA`CONFIG`OBSTACLES`FIELD`RATING`MIN: |-
        0
      DATA`CONFIG`OBSTACLES`FIELD`RATING`MAX: |-
        10
      DATA`CONFIG`OBSTACLES`FIELD`RATING`LABEL: |-
        Rating
      DATA`CONFIG`OBSTACLES`FIELD`RATING`DESCRIPTION: |-
        What it rolls or opposes with, written for PCs whose best skill is Great (+4). 0 for a distraction with no opposition.
      DATA`CONFIG`OBSTACLES`FIELD`WEAPON`TYPE: |-
        integer
      DATA`CONFIG`OBSTACLES`FIELD`WEAPON`DEFAULT: |-
        0
      DATA`CONFIG`OBSTACLES`FIELD`WEAPON`MIN: |-
        0
      DATA`CONFIG`OBSTACLES`FIELD`WEAPON`MAX: |-
        4
      DATA`CONFIG`OBSTACLES`FIELD`WEAPON`LABEL: |-
        Weapon
      DATA`CONFIG`OBSTACLES`FIELD`WEAPON`DESCRIPTION: |-
        Shifts it adds to a hit, 0 to 4.
      DATA`CONFIG`OBSTACLES`FIELD`CHOICE`TYPE: |-
        text
      DATA`CONFIG`OBSTACLES`FIELD`CHOICE`MAX: |-
        300
      DATA`CONFIG`OBSTACLES`FIELD`CHOICE`LABEL: |-
        Choice
      DATA`CONFIG`OBSTACLES`FIELD`CHOICE`DESCRIPTION: |-
        A distraction's question for the PCs.
      DATA`CONFIG`OBSTACLES`FIELD`REPERCUSSIONS`TYPE: |-
        list
      DATA`CONFIG`OBSTACLES`FIELD`REPERCUSSIONS`DELIMITER: |-
        |
      DATA`CONFIG`OBSTACLES`FIELD`REPERCUSSIONS`MAX: |-
        5
      DATA`CONFIG`OBSTACLES`FIELD`REPERCUSSIONS`LABEL: |-
        Repercussions
      DATA`CONFIG`OBSTACLES`FIELD`REPERCUSSIONS`DESCRIPTION: |-
        What happens if the PCs don't deal with a distraction, or for each way they choose, | between them.
      DATA`CONFIG`OBSTACLES`FIELD`LOCK`TYPE: |-
        text
      DATA`CONFIG`OBSTACLES`FIELD`LOCK`MAX: |-
        200
      DATA`CONFIG`OBSTACLES`FIELD`LOCK`LABEL: |-
        Resistance
      DATA`CONFIG`OBSTACLES`FIELD`LOCK`DESCRIPTION: |-
        A resistance's lock: the aspect saying what it is immune to. Nobody overcomes or disables it without the key.
      DATA`CONFIG`OBSTACLES`FIELD`KEY`TYPE: |-
        text
      DATA`CONFIG`OBSTACLES`FIELD`KEY`MAX: |-
        300
      DATA`CONFIG`OBSTACLES`FIELD`KEY`LABEL: |-
        Key
      DATA`CONFIG`OBSTACLES`FIELD`KEY`DESCRIPTION: |-
        The one thing that gets past its resistance.
      DATA`CONFIG`OBSTACLES`FIELD`COUNTDOWN`TYPE: |-
        integer
      DATA`CONFIG`OBSTACLES`FIELD`COUNTDOWN`DEFAULT: |-
        0
      DATA`CONFIG`OBSTACLES`FIELD`COUNTDOWN`MIN: |-
        0
      DATA`CONFIG`OBSTACLES`FIELD`COUNTDOWN`MAX: |-
        20
      DATA`CONFIG`OBSTACLES`FIELD`COUNTDOWN`LABEL: |-
        Countdown
      DATA`CONFIG`OBSTACLES`FIELD`COUNTDOWN`DESCRIPTION: |-
        The boxes of the countdown it starts when it is added, 0 for none.
      DATA`CONFIG`OBSTACLES`FIELD`TRIGGERS`TYPE: |-
        list
      DATA`CONFIG`OBSTACLES`FIELD`TRIGGERS`DELIMITER: |-
        |
      DATA`CONFIG`OBSTACLES`FIELD`TRIGGERS`MAX: |-
        10
      DATA`CONFIG`OBSTACLES`FIELD`TRIGGERS`LABEL: |-
        Triggers
      DATA`CONFIG`OBSTACLES`FIELD`TRIGGERS`DESCRIPTION: |-
        What marks a box of its countdown, | between them.
      DATA`CONFIG`OBSTACLES`FIELD`OUTCOME`TYPE: |-
        text
      DATA`CONFIG`OBSTACLES`FIELD`OUTCOME`MAX: |-
        300
      DATA`CONFIG`OBSTACLES`FIELD`OUTCOME`LABEL: |-
        Outcome
      DATA`CONFIG`OBSTACLES`FIELD`OUTCOME`DESCRIPTION: |-
        What happens when its countdown's last box is marked.
      DATA`CONFIG`OBSTACLES`FIELD`ORDER`TYPE: |-
        integer
      DATA`CONFIG`OBSTACLES`FIELD`ORDER`DEFAULT: |-
        50
      DATA`CONFIG`OBSTACLES`FIELD`ORDER`MIN: |-
        0
      DATA`CONFIG`OBSTACLES`FIELD`ORDER`MAX: |-
        999
      DATA`CONFIG`OBSTACLES`FIELD`ORDER`LABEL: |-
        Order
      DATA`CONFIG`OBSTACLES`FIELD`ORDER`DESCRIPTION: |-
        Where it comes in its type's list: lower first, then by name.

      # Which INC` routine each switch runs: DATA`ROUTE`<table>`<switch>. BARE is the command alone, ARG the
      # command with something after it and no switch.
      DATA`ROUTE: |-
        Which routine each switch runs. One leaf per switch.
      DATA`ROUTE`ADVERSARY`BARE: |-
        ADV`LIST
      DATA`ROUTE`ADVERSARY`ARG: |-
        ADV`SHOW
      DATA`ROUTE`ADVERSARY`LIST: |-
        ADV`LIST
      DATA`ROUTE`ADVERSARY`MAKE: |-
        ADV`MAKE
      DATA`ROUTE`ADVERSARY`BUILD: |-
        ADV`BUILD
      DATA`ROUTE`ADVERSARY`MOB: |-
        ADV`MOB
      DATA`ROUTE`ADVERSARY`STUNTS: |-
        ADV`STUNTS
      DATA`ROUTE`OBSTACLE`BARE: |-
        OBS`HERE
      DATA`ROUTE`OBSTACLE`ARG: |-
        OBS`SHOW
      DATA`ROUTE`OBSTACLE`LIST: |-
        OBS`LIBRARY
      DATA`ROUTE`OBSTACLE`ADD: |-
        OBS`ADD
      DATA`ROUTE`OBSTACLE`HAZARD: |-
        OBS`NEW
      DATA`ROUTE`OBSTACLE`BLOCK: |-
        OBS`NEW
      DATA`ROUTE`OBSTACLE`DISTRACTION: |-
        OBS`DISTRACTION
      DATA`ROUTE`OBSTACLE`REPERCUSSION: |-
        OBS`REPERCUSSION
      DATA`ROUTE`OBSTACLE`LOCK: |-
        OBS`LOCK
      DATA`ROUTE`OBSTACLE`ROLL: |-
        OBS`ROLL
      DATA`ROUTE`OBSTACLE`OVERCOME: |-
        OBS`OVERCOME
      DATA`ROUTE`OBSTACLE`DISABLE: |-
        OBS`OVERCOME
      DATA`ROUTE`OBSTACLE`REMOVE: |-
        OBS`REMOVE
      DATA`ROUTE`COUNTDOWN`BARE: |-
        CD`LIST
      DATA`ROUTE`COUNTDOWN`ARG: |-
        CD`SHOW
      DATA`ROUTE`COUNTDOWN`START: |-
        CD`START
      DATA`ROUTE`COUNTDOWN`TRIGGER: |-
        CD`TRIGGER
      DATA`ROUTE`COUNTDOWN`OUTCOME: |-
        CD`OUTCOME
      DATA`ROUTE`COUNTDOWN`TICK: |-
        CD`TICK
      DATA`ROUTE`COUNTDOWN`UNTICK: |-
        CD`UNTICK
      DATA`ROUTE`COUNTDOWN`HIDE: |-
        CD`HIDE
      DATA`ROUTE`COUNTDOWN`STOP: |-
        CD`STOP

      # ---- commands ---------------------------------------------------------------
      # %1 the switches and %2 what follows, exactly as typed.
      CMD`ADVERSARY:
        value: |-
          $(?is)^\+adversary(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,adversary,table,ADVERSARY,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`OBSTACLE:
        value: |-
          $(?is)^\+obstacle(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,obstacle,table,OBSTACLE,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`COUNTDOWN:
        value: |-
          $(?is)^\+countdown(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,countdown,table,COUNTDOWN,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      # A line a bridge adds to one of this object's messages: HINT`<message>, set by a bridge such as
      # fate-adversary-toolkit-help. Nothing when no bridge set one.
      FUN`HINT:
        value: |-
          if(hasattr(%!,HINT`%0),%b[u(%!/HINT`%0,%1,%2)])
        flags: [funsyntax]
      INC`COMMAND`RUN:
        value: |-
          @assert hastype(%#,player)=@pemit %#=notice(ucstr(%<word>),Only players use +%<word>.,warn); think u(%!/FUN`COMMAND`PARSE,%<word>,%<table>,%<switches>,%<argument>); @assert lte(words(%q<cmd_switch_list>),1)=@pemit %#=notice(%q<cmd_tag>,Use one switch at a time.,warn); @assert strlen(%q<cmd_route>)=@pemit %#=notice(%q<cmd_tag>,+%q<cmd_word> has no /%q<cmd_switch> switch.[u(%!/FUN`HINT,SWITCHES,%q<cmd_word>)],warn); @include %!/INC`%q<cmd_route>
        flags: [cmdsyntax]
      # %0 the word, %1 its route table, %2 the switches and %3 the argument, as typed. Sets cmd_word, cmd_tag,
      # cmd_switch_list, cmd_switch, cmd_argument, cmd_has_equals, cmd_left_side and cmd_right_side around the
      # first =, cmd_route (the INC` routine to run), viewer_objid and viewer_keeper.
      FUN`COMMAND`PARSE:
        value: |-
          setqm(cmd_word,lcstr(%0),
          cmd_tag,ucstr(%0),
          cmd_switch_list,lcstr(trim(edit(%2,/,%b))),
          cmd_switch,first(%q<cmd_switch_list>),
          cmd_argument,trim(%3),
          cmd_has_equals,strmatch(%3,*=*),
          cmd_left_side,trim(before(%3,=)),
          cmd_right_side,trim(after(%3,=)),
          cmd_route,get(%!/DATA`ROUTE`%1`[if(strlen(%q<cmd_switch>),ucstr(%q<cmd_switch>),if(strlen(%q<cmd_argument>),ARG,BARE))]),
          viewer_objid,objid(%#),
          viewer_keeper,u({{sheet-fate/sheet}}/FUN`PERM`KEEPER,%#))
        flags: [funsyntax]

      # ---- guards -----------------------------------------------------------------
      # %<path> TPL or OBS, %<typed> a name: tpl_key, the library entry.
      INC`NEED`TPL:
        value: |-
          @assert strlen(setr(tpl_key,u(%!/FUN`TPL`FIND,%<path>,%<typed>)))=@pemit %#=notice(%q<cmd_tag>,There is no [if(strmatch(%<path>,TPL),adversary,obstacle)] called '[trim(%<typed>)]' in the library. +[if(strmatch(%<path>,TPL),adversary,obstacle/list)] lists them.,warn)
        flags: [cmdsyntax]
      # A name for a new NPC: up to 40 letters, digits, spaces, dots, dashes and apostrophes, and nobody's yet.
      INC`NEED`NPCNAME:
        value: |-
