  # The +help topics, on an object of their own. fate-adversary-toolkit-help registers it with +help; without
  # that bridge nothing reads it. HELP`<TOPIC> is a topic, its subtopics the leaves beneath, LOCK`<TOPIC> who
  # may read it.
  - ref: adversary_help
    type: thing
    name: Fate Adversary Toolkit Help
    location: "{{adversary}}"
    attributes:
      HELP: |-
        Opposition for the Fate sheet: +adversary, +obstacle and +countdown.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`ADVERSARY: |-
        obstacle countdown npc encounter
      SEE`OBSTACLE: |-
        adversary countdown encounter
      SEE`COUNTDOWN: |-
        adversary obstacle encounter
      HELP`ADVERSARY: |-
        `+adversary` is a library of ready opposition for the Fate sheet's `+npc`: threats that soak up hits, hitters that deal them, bosses, and fillers that come in groups.

        - `+adversary` lists the library; `+adversary <name>` shows one in full.
        - `+adversary/make <name>\[/<PCs' best skill>\]\[=<new name>\]` copies one into `+npc` as yours. Its ratings move up or down to match your PCs: the game sets their best skill \(`+help adversary settings`\), and `/<rating>` overrides it for one copy.
        - `+adversary/build <name>=<type> <skills>` makes one from the toolkit's recipe: `+help adversary build`.
        - `+adversary/mob <filler>\[=<how many>\]` brings a group of fillers into the encounter you run: `+help adversary mob`.
        - `+adversary/stunts` lists quick stunts for an enemy who may not last past one fight.

        What you make is an ordinary NPC: `+npc`, `+npc/aspect`, `+npc/stunt` and `+encounter/npc` work on it. `+npc/set <npc>/type=`, `lock=`, `key=` and `limit=` set its type, a resistance and a limitation \(`+help obstacle constraints`\).

        For example:

        `+adversary/make baron/4=Baron`

        Output: `\[ADVERSARY\] Done: You make Baron, a boss, its ratings raised 1 step for PCs whose best skill is Great (+4). +npc Baron shows it, and +encounter/npc Baron brings it into an encounter. +countdown/start Baron von Darkness starts its countdown.`

        `+help adversary credits` names the source this is based on.
      HELP`ADVERSARY`BUILD: |-
        `+adversary/build <name>=<type> <skill> <skill>...\[/<PCs' best skill>\]` builds an NPC on the Adversary Toolkit's recipe for its type. Name its skills best first.

        - **threat**: its best skill one above the PCs' best, two a step lower, three two steps lower; long stress tracks and a mild consequence, and a stunt that helps it last.
        - **hitter**: the same skills, short stress tracks and no consequences, and Weapon:2 with its best skill.
        - **boss**: its best skill two above the PCs', then two, three, four skills a step lower each, down to Fair; every other skill Average \(+1\); mild and moderate consequences.
        - **filler** `average`, `fair` or `good`: one skill at Average, Fair or Good \(a good filler also has a second at Average\), one stress box per step, no consequences.
        - `tough` after threat, hitter or boss \(`threat tough fight will`\) adds one to every skill and a consequence.

        Physique and Will lengthen a threat's or boss's stress tracks, as they do a PC's. On a game of approaches the skills you name are read as approaches \(`+help adversary settings`\).

        For example:

        `+adversary/build Bruiser=threat physique fight athletics`

        Output: `\[ADVERSARY\] Done: You build Bruiser, a threat against PCs whose best skill is Great (+4): Physique Superb (+5), Fight Great (+4), and Athletics Great (+4); stress physical \[ \] \[ \] \[ \] \[ \] \[ \] and mental \[ \] \[ \] \[ \]; consequences mild (2). +npc/aspect and +npc/stunt finish it, and +npc Bruiser shows it.`
      HELP`ADVERSARY`MOB: |-
        `+adversary/mob <filler>\[=<how many>\]` brings 2 to 12 copies of a filler into the encounter you run as one NPC, `<name> x<n>`. Three when you leave the number out.

        - The group has the filler's skills, one higher for every two fillers in it, to Great \(+4\) at most.
        - Its stress track is every filler's boxes in a row. `+encounter/harm` marks them from the left, and a hit can take out several fillers at once.
        - As fillers go down, its skills drop to match. The harm message says how many are still up.

        Only an NPC with no consequences, a filler, groups into a mob.

        For example:

        `+adversary/mob Grunt=4`

        Output: `\[ADVERSARY\] Gina brings in Grunt x4: 4 of 4 up, Fight Good (+3); \[ \] | \[ \] | \[ \] | \[ \].`

        `+encounter/harm Grunt=2`

        Output: `\[SHEET\] Grunt x4 takes a hit of 2 shifts. Physical stress boxes 1 and 2 take it all. 2 of 4 still up: Fight Fair (+2).`
      HELP`ADVERSARY`SETTINGS: |-
        `+config adversary` lists the settings and `+config adversary/<setting>=<value>` changes one \(`config.admin`\):

        - `peak`: the PCs' best skill, which `/make` and `/build` scale to. 0, the default, takes the Fate sheet's skill cap.
        - `mob_cap`: how high a mob's skills go \(4\).
        - `track_skills`: which skill lengthens which stress track for a built threat or boss \(`physical:physique mental:will`\).
        - `approaches`: on a game of approaches, the approach each skill an adversary was written with becomes.
        - `adversaries` and `obstacles`: the library. `+config adversary/adversaries/<entry>` shows one entry's fields, and `+config/add adversary/adversaries/<key>=<name>` adds one.
      LOCK`ADVERSARY`SETTINGS: |-
        perm^config.admin
      HELP`ADVERSARY`CREDITS: |-
        Enemies, obstacles, constraints and the recipes for each are based on the Fate Adversary Toolkit SRD. Forward Scout, Baron von Darkness and the library's obstacles, and the dragon's, alien's and wall's resistances, are its examples; the other adversaries are this package's own.

        This work is based on the Fate Adversary Toolkit SRD \(found at http://www.faterpg.com/\), a product of Evil Hat Productions, LLC, developed, authored, and edited by Brian Engard, Lara Turner, Joshua Yearsley, and Anna Meade, and licensed for our use under the Creative Commons Attribution 3.0 Unported license \(http://creativecommons.org/licenses/by/3.0/\).

        Fate is a trademark of Evil Hat Productions, LLC. This is an unofficial package: this game is not affiliated with or endorsed by Evil Hat Productions.
      HELP`OBSTACLE: |-
        An obstacle makes a scene harder but cannot be fought: the PCs get past it, put up with it or take it out of play. Obstacles go into an encounter and end with it.

        - **hazard**: acts each exchange, rolling its rating, and adds its Weapon when it hits.
        - **block**: takes no turn. Getting past it is an overcome against its rating; failing against a harmful one hits by the margin plus its Weapon.
        - **distraction**: a choice for the PCs, with repercussions if they leave it, and sometimes an opposition to roll against.

        Players in the encounter:

        - `+obstacle` lists the ones there; `+obstacle <name>` shows one.
        - `+obstacle/overcome <obstacle>=<skill>\[+<n>\]` rolls to get past one or deal with it.
        - `+obstacle/disable <obstacle>=<skill>\[+<n>\]` takes a risk to take it out of play: against a block's rating plus two, a hazard's rating.

        See `+help obstacle gm` for putting them in, and `+help obstacle constraints` for resistances and limitations.

        For example:

        `+obstacle/overcome acid=athletics`

        Output: `\[OBSTACLE\] Pat tries to get past Acid Vat: Athletics: 4dF\[1, 1, -1, 0\] + 0 = 1 (Average) against Good (+3): fail, 2 shifts short (roll 7) Acid Vat hits them for 6 shifts: the margin and its Weapon:4.`
      HELP`OBSTACLE`GM: |-
        The GM of an encounter, and sheet keepers, put obstacles in and run them:

        - `+obstacle/list` lists the library; `+obstacle/list <name>` shows one.
        - `+obstacle/add <obstacle>\[/<PCs' best skill>\]\[=<name>\]` puts one from the library in, its rating moved to match the PCs. One with a countdown starts it.
        - `+obstacle/hazard <name>=<rating>\[/<weapon>\]` and `+obstacle/block <name>=<rating>\[/<weapon>\]` make one: `+obstacle/hazard Flame Jets=great/2`.
        - `+obstacle/distraction <name>=<choice>\[/<opposition>\]` makes a distraction; `+obstacle/repercussion <obstacle>=<what happens>` adds what leaving it costs.
        - `+obstacle/roll <hazard>\[+<n>\]\[=<opposition>\]` takes a hazard's turn. Against an opposition it says how hard it hits.
        - `+obstacle/remove <obstacle>` takes one out.

        A hazard's rating is usually at least the PCs' best skill; a block's no more than one above it.

        For example:

        `+obstacle/roll sniper+1=fair`

        Output: `\[OBSTACLE\] Distant Sniper acts: Distant Sniper: 4dF\[0, -1, 0, 1\] + 6 = 6 (Fantastic) against Fair (+2): success with style, 4 shifts (roll 2) As an attack it hits for 8 shifts, with its Weapon:4.`
      HELP`OBSTACLE`CONSTRAINTS: |-
        Constraints change how the PCs must deal with an adversary.

        - A **resistance** is a lock, an aspect saying what it is immune to, and a key, the one thing that gets past it. `+obstacle/lock <obstacle>=<lock>\[/<key>\]` sets one on an obstacle, and nobody overcomes or disables it until the GM clears it with `+obstacle/lock <obstacle>=`. On an NPC: `+npc/set <npc>/lock=<lock>` and `+npc/set <npc>/key=<key>`.
        - A **limitation** is a fact or aspect that makes the obvious approach a bad idea, such as a werewolf who is a PC's son: `+npc/set <npc>/limit=<limitation>`.
        - A **countdown** makes it urgent: `+help countdown`.

        Use one resistance at a time, and one or two limitations an adventure: they are there to make a foe memorable, not to stop play.

        For example:

        `+obstacle/lock Razor Wire=Electrified/Cut the power at the junction box`

        Output: `\[OBSTACLE\] Done: Razor Wire is Electrified: nobody overcomes or disables it without the key: Cut the power at the junction box`
      HELP`COUNTDOWN: |-
        A countdown is a row of boxes: each trigger marks one, and when the last is marked its outcome happens. A countdown started in an encounter you run belongs to it and ends with it; one started anywhere else lasts until it is stopped.

        - `+countdown` lists the countdowns you can see here; `+countdown <name>` shows one with its triggers.
        - `+countdown/start <name>=<boxes>\[/<outcome>\]` starts one, 1 to 20 boxes. `+countdown/start <adversary or obstacle>` starts the one from the library.
        - `+countdown/trigger <name>=<trigger>` notes what marks a box; `+countdown/outcome <name>=<outcome>` changes what happens at the end.
        - `+countdown/tick <name>\[=<why>\]` marks a box for the room to see; `+countdown/untick <name>` takes one back.
        - `+countdown/hide <name>` keeps it to you and sheet keepers, ticks too; again shows it.
        - `+countdown/stop <name>` ends it.

        Whoever started a countdown and sheet keepers change it.

        For example:

        `+countdown/tick bomb=An exchange elapses`

        Output: `\[COUNTDOWN\] Ticking Time Bomb moves on (An exchange elapses): \[X\] \[ \] \[ \] \[ \]`

  # The Fate sheet's hooks. Each runs as the Fate Sheet, which is WIZARD and so may call this object.
  - ref: sheet_hooks
    target: "{{sheet-fate/sheet}}"
    attributes:
      # NPC fields (+npc/set <npc>/<field>=<value>): its type, a resistance's lock and key, and a limitation.
      NPCFIELD`TYPE:
        value: |-
          if(member(threat hitter boss filler,lcstr(%0)),lcstr(%0),#-1 An adversary's type is threat%, hitter%, boss or filler.)
        flags: [funsyntax]
      NPCFIELD`LOCK:
        value: |-
          if(lte(strlen(%0),200),%0,#-1 Keep a lock to 200 characters.)
        flags: [funsyntax]
      NPCFIELD`KEY:
        value: |-
          if(lte(strlen(%0),300),%0,#-1 Keep a key to 300 characters.)
        flags: [funsyntax]
      NPCFIELD`LIMIT:
        value: |-
          if(lte(strlen(%0),300),%0,#-1 Keep a limitation to 300 characters.)
        flags: [funsyntax]
      # A filler mob loses members as its boxes are marked, and gets them back as they are cleared.
      AFTER`NPC`MOB:
        value: |-
          if(strlen(get(%0`MOB`SIZE)),setq(am_left,u({{adversary}}/FUN`MOB`LEFT,%0))[if(neq(%q<am_left>,get(%0`MOB`LEFT)),[u({{adversary}}/FUN`MOB`SET,%0,%q<am_left>)][if(%q<am_left>,[%q<am_left>] of [get(%0`MOB`SIZE)] still up: [itemize(iter(u({{sheet-fate/sheet}}/FUN`NPC`SKILLORDER,%0),[u({{sheet-fate/sheet}}/FUN`TRAIT`LABEL,%i0)] [u({{sheet-fate/sheet}}/FUN`LADDER`SHOW,get(%0`SKILL`%i0))],%b,|),|)].,Every one of them is down.)])])
        flags: [funsyntax]
