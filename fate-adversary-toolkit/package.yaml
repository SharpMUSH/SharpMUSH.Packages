        flags: [funsyntax]
      FUN`CLAMP:
        value: |-
          max(-2,min(8,%0))
        flags: [funsyntax]
      # %0 a skill as written: this game's key for it, its approach on a game of approaches, or nothing.
      FUN`SKILL`KEY:
        value: |-
          firstof(u({{sheet-fate/sheet}}/FUN`TRAIT`FIND,%0),if(strmatch(get({{sheet-fate/sheet}}/DATA`CONFIG`MODE),approaches),u({{sheet-fate/sheet}}/FUN`TRAIT`FIND,after(first(graball(get(%!/DATA`CONFIG`APPROACHES),[lcstr(%0)]:*)),:))))
        flags: [funsyntax]
      # %0 the NPC's number, %1 a library key, %2 the name, %3 the steps to move its ratings, %4 who makes it.
      # Writes it into +npc and returns the skills this game has no key for.
      FUN`TPL`MAKE:
