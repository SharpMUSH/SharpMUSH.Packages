          @pemit %#=u(%!/FUN`SCREEN`STUNTS)
        flags: [cmdsyntax]

      # ---- the library -----------------------------------------------------------------
      # %0 TPL or OBS, %1 typed text: the key whose key or name it is, else the only one whose name it starts.
      FUN`TPL`FIND:
        value: |-
          setqm(tf_typed,lcstr(trim(%1)),tf_all,iter(lattr({{store}}/%0`*),last(%i0,`)))[setqm(tf_exact,first(iter(%q<tf_all>,if(cor(not(comp(lcstr(%i0),%q<tf_typed>)),not(comp(lcstr(get({{store}}/%0`%i0)),%q<tf_typed>))),%i0))),tf_start,squish(iter(%q<tf_all>,if(not(comp(left(lcstr(get({{store}}/%0`%i0)),strlen(%q<tf_typed>)),%q<tf_typed>)),%i0))))][setq(tf_word,squish(iter(%q<tf_all>,if(strmatch(%b[lcstr(get({{store}}/%0`%i0))],*%b%q<tf_typed>*),%i0))))][if(strlen(%q<tf_typed>),firstof(%q<tf_exact>,if(eq(words(%q<tf_start>),1),%q<tf_start>),if(eq(words(%q<tf_word>),1),%q<tf_word>)))]
        flags: [funsyntax]
      # %0 TPL or OBS, %1 a type: its entries, by ORDER and then name.
      FUN`TPL`OFTYPE:
        value: |-
          iter(sort(iter(lattr({{store}}/%0`*),if(strmatch(get({{store}}/%i0`TYPE),%1),[rjust(default({{store}}/%i0`ORDER,50),3,0)][edit(lcstr(get({{store}}/%i0)),%b,_)]~[last(%i0,`)]))),after(%i0,~))
        flags: [funsyntax]
