          setqm(tm_at,{{sheet-fate/npcs}}/NPC`%0,tm_tpl,{{store}}/TPL`%1,tm_dropped,,tm_type,get({{store}}/TPL`%1`TYPE))[attrib_set(%q<tm_at>,%2)][attrib_set(%q<tm_at>`KIND,if(member(threat boss,%q<tm_type>),major,minor))][attrib_set(%q<tm_at>`OWNER,%4)][attrib_set(%q<tm_at>`FIELD`TYPE,%q<tm_type>)][if(strlen(get(%q<tm_tpl>`REST)),null(iter(u({{sheet-fate/sheet}}/FUN`TRAIT`ALL),attrib_set(%q<tm_at>`SKILL`%i0,get(%q<tm_tpl>`REST)))))][null(iter(get(%q<tm_tpl>`SKILLS),if(strlen(setr(tm_key,u(%!/FUN`SKILL`KEY,before(%i0,:)))),attrib_set(%q<tm_at>`SKILL`%q<tm_key>,max(u(%!/FUN`CLAMP,add(after(%i0,:),%3)),if(strlen(get(%q<tm_at>`SKILL`%q<tm_key>)),if(strmatch(get(%q<tm_tpl>`REST),get(%q<tm_at>`SKILL`%q<tm_key>)),-2,get(%q<tm_at>`SKILL`%q<tm_key>)),-2))),setq(tm_dropped,%q<tm_dropped> [before(%i0,:)]))))][null(iter(get(%q<tm_tpl>`ASPECTS),attrib_set(%q<tm_at>`ASPECT`#@,%i0),|,|))][null(iter(get(%q<tm_tpl>`STUNTS),attrib_set(%q<tm_at>`STUNT`#@,%i0),|,|))][null(iter(get(%q<tm_tpl>`BOXES),if(strlen(setr(tm_track,u({{sheet-fate/sheet}}/FUN`LIST`FIND,TRACK,before(%i0,:)))),attrib_set(%q<tm_at>`BOXES`%q<tm_track>,after(%i0,:)))))][attrib_set(%q<tm_at>`SLOTS,squish(iter(u({{sheet-fate/sheet}}/FUN`LIST`ALL,CONSEQUENCE),if(member(ucstr(get(%q<tm_tpl>`SLOTS)),%i0),%i0))))][null(iter(LOCK KEY LIMIT,if(strlen(get(%q<tm_tpl>`%i0)),attrib_set(%q<tm_at>`FIELD`%i0,get(%q<tm_tpl>`%i0)))))]%q<tm_dropped>
        flags: [funsyntax]

      # ---- the recipes -----------------------------------------------------------------
      # %0 what follows = in +adversary/build, without the peak. Sets build_type, build_tough, build_quality,
      # build_typed (the skills as typed), build_keys (this game's keys for them) and build_unknown.
      FUN`BUILD`READ:
        value: |-
          setqm(build_words,lcstr(%0),build_type,first(%q<build_words>),build_rest,rest(%q<build_words>))[setq(build_tough,t(member(tough nasty dangerous,first(%q<build_rest>))))][if(%q<build_tough>,setq(build_rest,rest(%q<build_rest>)))][setq(build_quality,if(strmatch(%q<build_type>,filler),first(%q<build_rest>)))][if(strlen(%q<build_quality>),setq(build_rest,rest(%q<build_rest>)))][setqm(build_typed,%q<build_rest>,build_keys,squish(iter(%q<build_rest>,u(%!/FUN`SKILL`KEY,%i0))),build_unknown,squish(iter(%q<build_rest>,if(strlen(u(%!/FUN`SKILL`KEY,%i0)),,%i0))))]
        flags: [funsyntax]
      # %0 type, %1 quality, %2 tough, %3 peak: the ratings it gives, best first, one per skill it has room for.
      # Threats and hitters: the apex one step over the peak (two when tough), two a step below, three below that.
      # Bosses: the apex two steps over, then two, three, four... a step lower each, down to Fair (+2). Fillers:
