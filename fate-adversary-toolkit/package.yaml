h(trim([if(%q<build_tough>,tough)] %q<build_quality> %q<build_type>))] against PCs whose best skill is [u({{sheet-fate/sheet}}/FUN`LADDER`SHOW,%q<tpl_peak>)]: [u(%!/FUN`BUILD`SUMMARY,{{sheet-fate/npcs}}/NPC`%q<make_id>)]. +npc/aspect and +npc/stunt finish it%, and +npc %q<cmd_left_side> shows it.,ok)
        flags: [cmdsyntax]
