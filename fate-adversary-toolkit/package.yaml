          setq(sc_ids,u(%!/FUN`CD`VISIBLE,%0))[box(if(words(%q<sc_ids>),ldatatable(lit({"nowrap":"1|2|3","grow":"|||1"}),Countdown|Boxes|Started by|Then,iter(%q<sc_ids>,[get({{countdowns}}/CD`%i0)][if(get({{countdowns}}/CD`%i0`HIDDEN),%b%(hidden%))]|[u(%!/FUN`CD`TRACK,%i0)]|[name(get({{countdowns}}/CD`%i0`OWNER))]|[firstof(get({{countdowns}}/CD`%i0`OUTCOME),-)],%b,%*<^>),%*<^>)%r[rule()]%r[tone(muted,+countdown <name> shows one with its triggers. +countdown/tick <name> marks a box.)],tone(muted,No countdowns here. +countdown/start <name>=<boxes> starts one.)),Countdowns)]
        flags: [funsyntax]
      FUN`SCREEN`COUNTDOWN:
        value: |-
          setqm(sc1_at,{{countdowns}}/CD`%0,sc1_trigs,sort(iter(lattr({{countdowns}}/CD`%0`TRIG`*),last(%i0,`)),n))[box(lfields(,Boxes%*<|>Triggers%*<|>Outcome%*<|>Started by%*<|>Where,[u(%!/FUN`CD`TRACK,%0)] [get(%q<sc1_at>`MARKED)] of [get(%q<sc1_at>`BOXES)]%*<|>[firstof(iter(%q<sc1_trigs>,get(%q<sc1_at>`TRIG`%i0),%b,%b·%b),none written)]%*<|>[firstof(get(%q<sc1_at>`OUTCOME),none written)]%*<|>[name(get(%q<sc1_at>`OWNER))]%*<|>[name(get(%q<sc1_at>`ROOM))][if(strlen(get(%q<sc1_at>`ENC)),%, in [u({{sheet-fate/sheet}}/FUN`ENC`TITLE,get(%q<sc1_at>`ENC))])][if(get(%q<sc1_at>`HIDDEN),%, hidden)],%*<|>)%r[rule()]%r[tone(muted,+countdown/tick [get(%q<sc1_at>)]%[=<why>%] marks a box%, /untick takes one back%, /stop ends it.)],get(%q<sc1_at>))]
        flags: [funsyntax]

      # ---- lifecycle ----------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP:
        value: |-
          @command/add/noparse/rsnoparse +adversary; @hook/override/inline +adversary=%!,CMD`ADVERSARY; @command/add/noparse/rsnoparse +obstacle; @hook/override/inline +obstacle=%!,CMD`OBSTACLE; @command/add/noparse/rsnoparse +countdown; @hook/override/inline +countdown=%!,CMD`COUNTDOWN
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

