      INC`ADV`MOB:
        value: |-
          @assert strlen(%q<cmd_left_side>)=@pemit %#=notice(ADVERSARY,+adversary/mob <filler>%[=<how many>%] brings a group of fillers from +npc into the encounter you run%, as one.,warn); @include %!/INC`NEED`GM; @assert strlen(setr(npc_id,u({{sheet-fate/sheet}}/FUN`NPC`FIND,%q<cmd_left_side>,%#)))=@pemit %#=notice(ADVERSARY,There is no opposition called '%q<cmd_left_side>' that you can use. +npc lists them.,warn); think setq(mob_count,firstof(%q<cmd_right_side>,3)); @assert cand(isint(%q<mob_count>),gte(%q<mob_count>,2),lte(%q<mob_count>,12))=@pemit %#=notice(ADVERSARY,A mob is 2 to 12 fillers.,warn); @assert not(words(get({{sheet-fate/npcs}}/NPC`%q<npc_id>`SLOTS)))=@pemit %#=notice(ADVERSARY,[get({{sheet-fate/npcs}}/NPC`%q<npc_id>)] has consequences: only fillers%, which have none%, group into a mob.,warn); @assert lte(words(u({{sheet-fate/sheet}}/FUN`ENC`NPCS,%q<enc_id>)),29)=@pemit %#=notice(ADVERSARY,An encounter holds up to 30 NPCs.,warn); think setq(mob_name,u({{sheet-fate/sheet}}/FUN`ENC`SPAWN,%q<enc_id>,%q<npc_id>,1)); think setq(mob_at,{{sheet-fate/encounters}}/ENC`%q<enc_id>`N`[get({{sheet-fate/encounters}}/ENC`%q<enc_id>`NEXTN)]); think u(%!/FUN`MOB`MAKE,%q<mob_at>,%q<mob_count>); @remit %q<enc_room>=notice(ADVERSARY,tone(strong,name(%#)) brings in [get(%q<mob_at>)]: [u(%!/FUN`MOB`SUMMARY,%q<mob_at>)].)
        flags: [cmdsyntax]
      INC`ADV`STUNTS:
