format: "1.16"
package: atomic-robo-config
title: "Atomic Robo: +config settings"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the Atomic Robo settings and its modes and scales tables into +config: registers them with the +config registry, so staff see and change them with +config atomic-robo."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, fate, config, bridge]
category: Characters
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. atomic-robo declares its settings
# as DATA`CONFIG`<NAME>, with their types and limits, and reads them with get() whether or not +config is
# installed. This package is the one leaf that tells the +config registry where they are.
depends:
  - package: atomic-robo
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH.Packages
      path: atomic-robo/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`ATOMIC-ROBO: |-
        {{atomic-robo/science}}
