format: "1.16"
package: sheet-d20
title: "D20 sheet"
version: 2.2.0
authors: [SharpMUSH]
description: "A d20 character sheet built from a ledger: six ability scores, a skill list the game edits, training, level, hit points, coin and gear, with separate audited ledgers for XP, coin and gear. Guided character creation, XP advances, +check rolls 1d20 plus a trait against a DC, and encounters that keep their own copy of each sheet, with foes from a bestiary the game edits, initiative, turns and conditions."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, d20, dice, checks, encounters]
category: Characters
requires_server: ">=0.1"

# One permission, for the people who keep sheets: change any character's sheet at any time and read every
# sheet. A player fills in their own sheet until they are approved. Changing the traits and settings is
# config.admin, as +config is.
categories:
  roles:
    - name: D20 sheet
      description: Roles for the people who keep d20 character sheets.
  permissions:
    - name: D20 sheet
      description: Keeping d20 character sheets.
permissions:
  - name: softcode.d20.admin
    category: D20 sheet
    description: Read every d20 sheet and change any character's at any time.
roles:
  - slug: d20-sheet-keeper
    name: D20 Sheet Keeper
    category: D20 sheet
    priority: 11
    permissions:
      softcode.d20.admin: allow

# Every character's D20 tree is their d20 sheet: only wizards write it, so a player can't make the root
# before the sheet does, and it is never a command.
attributes:
  D20:
    flags: [wizard, no_command]

objects:
  # The command object, in the master room. WIZARD because it adds the commands (@command/add, @hook),
  # writes the sheet attributes on characters, and reads them for other packages.
  #
  # A character's sheet is built from their ledger, D20`LEDGER`<n>: one JSON entry for each step (a score, an
  # advance, a skill's training, a level, a revoke, a clear), each with the wizard attribute flag, so only this
  # object or a wizard writes one and an entry without the flag is never read. Before approval a player's change
  # rewrites their own chargen entry for it; every other change is a new entry, so the ledger is the sheet's
  # history; D20`MERGED caches the entries in force. XP, coin and gear each have a ledger of their own,
  # D20`XPLEDGER`<n>, D20`MONEYLEDGER`<n> and D20`GEARLEDGER`<n>, and D20`XP, D20`COIN and D20`GEAR`<KEY>
  # (<count>|<name>) cache their running totals. In play: D20`DAMAGE, D20`ENCOUNTERS (the encounters they are
  # in, in the order they joined) and D20`USING (the one /use picked). The D20 root is wizard-flagged, so only
  # this object writes any of them.
  #
  # +sheet, +check and +encounter are added with /noparse/rsnoparse and hooked to CMD`<word>, so what a player
  # types reaches the code exactly as typed and nothing a player wrote is ever evaluated.
  #
  # Trees: CMD` the hooked commands, INC`COMMAND` the parse and dispatch, INC`SHEET`, INC`CHECK` and
  # INC`ENCOUNTER` one routine per switch, INC`NEED` the guards they share, INC`DO` the writes. FUN`LEDGER`
  # and FUN`BUILD` read the ledger, FUN`BOOK` the XP, coin and gear ledgers, FUN`VIEW` and FUN`V` the view a roll or screen reads (the sheet, or an
  # encounter's copy), FUN`GEAR` items, FUN`ENC` encounters, FUN`CHARGEN` character creation, FUN`TRAIT` the
  # trait table, FUN`RATING` the numbers, FUN`PERM` who may do what, FUN`SCREEN` and FUN`DISPLAY` the screens.
  # API` the functions other packages call (VISUAL), the same names in every sheet package. Bridges add
  # HINT`<message> lines, GATE`EDIT (a reason a player may not change their own sheet now) and
  # ALLOW`VIEW`<name> (who else may read a sheet).
  - ref: sheet
    type: thing
    name: D20 Sheet
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      # ---- settings ---------------------------------------------------------------
      # +config d20 shows and changes them (sheet-d20-config); the code reads each with get(%!/DATA`CONFIG`<NAME>).
      DATA`CONFIG: |-
        Settings for the d20 sheet. One leaf per setting.
      DATA`CONFIG`LABEL: |-
        D20 sheet
      DATA`CONFIG`SCORE-DEFAULT: |-
        10
      DATA`CONFIG`SCORE-DEFAULT`TYPE: |-
        integer
      DATA`CONFIG`SCORE-DEFAULT`DEFAULT: |-
        10
      DATA`CONFIG`SCORE-DEFAULT`MIN: |-
        1
      DATA`CONFIG`SCORE-DEFAULT`MAX: |-
        30
      DATA`CONFIG`SCORE-DEFAULT`LABEL: |-
        Score before it is set
      DATA`CONFIG`SCORE-DEFAULT`DESCRIPTION: |-
        The ability score a character has until one is set.
      DATA`CONFIG`SCORE-DEFAULT`EXAMPLE: |-
        8
      DATA`CONFIG`SCORE-MIN: |-
        1
      DATA`CONFIG`SCORE-MIN`TYPE: |-
        integer
      DATA`CONFIG`SCORE-MIN`DEFAULT: |-
        1
      DATA`CONFIG`SCORE-MIN`MIN: |-
        1
      DATA`CONFIG`SCORE-MIN`MAX: |-
        30
      DATA`CONFIG`SCORE-MIN`LABEL: |-
        Lowest score
      DATA`CONFIG`SCORE-MIN`DESCRIPTION: |-
        The lowest ability score +sheet/set takes.
      DATA`CONFIG`SCORE-MIN`EXAMPLE: |-
        3
      DATA`CONFIG`SCORE-MAX: |-
        20
      DATA`CONFIG`SCORE-MAX`TYPE: |-
        integer
      DATA`CONFIG`SCORE-MAX`DEFAULT: |-
        20
      DATA`CONFIG`SCORE-MAX`MIN: |-
        1
      DATA`CONFIG`SCORE-MAX`MAX: |-
        30
      DATA`CONFIG`SCORE-MAX`LABEL: |-
        Highest score
      DATA`CONFIG`SCORE-MAX`DESCRIPTION: |-
        The highest score a player's advances take an ability to. Sheet keepers may go to 30.
      DATA`CONFIG`SCORE-MAX`EXAMPLE: |-
        18
      DATA`CONFIG`LEVEL-MAX: |-
        20
      DATA`CONFIG`LEVEL-MAX`TYPE: |-
        integer
      DATA`CONFIG`LEVEL-MAX`DEFAULT: |-
        20
      DATA`CONFIG`LEVEL-MAX`MIN: |-
        1
      DATA`CONFIG`LEVEL-MAX`MAX: |-
        100
      DATA`CONFIG`LEVEL-MAX`LABEL: |-
        Highest level
      DATA`CONFIG`LEVEL-MAX`DESCRIPTION: |-
        The highest level a character can have.
      DATA`CONFIG`LEVEL-MAX`EXAMPLE: |-
        10
      DATA`CONFIG`BONUS-BASE: |-
        2
      DATA`CONFIG`BONUS-BASE`TYPE: |-
        integer
      DATA`CONFIG`BONUS-BASE`DEFAULT: |-
        2
      DATA`CONFIG`BONUS-BASE`MIN: |-
        0
      DATA`CONFIG`BONUS-BASE`MAX: |-
        10
      DATA`CONFIG`BONUS-BASE`LABEL: |-
        Training bonus at level 1
      DATA`CONFIG`BONUS-BASE`DESCRIPTION: |-
        What a trained skill adds at level 1. An expert adds it twice.
      DATA`CONFIG`BONUS-BASE`EXAMPLE: |-
        3
      DATA`CONFIG`BONUS-EVERY: |-
        4
      DATA`CONFIG`BONUS-EVERY`TYPE: |-
        integer
      DATA`CONFIG`BONUS-EVERY`DEFAULT: |-
        4
      DATA`CONFIG`BONUS-EVERY`MIN: |-
        0
      DATA`CONFIG`BONUS-EVERY`MAX: |-
        100
      DATA`CONFIG`BONUS-EVERY`LABEL: |-
        Levels per bonus step
      DATA`CONFIG`BONUS-EVERY`DESCRIPTION: |-
        The training bonus grows by 1 every this many levels after the first. 0 keeps it the same at every level.
      DATA`CONFIG`BONUS-EVERY`EXAMPLE: |-
        5
      DATA`CONFIG`CRITS: |-
        1
      DATA`CONFIG`CRITS`TYPE: |-
        boolean
      DATA`CONFIG`CRITS`DEFAULT: |-
        1
      DATA`CONFIG`CRITS`LABEL: |-
        Natural 20 and natural 1
      DATA`CONFIG`CRITS`DESCRIPTION: |-
        Whether a natural 20 on the die is a critical success and a natural 1 a critical failure, whatever the total.
      DATA`CONFIG`CRITS`EXAMPLE: |-
        no
      DATA`CONFIG`DCS: |-
        5 10 15 20 25
      DATA`CONFIG`DCS`TYPE: |-
        list
      DATA`CONFIG`DCS`DEFAULT: |-
        5 10 15 20 25
      DATA`CONFIG`DCS`MIN: |-
        5
      DATA`CONFIG`DCS`MAX: |-
        5
      DATA`CONFIG`DCS`CHECK: |-
        CHECK`DCS
      DATA`CONFIG`DCS`LABEL: |-
        DC for each difficulty
      DATA`CONFIG`DCS`DESCRIPTION: |-
        The DC of trivial, easy, standard, hard and extreme, in that order.
      DATA`CONFIG`DCS`EXAMPLE: |-
        5 10 13 16 20
      DATA`CONFIG`PUBLIC: |-
        0
      DATA`CONFIG`PUBLIC`TYPE: |-
        boolean
      DATA`CONFIG`PUBLIC`DEFAULT: |-
        0
      DATA`CONFIG`PUBLIC`LABEL: |-
        Sheets anyone can read
      DATA`CONFIG`PUBLIC`DESCRIPTION: |-
        Whether +sheet <name> shows anyone's sheet to everyone. Otherwise only the character and sheet keepers see it.
      DATA`CONFIG`PUBLIC`EXAMPLE: |-
        yes
      DATA`CONFIG`ARRAY: |-
        15 14 13 12 10 8
      DATA`CONFIG`ARRAY`TYPE: |-
        list
      DATA`CONFIG`ARRAY`DEFAULT: |-
        15 14 13 12 10 8
      DATA`CONFIG`ARRAY`MIN: |-
        1
      DATA`CONFIG`ARRAY`MAX: |-
        12
      DATA`CONFIG`ARRAY`CHECK: |-
        CHECK`ARRAY
      DATA`CONFIG`ARRAY`LABEL: |-
        Starting scores
      DATA`CONFIG`ARRAY`DESCRIPTION: |-
        The scores a new character shares out among their abilities, one each.
      DATA`CONFIG`ARRAY`EXAMPLE: |-
        16 14 12 12 10 8
      DATA`CONFIG`TRAINED: |-
        4
      DATA`CONFIG`TRAINED`TYPE: |-
        integer
      DATA`CONFIG`TRAINED`DEFAULT: |-
        4
      DATA`CONFIG`TRAINED`MIN: |-
        0
      DATA`CONFIG`TRAINED`MAX: |-
        30
      DATA`CONFIG`TRAINED`LABEL: |-
        Skills a new character trains
      DATA`CONFIG`TRAINED`DESCRIPTION: |-
        How many skills a new character is trained in.
      DATA`CONFIG`TRAINED`EXAMPLE: |-
        3
      DATA`CONFIG`HP-LEVEL: |-
        8
      DATA`CONFIG`HP-LEVEL`TYPE: |-
        integer
      DATA`CONFIG`HP-LEVEL`DEFAULT: |-
        8
      DATA`CONFIG`HP-LEVEL`MIN: |-
        1
      DATA`CONFIG`HP-LEVEL`MAX: |-
        30
      DATA`CONFIG`HP-LEVEL`LABEL: |-
        Hit points a level
      DATA`CONFIG`HP-LEVEL`DESCRIPTION: |-
        The hit points a character has for each level, before the hit point ability's modifier.
      DATA`CONFIG`HP-LEVEL`EXAMPLE: |-
        6
      DATA`CONFIG`HP-ABILITY: |-
        con
      DATA`CONFIG`HP-ABILITY`TYPE: |-
        text
      DATA`CONFIG`HP-ABILITY`DEFAULT: |-
        con
      DATA`CONFIG`HP-ABILITY`MAX: |-
        20
      DATA`CONFIG`HP-ABILITY`CHECK: |-
        CHECK`ABILITY
      DATA`CONFIG`HP-ABILITY`LABEL: |-
        Hit point ability
      DATA`CONFIG`HP-ABILITY`DESCRIPTION: |-
        The key of the ability whose modifier adds to the hit points of every level. Empty adds none.
      DATA`CONFIG`HP-ABILITY`EXAMPLE: |-
        str
      DATA`CONFIG`ADVANCE: |-
        10
      DATA`CONFIG`ADVANCE`TYPE: |-
        integer
      DATA`CONFIG`ADVANCE`DEFAULT: |-
        10
      DATA`CONFIG`ADVANCE`MIN: |-
        1
      DATA`CONFIG`ADVANCE`MAX: |-
        999
      DATA`CONFIG`ADVANCE`LABEL: |-
        XP for an advance
      DATA`CONFIG`ADVANCE`DESCRIPTION: |-
        The XP an approved player spends to take an advance: a level, +1 to an ability, or a step of training in a skill.
      DATA`CONFIG`ADVANCE`EXAMPLE: |-
        20
      # The traits, a +config table: entries on the store under TRAIT`, each holding its label, with KIND
      # (ability or skill) and, for a skill, ABILITY (the ability it adds) beneath.
      DATA`CONFIG`TRAITS`TYPE: |-
        table
      DATA`CONFIG`TRAITS`LABEL: |-
        Traits
      DATA`CONFIG`TRAITS`DESCRIPTION: |-
        The abilities and skills on every sheet.
      DATA`CONFIG`TRAITS`STORE: |-
        {{store}}
      DATA`CONFIG`TRAITS`PATH: |-
        TRAIT
      DATA`CONFIG`TRAITS`ENTRY: |-
        label
      DATA`CONFIG`TRAITS`FIELDS: |-
        label kind ability order
      DATA`CONFIG`TRAITS`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`TRAITS`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`TRAITS`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`TRAITS`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`TRAITS`FIELD`LABEL`LABEL: |-
        Label
      DATA`CONFIG`TRAITS`FIELD`LABEL`DESCRIPTION: |-
        The name the sheet shows.
      DATA`CONFIG`TRAITS`FIELD`KIND`TYPE: |-
        choice
      DATA`CONFIG`TRAITS`FIELD`KIND`CHOICES: |-
        ability skill
      DATA`CONFIG`TRAITS`FIELD`KIND`DEFAULT: |-
        skill
      DATA`CONFIG`TRAITS`FIELD`KIND`LABEL: |-
        Kind
      DATA`CONFIG`TRAITS`FIELD`KIND`DESCRIPTION: |-
        ability: a score, adding (score - 10) / 2, rounded down. skill: adds its ability's and the training bonus.
      DATA`CONFIG`TRAITS`FIELD`ABILITY`TYPE: |-
        text
      DATA`CONFIG`TRAITS`FIELD`ABILITY`MAX: |-
        20
      DATA`CONFIG`TRAITS`FIELD`ABILITY`CHECK: |-
        CHECK`ABILITY
      DATA`CONFIG`TRAITS`FIELD`ABILITY`LABEL: |-
        Ability
      DATA`CONFIG`TRAITS`FIELD`ABILITY`DESCRIPTION: |-
        For a skill, the key of the ability it adds, such as str.
      DATA`CONFIG`TRAITS`FIELD`ORDER`TYPE: |-
        integer
      DATA`CONFIG`TRAITS`FIELD`ORDER`DEFAULT: |-
        50
      DATA`CONFIG`TRAITS`FIELD`ORDER`MIN: |-
        0
      DATA`CONFIG`TRAITS`FIELD`ORDER`MAX: |-
        999
      DATA`CONFIG`TRAITS`FIELD`ORDER`LABEL: |-
        Order
      DATA`CONFIG`TRAITS`FIELD`ORDER`DESCRIPTION: |-
        Where it comes in its list: lower first, then by name.
      DATA`CONFIG`FOES`TYPE: |-
        table
      DATA`CONFIG`FOES`LABEL: |-
        Foes
      DATA`CONFIG`FOES`DESCRIPTION: |-
        The bestiary: the foes a GM adds to an encounter with +foe/add.
      DATA`CONFIG`FOES`STORE: |-
        {{store}}
      DATA`CONFIG`FOES`PATH: |-
        FOE
      DATA`CONFIG`FOES`ENTRY: |-
        label
      DATA`CONFIG`FOES`FIELDS: |-
        label ac hp init attack damage level notes
      DATA`CONFIG`FOES`KEYPATTERN: |-
        ^[A-Za-z0-9-]{1,20}$
      DATA`CONFIG`FOES`FIELD`LABEL`TYPE: |-
        text
      DATA`CONFIG`FOES`FIELD`LABEL`MIN: |-
        1
      DATA`CONFIG`FOES`FIELD`LABEL`MAX: |-
        30
      DATA`CONFIG`FOES`FIELD`LABEL`LABEL: |-
        Label
      DATA`CONFIG`FOES`FIELD`LABEL`DESCRIPTION: |-
        The name it goes by; each one added gets a number after it.
      DATA`CONFIG`FOES`FIELD`AC`TYPE: |-
        integer
      DATA`CONFIG`FOES`FIELD`AC`DEFAULT: |-
        10
      DATA`CONFIG`FOES`FIELD`AC`MIN: |-
        1
      DATA`CONFIG`FOES`FIELD`AC`MAX: |-
        40
      DATA`CONFIG`FOES`FIELD`AC`LABEL: |-
        AC
      DATA`CONFIG`FOES`FIELD`AC`DESCRIPTION: |-
        What an attack must meet to hit it.
      DATA`CONFIG`FOES`FIELD`HP`TYPE: |-
        integer
      DATA`CONFIG`FOES`FIELD`HP`DEFAULT: |-
        5
      DATA`CONFIG`FOES`FIELD`HP`MIN: |-
        1
      DATA`CONFIG`FOES`FIELD`HP`MAX: |-
        999
      DATA`CONFIG`FOES`FIELD`HP`LABEL: |-
        Hit points
      DATA`CONFIG`FOES`FIELD`HP`DESCRIPTION: |-
        Its most hit points.
      DATA`CONFIG`FOES`FIELD`INIT`TYPE: |-
        integer
      DATA`CONFIG`FOES`FIELD`INIT`DEFAULT: |-
        0
      DATA`CONFIG`FOES`FIELD`INIT`MIN: |-
        -10
      DATA`CONFIG`FOES`FIELD`INIT`MAX: |-
        20
      DATA`CONFIG`FOES`FIELD`INIT`LABEL: |-
        Initiative
      DATA`CONFIG`FOES`FIELD`INIT`DESCRIPTION: |-
        What it adds to its initiative roll.
      DATA`CONFIG`FOES`FIELD`ATTACK`TYPE: |-
        integer
      DATA`CONFIG`FOES`FIELD`ATTACK`DEFAULT: |-
        2
      DATA`CONFIG`FOES`FIELD`ATTACK`MIN: |-
        -10
      DATA`CONFIG`FOES`FIELD`ATTACK`MAX: |-
        30
      DATA`CONFIG`FOES`FIELD`ATTACK`LABEL: |-
        Attack
      DATA`CONFIG`FOES`FIELD`ATTACK`DESCRIPTION: |-
        What it adds to its attack roll.
      DATA`CONFIG`FOES`FIELD`DAMAGE`TYPE: |-
        text
      DATA`CONFIG`FOES`FIELD`DAMAGE`DEFAULT: |-
        1d6
      DATA`CONFIG`FOES`FIELD`DAMAGE`MIN: |-
        1
      DATA`CONFIG`FOES`FIELD`DAMAGE`MAX: |-
        20
      DATA`CONFIG`FOES`FIELD`DAMAGE`CHECK: |-
        CHECK`DICE
      DATA`CONFIG`FOES`FIELD`DAMAGE`LABEL: |-
        Damage
      DATA`CONFIG`FOES`FIELD`DAMAGE`DESCRIPTION: |-
        The dice its attack deals, such as 1d6+2.
      DATA`CONFIG`FOES`FIELD`LEVEL`TYPE: |-
        integer
      DATA`CONFIG`FOES`FIELD`LEVEL`DEFAULT: |-
        1
      DATA`CONFIG`FOES`FIELD`LEVEL`MIN: |-
        0
      DATA`CONFIG`FOES`FIELD`LEVEL`MAX: |-
        30
      DATA`CONFIG`FOES`FIELD`LEVEL`LABEL: |-
        Level
      DATA`CONFIG`FOES`FIELD`LEVEL`DESCRIPTION: |-
        How hard it is, for the bestiary's order.
      DATA`CONFIG`FOES`FIELD`NOTES`TYPE: |-
        text
      DATA`CONFIG`FOES`FIELD`NOTES`MIN: |-
        0
      DATA`CONFIG`FOES`FIELD`NOTES`MAX: |-
        300
      DATA`CONFIG`FOES`FIELD`NOTES`LABEL: |-
        Notes
      DATA`CONFIG`FOES`FIELD`NOTES`DESCRIPTION: |-
        How it fights, for the GM.
      # +config's CHECK for a foe's damage (%0): dice that roll() reads.
      CHECK`DICE: |-
        if(cand(lte(strlen(%0),20),strmatch(lcstr(%0),*d*),isint(roll(%0))),,Give dice such as 1d6+2.)
      # +config's CHECK for DCS (%0 the list): five whole numbers, each above the one before.
      CHECK`DCS: |-
        if(cand(every(%!/FUN`IS`WHOLE,%0),eq(words(%0),5),not(comp(%0,sort(%0,n))),eq(words(setunion(%0,%0,,n)),5)),,Give five whole numbers from trivial to extreme%, each higher than the last.)
      # +config's CHECK for an ability key (%0 the key): an ability on the sheet, or nothing.
      CHECK`ABILITY: |-
        if(cor(not(strlen(%0)),strmatch(get({{store}}/TRAIT`%0`KIND),ability)),,There is no ability with the key %0.)
      # +config's CHECK for ARRAY (%0 the list): whole numbers from 1 to 30.
      CHECK`ARRAY: |-
        if(every(%!/FUN`IS`SCORE,%0),,Give whole numbers from 1 to 30%, one for each ability.)
      FUN`IS`WHOLE: |-
        cand(isint(%0),gte(%0,0))
      FUN`IS`SCORE: |-
        cand(isint(%0),gte(%0,1),lte(%0,30))

      # Which INC` routine each switch runs: DATA`ROUTE`<table>`<switch>. BARE is the command alone, ARG the
      # command with something after it and no switch. +check's switches are all CHECK`ROLL's.
      DATA`ROUTE: |-
        Which routine each switch runs. One leaf per switch.
      DATA`ROUTE`SHEET`BARE: |-
        SHEET`SHOW
      DATA`ROUTE`SHEET`ARG: |-
        SHEET`SHOW
      DATA`ROUTE`SHEET`SET: |-
        SHEET`SET
      DATA`ROUTE`SHEET`CHARGEN: |-
        SHEET`CHARGEN
      DATA`ROUTE`SHEET`ADVANCE: |-
        SHEET`ADVANCE
      DATA`ROUTE`SHEET`LEDGER: |-
        SHEET`LEDGER
      DATA`ROUTE`SHEET`REVOKE: |-
        SHEET`REVOKE
      DATA`ROUTE`SHEET`CLEAR: |-
        SHEET`CLEAR
      DATA`ROUTE`SHEET`XP: |-
        SHEET`XP
      DATA`ROUTE`SHEET`DAMAGE: |-
        SHEET`DAMAGE
      DATA`ROUTE`SHEET`HEAL: |-
        SHEET`HEAL
      DATA`ROUTE`SHEET`COIN: |-
        SHEET`COIN
      DATA`ROUTE`SHEET`GEAR: |-
        SHEET`GEAR
      DATA`ROUTE`SHEET`USE: |-
        SHEET`USE
      DATA`ROUTE`SHEET`TRAITS: |-
        SHEET`TRAITS
      DATA`ROUTE`SHEET`LOG: |-
        SHEET`LOG
      DATA`ROUTE`SHEET`REBUILD: |-
        SHEET`REBUILD
      DATA`ROUTE`CHECK`BARE: |-
        CHECK`USAGE
      DATA`ROUTE`CHECK`ARG: |-
        CHECK`ROLL
      DATA`ROUTE`ENCOUNTER`BARE: |-
        ENCOUNTER`SHOW
      DATA`ROUTE`ENCOUNTER`ARG: |-
        ENCOUNTER`SHOW
      DATA`ROUTE`ENCOUNTER`START: |-
        ENCOUNTER`START
      DATA`ROUTE`ENCOUNTER`JOIN: |-
        ENCOUNTER`JOIN
      DATA`ROUTE`ENCOUNTER`USE: |-
        ENCOUNTER`USE
      DATA`ROUTE`ENCOUNTER`ADD: |-
        ENCOUNTER`ADD
      DATA`ROUTE`ENCOUNTER`REMOVE: |-
        ENCOUNTER`REMOVE
      DATA`ROUTE`ENCOUNTER`LEAVE: |-
        ENCOUNTER`LEAVE
      DATA`ROUTE`ENCOUNTER`KEEP: |-
        ENCOUNTER`KEEP
      DATA`ROUTE`ENCOUNTER`END: |-
        ENCOUNTER`END
      DATA`ROUTE`ENCOUNTER`INITIATIVE: |-
        ENCOUNTER`INITIATIVE
      DATA`ROUTE`ENCOUNTER`NEXT: |-
        ENCOUNTER`NEXT
      DATA`ROUTE`ENCOUNTER`ORDER: |-
        ENCOUNTER`ORDER
      DATA`ROUTE`ENCOUNTER`CONDITION: |-
        ENCOUNTER`CONDITION
      DATA`ROUTE`FOE`BARE: |-
        FOE`LIST
      DATA`ROUTE`FOE`ARG: |-
        FOE`SHOW
      DATA`ROUTE`FOE`BESTIARY: |-
        FOE`BESTIARY
      DATA`ROUTE`FOE`RUN: |-
        FOE`RUN
      DATA`ROUTE`FOE`ADD: |-
        FOE`ADD
      DATA`ROUTE`FOE`REMOVE: |-
        FOE`REMOVE
      DATA`ROUTE`FOE`DAMAGE: |-
        FOE`DAMAGE
      DATA`ROUTE`FOE`HEAL: |-
        FOE`HEAL
      DATA`ROUTE`FOE`ATTACK: |-
        FOE`ATTACK
      # What each training value is called.
      DATA`TRAINING`0: |-
        untrained
      DATA`TRAINING`1: |-
        trained
      DATA`TRAINING`2: |-
        expert
      DATA`DIFFICULTIES: |-
        trivial easy standard hard extreme
      # The most entries a character's ledger holds; +sheet/clear starts it again.
      # The most foes one encounter holds.
      DATA`FOE`MAX: |-
        30
      DATA`LEDGER`MAX: |-
        200
      # The most entries each of a character's XP, coin and gear ledgers keeps; past it the oldest entry that a
      # later one replaces goes.
      DATA`LOG`MAX: |-
        500

      # ---- commands ---------------------------------------------------------------
      # %1 the switches and %2 what follows, exactly as typed.
      CMD`SHEET:
        value: |-
          $(?is)^\+sheet(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,sheet,table,SHEET,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`CHECK:
        value: |-
          $(?is)^\+check(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,check,table,CHECK,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`ENCOUNTER:
        value: |-
          $(?is)^\+encounter(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,encounter,table,ENCOUNTER,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`FOE:
        value: |-
          $(?is)^\+foe(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,foe,table,FOE,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      # A line a bridge adds to one of this object's messages: HINT`<message>, set here by a bridge such as
      # sheet-d20-help. %1 on are passed to it. Nothing when no bridge set one, so the message stands without it.
      FUN`HINT:
        value: |-
          if(hasattr(%!,HINT`%0),%b[u(%!/HINT`%0,%1,%2)])
        flags: [funsyntax]
      # Parses the command, checks the switch, and runs its routine. +check takes several switches at once
