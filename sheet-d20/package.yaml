      FUN`INIT`ROLL:
        value: |-
          %1~[add(die(1,20),if(strmatch(%1,F*),u(%!/FUN`FOE`GET,%0,after(%1,F),init),u(%!/FUN`V`RATING,get({{encounters}}/ENC`%0`COPY`[after(%1,P)]),DEX)))]
        flags: [funsyntax]
      FUN`INIT`SORT:
        value: |-
          revwords(sortkey(%!/FUN`INIT`KEY,squish(%0),n))
        flags: [funsyntax]
      FUN`INIT`KEY:
        value: |-
          last(%0,~)
        flags: [funsyntax]
      # %0 an encounter, %1 its order, %2 the turn now: the next place whose token can act, or 0.
      FUN`INIT`NEXT:
        value: |-
          firstof(first(squish(iter(lnum(1,words(%1)),[setq(in_idx,inc(mod(add(dec(%2),%i0),words(%1))))][if(u(%!/FUN`TOKEN`LIVE,%0,first(extract(%1,%q<in_idx>,1),~)),%q<in_idx>)]))),0)
        flags: [funsyntax]
