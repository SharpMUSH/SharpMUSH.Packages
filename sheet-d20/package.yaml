  # The +help topics, on an object of their own. sheet-d20-help registers it with +help; without that bridge
  # nothing reads it. HELP`<TOPIC> is a topic, its subtopics the leaves beneath, LOCK`<TOPIC> who may read it.
  - ref: sheet_help
    type: thing
    name: D20 Sheet Help
    location: "{{sheet}}"
    attributes:
      HELP: |-
        Your character's d20 sheet, and rolling against it: +sheet and +check.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`SHEET: |-
        check
      SEE`CHECK: |-
        sheet
      HELP`SHEET: |-
        `+sheet` shows your character's sheet: six ability scores, your level, and a list of skills, each untrained, trained or expert.

        - `+sheet` shows your own; `+sheet <name>` shows another character's, when the game lets you read it.
        - `+sheet/set <trait>=<value>` fills in your sheet until your character is approved: `+sheet/set str=14`, `+sheet/set athletics=trained`, `+sheet/set level=3`. Leave the value out to clear it.
        - `+sheet/gear <item>=<count>` lists what you carry: `+sheet/gear Rope=1`. A count of 0 takes it off. `+sheet/set coin=<n>` sets your coin.
        - `+sheet/traits` lists every ability and skill, with the key you type for each.

        An ability adds its modifier to a roll: the score less 10, halved and rounded down, so 14 adds +2 and 9 adds -1. A skill adds its ability's modifier, plus the training bonus when you are trained, twice it when you are an expert. The bonus is +2 at level 1 and grows as you level.

        For example, with Strength 14 at level 1:

        `+sheet/set athletics=trained`

        Output: `\[SHEET\] Done: Athletics is trained on Alice's sheet.` Athletics now adds +4.

        Once you are approved, staff change your sheet. See `+help check` for rolling.
      HELP`CHECK: |-
        `+check <trait>` rolls 1d20 and adds what a trait adds, where the room sees it.

        - `+check <trait>=<DC>` rolls against a number: `+check athletics=15`.
        - `+check <trait>=<difficulty>` rolls against a difficulty: trivial, easy, standard, hard or extreme, DC 5 to 25 unless your game changed them.
        - `+check <trait>+<n>` or `-<n>` adds or takes away a number for this roll: `+check stealth+2=hard`.
        - `/private` rolls where only you see it. `/advantage` rolls two dice and keeps the higher, `/disadvantage` the lower.

        Meeting the DC is a success. A natural 20 on the die is a critical success and a natural 1 a critical failure, whatever the total, unless your game turns that off. Every check is kept under a number that `rollinfo()` reads back.

        For example:

        `+check/advantage perception=15`

        Output: `\[SHEET\] Alice checks Perception: 2d20kh\[17, (4)\] + 2 = 19 vs DC 15: success (roll 42)`
      LOCK`SHEET`STAFF: |-
        perm^softcode.d20.admin
      HELP`SHEET`STAFF: |-
        Sheet keepers \(`softcode.d20.admin`, or the D20 Sheet Keeper role\) read every sheet and change any character's at any time:

        - `+sheet <name>` shows a character's sheet.
        - `+sheet/set <name>/<trait>=<value>` changes it: `+sheet/set Alice/level=4`, `+sheet/set Alice/coin=50`. A keeper may set a score up to 30.
        - `+sheet/gear <name>/<item>=<count>` changes their gear: `+sheet/gear Alice/Healing potion=2`.

        `@role/assign <player>=d20-sheet-keeper` makes someone a keeper.
      LOCK`SHEET`SETTINGS: |-
        perm^config.admin
      HELP`SHEET`SETTINGS: |-
        `+config d20` lists the settings and `+config d20/<setting>=<value>` changes one \(`config.admin`\):

        - `score-default`, `score-min`, `score-max`: an ability score before it is set \(10\), the lowest \(1\) and the highest a player gives themselves \(20\).
        - `level-max`: the highest level \(20\).
        - `bonus-base`, `bonus-every`: the training bonus at level 1 \(2\), and how many levels it takes to grow by 1 \(4\).
        - `crits`: whether a natural 20 and a natural 1 decide a check \(yes\).
        - `dcs`: the DCs of trivial, easy, standard, hard and extreme \(`5 10 15 20 25`\).
        - `public`: whether anyone may read anyone's sheet \(no\).
        - `traits`: the abilities and skills. `+config d20/traits` lists them; `+config/add d20/traits/climb=Climb` adds one, then `+config d20/traits/climb/ability=str` says what it adds.

        A skill's ability is the key of an ability. Removing a trait leaves what characters had stored, but the sheet stops showing it.
