        flags: [funsyntax]
      FUN`CHARGEN`UNSET:
        value: |-
          iter(u(%!/FUN`TRAIT`OFKIND,ability),if(strlen(u(%!/FUN`BUILD`BASE,%0,%i0)),,%i0))
        flags: [funsyntax]
      # %0 a character: what to do next, after a step, for a player making their own character. Nothing otherwise.
      FUN`CHARGEN`AFTER:
        value: |-
          if(cand(not(comp(%0,%q<viewer_objid>)),not(isapproved(%#))),%b[u(%!/FUN`CHARGEN`NEXT,%0)])
        flags: [funsyntax]
      FUN`CHARGEN`NEXT:
        value: |-
