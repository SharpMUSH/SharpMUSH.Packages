  # The encounters running now. Inside the D20 Sheet and no_command, like the store. ENC`<n> is one encounter,
  # with ROOM, GM, STARTED and COPY`<dbref number> (one member's copy of their sheet, a view) beneath, and
  # FOE`<k>, ORDER, TURN, ROUND and COND`<token> for the fighting. RUN`<dbref number> is the encounter a GM's
  # +foe commands use.
  - ref: encounters
    type: thing
    name: D20 Encounters
    location: "{{sheet}}"
    flags: [no_command]
    attributes:
      ENC: |-
        The encounters running now, one branch each.

  # The +help topics, on an object of their own. sheet-d20-help registers it with +help; without that bridge
  # nothing reads it. HELP`<TOPIC> is a topic, its subtopics the leaves beneath, LOCK`<TOPIC> who may read it.
  - ref: sheet_help
    type: thing
    name: D20 Sheet Help
    location: "{{sheet}}"
    attributes:
      HELP: |-
        Your character's d20 sheet, rolling against it, encounters and their foes: +sheet, +check, +encounter and +foe.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`SHEET: |-
        check encounter
      SEE`CHECK: |-
        sheet encounter
      SEE`ENCOUNTER: |-
        sheet check foe
      SEE`FOE: |-
        encounter check
      HELP`SHEET: |-
        `+sheet` shows your character's sheet: level, hit points, coin, XP, six ability scores, your skills and your gear.

        - `+sheet` shows your own; `+sheet <name>` another character's, when the game lets you read it.
        - `+sheet/chargen` shows the steps of making your character and what to do next.
        - `+sheet/traits` lists every ability and skill, with the key you type for each.
        - `+sheet/ledger` lists every entry your sheet is built from, oldest first.

        An ability adds its modifier to a roll: the score less 10, halved and rounded down, so 14 adds +2 and 9 adds -1. A skill adds its ability's modifier, plus the training bonus when you are trained, twice it when you are an expert. The bonus is +2 at level 1 and grows as you level.

        Your sheet is built from its ledger: each score, training and advance is an entry. Once you are approved, `+sheet/advance` spends XP and staff make other changes.

        For example:

        `+sheet/chargen`

        Output: `1. Abilities done: Strength 15, Dexterity 14, ...`

        See `+help sheet chargen` for making a character, `+help sheet play` for hit points, coin, gear and advances, and `+help check` for rolling.
      HELP`SHEET`CHARGEN: |-
        Making a character takes two steps. `+sheet/chargen` shows each and what comes next.

        1. `+sheet/set <ability>=<score>` gives an ability one of the starting scores, 15, 14, 13, 12, 10 and 8 unless your game changed them. `+sheet/set <ability>=` frees its score again.
        2. `+sheet/set <skill>=trained` trains a skill, four of them unless your game changed that. `+sheet/set <skill>=untrained` takes one back.

        A new character is level 1. Expert training and higher levels come from advances after approval.

        `+sheet/gear <item>=<count>` and `+sheet/coin <n>` set what you start with.

        For example:

        `+sheet/set str=15`

        Output: `\[SHEET\] Done: Strength is 15 on Alice's sheet. Next: +sheet/set <ability>=<score>. Left to give: 14, 13, 12, 10, and 8.`

        When both steps are done, your sheet is complete. Once you are approved, staff change it.
      HELP`SHEET`PLAY: |-
        In play you keep your own hit points, coin and gear:

        - `+sheet/damage <n>` takes hit points, down to 0. `+sheet/heal <n>` gives them back; `+sheet/heal all` heals every one.
        - `+sheet/use <item>` spends one of an item: `+sheet/use healing potion`.
        - `+sheet/coin -<n> [<reason>]` spends coin: `+sheet/coin -5 Rope`.

        Once you are approved, staff add coin and gear. XP, coin and gear each keep a ledger of their own: `+sheet/log` shows the latest entries of each, who made them and why, and `+sheet/log xp`, `coin` or `gear` more of one. In an encounter these change your copy there, not your sheet. See `+help encounter`.

        Staff give XP. Once you are approved, `+sheet/advance` spends 10 XP, unless your game changed that, on one of:

        - `+sheet/advance level`: a level, so more hit points and in time a higher training bonus.
        - `+sheet/advance <ability>`: +1 to its score, up to 20.
        - `+sheet/advance <skill>`: untrained to trained, or trained to expert.

        For example:

        `+sheet/advance stealth`

        Output: `\[SHEET\] Done: Alice advances: Stealth expert (10 XP spent).`
      HELP`CHECK: |-
        `+check <trait>` rolls 1d20 and adds what a trait adds, where the room sees it.

        - `+check <trait>=<DC>` rolls against a number: `+check athletics=15`.
        - `+check <trait>=<difficulty>` rolls against a difficulty: trivial, easy, standard, hard or extreme, DC 5 to 25 unless your game changed them.
        - `+check <trait>+<n>` or `-<n>` adds or takes away a number for this roll: `+check stealth+2=hard`.
        - `/private` rolls where only you see it. `/advantage` rolls two dice and keeps the higher, `/disadvantage` the lower.

        Meeting the DC is a success. A natural 20 on the die is a critical success and a natural 1 a critical failure, whatever the total, unless your game turns that off. In an encounter you roll from your copy there. Every check is kept under a number that `rollinfo()` reads back.

        For example:

        `+check/advantage perception=15`

        Output: `\[SHEET\] Alice checks Perception: 2d20kh\[17, (4)\] + 2 = 19 vs DC 15: success (roll 42)`
      HELP`ENCOUNTER: |-
        An encounter is a scene played from copies of the sheets, so hit points lost, coin spent and gear used in it stay there. It lasts until its GM ends it, over as many days as it takes.

        - `+encounter` lists the encounters here and yours; `+encounter <n>` shows one.
        - `+encounter/start [<title>]` starts one in your room. You run it.
        - `+encounter/join [<n>]` takes part with a copy of your sheet as it is now.
        - `+encounter/leave [<n>]` comes out; your copy there is gone.
        - `+encounter/use <n>` picks which copy you roll from, when you are in more than one here.

        While you are in an encounter's room, `+check`, damage, healing, coin and gear use your copy in it. Anywhere else, your sheet.

        For example:

        `+encounter/join 1`

        Output: `\[ENCOUNTER\] Alice joins 1 (Goblin ambush).`

        See `+help encounter gm` for running one, `+help encounter combat` for turns, and `+help foe` for foes.
      HELP`ENCOUNTER`GM: |-
        Whoever starts an encounter runs it; sheet keepers run any. Give the number after `=` when the room has more than one.

        - `+encounter/add <name>[=<n>]` brings someone in the room into it, with a copy of their sheet.
        - `+encounter/remove <name>[=<n>]` takes them out; their copy goes.
        - `+encounter/keep <name>[=<n>]` writes their damage, coin and gear from the copy to their sheet.
        - `+encounter/end [<n>]` ends it. Every copy goes, and nothing is written back unless you kept it first.

        While a member plays from your encounter's copy, you change it: `+sheet/damage <name>=<n>`, `/heal`, `/coin`, `/gear <name>/<item>=<count>` and `/use`.

        For example:

        `+encounter/keep Alice=1`

        Output: `\[ENCOUNTER\] Done: Alice's sheet keeps the damage, coin and gear from 1 (Goblin ambush).`
      HELP`ENCOUNTER`COMBAT: |-
        Fighting in an encounter goes in initiative order. The GM, or a sheet keeper, runs it:

        - `+encounter/initiative` rolls 1d20 for everyone in it: a member adds Dexterity from their copy, a foe its initiative. Highest goes first.
        - `+encounter/initiative =<name or foe>` rolls for one more, such as someone who joined late.
        - `+encounter/next` passes the turn on. Whoever's turn it is may pass it too. Foes that are down and anyone who left are passed over; after the last comes a new round.
        - `+encounter/order` shows the round, the order, hit points and conditions.
        - `+encounter/condition <name or foe>=<condition> [<rounds>]` marks a condition, such as `prone 1`. With rounds, it counts down at the start of each of its holder's turns. `=!<condition>` takes it off.

        Give the encounter's number before `=` when the room has more than one: `+encounter/initiative 2`.

        For example:

        `+encounter/next`

        Output: `\[ENCOUNTER\] Round 2: Goblin 1's turn. No longer prone.`

        See `+help foe` for adding and running foes.
      HELP`FOE: |-
        Foes are the GM's side of an encounter, added from the game's bestiary. Each is numbered, so two goblins are Goblin 1 and Goblin 2.

        - `+foe` lists the foes in the encounter here; `+foe <foe>` shows one. Name a foe by its number or its name.
        - `+foe/bestiary` lists what the GM can add; `+foe/bestiary <kind>` shows one.
        - `+check <trait>=<foe>` rolls against that foe's AC: `+check athletics=goblin 2`.

        Nothing a foe takes reaches the bestiary, and the foes go when the encounter ends.

        For example:

        `+check athletics=goblin 1`

        Output: `\[SHEET\] Alice checks Athletics: 1d20\[15\] + 4 = 19 vs Goblin 1's AC 13: success (roll 61)`

        See `+help foe gm` for running them.
      HELP`FOE`GM: |-
        The GM of an encounter, or a sheet keeper, runs its foes:

        - `+foe/add <kind>[=<count>]` adds foes from the bestiary: `+foe/add goblin=3`.
        - `+foe/remove <foe>` takes one out.
        - `+foe/attack <foe>` rolls its attack and damage for the room. `+foe/attack <foe>=<name>` names the target; `=<name>/<AC>` also gives their AC, and a hit takes the damage off their copy.
        - `+foe/damage <foe>=<n>` takes hit points; at 0 it is down. `+foe/heal <foe>=<n>` or `=all` gives them back.
        - `+foe/run <n>` picks which encounter your `+foe` commands use, when the room has several.

        On a natural 20 the attack hits and its damage dice are doubled; on a natural 1 it misses, unless your game turns that off.

        For example:

        `+foe/attack goblin 1=Alice/15`

        Output: `\[ENCOUNTER\] Goblin 1 attacks Alice: 1d20\[14\] + 4 = 18 vs AC 15: hit, 1d6\[3\] + 2 = 5 damage. Alice has 12/17 hit points. (roll 62)`

        Staff change the bestiary with `+config d20/foes`.
      LOCK`SHEET`STAFF: |-
        perm^softcode.d20.admin
      HELP`SHEET`STAFF: |-
        Sheet keepers \(`softcode.d20.admin`, or the D20 Sheet Keeper role\) read every sheet and change any character's at any time:

        - `/set`, `/advance`, `/gear` and `/use` take `<name>/` first: `+sheet/set Alice/level=4`. A keeper may set any score up to 30, any training, and give an advance without XP.
        - `/damage`, `/heal` and `/coin` take `<name>=` first: `+sheet/coin Alice=+50`.
        - `+sheet/xp <name>=+<n> [<reason>]` gives XP, `-<n>` takes, `<n>` sets: `+sheet/xp Alice=+10 Ended the siege`. `/coin` and `/gear` take a reason after the number too.
        - `+sheet/log <name>` shows their XP, coin and gear ledgers; `+sheet/log <name>=xp` more of one. `+sheet/rebuild <name>` works their totals out again from those ledgers.
        - `+sheet/ledger <name>` lists their entries. `+sheet/revoke <name>/<n>` takes one back.
        - `+sheet/clear <name>` revokes their whole build, so character creation starts again. XP, hit points, coin and gear stay.

        Every keeper change to the build is a new ledger entry, so nothing is lost: a revoke or clear is an entry too.

        `@role/assign <player>=d20-sheet-keeper` makes someone a keeper.
      LOCK`SHEET`SETTINGS: |-
        perm^config.admin
      HELP`SHEET`SETTINGS: |-
        `+config d20` lists the settings and `+config d20/<setting>=<value>` changes one \(`config.admin`\):

        - `array`: the starting scores a new character gives their abilities \(`15 14 13 12 10 8`\). `trained`: how many skills they train \(4\).
        - `score-default`, `score-min`, `score-max`: a score before it is set \(10\), the lowest \(1\), and the highest an advance takes it \(20\).
        - `level-max`: the highest level \(20\). `advance`: the XP an advance costs \(10\).
        - `hp-level`, `hp-ability`: hit points for each level \(8\), and the ability whose modifier adds to them \(con\).
        - `bonus-base`, `bonus-every`: the training bonus at level 1 \(2\), and how many levels it takes to grow by 1 \(4\).
        - `crits`: whether a natural 20 and a natural 1 decide a check \(yes\).
        - `dcs`: the DCs of trivial, easy, standard, hard and extreme \(`5 10 15 20 25`\).
        - `public`: whether anyone may read anyone's sheet \(no\).
        - `traits`: the abilities and skills. `+config/add d20/traits/climb=Climb` adds one, then `+config d20/traits/climb/ability=str` says what it adds.
        - `foes`: the bestiary. `+config/add d20/foes/kobold=Kobold` adds one, then `+config d20/foes/kobold/hp=5` and the rest set it up.

        Removing a trait leaves the ledger as it is, but the sheet stops showing it.
