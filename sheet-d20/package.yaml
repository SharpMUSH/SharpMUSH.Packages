      # %0 a character, %1 a book, %2 the change, %3 why, %4 the item, %5 its label: a new entry, then the cached
      # total. Nothing for no change.
      FUN`BOOK`ADD:
        value: |-
          if(%2,[setqm(book_cache,u(%!/FUN`BOOK`CACHE,%1,%4),book_n,inc(lmax(0 [iter(lattr(%0/D20`%1LEDGER`*),last(%i0,`))])))][setq(book_had,get(%0/%q<book_cache>))][setqm(book_total,add(firstof(before(%q<book_had>,|),0),%2),book_label,firstof(%5,after(%q<book_had>,|)))][u(%!/FUN`API`ROOT,%0)][attrib_set(%0/D20`%1LEDGER`%q<book_n>,json(object,n,%q<book_n>,delta,%2,total,%q<book_total>,item,json(string,%4),label,json(string,%q<book_label>),reason,json(string,left(%3,200)),by,json(string,objid(%#)),at,secs()))][set(%0/D20`%1LEDGER`%q<book_n>,wizard)][u(%!/FUN`BOOK`SET,%0,%q<book_cache>,%q<book_total>,if(u(%!/FUN`BOOK`LABELLED,%1),%q<book_label>))][u(%!/FUN`BOOK`TRIM,%0,%1)])
        flags: [funsyntax]
      # %0 a character, %1 a cache attribute, %2 the total, %3 a label: writes the cache; 0 removes it.
      FUN`BOOK`SET:
        value: |-
          if(%2,[attrib_set(%0/%1,if(strlen(%3),%2|%3,%2))][set(%0/%1,wizard)],if(hasattr(%0/%1),attrib_set(%0/%1)))
        flags: [funsyntax]
      # %0 a character, %1 a book: past DATA`LOG`MAX entries, the oldest one a later entry for the same item
      # replaces goes, so the latest entry for each item, and with it every total, always stays.
      FUN`BOOK`TRIM:
        value: |-
          setqm(bt_drop,,bt_nums,sort(iter(lattr(%0/D20`%1LEDGER`*),last(%i0,`)),n))[if(gt(words(%q<bt_nums>),get(%!/DATA`LOG`MAX)),setq(bt_drop,first(iter(extract(%q<bt_nums>,1,50),if(gt(words(grep(%0,D20`%1LEDGER`*,"item":"[json_query(get(%0/D20`%1LEDGER`%i0),extract,$.item)]")),1),%i0)))))][if(strlen(%q<bt_drop>),attrib_set(%0/D20`%1LEDGER`%q<bt_drop>))]
        flags: [funsyntax]
      # %0 a character, %1 a book, %2 an item: its latest entry.
      FUN`BOOK`LAST:
        value: |-
          setq(bl_n,last(iter(u(%!/FUN`BOOK`NUMS,%0,%1),if(not(comp(json_query(get(%0/D20`%1LEDGER`%i0),extract,$.item),%2)),%i0))))[if(strlen(%q<bl_n>),get(%0/D20`%1LEDGER`%q<bl_n>))]
        flags: [funsyntax]
      # %0 a character, %1 a book, %2 an item: writes its cache from its latest entry.
      FUN`BOOK`REBUILDITEM:
        value: |-
          setq(br_last,u(%!/FUN`BOOK`LAST,%0,%1,%2))[u(%!/FUN`BOOK`SET,%0,u(%!/FUN`BOOK`CACHE,%1,%2),if(strlen(%q<br_last>),json_query(%q<br_last>,extract,$.total),0),if(cand(strlen(%q<br_last>),u(%!/FUN`BOOK`LABELLED,%1)),json_query(%q<br_last>,extract,$.label)))]
        flags: [funsyntax]
      # %0 a character, %1 a book: the items it has entries for.
      FUN`BOOK`ITEMS:
        value: |-
          setunion(iter(u(%!/FUN`BOOK`NUMS,%0,%1),json_query(get(%0/D20`%1LEDGER`%i0),extract,$.item)),)
        flags: [funsyntax]
      # %0 a character, %1 a book, %2 its title, %3 its unit (after the item's label), %4 how many: the
      # latest entries, oldest first.
      FUN`SCREEN`BOOK:
        value: |-
          setq(sb_nums,u(%!/FUN`BOOK`NUMS,%0,%1))[setq(sb_nums,extract(%q<sb_nums>,max(1,sub(words(%q<sb_nums>),dec(%4))),%4))][tone(strong,%2)]%r[if(words(%q<sb_nums>),ldatatable(lit({"nowrap":"1|2|3|4|6","grow":"||||1"}),#|When|Change|>Total|Why|By,iter(%q<sb_nums>,u(%!/FUN`DISPLAY`BOOKROW,get(%0/D20`%1LEDGER`%i0),%3),%b,%*<^>),%*<^>),tone(muted,Nothing yet.))]
        flags: [funsyntax]
      FUN`DISPLAY`BOOKROW:
        value: |-
          [json_query(%0,extract,$.n)]|[timefmt($Y-$m-$d,json_query(%0,extract,$.at))]|[u(%!/FUN`DISPLAY`SIGNED,json_query(%0,extract,$.delta))] [trim([json_query(%0,extract,$.label)] %1)]|[json_query(%0,extract,$.total)]|[firstof(json_query(%0,extract,$.reason),-)]|[name(json_query(%0,extract,$.by))]
        flags: [funsyntax]
      # %0 a character: the sheet's ledger merged, the rows in force. Kept as a cache in D20`MERGED once worked
      # out; every ledger write drops it.
      FUN`LEDGER`MERGED:
        value: |-
          if(cand(hasattr(%0/D20`MERGED),hasflag(%0/D20`MERGED,wizard)),get(%0/D20`MERGED),[setq(lm_rows,u(%!/FUN`LEDGER`LIVE,u(%!/FUN`LEDGER`ROWS,%0)))][if(cand(words(%q<lm_rows>),hasattr(%0,D20)),null([attrib_set(%0/D20`MERGED,%q<lm_rows>)][set(%0/D20`MERGED,wizard)]))]%q<lm_rows>)
        flags: [funsyntax]
      # %0 a character: every cache worked out again from the ledgers.
      FUN`BOOK`REBUILD:
        value: |-
          [if(hasattr(%0/D20`MERGED),attrib_set(%0/D20`MERGED))][u(%!/FUN`BOOK`REBUILDITEM,%0,XP,)][u(%!/FUN`BOOK`REBUILDITEM,%0,MONEY,)][iter(lattr(%0/D20`GEAR`*),attrib_set(%0/%i0))][iter(u(%!/FUN`BOOK`ITEMS,%0,GEAR),u(%!/FUN`BOOK`REBUILDITEM,%0,GEAR,%i0))]
        flags: [funsyntax]
      # %0 a character, %1 their copy in an encounter, %2 why: ledger entries taking the sheet's coin and gear to
      # the copy's.
      FUN`BOOK`KEEP:
        value: |-
          setqm(lk_copygear,u(%!/FUN`V,%1,gear),lk_livegear,u(%!/FUN`GEAR`LIVE,%0))[u(%!/FUN`BOOK`ADD,%0,MONEY,sub(u(%!/FUN`V,%1,coin),default(%0/D20`COIN,0)),%2)][iter(setunion(iter(%q<lk_copygear>,elements(%i0,2,~),|,%b),iter(%q<lk_livegear>,elements(%i0,2,~),|,%b)),u(%!/FUN`BOOK`KEEPITEM,%0,%i0,%2))]
        flags: [funsyntax]
      FUN`BOOK`KEEPITEM:
        value: |-
          setqm(lki_new,grab(%q<lk_copygear>,*~%1~*,|),lki_old,grab(%q<lk_livegear>,*~%1~*,|))[u(%!/FUN`BOOK`ADD,%0,GEAR,sub(firstof(first(%q<lki_new>,~),0),firstof(first(%q<lki_old>,~),0)),%2,%1,firstof(elements(%q<lki_new>,3,~),elements(%q<lki_old>,3,~)))]
        flags: [funsyntax]
      # xp, coin or gear: the book it names.
      FUN`LOG`BOOK:
        value: |-
          switch(%0,xp,XP,coin,MONEY,gear,GEAR)
        flags: [funsyntax]
      # %0 the character, %1 one book or empty for all: the latest 30 entries of one, or 10 of each.
      FUN`SCREEN`LOG:
        value: |-
          box(if(strlen(%1),u(%!/FUN`SCREEN`BOOK,%0,%1,switch(%1,XP,XP,MONEY,Coin,Gear),switch(%1,XP,XP,MONEY,coin),30),[u(%!/FUN`SCREEN`BOOK,%0,XP,XP,XP,10)]%r[rule()]%r[u(%!/FUN`SCREEN`BOOK,%0,MONEY,Coin,coin,10)]%r[rule()]%r[u(%!/FUN`SCREEN`BOOK,%0,GEAR,Gear,,10)])%r[rule()]%r[tone(muted,Every change to XP%, and to coin and gear on the sheet itself%, with who made it. +sheet/log [if(comp(num(%0),%#),name(%0)=)]xp shows more of one.)],Ledgers: [name(%0)])
        flags: [funsyntax]
      FUN`API`ROOT:
        value: |-
          if(hasattr(%0,D20),,attrib_set(%0/D20,This character's d20 sheet. +sheet shows it.)[set(%0/D20,wizard)][set(%0/D20,no_command)])
        flags: [funsyntax]
      # Named: %<roller> an objid, %<trait> a key, %<modifier> a number to add, %<target> a DC or nothing,
      # %<dice> 1d20, 2d20kh or 2d20kl. Rolls on the sheet itself and keeps the roll (roll() record), and returns
      # {"tier","total","natural","target","margin","label","text","roll","formula"}; tier and margin are empty
      # without a DC. #-1 and why when the trait or roller is wrong.
      API`CHECK:
        value: |-
          cond(not(hastype(%<roller>,player)),#-1 There is no character to roll for.,not(strlen(u(%!/FUN`TRAIT`FIND,%<trait>))),#-1 There is no trait '%<trait>'.,u(%!/FUN`CHECK`VIEW,u(%!/FUN`VIEW`LIVE,%<roller>),u(%!/FUN`TRAIT`FIND,%<trait>),%<modifier>,%<target>,%<dice>))
        flags: [VISUAL]
      # %0 a view, %1 a trait key, %2 a number to add, %3 the DC or nothing, %4 the die.
      FUN`CHECK`VIEW:
        value: |-
          u(%!/FUN`CHECK`ROLLED,ucstr(%1),firstof(%4,1d20),add(u(%!/FUN`V`RATING,%0,ucstr(%1)),firstof(%2,0)),%3)
        flags: [funsyntax]
      # %0 the key, %1 the die, %2 what is added, %3 the DC or nothing.
      FUN`CHECK`ROLLED:
        value: |-
          setqm(rolled_formula,%1[if(gte(%2,0),+%2,%2)],
          rolled,roll(%q<rolled_formula>,,record),
          rolled_natural,json_query(%q<rolled>,extract,$.dice%[0%].total),
          rolled_total,json_query(%q<rolled>,extract,$.total),
          rolled_tier,u(%!/API`TIER,%q<rolled_total>,%q<rolled_natural>,%3))[json(object,tier,json(string,%q<rolled_tier>),total,%q<rolled_total>,natural,%q<rolled_natural>,target,json(string,%3),margin,json(string,if(strlen(%3),sub(%q<rolled_total>,%3))),label,json(string,u(%!/FUN`TRAIT`LABEL,%0)),text,json(string,json_query(%q<rolled>,extract,$.text)),roll,json_query(%q<rolled>,extract,$.id),formula,json(string,%q<rolled_formula>))]
        flags: [funsyntax]

      # ---- lifecycle ----------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP:
        value: |-
          @command/add/noparse/rsnoparse +sheet; @hook/override/inline +sheet=%!,CMD`SHEET; @command/add/noparse/rsnoparse +check; @hook/override/inline +check=%!,CMD`CHECK; @command/add/noparse/rsnoparse +encounter; @hook/override/inline +encounter=%!,CMD`ENCOUNTER; @command/add/noparse/rsnoparse +foe; @hook/override/inline +foe=%!,CMD`FOE
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

