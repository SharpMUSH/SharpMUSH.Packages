        close
      EQUIPMENT`PISTOL`DAMAGE: |-
        3 HP
      EQUIPMENT`PISTOL`TRAITS: |-
        Ballistic
      EQUIPMENT`PISTOL`TEXT: |-
        This weapon covers a wide variety of standard issue pistols such as revolvers and semi-automatic pistols.
      EQUIPMENT`RIFLE: |-
        Rifle
      EQUIPMENT`RIFLE`TECH: |-
        3
      EQUIPMENT`RIFLE`RANGE: |-
        medium
      EQUIPMENT`RIFLE`DAMAGE: |-
        5 HP
      EQUIPMENT`RIFLE`TRAITS: |-
        Ballistic
      EQUIPMENT`RIFLE`TEXT: |-
        This weapon covers a wide variety of standard issue ballistic rifles, including assault rifles, semi-automatic rifles, and bolt-action rifles.
      EQUIPMENT`REINFORCED-POLYCARBONATE-SHIEL: |-
        Reinforced Polycarbonate Shield
      EQUIPMENT`REINFORCED-POLYCARBONATE-SHIEL`TECH: |-
        2
      EQUIPMENT`REINFORCED-POLYCARBONATE-SHIEL`TRAITS: |-
        Heavy|Shield
      EQUIPMENT`REINFORCED-POLYCARBONATE-SHIEL`TEXT: |-
        Typically used in breaching and boarding actions, as well as for riot control, this large shield protects its wearer from harm. When your Pilot is hit by an attack you may destroy the Reinforced Polycarbonate Shield to take half damage from the attack and suffer none of its effects.
      EQUIPMENT`ELECTRO-GRAPPLING-HOOK: |-
        Electro Grappling Hook
      EQUIPMENT`ELECTRO-GRAPPLING-HOOK`TECH: |-
        4
      EQUIPMENT`ELECTRO-GRAPPLING-HOOK`RANGE: |-
        medium
      EQUIPMENT`ELECTRO-GRAPPLING-HOOK`TRAITS: |-
        Climbing
      EQUIPMENT`ELECTRO-GRAPPLING-HOOK`TEXT: |-
        This gravitonic beam allows the user to attach themselves to surfaces at Range, allowing them to swing or pull themselves towards it. You may use it to attach to any surface within Range.
      EQUIPMENT`PORTABLE-MULTI-PHASE-SHIELD: |-
        Portable Multi-Phase Shield
      EQUIPMENT`PORTABLE-MULTI-PHASE-SHIELD`TECH: |-
        4
      EQUIPMENT`PORTABLE-MULTI-PHASE-SHIELD`AP: |-
        2
      EQUIPMENT`PORTABLE-MULTI-PHASE-SHIELD`TRAITS: |-
        Shield
      EQUIPMENT`PORTABLE-MULTI-PHASE-SHIELD`TABLE: |-
        PORTABLE-MULTI-PHASE-SHIELD
      EQUIPMENT`PORTABLE-MULTI-PHASE-SHIELD`TEXT: |-
        Favoured by Sakura Wetwork teams, this miniature, wrist-mounted shield can protect you from harm by projecting a forcefield around your Pilot which will absorb some of the incoming attack.
        When you are hit by an attack you may activate your Portable Multi-Phase Shield to prevent the hit.
      EQUIPMENT`HAZARD-PROTECTION-SUIT: |-
        Hazard Protection Suit
      EQUIPMENT`HAZARD-PROTECTION-SUIT`TECH: |-
        3
      EQUIPMENT`HAZARD-PROTECTION-SUIT`TRAITS: |-
        Armour|Heavy
      EQUIPMENT`HAZARD-PROTECTION-SUIT`TEXT: |-
        This all-purpose bio-hazard suit can protect you from the ravages of the wastes once you are zipped up all comfy inside.
        The environmental suit protects you from dangerous environmental hazards such as radiation storms, cold snaps, or acid rain. In addition, you take half damage from any severe environmental hazards such as tornadoes, firestorms, or bubbling pools of toxic waste.
      EQUIPMENT`GREEN-LASER-RIFLE: |-
        Green Laser Rifle
      EQUIPMENT`GREEN-LASER-RIFLE`TECH: |-
        3
      EQUIPMENT`GREEN-LASER-RIFLE`RANGE: |-
        medium
      EQUIPMENT`GREEN-LASER-RIFLE`DAMAGE: |-
        5 HP
      EQUIPMENT`GREEN-LASER-RIFLE`TRAITS: |-
        Energy
      EQUIPMENT`GREEN-LASER-RIFLE`TEXT: |-
        This weapon covers a wide variety of standard issue shoulder-mounted energy laser rifles such as beam guns, pulse lasers, and ray rifles.
      EQUIPMENT`ROCKET-LAUNCHER: |-
        Rocket Launcher
      EQUIPMENT`ROCKET-LAUNCHER`TECH: |-
        4
      EQUIPMENT`ROCKET-LAUNCHER`RANGE: |-
        long
      EQUIPMENT`ROCKET-LAUNCHER`DAMAGE: |-
        5 SP
      EQUIPMENT`ROCKET-LAUNCHER`TRAITS: |-
        Explosive (1)|Heavy|Missile
      EQUIPMENT`ROCKET-LAUNCHER`USES: |-
        3
      EQUIPMENT`ROCKET-LAUNCHER`TEXT: |-
        This weapon fires unguided, explosive warheads at its targets and is a great way to make an entrance at your next hoedown.
      EQUIPMENT`ANTI-GRAVITY-BELT: |-
        Anti-Gravity Belt
      EQUIPMENT`ANTI-GRAVITY-BELT`TECH: |-
        6
      EQUIPMENT`ANTI-GRAVITY-BELT`TRAITS: |-
        Hover
      EQUIPMENT`ANTI-GRAVITY-BELT`TEXT: |-
        This belt straps onto your Pilot and allows them to defy the laws of physics.
        Whilst equipped, this allows your Pilot to levi- tate, moving over obstacles and terrain, and float onto buildings and other tall structures, gaining the Hover Trait for all of their move- ment.
      EQUIPMENT`SALVAGING-TOOLS: |-
        Salvaging Tools
      EQUIPMENT`SALVAGING-TOOLS`TECH: |-
        1
      EQUIPMENT`SALVAGING-TOOLS`TRAITS: |-
        Salvaging
      EQUIPMENT`SALVAGING-TOOLS`TEXT: |-
        This covers a wide array of tools, from jacks to hammers to angle grinders, that are used in salvaging. This allows your Pilot to salvage in the field, because sometimes you need to get your hands dirty.
      EQUIPMENT`PORTABLE-COMMUNICATIONS-UNIT: |-
        Portable Communications Unit
      EQUIPMENT`PORTABLE-COMMUNICATIONS-UNIT`TECH: |-
        1
      EQUIPMENT`PORTABLE-COMMUNICATIONS-UNIT`RANGE: |-
        medium
      EQUIPMENT`PORTABLE-COMMUNICATIONS-UNIT`TRAITS: |-
        Communicator
      EQUIPMENT`PORTABLE-COMMUNICATIONS-UNIT`TEXT: |-
        A handheld communications device that uses a radio frequency. This allows you to communi- cate with anything that has the Communicator Trait within Range.
      EQUIPMENT`ORBITAL-LANCE-CONTROLLER: |-
        Orbital Lance Controller
      EQUIPMENT`ORBITAL-LANCE-CONTROLLER`TECH: |-
        6
      EQUIPMENT`ORBITAL-LANCE-CONTROLLER`RANGE: |-
        far
      EQUIPMENT`ORBITAL-LANCE-CONTROLLER`TRAITS: |-
        Energy
      EQUIPMENT`ORBITAL-LANCE-CONTROLLER`TEXT: |-
        This specialised controller allows you to tap into one of the many defunct orbital satellites floating around the globe and call down a one-off laser strike against a target of your choice within Range. You must be able to identify the target, but you do not need to be able to directly see them.
        There are a limited number of operational satellites in orbit, placed there by different corpos and other factions. None of them use compatible systems or codes. An Orbital Lance Controller has links to one operational satellite which has sufficient energy in its banks to fire three strikes. This means that an Orbital Lance Controller can only ever be used three times and does not regain it's uses.
        The laser strike that the Orbital Lance fires can be either focussed or wide. This allows you to specify any target of your choice from the huge to the small. You can choose a wide blast to destroy a settlement, or Mech convoy, or a pinpoint strike to kill a single person. The Orbital Lance only deals as much collateral damage as you want it to. The target you choose is killed or destroyed entirely.
        You may only claim one Orbital Lance Controller per Union Crawler, others must be found in the wastelands. There are few of these just lying around!
      EQUIPMENT`PORTABLE-FLAMETHROWER: |-
        Portable Flamethrower
      EQUIPMENT`PORTABLE-FLAMETHROWER`TECH: |-
        2
      EQUIPMENT`PORTABLE-FLAMETHROWER`RANGE: |-
        close
      EQUIPMENT`PORTABLE-FLAMETHROWER`DAMAGE: |-
        2 HP
      EQUIPMENT`PORTABLE-FLAMETHROWER`TRAITS: |-
        Anti-Organic|Burn (2)|Heavy|Overheat
      EQUIPMENT`PORTABLE-FLAMETHROWER`TEXT: |-
        This portable flamethrower fires superheated liquid flame at a target.
      EQUIPMENT`MELEE-ARMAMENT: |-
        Melee Armament
      EQUIPMENT`MELEE-ARMAMENT`TECH: |-
        3
      EQUIPMENT`MELEE-ARMAMENT`RANGE: |-
        close
      EQUIPMENT`MELEE-ARMAMENT`DAMAGE: |-
        4 HP
      EQUIPMENT`MELEE-ARMAMENT`TRAITS: |-
        Melee|Silent
      EQUIPMENT`MELEE-ARMAMENT`TEXT: |-
        This covers a wide range of high quality melee weapons that your Pilot can acquire, from standard issue survival knives and hatchets to katanas and claymores.
      EQUIPMENT`IMPROVISED-EXPLOSIVE-DEVICE: |-
        Improvised Explosive Device
      EQUIPMENT`IMPROVISED-EXPLOSIVE-DEVICE`TECH: |-
        1
      EQUIPMENT`IMPROVISED-EXPLOSIVE-DEVICE`RANGE: |-
        close
      EQUIPMENT`IMPROVISED-EXPLOSIVE-DEVICE`DAMAGE: |-
        3 SP
      EQUIPMENT`IMPROVISED-EXPLOSIVE-DEVICE`TRAITS: |-
        Explosive (1)
      EQUIPMENT`IMPROVISED-EXPLOSIVE-DEVICE`USES: |-
        2
      EQUIPMENT`IMPROVISED-EXPLOSIVE-DEVICE`TEXT: |-
        This covers any number of homemade explosives. Exploding powder and bits of shrapnel are easy to find amongst the wastes.
        An IED can be thrown at a target as an attack. It can also be planted as a proximity mine which triggers when a target comes within Close Range of the IED. In either case, roll an attack as normal to find out what happens.
      EQUIPMENT`REACTIVE-ARMOUR: |-
        Reactive Armour
      EQUIPMENT`REACTIVE-ARMOUR`TECH: |-
        2
      EQUIPMENT`REACTIVE-ARMOUR`TRAITS: |-
        Armour|Heavy
      EQUIPMENT`REACTIVE-ARMOUR`TEXT: |-
        Layers of reactive heavy carbonate protect a Pilot against various types of damage, from ballistic and laser damage to explosive and shrapnel damage. Reduce all damage your Pilot takes by 1 to a minimum of 1 when this Armour is equipped. Apply this after other modifiers.
      EQUIPMENT`REMOTE-MINE: |-
        Remote Mine
      EQUIPMENT`REMOTE-MINE`TECH: |-
        4
      EQUIPMENT`REMOTE-MINE`RANGE: |-
        close
      EQUIPMENT`REMOTE-MINE`TRAITS: |-
        Explosive (4)
      EQUIPMENT`REMOTE-MINE`USES: |-
        2
      EQUIPMENT`REMOTE-MINE`TEXT: |-
        An explosive device that can be remotely detonated.
        You may place and set the Remote Mine as a Turn Action. It can be detonated remotely as a Turn Action from Medium Range. When it detonates, roll to make an attack as normal. On a hit all targets within Range take 4 SP damage.
        *Whist use of Remote Mines is allowed under Corporate Council policy; Union Safety Regulation 402.36 bans their use in civilian occupied territory.*
      EQUIPMENT`RED-LASER-PISTOL: |-
        Red Laser Pistol
      EQUIPMENT`RED-LASER-PISTOL`TECH: |-
        2
      EQUIPMENT`RED-LASER-PISTOL`RANGE: |-
        close
      EQUIPMENT`RED-LASER-PISTOL`DAMAGE: |-
        3 HP
      EQUIPMENT`RED-LASER-PISTOL`TRAITS: |-
        Energy
      EQUIPMENT`RED-LASER-PISTOL`TEXT: |-
        This weapon covers a wide variety of standard issue handheld lasers such as blasters, phasers, and zap guns.
      EQUIPMENT`HANDHELD-EPOXY-CANISTER: |-
        Handheld Epoxy Canister
      EQUIPMENT`HANDHELD-EPOXY-CANISTER`TECH: |-
        3
      EQUIPMENT`HANDHELD-EPOXY-CANISTER`TEXT: |-
        This handy piece of equipment applies layers of metallic oxide which can repair and restore a diverse range of broken Mechs and parts.
