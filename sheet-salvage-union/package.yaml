        Flashy: The Shaitan has the Flashy Trait. It is incredibly stunning to look at and fills onlookers with awe and admiration.
        Fast: The Shaitan can move an additional Range Band on its turn as a free action. In addition, it moves twice as fast across the Campaign, Area, and Region Maps.
        Polycarbonate Stealth Chassis: The Shaitan cannot be targeted with anything that uses the Targeter Trait such as targeting Modules. It also cannot be seen by anything with the Optics Trait or Scanner Trait. It does not appear on sensors, radar systems, or scanners and needs direct visual confirmation to be spotted.
      SYSTEM`MECHAPULT: |-
