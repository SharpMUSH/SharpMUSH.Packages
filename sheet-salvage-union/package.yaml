        They may spend their Pilot Ability Points on any Energy Point Abilities the Neura-Phage has access to. They may spend their Energy Points on any Pilot Abilities their Pilot has access to that the Neura-Phage would reasonably be able to perform. In addition, they always count as having a Neuralink Communicator installed in their Mech.
        Neuralinking is a painful, lengthy, and risky process. A Pilot can only exit the Neura-Phage during Downtime within a Tech 5 or higher Mech Bay after a lengthy surgical process that takes a day to perform, and further requires a Tech 5 or higher Med Bay to recover in.If a Pilot attempts to remove themselves from the Neura-Phage in the field, is removed without access to the appropriate facilities, or is forcibly removed in any way, they will die in the process.
