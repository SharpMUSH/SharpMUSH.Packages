      TABLE`CHRYSALIS-ENTRANCING-SONG: |-
        [Chrysalis] Entrancing Song
      TABLE`CHRYSALIS-ENTRANCING-SONG`TEXT: |-
        Chrysalis emits an entrancing song by vibrating its wings at a series of different frequencies.
      TABLE`CHRYSALIS-ENTRANCING-SONG`ROW`1-1: |-
        They resist Chrysalis' will and the psychic rejection causes Chrysalis to be stunned until the end of its next turn.
      TABLE`CHRYSALIS-ENTRANCING-SONG`ROW`2-5: |-
        All targets are temporarily enthralled by its song. They are stunned until the end of its next turn. They cannot act and gain the Vulnerable Trait.
      TABLE`CHRYSALIS-ENTRANCING-SONG`ROW`6-10: |-
        In their futility, the targets attempt to resist the song. Chrysalis will transmit two commands to all targets and they must choose which to follow.
      TABLE`CHRYSALIS-ENTRANCING-SONG`ROW`11-19: |-
        All targets become temporary thralls to Chrysalis. They are under its control until the end of its next turn.
      TABLE`CHRYSALIS-ENTRANCING-SONG`ROW`20-20: |-
        All targets become thralls to Chrysalis and are under its control for the next 24 hours. Chrysalis can end this effect at any time.
      TABLE`CHRYSALIS-ENTRANCING-SONG`ROWS: |-
        1-1 2-5 6-10 11-19 20-20
      TABLE`CORE-MECHANIC: |-
        Core Mechanic
      TABLE`CORE-MECHANIC`TEXT: |-
        When a player declares an action within the game that has an uncertain, risky or potentially interesting outcome roll a 20 sided die.
      TABLE`CORE-MECHANIC`ROW`1-1: |-
        Cascade Failure: Something has gone terribly wrong. You suffer a severe consequence of the Mediator's choice. When attacking, you miss the target and suffer a Setback chosen by the Mediator.
      TABLE`CORE-MECHANIC`ROW`2-5: |-
        Failure: You have failed at what you were attempting to do. You face a Setback of the Mediator's choice. When attacking, you miss the target.
      TABLE`CORE-MECHANIC`ROW`6-10: |-
        Tough Choice: You succeed in your action, but at a cost. The Mediator gives you a Tough Choice with some kind of Setback attached. When attacking, you hit, but must make a Tough Choice.
      TABLE`CORE-MECHANIC`ROW`11-19: |-
        Success: You have achieved your goal without any compromises. When attacking, you hit the target and deal standard damage.
      TABLE`CORE-MECHANIC`ROW`20-20: |-
        Nailed it: You have overcome the odds and managed an outstanding success. You may achieve an additional bonus of your choice to the action. When dealing damage, you can choose to double it or pick another appropriate bonus effect.
      TABLE`CORE-MECHANIC`ROWS: |-
        1-1 2-5 6-10 11-19 20-20
      TABLE`COUNTER-HACKING: |-
        Counter-Hacking
      TABLE`COUNTER-HACKING`TEXT: |-
        You may activate this Ability as a Reaction in response to any other Ability with the Hacking Trait that targets you or an Ally within Medium Range.
      TABLE`COUNTER-HACKING`ROW`1-1: |-
        Your counter hacking attempt fails, and the opposing hacker can activate any Ability with the Hacking Trait in response to your attempt.
      TABLE`COUNTER-HACKING`ROW`2-5: |-
        Your counter hacking attempt fails.
      TABLE`COUNTER-HACKING`ROW`6-10: |-
        You can choose to stop the hacking attempt, or activate one of your Abilities with the Hacking Trait in response.
      TABLE`COUNTER-HACKING`ROW`11-19: |-
        You stop the hacking attempt. In addition, you can activate any of your Abilities with the Hacking Trait in response as a Reaction.
      TABLE`COUNTER-HACKING`ROW`20-20: |-
        You stop the hacking attempt. In addition, you can activate any of your Abilities with the Hacking Trait in response as a Reaction, without paying their EP or AP cost.
      TABLE`COUNTER-HACKING`ROWS: |-
        1-1 2-5 6-10 11-19 20-20
      TABLE`CRAWLER-DAMAGE: |-
        Crawler Damage
      TABLE`CRAWLER-DAMAGE`TEXT: |-
        Your Union Crawler can suffer damage from being attacked as well as through deterioration when you fail to pay its upkeep. When your Crawler reaches 0 Structure Points roll on this table.
      TABLE`CRAWLER-DAMAGE`ROW`1-1: |-
        Your Union Crawler is Destroyed as a mass series of malfunctions causes it to entirely collapse. Roll on the Union Crawler Destruction Table.
      TABLE`CRAWLER-DAMAGE`ROW`2-5: |-
        A Bay chosen at random on your Union Crawler is Damaged and inoperable. You no longer benefit from any of its functions until it is repaired to the Intact Condition. Around 5% of your Union Crawler population are severely injured or die.
      TABLE`CRAWLER-DAMAGE`ROW`6-10: |-
        Choose a Bay on your Union Crawler. It is Damaged and inoperable. You no longer benefit from any of its functions until it is repaired to the Intact Condition. Around 5% of your Union Crawler's population are severely injured or killed.
      TABLE`CRAWLER-DAMAGE`ROW`11-19: |-
        Your Union Crawler is inoperable and grounded. Its Bays are Intact, but inoperable. You must pay your Union Crawler's Upkeep Cost in order to repair it to be fully functioning again. Around 10% of your Union Crawler's population are severely injured or killed.
      TABLE`CRAWLER-DAMAGE`ROW`20-20: |-
        Your Union Crawler survives any significant damage this time.
      TABLE`CRAWLER-DAMAGE`ROWS: |-
        1-1 2-5 6-10 11-19 20-20
      TABLE`CRAWLER-DESTRUCTION: |-
        Crawler Destruction
      TABLE`CRAWLER-DESTRUCTION`TEXT: |-
        If your Union Crawler is destroyed, roll on this table to find out what happens.
      TABLE`CRAWLER-DESTRUCTION`ROW`1-1: |-
        There is hope. Everyone on board is somewhat battered and bruised, but manages to escape the Union Crawler safely. Your Union Crawler can be rebuilt from the wreckage for its current Upgrade Cost in Scrap of its Tech Level or higher.
      TABLE`CRAWLER-DESTRUCTION`ROW`2-5: |-
        The Union Crawler is torn apart. All of its Bays are damaged. Around 25% of the Union Crawler's population are severely injured or killed. Any Salvager Pilots on board must roll on the Critical Injury Table. The Union Crawler can be rebuilt for its current Upgrade Cost in Scrap of its Tech Level or higher.
      TABLE`CRAWLER-DESTRUCTION`ROW`6-10: |-
        You must choose between saving the Union Crawler population and saving the Union Crawler itself. If you choose the population, the Union Crawler is entirely destroyed and cannot be rebuilt. If you choose the Union Crawler, assume all Bays are damaged. It can be rebuilt for its current Upgrade Cost in Scrap of its Tech Level or higher, but you have to find new people to join it in the wastelands.
      TABLE`CRAWLER-DESTRUCTION`ROW`11-19: |-
        The Union Crawler is destroyed, and the majority of its population are killed or severely injured. The Salvager Pilots must roll on the Critical Injury Table. Any survivors must find a way to rebuild.
      TABLE`CRAWLER-DESTRUCTION`ROW`20-20: |-
        The Union Crawler suffers critical damage, goes into a reactor meltdown, and explodes. The Union Crawler is destroyed beyond all recognition. It cannot be rebuilt. Everyone and everything on board and within Medium Range takes 50 Structure Points of damage, and can be assumed destroyed or killed outright.
      TABLE`CRAWLER-DESTRUCTION`ROWS: |-
        1-1 2-5 6-10 11-19 20-20
      TABLE`CRAWLER-DETERIORATION: |-
        Crawler Deterioration
      TABLE`CRAWLER-DETERIORATION`TEXT: |-
        When you fail to pay upkeep, roll on this table.
      TABLE`CRAWLER-DETERIORATION`ROW`1-1: |-
        Your Union Crawler loses 5 Structure Points and a Bay chosen at random is Damaged until repaired to the Intact Condition.
      TABLE`CRAWLER-DETERIORATION`ROW`2-5: |-
        A Bay chosen at random on your Union Crawler is Damaged and inoperable. You no longer benefit from any of its functions until it is repaired to the Intact Condition.
      TABLE`CRAWLER-DETERIORATION`ROW`6-10: |-
        Choose a Bay on your Union Crawler. It becomes Damaged and inoperable. You no longer benefit from any of its functions until it is repaired to the Intact Condition.
      TABLE`CRAWLER-DETERIORATION`ROW`11-19: |-
        Your Union Crawler loses 5 Structure Points.
      TABLE`CRAWLER-DETERIORATION`ROW`20-20: |-
        Your Union Crawler chugs along for now.
      TABLE`CRAWLER-DETERIORATION`ROWS: |-
        1-1 2-5 6-10 11-19 20-20
      TABLE`CRAWLER-NAME: |-
        Crawler Name
      TABLE`CRAWLER-NAME`TEXT: |-
