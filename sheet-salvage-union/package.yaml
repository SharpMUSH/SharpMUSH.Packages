      SYSTEM`FM-3-FLAMETHROWER`TRAITS: |-
        Anti-Organic|Burn (1)|Overheat
      SYSTEM`FM-3-FLAMETHROWER`TEXT: |-
        Developed by the Opus Institute for use in forestry and demolition operations, or at least that is what they tell themselves. The FM-3 shoots a superheated stream of fire at a target. Most Mechs are armoured enough that this only licks them, but it can mess up internals enough to stop them firing anything hot back at you. Flesh bubbles and screams.
      SYSTEM`ARMOUR-PLATING: |-
        Armour Plating
      SYSTEM`ARMOUR-PLATING`TECH: |-
        1
      SYSTEM`ARMOUR-PLATING`SLOTS: |-
        2
      SYSTEM`ARMOUR-PLATING`VALUE: |-
        1
      SYSTEM`ARMOUR-PLATING`ACTION: |-
        passive
      SYSTEM`ARMOUR-PLATING`TEXT: |-
        Slapping some extra layers of scrap on your Mech can make you feel more comfortable about piloting a nuclear reactor-powered death machine.
        The first time that your Mech is hit by an attack, or takes damage, prevent the damage and all effects of the attack. Your Armour Plating System is then destroyed.
      SYSTEM`CORPO-BODY-KIT: |-
