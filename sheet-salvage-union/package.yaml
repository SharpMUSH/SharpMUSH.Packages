      SYSTEM`ELECTRO-MAGNETIC-SHIELD-PROJEC`TABLE: |-
        ELECTRO-MAGNETIC-SHIELD-PROJEC
      SYSTEM`ELECTRO-MAGNETIC-SHIELD-PROJEC`TEXT: |-
        This Aeon-designed shield projector emits an electro-magnetic field that can stop ballistics impacts in their tracks.
        When you or a target in Close Range is hit by a weapon with the Ballistic Trait, you may attempt to use your Electro-Magnetic Shield to prevent the hit.
      SYSTEM`MATTER-PHASE-SHIELD: |-
        Matter Phase Shield
      SYSTEM`MATTER-PHASE-SHIELD`TECH: |-
        6
      SYSTEM`MATTER-PHASE-SHIELD`SLOTS: |-
        4
      SYSTEM`MATTER-PHASE-SHIELD`VALUE: |-
        4
      SYSTEM`MATTER-PHASE-SHIELD`TABLE: |-
        MATTER-PHASE-SHIELD
      SYSTEM`MATTER-PHASE-SHIELD`TEXT: |-
        Developed by Sakura Futures at the peak of their technological prowess before the Wasteland Reclamation, a Matter Phase Shield disintegrates anything that attempts to pass through it by stripping it apart at a molecular level.
        {cost=XEP} Disintegrate
        Turn Action // Range: Close // Shield
        You extend the Matter Phase Shield outward from you. Everything within Close Range of you except for your own Mech and Pilot takes an amount of SP damage equal to 3x the EP you spend on this Ability. For example: if you spend 2 EP, you deal 6 SP damage.
        This effect lasts until the start of your next turn. Anything that moves within Close Range of you whilst this Ability is active also takes the same amount of SP damage. You may deactivate it as a Free Action
        {cost=2EP} Shield
        Reaction // Range: Close // Shield
        When you or a target in Close Range is hit by an attack with the Ballistic, Missile, or Melee Trait, you may activate the Matter Phase Shield to prevent the hit.
      SYSTEM`PERSONNEL-TRANSPORT-POD: |-
