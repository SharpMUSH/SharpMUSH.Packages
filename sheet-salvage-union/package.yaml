      SYSTEM`ANTI-MECH-MINE-LAYER`TABLE: |-
        ANTI-MINE-MECH-LAYER
      SYSTEM`ANTI-MECH-MINE-LAYER`TEXT: |-
        An effective area control tool, when triggered, Anti-Mech Mines attach to Mechs in their vicinity with spider-like clamps and detonate, dealing devastating damage. Salvager representatives voted to ban the use of these due to the horrendous collateral damage they can inflict, but were massively outvoted by corporate interests. Use with caution.
        When activated, your Mech lays a series of proximity triggered Anti-Mech cluster mines in a location or area on the map within Range such as a highway, stretch of wasteland, or city streets. The mines trigger when heavy targets such as Mechs, Vehicles, or Squads of troops enter the area.
      SYSTEM`ELECTRO-MAGNETIC-SHIELD-PROJEC: |-
