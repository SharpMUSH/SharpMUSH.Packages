      TABLE`SYSTEM-AND-SOFTWARE-HACKER: |-
        System and Software Hacker
      TABLE`SYSTEM-AND-SOFTWARE-HACKER`TEXT: |-
        You attempt to hack into a System or Module in order to disable, damage, or destroy it in some way. Choose a target System or Module in Range.
      TABLE`SYSTEM-AND-SOFTWARE-HACKER`ROW`1-1: |-
        The hacking attempt fails and the target cannot be targeted by any Abilities with the Hacking Trait for the next 10 minutes.
      TABLE`SYSTEM-AND-SOFTWARE-HACKER`ROW`2-5: |-
        The hacking attempt fails.
      TABLE`SYSTEM-AND-SOFTWARE-HACKER`ROW`6-10: |-
        The System or Module is inoperable and cannot be used until the end of the next turn.
      TABLE`SYSTEM-AND-SOFTWARE-HACKER`ROW`11-19: |-
        The System or Module is damaged.
      TABLE`SYSTEM-AND-SOFTWARE-HACKER`ROW`20-20: |-
        The System or Module is destroyed.
      TABLE`SYSTEM-AND-SOFTWARE-HACKER`ROWS: |-
        1-1 2-5 6-10 11-19 20-20
