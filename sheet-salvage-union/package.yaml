      # ---- the sheet API ------------------------------------------------------------
      # What other packages call: u({{sheet-salvage-union/sheet}}/API`<NAME>,...). Every sheet package has these
      # names. They read and roll; API`ADJUST, API`SCRAP and API`CHECK (which spends) are the ones that write.
      API:
        value: |-
          The Salvage Union sheet's functions for other packages. See the package README.
        flags: [VISUAL]
      # JSON list of what a check can be made with: [{"key","label","group","always"}]. die (the bare die, always),
      # then every ability (ability-<key>), system (system-<key>) and module (module-<key>) that is not passive. An
      # ability with no action (a Holo Companion, Bionic Arms) is something the pilot has, not something rolled.
      # The data holds it ready made: the list is the Core Book's, the same for everyone.
      API`TRAITS:
        value: |-
          get({{data}}/TRAITS)
        flags: [VISUAL]
      API`ALWAYS:
        value: |-
          die
        flags: [VISUAL]
      # %0 typed text: a trait key (die, ability-<key>, system-<key>, module-<key>), or nothing.
      API`FIND:
        value: |-
          cond(cor(not(strlen(trim(%0))),strmatch(trim(%0),die)),die,strmatch(%0,*-*),if(cand(member(ability system module,lcstr(before(%0,-))),member(get({{data}}/LIST`[ucstr(before(%0,-))]),ucstr(after(%0,-)))),lcstr(%0)),1,lcstr(firstof(iter(ABILITY SYSTEM MODULE,if(strlen(setr(api_found,u(%!/FUN`FIND,%i0,%0,get({{data}}/LIST`%i0)))),%i0-%q<api_found>)))))
        flags: [VISUAL]
      API`LABEL:
        value: |-
          if(strmatch(%0,die),The die,get({{data}}/[ucstr(before(%0,-))]`[ucstr(after(%0,-))]))
        flags: [VISUAL]
      # %0 a character, %1 a trait: 1 when they can roll with it (the die always; an ability learned; a system or
      # module installed).
      API`RATING:
        value: |-
          switch(lcstr(before(%1,-)),die,1,ability,t(member(get(%0/SALVAGE`ABILITIES),ucstr(after(%1,-)))),system,t(member(get(%0/SALVAGE`MECH`SYSTEMS),ucstr(after(%1,-)))),module,t(member(get(%0/SALVAGE`MECH`MODULES),ucstr(after(%1,-)))),[if(strmatch(%1,die),1,0)])
        flags: [VISUAL]
      API`HAS:
        value: |-
          hasattr(%0,SALVAGE)
        flags: [VISUAL]
      # %0 a difficulty word: 0, for Salvage Union never changes the die. Nothing for anything else.
      API`TARGET:
        value: |-
          if(member(v(DATA`DIFFICULTIES),lcstr(%0)),0)
        flags: [VISUAL]
      # %0 a d20: 20 crit-success (Nailed it), 11-19 success, 6-10 partial (Tough Choice), 2-5 fail, 1 crit-fail
      # (Cascade Failure).
      API`TIER:
        value: |-
          if(isint(%0),cond(gte(%0,20),crit-success,gte(%0,11),success,gte(%0,6),partial,gte(%0,2),fail,1,crit-fail))
        flags: [VISUAL]
      # %0 a character, %1 HP, AP, TP, SP, EP or HEAT: its value, its start when not set.
      API`METER:
        value: |-
          setq(meter_api,ucstr(%1))[if(hasattr(%!,DATA`METER`%q<meter_api>),[setq(meter_value,u(%!/FUN`PLAY`GET,%0,v(DATA`METER`%q<meter_api>`LEAF)))][if(strlen(%q<meter_value>),%q<meter_value>,if(strmatch(v(DATA`METER`%q<meter_api>`START),max),u(%!/FUN`METER`MAX,%0,%q<meter_api>),0))],#-1 NO SUCH METER)]
        flags: [VISUAL]
      # %0 a character, %1 a meter, %2 how much to add (or take, below 0): writes it within 0 and its most and
      # returns the new value.
      API`ADJUST:
        value: |-
          setqm(adjust_key,ucstr(%1),
          adjust_new,bound(add(u(%!/API`METER,%0,%1),%2),0,u(%!/FUN`METER`MAX,%0,%1)))[if(strmatch(%q<adjust_key>,TP),[null(if(sub(%q<adjust_new>,u(%!/API`METER,%0,TP)),u(%!/FUN`LEDGER`TP,%0,sub(%q<adjust_new>,u(%!/API`METER,%0,TP)),%3)))]%q<adjust_new>,if(hasattr(%!,DATA`METER`%q<adjust_key>),[null(u(%!/FUN`DO`SET,%0,v(DATA`METER`%q<adjust_key>`LEAF),if(neq(%q<adjust_new>,if(strmatch(v(DATA`METER`%q<adjust_key>`START),max),u(%!/FUN`METER`MAX,%0,%q<adjust_key>),0)),%q<adjust_new>)))]%q<adjust_new>,#-1 NO SUCH METER))]
        flags: [VISUAL]
      # %0 a Tech Level, %1 how much scrap to add to the Union Crawler's (or take, below 0): the new amount, never
