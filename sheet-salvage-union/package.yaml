format: "1.16"
package: sheet-salvage-union
title: "Salvage Union sheet (unofficial)"
version: 1.0.0
authors: [SharpMUSH]
description: "An unofficial Salvage Union pilot and mech sheet: a class, abilities bought down their trees with training points, HP, AP and pilot equipment; a mech built from a chassis, systems and modules, with SP, EP and heat; and the Union Crawler the pilots share. +check rolls the one d20 against the core mechanic table, spends the AP, EP and heat it costs, and lets a mech Push for a re-roll and a heat check. The Core Book's abilities, chassis, systems, modules, equipment and tables come from the Salvage Union (Unofficial) Foundry VTT system, under the Salvage Union Open Game Licence 1.0b."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, salvage-union, mech, d20, dice]
category: Characters
requires_server: ">=0.1"

# One permission, for the people who keep sheets: change any character's sheet and mech and the Union Crawler,
# and read every sheet. A player builds their own pilot and mech until they are approved, and keeps their own
# meters, gear and mech in play. Changing the settings is config.admin, as +config is.
categories:
  roles:
    - name: Salvage Union sheet
      description: Roles for the people who keep Salvage Union sheets.
  permissions:
    - name: Salvage Union sheet
      description: Keeping Salvage Union sheets and the Union Crawler.
permissions:
  - name: softcode.salvage.admin
    category: Salvage Union sheet
    description: Read every Salvage Union sheet, change any character's pilot and mech at any time, award training points and run the Union Crawler.
roles:
  - slug: salvage-sheet-keeper
    name: Salvage Union Sheet Keeper
    category: Salvage Union sheet
    priority: 11
    permissions:
      softcode.salvage.admin: allow

# Every character's SALVAGE tree is their sheet: only wizards write it, so a player can't make the root before
# the sheet does, and it is never a command.
attributes:
  SALVAGE:
    flags: [wizard, no_command]

objects:
  # The command object, in the master room. WIZARD because it adds the commands (@command/add, @hook), writes
  # the sheet attributes on characters, and reads them for other packages.
  #
  # A character's sheet is their own attributes under SALVAGE`: CLASS, PATH (the Advanced or Hybrid tree they
  # advanced into), ABILITIES and GEAR (space lists of keys), HP, AP and TP, MAX`<HP|AP|SLOTS>, DETAIL`<field>,
  # USED`<field> (a re-roll spent until downtime), LAST (their last check, JSON), and MECH`: CHASSIS, NAME,
  # QUIRK, SYSTEMS and MODULES (lists of keys), SP, EP, HEAT and SCRAP`<tech>. An unset meter is at its start.
  #
  # +sheet, +mech, +check and +crawler are added with /noparse/rsnoparse and hooked to CMD`<word>, so what a
  # player types reaches the code exactly as typed and nothing a player wrote is ever evaluated.
  #
  # Trees: CMD` the hooked commands, INC`COMMAND` the parse and dispatch, INC`SHEET`, INC`MECH`, INC`CHECK` and
  # INC`CRAWLER` one routine per switch, INC`NEED` the guards they share, INC`DO` the writes. FUN`FIND` looks up
  # the Core Book's content on Salvage Union Data, FUN`LEARN` the ability rules, FUN`MECH` the mech, FUN`ROLL`
  # the die and the tables, FUN`PERM` who may do what, FUN`SCREEN` and FUN`DISPLAY` the screens. API` the
  # functions other packages call (VISUAL), the same names in every sheet package. Bridges add HINT`<message>
  # lines, GATE`EDIT (a reason a player may not change their own sheet now) and ALLOW`VIEW`<name> (who else may
  # read a sheet).
  - ref: sheet
    type: thing
    name: Salvage Union Sheet
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      # ---- settings ---------------------------------------------------------------
      # +config salvage shows and changes them (sheet-salvage-union-config); the code reads each with
      # get(%!/DATA`CONFIG`<NAME>).
      DATA`CONFIG: |-
        Settings for the Salvage Union sheet. One leaf per setting.
      DATA`CONFIG`LABEL: |-
        Salvage Union sheet
      DATA`CONFIG`HP: |-
        10
      DATA`CONFIG`HP`TYPE: |-
        integer
      DATA`CONFIG`HP`DEFAULT: |-
        10
      DATA`CONFIG`HP`MIN: |-
        1
      DATA`CONFIG`HP`MAX: |-
        99
      DATA`CONFIG`HP`LABEL: |-
        Starting hit points
      DATA`CONFIG`HP`DESCRIPTION: |-
        A pilot's most HP, unless a sheet keeper gives them another with +sheet/max.
      DATA`CONFIG`HP`EXAMPLE: |-
        12
      DATA`CONFIG`AP: |-
        5
      DATA`CONFIG`AP`TYPE: |-
        integer
      DATA`CONFIG`AP`DEFAULT: |-
        5
      DATA`CONFIG`AP`MIN: |-
        0
      DATA`CONFIG`AP`MAX: |-
        99
      DATA`CONFIG`AP`LABEL: |-
        Starting ability points
      DATA`CONFIG`AP`DESCRIPTION: |-
        A pilot's most AP, unless a sheet keeper gives them another with +sheet/max.
      DATA`CONFIG`AP`EXAMPLE: |-
        6
      DATA`CONFIG`SLOTS: |-
        6
      DATA`CONFIG`SLOTS`TYPE: |-
        integer
      DATA`CONFIG`SLOTS`DEFAULT: |-
        6
      DATA`CONFIG`SLOTS`MIN: |-
        1
      DATA`CONFIG`SLOTS`MAX: |-
        99
      DATA`CONFIG`SLOTS`LABEL: |-
        Inventory slots
      DATA`CONFIG`SLOTS`DESCRIPTION: |-
        How many pieces of pilot equipment a pilot carries, unless a sheet keeper gives them another with +sheet/max.
      DATA`CONFIG`SLOTS`EXAMPLE: |-
        8
      DATA`CONFIG`SCRAP: |-
        20
      DATA`CONFIG`SCRAP`TYPE: |-
        integer
      DATA`CONFIG`SCRAP`DEFAULT: |-
        20
      DATA`CONFIG`SCRAP`MIN: |-
        0
      DATA`CONFIG`SCRAP`MAX: |-
        999
      DATA`CONFIG`SCRAP`LABEL: |-
        Starting scrap
      DATA`CONFIG`SCRAP`DESCRIPTION: |-
        The Tech 1 scrap a new pilot builds their first mech from: the salvage values of its chassis, systems and modules add up to no more than this.
      DATA`CONFIG`SCRAP`EXAMPLE: |-
        25
      DATA`CONFIG`GEAR: |-
        2
      DATA`CONFIG`GEAR`TYPE: |-
        integer
      DATA`CONFIG`GEAR`DEFAULT: |-
        2
      DATA`CONFIG`GEAR`MIN: |-
        0
      DATA`CONFIG`GEAR`MAX: |-
        99
      DATA`CONFIG`GEAR`LABEL: |-
        Starting equipment
      DATA`CONFIG`GEAR`DESCRIPTION: |-
        How many pieces of Tech 1 pilot equipment a new pilot chooses.
      DATA`CONFIG`GEAR`EXAMPLE: |-
        3
      DATA`CONFIG`PUSH: |-
        10
      DATA`CONFIG`PUSH`TYPE: |-
        integer
      DATA`CONFIG`PUSH`DEFAULT: |-
        10
      DATA`CONFIG`PUSH`MIN: |-
        1
      DATA`CONFIG`PUSH`MAX: |-
        1440
      DATA`CONFIG`PUSH`LABEL: |-
        Minutes to re-roll
      DATA`CONFIG`PUSH`DESCRIPTION: |-
        How long after a check +check/push and the other re-rolls may still change it.
      DATA`CONFIG`PUSH`EXAMPLE: |-
        30
      DATA`CONFIG`PUBLIC: |-
        0
      DATA`CONFIG`PUBLIC`TYPE: |-
        boolean
      DATA`CONFIG`PUBLIC`DEFAULT: |-
        0
      DATA`CONFIG`PUBLIC`LABEL: |-
        Sheets anyone can read
      DATA`CONFIG`PUBLIC`DESCRIPTION: |-
        Whether +sheet <name> and +mech <name> show anyone's pilot and mech to everyone. Otherwise only the character and sheet keepers see them.
      DATA`CONFIG`PUBLIC`EXAMPLE: |-
        yes

      # Which INC` routine each switch runs: DATA`ROUTE`<table>`<switch>. BARE is the command alone, ARG the
      # command with something after it and no switch.
      DATA`ROUTE: |-
        Which routine each switch runs. One leaf per switch.
      DATA`ROUTE`SHEET`BARE: |-
        SHEET`SHOW
      DATA`ROUTE`SHEET`ARG: |-
        SHEET`SHOW
      DATA`ROUTE`SHEET`CLASS: |-
        SHEET`CLASS
      DATA`ROUTE`SHEET`LEARN: |-
        SHEET`LEARN
      DATA`ROUTE`SHEET`UNLEARN: |-
        SHEET`UNLEARN
      DATA`ROUTE`SHEET`TREES: |-
        SHEET`TREES
      DATA`ROUTE`SHEET`ABILITY: |-
        SHEET`ABILITY
      DATA`ROUTE`SHEET`TAKE: |-
        SHEET`TAKE
      DATA`ROUTE`SHEET`DROP: |-
        SHEET`DROP
      DATA`ROUTE`SHEET`ITEM: |-
        SHEET`ITEM
      DATA`ROUTE`SHEET`LIST: |-
        SHEET`LIST
      DATA`ROUTE`SHEET`HP: |-
        SHEET`METER
      DATA`ROUTE`SHEET`AP: |-
        SHEET`METER
      DATA`ROUTE`SHEET`TP: |-
        SHEET`METER
      DATA`ROUTE`SHEET`MAX: |-
        SHEET`MAX
      DATA`ROUTE`SHEET`CALLSIGN: |-
        SHEET`DETAIL
      DATA`ROUTE`SHEET`BACKGROUND: |-
        SHEET`DETAIL
      DATA`ROUTE`SHEET`MOTTO: |-
        SHEET`DETAIL
      DATA`ROUTE`SHEET`KEEPSAKE: |-
        SHEET`DETAIL
      DATA`ROUTE`SHEET`APPEARANCE: |-
        SHEET`DETAIL
      DATA`ROUTE`SHEET`LEDGER: |-
        SHEET`LEDGER
      DATA`ROUTE`SHEET`REVOKE: |-
        SHEET`REVOKE
      DATA`ROUTE`SHEET`CLEAR: |-
        SHEET`CLEAR
      DATA`ROUTE`SHEET`DOWNTIME: |-
        SHEET`DOWNTIME
      DATA`ROUTE`SHEET`USE: |-
        SHEET`USE
      DATA`ROUTE`SHEET`CHARGEN: |-
        SHEET`CHARGEN
      DATA`ROUTE`MECH`BARE: |-
        MECH`SHOW
      DATA`ROUTE`MECH`ARG: |-
        MECH`SHOW
      DATA`ROUTE`MECH`CHASSIS: |-
        MECH`CHASSIS
      DATA`ROUTE`MECH`INSTALL: |-
        MECH`INSTALL
      DATA`ROUTE`MECH`REMOVE: |-
        MECH`REMOVE
      DATA`ROUTE`MECH`USE: |-
        MECH`USE
      DATA`ROUTE`MECH`NAME: |-
        MECH`DETAIL
      DATA`ROUTE`MECH`QUIRK: |-
        MECH`DETAIL
      DATA`ROUTE`MECH`SP: |-
        MECH`METER
      DATA`ROUTE`MECH`EP: |-
        MECH`METER
      DATA`ROUTE`MECH`HEAT: |-
        MECH`METER
      DATA`ROUTE`MECH`VENT: |-
        MECH`VENT
      DATA`ROUTE`MECH`SCRAP: |-
        MECH`SCRAP
      DATA`ROUTE`MECH`PART: |-
        MECH`PART
      DATA`ROUTE`MECH`LIST: |-
        MECH`LIST
      DATA`ROUTE`CHECK`BARE: |-
        CHECK`ROLL
      DATA`ROUTE`CHECK`ARG: |-
        CHECK`ROLL
      DATA`ROUTE`CHECK`PRIVATE: |-
        CHECK`ROLL
      DATA`ROUTE`CHECK`MECH: |-
        CHECK`ROLL
      DATA`ROUTE`CHECK`PUSH: |-
        CHECK`PUSH
      DATA`ROUTE`CHECK`REROLL: |-
        CHECK`REROLL
      DATA`ROUTE`CHECK`MOTTO: |-
        CHECK`MOTTO
      DATA`ROUTE`CHECK`HEAT: |-
        CHECK`HEAT
      DATA`ROUTE`CHECK`TABLE: |-
        CHECK`TABLE
      DATA`ROUTE`CRAWLER`BARE: |-
        CRAWLER`SHOW
      DATA`ROUTE`CRAWLER`NAME: |-
        CRAWLER`TEXT
      DATA`ROUTE`CRAWLER`TYPE: |-
        CRAWLER`TEXT
      DATA`ROUTE`CRAWLER`WEAPON: |-
        CRAWLER`WEAPON
      DATA`ROUTE`CRAWLER`TECH: |-
        CRAWLER`TECH
      DATA`ROUTE`CRAWLER`SP: |-
        CRAWLER`NUMBER
      DATA`ROUTE`CRAWLER`POOL: |-
        CRAWLER`NUMBER
      DATA`ROUTE`CRAWLER`SCRAP: |-
        CRAWLER`SCRAP
      DATA`ROUTE`CRAWLER`UNLOAD: |-
        CRAWLER`UNLOAD
      DATA`ROUTE`CRAWLER`UPKEEP: |-
        CRAWLER`UPKEEP
      DATA`ROUTE`CRAWLER`UPGRADE: |-
        CRAWLER`UPGRADE
      DATA`ROUTE`CRAWLER`BAY: |-
        CRAWLER`BAY
      DATA`ROUTE`ENCOUNTER`BARE: |-
        ENCOUNTER`SHOW
      DATA`ROUTE`ENCOUNTER`START: |-
        ENCOUNTER`START
      DATA`ROUTE`ENCOUNTER`JOIN: |-
        ENCOUNTER`JOIN
      DATA`ROUTE`ENCOUNTER`ARG: |-
        ENCOUNTER`SHOW
      DATA`ROUTE`ENCOUNTER`USE: |-
        ENCOUNTER`USE
      DATA`ROUTE`ENCOUNTER`ADD: |-
        ENCOUNTER`ADD
      DATA`ROUTE`ENCOUNTER`REMOVE: |-
        ENCOUNTER`REMOVE
      DATA`ROUTE`ENCOUNTER`LEAVE: |-
        ENCOUNTER`LEAVE
      DATA`ROUTE`ENCOUNTER`KEEP: |-
        ENCOUNTER`KEEP
      DATA`ROUTE`ENCOUNTER`END: |-
        ENCOUNTER`END
      # What an encounter copies from a sheet when a character joins, and keeps apart until the GM keeps it or
      # the encounter ends: the meters, the re-rolls, the last check, and every SPENT`<kind>`<key> (the uses
      # spent of a piece of gear, system or module; FUN`COPIED). The build (class, abilities, mech) and Training
      # Points stay the sheet's own.
      DATA`COPY: |-
        HP AP MECH`SP MECH`EP MECH`HEAT USED`BACKGROUND USED`KEEPSAKE USED`MOTTO LAST
      DATA`DIFFICULTIES: |-
        trivial easy standard hard extreme
      DATA`DETAILS: |-
        CALLSIGN BACKGROUND MOTTO KEEPSAKE APPEARANCE
      # The meters: their label, the leaf under SALVAGE` that holds each, and where it starts (its most, or 0).
      # FUN`METER`MAX gives each one's most.
      DATA`METER`HP: |-
        HP
      DATA`METER`HP`LEAF: |-
        HP
      DATA`METER`HP`START: |-
        max
      DATA`METER`AP: |-
        AP
      DATA`METER`AP`LEAF: |-
        AP
      DATA`METER`AP`START: |-
        max
      DATA`METER`TP: |-
        TP
      DATA`METER`TP`LEAF: |-
        TP
      DATA`METER`TP`START: |-
        0
      DATA`METER`SP: |-
        SP
      DATA`METER`SP`LEAF: |-
        MECH`SP
      DATA`METER`SP`START: |-
        max
      DATA`METER`EP: |-
        EP
      DATA`METER`EP`LEAF: |-
        MECH`EP
      DATA`METER`EP`START: |-
        max
      DATA`METER`HEAT: |-
        Heat
      DATA`METER`HEAT`LEAF: |-
        MECH`HEAT
      DATA`METER`HEAT`START: |-
        0
      # The Union Crawler's Tech Levels: structure points, upkeep and upgrade value in scrap of its Tech Level, name.
      DATA`CRAWLER`1: |-
        20 5 30 Hamlet Crawler
      DATA`CRAWLER`2: |-
        25 5 30 Village Crawler
      DATA`CRAWLER`3: |-
        30 5 30 Town Crawler
      DATA`CRAWLER`4: |-
        35 5 30 City Crawler
      DATA`CRAWLER`5: |-
        40 5 30 Metropolis Crawler
      DATA`CRAWLER`6: |-
        50 5 0 Megacity Crawler

      # ---- commands ---------------------------------------------------------------
      # %1 the switches and %2 what follows, exactly as typed.
      CMD`SHEET:
        value: |-
          $(?is)^\+sheet(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,sheet,table,SHEET,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`MECH:
        value: |-
          $(?is)^\+mech(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,mech,table,MECH,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`CHECK:
        value: |-
          $(?is)^\+check(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,check,table,CHECK,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`CRAWLER:
        value: |-
          $(?is)^\+crawler(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,crawler,table,CRAWLER,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`ENCOUNTER:
        value: |-
          $(?is)^\+encounter(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,encounter,table,ENCOUNTER,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      # A line a bridge adds to one of this object's messages: HINT`<message>, set here by a bridge such as
      # sheet-salvage-union-help. %1 on are passed to it. Nothing when no bridge set one.
      FUN`HINT:
        value: |-
          if(hasattr(%!,HINT`%0),%b[u(%!/HINT`%0,%1,%2)])
        flags: [funsyntax]
      INC`COMMAND`RUN:
        value: |-
          @assert hastype(%#,player)=@pemit %#=notice(SHEET,Only players have a sheet.,warn); think u(%!/FUN`COMMAND`PARSE,%<word>,%<table>,%<switches>,%<argument>); @assert lte(words(%q<cmd_switch_list>),1)=@pemit %#=notice(SHEET,Use one switch at a time.,warn); @assert strlen(%q<cmd_route>)=@pemit %#=notice(SHEET,+%q<cmd_word> has no /%q<cmd_switch> switch.[u(%!/FUN`HINT,SWITCHES,%q<cmd_word>)],warn); @include %!/INC`%q<cmd_route>
        flags: [cmdsyntax]
      # %0 the word, %1 its route table, %2 the switches and %3 the argument, as typed. Sets cmd_word,
      # cmd_switch_list, cmd_switch, cmd_argument, cmd_has_equals, cmd_left_side and cmd_right_side around the
      # first =, cmd_route (the INC` routine to run), viewer_objid and viewer_keeper.
      FUN`COMMAND`PARSE:
        value: |-
          setqm(cmd_word,lcstr(%0),
          cmd_switch_list,lcstr(trim(edit(%2,/,%b))),
          cmd_switch,first(%q<cmd_switch_list>),
          cmd_argument,trim(%3),
          cmd_has_equals,strmatch(%3,*=*),
          cmd_left_side,trim(before(%3,=)),
          cmd_right_side,trim(after(%3,=)),
          cmd_route,get(%!/DATA`ROUTE`%1`[if(cand(strlen(%q<cmd_switch>),not(member(private mech,%q<cmd_switch>))),ucstr(%q<cmd_switch>),if(strlen(%q<cmd_switch>),ucstr(%q<cmd_switch>),if(strlen(%q<cmd_argument>),ARG,BARE)))]),
          viewer_objid,objid(%#),
          viewer_keeper,u(%!/FUN`PERM`KEEPER,%#))
        flags: [funsyntax]

      # ---- guards -----------------------------------------------------------------
      # %<name> a player's name: sheet_who, their objid.
      INC`NEED`TARGET:
        value: |-
          @assert strlen(setr(sheet_who,u(%!/FUN`PLAYER`MATCH,%<name>)))=@pemit %#=notice(SHEET,There is no player called '%<name>'.,warn)
        flags: [cmdsyntax]
      # %<text>: <name>/<what> for a sheet keeper, else <what> on your own sheet. sheet_who and sheet_what.
      INC`NEED`WHO:
        value: |-
          @if strmatch(%<text>,*/*)={@include/args %!/INC`NEED`TARGET=name,before(%<text>,/); think setq(sheet_what,trim(after(%<text>,/)))},{think setqm(sheet_who,%q<viewer_objid>,sheet_what,%<text>)}; @assert strlen(%q<sheet_who>); @assert cor(%q<viewer_keeper>,not(comp(%q<sheet_who>,%q<viewer_objid>)))=@pemit %#=notice(SHEET,Only sheet keepers change another character's sheet.,error)
        flags: [cmdsyntax]
      # The same for a meter or a detail: <name>=<what> for a sheet keeper, else <what>. sheet_who and sheet_what.
      INC`NEED`WHOEQ:
        value: |-
          @if %q<cmd_has_equals>={@include/args %!/INC`NEED`TARGET=name,%q<cmd_left_side>; think setq(sheet_what,%q<cmd_right_side>)},{think setqm(sheet_who,%q<viewer_objid>,sheet_what,%q<cmd_argument>)}; @assert strlen(%q<sheet_who>); @assert cor(%q<viewer_keeper>,not(comp(%q<sheet_who>,%q<viewer_objid>)))=@pemit %#=notice(SHEET,Only sheet keepers change another character's sheet.,error)
        flags: [cmdsyntax]
      # Changes only a keeper makes once a character is approved: the class.
      INC`NEED`EDITABLE:
        value: |-
          @assert cor(%q<viewer_keeper>,not(isapproved(%#)))=@pemit %#=notice(SHEET,Your character is approved%, so staff change your class now.,error); @include %!/INC`NEED`GATE
        flags: [cmdsyntax]
      # A player building their own sheet before approval: chargen is 1, and a bridge's gate may stop them.
      INC`NEED`GATE:
        value: |-
          think setq(chargen,cand(not(%q<viewer_keeper>),not(isapproved(%#)))); @assert cor(not(%q<chargen>),not(strlen(setr(set_gate,u(%!/FUN`GATE`EDIT,%#)))))=@pemit %#=notice(SHEET,%q<set_gate>,warn)
        flags: [cmdsyntax]
      # %<kind> ABILITY, CHASSIS, SYSTEM, MODULE, EQUIPMENT, TABLE or BAY, %<typed> what was typed, %<among> the
      # keys to look in (the whole list when empty): found_key.
      INC`NEED`FOUND:
        value: |-
          @assert strlen(%<typed>)=@pemit %#=notice(SHEET,Name the [lcstr(u(%!/FUN`KIND`LABEL,%<kind>))].,warn); @assert strlen(setr(found_key,u(%!/FUN`FIND,%<kind>,%<typed>,firstof(%<among>,get({{data}}/LIST`%<kind>)))))=@pemit %#=notice(SHEET,There is no [lcstr(u(%!/FUN`KIND`LABEL,%<kind>))] '%<typed>'[if(strlen(%<among>),%bthere)].[u(%!/FUN`FIND`HINT,%<kind>,%<typed>,firstof(%<among>,get({{data}}/LIST`%<kind>)))][u(%!/FUN`HINT,FOUND,%<kind>)],warn)
        flags: [cmdsyntax]
      # The character sheet_who has a mech: mech_chassis.
      INC`NEED`MECH:
        value: |-
          @assert strlen(setr(mech_chassis,get(%q<sheet_who>/SALVAGE`MECH`CHASSIS)))=@pemit %#=notice(MECH,[name(%q<sheet_who>)] has no mech yet. +mech/chassis <chassis> builds one.,warn)
        flags: [cmdsyntax]

      # ---- +sheet -----------------------------------------------------------------
      # +sheet/chargen [<name>]: the steps of building a new pilot and their mech, and how far the sheet is.
      INC`SHEET`CHARGEN:
        value: |-
          @if strlen(%q<cmd_argument>)={@include/args %!/INC`NEED`TARGET=name,%q<cmd_argument>},{think setq(sheet_who,%q<viewer_objid>)}; @assert strlen(%q<sheet_who>); @assert u(%!/FUN`PERM`VIEW,%#,%q<sheet_who>)=@pemit %#=notice(SHEET,Only [name(%q<sheet_who>)] and staff can read [poss(%q<sheet_who>)] sheet.,error); @pemit %#=u(%!/FUN`SCREEN`CHARGEN,%q<sheet_who>)
        flags: [cmdsyntax]
      INC`SHEET`SHOW:
        value: |-
          @if strlen(%q<cmd_argument>)={@include/args %!/INC`NEED`TARGET=name,%q<cmd_argument>},{think setq(sheet_who,%q<viewer_objid>)}; @assert strlen(%q<sheet_who>); @assert u(%!/FUN`PERM`VIEW,%#,%q<sheet_who>)=@pemit %#=notice(SHEET,Only [name(%q<sheet_who>)] and staff can read [poss(%q<sheet_who>)] sheet.,error); @pemit %#=u(%!/FUN`SCREEN`SHEET,%q<sheet_who>,%#); @break not(strlen(setr(show_enc,u(%!/FUN`ENC`OF,%q<sheet_who>)))); @pemit %#=notice(ENCOUNTER,[name(%q<sheet_who>)] is in [u(%!/FUN`ENC`TITLE,%q<show_enc>)] here: the meters and re-rolls above are its copy. The sheet itself has [u(%!/FUN`DISPLAY`COPYLINE,%q<sheet_who>,1)].)
        flags: [cmdsyntax]
      # +sheet/class [<name>/]<class>: only with no abilities learned, since the class decides the trees.
