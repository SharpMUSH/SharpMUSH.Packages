  # The Union Crawler the pilots share. Inside the Salvage Union Sheet, so no player can reach it, and no_command,
  # so nothing kept on it is ever matched as a command.
  - ref: store
    type: thing
    name: Salvage Union Crawler
    location: "{{sheet}}"
    flags: [no_command]
    attributes:
      CRAWLER: |-
        The Union Crawler: NAME, TYPE, TECH, SP, POOL, WEAPON and SCRAP`T<n>. +crawler shows it.

  # The +help topics, on an object of their own. sheet-salvage-union-help registers it with +help; without that
  # bridge nothing reads it. HELP`<TOPIC> is a topic, its subtopics the leaves beneath, LOCK`<TOPIC> who may read it.
  - ref: sheet_help
    type: thing
    name: Salvage Union Sheet Help
    location: "{{sheet}}"
    attributes:
      HELP: |-
        Your Salvage Union pilot and mech, the one die, the Union Crawler, and encounters with their own copies of each sheet: +sheet, +mech, +check, +crawler and +encounter.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`SHEET: |-
        mech check crawler encounter
      SEE`MECH: |-
        sheet check
      SEE`CHECK: |-
        sheet mech
      SEE`CRAWLER: |-
        sheet mech
      SEE`ENCOUNTER: |-
        sheet check
      HELP`SHEET: |-
        `+sheet` shows your pilot: class, HP, AP, training points, abilities, equipment, and your mech in one line.

        - `+sheet <name>` shows another pilot's, when the game lets you read it.
        - `+sheet/class <class>` chooses your class: Engineer, Hacker, Hauler, Salvager, Scout or Soldier.
        - `+sheet/learn <ability>` learns an ability. `+sheet/trees` shows the ones open to you.
        - `+sheet/take <equipment>` and `+sheet/drop <equipment>` fill your inventory. `+sheet/list 1` shows the Tech 1 equipment.
        - `+sheet/callsign`, `/background`, `/motto`, `/keepsake` and `/appearance` take your text after a space.

        A new pilot chooses one ability and two pieces of Tech 1 equipment, then builds a mech (`+help mech`). `+sheet/chargen` lists the steps and marks the ones done.

        For example:

        `+sheet/class engineer`

        Output: `\[SHEET\] Done: Alice is an Engineer. +sheet/trees shows the abilities she can learn.`

        See `+help sheet abilities`, `+help sheet play` and `+help sheet ledger`.
      HELP`SHEET`ABILITIES: |-
        Each class has three trees of three abilities, learned in order. The Salvager learns from every class's trees, up to 12; the others up to 10.

        - `+sheet/trees \[<class>\]` shows a class's trees, with what you have learned marked.
        - `+sheet/ability <ability>` reads one.
        - `+sheet/learn <ability>` learns one; `+sheet/unlearn <ability>` forgets the last of a tree.

        Once approved, learning costs training points (TP): 1 for a core ability, 2 for an Advanced or Hybrid one, 3 for a Legendary one. Forgetting costs 1. Staff award TP.

        With 6 core abilities and all three of one tree, you may advance down the tree it leads to: your class's Advanced tree, or a Hybrid Class, which opens two more core trees. Only one. With all three of that tree, one Legendary ability.

        For example:

        `+sheet/learn jury rig`

        Output: `\[SHEET\] Done: Alice learns Jury Rig.`
      HELP`SHEET`PLAY: |-
        In play you keep your own meters:

        - `+sheet/hp` and `+sheet/ap` take `+<n>`, `-<n>`, `<n>`, or `reset` for full: `+sheet/hp -2`.
        - `+check <ability>` spends the ability's AP for you.
        - `+sheet/use <equipment>` spends one use of a piece of equipment with uses, such as a grenade. `+sheet` shows the uses left.
        - `+sheet/downtime` brings back your HP, AP, uses, and background, motto and keepsake re-rolls, and repairs, recharges and cools your mech.

        In an encounter these are the encounter's copy (`+help encounter`).

        At 0 HP, roll `+check/table critical injury`.

        For example:

        `+sheet/hp -3`

        Output: `\[SHEET\] Done: Alice's HP is 7/10.`
      HELP`MECH: |-
        `+mech` shows your mech: SP, EP, heat, cargo, systems and modules, and its chassis ability.

        - `+mech/chassis <chassis>` builds it. `+mech/list chassis 1` shows the Tech 1 chassis.
        - `+mech/install <system or module>` and `+mech/remove <system or module>` fit and take off parts, within the chassis's slots.
        - `+mech/part <name>` reads a chassis, system or module. `+mech/list systems 1` and `+mech/list modules 1` list them.
        - `+mech/name <pattern name>` and `+mech/quirk <text>` make it yours.

        A new pilot builds from Tech 1 parts whose salvage values add up to 20 scrap or less.

        For example:

        `+mech/chassis mule`

        Output: `\[MECH\] Done: Alice's mech is a Mule: SP 12/12, EP 4/4, Heat 0/6.`

        See `+help mech play`.
      HELP`MECH`PLAY: |-
        - `+mech/sp`, `/ep` and `/heat` take `+<n>`, `-<n>`, `<n>` or `reset`: `+mech/sp -3`. Reaching the Heat Capacity makes a heat check.
        - `+mech/vent` shuts the mech down for an hour and takes its heat to 0.
        - `+mech/use <system or module>` spends one of its uses; downtime brings them back.
        - `+mech/scrap <tech>=+<n>` loads scrap into the cargo, one slot each; `-<n>` unloads it.

        At 0 SP, roll `+check/table critical damage`.

        For example:

        `+mech/scrap 1=+3`

        Output: `\[MECH\] Done: Alice's mech carries 3 Tech 1 scrap: 3 of 16 cargo slots.`
      HELP`CHECK: |-
        `+check \[<what>\]` rolls the one d20 where the room sees it: 20 Nailed it, 11 to 19 Success, 6 to 10 Tough Choice, 2 to 5 Failure, 1 Cascade Failure. Nothing is ever added to the die.

        - `<what>` may be one of your mech's systems or modules (it spends the EP and adds the heat), one of your abilities (it spends the AP), your equipment, or any words.
        - `=<n>` gives the cost of an X ability or system: `+check mass field repair=3`.
        - `/mech` makes a bare roll your mech's, so it can be pushed. `/private` rolls where only you see it.
        - `+check/table <table>` rolls on one of the game's tables; `+check/table` lists them.

        For example:

        `+check red laser`

        Output: `\[SHEET\] Alice rolls Red Laser (Close, 3 SP; 1 heat, 1/6): 14: Success (roll 42)`

        See `+help check push`.
      HELP`CHECK`PUSH: |-
        A roll can be made again once in each of these ways, within 10 minutes, and the second result stands:

        - `+check/push` re-rolls your mech's last check. The mech gains 2 heat and makes a heat check: a d20 at or under its heat, other than 20, overloads the reactor and rolls on the Reactor Overload table. A pilot's own checks can't be pushed.
        - `+check/reroll background` or `+check/reroll keepsake` re-rolls your last check when it fits that part of your pilot. Once each until downtime.
        - `+check/motto <name>` says your motto, and that pilot re-rolls their last check. Once until downtime.
        - `+check/heat` makes a heat check alone, as at the start of a turn at Heat Capacity.

        For example:

        `+check/push`

        Output: `\[MECH\] Alice pushes her mech: Red Laser: 4 becomes 15: Success (roll 43). Heat 3/6.`
      HELP`CRAWLER: |-
        `+crawler` shows the Union Crawler the pilots share: its Tech Level, SP, upkeep, upgrade pool, weapon and scrap.

        - `+crawler/unload` moves the scrap your mech carries into the crawler's.
        - `+crawler/scrap <tech>=+<n>` or `-<n>` changes the crawler's scrap, once you are approved.
        - `+crawler/bay \[<bay>\]` reads one of its bays.

        For example:

        `+crawler/unload`

        Output: `\[CRAWLER\] Alice unloads 3 Tech 1 scrap into the Union Crawler.`
      HELP`SHEET`CREDITS: |-
        Salvage Union is copyrighted by Leyline Press. Salvage Union and the “Powered by Salvage” logo are used with permission of Leyline Press, under the Salvage Union Open Game Licence 1.0b .

        This sheet is not an official Salvage Union product, and is not published or endorsed by Leyline Press. Its abilities, chassis, systems, modules, equipment and tables are the Salvage Union Core Book's text, from the Salvage Union (Unofficial) Foundry VTT system by demondownload and Stexinator.
      HELP`SHEET`LEDGER: |-
        Your sheet is built from a ledger: each class, ability, piece of equipment, detail, chassis, part and Training Point is an entry, with who made it and when.

        - `+sheet/ledger \[<name>\]` lists the entries, oldest first. One taken back is shown dimmed, with the entry that took it back.
        - Before approval, choosing again rewrites your choice, and `+sheet/unlearn`, `/drop` and `+mech/remove` remove the entry.
        - After approval every change is a new entry, so the ledger keeps the whole history.

        Staff take an entry back with `+sheet/revoke <name>/<n>`, or the whole sheet with `+sheet/clear <name>`.

        For example:

        `+sheet/ledger`

        Output: a table of the entries, such as `1  Class: Engineer  Alice  2026-11-01`.
      HELP`ENCOUNTER: |-
        An encounter keeps its own copy of each member's HP, AP, mech SP, EP and heat, re-rolls and uses. A fight that runs for days, or two scenes at once, never changes the sheet itself.

        - `+encounter/start \[<title>\]` starts one in your room and makes you its GM. A room can hold several; each has a number.
        - `+encounter/join \[<n>\]` takes a copy of your sheet into one. `+encounter/leave \[<n>\]` drops your copy.
        - `+encounter \[<n>\]` shows its members and their copies.
        - `+encounter/use <n>` picks which one you play in, when you have joined several here.

        While you are in the encounter's room, `+sheet/hp`, `+check` and the rest change the copy; anywhere else they change your sheet. Duties always use the sheet itself.

        The GM runs it:

        - `+encounter/add <name>\[=<n>\]` and `/remove <name>\[=<n>\]` bring someone in or take them out.
        - `+encounter/keep <name>\[=<n>\]` writes that member's copy onto their sheet.
        - `+encounter/end \[<n>\]` ends it. A copy nobody kept is dropped.

        For example:

        `+encounter/start Scrap run`

        Output: `\[ENCOUNTER\] Alice starts encounter #1 Scrap run. +encounter/join 1 takes part with a copy of your sheet. What happens to it stays in the encounter unless the GM keeps it.`
      LOCK`SHEET`STAFF: |-
        perm^softcode.salvage.admin
      HELP`SHEET`STAFF: |-
        Sheet keepers \(`softcode.salvage.admin`, or the Salvage Union Sheet Keeper role\) read every sheet and change any pilot's at any time, without spending TP:

        - The `+sheet` and `+mech` switches take `<name>/` first: `+sheet/learn Alice/jury rig`, `+mech/install Alice/red laser`.
        - The meters and texts take `<name>=` first: `+sheet/tp Alice=+1` awards a training point.
        - `+sheet/max <name>/<hp, ap or slots>=<n>` changes a pilot's most.
        - `+crawler/name`, `/type`, `/weapon <system>`, `/tech <n>`, `/sp` and `/pool` run the Union Crawler. `+crawler/upkeep` pays 5 scrap of its Tech Level into the upgrade pool, or rolls on the deterioration table; `+crawler/upgrade` raises its Tech Level when the pool is full.

        - `+sheet/revoke <name>/<n>` takes back entry `<n>` of their ledger; `+sheet/clear <name>` takes back all of it, so they build the sheet again.
        - `+encounter/end`, `/keep`, `/add` and `/remove` work on any encounter.

        `@role/assign <player>=salvage-sheet-keeper` makes someone a keeper.
      LOCK`SHEET`SETTINGS: |-
        perm^config.admin
      HELP`SHEET`SETTINGS: |-
        `+config salvage` lists the settings and `+config salvage/<setting>=<value>` changes one \(`config.admin`\):

        - `hp`, `ap` and `slots`: a pilot's most HP, AP and inventory slots \(10, 5, 6\).
        - `scrap`: the Tech 1 scrap a new pilot builds their mech from \(20\).
        - `gear`: how many pieces of Tech 1 equipment a new pilot chooses \(2\).
        - `push`: the minutes in which a check can still be re-rolled \(10\).
        - `public`: whether anyone may read anyone's sheet and mech \(no\).

