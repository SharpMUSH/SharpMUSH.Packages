      TABLE`TELEPORTATION-POD: |-
        Teleportation Pod
      TABLE`TELEPORTATION-POD`TEXT: |-
        When activated, your Pilot teleports from your Mech's Cockpit back to a Teleportation Bay installed in your Union Crawler. Your equipped and carried Pilot Equipment also comes with you.
      TABLE`TELEPORTATION-POD`ROW`1-1: |-
        The teleporter malfunctions. You instead teleport to a random Teleportation Bay somewhere on the Campaign Map you are currently in.
      TABLE`TELEPORTATION-POD`ROW`2-5: |-
        The teleporter fails to trigger. You may try again on your next turn.
      TABLE`TELEPORTATION-POD`ROW`6-10: |-
        You teleport to your destination, but suffer a teleportation mishap. Roll on the Critical Injury Table.
      TABLE`TELEPORTATION-POD`ROW`11-19: |-
        You teleport safely to your destination.
      TABLE`TELEPORTATION-POD`ROW`20-20: |-
        You teleport perfectly to your destination. In addition, you may bring an additional creature within Close Range with you as you teleport.
      TABLE`TELEPORTATION-POD`ROWS: |-
        1-1 2-5 6-10 11-19 20-20
      TABLE`TRADING-BAY: |-
        Trading Bay
      TABLE`TRADING-BAY`TEXT: |-
        Roll on this table to determine what is available for trade during Downtime. The specific Chassis, Systems, or Modules available are determined randomly or by the Mediator. All Chassis, Systems, and Modules available for trade are always one level higher than your Union Crawler.
      TABLE`TRADING-BAY`ROW`1-1: |-
        Nothing is available for trade during this Downtime.
      TABLE`TRADING-BAY`ROW`2-5: |-
        An Intact Module is available for trade.
      TABLE`TRADING-BAY`ROW`6-10: |-
        An Intact System is available for trade.
      TABLE`TRADING-BAY`ROW`11-19: |-
        An Intact System and an Intact Module are available for trade.
      TABLE`TRADING-BAY`ROW`20-20: |-
        An Intact Mech Chassis is available for trade.
      TABLE`TRADING-BAY`ROWS: |-
        1-1 2-5 6-10 11-19 20-20
      TABLE`TYPHON-SWALLOW-WHOLE: |-
        [Typhon] Swallow Whole
      TABLE`TYPHON-SWALLOW-WHOLE`TEXT: |-
        Typhon attempts to swallow a target into its humongous maw. Typhon may have multiple targets swallowed at once.
      TABLE`TYPHON-SWALLOW-WHOLE`ROW`1-1: |-
        Typhon misses the target and its jaws become locked. It cannot use its Swallow Whole attack for one turn.
      TABLE`TYPHON-SWALLOW-WHOLE`ROW`2-5: |-
        Typhon misses the target.
      TABLE`TYPHON-SWALLOW-WHOLE`ROW`6-10: |-
        Typhon chews through the target. A random System on the target is destroyed and the target takes 5 SP damage.
      TABLE`TYPHON-SWALLOW-WHOLE`ROW`11-19: |-
        Typhon swallows the target whole. The target takes 10 SP damage as it enters the Bio-Titan's gullet. Whilst swallowed, the target takes 5 SP damage at the end of their turn, and cannot move. They can attempt to use a Turn Action to escape. If Typhon takes 25 or more SP damage in one round it will regurgitate whatever it has swallowed.
      TABLE`TYPHON-SWALLOW-WHOLE`ROW`20-20: |-
        The target is swallowed whole and entirely mulched in the jaws of Typhon. A Mech or Vehicle is destroyed, a creature is killed.
      TABLE`TYPHON-SWALLOW-WHOLE`ROWS: |-
        1-1 2-5 6-10 11-19 20-20
      TABLE`TYRANT-TAIL-SWIPE: |-
        [Tyrant] Tail Swipe
      TABLE`TYRANT-TAIL-SWIPE`TEXT: |-
        If The Tyrant is attacked by any weapons with the Missile or Melee Trait, it may attempt to deflect the attack with its Tail.
      TABLE`TYRANT-TAIL-SWIPE`ROW`1-1: |-
        Tyrant fails to deflect the hit and its mammoth Tail is torn off. It gains the Vulnerable Trait until the start of its next turn.
      TABLE`TYRANT-TAIL-SWIPE`ROW`2-5: |-
        Tyrant fails to deflect the hit and is hit as normal and takes full damage. It cannot use Tail Swat until the start of the next Turn.
      TABLE`TYRANT-TAIL-SWIPE`ROW`6-10: |-
        Tyrant partially deflects the hit, it hits and Tyrant takes half damage rounded down from the attack.
      TABLE`TYRANT-TAIL-SWIPE`ROW`11-19: |-
        Tyrant deflects the hit, it misses and Tyrant takes no damage.
      TABLE`TYRANT-TAIL-SWIPE`ROW`20-20: |-
        Tyrant deflects the hit back. It hits the target for double damage.
      TABLE`TYRANT-TAIL-SWIPE`ROWS: |-
        1-1 2-5 6-10 11-19 20-20
      TABLE`UNION-CALL: |-
        Union Call
      TABLE`UNION-CALL`TEXT: |-
        As a Union Rep you can call upon the aid of other Pilots to support you in a variety of missions.
      TABLE`UNION-CALL`ROW`1-1: |-
        The mission fails, and cannot be completed as something has gone badly wrong, for example, the target of an assassination attempt escapes and places a bounty on you instead, the trade caravan is destroyed, or the salvage is taken by a corpo or raider band instead.
      TABLE`UNION-CALL`ROW`2-5: |-
        You wait two weeks and realise the mission is not completed. You may post the mission offer again or choose a different one.
      TABLE`UNION-CALL`ROW`6-10: |-
        The mission will be completed within two weeks, but only if you pay twice the agreed reward during Downtime.
      TABLE`UNION-CALL`ROW`11-19: |-
        The mission is completed within two weeks. You pay the reward during Downtime.
      TABLE`UNION-CALL`ROW`20-20: |-
        The mission is completed within a week. You pay the reward during Downtime.
      TABLE`UNION-CALL`ROWS: |-
        1-1 2-5 6-10 11-19 20-20
      TABLE`WELL-ACTUALLY: |-
        Well actually...
      TABLE`WELL-ACTUALLY`TEXT: |-
        You can casually answer questions about Systems, Modules, Mechs, or technology even if you do not actually know the answer.
      TABLE`WELL-ACTUALLY`ROW`1-1: |-
        You do not know the answer, and everyone realises this.
      TABLE`WELL-ACTUALLY`ROW`2-5: |-
        You do not actually know, and must make up a convincing answer to save your pride.
      TABLE`WELL-ACTUALLY`ROW`6-10: |-
        You can ask the Mediator two questions about it. One of these answers must be true, but the other can be false.
      TABLE`WELL-ACTUALLY`ROW`11-19: |-
        You can ask the Mediator three questions about it and they must give you true answers.
      TABLE`WELL-ACTUALLY`ROW`20-20: |-
        You can ask the Mediator five questions about it and they must give you true answers.
      TABLE`WELL-ACTUALLY`ROWS: |-
        1-1 2-5 6-10 11-19 20-20
      TABLE`WHIRLWIND-STRIKE: |-
        Whirlwind Strike
      TABLE`WHIRLWIND-STRIKE`TEXT: |-
        You have learned to deliver a flurry of attacks against your foes.
      TABLE`WHIRLWIND-STRIKE`ROW`1-1: |-
        Your attacks miss. You spin wildly and then collapse, falling Prone
      TABLE`WHIRLWIND-STRIKE`ROW`2-5: |-
        You hit one enemy in Range of the weapon, then your weapon is damaged.
      TABLE`WHIRLWIND-STRIKE`ROW`6-10: |-
        You hit all enemies within Range of the weapon. Choose one: you deal half damage to all targets or you deal full damage, but your weapon is damaged after finishing the attack.
      TABLE`WHIRLWIND-STRIKE`ROW`11-18: |-
        You strike all enemies within Range of the weapon.
      TABLE`WHIRLWIND-STRIKE`ROW`19-20: |-
        You strike all enemies within Range of the weapon, hitting them for double damage.
      TABLE`WHIRLWIND-STRIKE`ROWS: |-
        1-1 2-5 6-10 11-18 19-20
      TABLE`WORM: |-
        Worm
      TABLE`WORM`TEXT: |-
        You have programmed a complex worm virus that can traverse through a network of multiple Mechs, causing havoc and chaos amongst their installed Systems and Modules, and even potentially disabling their Chassis entirely.
      TABLE`WORM`ROW`1-1: |-
        The Worm fails to upload to the targets and has no effect.
      TABLE`WORM`ROW`2-5: |-
        A System or Module on one targeted Mech of your choice is damaged.
      TABLE`WORM`ROW`6-10: |-
        A System or Module of your choice on each Mech is damaged.
      TABLE`WORM`ROW`11-19: |-
        A System and Module of your choice on each Mech is damaged.
      TABLE`WORM`ROW`20-20: |-
        The Chassis of all targeted Mechs is damaged and inoperable until repaired.
      TABLE`WORM`ROWS: |-
        1-1 2-5 6-10 11-19 20-20
