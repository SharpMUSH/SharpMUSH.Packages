      API`SCRAP:
        value: |-
          setq(api_scrap,max(0,add(default({{store}}/CRAWLER`SCRAP`T%0,0),%1)))[if(cand(isint(%0),gte(%0,1),lte(%0,6)),[if(%q<api_scrap>,attrib_set({{store}}/CRAWLER`SCRAP`T%0,%q<api_scrap>),attrib_set({{store}}/CRAWLER`SCRAP`T%0))]%q<api_scrap>,#-1 NO SUCH TECH LEVEL)]
        flags: [VISUAL]
      # Named: %<roller> an objid, %<trait> a trait key or typed text (empty for the bare die), %<spend> the cost of
      # an X ability or system, %<mech> 1 to make it a mech roll. Spends the AP, EP and heat the trait costs, rolls
      # one d20 and keeps it (roll() record) as the roller's last check, and makes a heat check for a Heat Spike
      # part or when the heat reaches the Heat Capacity. In an encounter it spends from the encounter's copy;
      # %<live> 1 spends from the sheet itself, as Duties does. Returns {"tier","die","label","detail","kind","trait","roll","heatcheck",
