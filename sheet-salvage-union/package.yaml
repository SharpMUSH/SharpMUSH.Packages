      SYSTEM`PRAWN-SIFTER`TABLE: |-
        PRAWN-SIFTER
      SYSTEM`PRAWN-SIFTER`TEXT: |-
        This complex prawn-like array of salvaging arms allows for the rapid and efficient Area Salvage, increasing your chances to find Mech Chassis, Systems, and Modules in an area.
        When performing Area Salvage with a Prawn Sifter, use the following table instead.
      SYSTEM`ADVANCED-FABRICATION-ARM: |-
        Advanced Fabrication Arm
      SYSTEM`ADVANCED-FABRICATION-ARM`TECH: |-
        4
      SYSTEM`ADVANCED-FABRICATION-ARM`SLOTS: |-
        3
      SYSTEM`ADVANCED-FABRICATION-ARM`VALUE: |-
        3
      SYSTEM`ADVANCED-FABRICATION-ARM`TEXT: |-
        Specially designed by Osiris Construction to repair Evantis Colossus Mechs during the last war of nations.
        {cost=2EP} Patch
        Turn Action // Range: Close
        You restore up to 7 Structure Points to any Mech in Range that has at least 1 SP.
        {cost=2EP} System Repair
        Short Action // Range: Close
        You repair a damaged Tech 1, 2, 3, or 4 System or Module in Range to Intact Condition. It is now usable.
        {cost=4EP} Chassis Repair
        Long Action // Range: Close
        You repair a damaged Tech 1, 2, 3, or 4 Mech Chassis or Vehicle in Range to Intact Condition. It is now usable with 1 SP.
      SYSTEM`HIGH-GAIN-ANTENNA: |-
        High Gain Antenna
      SYSTEM`HIGH-GAIN-ANTENNA`TECH: |-
        2
      SYSTEM`HIGH-GAIN-ANTENNA`SLOTS: |-
        1
      SYSTEM`HIGH-GAIN-ANTENNA`VALUE: |-
        1
      SYSTEM`HIGH-GAIN-ANTENNA`ACTION: |-
        passive
      SYSTEM`HIGH-GAIN-ANTENNA`TEXT: |-
        A simple, scrap-built, extendable antenna that helps pierce through the atomic background noise. This increases the Range band of any of your installed Modules or Pilot Abilities with the Communicator, Hacking, and Scanner Trait by 1. For example, increasing the range of a Comms Module from Long Range to Far Range.
      SYSTEM`SMUGGLING-HOLD: |-
        Smuggling Hold
      SYSTEM`SMUGGLING-HOLD`TECH: |-
        3
      SYSTEM`SMUGGLING-HOLD`SLOTS: |-
        5
      SYSTEM`SMUGGLING-HOLD`VALUE: |-
        2
      SYSTEM`SMUGGLING-HOLD`ACTION: |-
        passive
      SYSTEM`SMUGGLING-HOLD`TEXT: |-
        A black box hold that disguises cargo within it from scans and inspections by enforcement agents. It is likely the tenuous corporate economy would collapse if it was not for smugglers making hot runs between arcos to deliver all manner of contraband goods such as patented plant seeds, vital medicines, and of course, weapons for anyone planning a rebellion.
        This hold increases your Cargo Capacity by 8. In addition, all cargo you store in this hold and the hold itself cannot be found by any inspections or be seen or targeted by anything with the Scanning, Hacking, Optics, or Targeter Trait.
      SYSTEM`TARGET-PAINTER: |-
        Target Painter
      SYSTEM`TARGET-PAINTER`TECH: |-
        3
      SYSTEM`TARGET-PAINTER`SLOTS: |-
        2
      SYSTEM`TARGET-PAINTER`VALUE: |-
        3
      SYSTEM`TARGET-PAINTER`EP: |-
        2
      SYSTEM`TARGET-PAINTER`RANGE: |-
        close
      SYSTEM`TARGET-PAINTER`TRAITS: |-
        Targeter
      SYSTEM`TARGET-PAINTER`ACTION: |-
        turn
      SYSTEM`TARGET-PAINTER`TEXT: |-
        The Target Painter focusses a small beam on a target, tagging it so that missiles can automatically hit.
        When activated, choose any target in Range. Until the start of your next turn, all Ranged attacks your Allies make with the Missile Trait may automatically hit the target as though they rolled a 11-19. These attacks all count as having the Targeter and Guided Traits for this attack in addition to ther other Traits.
      SYSTEM`MINI-MORTAR: |-
        Mini Mortar
      SYSTEM`MINI-MORTAR`TECH: |-
        1
      SYSTEM`MINI-MORTAR`SLOTS: |-
        5
      SYSTEM`MINI-MORTAR`VALUE: |-
        5
      SYSTEM`MINI-MORTAR`RANGE: |-
        medium
      SYSTEM`MINI-MORTAR`DAMAGE: |-
        5 SP
      SYSTEM`MINI-MORTAR`TRAITS: |-
        Explosive (1)
      SYSTEM`MINI-MORTAR`USES: |-
        5
      SYSTEM`MINI-MORTAR`TEXT: |-
        The Herrsch Pattern Miniaturised Mortar lobs a explosive, high velocity round against a target, flaying everything around it with superheated shrapnel.
      SYSTEM`30MM-AUTOCANNON: |-
        30mm Autocannon
      SYSTEM`30MM-AUTOCANNON`TECH: |-
        2
      SYSTEM`30MM-AUTOCANNON`SLOTS: |-
        5
      SYSTEM`30MM-AUTOCANNON`VALUE: |-
        3
      SYSTEM`30MM-AUTOCANNON`RANGE: |-
        medium
      SYSTEM`30MM-AUTOCANNON`DAMAGE: |-
        4 SP
      SYSTEM`30MM-AUTOCANNON`TRAITS: |-
        Ballistic|Jamming
      SYSTEM`30MM-AUTOCANNON`TEXT: |-
        This automatic ballistic weapon fires high calibre slugs at a target.
        Evantis are one of the main manufacturers of heavy duty ballistic weapons, and you can expect to find their designs on their standard mil-tech loadouts.
      SYSTEM`LOUDSPEAKERS: |-
        Loudspeakers
      SYSTEM`LOUDSPEAKERS`TECH: |-
        1
      SYSTEM`LOUDSPEAKERS`SLOTS: |-
        1
      SYSTEM`LOUDSPEAKERS`VALUE: |-
        1
      SYSTEM`LOUDSPEAKERS`RANGE: |-
        long
      SYSTEM`LOUDSPEAKERS`ACTION: |-
        free
      SYSTEM`LOUDSPEAKERS`TEXT: |-
        These externally mounted speakers can be clearly heard by anything up to Long Range from you. They can be used to communicate externally with those outside of your Mech or play some beats from your cassette deck.
        The Immortan Raiders made effective use of Loudspeakers as a crude shock and awe tool during their devastating raids in the Ferrous Wars.
      SYSTEM`MONOMOLECULAR-BLADE: |-
        Monomolecular Blade
      SYSTEM`MONOMOLECULAR-BLADE`TECH: |-
        5
      SYSTEM`MONOMOLECULAR-BLADE`SLOTS: |-
        3
      SYSTEM`MONOMOLECULAR-BLADE`VALUE: |-
        3
      SYSTEM`MONOMOLECULAR-BLADE`RANGE: |-
        close
      SYSTEM`MONOMOLECULAR-BLADE`DAMAGE: |-
        7 SP
      SYSTEM`MONOMOLECULAR-BLADE`TRAITS: |-
        Deadly|Energy|Melee|Wield
      SYSTEM`MONOMOLECULAR-BLADE`TEXT: |-
        A honed-carbon fibre blade with a monomolecular energy field that can slice through a Mech like butter.
        Nobody is sure who designed these, but they started appearing in salvage spots around the Nanite Sea following the first Meld incident.
      SYSTEM`SHIELD-DOME: |-
        Shield Dome
      SYSTEM`SHIELD-DOME`TECH: |-
        4
      SYSTEM`SHIELD-DOME`SLOTS: |-
        4
      SYSTEM`SHIELD-DOME`VALUE: |-
        4
      SYSTEM`SHIELD-DOME`EP: |-
        X
      SYSTEM`SHIELD-DOME`RANGE: |-
        close
      SYSTEM`SHIELD-DOME`TRAITS: |-
        Shield
      SYSTEM`SHIELD-DOME`ACTION: |-
        turn
      SYSTEM`SHIELD-DOME`TEXT: |-
        The thrumming sound of these blue shields and the taste of static in the air are an iconic warning sign of an Aeon lance approaching.
        When activated, you project a Shield Dome around your Mech. Choose any amount of Energy Points when you activate this Ability. The Shield Dome has a number of Structure Points equal to 2x the Energy Points you spend on this Ability. You may only have one Shield Dome active at a time. You may deactivate the Shield Dome as a Free Action.
        When you or any target within Close Range of your Mech is dealt damage, the damage is instead dealt to the Shield Dome. Any excess damage that penetrates the shield is dealt to the target instead. If the damage is reduced to 0, the target suffers no additional effect from the attack.
      SYSTEM`LOCOMOTION-SYSTEM: |-
        Locomotion System
      SYSTEM`LOCOMOTION-SYSTEM`TECH: |-
        1
      SYSTEM`LOCOMOTION-SYSTEM`SLOTS: |-
        2
      SYSTEM`LOCOMOTION-SYSTEM`VALUE: |-
        2
      SYSTEM`LOCOMOTION-SYSTEM`TRAITS: |-
        Recommended System
      SYSTEM`LOCOMOTION-SYSTEM`ACTION: |-
        passive
      SYSTEM`LOCOMOTION-SYSTEM`TEXT: |-
        A sturdy and dependable Locomotion System allowing a Mech to traverse most standard terrain types and adaptable to fit on most Chassis. Locomotion Systems vary widely from bipedal to quadrupedal, and beyond. Some esoteric designs are known to have as many as eight legs!
        A Locomotion System allows a Mech to move normally. If a Mech does not have a Locomotion System or it is damaged or destroyed the Mech cannot move.
      SYSTEM`120MM-CANNON: |-
        120mm Cannon
      SYSTEM`120MM-CANNON`TECH: |-
        3
      SYSTEM`120MM-CANNON`SLOTS: |-
        7
      SYSTEM`120MM-CANNON`VALUE: |-
        4
      SYSTEM`120MM-CANNON`RANGE: |-
        long
      SYSTEM`120MM-CANNON`DAMAGE: |-
        6 SP
      SYSTEM`120MM-CANNON`TRAITS: |-
        Ballistic|Explosive (1)
      SYSTEM`120MM-CANNON`TEXT: |-
        This chunky Weapons System fires a huge ballistic charge that explodes on impact. These are said to be so old they were used by actual nations during the First Corporate War.
        Despite their simplicity and weight, they're still undeniably effective when combined with modern targeting and tracking systems.
      SYSTEM`ROTARY-MINIGUN: |-
        Rotary Minigun
      SYSTEM`ROTARY-MINIGUN`TECH: |-
        3
      SYSTEM`ROTARY-MINIGUN`SLOTS: |-
        7
      SYSTEM`ROTARY-MINIGUN`VALUE: |-
        4
      SYSTEM`ROTARY-MINIGUN`HOT: |-
        1
      SYSTEM`ROTARY-MINIGUN`RANGE: |-
        medium
      SYSTEM`ROTARY-MINIGUN`DAMAGE: |-
        4 SP
      SYSTEM`ROTARY-MINIGUN`TRAITS: |-
        Ballistic|Hot (1)|Jamming|Multiattack (2)|Pinning
      SYSTEM`ROTARY-MINIGUN`TEXT: |-
        This Evantis-developed Mech-mountable rotary ballistic weapon fires a horrifying hail of firepower at a target. This was the favoured weapon of the legendary salvager Flash, who was said to have held off an entire Evantis lance whilst defending their Union Crawler #129 during the Reclamation.
      SYSTEM`RED-LASER: |-
        Red Laser
      SYSTEM`RED-LASER`TECH: |-
        1
      SYSTEM`RED-LASER`SLOTS: |-
        3
      SYSTEM`RED-LASER`VALUE: |-
        3
      SYSTEM`RED-LASER`HOT: |-
        1
      SYSTEM`RED-LASER`RANGE: |-
        close
      SYSTEM`RED-LASER`DAMAGE: |-
        3 SP
      SYSTEM`RED-LASER`TRAITS: |-
        Energy|Hot (1)
      SYSTEM`RED-LASER`TEXT: |-
        Red lasers strike a target with a small, focussed beam of heat. Their blueprint has been made widely available by the Opus Institute and are commonly used by corpos as much as they are by salvagers and wastelanders.
      SYSTEM`HYDRAULIC-CRUSHER: |-
        Hydraulic Crusher
      SYSTEM`HYDRAULIC-CRUSHER`TECH: |-
        1
      SYSTEM`HYDRAULIC-CRUSHER`SLOTS: |-
        4
      SYSTEM`HYDRAULIC-CRUSHER`VALUE: |-
        4
      SYSTEM`HYDRAULIC-CRUSHER`RANGE: |-
        close
      SYSTEM`HYDRAULIC-CRUSHER`DAMAGE: |-
        3 SP
      SYSTEM`HYDRAULIC-CRUSHER`TRAITS: |-
        Melee|Rigging|Salvaging|Unwieldy
      SYSTEM`HYDRAULIC-CRUSHER`TEXT: |-
        This hydraulic crushing system can be used to scour an area of salvage or as an impromptu weapon. Sometimes both.
        When you Area Salvage with this System you gain a single additional Scrap of the Tech Level of the area in addition to what you roll on the Area Salvaging Table.
      SYSTEM`SHOTGUN-PIT: |-
        Shotgun Pit
      SYSTEM`SHOTGUN-PIT`TECH: |-
        2
      SYSTEM`SHOTGUN-PIT`SLOTS: |-
        2
      SYSTEM`SHOTGUN-PIT`VALUE: |-
        2
      SYSTEM`SHOTGUN-PIT`ACTION: |-
        passive
      SYSTEM`SHOTGUN-PIT`TEXT: |-
        This is a separate cockpit which is mounted to the side of a Mech, and allows a Pilot to ride 'shotgun' on the Mech in support of the main Pilot, though unable to control the Mech itself.
        They may fire from the Shotgun Pit with any equipped weapons and use any of their Pilot Equipment or Abilities.
        When riding in the Shotgun Pit, the Pilot takes half damage from any weapons that deal HP damage and standard damage from any weapons that deal SP damage.
        If the Shotgun Pit is ever damaged or destroyed, the Pilot riding inside it must roll on the Critical Injury Table.
      SYSTEM`INDUSTRIAL-BODY-KIT: |-
        Industrial Body Kit
      SYSTEM`INDUSTRIAL-BODY-KIT`TECH: |-
        2
      SYSTEM`INDUSTRIAL-BODY-KIT`SLOTS: |-
        3
      SYSTEM`INDUSTRIAL-BODY-KIT`VALUE: |-
        3
      SYSTEM`INDUSTRIAL-BODY-KIT`ACTION: |-
        passive
      SYSTEM`INDUSTRIAL-BODY-KIT`TEXT: |-
        This body kit allows you to change the skin of your Mech to appear as though it is any other Tech 1 or 2 Mech or any design of your choice.This allows them to meld seamlessly with other Mechs of the desired design.
      SYSTEM`RAILGUN: |-
        Railgun
      SYSTEM`RAILGUN`TECH: |-
        4
      SYSTEM`RAILGUN`SLOTS: |-
        9
      SYSTEM`RAILGUN`VALUE: |-
        8
      SYSTEM`RAILGUN`HOT: |-
        2
      SYSTEM`RAILGUN`RANGE: |-
        long
      SYSTEM`RAILGUN`DAMAGE: |-
        9 SP
      SYSTEM`RAILGUN`TRAITS: |-
        Ballistic|Hot (2)
      SYSTEM`RAILGUN`TEXT: |-
        A magnetically propelled ballistic weapon that fires a large calibre, high velocity projectile that deals devastating damage on impact.
        The tragic fall of Crawler #13 was caused by a sustained railgun barrage from an Evantis hit squad sent to secure territory around the Arid Steppes. The catalyst for the Reclamation of the Wastes, this incident prompted the Opus Institue to reverse engineer and release their own Railgun schematic; turning the tide in the fight against the corpos.
      SYSTEM`EXPERIMENTAL-TELEPORTATION-HOL: |-
        Experimental Teleportation Hold
      SYSTEM`EXPERIMENTAL-TELEPORTATION-HOL`TECH: |-
        6
      SYSTEM`EXPERIMENTAL-TELEPORTATION-HOL`SLOTS: |-
        5
      SYSTEM`EXPERIMENTAL-TELEPORTATION-HOL`VALUE: |-
        4
      SYSTEM`EXPERIMENTAL-TELEPORTATION-HOL`EP: |-
        3
      SYSTEM`EXPERIMENTAL-TELEPORTATION-HOL`ACTION: |-
        turn
      SYSTEM`EXPERIMENTAL-TELEPORTATION-HOL`TABLE: |-
        EXPERIMENTAL-TELEPORTATION-HOL
      SYSTEM`EXPERIMENTAL-TELEPORTATION-HOL`TEXT: |-
        Developed by Ascension PLC as part of their 'Matter Doesn't Matter' campaign, this allows you to teleport salvage directly from your Mech to the Crawler. This System increases your Mech's Cargo Capacity by 10.
        When you activate this ability, you teleport all Scrap, Chassis, Systems, Modules, and People your Mech is carrying to the Storage Bay in your Union Crawler.
      SYSTEM`NEEDLE-MISSILE-POD: |-
        Needle Missile Pod
      SYSTEM`NEEDLE-MISSILE-POD`TECH: |-
        4
      SYSTEM`NEEDLE-MISSILE-POD`SLOTS: |-
        3
      SYSTEM`NEEDLE-MISSILE-POD`VALUE: |-
        4
      SYSTEM`NEEDLE-MISSILE-POD`RANGE: |-
        long
      SYSTEM`NEEDLE-MISSILE-POD`DAMAGE: |-
        1 SP
      SYSTEM`NEEDLE-MISSILE-POD`TRAITS: |-
        Guided|Targeter
      SYSTEM`NEEDLE-MISSILE-POD`ACTION: |-
        turn
      SYSTEM`NEEDLE-MISSILE-POD`USES: |-
        30
      SYSTEM`NEEDLE-MISSILE-POD`TEXT: |-
        Rumoured to have been developed using nanite tech from the vast Nanite Sea near the Stefanus home arco in the Forgotten Tundra, it fires a stream of nano-missiles at a target which hone in and overwhelm their defences.
        When activated as a Turn Action, you may fire up to 6 Needle Missiles at a target of your choice in Range. This attack does not require you to be able to see the target, and automatically hits.
        Each individual Needle Missile fired takes up one 'Use' and is counted as a separate attack. Any modifiers or effects apply to each Needle Missile individually. For example, if you used the Offensive Protocols Module to increase the damage of the Needle Missile Pods apply this effect to only one of the Needle Missiles fired, not all 6.
      SYSTEM`RADOMES: |-
        Radomes
      SYSTEM`RADOMES`TECH: |-
        4
      SYSTEM`RADOMES`SLOTS: |-
        3
      SYSTEM`RADOMES`VALUE: |-
        3
      SYSTEM`RADOMES`ACTION: |-
        passive
      SYSTEM`RADOMES`TEXT: |-
        This advanced radar system massively extends the communication and detection Range of any of your Systems, Modules, or Abilities with the Communicator Trait.
        You may now use such devices to contact and receive communications from anything with the Communicator Trait within the entire Region Map you are in, including your Union Crawler.
      SYSTEM`50-CAL-MACHINE-GUN: |-
        .50 Cal Machine Gun
      SYSTEM`50-CAL-MACHINE-GUN`TECH: |-
        1
      SYSTEM`50-CAL-MACHINE-GUN`SLOTS: |-
        2
      SYSTEM`50-CAL-MACHINE-GUN`VALUE: |-
        2
      SYSTEM`50-CAL-MACHINE-GUN`RANGE: |-
        close
      SYSTEM`50-CAL-MACHINE-GUN`DAMAGE: |-
        2 SP
      SYSTEM`50-CAL-MACHINE-GUN`TRAITS: |-
        Ballistic|Jamming|Pinning
      SYSTEM`50-CAL-MACHINE-GUN`TEXT: |-
        This simple ballistic weapon of the Opus Institute design fires solid, high calibre rounds that can puncture a Mech hull and shred through infantry. It has been a mainstay of battlefields for as long as anyone remembers and remains ubiquitous today.
      SYSTEM`REFLECTIVE-SHIELDING: |-
        Reflective Shielding
      SYSTEM`REFLECTIVE-SHIELDING`TECH: |-
        5
      SYSTEM`REFLECTIVE-SHIELDING`SLOTS: |-
        4
      SYSTEM`REFLECTIVE-SHIELDING`VALUE: |-
        3
      SYSTEM`REFLECTIVE-SHIELDING`EP: |-
        2
      SYSTEM`REFLECTIVE-SHIELDING`RANGE: |-
        close
      SYSTEM`REFLECTIVE-SHIELDING`TRAITS: |-
        Shield
      SYSTEM`REFLECTIVE-SHIELDING`ACTION: |-
        reaction
      SYSTEM`REFLECTIVE-SHIELDING`TABLE: |-
        REFLECTIVE-SHIELDING
      SYSTEM`REFLECTIVE-SHIELDING`TEXT: |-
        This shielding array of Stefanus design is specifically designed to reflect attacks back at the target.
        When you or a target in Close Range is hit by a weapon with the Ballistic or Energy Trait you may activate your Reflective Shielding to prevent the hit.
      SYSTEM`MODULE-SWITCH: |-
        Module Switch
      SYSTEM`MODULE-SWITCH`TECH: |-
        2
      SYSTEM`MODULE-SWITCH`SLOTS: |-
        4
      SYSTEM`MODULE-SWITCH`VALUE: |-
        1
      SYSTEM`MODULE-SWITCH`ACTION: |-
        passive
      SYSTEM`MODULE-SWITCH`TEXT: |-
        A complex adaptation port that lets you install additional Modules onto your Mech. This System increases your Mech's Module Capacity by 1.
      SYSTEM`AFF-COOLANT-FOAM: |-
        AFF Coolant Foam
      SYSTEM`AFF-COOLANT-FOAM`TECH: |-
        3
      SYSTEM`AFF-COOLANT-FOAM`SLOTS: |-
        2
      SYSTEM`AFF-COOLANT-FOAM`VALUE: |-
        2
      SYSTEM`AFF-COOLANT-FOAM`EP: |-
        1
      SYSTEM`AFF-COOLANT-FOAM`RANGE: |-
        close
      SYSTEM`AFF-COOLANT-FOAM`ACTION: |-
        turn
      SYSTEM`AFF-COOLANT-FOAM`USES: |-
        5
      SYSTEM`AFF-COOLANT-FOAM`TEXT: |-
        This device sprays highly pressurised Aqueous Film Forming Coolant Foam on a Mech, rapidly reducing their Heat levels. It can also be used to quench blazing fires.
        Reduces the Heat of a target Mech in Range to 0.
      SYSTEM`FLOODLIGHTS: |-
        Floodlights
      SYSTEM`FLOODLIGHTS`TECH: |-
        1
      SYSTEM`FLOODLIGHTS`SLOTS: |-
        1
      SYSTEM`FLOODLIGHTS`VALUE: |-
        1
      SYSTEM`FLOODLIGHTS`RANGE: |-
        medium
      SYSTEM`FLOODLIGHTS`ACTION: |-
        free
      SYSTEM`FLOODLIGHTS`TEXT: |-
        Flood Lights, light up a wide area in up to Medium Range of a Mech as a Free Action. This allows you to see more clearly in dark or foggy conditions. The beam can be focussed for tight or wide beam light.
      SYSTEM`TRANSPORT-HOLD: |-
        Transport Hold
      SYSTEM`TRANSPORT-HOLD`TECH: |-
        1
      SYSTEM`TRANSPORT-HOLD`SLOTS: |-
        2
      SYSTEM`TRANSPORT-HOLD`VALUE: |-
        2
      SYSTEM`TRANSPORT-HOLD`ACTION: |-
        passive
      SYSTEM`TRANSPORT-HOLD`TEXT: |-
        A simple hold designed to store salvage on a Mech. Not the most flashy option, but nothing beats the feeling of having a hold full of Scrap to bring home to the Crawler. A Transport Hold increases the Cargo Capacity of a Mech by 4.
      SYSTEM`TESLA-COILS: |-
        Tesla Coils
      SYSTEM`TESLA-COILS`TECH: |-
        4
      SYSTEM`TESLA-COILS`SLOTS: |-
        5
      SYSTEM`TESLA-COILS`VALUE: |-
        3
      SYSTEM`TESLA-COILS`TEXT: |-
        Developed by Aeon as a means to charge their patented shielding technology whilst in the field. Tesla Coils fire an arc of supercharged electricity which can be used in offensive, defensive, and support roles.
        {cost=2EP} Tesla Arc
        Turn Action // Range: Medium
        You may choose up to three different targets in Range. Roll to hit once as normal. On a successful hit, the first target takes 4 SP damage, the second target takes 3 SP damage, and the third target takes 2 SP damage.
        {cost=3EP} Tesla Charge
        Turn Action // Range: Close
        You may restore up to 2 EP to a target Mech in Range.
        {cost=2EP} Tesla Shield
        Turn Action // Range: Close // Shield
        You create an electrical field around your Mech for 10 minutes. Everything within Close Range of you, including Allies, takes 3 SP damage as you activate this Ability. If anything ends its turn in Close Range of you it takes 3 SP damage.
      SYSTEM`MECH-MELEE-ARMAMENT: |-
        Mech Melee Armament
      SYSTEM`MECH-MELEE-ARMAMENT`TECH: |-
        3
      SYSTEM`MECH-MELEE-ARMAMENT`SLOTS: |-
        2
      SYSTEM`MECH-MELEE-ARMAMENT`VALUE: |-
        2
      SYSTEM`MECH-MELEE-ARMAMENT`RANGE: |-
        close
      SYSTEM`MECH-MELEE-ARMAMENT`DAMAGE: |-
        5 SP
      SYSTEM`MECH-MELEE-ARMAMENT`TRAITS: |-
        Melee|Wield
      SYSTEM`MECH-MELEE-ARMAMENT`TEXT: |-
        This System covers a wide array of close combat weapons designed for Mechs including swords, hatchets, and clubs. When crafting this you may describe what the weapon looks like.
        Gladiator Pilots who fight for corpo scrip in the pits of the sprawling Osiris home arco favour these weapons for the spectacle they engender.
        *Duelling is prohibited by Union Code § 914 - Art. 114. (b) unless under strict supervision by a chartered Union Rep.*
      SYSTEM`EXPERIMENTAL-PARTICLE-BEAM-CAN: |-
        Experimental Particle Beam Cannon
      SYSTEM`EXPERIMENTAL-PARTICLE-BEAM-CAN`TECH: |-
        6
      SYSTEM`EXPERIMENTAL-PARTICLE-BEAM-CAN`SLOTS: |-
        12
      SYSTEM`EXPERIMENTAL-PARTICLE-BEAM-CAN`VALUE: |-
        10
      SYSTEM`EXPERIMENTAL-PARTICLE-BEAM-CAN`RANGE: |-
        long
      SYSTEM`EXPERIMENTAL-PARTICLE-BEAM-CAN`DAMAGE: |-
        2d20
      SYSTEM`EXPERIMENTAL-PARTICLE-BEAM-CAN`TRAITS: |-
        Energy|Explosive (1d20)|Heat Spike|Hot (1d20)|Unwieldy
      SYSTEM`EXPERIMENTAL-PARTICLE-BEAM-CAN`TEXT: |-
        This Weapons System is designed to fire a high energy beam of subatomic particles which when they impact a target scramble its molecular structure rendering them into their component atoms. These blueprints were extracted from Sakura during a salvage run, and as far as we are aware are purely theoretical.
        *Please report any findings of field use of this weapon to the Salvage Union Council*
      SYSTEM`TORPEDO-TUBES: |-
        Torpedo Tubes
      SYSTEM`TORPEDO-TUBES`TECH: |-
        2
      SYSTEM`TORPEDO-TUBES`SLOTS: |-
        6
      SYSTEM`TORPEDO-TUBES`VALUE: |-
        5
      SYSTEM`TORPEDO-TUBES`HOT: |-
        1
      SYSTEM`TORPEDO-TUBES`DAMAGE: |-
        6 SP
      SYSTEM`TORPEDO-TUBES`TRAITS: |-
        Explosive (2)|Hot (1)|Missile|Range: Close/Long
      SYSTEM`TORPEDO-TUBES`USES: |-
        6
      SYSTEM`TORPEDO-TUBES`TEXT: |-
        Developed as a highly destructive and versatile armament for underwater Mechs, it is not advisable to use these on land unless you have a good plan. Originally developed by Oceanic Rim, a subsidiary of Aegean Dynamics, Contour Aerospace conducted a short, highly hostile takeover of the subsidiary and solidified their power over both land and sea.
        When fired in water, Torpedo Tubes are Long Range weapons. When fired out of water they are Close Range weapons.
      SYSTEM`EJECTION-SYSTEM: |-
        Ejection System
      SYSTEM`EJECTION-SYSTEM`TECH: |-
        3
      SYSTEM`EJECTION-SYSTEM`SLOTS: |-
        2
      SYSTEM`EJECTION-SYSTEM`VALUE: |-
        2
      SYSTEM`EJECTION-SYSTEM`TRAITS: |-
        Escape
      SYSTEM`EJECTION-SYSTEM`ACTION: |-
        reaction
      SYSTEM`EJECTION-SYSTEM`TABLE: |-
        EJECTION-SYSTEM
      SYSTEM`EJECTION-SYSTEM`TEXT: |-
        An Ejection System propels a Pilot from their Mech's cockpit to a safe distance, where they land with the aid of a parachute. This allows you to escape your Mech in the event it suffers critical damage, is destroyed, or you find yourself in a tight spot.
      SYSTEM`ARMOURED-SHIELD: |-
        Armoured Shield
      SYSTEM`ARMOURED-SHIELD`TECH: |-
        2
      SYSTEM`ARMOURED-SHIELD`SLOTS: |-
        2
      SYSTEM`ARMOURED-SHIELD`VALUE: |-
        2
      SYSTEM`ARMOURED-SHIELD`TRAITS: |-
        Shield|Wield
      SYSTEM`ARMOURED-SHIELD`ACTION: |-
        reaction
      SYSTEM`ARMOURED-SHIELD`TABLE: |-
        ARMOURED-SHIELD
      SYSTEM`ARMOURED-SHIELD`TEXT: |-
        This metallic shield is designed to protect the wielder from melee attacks, handy when a Bio-Titan is chomping down on you.
        When your Mech or a target in Close Range is hit by a Melee Attack you may use your Armoured Shield to block the attack as a Reaction.
      SYSTEM`N15-FAT-BOY: |-
        N15 Fat Boy
      SYSTEM`N15-FAT-BOY`TECH: |-
        6
      SYSTEM`N15-FAT-BOY`SLOTS: |-
        10
      SYSTEM`N15-FAT-BOY`VALUE: |-
        15
      SYSTEM`N15-FAT-BOY`RANGE: |-
        far
      SYSTEM`N15-FAT-BOY`TRAITS: |-
        Guided|Missile|Targeter
      SYSTEM`N15-FAT-BOY`ACTION: |-
        turn
      SYSTEM`N15-FAT-BOY`TEXT: |-
        This miniaturised nuclear weapon launches an atomic warhead at a target creating a small and localised thermonuclear explosion. They said these weapons would spell the end to all wars, but war never ceases. Nuclear weapons may seem like the only option when it comes to dealing with an insurmountable situation, however be aware that the use of nuclear armaments, even in the wasteland, makes you fair game for nuclear retaliation.
        When activated, you fire the N15 Fat Boy at a target within Range. This automatically hits and does not require line of sight.
        The target and everything within Long Range is destroyed and we really do mean *everything*. The entire area is also permanently Irradiated.
        When used this system is destroyed and cannot be used again.
      SYSTEM`ION-CANNON: |-
        Ion Cannon
      SYSTEM`ION-CANNON`TECH: |-
        5
      SYSTEM`ION-CANNON`SLOTS: |-
        5
      SYSTEM`ION-CANNON`VALUE: |-
        4
      SYSTEM`ION-CANNON`RANGE: |-
        long
      SYSTEM`ION-CANNON`DAMAGE: |-
        3 SP
      SYSTEM`ION-CANNON`TRAITS: |-
        Anti-Shielding|Energy|Ion
      SYSTEM`ION-CANNON`TEXT: |-
        This Weapons System fires a disabling bolt of ionised energy at the target. A target hit by this weapon cannot activate any Systems, Modules, or Abilities that have an Energy Cost on their next turn.
        Stefanus forced Ascension PLC, one of their subsidiaries, to develop this as a countermeasure to their own Neura-Phage Mech, as Neura-Phage Pilots are known to sometimes be driven insane after spending too long wired into the cockpit.
      SYSTEM`SPIDER-LOCOMOTION-SYSTEM: |-
        Spider Locomotion System
      SYSTEM`SPIDER-LOCOMOTION-SYSTEM`TECH: |-
        3
      SYSTEM`SPIDER-LOCOMOTION-SYSTEM`SLOTS: |-
        4
      SYSTEM`SPIDER-LOCOMOTION-SYSTEM`VALUE: |-
        4
      SYSTEM`SPIDER-LOCOMOTION-SYSTEM`ACTION: |-
        passive
      SYSTEM`SPIDER-LOCOMOTION-SYSTEM`TEXT: |-
        A series of lightweight, spider-like legs that allow for easy traversal over terrain and vertical movement.
        This Locomotion System, alongside allowing your Mech to move as normal, grants your Mech the Climbing Trait. This allows your Mech to easily traverse all forms of Difficult Terrain without penalty, and climb vertical and sheer surfaces with ease.
      SYSTEM`BLUE-BEAM-LASER: |-
        Blue Beam Laser
      SYSTEM`BLUE-BEAM-LASER`TECH: |-
        5
      SYSTEM`BLUE-BEAM-LASER`SLOTS: |-
        7
      SYSTEM`BLUE-BEAM-LASER`VALUE: |-
        4
      SYSTEM`BLUE-BEAM-LASER`RANGE: |-
        long
      SYSTEM`BLUE-BEAM-LASER`DAMAGE: |-
        X SP
      SYSTEM`BLUE-BEAM-LASER`TRAITS: |-
        Hot (X)
      SYSTEM`BLUE-BEAM-LASER`TEXT: |-
        This laser is designed to be charged before fired, burning up a reactor, but potentially dealing horrendous damage to a target. An effective siege weapon due to having time between attacks to cool down the Mech, these were deployed in the First Corpo War by Evantis to obliterate the Last Redoubt of Nations and pave the way for corpo rule.
        Before you make an attack with this Weapons System, choose a number. Your Mech gains Heat equal to this number. For example: if you increase your Heat by 3, the attack deals 3 SP damage. You cannot choose a number that would exceed your Mech's Heat Capacity.
      SYSTEM`HEAT-SINK: |-
        Heat Sink
      SYSTEM`HEAT-SINK`TECH: |-
        2
      SYSTEM`HEAT-SINK`SLOTS: |-
        2
      SYSTEM`HEAT-SINK`VALUE: |-
        1
      SYSTEM`HEAT-SINK`ACTION: |-
        passive
      SYSTEM`HEAT-SINK`TEXT: |-
        A large slab of Scrap that acts as a passive temperature exchange harmlessly dissipating Heat from your Mech's reactor. A Heat Sink increases the Maximum Heat Capacity of a Mech by 1 for each Heat Sink installed.
      SYSTEM`CHAFF-LAUNCHER: |-
        Chaff Launcher
      SYSTEM`CHAFF-LAUNCHER`TECH: |-
        2
      SYSTEM`CHAFF-LAUNCHER`SLOTS: |-
        1
      SYSTEM`CHAFF-LAUNCHER`VALUE: |-
        1
      SYSTEM`CHAFF-LAUNCHER`ACTION: |-
        reaction
      SYSTEM`CHAFF-LAUNCHER`USES: |-
        2
      SYSTEM`CHAFF-LAUNCHER`TEXT: |-
        This System fires a metallic cloud of chaff, made of strips of aluminium and zinc, from your Mech which can detonate missiles harmlessly in flight or scramble targeting systems.
        If you or an Ally in Close Range are hit by a weapon with the Missile Trait or any attack with the Targeter Trait, you may activate the Chaff Launcher. The attack misses, dealing no damage and having no other effect.
      SYSTEM`RED-PULSE-LASER: |-
        Red Pulse Laser
      SYSTEM`RED-PULSE-LASER`TECH: |-
        3
      SYSTEM`RED-PULSE-LASER`SLOTS: |-
        5
      SYSTEM`RED-PULSE-LASER`VALUE: |-
        3
      SYSTEM`RED-PULSE-LASER`HOT: |-
        1
      SYSTEM`RED-PULSE-LASER`RANGE: |-
        close
      SYSTEM`RED-PULSE-LASER`DAMAGE: |-
        5 SP
      SYSTEM`RED-PULSE-LASER`TRAITS: |-
        Energy|Hot (1)
      SYSTEM`RED-PULSE-LASER`TEXT: |-
        Shoots a hail of red lasers at a target sacrificing some range for increased firepower. Djinn Mechs mounted with these were effective in the retaking of the Aeon home arco in the Verdant Crescent from TDA rebels following Impact Day.
      SYSTEM`EJECTOR-POD: |-
        Ejector Pod
      SYSTEM`EJECTOR-POD`TECH: |-
        5
      SYSTEM`EJECTOR-POD`SLOTS: |-
        3
      SYSTEM`EJECTOR-POD`VALUE: |-
        3
      SYSTEM`EJECTOR-POD`TRAITS: |-
        Escape
      SYSTEM`EJECTOR-POD`ACTION: |-
        reaction
      SYSTEM`EJECTOR-POD`TABLE: |-
        EJECTOR-POD
      SYSTEM`EJECTOR-POD`TEXT: |-
        Developed by Sakura Futures as a means for their pilots to eject from their Mech in safety and comfort. This high-tech ejection System allows you to escape your Mech in the comfort of a well armoured Ejector Pod. The Ejector Pod rocket is propelled from your Mech and lands safely via the aid of a graviton stabilisation system.
        The Ejector Pod has 5 SP when deployed.
      SYSTEM`AUTOMATED-WEAPON-TURRET: |-
        Automated Weapon Turret
      SYSTEM`AUTOMATED-WEAPON-TURRET`TECH: |-
        4
      SYSTEM`AUTOMATED-WEAPON-TURRET`SLOTS: |-
        0
      SYSTEM`AUTOMATED-WEAPON-TURRET`VALUE: |-
        0
      SYSTEM`AUTOMATED-WEAPON-TURRET`TEXT: |-
        This System allows you to mount an A.I. controlled, automated weapon turret onto your Mech. The turret understands and follows basic commands you give it such as attacking a target or defending an area. The turret acts independently of you in the turn order, and may attack once per turn. This does not take up your Turn Action. The turret may not Push.
        When crafting this System, you may choose from the following turret types. Additionally, roll on the A.I. Personality Table for your Automated Turret System to determine its personality.
        Automated Machine Gun Turret
        Automated Green Laser Turret
        Automated 120mm Cannon Turret
      SYSTEM`RIGGING-ARM: |-
        Rigging Arm
      SYSTEM`RIGGING-ARM`TECH: |-
        1
      SYSTEM`RIGGING-ARM`SLOTS: |-
        2
      SYSTEM`RIGGING-ARM`VALUE: |-
        2
      SYSTEM`RIGGING-ARM`RANGE: |-
        close
      SYSTEM`RIGGING-ARM`TRAITS: |-
        Rigging
      SYSTEM`RIGGING-ARM`TEXT: |-
        This standard rigging arm designed for industrial use allows a Mech to pick up and manipulate objects. To avoid embarrassment in the field it is worth reminding Pilots that many Mechs are not fitted with arms or hands as standard and therefore incapable of picking items up. If your Mech lacks arms and you do not mount a Rigging Arm or equivalent, your Mech cannot pick things up.
      SYSTEM`LONG-BARRELLED-GREEN-LASER: |-
        Long Barrelled Green Laser
      SYSTEM`LONG-BARRELLED-GREEN-LASER`TECH: |-
        3
      SYSTEM`LONG-BARRELLED-GREEN-LASER`SLOTS: |-
        5
      SYSTEM`LONG-BARRELLED-GREEN-LASER`VALUE: |-
        2
      SYSTEM`LONG-BARRELLED-GREEN-LASER`HOT: |-
        1
      SYSTEM`LONG-BARRELLED-GREEN-LASER`RANGE: |-
        long
      SYSTEM`LONG-BARRELLED-GREEN-LASER`DAMAGE: |-
        4 SP
      SYSTEM`LONG-BARRELLED-GREEN-LASER`TRAITS: |-
        Energy|Hot (1)
      SYSTEM`LONG-BARRELLED-GREEN-LASER`TEXT: |-
        A Green Laser with an extended beam mount and heat sink allowing it to fire over a longer distance, whilst reducing its heat load. Salvagers adapted this tech from the original Opus Institute design and used them effectively in the Second Corpo War to take control of the great spires of the Aeon home arco in the Verdant Crescent.
      SYSTEM`GRAV-ASSISTED-CARGO-BAY: |-
        Grav Assisted Cargo Bay
      SYSTEM`GRAV-ASSISTED-CARGO-BAY`TECH: |-
        4
      SYSTEM`GRAV-ASSISTED-CARGO-BAY`SLOTS: |-
        5
      SYSTEM`GRAV-ASSISTED-CARGO-BAY`VALUE: |-
        4
      SYSTEM`GRAV-ASSISTED-CARGO-BAY`ACTION: |-
        passive
      SYSTEM`GRAV-ASSISTED-CARGO-BAY`TEXT: |-
        A Cargo Bay with an integrated anti-gravity System allowing a Mech to carry a vast amount of salvage. Developed by Drontek for use in the mammoth construction project of their Big Brother Mech.
        A Grav Assisted Cargo Bay increases your Cargo Capacity by 20.
      SYSTEM`AEROSOLISED-NERVE-GAS-SPRAYER: |-
        Aerosolised Nerve Gas Sprayer
      SYSTEM`AEROSOLISED-NERVE-GAS-SPRAYER`TECH: |-
        4
      SYSTEM`AEROSOLISED-NERVE-GAS-SPRAYER`SLOTS: |-
        5
      SYSTEM`AEROSOLISED-NERVE-GAS-SPRAYER`VALUE: |-
        4
      SYSTEM`AEROSOLISED-NERVE-GAS-SPRAYER`EP: |-
        3
      SYSTEM`AEROSOLISED-NERVE-GAS-SPRAYER`RANGE: |-
        close
      SYSTEM`AEROSOLISED-NERVE-GAS-SPRAYER`ACTION: |-
        turn
      SYSTEM`AEROSOLISED-NERVE-GAS-SPRAYER`TEXT: |-
        Emits a spray of caustic nerve gas that coats an area. Causes internal bleeding, vomiting, migraines, spasms, loss of bladder and bowel control and death.
        On a successful hit unprotected organic targets must roll on the critical injury table. Pilots without hazard protection, radiation sealing or equivalent are affected in their chassis.
        This does not affect Bio-Titans.
      SYSTEM`HOVER-LOCOMOTION-SYSTEM: |-
        Hover Locomotion System
      SYSTEM`HOVER-LOCOMOTION-SYSTEM`TECH: |-
        4
      SYSTEM`HOVER-LOCOMOTION-SYSTEM`SLOTS: |-
        5
      SYSTEM`HOVER-LOCOMOTION-SYSTEM`VALUE: |-
        4
      SYSTEM`HOVER-LOCOMOTION-SYSTEM`ACTION: |-
        passive
      SYSTEM`HOVER-LOCOMOTION-SYSTEM`TEXT: |-
        A Hover Locomotion System allows a Mech to move by hovering over terrain, obstacles, and even bodies of water, entirely circumventing them through grav propulsion. Mechs with this System gain the Hover Trait. DronTek holds the main patent for this, which has helped them secure the market on hover Mechs and drones and protect the relatively small corpo from hostile takeover.
      SYSTEM`TRACKING-NODE: |-
        Tracking Node
      SYSTEM`TRACKING-NODE`TECH: |-
        2
      SYSTEM`TRACKING-NODE`SLOTS: |-
        2
      SYSTEM`TRACKING-NODE`VALUE: |-
        2
      SYSTEM`TRACKING-NODE`EP: |-
        2
      SYSTEM`TRACKING-NODE`RANGE: |-
        long
      SYSTEM`TRACKING-NODE`TRAITS: |-
        Targeter
      SYSTEM`TRACKING-NODE`ACTION: |-
        turn
      SYSTEM`TRACKING-NODE`TEXT: |-
        A favourite of the Scouts Union, they are often used to track salvage targets over long distances.
        When activated, you fire a bead-sized tracking node from your Mech at any target within Long Range. The tracking node sticks to the target and allows you to track them over Range via your Mech's heads up display. You know the exact location of the target as long as it remains within Far Range of you. If the target moves further away than Far Range, you also know if the target returns to within Far Range of you. The tracking node adheres to a target for 24 hours. You may have multiple tracking nodes on multiple targets.
        *Union Code § 2211 prohibits the use of unsecured tracking systems on board Union Crawlers to prevent back hacking*
      SYSTEM`MULTI-PHASE-SHIELD: |-
        Multi-Phase Shield
      SYSTEM`MULTI-PHASE-SHIELD`TECH: |-
        5
      SYSTEM`MULTI-PHASE-SHIELD`SLOTS: |-
        6
      SYSTEM`MULTI-PHASE-SHIELD`VALUE: |-
        5
      SYSTEM`MULTI-PHASE-SHIELD`EP: |-
        3
      SYSTEM`MULTI-PHASE-SHIELD`TRAITS: |-
        Shield
      SYSTEM`MULTI-PHASE-SHIELD`ACTION: |-
        reaction
      SYSTEM`MULTI-PHASE-SHIELD`TABLE: |-
        MULTI-PHASE-SHIELD
      SYSTEM`MULTI-PHASE-SHIELD`TEXT: |-
        This multi-phase shielding array was developed as a collaboration between Aeon and Stefanus and protects a Mech against a wide array of attacks.
        When you are hit by an attack you may activate your Multi-Phase Shielding to prevent the hit.
      SYSTEM`NAPALM-LAUNCHER: |-
        Napalm Launcher
      SYSTEM`NAPALM-LAUNCHER`TECH: |-
        3
      SYSTEM`NAPALM-LAUNCHER`SLOTS: |-
        6
      SYSTEM`NAPALM-LAUNCHER`VALUE: |-
        3
      SYSTEM`NAPALM-LAUNCHER`RANGE: |-
        medium
      SYSTEM`NAPALM-LAUNCHER`DAMAGE: |-
        4 SP
      SYSTEM`NAPALM-LAUNCHER`TRAITS: |-
        Anti-Organic|Black Market|Burn (2)|Explosive (2)|Overheat
      SYSTEM`NAPALM-LAUNCHER`TEXT: |-
        Fires superheated napalm that sticks to a target causing agonising pain. Used extensively by Contour Aerospace in the purging of the primordials, which saw much of the world's forests turn to ash.
      SYSTEM`AUTOMATED-MACHINE-GUN-TURRET: |-
        Automated Machine Gun Turret
      SYSTEM`AUTOMATED-MACHINE-GUN-TURRET`TECH: |-
        4
      SYSTEM`AUTOMATED-MACHINE-GUN-TURRET`SLOTS: |-
        5
      SYSTEM`AUTOMATED-MACHINE-GUN-TURRET`VALUE: |-
        2
      SYSTEM`AUTOMATED-MACHINE-GUN-TURRET`RANGE: |-
        close
      SYSTEM`AUTOMATED-MACHINE-GUN-TURRET`DAMAGE: |-
        2 SP
      SYSTEM`AUTOMATED-MACHINE-GUN-TURRET`TRAITS: |-
        Ballistic|Pinning
      SYSTEM`AUTOMATED-MACHINE-GUN-TURRET`TEXT: |-
        A gimble mounted .50 Cal Machine gun with automated optical tracking.
        The turret understands and follows basic commands you give it such as attacking a target or defending an area. The turret acts independently of you in the turn order, and may attack once per turn. This does not take up your Turn Action. The turret may not Push.
      SYSTEM`TELEPORTATION-POD: |-
        Teleportation Pod
      SYSTEM`TELEPORTATION-POD`TECH: |-
        6
      SYSTEM`TELEPORTATION-POD`SLOTS: |-
        3
      SYSTEM`TELEPORTATION-POD`VALUE: |-
        3
      SYSTEM`TELEPORTATION-POD`EP: |-
        2
      SYSTEM`TELEPORTATION-POD`TRAITS: |-
        Escape
      SYSTEM`TELEPORTATION-POD`ACTION: |-
        reaction
      SYSTEM`TELEPORTATION-POD`TABLE: |-
        TELEPORTATION-POD
      SYSTEM`TELEPORTATION-POD`TEXT: |-
        This teleportation pod deconstructs your atoms and reconstructs them in the safety of a Teleportation Bay.
        There has been some philosophical debate among the Unions as to whether or not this device technically kills the Pilot and creates a clone of them. As yet, we are unable to reach a definitive conclusion as to the veracity of this theory.
        When activated, your Pilot teleports from your Mech's Cockpit back to a Teleportation Bay installed in your Union Crawler. Your equipped and carried Pilot Equipment also comes with you.
      SYSTEM`CACB-LASER: |-
        CACB Laser
      SYSTEM`CACB-LASER`TECH: |-
        4
      SYSTEM`CACB-LASER`SLOTS: |-
        7
      SYSTEM`CACB-LASER`VALUE: |-
        5
      SYSTEM`CACB-LASER`HOT: |-
        2
      SYSTEM`CACB-LASER`RANGE: |-
        long
      SYSTEM`CACB-LASER`DAMAGE: |-
        5 SP
      SYSTEM`CACB-LASER`TRAITS: |-
        Energy|Hot (2)
      SYSTEM`CACB-LASER`TEXT: |-
        Standing for 'Constant Amplitude, Constant Bearing Laser', the longer this laser is focussed on a target, the more damage it deals. Sakura Futures developed the CACB following Impact Day as a means to take down Anomaly X312, an organically shielded Bio-Titan that dominated the Central Wastes.
        Each time you hit the same target with this Weapons System in consecutive turns you deal an additional 5 SP damage. For example: If you hit a target for 3 consecutive turns then this weapon would deal 5 SP damage on the first turn, 10 SP damage on the second turn, and 15 SP damage on the third turn.
      SYSTEM`120MM-HEAVY-AUTOCANNON: |-
        120mm Heavy Autocannon
      SYSTEM`120MM-HEAVY-AUTOCANNON`TECH: |-
        6
      SYSTEM`120MM-HEAVY-AUTOCANNON`SLOTS: |-
        14
      SYSTEM`120MM-HEAVY-AUTOCANNON`VALUE: |-
        7
      SYSTEM`120MM-HEAVY-AUTOCANNON`RANGE: |-
        long
      SYSTEM`120MM-HEAVY-AUTOCANNON`DAMAGE: |-
        6 SP
      SYSTEM`120MM-HEAVY-AUTOCANNON`TRAITS: |-
        Ballistic|Explosive (1)|Jamming|Multi-Attack (3)
      SYSTEM`120MM-HEAVY-AUTOCANNON`TEXT: |-
        This obscenely oversized weapon rapidly fires 120mm explosive rounds. Evantis developed this as a means to show off the power of their Leviathan Heavy Mech which can mount two of these and still have room for a drinks dispenser. The drinks dispenser is known to dispense an unpleasant drink almost exactly unlike tea. This is why all good salvagers know not to blow all the scrap on the military budget.
      SYSTEM`GREEN-LASER: |-
        Green Laser
      SYSTEM`GREEN-LASER`TECH: |-
        2
      SYSTEM`GREEN-LASER`SLOTS: |-
        4
      SYSTEM`GREEN-LASER`VALUE: |-
        2
      SYSTEM`GREEN-LASER`HOT: |-
        2
      SYSTEM`GREEN-LASER`RANGE: |-
        medium
      SYSTEM`GREEN-LASER`DAMAGE: |-
        4 SP
      SYSTEM`GREEN-LASER`TRAITS: |-
        Energy|Hot (2)
      SYSTEM`GREEN-LASER`TEXT: |-
        The Green Laser fires a solid beam of superheated energy at a target. This was one of the first lasers developed for military use and was used extensively on all sides of the First Corpo War. It remains ubiquitous to this day.
      SYSTEM`COMPOSITE-ARMOUR: |-
        Composite Armour
      SYSTEM`COMPOSITE-ARMOUR`TECH: |-
        3
      SYSTEM`COMPOSITE-ARMOUR`SLOTS: |-
        3
      SYSTEM`COMPOSITE-ARMOUR`VALUE: |-
        1
      SYSTEM`COMPOSITE-ARMOUR`ACTION: |-
        passive
      SYSTEM`COMPOSITE-ARMOUR`TEXT: |-
        Layered plates of highly resilient metals, plastics, and ceramics that provide additional protection to your Mech.
        This System increases your Mech's Max SP by 5 for each Composite Armour Module you have installed.
        If this System is Damaged or Destroyed reduce your Max SP by 5 and reduce your current SP to match your new Max SP.
      SYSTEM`GRAPPLING-HARPOON: |-
        Grappling Harpoon
      SYSTEM`GRAPPLING-HARPOON`TECH: |-
        2
      SYSTEM`GRAPPLING-HARPOON`SLOTS: |-
        3
      SYSTEM`GRAPPLING-HARPOON`VALUE: |-
        2
      SYSTEM`GRAPPLING-HARPOON`TEXT: |-
        This System launches a grappling spike attached to a high tensile wire. Fired into a rock or structure and it can be used to help the Mech cross rough terrain. Fired at a Mech, it can be used to pin the Mech down or even pulled towards the attacker. Raiders love using these to pin down targets enabling their mates to strip them apart.
        {cost=2EP} Pin
        Turn Action // Range: Medium // Pinning
        When activated, choose a target in Range. You deal 1 SP damage to the target and it cannot move beyond Medium Range of your Mech whilst the grappling harpoon is attached. You can detach the grappling harpoon as a Free Action. The target may attempt to remove the harpoon as a Turn Action on their turn, if they have some means to do so.
        {cost=2EP} Swing
        Turn Action // Range: Medium
        When activated, you may swing or rappel up, down, or over any terrain or obstacle within Range such as a tall building, ravine, or stretch of Irradiated river as long as you have something sturdy to attach the grappling hook to.
      SYSTEM`DOZER-BLADES: |-
        Dozer Blades
      SYSTEM`DOZER-BLADES`TECH: |-
        2
      SYSTEM`DOZER-BLADES`SLOTS: |-
        3
      SYSTEM`DOZER-BLADES`VALUE: |-
        2
      SYSTEM`DOZER-BLADES`ACTION: |-
        passive
      SYSTEM`DOZER-BLADES`TEXT: |-
        A huge, frontal mounted, curved blade for clearing obstacles, used frequently by Osiris Construction.
        This allows your Mech to safely move through and clear any areas of Difficult Terrain such as rubble, ruins, and roadblocks.
      SYSTEM`PLASMA-CANNON: |-
        Plasma Cannon
      SYSTEM`PLASMA-CANNON`TECH: |-
        5
      SYSTEM`PLASMA-CANNON`SLOTS: |-
        6
      SYSTEM`PLASMA-CANNON`VALUE: |-
        5
      SYSTEM`PLASMA-CANNON`HOT: |-
        2
      SYSTEM`PLASMA-CANNON`RANGE: |-
        medium
      SYSTEM`PLASMA-CANNON`DAMAGE: |-
        5 SP
      SYSTEM`PLASMA-CANNON`TRAITS: |-
        Burn (2)|Explosive (2)|Hot (2)|Overheat
      SYSTEM`PLASMA-CANNON`TEXT: |-
        This Weapons System coats an area in superheated plasma which sticks to targets and burns through them. The effect is devastating against anyone in the open or unprotected terrain, burning them to a crisp in an instant. The weapon not only inflicts immediate damage against a Mech, it can also cause the Mech's reactor to overheat.
        This weapon was nearly banned under the terms of the Corporate Council Convention on Inhumane Weaponry. Aeon lawyers successfully argued that since the plasma heats to temperatures comparable to the centre of the sun, any man or woman hit by the weapon would instantly disintegrate and therefore not feel any pain.
      SYSTEM`FABRICATION-BAY: |-
        Fabrication Bay
      SYSTEM`FABRICATION-BAY`TECH: |-
        5
      SYSTEM`FABRICATION-BAY`SLOTS: |-
        7
      SYSTEM`FABRICATION-BAY`VALUE: |-
        5
      SYSTEM`FABRICATION-BAY`EP: |-
        3
      SYSTEM`FABRICATION-BAY`RANGE: |-
        close
      SYSTEM`FABRICATION-BAY`ACTION: |-
        short
      SYSTEM`FABRICATION-BAY`TEXT: |-
        Developed by Osiris Construction as a mobile field Repair Bay. This System mounts onto a Mech and allows other Mechs to repair and recharge within its restorative hull temporarily repairing damage to them through use of metal epoxy and hydrofluids.
        When activated, choose one of the following options. You may not use these Abilities on your own Mech.
        - Restore up to 15 SP to a target Mech within the Fabrication Bay with at least 1 SP.
        - Restore up to 2 EP to a target Mech within the Fabrication Bay.
        - Repair up to 3 damaged Systems or Modules of any Tech Level within the Fabrication Bay to Intact Condition.
        - Repair up to 2 damaged Mech Chassis or Vehicles of any Tech Level within the Fabrication Bay to Intact Condition.
      SYSTEM`CAPACITANCE-BANK: |-
        Capacitance Bank
      SYSTEM`CAPACITANCE-BANK`TECH: |-
        3
      SYSTEM`CAPACITANCE-BANK`SLOTS: |-
        4
      SYSTEM`CAPACITANCE-BANK`VALUE: |-
        2
      SYSTEM`CAPACITANCE-BANK`ACTION: |-
        passive
      SYSTEM`CAPACITANCE-BANK`TEXT: |-
        Using Opus developed supercapacitors this hefty capacitor bank is attached externally and connected to a Mech's reactor. Storing excess produced energy it is also capable of rapidly discharging that energy when needed.
        This System increases your Mech's Maximum EP by 2 for each bank installed.
      SYSTEM`HEAVY-DUTY-MINING-RIG: |-
        Heavy Duty Mining Rig
      SYSTEM`HEAVY-DUTY-MINING-RIG`TECH: |-
        3
      SYSTEM`HEAVY-DUTY-MINING-RIG`SLOTS: |-
        7
      SYSTEM`HEAVY-DUTY-MINING-RIG`VALUE: |-
        4
      SYSTEM`HEAVY-DUTY-MINING-RIG`RANGE: |-
        close
      SYSTEM`HEAVY-DUTY-MINING-RIG`DAMAGE: |-
        6 SP
      SYSTEM`HEAVY-DUTY-MINING-RIG`TRAITS: |-
        Deadly|Melee|Salvaging|Unwieldy
      SYSTEM`HEAVY-DUTY-MINING-RIG`TEXT: |-
        A heavy duty industrial mining rig that can be used to deal carnage in a pinch.
        Developed by Evantis for use in offworld colony mining, based on the Thatcher Steel blueprint. As is typical of Evantis design they like to prove they do it bigger and better than the competition.
      SYSTEM`RADIATION-SEALING: |-
        Radiation Sealing
      SYSTEM`RADIATION-SEALING`TECH: |-
        3
      SYSTEM`RADIATION-SEALING`SLOTS: |-
        3
      SYSTEM`RADIATION-SEALING`VALUE: |-
        3
      SYSTEM`RADIATION-SEALING`ACTION: |-
        passive
      SYSTEM`RADIATION-SEALING`TEXT: |-
        Radiation Sealing consists of layers of radiation proof materials combined with airtight sealant that protects your Mech and Pilot from radiation and other environmental hazards. This fully seals your Mech against radiation as well as other hazardous environmental effects. You and your Mech take no damage from radiation or hazardous environmental effects such as rad storms or areas of toxic waste. In addition, when dealing with severe environmental hazards, they may Push for free to circumvent or resist any effects. Your Mech can also function for up to an hour fully submerged in any non-corrosive liquid.
      SYSTEM`NANITE-REPAIR-ARM: |-
        Nanite Repair Arm
      SYSTEM`NANITE-REPAIR-ARM`TECH: |-
        6
      SYSTEM`NANITE-REPAIR-ARM`SLOTS: |-
        3
      SYSTEM`NANITE-REPAIR-ARM`VALUE: |-
        3
      SYSTEM`NANITE-REPAIR-ARM`TEXT: |-
        This highly specialised repair arm, developed by the Stefanus Solitude research team from their experiments with the Nanite Sea, fires a stream of nanites at a damaged mech or part restoring it to full functionality. The nanites' highly adaptive nature means this can be used to repair just about anything you will find in the wastes.
        {cost=2EP} Patch
        Turn Action // Range: Close
        You restore up to 10 Structure Points to any Mech in Range that has at least 1 SP.
        {cost=2EP} System Repair
        Short Action // Range: Close
        You repair any damaged System or Module in Range to Intact Condition. It is now usable.
        {cost=4EP} Chassis Repair
        Long Action // Range: Close
        You repair any damaged Mech Chassis or Vehicle in Range to Intact Condition. It is now usable with 1 SP.
      SYSTEM`RAIL-RIFLE: |-
        Rail Rifle
      SYSTEM`RAIL-RIFLE`TECH: |-
        3
      SYSTEM`RAIL-RIFLE`SLOTS: |-
        7
      SYSTEM`RAIL-RIFLE`VALUE: |-
        4
      SYSTEM`RAIL-RIFLE`HOT: |-
        1
      SYSTEM`RAIL-RIFLE`RANGE: |-
        far
      SYSTEM`RAIL-RIFLE`DAMAGE: |-
        5 SP
      SYSTEM`RAIL-RIFLE`TRAITS: |-
        Ballistic|Hot (1)
      SYSTEM`RAIL-RIFLE`TEXT: |-
        Developed by Sakura Futures for use in wetwork against heavily protected targets such as Consul Mechs, this lightweight railgun was reverse engineered from an original Evantis design. It fires an electro- magnetic ballistic charge at a phenomenal Range.
      SYSTEM`REFRACTIVE-SHIELD-PROJECTOR: |-
        Refractive Shield Projector
      SYSTEM`REFRACTIVE-SHIELD-PROJECTOR`TECH: |-
        2
      SYSTEM`REFRACTIVE-SHIELD-PROJECTOR`SLOTS: |-
        2
      SYSTEM`REFRACTIVE-SHIELD-PROJECTOR`VALUE: |-
        2
      SYSTEM`REFRACTIVE-SHIELD-PROJECTOR`EP: |-
        2
      SYSTEM`REFRACTIVE-SHIELD-PROJECTOR`RANGE: |-
        close
      SYSTEM`REFRACTIVE-SHIELD-PROJECTOR`TRAITS: |-
        Shield
      SYSTEM`REFRACTIVE-SHIELD-PROJECTOR`ACTION: |-
        reaction
      SYSTEM`REFRACTIVE-SHIELD-PROJECTOR`TABLE: |-
        REFRACTIVE-SHIELD-PROJECTOR
      SYSTEM`REFRACTIVE-SHIELD-PROJECTOR`TEXT: |-
        Developed by Aeon as a means to combat solar flares during colony construction and asteroid mining projects, this shield projector is also highly effective against energy weapons.
        When you or a target in Close Range is hit by a weapon with the Energy Trait, you may attempt to use your Refractive Shield Projector to prevent the hit.
      SYSTEM`SAND-BLASTER: |-
        Sand Blaster
      SYSTEM`SAND-BLASTER`TECH: |-
        1
      SYSTEM`SAND-BLASTER`SLOTS: |-
        3
      SYSTEM`SAND-BLASTER`VALUE: |-
        2
      SYSTEM`SAND-BLASTER`RANGE: |-
        close
      SYSTEM`SAND-BLASTER`DAMAGE: |-
        1 SP
      SYSTEM`SAND-BLASTER`ACTION: |-
        turn
      SYSTEM`SAND-BLASTER`TEXT: |-
        A compressor and nozzle which propels an abrasive material like sand to slowly erode, clean or shape a surface.
        Any target hit cannot use any System or Module with the Targeter Trait for 1 turn.
      SYSTEM`AUTOMATED-GREEN-LASER-TURRET: |-
        Automated Green Laser Turret
      SYSTEM`AUTOMATED-GREEN-LASER-TURRET`TECH: |-
        4
      SYSTEM`AUTOMATED-GREEN-LASER-TURRET`SLOTS: |-
        7
      SYSTEM`AUTOMATED-GREEN-LASER-TURRET`VALUE: |-
        3
      SYSTEM`AUTOMATED-GREEN-LASER-TURRET`HOT: |-
        2
      SYSTEM`AUTOMATED-GREEN-LASER-TURRET`RANGE: |-
        medium
      SYSTEM`AUTOMATED-GREEN-LASER-TURRET`DAMAGE: |-
        4 SP
      SYSTEM`AUTOMATED-GREEN-LASER-TURRET`TRAITS: |-
        Energy|Hot (2)
      SYSTEM`AUTOMATED-GREEN-LASER-TURRET`TEXT: |-
        A tri-axis gyroscope controlled Green Laser, with No-Scope LIDAR tracking.
        The turret understands and follows basic commands you give it such as attacking a target or defending an area. The turret acts independently of you in the turn order, and may attack once per turn. This does not take up your Turn Action. The turret may not Push.
      SYSTEM`MISSILE-POD: |-
        Missile Pod
      SYSTEM`MISSILE-POD`TECH: |-
        3
      SYSTEM`MISSILE-POD`SLOTS: |-
        7
      SYSTEM`MISSILE-POD`VALUE: |-
        5
      SYSTEM`MISSILE-POD`HOT: |-
        1
      SYSTEM`MISSILE-POD`RANGE: |-
        long
      SYSTEM`MISSILE-POD`DAMAGE: |-
        8 SP
      SYSTEM`MISSILE-POD`TRAITS: |-
        Explosive (2)|Hot (1)|Missile
      SYSTEM`MISSILE-POD`USES: |-
        6
      SYSTEM`MISSILE-POD`TEXT: |-
        Missile Pods fire a heavy salvo of unguided, rocket propelled explosives over a wide area of terrain.
        The Contour Aerospace execs were so proud of this design that when Aegean Dynamics surrendered to them they decided to shell their home arco to oblivion anyway and chalk the cost up as research and development.
      SYSTEM`WELDING-LASER: |-
        Welding Laser
      SYSTEM`WELDING-LASER`TECH: |-
        2
      SYSTEM`WELDING-LASER`SLOTS: |-
        3
      SYSTEM`WELDING-LASER`VALUE: |-
        3
      SYSTEM`WELDING-LASER`TEXT: |-
        This Mech-mountable welding laser allows you to make a wider range of repairs in the field. An invaluable tool that has become the official symbol of the Engineers' Union.
        {cost=2EP} Patch
        Turn Action // Range: Close
        You restore up to 5 Structure Points to any Mech in Range that has at least 1 SP.
        {cost=2EP} System Repair
        Short Action // Range: Close
        You repair a damaged Tech 1 or Tech 2 System or Module in Range to Intact Condition. It is now usable.
        {cost=4EP} Chassis Repair
        Long Action // Range: Close
        You repair a damaged Tech 1 or Tech 2 Mech Chassis or Vehicle in Range to Intact Condition. It is now usable with 1 SP.
      SYSTEM`SNUB-NOSED-BLUE-LASER: |-
        Snub-Nosed Blue Laser
      SYSTEM`SNUB-NOSED-BLUE-LASER`TECH: |-
        4
      SYSTEM`SNUB-NOSED-BLUE-LASER`SLOTS: |-
        5
      SYSTEM`SNUB-NOSED-BLUE-LASER`VALUE: |-
        2
      SYSTEM`SNUB-NOSED-BLUE-LASER`HOT: |-
        3
      SYSTEM`SNUB-NOSED-BLUE-LASER`RANGE: |-
        medium
      SYSTEM`SNUB-NOSED-BLUE-LASER`DAMAGE: |-
        3 SP
      SYSTEM`SNUB-NOSED-BLUE-LASER`TRAITS: |-
        Energy|Hot (3)
      SYSTEM`SNUB-NOSED-BLUE-LASER`TEXT: |-
        An adaption of the Blue Mining Laser which fragments the energy into a myriad of small but deadly particles which blast apart a target like buck shot.
        When this weapon hits a target in Close Range it deals 2x damage. Apply this after other modifiers.
      SYSTEM`ELECTRO-MAGNETIC-HARDENING: |-
        Electro-Magnetic Hardening
      SYSTEM`ELECTRO-MAGNETIC-HARDENING`TECH: |-
        4
      SYSTEM`ELECTRO-MAGNETIC-HARDENING`SLOTS: |-
        3
      SYSTEM`ELECTRO-MAGNETIC-HARDENING`VALUE: |-
        2
      SYSTEM`ELECTRO-MAGNETIC-HARDENING`ACTION: |-
        passive
      SYSTEM`ELECTRO-MAGNETIC-HARDENING`TEXT: |-
        This module hardens your Mech against Electro-Magnetic Pulse effects which typically would be able to shutdown your Mech and disable its systems. Anything with the EMP Trait or Ion Trait does not affect your Mech or any of its attached Systems or Modules.
      SYSTEM`RAD-WAVE-GENERATOR: |-
        Rad Wave Generator
      SYSTEM`RAD-WAVE-GENERATOR`TECH: |-
        3
      SYSTEM`RAD-WAVE-GENERATOR`SLOTS: |-
        5
      SYSTEM`RAD-WAVE-GENERATOR`VALUE: |-
        4
      SYSTEM`RAD-WAVE-GENERATOR`RANGE: |-
        medium
      SYSTEM`RAD-WAVE-GENERATOR`TRAITS: |-
        Black Market|Overheat
      SYSTEM`RAD-WAVE-GENERATOR`TEXT: |-
        This weapon fires an intense wave of radiation at a target. An organic target hit suffers an agonising death from acute radiation poisoning. They will suffer a Major Injury every day which reduces their Max HP by 2 each time.
        This attack can target Pilots inside their Mechs, unless they have Radiation Sealing or equivalent.
      SYSTEM`CHAINSAW-ARM: |-
        Chainsaw Arm
      SYSTEM`CHAINSAW-ARM`TECH: |-
        1
      SYSTEM`CHAINSAW-ARM`SLOTS: |-
        3
      SYSTEM`CHAINSAW-ARM`VALUE: |-
        3
      SYSTEM`CHAINSAW-ARM`RANGE: |-
        close
      SYSTEM`CHAINSAW-ARM`DAMAGE: |-
        2 SP
      SYSTEM`CHAINSAW-ARM`TRAITS: |-
        Melee|Salvaging
      SYSTEM`CHAINSAW-ARM`TEXT: |-
        Originally developed as a tool for lumberjack mechs by Hodgson & Vasquez, an Evantis subsidiary, this saw arm has remained in use for its salvaging capabilities, utility, and stopping power even as the forests have been cut down across the world.
      SYSTEM`BLUE-MINING-LASER: |-
        Blue Mining Laser
      SYSTEM`BLUE-MINING-LASER`TECH: |-
        2
      SYSTEM`BLUE-MINING-LASER`SLOTS: |-
        7
      SYSTEM`BLUE-MINING-LASER`VALUE: |-
        5
      SYSTEM`BLUE-MINING-LASER`HOT: |-
        3
      SYSTEM`BLUE-MINING-LASER`RANGE: |-
        long
      SYSTEM`BLUE-MINING-LASER`DAMAGE: |-
        6 SP
      SYSTEM`BLUE-MINING-LASER`TRAITS: |-
        Energy|Hot (3)
      SYSTEM`BLUE-MINING-LASER`TEXT: |-
        This heavy duty mining laser fires a concentrated blue beam originally designed to crack through deposits, but equally tears through a Mech.
        In the Night of Red Iron, salvagers tore apart Thatcher Steel defences with these, seizing their production facilities and turning the tide in the Ferrous Wars.
        *Union safety regulation 956.326 (a) requires the use of Reactor Safety Protocols when using this system.*
      SYSTEM`STABILISING-LOCOMOTION-SYSTEM: |-
        Stabilising Locomotion System
      SYSTEM`STABILISING-LOCOMOTION-SYSTEM`TECH: |-
        4
      SYSTEM`STABILISING-LOCOMOTION-SYSTEM`SLOTS: |-
        5
      SYSTEM`STABILISING-LOCOMOTION-SYSTEM`VALUE: |-
        3
      SYSTEM`STABILISING-LOCOMOTION-SYSTEM`ACTION: |-
        passive
      SYSTEM`STABILISING-LOCOMOTION-SYSTEM`TEXT: |-
        This Locomotion System, alongside allowing your Mech to move as normal, includes heavy actuators, pistons, and struts which can dig into the ground, stabilising your Mech and increasing its resilience and damage output at the cost of not being able to move.
        {cost=3EP} Stabilise
        Turn Action
        You activate the deployment protocols and your mech digs itself into the ground. Whilst stabilised, your Mech gains the Immobile Trait.
        Your Mech further reduces all damage it takes by 2 SP, to a minimum of 1 whilst stabilised. In addition, the first attack you make on your Turn whilst stabilised deals an additional 2 SP damage.
        You may retract your deployment stabilisers as a Turn Action, allowing you to move normally again, but losing all of these effects. This does not cost EP.
      SYSTEM`MOLE-TORPEDO: |-
        Mole Torpedo
      SYSTEM`MOLE-TORPEDO`TECH: |-
        5
      SYSTEM`MOLE-TORPEDO`SLOTS: |-
        6
      SYSTEM`MOLE-TORPEDO`VALUE: |-
        5
      SYSTEM`MOLE-TORPEDO`RANGE: |-
        long
      SYSTEM`MOLE-TORPEDO`DAMAGE: |-
        7 SP
      SYSTEM`MOLE-TORPEDO`TRAITS: |-
        Anti-Shielding|Guided|Missile|Targeter
      SYSTEM`MOLE-TORPEDO`USES: |-
        6
      SYSTEM`MOLE-TORPEDO`TEXT: |-
        This Weapons System fires a bunker busting torpedo with an explosive charge that burrows into the earth and travels underneath a target, causing a controlled explosion beneath it making it effective against shields.
        This weapon was used to bust open the underground home arco of the Spyre Corpo in the Central Wastes by TDA rebels. The ensuing massacre following the siege saw the corpo's oligarchs, executives, and elites summarily tried and executed, and its holdings permanently liquidated.
      SYSTEM`ARTICULATED-RIGGING-ARM: |-
        Articulated Rigging Arm
      SYSTEM`ARTICULATED-RIGGING-ARM`TECH: |-
        3
      SYSTEM`ARTICULATED-RIGGING-ARM`SLOTS: |-
        3
      SYSTEM`ARTICULATED-RIGGING-ARM`VALUE: |-
        3
      SYSTEM`ARTICULATED-RIGGING-ARM`TRAITS: |-
        Rigging|Salvaging
      SYSTEM`ARTICULATED-RIGGING-ARM`TEXT: |-
        This advanced rigging arm has multiple interacting joints allowing for a much greater degree of movement and utility, allowing the user to dig through salvage and manipulate objects in their external environment.
        The Mechs in the fighting pits of Osiris often have several articulated rigging arms to aid in grappling and ripping chunks off other Mechs.
        If you have two or more Articulated Rigging Arms your Mech gains the Climbing Trait.
      SYSTEM`NANOFIBRE-NET-LAUNCHER: |-
        Nanofibre Net Launcher
      SYSTEM`NANOFIBRE-NET-LAUNCHER`TECH: |-
        2
      SYSTEM`NANOFIBRE-NET-LAUNCHER`SLOTS: |-
        3
      SYSTEM`NANOFIBRE-NET-LAUNCHER`VALUE: |-
        2
      SYSTEM`NANOFIBRE-NET-LAUNCHER`EP: |-
        2
      SYSTEM`NANOFIBRE-NET-LAUNCHER`RANGE: |-
        close
      SYSTEM`NANOFIBRE-NET-LAUNCHER`ACTION: |-
        turn
      SYSTEM`NANOFIBRE-NET-LAUNCHER`TEXT: |-
        This System fires a large, strong nanofibre net at a target, making them easy pickings for salvage.
        When activated, you fire a nanofibre net at a target in Range. The target cannot move, and gains the Vulnerable Trait as it becomes trapped in the net. The target may attempt to escape the net as a Turn Action on their turn, if they have some means to do so.
      SYSTEM`ESCAPE-HATCH: |-
        Escape Hatch
      SYSTEM`ESCAPE-HATCH`TECH: |-
        1
      SYSTEM`ESCAPE-HATCH`SLOTS: |-
        1
      SYSTEM`ESCAPE-HATCH`VALUE: |-
        1
      SYSTEM`ESCAPE-HATCH`TRAITS: |-
        Escape|Recommended System
      SYSTEM`ESCAPE-HATCH`ACTION: |-
        reaction
      SYSTEM`ESCAPE-HATCH`TABLE: |-
        ESCAPE-HATCH
      SYSTEM`ESCAPE-HATCH`TEXT: |-
        An Escape Hatch is a sealed hatch that can be opened and escaped through in the event a Mech suffers critical damage or the Pilot needs to make a swift exit. When activated, by pulling a lever, a bolted charge blows the Escape Hatch from the Mech Chassis, allowing for the Pilot to crawl through to safety.
      SYSTEM`LASER-ANTI-MISSILE-SYSTEM: |-
        Laser Anti-Missile System
      SYSTEM`LASER-ANTI-MISSILE-SYSTEM`TECH: |-
        4
      SYSTEM`LASER-ANTI-MISSILE-SYSTEM`SLOTS: |-
        2
      SYSTEM`LASER-ANTI-MISSILE-SYSTEM`VALUE: |-
        3
      SYSTEM`LASER-ANTI-MISSILE-SYSTEM`EP: |-
        1
      SYSTEM`LASER-ANTI-MISSILE-SYSTEM`ACTION: |-
        reaction
      SYSTEM`LASER-ANTI-MISSILE-SYSTEM`TEXT: |-
        Developed by Drontek as a means to protect their Big Brother Mech, this Laser Anti-Missile System fires a series of nano-lasers at incoming missiles, destroying them before they strike.
        If you are hit by an attack with the Missile Trait you may activate your LAMS as a Reaction. The missiles explode harmlessly, missing and dealing no damage.
      SYSTEM`MULTI-FUNCTION-REPAIR-ARM: |-
        Multi-Function Repair Arm
      SYSTEM`MULTI-FUNCTION-REPAIR-ARM`TECH: |-
        5
      SYSTEM`MULTI-FUNCTION-REPAIR-ARM`SLOTS: |-
        3
      SYSTEM`MULTI-FUNCTION-REPAIR-ARM`VALUE: |-
        3
      SYSTEM`MULTI-FUNCTION-REPAIR-ARM`TEXT: |-
        Developed by Stefanus initially to repair the intricately complex mechanisms within the Neura-Phage Chassis, this system can fix up some of the most advanced tech out in the wastes.
        {cost=2EP} Patch
        Turn Action // Range: Close
        You restore up to 8 Structure Points to any Mech in Range that has at least 1 SP.
        {cost=2EP} System Repair
        Short Action // Range: Close
        You repair a damaged Tech 1, 2, 3, 4, or 5 System or Module in Range to Intact Condition. It is now usable.
        {cost=4EP} Chassis Repair
        Long Action // Range: Close
        You repair a damaged Tech 1, 2, 3, 4, or 5 Mech Chassis or Vehicle in Range to Intact Condition. It is now usable with 1 SP.
      SYSTEM`FABRICATION-ARM: |-
        Fabrication Arm
      SYSTEM`FABRICATION-ARM`TECH: |-
        3
      SYSTEM`FABRICATION-ARM`SLOTS: |-
        3
      SYSTEM`FABRICATION-ARM`VALUE: |-
        3
      SYSTEM`FABRICATION-ARM`TEXT: |-
        This multi-purpose fabrication arm produces a resilient form of metallic oxide epoxy allowing specialised field repairs.
        {cost=2EP} Patch
        Turn Action // Range: Close
        You restore up to 6 Structure Points to any Mech in Range that has at least 1 SP.
        {cost=2EP} System Repair
        Short Action // Range: Close
        You repair a damaged Tech 1, 2, or 3 System or Module in Range to Intact Condition. It is now usable.
        {cost=4EP} Chassis Repair
        Long Action // Range: Close
        You repair a damaged Tech 1, 2, or 3 Mech Chassis or Vehicle in Range to Intact Condition. It is now usable with 1 SP.
      SYSTEM`EXECUTIVE-BODY-KIT: |-
        Executive Body Kit
      SYSTEM`EXECUTIVE-BODY-KIT`TECH: |-
        6
      SYSTEM`EXECUTIVE-BODY-KIT`SLOTS: |-
        3
      SYSTEM`EXECUTIVE-BODY-KIT`VALUE: |-
        3
      SYSTEM`EXECUTIVE-BODY-KIT`ACTION: |-
        passive
      SYSTEM`EXECUTIVE-BODY-KIT`TEXT: |-
        This System allows you to change the skin of your Mech to appear as though it is any other Tech 5 or 6 Mech or any executive corpo design of your choice. This allows them to meld seamlessly with other Mechs of a similar design.
      SYSTEM`CARGO-BAY: |-
        Cargo Bay
      SYSTEM`CARGO-BAY`TECH: |-
        2
      SYSTEM`CARGO-BAY`SLOTS: |-
        4
      SYSTEM`CARGO-BAY`VALUE: |-
        2
      SYSTEM`CARGO-BAY`ACTION: |-
        passive
      SYSTEM`CARGO-BAY`TEXT: |-
        The true staple System of the Union, used as much by our comrades who founded the Salvage Unions as we do today to haul loads across the wastes and back to the crawler. A Cargo Bay increases a Mech's Cargo Capacity by 10.
      SYSTEM`AMPHIBIOUS-LOCOMOTION-SYSTEM: |-
        Amphibious Locomotion System
      SYSTEM`AMPHIBIOUS-LOCOMOTION-SYSTEM`TECH: |-
        5
      SYSTEM`AMPHIBIOUS-LOCOMOTION-SYSTEM`SLOTS: |-
        5
      SYSTEM`AMPHIBIOUS-LOCOMOTION-SYSTEM`VALUE: |-
        3
      SYSTEM`AMPHIBIOUS-LOCOMOTION-SYSTEM`TRAITS: |-
        Amphibious
      SYSTEM`AMPHIBIOUS-LOCOMOTION-SYSTEM`ACTION: |-
        passive
      SYSTEM`AMPHIBIOUS-LOCOMOTION-SYSTEM`TEXT: |-
        Developed by Aegean Dynamics, this System allows your Mech to move on land and underwater. You may move underwater with ease, suffering no restrictions or penalties, and can operate in underwater conditions indefinitely at significant depths.
        Aegean Dynamics suffered a hostile takeover from Contour Dynamics and was forced to be their subsidiary, but there are rumours they have a hidden arco somewhere in the depths of the Oceanic Rim.
      SYSTEM`CARGO-POD: |-
        Cargo Pod
      SYSTEM`CARGO-POD`TECH: |-
        1
      SYSTEM`CARGO-POD`SLOTS: |-
        1
      SYSTEM`CARGO-POD`VALUE: |-
        1
      SYSTEM`CARGO-POD`ACTION: |-
        passive
      SYSTEM`CARGO-POD`TEXT: |-
        This small cargo pod allows you to squeeze that extra bit of storage space out of your Mech.
        A Cargo Pod increases the Cargo Capacity of a Mech by 1.
      SYSTEM`RIVETING-GUN: |-
        Riveting Gun
      SYSTEM`RIVETING-GUN`TECH: |-
        1
      SYSTEM`RIVETING-GUN`SLOTS: |-
        3
      SYSTEM`RIVETING-GUN`VALUE: |-
        4
      SYSTEM`RIVETING-GUN`TEXT: |-
        This mech-mountable riveting gun can be used to make field repairs to the most basic of Mechs, Systems, and Modules.
        {cost=2EP} Patch
        Range: Close // Turn Action
        You restore up to 4 Structure Points to any Mech in Range that has at least 1 SP.
        {cost=2EP} System Repair
        Range: Close // Short Action
        You repair a damaged Tech 1 System or Module in Range to Intact Condition. It is now usable.
        {cost=4EP} Chassis Repair
        Range: Close // Long Action
        You repair a damaged Tech 1 Mech Chassis or Vehicle in Range to Intact Condition. It is now usable with 1 SP.
      MODULE`ENCRYPTED-COMMS: |-
        Encrypted Comms
      MODULE`ENCRYPTED-COMMS`TECH: |-
        3
      MODULE`ENCRYPTED-COMMS`SLOTS: |-
        1
      MODULE`ENCRYPTED-COMMS`VALUE: |-
        2
      MODULE`ENCRYPTED-COMMS`ACTION: |-
        passive
      MODULE`ENCRYPTED-COMMS`TEXT: |-
        This Sakura Futures-developed comms add-on encrypts all of your outgoing and ingoing communications. Anything you have installed on your Mech with the Comms Trait becomes encrypted. This means any voice or text communications you send or receive cannot be listened to, tapped into, hacked, or analysed. Anything with the Hacking or Scanner Trait does not work on them.
      MODULE`MULTI-TARGETER: |-
        Multi-Targeter
      MODULE`MULTI-TARGETER`TECH: |-
        3
      MODULE`MULTI-TARGETER`SLOTS: |-
        1
      MODULE`MULTI-TARGETER`VALUE: |-
        3
      MODULE`MULTI-TARGETER`EP: |-
        X
      MODULE`MULTI-TARGETER`TRAITS: |-
        Targeter
      MODULE`MULTI-TARGETER`ACTION: |-
        turn
      MODULE`MULTI-TARGETER`TEXT: |-
        When activated, you may attack with any number of Weapons Systems mounted on your Mech. Each attack must have a different target, which you must choose before you make any attacks. Make and resolve each attack separately. This Ability costs 1 EP per weapon you attack with.
      MODULE`WEAPON-LINK: |-
        Weapon Link
      MODULE`WEAPON-LINK`TECH: |-
        1
      MODULE`WEAPON-LINK`SLOTS: |-
        1
      MODULE`WEAPON-LINK`VALUE: |-
        3
      MODULE`WEAPON-LINK`TRAITS: |-
        Hot (X)|Heat Spike
      MODULE`WEAPON-LINK`ACTION: |-
        turn
      MODULE`WEAPON-LINK`TEXT: |-
        A Weapons Link Module allows you to connect any number of identical Weapons Systems together. These must be the same Weapons System. For example: you may link two Green Lasers or three 30 mm Autocannons. Once you link weapons, this is permanent and they cannot be fired separately via any means until this Module is uninstalled.
        You make an attack with all weapons linked together with this Module against a single target in Range of your choice. Make and resolve each attack separately. You gain 1 Heat for each linked weapon you attack with and must make a Heat Check after the attacks have been resolved.
      MODULE`GOFLOW-PLANT-GROWING-SYSTEM: |-
        Goflow Plant Growing System
      MODULE`GOFLOW-PLANT-GROWING-SYSTEM`TECH: |-
        4
      MODULE`GOFLOW-PLANT-GROWING-SYSTEM`SLOTS: |-
        1
      MODULE`GOFLOW-PLANT-GROWING-SYSTEM`VALUE: |-
        2
      MODULE`GOFLOW-PLANT-GROWING-SYSTEM`TRAITS: |-
        Black Market
      MODULE`GOFLOW-PLANT-GROWING-SYSTEM`TEXT: |-
        With all known plant genomes corpo patented, the growing of any plant from a patented seed without permission or proof of purchase is considered intellectual theft and punishable by ten years of re-education.
        This particular plant growing System is designed to be installed in a Mech for transportation and use in the field. It provides the Pilot and their companion with a regular supply of (illegal) fresh fruit and vegetables.
      MODULE`IR-NIGHT-VISION-OPTICS: |-
        IR Night Vision Optics
      MODULE`IR-NIGHT-VISION-OPTICS`TECH: |-
        2
      MODULE`IR-NIGHT-VISION-OPTICS`SLOTS: |-
        1
      MODULE`IR-NIGHT-VISION-OPTICS`VALUE: |-
        2
      MODULE`IR-NIGHT-VISION-OPTICS`EP: |-
        1
      MODULE`IR-NIGHT-VISION-OPTICS`RANGE: |-
        far
      MODULE`IR-NIGHT-VISION-OPTICS`TRAITS: |-
        Optics
      MODULE`IR-NIGHT-VISION-OPTICS`ACTION: |-
        free
      MODULE`IR-NIGHT-VISION-OPTICS`TEXT: |-
        Developed by the old nations in the Great War and later patented by AMS Systems for use in mining operations, this infrared optical device allows you to see in darkness even on a moonless night.
        When activated, this specialised, green tinted optical array allows you to see in darkness from your Mech up to Far Range. This effect lasts for 1 hour.
      MODULE`ZOOM-OPTICS: |-
        Zoom Optics
      MODULE`ZOOM-OPTICS`TECH: |-
        1
      MODULE`ZOOM-OPTICS`SLOTS: |-
        1
      MODULE`ZOOM-OPTICS`VALUE: |-
        2
      MODULE`ZOOM-OPTICS`EP: |-
        1
      MODULE`ZOOM-OPTICS`TRAITS: |-
        Optics
      MODULE`ZOOM-OPTICS`ACTION: |-
        free
      MODULE`ZOOM-OPTICS`TEXT: |-
        When activated, this optical array extends the Range of any single Ranged Weapons System mounted on your Mech by one band, to a maximum of Long Range. For example, from Medium Range to Long Range or Close Range to Medium Range.
        It further allows you to zoom in and see one Range Band further than you currently are. For example, if you are in Medium Range, you can see a target as though it was in Close Range and pick out finer details about it.
        This effect lasts for 1 hour.
      MODULE`COOLANT-FLOW-MANIFOLD: |-
        Coolant Flow Manifold
      MODULE`COOLANT-FLOW-MANIFOLD`TECH: |-
        3
      MODULE`COOLANT-FLOW-MANIFOLD`SLOTS: |-
        1
      MODULE`COOLANT-FLOW-MANIFOLD`VALUE: |-
        2
      MODULE`COOLANT-FLOW-MANIFOLD`TEXT: |-
        This manifold provides more control over the coolant flowing through your reactor, allowing you to inject more coolant as required.
        {cost=2EP} Coolant Flow
        Free Action
        Adjusted valves provide coolant where required. Reduce the Heat of your Mech by 4.
        {cost=1EP} Coolant Flush
        Short Action
        The coolant system runs through a flush cycle. Reduce the Heat of your Mech to 0.
      MODULE`EGGS-MAYHEM: |-
        Eggs Mayhem
      MODULE`EGGS-MAYHEM`TECH: |-
        1
      MODULE`EGGS-MAYHEM`SLOTS: |-
        1
      MODULE`EGGS-MAYHEM`VALUE: |-
        3
      MODULE`EGGS-MAYHEM`EP: |-
        2
      MODULE`EGGS-MAYHEM`RANGE: |-
        medium
      MODULE`EGGS-MAYHEM`TRAITS: |-
        Hacking
      MODULE`EGGS-MAYHEM`ACTION: |-
        turn
      MODULE`EGGS-MAYHEM`TABLE: |-
        EGGS-MAYHEM
      MODULE`EGGS-MAYHEM`TEXT: |-
        This hacking program developed by Stefanus Industries allows you to tap into a Mech, database, or computer system to gather information about it. This can only be used to read data and not to write or manipulate it.
        When activated, choose a target Mech, database, or computer system within Range.
      MODULE`BAROMETRIC-SENSOR: |-
        Barometric Sensor
      MODULE`BAROMETRIC-SENSOR`TECH: |-
        2
      MODULE`BAROMETRIC-SENSOR`SLOTS: |-
        1
      MODULE`BAROMETRIC-SENSOR`VALUE: |-
        1
      MODULE`BAROMETRIC-SENSOR`TRAITS: |-
        Passive|Scanner
      MODULE`BAROMETRIC-SENSOR`TEXT: |-
        Developed by Kombu Tech to detect atmospheric conditions in the vast algae farms of The Great Cape, this Module can quite literally predict the weather.
        This device constantly measures and analyses air pressure, wind speed, temperature, and humidity. When entering an area you are able to get an up to date report on the weather of that area and any potential hazardous environmental conditions. In addition, the Module alerts you when a shift in weather patterns is occurring, giving you advance warning of severe weather such as radiation storms, acid rain, hail, hurricanes, and tornadoes. You also learn all potential negative effects of the current and predicted weather conditions, including mechanical effects.
      MODULE`REACTION-PROTOCOLS: |-
        Reaction Protocols
      MODULE`REACTION-PROTOCOLS`TECH: |-
        6
      MODULE`REACTION-PROTOCOLS`SLOTS: |-
        1
      MODULE`REACTION-PROTOCOLS`VALUE: |-
        2
      MODULE`REACTION-PROTOCOLS`EP: |-
        3
      MODULE`REACTION-PROTOCOLS`HOT: |-
        2
      MODULE`REACTION-PROTOCOLS`TRAITS: |-
        Heat Spike|Hot (2)
      MODULE`REACTION-PROTOCOLS`ACTION: |-
        reaction
      MODULE`REACTION-PROTOCOLS`TEXT: |-
        This salvager-honed Module can push your Mech to react at sudden and alarming speeds to opponents in the field.
        When activated, you may attack with any Weapons System or activate any System, Module, or Ability your Mech has access to as a Reaction. This Reaction always resolves first. After this has resolved, increase your Mech's Heat by 2 and make a Heat Check.
      MODULE`HULL-MAGNETISER: |-
        Hull Magnetiser
      MODULE`HULL-MAGNETISER`TECH: |-
        2
      MODULE`HULL-MAGNETISER`SLOTS: |-
        1
      MODULE`HULL-MAGNETISER`VALUE: |-
        2
      MODULE`HULL-MAGNETISER`EP: |-
        2
      MODULE`HULL-MAGNETISER`ACTION: |-
        turn
      MODULE`HULL-MAGNETISER`TEXT: |-
        A byproduct of Drontek anti-grav technology, the Hull Magnetiser has become much loved by salvagers who want to slap some extra scrap on their Chassis.
        When activated, the hull of your Mech becomes temporarily magnetised, drawing metallic objects towards it and allowing all manner of scrap and salvage to be easily carried. This increases your Mech's Cargo Capacity by its System Slot Value. For example, if you are in a Mule Mech with a System Slot Value of 15 you would increase your Cargo Capacity by 15. This effect lasts for 1 hour and can be deactivated any time as a Free Action.
        The Union unofficially encourages creative and unorthodox uses of the Hull Magnetiser.
      MODULE`HE2-COOLANT-FLUSH: |-
        He2 Coolant Flush
      MODULE`HE2-COOLANT-FLUSH`TECH: |-
        5
      MODULE`HE2-COOLANT-FLUSH`SLOTS: |-
        1
      MODULE`HE2-COOLANT-FLUSH`VALUE: |-
        2
      MODULE`HE2-COOLANT-FLUSH`ACTION: |-
        reaction
      MODULE`HE2-COOLANT-FLUSH`USES: |-
        3
      MODULE`HE2-COOLANT-FLUSH`TEXT: |-
        This Module rapidly flushes your Mech's Reactor with sub-zero liquid Helium coolant manufactured in the Opus Institute Labs in the Frozen Gulf.
        When activated, reduce the Heat on your Mech to 0.
      MODULE`MULTI-OPTICS: |-
        Multi-Optics
      MODULE`MULTI-OPTICS`TECH: |-
        5
      MODULE`MULTI-OPTICS`SLOTS: |-
        2
      MODULE`MULTI-OPTICS`VALUE: |-
        2
      MODULE`MULTI-OPTICS`TEXT: |-
        This Module combines Zoom Optics, Thermal Optics, and IR Night Vision Optics, into one. You gain the use of all three and may activate each separately.
      MODULE`M315-MOTION-SCANNER: |-
        M315 Motion Scanner
      MODULE`M315-MOTION-SCANNER`TECH: |-
        2
      MODULE`M315-MOTION-SCANNER`SLOTS: |-
        1
      MODULE`M315-MOTION-SCANNER`VALUE: |-
        2
      MODULE`M315-MOTION-SCANNER`EP: |-
        1
      MODULE`M315-MOTION-SCANNER`RANGE: |-
        medium
      MODULE`M315-MOTION-SCANNER`TRAITS: |-
        Scanner
      MODULE`M315-MOTION-SCANNER`ACTION: |-
        turn
      MODULE`M315-MOTION-SCANNER`TEXT: |-
        Developed by Sakura Futures to aid in target acquisition, after a classified incident at a mining colony. This scanner is able to detect movement within an area via a high-powered ultrasound scanner.
        When activated, you scan a point within the area map or a specific area of interest such as a ruined building, bunker, or dense area of foliage for any signs of movement.
        You detect if anything is moving in the area, the number of separate things that are moving, and whether they are People or Mech-sized.
      MODULE`COMMS-TAPPER: |-
        Comms Tapper
      MODULE`COMMS-TAPPER`TECH: |-
        3
      MODULE`COMMS-TAPPER`SLOTS: |-
        1
      MODULE`COMMS-TAPPER`VALUE: |-
        2
      MODULE`COMMS-TAPPER`EP: |-
        2
      MODULE`COMMS-TAPPER`RANGE: |-
        long
      MODULE`COMMS-TAPPER`TRAITS: |-
        Hacking
      MODULE`COMMS-TAPPER`ACTION: |-
        turn
      MODULE`COMMS-TAPPER`TEXT: |-
        This Stefanus-patented hacking unit allows you to tap into other communication units and listen to them. You may target anything with the Communicator Trait in Range and listen in on it for 10 minutes, hearing all inbound and outbound comms traffic.
      MODULE`MECH-SCRAMBLER: |-
        Mech Scrambler
      MODULE`MECH-SCRAMBLER`TECH: |-
        4
      MODULE`MECH-SCRAMBLER`SLOTS: |-
        1
      MODULE`MECH-SCRAMBLER`VALUE: |-
        2
      MODULE`MECH-SCRAMBLER`EP: |-
        X
      MODULE`MECH-SCRAMBLER`RANGE: |-
        close
      MODULE`MECH-SCRAMBLER`ACTION: |-
        turn
      MODULE`MECH-SCRAMBLER`TABLE: |-
        MECH-SCRAMBLER
      MODULE`MECH-SCRAMBLER`TEXT: |-
        This Stefanus-built hacking Module scrambles multiple Mechs causing them to go haywire and perform random actions. When activated, choose up to 4 target Mechs in Range. This Ability costs 2 EP for each Mech you target with this Ability. Make a separate roll for each target.
      MODULE`OFFENSIVE-PROTOCOLS: |-
        Offensive Protocols
      MODULE`OFFENSIVE-PROTOCOLS`TECH: |-
        3
      MODULE`OFFENSIVE-PROTOCOLS`SLOTS: |-
        1
      MODULE`OFFENSIVE-PROTOCOLS`VALUE: |-
        2
      MODULE`OFFENSIVE-PROTOCOLS`HOT: |-
        2
      MODULE`OFFENSIVE-PROTOCOLS`TRAITS: |-
        Heat Spike|Hot (2)
      MODULE`OFFENSIVE-PROTOCOLS`ACTION: |-
        free
      MODULE`OFFENSIVE-PROTOCOLS`TEXT: |-
        Designed by salvager engineers, this module pushes your reactor to reroute energy towards your Weapons Systems, increasing their potency.
        When you activate this Module, choose a Weapons System mounted on your Mech. The next time you make an attack with this Weapons System, it deals an additional amount of SP damage equal to its Tech Level. For example, a Tech 3 Missile Pod System would deal 3 SP additional damage.
        When activated, your Mech gains 2 Heat and must make a Heat Check. You may activate this Ability on multiple different Weapons Systems on the same turn, but cannot apply it to the same Weapons System more than once.
      MODULE`EMERGENCY-POWER-CONDUIT: |-
        Emergency Power Conduit
      MODULE`EMERGENCY-POWER-CONDUIT`TECH: |-
        3
      MODULE`EMERGENCY-POWER-CONDUIT`SLOTS: |-
        2
      MODULE`EMERGENCY-POWER-CONDUIT`VALUE: |-
        3
      MODULE`EMERGENCY-POWER-CONDUIT`ACTION: |-
        passive
      MODULE`EMERGENCY-POWER-CONDUIT`TEXT: |-
        In the event that your Mech is shutdown, this Module can reroute reactor power to keep basic functions active.
        If your Mech is shut down, either voluntarily or involuntarily, the Emergency Power Conduit activates automatically. Whilst the Emergency Power Conduit is active your Mech can move and your Pilot is protected internally via any life support systems. It also does not have the Vulnerable Trait.
        However, your Mech cannot attack or activate any Systems, Modules, or Abilities whilst the Emergency Power Conduit is active, and its Heat will not reduce as it would if it were fully shutdown.
      MODULE`LASER-GUIDANCE: |-
        Laser Guidance
      MODULE`LASER-GUIDANCE`TECH: |-
        4
      MODULE`LASER-GUIDANCE`SLOTS: |-
        1
      MODULE`LASER-GUIDANCE`VALUE: |-
        2
      MODULE`LASER-GUIDANCE`EP: |-
        3
      MODULE`LASER-GUIDANCE`RANGE: |-
        long
      MODULE`LASER-GUIDANCE`TRAITS: |-
        Targeter
      MODULE`LASER-GUIDANCE`ACTION: |-
        free
      MODULE`LASER-GUIDANCE`TEXT: |-
        Developed by Contour Aerospace for use in high speed engagements, this Module allows laser guided computational precision. When you activate this Module, pick a target within Range. The next attack you make against that target automatically hits counting as an (11-19) result.
      MODULE`AUTO-REPAIR-DROID: |-
        Auto-Repair Droid
      MODULE`AUTO-REPAIR-DROID`TECH: |-
        4
      MODULE`AUTO-REPAIR-DROID`SLOTS: |-
        2
      MODULE`AUTO-REPAIR-DROID`VALUE: |-
        3
      MODULE`AUTO-REPAIR-DROID`EP: |-
        2
      MODULE`AUTO-REPAIR-DROID`ACTION: |-
        turn
      MODULE`AUTO-REPAIR-DROID`TEXT: |-
        This compact repair droid with a rudimentary A.I. is hardwired into your Mech and can perform a variety of repair tasks on it whilst you focus on piloting. Roll on the A.I. Personality Table for your Repair-Droid's personality or choose your own.
        When you activate the Auto-Repair Droid, and at the start of each of your turns whilst it remains active, you may choose from one of the following options. You must pay the EP cost each time you choose an option and this counts as a Free Action. The Auto-Repair Droid remains active for 10 minutes.
        - You restore 6 SP to your Mech as long as it has at least 1 SP.
        - You repair a single, Tech 4 or lower, damaged System or Module mounted on your Mech to Intact Condition.
        - You reduce the Heat of your Mech by 2.
      MODULE`ALPHA-STRIKE-MODULE: |-
        Alpha Strike Module
      MODULE`ALPHA-STRIKE-MODULE`TECH: |-
        4
      MODULE`ALPHA-STRIKE-MODULE`SLOTS: |-
        1
      MODULE`ALPHA-STRIKE-MODULE`VALUE: |-
        2
      MODULE`ALPHA-STRIKE-MODULE`EP: |-
        X
      MODULE`ALPHA-STRIKE-MODULE`TRAITS: |-
        Hot (X)|Targeter
      MODULE`ALPHA-STRIKE-MODULE`ACTION: |-
        turn
      MODULE`ALPHA-STRIKE-MODULE`TEXT: |-
        A favourite in the Osiris fighting pits for its spectacle if nothing else.
        When activated, you must attack with all mounted Weapons Systems on your Mech against any number of targets of your choice within Range. Make and resolve each attack separately. Activating this Module costs an amount of EP equal to the number of Weapon Systems you attacked with and you gain an amount of Heat equal to the amount of Weapons Systems you attacked with.
      MODULE`SLEEPING-BEAUTY: |-
        Sleeping Beauty
      MODULE`SLEEPING-BEAUTY`TECH: |-
        2
      MODULE`SLEEPING-BEAUTY`SLOTS: |-
        1
      MODULE`SLEEPING-BEAUTY`VALUE: |-
        2
      MODULE`SLEEPING-BEAUTY`EP: |-
        2
      MODULE`SLEEPING-BEAUTY`ACTION: |-
        reaction
      MODULE`SLEEPING-BEAUTY`TEXT: |-
        Developed by salvager hackers during the Reclamation as a means to hide from or lay ambushes on corpo patrols by circumventing their scanning systems.
        When activated, you and all allied Mechs within Close Range go into a feigned reactor shutdown. The Mechs are operational, but appear as though they are shutdown to sensors. Anything with the Scanner, Targeter, or Hacking Trait cannot be used against them. The Mechs can move, but if they activate any Systems, Modules, Abilities, or attack, they become active again and this effect ceases.
      MODULE`ADVANCED-WEAPON-LINK: |-
        Advanced Weapon Link
      MODULE`ADVANCED-WEAPON-LINK`TECH: |-
        3
      MODULE`ADVANCED-WEAPON-LINK`SLOTS: |-
        2
      MODULE`ADVANCED-WEAPON-LINK`VALUE: |-
        3
      MODULE`ADVANCED-WEAPON-LINK`TRAITS: |-
        Heat Spike|Hot (X)
      MODULE`ADVANCED-WEAPON-LINK`ACTION: |-
        turn
      MODULE`ADVANCED-WEAPON-LINK`TEXT: |-
        An Advanced Weapons Link Module allows you to connect any number of different Weapons Systems together. For example, you may link a Green Laser, a 30mm Autocannon, and a Red Laser. Once you link weapons this is permanent and they cannot be fired separately via any means until you uninstall this Module.
        You make an attack with all weapons linked together with this Module against a single target in Range of all linked weapons. Make and resolve each attack separately. You gain 1 Heat for each linked weapon you attack with and must make a Heat Check after the attacks have been resolved.
      MODULE`WEAPON-GUIDANCE: |-
        Weapon Guidance
      MODULE`WEAPON-GUIDANCE`TECH: |-
        4
      MODULE`WEAPON-GUIDANCE`SLOTS: |-
        1
      MODULE`WEAPON-GUIDANCE`VALUE: |-
        1
      MODULE`WEAPON-GUIDANCE`EP: |-
        1
      MODULE`WEAPON-GUIDANCE`TRAITS: |-
        Targeter|Guided
      MODULE`WEAPON-GUIDANCE`ACTION: |-
        free
      MODULE`WEAPON-GUIDANCE`TEXT: |-
        This Aegean Dynamics-developed Module allows you to track targets even without visual confirmation from your Mech's heads-up display.
        When activated, a Weapons System of your choice mounted on your Mech gains the Guided Trait meaning it does not need line of sight to hit any target within its Range.
      MODULE`ADVANCED-REACTOR-SAFETY-PROTOC: |-
        Advanced Reactor Safety Protocols
      MODULE`ADVANCED-REACTOR-SAFETY-PROTOC`TECH: |-
        4
      MODULE`ADVANCED-REACTOR-SAFETY-PROTOC`SLOTS: |-
        2
      MODULE`ADVANCED-REACTOR-SAFETY-PROTOC`VALUE: |-
        2
      MODULE`ADVANCED-REACTOR-SAFETY-PROTOC`ACTION: |-
        passive
      MODULE`ADVANCED-REACTOR-SAFETY-PROTOC`TABLE: |-
        ADVANCED-REACTOR-SAFETY-PROTOC
      MODULE`ADVANCED-REACTOR-SAFETY-PROTOC`TEXT: |-
        These advanced safety protocols are hyper efficient at keeping your reactor and core systems functional even in high stress situations that would otherwise result in a total reactor meltdown.
        When your Mech rolls on the Reactor Overload Table you may roll on this table instead.
      MODULE`FIREWALL: |-
        Firewall
      MODULE`FIREWALL`TECH: |-
        1
      MODULE`FIREWALL`SLOTS: |-
        1
      MODULE`FIREWALL`VALUE: |-
        2
      MODULE`FIREWALL`EP: |-
        2
      MODULE`FIREWALL`RANGE: |-
        medium
      MODULE`FIREWALL`TRAITS: |-
        Hacking
      MODULE`FIREWALL`ACTION: |-
        reaction
      MODULE`FIREWALL`TABLE: |-
        FIREWALL
      MODULE`FIREWALL`TEXT: |-
        This firewall Module, made open source by the Opus Institute, is designed to prevent hacking.
        If you or an Ally in Range are the target of any System, Module, or Ability with the Hacking Trait you may attempt to block the hack with your Firewall as a Reaction.
      MODULE`PROJECTION-ARRAY: |-
        Projection Array
      MODULE`PROJECTION-ARRAY`TECH: |-
        2
      MODULE`PROJECTION-ARRAY`SLOTS: |-
        1
      MODULE`PROJECTION-ARRAY`VALUE: |-
        1
      MODULE`PROJECTION-ARRAY`EP: |-
        1
      MODULE`PROJECTION-ARRAY`RANGE: |-
        long
      MODULE`PROJECTION-ARRAY`ACTION: |-
        turn
      MODULE`PROJECTION-ARRAY`TEXT: |-
        This Module projects a video or series of images of your choice onto a surface of your choice within Range. It utilises mini discs for viewing videos. The projection expands upon the surface and can cover a large area. In addition, any sound from the video recording plays from your Mech.
      MODULE`EQUIPMENT-LOCKER: |-
        Equipment Locker
      MODULE`EQUIPMENT-LOCKER`TECH: |-
        1
      MODULE`EQUIPMENT-LOCKER`SLOTS: |-
        1
      MODULE`EQUIPMENT-LOCKER`VALUE: |-
        1
      MODULE`EQUIPMENT-LOCKER`ACTION: |-
        passive
      MODULE`EQUIPMENT-LOCKER`TEXT: |-
        This Module is installed directly into your Mech's Cockpit and allows storage of up to 10 pieces of Pilot Equipment within it, allowing easy access when in the field.
      MODULE`CORRUPTED-NEURALINK-MODULE: |-
        Corrupted Neuralink Module
      MODULE`CORRUPTED-NEURALINK-MODULE`TECH: |-
        5
      MODULE`CORRUPTED-NEURALINK-MODULE`SLOTS: |-
        1
      MODULE`CORRUPTED-NEURALINK-MODULE`VALUE: |-
        21
      MODULE`CORRUPTED-NEURALINK-MODULE`TRAITS: |-
        Black Market
      MODULE`CORRUPTED-NEURALINK-MODULE`TEXT: |-
        This thin array of harmless looking mesh is effectively identical to neuralinks found in certain Mechs that allow for one-to-one Pilot to Mech interfacing. It happens to be one of the most grievous torture devices ever invented and it does not leave a mark. When hooked up to a Pilot via a Mech, it can simulate pain beyond their imagination.
      MODULE`AARDVARKS-TONGUE: |-
        Aardvarks Tongue
      MODULE`AARDVARKS-TONGUE`TECH: |-
        4
      MODULE`AARDVARKS-TONGUE`SLOTS: |-
        1
      MODULE`AARDVARKS-TONGUE`VALUE: |-
        2
      MODULE`AARDVARKS-TONGUE`EP: |-
        4
      MODULE`AARDVARKS-TONGUE`RANGE: |-
        close
      MODULE`AARDVARKS-TONGUE`TRAITS: |-
        Hacking
      MODULE`AARDVARKS-TONGUE`ACTION: |-
        turn
      MODULE`AARDVARKS-TONGUE`TABLE: |-
        AARDVARKS-TONGUE
      MODULE`AARDVARKS-TONGUE`TEXT: |-
        Union designed hacking module that immobilises target mechs. It then attempts to jump to another mech in range. When activated roll on the following table:
      MODULE`METAL-DETECTOR: |-
        Metal Detector
      MODULE`METAL-DETECTOR`TECH: |-
        2
      MODULE`METAL-DETECTOR`SLOTS: |-
        1
      MODULE`METAL-DETECTOR`VALUE: |-
        2
      MODULE`METAL-DETECTOR`HOT: |-
        2
      MODULE`METAL-DETECTOR`TRAITS: |-
        Heat Spike|Hot (2)
      MODULE`METAL-DETECTOR`ACTION: |-
        reaction
      MODULE`METAL-DETECTOR`TEXT: |-
        A favourite of salvage teams across the globe, this Mech-mountable scanner lets you know when any Scrap is nearby.
        Auto-Scan
        Passive
        This automated function passively alerts you when you move into an area that can be salvaged. In addition, whenever you move from one area of the map to an location you have not yet visited, roll the die, on the result of a 20 you gain once piece of scrap of the Tech Level of the area as decided by the Mediator. By default this is the Tech Level of your Union Crawler.
        {cost=2EP} Active Scan
        Short Action // Range: Medium // Scanner
        In addition, when activated for its EP cost, this Module scans an area within Range. This reveals any Scrap, Systems, Chassis, or Modules, or Area Salvage points in the location as well as any buried or hidden metallic threats such as mines or Mechs waiting in ambush.
      MODULE`REACTOR-TRANSFERENCE: |-
        Reactor Transference
      MODULE`REACTOR-TRANSFERENCE`TECH: |-
        6
      MODULE`REACTOR-TRANSFERENCE`SLOTS: |-
        2
      MODULE`REACTOR-TRANSFERENCE`VALUE: |-
        2
      MODULE`REACTOR-TRANSFERENCE`ACTION: |-
        passive
      MODULE`REACTOR-TRANSFERENCE`TEXT: |-
        This Aeon-developed Module allows interchange between your Mech's Heat and Energy. This module allows your Mech to activate Energy Point Abilities by increasing its Heat by 2x that amount instead. For example: you could activate a 2 EP Ability by instead increasing your Mech's Heat by 4.
        Anytime you would increase your Mech's Heat you may instead decrease your Mech's Energy Points by that amount. For example: if you attacked with a Hot (2) weapon you could spend 2 EP instead of increasing your Mech's Heat by 2.
      MODULE`ENERGY-CELL: |-
        Energy Cell
      MODULE`ENERGY-CELL`TECH: |-
        2
      MODULE`ENERGY-CELL`SLOTS: |-
        1
      MODULE`ENERGY-CELL`VALUE: |-
        2
      MODULE`ENERGY-CELL`ACTION: |-
        reaction
      MODULE`ENERGY-CELL`TEXT: |-
        For when you need that extra boost of energy on a long haul. This nuclear powered conduit can be drained of energy to provide your Mech's reactor with a temporary boost. When activated, your Mech regains 3 EP and the Energy Cell Module is destroyed.
      MODULE`MRSI-CO-ORDINATOR: |-
        MRSI Co-Ordinator
      MODULE`MRSI-CO-ORDINATOR`TECH: |-
        4
      MODULE`MRSI-CO-ORDINATOR`SLOTS: |-
        1
      MODULE`MRSI-CO-ORDINATOR`VALUE: |-
        2
      MODULE`MRSI-CO-ORDINATOR`EP: |-
        4
      MODULE`MRSI-CO-ORDINATOR`RANGE: |-
        medium
      MODULE`MRSI-CO-ORDINATOR`TRAITS: |-
        Targeter
      MODULE`MRSI-CO-ORDINATOR`ACTION: |-
        turn
      MODULE`MRSI-CO-ORDINATOR`TEXT: |-
        Multiple Rounds, Simultaneous Impact. This Contour Aerospace-developed Module aims a focussed beam at a target which tracks their movement and coordinates and transmits it to other Allies, allowing you to coordinate attacks against them.
        When activated, choose a target within Range. You and up to 2 Allied Mechs in Range may attack the target immediately with a single Weapons System of their choice in Range of the target. Make each attack separately.
      MODULE`AUTO-DOCTOR: |-
        Auto-Doctor
      MODULE`AUTO-DOCTOR`TECH: |-
        3
      MODULE`AUTO-DOCTOR`SLOTS: |-
        2
      MODULE`AUTO-DOCTOR`VALUE: |-
        4
      MODULE`AUTO-DOCTOR`TEXT: |-
        The Auto-Doctor is a medical droid with a rudimentary A.I. that can heal a Pilot in the field via a complex array of mechanical surgery arms. The Auto-Doctor is immobile and is installed internally within your Mech. Roll on the A.I. Personality Table for your Auto-Doctor personality or choose your own.
        {cost=2EP} Heal
        Short Action // Range: Close
        The Auto-Doctor heals a creature within Range up to 10 HP. If they were on 0 HP this restores them to consciousness and heals them 10 HP.
        {cost=2EP} Physio
        Short Action // Range: Close
        The Auto-Doctor heals a creature within Range of a single Minor Injury.
        {cost=2EP} Therapy
        Short Action // Range: Close
        The Auto-Doctor engages its therapeutic and drinks dispensation protocols. A single People who talks through things with the Auto-Doctor feels a lot better about themselves, their life, and the situation they are in. (The drinks dispensation protocol does not include alcohol, but the tea is surprisingly passable.)
        {cost=2EP} First Aid
        Free Action // Range: Close
        The Auto-Doctor heals a creature within Range of up to 4 HP. If they were on 0 HP this restores them to consciousness and heals them 4 HP.
      MODULE`ECM-TRANSMITTER: |-
        ECM Transmitter
      MODULE`ECM-TRANSMITTER`TECH: |-
        3
      MODULE`ECM-TRANSMITTER`SLOTS: |-
        1
      MODULE`ECM-TRANSMITTER`VALUE: |-
        3
      MODULE`ECM-TRANSMITTER`EP: |-
        3
      MODULE`ECM-TRANSMITTER`RANGE: |-
        long
      MODULE`ECM-TRANSMITTER`ACTION: |-
        turn
      MODULE`ECM-TRANSMITTER`TEXT: |-
        This Electronic Countermeasure device developed by Stefanus nullifies electronics within a radius, preventing them from being used temporarily, jamming comms, shields, and nullifying Targeters and hacking attempts.
        When activated, all enemy Pilots, Mechs, and Vehicles within Range cannot activate or use any Pilot Equipment, Systems, Modules, or Abilities that have the Targeter, Hacking, Shield or Communicator Trait. This effect lasts for 10 minutes.
      MODULE`NAVIGATION-MODULE: |-
        Navigation Module
      MODULE`NAVIGATION-MODULE`TECH: |-
        2
      MODULE`NAVIGATION-MODULE`SLOTS: |-
        1
      MODULE`NAVIGATION-MODULE`VALUE: |-
        2
      MODULE`NAVIGATION-MODULE`EP: |-
        1
      MODULE`NAVIGATION-MODULE`RANGE: |-
        medium
      MODULE`NAVIGATION-MODULE`TRAITS: |-
        Scanner
      MODULE`NAVIGATION-MODULE`ACTION: |-
        turn
      MODULE`NAVIGATION-MODULE`TEXT: |-
        This AMS Systems-developed Module is able to provide you with specific navigation data, including specified routes and locations in the wastes, via an internal tracking system and soothing electronic voice.
        When you activate this Module you are able to plot a safe course for you and your Allies to either a known location within the Region Map you are in or one of the following locations in the wasteland. The Mediator tells you the location and what the safest route possible to it is, informing you of any potential dangers on the path as well.
        Watering Hole: You find a safe, sheltered spot where there is also a small amount of nourishment available.
        Settlement: You find a settlement within the wasteland that may be able to offer you aid.
        Salvage Spot: You find an area salvaging spot such as a factory, old ruins, or abandoned caravan
        Encampment: You find an encampment of some kind, this could be a raider base, a corpo forward outpost, or a den of animals.
        *For their safety and mental well-being, Salvage Unions do not condone the changing of the Navigation Module's soothing electronic voice to anything that would irritate, upset, or enrage their Pilots. However funny it might seem at the time.*
      MODULE`REACTOR-OVERLOAD: |-
        Reactor Overload
      MODULE`REACTOR-OVERLOAD`TECH: |-
        2
      MODULE`REACTOR-OVERLOAD`SLOTS: |-
        1
      MODULE`REACTOR-OVERLOAD`VALUE: |-
        3
      MODULE`REACTOR-OVERLOAD`EP: |-
        2
      MODULE`REACTOR-OVERLOAD`RANGE: |-
        medium
      MODULE`REACTOR-OVERLOAD`TRAITS: |-
        Hacking
      MODULE`REACTOR-OVERLOAD`ACTION: |-
        turn
      MODULE`REACTOR-OVERLOAD`TEXT: |-
        A simple brute force reactor hack developed by Stefanus that sends multiple false heat signals to a Mech triggering an overload response. When you activate this Module, a target Mech in Range must roll on the Reactor Overload Table.
      MODULE`EM-SELF-DESTRUCT: |-
        EM Self-Destruct
      MODULE`EM-SELF-DESTRUCT`TECH: |-
        4
      MODULE`EM-SELF-DESTRUCT`SLOTS: |-
        1
      MODULE`EM-SELF-DESTRUCT`VALUE: |-
        2
      MODULE`EM-SELF-DESTRUCT`ACTION: |-
        reaction
      MODULE`EM-SELF-DESTRUCT`TEXT: |-
        Developed by Stefanus during the cyberwars, the Electro-Magnetic Self-Destruct was intended to shutdown the mass waves of suicidal drone attacks that their rivals Drontek were endlessly using to harry their nanite mining bases. It meant one Mech sacrificing itself so the rest could live.
        When activated, your Mech as well as all attached Systems, Modules, and all carried Cargo are destroyed as the reactor detonates in an electro-magnetic explosion. Your Pilot may attempt to escape as normal if they have access to anything with the Escape Trait. If they fail to escape, they are reduced to 0 HP.
        All Mechs, Systems, Modules, and Vehicles including allies within Medium Range of your Mech become shutdown and inactive for 10 minutes. In addition, any other electronic or technological equipment or hardware within Range becomes inoperable. Meld are also affected, going into an inert state for 10 minutes. This module may only be mounted on a Mech.
      MODULE`HACKING-REPEATER-NODE: |-
        Hacking Repeater Node
      MODULE`HACKING-REPEATER-NODE`TECH: |-
        3
      MODULE`HACKING-REPEATER-NODE`SLOTS: |-
        1
      MODULE`HACKING-REPEATER-NODE`VALUE: |-
        2
      MODULE`HACKING-REPEATER-NODE`EP: |-
        1
      MODULE`HACKING-REPEATER-NODE`RANGE: |-
        long
      MODULE`HACKING-REPEATER-NODE`TRAITS: |-
        Hacking
      MODULE`HACKING-REPEATER-NODE`ACTION: |-
        free
      MODULE`HACKING-REPEATER-NODE`TEXT: |-
        Developed by Stefanus as a means to extend the radius of their hacking zones during the cyberwars.
        When activated, your Mech acts as a range extender to various electronic devices. Any Ally within Long Range of you may use any System, Module, or Ability with the Communicator, Hacking, Scanner, or Optics Trait as though it originated from your Mech.
        This effect lasts for 1 hour.
      MODULE`CONCEALED-LOCKER: |-
        Concealed Locker
      MODULE`CONCEALED-LOCKER`TECH: |-
        3
      MODULE`CONCEALED-LOCKER`SLOTS: |-
        2
      MODULE`CONCEALED-LOCKER`VALUE: |-
        3
      MODULE`CONCEALED-LOCKER`ACTION: |-
        passive
      MODULE`CONCEALED-LOCKER`TEXT: |-
        This equipment locker can carry up to 6 pieces of Pilot Equipment in your Mech Cockpit for easy access. Any Pilot Equipment stored in this locker cannot be found via inspection, or be seen or affected by anything with the Scanner, Hacking, or Targeter Trait. The enigmatic smuggler simply known as 'Mx' was said to have transported Active Meld Nanites through multiple Stefanus checkpoints and safe zones using one of these.
      MODULE`MATTER-PHASER: |-
        Matter Phaser
      MODULE`MATTER-PHASER`TECH: |-
        6
      MODULE`MATTER-PHASER`SLOTS: |-
        2
      MODULE`MATTER-PHASER`VALUE: |-
        3
      MODULE`MATTER-PHASER`EP: |-
        4
      MODULE`MATTER-PHASER`ACTION: |-
        turn
      MODULE`MATTER-PHASER`TEXT: |-
        Developed by Sakura Futures as the apex of their assasination capabilities, this Module allows your Mech to temporarily enter an anti-matter phase state. The tech blueprints were stolen by a hacker known as Case, and are now in the arsenal of the most powerful Union Crawlers in the wastes.
        When activated, your Mech becomes phased. Whilst in a phased state your Mech can move through walls, objects, structures, and other Mechs. Your Mech is visible, but only by a faint glowing outline. You cannot attack or otherwise interact with anything whilst phased. You can unphase as a Free Action at no cost.
      MODULE`DEEP-SURVEY-SCANNER: |-
        Deep Survey Scanner
      MODULE`DEEP-SURVEY-SCANNER`TECH: |-
        2
      MODULE`DEEP-SURVEY-SCANNER`SLOTS: |-
        1
      MODULE`DEEP-SURVEY-SCANNER`VALUE: |-
        2
      MODULE`DEEP-SURVEY-SCANNER`EP: |-
        2
      MODULE`DEEP-SURVEY-SCANNER`RANGE: |-
        long
      MODULE`DEEP-SURVEY-SCANNER`TRAITS: |-
        Scanner
      MODULE`DEEP-SURVEY-SCANNER`ACTION: |-
        short
      MODULE`DEEP-SURVEY-SCANNER`TEXT: |-
        A scanner designed by Thatcher Steel to analyse underground areas prior to mining excavations.
        When activated, you scan a point within Range to detect the presence of any underground structures, cave networks, ruins, or bases. This can be a specific terrain feature or location such as a mountain range, military complex, settlement, or area in the landscape. If a point is not worth scanning because it holds nothing of interest, the Mediator must tell you before you make your scan.
        The scan returns a basic datamap of the underground area, including its size as well as the first three main sections as well as any passageways between those sections. The Mediator will draw you a rudimentary map noting any major features such as bridges, columns, or crevasses, and lets you know if the area can fit Mechs or Pilots.
      MODULE`DASH-PROTOCOLS: |-
        Dash Protocols
      MODULE`DASH-PROTOCOLS`TECH: |-
        4
      MODULE`DASH-PROTOCOLS`SLOTS: |-
        1
      MODULE`DASH-PROTOCOLS`VALUE: |-
        1
      MODULE`DASH-PROTOCOLS`HOT: |-
        2
      MODULE`DASH-PROTOCOLS`TRAITS: |-
        Heat Spike|Hot (2)
      MODULE`DASH-PROTOCOLS`ACTION: |-
        free
      MODULE`DASH-PROTOCOLS`TEXT: |-
        This salvager-designed Module reroutes your Mech's power to vastly increase the potential of its locomotive Systems.
        When activated, your Mech may move an additional Range Band this turn. Your Mech gains 2 Heat and must make a Heat Check. You may only activate this Module once per turn.
      MODULE`PANDA-SNEEZE: |-
        Panda Sneeze
      MODULE`PANDA-SNEEZE`TECH: |-
        3
      MODULE`PANDA-SNEEZE`SLOTS: |-
        1
      MODULE`PANDA-SNEEZE`VALUE: |-
        2
      MODULE`PANDA-SNEEZE`EP: |-
        2
      MODULE`PANDA-SNEEZE`RANGE: |-
        medium
      MODULE`PANDA-SNEEZE`TRAITS: |-
        Hacking
      MODULE`PANDA-SNEEZE`ACTION: |-
        turn
      MODULE`PANDA-SNEEZE`TABLE: |-
        PANDA-SNEEZE
      MODULE`PANDA-SNEEZE`TEXT: |-
        This Stefanus developed hacking program allows you to hack into a Mech, database, or computer system and manipulate data within it. When activated, choose a target Mech, database, or computer system within Range.
      MODULE`NEURALINK-COMMUNICATOR: |-
        Neuralink Communicator
      MODULE`NEURALINK-COMMUNICATOR`TECH: |-
        5
      MODULE`NEURALINK-COMMUNICATOR`SLOTS: |-
        2
      MODULE`NEURALINK-COMMUNICATOR`VALUE: |-
        3
      MODULE`NEURALINK-COMMUNICATOR`RANGE: |-
        long
      MODULE`NEURALINK-COMMUNICATOR`TRAITS: |-
        Communicator
      MODULE`NEURALINK-COMMUNICATOR`ACTION: |-
        free
      MODULE`NEURALINK-COMMUNICATOR`TEXT: |-
        Developed by Ascension PLC, this Module connects directly to your Pilot's brain whilst in the Cockpit, and allows telepathic communication with anything that has the Communicator Trait within Range. In addition, you may choose what the output of your brain frequencies sounds like, altering the pitch and tone to your liking. This works as a Voice Modulator. These communications are also encrypted, working as an Encrypted Comms. The Neuralink Communicator may also be detached and used by your Pilot in the field as a Portable Communications Unit.
      MODULE`OMEGA-PUSH-MODULE: |-
        Omega Push Module
      MODULE`OMEGA-PUSH-MODULE`TECH: |-
        5
      MODULE`OMEGA-PUSH-MODULE`SLOTS: |-
        2
      MODULE`OMEGA-PUSH-MODULE`VALUE: |-
        2
      MODULE`OMEGA-PUSH-MODULE`TEXT: |-
        This Module combines Evasion Protocols, Offensive Protocols, and Dash Protocols, into one Module. You may activate each separately as desired.
      MODULE`REACTOR-FLARE: |-
        Reactor Flare
      MODULE`REACTOR-FLARE`TECH: |-
        1
      MODULE`REACTOR-FLARE`SLOTS: |-
        1
      MODULE`REACTOR-FLARE`VALUE: |-
        1
      MODULE`REACTOR-FLARE`EP: |-
        1
      MODULE`REACTOR-FLARE`RANGE: |-
        long
      MODULE`REACTOR-FLARE`ACTION: |-
        turn
      MODULE`REACTOR-FLARE`TEXT: |-
        An open source Opus Institute blueprint, this Module is frequently used by emergency or rescue services.
        The Opus Institute developed it for use in the long winters where their headquarters are located; due to the pitch dark environments and constant threat of snowstorms and avalanches.
        When activated, this Module fires a reactor-fuelled flare to any point within Range. The flare is clearly visible up to anywhere within Far Range as well as anyone in any adjacent area to you on the Region Map. The flare burns enough to provide illumination nearly equal to that of daylight. The flare lasts for an hour before dissipating.
      MODULE`VIDEO-RECORDING-ARRAY: |-
        Video Recording Array
      MODULE`VIDEO-RECORDING-ARRAY`TECH: |-
        2
      MODULE`VIDEO-RECORDING-ARRAY`SLOTS: |-
        1
      MODULE`VIDEO-RECORDING-ARRAY`VALUE: |-
        1
      MODULE`VIDEO-RECORDING-ARRAY`EP: |-
        1
      MODULE`VIDEO-RECORDING-ARRAY`RANGE: |-
        far
      MODULE`VIDEO-RECORDING-ARRAY`ACTION: |-
        turn
      MODULE`VIDEO-RECORDING-ARRAY`TEXT: |-
        This Module records a video from your Mech along with any sound. The device mounts onto the front of your Mech and records anything ahead of it within Range. If you can see it from your Mech's cockpit, this device records it. It also records any sounds within Range in any direction. When activated, the video begins to record and automatically stops after one hour. The video is saved on a mini disc for watching later and can be kept as a Keepsake.
      MODULE`EVASION-PROTOCOLS: |-
        Evasion Protocols
      MODULE`EVASION-PROTOCOLS`TECH: |-
        2
      MODULE`EVASION-PROTOCOLS`SLOTS: |-
        1
      MODULE`EVASION-PROTOCOLS`VALUE: |-
        1
      MODULE`EVASION-PROTOCOLS`HOT: |-
        2
      MODULE`EVASION-PROTOCOLS`TRAITS: |-
        Heat Spike|Hot (2)
      MODULE`EVASION-PROTOCOLS`ACTION: |-
        reaction
      MODULE`EVASION-PROTOCOLS`TEXT: |-
        This Module enables a Mech to make a series of rapid movements in an attempt to avoid damage from an attack or hazard. The infamous 'Devils Run' Pilot training route in the Arid Steppes contains a gauntlet of hazards that the Evasion Protocols Module has proved crucial in avoiding.
        If an attack hits your Mech, you may activate the Evasion Protocols as a Reaction to force the attacker to re-roll the attack and choose the lower result.
      MODULE`SELF-DESTRUCT: |-
        Self Destruct
      MODULE`SELF-DESTRUCT`TECH: |-
        1
      MODULE`SELF-DESTRUCT`SLOTS: |-
        1
      MODULE`SELF-DESTRUCT`VALUE: |-
        1
      MODULE`SELF-DESTRUCT`ACTION: |-
        reaction
      MODULE`SELF-DESTRUCT`TEXT: |-
        When activated, your Mech self-destructs, its reactor going into overdrive and causing a localised thermonuclear explosion.
        Your Mech, as well as all mounted Systems, Modules, and all Cargo, are destroyed. Everything within Close Range of your Mech takes SP damage equal to the Maximum Heat Capacity of your Mech.
        Everything affected by this may take any Turn Action or Reaction in response to attempt to avoid the damage. You may attempt to escape via any System, Module, or Ability with the Escape Trait.
        The area where your Mech was located before the Self Destruct Module was activated, is now irradiated.
      MODULE`ADV-TARGETING-ARRAY: |-
        Adv. Targeting Array
      MODULE`ADV-TARGETING-ARRAY`TECH: |-
        5
      MODULE`ADV-TARGETING-ARRAY`SLOTS: |-
        2
      MODULE`ADV-TARGETING-ARRAY`VALUE: |-
        2
      MODULE`ADV-TARGETING-ARRAY`TEXT: |-
        This mil-tech Module combines Laser Guidance, Pinpoint Targeter, and Multi-Targeter into one Module. You may activate each separately.
        {cost=3EP} Pinpoint Targeter
        Turn Action // Targeter
        Make an attack at a selected target. If it hits select a system or appendage to be damaged/injured. If you roll a 20 it is destroyed instead. You also deal damage as normal.
        {cost=XEP} Multi-Targeter
        Turn Action // Targeter
        Make an attack with any number of weapons. Each weapon must select a different target. Costs 1 EP per weapon fired.
        {cost=3EP} Laser Guidance
        Free Action // Range: Long // Targeter
        The next attack you make against that target automatically hits counting as an (11-19) result.
      MODULE`HOLO-PROJECTOR: |-
        Holo Projector
      MODULE`HOLO-PROJECTOR`TECH: |-
        5
      MODULE`HOLO-PROJECTOR`SLOTS: |-
        1
      MODULE`HOLO-PROJECTOR`VALUE: |-
        2
      MODULE`HOLO-PROJECTOR`EP: |-
        2
      MODULE`HOLO-PROJECTOR`RANGE: |-
        medium
      MODULE`HOLO-PROJECTOR`ACTION: |-
        turn
      MODULE`HOLO-PROJECTOR`TEXT: |-
        Developed by Ascension PLC as a means for their corporate minds to communicate with the material realm, this holo projector uses a complex laser array to project solid, life-like, three dimensional holograms into the world.
        When activated, this Module projects a lifelike, three dimensional, hologram into an area within Range. The hologram appears to onlookers as though it was realistic and can be viewed from multiple angles. It can be spoken through or set to repeat a message, make animal calls, or mimic the sounds of explosions or weapons firing. The hologram can have any appearance that you choose and can be either Mech or Pilot-sized. The hologram stays in place within the location you set for 24 hours.
      MODULE`SONIC-SCREECHER: |-
        Sonic Screecher
      MODULE`SONIC-SCREECHER`TECH: |-
        3
      MODULE`SONIC-SCREECHER`SLOTS: |-
        1
      MODULE`SONIC-SCREECHER`VALUE: |-
        2
      MODULE`SONIC-SCREECHER`EP: |-
        2
      MODULE`SONIC-SCREECHER`RANGE: |-
        medium
      MODULE`SONIC-SCREECHER`ACTION: |-
        turn
      MODULE`SONIC-SCREECHER`TABLE: |-
        SONIC-SCREECHER
      MODULE`SONIC-SCREECHER`TEXT: |-
        This Drontek-manufactured Module emits a piercing sound at an ultra high frequency that stuns anyone who hears it and causes them immense and sudden pain, with potential for cerebral haemorrhages and internal bleeding.
        This Module affects creatures and People that can hear, but does not affect Bio-Titans or Meld, nor does it affect anyone piloting a Mech.
      MODULE`SURVEY-SCANNER: |-
        Survey Scanner
      MODULE`SURVEY-SCANNER`TECH: |-
        1
      MODULE`SURVEY-SCANNER`SLOTS: |-
        1
      MODULE`SURVEY-SCANNER`VALUE: |-
        3
      MODULE`SURVEY-SCANNER`EP: |-
        2
      MODULE`SURVEY-SCANNER`RANGE: |-
        long
      MODULE`SURVEY-SCANNER`TRAITS: |-
        Scanner
      MODULE`SURVEY-SCANNER`ACTION: |-
        short
      MODULE`SURVEY-SCANNER`TABLE: |-
        SURVEY-SCANNER
      MODULE`SURVEY-SCANNER`TEXT: |-
        When activated, a Survey Scanner allows you to scan a specific point of interest within Range. This can be a single point on the Region Map or a specific feature in the world such as a ruin, unique area of terrain, settlement, or base. If a point is not worth scanning because it holds nothing of interest or you have all of the relevant information on it, the Mediator must tell you before you make your scan.
      MODULE`THERMAL-OPTICS: |-
        Thermal Optics
      MODULE`THERMAL-OPTICS`TECH: |-
        4
      MODULE`THERMAL-OPTICS`SLOTS: |-
        1
      MODULE`THERMAL-OPTICS`VALUE: |-
        1
      MODULE`THERMAL-OPTICS`EP: |-
        1
      MODULE`THERMAL-OPTICS`RANGE: |-
        long
      MODULE`THERMAL-OPTICS`TRAITS: |-
        Optics
      MODULE`THERMAL-OPTICS`ACTION: |-
        free
      MODULE`THERMAL-OPTICS`TEXT: |-
        This Drontek-developed array of thermal optical devices highlights the heat signatures of Mechs, Vehicles, Creatures, or anything else that would generate heat.
        When activated, you are able to see the location of anything that generates heat within visual Range. You can see their location even if they are in an obscured area such as foggy conditions, in darkness, or behind solid objects such as buildings. This effect lasts for 1 hour.
      MODULE`COMMS-MODULE: |-
        Comms Module
      MODULE`COMMS-MODULE`TECH: |-
        1
      MODULE`COMMS-MODULE`SLOTS: |-
        1
      MODULE`COMMS-MODULE`VALUE: |-
        1
      MODULE`COMMS-MODULE`RANGE: |-
        long
      MODULE`COMMS-MODULE`TRAITS: |-
        Communicator|Recommended Module
      MODULE`COMMS-MODULE`ACTION: |-
        free
      MODULE`COMMS-MODULE`TEXT: |-
        This Opus Institute-developed array of telecommunications wires and receivers allows communication with anything with the Communicator Trait in Range. This allows for both voice and text communications via your Mech's HUD. You may also use your Comms Module to send and receive images and data, such as data you gather when using a Scanner.
        If the Mech does not have a Comms Module or equivalent with the Communicator Trait you cannot talk to your Allies from their Mech whilst out in the field.
      MODULE`DAMAGE-ASSESSOR: |-
        Damage Assessor
      MODULE`DAMAGE-ASSESSOR`TECH: |-
        2
      MODULE`DAMAGE-ASSESSOR`SLOTS: |-
        1
      MODULE`DAMAGE-ASSESSOR`VALUE: |-
        1
      MODULE`DAMAGE-ASSESSOR`EP: |-
        1
      MODULE`DAMAGE-ASSESSOR`RANGE: |-
        medium
      MODULE`DAMAGE-ASSESSOR`TRAITS: |-
        Scanner
      MODULE`DAMAGE-ASSESSOR`ACTION: |-
        turn
      MODULE`DAMAGE-ASSESSOR`TEXT: |-
        Used by Osiris insurance teams as a means to assess damage and reduce liability following a series of catastrophic industrial accidents and worker deaths in the last attempt to build a space elevator.
        When activated, you scan a Mech or Vehicle in Range to get a full report on it. You learn its Chassis, Systems and Modules, its current and Max Structure Points, Heat, and Energy, and the Condition (Intact, Damaged, Destroyed) of its Chassis, Systems, and Modules.
      MODULE`DDR-MODULE: |-
        DDR Module
      MODULE`DDR-MODULE`TECH: |-
        6
      MODULE`DDR-MODULE`SLOTS: |-
        1
      MODULE`DDR-MODULE`VALUE: |-
        1
      MODULE`DDR-MODULE`EP: |-
        1
      MODULE`DDR-MODULE`ACTION: |-
        turn
      MODULE`DDR-MODULE`TEXT: |-
        This Module utilises Dynamic Diode Rotarisation technology allowing a Mech to perform a series of complex movements in time with music typically meant to impress others as well as for recreation.
        You may choose any dance you wish as part of activating the Module. Onlookers are highly impressed. It is not quite teleporting through walls, but trust me this, it is incredibly complicated to program a Mech to do.
      MODULE`PERSONAL-RECREATION-DEVICE: |-
        Personal Recreation Device
      MODULE`PERSONAL-RECREATION-DEVICE`TECH: |-
        1
      MODULE`PERSONAL-RECREATION-DEVICE`SLOTS: |-
        1
      MODULE`PERSONAL-RECREATION-DEVICE`VALUE: |-
        1
      MODULE`PERSONAL-RECREATION-DEVICE`EP: |-
        1
      MODULE`PERSONAL-RECREATION-DEVICE`ACTION: |-
        short
      MODULE`PERSONAL-RECREATION-DEVICE`TEXT: |-
        Your Mech is installed with a Personal Recreation Device of your choice. This could be an entertainment box, foot massager, or drinks dispenser, because sometimes a salvager just needs a break.
        When activated, a single Pilot may use the Personal Recreation Device to relax and get themselves into a flow state. The next time they or a Mech they are controlling roll the die, they may re-roll it. They must accept the result of the second roll.
        *It is against Union Regulation to install a Mech with a Personal Recreation Device designed to do what I know you're thinking.*
      MODULE`PINPOINT-TARGETER: |-
        Pinpoint Targeter
      MODULE`PINPOINT-TARGETER`TECH: |-
        2
      MODULE`PINPOINT-TARGETER`SLOTS: |-
        1
      MODULE`PINPOINT-TARGETER`VALUE: |-
        3
      MODULE`PINPOINT-TARGETER`EP: |-
        3
      MODULE`PINPOINT-TARGETER`TRAITS: |-
        Targeter
      MODULE`PINPOINT-TARGETER`ACTION: |-
        turn
      MODULE`PINPOINT-TARGETER`TEXT: |-
        Developed by Sakura Futures as a way to disable high profile targets, the Pinpoint Targeter allows you to strip vital components and limbs off of foes.
        When activated, make an attack with a Weapons System of your choice against a target. If the attack hits choose a System, Module, or appendage on the target. You deal damage as normal, but the System, Module, or appendage is now damaged, or injured.
        20: The System, Module, or appendage is instead destroyed.
      MODULE`VOICE-MODULATOR: |-
        Voice Modulator
      MODULE`VOICE-MODULATOR`TECH: |-
        3
      MODULE`VOICE-MODULATOR`SLOTS: |-
        1
      MODULE`VOICE-MODULATOR`VALUE: |-
        1
      MODULE`VOICE-MODULATOR`ACTION: |-
        passive
      MODULE`VOICE-MODULATOR`TEXT: |-
        This AMS-manufactured add-on unit allows you to modulate your outgoing voice communications, allowing you to disguise your voice. The modulator allows you to alter the pitch and tone of your voice, or choose from a variety of preset voice options such as robotic, sultry, intimidating, cartoonish, and animal-like. You may also choose any other option of your choice that you can think of.
      MODULE`REACTOR-SAFETY-PROTOCOLS: |-
        Reactor Safety Protocols
      MODULE`REACTOR-SAFETY-PROTOCOLS`TECH: |-
        2
      MODULE`REACTOR-SAFETY-PROTOCOLS`SLOTS: |-
        1
      MODULE`REACTOR-SAFETY-PROTOCOLS`VALUE: |-
        2
      MODULE`REACTOR-SAFETY-PROTOCOLS`ACTION: |-
        passive
      MODULE`REACTOR-SAFETY-PROTOCOLS`TABLE: |-
        REACTOR-SAFETY-PROTOCOLS
      MODULE`REACTOR-SAFETY-PROTOCOLS`TEXT: |-
        This Module increases the efficiency and cooling capability of your Mech's reactor, mitigating damage in the event of an overload.
        When your Mech rolls on the Reactor Overload Table you may roll on this table instead.
      EQUIPMENT`SHOTGUN: |-
        Shotgun
      EQUIPMENT`SHOTGUN`TECH: |-
        3
      EQUIPMENT`SHOTGUN`RANGE: |-
        close
      EQUIPMENT`SHOTGUN`DAMAGE: |-
        4 HP
      EQUIPMENT`SHOTGUN`TRAITS: |-
        Ballistic
      EQUIPMENT`SHOTGUN`TEXT: |-
        This weapon covers all manner of ballistic firearms designed to discharge small-pellet-like shot at targets.
        When you hit with this weapon up to one other target of your choice in Close Range takes 2 HP damage.
      EQUIPMENT`IMPROVISED-MELEE-WEAPON: |-
        Improvised Melee Weapon
      EQUIPMENT`IMPROVISED-MELEE-WEAPON`TECH: |-
        1
      EQUIPMENT`IMPROVISED-MELEE-WEAPON`RANGE: |-
        close
      EQUIPMENT`IMPROVISED-MELEE-WEAPON`DAMAGE: |-
        2 HP
      EQUIPMENT`IMPROVISED-MELEE-WEAPON`TRAITS: |-
        Melee|Silent
      EQUIPMENT`IMPROVISED-MELEE-WEAPON`TEXT: |-
        This covers any number of melee weapons from wrenches and hammers to shards of metal and sharpened metal posts. There are a lot of things you can use to bludgeon, stab, or otherwise injure someone, to be found in the wastes.
      EQUIPMENT`EXECUTIVE-CORPO-SUIT: |-
        Executive Corpo Suit
      EQUIPMENT`EXECUTIVE-CORPO-SUIT`TECH: |-
        6
      EQUIPMENT`EXECUTIVE-CORPO-SUIT`TRAITS: |-
        Armour|Flashy
      EQUIPMENT`EXECUTIVE-CORPO-SUIT`TEXT: |-
        This pristine suit allows you to dress as a corpo executive from an arco of your choice. You cannot imagine how hard it is to find one of these in good condition within the wastelands.
      EQUIPMENT`FLARE-GUN: |-
        Flare Gun
      EQUIPMENT`FLARE-GUN`TECH: |-
        2
      EQUIPMENT`FLARE-GUN`RANGE: |-
        far
      EQUIPMENT`FLARE-GUN`USES: |-
        3
      EQUIPMENT`FLARE-GUN`TEXT: |-
        A launcher for a flare intended to be used as a distress signal, beacon, or in a pinch, to light up an area. When fired, the flare can be seen from anywhere up to Far Range. It lights up an area within Close Range of its target for 1 hour.
      EQUIPMENT`HIGH-TENSILE-WIRE: |-
        High Tensile Wire
      EQUIPMENT`HIGH-TENSILE-WIRE`TECH: |-
        1
      EQUIPMENT`HIGH-TENSILE-WIRE`RANGE: |-
        close
      EQUIPMENT`HIGH-TENSILE-WIRE`TRAITS: |-
        Rigging
      EQUIPMENT`HIGH-TENSILE-WIRE`TEXT: |-
        Strong and durable wire, with multiple potential creative applications.This can be attached to anything within Range, allowing you to climb the wire. It can also be used to aid in the dragging of heavy objects
      EQUIPMENT`PORTABLE-ARC-WELDER: |-
        Portable Arc Welder
      EQUIPMENT`PORTABLE-ARC-WELDER`TECH: |-
        2
      EQUIPMENT`PORTABLE-ARC-WELDER`TEXT: |-
        This miniaturised Arc Welder allows you to make improved field repairs to a wide variety of Mechs and parts.
        {cost=2AP} Patch
        Turn Action // Range: Close
        When activated, a target Mech or Vehicle of your choice in Range with at least 1 SP regains 3 SP.
        {cost=2AP} System Repair
        Short Action // Range: Close
        You repair a damaged Tech 1 or 2 System or Module in Range to Intact Condition. It is now usable.
        {cost=4AP} Chassis Repair
        Long Action // Range: Close
        You repair a damaged Tech 1 or 2 Mech Chassis or Vehicle in Range to Intact Condition. It is now usable with 1 SP.
      EQUIPMENT`RIGGING-JACK: |-
        Rigging Jack
      EQUIPMENT`RIGGING-JACK`TECH: |-
        2
      EQUIPMENT`RIGGING-JACK`TRAITS: |-
        Rigging
      EQUIPMENT`RIGGING-JACK`TEXT: |-
        This hydraulic jack can aid in the heavy lifting of salvage. The Rigging Jack can carry 1 Scrap upon it.
      EQUIPMENT`SNIPER-RIFLE: |-
        Sniper Rifle
      EQUIPMENT`SNIPER-RIFLE`TECH: |-
        4
      EQUIPMENT`SNIPER-RIFLE`RANGE: |-
        long
      EQUIPMENT`SNIPER-RIFLE`DAMAGE: |-
        6 HP
      EQUIPMENT`SNIPER-RIFLE`TRAITS: |-
        Ballistic
      EQUIPMENT`SNIPER-RIFLE`TEXT: |-
        This weapon covers a wide variety of scoped rifles designed for taking out targets at a distance.
      EQUIPMENT`MONOMOLECULAR-SWORD: |-
        Monomolecular Sword
      EQUIPMENT`MONOMOLECULAR-SWORD`TECH: |-
        5
      EQUIPMENT`MONOMOLECULAR-SWORD`RANGE: |-
        close
      EQUIPMENT`MONOMOLECULAR-SWORD`DAMAGE: |-
        4 SP
      EQUIPMENT`MONOMOLECULAR-SWORD`TRAITS: |-
        Deadly|Melee|Silent
      EQUIPMENT`MONOMOLECULAR-SWORD`TEXT: |-
        This blade is formed from a super-hardened carbon lattice, held together by an electro-static charge, and honed to the width of a single molecule. They give off the smell of ozone in the atmosphere as the moisture in the air is cut.
      EQUIPMENT`HEALING-BIO-FOAM: |-
        Healing Bio-Foam
      EQUIPMENT`HEALING-BIO-FOAM`TECH: |-
        3
      EQUIPMENT`HEALING-BIO-FOAM`USES: |-
        3
      EQUIPMENT`HEALING-BIO-FOAM`TEXT: |-
        This canister contains an advanced form of bio-foam that when sprayed on a wound forms a rigid layer of biocomposite polymer, sealing the injury.
        Healing Spray
        Range: Close // Turn Action
        A target creature of your choice in Range regains 5 Hit Points. If they were on 0 Hit Points this restores them to consciousness with 5 HP.
        Suturing Spray
        Range: Close // Short Action
        A target creature of your choice in Range heals a Minor Injury.
      EQUIPMENT`FIRST-AID-KIT: |-
        First Aid Kit
      EQUIPMENT`FIRST-AID-KIT`TECH: |-
        1
      EQUIPMENT`FIRST-AID-KIT`RANGE: |-
        close
      EQUIPMENT`FIRST-AID-KIT`USES: |-
        3
      EQUIPMENT`FIRST-AID-KIT`TEXT: |-
        This set of bandages, plasters, gauze, painkillers, and antiseptics allows you to patch up wounds in the field.
        A target creature of your choice in Range regains 3 Hit Points. If they were on 0 Hit Points this restores them to consciousness with 3 HP.
        *Union Safety Guideline 305.15 recommends each Union Crawler salvage crew equip a First Aid Kit for all active field work.*
      EQUIPMENT`BETA-FISSION-GUN: |-
        Beta Fission Gun
      EQUIPMENT`BETA-FISSION-GUN`TECH: |-
        5
      EQUIPMENT`BETA-FISSION-GUN`RANGE: |-
        medium
      EQUIPMENT`BETA-FISSION-GUN`DAMAGE: |-
        7 SP
      EQUIPMENT`BETA-FISSION-GUN`TRAITS: |-
        Burn (2)|Energy|Explosive (2)|Heavy
      EQUIPMENT`BETA-FISSION-GUN`USES: |-
        3
      EQUIPMENT`BETA-FISSION-GUN`TEXT: |-
        This frankly over-designed weapon fires a huge blast of supercharged fission which engulfs an entire area in superheated green flame.
      EQUIPMENT`HEAVY-DUTY-TORCH: |-
        Heavy Duty Torch
      EQUIPMENT`HEAVY-DUTY-TORCH`TECH: |-
        1
      EQUIPMENT`HEAVY-DUTY-TORCH`RANGE: |-
        close
      EQUIPMENT`HEAVY-DUTY-TORCH`TEXT: |-
        A handheld worker's torch that runs on a rechargeable lithium-ion battery.
        This lights up an area in Close Range of the Pilot, allowing them to see more clearly in dark or foggy conditions.
      EQUIPMENT`POLYCARBONATE-CARAPACE-ARMOUR: |-
        Polycarbonate Carapace Armour
      EQUIPMENT`POLYCARBONATE-CARAPACE-ARMOUR`TECH: |-
        5
      EQUIPMENT`POLYCARBONATE-CARAPACE-ARMOUR`TRAITS: |-
        Armour|Heavy
      EQUIPMENT`POLYCARBONATE-CARAPACE-ARMOUR`TEXT: |-
        Heavy layers of reinforced carbonate provide excellent protection in the field against all manner of harm one could find in the wastelands. Reduce all damage your Pilot takes by 2 to a minimum of 1 when this Armour is equipped. Apply this after other modifiers.
      EQUIPMENT`MINIATURISED-REPAIR-ARM: |-
        Miniaturised Repair Arm
      EQUIPMENT`MINIATURISED-REPAIR-ARM`TECH: |-
        5
      EQUIPMENT`MINIATURISED-REPAIR-ARM`TEXT: |-
        This repair arm was developed by Stefanus to allow their field techs to make advanced repairs whilst in combat zones.
        {cost=2AP} Patch
        Turn Action // Range: Close
        You restore up to 6 SP to a target Mech in Range with at least 1 SP.
        {cost=2AP} System Repair
        Short Action // Range: Close
        You repair a damaged Tech 1, 2, 3, 4, or 5 System or Module in Range to Intact Condition. It is now usable.
        {cost=4AP} Chassis Repair
        Long Action // Range: Close
        You repair a damaged Tech 1, 2, 3, 4, or 5 Mech Chassis or Vehicle in Range to Intact Condition. It is now usable with 1 SP.
      EQUIPMENT`PISTOL: |-
        Pistol
      EQUIPMENT`PISTOL`TECH: |-
