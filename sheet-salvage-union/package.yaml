      SYSTEM`CORPO-BODY-KIT`ACTION: |-
        passive
      SYSTEM`CORPO-BODY-KIT`TEXT: |-
        This System allows you to change the skin of your Mech to appear as though it is any Tech 3 or 4 Mech or any corpo design of your choice. This allows them to meld seamlessly with other Mechs of a similar design.
      SYSTEM`VECTORED-THRUST-UNIT: |-
