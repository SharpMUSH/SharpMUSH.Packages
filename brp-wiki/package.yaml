description: "Wiki pages for playing with the percentile sheet: rolling and success levels, making a character, the characteristics and skills, hit points, coin and experience, and encounters with creatures. Contains ORC Licensed Material from Basic Roleplaying: Universal Game Engine; an unofficial offering."
