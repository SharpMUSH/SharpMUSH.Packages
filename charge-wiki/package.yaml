format: "1.20"
package: charge-wiki
title: Charge rules
version: 1.0.4
wiki_landing_page: category:charge_start_here
wiki_collection_name: Charge
authors: [SharpMUSH]
description: >-
  The Charge rules as wiki pages: the game, character creation, action rolls, momentum,
  teamwork, consequences and determination, stress and recovery, clocks, progression,
  fortune rolls and flashbacks, and the commands that play them on this game. Based on the
  Charge SRD under CC BY 4.0 and Blades in the Dark under CC BY 3.0.
license: CC-BY-4.0
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages/tree/main/charge-wiki
keywords: [charge, rules, wiki, forged in the dark]
category: Game System
subcategory: Charge
requires_server: ">=1.0"
verified_server: "1.0"
locale: en

# A content pack: wiki pages only, no objects or softcode. Softcode never reads these pages. The sheet that
# plays these rules is sheet-charge; this package does not need it, and it does not need this one.
wiki:
  - page: category:charge_start_here
    title: Start here — Charge
    pin: true
    file: wiki/category/charge_start_here.md

  - page: help:charge_license_notice
    title: Charge License Notice
    requires:
      edit: [wiki.admin]
      delete: [wiki.admin]
    file: wiki/help/charge_license_notice.md

  - page: main:charge_the_game
    title: The Game
    categories: [charge_start_here]
    file: wiki/main/charge_the_game.md

