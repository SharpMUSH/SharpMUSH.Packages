format: "1.20"
package: pbta-wiki
title: "PbtA rules"
version: 1.1.1
wiki_landing_page: category:pbta_start_here
wiki_collection_name: PbtA
authors: [SharpMUSH]
description: "Wiki pages for playing with the PbtA sheet: how moves and rolls work, making a character, the playbooks, the basic and special moves (Dungeon World text, CC BY 3.0), advancement, and encounters with foes and harm."
license: CC-BY-3.0
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [pbta, wiki, rules, moves]
category: Game System
subcategory: PbtA
requires_server: ">=0.1"
locale: en

# A content package: wiki pages only. The move pages quote the moves as sheet-pbta's store holds them, so the two
# say the same thing; a game that edits its moves in +config changes the sheet, not these pages.
