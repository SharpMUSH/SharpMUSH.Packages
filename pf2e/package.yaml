format: "1.16"
package: pf2e
title: Pathfinder 2e rules
version: "0.9.2"
authors: [SharpMUSH]
description: "Pathfinder Second Edition rules in softcode, read the way Foundry VTT's pf2e system reads them, with character sheets kept as a ledger: +build, +sheet, +check, spellcasting (+spells, +prepare, +cast, +rest), a deity table the game fills (+deity), alchemy (+alchemy), encounters with effects and battle forms that keep their own copy of each character, built from the bestiary with elite and weak creatures and hazards (+enc), exploration, skill challenges, Recall Knowledge, and audited awards with levels and runes (+pf2e/award)."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [pf2e, pathfinder, rules, dice]
requires_server: ">=1.0"

# One permission, for staff: see and change any character's sheet. Wizards and royalty hold it. A game
# that takes it back with @role/clear wizard=softcode.pf2e.staff keeps it that way through updates.
categories:
  permissions:
    - name: Pathfinder 2e
      description: Pathfinder 2e character sheets.
permissions:
  - name: softcode.pf2e.staff
    category: Pathfinder 2e
    description: See and change any character's Pathfinder 2e sheet.
grants:
  wizard: [softcode.pf2e.staff]
  royalty: [softcode.pf2e.staff]

objects:
  # The rules core. Every function takes Foundry's own data as Foundry stores it (a predicate is the
  # JSON array from a rule element, a modifier is Foundry's modifier object) and answers as Foundry's
  # pf2e system would, so a rule element copied from the feed means the same thing here.
  #
  # Trees: FUN`PREDICATE` tests a predicate against roll options, FUN`MODIFIER` applies the stacking
  # rules, FUN`DEGREE` reads a check's degree of success, FUN`FORMULA` resolves a rule element value.
  - ref: core
    type: thing
    name: PF2e Rules
    location: "{{$master_room}}"
    attributes:
      DATA: What the core reads. DATA`PACK`<pack> names the object holding that Foundry pack.
      DATA`PACK: One data object per Foundry pack, holding its items as the PF2e feed carries them.
      DATA`PACK`ACTIONS: "{{data_actions}}"
      DATA`PACK`ANCESTRIES: "{{data_ancestries}}"
      DATA`PACK`ANCESTRY-FEATURES: "{{data_ancestry_features}}"
      DATA`PACK`BACKGROUNDS: "{{data_backgrounds}}"
      DATA`PACK`CLASSES: "{{data_classes}}"
      DATA`PACK`CLASS-FEATURES: "{{data_class_features}}"
      DATA`PACK`CONDITIONS: "{{data_conditions}}"
      DATA`PACK`EQUIPMENT: "{{data_equipment}}"
      DATA`PACK`EQUIPMENT-EFFECTS: "{{data_equipment_effects}}"
      DATA`PACK`FAMILIAR-ABILITIES: "{{data_familiar_abilities}}"
      DATA`PACK`FEAT-EFFECTS: "{{data_feat_effects}}"
      DATA`PACK`FEATS: "{{data_feats}}"
      DATA`PACK`HAZARDS: "{{data_hazards}}"
      DATA`PACK`HERITAGES: "{{data_heritages}}"
      DATA`PACK`OTHER-EFFECTS: "{{data_other_effects}}"
      DATA`PACK`SPELL-EFFECTS: "{{data_spell_effects}}"
      DATA`PACK`SPELLS: "{{data_spells}}"
      DATA`PACK`VEHICLES: "{{data_vehicles}}"
      DATA`PACK`PATHFINDER-MONSTER-CORE: "{{data_pathfinder_monster_core}}"
      DATA`PACK`LANG: "{{data_lang}}"
      # The packs +enc/add and +recall find creatures in, and those +enc/add finds hazards in.
      DATA`CREATURE`PACKS: pathfinder-monster-core
      DATA`HAZARD`PACKS: hazards
      DATA`CONFIG: Settings.
      DATA`CONFIG`LABEL: Pathfinder 2e
      DATA`CONFIG`BOOKS: pc1 pc2 gmc mc
      DATA`CONFIG`BOOKS`TYPE: list
      DATA`CONFIG`BOOKS`DEFAULT: pc1 pc2 gmc mc
      DATA`CONFIG`BOOKS`LABEL: Source books
      DATA`CONFIG`BOOKS`DESCRIPTION: The books whose rules the game uses, by the feed's book slug. An item from a book not listed is left out of lookups, sheets and the builder.
      DATA`CONFIG`REPOSITORY: SharpMUSH/SharpMUSH.Packages
      DATA`CONFIG`REPOSITORY`TYPE: text
      DATA`CONFIG`REPOSITORY`DEFAULT: SharpMUSH/SharpMUSH.Packages
      DATA`CONFIG`REPOSITORY`LABEL: Feed repository
      DATA`CONFIG`REPOSITORY`DESCRIPTION: The GitHub repository, owner/name, whose pf2e-feed folder the updater reads.
      DATA`CONFIG`BRANCH: main
      DATA`CONFIG`BRANCH`TYPE: text
      DATA`CONFIG`BRANCH`DEFAULT: main
      DATA`CONFIG`BRANCH`LABEL: Feed branch
      DATA`CONFIG`BRANCH`DESCRIPTION: The branch the updater reads. Each run reads every file from the commit the branch is on when the run starts.
      DATA`STATISTICS: acrobatics arcana athletics crafting deception diplomacy intimidation medicine nature occultism performance religion society stealth survival thievery perception fortitude reflex will
      # The most items a sheet holds at once, so that +sheet stays inside the engine's function
      # invocation limit.
      DATA`SHEET`GRANTS`MAX: 200
      # Every domain the sheet reads: each statistic's check (FUN`STAT`DOMAINS), and AC, hit points,
      # speed, initiative, class DC, spells, Strikes and their damage.
      DATA`CHECK`DOMAINS: acrobatics acrobatics-check all arcana arcana-check athletics athletics-check cha-based cha-skill-check check con-based crafting crafting-check deception deception-check dex-based dex-skill-check diplomacy diplomacy-check fortitude fortitude-check int-based int-skill-check intimidation intimidation-check medicine medicine-check nature nature-check occultism occultism-check perception perception-check performance performance-check reflex reflex-check religion religion-check saving-throw skill-check society society-check stealth stealth-check str-based str-skill-check survival survival-check thievery thievery-check will will-check wis-based wis-skill-check lore-skill-check ac hp hp-per-level land-speed all-speeds speed initiative class class-dc spell-attack spell-attack-roll spell-dc attack attack-roll strike-attack-roll melee-strike-attack-roll ranged-strike-attack-roll unarmed-attack-roll str-attack dex-attack mundane-attack damage strike-damage attack-damage melee-strike-damage melee-damage ranged-strike-damage unarmed-damage
      # Which shape of ITEM`<id>`PREP the core reads. The updater prepares an item again when its PREP
      # was made for another shape.
      DATA`PREP`VERSION: 4
      # The derived-sheet cache: FUN`CHECK`PREPARE keeps the registers it works out from a ledger under
      # CACHE`<key> on this object, with the sheet's statistics, Strikes and their lines under it, so a
      # ledger read again costs a few hundred function calls. The key is the ledger with the package's
      # version, the books and CACHE`STAMP, which the updater and the deity table change. CACHE lists
      # the keys oldest first; past DATA`CACHE`KEEP the oldest goes.
      DATA`CACHE`VERSION: "0.9.2"
      DATA`CACHE`KEEP: 200
      DATA`CACHE`REGISTERS: check_actor check_actortraits check_adjstrike check_adjust check_ancestry check_armor check_background check_class check_conditions check_craftgrants check_crafting check_deity check_deity_spells check_deity_weapons check_domopts check_dynamic check_entries check_favored check_favoredrules check_flats check_form check_forms check_formulas check_gear check_grants check_heritage check_index check_itemalts check_level check_martial check_names check_options check_rankdyn check_resgrants check_resources check_rollopts check_rollrules check_shield check_static check_stats check_strikes check_synthetics check_toggles check_traits check_unapplied check_upgrades
      # The ItemAlteration properties the core applies, by the kind of item they reach.
      DATA`ITEMALT`WEAPON: other-tags traits damage-type damage-dice-faces damage-dice-number runes-potency runes-striking
      DATA`ITEMALT`ARMOR: runes-potency runes-resilient ac-bonus
      DATA`ITEMALT`SHIELD: hardness
      # Foundry's damage types.
      DATA`DAMAGE`TYPES: acid bleed bludgeoning cold electricity fire force mental piercing poison slashing sonic spirit untyped vitality void
      # The proficiencies other than the statistics: weapon categories, armor categories, spellcasting and the class DC.
      DATA`PROFICIENCIES: simple martial advanced unarmed unarmored light medium heavy spellcasting classdc
      # GM Core's DC for each level, from level -1 to 25, and how much each difficulty moves it.
      DATA`DC`LEVEL: 13 14 15 16 18 19 20 22 23 24 26 27 28 30 31 32 34 35 36 38 39 40 42 44 46 48 50
      DATA`DC`ADJUST: incredibly-easy~-10 very-easy~-5 easy~-2 normal~0 hard~2 very-hard~5 incredibly-hard~10
      DATA`DC`RARITY: common~0 uncommon~2 rare~5 unique~10
      # Simple DCs by proficiency rank, untrained to legendary.
      DATA`DC`SIMPLE: 10 15 20 30 40
      # The Foundry compendium names that item links use, and the pack each is here.
      DATA`UUID: feats-srd~feats classfeatures~class-features ancestryfeatures~ancestry-features actionspf2e~actions spells-srd~spells equipment-srd~equipment conditionitems~conditions feat-effects~feat-effects spell-effects~spell-effects equipment-effects~equipment-effects other-effects~other-effects ancestries~ancestries heritages~heritages backgrounds~backgrounds classes~classes familiar-abilities~familiar-abilities
      # The common languages any character may take with Intelligence or the ancestry's extra languages.
      DATA`LANGUAGES: common draconic dwarven elven fey gnomish goblin halfling jotun orcish sakvroth
