        flags: [cmdsyntax]
      INC`IMPORT`UNNAME:
        value: |-
          @break not(strlen(%q<name_old>)); &NAME`%q<name_old> %q<store>=[remove(get(%q<store>/NAME`%q<name_old>),%q<id>)]
        flags: [cmdsyntax]
      INC`IMPORT`UNINDEX:
        value: |-
          @break not(words(%q<opts_old>)); @dolist/inplace %q<opts_old>=&OPT`## %q<store>=[remove(get(%q<store>/OPT`##),%q<id>)]
        flags: [cmdsyntax]
      # A line of a lang file: <key> <hash> LANG <JSON string>.
      INC`IMPORT`LANG:
        value: |-
          &LANG`%q<id> %q<store>=%q<value>
        flags: [cmdsyntax]
      INC`IMPORT`TEXT:
        value: |-
          &ITEM`%q<id>`TEXT %q<store>=[json_query(%q<value>,unescape)]
        flags: [cmdsyntax]
      INC`IMPORT`EMBED:
        value: |-
          &ITEM`%q<id>`%q<leaf> %q<store>=%q<value>
        flags: [cmdsyntax]
      INC`IMPORT`HASH:
        value: |-
