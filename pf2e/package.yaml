          @@(%0 a combatant's index, %1 their dying value)[
          setq(recover_face,die(1,20))][
          setq(recover_degree,u({{core}}/FUN`DEGREE`OF`CHECK,%q<recover_face>,add(10,%1),%q<recover_face>))][
          setq(recover_dying,add(%1,extract(2 1 -1 -2,inc(%q<recover_degree>),1)))][
          if(lte(%q<recover_dying>,0),
            u(FUN`ENC`PATCH,%0,json(object,conds,json(object,dying,null,wounded,inc(firstof(json_query(u(FUN`ENC`C,%0,conds),extract,$.wounded),0))))),
            u(FUN`ENC`PATCH,%0,json(object,conds,json(object,dying,min(4,%q<recover_dying>)))))][
          if(gte(%q<recover_dying>,4),u(FUN`ENC`SET,%0,down,1))][
          setq(next_text,%q<next_text>%r[u(FUN`ENC`C,%0,name)]'s recovery check: %q<recover_face> vs DC [add(10,%1)]%, [lcstr(u(FUN`ACT`DEGREE,%q<recover_degree>))]. [switch(1,gte(%q<recover_dying>,4),[u(FUN`ENC`C,%0,name)] dies.,lte(%q<recover_dying>,0),[u(FUN`ENC`C,%0,name)] is stable%, unconscious and wounded.,Dying %q<recover_dying>.)])]
        flags: [funsyntax]

      # --- Exploration ---------------------------------------------------------------------------
      # PF2E`EXPLORE on a character: the exploration activity they are doing. Avoid Notice rolls
      # Stealth for initiative and Scout gives every character +1; Search lets the GM roll secret
      # Perception checks for them.
      DATA`EXPLORE: "avoid-notice~Avoid Notice~Stealth for initiative|defend~Defend~Shield raised when the fight starts|detect-magic~Detect Magic~Senses magic nearby|follow-the-expert~Follow the Expert~An ally's proficiency on checks|investigate~Investigate~Recall Knowledge as you go|repeat-a-spell~Repeat a Spell~A spell kept up|search~Search~Secret Perception checks for hidden things|scout~Scout~+1 to everyone's initiative|hustle~Hustle~Double Speed for a while|track~Track~Survival to follow tracks"
      INC`EXPLORE`SHOW:
        value: |-
          @pemit %#=u(%!/FUN`SHOW`EXPLORE)
        flags: [cmdsyntax]
      INC`EXPLORE`SET:
        value: |-
          think setq(explore_slug,first(squish(iter(get(%!/DATA`EXPLORE),if(strmatch(lcstr(elements(%i0,2,~)),lcstr(%q<cmd_args>)*),first(%i0,~)),|,%b)))); @assert strlen(%q<explore_slug>)=@pemit %#=notice(PF2E,The activities are [itemize(iter(get(%!/DATA`EXPLORE),elements(%i0,2,~),|,|),|)].,warn); &PF2E`EXPLORE %#=%q<explore_slug>; @remit %l=notice(PF2E,%N is now exploring with [elements(grab(get(%!/DATA`EXPLORE),%q<explore_slug>~*,|),2,~)]: [elements(grab(get(%!/DATA`EXPLORE),%q<explore_slug>~*,|),3,~)].,ok)
        flags: [cmdsyntax]
      INC`EXPLORE`STOP:
        value: |-
          &PF2E`EXPLORE %#=; @pemit %#=notice(PF2E,You stop your exploration activity.,ok)
        flags: [cmdsyntax]
      # +explore/search <DC>: the GM's secret Perception check for everyone here who is Searching; only the GM sees the rolls.
      INC`EXPLORE`SEARCH:
        value: |-
          @assert cand(isint(%q<cmd_args>),gt(%q<cmd_args>,0))=@pemit %#=notice(PF2E,+explore/search <DC> rolls a secret Perception check for each character here who is Searching.,warn); think setq(search_who,iter(lcon(%l,connect),if(strmatch(get(%i0/PF2E`EXPLORE),search),%i0))); @assert words(%q<search_who>)=@pemit %#=notice(PF2E,No one here is Searching.,warn); @pemit %#=notice(PF2E,Secret Perception checks against DC %q<cmd_args>:%r[iter(%q<search_who>,u(%!/FUN`EXPLORE`SECRET,%i0,perception,%q<cmd_args>),%b,%r)])
        flags: [cmdsyntax]
      FUN`EXPLORE`NAME:
        value: |-
          lcstr(elements(grab(get(%!/DATA`EXPLORE),%0~*,|),2,~))
        flags: [funsyntax]
      FUN`EXPLORE`SECRET:
        value: |-
          @@(%0 a character, %1 a statistic, %2 a DC: their roll as a line)[
          u({{core}}/FUN`CHECK`PREPARE,u({{commands}}/FUN`LEDGER`OF,%0))][
          setq(act_npc,)][
          u(FUN`ACT`CHECK,%1,%2)][
          name(%0)]: [json_query(%q<roll_record>,extract,$.text)][u(FUN`ACT`TAGS)]%, [lcstr(u(FUN`ACT`DEGREE,%q<roll_degree>))][u(FUN`ACT`ADJUSTED)][u(FUN`ACT`NOTES)]
        flags: [funsyntax]

      # --- Skill challenges: victory points -----------------------------------------------------
      # VP`<room> holds a room's challenge: {gm, name, goal, vp, round, rolled (objids this round),
      # options {skill: DC}, dc (the DC for any other skill, empty for none)}.
      INC`CHALLENGE`SHOW:
        value: |-
          @assert strlen(%q<vp>)=@pemit %#=notice(PF2E,There is no skill challenge here. +challenge/start <name>=<goal> begins one.,warn); @pemit %#=u(%!/FUN`SHOW`CHALLENGE)
        flags: [cmdsyntax]
      INC`CHALLENGE`START:
        value: |-
          @assert not(strlen(%q<vp>))=@pemit %#=notice(PF2E,There is already a challenge here. +challenge shows it.,warn); think setqm(vp_name,trim(before(%q<cmd_args>,=)),vp_goal,trim(after(%q<cmd_args>,=))); @assert cand(strlen(%q<vp_name>),isint(%q<vp_goal>),gt(%q<vp_goal>,0))=@pemit %#=notice(PF2E,+challenge/start <name>=<victory points to win>%, such as +challenge/start Chase the thief=5.,warn); &%q<vp_attr> %!=[json(object,gm,json(string,objid(%#)),name,json(string,%q<vp_name>),goal,%q<vp_goal>,vp,0,round,1,rolled,"",options,json(object),dc,null)]; @remit %l=notice(PF2E,%N starts a skill challenge: [tone(strong,%q<vp_name>)]%, %q<vp_goal> victory points to win. %N adds the skills that help with +challenge/option.,ok)
        flags: [cmdsyntax]
      INC`CHALLENGE`GM:
        value: |-
          @assert strlen(%q<vp>)=@pemit %#=notice(PF2E,There is no skill challenge here.,warn); @assert cor(permission(%#,softcode.pf2e.staff),strmatch(json_query(%q<vp>,extract,$.gm),objid(%#)))=@pemit %#=notice(PF2E,Only who runs the challenge or staff can do that.,warn)
        flags: [cmdsyntax]
      # +challenge/option <skill>=<DC>, or *=<DC> for any other skill; a DC of 0 takes it off.
      INC`CHALLENGE`OPTION:
        value: |-
          @include %!/INC`CHALLENGE`GM; think setqm(vp_skill,trim(before(%q<cmd_args>,=)),vp_dc,trim(after(%q<cmd_args>,=))); @assert cand(isint(%q<vp_dc>),gte(%q<vp_dc>,0))=@pemit %#=notice(PF2E,+challenge/option <skill>=<DC>%, or *=<DC> for any other skill.,warn); think setq(vp_stat,if(not(comp(%q<vp_skill>,*)),*,u({{commands}}/FUN`COMMAND`STAT,%q<vp_skill>))); @assert eq(words(%q<vp_stat>),1)=@pemit %#=notice(PF2E,There is no one statistic called %q<vp_skill>.,warn); &%q<vp_attr> %!=[if(not(comp(%q<vp_stat>,*)),json_mod(%q<vp>,set,$.dc,if(%q<vp_dc>,%q<vp_dc>,null)),json_mod(%q<vp>,patch,json(object,options,json(object,%q<vp_stat>,if(%q<vp_dc>,%q<vp_dc>,null)))))]; @pemit %#=notice(PF2E,[if(not(comp(%q<vp_stat>,*)),Any other skill,u({{commands}}/FUN`SHOW`STAT,%q<vp_stat>))] [if(%q<vp_dc>,is now DC %q<vp_dc>,no longer counts)].,ok)
        flags: [cmdsyntax]
      # +challenge/roll <skill>: one check a round each; critical success +2, success +1, failure 0, critical failure -1.
      INC`CHALLENGE`ROLL:
        value: |-
          @assert strlen(%q<vp>)=@pemit %#=notice(PF2E,There is no skill challenge here.,warn); @assert not(member(json_query(%q<vp>,extract,$.rolled),objid(%#)))=@pemit %#=notice(PF2E,You have already rolled this round. Wait for +challenge/round.,warn); think setq(vp_stat,u({{commands}}/FUN`COMMAND`STAT,%q<cmd_args>)); @assert eq(words(%q<vp_stat>),1)=@pemit %#=notice(PF2E,+challenge/roll <skill>. +challenge lists the skills that help.,warn); think setq(vp_dc,firstof(json_query(%q<vp>,extract,$.options.%q<vp_stat>),json_query(%q<vp>,extract,$.dc))); @assert isint(%q<vp_dc>)=@pemit %#=notice(PF2E,[u({{commands}}/FUN`SHOW`STAT,%q<vp_stat>)] does not help here. +challenge lists the skills that do.,warn); think u({{core}}/FUN`CHECK`PREPARE,u({{commands}}/FUN`LEDGER`OF,%#)); think setq(act_npc,); think u(%!/FUN`ACT`CHECK,%q<vp_stat>,%q<vp_dc>); think setq(vp_gain,extract(-1 0 1 2,inc(%q<roll_degree>),1)); think setq(vp,json_mod(json_mod(%q<vp>,set,$.vp,add(json_query(%q<vp>,extract,$.vp),%q<vp_gain>)),set,$.rolled,json(string,squish([json_query(%q<vp>,extract,$.rolled)] [objid(%#)])))); &%q<vp_attr> %!=%q<vp>; @remit %l=notice(PF2E,%N rolls [u({{commands}}/FUN`SHOW`STAT,%q<vp_stat>)] for [json_query(%q<vp>,extract,$.name)]: [json_query(%q<roll_record>,extract,$.text)][u(%!/FUN`ACT`TAGS)] vs DC %q<vp_dc>: [tone(strong,u(%!/FUN`ACT`DEGREE,%q<roll_degree>))][u(%!/FUN`ACT`ADJUSTED)]%, [u(%!/FUN`SHOW`SIGNED,%q<vp_gain>)] VP. [json_query(%q<vp>,extract,$.vp)] of [json_query(%q<vp>,extract,$.goal)].[if(gte(json_query(%q<vp>,extract,$.vp),json_query(%q<vp>,extract,$.goal)),%b[tone(strong,The challenge is won!)])])
        flags: [cmdsyntax]
      INC`CHALLENGE`ROUND:
        value: |-
          @include %!/INC`CHALLENGE`GM; &%q<vp_attr> %!=[json_mod(json_mod(%q<vp>,set,$.round,inc(json_query(%q<vp>,extract,$.round))),set,$.rolled,"")]; @remit %l=notice(PF2E,[json_query(%q<vp>,extract,$.name)]: round [inc(json_query(%q<vp>,extract,$.round))]. Everyone may roll again.,ok)
        flags: [cmdsyntax]
      INC`CHALLENGE`END:
        value: |-
          @include %!/INC`CHALLENGE`GM; &%q<vp_attr> %!=; @remit %l=notice(PF2E,[json_query(%q<vp>,extract,$.name)] ends with [json_query(%q<vp>,extract,$.vp)] of [json_query(%q<vp>,extract,$.goal)] victory points after [json_query(%q<vp>,extract,$.round)] round[if(neq(json_query(%q<vp>,extract,$.round),1),s)].,ok)
        flags: [cmdsyntax]

      # --- Recall Knowledge ----------------------------------------------------------------------
      # +recall <creature>[=<skill>]: a secret check against the creature's level DC, adjusted for
      # rarity; a Lore that fits lowers it (by 2 for a specific Lore, by 5 for a narrow one, as the GM
      # judges: +recall goblin=goblin lore). A success tells the character what the creature is and
      # its weakest defence, a critical success more; on a failure they recall nothing, and on a
      # critical failure the GM is told so they can mislead.
      DATA`RECALL`SKILLS: aberration~occultism animal~nature astral~occultism beast~arcana.nature celestial~religion construct~arcana.crafting dragon~arcana dream~occultism elemental~arcana.nature ethereal~occultism fey~nature fiend~religion fungus~nature humanoid~society monitor~religion ooze~occultism plant~nature shade~religion spirit~occultism time~occultism undead~religion
      INC`RECALL:
        value: |-
          think setq(recall_found,if(strlen(%q<enc>),if(strlen(setr(recall_at,u(%!/FUN`ENC`FIND,%q<cmd_what>))),if(cand(strmatch(u(%!/FUN`ENC`C,%q<recall_at>,kind),npc),not(u(%!/FUN`ENC`C,%q<recall_at>,hazard))),[u(%!/FUN`ENC`C,%q<recall_at>,pack)]~[u(%!/FUN`ENC`C,%q<recall_at>,id)])))); think setq(recall_found,firstof(%q<recall_found>,u(%!/FUN`ENC`CREATURE,%q<cmd_what>,1))); @assert strlen(%q<recall_found>)=@pemit %#=notice(PF2E,There is no creature called %q<cmd_what> here or in the books the game uses.,warn); think setq(recall_item,u({{core}}/FUN`ITEM`GET,first(%q<recall_found>,~),rest(%q<recall_found>,~))); think setq(recall_skills,u(%!/FUN`RECALL`SKILLS,%q<recall_item>)); think setq(recall_stat,firstof(u({{commands}}/FUN`COMMAND`STAT,%q<cmd_skill>),first(%q<recall_skills>))); @assert eq(words(%q<recall_stat>),1)=@pemit %#=notice(PF2E,There is no one skill called %q<cmd_skill>.,warn); @assert cor(member(%q<recall_skills>,%q<recall_stat>),strmatch(%q<recall_stat>,*-lore))=@pemit %#=notice(PF2E,[u({{commands}}/FUN`SHOW`STAT,%q<recall_stat>)] does not identify this creature. Try [itemize(iter(%q<recall_skills>,u({{commands}}/FUN`SHOW`STAT,%i0),%b,|),|,or)]%, or a Lore that fits.,warn); think setq(recall_dc,sub(u(%!/FUN`DC`OF,json_query(%q<recall_item>,extract,$.system.details.level.value),,json_query(%q<recall_item>,extract,$.system.traits.rarity)),if(strmatch(%q<recall_stat>,*-lore),2,0))); think u({{core}}/FUN`CHECK`PREPARE,u({{commands}}/FUN`LEDGER`OF,%#)); think setq(act_npc,); think u(%!/FUN`ACT`CHECK,%q<recall_stat>,%q<recall_dc>); @pemit %#=notice(PF2E,You try to recall what you know with [u({{commands}}/FUN`SHOW`STAT,%q<recall_stat>)]...%r[u(%!/FUN`RECALL`TELLS,%q<recall_item>,%q<roll_degree>)]); @include/nobreak %!/INC`RECALL`GM
        flags: [cmdsyntax]
      # The GM of the room's encounter hears every Recall Knowledge roll; a critical failure is flagged.
      INC`RECALL`GM:
        value: |-
          @break not(strlen(%q<enc>)); think setq(recall_gm,json_query(%q<enc>,extract,$.gm)); @break strmatch(%q<recall_gm>,objid(%#)); @pemit %q<recall_gm>=notice(PF2E,%N's Recall Knowledge about [json_query(%q<recall_item>,extract,$.name)] with [u({{commands}}/FUN`SHOW`STAT,%q<recall_stat>)]: [json_query(%q<roll_record>,extract,$.text)] vs DC %q<recall_dc>%, [lcstr(u(%!/FUN`ACT`DEGREE,%q<roll_degree>))].[if(eq(%q<roll_degree>,0),%b[tone(strong,They believe something false: tell them.)])],if(eq(%q<roll_degree>,0),warn,))
        flags: [cmdsyntax]
      FUN`RECALL`SKILLS:
        value: |-
          @@(%0 a creature: the skills that identify it, from its traits)[
          setunion(iter(json_map({{core}}/FUN`RULE`SELECTOR,firstof(json_query(%0,extract,$.system.traits.value),json(array)),%b),edit(after(grab(get(%!/DATA`RECALL`SKILLS),%i0~*),~),.,%b)),)]
        flags: [funsyntax]
      FUN`RECALL`TELLS:
        value: |-
          @@(%0 a creature, %1 the degree)[
          setq(recall_saves,iter(fortitude reflex will,[firstof(json_query(%0,extract,$.system.saves.%i0.value),0)]~%i0))][
          switch(%1,
            3, [u(FUN`RECALL`WHAT,%0)]%r[u(FUN`RECALL`DEFENCES,%0)]%rAC [json_query(%0,extract,$.system.attributes.ac.value)]%, best save [last(sort(%q<recall_saves>,n),~)]%, abilities: [firstof(itemize(u(FUN`RECALL`ABILITIES,%0),|),none of note)].,
            2, [u(FUN`RECALL`WHAT,%0)]%r[u(FUN`RECALL`DEFENCES,%0)],
            You don't recall anything useful.)]
        flags: [funsyntax]
      FUN`RECALL`WHAT:
        value: |-
          @@(%0 a creature)[
          It is [art(json_query(%0,extract,$.name))] [json_query(%0,extract,$.name)]%, a level [json_query(%0,extract,$.system.details.level.value)] [itemize(json_map({{core}}/FUN`RULE`SELECTOR,firstof(json_query(%0,extract,$.system.traits.value),json(array)),%b))]%, weakest save [rest(first(sort(%q<recall_saves>,n)),~)].]
        flags: [funsyntax]
      FUN`RECALL`DEFENCES:
        value: |-
          @@(%0 a creature: its weaknesses, resistances and immunities)[
          setqm(def_weak,u(FUN`RECALL`LIST,json_query(%0,extract,$.system.attributes.weaknesses)),def_resist,u(FUN`RECALL`LIST,json_query(%0,extract,$.system.attributes.resistances)),def_immune,json_map({{core}}/FUN`RULE`SELECTOR,firstof(json_query(%0,extract,$.system.attributes.immunities),json(array)),%b))][
          firstof(squish(trim([if(strlen(%q<def_weak>),Weak to %q<def_weak>.)] [if(strlen(%q<def_resist>),Resists %q<def_resist>.)] [if(words(%q<def_immune>),Immune to [itemize(iter(%q<def_immune>,json_query(%i0,extract,$.type)))].)])),No weaknesses%, resistances or immunities.)]
        flags: [funsyntax]
      FUN`RECALL`LIST:
        value: |-
          @@(%0 a list of {type, value}: as words)[
          if(strlen(%0),itemize(iter(lnum(json_query(%0,size)),[edit(json_query(%0,extract,$\[%i0\].type),-,%b)] [json_query(%0,extract,$\[%i0\].value)],%b,|),|))]
        flags: [funsyntax]
      FUN`RECALL`ABILITIES:
        value: |-
          @@(%0 a creature: its actions and abilities by name, separated by |)[
          setq(abil_store,u({{core}}/DATA`PACK`[ucstr(first(%q<recall_found>,~))]))][
          trim(squish(iter(lattr(%q<abil_store>/ITEM`[ucstr(json_query(%0,extract,$._id))]`EMBED`*),if(strmatch(json_query(get(%q<abil_store>/%i0),extract,$.type),action),json_query(get(%q<abil_store>/%i0),extract,$.name)),%b,|),|),|)]
        flags: [funsyntax]

      # --- DCs -----------------------------------------------------------------------------------
      FUN`DC`OF:
        value: |-
          @@(%0 a level, %1 a difficulty, %2 a rarity: the DC by level from GM Core)[
          add(extract(get({{core}}/DATA`DC`LEVEL),add(2,max(-1,min(25,%0))),1),firstof(after(grab(get({{core}}/DATA`DC`ADJUST),%1~*),~),0),firstof(after(grab(get({{core}}/DATA`DC`RARITY),%2~*),~),0))]
        flags: [funsyntax]
      FUN`DC`TEXT:
        value: |-
          @@(%0 a level and words naming a difficulty and a rarity: the longest difficulty the words hold, so very hard is not very easy)[
          setq(dc_level,first(%0))][
          setqm(dc_adjust,after(last(sort(iter(get({{core}}/DATA`DC`ADJUST),if(strmatch(%b[rest(%0)]%b,*%b[edit(first(%i0,~),-,%b)]%b*),[words(edit(first(%i0,~),-,%b))]~[first(%i0,~)])))),~),dc_rarity,first(iter(rest(%0),if(strlen(grab(get({{core}}/DATA`DC`RARITY),%i0~*)),%i0))))][
          if(cand(isint(%q<dc_level>),gte(%q<dc_level>,-1),lte(%q<dc_level>,25)),
            DC [u(FUN`DC`OF,%q<dc_level>,%q<dc_adjust>,%q<dc_rarity>)] for a level %q<dc_level> task[if(strlen(%q<dc_adjust>),%, [edit(%q<dc_adjust>,-,%b)])][if(strlen(%q<dc_rarity>),%, %q<dc_rarity>)].,
            A level is a whole number from -1 to 25.)]
        flags: [funsyntax]

      # --- What the commands draw ----------------------------------------------------------------
      FUN`SHOW`SIGNED:
        value: |-
          if(gte(%0,0),+%0,%0)
        flags: [funsyntax]
      FUN`JSON`KEY:
        value: |-
          %2
        flags: [funsyntax]
      FUN`SHOW`ENC:
        value: |-
          @@(the encounter: round, threat, and every combatant in order)[
          setq(show_acting,u(FUN`ENC`ACTING))][
          box(
            [fields(,
              GM,name(json_query(%q<enc>,extract,$.gm)),
              Round,if(json_query(%q<enc>,extract,$.round),json_query(%q<enc>,extract,$.round),not started),
              Threat,u(FUN`SHOW`THREAT))]%r[
            rule()]%r[
            if(u(FUN`ENC`COUNT),
              ldatatable(,>#|Init|Name|HP|Conditions,iter(u(FUN`ENC`INDEXES),u(FUN`SHOW`COMBATANT,%i0),%b,%r),%r),
              tone(muted,No one yet. +enc/join%, +enc/add <creature>.))],
            Encounter)]
        flags: [funsyntax]
      FUN`SHOW`COMBATANT:
        value: |-
          @@(%0 a combatant's index: one row)[
          if(eq(%0,%q<show_acting>),>)][u(FUN`ENC`C,%0,k)]|[if(isnum(setr(init_v,u(FUN`ENC`C,%0,init))),%q<init_v>,if(u(FUN`ENC`C,%0,simple),hazard,-))]|[u(FUN`ENC`C,%0,name)][if(u(FUN`ENC`C,%0,down),%b[tone(muted,%(down%))])]|[
          if(cor(%q<enc_gm>,strmatch(u(FUN`ENC`C,%0,side),pc)),
            if(u(FUN`ENC`C,%0,max),[u(FUN`ENC`C,%0,hp)]/[u(FUN`ENC`C,%0,max)][if(u(FUN`ENC`C,%0,temp),%b+[u(FUN`ENC`C,%0,temp)])],-),
            u(FUN`SHOW`HURT,u(FUN`ENC`C,%0,hp),u(FUN`ENC`C,%0,max)))]|[u(FUN`SHOW`CONDS,%0)]
        flags: [funsyntax]
      FUN`SHOW`CONDS:
        value: |-
          @@(%0 a combatant's index: their conditions and persistent damage, as a list)[
          setqm(show_conds,u(FUN`ENC`C,%0,conds),show_pers,u(FUN`ENC`C,%0,pers))][
          setq(show_fx,firstof(u(FUN`ENC`C,%0,fx),json(object)))][
          itemize(squish([if(t(u(FUN`ENC`C,%0,raised)),shield raised|)][iter(json_map(%!/FUN`JSON`KEY,%q<show_fx>,%b),u(FUN`FX`NAME,edit(json_query(%q<show_fx>,extract,$\["%i0"\].pack),",),%i0),%b,|)]|[iter(json_map(%!/FUN`JSON`KEY,%q<show_conds>,%b),%i0[if(json_query(%q<show_conds>,extract,$.%i0),%b[json_query(%q<show_conds>,extract,$.%i0)])],%b,|)]|[iter(json_map(%!/FUN`JSON`KEY,%q<show_pers>,%b),persistent [json_query(%q<show_pers>,extract,$.%i0)] %i0,%b,|)],|),|)]
        flags: [funsyntax]
      FUN`SHOW`LOOK:
        value: |-
          @@(%0 a combatant's index: their statistics in the encounter, with conditions and elite or weak)[
          setqm(act_at,%0,look_rows,)][
          u(FUN`ENC`PREPARE,%0)][
          setqm(look_npc,%q<act_npc>,look_hazard,u(FUN`ENC`C,%0,hazard))][
          u(FUN`SHOW`LOOK`ROW,Level,if(strlen(%q<look_npc>),[u(FUN`ENC`LEVEL,%0)][switch(u(FUN`ENC`C,%0,adj),2,%b%(elite%),-2,%b%(weak%))],u(FUN`ENC`PCLEVEL,%0)))][
          u(FUN`SHOW`LOOK`ROW,Traits,if(strlen(%q<look_npc>),u(FUN`SHOW`LOOK`TRAITS,%q<look_npc>)))][
          u(FUN`SHOW`LOOK`ROW,HP,if(u(FUN`ENC`C,%0,max),[u(FUN`ENC`C,%0,hp)] of [u(FUN`ENC`C,%0,max)][if(u(FUN`ENC`C,%0,temp),%, [u(FUN`ENC`C,%0,temp)] temporary)],none))][
          u(FUN`SHOW`LOOK`ROW,AC,if(cor(not(%q<look_hazard>),json_query(%q<look_npc>,extract,$.system.attributes.ac.value)),u(FUN`ACT`AC)))][
          u(FUN`SHOW`LOOK`ROW,Saves,u(FUN`SHOW`LOOK`SAVES))][
          u(FUN`SHOW`LOOK`ROW,Perception,if(not(%q<look_hazard>),[u(FUN`SHOW`SIGNED,u({{core}}/FUN`CHECK`TOTAL,u(FUN`ACT`STAT,perception)))][if(strlen(%q<look_npc>),u(FUN`SHOW`LOOK`SENSES,%q<look_npc>))]))][
          u(FUN`SHOW`LOOK`ROW,Stealth,if(%q<look_hazard>,DC [add(10,u({{core}}/FUN`CHECK`TOTAL,u(FUN`ACT`STAT,stealth)))] [u({{commands}}/FUN`SHOW`TEXT,json_query(%q<look_npc>,extract,$.system.attributes.stealth.details))]))][
          u(FUN`SHOW`LOOK`ROW,Skills,if(cand(strlen(%q<look_npc>),not(%q<look_hazard>)),itemize(iter(json_map(%!/FUN`JSON`KEY,firstof(json_query(%q<look_npc>,extract,$.system.skills),json(object)),%b),[u({{commands}}/FUN`SHOW`STAT,%i0)] [u(FUN`SHOW`SIGNED,u({{core}}/FUN`CHECK`TOTAL,u(FUN`ACT`STAT,%i0)))],%b,|),|)))][
          u(FUN`SHOW`LOOK`ROW,Speed,if(cand(strlen(%q<look_npc>),not(%q<look_hazard>)),u(FUN`SHOW`LOOK`SPEED,%q<look_npc>)))][
          u(FUN`SHOW`LOOK`ROW,Defences,if(strlen(%q<look_npc>),[u(FUN`RECALL`DEFENCES,%q<look_npc>)][if(json_query(%q<look_npc>,extract,$.system.attributes.hardness),%bHardness [json_query(%q<look_npc>,extract,$.system.attributes.hardness)].)]))][
          u(FUN`SHOW`LOOK`ROW,Conditions,u(FUN`SHOW`CONDS,%0))][
          u(FUN`SHOW`LOOK`ROW,Disable,if(%q<look_hazard>,u({{commands}}/FUN`SHOW`TEXT,json_query(%q<look_npc>,extract,$.system.details.disable))))][
          u(FUN`SHOW`LOOK`ROW,Routine,if(%q<look_hazard>,u({{commands}}/FUN`SHOW`TEXT,json_query(%q<look_npc>,extract,$.system.details.routine))))][
          setq(look_strikes,u(FUN`ACT`STRIKES))][
          setq(recall_found,[u(FUN`ENC`C,%0,pack)]~)][
          setq(look_abilities,if(strlen(%q<look_npc>),u(FUN`RECALL`ABILITIES,%q<look_npc>)))][
          box(
            [lfields(,iter(%q<look_rows>,first(%i0,~),|,|),iter(%q<look_rows>,rest(%i0,~),|,|),|)][
            if(cor(words(%q<look_strikes>,^),words(%q<look_abilities>,|)),
              %r[rule()]%r[squish(trim([if(words(%q<look_strikes>,^),Strikes:%r[iter(%q<look_strikes>,u(FUN`SHOW`LOOK`STRIKE,%i0),^,%r)])]%r[if(words(%q<look_abilities>,|),Abilities: [itemize(%q<look_abilities>,|)])],%r),%r)])],
            u(FUN`ENC`C,%0,name))]
        flags: [funsyntax]
      FUN`SHOW`LOOK`ROW:
        value: |-
          @@(%0 a label, %1 a value: adds the row when there is a value)[
          if(strlen(%1),setq(look_rows,[if(strlen(%q<look_rows>),%q<look_rows>|)]%0~%1))]
        flags: [funsyntax]
      FUN`SHOW`LOOK`TRAITS:
        value: |-
          @@(%0 a creature or hazard: its rarity, size and traits)[
          setq(look_rarity,json_query(%0,extract,$.system.traits.rarity))][
          itemize(squish([if(not(strmatch(%q<look_rarity>,common)),%q<look_rarity>)] [after(grab(tiny~tiny sm~small med~medium lg~large huge~huge grg~gargantuan,json_query(%0,extract,$.system.traits.size.value)~*),~)] [json_map({{core}}/FUN`RULE`SELECTOR,firstof(json_query(%0,extract,$.system.traits.value),json(array)),%b)]))]
        flags: [funsyntax]
      FUN`SHOW`LOOK`SAVES:
        value: |-
          @@(the prepared combatant's saves; a hazard's only those it has)[
          itemize(squish(iter(fortitude reflex will,if(cor(not(%q<look_hazard>),json_query(%q<look_npc>,extract,$.system.saves.%i0.value)),[u({{commands}}/FUN`SHOW`STAT,%i0)] [u(FUN`SHOW`SIGNED,u({{core}}/FUN`CHECK`TOTAL,u(FUN`ACT`STAT,%i0)))]),%b,|),|),|)]
        flags: [funsyntax]
      FUN`SHOW`LOOK`SENSES:
        value: |-
          @@(%0 a creature: its senses, as text after its Perception)[
          if(strlen(setr(look_senses,json_map(%!/FUN`SHOW`LOOK`SENSE,firstof(json_query(%0,extract,$.system.perception.senses),json(array)),|))),%b%([itemize(%q<look_senses>,|)]%))]
        flags: [funsyntax]
      FUN`SHOW`LOOK`SENSE:
        value: |-
          [edit(json_query(%1,extract,$.type),-,%b)][if(json_query(%1,extract,$.range),%b[json_query(%1,extract,$.range)] feet)]
        flags: [funsyntax]
      FUN`SHOW`LOOK`SPEED:
        value: |-
          @@(%0 a creature: its Speeds)[
          itemize(squish([json_query(%0,extract,$.system.attributes.speed.value)] feet|[json_map(%!/FUN`SHOW`LOOK`SPEED`ONE,firstof(json_query(%0,extract,$.system.attributes.speed.otherSpeeds),json(array)),|)],|),|)]
        flags: [funsyntax]
      FUN`SHOW`LOOK`SPEED`ONE:
        value: |-
          [json_query(%1,extract,$.type)] [json_query(%1,extract,$.value)] feet
        flags: [funsyntax]
      FUN`SHOW`LOOK`STRIKE:
        value: |-
          @@(%0 a Strike, name|attack|damage|traits|MAP step: as a line, with the attack after each multiple attack penalty)[
          setq(look_attack,elements(%0,2,|))][
          [first(%0,|)][if(elements(%0,7,|),%bx[elements(%0,7,|)])] [u(FUN`SHOW`SIGNED,%q<look_attack>)]/[u(FUN`SHOW`SIGNED,sub(%q<look_attack>,firstof(elements(%0,5,|),5)))]/[u(FUN`SHOW`SIGNED,sub(%q<look_attack>,mul(2,firstof(elements(%0,5,|),5))))][if(words(elements(%0,4,|)),%b%([itemize(elements(%0,4,|))]%))]%, [elements(%0,3,|)]]
        flags: [funsyntax]
      FUN`SHOW`BESTIARY:
        value: |-
          @@(best_text, best_low and best_high: the matching creatures and hazards, with XP against the encounter's characters)[
          null(u(FUN`SHOW`THREAT))][
          setq(best_rows,sort(squish(iter(get({{core}}/DATA`CREATURE`PACKS) [get({{core}}/DATA`HAZARD`PACKS)],u(FUN`BESTIARY`MATCH,%i0),%b,|),|),a,|))][
          setq(best_count,words(%q<best_rows>,|))][
          box(
            [if(%q<best_count>,
              ldatatable(,>Level|Name|Kind[if(strlen(%q<threat_level>),|>XP)],iter(extract(%q<best_rows>,1,30,|),[elements(%i0,2,~)]|[elements(%i0,3,~)]|[elements(%i0,4,~)][if(strlen(%q<threat_level>),|[u(FUN`XP`OF,elements(%i0,2,~),%q<threat_level>,strmatch(elements(%i0,4,~),simple*))])],|,%r),%r),
              tone(muted,No creature or hazard in the game's books matches.))][
            if(gt(%q<best_count>,30),%r[tone(muted,These are 30 of %q<best_count>. Give levels to narrow it%, such as =2-4.)])][
            if(strlen(%q<threat_level>),%r[rule()]%rFor [words(%q<threat_pcs>)] character[if(neq(words(%q<threat_pcs>),1),s)] at level %q<threat_level>: [u(FUN`THREAT`BUDGET,words(%q<threat_pcs>))] XP. The encounter has %q<threat_xp> XP.)],
            Bestiary)]
        flags: [funsyntax]
      FUN`BESTIARY`MATCH:
        value: |-
          @@(%0 a pack: its entries that match best_text, the levels and the game's books, each sortkey~level~name~kind, separated by |)[
          setqm(best_store,u({{core}}/DATA`PACK`[ucstr(%0)]),best_books,u({{core}}/DATA`CONFIG`BOOKS))][
          squish(iter(u(FUN`BESTIARY`INDEX,%0),
            if(cand(member(%q<best_books>,elements(%i0,5,~)),gte(elements(%i0,2,~),%q<best_low>),lte(elements(%i0,2,~),%q<best_high>),u(FUN`BESTIARY`FITS,%i0)),
              [rjust(add(elements(%i0,2,~),10),2,0)][elements(%i0,3,~)]~[elements(%i0,2,~)]~[elements(%i0,3,~)]~[elements(%i0,4,~)]),
            |,|),|)]
        flags: [funsyntax]
      FUN`BESTIARY`FITS:
        value: |-
          @@(%0 an index entry: 1 when best_text is empty, or in its name or kind, or one of its traits)[
          cor(not(strlen(%q<best_text>)),strmatch(elements(%0,3,~),*%q<best_text>*),strmatch(elements(%0,4,~),*%q<best_text>*),t(member(json_query(get(%q<best_store>/ITEM`[first(%0,~)]`PREP),extract,$.opts),item:trait:[lcstr(edit(%q<best_text>,%b,-))])))]
        flags: [funsyntax]
      FUN`BESTIARY`INDEX:
        value: |-
          @@(%0 a pack: id~level~name~kind~book for each creature or hazard in it, separated by |, kept in BESTIARY`<pack> while the pack holds as many items)[
          setqm(best_store,u({{core}}/DATA`PACK`[ucstr(%0)]),best_attr,BESTIARY`[ucstr(%0)])][
          setq(best_ids,lattr(%q<best_store>/ITEM`*`PREP))][
          if(cand(strlen(get(me/%q<best_attr>)),eq(get(me/%q<best_attr>`N),words(%q<best_ids>))),
            get(me/%q<best_attr>),
            [setq(best_built,iter(%q<best_ids>,u(FUN`BESTIARY`ROW,before(after(%i0,ITEM`),`PREP)),%b,|))][
            set(me,%q<best_attr>:%q<best_built>)][
            set(me,%q<best_attr>`N:[words(%q<best_ids>)])]%q<best_built>)]
        flags: [funsyntax]
      FUN`BESTIARY`ROW:
        value: |-
          @@(%0 an item's id in best_store: its index entry, read with patterns rather than parsed, for speed)[
          setq(row_json,get(%q<best_store>/ITEM`%0))][
          null(regmatch(%q<row_json>,"name":"%(\[^"\]*%)",0 row_name))][
          null(regmatch(%q<row_json>,"level":."value":%(-?\\d+%),0 row_level))][
          %0~[firstof(%q<row_level>,0)]~%q<row_name>~[if(strmatch(%q<row_json>,*"type":"hazard"*),if(strmatch(%q<row_json>,*"isComplex":true*),complex hazard,simple hazard),creature)]~[get(%q<best_store>/ITEM`%0`BOOK)]]
        flags: [funsyntax]
      FUN`SHOW`HURT:
        value: |-
          @@(%0 hit points, %1 the most: how hurt a creature looks)[
          switch(1,lte(%0,0),down,gte(%0,%1),unhurt,gte(mul(%0,2),%1),hurt,gte(mul(%0,4),%1),badly hurt,near death)]
        flags: [funsyntax]
      # The encounter's threat from GM Core's XP budget: each creature's XP by its level against the
      # characters' (their highest), against the budget for that many characters.
      FUN`SHOW`THREAT:
        value: |-
          @@(the threat, or a hint without characters and creatures: sets threat_pcs, threat_level and threat_xp)[
          setq(threat_pcs,iter(u(FUN`ENC`INDEXES),if(strmatch(u(FUN`ENC`C,%i0,side),pc),%i0)))][
          setq(threat_foes,iter(u(FUN`ENC`INDEXES),if(strmatch(u(FUN`ENC`C,%i0,kind),npc),%i0)))][
          setq(threat_level,if(words(%q<threat_pcs>),lmax(iter(%q<threat_pcs>,u(FUN`ENC`PCLEVEL,%i0)))))][
          setq(threat_xp,ladd(0 [iter(%q<threat_foes>,u(FUN`ENC`XP,%i0,%q<threat_level>))]))][
          if(cand(words(%q<threat_pcs>),words(%q<threat_foes>)),
            [u(FUN`THREAT`NAME,%q<threat_xp>,words(%q<threat_pcs>))] %(%q<threat_xp> XP for [words(%q<threat_pcs>)] at level %q<threat_level>%),
            tone(muted,add characters and creatures))]
        flags: [funsyntax]
      # GM Core's XP budgets: threat~XP for four characters~XP for each character more or fewer.
      DATA`THREAT: trivial~40~10 low~60~15 moderate~80~20 severe~120~30 extreme~160~40
      FUN`THREAT`NAME:
        value: |-
          @@(%0 XP, %1 how many characters: the threat it is for them)[
          firstof(last(iter(get(%!/DATA`THREAT),if(gte(%0,add(elements(%i0,2,~),mul(sub(%1,4),elements(%i0,3,~)))),first(%i0,~)))),trivial)]
        flags: [funsyntax]
      FUN`THREAT`BUDGET:
        value: |-
          @@(%0 how many characters: each threat's XP for them)[
          itemize(iter(get(%!/DATA`THREAT),[first(%i0,~)] [add(elements(%i0,2,~),mul(sub(%0,4),elements(%i0,3,~)))],%b,|),|)]
        flags: [funsyntax]
      FUN`ENC`XP:
        value: |-
          @@(%0 a creature or hazard's index, %1 the party's level: its XP)[
          u(FUN`XP`OF,u(FUN`ENC`LEVEL,%0),%1,u(FUN`ENC`C,%0,simple))]
        flags: [funsyntax]
      FUN`ENC`AWARD`XP:
        value: |-
          @@(after FUN`SHOW`THREAT: the XP each character earns, the encounter's XP scaled to four characters)[
          if(words(%q<threat_pcs>),div(mul(%q<threat_xp>,4),words(%q<threat_pcs>)),0)]
        flags: [funsyntax]
      FUN`ENC`FOES:
        value: |-
          @@(the creatures and hazards in the encounter by name)[
          itemize(setunion(trim(squish(iter(u(FUN`ENC`INDEXES),if(strmatch(u(FUN`ENC`C,%i0,kind),npc),json_query(u(FUN`ENC`ITEM,%i0),extract,$.name)),%b,|),|),|),,|),|)]
        flags: [funsyntax]
      FUN`XP`OF:
        value: |-
          @@(%0 a level, %1 the party's level, %2 1 for a simple hazard: the XP from GM Core's tables, none more than four levels below the party)[
          setq(xp_diff,sub(%0,%1))][
          if(lt(%q<xp_diff>,-4),0,extract(if(%2,2 3 4 6 8 12 16 24 32,10 15 20 30 40 60 80 120 160),add(5,min(4,%q<xp_diff>)),1))]
        flags: [funsyntax]
      FUN`ENC`PCLEVEL:
        value: |-
          @@(%0 a character combatant's index: their level when they joined)[
          setq(enc_snap,u(FUN`ENC`C,%0,snap))][
          u({{core}}/FUN`SHEET`LEVEL,u({{core}}/FUN`SHEET`ENTRIES,\[[json_map(%!/FUN`ENC`LEDGER`KEEP,u({{commands}}/FUN`LEDGER`OF,u(FUN`ENC`C,%0,who)),\,)]\]))]
        flags: [funsyntax]
      FUN`SHOW`EXPLORE:
        value: |-
          @@(what everyone here is doing while exploring)[
          box(
            [ldatatable(,Name|Activity,iter(lcon(%l,connect),[name(%i0)]|[firstof(capstr(u(FUN`EXPLORE`NAME,get(%i0/PF2E`EXPLORE))),tone(muted,none))],%b,%r),%r)]%r[
            rule()]%r[
            tone(muted,+explore/set <activity> to choose one: [itemize(iter(get(%!/DATA`EXPLORE),elements(%i0,2,~),|,|),|)].)],
            Exploration)]
        flags: [funsyntax]
      FUN`SHOW`CHALLENGE:
        value: |-
          @@(the skill challenge here)[
          setq(show_options,json_query(%q<vp>,extract,$.options))][
          box(
            [fields(,
              Victory points,[json_query(%q<vp>,extract,$.vp)] of [json_query(%q<vp>,extract,$.goal)],
              Round,json_query(%q<vp>,extract,$.round),
              Rolled this round,firstof(itemize(iter(json_query(%q<vp>,extract,$.rolled),name(%i0),%b,|),|),tone(muted,no one)),
              Skills,firstof(itemize(squish([iter(json_map(%!/FUN`JSON`KEY,%q<show_options>,%b),[u({{commands}}/FUN`SHOW`STAT,%i0)] DC [json_query(%q<show_options>,extract,$.%i0)],%b,|)]|[if(isint(json_query(%q<vp>,extract,$.dc)),any other skill DC [json_query(%q<vp>,extract,$.dc)])],|),|),tone(muted,none set yet)))],
            json_query(%q<vp>,extract,$.name))]
        flags: [funsyntax]
  # The help topics, a HELP tree for +help: HELP`PF2E`BUILD is "pf2e build". The pf2e-help package
  # registers this object with +help. Bodies are evaluated, so a literal bracket is \[ and \].
  - ref: pf2e_help
    type: thing
    name: PF2e Help
    location: "{{commands}}"
    attributes:
      HELP: |-
        Pathfinder Second Edition: building a character, the sheet, checks, encounters, exploration, skill challenges, Recall Knowledge, awards and levels.
      SEE: |-
        Cross-references. One leaf per topic.
      HELP`PF2E: |-
        This game plays Pathfinder Second Edition, with the rules of Player Core, Player Core 2, GM Core and Monster Core as Foundry VTT's pf2e system has them.

        - `+build` makes your character, one choice at a time: `+help pf2e build`.
        - `+sheet` shows it and `+check` rolls against it: `+help pf2e sheet`, `+help pf2e check`. `+toggle` turns your situational feats on and off: `+help pf2e toggle`.
        - `+spells`, `+prepare` and `+cast` are for casters, `+rest` begins a new day: `+help pf2e spells`, `+help pf2e day`.
        - `+deity` lists the game's deities, which clerics and champions follow: `+help pf2e deity`.
        - `+alchemy` makes alchemical items from your formula book: `+help pf2e alchemy`.
        - `+enc` runs a fight: `+help pf2e enc`. GMs build one from the bestiary and run it: `+help pf2e enc build`, `+help pf2e enc gm`.
        - `+explore`, `+challenge` and `+recall` cover exploration, skill challenges and Recall Knowledge.
        - `+dc` gives the DC for a task of a level.
        - Staff give experience and money with `+pf2e/award`, and you spend them with `+build/level` and `+build/upgrade`: `+help pf2e advance`.

        Your sheet is a ledger: every choice is an entry, and nothing is ever overwritten. Money and experience have ledgers of their own. `+pf2e/ledger` shows the sheet's, `+pf2e/ledger money` and `+pf2e/ledger xp` the others with their totals.
      SEE`PF2E: |-
        pf2e build|pf2e sheet|pf2e enc|pf2e spells|pf2e cast|pf2e deity|pf2e alchemy
      HELP`PF2E`BUILD: |-
        `+build` makes your character. Type it on its own to see every step, what is done and what to type next.

        ## Steps

        - `+build/ancestry <name>`, `+build/heritage <name>`, `+build/background <name>`, `+build/class <name>`. The start of a name is enough when only one fits: `+build/heritage ancient`. What each brings comes with it.
        - `+build/boost ancestry=<attributes>`, `+build/boost background=<attributes>`, `+build/boost class=<attribute>`, `+build/boost 1=<four attributes>`. Type a set on its own, such as `+build/boost background`, to see what it asks for.
        - `+build/skills <skill> <skill> ...`: every skill your class lets you choose, in one line. The skills you are already trained in show on `+build/list skills`.
        - `+build/language <name> ...`: your extra languages, in one line.
        - `+build/feat <slot>=<name>`: a feat for a slot, such as `+build/feat class-1=Sudden Charge`. `+build/list feats class-1` lists only the feats whose prerequisites you meet.
        - `+build/choose <number or name>=<option>`: a choice a feature asks for, such as `+build/choose instinct=giant` or `+build/choose deity=Solenne` (`+help pf2e deity`). `+build/list choice instinct` lists the options.
        - `+build/spell <name>`, `+build/unspell <name>`: the spells a spontaneous caster, a wizard or a witch knows, and focus spells. `+build/list spells 1` lists the rank 1 spells of your tradition, `+build/list spells cantrips` the cantrips, `+build/list spells 1 any` every tradition's. A spontaneous caster learns as many spells of a rank as they have slots, a wizard's spellbook and a witch's familiar hold 10 cantrips and 5 spells plus 2 a level. A cleric or druid learns none: they prepare any common spell of their tradition.
        - `+build/signature <spell>\[ at <rank>\]`: a signature spell, with the Signature Spells feature.
        - `+build/formula <item>`, `+build/unformula <item>`: formulas for alchemical items of your level or lower, four from Alchemical Crafting and two a level from an alchemist's formula book.

        ## Gear

        You start with 15 gp. `+build/list gear <text>` finds items, `+build/buy <item>\[=<count>\]`, `+build/sell <item>\[=<count>\]`, `+build/equip <item>=<held, worn or carried>`. Armor you buy is worn and a shield held when you have none; the rest is carried. Once the sheet is finished, selling gives half the price.

        ## Along the way

        `+build/info <name>` describes anything. `+build/undo <step>` takes a step back, with everything that came with it. `+build/done` finishes the sheet; after that only staff change a choice already made, and each new level adds its own steps.

        Example:

        `+build/class Fighter`

        Output: `\[PF2E\] Done: Class: Fighter.`
      SEE`PF2E`BUILD: |-
        pf2e sheet|pf2e advance
      HELP`PF2E`SHEET: |-
        `+sheet` shows your character: level and experience, ancestry, background, class and deity, traits, size, attributes, hit points, AC with the armor worn, the shield held, Speed and other movement, class DC, spell attack and DC, senses, weaknesses, resistances and immunities, every skill and save with its rank and modifier, Lores, Strikes, languages, money, gear, spells by rank, feats and features, actions and conditions.

        - Every weapon has a Strike, held ones first; one that is carried says so, because you draw it before you Strike with it.
        - `+sheet` shows your own; staff add a name: `+sheet Amiri`.
        - Rules the game does not apply yet are listed at the end, so a sheet never looks finished when it is not.
      SEE`PF2E`SHEET: |-
        pf2e check|pf2e build
      HELP`PF2E`CHECK: |-
        `+check <statistic>\[=<DC>\]` rolls a d20 with every modifier that counts, and against a DC tells you the degree of success.

        - A statistic is a skill, a save, Perception or a Lore: `+check athletics`, `+check will=18`, `+check society lore=15`.
        - The modifiers that counted are listed under the roll; Foundry's stacking rules decide which.
        - Fortune and misfortune roll two d20s and keep the higher or the lower. When both apply, neither does.
        - A feat or effect can change the degree, such as a success at Fortitude that becomes a critical success. The roll names it and what was rolled.
        - Notes from your feats and effects follow the roll when they apply to its result.
        - `with <name>` uses something that replaces the d20, such as Assurance: `+check athletics with assurance=20`. A rule that must replace it does so on its own.
        - What your toggles turn on counts: `+help pf2e toggle`.

        Example:

        `+check athletics with assurance=20`

        Output:

        ```
        \[PF2E\] Tess rolls Athletics: 10 + 9 = 19 (Fortune (Assurance)) vs DC 20: Failure (roll 10)
        Expert +9
        ```
      SEE`PF2E`CHECK: |-
        pf2e sheet|pf2e toggle|pf2e dc
      HELP`PF2E`TOGGLE: |-
        `+toggle` lists what you can turn on and off: a feat or effect that applies only when you say so, such as Bashing Charge or a stance's choice.

        - `+toggle <name>` turns one on or off. The start of the name is enough.
        - `+toggle <name>=<choice>` turns it on with that choice; `=on` and `=off` say which.
        - Some are always on, and you pick only the choice. Some cannot be changed while something else holds.
        - In an encounter, `+enc/toggle <name>` changes the encounter's copy only; your sheet keeps its own.
        - Staff add a name: `+toggle Tess/Bashing Charge`.

        Example:

        `+toggle devise=skill`

        Output:

        `\[PF2E\] Done: Devise a Stratagem: on, Skill.`
      SEE`PF2E`TOGGLE: |-
        pf2e check|pf2e enc
      HELP`PF2E`ENC: |-
        `+enc` runs a fight in the room. The encounter keeps its own copy of everyone in it: hit points, conditions, dying and the consumables used never touch a sheet, and the encounter stays as it is, across days, until whoever runs it ends it. The GM's commands are in `+help pf2e enc build` and `+help pf2e enc gm`.

        ## Taking part

        - `+enc/join` puts your character in.
        - `+enc` shows the order, hit points, conditions and the threat. A creature shows only how hurt it looks.
        - `+enc/init <your name>=<skill>` rolls your initiative with a skill. Otherwise it is Perception, or Stealth when Avoiding Notice, with +1 when a Scout is with you.
        - `+enc/look` shows your statistics as the encounter has them, conditions counted; `+enc/look <who>` another character's.

        ## On your turn

        - `+enc/strike <target>\[=<Strike>\]`: a Strike against the target's AC, with the multiple attack penalty. A hit deals damage, doubled on a critical hit, and a creature's weaknesses, resistances and immunities count. Damage dice and changes from feats and effects count too, such as deadly and fatal dice, precision damage against an off-guard target, or a die size raised. The line shows the formula that was rolled, such as `2*(1d10+4)+2d10 piercing, 2d10 bleed`.
        - `+enc/check <who>=<statistic> \[vs <DC>\]`: a check or save with your conditions.
        - `+enc/toggle \[<who>:\]<name>\[=<choice>\]`: a toggle in the encounter's copy, as `+help pf2e toggle` has it.
        - `+enc/save <who>=<save> vs <DC> \[<damage>\]`: a save for everyone named, such as a spell's targets. Name several with commas, or `foes`, `characters` or `everyone`. With damage it is a basic save from one roll: none on a critical success, half on a success, double on a critical failure.
        - `+enc/use <item>`: drinks, eats or uses a consumable from the encounter's copy, or an item you made today. A healing item heals, and a mutagen or elixir gives its effect.
        - Bombs and versatile vials are Strikes: `+enc/strike <target>=<bomb>` throws one and uses it up. A hit adds the splash and persistent damage; a failure still splashes the target.
        - `+cast <spell>=<targets>` casts from the encounter's copy of your day: `+help pf2e spells`.
        - `+enc/act <action>`: an action that brings an effect, such as Rage or a stance. `+enc/act` on its own lists yours. `+enc/effect <your name>=-<effect>` ends one early.
        - `+enc/raise`: Raise a Shield on your turn, or as a reaction with Reactive Shield. The shield you hold adds its bonus to your AC until your next turn starts.
        - `+enc/delay` waits until after the next in line, and `+enc/next` ends your turn.

        Example:

        `+enc/save foes=reflex vs 21 6d6 fire`

        Output:

        ```
        \[PF2E\] Basic Reflex save against DC 21, 6d6\[1, 3, 6, 5, 6, 1\] = 22 fire:
        Forest Troll: 1d20\[8\] + 11 = 19, failure, full damage 22, with weakness to fire +10: 32. Forest Troll takes 32 damage.
        Elite Goblin Warrior #2: 1d20\[16\] + 9 = 25, success, half damage 11. Elite Goblin Warrior #2 takes 11 damage.
        ```

        Damage to a dying character raises dying by 1, or 2 on a critical hit; at dying 4 they die. Healing wakes them, wounded 1 more.
      SEE`PF2E`ENC: |-
        pf2e enc build|pf2e enc gm|pf2e recall
      HELP`PF2E`ENC`BUILD: |-
        Building an encounter. `+enc/start` begins one in the room, and you run it; staff can run any.

        - `+enc/bestiary <name, trait or hazard>\[=<levels>\]` lists the creatures and hazards in the game's books with their levels. Once characters have joined, it adds the XP each is worth against them and their budget. `=5` is one level, `=2-4` a range.
        - `+enc/add <creature>\[=<count>\]\[ elite or weak\]` adds up to 12 at a time. Elite gives +2 to AC, attacks, damage, saves, Perception and skills, more Hit Points by level, and a level more for XP; weak the opposite. `+enc/add Elite Goblin Warrior` works too.
        - `+enc/add <hazard>` adds a hazard. A complex hazard rolls Stealth for initiative and takes turns; a simple hazard stays out of the turn order. Hardness comes off damage to either.
        - `+enc/add <player>` adds a character, and `+enc/remove <who>` takes anyone out. When the one removed was acting, the next turn starts.
        - `+enc` shows the threat, from GM Core's XP budget: each creature's and hazard's XP by its level against the characters' highest, against the budget for that many characters.

        Example:

        `+enc/bestiary troll`

        Output:

        ```
        Level  Name             Kind       XP
            5  Forest Troll     creature   30
           10  Troll Warleader  creature  160
        For 3 characters at level 6: trivial 30, low 40, moderate 60, severe 90, and extreme 120 XP. The encounter has 54 XP.
        ```
      SEE`PF2E`ENC`BUILD: |-
        pf2e enc gm|pf2e enc
      HELP`PF2E`ENC`GM: |-
        Running an encounter you started.

        - `+enc/init` rolls initiative for everyone without it, and `+enc/next` starts the next turn. At the start of a turn a creature's regeneration or fast healing heals it, unless damage of a type that stops its regeneration hit it since its last turn, and a dying character makes a recovery check. At the end of a turn persistent damage is rolled with its flat check, and frightened goes down.
        - `+enc/look <creature>` shows its statistics, Strikes and abilities, elite or weak and conditions counted. Only you see a creature's; characters use `+recall`.
        - `+enc/strike <who>:<target>\[=<Strike>\]` Strikes for anyone, such as `+enc/strike 4:Amiri=Jaws`. A creature immune to critical hits takes a critical hit as a hit.
        - `+enc/damage <who>=<amount or formula>` and `+enc/heal <who>=<amount or formula>`. A typed formula such as `2d6 fire` meets weaknesses, resistances and immunities. `+enc/damage/half` halves the damage, rounded down, and `+enc/damage/double` doubles it, both before weaknesses and resistances.
        - `+enc/cond <who>=<condition>\[ <value>\]\[/<rounds>\]`, where a value of 0 takes it off, and `+enc/persist <who>=<formula> <type>`, where `0 <type>` ends it.
        - `+enc/effect <who>=<effect>` gives anyone an effect from Foundry's effects, such as `+enc/effect Amiri=Inspire Courage`; `=-<effect>` ends it. Effects end on their own when their rounds are over.
        - `+enc/keep \[<who>\]` writes characters' Hit Points, wounded, the day's spells, Focus Points and items made, and the consumables used, back to their sheets. Without it, a fight leaves sheets as they were.
        - `+enc/undo` and `+enc/redo` step through the last 20 changes.
        - `+enc/award \[<XP>\] \[<reason>\]` writes the encounter's XP into each character's XP ledger, once: what the creatures and hazards are worth scaled to four characters, as GM Core does for other party sizes, or the amount given.
        - `+enc/end` ends the encounter, and tells you when no XP was given.

        Example:

        `+enc/award`

        Output: `\[PF2E\] Done: God gives each character in the encounter 72 XP, written in their XP ledgers.`
      SEE`PF2E`ENC`GM: |-
        pf2e enc build|pf2e advance|pf2e enc
      HELP`PF2E`SPELLS: |-
        `+spells` shows your spell attack and DC, your cantrips, the slots of each rank with what is in them and how many are left, Divine Font and your Focus Points.

        - A prepared caster fills slots with `+prepare <spell>\[ at <rank>\]`, a cantrip in a cantrip slot. `+prepare/clear \[<rank> or cantrips\]` empties them.
        - A spontaneous caster casts any spell they know at a rank they know it at; a signature spell at any rank from its own.
        - Prepare before joining an encounter: the encounter keeps the copy of your day it had when you joined.
        - `+cast` casts one: `+help pf2e cast`.
      SEE`PF2E`SPELLS: |-
        pf2e cast|pf2e day|pf2e build
      HELP`PF2E`CAST: |-
        `+cast <spell>\[ at <rank>\]\[ with <n> actions\]\[ as <form>\]\[=<targets>\]`

        - A spell attack rolls against each target's AC with your multiple attack penalty; a save is rolled for each target against your spell DC, with the damage of a basic save.
        - The damage is rolled once for every target, with what your feats and effects add to spell damage, such as a status bonus to damage.
        - Heal and Harm heal allies and harm foes. Name targets with commas, or `foes`, `characters` or `everyone`.
        - A spell that brings an effect, such as Animal Form, Mystic Armor or Bless, gives it to an ally you name, or you. Name the form when there are several: `+cast animal form as ape`. A battle form gives its Strikes, AC, skills and Speed until it ends.
        - Outside an encounter `+cast` spends from your sheet's day and heals the characters you name.

        Example:

        `+cast force barrage with 3 actions=Goblin Warrior`

        Output:

        ```
        \[PF2E\] Ezren casts Force Barrage (rank 1, 3 actions; 1 more prepared at rank 1) on Goblin Warrior.
        Damage 3d4\[3, 1, 2\] + 3 = 9 force.
        Goblin Warrior takes 9 damage and is down.
        ```
      SEE`PF2E`CAST: |-
        pf2e spells|pf2e enc
      HELP`PF2E`DAY: |-
        Your day lives on your sheet beside the ledger: Hit Points, wounded, the spells prepared and cast, Divine Font and Focus Points spent, and the items made with alchemy.

        - `+rest`: a night's rest and your daily preparations. You regain Hit Points equal to your Constitution modifier (at least 1) times your level, every spell slot and Focus Point comes back, and what alchemy made yesterday is gone.
        - `+refocus`: 10 minutes to regain a Focus Point.
        - `+heal \[<player>=\]<hit points or formula>`: healing outside an encounter, such as Treat Wounds: `+heal Amiri=2d8`.
        - `+sheet` shows Hit Points now beside the most.

        In an encounter the fight has its own copy of your day; the GM's `+enc/keep` writes it back.
      SEE`PF2E`DAY: |-
        pf2e spells|pf2e alchemy|pf2e enc gm
      HELP`PF2E`ALCHEMY: |-
        `+alchemy` shows your formula book, your versatile vials and Advanced Alchemy left today, and the items made today.

        - `+build/formula <item>` adds a formula: an alchemical item of your level or lower.
        - `+alchemy/make <item>\[=<count>\]`: Advanced Alchemy at your daily preparations, from your formulas, up to 4 plus your Intelligence modifier items a day.
        - `+alchemy/quick <item>`: Quick Alchemy for one versatile vial, on your turn in an encounter.
        - What you make lasts until your next `+rest`. In an encounter, `+enc/use` drinks an elixir or mutagen, and a bomb or a versatile vial is a Strike: `+enc/strike <target>=<bomb>`.

        Example:

        `+alchemy/make alchemist's fire=3`

        Output: `\[PF2E\] Done: You make 3 Alchemist's Fire (Lesser) with Advanced Alchemy. 1 left today; what you make lasts until your next daily preparations.`
      SEE`PF2E`ALCHEMY: |-
        pf2e day|pf2e enc|pf2e build
      HELP`PF2E`EXPLORE: |-
        `+explore` shows what everyone in the room is doing while exploring.

        - `+explore/set <activity>`: Avoid Notice, Defend, Detect Magic, Follow the Expert, Investigate, Repeat a Spell, Search, Scout, Hustle or Track. Avoid Notice rolls Stealth for initiative, and Scout gives every character +1 to it.
        - `+explore/stop` stops.
        - `+explore/search <DC>`: the GM's secret Perception check for everyone here who is Searching. Only the GM sees the rolls.
      SEE`PF2E`EXPLORE: |-
        pf2e enc|pf2e challenge
      HELP`PF2E`CHALLENGE: |-
        `+challenge` runs a skill challenge with victory points, as GM Core describes them.

        - `+challenge/start <name>=<points>`: a challenge won at that many victory points.
        - `+challenge/option <skill>=<DC>`: a skill that helps, and its DC; `*=<DC>` for any other skill, and a DC of 0 takes one off.
        - `+challenge/roll <skill>`: one check a round each. A critical success earns 2 points, a success 1, a failure none, and a critical failure loses 1.
        - `+challenge/round` starts the next round; `+challenge/end` ends it.
      SEE`PF2E`CHALLENGE: |-
        pf2e explore|pf2e dc
      HELP`PF2E`RECALL: |-
        `+recall <creature>\[=<skill>\]` tries to remember what you know about a creature in the encounter or in the books.

        - The skill comes from the creature's traits: Arcana for a dragon, Religion for undead, Society for a humanoid. A Lore that fits works too, at an easier DC: `+recall goblin warrior=goblin lore`.
        - The DC is the creature's level DC, harder for uncommon, rare and unique creatures.
        - A success tells you what it is, its weakest save and its weaknesses, resistances and immunities; a critical success adds its AC, best save and abilities. On a failure you recall nothing. The GM running the encounter sees every roll.
      SEE`PF2E`RECALL: |-
        pf2e enc|pf2e dc
      HELP`PF2E`DC: |-
        `+dc <level> \[difficulty\] \[rarity\]` gives a DC from GM Core's table.

        Difficulties: incredibly easy, very easy, easy, hard, very hard, incredibly hard. Rarities: uncommon, rare, unique.

        Example:

        `+dc 5 hard`

        Output: `\[PF2E\] DC 24 for a level 5 task, hard.`
      SEE`PF2E`DC: |-
        pf2e check|pf2e challenge
      HELP`PF2E`ADVANCE: |-
        Experience and money come from staff, and you spend them.

        - `+build/level`: a new level, for 1000 XP. The XP is spent, and `+build` then lists what the level brings: feats, boosts, skill increases.
        - `+build/upgrade <item>=<rune>`: a fundamental rune on a weapon or armor. A weapon takes `+1`, `+2` or `+3` and `striking`, `greater striking` or `major striking`; armor takes `+1`, `+2` or `+3` and `resilient`, `greater resilient` or `major resilient`. You pay the new rune's price less the old one's, and a rune above your level is refused.
        - `+build/buy` and `+build/sell` keep working after the sheet is finished.

        `+sheet` shows your XP beside your level. Every award, purchase and level is in your money or experience ledger with its reason: `+pf2e/ledger xp`, `+pf2e/ledger money`.

        Example:

        `+build/upgrade greataxe=+1`

        Output: `\[PF2E\] Done: Greataxe has +1 potency now, for 35 gp.`
      SEE`PF2E`ADVANCE: |-
        pf2e staff|pf2e build
      HELP`PF2E`STAFF: |-
        `+pf2e` is for staff: awards, changing a sheet by hand and reading the rules feed.

        - `+pf2e/award <players>=<amount> <unit> <reason>`: experience (`xp`) or money (`pp`, `gp`, `sp`, `cp`) for each player named, written to their experience or money ledger with the reason and who gave it. A negative amount takes away: `+pf2e/award Amiri Lini=80 xp Drove off the goblins`.
        - `+pf2e/level <player>/<level>`, `+pf2e/ability <player>/<attribute>=<modifier>`, `+pf2e/rank <player>/<statistic>=<rank>`, `+pf2e/grant <player>/<pack>/<item>\[=<value>\]` and `+pf2e/revoke <player>/<entry>` add entries to a ledger.
        - `+pf2e/hp <player>/<hit points>` sets Hit Points outside an encounter.
        - `+pf2e/ledger <player>\[=money or xp\]` lists the sheet's ledger, or the money or experience ledger with its total.
        - `+pf2e/update` reads Foundry's content again from the feed.
        - `+deity/create`, `+deity/set`, `+deity/destroy` and `+deity/samples` keep the deity table: `+help pf2e deity staff`.
      SEE`PF2E`STAFF: |-
        pf2e advance|pf2e deity staff|pf2e
      HELP`PF2E`DEITY: |-
        `+deity` lists the game's deities. `+deity <name>` shows one: Divine Font, sanctification, domains, favored weapon, divine skill and cleric spells.

        A cleric or champion chooses theirs while building: `+build/choose deity=<name>`. The deity decides:

        - which sanctification they may choose, and a cleric's Divine Font, heal or harm;
        - the domains Domain Initiate offers, and `+build` then names the domain spell to learn;
        - the divine skill, which they are trained in;
        - the favored weapon: a cleric is trained in it, and a champion's Deific Weapon makes a simple one deal a bigger die;
        - the cleric spells, which a cleric can prepare whatever their tradition.

        `+sheet` shows the deity beside the class.

        Example:

        `+build/choose deity=Solenne`

        Output: `\[PF2E\] Done: Deity (Cleric): Solenne.`
      SEE`PF2E`DEITY: |-
        pf2e build|pf2e spells|pf2e deity staff
      HELP`PF2E`DEITY`STAFF: |-
        Pathfinder's own deities are Paizo's, so each game keeps a table of its own. Staff fill it in.

        - `+deity/samples` adds nine sample deities with names of their own, such as Solenne the Dawnmother and Brannoch Stormfist. Change them, or use them as worked examples.
        - `+deity/create <name>` adds a deity.
        - `+deity/set <deity>/<field>=<value>` fills one field. An empty value clears it.
        - `+deity/destroy <deity>` removes one. A character who chose it gets nothing from it until it is added again.

        ## Fields

        - `font`: `heal`, `harm`, `heal harm` or `none`.
        - `sanctification`: `none`, or `can` or `must` with `holy`, `unholy` or both: `can holy`.
        - `domains` and `alternate`: domains from Player Core, such as `fire healing sun truth`.
        - `weapon`: weapon names separated by `|`, or `fist`.
        - `skill`: one skill, such as `medicine`.
        - `spells`: `<rank> <spell>` separated by `|`: `1 Breathe Fire|3 Fireball`.
        - `name`, `title` and `text`: what `+deity <name>` shows. Put edicts and anathema in the text.

        Example:

        `+deity/set Solenne/domains=fire healing sun truth`

        Output: `\[PF2E\] Done: Solenne: domains set to Fire, Healing, Sun, and Truth.`
      SEE`PF2E`DEITY`STAFF: |-
        pf2e deity|pf2e staff

