          $(?is)^\+pf2e(/\S*)?(?\: +(.*))?$:think setqm(cmd_switch,lcstr(after(%1,/)),cmd_args,trim(%2)); @assert match(level ability rank grant revoke ledger update award hp,%q<cmd_switch>)=@pemit %#=notice(PF2E,There is no +pf2e/%q<cmd_switch>. The switches are /award%, /level%, /ability%, /rank%, /grant%, /revoke%, /hp%, /ledger and /update.,warn); think u(%!/FUN`COMMAND`TARGET); @include %!/INC`PF2E`%q<cmd_switch>
        flags: [regexp, cmdsyntax]
      # +deity lists the game's deities and +deity <name> shows one; staff keep the table with /create, /set,
      # /destroy and /samples. The table is DEITY`<slug> on the core (FUN`DEITY`GET).
      CMD`DEITY:
        value: |-
          $(?is)^\+deit(?\:y|ies)(/\S*)?(?\: +(.*))?$:think setqm(cmd_switch,lcstr(after(%1,/)),cmd_args,trim(%2)); @assert cor(not(strlen(%q<cmd_switch>)),match(create set destroy samples,%q<cmd_switch>))=@pemit %#=notice(PF2E,There is no +deity/%q<cmd_switch>. Staff have /create%, /set%, /destroy and /samples.,warn); @assert cor(not(strlen(%q<cmd_switch>)),permission(%#,softcode.pf2e.staff))=@pemit %#=notice(PF2E,Only staff change the deities.,error); @include %!/INC`DEITY`[firstof(%q<cmd_switch>,show)]
        flags: [regexp, cmdsyntax]
      INC`DEITY`SHOW:
        value: |-
          @assert words(setr(deity_all,u({{core}}/FUN`DEITY`ALL)))=@pemit %#=notice(PF2E,The game has no deities yet.[if(permission(%#,softcode.pf2e.staff),%b+deity/create <name> adds one%, and +deity/samples adds nine samples to start from.,%bStaff add them.)],warn); @assert strlen(%q<cmd_args>)=@pemit %#=u(%!/FUN`DEITY`LIST,%q<deity_all>); think setq(deity_slug,u({{core}}/FUN`DEITY`FIND,%q<cmd_args>)); @assert strlen(%q<deity_slug>)=@pemit %#=notice(PF2E,There is no deity called %q<cmd_args>. +deity lists them.,warn); @pemit %#=u(%!/FUN`DEITY`SHOW,%q<deity_slug>)
        flags: [cmdsyntax]
