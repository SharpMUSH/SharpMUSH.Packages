format: "1.16"
package: pf2e
title: Pathfinder 2e rules
version: 0.1.0
authors: [SharpMUSH]
description: "Pathfinder Second Edition rules in softcode, read the way Foundry VTT's pf2e system reads them, with character sheets kept as a ledger: +sheet, +check and +pf2e."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [pf2e, pathfinder, rules, dice]
requires_server: ">=1.0"

# One permission, for staff: see and change any character's sheet. Wizards and royalty hold it. A game
# that takes it back with @role/clear wizard=softcode.pf2e.staff keeps it that way through updates.
categories:
  permissions:
    - name: Pathfinder 2e
      description: Pathfinder 2e character sheets.
permissions:
  - name: softcode.pf2e.staff
    category: Pathfinder 2e
    description: See and change any character's Pathfinder 2e sheet.
grants:
  wizard: [softcode.pf2e.staff]
  royalty: [softcode.pf2e.staff]

objects:
  # The rules core. Every function takes Foundry's own data as Foundry stores it (a predicate is the
  # JSON array from a rule element, a modifier is Foundry's modifier object) and answers as Foundry's
  # pf2e system would, so a rule element copied from the feed means the same thing here.
  #
  # Trees: FUN`PREDICATE` tests a predicate against roll options, FUN`MODIFIER` applies the stacking
  # rules, FUN`DEGREE` reads a check's degree of success, FUN`FORMULA` resolves a rule element value.
  - ref: core
    type: thing
    name: PF2e Rules
    location: "{{$master_room}}"
    attributes:
      DATA: What the core reads. DATA`PACK`<pack> names the object holding that Foundry pack.
      DATA`PACK: One data object per Foundry pack, holding its items as the PF2e feed carries them.
      DATA`PACK`ACTIONS: "{{data_actions}}"
      DATA`PACK`ANCESTRIES: "{{data_ancestries}}"
      DATA`PACK`ANCESTRY-FEATURES: "{{data_ancestry_features}}"
      DATA`PACK`BACKGROUNDS: "{{data_backgrounds}}"
      DATA`PACK`CLASSES: "{{data_classes}}"
      DATA`PACK`CLASS-FEATURES: "{{data_class_features}}"
      DATA`PACK`CONDITIONS: "{{data_conditions}}"
      DATA`PACK`EQUIPMENT: "{{data_equipment}}"
      DATA`PACK`EQUIPMENT-EFFECTS: "{{data_equipment_effects}}"
      DATA`PACK`FAMILIAR-ABILITIES: "{{data_familiar_abilities}}"
      DATA`PACK`FEAT-EFFECTS: "{{data_feat_effects}}"
      DATA`PACK`FEATS: "{{data_feats}}"
      DATA`PACK`HAZARDS: "{{data_hazards}}"
      DATA`PACK`HERITAGES: "{{data_heritages}}"
      DATA`PACK`OTHER-EFFECTS: "{{data_other_effects}}"
      DATA`PACK`SPELL-EFFECTS: "{{data_spell_effects}}"
      DATA`PACK`SPELLS: "{{data_spells}}"
      DATA`PACK`VEHICLES: "{{data_vehicles}}"
      DATA`PACK`PATHFINDER-MONSTER-CORE: "{{data_pathfinder_monster_core}}"
      DATA`CONFIG: Settings.
      DATA`CONFIG`LABEL: Pathfinder 2e
      DATA`CONFIG`BOOKS: pc1 pc2 gmc mc
      DATA`CONFIG`BOOKS`TYPE: list
      DATA`CONFIG`BOOKS`DEFAULT: pc1 pc2 gmc mc
      DATA`CONFIG`BOOKS`LABEL: Source books
      DATA`CONFIG`BOOKS`DESCRIPTION: The books whose rules the game uses, by the feed's book slug. An item from a book not listed is left out of lookups, sheets and the builder.
      DATA`CONFIG`REPOSITORY: SharpMUSH/SharpMUSH.Packages
      DATA`CONFIG`REPOSITORY`TYPE: text
      DATA`CONFIG`REPOSITORY`DEFAULT: SharpMUSH/SharpMUSH.Packages
      DATA`CONFIG`REPOSITORY`LABEL: Feed repository
      DATA`CONFIG`REPOSITORY`DESCRIPTION: The GitHub repository, owner/name, whose pf2e-feed folder the updater reads.
      DATA`CONFIG`BRANCH: main
      DATA`CONFIG`BRANCH`TYPE: text
      DATA`CONFIG`BRANCH`DEFAULT: main
      DATA`CONFIG`BRANCH`LABEL: Feed branch
      DATA`CONFIG`BRANCH`DESCRIPTION: The branch the updater reads. Each run reads every file from the commit the branch is on when the run starts.
      DATA`STATISTICS: acrobatics arcana athletics crafting deception diplomacy intimidation medicine nature occultism performance religion society stealth survival thievery perception fortitude reflex will
      # The most items a sheet holds at once, so that +sheet stays inside the engine's function
      # invocation limit.
      DATA`SHEET`GRANTS`MAX: 200
      # Every domain of a statistic's check: FUN`STAT`DOMAINS of each statistic, together.
      DATA`CHECK`DOMAINS: acrobatics acrobatics-check all arcana arcana-check athletics athletics-check cha-based cha-skill-check check con-based crafting crafting-check deception deception-check dex-based dex-skill-check diplomacy diplomacy-check fortitude fortitude-check int-based int-skill-check intimidation intimidation-check medicine medicine-check nature nature-check occultism occultism-check perception perception-check performance performance-check reflex reflex-check religion religion-check saving-throw skill-check society society-check stealth stealth-check str-based str-skill-check survival survival-check thievery thievery-check will will-check wis-based wis-skill-check
      DATA`STATISTIC: Each statistic's kind (skill, perception or save) and the attribute it is based on.
      DATA`STATISTIC`ACROBATICS: skill dex
      DATA`STATISTIC`ARCANA: skill int
      DATA`STATISTIC`ATHLETICS: skill str
      DATA`STATISTIC`CRAFTING: skill int
      DATA`STATISTIC`DECEPTION: skill cha
      DATA`STATISTIC`DIPLOMACY: skill cha
      DATA`STATISTIC`INTIMIDATION: skill cha
      DATA`STATISTIC`MEDICINE: skill wis
      DATA`STATISTIC`NATURE: skill wis
      DATA`STATISTIC`OCCULTISM: skill int
      DATA`STATISTIC`PERFORMANCE: skill cha
      DATA`STATISTIC`RELIGION: skill wis
      DATA`STATISTIC`SOCIETY: skill int
      DATA`STATISTIC`STEALTH: skill dex
      DATA`STATISTIC`SURVIVAL: skill wis
      DATA`STATISTIC`THIEVERY: skill dex
      DATA`STATISTIC`PERCEPTION: perception wis
      DATA`STATISTIC`FORTITUDE: save con
      DATA`STATISTIC`REFLEX: save dex
      DATA`STATISTIC`WILL: save wis
      FUN: Function attributes, one tree per part of the rules. Each is pure; none writes anything.
      FUN`PREDICATE: Predicates. %0 a predicate (a JSON array of statements), %1 the roll options, a space-separated list.
      # Foundry's Predicate.test: an empty predicate passes, a malformed one fails, otherwise every
      # statement must hold.
      FUN`PREDICATE`TEST:
        value: |-
          @@(Foundry Predicate.test: every statement in the array %0 holds for the roll options %1)[
          switch(json_query(%0,type),
            array, not(member(u(FUN`PREDICATE`RESULTS,%0,%1),0)),
            0)]
        flags: [funsyntax]
      # One 1 or 0 per statement of the JSON array %0.
      FUN`PREDICATE`RESULTS:
        value: |-
          json_map(me/FUN`PREDICATE`EACH,%0,%b,%1)
        flags: [funsyntax]
      # json_map's callback: %0 the statement's type, %1 the statement, %3 the roll options.
      FUN`PREDICATE`EACH:
        value: |-
          switch(%0,
            string, neq(member(%3,%1),0),
            object, u(FUN`PREDICATE`COMPOUND,%1,%3),
            0)
        flags: [funsyntax]
      # A statement that is an object: one operator and its operands, or if/then.
      FUN`PREDICATE`COMPOUND:
        value: |-
          @@(%0 a statement object, %1 the roll options)[
          setq(predicate_op,lcstr(json_map(me/FUN`PREDICATE`KEY,%0)))][
          switch(%q<predicate_op>,
            and, not(member(u(FUN`PREDICATE`RESULTS,json_query(%0,get,and),%1),0)),
            or, neq(member(u(FUN`PREDICATE`RESULTS,json_query(%0,get,or),%1),1),0),
            nand, neq(member(u(FUN`PREDICATE`RESULTS,json_query(%0,get,nand),%1),0),0),
            nor, not(member(u(FUN`PREDICATE`RESULTS,json_query(%0,get,nor),%1),1)),
            xor, eq(words(filter(me/FUN`PREDICATE`IS`ONE,u(FUN`PREDICATE`RESULTS,json_query(%0,get,xor),%1))),1),
            not, not(u(FUN`PREDICATE`RESULTS,\[[json_query(%0,get,not)]\],%1)),
            if then, u(FUN`PREDICATE`CONDITIONAL,%0,%1),
            then if, u(FUN`PREDICATE`CONDITIONAL,%0,%1),
            iff, u(FUN`PREDICATE`IFF,u(FUN`PREDICATE`RESULTS,json_query(%0,get,iff),%1)),
            eq, u(FUN`PREDICATE`EQUAL,json_query(%0,get,eq),%1),
            gt, u(FUN`PREDICATE`COMPARE,gt,json_query(%0,get,gt),%1),
            gte, u(FUN`PREDICATE`COMPARE,gte,json_query(%0,get,gte),%1),
            lt, u(FUN`PREDICATE`COMPARE,lt,json_query(%0,get,lt),%1),
            lte, u(FUN`PREDICATE`COMPARE,lte,json_query(%0,get,lte),%1),
            0)]
        flags: [funsyntax]
      FUN`PREDICATE`KEY:
        value: |-
          %2
        flags: [funsyntax]
      FUN`PREDICATE`IS`ONE:
        value: |-
          eq(%0,1)
        flags: [funsyntax]
      # if/then holds unless "if" holds and "then" does not.
      FUN`PREDICATE`CONDITIONAL:
        value: |-
          @@(%0 an if/then statement, %1 the roll options)[
          cor(not(u(FUN`PREDICATE`RESULTS,\[[json_query(%0,get,if)]\],%1)),
            u(FUN`PREDICATE`RESULTS,\[[json_query(%0,get,then)]\],%1))]
        flags: [funsyntax]
      # iff holds when its statements all hold or all fail. %0 their results.
      FUN`PREDICATE`IFF:
        value: |-
          cor(not(member(%0,0)),not(member(%0,1)))
        flags: [funsyntax]
      # eq: two strings are compared as text; a string and a number test the option <string>:<number>.
      FUN`PREDICATE`EQUAL:
        value: |-
          @@(%0 the operand array, %1 the roll options)[
          setq(predicate_left,json_query(%0,extract,$\[0\]),predicate_right,json_query(%0,extract,$\[1\]))][
          switch(json_query(json_query(%0,get,1),type),
            string, not(comp(%q<predicate_left>,%q<predicate_right>)),
            neq(member(%1,%q<predicate_left>:%q<predicate_right>),0))]
        flags: [funsyntax]
      # gt/gte/lt/lte: each side is a number or every value <operand>:<n> among the roll options; the
      # statement holds when some left value beats every right value, as in Foundry.
      FUN`PREDICATE`COMPARE:
        value: |-
          @@(%0 the operator, %1 the operand array, %2 the roll options)[
          setq(predicate_lefts,u(FUN`PREDICATE`VALUES,json_query(%1,extract,$\[0\]),%2))][
          setq(predicate_rights,u(FUN`PREDICATE`VALUES,json_query(%1,extract,$\[1\]),%2))][
          cand(words(%q<predicate_lefts>),words(%q<predicate_rights>),
            words(iter(%q<predicate_lefts>,if(u(FUN`PREDICATE`BEATS`ALL,%0,%i0,%q<predicate_rights>),%i0))))]
        flags: [funsyntax]
      FUN`PREDICATE`BEATS`ALL:
        value: |-
          @@(%0 the operator, %1 one left value, %2 every right value)[
          not(words(iter(%2,if(switch(%0,gt,gt(%1,%i0),gte,gte(%1,%i0),lt,lt(%1,%i0),lte(%1,%i0)),,%i0))))]
        flags: [funsyntax]
      FUN`PREDICATE`VALUES:
        value: |-
          @@(%0 an operand, %1 the roll options)[
          if(isnum(%0),%0,
            squish(iter(%1,if(cand(strmatch(%i0,%0:*),
              not(strmatch(after(%i0,%0:),*:*)),
              isnum(after(%i0,%0:))),
              after(%i0,%0:)))))]
        flags: [funsyntax]
      FUN`MODIFIER: Modifiers. %0 a JSON array of Foundry modifier objects (slug, type, modifier, force, ignored, predicate), %1 the roll options.
      # The modifiers that count, as Foundry's applyStackingRules picks them: a modifier whose predicate
      # fails or that is ignored is left out; untyped ones all count; of the ability modifiers only the
      # best (a forced one first); of every other type the highest bonus and the lowest penalty, the
      # first of equals. Gives type~value~slug for each.
      FUN`MODIFIER`CHOSEN:
        value: |-
          @@(%0 Foundry modifier objects, %1 the roll options)[
          u(FUN`MODIFIER`STACK,json_map(me/FUN`MODIFIER`FLAT,%0,%b,%1))]
        flags: [funsyntax]
      FUN`MODIFIER`STACK:
        value: |-
          @@(%0 type~value~slug~force for each modifier whose predicate holds: the ones that count, all of them when no two share a type)[
          setq(mod_types,iter(%0,first(%i0,~)))][
          if(eq(words(%q<mod_types>),words(setunion(%q<mod_types>,))),
            %0,
            [setq(mod_types,setdiff(%q<mod_types>,untyped ability))][
            squish(
              [u(FUN`MODIFIER`OF`TYPE,untyped,%0)]%b[
              u(FUN`MODIFIER`BEST`ABILITY,u(FUN`MODIFIER`OF`TYPE,ability,%0))]%b[
              iter(%q<mod_types>,u(FUN`MODIFIER`BEST`OF`TYPE,u(FUN`MODIFIER`OF`TYPE,%i0,%0)))])])]
        flags: [funsyntax]
      FUN`MODIFIER`TOTAL:
        value: |-
          @@(%0 Foundry modifier objects, %1 the roll options)[
          ladd(0 [iter(u(FUN`MODIFIER`CHOSEN,%0,%1),elements(%i0,2,~))])]
        flags: [funsyntax]
      FUN`MODIFIER`ENABLED:
        value: |-
          @@(%0 Foundry modifier objects, %1 the roll options: the slugs of the modifiers that count)[
          iter(u(FUN`MODIFIER`CHOSEN,%0,%1),elements(%i0,3,~))]
        flags: [funsyntax]
      # json_map's callback: %1 one modifier object, %3 the roll options. Gives type~value~slug~force, or
      # nothing when the modifier is ignored or its predicate fails. An unknown type is untyped.
      FUN`MODIFIER`FLAT:
        value: |-
          @@(%1 one modifier object, %3 the roll options)[
          if(cand(not(json_query(%1,extract,$.ignored)),
            u(FUN`PREDICATE`TEST,firstof(json_query(%1,get,predicate),\[\]),%3)),
            u(FUN`MODIFIER`ENTRY,%1))]
        flags: [funsyntax]
      FUN`MODIFIER`ENTRY:
        value: |-
          @@(%0 one modifier object: type~value~slug~force)[
          u(FUN`MODIFIER`TYPE,json_query(%0,extract,$.type))]~[add(0,json_query(%0,extract,$.modifier))]~[firstof(json_query(%0,extract,$.slug),modifier)]~[t(json_query(%0,extract,$.force))]
        flags: [funsyntax]
      FUN`MODIFIER`TYPE:
        value: |-
          if(match(ability circumstance item potency proficiency status untyped,%0),%0,untyped)
        flags: [funsyntax]
      FUN`MODIFIER`OF`TYPE:
        value: |-
          @@(%0 a type, %1 type~value~slug~force entries)[
          iter(%1,if(strmatch(first(%i0,~),%0),%i0))]
        flags: [funsyntax]
      FUN`MODIFIER`BEST`ABILITY:
        value: |-
          @@(%0 the ability entries: the last forced one, else the first highest)[
          setq(mod_forced,iter(%0,if(elements(%i0,4,~),%i0)))][
          if(words(%q<mod_forced>),last(%q<mod_forced>),u(FUN`MODIFIER`FIRST`AT,%0,lmax(iter(%0,elements(%i0,2,~)))))]
        flags: [funsyntax]
      FUN`MODIFIER`BEST`OF`TYPE:
        value: |-
          @@(%0 the entries of one type: the first highest bonus and the first lowest penalty)[
          setq(mod_bonuses,iter(%0,if(gte(elements(%i0,2,~),0),%i0)))][
          setq(mod_penalties,iter(%0,if(lt(elements(%i0,2,~),0),%i0)))][
          squish(
            [u(FUN`MODIFIER`FIRST`AT,%q<mod_bonuses>,lmax(iter(%q<mod_bonuses>,elements(%i0,2,~))))]%b[
            u(FUN`MODIFIER`FIRST`AT,%q<mod_penalties>,lmin(iter(%q<mod_penalties>,elements(%i0,2,~))))])]
        flags: [funsyntax]
      FUN`MODIFIER`FIRST`AT:
        value: |-
          @@(%0 entries, %1 a value: the first entry with that value; nothing when there are no entries)[
          if(words(%0),first(iter(%0,if(eq(elements(%i0,2,~),%1),%i0))))]
        flags: [funsyntax]
      FUN`DEGREE: Degrees of success, 0 critical failure, 1 failure, 2 success, 3 critical success.
      # Foundry's DegreeOfSuccess: 10 over the DC is a critical success and 10 under a critical failure;
      # a natural 20 raises the degree one step and a natural 1 lowers it.
      FUN`DEGREE`OF`CHECK:
        value: |-
          @@(%0 the check's total, %1 the DC, %2 the d20's face)[
          setq(degree_base,
            switch(1,
              gte(sub(%0,%1),10), 3,
              gte(sub(%1,%0),10), 0,
              gte(%0,%1), 2,
              1))][
          switch(%2,
            20, min(3,inc(%q<degree_base>)),
            1, max(0,dec(%q<degree_base>)),
            %q<degree_base>)]
        flags: [funsyntax]
      FUN`FORMULA: Rule element values. %1 is the roll data, a JSON object with actor, item and rule keys shaped like Foundry's.
      # Foundry's RuleElement.resolveValue for a number or a string: injected properties first, then a
      # whole number is that number, text without @ is that text, and a formula is rolled with the roll
      # data. A formula that names something the data lacks gives the default (%2), as in Foundry.
      FUN`FORMULA`VALUE:
        value: |-
          @@(%0 the value as JSON, %1 the roll data, %2 the default)[
          switch(json_query(%0,type),
            number, json_query(%0,extract,$),
            string, u(FUN`FORMULA`TEXT,trim(u(FUN`FORMULA`INJECT,json_query(%0,extract,$),%1)),%1,%2),
            boolean, json_query(%0,extract,$),
            %2)]
        flags: [funsyntax]
      FUN`FORMULA`TEXT:
        value: |-
          @@(%0 the text with injected properties resolved, %1 the roll data, %2 the default)[
          switch(1,
            regmatch(%0,^-?\\d+$), %0,
            not(strmatch(%0,*@*)), %0,
            u(FUN`FORMULA`ROLL,roll(%0,%1),%2))]
        flags: [funsyntax]
      FUN`FORMULA`ROLL:
        value: |-
          @@(%0 what roll gave, %1 the default)[
          if(strmatch(%0,#-*),%1,%0)]
        flags: [funsyntax]
      # {actor|<path>}, {item|<path>} and {rule|<path>} replaced by the value at that path in the roll data.
      FUN`FORMULA`INJECT:
        value: |-
          @@(%0 text, %1 the roll data)[
          if(regmatch(%0,\\x7B),
            regeditall(%0,\\x7B%(actor|item|rule%)\\|%(.*?%)\\x7D,u(FUN`FORMULA`PROPERTY,$1.$2,%1)),
            %0)]
        flags: [funsyntax]
      FUN`FORMULA`PROPERTY:
        value: |-
          @@(%0 a dotted path, %1 the roll data)[
          firstof(json_query(%1,extract,$.%0),undefined)]
        flags: [funsyntax]
      FUN`SHEET: The sheet's ledger, read once into entries. FUN`SHEET`ENTRIES takes the ledger, a JSON array of entry objects each with n (its number) and kind; every other FUN`SHEET` takes the entries it gives. A later entry wins; a revoke entry takes back the entry it names.
      # Entry kinds: level {level}, ability {ability, mod}, rank {stat, rank}, grant {pack, id, badge},
      # revoke {entry}. The ledger only grows: a change is a new entry, so the sheet's history is the ledger.
      FUN`SHEET`ENTRIES:
        value: |-
          @@(%0 the ledger: kind~key~value~n for each entry not revoked, oldest first)[
          setq(sheet_all,json_map(me/FUN`SHEET`ENTRY,%0,%b))][
          setq(sheet_revoked,u(FUN`SHEET`REVOKED,%q<sheet_all>))][
          squish(iter(%q<sheet_all>,if(member(%q<sheet_revoked>,elements(%i0,4,~)),,%i0)))]
        flags: [funsyntax]
      # json_map's callback, %1 one entry. The key is what a later entry of the kind replaces it by:
      # the attribute, the statistic, or pack|id for a grant.
      FUN`SHEET`ENTRY:
        value: |-
          @@(%1 one entry)[
          setq(sheet_kind,json_query(%1,extract,$.kind))][
          %q<sheet_kind>]~[switch(%q<sheet_kind>,
            ability, json_query(%1,extract,$.ability),
            rank, json_query(%1,extract,$.stat),
            grant, [json_query(%1,extract,$.pack)]|[ucstr(json_query(%1,extract,$.id))])]~[switch(%q<sheet_kind>,
            level, json_query(%1,extract,$.level),
            ability, json_query(%1,extract,$.mod),
            rank, json_query(%1,extract,$.rank),
            grant, json_query(%1,extract,$.badge),
            revoke, json_query(%1,extract,$.entry))]~[json_query(%1,extract,$.n)]
        flags: [funsyntax]
      FUN`SHEET`REVOKED:
        value: |-
          @@(%0 entries: the numbers of the entries their revokes name)[
          iter(graball(%0,revoke~*),elements(%i0,3,~))]
        flags: [funsyntax]
      FUN`SHEET`VALUE:
        value: |-
          @@(%0 entries, %1 a kind, %2 a key: the value of the last entry of that kind and key)[
          elements(last(graball(%0,%1~%2~*)),3,~)]
        flags: [funsyntax]
      FUN`SHEET`LEVEL:
        value: |-
          @@(%0 entries: the character's level, 1 when none is set)[
          firstof(u(FUN`SHEET`VALUE,%0,level,),1)]
        flags: [funsyntax]
      FUN`SHEET`ABILITY:
        value: |-
          @@(%0 entries, %1 an attribute such as str: its modifier)[
          firstof(u(FUN`SHEET`VALUE,%0,ability,%1),0)]
        flags: [funsyntax]
      FUN`SHEET`RANK:
        value: |-
          @@(%0 entries, %1 a statistic such as athletics or will: its proficiency rank, 0 untrained to 4 legendary)[
          firstof(u(FUN`SHEET`VALUE,%0,rank,%1),0)]
        flags: [funsyntax]
      FUN`SHEET`GRANTS:
        value: |-
          @@(%0 entries: n~pack~id~badge for each grant, badge empty when it has none)[
          iter(graball(%0,grant~*),[elements(%i0,4,~)]~[edit(elements(%i0,2,~),|,~)]~[elements(%i0,3,~)])]
        flags: [funsyntax]
      FUN`ITEM: Items from the data objects. An item is the feed's ITEM` JSON, which is Foundry's item less its description.
      # What a sheet needs from an item, worked out once when the updater stores it, as ITEM`<id>`PREP:
      # kind, name, slug, valued (a valued condition's own badge), options (the roll options it gives,
      # less its badge's), unapplied (its rule kinds other than FlatModifier), and of its FlatModifiers
      # whose selectors reach a check: dynamic (the indices of those that read the roll data or are
      # ability modifiers) and synth (the synthetics of the others, which come out the same on every
      # sheet, each with its modifier's type~value~slug~force as flat).
      FUN`ITEM`PREPARE:
        value: |-
          @@(%0 an item: its ITEM`<id>`PREP)[
          setqm(synthetic_item,%0,synthetic_rules,firstof(json_query(%0,extract,$.system.rules),json(array)),synthetic_slug,u(FUN`ITEM`SLUG,%0))][
          setq(synthetic_data,json(object,item,u(FUN`ITEM`DATA,%0,)))][
          setq(prepare_flat,iter(lnum(0,dec(json_query(%q<synthetic_rules>,size))),if(u(FUN`RULE`FOR`CHECKS,json_query(%q<synthetic_rules>,extract,$\[%i0\])),%i0)))][
          setq(prepare_dynamic,iter(%q<prepare_flat>,if(u(FUN`RULE`DYNAMIC,json_query(%q<synthetic_rules>,extract,$\[%i0\])),%i0)))][
          json(object,
            kind,json(string,json_query(%0,extract,$.type)),
            name,json(string,json_query(%0,extract,$.name)),
            slug,json(string,%q<synthetic_slug>),
            valued,json(string,u(FUN`ITEM`BADGE,%0,)),
            options,json(string,u(FUN`ITEM`OPTIONS,%0,)),
            unapplied,json(string,setdiff(json_map(me/FUN`RULE`KEY,%q<synthetic_rules>,%b),FlatModifier)),
            dynamic,json(string,%q<prepare_dynamic>),
            synth,\[[json_map(me/FUN`ITEM`PREPARE`FLAT,fold(me/FUN`SYNTHETICS`RULE,iter(%q<prepare_flat>,if(member(%q<prepare_dynamic>,%i0),,%i0)),json(array)),\,)]\])]
        flags: [funsyntax]
      FUN`ITEM`PREPARE`FLAT:
        value: |-
          @@(%1 a synthetic: it with its modifier's type~value~slug~force as flat)[
          json_mod(%1,set,$.flat,json(string,u(FUN`MODIFIER`ENTRY,json_query(%1,get,modifier))))]
        flags: [funsyntax]
      FUN`ITEM`GET:
        value: |-
          @@(%0 a pack such as feats, %1 a Foundry id: the item, empty when the game lacks it)[
          setq(item_store,u(DATA`PACK`%0))][
          if(strlen(%q<item_store>),get(%q<item_store>/ITEM`%1))]
        flags: [funsyntax]
      # An item named by its Foundry id or by its name, from a book the game uses. Names are looked up
      # through the NAME`<slug> index the updater keeps on each data object.
      FUN`ITEM`FIND:
        value: |-
          @@(%0 a pack, %1 an id or a name: the item's id, empty when no item from a book the game uses matches)[
          setq(item_store,u(DATA`PACK`%0))][
          if(strlen(%q<item_store>),
            first(iter(
              squish([if(strlen(get(%q<item_store>/ITEM`[ucstr(%1)])),ucstr(%1))] [get(%q<item_store>/NAME`[u(FUN`ITEM`SLUGGIFY,%1)])]),
              if(member(v(DATA`CONFIG`BOOKS),get(%q<item_store>/ITEM`%i0`BOOK)),%i0))))]
        flags: [funsyntax]
      # Foundry's item.slug, falling back to sluggify(name) as rule elements do.
      FUN`ITEM`SLUG:
        value: |-
          @@(%0 an item)[
          firstof(json_query(%0,extract,$.system.slug),u(FUN`ITEM`SLUGGIFY,json_query(%0,extract,$.name)))]
        flags: [funsyntax]
      FUN`ITEM`SLUGGIFY:
        value: |-
          @@(%0 a name: lower case, apostrophes dropped, every other run of non-letters a hyphen)[
          trim(regeditall(lcstr(regeditall(%0,\['’\],)),\[^a-z0-9\]+,-),-,b)]
        flags: [funsyntax]
      # The badge: the grant's own, else a valued condition's system.value.value.
      FUN`ITEM`BADGE:
        value: |-
          @@(%0 an item, %1 the grant's badge)[
          firstof(%1,if(t(json_query(%0,extract,$.system.value.isValued)),json_query(%0,extract,$.system.value.value)))]
        flags: [funsyntax]
      # What @item reads in a formula: the item's own fields, level and badge as Foundry's getters give them.
      FUN`ITEM`DATA:
        value: |-
          @@(%0 an item, %1 its badge)[
          json(object,
            id,json(string,json_query(%0,extract,$._id)),
            name,json(string,json_query(%0,extract,$.name)),
            type,json(string,json_query(%0,extract,$.type)),
            slug,json(string,u(FUN`ITEM`SLUG,%0)),
            level,firstof(json_query(%0,extract,$.system.level.value),null),
            badge,if(strlen(%1),json(object,value,%1),null),
            system,firstof(json_query(%0,extract,$.system),json(object)),
            flags,firstof(json_query(%0,extract,$.flags),json(object)))]
        flags: [funsyntax]
      # The roll options an item gives its actor, as each Foundry item type sets them.
      FUN`ITEM`OPTIONS:
        value: |-
          @@(%0 an item, %1 its badge)[
          setq(item_slug,u(FUN`ITEM`SLUG,%0))][
          switch(json_query(%0,extract,$.type),
            condition, self:condition:%q<item_slug>[if(strlen(%1),%bself:condition:%q<item_slug>:%1)],
            effect, u(FUN`ITEM`EFFECT`OPTIONS,regeditall(%q<item_slug>,^%(?:\[a-z\]+-%)?%(?:effect|stance%)-,),%1),
            feat, if(match(classfeature ancestryfeature calling curse deityboon pfsboon,json_query(%0,extract,$.system.category)),feature,feat):%q<item_slug>,
            ancestry, self:ancestry:%q<item_slug>,
            heritage, heritage:%q<item_slug> self:heritage:%q<item_slug>,
            class, class:%q<item_slug>,
            action, self:ability:%q<item_slug>,
            )]
        flags: [funsyntax]
      FUN`ITEM`EFFECT`OPTIONS:
        value: |-
          @@(%0 the effect's roll option slug, %1 its badge)self:effect:%0[if(strlen(%1),%bself:effect:%0:%1)]
        flags: [funsyntax]
      FUN`ACTOR: The actor, built from the sheet.
      # What @actor reads in a formula, shaped like Foundry's character: level, abilities.<a>.mod,
      # skills.<s>.rank and system.skills.<s>.rank, conditions.<slug>.value and .badge.value.
      FUN`ACTOR`DATA:
        value: |-
          @@(%0 the entries, %1 the level, %2 slug~badge for each granted condition)[
          setq(actor_entries,%0)][
          setq(actor_ranks,fold(me/FUN`ACTOR`RANK,v(DATA`STATISTICS),json(object)))][
          json(object,
            level,%1,
            abilities,fold(me/FUN`ACTOR`ABILITY,str dex con int wis cha,json(object)),
            skills,%q<actor_ranks>,
            system,json(object,skills,%q<actor_ranks>),
            conditions,fold(me/FUN`ACTOR`CONDITION,%2,json(object)))]
        flags: [funsyntax]
      # fold callbacks, each a merge patch: %0 the object so far, %1 the next statistic, attribute or grant; actor_entries the entries.
      FUN`ACTOR`RANK:
        value: |-
          json_mod(%0,patch,json(object,%1,json(object,rank,u(FUN`SHEET`RANK,%q<actor_entries>,%1))))
        flags: [funsyntax]
      FUN`ACTOR`ABILITY:
        value: |-
          json_mod(%0,patch,json(object,%1,json(object,mod,u(FUN`SHEET`ABILITY,%q<actor_entries>,%1))))
        flags: [funsyntax]
      FUN`ACTOR`CONDITION:
        value: |-
          @@(%0 the conditions so far, %1 slug~badge)[
          json_mod(%0,patch,json(object,first(%1,~),if(strlen(rest(%1,~)),json(object,value,rest(%1,~),badge,json(object,value,rest(%1,~))),json(object))))]
        flags: [funsyntax]
      FUN`STAT: The skills, perception and the saves. %0 a statistic such as athletics.
      # Foundry's domains for the statistic's check: the selectors whose modifiers apply to it.
      FUN`STAT`DOMAINS:
        value: |-
          @@(%0 a statistic)[
          setq(stat_attribute,u(FUN`STAT`ATTRIBUTE,%0))][
          switch(u(FUN`STAT`KIND,%0),
            skill, %0 %q<stat_attribute>-based skill-check %q<stat_attribute>-skill-check all check %0-check,
            save, %0 %q<stat_attribute>-based saving-throw all check %0-check,
            perception, perception all %q<stat_attribute>-based check perception-check)]
        flags: [funsyntax]
      FUN`STAT`KIND:
        value: |-
          first(v(DATA`STATISTIC`%0))
        flags: [funsyntax]
      FUN`STAT`ATTRIBUTE:
        value: |-
          last(v(DATA`STATISTIC`%0))
        flags: [funsyntax]
      FUN`RULE: Rule elements. %0 one rule element as the item stores it, %1 the roll data (actor, item, rule).
      # A FlatModifier as Foundry's FlatModifierRuleElement turns it into a synthetic: the selectors it
      # applies to, injected properties resolved and null ones left out, and the modifier, with the
      # predicate's injected properties resolved, an ability-typed one worth that attribute's modifier,
      # and the value a number (anything else 0) held between min and max. Its slug is the rule's own,
      # else the item's (%2). Nothing when it has no selector left.
      FUN`RULE`FLATMODIFIER:
        value: |-
          @@(%0 the rule, %1 the roll data, %2 the item's slug)[
          setq(rule_selectors,u(FUN`RULE`SELECTORS,%0,%1))][
          if(words(%q<rule_selectors>),
            json(object,
              selectors,json(string,%q<rule_selectors>),
              modifier,u(FUN`RULE`FLATMODIFIER`OBJECT,%0,%1,%2,u(FUN`MODIFIER`TYPE,firstof(json_query(%0,extract,$.type),untyped)))))]
        flags: [funsyntax]
      FUN`RULE`FLATMODIFIER`OBJECT:
        value: |-
          @@(%0 the rule, %1 the roll data, %2 the item's slug, %3 the modifier type)[
          setq(rule_ability,json_query(%0,extract,$.ability))][
          setq(rule_value,u(FUN`FORMULA`VALUE,if(strmatch(%3,ability),json(string,@actor.abilities.%q<rule_ability>.mod),firstof(json_query(%0,get,value),null)),%1,0))][
          setq(rule_value,if(isnum(%q<rule_value>),%q<rule_value>,0))][
          setq(rule_value,u(FUN`RULE`CLAMP,%q<rule_value>,json_query(%0,extract,$.min),json_query(%0,extract,$.max)))][
          json(object,
            slug,json(string,firstof(if(strmatch(%3,ability),%q<rule_ability>),json_query(%0,extract,$.slug),%2)),
            label,json(string,u(FUN`RULE`LABEL,%0)),
            type,json(string,%3),
            modifier,%q<rule_value>,
            predicate,u(FUN`FORMULA`INJECT,firstof(json_query(%0,get,predicate),json(array)),%1))]
        flags: [funsyntax]
      # A FlatModifier whose selectors reach a check's domains, or are injected and so might.
      FUN`RULE`FOR`CHECKS:
        value: |-
          @@(%0 the rule)[
          cand(strmatch(json_query(%0,extract,$.key),FlatModifier),
            cor(regmatch(json_query(%0,get,selector),\\x7B),words(setinter(u(FUN`RULE`SELECTORS,%0,),v(DATA`CHECK`DOMAINS)))))]
        flags: [funsyntax]
      # A FlatModifier that reads the roll data (a formula with @, or an injected {actor|...},
      # {item|...} or {rule|...}) or that is an ability modifier comes out differently on each sheet.
      FUN`RULE`DYNAMIC:
        value: |-
          @@(%0 the rule)[
          cor(strmatch(json_query(%0,extract,$.type),ability),regmatch(%0,@|\\x7B%(?:actor|item|rule%)\\|))]
        flags: [funsyntax]
      FUN`RULE`KEY:
        value: |-
          json_query(%1,extract,$.key)
        flags: [funsyntax]
      # Foundry's label for a rule's modifier: the rule's own label, else the item's name. A label that is
      # a Foundry language key is not in the feed's items, so the item's name stands for it.
      FUN`RULE`LABEL:
        value: |-
          @@(%0 the rule; synthetic_item the item it is on)[
          setq(rule_label,json_query(%0,extract,$.label))][
          if(cand(strlen(%q<rule_label>),not(strmatch(%q<rule_label>,PF2E.*))),%q<rule_label>,json_query(%q<synthetic_item>,extract,$.name))]
        flags: [funsyntax]
      FUN`RULE`CLAMP:
        value: |-
          @@(%0 a number, %1 the least it may be, %2 the most, either empty for no bound)[
          if(isnum(%2),min(%2,if(isnum(%1),max(%1,%0),%0)),if(isnum(%1),max(%1,%0),%0))]
        flags: [funsyntax]
      FUN`RULE`SELECTORS:
        value: |-
          @@(%0 the rule, %1 the roll data: its selectors, a string or an array, with injected properties resolved; null ones left out)[
          setq(rule_selector,json_query(%0,get,selector))][
          setdiff(u(FUN`FORMULA`INJECT,switch(left(%q<rule_selector>,1),\[,json_map(me/FUN`RULE`SELECTOR,%q<rule_selector>,%b),json_query(%0,extract,$.selector)),%1),null)]
        flags: [funsyntax]
      FUN`RULE`SELECTOR:
        value: |-
          %1
        flags: [funsyntax]
      FUN`SYNTHETICS: What the granted items' rule elements add, worked out once for the whole sheet as Foundry's actor synthetics are.
      # A JSON array of {selectors, modifier}: selectors a space-separated list, modifier a Foundry
      # modifier object.
      FUN`SYNTHETICS`MODIFIERS:
        value: |-
          @@(%0 the actor data, %1 the prepared synthetics joined with commas, %2 pack~id~badge~rules for each item with dynamic FlatModifiers, rules their indices joined with dots)[
          setq(synthetic_actor,%0)][
          fold(me/FUN`SYNTHETICS`DYNAMIC,%2,\[%1\])]
        flags: [funsyntax]
      # fold callback: an item's dynamic FlatModifiers worked out with this sheet's roll data.
      FUN`SYNTHETICS`DYNAMIC:
        value: |-
          @@(%0 the synthetics so far, %1 pack~id~badge~rules)[
          setq(synthetic_item,u(FUN`ITEM`GET,elements(%1,1,~),elements(%1,2,~)))][
          setqm(synthetic_rules,json_query(%q<synthetic_item>,extract,$.system.rules),synthetic_slug,u(FUN`ITEM`SLUG,%q<synthetic_item>))][
          setq(synthetic_data,json(object,actor,%q<synthetic_actor>,item,u(FUN`ITEM`DATA,%q<synthetic_item>,elements(%1,3,~))))][
          fold(me/FUN`SYNTHETICS`RULE,edit(elements(%1,4,~),.,%b),%0)]
        flags: [funsyntax]
      FUN`SYNTHETICS`RULE:
        value: |-
          @@(%0 the synthetics so far, %1 the rule's index in the item's rules)[
          setq(synthetic_rule,json_query(%q<synthetic_rules>,extract,$\[%1\]))][
          setq(synthetic_new,switch(json_query(%q<synthetic_rule>,extract,$.key),
            FlatModifier, u(FUN`RULE`FLATMODIFIER,%q<synthetic_rule>,json_mod(%q<synthetic_data>,set,$.rule,%q<synthetic_rule>),%q<synthetic_slug>)))][
          if(strlen(%q<synthetic_new>),json_mod(%0,set,$\[[json_query(%0,size)]\],%q<synthetic_new>),%0)]
        flags: [funsyntax]
      # selector~<index> for each selector of each synthetic, so that a check finds its modifiers by its domains.
      FUN`SYNTHETICS`INDEX:
        value: |-
          @@(%0 the synthetics)[
          iter(lnum(0,dec(json_query(%0,size))),iter(json_query(%0,extract,$\[%i0\].selectors),%i0~%i1))]
        flags: [funsyntax]
      FUN`CHECK: Checks, from a ledger.
      # Everything a check needs from the ledger at once: sets check_entries, check_grants, check_level,
      # check_options, check_actor, check_synthetics, check_index, check_flats (each synthetic's
      # type~value~slug~force, - when its predicate fails), check_names and check_unapplied.
      FUN`CHECK`PREPARE:
        value: |-
          @@(%0 the ledger)[
          setq(check_entries,u(FUN`SHEET`ENTRIES,%0))][
          setqm(check_grants,u(FUN`SHEET`GRANTS,%q<check_entries>),check_level,u(FUN`SHEET`LEVEL,%q<check_entries>))][
          setqm(check_options,self:level:%q<check_level>,check_conditions,,check_static,,check_dynamic,,check_names,,check_unapplied,)][
          null(iter(%q<check_grants>,u(FUN`CHECK`GRANT,%i0)))][
          setq(check_actor,u(FUN`ACTOR`DATA,%q<check_entries>,%q<check_level>,%q<check_conditions>))][
          setq(check_synthetics,u(FUN`SYNTHETICS`MODIFIERS,%q<check_actor>,%q<check_static>,%q<check_dynamic>))][
          setq(check_index,u(FUN`SYNTHETICS`INDEX,%q<check_synthetics>))][
          setq(check_flats,iter(lnum(0,dec(json_query(%q<check_synthetics>,size))),u(FUN`CHECK`FLAT,%i0)))]
        flags: [funsyntax]
      # A synthetic's type~value~slug~force when its predicate holds, else -: a prepared synthetic's flat,
      # its predicate tested only when it has one.
      FUN`CHECK`FLAT:
        value: |-
          @@(%0 the synthetic's index in check_synthetics)[
          setq(flat_entry,json_query(%q<check_synthetics>,extract,$\[%0\].flat))][
          firstof(
            if(strlen(%q<flat_entry>),
              if(cor(strmatch(setr(flat_predicate,json_query(%q<check_synthetics>,extract,$\[%0\].modifier.predicate)),\[\]),u(FUN`PREDICATE`TEST,%q<flat_predicate>,%q<check_options>)),%q<flat_entry>),
              u(FUN`MODIFIER`FLAT,,json_query(%q<check_synthetics>,extract,$\[%0\].modifier),,%q<check_options>)),
            -)]
        flags: [funsyntax]
      # One grant's part of the check_ registers, from its item's ITEM`<id>`PREP: its roll options,
      # the condition it is, its synthetics, its name for the sheet and the rules it brings that are
      # not applied yet.
      FUN`CHECK`GRANT:
        value: |-
          @@(%0 a grant n~pack~id~badge)[
          setqm(grant_pack,elements(%0,2,~),grant_id,elements(%0,3,~),grant_own,elements(%0,4,~))][
          setq(grant_prep,get(u(DATA`PACK`%q<grant_pack>)/ITEM`%q<grant_id>`PREP))][
          setqm(grant_kind,json_query(%q<grant_prep>,extract,$.kind),grant_options,json_query(%q<grant_prep>,extract,$.options),grant_name,json_query(%q<grant_prep>,extract,$.name),grant_synth,json_query(%q<grant_prep>,get,synth),grant_dynamic,json_query(%q<grant_prep>,extract,$.dynamic),grant_unapplied,json_query(%q<grant_prep>,extract,$.unapplied))][
          setq(grant_badge,firstof(%q<grant_own>,json_query(%q<grant_prep>,extract,$.valued)))][
          setq(check_options,%q<check_options> %q<grant_options>[if(cand(strlen(%q<grant_badge>),match(condition effect,%q<grant_kind>)),%b[first(%q<grant_options>)]:%q<grant_badge>)])][
          if(strmatch(%q<grant_kind>,condition),setq(check_conditions,%q<check_conditions> [json_query(%q<grant_prep>,extract,$.slug)]~%q<grant_badge>))][
          if(gt(strlen(%q<grant_synth>),2),setq(check_static,[if(strlen(%q<check_static>),%q<check_static>\,)][mid(%q<grant_synth>,1,sub(strlen(%q<grant_synth>),2))]))][
          if(words(%q<grant_dynamic>),setq(check_dynamic,%q<check_dynamic> %q<grant_pack>~%q<grant_id>~%q<grant_badge>~[edit(%q<grant_dynamic>,%b,.)]))][
          setq(check_names,[if(strlen(%q<check_names>),%q<check_names>|)]%q<grant_name>[if(strlen(%q<grant_own>),%b%q<grant_own>)])][
          if(words(%q<grant_unapplied>),setq(check_unapplied,[if(strlen(%q<check_unapplied>),%q<check_unapplied>|)]%q<grant_name> %([itemize(%q<grant_unapplied>)]%)))]
        flags: [funsyntax]
      # The modifiers that count on a statistic's check, type~value~slug~force: its attribute modifier,
      # its proficiency modifier (2 per rank plus the level, 0 untrained), and each synthetic whose
      # selectors meet the check's domains and whose predicate holds, stacked as Foundry stacks them.
      FUN`CHECK`CHOSEN:
        value: |-
          @@(%0 a statistic; the check_ registers FUN`CHECK`PREPARE sets)[
          setqm(chosen_attribute,u(FUN`STAT`ATTRIBUTE,%0),chosen_rank,firstof(json_query(%q<check_actor>,extract,$.skills.%0.rank),0))][
          u(FUN`MODIFIER`STACK,
            ability~[json_query(%q<check_actor>,extract,$.abilities.%q<chosen_attribute>.mod)]~%q<chosen_attribute>~0 proficiency~[if(%q<chosen_rank>,add(mul(2,%q<chosen_rank>),%q<check_level>),0)]~proficiency~0 [
            iter(sort(setunion(iter(u(FUN`STAT`DOMAINS,%0),iter(graball(%q<check_index>,%i0~*),after(%i0,~))),),n),if(strmatch(elements(%q<check_flats>,inc(%i0)),-),,elements(%q<check_flats>,inc(%i0))))])]
        flags: [funsyntax]
  # Reads the PF2e feed into the data objects. WIZARD for @http and for writing the data objects.
  # It reads the feed's index, then each file in turn; an item whose hash is unchanged is left alone.
  # Trees: INC`UPDATE` the run, ON` the @http replies, INC`IMPORT` one item, FUN`FEED` the parsing.
  # FEED` holds the run's state: RUN who started it, BASE the feed folder at the commit being read, NEXT the index being read, QUEUE the files still
  # to read (path|pack|book|hash), CURRENT the one being read, BODY its text, LINES its line count, AT
  # the next line to read, FAILED the files that
  # could not be read, FILE`<key> the hash of each file last read in full, INDEX the last index read.
  - ref: updater
    type: thing
    name: PF2e Updater
    location: "{{core}}"
    flags: [WIZARD]
    attributes:
      INC: Command lists, one tree per step of a run.
      INC`UPDATE`START:
        value: |-
          @assert cor(not(strlen(get(me/FEED`RUN))),gt(sub(secs(),get(me/FEED`TOUCHED)),300))=@pemit [firstof(%0,%#)]=PF2E: The feed is being read already.; &FEED`RUN me=[firstof(%0,%#)]; &FEED`TOUCHED me=[secs()]; &FEED`FAILED me; @http me/ON`COMMIT=https://api.github.com/repos/[get({{core}}/DATA`CONFIG`REPOSITORY)]/commits/[get({{core}}/DATA`CONFIG`BRANCH)],[json(object,Accept,"application/vnd.github.sha")]
        flags: [cmdsyntax]
      # The commit the branch is on, so every file of the run comes from it rather than from a cache.
      ON`COMMIT:
        value: |-
          @assert cand(eq(%<status>,200),eq(strlen(%0),40),regmatch(%0,^\[0-9a-f\]+$))={@pemit [get(me/FEED`RUN)]=PF2E: The feed's branch could not be read: HTTP %<status>.; &FEED`RUN me}; &FEED`BASE me=https://raw.githubusercontent.com/[get({{core}}/DATA`CONFIG`REPOSITORY)]/%0/pf2e-feed; @http me/ON`INDEX=[get(me/FEED`BASE)]/index.json
        flags: [cmdsyntax]
      ON`INDEX:
        value: |-
          @assert eq(%<status>,200)={@pemit [get(me/FEED`RUN)]=PF2E: The feed's index could not be read: HTTP %<status>.; &FEED`RUN me}; &FEED`NEXT me=%0; &FEED`QUEUE me=[u(FUN`FEED`FILES,%0)]; @pemit [get(me/FEED`RUN)]=PF2E: Reading [words(get(me/FEED`QUEUE))] changed files from Foundry pf2e [left(json_query(%0,extract,$.foundry.commit),8)].; @trigger me/INC`UPDATE`NEXT
        flags: [cmdsyntax]
      INC`UPDATE`NEXT:
        value: |-
          @assert words(get(me/FEED`QUEUE))={@trigger me/INC`UPDATE`DONE}; &FEED`CURRENT me=[first(get(me/FEED`QUEUE))]; &FEED`QUEUE me=[rest(get(me/FEED`QUEUE))]; @http me/ON`FILE=[get(me/FEED`BASE)]/[first(get(me/FEED`CURRENT),|)]
        flags: [cmdsyntax]
      ON`FILE:
        value: |-
          @assert cand(eq(%<status>,200),isdbref(u({{core}}/DATA`PACK`[ucstr(elements(get(me/FEED`CURRENT),2,|))])))={&FEED`FAILED me=[squish(get(me/FEED`FAILED) [first(get(me/FEED`CURRENT),|)])]; @trigger me/INC`UPDATE`NEXT}; &FEED`BODY me=%0; &FEED`LINES me=[words(%0,%r)]; &FEED`AT me=1; @trigger me/INC`IMPORT`BATCH
        flags: [cmdsyntax]
      # The next lines of the file, a batch per queue entry, so a run stays inside each entry's time
      # limit and never floods the queue.
      INC`IMPORT`BATCH:
        value: |-
          &FEED`TOUCHED me=[secs()]; @assert lte(get(me/FEED`AT),get(me/FEED`LINES))={&FEED`FILE`[u(FUN`FEED`KEY,first(get(me/FEED`CURRENT),|))] me=[elements(get(me/FEED`CURRENT),4,|)]; @trigger me/INC`UPDATE`NEXT}; @dolist/inplace [lnum(get(me/FEED`AT),min(add(get(me/FEED`AT),39),get(me/FEED`LINES)))]=@include me/INC`IMPORT`LINE=%i0; &FEED`AT me=[add(get(me/FEED`AT),40)]; @trigger me/INC`IMPORT`BATCH
        flags: [cmdsyntax]
      # %0 a line's number in FEED`BODY: <_id> <hash> <leaf> <value>. A line of an item whose stored
      # HASH matches is skipped.
      INC`IMPORT`LINE:
        value: |-
          think [setq(line,extract(get(me/FEED`BODY),%0,1,%r))]; @assert strlen(%q<line>); think [setq(id,ucstr(first(%q<line>)),hash,elements(%q<line>,2),leaf,elements(%q<line>,3),value,after(after(after(%q<line>,%b),%b),%b),store,u({{core}}/DATA`PACK`[ucstr(elements(get(me/FEED`CURRENT),2,|))]))]; @break cand(strmatch(get(%q<store>/ITEM`%q<id>`HASH),%q<hash>),strlen(get(%q<store>/ITEM`%q<id>`PREP))); @include me/INC`IMPORT`[first(%q<leaf>,`)]
        flags: [cmdsyntax]
      # NAME`<slug> on the data object lists the ids of the items with that name, for lookups by name.
      INC`IMPORT`ITEM:
        value: |-
          think setqm(name_old,u({{core}}/FUN`ITEM`SLUGGIFY,json_query(get(%q<store>/ITEM`%q<id>),extract,$.name)),name_new,u({{core}}/FUN`ITEM`SLUGGIFY,json_query(%q<value>,extract,$.name))); @include/nobreak me/INC`IMPORT`UNNAME; &NAME`%q<name_new> %q<store>=[setunion(get(%q<store>/NAME`%q<name_new>),%q<id>)]; &ITEM`%q<id> %q<store>=%q<value>; &ITEM`%q<id>`PREP %q<store>=[u({{core}}/FUN`ITEM`PREPARE,%q<value>)]; &ITEM`%q<id>`BOOK %q<store>=[elements(get(me/FEED`CURRENT),3,|)]; @wipe %q<store>/ITEM`%q<id>`EMBED`*
        flags: [cmdsyntax]
      INC`IMPORT`UNNAME:
        value: |-
          @break not(strlen(%q<name_old>)); &NAME`%q<name_old> %q<store>=[remove(get(%q<store>/NAME`%q<name_old>),%q<id>)]
        flags: [cmdsyntax]
      INC`IMPORT`TEXT:
        value: |-
          &ITEM`%q<id>`TEXT %q<store>=[json_query(%q<value>,unescape)]
        flags: [cmdsyntax]
      INC`IMPORT`EMBED:
        value: |-
          &ITEM`%q<id>`%q<leaf> %q<store>=%q<value>
        flags: [cmdsyntax]
      INC`IMPORT`HASH:
        value: |-
          &ITEM`%q<id>`HASH %q<store>=%q<hash>
        flags: [cmdsyntax]
      INC`UPDATE`DONE:
        value: |-
          &FEED`INDEX me=[get(me/FEED`NEXT)]; &FEED`NEXT me; &FEED`CURRENT me; &FEED`BODY me; &FEED`LINES me; &FEED`AT me; @pemit [get(me/FEED`RUN)]=PF2E: The feed is read.[if(words(get(me/FEED`FAILED)),%bThese files could not be read and are tried again next time: [get(me/FEED`FAILED)])]; &FEED`RUN me
        flags: [cmdsyntax]
      FUN: Function attributes.
      # Every file of every book in the index whose hash differs from the last one read in full, as
      # path|pack|book|hash.
      FUN`FEED`FILES:
        value: |-
          json_map(me/FUN`FEED`BOOK,json_query(%0,get,books))
        flags: [funsyntax]
      FUN`FEED`BOOK:
        value: |-
          @@(%1 one book of the index)[
          json_map(me/FUN`FEED`FILE,json_query(%1,get,files),%b,json_query(%1,extract,$.slug))]
        flags: [funsyntax]
      FUN`FEED`FILE:
        value: |-
          @@(%1 one file of a book, %3 the book)[
          setq(feed_path,json_query(%1,extract,$.path),feed_hash,json_query(%1,extract,$.hash))][
          if(not(strmatch(get(me/FEED`FILE`[u(FUN`FEED`KEY,%q<feed_path>)]),%q<feed_hash>)),
            %q<feed_path>|[json_query(%1,extract,$.pack)]|%3|%q<feed_hash>)]
        flags: [funsyntax]
      FUN`FEED`KEY:
        value: |-
          @@(%0 a file's path, items/pc1/feats-3.txt, as the key PC1-FEATS-3)[
          ucstr(edit(before(after(%0,items/),.txt),/,-))]
        flags: [funsyntax]

  # The commands. WIZARD so that it reads and writes the ledger on any character. Each ledger entry is
  # PF2E`LEDGER`<n> on the character, set with the wizard attribute flag so that only this object or a
  # wizard writes one; an entry without the flag is not read. It sits in the master room.
  #
  # Trees: CMD` the $-commands, INC`TARGET` whose sheet a command is for, INC`PF2E` one routine per
  # switch, INC`CHECK` a check, FUN`SHOW` what the commands draw, FUN` the parsing. Registers, led by
  # their subject: cmd_ the parsed command, sheet_ the character and their ledger, entry_ a new entry,
  # roll_ a check being rolled.
  - ref: commands
    type: thing
    name: PF2e Commands
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      CMD`SHEET:
        value: |-
          $(?is)^\+sheet(?\: +(.*))?$:think setq(cmd_target,trim(%1)); @include %!/INC`TARGET`VIEW; @pemit %#=u(%!/FUN`SHOW`SHEET)
        flags: [regexp, cmdsyntax]
      CMD`CHECK:
        value: |-
          $(?is)^\+check +([^=]+?)(?\: *= *(.*))?$:think setqm(cmd_target,,cmd_stat,trim(%1),cmd_dc,trim(%2)); @include %!/INC`TARGET`VIEW; @include %!/INC`CHECK`ROLL
        flags: [regexp, cmdsyntax]
      CMD`PF2E:
        value: |-
          $(?is)^\+pf2e(/\S*)?(?\: +(.*))?$:think setqm(cmd_switch,lcstr(after(%1,/)),cmd_args,trim(%2)); @assert match(level ability rank grant revoke ledger update,%q<cmd_switch>)=@pemit %#=notice(PF2E,There is no +pf2e/%q<cmd_switch>. The switches are /level%, /ability%, /rank%, /grant%, /revoke%, /ledger and /update.,warn); think u(%!/FUN`COMMAND`TARGET); @include %!/INC`PF2E`%q<cmd_switch>
        flags: [regexp, cmdsyntax]
      # <player>/ in front of the arguments names whose sheet; without it the sheet is your own.
      FUN`COMMAND`TARGET:
        value: |-
          @@(cmd_args the arguments: sets cmd_target and cmd_rest)[
          setq(cmd_target,if(cand(strmatch(%q<cmd_args>,*/*),hastype(pmatch(before(%q<cmd_args>,/)),player)),before(%q<cmd_args>,/)))][
          setq(cmd_rest,if(strlen(%q<cmd_target>),after(%q<cmd_args>,/),%q<cmd_args>))]
        flags: [funsyntax]
      INC`TARGET`VIEW:
        value: |-
          think setq(sheet_target,if(strlen(%q<cmd_target>),pmatch(%q<cmd_target>),%#)); @assert hastype(%q<sheet_target>,player)=@pemit %#=notice(PF2E,There is no player called %q<cmd_target>.,warn); @assert cor(strmatch(%q<sheet_target>,%#),permission(%#,softcode.pf2e.staff))=@pemit %#=notice(PF2E,Only staff see another character's sheet.,error); think setq(sheet_ledger,u(%!/FUN`LEDGER`OF,%q<sheet_target>))
        flags: [cmdsyntax]
      INC`TARGET`EDIT:
        value: |-
          think setq(sheet_target,if(strlen(%q<cmd_target>),pmatch(%q<cmd_target>),%#)); @assert cor(strmatch(%q<sheet_target>,%#),permission(%#,softcode.pf2e.staff))=@pemit %#=notice(PF2E,Only staff change another character's sheet.,error); think setq(sheet_ledger,u(%!/FUN`LEDGER`OF,%q<sheet_target>))
        flags: [cmdsyntax]
      INC`PF2E`LEVEL:
        value: |-
          @include %!/INC`TARGET`EDIT; @assert cand(isint(%q<cmd_rest>),gte(%q<cmd_rest>,1),lte(%q<cmd_rest>,20))=@pemit %#=notice(PF2E,A level is a whole number from 1 to 20.,warn); think setqm(entry_json,json(object,kind,"level",level,%q<cmd_rest>),entry_text,Level %q<cmd_rest>); @include %!/INC`ENTRY`WRITE
        flags: [cmdsyntax]
      INC`PF2E`ABILITY:
        value: |-
          @include %!/INC`TARGET`EDIT; think setqm(entry_ability,u(%!/FUN`COMMAND`ABILITY,before(%q<cmd_rest>,=)),entry_mod,trim(after(%q<cmd_rest>,=))); @assert strlen(%q<entry_ability>)=@pemit %#=notice(PF2E,The attributes are str%, dex%, con%, int%, wis and cha.,warn); @assert cand(isint(%q<entry_mod>),gte(%q<entry_mod>,-5),lte(%q<entry_mod>,10))=@pemit %#=notice(PF2E,An attribute modifier is a whole number from -5 to 10.,warn); think setqm(entry_json,json(object,kind,"ability",ability,json(string,%q<entry_ability>),mod,%q<entry_mod>),entry_text,[capstr(%q<entry_ability>)] [u(%!/FUN`SHOW`SIGNED,%q<entry_mod>)]); @include %!/INC`ENTRY`WRITE
        flags: [cmdsyntax]
      INC`PF2E`RANK:
        value: |-
          @include %!/INC`TARGET`EDIT; think setqm(entry_stat,u(%!/FUN`COMMAND`STAT,before(%q<cmd_rest>,=)),entry_rank,u(%!/FUN`COMMAND`RANK,after(%q<cmd_rest>,=))); @assert eq(words(%q<entry_stat>),1)=@pemit %#=notice(PF2E,u(%!/FUN`SHOW`STAT`MISS,trim(before(%q<cmd_rest>,=)),%q<entry_stat>),warn); @assert strlen(%q<entry_rank>)=@pemit %#=notice(PF2E,A rank is untrained%, trained%, expert%, master or legendary%, or 0 to 4.,warn); think setqm(entry_json,json(object,kind,"rank",stat,json(string,%q<entry_stat>),rank,%q<entry_rank>),entry_text,[capstr(%q<entry_stat>)] [u(%!/FUN`SHOW`RANK,%q<entry_rank>)]); @include %!/INC`ENTRY`WRITE
        flags: [cmdsyntax]
      INC`PF2E`GRANT:
        value: |-
          @include %!/INC`TARGET`EDIT; think setqm(entry_pack,lcstr(trim(before(%q<cmd_rest>,/))),entry_name,trim(before(after(%q<cmd_rest>,/),=)),entry_badge,trim(after(%q<cmd_rest>,=))); @assert strlen(u({{core}}/DATA`PACK`%q<entry_pack>))=@pemit %#=notice(PF2E,Name a pack and an item%, such as conditions/frightened. The packs are [itemize(lcstr(iter(lattr({{core}}/DATA`PACK`*),last(%i0,`))))].,warn); @assert lt(words(u({{core}}/FUN`SHEET`GRANTS,u({{core}}/FUN`SHEET`ENTRIES,%q<sheet_ledger>))),get({{core}}/DATA`SHEET`GRANTS`MAX))=@pemit %#=notice(PF2E,A sheet holds at most [get({{core}}/DATA`SHEET`GRANTS`MAX)] items. Revoke one first.,warn); think setq(entry_id,u({{core}}/FUN`ITEM`FIND,%q<entry_pack>,%q<entry_name>)); @assert strlen(%q<entry_id>)=@pemit %#=notice(PF2E,There is no %q<entry_name> in %q<entry_pack> from a book the game uses.,warn); @assert cor(not(strlen(%q<entry_badge>)),cand(isint(%q<entry_badge>),gt(%q<entry_badge>,0)))=@pemit %#=notice(PF2E,A value after = is a whole number above 0%, such as conditions/frightened=2.,warn); think setqm(entry_json,json(object,kind,"grant",pack,json(string,%q<entry_pack>),id,json(string,%q<entry_id>),badge,firstof(%q<entry_badge>,null)),entry_text,[u(%!/FUN`SHOW`ITEM,%q<entry_pack>,%q<entry_id>,%q<entry_badge>)]); @include %!/INC`ENTRY`WRITE
        flags: [cmdsyntax]
      INC`PF2E`REVOKE:
        value: |-
          @include %!/INC`TARGET`EDIT; think setq(entry_old,get(%q<sheet_target>/PF2E`LEDGER`%q<cmd_rest>)); @assert cand(isint(%q<cmd_rest>),strlen(%q<entry_old>),hasflag(%q<sheet_target>/PF2E`LEDGER`%q<cmd_rest>,wizard))=@pemit %#=notice(PF2E,There is no entry %q<cmd_rest>. +pf2e/ledger lists them.,warn); @assert not(match(revoke,json_query(%q<entry_old>,extract,$.kind)))=@pemit %#=notice(PF2E,Entry %q<cmd_rest> is itself a revoke. Make the entry again instead.,warn); @assert not(member(u({{core}}/FUN`SHEET`REVOKED,u({{core}}/FUN`SHEET`ENTRIES,%q<sheet_ledger>)),%q<cmd_rest>))=@pemit %#=notice(PF2E,Entry %q<cmd_rest> is already revoked.,warn); think setqm(entry_json,json(object,kind,"revoke",entry,%q<cmd_rest>),entry_text,Revoked entry %q<cmd_rest>); @include %!/INC`ENTRY`WRITE
        flags: [cmdsyntax]
      INC`PF2E`LEDGER:
        value: |-
          think setq(cmd_target,firstof(%q<cmd_target>,%q<cmd_rest>)); @include %!/INC`TARGET`VIEW; @pemit %#=u(%!/FUN`SHOW`LEDGER)
        flags: [cmdsyntax]
      INC`PF2E`UPDATE:
        value: |-
          @assert permission(%#,softcode.pf2e.staff)=@pemit %#=notice(PF2E,Only staff read the feed.,error); @trigger {{updater}}/INC`UPDATE`START=%#
        flags: [cmdsyntax]
      # entry_json the entry, entry_text how it reads: numbered after the last entry, stamped with who made it.
      INC`ENTRY`WRITE:
        value: |-
          think setq(entry_n,inc(lmax(0 [iter(lattr(%q<sheet_target>/PF2E`LEDGER`*),last(%i0,`))]))); &PF2E`LEDGER`%q<entry_n> %q<sheet_target>=[json_mod(%q<entry_json>,patch,json(object,n,%q<entry_n>,by,json(string,objid(%#))))]; @set %q<sheet_target>/PF2E`LEDGER`%q<entry_n>=wizard; @pemit %#=notice(PF2E,[if(strmatch(%q<sheet_target>,%#),,[name(%q<sheet_target>)]:%b)]%q<entry_text> %(entry %q<entry_n>%).,ok)
        flags: [cmdsyntax]
      # A check: the statistic's modifiers stacked, a d20 rolled and kept, and against a DC its degree.
      INC`CHECK`ROLL:
        value: |-
          think setq(roll_stat,u(%!/FUN`COMMAND`STAT,%q<cmd_stat>)); @assert eq(words(%q<roll_stat>),1)=@pemit %#=notice(PF2E,u(%!/FUN`SHOW`STAT`MISS,%q<cmd_stat>,%q<roll_stat>),warn); @assert cor(not(strlen(%q<cmd_dc>)),isint(%q<cmd_dc>))=@pemit %#=notice(PF2E,A DC is a whole number%, such as +check athletics=20.,warn); think u(%!/FUN`CHECK`PREPARE); @remit %l=notice(PF2E,u(%!/FUN`SHOW`CHECK))
        flags: [cmdsyntax]
      FUN`CHECK`PREPARE:
        value: |-
          @@(sets the core's check_ registers, then roll_chosen, roll_total and roll_record)[
          u({{core}}/FUN`CHECK`PREPARE,%q<sheet_ledger>)][
          setq(roll_chosen,u({{core}}/FUN`CHECK`CHOSEN,%q<roll_stat>))][
          setq(roll_total,ladd(0 [iter(%q<roll_chosen>,elements(%i0,2,~))]))][
          setq(roll_record,roll(1d20[u(%!/FUN`SHOW`SIGNED,%q<roll_total>)],,record))]
        flags: [funsyntax]
      FUN`LEDGER: The ledger. %0 a character.
      FUN`LEDGER`OF:
        value: |-
          @@(%0 a character: their ledger as a JSON array, oldest entry first; entries without the wizard flag left out)\[[iter(sort(iter(lattr(%0/PF2E`LEDGER`*),if(hasflag(%0/%i0,wizard),last(%i0,`))),n),get(%0/PF2E`LEDGER`%i0),%b,\,)]\]
        flags: [funsyntax]
      FUN`COMMAND: Reading what was typed.
      FUN`COMMAND`ABILITY:
        value: |-
          @@(%0 typed text: the attribute it names, by its first three letters)[
          grab(str dex con int wis cha,left(lcstr(trim(%0)),3))]
        flags: [funsyntax]
      FUN`COMMAND`STAT:
        value: |-
          @@(%0 typed text: the statistic it names, else every statistic it is the start of)[
          setq(cmd_stat_text,lcstr(trim(%0)))][
          if(strlen(%q<cmd_stat_text>),
            firstof(grab(get({{core}}/DATA`STATISTICS),%q<cmd_stat_text>),graball(get({{core}}/DATA`STATISTICS),%q<cmd_stat_text>*)))]
        flags: [funsyntax]
      FUN`COMMAND`RANK:
        value: |-
          @@(%0 typed text: a rank 0 to 4 from its number or the start of its name)[
          setq(cmd_rank_text,lcstr(trim(%0)))][
          switch(1,
            not(strlen(%q<cmd_rank_text>)),,
            cand(isint(%q<cmd_rank_text>),gte(%q<cmd_rank_text>,0),lte(%q<cmd_rank_text>,4)),%q<cmd_rank_text>,
            gt(setr(cmd_rank_at,match(untrained trained expert master legendary,%q<cmd_rank_text>*)),0),dec(%q<cmd_rank_at>))]
        flags: [funsyntax]
      FUN`SHOW: What the commands draw. sheet_target and sheet_ledger the sheet.
      FUN`SHOW`SHEET:
        value: |-
          @@(the sheet: level and attributes, every statistic with its rank and modifier, what is granted, and the rules not applied)[
          u({{core}}/FUN`CHECK`PREPARE,%q<sheet_ledger>)][
          box(
            [fields(,
              Level,json_query(%q<check_actor>,extract,$.level),
              Attributes,iter(str dex con int wis cha,[capstr(%i0)] [u(%!/FUN`SHOW`SIGNED,json_query(%q<check_actor>,extract,$.abilities.%i0.mod))],%b,%b%b))]%r[
            rule()]%r[
            ldatatable(,Statistic|Rank|>Modifier,iter(get({{core}}/DATA`STATISTICS),u(%!/FUN`SHOW`STATISTIC,%i0),%b,%r),%r)]%r[
            rule()]%r[
            fields(,Granted,firstof(itemize(%q<check_names>,|),tone(muted,Nothing yet.)))][
            u(%!/FUN`SHOW`UNAPPLIED)],
            name(%q<sheet_target>))]
        flags: [funsyntax]
      FUN`SHOW`STATISTIC:
        value: |-
          @@(%0 a statistic: one row of the sheet's table)[
          capstr(%0)]|[u(%!/FUN`SHOW`RANK,json_query(%q<check_actor>,extract,$.skills.%0.rank))]|[u(%!/FUN`SHOW`SIGNED,ladd(0 [iter(u({{core}}/FUN`CHECK`CHOSEN,%0),elements(%i0,2,~))]))]
        flags: [funsyntax]
      # The rule elements of granted items that the core does not apply yet, by kind, so that a sheet
      # never looks complete when it is not.
      FUN`SHOW`UNAPPLIED:
        value: |-
          @@(check_unapplied the items with rules not applied: a line naming them, or nothing)[
          if(strlen(%q<check_unapplied>),%r[rule()]%r[tone(muted,Not applied yet: [itemize(%q<check_unapplied>,|)].)])]
        flags: [funsyntax]
      FUN`SHOW`ITEM:
        value: |-
          @@(%0 a pack, %1 an id, %2 a badge: the item's name, with its badge)[
          json_query(u({{core}}/FUN`ITEM`GET,%0,%1),extract,$.name)][if(strlen(%2),%b%2)]
        flags: [funsyntax]
      FUN`SHOW`RANK:
        value: |-
          extract(Untrained Trained Expert Master Legendary,inc(firstof(%0,0)),1)
        flags: [funsyntax]
      FUN`SHOW`LABEL:
        value: |-
          @@(%0 a modifier's slug, %1 its statistic: its label, the attribute's or the rank's name for those, else the synthetic's)[
          switch(%0,
            proficiency, u(%!/FUN`SHOW`RANK,json_query(%q<check_actor>,extract,$.skills.%1.rank)),
            str, Strength, dex, Dexterity, con, Constitution, int, Intelligence, wis, Wisdom, cha, Charisma,
            [setq(show_at,first(iter(lnum(0,dec(json_query(%q<check_synthetics>,size))),if(strmatch(json_query(%q<check_synthetics>,extract,$\[%i0\].modifier.slug),%0),%i0))))][
            firstof(if(strlen(%q<show_at>),json_query(%q<check_synthetics>,extract,$\[%q<show_at>\].modifier.label)),%0)])]
        flags: [funsyntax]
      FUN`SHOW`STAT`MISS:
        value: |-
          @@(%0 what was typed, %1 the statistics it is the start of: why it names none)[
          if(words(%1),
            %0 could be [itemize(%1,%b,or)]. Type more of the name.,
            There is no statistic called %0. The statistics are [itemize(get({{core}}/DATA`STATISTICS))].)]
        flags: [funsyntax]
      FUN`SHOW`SIGNED:
        value: |-
          if(gte(%0,0),+%0,%0)
        flags: [funsyntax]
      FUN`SHOW`CHECK:
        value: |-
          @@(the check: who rolled what, the modifiers that counted, and against a DC the degree)[
          setq(roll_face,json_query(%q<roll_record>,extract,$.dice\[0\].results\[0\].result))][
          setq(roll_result,json_query(%q<roll_record>,extract,$.total))][
          name(%q<sheet_target>)] rolls [capstr(%q<roll_stat>)]: [json_query(%q<roll_record>,extract,$.text)][
          if(strlen(%q<cmd_dc>),%bvs DC %q<cmd_dc>: [tone(strong,extract(Critical failure|Failure|Success|Critical success,inc(u({{core}}/FUN`DEGREE`OF`CHECK,%q<roll_result>,%q<cmd_dc>,%q<roll_face>)),1,|))])]%b(roll [json_query(%q<roll_record>,extract,$.id)])[
          if(words(%q<roll_chosen>),%r[tone(muted,iter(%q<roll_chosen>,[u(%!/FUN`SHOW`LABEL,elements(%i0,3,~),%q<roll_stat>)] [u(%!/FUN`SHOW`SIGNED,elements(%i0,2,~))],%b,%,%b))])]
        flags: [funsyntax]
      FUN`SHOW`LEDGER:
        value: |-
          @@(the ledger: every entry, oldest first, with who made it)[
          box(if(json_query(%q<sheet_ledger>,size),ldatatable(,>#|Entry|By,json_map(%!/FUN`SHOW`ENTRY,%q<sheet_ledger>,%r),%r),tone(muted,No entries yet.)),[name(%q<sheet_target>)]'s ledger)]
        flags: [funsyntax]
      FUN`SHOW`ENTRY:
        value: |-
          @@(%1 one entry: a row of the ledger's table)[
          json_query(%1,extract,$.n)]|[switch(json_query(%1,extract,$.kind),
            level, Level [json_query(%1,extract,$.level)],
            ability, [capstr(json_query(%1,extract,$.ability))] [u(%!/FUN`SHOW`SIGNED,json_query(%1,extract,$.mod))],
            rank, [capstr(json_query(%1,extract,$.stat))] [u(%!/FUN`SHOW`RANK,json_query(%1,extract,$.rank))],
            grant, Grant [u(%!/FUN`SHOW`ITEM,json_query(%1,extract,$.pack),json_query(%1,extract,$.id),json_query(%1,extract,$.badge))],
            revoke, Revoke entry [json_query(%1,extract,$.entry)],
            json_query(%1,extract,$.kind))]|[name(json_query(%1,extract,$.by))]
        flags: [funsyntax]

  - ref: data_actions
    type: thing
    name: "PF2e Data: actions"
    location: "{{core}}"
    attributes:
      ITEM: "Items of the Foundry pack actions. ITEM`<ID> is the item as Foundry stores it, less its description and embedded items; leaves TEXT (the description), HASH (the feed's hash of the whole item), BOOK, and EMBED`<ID> for each embedded item. <ID> is Foundry's _id in upper case."
      NAME: "NAME`<slug> lists the ids of the items with that name, the name in lower case with every run of other characters a hyphen."

