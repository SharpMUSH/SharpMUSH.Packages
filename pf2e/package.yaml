        flags: [cmdsyntax]
      INC`DEITY`DESTROY:
        value: |-
          think setq(deity_slug,u({{core}}/FUN`DEITY`FIND,%q<cmd_args>)); @assert strlen(%q<deity_slug>)=@pemit %#=notice(PF2E,There is no deity called %q<cmd_args>.,warn); think setq(deity_name,json_query(u({{core}}/FUN`DEITY`GET,%q<deity_slug>),extract,$.name)); &DEITY`%q<deity_slug> {{core}}; think u({{core}}/FUN`CACHE`BUMP); @pemit %#=notice(PF2E,Removed %q<deity_name>. A character who chose them keeps the choice but gets nothing from it until a deity called %q<deity_name> is added again.,ok)
        flags: [cmdsyntax]
      INC`DEITY`SAMPLES:
        value: |-
          think setq(deity_new,squish(iter(lattr({{core}}/DATA`DEITY`SAMPLE`*),if(strlen(u({{core}}/FUN`DEITY`GET,lcstr(after(%i0,DATA`DEITY`SAMPLE`)))),,lcstr(after(%i0,DATA`DEITY`SAMPLE`)))))); @assert words(%q<deity_new>)=@pemit %#=notice(PF2E,Every sample deity is in the table already.,warn); @dolist/inplace %q<deity_new>={think setq(deity_json,get({{core}}/DATA`DEITY`SAMPLE`##)); think setq(deity_json,json_mod(%q<deity_json>,patch,json(object,spells,json(string,u(%!/FUN`DEITY`SPELLS,json_query(%q<deity_json>,extract,$.spells),0))))); &DEITY`## {{core}}=%q<deity_json>}; think u({{core}}/FUN`CACHE`BUMP); @pemit %#=notice(PF2E,Added [words(%q<deity_new>)] sample deities: [itemize(iter(%q<deity_new>,json_query(get({{core}}/DATA`DEITY`SAMPLE`%i0),extract,$.name),%b,|),|)]. They are a starting point: +deity/set changes them and +deity/destroy removes one.,ok)
