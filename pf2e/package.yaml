    type: thing
    name: PF2e Commands
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      CMD`SHEET:
        value: |-
          $(?is)^\+sheet(?\: +(.*))?$:think setq(cmd_target,trim(%1)); @include %!/INC`TARGET`VIEW; think setq(sheet_round,0); @include %!/INC`SHEET`SHOW
        flags: [regexp, cmdsyntax]
      # Shows the sheet, first working out in queue entries of their own the parts not in the cache, so a
      # big sheet seen the first time stays under the function invocation limit.
