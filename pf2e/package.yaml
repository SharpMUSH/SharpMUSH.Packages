              if(cand(member(u({{core}}/DATA`CONFIG`BOOKS),get(%q<list_store>/ITEM`%i0`BOOK)),lte(json_query(setr(list_prep,get(%q<list_store>/ITEM`%i0`PREP)),extract,$.level),%q<list_level>),u(%!/FUN`BUILD`FEAT`FITS,%q<list_kind>,%q<list_prep>),cor(not(strlen(%1)),strmatch(json_query(%q<list_prep>,extract,$.name),*%1*))),
                [rjust(json_query(%q<list_prep>,extract,$.level),2,0)] [json_query(%q<list_prep>,extract,$.name)]),
              |,|),a,|,|),%i0,|,|)],
            #-1)]
        flags: [funsyntax]
      FUN`BUILD`LIST`GEAR:
        value: |-
          @@(%0 text the name holds: price and name of the equipment that matches, at most 60)[
          if(lt(strlen(%0),3),Name at least three letters: +build/list gear sword.,
            [setq(list_store,u({{core}}/DATA`PACK`EQUIPMENT))][
            setq(list_ids,iter(lattr(%q<list_store>/NAME`*[u({{core}}/FUN`ITEM`SLUGGIFY,%0)]*),get(%q<list_store>/%i0)))][
            iter(extract(sort(iter(%q<list_ids>,if(cand(member(u({{core}}/DATA`CONFIG`BOOKS),get(%q<list_store>/ITEM`%i0`BOOK)),lte(json_query(setr(list_prep,get(%q<list_store>/ITEM`%i0`PREP)),extract,$.level),%q<check_level>)),[json_query(%q<list_prep>,extract,$.name)] %([u(%!/FUN`SHOW`MONEY,u(%!/FUN`BUILD`PRICE,u({{core}}/FUN`ITEM`GET,equipment,%i0)))]%)),|,|),a,|,|),1,60,|),%i0,|,|)])]
        flags: [funsyntax]
      FUN`BUILD`GEAR`FIND:
        value: |-
          @@(%0 typed text: the id of the item of gear on the sheet it names)[
          setq(gear_text,trim(%0))][
          firstof(
            first(iter(%q<check_gear>,if(strmatch(u(%!/FUN`SHOW`ITEM,equipment,first(%i0,~),),%q<gear_text>),first(%i0,~)))),
            first(iter(%q<check_gear>,if(strmatch(u(%!/FUN`SHOW`ITEM,equipment,first(%i0,~),),%q<gear_text>*),first(%i0,~)))))]
        flags: [funsyntax]
      # An item's price in copper pieces: system.price.value in pp, gp, sp and cp, per a number of items when it says.
      FUN`BUILD`PRICE:
        value: |-
          @@(%0 an item)[
          setq(price_value,json_query(%0,extract,$.system.price.value))][
          ceil(fdiv(add(mul(1000,firstof(json_query(%q<price_value>,extract,$.pp),0)),mul(100,firstof(json_query(%q<price_value>,extract,$.gp),0)),mul(10,firstof(json_query(%q<price_value>,extract,$.sp),0)),firstof(json_query(%q<price_value>,extract,$.cp),0)),max(1,firstof(json_query(%0,extract,$.system.price.per),1))))]
        flags: [funsyntax]
      FUN`BUILD`FIND`ANY:
        value: |-
          @@(%0 a name: pack~id of the first item of that name, from a book the game uses)[
          first(iter(ancestries heritages backgrounds classes feats class-features ancestry-features spells actions conditions equipment,if(strlen(setr(find_id,u({{core}}/FUN`ITEM`FIND,%i0,%0))),%i0~%q<find_id>)))]
        flags: [funsyntax]
      # +build/info: an item's name, kind, level, traits, prerequisites and text.
      FUN`BUILD`INFO:
        value: |-
          @@(%0 a pack, %1 an id)[
          setqm(info_store,u({{core}}/DATA`PACK`%0),info_item,u({{core}}/FUN`ITEM`GET,%0,%1))][
          box(
            [fields(,
              Kind,squish([capstr(json_query(%q<info_item>,extract,$.type))] [json_query(%q<info_item>,extract,$.system.category)]),
              Level,firstof(json_query(%q<info_item>,extract,$.system.level.value),-),
              Traits,firstof(itemize(json_map({{core}}/FUN`RULE`SELECTOR,firstof(json_query(%q<info_item>,extract,$.system.traits.value),json(array)),|),|),-),
              Prerequisites,firstof(itemize(json_map(%!/FUN`BUILD`PREREQ`TEXT,firstof(json_query(%q<info_item>,extract,$.system.prerequisites.value),json(array)),|),|),-),
              Book,get(%q<info_store>/ITEM`%1`BOOK))]%r[
            rule()]%r[
            u(%!/FUN`SHOW`TEXT,get(%q<info_store>/ITEM`%1`TEXT))],
            json_query(%q<info_item>,extract,$.name))]
        flags: [funsyntax]
      FUN`BUILD`PREREQ`TEXT:
        value: |-
          json_query(%1,extract,$.value)
        flags: [funsyntax]
      FUN`LEDGER: The ledger. %0 a character.
      FUN`LEDGER`OF:
        value: |-
          @@(%0 a character: their ledger as a JSON array, oldest entry first; entries without the wizard flag left out)\[[iter(sort(iter(lattr(%0/PF2E`LEDGER`*),if(hasflag(%0/%i0,wizard),last(%i0,`))),n),get(%0/PF2E`LEDGER`%i0),%b,\,)]\]
        flags: [funsyntax]
      FUN`COMMAND: Reading what was typed.
      FUN`COMMAND`ABILITY:
        value: |-
          @@(%0 typed text: the attribute it names, by its first three letters)[
          grab(str dex con int wis cha,left(lcstr(trim(%0)),3))]
        flags: [funsyntax]
      FUN`COMMAND`STAT:
        value: |-
          @@(%0 typed text: the statistic it names, else every statistic it is the start of)[
          setq(cmd_stat_text,lcstr(trim(%0)))][
          if(strlen(%q<cmd_stat_text>),
            firstof(grab(get({{core}}/DATA`STATISTICS),%q<cmd_stat_text>),graball(get({{core}}/DATA`STATISTICS),%q<cmd_stat_text>*)))]
        flags: [funsyntax]
      FUN`COMMAND`RANK:
        value: |-
          @@(%0 typed text: a rank 0 to 4 from its number or the start of its name)[
          setq(cmd_rank_text,lcstr(trim(%0)))][
          switch(1,
            not(strlen(%q<cmd_rank_text>)),,
            cand(isint(%q<cmd_rank_text>),gte(%q<cmd_rank_text>,0),lte(%q<cmd_rank_text>,4)),%q<cmd_rank_text>,
            gt(setr(cmd_rank_at,match(untrained trained expert master legendary,%q<cmd_rank_text>*)),0),dec(%q<cmd_rank_at>))]
        flags: [funsyntax]
      FUN`SHOW: What the commands draw. sheet_target and sheet_ledger the sheet.
      FUN`SHOW`SHEET:
        value: |-
          @@(the sheet: who the character is, attributes, defenses, statistics, Strikes, what they carry and know, and the rules not applied)[
          u({{core}}/FUN`CHECK`PREPARE,%q<sheet_ledger>)][
          setq(show_spellcaster,gt(u({{core}}/FUN`CHECK`RANK,spellcasting),0))][
          box(
            [fields(,
              Level,%q<check_level>,
              Ancestry,firstof(squish([u(%!/FUN`SHOW`GRANTED,%q<check_heritage>)] [u(%!/FUN`SHOW`GRANTED,%q<check_ancestry>)]),tone(muted,none)),
              Background,firstof(u(%!/FUN`SHOW`GRANTED,%q<check_background>),tone(muted,none)),
              Class,firstof(u(%!/FUN`SHOW`GRANTED,%q<check_class>),tone(muted,none)),
              Attributes,iter(str dex con int wis cha,[capstr(%i0)] [u(%!/FUN`SHOW`SIGNED,u({{core}}/FUN`CHECK`ABILITY,%i0))],%b,%b%b))]%r[
            rule()]%r[
            fields(,
              Hit points,u({{core}}/FUN`CHECK`HP),
              AC,add(10,u({{core}}/FUN`CHECK`TOTAL,u({{core}}/FUN`CHECK`AC))),
              Speed,[u({{core}}/FUN`CHECK`SPEED)] feet,
              Class DC,add(10,u({{core}}/FUN`CHECK`TOTAL,u({{core}}/FUN`CHECK`CLASSDC))),
              if(%q<show_spellcaster>,Spells),if(%q<show_spellcaster>,attack [u(%!/FUN`SHOW`SIGNED,u({{core}}/FUN`CHECK`TOTAL,u({{core}}/FUN`CHECK`SPELL,attack)))]%, DC [add(10,u({{core}}/FUN`CHECK`TOTAL,u({{core}}/FUN`CHECK`SPELL,dc)))]))]%r[
            rule()]%r[
            ldatatable(,Statistic|Rank|>Modifier,iter(setunion(get({{core}}/DATA`STATISTICS) [iter(%q<check_stats>,if(strmatch(%i0,*-lore),%i0))],),u(%!/FUN`SHOW`STATISTIC,%i0),%b,%r),%r)]%r[
            rule()]%r[
            ldatatable(,Strike|>Attack|>MAP|Damage|Traits,iter(u({{core}}/FUN`CHECK`STRIKES),u(%!/FUN`SHOW`STRIKE,u({{core}}/FUN`STRIKE`LINE,%i0)),|,%r),%r)]%r[
            rule()]%r[
            fields(,
              Languages,firstof(itemize(iter(u(%!/FUN`SHOW`LANGUAGES),capstr(%i0))),tone(muted,none)),
              Money,u(%!/FUN`SHOW`MONEY,u({{core}}/FUN`SHEET`MONEY,%q<check_entries>)),
              Gear,firstof(itemize(iter(%q<check_gear>,[u(%!/FUN`SHOW`ITEM,equipment,first(%i0,~),)][if(gt(elements(%i0,2,~),1),%bx[elements(%i0,2,~)])][if(strlen(elements(%i0,3,~)),%b%([elements(%i0,3,~)]%))],%b,|),|),tone(muted,none)),
              if(words(setr(show_spells,iter(%q<check_grants>,if(strmatch(elements(%i0,2,~),spells),u(%!/FUN`SHOW`ITEM,spells,elements(%i0,3,~),)),%b,|))),Spells known),itemize(%q<show_spells>,|),
              Feats and features,firstof(itemize(iter(%q<check_grants>,if(match(spells conditions,elements(%i0,2,~)),,u(%!/FUN`SHOW`ITEM,elements(%i0,2,~),elements(%i0,3,~),elements(%i0,4,~))),%b,|),|),tone(muted,Nothing yet.)),
              if(words(setr(show_conditions,iter(%q<check_grants>,if(strmatch(elements(%i0,2,~),conditions),u(%!/FUN`SHOW`ITEM,conditions,elements(%i0,3,~),elements(%i0,4,~))),%b,|))),Conditions),itemize(%q<show_conditions>,|))][
            u(%!/FUN`SHOW`UNAPPLIED)],
            name(%q<sheet_target>))]
        flags: [funsyntax]
      FUN`SHOW`GRANTED:
        value: |-
          @@(%0 pack~id~index of a grant, or nothing: its item's name)[
          if(strlen(%0),u(%!/FUN`SHOW`ITEM,first(%0,~),elements(%0,2,~),))]
        flags: [funsyntax]
      FUN`SHOW`STRIKE:
        value: |-
          @@(%0 name|attack|second|third|damage|traits: one row of the Strikes table)[
          elements(%0,1,|)]|[u(%!/FUN`SHOW`SIGNED,elements(%0,2,|))]|[u(%!/FUN`SHOW`SIGNED,elements(%0,3,|))]/[u(%!/FUN`SHOW`SIGNED,elements(%0,4,|))]|[elements(%0,5,|)]|[elements(%0,6,|)]
        flags: [funsyntax]
      FUN`SHOW`LANGUAGES:
        value: |-
          @@(the languages known: the ancestry's and those taken)[
          setunion(if(strlen(%q<check_ancestry>),json_map({{core}}/FUN`RULE`SELECTOR,firstof(json_query(u({{core}}/FUN`CHECK`ITEM,%q<check_ancestry>),extract,$.system.languages.value),json(array)),%b)) [iter(graball(%q<check_entries>,language~*),elements(%i0,2,~))],)]
        flags: [funsyntax]
      FUN`SHOW`STATISTIC:
        value: |-
          @@(%0 a statistic: one row of the sheet's table)[
          u(%!/FUN`SHOW`STAT,%0)]|[u(%!/FUN`SHOW`RANK,u({{core}}/FUN`CHECK`RANK,%0))]|[u(%!/FUN`SHOW`SIGNED,u({{core}}/FUN`CHECK`TOTAL,u({{core}}/FUN`CHECK`CHOSEN,%0)))]
        flags: [funsyntax]
      FUN`SHOW`STAT:
        value: |-
          @@(%0 a statistic or proficiency: its name, Society Lore for society-lore)[
          if(strmatch(%0,*-lore),[capstr(edit(before(%0,-lore),-,%b))] Lore,capstr(edit(%0,-,%b)))]
        flags: [funsyntax]
      FUN`SHOW`MONEY:
        value: |-
          @@(%0 copper pieces: gold, silver and copper)[
          firstof(squish([if(div(%0,100),[div(%0,100)] gp)] [if(mod(div(%0,10),10),[mod(div(%0,10),10)] sp)] [if(mod(%0,10),[mod(%0,10)] cp)]),0 cp)]
        flags: [funsyntax]
      # Foundry's description HTML as plain text: tags dropped, links and checks by their labels, inline rolls by their formula.
      FUN`SHOW`TEXT:
        value: |-
          @@(%0 description HTML)[
          squish(edit(regeditall(%0,
            <\[^>\]*>,%b,
            @\\w+\\\[\[^\\\]\]*\\\]\{%(\[^\}\]*%)\},$1,
            @UUID\\\[\[^\\\]\]*\\.%(\[^.\\\]\]+%)\\\],$1,
            @Check\\\[%(?:type:%)?%(\[\\w-\]+%)\[^\\\]\]*\\\],$1 check,
            @\\w+\\\[\[^\\\]\]*\\\],,
            \\\[\\\[/\\w+\\s+,,
            \\\]\\\]\\\{\[^\\\}\]*\\\},,
            \\\]\\\],,
            \\\[%(\\w+%)\\\],%b$1,
            \[\\\{\\\}\],),&nbsp;,%b,&amp;,&,&lt;,<,&gt;,>,&quot;,"))]
        flags: [funsyntax]
      # The rule elements of granted items that the core does not apply yet, by kind, so that a sheet
      # never looks complete when it is not.
      FUN`SHOW`UNAPPLIED:
        value: |-
          @@(check_unapplied the items with rules not applied: a line naming them, or nothing)[
          if(strlen(%q<check_unapplied>),%r[rule()]%r[tone(muted,Not applied yet: [itemize(%q<check_unapplied>,|)].)])]
        flags: [funsyntax]
      FUN`SHOW`ITEM:
        value: |-
          @@(%0 a pack, %1 an id, %2 a badge: the item's name, with its badge)[
          json_query(u({{core}}/FUN`ITEM`GET,%0,%1),extract,$.name)][if(strlen(%2),%b%2)]
        flags: [funsyntax]
      FUN`SHOW`RANK:
        value: |-
          extract(Untrained Trained Expert Master Legendary,inc(firstof(%0,0)),1)
        flags: [funsyntax]
      FUN`SHOW`LABEL:
        value: |-
          @@(%0 a modifier's slug, %1 its statistic: its label, the attribute's or the rank's name for those, else the synthetic's)[
          switch(%0,
            proficiency, u(%!/FUN`SHOW`RANK,u({{core}}/FUN`CHECK`RANK,%1)),
            str, Strength, dex, Dexterity, con, Constitution, int, Intelligence, wis, Wisdom, cha, Charisma,
            [setq(show_at,first(iter(lnum(0,dec(json_query(%q<check_synthetics>,size))),if(strmatch(json_query(%q<check_synthetics>,extract,$\[%i0\].modifier.slug),%0),%i0))))][
            firstof(if(strlen(%q<show_at>),json_query(%q<check_synthetics>,extract,$\[%q<show_at>\].modifier.label)),%0)])]
        flags: [funsyntax]
      FUN`SHOW`STAT`MISS:
        value: |-
          @@(%0 what was typed, %1 the statistics it is the start of: why it names none)[
          if(words(%1),
            %0 could be [itemize(%1,%b,or)]. Type more of the name.,
            There is no statistic called %0. The statistics are [itemize(get({{core}}/DATA`STATISTICS))].)]
        flags: [funsyntax]
      FUN`SHOW`SIGNED:
        value: |-
          if(gte(%0,0),+%0,%0)
        flags: [funsyntax]
      FUN`SHOW`CHECK:
        value: |-
          @@(the check: who rolled what, the modifiers that counted, and against a DC the degree)[
          setq(roll_face,json_query(%q<roll_record>,extract,$.dice\[0\].results\[0\].result))][
          setq(roll_result,json_query(%q<roll_record>,extract,$.total))][
          name(%q<sheet_target>)] rolls [capstr(%q<roll_stat>)]: [json_query(%q<roll_record>,extract,$.text)][
          if(strlen(%q<cmd_dc>),%bvs DC %q<cmd_dc>: [tone(strong,extract(Critical failure|Failure|Success|Critical success,inc(u({{core}}/FUN`DEGREE`OF`CHECK,%q<roll_result>,%q<cmd_dc>,%q<roll_face>)),1,|))])]%b(roll [json_query(%q<roll_record>,extract,$.id)])[
          if(words(%q<roll_chosen>),%r[tone(muted,iter(%q<roll_chosen>,[u(%!/FUN`SHOW`LABEL,elements(%i0,3,~),%q<roll_stat>)] [u(%!/FUN`SHOW`SIGNED,elements(%i0,2,~))],%b,%,%b))])]
        flags: [funsyntax]
      FUN`SHOW`LEDGER:
        value: |-
          @@(the ledger: every entry, oldest first, with who made it)[
          box(if(json_query(%q<sheet_ledger>,size),ldatatable(,>#|Entry|By,json_map(%!/FUN`SHOW`ENTRY,%q<sheet_ledger>,%r),%r),tone(muted,No entries yet.)),[name(%q<sheet_target>)]'s ledger)]
        flags: [funsyntax]
      FUN`SHOW`ENTRY:
        value: |-
          @@(%1 one entry: a row of the ledger's table)[
          json_query(%1,extract,$.n)]|[switch(json_query(%1,extract,$.kind),
            level, Level [json_query(%1,extract,$.level)],
            ability, [capstr(json_query(%1,extract,$.ability))] [u(%!/FUN`SHOW`SIGNED,json_query(%1,extract,$.mod))],
            rank, [capstr(json_query(%1,extract,$.stat))] [u(%!/FUN`SHOW`RANK,json_query(%1,extract,$.rank))],
            grant, Grant [u(%!/FUN`SHOW`ITEM,json_query(%1,extract,$.pack),json_query(%1,extract,$.id),json_query(%1,extract,$.badge))],
            revoke, Revoke entry [json_query(%1,extract,$.entry)],
            boost, Boost [capstr(json_query(%1,extract,$.ability))],
            flaw, Flaw [capstr(json_query(%1,extract,$.ability))],
            language, Language [capstr(json_query(%1,extract,$.name))],
            choice, Choice [json_query(%1,extract,$.flag)] for entry [json_query(%1,extract,$.entry)]: [u(%!/FUN`BUILD`CHOICE`LABEL,json_query(%1,extract,$.value))],
            gear, [u(%!/FUN`SHOW`ITEM,equipment,json_query(%1,extract,$.id),)] x[json_query(%1,extract,$.qty)][if(strlen(json_query(%1,extract,$.where)),%b%([json_query(%1,extract,$.where)]%))],
            money, Money [u(%!/FUN`SHOW`SIGNED,json_query(%1,extract,$.cp))] cp,
            lock, Sheet finished,
            json_query(%1,extract,$.kind))]|[name(json_query(%1,extract,$.by))]
        flags: [funsyntax]

