      # Sample deities with names of their own, for +deity/samples to copy into the table: spells as
      # <rank> <spell name>, separated by |, turned into spell ids as they are copied.
      DATA`DEITY`SAMPLE`SOLENNE: '{"name":"Solenne","title":"the Dawnmother","text":"The sun that rises on everyone, saint and scoundrel alike. She heals the wounded, burns away what cannot be healed, and insists on a proper breakfast. Edicts: heal the sick, offer a second chance, greet each sunrise. Anathema: refuse help to someone who asks for it, create undead.","font":"heal","sanctification":"can holy","domains":"fire healing sun truth","alternate":"family","weapons":"scimitar","skill":"medicine","spells":"1 Breathe Fire|3 Fireball|4 Wall of Fire"}'
      DATA`DEITY`SAMPLE`GRUMBOLD: '{"name":"Grumbold","title":"the Anvil-Father","text":"Patron of forges, families and doing it properly the first time. His hammer has never missed a nail, mostly because the nails are afraid of it. Edicts: make things that last, keep your word, look after your kin. Anathema: break an oath, sell shoddy work as sound.","font":"heal","sanctification":"can holy","domains":"creation earth family protection","alternate":"wealth","weapons":"warhammer","skill":"crafting","spells":"1 Mystic Armor|2 Enlarge|5 Wall of Stone"}'
      DATA`DEITY`SAMPLE`VEXA: '{"name":"Vexa","title":"Queen of Thorns","text":"A tyrant who rules by contract and small print. Every bargain with her is fair, if you read all forty pages. Edicts: keep order, punish defiance, honor the letter of an agreement. Anathema: break a contract, release anyone from a bargain without payment.","font":"harm","sanctification":"must unholy","domains":"confidence pain trickery tyranny","alternate":"ambition","weapons":"whip","skill":"intimidation","spells":"1 Command|2 Blood Vendetta|3 Paralyze"}'
      DATA`DEITY`SAMPLE`THE-QUIET-LANTERN: '{"name":"The Quiet Lantern","title":"Keeper of the Last Door","text":"She lights the way out of life and makes sure nobody comes back the wrong way. Calm, patient, and never late. Edicts: bury the dead with care, ease the dying, put undead to rest. Anathema: create undead, rob a grave.","font":"heal","sanctification":"","domains":"death fate healing knowledge","alternate":"moon","weapons":"dagger","skill":"medicine","spells":"1 Sanctuary|2 Calm|4 Vision of Death"}'
      DATA`DEITY`SAMPLE`OLD-MOTHER-GORROW: '{"name":"Old Mother Gorrow","title":"the Root and the Rot","text":"Grandmother of the deep woods, who gives with one hand and composts with the other. Everything that grows feeds her, and so does everything that dies. Edicts: tend wild places, take only what you need, let the old make room for the new. Anathema: burn a forest for profit, waste a kill.","font":"heal harm","sanctification":"","domains":"moon nature water","alternate":"travel","weapons":"sickle","skill":"nature","spells":"1 Pest Form|2 Speak with Animals|3 Animal Form"}'
      DATA`DEITY`SAMPLE`RISTLE: '{"name":"Ristle","title":"the Fox at the Crossroads","text":"A trickster who never lies, exactly, and has never once been where anyone was looking. Travelers leave him a coin at crossroads; he usually leaves it there, because that is funnier. Edicts: outwit the powerful, keep moving, share a good joke. Anathema: betray a friend who trusts you, stay put out of fear.","font":"heal harm","sanctification":"can holy unholy","domains":"freedom luck travel trickery","alternate":"cities","weapons":"rapier","skill":"thievery","spells":"1 Illusory Disguise|2 Invisibility|3 Haste"}'
      DATA`DEITY`SAMPLE`MORDRAK: '{"name":"Mordrak","title":"the Hungering Dark","text":"Something under the world that wants everything to stop moving. Its priests promise that the dead never feel pain; they rarely mention why. Edicts: spread undeath, put out lights, outlast the living. Anathema: destroy an undead servant without need, heal the living out of mercy.","font":"harm","sanctification":"must unholy","domains":"darkness destruction nightmares undeath","alternate":"pain","weapons":"scythe","skill":"intimidation","spells":"1 Grim Tendrils|2 Darkness|3 Vampiric Feast"}'
      DATA`DEITY`SAMPLE`LADY-COIN: '{"name":"Lady Coin","title":"Mistress of the Market","text":"She smiles on fair trade, loud haggling and anyone who pays their debts on time. Her temples double as banks, and the interest rate is a matter of doctrine. Edicts: deal fairly, pay what you owe, make your city prosper. Anathema: counterfeit money, cheat a customer.","font":"heal","sanctification":"can holy","domains":"ambition cities luck wealth","alternate":"knowledge","weapons":"light-mace","skill":"society","spells":"1 Item Facade|2 Translate|3 Enthrall"}'
      DATA`DEITY`SAMPLE`BRANNOCH: '{"name":"Brannoch","title":"Stormfist","text":"God of thunder, contests and settling things outside. He holds that most problems yield to honest effort and the rest to a good punch. Edicts: test yourself, protect the weak, win fair. Anathema: strike a foe who has yielded, refuse a fair challenge.","font":"heal","sanctification":"can holy","domains":"air confidence might zeal","alternate":"protection","weapons":"fist","skill":"athletics","spells":"1 Thunderstrike|3 Lightning Bolt|4 Fly"}'
      # The lists a ChoiceSet names by config, as Foundry's CONFIG.PF2E has them.
      DATA`CHOICES`SKILLS: acrobatics arcana athletics crafting deception diplomacy intimidation medicine nature occultism performance religion society stealth survival thievery
      DATA`CHOICES`SAVES: fortitude reflex will
      DATA`CHOICES`WEAPONGROUPS: axe bomb bow brawling club crossbow dart firearm flail hammer knife pick polearm shield sling spear sword
      DATA`CHOICES`DAMAGETYPES: acid bludgeoning cold electricity fire force mental piercing poison slashing sonic spirit vitality void bleed
      DATA`CHOICES`ENERGYDAMAGETYPES: acid cold electricity fire force sonic vitality void
      DATA`STATISTIC: Each statistic's kind (skill, perception or save) and the attribute it is based on.
      DATA`STATISTIC`ACROBATICS: skill dex
      DATA`STATISTIC`ARCANA: skill int
      DATA`STATISTIC`ATHLETICS: skill str
      DATA`STATISTIC`CRAFTING: skill int
      DATA`STATISTIC`DECEPTION: skill cha
      DATA`STATISTIC`DIPLOMACY: skill cha
      DATA`STATISTIC`INTIMIDATION: skill cha
      DATA`STATISTIC`MEDICINE: skill wis
      DATA`STATISTIC`NATURE: skill wis
      DATA`STATISTIC`OCCULTISM: skill int
      DATA`STATISTIC`PERFORMANCE: skill cha
      DATA`STATISTIC`RELIGION: skill wis
      DATA`STATISTIC`SOCIETY: skill int
      DATA`STATISTIC`STEALTH: skill dex
      DATA`STATISTIC`SURVIVAL: skill wis
      DATA`STATISTIC`THIEVERY: skill dex
      DATA`STATISTIC`PERCEPTION: perception wis
      DATA`STATISTIC`FORTITUDE: save con
      DATA`STATISTIC`REFLEX: save dex
      DATA`STATISTIC`WILL: save wis
      FUN: Function attributes, one tree per part of the rules. Each is pure; none writes anything.
      FUN`PREDICATE: Predicates. %0 a predicate (a JSON array of statements), %1 the roll options, a space-separated list.
      # Foundry's Predicate.test: an empty predicate passes, a malformed one fails, otherwise every
      # statement must hold.
      FUN`PREDICATE`TEST:
        value: |-
          @@(Foundry Predicate.test: every statement in the array %0 holds for the roll options %1)[
          switch(json_query(%0,type),
            array, not(member(u(FUN`PREDICATE`RESULTS,%0,%1),0)),
            0)]
        flags: [funsyntax]
      # One 1 or 0 per statement of the JSON array %0.
      FUN`PREDICATE`RESULTS:
        value: |-
          json_map(me/FUN`PREDICATE`EACH,%0,%b,%1)
        flags: [funsyntax]
      # json_map's callback: %0 the statement's type, %1 the statement, %3 the roll options.
      FUN`PREDICATE`EACH:
        value: |-
          switch(%0,
            string, neq(member(%3,%1),0),
            object, u(FUN`PREDICATE`COMPOUND,%1,%3),
            0)
        flags: [funsyntax]
      # A statement that is an object: one operator and its operands, or if/then.
      FUN`PREDICATE`COMPOUND:
        value: |-
          @@(%0 a statement object, %1 the roll options)[
          setq(predicate_op,lcstr(json_map(me/FUN`PREDICATE`KEY,%0)))][
          switch(%q<predicate_op>,
            and, not(member(u(FUN`PREDICATE`RESULTS,json_query(%0,get,and),%1),0)),
            or, neq(member(u(FUN`PREDICATE`RESULTS,json_query(%0,get,or),%1),1),0),
            nand, neq(member(u(FUN`PREDICATE`RESULTS,json_query(%0,get,nand),%1),0),0),
            nor, not(member(u(FUN`PREDICATE`RESULTS,json_query(%0,get,nor),%1),1)),
            xor, eq(words(filter(me/FUN`PREDICATE`IS`ONE,u(FUN`PREDICATE`RESULTS,json_query(%0,get,xor),%1))),1),
            not, not(u(FUN`PREDICATE`RESULTS,\[[json_query(%0,get,not)]\],%1)),
            if then, u(FUN`PREDICATE`CONDITIONAL,%0,%1),
            then if, u(FUN`PREDICATE`CONDITIONAL,%0,%1),
            iff, u(FUN`PREDICATE`IFF,u(FUN`PREDICATE`RESULTS,json_query(%0,get,iff),%1)),
            eq, u(FUN`PREDICATE`EQUAL,json_query(%0,get,eq),%1),
            gt, u(FUN`PREDICATE`COMPARE,gt,json_query(%0,get,gt),%1),
            gte, u(FUN`PREDICATE`COMPARE,gte,json_query(%0,get,gte),%1),
            lt, u(FUN`PREDICATE`COMPARE,lt,json_query(%0,get,lt),%1),
            lte, u(FUN`PREDICATE`COMPARE,lte,json_query(%0,get,lte),%1),
            0)]
        flags: [funsyntax]
      FUN`PREDICATE`KEY:
        value: |-
          %2
        flags: [funsyntax]
      FUN`PREDICATE`IS`ONE:
        value: |-
          eq(%0,1)
        flags: [funsyntax]
      # if/then holds unless "if" holds and "then" does not.
      FUN`PREDICATE`CONDITIONAL:
        value: |-
          @@(%0 an if/then statement, %1 the roll options)[
          cor(not(u(FUN`PREDICATE`RESULTS,\[[json_query(%0,get,if)]\],%1)),
            u(FUN`PREDICATE`RESULTS,\[[json_query(%0,get,then)]\],%1))]
        flags: [funsyntax]
      # iff holds when its statements all hold or all fail. %0 their results.
      FUN`PREDICATE`IFF:
        value: |-
          cor(not(member(%0,0)),not(member(%0,1)))
        flags: [funsyntax]
      # eq: two strings are compared as text; a string and a number test the option <string>:<number>.
      FUN`PREDICATE`EQUAL:
        value: |-
          @@(%0 the operand array, %1 the roll options)[
          setq(predicate_left,json_query(%0,extract,$\[0\]),predicate_right,json_query(%0,extract,$\[1\]))][
          switch(json_query(json_query(%0,get,1),type),
            string, not(comp(%q<predicate_left>,%q<predicate_right>)),
            neq(member(%1,%q<predicate_left>:%q<predicate_right>),0))]
        flags: [funsyntax]
      # gt/gte/lt/lte: each side is a number or every value <operand>:<n> among the roll options; the
      # statement holds when some left value beats every right value, as in Foundry.
      FUN`PREDICATE`COMPARE:
        value: |-
          @@(%0 the operator, %1 the operand array, %2 the roll options)[
          setq(predicate_lefts,u(FUN`PREDICATE`VALUES,json_query(%1,extract,$\[0\]),%2))][
          setq(predicate_rights,u(FUN`PREDICATE`VALUES,json_query(%1,extract,$\[1\]),%2))][
          cand(words(%q<predicate_lefts>),words(%q<predicate_rights>),
            words(iter(%q<predicate_lefts>,if(u(FUN`PREDICATE`BEATS`ALL,%0,%i0,%q<predicate_rights>),%i0))))]
        flags: [funsyntax]
      FUN`PREDICATE`BEATS`ALL:
        value: |-
          @@(%0 the operator, %1 one left value, %2 every right value)[
          not(words(iter(%2,if(switch(%0,gt,gt(%1,%i0),gte,gte(%1,%i0),lt,lt(%1,%i0),lte(%1,%i0)),,%i0))))]
        flags: [funsyntax]
      FUN`PREDICATE`VALUES:
        value: |-
          @@(%0 an operand, %1 the roll options)[
          if(isnum(%0),%0,
            squish(iter(graball(%1,%0:*),if(cand(
              not(strmatch(after(%i0,%0:),*:*)),
              isnum(after(%i0,%0:))),
              after(%i0,%0:)))))]
        flags: [funsyntax]
      FUN`MODIFIER: Modifiers. %0 a JSON array of Foundry modifier objects (slug, type, modifier, force, ignored, predicate), %1 the roll options.
      # The modifiers that count, as Foundry's applyStackingRules picks them: a modifier whose predicate
      # fails or that is ignored is left out; untyped ones all count; of the ability modifiers only the
      # best (a forced one first); of every other type the highest bonus and the lowest penalty, the
      # first of equals. Gives type~value~slug for each.
      FUN`MODIFIER`CHOSEN:
        value: |-
          @@(%0 Foundry modifier objects, %1 the roll options)[
          u(FUN`MODIFIER`STACK,json_map(me/FUN`MODIFIER`FLAT,%0,%b,%1))]
        flags: [funsyntax]
      FUN`MODIFIER`STACK:
        value: |-
          @@(%0 type~value~slug~force for each modifier whose predicate holds: the ones that count, all of them when no two share a type)[
          setq(mod_types,iter(%0,first(%i0,~)))][
          if(eq(words(%q<mod_types>),words(setunion(%q<mod_types>,))),
            %0,
            [setq(mod_types,setdiff(%q<mod_types>,untyped ability))][
            squish(
              [u(FUN`MODIFIER`OF`TYPE,untyped,%0)]%b[
              u(FUN`MODIFIER`BEST`ABILITY,u(FUN`MODIFIER`OF`TYPE,ability,%0))]%b[
              iter(%q<mod_types>,u(FUN`MODIFIER`BEST`OF`TYPE,u(FUN`MODIFIER`OF`TYPE,%i0,%0)))])])]
        flags: [funsyntax]
      FUN`MODIFIER`TOTAL:
        value: |-
          @@(%0 Foundry modifier objects, %1 the roll options)[
          ladd(0 [iter(u(FUN`MODIFIER`CHOSEN,%0,%1),elements(%i0,2,~))])]
        flags: [funsyntax]
      FUN`MODIFIER`ENABLED:
        value: |-
          @@(%0 Foundry modifier objects, %1 the roll options: the slugs of the modifiers that count)[
          iter(u(FUN`MODIFIER`CHOSEN,%0,%1),elements(%i0,3,~))]
        flags: [funsyntax]
      # json_map's callback: %1 one modifier object, %3 the roll options. Gives type~value~slug~force, or
      # nothing when the modifier is ignored or its predicate fails. An unknown type is untyped.
      FUN`MODIFIER`FLAT:
        value: |-
          @@(%1 one modifier object, %3 the roll options)[
          if(cand(not(json_query(%1,extract,$.ignored)),
            u(FUN`PREDICATE`TEST,firstof(json_query(%1,get,predicate),\[\]),%3)),
            u(FUN`MODIFIER`ENTRY,%1))]
        flags: [funsyntax]
      FUN`MODIFIER`ENTRY:
        value: |-
          @@(%0 one modifier object: type~value~slug~force~damage type~damage category~critical, critical y, f or n for true, false or none)[
          u(FUN`MODIFIER`TYPE,json_query(%0,extract,$.type))]~[add(0,json_query(%0,extract,$.modifier))]~[firstof(json_query(%0,extract,$.slug),modifier)]~[t(json_query(%0,extract,$.force))]~[json_query(%0,extract,$.damageType)]~[json_query(%0,extract,$.damageCategory)]~[switch(json_query(%0,extract,$.critical),true,y,false,f,n)]
        flags: [funsyntax]
      FUN`MODIFIER`TYPE:
        value: |-
          if(match(ability circumstance item potency proficiency status untyped,%0),%0,untyped)
        flags: [funsyntax]
      FUN`MODIFIER`OF`TYPE:
        value: |-
          @@(%0 a type, %1 type~value~slug~force entries)[
          iter(%1,if(strmatch(first(%i0,~),%0),%i0))]
        flags: [funsyntax]
      FUN`MODIFIER`BEST`ABILITY:
        value: |-
          @@(%0 the ability entries: the last forced one, else the first highest)[
          setq(mod_forced,iter(%0,if(elements(%i0,4,~),%i0)))][
          if(words(%q<mod_forced>),last(%q<mod_forced>),u(FUN`MODIFIER`FIRST`AT,%0,lmax(iter(%0,elements(%i0,2,~)))))]
        flags: [funsyntax]
      FUN`MODIFIER`BEST`OF`TYPE:
        value: |-
          @@(%0 the entries of one type: the first highest bonus and the first lowest penalty)[
          setq(mod_bonuses,iter(%0,if(gte(elements(%i0,2,~),0),%i0)))][
          setq(mod_penalties,iter(%0,if(lt(elements(%i0,2,~),0),%i0)))][
          squish(
            [u(FUN`MODIFIER`FIRST`AT,%q<mod_bonuses>,lmax(iter(%q<mod_bonuses>,elements(%i0,2,~))))]%b[
            u(FUN`MODIFIER`FIRST`AT,%q<mod_penalties>,lmin(iter(%q<mod_penalties>,elements(%i0,2,~))))])]
        flags: [funsyntax]
      FUN`MODIFIER`FIRST`AT:
        value: |-
          @@(%0 entries, %1 a value: the first entry with that value; nothing when there are no entries)[
          if(words(%0),first(iter(%0,if(eq(elements(%i0,2,~),%1),%i0))))]
        flags: [funsyntax]
      FUN`DEGREE: Degrees of success, 0 critical failure, 1 failure, 2 success, 3 critical success.
      # Foundry's DegreeOfSuccess: 10 over the DC is a critical success and 10 under a critical failure;
      # a natural 20 raises the degree one step and a natural 1 lowers it.
      FUN`DEGREE`OF`CHECK:
        value: |-
          @@(%0 the check's total, %1 the DC, %2 the d20's face)[
          setq(degree_base,
            switch(1,
              gte(sub(%0,%1),10), 3,
              gte(sub(%1,%0),10), 0,
              gte(%0,%1), 2,
              1))][
          switch(%2,
            20, min(3,inc(%q<degree_base>)),
            1, max(0,dec(%q<degree_base>)),
            %q<degree_base>)]
        flags: [funsyntax]
      FUN`ROLL: A check's d20 as Foundry's Check.roll makes it. FUN`CHECK`GRANT collects the roll rules (Note, RollTwice, AdjustDegreeOfSuccess, SubstituteRoll, and DamageDice and DamageAlteration for FUN`DAMAGE) in check_rollrules as kind~pack~id~badge~index.
      # The rules of one kind that apply to a check: each one's selectors meet the domains and its
      # predicate holds. pack~id~badge~index~rule for each, rule its index in the item's rules.
      FUN`ROLLRULE`MATCHING:
        value: |-
          @@(%0 a rule kind, %1 the domains, %2 the roll options)[
          squish(iter(graball(%q<check_rollrules>,%0~*),u(FUN`ROLLRULE`OF,rest(%i0,~),%0,%1,%2)))]
        flags: [funsyntax]
      FUN`ROLLRULE`OF:
        value: |-
          @@(%0 pack~id~badge~index of a grant, %1 a rule kind, %2 the domains, %3 the roll options)[
          setq(rr_item,u(FUN`ITEM`GET,first(%0,~),elements(%0,2,~)))][
          setq(rr_rules,firstof(json_query(%q<rr_item>,extract,$.system.rules),json(array)))][
          setq(rr_data,u(FUN`ROLLRULE`DATA,%0))][
          iter(json_map(me/FUN`CHECK`RULEKEY,%q<rr_rules>,%b,%1),if(u(FUN`ROLLRULE`FITS,json_query(%q<rr_rules>,extract,$\[%i0\]),%2,%3),%0~%i0))]
        flags: [funsyntax]
      FUN`ROLLRULE`DATA:
        value: |-
          @@(%0 pack~id~badge~index of a grant; rr_item its item: the roll data its rules read)[
          json(object,actor,firstof(%q<check_actor>,json(object)),item,u(FUN`ITEM`DATA,%q<rr_item>,elements(%0,3,~),u(FUN`CHECK`CHOICES,elements(%0,4,~))))]
        flags: [funsyntax]
      # A SubstituteRoll with no selector is for every check, and a rule that adjusts the degree of
      # whoever rolls against its actor (affects origin or target) is not one of its own checks.
      FUN`ROLLRULE`FITS:
        value: |-
          @@(%0 a rule, %1 the domains, %2 the roll options; rr_data the roll data)[
          cand(
            not(match(origin target,json_query(%0,extract,$.affects))),
            words(setinter(firstof(u(FUN`RULE`SELECTORS,%0,%q<rr_data>),if(strmatch(json_query(%0,extract,$.key),SubstituteRoll),check)),%1)),
            u(FUN`PREDICATE`TEST,u(FUN`FORMULA`INJECT,firstof(json_query(%0,get,predicate),json(array)),%q<rr_data>),%2))]
        flags: [funsyntax]
      FUN`ROLLRULE`GET:
        value: |-
          @@(%0 pack~id~badge~index~rule)[
          json_query(u(FUN`ITEM`GET,first(%0,~),elements(%0,2,~)),extract,$.system.rules\[[elements(%0,5,~)]\])]
        flags: [funsyntax]
      # Foundry's label: the rule's own, else its item's name without an Effect: or Stance: in front.
      FUN`ROLLRULE`LABEL:
        value: |-
          @@(%0 pack~id~badge~index~rule)[
          firstof(u(FUN`LANG,json_query(u(FUN`ROLLRULE`GET,%0),extract,$.label)),
            regeditall(json_query(u(FUN`ITEM`GET,first(%0,~),elements(%0,2,~)),extract,$.name),^\[^:\]+:\\s+,))]
        flags: [funsyntax]
      # RollTwice: higher or lower when the rules that apply all keep the same, nothing when none
      # applies or they disagree.
      FUN`ROLL`TWICE:
        value: |-
          @@(%0 the domains, %1 the roll options)[
          setq(twice_keeps,setunion(iter(u(FUN`ROLLRULE`MATCHING,RollTwice,%0,%1),firstof(json_query(u(FUN`ROLLRULE`GET,%i0),extract,$.keep),higher)),))][
          if(eq(words(%q<twice_keeps>),1),%q<twice_keeps>)]
        flags: [funsyntax]
      # SubstituteRoll: slug~required~value~effect~pack~id~badge~index~rule for each that applies, the
      # value held between 1 and 20, the slug the rule's or the item's name sluggified.
      FUN`ROLL`SUBSTITUTES:
        value: |-
          @@(%0 the domains, %1 the roll options)[
          squish(iter(u(FUN`ROLLRULE`MATCHING,SubstituteRoll,%0,%1),u(FUN`ROLL`SUBSTITUTE,%i0)))]
        flags: [funsyntax]
      FUN`ROLL`SUBSTITUTE:
        value: |-
          @@(%0 pack~id~badge~index~rule)[
          setq(rr_item,u(FUN`ITEM`GET,first(%0,~),elements(%0,2,~)))][
          setq(rr_rule,json_query(%q<rr_item>,extract,$.system.rules\[[elements(%0,5,~)]\]))][
          setq(rr_value,u(FUN`FORMULA`VALUE,json_query(%q<rr_rule>,get,value),json_mod(u(FUN`ROLLRULE`DATA,%0),set,$.rule,%q<rr_rule>),))][
          if(isnum(%q<rr_value>),
            [firstof(json_query(%q<rr_rule>,extract,$.slug),u(FUN`ITEM`SLUGGIFY,json_query(%q<rr_item>,extract,$.name)))]~[strmatch(json_query(%q<rr_rule>,extract,$.required),true)]~[max(1,min(20,trunc(%q<rr_value>)))]~[firstof(json_query(%q<rr_rule>,extract,$.effectType),fortune)]~%0)]
        flags: [funsyntax]
      # The substitution that counts: a required one first, else the one asked for by its slug (or the
      # start of it).
      FUN`ROLL`CHOOSE:
        value: |-
          @@(%0 the domains, %1 the roll options, %2 a slug or nothing)[
          setq(sub_all,u(FUN`ROLL`SUBSTITUTES,%0,%1))][
          firstof(
            first(iter(%q<sub_all>,if(elements(%i0,2,~),%i0))),
            if(strlen(%2),firstof(first(iter(%q<sub_all>,if(strmatch(first(%i0,~),%2),%i0))),first(iter(%q<sub_all>,if(strmatch(first(%i0,~),%2*),%i0))))))]
        flags: [funsyntax]
      # What the d20 is before it is rolled. A substitution and a RollTwice of opposite effects cancel
      # each other: the d20 is a plain one, and the check takes both the fortune and misfortune options.
      # Sets roll_twice, roll_sub, roll_dice (the d20's formula, or the substitution's number), roll_tags
      # (|-separated: Fortune, Misfortune or the substitution) and roll_extra (the roll options this adds,
      # substitute:<slug> among them, which AdjustModifier rules such as Assurance's read).
      FUN`ROLL`PLAN:
        value: |-
          @@(%0 the domains, %1 the roll options, %2 the substitution asked for, a slug or nothing)[
          setq(roll_twice,u(FUN`ROLL`TWICE,%0,%1))][
          setq(roll_sub,u(FUN`ROLL`CHOOSE,%0,%1,%2))][
          setq(roll_effects,setunion(elements(%q<roll_sub>,4,~) [switch(%q<roll_twice>,higher,fortune,lower,misfortune)],))][
          switch(1,
            eq(words(%q<roll_effects>),2), setqm(roll_sub,,roll_twice,,roll_dice,1d20,roll_tags,Fortune|Misfortune,roll_extra,fortune misfortune),
            t(strlen(%q<roll_sub>)), setqm(roll_dice,elements(%q<roll_sub>,3,~),roll_tags,[capstr(elements(%q<roll_sub>,4,~))] %([u(FUN`ROLLRULE`LABEL,elements(%q<roll_sub>,5 6 7 8 9,~,~))]%),roll_extra,%q<roll_effects> substitute:[first(%q<roll_sub>,~)]),
            setqm(roll_dice,switch(%q<roll_twice>,higher,2d20kh1,lower,2d20kl1,1d20),roll_tags,switch(%q<roll_twice>,higher,Fortune,lower,Misfortune),roll_extra,%q<roll_effects>))]
        flags: [funsyntax]
      # The check's roll options: the sheet's, its domains', and the statistic's, as Foundry's Statistic adds them.
      FUN`ROLL`OPTIONS:
        value: |-
          @@(%0 a statistic, %1 1 for initiative rolled with it)[
          squish(%q<check_options> [u(FUN`ROLLOPTION`DOMAINS,u(FUN`STAT`DOMAINS,%0)[if(%1,%binitiative)])] [if(%1,check:statistic:initiative check:statistic:base:%0 check:type:initiative,check:statistic:%0 check:type:[switch(u(FUN`STAT`KIND,%0),skill,skill,lore,skill,save,saving-throw,perception,perception,%0)])])]
        flags: [funsyntax]
      # The roll, after FUN`ROLL`PLAN. Sets roll_record, roll_face (the d20's kept face, or the
      # substitution's number), roll_result, roll_post (check:total:<n>, check:total:natural:<face>,
      # check:total:delta:<n>), and against a DC roll_unadjusted, roll_degree (0 to 3) and roll_adjust
      # (amount~rule of the AdjustDegreeOfSuccess that changed it); then roll_notes, the Notes that show.
      FUN`ROLL`CHECK:
        value: |-
          @@(%0 the total modifier, %1 the domains, %2 the roll options with roll_extra, %3 a DC or nothing)[
          setq(roll_record,roll(%q<roll_dice>[if(gte(%0,0),+%0,%0)],,record))][
          setq(roll_face,if(strlen(%q<roll_sub>),elements(%q<roll_sub>,3,~),json_query(%q<roll_record>,extract,$.dice\[0\].total)))][
          setq(roll_result,json_query(%q<roll_record>,extract,$.total))][
          setq(roll_post,squish(check:total:%q<roll_result> [if(strlen(%q<roll_sub>),,check:total:natural:%q<roll_face>)] [if(strlen(%3),check:total:delta:[sub(%q<roll_result>,%3)])]))][
          if(strlen(%3),
            [setq(roll_unadjusted,u(FUN`DEGREE`OF`CHECK,%q<roll_result>,%3,%q<roll_face>))][
            setq(roll_adjust,u(FUN`ROLL`ADJUSTMENT,%q<roll_unadjusted>,%1,%2 %q<roll_post>))][
            setq(roll_degree,if(strlen(%q<roll_adjust>),u(FUN`ROLL`ADJUST`TO,%q<roll_unadjusted>,first(%q<roll_adjust>,~)),%q<roll_unadjusted>))],
            setqm(roll_unadjusted,,roll_adjust,,roll_degree,))][
          setq(roll_notes,u(FUN`ROLL`NOTES,%1,%2 %q<roll_post>,%q<roll_degree>))]
        flags: [funsyntax]
      # AdjustDegreeOfSuccess: every rule that applies writes its adjustments into one record, a later
      # rule's replacing an earlier one's for the same outcome. The first of all, criticalFailure,
      # failure, success, criticalSuccess that names an adjustment and is all or the degree rolled
      # counts, except one degree better on a critical success or worse on a critical failure.
      FUN`ROLL`ADJUSTMENT:
        value: |-
          @@(%0 the degree before, %1 the domains, %2 the roll options: amount~pack~id~badge~index~rule, or nothing)[
          setqm(ados_all,,ados_criticalFailure,,ados_failure,,ados_success,,ados_criticalSuccess,)][
          null(iter(u(FUN`ROLLRULE`MATCHING,AdjustDegreeOfSuccess,%1,%2),
            [setq(ados_rule,u(FUN`ROLLRULE`GET,%i0))][
            iter(all criticalFailure failure success criticalSuccess,if(strlen(setr(ados_amount,json_query(%q<ados_rule>,extract,$.adjustment.%i0))),setq(ados_%i0,%q<ados_amount>~%i1)))]))][
          first(iter(lnum(5),
            [setq(ados_at,r(ados_[extract(all criticalFailure failure success criticalSuccess,inc(%i0),1)]))][
            if(cand(strlen(%q<ados_at>),
              not(cand(eq(%0,3),strmatch(first(%q<ados_at>,~),one-degree-better))),
              not(cand(eq(%0,0),strmatch(first(%q<ados_at>,~),one-degree-worse))),
              cor(not(%i0),eq(dec(%i0),%0))),%q<ados_at>)]))]
        flags: [funsyntax]
      FUN`ROLL`ADJUST`TO:
        value: |-
          @@(%0 a degree, %1 an adjustment's amount: the degree it gives)[
          switch(%1,
            one-degree-better, min(3,inc(%0)),
            two-degrees-better, min(3,add(%0,2)),
            one-degree-worse, max(0,dec(%0)),
            two-degrees-worse, max(0,sub(%0,2)),
            to-critical-failure, 0,
            to-failure, 1,
            to-success, 2,
            to-critical-success, 3,
            %0)]
        flags: [funsyntax]
      # Notes: each Note rule that applies, kept when the check has no degree, the note names no
      # outcome, or its outcomes include the degree.
      FUN`ROLL`NOTES:
        value: |-
          @@(%0 the domains, %1 the roll options with the post-roll ones, %2 the degree or nothing)[
          squish(iter(u(FUN`ROLLRULE`MATCHING,Note,%0,%1),if(u(FUN`ROLL`NOTE`SHOWS,u(FUN`ROLLRULE`GET,%i0),%2),%i0)))]
        flags: [funsyntax]
      FUN`ROLL`NOTE`SHOWS:
        value: |-
          @@(%0 a Note rule, %1 the degree or nothing)[
          setq(note_out,json_query(%0,extract,$.outcome))][
          cor(not(strlen(%1)),not(strmatch(%q<note_out>,*"*)),strmatch(%q<note_out>,*"[extract(criticalFailure failure success criticalSuccess,inc(%1),1)]"*))]
        flags: [funsyntax]
      # A note as Foundry writes it: its title (the item's name reduced, or the rule's) and its text,
      # injected properties resolved (the item's description among them) and string keys in words.
      # HTML is left for the display.
      FUN`ROLL`NOTE`TEXT:
        value: |-
          @@(%0 pack~id~badge~index~rule)[
          setq(rr_item,u(FUN`ITEM`GET,first(%0,~),elements(%0,2,~)))][
          setq(rr_rule,json_query(%q<rr_item>,extract,$.system.rules\[[elements(%0,5,~)]\]))][
          setq(rr_text,json(string,get(u(DATA`PACK`[first(%0,~)])/ITEM`[elements(%0,2,~)]`TEXT)))][
          setq(rr_data,json_mod(json_mod(json_mod(u(FUN`ROLLRULE`DATA,%0),set,$.rule,%q<rr_rule>),set,$.item.description,%q<rr_text>),set,$.item.system.description,json(object,value,%q<rr_text>)))][
          setq(note_title,regeditall(u(FUN`LANG,trim(u(FUN`FORMULA`INJECT,json_query(%q<rr_rule>,extract,$.title),%q<rr_data>))),^\[^:\]+:\\s+,))][
          [if(strlen(%q<note_title>),%q<note_title>:%b)][u(FUN`LANG,u(FUN`FORMULA`INJECT,json_query(%q<rr_rule>,extract,$.text),%q<rr_data>))]]
        flags: [funsyntax]
      FUN`ROLL`NOTE`GM:
        value: |-
          @@(%0 pack~id~badge~index~rule: 1 when only the GM sees the note)[
          strmatch(json_query(u(FUN`ROLLRULE`GET,%0),extract,$.visibility),gm)]
        flags: [funsyntax]
      FUN`ROLLOPTION: RollOption rules that are not always on, as Foundry's RollOptionRuleElement sets them. FUN`CHECK`GRANT collects the grants with any in check_rollopts as pack~id~badge~index.
      # After the items' own options: each rule whose predicate holds sets its option, a toggle as its
      # ledger's toggle entries (else the rule's value) say, a count as option:<n>. Options of a domain
      # other than all go in check_domopts as domain~option, read by the checks of that domain.
      # check_toggles holds one domain~option~value~selection~pack~id~badge~index~enabled~suboptions~always~rule
      # per toggle, its suboptions' values joined by dots and rule the rule's index in the item's rules.
      FUN`ROLLOPTION`ALL:
        value: |-
          @@(check_rollopts the grants)[
          setqm(check_toggles,,check_domopts,)][
          null(iter(%q<check_rollopts>,u(FUN`ROLLOPTION`GRANT,%i0)))][
          setq(check_options,squish(%q<check_options>))]
        flags: [funsyntax]
      FUN`ROLLOPTION`GRANT:
        value: |-
          @@(%0 pack~id~badge~index)[
          setq(rr_item,u(FUN`ITEM`GET,first(%0,~),elements(%0,2,~)))][
          setq(ro_rules,firstof(json_query(%q<rr_item>,extract,$.system.rules),json(array)))][
          setq(rr_data,u(FUN`ROLLRULE`DATA,%0))][
          null(iter(json_map(me/FUN`CHECK`RULEKEY,%q<ro_rules>,%b,RollOption),u(FUN`ROLLOPTION`ONE,json_query(%q<ro_rules>,extract,$\[%i0\]),%0,%i0)))]
        flags: [funsyntax]
      FUN`ROLLOPTION`ONE:
        value: |-
          @@(%0 a RollOption rule, %1 pack~id~badge~index, %2 the rule's index; rr_data the roll data)[
          if(not(u(FUN`RULE`OPTION`STATIC,%0)),
            [setqm(ro_sel,,ro_domain,u(FUN`FORMULA`INJECT,firstof(json_query(%0,extract,$.domain),all),%q<rr_data>),ro_option,u(FUN`ROLLOPTION`CLEAN,u(FUN`FORMULA`INJECT,json_query(%0,extract,$.option),%q<rr_data>)))][
            setq(ro_test,%q<check_options> [u(FUN`ROLLOPTION`DOMAIN,%q<ro_domain>)])][
            if(cand(strlen(%q<ro_option>),u(FUN`PREDICATE`TEST,u(FUN`FORMULA`INJECT,firstof(json_query(%0,get,predicate),json(array)),%q<rr_data>),%q<ro_test>)),
              switch(json_query(%0,extract,$.toggleable),
                true, u(FUN`ROLLOPTION`TOGGLE,%0,%1,%2),
                totm, ,
                if(strmatch(json_query(%0,extract,$.count),true),
                  u(FUN`ROLLOPTION`COUNT),
                  u(FUN`ROLLOPTION`SET,not(strmatch(json_query(%0,extract,$.value),false))))))])]
        flags: [funsyntax]
      # Foundry keeps letters, digits, hyphens and colons, one of each in a row.
      FUN`ROLLOPTION`CLEAN:
        value: |-
          @@(%0 an option)[
          trim(regeditall(regeditall(regeditall(%0,\[^-:\\w\],),:+,:),-+,-))]
        flags: [funsyntax]
      FUN`ROLLOPTION`DOMAIN:
        value: |-
          @@(%0 a domain: the options set in it, nothing for all)[
          if(comp(%0,all),iter(graball(%q<check_domopts>,%0~*),rest(%i0,~)))]
        flags: [funsyntax]
      # The options of the domains a check reads, such as a skill's options for skill-check.
      FUN`ROLLOPTION`DOMAINS:
        value: |-
          @@(%0 the domains)[
          if(words(%q<check_domopts>),squish(iter(%0,u(FUN`ROLLOPTION`DOMAIN,%i0))))]
        flags: [funsyntax]
      FUN`ROLLOPTION`SET:
        value: |-
          @@(%0 1 to set ro_option, and ro_option:ro_sel with a selection, in ro_domain)[
          if(%0,
            if(strmatch(%q<ro_domain>,all),
              setq(check_options,%q<check_options> %q<ro_option>[if(strlen(%q<ro_sel>),%b%q<ro_option>:%q<ro_sel>)]),
              setq(check_domopts,%q<check_domopts> %q<ro_domain>~%q<ro_option>[if(strlen(%q<ro_sel>),%b%q<ro_domain>~%q<ro_option>:%q<ro_sel>)])))]
        flags: [funsyntax]
      # A count: option:1 the first time, then the number one higher for each rule after.
      FUN`ROLLOPTION`COUNT:
        value: |-
          @@(ro_option)[
          setq(ro_count,first(iter(%q<check_options>,if(cand(strmatch(%i0,%q<ro_option>:*),isint(after(%i0,%q<ro_option>:))),after(%i0,%q<ro_option>:)))))][
          setq(check_options,[if(strlen(%q<ro_count>),remove(%q<check_options>,%q<ro_option>:%q<ro_count>),%q<check_options>)] %q<ro_option>:[inc(firstof(%q<ro_count>,0))])]
        flags: [funsyntax]
      # A toggle: its value is the last toggle entry for its domain and option, else the rule's own;
      # always on when alwaysActive; disabledValue when disabledIf holds. With suboptions it takes the
      # selection asked for when that is still one of them, else the rule's, else the first. A rule
      # with suboptions of which none applies is left out. A mergeable rule whose option is already a
      # toggle adds its suboptions to that one.
      FUN`ROLLOPTION`TOGGLE:
        value: |-
          @@(%0 the rule, %1 pack~id~badge~index, %2 the rule's index; ro_domain, ro_option, ro_test)[
          setq(ro_subs,u(FUN`ROLLOPTION`SUBS,%0))][
          setq(ro_hassubs,cand(strlen(%q<ro_raw>),comp(%q<ro_raw>,\[\])))][
          setq(ro_have,first(iter(lnum(words(%q<check_toggles>)),if(strmatch(extract(%q<check_toggles>,inc(%i0),1),%q<ro_domain>~%q<ro_option>~*),inc(%i0)))))][
          setq(ro_state,elements(last(graball(%q<check_entries>,toggle~%q<ro_domain>|%q<ro_option>~*)),3,~))][
          switch(1,
            cand(%q<ro_hassubs>,not(words(%q<ro_subs>))), ,
            cand(strlen(%q<ro_have>),strmatch(json_query(%0,extract,$.mergeable),true)), u(FUN`ROLLOPTION`MERGE,%q<ro_have>),
            [setq(ro_always,strmatch(json_query(%0,extract,$.alwaysActive),true))][
            setq(ro_enabled,if(strlen(json_query(%0,extract,$.disabledIf)),not(u(FUN`PREDICATE`TEST,u(FUN`FORMULA`INJECT,json_query(%0,get,disabledIf),%q<rr_data>),%q<ro_test>)),1))][
            setq(ro_value,switch(1,
              %q<ro_always>, 1,
              cand(not(%q<ro_enabled>),match(true false,json_query(%0,extract,$.disabledValue))), strmatch(json_query(%0,extract,$.disabledValue),true),
              t(strlen(%q<ro_state>)), first(%q<ro_state>,|),
              strmatch(json_query(%0,extract,$.value),true)))][
            setq(ro_sel,if(words(%q<ro_subs>),firstof(if(member(%q<ro_subs>,setr(ro_asked,rest(%q<ro_state>,|))),%q<ro_asked>),if(member(%q<ro_subs>,setr(ro_asked,json_query(%0,extract,$.selection))),%q<ro_asked>),first(%q<ro_subs>))))][
            setq(check_toggles,%q<check_toggles> %q<ro_domain>~%q<ro_option>~%q<ro_value>~%q<ro_sel>~%1~%q<ro_enabled>~[edit(%q<ro_subs>,%b,.)]~%q<ro_always>~%2)][
            u(FUN`ROLLOPTION`SET,%q<ro_value>)])]
        flags: [funsyntax]
      FUN`ROLLOPTION`MERGE:
        value: |-
          @@(%0 the toggle's place in check_toggles; ro_subs this rule's suboptions)[
          setq(ro_had,extract(%q<check_toggles>,%0,1))][
          setq(check_toggles,replace(%q<check_toggles>,%0,[elements(%q<ro_had>,1 2 3 4 5 6 7 8 9,~,~)]~[edit(setunion(edit(elements(%q<ro_had>,10,~),.,%b),%q<ro_subs>),%b,.)]~[elements(%q<ro_had>,11 12,~,~)]))][
          if(cand(elements(%q<ro_had>,3,~),member(%q<ro_subs>,setr(ro_sel,rest(%q<ro_state>,|))),not(strmatch(elements(%q<ro_had>,4,~),%q<ro_sel>))),u(FUN`ROLLOPTION`SET,1))]
        flags: [funsyntax]
      # The values of the suboptions whose predicates hold: a list in the rule, or every skill for
      # config skills, its predicate read with {choice|value} the skill.
      FUN`ROLLOPTION`SUBS:
        value: |-
          @@(%0 the rule; rr_data, ro_test)[
          setq(ro_raw,json_query(%0,get,suboptions))][
          switch(left(%q<ro_raw>,1),
            \[, squish(json_map(me/FUN`ROLLOPTION`SUB,%q<ro_raw>,%b)),
            \{, if(strmatch(json_query(%q<ro_raw>,extract,$.config),skills),
              [setq(ro_ranks,iter(graball(%q<check_entries>,rank~*),skill:[elements(%i0,2,~)]:rank:[elements(%i0,3,~)]))][
              squish(iter(v(DATA`STATISTICS),if(cand(strmatch(u(FUN`STAT`KIND,%i0),skill),u(FUN`PREDICATE`TEST,edit(firstof(json_query(%q<ro_raw>,get,predicate),json(array)),\{choice|value\},%i0),%q<ro_test> %q<ro_ranks>)),%i0)))]))]
        flags: [funsyntax]
      FUN`ROLLOPTION`SUB:
        value: |-
          @@(json_map's callback, %1 a suboption)[
          if(u(FUN`PREDICATE`TEST,u(FUN`FORMULA`INJECT,firstof(json_query(%1,get,predicate),json(array)),%q<rr_data>),%q<ro_test>),json_query(%1,extract,$.value))]
        flags: [funsyntax]
      # Foundry's flag for a toggle's selection, the option in dromedary case: devise-a-stratagem is deviseAStratagem.
      FUN`ROLLOPTION`FLAG:
        value: |-
          @@(%0 an option)[
          setq(ro_words,lcstr(edit(edit(%0,:,%b),-,%b)))][
          [first(%q<ro_words>)][iter(rest(%q<ro_words>),capstr(%i0),%b,)]]
        flags: [funsyntax]
      FUN`LANG: Foundry's English strings, LANG`<KEY> on data_lang, from the feed's lang files.
      # A key such as PF2E.SpecificRule.Assurance.Note in words; text with @Localize[key] in it, each
      # in words. Anything else, or a key the game lacks, is left as it is.
      FUN`LANG:
        value: |-
          @@(%0 a key or text)[
          if(regmatch(%0,^PF2E\\.\[\\w.-\]+$),
            firstof(u(FUN`LANG`GET,%0),%0),
            if(strmatch(%0,*@Localize\[*),regeditall(%0,@Localize\\\[%(\[^\\\]\]+%)\\\],u(FUN`LANG`GET,$1)),%0))]
        flags: [funsyntax]
      FUN`LANG`GET:
        value: |-
          @@(%0 a key)[
          setq(lang_value,get(u(DATA`PACK`LANG)/LANG`%0))][
          if(strlen(%q<lang_value>),json_query(%q<lang_value>,unescape))]
        flags: [funsyntax]
      FUN`FORMULA: Rule element values. %1 is the roll data, a JSON object with actor, item and rule keys shaped like Foundry's.
      # Foundry's RuleElement.resolveValue for a number or a string: injected properties first, then a
      # whole number is that number, text without @ is that text, and a formula is rolled with the roll
      # data. A formula that names something the data lacks gives the default (%2), as in Foundry.
      FUN`FORMULA`VALUE:
        value: |-
          @@(%0 the value as JSON, %1 the roll data, %2 the default)[
          switch(json_query(%0,type),
            number, json_query(%0,extract,$),
            string, u(FUN`FORMULA`TEXT,trim(u(FUN`FORMULA`INJECT,json_query(%0,extract,$),%1)),%1,%2),
            boolean, json_query(%0,extract,$),
            %2)]
        flags: [funsyntax]
      FUN`FORMULA`TEXT:
        value: |-
          @@(%0 the text with injected properties resolved, %1 the roll data, %2 the default)[
          switch(1,
            regmatch(%0,^-?\\d+$), %0,
            not(strmatch(%0,*@*)), %0,
            u(FUN`FORMULA`ROLL,roll(%0,%1),%2))]
        flags: [funsyntax]
      FUN`FORMULA`ROLL:
        value: |-
          @@(%0 what roll gave, %1 the default)[
          if(strmatch(%0,#-*),%1,%0)]
        flags: [funsyntax]
      # {actor|<path>}, {item|<path>} and {rule|<path>} replaced by the value at that path in the roll data.
      FUN`FORMULA`INJECT:
        value: |-
          @@(%0 text, %1 the roll data)[
          if(regmatch(%0,\\x7B),
            regeditall(%0,\\x7B%(actor|item|rule%)\\|%(.*?%)\\x7D,u(FUN`FORMULA`PROPERTY,$1.$2,%1)),
            %0)]
        flags: [funsyntax]
      FUN`FORMULA`PROPERTY:
        value: |-
          @@(%0 a dotted path, %1 the roll data)[
          firstof(json_query(%1,extract,$.%0),undefined)]
        flags: [funsyntax]
      FUN`SHEET: The sheet's ledger, read once into entries. FUN`SHEET`ENTRIES takes the ledger, a JSON array of entry objects each with n (its number) and kind; every other FUN`SHEET` takes the entries it gives. A later entry wins; a revoke entry takes back the entry it names, and with it every entry whose parent is taken back.
      # Entry kinds: level {level}, ability {ability, mod}, boost {ability}, flaw {ability}, rank {stat,
      # rank}, grant {pack, id, badge, choices, level}, revoke {entry}, gear {id, qty, where}, money {cp}, signature {id, rank},
      # hp {value}, language {name}, choice {entry, flag, value: a selection made for grant entry's
      # ChoiceSet flag, its value read from the ledger by index}, lock. Any entry may name its parent (the entry it came with) and its step (the
      # builder's step it belongs to). A grant with a level counts from that character level on. The
      # ledger only grows: a change is a new entry, so the sheet's history is the ledger.
      FUN`SHEET`ENTRIES:
        value: |-
          @@(%0 the ledger: kind~key~value~n~parent~level~index~step for each entry not revoked, oldest first)[
          setq(sheet_all,json_map(me/FUN`SHEET`ENTRY,%0,%b))][
          setq(sheet_revoked,u(FUN`SHEET`REVOKED,%q<sheet_all>))][
          null(iter(%q<sheet_all>,if(cand(strlen(setr(sheet_parent,elements(%i0,5,~))),member(%q<sheet_revoked>,%q<sheet_parent>)),setq(sheet_revoked,%q<sheet_revoked> [elements(%i0,4,~)]))))][
          squish(iter(%q<sheet_all>,if(member(%q<sheet_revoked>,elements(%i0,4,~)),,%i0)))]
        flags: [funsyntax]
      # json_map's callback, %1 one entry, %2 its index. The key is what a later entry of the kind
      # replaces it by: the attribute, the statistic, pack|id for a grant, the item for gear.
      FUN`SHEET`ENTRY:
        value: |-
          @@(%1 one entry, %2 its index in the ledger)[
          setq(sheet_kind,json_query(%1,extract,$.kind))][
          %q<sheet_kind>]~[switch(%q<sheet_kind>,
            ability, json_query(%1,extract,$.ability),
            boost, json_query(%1,extract,$.ability),
            flaw, json_query(%1,extract,$.ability),
            rank, json_query(%1,extract,$.stat),
            grant, [json_query(%1,extract,$.pack)]|[ucstr(json_query(%1,extract,$.id))],
            gear, ucstr(json_query(%1,extract,$.id)),
            signature, ucstr(json_query(%1,extract,$.id)),
            formula, ucstr(json_query(%1,extract,$.id)),
            choice, [json_query(%1,extract,$.entry)]|[json_query(%1,extract,$.flag)],
            rune, [ucstr(json_query(%1,extract,$.id))]|[json_query(%1,extract,$.rune)],
            language, json_query(%1,extract,$.name),
            toggle, [json_query(%1,extract,$.domain)]|[json_query(%1,extract,$.option)])]~[switch(%q<sheet_kind>,
            level, json_query(%1,extract,$.level),
            ability, json_query(%1,extract,$.mod),
            rank, json_query(%1,extract,$.rank),
            grant, json_query(%1,extract,$.badge),
            revoke, json_query(%1,extract,$.entry),
            gear, [json_query(%1,extract,$.qty)]|[json_query(%1,extract,$.where)],
            money, json_query(%1,extract,$.cp),
            xp, json_query(%1,extract,$.xp),
            rune, json_query(%1,extract,$.value),
            hp, json_query(%1,extract,$.value),
            signature, json_query(%1,extract,$.rank),
            toggle, [strmatch(json_query(%1,extract,$.value),true)]|[json_query(%1,extract,$.selection)],
            1)]~[json_query(%1,extract,$.n)]~[json_query(%1,extract,$.parent)]~[json_query(%1,extract,$.level)]~%2~[json_query(%1,extract,$.step)]
        flags: [funsyntax]
      FUN`SHEET`REVOKED:
        value: |-
          @@(%0 entries: the numbers of the entries their revokes name)[
          iter(graball(%0,revoke~*),elements(%i0,3,~))]
        flags: [funsyntax]
      FUN`SHEET`VALUE:
        value: |-
          @@(%0 entries, %1 a kind, %2 a key: the value of the last entry of that kind and key)[
          elements(last(graball(%0,%1~%2~*)),3,~)]
        flags: [funsyntax]
      FUN`SHEET`LEVEL:
        value: |-
          @@(%0 entries: the character's level, 1 when none is set)[
          firstof(u(FUN`SHEET`VALUE,%0,level,),1)]
        flags: [funsyntax]
      # An attribute's modifier: an ability entry sets it; each boost after raises it by 1, or by half
      # once it is +4 or more (two partial boosts make +1, as the remastered rules have it); each flaw lowers it by 1.
      FUN`SHEET`ABILITY:
        value: |-
          @@(%0 entries, %1 an attribute such as str: its modifier)[
          first(fold(me/FUN`SHEET`BOOST,graball(%0,*~%1~*),0~0),~)]
        flags: [funsyntax]
      FUN`SHEET`BOOST:
        value: |-
          @@(%0 modifier~partial so far, %1 an entry)[
          setqm(boost_value,first(%0,~),boost_partial,rest(%0,~))][
          switch(first(%1,~),
            ability, [elements(%1,3,~)]~0,
            boost, if(lt(%q<boost_value>,4),[inc(%q<boost_value>)]~%q<boost_partial>,if(%q<boost_partial>,[inc(%q<boost_value>)]~0,%q<boost_value>~1)),
            flaw, [dec(%q<boost_value>)]~%q<boost_partial>,
            %0)]
        flags: [funsyntax]
      FUN`SHEET`RANK:
        value: |-
          @@(%0 entries, %1 a statistic such as athletics or will: its proficiency rank as rank entries set it, 0 untrained to 4 legendary)[
          firstof(u(FUN`SHEET`VALUE,%0,rank,%1),0)]
        flags: [funsyntax]
      FUN`SHEET`GRANTS:
        value: |-
          @@(%0 entries, %1 the character's level: n~pack~id~badge~index for each grant from that level or below or from no level, badge empty when it has none)[
          iter(graball(%0,grant~*),if(cor(not(strlen(elements(%i0,6,~))),lte(elements(%i0,6,~),%1)),[elements(%i0,4,~)]~[edit(elements(%i0,2,~),|,~)]~[elements(%i0,3,~)]~[elements(%i0,7,~)]))]
        flags: [funsyntax]
      FUN`SHEET`RUNES:
        value: |-
          @@(%0 entries, %1 an item of gear's id: its fundamental runes as Foundry's system.runes, from the rune entries for it)[
          setq(runes_out,json(object))][
          null(iter(potency striking resilient,if(strlen(setr(runes_one,u(FUN`SHEET`VALUE,%0,rune,[ucstr(%1)]|%i0))),setq(runes_out,json_mod(%q<runes_out>,patch,json(object,%i0,%q<runes_one>))))))]%q<runes_out>
        flags: [funsyntax]
      # An item of gear as the sheet has it: the equipment item with the runes etched onto it since.
      FUN`ITEM`RUNED:
        value: |-
          @@(%0 an equipment id; check_entries)[
          setqm(runed_item,u(FUN`ITEM`GET,equipment,%0),runed_runes,u(FUN`SHEET`RUNES,%q<check_entries>,%0))][
          if(strmatch(%q<runed_runes>,{}),%q<runed_item>,json_mod(%q<runed_item>,patch,json(object,system,json(object,runes,%q<runed_runes>))))]
        flags: [funsyntax]
      FUN`SHEET`GEAR:
        value: |-
          @@(%0 entries: id~qty~where for each item of gear the character still has)[
          iter(setunion(iter(graball(%0,gear~*),elements(%i0,2,~)),),if(gt(first(setr(gear_state,u(FUN`SHEET`VALUE,%0,gear,%i0)),|),0),%i0~[edit(%q<gear_state>,|,~)]))]
        flags: [funsyntax]
      FUN`ITEM: Items from the data objects. An item is the feed's ITEM` JSON, which is Foundry's item less its description.
      # What a sheet needs from an item, worked out once when the updater stores it, as ITEM`<id>`PREP:
      # v (DATA`PREP`VERSION), kind, name, slug, level, category, valued (a valued condition's own
      # badge), options (the roll options it gives its actor, less its badge's, with its RollOptions
      # that hold everywhere), opts (the item's own roll options, item:trait:<t> and the like, that a
      # builder's filter tests), unapplied (its rule kinds the core does not apply), dynamic and synth
      # (its FlatModifiers whose selectors reach the sheet: dynamic the indices of those that read the
      # roll data or are ability modifiers, synth the synthetics of the others, each with its
      # modifier's type~value~slug~force as flat), ranks (stat~rank for each proficiency it sets that is
      # the same on every sheet), rankdyn (the indices of its rank rules that read the roll data),
      # choices (the indices of its ChoiceSets), choiceopts (flag~option for each ChoiceSet that gives a
      # roll option), grants (the indices of its GrantItems) and strikes (the indices of its Strikes).
      FUN`ITEM`PREPARE:
        value: |-
          @@(%0 an item: its ITEM`<id>`PREP)[
          setqm(synthetic_item,%0,synthetic_rules,firstof(json_query(%0,extract,$.system.rules),json(array)),synthetic_slug,u(FUN`ITEM`SLUG,%0))][
          setq(synthetic_data,json(object,item,u(FUN`ITEM`DATA,%0,,json(object))))][
          setq(prepare_keys,json_map(me/FUN`RULE`KEY,%q<synthetic_rules>,%b))][
          setq(prepare_flat,u(FUN`ITEM`PREPARE`WHERE,FlatModifier,FUN`RULE`FOR`CHECKS))][
          setq(prepare_dynamic,iter(%q<prepare_flat>,if(u(FUN`RULE`DYNAMIC,json_query(%q<synthetic_rules>,extract,$\[%i0\])),%i0)))][
          setq(prepare_ranks,u(FUN`ITEM`PREPARE`WHERE,ActiveEffectLike,FUN`RULE`RANK`STAT))][
          setq(prepare_rank_static,iter(%q<prepare_ranks>,if(u(FUN`RULE`RANK`STATIC,json_query(%q<synthetic_rules>,extract,$\[%i0\])),%i0)))][
          setq(prepare_options,u(FUN`ITEM`PREPARE`WHERE,RollOption,FUN`RULE`OPTION`STATIC))][
          setq(prepare_choices,u(FUN`ITEM`PREPARE`WHERE,ChoiceSet,FUN`RULE`TRUE))][
          json(object,
            v,v(DATA`PREP`VERSION),
            kind,json(string,json_query(%0,extract,$.type)),
            name,json(string,json_query(%0,extract,$.name)),
            slug,json(string,%q<synthetic_slug>),
            level,firstof(json_query(%0,extract,$.system.level.value),0),
            category,json(string,json_query(%0,extract,$.system.category)),
            valued,json(string,u(FUN`ITEM`BADGE,%0,)),
            options,json(string,squish(u(FUN`ITEM`OPTIONS,%0,) [iter(%q<prepare_options>,json_query(%q<synthetic_rules>,extract,$\[%i0\].option))])),
            opts,json(string,u(FUN`ITEM`OWN`OPTIONS,%0)),
            unapplied,json(string,u(FUN`ITEM`PREPARE`UNAPPLIED)),
            dynamic,json(string,%q<prepare_dynamic>),
            synth,\[[json_map(me/FUN`ITEM`PREPARE`FLAT,fold(me/FUN`SYNTHETICS`RULE,iter(%q<prepare_flat>,if(member(%q<prepare_dynamic>,%i0),,%i0)),json(array)),\,)]\],
            ranks,json(string,squish(u(FUN`ITEM`RANKS,%0) [iter(%q<prepare_rank_static>,[u(FUN`RULE`RANK`STAT,json_query(%q<synthetic_rules>,extract,$\[%i0\]))]~[json_query(%q<synthetic_rules>,extract,$\[%i0\].value)])])),
            rankdyn,json(string,setdiff(%q<prepare_ranks>,%q<prepare_rank_static>)),
            choices,json(string,%q<prepare_choices>),
            choiceopts,json(string,squish(iter(%q<prepare_choices>,u(FUN`ITEM`PREPARE`CHOICEOPT,json_query(%q<synthetic_rules>,extract,$\[%i0\]),%i0)))),
            grants,json(string,u(FUN`ITEM`PREPARE`WHERE,GrantItem,FUN`RULE`TRUE)),
            strikes,json(string,u(FUN`ITEM`PREPARE`WHERE,Strike,FUN`RULE`TRUE)))]
        flags: [funsyntax]
      FUN`ITEM`PREPARE`FLAT:
        value: |-
          @@(%1 a synthetic: it with its modifier's type~value~slug~force as flat)[
          json_mod(%1,set,$.flat,json(string,u(FUN`MODIFIER`ENTRY,json_query(%1,get,modifier))))]
        flags: [funsyntax]
      FUN`ITEM`PREPARE`WHERE:
        value: |-
          @@(%0 a rule kind, %1 a test of one rule; prepare_keys each rule's kind, synthetic_rules the rules: the indices of the rules of that kind that pass)[
          iter(lnum(words(%q<prepare_keys>)),if(cand(strmatch(extract(%q<prepare_keys>,inc(%i0),1),%0),u(%1,json_query(%q<synthetic_rules>,extract,$\[%i0\]))),%i0))]
        flags: [funsyntax]
      # A rule kind is applied when the core reads every rule of it on the item: FlatModifiers, the
      # builder's ChoiceSets and GrantItems, Strikes, rank-setting ActiveEffectLikes and RollOptions
      # that hold everywhere.
      FUN`ITEM`PREPARE`UNAPPLIED:
        value: |-
          @@(prepare_keys, prepare_ranks, prepare_options: the rule kinds the core does not apply)[
          setunion(iter(lnum(words(%q<prepare_keys>)),
            switch(setr(prepare_key,extract(%q<prepare_keys>,inc(%i0),1)),
              FlatModifier,,ChoiceSet,,GrantItem,,Strike,,
              ActiveEffectLike,if(member(%q<prepare_ranks>,%i0),,ActiveEffectLike),
              RollOption,if(member(%q<prepare_options>,%i0),,RollOption),
              %q<prepare_key>)),)]
        flags: [funsyntax]
      FUN`ITEM`PREPARE`CHOICEOPT:
        value: |-
          @@(%0 a ChoiceSet, %1 its index: flag~option when it gives a roll option)[
          if(strlen(json_query(%0,extract,$.rollOption)),[u(FUN`RULE`CHOICE`FLAG,%0,%1)]~[json_query(%0,extract,$.rollOption)])]
        flags: [funsyntax]
      # stat~rank for each proficiency an item sets the same way on every sheet: a class's starting
      # proficiencies, the skills a class or background trains, and a feature's subfeatures.
      FUN`ITEM`RANKS:
        value: |-
          @@(%0 an item)[
          setq(rank_system,json_query(%0,extract,$.system))][
          squish(
            [switch(json_query(%0,extract,$.type),
              class, u(FUN`ITEM`RANKS`CLASS),
              background, u(FUN`ITEM`RANKS`TRAINED))] [
            json_map(me/FUN`ITEM`RANKS`SUB,firstof(json_query(%q<rank_system>,extract,$.subfeatures.proficiencies),json(object)),%b)])]
        flags: [funsyntax]
      FUN`ITEM`RANKS`CLASS:
        value: |-
          @@(rank_system a class's system)[
          squish(
            [iter(perception~perception fortitude~savingThrows.fortitude reflex~savingThrows.reflex will~savingThrows.will simple~attacks.simple martial~attacks.martial advanced~attacks.advanced unarmed~attacks.unarmed unarmored~defenses.unarmored light~defenses.light medium~defenses.medium heavy~defenses.heavy spellcasting~spellcasting,
              if(gt(setr(rank_value,firstof(json_query(%q<rank_system>,extract,$.[after(%i0,~)]),0)),0),[before(%i0,~)]~%q<rank_value>))] classdc~1 [
            u(FUN`ITEM`RANKS`TRAINED)])]
        flags: [funsyntax]
      FUN`ITEM`RANKS`TRAINED:
        value: |-
          @@(rank_system a class's or background's system: stat~1 for each skill it trains, a Lore as <slug>-lore)[
          json_map(me/FUN`ITEM`RANKS`SKILL,firstof(json_query(%q<rank_system>,extract,$.trainedSkills.value),json(array)),%b)] [
          json_map(me/FUN`ITEM`RANKS`LORE,firstof(json_query(%q<rank_system>,extract,$.trainedSkills.lore),json(array)),%b)]
        flags: [funsyntax]
      FUN`ITEM`RANKS`SKILL:
        value: |-
          %1~1
        flags: [funsyntax]
      FUN`ITEM`RANKS`LORE:
        value: |-
          [u(FUN`STAT`LORE,%1)]~1
        flags: [funsyntax]
      FUN`ITEM`RANKS`SUB:
        value: |-
          @@(%1 a subfeature proficiency, %2 its statistic)[
          if(isint(setr(rank_value,json_query(%1,extract,$.rank))),[lcstr(%2)]~%q<rank_value>)]
        flags: [funsyntax]
      # The item's own roll options as Foundry's filters read them: item:type (and item:type:feature for a class or ancestry feature), item:slug, item:level
      # (item:rank for a spell), item:category, item:rarity, and item:trait and item:tag for each.
      FUN`ITEM`OWN`OPTIONS:
        value: |-
          @@(%0 an item)[
          setq(own_level,firstof(json_query(%0,extract,$.system.level.value),0))][
          squish(item:type:[json_query(%0,extract,$.type)] [if(cand(strmatch(json_query(%0,extract,$.type),feat),match(classfeature ancestryfeature calling curse deityboon pfsboon,json_query(%0,extract,$.system.category))),item:type:feature)] item:slug:[u(FUN`ITEM`SLUG,%0)] item:level:%q<own_level> [
            if(strmatch(json_query(%0,extract,$.type),spell),item:rank:%q<own_level>)] [
            if(strlen(setr(own_category,json_query(%0,extract,$.system.category))),item:category:%q<own_category>)] item:rarity:[
            firstof(json_query(%0,extract,$.system.traits.rarity),common)] [
            json_map(me/FUN`ITEM`OWN`TRAIT,firstof(json_query(%0,extract,$.system.traits.value),json(array)),%b)] [
            json_map(me/FUN`ITEM`OWN`TAG,firstof(json_query(%0,extract,$.system.traits.otherTags),json(array)),%b)])]
        flags: [funsyntax]
      # The item options a data object indexes, as attribute names: TRAIT`<t>, TAG`<t>, CATEGORY`<c>, TYPE`<t>.
      FUN`ITEM`INDEXED:
        value: |-
          @@(%0 an item's own options)[
          iter(%0,if(regmatch(%i0,^item:%(trait|tag|category|type%):\[a-z0-9-\]+$),ucstr(edit(after(%i0,item:),:,`))))]
        flags: [funsyntax]
      FUN`ITEM`OWN`TRAIT:
        value: |-
          item:trait:%1
        flags: [funsyntax]
      FUN`ITEM`OWN`TAG:
        value: |-
          item:tag:%1
        flags: [funsyntax]
      FUN`ITEM`GET:
        value: |-
          @@(%0 a pack such as feats, %1 a Foundry id: the item, empty when the game lacks it)[
          setq(item_store,u(DATA`PACK`%0))][
          if(strlen(%q<item_store>),get(%q<item_store>/ITEM`%1))]
        flags: [funsyntax]
      # An item named by its Foundry id or by its name, from a book the game uses. Names are looked up
      # through the NAME`<slug> index the updater keeps on each data object.
      FUN`ITEM`FIND:
        value: |-
          @@(%0 a pack, %1 an id, a name or the start of only one name: the item's id, empty when no item from a book the game uses matches)[
          setq(item_store,u(DATA`PACK`%0))][
          if(strlen(%q<item_store>),
            firstof(
              first(iter(
                squish([if(strlen(get(%q<item_store>/ITEM`[ucstr(%1)])),ucstr(%1))] [get(%q<item_store>/NAME`[u(FUN`ITEM`SLUGGIFY,%1)])]),
                if(member(v(DATA`CONFIG`BOOKS),get(%q<item_store>/ITEM`%i0`BOOK)),%i0))),
              if(eq(words(setr(item_starts,u(FUN`ITEM`STARTS,%0,%1))),1),%q<item_starts>)))]
        flags: [funsyntax]
      FUN`ITEM`STARTS:
        value: |-
          @@(%0 a pack, %1 the start of a name: the ids of the items from books the game uses whose names start with it)[
          setq(item_store,u(DATA`PACK`%0))][
          if(cand(strlen(%q<item_store>),gte(strlen(%1),3)),
            squish(iter(lattr(%q<item_store>/NAME`[u(FUN`ITEM`SLUGGIFY,%1)]*),if(member(v(DATA`CONFIG`BOOKS),get(%q<item_store>/ITEM`[setr(item_one,get(%q<item_store>/%i0))]`BOOK)),%q<item_one>))))]
        flags: [funsyntax]
      # Foundry's item.slug, falling back to sluggify(name) as rule elements do.
      FUN`ITEM`SLUG:
        value: |-
          @@(%0 an item)[
          firstof(json_query(%0,extract,$.system.slug),u(FUN`ITEM`SLUGGIFY,json_query(%0,extract,$.name)))]
        flags: [funsyntax]
      FUN`ITEM`SLUGGIFY:
        value: |-
          @@(%0 a name: lower case, apostrophes dropped, every other run of non-letters a hyphen)[
          trim(regeditall(lcstr(regeditall(%0,\['’\],)),\[^a-z0-9\]+,-),-,b)]
        flags: [funsyntax]
      # The badge: the grant's own, else a valued condition's system.value.value.
      FUN`ITEM`BADGE:
        value: |-
          @@(%0 an item, %1 the grant's badge)[
          firstof(%1,if(t(json_query(%0,extract,$.system.value.isValued)),json_query(%0,extract,$.system.value.value)))]
        flags: [funsyntax]
      # What @item reads in a formula: the item's own fields, level and badge as Foundry's getters give
      # them, and the grant's choices as flags.system.rulesSelections.
      FUN`ITEM`DATA:
        value: |-
          @@(%0 an item, %1 its badge, %2 the grant's choices, a JSON object)[
          json(object,
            _id,json(string,json_query(%0,extract,$._id)),
            id,json(string,json_query(%0,extract,$._id)),
            name,json(string,json_query(%0,extract,$.name)),
            type,json(string,json_query(%0,extract,$.type)),
            slug,json(string,u(FUN`ITEM`SLUG,%0)),
            level,firstof(json_query(%0,extract,$.system.level.value),null),
            badge,if(strlen(%1),json(object,value,%1),null),
            system,firstof(json_query(%0,extract,$.system),json(object)),
            flags,json_mod(firstof(json_query(%0,extract,$.flags),json(object)),patch,json(object,system,json(object,rulesSelections,firstof(%2,json(object))))))]
        flags: [funsyntax]
      # The roll options an item gives its actor, as each Foundry item type sets them.
      FUN`ITEM`OPTIONS:
        value: |-
          @@(%0 an item, %1 its badge)[
          setq(item_slug,u(FUN`ITEM`SLUG,%0))][
          switch(json_query(%0,extract,$.type),
            condition, self:condition:%q<item_slug>[if(strlen(%1),%bself:condition:%q<item_slug>:%1)],
            effect, u(FUN`ITEM`EFFECT`OPTIONS,regeditall(%q<item_slug>,^%(?:\[a-z\]+-%)?%(?:effect|stance%)-,),%1),
            feat, if(match(classfeature ancestryfeature calling curse deityboon pfsboon,json_query(%0,extract,$.system.category)),feature,feat):%q<item_slug>,
            ancestry, self:ancestry:%q<item_slug>,
            heritage, heritage:%q<item_slug> self:heritage:%q<item_slug>,
            class, class:%q<item_slug>,
            action, self:ability:%q<item_slug>,
            )]
        flags: [funsyntax]
      FUN`ITEM`EFFECT`OPTIONS:
        value: |-
          @@(%0 the effect's roll option slug, %1 its badge)self:effect:%0[if(strlen(%1),%bself:effect:%0:%1)]
        flags: [funsyntax]
      FUN`ACTOR: The actor, built from the sheet.
      # What @actor reads in a formula, shaped like Foundry's character: level, abilities.<a>.mod,
      # skills.<s>.rank and system.skills.<s>.rank (every statistic and proficiency), conditions.<slug>.value and .badge.value.
      FUN`ACTOR`DATA:
        value: |-
          @@(%0 the entries, %1 the level, %2 slug~badge for each granted condition, %3 the statistics and proficiencies; check_upgrades stat~rank for each rank a granted item sets)[
          setq(actor_entries,%0)][
          setq(actor_ranks,fold(me/FUN`ACTOR`RANK,%3,json(object)))][
          json(object,
            level,%1,
            abilities,setr(actor_abilities,fold(me/FUN`ACTOR`ABILITY,str dex con int wis cha,json(object))),
            skills,%q<actor_ranks>,
            system,json(object,abilities,%q<actor_abilities>,skills,%q<actor_ranks>,details,json(object,class,json(object,trait,json(string,u(FUN`ACTOR`SLUG,%q<check_class>))),ancestry,json(object,trait,json(string,u(FUN`ACTOR`SLUG,%q<check_ancestry>))),level,json(object,value,%1))),
            conditions,fold(me/FUN`ACTOR`CONDITION,%2,json(object)))]
        flags: [funsyntax]
      FUN`ACTOR`SLUG:
        value: |-
          @@(%0 pack~id~index of a granted item: its slug)[
          if(strlen(%0),json_query(get(u(DATA`PACK`[first(%0,~)])/ITEM`[elements(%0,2,~)]`PREP),extract,$.slug))]
        flags: [funsyntax]
      # fold callbacks, each a merge patch: %0 the object so far, %1 the next statistic, attribute or grant; actor_entries the entries.
      # A statistic's rank is the higher of its rank entries' and every rank a granted item sets.
      FUN`ACTOR`RANK:
        value: |-
          json_mod(%0,patch,json(object,%1,json(object,rank,lmax(u(FUN`SHEET`RANK,%q<actor_entries>,%1) [iter(graball(%q<check_upgrades>,%1~*),after(%i0,~))]))))
        flags: [funsyntax]
      FUN`ACTOR`ABILITY:
        value: |-
          json_mod(%0,patch,json(object,%1,json(object,mod,u(FUN`SHEET`ABILITY,%q<actor_entries>,%1))))
        flags: [funsyntax]
      FUN`ACTOR`CONDITION:
        value: |-
          @@(%0 the conditions so far, %1 slug~badge)[
          json_mod(%0,patch,json(object,first(%1,~),if(strlen(rest(%1,~)),json(object,value,rest(%1,~),badge,json(object,value,rest(%1,~))),json(object))))]
        flags: [funsyntax]
      FUN`STAT: The skills, perception and the saves. %0 a statistic such as athletics.
      # Foundry's domains for the statistic's check: the selectors whose modifiers apply to it.
      FUN`STAT`DOMAINS:
        value: |-
          @@(%0 a statistic)[
          setq(stat_attribute,u(FUN`STAT`ATTRIBUTE,%0))][
          switch(u(FUN`STAT`KIND,%0),
            skill, %0 %q<stat_attribute>-based skill-check %q<stat_attribute>-skill-check all check %0-check,
            save, %0 %q<stat_attribute>-based saving-throw all check %0-check,
            lore, %0 %q<stat_attribute>-based skill-check lore-skill-check %q<stat_attribute>-skill-check all check %0-check,
            perception, perception all %q<stat_attribute>-based check perception-check)]
        flags: [funsyntax]
      FUN`STAT`KIND:
        value: |-
          firstof(first(v(DATA`STATISTIC`%0)),if(strmatch(%0,*-lore),lore))
        flags: [funsyntax]
      FUN`STAT`ATTRIBUTE:
        value: |-
          firstof(last(v(DATA`STATISTIC`%0)),if(strmatch(%0,*-lore),int))
        flags: [funsyntax]
      # A Lore's statistic: the name sluggified, with -lore once at the end. Labor Lore is labor-lore.
      FUN`STAT`LORE:
        value: |-
          @@(%0 a Lore's name, with or without the word Lore)[
          [u(FUN`ITEM`SLUGGIFY,regeditall(lcstr(%0),\\s*\\blore\\b\\s*,%b))]-lore]
        flags: [funsyntax]
      FUN`RULE: Rule elements. %0 one rule element as the item stores it, %1 the roll data (actor, item, rule).
      # A FlatModifier as Foundry's FlatModifierRuleElement turns it into a synthetic: the selectors it
      # applies to, injected properties resolved and null ones left out, and the modifier, with the
      # predicate's injected properties resolved, an ability-typed one worth that attribute's modifier,
      # and the value a number (anything else 0) held between min and max. Its slug is the rule's own,
      # else the item's (%2). Nothing when it has no selector left.
      FUN`RULE`FLATMODIFIER:
        value: |-
          @@(%0 the rule, %1 the roll data, %2 the item's slug)[
          setq(rule_selectors,u(FUN`RULE`SELECTORS,%0,%1))][
          if(words(%q<rule_selectors>),
            json(object,
              selectors,json(string,%q<rule_selectors>),
              modifier,u(FUN`RULE`FLATMODIFIER`OBJECT,%0,%1,%2,u(FUN`MODIFIER`TYPE,firstof(json_query(%0,extract,$.type),untyped)))))]
        flags: [funsyntax]
      FUN`RULE`FLATMODIFIER`OBJECT:
        value: |-
          @@(%0 the rule, %1 the roll data, %2 the item's slug, %3 the modifier type)[
          setq(rule_ability,json_query(%0,extract,$.ability))][
          setq(rule_value,u(FUN`FORMULA`VALUE,if(strmatch(%3,ability),json(string,@actor.abilities.%q<rule_ability>.mod),firstof(json_query(%0,get,value),null)),%1,0))][
          setq(rule_value,if(isnum(%q<rule_value>),%q<rule_value>,0))][
          setq(rule_value,u(FUN`RULE`CLAMP,%q<rule_value>,json_query(%0,extract,$.min),json_query(%0,extract,$.max)))][
          json(object,
            slug,json(string,firstof(if(strmatch(%3,ability),%q<rule_ability>),json_query(%0,extract,$.slug),%2)),
            label,json(string,u(FUN`RULE`LABEL,%0)),
            type,json(string,%3),
            modifier,%q<rule_value>,
            damageType,json(string,u(FUN`FORMULA`INJECT,json_query(%0,extract,$.damageType),%1)),
            damageCategory,json(string,json_query(%0,extract,$.damageCategory)),
            critical,firstof(json_query(%0,get,critical),null),
            predicate,u(FUN`FORMULA`INJECT,firstof(json_query(%0,get,predicate),json(array)),%1))]
        flags: [funsyntax]
      # A FlatModifier whose selectors reach a check's domains or any damage, or are injected and so might.
      FUN`RULE`FOR`CHECKS:
        value: |-
          @@(%0 the rule)[
          cand(strmatch(json_query(%0,extract,$.key),FlatModifier),
            cor(regmatch(json_query(%0,get,selector),\\x7B),words(setinter(setr(for_sel,u(FUN`RULE`SELECTORS,%0,)),v(DATA`CHECK`DOMAINS))),words(graball(%q<for_sel>,*damage)))))]
        flags: [funsyntax]
      # A FlatModifier that reads the roll data (a formula with @, or an injected {actor|...},
      # {item|...} or {rule|...}) or that is an ability modifier comes out differently on each sheet.
      FUN`RULE`DYNAMIC:
        value: |-
          @@(%0 the rule)[
          cor(strmatch(json_query(%0,extract,$.type),ability),regmatch(%0,@|\\x7B%(?:actor|item|rule%)\\|))]
        flags: [funsyntax]
      FUN`RULE`KEY:
        value: |-
          firstof(json_query(%1,extract,$.key),none)
        flags: [funsyntax]
      FUN`RULE`TRUE:
        value: |-
          1
        flags: [funsyntax]
      # An ActiveEffectLike that upgrades or sets a proficiency rank: the statistic's path under system
      # (skills.<s>, saves.<s>, perception, proficiencies.attacks.<a>, proficiencies.defenses.<d>,
      # proficiencies.spellcasting), else nothing. The statistic may still be an injected property.
      FUN`RULE`RANK`STAT:
        value: |-
          @@(%0 the rule)[
          setq(rank_path,json_query(%0,extract,$.path))][
          if(cand(match(upgrade override,json_query(%0,extract,$.mode)),regmatch(%q<rank_path>,^system\\.%(?:skills|saves|proficiencies\\.attacks|proficiencies\\.defenses|proficiencies%)?\\.?%(.+?%)\\.rank$)),
            regedit(%q<rank_path>,^system\\.%(?:skills|saves|proficiencies\\.attacks|proficiencies\\.defenses|proficiencies%)?\\.?%(.+?%)\\.rank$,$1))]
        flags: [funsyntax]
      # A rank rule that comes out the same on every sheet: a number for a named statistic, with no predicate.
      FUN`RULE`RANK`STATIC:
        value: |-
          @@(%0 the rule)[
          cand(isint(json_query(%0,extract,$.value)),not(regmatch(json_query(%0,extract,$.path),\\x7B)),not(strlen(json_query(%0,extract,$.predicate))))]
        flags: [funsyntax]
      # A RollOption that always holds: not a toggle, in the all domain, with no predicate or injected property.
      FUN`RULE`OPTION`STATIC:
        value: |-
          @@(%0 the rule)[
          cand(not(t(json_query(%0,extract,$.toggleable))),strmatch(firstof(json_query(%0,extract,$.domain),all),all),not(strlen(json_query(%0,extract,$.predicate))),not(regmatch(json_query(%0,extract,$.option),\\x7B)))]
        flags: [funsyntax]
      # Foundry's ChoiceSet flag: the rule's own, else its slug in camel case, else the item's slug.
      FUN`RULE`CHOICE`FLAG:
        value: |-
          @@(%0 a ChoiceSet, %1 its index; synthetic_slug the item's slug)[
          setq(flag_slug,firstof(json_query(%0,extract,$.slug),%q<synthetic_slug>))][
          firstof(json_query(%0,extract,$.flag),[first(edit(%q<flag_slug>,-,%b))][iter(rest(edit(%q<flag_slug>,-,%b)),capstr(%i0),%b,)],choice%1)]
        flags: [funsyntax]
      # Foundry's label for a rule's modifier: the rule's own label, else the item's name. A label that is
      # a Foundry language key is not in the feed's items, so the item's name stands for it.
      FUN`RULE`LABEL:
        value: |-
          @@(%0 the rule; synthetic_item the item it is on)[
          setq(rule_label,json_query(%0,extract,$.label))][
          if(cand(strlen(%q<rule_label>),not(strmatch(%q<rule_label>,PF2E.*))),%q<rule_label>,json_query(%q<synthetic_item>,extract,$.name))]
        flags: [funsyntax]
      FUN`RULE`CLAMP:
        value: |-
          @@(%0 a number, %1 the least it may be, %2 the most, either empty for no bound)[
          if(isnum(%2),min(%2,if(isnum(%1),max(%1,%0),%0)),if(isnum(%1),max(%1,%0),%0))]
        flags: [funsyntax]
      FUN`RULE`SELECTORS:
        value: |-
          @@(%0 the rule, %1 the roll data: its selectors, a string or an array, with injected properties resolved; null ones left out)[
          setq(rule_selector,json_query(%0,get,selector))][
          setdiff(u(FUN`FORMULA`INJECT,switch(left(%q<rule_selector>,1),\[,json_map(me/FUN`RULE`SELECTOR,%q<rule_selector>,%b),json_query(%0,extract,$.selector)),%1),null)]
        flags: [funsyntax]
      FUN`RULE`SELECTOR:
        value: |-
          %1
        flags: [funsyntax]
      FUN`SYNTHETICS: What the granted items' rule elements add, worked out once for the whole sheet as Foundry's actor synthetics are.
      # A JSON array of {selectors, modifier}: selectors a space-separated list, modifier a Foundry
      # modifier object.
      FUN`SYNTHETICS`MODIFIERS:
        value: |-
          @@(%0 the actor data, %1 the prepared synthetics joined with commas, %2 pack~id~badge~rules~index for each item with dynamic FlatModifiers, rules their indices joined with dots and index the grant's in check_ledger)[
          setq(synthetic_actor,%0)][
          fold(me/FUN`SYNTHETICS`DYNAMIC,%2,\[%1\])]
        flags: [funsyntax]
      # fold callback: an item's dynamic FlatModifiers worked out with this sheet's roll data.
      FUN`SYNTHETICS`DYNAMIC:
        value: |-
          @@(%0 the synthetics so far, %1 pack~id~badge~rules~index)[
          setq(synthetic_item,u(FUN`ITEM`GET,elements(%1,1,~),elements(%1,2,~)))][
          setqm(synthetic_rules,json_query(%q<synthetic_item>,extract,$.system.rules),synthetic_slug,u(FUN`ITEM`SLUG,%q<synthetic_item>))][
          setq(synthetic_data,json(object,actor,%q<synthetic_actor>,item,u(FUN`ITEM`DATA,%q<synthetic_item>,elements(%1,3,~),u(FUN`CHECK`CHOICES,elements(%1,5,~)))))][
          fold(me/FUN`SYNTHETICS`RULE,edit(elements(%1,4,~),.,%b),%0)]
        flags: [funsyntax]
      FUN`SYNTHETICS`RULE:
        value: |-
          @@(%0 the synthetics so far, %1 the rule's index in the item's rules)[
          setq(synthetic_rule,json_query(%q<synthetic_rules>,extract,$\[%1\]))][
          setq(synthetic_new,switch(json_query(%q<synthetic_rule>,extract,$.key),
            FlatModifier, u(FUN`RULE`FLATMODIFIER,%q<synthetic_rule>,json_mod(%q<synthetic_data>,set,$.rule,%q<synthetic_rule>),%q<synthetic_slug>)))][
          if(strlen(%q<synthetic_new>),json_mod(%0,set,$\[[json_query(%0,size)]\],%q<synthetic_new>),%0)]
        flags: [funsyntax]
      # selector~<index> for each selector of each synthetic, so that a check finds its modifiers by its domains.
      FUN`SYNTHETICS`INDEX:
        value: |-
          @@(%0 the synthetics)[
          iter(lnum(json_query(%0,size)),iter(json_query(%0,extract,$\[%i0\].selectors),%i0~%i1))]
        flags: [funsyntax]
      FUN`CHECK: Checks and the other numbers of a sheet, from a ledger.
      # Everything the sheet needs from the ledger at once. Sets check_ledger, check_entries,
      # check_level, check_grants, check_options, check_upgrades (stat~rank from granted items),
      # check_stats (every statistic and proficiency), check_actor, check_synthetics, check_index,
      # check_flats (each synthetic's type~value~slug~force, - when its predicate fails), check_names,
      # check_unapplied, check_strikes, check_traits (the character's traits from ActorTraits rules), check_adjstrike, check_gear, check_armor (the worn armor's item) and check_ancestry,
      # check_heritage, check_background and check_class (pack~id~index of each, when granted), and
      # check_key, the ledger's key in the cache, from which it reads them when it can.
      FUN`CHECK`PREPARE:
        value: |-
          @@(%0 the ledger, %1 1 to leave out the synthetics, for the builder)[
          setq(check_key,left(digest(sha1,%0|%1|[v(DATA`CACHE`VERSION)]|[v(DATA`CONFIG`BOOKS)]|[v(CACHE`STAMP)]),20))][
          if(hasattr(me,CACHE`%q<check_key>),
            [setqm(check_ledger,%0,check_dmgready,0)][null(iter(v(DATA`CACHE`REGISTERS),setq(%i0,v(CACHE`%q<check_key>`%i0))))],
            [u(FUN`CHECK`PREPARE`BUILD,%0,%1)][u(FUN`CACHE`SAVE)])]
        flags: [funsyntax]
      FUN`CHECK`PREPARE`BUILD:
        value: |-
          @@(%0 the ledger, %1 1 to leave out the synthetics)[
          setq(check_ledger,%0)][
          setq(check_entries,u(FUN`SHEET`ENTRIES,%0))][
          setq(check_level,u(FUN`SHEET`LEVEL,%q<check_entries>))][
          setq(check_grants,u(FUN`SHEET`GRANTS,%q<check_entries>,%q<check_level>))][
          setqm(check_options,self:level:%q<check_level>,check_conditions,,check_static,,check_dynamic,,check_names,,check_unapplied,,check_upgrades,,check_rankdyn,,check_strikes,,check_martial,,check_forms,,check_adjust,,check_rollrules,,check_dmgready,0,check_rollopts,,check_toggles,,check_domopts,,check_actortraits,,check_traits,,check_adjstrike,,check_itemalts,,check_resgrants,,check_craftgrants,,check_favoredrules,,check_ancestry,,check_heritage,,check_background,,check_class,)][
          null(iter(%q<check_grants>,u(FUN`CHECK`GRANT,%i0)))][
          u(FUN`CHECK`DEITY)][
          null(iter(%q<check_actortraits>,u(FUN`CHECK`ACTORTRAITS,%i0)))][
          setq(check_options,squish(%q<check_options> [iter(%q<check_traits>,self:trait:%i0)]))][
          u(FUN`ROLLOPTION`ALL)][
          null(iter(%q<check_rankdyn>,u(FUN`CHECK`RANKDYN,%i0)))][
          setq(check_upgrades,%q<check_upgrades> [u(FUN`CHECK`SPELLRANKS)])][
          setq(check_form,u(FUN`CHECK`FORM))][
          setq(check_stats,setunion([v(DATA`STATISTICS)] [v(DATA`PROFICIENCIES)] [iter(graball(%q<check_entries>,rank~*),elements(%i0,2,~))] [iter(%q<check_upgrades>,first(%i0,~))],))][
          setq(check_actor,u(FUN`ACTOR`DATA,%q<check_entries>,%q<check_level>,%q<check_conditions>,%q<check_stats>))][
          if(%1,setqm(check_synthetics,json(array),check_index,,check_flats,),
            [setq(check_synthetics,u(FUN`SYNTHETICS`MODIFIERS,%q<check_actor>,%q<check_static>,%q<check_dynamic>))][
            setq(check_index,u(FUN`SYNTHETICS`INDEX,%q<check_synthetics>))][
            setq(check_flats,iter(lnum(json_query(%q<check_synthetics>,size)),u(FUN`CHECK`FLAT,%i0,%q<check_options>)))])][
          setq(check_gear,u(FUN`SHEET`GEAR,%q<check_entries>))][
          setq(check_formulas,iter(graball(%q<check_entries>,formula~*),elements(%i0,2,~)))][
          setq(check_resources,setunion(iter(%q<check_resgrants>,u(FUN`CHECK`RESOURCES,first(%i0,~),rest(%i0,~))),))][
          setq(check_crafting,iter(setr(craft_all,iter(%q<check_craftgrants>,u(FUN`CHECK`CRAFTING,first(%i0,~),rest(%i0,~)))),firstof(first(graball(%q<craft_all>,%i0~*~*~?*)),first(graball(%q<craft_all>,%i0~*)))))][setq(check_crafting,iter(setunion(iter(%q<craft_all>,first(%i0,~)),),firstof(first(graball(%q<craft_all>,%i0~*~*~?*)),first(graball(%q<craft_all>,%i0~*)))))][
          setq(check_armor,u(FUN`CHECK`ARMOR))][
          setq(check_shield,u(FUN`CHECK`SHIELD))]
        flags: [funsyntax]
      # Keeps the registers FUN`CHECK`PREPARE`BUILD set under CACHE`<check_key>, the key itself last so a
      # half-written entry is never read, and drops the oldest key past DATA`CACHE`KEEP.
      FUN`CACHE`SAVE:
        value: |-
          @@(after FUN`CHECK`PREPARE`BUILD)[
          null(iter(v(DATA`CACHE`REGISTERS),if(strlen(r(%i0)),attrib_set(me/CACHE`%q<check_key>`%i0,r(%i0)))))][
          null(attrib_set(me/CACHE`%q<check_key>,1))][
          setq(cache_keys,squish([v(CACHE)] %q<check_key>))][
          if(gt(words(%q<cache_keys>),v(DATA`CACHE`KEEP)),
            [null(wipe(me/CACHE`[first(%q<cache_keys>)]))][setq(cache_keys,rest(%q<cache_keys>))])][
          null(attrib_set(me/CACHE,%q<cache_keys>))]
        flags: [funsyntax]
      # %1 run with %2 and %3 for the ledger prepared: worked out once, then read from CACHE`<check_key>`%0.
