  # The table: encounters, exploration, skill challenges and Recall Knowledge. WIZARD to keep each
  # room's encounter on itself and to read sheets. An encounter never writes a sheet: a character
  # joins as their ledger at that moment, and what happens to them (hit points, conditions) stays in
  # the encounter. A creature joins as its Monster Core statistics. Conditions on either go through
  # the core's stacking, as condition items granted on top of the ledger.
  #
  # Trees: CMD` the commands, INC`ENC` one encounter switch, FUN`ENC` the encounter's state,
  # FUN`TURN` turn order and what starts and ends a turn, FUN`ACT` checks and Strikes,
  # INC`EXPLORE`, INC`CHALLENGE`, INC`RECALL`, FUN`SHOW` what the commands draw.
  #
  # ENC`<room> holds a room's encounter as JSON: gm (objid), round, turn (the index acting, -1
  # before the first), next (the next combatant number) and c, the combatants, each {k number, name,
  # kind pc|npc, who (a character's objid), snap (their last ledger entry), pack and id (a
  # creature's), side pc|foe, hp, max, temp, init, conds {slug: value}, dur {slug: key~turns},
  # pers {damage type: formula}, map (attacks this turn), down}. ENC`<room>`U`<n> and R`<n> are the
  # undo and redo copies, UN and RN how many.
  - ref: table
    type: thing
    name: PF2e Table
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      CMD`ENC:
        value: |-
          $(?is)^\+enc(/\S*)?(?\: +(.*))?$:think setqm(cmd_switch,firstof(lcstr(first(after(%1,/),/)),show),cmd_sub,lcstr(after(after(%1,/),/)),cmd_args,trim(%2)); @assert match(show start add remove join init next strike check save use act effect raise damage heal cond persist delay look bestiary award keep undo redo end toggle,%q<cmd_switch>)=@pemit %#=notice(PF2E,There is no +enc/%q<cmd_switch>. +help +enc lists the switches.,warn); think u(%!/FUN`ENC`LOAD,%l); @include %!/INC`ENC`%q<cmd_switch>
        flags: [regexp, cmdsyntax]
      # +cast <spell>[ at <rank>][ with <n> actions][ as <variant>][=<targets>]: in an encounter you are in, on its
      # copy of you and on its combatants; elsewhere from your sheet's day, with healing onto the characters named.
      CMD`CAST:
        value: |-
          $(?is)^\+cast +(.+)$:think setq(cmd_args,trim(%1)); think u(%!/FUN`ENC`LOAD,%l); think setq(act_at,if(strlen(%q<enc>),u(%!/FUN`ENC`MINE))); @include %!/INC`CAST`[if(strlen(%q<act_at>),ENC,FREE)]
        flags: [regexp, cmdsyntax]
      CMD`EXPLORE:
        value: |-
