            sanctification,switch(1,cor(not(words(%q<value_words>)),strmatch(%q<value_words>,none)),,cand(match(can must,first(%q<value_words>)),words(rest(%q<value_words>)),not(words(setdiff(rest(%q<value_words>),holy unholy)))),[first(%q<value_words>)] [setunion(rest(%q<value_words>),)],!Sanctification is none%, or can or must followed by holy%, unholy or both: can holy.),
