      DATA`DOMAINS: air ambition cities confidence creation darkness death destruction dreams earth family fate fire freedom healing indulgence knowledge luck magic might moon nature nightmares pain passion perfection protection secrecy sun travel trickery truth tyranny undeath water wealth zeal
