      # and a fist.
      FUN`CHECK`STRIKES:
        value: |-
          @@(the Strikes, separated by |)[
          trim(squish(
            [iter(%q<check_gear>,if(cand(strmatch(elements(%i0,3,~),held),strmatch(json_query(get(u(DATA`PACK`EQUIPMENT)/ITEM`[first(%i0,~)]`PREP),extract,$.kind),weapon)),u(FUN`STRIKE`WEAPON,u(FUN`ITEM`GET,equipment,first(%i0,~)))),%b,|)]|[
            iter(%q<check_strikes>,u(FUN`STRIKE`RULE,json_query(u(FUN`ITEM`GET,elements(%i0,2,~),elements(%i0,3,~)),extract,$.system.rules\[[elements(%i0,4,~)]\])),%b,|)]|[
            u(FUN`STRIKE`FIST)],|),|)]
        flags: [funsyntax]
      FUN`STRIKE: Strikes. A Strike is a JSON object of name, slug, id, category, group, base, traits (space-separated), dice, die, type, range, potency and striking.
      FUN`STRIKE`WEAPON:
        value: |-
          @@(%0 a weapon item)[
          json(object,
            name,json(string,json_query(%0,extract,$.name)),
            slug,json(string,u(FUN`ITEM`SLUG,%0)),
            id,json(string,json_query(%0,extract,$._id)),
            category,json(string,firstof(json_query(%0,extract,$.system.category),simple)),
            group,json(string,json_query(%0,extract,$.system.group)),
            base,json(string,firstof(json_query(%0,extract,$.system.baseItem),u(FUN`ITEM`SLUG,%0))),
            traits,json(string,json_map(me/FUN`RULE`SELECTOR,firstof(json_query(%0,extract,$.system.traits.value),json(array)),%b)),
            dice,firstof(json_query(%0,extract,$.system.damage.dice),1),
            die,json(string,firstof(json_query(%0,extract,$.system.damage.die),d4)),
            type,json(string,firstof(json_query(%0,extract,$.system.damage.damageType),bludgeoning)),
            range,firstof(json_query(%0,extract,$.system.range),0),
            potency,firstof(json_query(%0,extract,$.system.runes.potency),0),
            striking,firstof(json_query(%0,extract,$.system.runes.striking),0))]
        flags: [funsyntax]
      FUN`STRIKE`RULE:
        value: |-
          @@(%0 a Strike rule element)[
          json(object,
            name,json(string,firstof(json_query(%0,extract,$.label),json_query(%0,extract,$.slug))),
            slug,json(string,firstof(json_query(%0,extract,$.slug),u(FUN`ITEM`SLUGGIFY,json_query(%0,extract,$.label)))),
            id,json(string,firstof(json_query(%0,extract,$.slug),strike)),
            category,json(string,firstof(json_query(%0,extract,$.category),unarmed)),
            group,json(string,firstof(json_query(%0,extract,$.group),brawling)),
            base,json(string,firstof(json_query(%0,extract,$.baseType),json_query(%0,extract,$.slug))),
            traits,json(string,json_map(me/FUN`RULE`SELECTOR,firstof(json_query(%0,extract,$.traits),json(array)),%b)),
            dice,firstof(json_query(%0,extract,$.damage.base.dice),1),
            die,json(string,firstof(json_query(%0,extract,$.damage.base.die),d4)),
            type,json(string,firstof(json_query(%0,extract,$.damage.base.damageType),bludgeoning)),
            range,firstof(json_query(%0,extract,$.range.increment),json_query(%0,extract,$.range),0),
            potency,0,
            striking,0)]
        flags: [funsyntax]
      FUN`STRIKE`FIST:
        value: |-
          json(object,name,"Fist",slug,"fist",id,"fist",category,"unarmed",group,"brawling",base,"fist",traits,"agile finesse nonlethal unarmed",dice,1,die,"d4",type,"bludgeoning",range,0,potency,0,striking,0)
        flags: [funsyntax]
      # A Strike's attack modifiers: the attribute (Dexterity at range, the better of Strength and
      # Dexterity with finesse, else Strength), proficiency in its category or its base weapon, the
      # potency rune, and the synthetics of a Strike's domains, tested with the weapon's roll options.
      # Sets strike_attribute, strike_ranged, strike_options and strike_rank.
      FUN`STRIKE`ATTACK:
        value: |-
          @@(%0 a Strike)[
          setqm(strike_traits,json_query(%0,extract,$.traits),strike_slug,json_query(%0,extract,$.slug),strike_category,json_query(%0,extract,$.category))][
          setq(strike_ranged,cand(gt(json_query(%0,extract,$.range),0),not(regmatch(%q<strike_traits>,\\bthrown))))][
          setq(strike_attribute,if(%q<strike_ranged>,dex,if(cand(member(%q<strike_traits>,finesse),gt(u(FUN`CHECK`ABILITY,dex),u(FUN`CHECK`ABILITY,str))),dex,str)))][
          setq(strike_rank,max(u(FUN`CHECK`RANK,%q<strike_category>),u(FUN`CHECK`RANK,weapon-base-[json_query(%0,extract,$.base)])))][
          setq(strike_options,squish(item:slug:%q<strike_slug> item:category:%q<strike_category> item:group:[json_query(%0,extract,$.group)] item:base:[json_query(%0,extract,$.base)] [if(%q<strike_ranged>,item:ranged,item:melee)] [iter(%q<strike_traits>,item:trait:%i0)]))][
          u(FUN`CHECK`MODS,ability~[u(FUN`CHECK`ABILITY,%q<strike_attribute>)]~%q<strike_attribute>~0 proficiency~[u(FUN`CHECK`PROFICIENCY,%q<strike_rank>)]~proficiency~0 [if(gt(json_query(%0,extract,$.potency),0),item~[json_query(%0,extract,$.potency)]~potency~0)],
            attack attack-roll strike-attack-roll mundane-attack [if(%q<strike_ranged>,ranged,melee)]-strike-attack-roll [if(strmatch(%q<strike_category>,unarmed),unarmed-attack-roll)] %q<strike_attribute>-attack %q<strike_slug>-attack all check,%q<strike_options>)]
        flags: [funsyntax]
      # A Strike's damage modifiers, after FUN`STRIKE`ATTACK: Strength in melee or thrown (half of a
      # bonus for a propulsive weapon), weapon specialization by rank, and the synthetics of damage's domains.
      FUN`STRIKE`DAMAGE:
        value: |-
          @@(%0 a Strike)[
          setq(strike_str,u(FUN`CHECK`ABILITY,str))][
          u(FUN`CHECK`MODS,[switch(1,
              not(%q<strike_ranged>),ability~%q<strike_str>~str~0,
              member(%q<strike_traits>,propulsive),ability~[if(gt(%q<strike_str>,0),div(%q<strike_str>,2),%q<strike_str>)]~str~0,
              regmatch(%q<strike_traits>,\\bthrown),ability~%q<strike_str>~str~0,)] [
            if(cand(member(%q<check_options>,feature:weapon-specialization),gte(%q<strike_rank>,2)),untyped~[mul(extract(2 3 4,dec(%q<strike_rank>),1),if(member(%q<check_options>,feature:greater-weapon-specialization),2,1))]~weapon-specialization~0)],
            damage strike-damage attack-damage [if(%q<strike_ranged>,ranged-strike-damage,melee-strike-damage melee-damage)] [if(strmatch(%q<strike_category>,unarmed),unarmed-damage)] %q<strike_slug>-damage,%q<strike_options>)]
        flags: [funsyntax]
      # Name|attack|second|third|damage|traits for a Strike: the multiple attack penalty is 5 a step, 4 when agile.
      FUN`STRIKE`LINE:
        value: |-
          @@(%0 a Strike)[
          setq(strike_bonus,u(FUN`CHECK`TOTAL,u(FUN`STRIKE`ATTACK,%0)))][
          setq(strike_map,if(member(%q<strike_traits>,agile),4,5))][
          setq(strike_damage,u(FUN`CHECK`TOTAL,u(FUN`STRIKE`DAMAGE,%0)))][
          json_query(%0,extract,$.name)]|%q<strike_bonus>|[sub(%q<strike_bonus>,%q<strike_map>)]|[sub(%q<strike_bonus>,mul(2,%q<strike_map>))]|[add(json_query(%0,extract,$.dice),json_query(%0,extract,$.striking))][json_query(%0,extract,$.die)][if(%q<strike_damage>,if(gt(%q<strike_damage>,0),+%q<strike_damage>,%q<strike_damage>))] [json_query(%0,extract,$.type)]|%q<strike_traits>
        flags: [funsyntax]
      FUN`CHOICE: Choices.
      FUN`CHOICE`SLUG:
        value: |-
          @@(%0 a selection: a selected item's slug, from its link; any other value as it is)[
          if(strmatch(%0,Compendium.*.Item.*),u(FUN`ITEM`SLUGGIFY,after(%0,.Item.)),%0)]
        flags: [funsyntax]
  # Reads the PF2e feed into the data objects. WIZARD for @http and for writing the data objects.
  # It reads the feed's index, then each file in turn; an item whose hash is unchanged is left alone.
  # Trees: INC`UPDATE` the run, ON` the @http replies, INC`IMPORT` one item, FUN`FEED` the parsing.
  # FEED` holds the run's state: RUN who started it, BASE the feed folder at the commit being read, NEXT the index being read, QUEUE the files still
  # to read (path|pack|book|hash), CURRENT the one being read, BODY its text, LINES its line count, AT
  # the next line to read, FAILED the files that
  # could not be read, FILE`<key> the hash of each file last read in full, INDEX the last index read.
  - ref: updater
    type: thing
    name: PF2e Updater
    location: "{{core}}"
    flags: [WIZARD]
    attributes:
      INC: Command lists, one tree per step of a run.
      INC`UPDATE`START:
        value: |-
          @assert cor(not(strlen(get(me/FEED`RUN))),gt(sub(secs(),get(me/FEED`TOUCHED)),300))=@pemit [firstof(%0,%#)]=PF2E: The feed is being read already.; &FEED`RUN me=[firstof(%0,%#)]; &FEED`TOUCHED me=[secs()]; &FEED`FAILED me; @include/nobreak me/INC`UPDATE`PREP; @http me/ON`COMMIT=https://api.github.com/repos/[get({{core}}/DATA`CONFIG`REPOSITORY)]/commits/[get({{core}}/DATA`CONFIG`BRANCH)],[json(object,Accept,"application/vnd.github.sha")]
        flags: [cmdsyntax]
      # When the core prepares items another way than at the last run, every file is read again.
      INC`UPDATE`PREP:
        value: |-
          @break eq(get(me/FEED`PREP),get({{core}}/DATA`PREP`VERSION)); @wipe me/FEED`FILE`*; &FEED`PREP me=[get({{core}}/DATA`PREP`VERSION)]
        flags: [cmdsyntax]
      # The commit the branch is on, so every file of the run comes from it rather than from a cache.
      ON`COMMIT:
        value: |-
          @assert cand(eq(%<status>,200),eq(strlen(%0),40),regmatch(%0,^\[0-9a-f\]+$))={@pemit [get(me/FEED`RUN)]=PF2E: The feed's branch could not be read: HTTP %<status>.; &FEED`RUN me}; &FEED`BASE me=https://raw.githubusercontent.com/[get({{core}}/DATA`CONFIG`REPOSITORY)]/%0/pf2e-feed; @http me/ON`INDEX=[get(me/FEED`BASE)]/index.json
        flags: [cmdsyntax]
      ON`INDEX:
        value: |-
          @assert eq(%<status>,200)={@pemit [get(me/FEED`RUN)]=PF2E: The feed's index could not be read: HTTP %<status>.; &FEED`RUN me}; &FEED`NEXT me=%0; &FEED`QUEUE me=[u(FUN`FEED`FILES,%0)]; @pemit [get(me/FEED`RUN)]=PF2E: Reading [words(get(me/FEED`QUEUE))] changed files from Foundry pf2e [left(json_query(%0,extract,$.foundry.commit),8)].; @trigger me/INC`UPDATE`NEXT
        flags: [cmdsyntax]
      INC`UPDATE`NEXT:
        value: |-
          @assert words(get(me/FEED`QUEUE))={@trigger me/INC`UPDATE`DONE}; &FEED`CURRENT me=[first(get(me/FEED`QUEUE))]; &FEED`QUEUE me=[rest(get(me/FEED`QUEUE))]; @http me/ON`FILE=[get(me/FEED`BASE)]/[first(get(me/FEED`CURRENT),|)]
        flags: [cmdsyntax]
      ON`FILE:
        value: |-
          @assert cand(eq(%<status>,200),isdbref(u({{core}}/DATA`PACK`[ucstr(elements(get(me/FEED`CURRENT),2,|))])))={&FEED`FAILED me=[squish(get(me/FEED`FAILED) [first(get(me/FEED`CURRENT),|)])]; @trigger me/INC`UPDATE`NEXT}; &FEED`BODY me=%0; &FEED`LINES me=[words(%0,%r)]; &FEED`AT me=1; @trigger me/INC`IMPORT`BATCH
        flags: [cmdsyntax]
      # The next lines of the file, a batch per queue entry, so a run stays inside each entry's time
      # limit and never floods the queue.
      INC`IMPORT`BATCH:
        value: |-
          &FEED`TOUCHED me=[secs()]; @assert lte(get(me/FEED`AT),get(me/FEED`LINES))={&FEED`FILE`[u(FUN`FEED`KEY,first(get(me/FEED`CURRENT),|))] me=[elements(get(me/FEED`CURRENT),4,|)]; @trigger me/INC`UPDATE`NEXT}; @dolist/inplace [lnum(get(me/FEED`AT),min(add(get(me/FEED`AT),39),get(me/FEED`LINES)))]=@include me/INC`IMPORT`LINE=%i0; &FEED`AT me=[add(get(me/FEED`AT),40)]; @trigger me/INC`IMPORT`BATCH
        flags: [cmdsyntax]
      # %0 a line's number in FEED`BODY: <_id> <hash> <leaf> <value>. A line of an item whose stored
      # HASH matches, and whose PREP was made for the core's DATA`PREP`VERSION, is skipped.
      INC`IMPORT`LINE:
        value: |-
          think [setq(line,extract(get(me/FEED`BODY),%0,1,%r))]; @assert strlen(%q<line>); think [setq(id,ucstr(first(%q<line>)),hash,elements(%q<line>,2),leaf,elements(%q<line>,3),value,after(after(after(%q<line>,%b),%b),%b),store,u({{core}}/DATA`PACK`[ucstr(elements(get(me/FEED`CURRENT),2,|))]))]; @break cand(strmatch(get(%q<store>/ITEM`%q<id>`HASH),%q<hash>),eq(json_query(get(%q<store>/ITEM`%q<id>`PREP),extract,$.v),get({{core}}/DATA`PREP`VERSION))); @include me/INC`IMPORT`[first(%q<leaf>,`)]
        flags: [cmdsyntax]
      # NAME`<slug> on the data object lists the ids of the items with that name, for lookups by name,
      # and OPT`<kind>`<value> the ids of the items with each trait, tag, category and type, for the
      # builder's lists.
      INC`IMPORT`ITEM:
        value: |-
          think setqm(name_old,u({{core}}/FUN`ITEM`SLUGGIFY,json_query(get(%q<store>/ITEM`%q<id>),extract,$.name)),name_new,u({{core}}/FUN`ITEM`SLUGGIFY,json_query(%q<value>,extract,$.name)),opts_old,u({{core}}/FUN`ITEM`INDEXED,json_query(get(%q<store>/ITEM`%q<id>`PREP),extract,$.opts))); @include/nobreak me/INC`IMPORT`UNNAME; @include/nobreak me/INC`IMPORT`UNINDEX; &NAME`%q<name_new> %q<store>=[setunion(get(%q<store>/NAME`%q<name_new>),%q<id>)]; &ITEM`%q<id> %q<store>=%q<value>; &ITEM`%q<id>`PREP %q<store>=[u({{core}}/FUN`ITEM`PREPARE,%q<value>)]; &ITEM`%q<id>`BOOK %q<store>=[elements(get(me/FEED`CURRENT),3,|)]; @wipe %q<store>/ITEM`%q<id>`EMBED`*; @dolist/inplace [u({{core}}/FUN`ITEM`INDEXED,json_query(get(%q<store>/ITEM`%q<id>`PREP),extract,$.opts))]=&OPT`## %q<store>=[setunion(get(%q<store>/OPT`##),%q<id>)]
        flags: [cmdsyntax]
      INC`IMPORT`UNNAME:
        value: |-
          @break not(strlen(%q<name_old>)); &NAME`%q<name_old> %q<store>=[remove(get(%q<store>/NAME`%q<name_old>),%q<id>)]
        flags: [cmdsyntax]
      INC`IMPORT`UNINDEX:
        value: |-
          @break not(words(%q<opts_old>)); @dolist/inplace %q<opts_old>=&OPT`## %q<store>=[remove(get(%q<store>/OPT`##),%q<id>)]
        flags: [cmdsyntax]
      INC`IMPORT`TEXT:
        value: |-
          &ITEM`%q<id>`TEXT %q<store>=[json_query(%q<value>,unescape)]
        flags: [cmdsyntax]
      INC`IMPORT`EMBED:
        value: |-
          &ITEM`%q<id>`%q<leaf> %q<store>=%q<value>
        flags: [cmdsyntax]
      INC`IMPORT`HASH:
        value: |-
          &ITEM`%q<id>`HASH %q<store>=%q<hash>
        flags: [cmdsyntax]
      INC`UPDATE`DONE:
        value: |-
          &FEED`INDEX me=[get(me/FEED`NEXT)]; &FEED`NEXT me; &FEED`CURRENT me; &FEED`BODY me; &FEED`LINES me; &FEED`AT me; @pemit [get(me/FEED`RUN)]=PF2E: The feed is read.[if(words(get(me/FEED`FAILED)),%bThese files could not be read and are tried again next time: [get(me/FEED`FAILED)])]; &FEED`RUN me
        flags: [cmdsyntax]
      FUN: Function attributes.
      # Every file of every book in the index whose hash differs from the last one read in full, as
      # path|pack|book|hash.
      FUN`FEED`FILES:
        value: |-
          json_map(me/FUN`FEED`BOOK,json_query(%0,get,books))
        flags: [funsyntax]
      FUN`FEED`BOOK:
        value: |-
          @@(%1 one book of the index)[
          json_map(me/FUN`FEED`FILE,json_query(%1,get,files),%b,json_query(%1,extract,$.slug))]
        flags: [funsyntax]
      FUN`FEED`FILE:
        value: |-
          @@(%1 one file of a book, %3 the book)[
          setq(feed_path,json_query(%1,extract,$.path),feed_hash,json_query(%1,extract,$.hash))][
          if(not(strmatch(get(me/FEED`FILE`[u(FUN`FEED`KEY,%q<feed_path>)]),%q<feed_hash>)),
            %q<feed_path>|[json_query(%1,extract,$.pack)]|%3|%q<feed_hash>)]
        flags: [funsyntax]
      FUN`FEED`KEY:
        value: |-
          @@(%0 a file's path, items/pc1/feats-3.txt, as the key PC1-FEATS-3)[
          ucstr(edit(before(after(%0,items/),.txt),/,-))]
        flags: [funsyntax]

  # The commands. WIZARD so that it reads and writes the ledger on any character. Each ledger entry is
  # PF2E`LEDGER`<n> on the character, set with the wizard attribute flag so that only this object or a
  # wizard writes one; an entry without the flag is not read. It sits in the master room.
  #
  # Trees: CMD` the $-commands, INC`TARGET` whose sheet a command is for, INC`PF2E` one routine per
  # switch, INC`CHECK` a check, FUN`SHOW` what the commands draw, FUN` the parsing. Registers, led by
  # their subject: cmd_ the parsed command, sheet_ the character and their ledger, entry_ a new entry,
  # roll_ a check being rolled.
  - ref: commands
    type: thing
    name: PF2e Commands
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      CMD`SHEET:
        value: |-
          $(?is)^\+sheet(?\: +(.*))?$:think setq(cmd_target,trim(%1)); @include %!/INC`TARGET`VIEW; @pemit %#=u(%!/FUN`SHOW`SHEET)
        flags: [regexp, cmdsyntax]
      CMD`CHECK:
        value: |-
          $(?is)^\+check +([^=]+?)(?\: *= *(.*))?$:think setqm(cmd_target,,cmd_stat,trim(%1),cmd_dc,trim(%2)); @include %!/INC`TARGET`VIEW; @include %!/INC`CHECK`ROLL
        flags: [regexp, cmdsyntax]
      CMD`PF2E:
        value: |-
          $(?is)^\+pf2e(/\S*)?(?\: +(.*))?$:think setqm(cmd_switch,lcstr(after(%1,/)),cmd_args,trim(%2)); @assert match(level ability rank grant revoke ledger update,%q<cmd_switch>)=@pemit %#=notice(PF2E,There is no +pf2e/%q<cmd_switch>. The switches are /level%, /ability%, /rank%, /grant%, /revoke%, /ledger and /update.,warn); think u(%!/FUN`COMMAND`TARGET); @include %!/INC`PF2E`%q<cmd_switch>
        flags: [regexp, cmdsyntax]
      # <player>/ in front of the arguments names whose sheet; without it the sheet is your own.
      FUN`COMMAND`TARGET:
        value: |-
          @@(cmd_args the arguments: sets cmd_target and cmd_rest)[
          setq(cmd_target,if(cand(strmatch(%q<cmd_args>,*/*),hastype(pmatch(before(%q<cmd_args>,/)),player)),before(%q<cmd_args>,/)))][
          setq(cmd_rest,if(strlen(%q<cmd_target>),after(%q<cmd_args>,/),%q<cmd_args>))]
        flags: [funsyntax]
      INC`TARGET`VIEW:
        value: |-
          think setq(sheet_target,if(strlen(%q<cmd_target>),pmatch(%q<cmd_target>),%#)); @assert hastype(%q<sheet_target>,player)=@pemit %#=notice(PF2E,There is no player called %q<cmd_target>.,warn); @assert cor(strmatch(%q<sheet_target>,%#),permission(%#,softcode.pf2e.staff))=@pemit %#=notice(PF2E,Only staff see another character's sheet.,error); think setq(sheet_ledger,u(%!/FUN`LEDGER`OF,%q<sheet_target>))
        flags: [cmdsyntax]
      INC`TARGET`EDIT:
        value: |-
          think setq(sheet_target,if(strlen(%q<cmd_target>),pmatch(%q<cmd_target>),%#)); @assert cor(strmatch(%q<sheet_target>,%#),permission(%#,softcode.pf2e.staff))=@pemit %#=notice(PF2E,Only staff change another character's sheet.,error); think setq(sheet_ledger,u(%!/FUN`LEDGER`OF,%q<sheet_target>))
        flags: [cmdsyntax]
      INC`PF2E`LEVEL:
        value: |-
          @include %!/INC`TARGET`EDIT; @assert cand(isint(%q<cmd_rest>),gte(%q<cmd_rest>,1),lte(%q<cmd_rest>,20))=@pemit %#=notice(PF2E,A level is a whole number from 1 to 20.,warn); think setqm(entry_json,json(object,kind,"level",level,%q<cmd_rest>),entry_text,Level %q<cmd_rest>); @include %!/INC`ENTRY`WRITE
        flags: [cmdsyntax]
      INC`PF2E`ABILITY:
        value: |-
          @include %!/INC`TARGET`EDIT; think setqm(entry_ability,u(%!/FUN`COMMAND`ABILITY,before(%q<cmd_rest>,=)),entry_mod,trim(after(%q<cmd_rest>,=))); @assert strlen(%q<entry_ability>)=@pemit %#=notice(PF2E,The attributes are str%, dex%, con%, int%, wis and cha.,warn); @assert cand(isint(%q<entry_mod>),gte(%q<entry_mod>,-5),lte(%q<entry_mod>,10))=@pemit %#=notice(PF2E,An attribute modifier is a whole number from -5 to 10.,warn); think setqm(entry_json,json(object,kind,"ability",ability,json(string,%q<entry_ability>),mod,%q<entry_mod>),entry_text,[capstr(%q<entry_ability>)] [u(%!/FUN`SHOW`SIGNED,%q<entry_mod>)]); @include %!/INC`ENTRY`WRITE
        flags: [cmdsyntax]
      INC`PF2E`RANK:
        value: |-
          @include %!/INC`TARGET`EDIT; think setqm(entry_stat,u(%!/FUN`COMMAND`STAT,before(%q<cmd_rest>,=)),entry_rank,u(%!/FUN`COMMAND`RANK,after(%q<cmd_rest>,=))); @assert eq(words(%q<entry_stat>),1)=@pemit %#=notice(PF2E,u(%!/FUN`SHOW`STAT`MISS,trim(before(%q<cmd_rest>,=)),%q<entry_stat>),warn); @assert strlen(%q<entry_rank>)=@pemit %#=notice(PF2E,A rank is untrained%, trained%, expert%, master or legendary%, or 0 to 4.,warn); think setqm(entry_json,json(object,kind,"rank",stat,json(string,%q<entry_stat>),rank,%q<entry_rank>),entry_text,[capstr(%q<entry_stat>)] [u(%!/FUN`SHOW`RANK,%q<entry_rank>)]); @include %!/INC`ENTRY`WRITE
        flags: [cmdsyntax]
      INC`PF2E`GRANT:
        value: |-
          @include %!/INC`TARGET`EDIT; think setqm(entry_pack,lcstr(trim(before(%q<cmd_rest>,/))),entry_name,trim(before(after(%q<cmd_rest>,/),=)),entry_badge,trim(after(%q<cmd_rest>,=))); @assert strlen(u({{core}}/DATA`PACK`%q<entry_pack>))=@pemit %#=notice(PF2E,Name a pack and an item%, such as conditions/frightened. The packs are [itemize(lcstr(iter(lattr({{core}}/DATA`PACK`*),last(%i0,`))))].,warn); @assert lt(words(u({{core}}/FUN`SHEET`GRANTS,u({{core}}/FUN`SHEET`ENTRIES,%q<sheet_ledger>),20)),get({{core}}/DATA`SHEET`GRANTS`MAX))=@pemit %#=notice(PF2E,A sheet holds at most [get({{core}}/DATA`SHEET`GRANTS`MAX)] items. Revoke one first.,warn); think setq(entry_id,u({{core}}/FUN`ITEM`FIND,%q<entry_pack>,%q<entry_name>)); @assert strlen(%q<entry_id>)=@pemit %#=notice(PF2E,There is no %q<entry_name> in %q<entry_pack> from a book the game uses.,warn); @assert cor(not(strlen(%q<entry_badge>)),cand(isint(%q<entry_badge>),gt(%q<entry_badge>,0)))=@pemit %#=notice(PF2E,A value after = is a whole number above 0%, such as conditions/frightened=2.,warn); think setqm(entry_json,json(object,kind,"grant",pack,json(string,%q<entry_pack>),id,json(string,%q<entry_id>),badge,firstof(%q<entry_badge>,null)),entry_text,[u(%!/FUN`SHOW`ITEM,%q<entry_pack>,%q<entry_id>,%q<entry_badge>)]); @include %!/INC`ENTRY`WRITE
        flags: [cmdsyntax]
      INC`PF2E`REVOKE:
