      FUN`CHECK`CHOICE`OPTIONS:
        value: |-
          @@(%0 flag~option for each, %1 the choices)[
          iter(%0,if(strlen(setr(choice_value,json_query(%1,extract,$.[before(%i0,~)]))),[after(%i0,~)]:[u(FUN`CHOICE`SLUG,%q<choice_value>)]))]
        flags: [funsyntax]
      # A grant's rank rules that read the roll data, worked out with the character's level and the grant's choices.
      FUN`CHECK`RANKDYN:
        value: |-
          @@(%0 pack~id~badge~rules~index)[
          setq(rankdyn_item,u(FUN`ITEM`GET,elements(%0,1,~),elements(%0,2,~)))][
          setq(rankdyn_data,json(object,actor,json(object,level,%q<check_level>),item,u(FUN`ITEM`DATA,%q<rankdyn_item>,elements(%0,3,~),u(FUN`CHECK`CHOICES,elements(%0,5,~)))))][
          null(iter(edit(elements(%0,4,~),.,%b),u(FUN`CHECK`RANKRULE,json_query(%q<rankdyn_item>,extract,$.system.rules\[%i0\]))))]
        flags: [funsyntax]
      FUN`CHECK`RANKRULE:
        value: |-
          @@(%0 a rank rule; rankdyn_data the roll data)[
          if(u(FUN`PREDICATE`TEST,u(FUN`FORMULA`INJECT,firstof(json_query(%0,get,predicate),json(array)),%q<rankdyn_data>),%q<check_options>),
            [setq(rankdyn_stat,lcstr(u(FUN`FORMULA`INJECT,u(FUN`RULE`RANK`STAT,%0),%q<rankdyn_data>)))][
            setq(rankdyn_value,u(FUN`FORMULA`VALUE,json_query(%0,get,value),%q<rankdyn_data>,0))][
            if(cand(isint(%q<rankdyn_value>),regmatch(%q<rankdyn_stat>,^\[a-z\]\[a-z0-9-\]*$)),setq(check_upgrades,%q<check_upgrades> %q<rankdyn_stat>~%q<rankdyn_value>))])]
        flags: [funsyntax]
      # The modifiers that count, type~value~slug~force: the base entries, and each synthetic whose
      # selectors meet the domains and whose predicate holds, stacked as Foundry stacks them. With roll
      # options of its own (a weapon's), a synthetic's predicate is tested again with them too.
      FUN`CHECK`MODS:
        value: |-
          @@(%0 the base entries, %1 the domains, %2 more roll options, or nothing)[
          u(FUN`MODIFIER`STACK,%0 [
            iter(sort(setunion(iter(%1,iter(graball(%q<check_index>,%i0~*),after(%i0,~))),),n),
              if(strmatch(setr(mods_flat,if(words(%2),u(FUN`CHECK`FLAT,%i0,%q<check_options> %2),elements(%q<check_flats>,inc(%i0)))),-),,%q<mods_flat>))])]
        flags: [funsyntax]
      FUN`CHECK`TOTAL:
        value: |-
          ladd(0 [iter(%0,elements(%i0,2,~))])
        flags: [funsyntax]
      FUN`CHECK`RANK:
        value: |-
          @@(%0 a statistic or proficiency: its rank on the sheet)[
          firstof(json_query(%q<check_actor>,extract,$.skills\["%0"\].rank),0)]
        flags: [funsyntax]
      FUN`CHECK`PROFICIENCY:
        value: |-
          @@(%0 a rank: its proficiency bonus, 2 per rank plus the level, 0 untrained)[
          if(%0,add(mul(2,%0),%q<check_level>),0)]
        flags: [funsyntax]
      FUN`CHECK`ABILITY:
        value: |-
          json_query(%q<check_actor>,extract,$.abilities.%0.mod)
        flags: [funsyntax]
      # The modifiers that count on a statistic's check: its attribute modifier, its proficiency, the
      # worn armor's check penalty when it applies, and the synthetics of its domains (with more domains
      # given, such as initiative).
      FUN`CHECK`CHOSEN:
        value: |-
          @@(%0 a statistic, %1 more domains)[
          setq(chosen_attribute,u(FUN`STAT`ATTRIBUTE,%0))][
          u(FUN`CHECK`MODS,ability~[u(FUN`CHECK`ABILITY,%q<chosen_attribute>)]~%q<chosen_attribute>~0 proficiency~[u(FUN`CHECK`PROFICIENCY,u(FUN`CHECK`RANK,%0))]~proficiency~0 [u(FUN`CHECK`ARMOR`PENALTY,%0,%q<chosen_attribute>)],u(FUN`STAT`DOMAINS,%0) %1,)]
        flags: [funsyntax]
      # The worn armor's item, from the gear worn; empty without armor.
      FUN`CHECK`ARMOR:
        value: |-
          @@(check_gear the gear)[
          setq(armor_id,first(iter(%q<check_gear>,if(cand(strmatch(elements(%i0,3,~),worn),strmatch(json_query(get(u(DATA`PACK`EQUIPMENT)/ITEM`[first(%i0,~)]`PREP),extract,$.kind),armor)),first(%i0,~)))))][
          if(strlen(%q<armor_id>),u(FUN`ITEM`GET,equipment,%q<armor_id>))]
        flags: [funsyntax]
      # The armor's check penalty on a Strength- or Dexterity-based skill check, when the wearer's
      # Strength is below the armor's: flexible armor spares Acrobatics and Athletics, noisy armor
      # never spares Stealth.
      FUN`CHECK`ARMOR`PENALTY:
        value: |-
          @@(%0 a statistic, %1 its attribute)[
          if(cand(strlen(%q<check_armor>),strmatch(u(FUN`STAT`KIND,%0),skill),match(str dex,%1),lt(setr(penalty_value,firstof(json_query(%q<check_armor>,extract,$.system.checkPenalty),0)),0)),
            [setq(penalty_traits,json_query(%q<check_armor>,extract,$.system.traits.value))][
            if(cand(cor(lt(u(FUN`CHECK`ABILITY,str),firstof(json_query(%q<check_armor>,extract,$.system.strength),0)),cand(strmatch(%0,stealth),regmatch(%q<penalty_traits>,"noisy"))),not(cand(match(acrobatics athletics,%0),regmatch(%q<penalty_traits>,"flexible")))),
              untyped~%q<penalty_value>~armor-check-penalty~0)])]
        flags: [funsyntax]
      # AC: 10, Dexterity up to the armor's cap, proficiency in the armor's category, the armor's item
      # bonus with its potency rune, and the synthetics of AC's domains; %0 more base entries, such as a raised shield.
      FUN`CHECK`AC:
        value: |-
          @@(%0 more base entries)[
          setq(ac_category,if(strlen(%q<check_armor>),firstof(json_query(%q<check_armor>,extract,$.system.category),unarmored),unarmored))][
          u(FUN`CHECK`MODS,ability~[min(u(FUN`CHECK`ABILITY,dex),if(strlen(%q<check_armor>),firstof(json_query(%q<check_armor>,extract,$.system.dexCap),99),99))]~dex~0 proficiency~[u(FUN`CHECK`PROFICIENCY,u(FUN`CHECK`RANK,%q<ac_category>))]~proficiency~0 [
            if(strlen(%q<check_armor>),item~[add(firstof(json_query(%q<check_armor>,extract,$.system.acBonus),0),firstof(json_query(%q<check_armor>,extract,$.system.runes.potency),0))]~[json_query(%q<check_armor>,extract,$.system.slug)]~0)] %0,ac all dex-based,)]
        flags: [funsyntax]
      # The key attribute: the one chosen for the class, else the class's only one.
      FUN`CHECK`KEY:
        value: |-
          @@(check_class the class grant)[
          if(strlen(%q<check_class>),firstof(json_query(u(FUN`CHECK`CHOICES,elements(%q<check_class>,3,~)),extract,$.keyAbility),json_query(u(FUN`ITEM`GET,classes,elements(%q<check_class>,2,~)),extract,$.system.keyAbility.value\[0\])))]
        flags: [funsyntax]
      FUN`CHECK`CLASSDC:
        value: |-
          @@(the class DC's modifiers; 10 plus their total is the DC)[
          setq(classdc_key,firstof(u(FUN`CHECK`KEY),str))][
          u(FUN`CHECK`MODS,ability~[u(FUN`CHECK`ABILITY,%q<classdc_key>)]~%q<classdc_key>~0 proficiency~[u(FUN`CHECK`PROFICIENCY,u(FUN`CHECK`RANK,classdc))]~proficiency~0,class class-dc all %q<classdc_key>-based,)]
        flags: [funsyntax]
      # Spell attack modifiers (%0 attack) or spell DC modifiers (%0 dc, 10 plus their total), from the key attribute and the spellcasting proficiency.
      FUN`CHECK`SPELL:
        value: |-
          @@(%0 attack or dc)[
          setq(spell_key,firstof(u(FUN`CHECK`KEY),cha))][
          u(FUN`CHECK`MODS,ability~[u(FUN`CHECK`ABILITY,%q<spell_key>)]~%q<spell_key>~0 proficiency~[u(FUN`CHECK`PROFICIENCY,u(FUN`CHECK`RANK,spellcasting))]~proficiency~0,if(strmatch(%0,attack),spell-attack spell-attack-roll attack attack-roll all check %q<spell_key>-based,spell-dc all %q<spell_key>-based),)]
        flags: [funsyntax]
      # Hit points: the ancestry's, the class's plus Constitution for each level, and the hp and
      # hp-per-level synthetics.
      FUN`CHECK`HP:
        value: |-
          @@(the maximum hit points)[
          add(firstof(json_query(u(FUN`CHECK`ITEM,%q<check_ancestry>),extract,$.system.hp),0),
            mul(add(firstof(json_query(u(FUN`CHECK`ITEM,%q<check_class>),extract,$.system.hp),0),u(FUN`CHECK`ABILITY,con)),%q<check_level>),
            u(FUN`CHECK`TOTAL,u(FUN`CHECK`MODS,,hp,)),
            mul(%q<check_level>,u(FUN`CHECK`TOTAL,u(FUN`CHECK`MODS,,hp-per-level,))))]
        flags: [funsyntax]
      FUN`CHECK`ITEM:
        value: |-
          @@(%0 pack~id~index, or nothing: the item)[
          if(strlen(%0),u(FUN`ITEM`GET,first(%0,~),elements(%0,2,~)))]
        flags: [funsyntax]
      # Land Speed: the ancestry's, the speed synthetics, and the armor's Speed penalty, 5 feet less when the wearer's Strength meets the armor's.
      FUN`CHECK`SPEED:
        value: |-
          @@(the land Speed in feet)[
          setq(speed_penalty,if(strlen(%q<check_armor>),firstof(json_query(%q<check_armor>,extract,$.system.speedPenalty),0),0))][
          if(cand(lt(%q<speed_penalty>,0),gte(u(FUN`CHECK`ABILITY,str),firstof(json_query(%q<check_armor>,extract,$.system.strength),99))),setq(speed_penalty,min(0,add(%q<speed_penalty>,5))))][
          add(firstof(json_query(u(FUN`CHECK`ITEM,%q<check_ancestry>),extract,$.system.speed),25),%q<speed_penalty>,u(FUN`CHECK`TOTAL,u(FUN`CHECK`MODS,,land-speed all-speeds speed,)))]
        flags: [funsyntax]
