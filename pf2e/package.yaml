        value: |-
          think u({{core}}/FUN`CHECK`PREPARE,%q<sheet_ledger>); think setq(check_daily,u(%!/FUN`DAILY`OF,%q<sheet_target>)); think setq(sheet_cold,if(lt(%q<sheet_round>,3),u({{core}}/FUN`SHEET`COLD))); @break not(words(%q<sheet_cold>))=@pemit %#=u(%!/FUN`SHOW`SHEET); think setq(sheet_round,inc(%q<sheet_round>)); @dolist/then %q<sheet_cold>={think u({{core}}/FUN`CHECK`PREPARE,%q<sheet_ledger>); think u({{core}}/FUN`SHEET`WARM,##)},{@include %!/INC`SHEET`SHOW}
        flags: [cmdsyntax]
      CMD`CHECK:
        value: |-
          $(?is)^\+check +([^=]+?)(?\: *= *(.*))?$:think setqm(cmd_target,,cmd_stat,trim(%1),cmd_dc,trim(%2)); @include %!/INC`TARGET`VIEW; @include %!/INC`CHECK`ROLL
        flags: [regexp, cmdsyntax]
      CMD`PF2E:
