        flags: [funsyntax]
      # Sets the core's check_ registers for combatant %0, and act_npc to its item when a creature.
      FUN`ENC`PREPARE:
        value: |-
          @@(%0 a combatant's index)[
          setq(act_npc,if(strmatch(u(FUN`ENC`C,%0,kind),npc),u(FUN`ENC`ITEM,%0)))][
          setq(act_adj,if(strlen(%q<act_npc>),firstof(u(FUN`ENC`C,%0,adj),0),0))][
          setq(act_raised,t(u(FUN`ENC`C,%0,raised)))][
          setq(check_daily,firstof(u(FUN`ENC`C,%0,daily),json(object)))][
          u({{core}}/FUN`CHECK`PREPARE,u(FUN`ENC`LEDGER,%0))][
          setq(check_who,%0)]
        flags: [funsyntax]

      # --- Checks and Strikes, after FUN`ENC`PREPARE ----------------------------------------------
      FUN`ACT: Checks and Strikes for the combatant prepared.
      # A statistic's modifiers: a character's from the sheet, a creature's from its statistics,
      # both with the conditions' modifiers.
      FUN`ACT`STAT:
        value: |-
          @@(%0 a statistic, %1 more domains, %2 more roll options)[
          if(strlen(%q<act_npc>),
            u({{core}}/FUN`CHECK`MODS,untyped~[u(FUN`ACT`NPC`BASE,%0)]~base~0,u({{core}}/FUN`STAT`DOMAINS,%0) %1,%2),
            u({{core}}/FUN`CHECK`CHOSEN,%0,%1,%2))]
        flags: [funsyntax]
      FUN`ACT`NPC`BASE:
        value: |-
          @@(%0 a statistic: the creature's or hazard's modifier as its statistics give it, adjusted for elite or weak)[
          add(%q<act_adj>,switch(u({{core}}/FUN`STAT`KIND,%0),
            perception, firstof(json_query(%q<act_npc>,extract,$.system.perception.mod),0),
            save, firstof(json_query(%q<act_npc>,extract,$.system.saves.%0.value),0),
            firstof(json_query(%q<act_npc>,extract,$.system.skills.%0.base),if(strmatch(%0,stealth),json_query(%q<act_npc>,extract,$.system.attributes.stealth.value)),json_query(%q<act_npc>,extract,$.system.abilities.[u({{core}}/FUN`STAT`ATTRIBUTE,%0)].mod),0)))]
        flags: [funsyntax]
      FUN`ACT`AC:
        value: |-
          @@(the AC, with its modifiers: a character's raised shield adds its circumstance bonus)[
          add(10,u({{core}}/FUN`CHECK`TOTAL,
            if(strlen(%q<act_npc>),
              u({{core}}/FUN`CHECK`MODS,untyped~[add(%q<act_adj>,sub(firstof(json_query(%q<act_npc>,extract,$.system.attributes.ac.value),10),10))]~base~0,ac all dex-based,),
              u({{core}}/FUN`CHECK`AC,if(cand(%q<act_raised>,strlen(%q<check_shield>)),circumstance~[firstof(json_query(%q<check_shield>,extract,$.system.acBonus),0)]~raised-shield~0)))))]
        flags: [funsyntax]
      # The Strikes: name|attack|damage|traits|MAP step|use~use id|left|||source for each, separated by ^: the source
      # the Strike's JSON for a character, npc:<attribute> for a creature's melee item. The damage is a hit's, as text.
      # %0 a name pattern: only the first Strike whose name matches it, all of them when empty.
      FUN`ACT`STRIKES:
        value: |-
          @@(the prepared combatant's Strikes, %0 a name pattern or nothing)[
          if(strlen(%q<act_npc>),
            iter(u(FUN`ACT`NPC`PICK,%0),u(FUN`ACT`NPC`STRIKE,%i0),%b,^),
            iter(u(FUN`ACT`PC`PICK,%0),u(FUN`ACT`PC`STRIKE,%i0),|,^))]
        flags: [funsyntax]
      FUN`ACT`STRIKE`NAMES:
        value: |-
          @@(the prepared combatant's Strike names, separated by |)[
          if(strlen(%q<act_npc>),
            iter(u(FUN`ACT`NPC`MELEE),json_query(get(%q<npc_store>/%i0),extract,$.name),%b,|),
            iter(u({{core}}/FUN`CHECK`STRIKES),json_query(%i0,extract,$.name),|,|))]
        flags: [funsyntax]
      FUN`ACT`PC`PICK:
        value: |-
          @@(%0 a name pattern or nothing)[
          setq(pick_all,u({{core}}/FUN`CHECK`STRIKES))][
          if(strlen(%0),first(squish(iter(%q<pick_all>,if(strmatch(json_query(%i0,extract,$.name),%0),%i0),|,|),|),|),%q<pick_all>)]
        flags: [funsyntax]
      FUN`ACT`NPC`PICK:
        value: |-
          @@(%0 a name pattern or nothing)[
          setq(pick_all,u(FUN`ACT`NPC`MELEE))][
          if(strlen(%0),first(iter(%q<pick_all>,if(strmatch(json_query(get(%q<npc_store>/%i0),extract,$.name),%0),%i0))),%q<pick_all>)]
        flags: [funsyntax]
      FUN`ACT`PC`STRIKE:
        value: |-
          @@(%0 a Strike from the core)[
          setq(strike_attack,u({{core}}/FUN`CHECK`TOTAL,u({{core}}/FUN`STRIKE`ATTACK,%0)))][
          u({{core}}/FUN`DAMAGE`STRIKE,%0,)][u({{core}}/FUN`DAMAGE`FORMULA,2)][
          json_query(%0,extract,$.name)]|%q<strike_attack>|[u({{core}}/FUN`DAMAGE`TEXT)]|%q<strike_traits>|[u({{core}}/FUN`CHECK`MAP)]|[json_query(%0,extract,$.use)]~[json_query(%0,extract,$.useid)]|[json_query(%0,extract,$.left)]|||%0
        flags: [funsyntax]
      FUN`ACT`NPC`MELEE:
        value: |-
          @@(the creature's melee items, the Strikes in Foundry's creature data)[
          setq(npc_store,u({{core}}/DATA`PACK`[ucstr(json_query(%q<enc>,extract,$.c\[%q<act_at>\].pack))]))][
          iter(lattr(%q<npc_store>/ITEM`[ucstr(json_query(%q<act_npc>,extract,$._id))]`EMBED`*),if(strmatch(json_query(get(%q<npc_store>/%i0),extract,$.type),melee),%i0))]
        flags: [funsyntax]
      FUN`ACT`NPC`STRIKE:
        value: |-
          @@(%0 a melee item's attribute)[
          setq(strike_item,get(%q<npc_store>/%0))][
          setq(strike_traits,json_map({{core}}/FUN`RULE`SELECTOR,firstof(json_query(%q<strike_item>,extract,$.system.traits.value),json(array)),%b))][
          setq(strike_ranged,regmatch(%q<strike_traits>,\\brange))][
          setq(strike_attack,u({{core}}/FUN`CHECK`TOTAL,u({{core}}/FUN`CHECK`MODS,untyped~[add(%q<act_adj>,firstof(json_query(%q<strike_item>,extract,$.system.bonus.value),0))]~base~0,attack attack-roll strike-attack-roll all check [if(%q<strike_ranged>,ranged,melee)]-strike-attack-roll,)))][
          u({{core}}/FUN`DAMAGE`NPC,%q<strike_item>,,%q<act_adj>)][u({{core}}/FUN`DAMAGE`FORMULA,2)][
          json_query(%q<strike_item>,extract,$.name)]|%q<strike_attack>|[u({{core}}/FUN`DAMAGE`TEXT)]|%q<strike_traits>|[if(member(%q<strike_traits>,agile),4,5)]|||||npc:%0
        flags: [funsyntax]
      # A d20 check of total %0 against DC %1: sets roll_record, roll_face, roll_result and roll_degree (0 to 3, empty without a DC).
      FUN`ACT`ROLL:
        value: |-
          @@(%0 the modifier, %1 a DC or nothing, %2 the attack's domains, a Strike's when nothing, %3 more roll options, such as the target's)[
          setq(act_domains,firstof(%2,attack attack-roll strike-attack-roll check all))][
          setq(act_options,squish(%q<check_options> [u({{core}}/FUN`ROLLOPTION`DOMAINS,%q<act_domains>)] check:type:attack-roll %3))][
          u({{core}}/FUN`ROLL`PLAN,%q<act_domains>,%q<act_options>,)][
          u({{core}}/FUN`ROLL`CHECK,%0,%q<act_domains>,%q<act_options> %q<roll_extra>,%1)]
        flags: [funsyntax]
      # A statistic's check for a combatant: its RollTwice, required substitution, degree adjustments
      # and notes as +check has them, the d20's fortune or misfortune among the options its modifiers
      # are worked out with.
      FUN`ACT`CHECK:
        value: |-
          @@(%0 a statistic, %1 a DC or nothing, %2 a number to add, %3 1 for initiative: sets the core's roll_ registers)[
          setq(act_domains,squish(u({{core}}/FUN`STAT`DOMAINS,%0) [if(%3,initiative)]))][
          setq(act_options,u({{core}}/FUN`ROLL`OPTIONS,%0,%3))][
          u({{core}}/FUN`ROLL`PLAN,%q<act_domains>,%q<act_options>,)][
          u({{core}}/FUN`ROLL`CHECK,add(u({{core}}/FUN`CHECK`TOTAL,u(FUN`ACT`STAT,%0,if(%3,initiative),%q<act_options> %q<roll_extra>)),firstof(%2,0)),%q<act_domains>,%q<act_options> %q<roll_extra>,%1)]
        flags: [funsyntax]
      # An attack is rolled with the attacker's rules after the target is prepared for its AC: HOLD keeps
      # the registers a roll and its damage read (every check_ register and these) under a name, TAKE puts them back.
      DATA`ACT`HOLD: act_npc act_adj act_raised npc_store
      FUN`ACT`HOLD:
        value: |-
          @@(%0 a name)[
          setq(hold_%0__names,setunion(lcstr(listq(check_*)) [v(DATA`ACT`HOLD)],))][
          null(iter(r(hold_%0__names),setq(hold_%0_%i0,r(%i0))))]
        flags: [funsyntax]
      FUN`ACT`TAKE:
        value: |-
          @@(%0 a name)[
          null(iter(r(hold_%0__names),setq(%i0,r(hold_%0_%i0))))]
        flags: [funsyntax]
      # After a roll: its fortune, misfortune or substitution, and the rule that changed its degree.
      FUN`ACT`TAGS:
        value: |-
          [if(strlen(%q<roll_tags>),%b%([itemize(%q<roll_tags>,|)]%))]
        flags: [funsyntax]
      FUN`ACT`ADJUSTED:
        value: |-
          [if(strlen(%q<roll_adjust>),%b%([u({{core}}/FUN`ROLLRULE`LABEL,rest(%q<roll_adjust>,~))]%, [lcstr(u(FUN`ACT`DEGREE,%q<roll_unadjusted>))] rolled%))]
        flags: [funsyntax]
      FUN`ACT`NOTES:
        value: |-
          u({{commands}}/FUN`SHOW`NOTES,%q<roll_notes>)
        flags: [funsyntax]
      FUN`ACT`DEGREE:
        value: |-
          extract(Critical failure|Failure|Success|Critical success,inc(%0),1,|)
        flags: [funsyntax]
      # Damage, %0 a formula such as 1d6+3 slashing, 1d4 fire; %1 1 on a critical hit, doubled. Sets
      # dmg_total, dmg_text and dmg_parts (type~amount~main for each).
      FUN`ACT`DAMAGE:
        value: |-
          @@(%0 damage parts separated by commas, %1 1 to double)[
          setqm(dmg_total,0,dmg_text,,dmg_parts,)][
          null(iter(%0,
            [setq(dmg_part,trim(%i0))][
            setq(dmg_record,roll(if(%1,2*%([first(%q<dmg_part>)]%),first(%q<dmg_part>)),,record))][
            setq(dmg_part_total,max(if(eq(inum(0),1),1,0),json_query(%q<dmg_record>,extract,$.total)))][
            setq(dmg_total,add(%q<dmg_total>,%q<dmg_part_total>))][
            setq(dmg_parts,[if(strlen(%q<dmg_parts>),%q<dmg_parts>|)][firstof(lcstr(last(rest(%q<dmg_part>))),untyped)]~%q<dmg_part_total>~main)][
            setq(dmg_text,[if(strlen(%q<dmg_text>),%q<dmg_text>%,%b)][json_query(%q<dmg_record>,extract,$.text)] [rest(%q<dmg_part>)])],
            %,))][
          setq(dmg_raw,%q<dmg_total>)]
        flags: [funsyntax]
      # Damage against a creature or hazard: immunities, the highest resistance that fits each type, the highest
      # weakness that fits any type once, then a hazard's hardness, as Pathfinder applies them.
      FUN`ACT`IWR:
        value: |-
          @@(%0 the target's index, using dmg_parts, type~amount~kind each: sets dmg_total and dmg_iwr, what changed it, and turns regeneration off for a turn when a type deactivates it)[
          setqm(iwr_item,if(strmatch(u(FUN`ENC`C,%0,kind),npc),u(FUN`ENC`ITEM,%0)),dmg_iwr,,iwr_weak,0,iwr_weak_type,)][
          u(FUN`ACT`IWR`RULES,%0)][
          if(cor(strlen(%q<iwr_item>),words(%q<iwr_rw> %q<iwr_rr> %q<iwr_ri>)),
            [setqm(iwr_w,squish([u(FUN`ACT`IWR`LIST,json_query(%q<iwr_item>,extract,$.system.attributes.weaknesses))] %q<iwr_rw>),iwr_r,squish([u(FUN`ACT`IWR`LIST,json_query(%q<iwr_item>,extract,$.system.attributes.resistances))] %q<iwr_rr>),iwr_i,squish([u(FUN`ACT`IWR`LIST,json_query(%q<iwr_item>,extract,$.system.attributes.immunities))] %q<iwr_ri>))][
            setq(iwr_keys,setunion(iter(%q<dmg_parts>,[first(%i0,~)]~[if(strmatch(elements(%i0,3,~),persistent),persistent)],|,%b),))][
            setq(dmg_total,ladd(0 [iter(%q<iwr_keys>,[setq(iwr_k,%i0)][u(FUN`ACT`IWR`PART,first(%i0,~),u(FUN`ACT`IWR`SUM,%q<iwr_k>,*),u(FUN`ACT`IWR`SUM,%q<iwr_k>,precision))])]))][
            if(%q<iwr_weak>,[setq(dmg_total,add(%q<dmg_total>,%q<iwr_weak>))][setq(dmg_iwr,%q<dmg_iwr>|weakness to [edit(%q<iwr_weak_type>,-,%b)] +%q<iwr_weak>)])][
            if(gt(setr(iwr_hard,firstof(json_query(%q<iwr_item>,extract,$.system.attributes.hardness),0)),0),[setq(dmg_total,max(0,sub(%q<dmg_total>,%q<iwr_hard>)))][setq(dmg_iwr,%q<dmg_iwr>|hardness %q<iwr_hard>)])][
            setq(iwr_off,edit(edit(before(after(lcstr(json_query(%q<iwr_item>,extract,$.system.attributes.hp.details)),deactivated by%b),%)),cold iron,cold-iron),%bor%b,%b))][
            if(words(iter(%q<dmg_parts>,if(cand(member(%q<iwr_off>,first(%i0,~)),gt(elements(%i0,2,~),0)),x),|)),u(FUN`ENC`SET,%0,regoff,1))][
            setq(dmg_iwr,trim(%q<dmg_iwr>,|,l))])]
        flags: [funsyntax]
      # The target's own Weakness, Resistance and Immunity rules, from its sheet and effects: iwr_rw, iwr_rr and
      # iwr_ri. The target is prepared for them when it is not already, and the registers put back after.
      FUN`ACT`IWR`RULES:
        value: |-
          @@(%0 the target's index)[
          if(strmatch(%q<check_who>,%0),
            u(FUN`ACT`IWR`READ),
            [u(FUN`ACT`HOLD,iwr)][u(FUN`ENC`PREPARE,%0)][u(FUN`ACT`IWR`READ)][u(FUN`ACT`TAKE,iwr)])]
        flags: [funsyntax]
      FUN`ACT`IWR`READ:
        value: |-
          setqm(iwr_rw,u({{core}}/FUN`CHECK`IWR,Weakness),iwr_rr,u({{core}}/FUN`CHECK`IWR,Resistance),iwr_ri,u({{core}}/FUN`CHECK`IWR,Immunity))
        flags: [funsyntax]
      FUN`ACT`IWR`LIST:
        value: |-
          @@(%0 a JSON list of {type, value}: type~value for each, separated by spaces)[
          if(strlen(%0),json_map(%!/FUN`ACT`IWR`ONE,%0,%b))]
        flags: [funsyntax]
      FUN`ACT`IWR`ONE:
        value: |-
          [json_query(%1,extract,$.type)]~[json_query(%1,extract,$.value)]
        flags: [funsyntax]
      FUN`ACT`IWR`FITS:
        value: |-
          @@(%0 a weakness, resistance or immunity type, %1 a damage type)[
          cor(strmatch(%0,%1),strmatch(%0,all-damage),cand(strmatch(%0,physical),member(bludgeoning piercing slashing,%1)))]
        flags: [funsyntax]
      # The damage of one key of FUN`ACT`IWR, type~ or type~persistent, of a kind (* for all of them).
      FUN`ACT`IWR`SUM:
        value: |-
          @@(%0 a key, %1 a kind pattern)[
          ladd(0 [iter(%q<dmg_parts>,if(cand(strmatch([first(%i0,~)]~[if(strmatch(elements(%i0,3,~),persistent),persistent)],%0),strmatch(elements(%i0,3,~),%1)),elements(%i0,2,~)),|,%b)])]
        flags: [funsyntax]
      # One damage type's instance, as Foundry's applyIWR takes it: an immunity to the type takes it all; an
      # immunity or resistance to precision takes from its precision damage; the highest resistance that fits
      # the type takes from the rest once.
      FUN`ACT`IWR`PART:
        value: |-
          @@(%0 a damage type, %1 its amount, %2 the precision damage in it: the amount taken, noting the weakness that fits best)[
          if(words(iter(%q<iwr_i>,if(u(FUN`ACT`IWR`FITS,first(%i0,~),%0),x))),
            [setq(dmg_iwr,%q<dmg_iwr>|immunity to [edit(%0,-,%b)])]0,
            [setq(iwr_amt,%1)][
            if(gt(%2,0),
              if(member(iter(%q<iwr_i>,first(%i0,~)),precision),
                [setq(iwr_amt,sub(%q<iwr_amt>,%2))][setq(dmg_iwr,%q<dmg_iwr>|immunity to precision)],
                if(setr(iwr_pv,lmax(0 [iter(%q<iwr_r>,if(strmatch(first(%i0,~),precision),rest(%i0,~)))])),
                  [setq(dmg_iwr,%q<dmg_iwr>|resistance to precision -[min(%2,%q<iwr_pv>)])][setq(iwr_amt,sub(%q<iwr_amt>,min(%2,%q<iwr_pv>)))])))][
            setq(iwr_rv,lmax(0 [iter(%q<iwr_r>,if(u(FUN`ACT`IWR`FITS,first(%i0,~),%0),rest(%i0,~)))]))][
            setq(iwr_wv,lmax(0 [iter(%q<iwr_w>,if(u(FUN`ACT`IWR`FITS,first(%i0,~),%0),rest(%i0,~)))]))][
            if(cand(gt(%q<iwr_amt>,0),gt(%q<iwr_wv>,%q<iwr_weak>)),setqm(iwr_weak,%q<iwr_wv>,iwr_weak_type,%0))][
            if(cand(%q<iwr_rv>,gt(%q<iwr_amt>,0)),setq(dmg_iwr,%q<dmg_iwr>|resistance to [edit(%0,-,%b)] -[min(%q<iwr_amt>,%q<iwr_rv>)]))][
            max(0,sub(%q<iwr_amt>,%q<iwr_rv>))])]
        flags: [funsyntax]
      FUN`ACT`IWR`TEXT:
        value: |-
          @@(after FUN`ACT`IWR: what changed the damage, and the damage taken)[
          if(strlen(%q<dmg_iwr>),%, with [itemize(%q<dmg_iwr>,|)]: %q<dmg_total>)]
        flags: [funsyntax]
      FUN`ACT`IMMUNE:
        value: |-
          @@(%0 a combatant's index, %1 an immunity such as critical-hits: 1 when a creature or hazard has it)[
          if(strmatch(u(FUN`ENC`C,%0,kind),npc),t(member(json_map(%!/FUN`ACT`IMMUNE`TYPE,firstof(json_query(u(FUN`ENC`ITEM,%0),extract,$.system.attributes.immunities),json(array)),%b),%1)),0)]
        flags: [funsyntax]
      FUN`ACT`IMMUNE`TYPE:
        value: |-
          json_query(%1,extract,$.type)
        flags: [funsyntax]
      # Harm combatant %0 by %1: temporary hit points first; a character at 0 is dying (2 on a critical
      # hit, %2), a creature at 0 is down. Sets enc and harm_text.
      FUN`ACT`HARM:
        value: |-
          @@(%0 a combatant's index, %1 damage, %2 1 when a critical hit)[
          if(not(u(FUN`ENC`C,%0,max)),setq(harm_text,[u(FUN`ENC`C,%0,name)] has no Hit Points to lose),[
          setqm(harm_temp,u(FUN`ENC`C,%0,temp),harm_hp,u(FUN`ENC`C,%0,hp),harm_dying,)][
          setq(harm_left,max(0,sub(%1,%q<harm_temp>)))][
          u(FUN`ENC`SET,%0,temp,max(0,sub(%q<harm_temp>,%1)))][
          u(FUN`ENC`SET,%0,hp,max(0,sub(%q<harm_hp>,%q<harm_left>)))][
          setq(harm_text,[u(FUN`ENC`C,%0,name)] takes %1 damage)][
          if(cand(gt(%q<harm_hp>,0),lte(sub(%q<harm_hp>,%q<harm_left>),0)),
            if(strmatch(u(FUN`ENC`C,%0,kind),pc),
              [setq(harm_dying,add(if(%2,2,1),firstof(json_query(u(FUN`ENC`C,%0,conds),extract,$.wounded),0)))][
              u(FUN`ENC`PATCH,%0,json(object,conds,json(object,dying,%q<harm_dying>,unconscious,0,prone,0)))][
              setq(harm_text,%q<harm_text> and falls%, dying %q<harm_dying>)],
              [u(FUN`ENC`SET,%0,down,1)][
              setq(harm_text,%q<harm_text> and is down)]),
            if(cand(eq(%q<harm_hp>,0),gt(%q<harm_left>,0),isnum(setr(harm_was,json_query(u(FUN`ENC`C,%0,conds),extract,$.dying)))),
              [setq(harm_dying,min(4,add(%q<harm_was>,if(%2,2,1))))][
              u(FUN`ENC`PATCH,%0,json(object,conds,json(object,dying,%q<harm_dying>)))][
              setq(harm_text,%q<harm_text>%, dying %q<harm_dying>)]))][
          if(gte(firstof(%q<harm_dying>,0),4),[u(FUN`ENC`SET,%0,down,1)][setq(harm_text,%q<harm_text>. [u(FUN`ENC`C,%0,name)] dies)])])]
        flags: [funsyntax]
      FUN`ACT`HEAL:
        value: |-
          @@(%0 a combatant's index, %1 hit points: sets enc and heal_text)[
          setq(heal_was,u(FUN`ENC`C,%0,hp))][
          u(FUN`ENC`SET,%0,hp,min(u(FUN`ENC`C,%0,max),add(%q<heal_was>,%1)))][
          u(FUN`ENC`SET,%0,down,0)][
          setq(heal_text,[u(FUN`ENC`C,%0,name)] regains [sub(u(FUN`ENC`C,%0,hp),%q<heal_was>)] Hit Points)][
          if(cand(eq(%q<heal_was>,0),strlen(json_query(u(FUN`ENC`C,%0,conds),extract,$.dying))),
            [u(FUN`ENC`PATCH,%0,json(object,conds,json(object,dying,null,unconscious,null,wounded,inc(firstof(json_query(u(FUN`ENC`C,%0,conds),extract,$.wounded),0)))))][
            setq(heal_text,%q<heal_text>%, wakes up and is wounded [json_query(u(FUN`ENC`C,%0,conds),extract,$.wounded)])])]
        flags: [funsyntax]
      FUN`ACT`SAVE:
        value: |-
          @@(%0 a combatant's index, with save_stat, save_dc and save_parts: their save and the damage they take, as a line)[
          u(FUN`ENC`PREPARE,%0)][
          u(FUN`ACT`CHECK,%q<save_stat>,%q<save_dc>)][
          setq(save_line,[u(FUN`ENC`C,%0,name)]: [json_query(%q<roll_record>,extract,$.text)][u(FUN`ACT`TAGS)]%, [lcstr(u(FUN`ACT`DEGREE,%q<roll_degree>))][u(FUN`ACT`ADJUSTED)])][
          if(strlen(%q<save_parts>),
            if(eq(%q<roll_degree>,3),
              setq(save_line,%q<save_line>%, no damage),
              [setq(dmg_parts,iter(%q<save_parts>,[first(%i0,~)]~[switch(%q<roll_degree>,2,div(elements(%i0,2,~),2),0,mul(elements(%i0,2,~),2),elements(%i0,2,~))]~[elements(%i0,3,~)],|,|))][
              setq(dmg_raw,ladd(0 [iter(%q<dmg_parts>,elements(%i0,2,~),|,%b)]))][
              setq(dmg_total,%q<dmg_raw>)][
              u(FUN`ACT`IWR,%0)][
