format: "1.16"
package: fate-action-science-help
title: "Fate action science: +help topics"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the action science topics (modes, mega-stunts, machines, inventions, brainstorms) into +help: registers the fate-action-science package's help with the +help librarian, and points its messages at +help."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, fate, help, bridge]
category: Characters
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. fate-action-science keeps its topics on its
# own help object, and plus-help reads any object registered with its librarian. This package is that
# registration, and the line that points its messages at +help; uninstalling it takes the topics out of +help,
# and neither package changes.
depends:
  - package: fate-action-science
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH.Packages
      path: fate-action-science/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`FATE-ACTION-SCIENCE: |-
        {{fate-action-science/science_help}}

  # Lines the command object's messages end with when +help is here, through its FUN`HINT: HINT`<message>.
  - ref: message_hints
    target: "{{fate-action-science/science}}"
    attributes:
      HINT`SWITCHES: |-
        +help %0 lists them.
