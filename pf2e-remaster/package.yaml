format: 1.4
package: pf2e-remaster
version: 1.1.1
authors: [SharpMUSH project]
description: >-
  Rules reference for Pathfinder Second Edition (Remaster), as wiki pages: the classes,
  ancestries, heritages, backgrounds, feats, spells, actions, equipment and familiar
  abilities of Player Core, Player Core 2 and GM Core, every skill, a character sheet
  overview, conditions, DC tables and rules overviews. Uses material under the ORC
  License. Not published, endorsed or approved by Paizo.
license: LicenseRef-ORC
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages/tree/main/pf2e-remaster
keywords: [pathfinder, pf2e, rules, character-creation, wiki]
locale: en

