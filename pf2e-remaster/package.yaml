format: 1.4
package: pf2e-remaster
version: 1.0.0
authors: [SharpMUSH project]
description: >-
  Rules reference for Pathfinder Second Edition (Remaster): every condition and the
  GM's difficulty class tables, as wiki pages. Uses material under the ORC License.
  Not published, endorsed or approved by Paizo.
license: LicenseRef-ORC
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages/tree/main/pf2e-remaster
keywords: [pathfinder, pf2e, rules, conditions, wiki]
locale: en

