format: "1.16"
package: fate-system-toolkit-help
title: "Fate System Toolkit: +help topics"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the Fate System Toolkit topics (conditions, treatment, Wealth, Stormcallers and their rolls, settings and credits) into +help: registers the fate-system-toolkit package's help with the +help librarian, and points its messages at +help."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, fate, help, bridge]
category: Characters
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. fate-system-toolkit keeps its topics on
# its own help object, and plus-help reads any object registered with its librarian. This package is that
# registration, and the lines that point its messages at +help; uninstalling it takes the topics out of +help,
# and neither package changes.
depends:
  - package: fate-system-toolkit
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH.Packages
      path: fate-system-toolkit/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`FATE-SYSTEM-TOOLKIT: |-
        {{fate-system-toolkit/toolkit_help}}

  # Lines the command object's messages end with when +help is here, through its FUN`HINT: HINT`<message>.
  - ref: message_hints
    target: "{{fate-system-toolkit/toolkit}}"
    attributes:
      HINT`SWITCHES: |-
        +help %0 lists them.
      HINT`STORM: |-
        +help storm rolls has more.
