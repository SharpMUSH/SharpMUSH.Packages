format: "1.20"
package: atomic-robo-help
title: "Atomic Robo: +help topics"
version: 1.0.2
authors: [SharpMUSH]
description: "Puts the Atomic Robo topics (modes, mega-stunts, machines, inventions, brainstorms) into +help: registers the atomic-robo package's help with the +help librarian, and points its messages at +help."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [sheet, fate, help, bridge]
category: Game System
subcategory: Fate
bridge: true
requires_server: ">=1.0"
verified_server: "1.0"

# A bridge: it joins two packages that do not know about each other. atomic-robo keeps its topics on its
# own help object, and plus-help reads any object registered with its librarian. This package is that
# registration, and the line that points its messages at +help; uninstalling it takes the topics out of +help,
# and neither package changes.
depends:
  - package: atomic-robo
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH.Packages
      path: atomic-robo/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`ATOMIC-ROBO: |-
        {{atomic-robo/science_help}}

  # Lines the command object's messages end with when +help is here, through its FUN`HINT: HINT`<message>.
  - ref: message_hints
    target: "{{atomic-robo/science}}"
    attributes:
      HINT`SWITCHES: |-
        +help %0 lists them.
