format: "1.16"
package: scene-verse
title: "Scene verse and canon"
version: 2.0.0
authors: [SharpMUSH]
description: "Verse and canon on scenes: two scene details for +scene/set, and +scene/verses."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH.Packages
keywords: [scene, verse, canon, rp]
category: Scenes
requires_server: ">=1.0"
verified_server: "1.0"

# The details and +scene/verses call the Scene plugin's scene functions, so it installs only while the
# plugin runs.
plugins: [scene]

# The scene package keeps any detail a scene's owner sets; this one names two and shows them. Everything
# here is attached to the scene package's objects, so uninstalling it takes it all away again. Scenes keep
# the values they were given, and they then show under their keys.
depends:
  - package: scene
    version: ">=1.6"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/scene/
      branch: main

objects:
  - ref: verse
    target: "{{scene/logger}}"
    attributes:
      # The details, read by the Scene plugin (+help scene details): the verse follows a scene's title in +scene
      # lists and shows on the portal's scene cards; canon takes several values, split by |.
      DETAIL`VERSE: |-
        {"label":"Verse","hint":"The setting or universe the scene takes place in.","listed":true,"order":10}
      DETAIL`CANON: |-
        {"label":"Canon","hint":"The source works the scene draws on. Split several with |.","many":true,"order":20}

      # +scene/verses: the verses of the scenes running now, and how many scenes each has.
      # The verses of scenes %0, split by |, once each.
      FUN`VERSE`ALL: |-
        setunion(squish(iter(%0,scene(%i0,verse),,|),|),,|)
      # How many of scenes %0 are set in verse %1, ignoring case.
      FUN`VERSE`COUNT: |-
        words(iter(%0,if(not(comp(lcstr(scene(%i0,verse)),lcstr(%1))),x)))
      FUN`VERSE`TABLE: |-
        box(datacolumns(u(%!/FUN`TABLE`OPTS,2,|,1|2,1|),tone(strong,Verse)%r[iter(%1,%i0,|,%r)],>[tone(strong,Scenes)]%r[iter(%1,u(%!/FUN`VERSE`COUNT,%0,%i0),|,%r)]),Verses played now,,u(%!/FUN`FRAME))
      CMD`VERSES:
        value: |-
          $(?is)^\+scene/verses$: think setq(active_scenes,scenelist(active))[setq(verses,u(%!/FUN`VERSE`ALL,%q<active_scenes>))]; @assert words(%q<verses>,|)=@pemit %#=notice(SCENE,No scene running now has a verse. +scene/set verse=<verse> gives yours one.); @pemit %#=u(%!/FUN`VERSE`TABLE,%q<active_scenes>,%q<verses>)%r+scene/list verse=<verse> lists a verse's scenes.
        flags: [REGEXP]

  # +help scene verse, a subtopic of +help scene. Bodies are evaluated, so brackets, parentheses and percent
  # signs are escaped.
  - ref: verse_help
    target: "{{scene/scene_help}}"
    attributes:
      SEE`SCENE`VERSE: |-
        scene details
      HELP`SCENE`VERSE: |-
        A scene can say which **verse** it is set in, and which **canon** it draws on.

        - `+scene/set verse=<verse>` — the setting or universe it takes place in
        - `+scene/set canon=<work>|<work>` — the source works it draws on
        - `+scene/verses` — the verses of the scenes running now, and how many each has
        - `+scene/list verse=<verse>` — the scenes running now in one verse; `+scene/old verse=<verse>` the finished ones

        For example:

        `+scene/set verse=Marvel`

        Output: `\[SCENE\] Done: Scene 1: Verse is now Marvel.`

        The verse follows the scene's title in `+scene`, and both show on its card and at the top of its log. See `+help scene details` for the rest.
